</style></head><body><main><section class="hero"><h1>三民普高 B3U10｜篇章結構</h1><p class="muted">原題互動練習｜20 題｜即時批改｜錯誤重填｜答對後整句播放＋選做 STT｜錯題 DOCX｜成績登錄</p><div class="actions"><a class="btn" href="dashboard.html">← 回 Dashboard</a></div></section><section id="quiz" class="card"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="reference" class="reference hidden"></div><div id="voiceBox" class="voicebox hidden"><h3>🎙️ Pronunciation Check（選做）</h3><p><b id="voiceTarget"></b></p><div class="actions"><button id="speak" class="btn voice">🔊 再聽一次</button><button id="mic" class="btn primary">🎤 開始朗讀評分</button></div><div id="voiceResult" class="voice-result">尚未進行朗讀評分。</div></div><div class="actions"><button id="check" class="btn primary hidden">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束本輪</button></div></section><section id="result" class="card hidden"><h2>練習結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="download" class="btn primary">下載錯題 DOCX</button><button id="restart" class="btn">重新練習</button></div></section></main><script>
const QUIZ={"unit":"B3U10","kind":"bank","title":"篇章結構","count":20,"data":[{"set":1,"passage":"Everyone has a few weak points. __1__ In an ancient Greek story, the hero Achilles had the above problem. His mother, Thetis, was a goddess while his father, King Peleus, was human. When Achilles was young, Thetis put him into the magical river Styx to turn him into a godlike person who would never die. __2__ This small part of his body thus became his only human weakness.\n    Years later, Achilles fought against the Trojans in a great war. He killed many strong people and won 23 Trojan cities. He thought that he was unbreakable when he was actually not. __3__ The Trojan prince Paris shot an arrow at Achilles and it hit his heel. Achilles soon died after he got hurt. It was unbelievable that such a great hero would die because of such a small wound.\n    __4__ But luckily, most weaknesses do not have the fatal effect as Achilles' heel did.","options":{"A":"The day finally arrived when his weakness was found.","B":"Today, one's main weakness is called an \"Achilles' heel.\"","C":"But she forgot to place one of his heels in the water.","D":"But in wars, even a tiny weakness could lead to a huge tragedy.","E":"Stories like this were often told by Greek parents to teach their children about bravery."},"answers":["D","C","A","B"],"sentences":["But in wars, even a tiny weakness could lead to a huge tragedy. In an ancient Greek story, the hero Achilles had the above problem.","But she forgot to place one of his heels in the water. This small part of his body thus became his only human weakness.","The day finally arrived when his weakness was found. The Trojan prince Paris shot an arrow at Achilles and it hit his heel.","Today, one's main weakness is called an \"Achilles' heel.\" But luckily, most weaknesses do not have the fatal effect as Achilles' heel did."],"blankNums":[1,2,3,4],"structure":true},{"set":2,"passage":"A human girl named Psyche was so beautiful that she angered Aphrodite, the goddess of beauty. Aphrodite thus sent her son Eros, the god of love, to force Psyche to fall in love with an ugly monster. __1__ He took her to a secret place to marry her. Knowing that his mother would not approve of this marriage, Eros kept his identity secret. He asked Psyche to never look at him and stayed with her only in the darkness of night. __2__ She finally saw Eros's face, which forced him to leave home sadly.\n    Missing her husband so much, Psyche went to Mt. Olympus to beg for Aphrodite's blessing. __3__ The first was to sort countless grains of all types in a room by sunrise. The second was to obtain golden fleece. Thirdly, she had to get water from a river on a high cliff. Lastly, she had to collect a box of magic potions from Persephone, the queen of the underworld. __4__ When she returned, she was pleased to learn that Eros had begged Zeus, the king of the Gods, to make her immortal, and Zeus had agreed.\n    Psyche's story shows that persistence pays off in spite of overwhelming difficulties.","options":{"A":"However, Psyche became too curious to keep the promise.","B":"Luckily, she completed each task with the help of others.","C":"Zeus often helped mortals who showed bravery and loyalty.","D":"Accidentally, Eros fell madly in love with Psyche the moment he saw her.","E":"Aphrodite asked Psyche to complete four tasks to prove herself worthy of the marriage to a god."},"answers":["D","A","E","B"],"sentences":["Accidentally, Eros fell madly in love with Psyche the moment he saw her. He took her to a secret place to marry her.","However, Psyche became too curious to keep the promise. She finally saw Eros's face, which forced him to leave home sadly.","Aphrodite asked Psyche to complete four tasks to prove herself worthy of the marriage to a god. The first was to sort countless grains of all types in a room by sunrise.","Luckily, she completed each task with the help of others. When she returned, she was pleased to learn that Eros had begged Zeus, the king of the Gods, to make her immortal, and Zeus had agreed."],"blankNums":[1,2,3,4],"structure":true},{"set":3,"passage":"In ancient Greek stories, the Titans were the gods that ruled the universe before the Olympians. The Titans were a race of giants imagined to be associated with nature, such as ocean and sun. __1__ They were all children of Gaea and Uranus - the goddess of earth and the god of sky.\n    Among the 12 Titans, Cronus was the leader. He later killed his father and ruled for a long time. Cronus didn't want any of his sons to take the place of him, so he decided to eat them all when they were born. __2__ Later, Zeus defeated his father Cronus - just like Cronus did to his father Uranus - and became king of the gods and goddesses.\n    In the war between Zeus and Cronus, many Titans fought with Cronus against Zeus. Atlas was one of them. __3__ Today, this image is still used and often seen in books about Greece.\n    __4__ As we know, \"Uranus\" is the 7th planet in the solar system, and \"Saturn\" (the Roman name of Cronus) is the 6th. In addition, the Atlas Mountains in northwest Africa are believed to be part of Atlas' body. After all, he had been standing for so long.","options":{"A":"There were 12 Titans, 6 sons and 6 daughters.","B":"Now, some names of the Titans are still used.","C":"Ancient people used these stories to explain the world around them before science existed.","D":"Thus, Zeus punished him to hold up the sky.","E":"His youngest son Zeus was the only exception."},"answers":["A","E","D","B"],"sentences":["There were 12 Titans, 6 sons and 6 daughters. They were all children of Gaea and Uranus - the goddess of earth and the god of sky.","His youngest son Zeus was the only exception. Later, Zeus defeated his father Cronus - just like Cronus did to his father Uranus - and became king of the gods and goddesses.","Thus, Zeus punished him to hold up the sky. Today, this image is still used and often seen in books about Greece.","Now, some names of the Titans are still used. As we know, \"Uranus\" is the 7th planet in the solar system, and \"Saturn\" (the Roman name of Cronus) is the 6th."],"blankNums":[1,2,3,4],"structure":true},{"set":4,"passage":"The Trojan War is one of the most famous wars in history. It was also very violent. Many Greeks and Trojans were killed in the war. __1__ Of course, soldiers then did not use any modern weapons like guns or bombs. __2__ Clubs and axes were also popular, and the soldiers often used shields (盾牌) to defend themselves. That's why they had to be close to one another when fighting.\n    For protection, the Greeks developed a special formation called a \"phalanx.\" In this formation, the front-row soldiers would connect their shields together to form a triangle. __3__ To attack the enemy, the phalanx would slowly move forward.\n    Because the Greeks did not have the weapons to batter the castle walls, most battles were fought in the open. __4__ Finally, they came up with the idea of the wooden horse. With this clever device, the Greeks were able to get into the city and use the most advanced weapons then to defeat the Trojan soldiers.","options":{"A":"Among them are the great heroes Achilles and Agamemnon.","B":"This allowed the soldiers behind them to use their spears to fight.","C":"That's why they were unable to enter Troy for so many years.","D":"Instead, they used swords and spears, the best weapons of that time.","E":"To prepare for war, Greek generals ordered their men to build large camps in the forest."},"answers":["A","D","B","C"],"sentences":["Among them are the great heroes Achilles and Agamemnon. Of course, soldiers then did not use any modern weapons like guns or bombs.","Instead, they used swords and spears, the best weapons of that time. Clubs and axes were also popular, and the soldiers often used shields (盾牌) to defend themselves.","This allowed the soldiers behind them to use their spears to fight. To attack the enemy, the phalanx would slowly move forward.","That's why they were unable to enter Troy for so many years. Finally, they came up with the idea of the wooden horse."],"blankNums":[1,2,3,4],"structure":true},{"set":5,"passage":"A human girl named Psyche was so beautiful that she angered Aphrodite, the goddess of beauty. Aphrodite thus sent her son Eros, the god of love, to force Psyche to fall in love with an ugly monster. __1__ He took her to a secret place to marry her. Knowing that his mother would not approve of this marriage, Eros kept his identity secret. He asked Psyche to never look at him and stayed with her only in the darkness of night. __2__ She finally saw Eros's face, which forced him to leave home sadly.\n    Missing her husband so much, Psyche went to Mt. Olympus to beg for Aphrodite's blessing. __3__ The first was to sort countless grains of all types in a room by sunrise. The second was to obtain golden fleece. Thirdly, she had to get water from a river on a high cliff. Lastly, she had to collect a box of magic potions from Persephone, the queen of the underworld. __4__ When she returned, she was pleased to learn that Eros had begged Zeus, the king of the Gods, to make her immortal, and Zeus had agreed.\n    Psyche's story shows that persistence pays off in spite of overwhelming difficulties.","options":{"A":"However, Psyche became too curious to keep the promise.","B":"Luckily, she completed each task with the help of others.","C":"Aphrodite asked Psyche to complete four tasks to prove herself worthy of the marriage to a god.","D":"Accidentally, Eros fell madly in love with Psyche the moment he saw her."},"answers":["D","A","C","B"],"sentences":["Accidentally, Eros fell madly in love with Psyche the moment he saw her. He took her to a secret place to marry her.","However, Psyche became too curious to keep the promise. She finally saw Eros's face, which forced him to leave home sadly.","Aphrodite asked Psyche to complete four tasks to prove herself worthy of the marriage to a god. The first was to sort countless grains of all types in a room by sunrise.","Luckily, she completed each task with the help of others. When she returned, she was pleased to learn that Eros had begged Zeus, the king of the Gods, to make her immortal, and Zeus had agreed."],"blankNums":[1,2,3,4],"structure":true}]};const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let flat=[],index=0,wrong=new Map(),attempted=new Set(),firstTry=new Set(),recognition=null;
function flatten(){if(QUIZ.kind==='mcq')return QUIZ.data.map(x=>({...x,id:String(x.number)}));if(QUIZ.kind==='translation')return QUIZ.data.map(x=>({...x,id:String(x.number)}));return QUIZ.data.flatMap(set=>set.answers.map((answer,i)=>({id:`${set.set}-${i+1}`,set:set.set,passage:set.passage,options:set.options,answer,blank:i+1,sentence:set.sentences[i],structure:set.structure})))}
function fillPassage(text,answers,options){let out=text;answers.forEach((a,i)=>{const word=options[a];const n=i+1;const pats=[new RegExp(`__\\(?${n}\\)?__`),new RegExp(`__${n}__`),new RegExp(`　${n}　`),new RegExp(`\\(${n}\\)`)];for(const p of pats){if(p.test(out)){out=out.replace(p,word);break}}});return out.replace(/\n+/g,' ').replace(/\s+/g,' ').trim()}
function markBlank(text,n){const tag=`<span class="blank-now">Blank ${n}</span>`;let out=esc(text),done=false;for(const p of [new RegExp(`__\\(?${n}\\)?__`),new RegExp(`__${n}__`),new RegExp(`　${n}　`),new RegExp(`\\(${n}\\)`)]){if(!done&&p.test(out)){out=out.replace(p,tag);done=true}}return out}
function norm(s){return String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ')}function speak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}
function show(){try{recognition?.abort()}catch(e){}speechSynthesis?.cancel();const q=flat[index];$('#meta').textContent=`第 ${index+1} / ${flat.length} 題`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=((index+1)/flat.length*100)+'%';$('#feedback').className='feedback hidden';$('#reference').classList.add('hidden');$('#voiceBox').classList.add('hidden');$('#next').classList.add('hidden');$('#check').classList.toggle('hidden',QUIZ.kind!=='translation');$('#answerArea').innerHTML='';if(QUIZ.kind==='mcq')renderChoice(q.prompt,q.options);else if(QUIZ.kind==='translation')renderTranslation(q);else{$('#question').innerHTML=`<div class="passage">${markBlank(q.passage,q.blank)}</div>`;renderChoice(`第 ${q.blank} 格`,q.options)}}
function renderChoice(prompt,options){$('#question').innerHTML=QUIZ.kind==='mcq'?`<div class="prompt">${esc(prompt)}</div>`:$('#question').innerHTML;$('#answerArea').innerHTML='<div class="options">'+Object.entries(options).map(([k,v])=>`<button class="option" data-key="${k}"><b>${k}.</b> ${esc(v)}</button>`).join('')+'</div>';document.querySelectorAll('.option').forEach(b=>b.onclick=()=>checkChoice(b.dataset.key,b))}
function renderTranslation(q){let i=0;const rendered=esc(q.prompt).replace(/_{3,}/g,()=>`<input class="inline-input" data-i="${i++}" aria-label="第 ${i} 格答案">`);$('#question').innerHTML=`<div class="translation">${rendered}</div>`;setTimeout(()=>document.querySelector('.inline-input')?.focus(),0)}
function recordWrong(q,value){if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(value);$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
function checkChoice(key,button){const q=flat[index];attempted.add(q.id);if(key!==q.answer){recordWrong(q,key);button.classList.add('wrong');$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 不正確，請再試一次。';return}if(!wrong.has(q.id))firstTry.add(q.id);document.querySelectorAll('.option').forEach(b=>b.disabled=true);button.classList.add('correct');pass(q)}
function checkTranslation(){const q=flat[index],values=[...document.querySelectorAll('.inline-input')].map(x=>x.value);attempted.add(q.id);const ok=values.length===q.answers.length&&values.every((v,i)=>norm(v)===norm(q.answers[i]));if(!ok){recordWrong(q,values.join(' / '));$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 尚有空格不正確，請修正後再檢查。';return}if(!wrong.has(q.id))firstTry.add(q.id);document.querySelectorAll('.inline-input').forEach(x=>x.disabled=true);pass(q)}
function pass(q){$('#feedback').className='feedback ok';$('#feedback').textContent='✅ 正確！';$('#reference').classList.remove('hidden');$('#reference').textContent='完整句：'+q.sentence;$('#check').classList.add('hidden');$('#next').classList.remove('hidden');$('#voiceBox').classList.remove('hidden');$('#voiceTarget').textContent=q.sentence;$('#voiceResult').className='voice-result';$('#voiceResult').textContent='尚未進行朗讀評分。';speak(q.sentence)}
function similarity(a,b){a=norm(a).replace(/[^a-z0-9' ]/g,'').split(' ').filter(Boolean);b=norm(b).replace(/[^a-z0-9' ]/g,'').split(' ').filter(Boolean);const used=new Set;let hit=0;for(const w of a){const j=b.findIndex((x,i)=>x===w&&!used.has(i));if(j>=0){hit++;used.add(j)}}return Math.round(100*hit/Math.max(a.length,b.length,1))}
function startMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('#voiceResult').textContent='此瀏覽器不支援語音辨識，建議使用 Chrome。';return}recognition=new SR;recognition.lang='en-US';recognition.interimResults=false;$('#voiceResult').textContent='正在聆聽，請朗讀完整句子…';recognition.onresult=e=>{const said=e.results[0][0].transcript,target=flat[index].sentence,score=similarity(target,said);$('#voiceResult').className='voice-result '+(score>=80?'good':'retry');$('#voiceResult').textContent=`辨識：${said}\n正確率：${score}%`};recognition.onerror=e=>$('#voiceResult').textContent='語音辨識未完成：'+e.error;recognition.start()}
function finish(){try{recognition?.abort()}catch(e){}speechSynthesis?.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');const rows=[...wrong.values()];$('#summary').innerHTML=`<div class="stat">實際作答<b>${attempted.size}</b></div><div class="stat">一次答對<b>${firstTry.size}</b></div><div class="stat">曾答錯<b>${rows.length}</b></div>`;$('#wrongList').innerHTML=rows.length?rows.map((r,i)=>`<div class="wrong-card"><b>${i+1}. 第 ${esc(r.q.id)} 題</b><p>${esc(r.q.prompt||`第 ${r.q.blank} 格`)}</p><p>作答：${r.attempts.map(esc).join('；')}</p><p>答案：${esc(r.q.answer||r.q.answers.join(' / '))}</p></div>`).join(''):(attempted.size?'<div class="feedback ok">🎉 本輪全部一次答對！</div>':'<p class="muted">本輪尚未作答，因此不登錄成績。</p>');$('#download').classList.toggle('hidden',!rows.length);if(attempted.size)document.dispatchEvent(new CustomEvent('quiz-result-ready',{detail:{total:attempted.size,correct:firstTry.size,wrong:rows.length,mistakeQuestionNumbers:rows.map(r=>r.q.id).join(', ')}}))}
$('#check').onclick=checkTranslation;$('#next').onclick=()=>{if(++index>=flat.length)finish();else show()};$('#finish').onclick=finish;$('#restart').onclick=()=>location.reload();$('#speak').onclick=()=>speak(flat[index].sentence);$('#mic').onclick=startMic;$('#download').onclick=async()=>{const rows=[...wrong.values()];if(!rows.length)return;try{if(!window.docx)await new Promise((ok,fail)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js';s.onload=ok;s.onerror=fail;document.head.append(s)});const{Document,Packer,Paragraph,HeadingLevel}=window.docx,children=[new Paragraph({text:`三民普高 ${QUIZ.unit} ${QUIZ.title} 錯題紀錄`,heading:HeadingLevel.TITLE})];rows.forEach(r=>children.push(new Paragraph({text:`第 ${r.q.id} 題`,heading:HeadingLevel.HEADING_2}),new Paragraph(r.q.prompt||r.q.passage||''),new Paragraph('作答：'+r.attempts.join('；')),new Paragraph('答案：'+(r.q.answer||r.q.answers.join(' / ')))));const blob=await Packer.toBlob(new Document({sections:[{children}]})),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Sanmin_${QUIZ.unit}_${QUIZ.kind}_錯題.docx`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){alert('目前無法產生 DOCX，請稍後再試。')}};flat=flatten();show();
</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
