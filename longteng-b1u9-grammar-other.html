<script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 9｜文法選擇（其他考點）","mode":"mcq","questions":[{"id":1,"question":"If you ____________ this project during tomorrow’s meeting, the manager will be very likely to accept it.","options":["proposed","propose","will propose","have proposed"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"由tomorrow’s meeting和will be得知本句為未來可能發生的條件句，if引導的子句須使用現在式，故答案要選擇propose","explanationSource":"source"},{"id":2,"question":"In order to arrive at the train station on time, Kevin went there by taxi rather than ____________.","options":["by bus","a bus","took a bus","he took a bus"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"rather than意指「而不是……」，是一個對等連接詞，而前面是by taxi，表示搭乘的交通工具，故空格裡也要用相同結構，因此答案要選擇by bus","explanationSource":"source"},{"id":3,"question":"Last night, it was Peggy’s turn to ____________ the dishes and ____________ away all the garbage.","options":["doing; throwing","did; threw","done; thrown","do; throw"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"It’s one’s turn to + VR是指「輪到某人做某事」，且本句兩個動詞之間以and連接，因此兩個空格裡都要填入原形動詞","explanationSource":"source"},{"id":4,"question":"More than two million people are living in Taipei ____________ is located in northern Taiwan.","options":["that","which",", which",", that"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"由於先行詞Taipei是特定地名，故要使用非限定用法，而且在非限定用法中，關代不能用that，所以本題答案要選擇, which","explanationSource":"source"},{"id":5,"question":"Many tourists come to this national park ____________ the amazing mountain scenery.","options":["by admiring","to admire","with admiration","that admires"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"此處用不定詞片語to VR表示「目的」，故答案要選擇to admire","explanationSource":"source"},{"id":6,"question":"In this book, the author contrasts Modern English ____________ Old English to show their differences.","options":["with","from","between","among"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"contrast...with...是指「把……與……對比」","explanationSource":"source"},{"id":7,"question":"One of Christine’s strong points is ____________ she is always very patient with others.","options":["when","which","what","that"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"由於空格前面是is，而後面是完整的子句，因此可以推知空格內要選擇that，用來引導名詞子句當作主詞補語","explanationSource":"source"},{"id":8,"question":"It’s said that the famous lawyer can earn ____________ dollars every year.","options":["three million of","five millions","millions of","millions"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"此處是表達模糊數字的概念，故要用「量詞s + of + 複數名詞」的句型，因此答案要選擇millions of","explanationSource":"source"},{"id":9,"question":"The new dark suit makes Derek ____________ taller and more handsome.","options":["looks","look","looking","looked"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"此處是使役動詞make的用法，句型為make + O + VR，故答案要選擇原形動詞look","explanationSource":"source"},{"id":10,"question":"This beautiful song ____________ by a famous musician who is popular among teenagers.","options":["was written","wrote","was writing","has written"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"由於主詞是This beautiful song，故可推知是「被寫出來」的，因此要使用被動詞態","explanationSource":"source"},{"id":11,"question":"In Japan, people drive ____________ the left side of the road.","options":["in","at","on","with"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"在某些場合，side也可以和at、to搭配，但是在道路左右邊，介系詞幾乎都用on。","explanationSource":"source"},{"id":12,"question":"You can turn on the radio ____________ pressing this button.","options":["with","over","through","by"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"by為「藉由、靠著（……手段、方法）」之意。","explanationSource":"source"},{"id":13,"question":"We usually focus on what we have to say instead of ____________ to our partners and loved ones.","options":["listening","to listen","listened","listen"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"of為介系詞，後接動名詞。","explanationSource":"source"},{"id":14,"question":"Some students are playing, while ____________ students are standing in line.","options":["others","other","the others","the other"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"此other為形容詞，故不加s。前句主詞Some students非指特定對象，故答案亦不加定冠詞the；若空格後無students，則選(A)others，做代名詞用。","explanationSource":"source"},{"id":15,"question":"It takes years of ____________ to master a foreign language.","options":["work hard","hard worker","hard work","hard-working"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"(A)辛苦打拼　(B)認真打拼的工作者　(C)努力　(D)形容詞，「刻苦耐勞的、勤勞的」","explanationSource":"source"},{"id":16,"question":"Shelly wants to be a professor ____________ a high school teacher.","options":["nothing but","in an effort to","in addition to","rather than"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"(A)只有；只是　(B) in an effort to = in order to以便；為了要　(C)除了　(D) rather than的than是連接詞，所以後面接的單字屬性會跟前面的詞性一樣。","explanationSource":"source"},{"id":17,"question":"Tim ordered French fries; ____________, he had some fried chicken and a hamburger for lunch.","options":["in addition","for example","in other words","as a result"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"(B)例如　(C)換句話說　(D)結果","explanationSource":"source"},{"id":18,"question":"The area of this restaurant is 3,400 ____________.","options":["meters","feet","square feet","cubic feet"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"area此為「面積」，非「區域、地區」。","explanationSource":"source"},{"id":19,"question":"Peter is the most ____________ employee in this company.","options":["hard-working","hard work","working hardly","works hard"],"answer":0,"answerLabel":"A","source":"三合一學習手冊","explanation":"正確答案為 hard-working；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":20,"question":"Some people choose to work for a company, while ____________ like to have their own business.","options":["the others","others","the other","another"],"answer":1,"answerLabel":"B","source":"三合一學習手冊","explanation":"正確答案為 others；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":21,"question":"He has a reputation for being ____________. That’s why he got promoted.","options":["working hard","hard work","works hard","hard-working"],"answer":3,"answerLabel":"D","source":"三合一學習手冊","explanation":"正確答案為 hard-working；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":22,"question":"Those ____________ park their cars in a no-parking area will be fined.","options":["who","where","which","what"],"answer":0,"answerLabel":"A","source":"習作簿","explanation":"正確答案為 who；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":23,"question":"The news report contrasted the average global temperature in 1995 ____________ that in 2015.","options":["for","on","with","at"],"answer":2,"answerLabel":"C","source":"習作簿","explanation":"正確答案為 with；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":24,"question":"Tina ____________ an effort to learn Korean in order to write letters to her K-pop idols.","options":["did","got","made","spent"],"answer":2,"answerLabel":"C","source":"習作簿","explanation":"正確答案為 made；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":25,"question":"Some students learn English by listening to English songs, while ____________ do it by watching movies.","options":["another","the other","other","others"],"answer":3,"answerLabel":"D","source":"三合一學習手冊","explanation":"正確答案為 others；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":26,"question":"Nobody can beat Molly when it comes ____________. She’s simply the best at it.","options":["to swimming","to swim","swimming","swim"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"when it comes to N/V-ing 當談到……時","explanationSource":"source"},{"id":27,"question":"The president made several announcements to call attention ____________ the problem.","options":["with","in","for","to"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"call attention to... 引起對……的注意","explanationSource":"source"},{"id":28,"question":"This story was written to contrast good ____________ evil, light ____________ darkness, and wisdom ____________ foolishness.","options":["by","for","between","with"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"contrast A with B，把A和B拿來對比","explanationSource":"source"}]};</script><script src="longteng-b1u5-quiz.js?v=20261027-2"></script><script src="longteng-vocab-required-pronunciation.js?v=20261027-2"></script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
