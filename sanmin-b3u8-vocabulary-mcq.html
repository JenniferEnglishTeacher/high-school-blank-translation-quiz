:root{--blue:#2563eb;--deep:#172554;--bg:#f4f7fb;--line:#d9e2ef;--ok:#15803d;--bad:#b91c1c;--violet:#6d28d9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font-family:Arial,"Microsoft JhengHei",sans-serif;line-height:1.7}main{max-width:1060px;margin:auto;padding:14px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 7px 24px #0f172a0c}.hero{background:linear-gradient(135deg,#eff6ff,#fff)}h1{margin:0;font-size:clamp(25px,4vw,38px)}h2,h3{margin:0 0 10px}.muted{color:#64748b}.hidden{display:none!important}.btn{border:0;border-radius:10px;padding:10px 15px;font:800 16px inherit;cursor:pointer;background:#e5e7eb;color:#172033;text-decoration:none}.primary{background:var(--blue);color:#fff}.voice{background:var(--violet);color:#fff}.danger{background:#991b1b;color:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;font-weight:800;color:#64748b;margin:9px 0}.prompt,.passage{font-size:18px;background:#f8fafc;border-radius:12px;padding:16px;white-space:pre-wrap}.passage{max-height:48vh;overflow:auto}.blank-now{background:#fef3c7;color:#92400e;padding:2px 7px;border-radius:6px;font-weight:900}.options{display:grid;gap:9px;margin:14px 0}.option{border:2px solid #cbd5e1;background:#fff;border-radius:11px;padding:12px 14px;text-align:left;font:700 16px inherit;cursor:pointer}.option:hover{border-color:var(--blue)}.option.wrong{border-color:#fecaca;background:#fff1f2}.option.correct{border-color:#86efac;background:#f0fdf4}.feedback,.reference{padding:13px;border-radius:10px;margin:12px 0;font-weight:800;white-space:pre-wrap}.feedback.ok{background:#ecfdf3;color:var(--ok)}.feedback.bad{background:#fff1f2;color:var(--bad)}.reference{border:2px solid #bbf7d0;background:#f0fdf4}.translation{white-space:pre-wrap;background:#f8fafc;padding:16px;border-radius:12px;font-size:18px}.inline-input{width:150px;max-width:100%;font:inherit;padding:7px 9px;border:2px solid #94a3b8;border-radius:8px;margin:3px}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:#f5f3ff;margin:12px 0}.voice-result{background:#fff;border:1px solid #ddd6fe;padding:10px;border-radius:9px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat,.wrong-card{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong-card{margin:10px 0;background:#fff7f7;border-color:#fecaca}@media(max-width:620px){main{padding:8px}.hero,.card{padding:15px}.meta{display:block}.prompt,.passage,.translation{font-size:16px}}
</style></head><body><main><section class="hero"><h1>三民普高 B3U8｜詞彙選擇</h1><p class="muted">原題互動練習｜44 題｜即時批改｜錯誤重填｜答對後整句播放＋選做 STT｜錯題 DOCX｜成績登錄</p><div class="actions"><a class="btn" href="dashboard.html">← 回 Dashboard</a></div></section><section id="quiz" class="card"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="reference" class="reference hidden"></div><div id="voiceBox" class="voicebox hidden"><h3>🎙️ Pronunciation Check（選做）</h3><p><b id="voiceTarget"></b></p><div class="actions"><button id="speak" class="btn voice">🔊 再聽一次</button><button id="mic" class="btn primary">🎤 開始朗讀評分</button></div><div id="voiceResult" class="voice-result">尚未進行朗讀評分。</div></div><div class="actions"><button id="check" class="btn primary hidden">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束本輪</button></div></section><section id="result" class="card hidden"><h2>練習結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="download" class="btn primary">下載錯題 DOCX</button><button id="restart" class="btn">重新練習</button></div></section></main><script>
const QUIZ={"unit":"B3U8","kind":"mcq","title":"詞彙選擇","count":44,"data":[{"number":1,"prompt":"Alice loves her boyfriend so much that she _____ many of his bad habits.","options":{"A":"overlooks","B":"offers","C":"features","D":"conveys"},"answer":"A","sentence":"Alice loves her boyfriend so much that she overlooks many of his bad habits."},{"number":2,"prompt":"The pictures of _____ escaping from the war aroused the attention from around the world, calling for immediate assistance.","options":{"A":"borders","B":"models","C":"crises","D":"refugees"},"answer":"D","sentence":"The pictures of refugees escaping from the war aroused the attention from around the world, calling for immediate assistance."},{"number":3,"prompt":"Sarah’s friends wanted her to _____ it _____ about marrying Oscar, whom she had only met for three months.","options":{"A":"browse; through","B":"go; through","C":"see; through","D":"think; through"},"answer":"D","sentence":"Sarah’s friends wanted her to think it through about marrying Oscar, whom she had only met for three months."},{"number":4,"prompt":"Nancy saw an injured dog lying in the middle of the road. She quickly came to its _____.","options":{"A":"refugee","B":"crisis","C":"aid","D":"offer"},"answer":"C","sentence":"Nancy saw an injured dog lying in the middle of the road. She quickly came to its aid."},{"number":5,"prompt":"What Fiona just said was not _____ at all. Please don’t mind it.","options":{"A":"doubtful","B":"meaningful","C":"ordinary","D":"irregular"},"answer":"B","sentence":"What Fiona just said was not meaningful at all. Please don’t mind it."},{"number":6,"prompt":"Millions of people in the East Africa could face a food ______ if huge swarms of locusts, the insects breeding extremely fast, eat entire crops.","options":{"A":"crisis","B":"feature","C":"offer","D":"model"},"answer":"A","sentence":"Millions of people in the East Africa could face a food crisis if huge swarms of locusts, the insects breeding extremely fast, eat entire crops."},{"number":7,"prompt":"In 2018, the leader of North Korea, Kim Jong-un, crossed the _____ to South Korea and had a peace talk with the South Korean president, Moon Jae-in.","options":{"A":"feature","B":"equipment","C":"bunch","D":"border"},"answer":"D","sentence":"In 2018, the leader of North Korea, Kim Jong-un, crossed the border to South Korea and had a peace talk with the South Korean president, Moon Jae-in."},{"number":8,"prompt":"All the paintings of the artist in the gallery using a lot of bright colors ______ the artist's strong passion for life.","options":{"A":"convey","B":"seek","C":"shelter","D":"chill"},"answer":"A","sentence":"All the paintings of the artist in the gallery using a lot of bright colors convey the artist's strong passion for life."},{"number":9,"prompt":"Mr. and Mrs. Smith were so friendly that I felt ______ during my stay.","options":{"A":"at least","B":"beyond belief","C":"by accident","D":"at home"},"answer":"D","sentence":"Mr. and Mrs. Smith were so friendly that I felt at home during my stay."},{"number":10,"prompt":"If you have any questions about college application, you can _____ suggestion from your teacher.","options":{"A":"overlook","B":"offer","C":"aid","D":"seek"},"answer":"D","sentence":"If you have any questions about college application, you can seek suggestion from your teacher."},{"number":11,"prompt":"This restaurant provides meals _____ vegetarians and those who look for healthy and organic diet options.","options":{"A":"catering to","B":"making up","C":"putting aside","D":"passing on"},"answer":"A","sentence":"This restaurant provides meals catering to vegetarians and those who look for healthy and organic diet options."},{"number":12,"prompt":"The gangsters finally ______ their weapons and surrendered themselves to the police. All of them were arrested after the threehour gunfight.","options":{"A":"abandoned","B":"devoted","C":"sought","D":"dominated"},"answer":"A","sentence":"The gangsters finally abandoned their weapons and surrendered themselves to the police. All of them were arrested after the threehour gunfight."},{"number":13,"prompt":"Because the importance of prevention of the severe illness had been ______, the deadly disease spread rapidly in the country.","options":{"A":"featured","B":"equipped","C":"overlooked","D":"praised"},"answer":"C","sentence":"Because the importance of prevention of the severe illness had been overlooked, the deadly disease spread rapidly in the country."},{"number":14,"prompt":"Visiting Kenting during summer vacation can be a nightmare, for there is always a huge _____ of tourists on the beach.","options":{"A":"bunch","B":"feature","C":"slogan","D":"chill"},"answer":"A","sentence":"Visiting Kenting during summer vacation can be a nightmare, for there is always a huge bunch of tourists on the beach."},{"number":15,"prompt":"_____ the firefighters’ timely arrival, the fire was put out within an hour.","options":{"A":"So far","B":"Because","C":"Thanks to","D":"Despite"},"answer":"C","sentence":"Thanks to the firefighters’ timely arrival, the fire was put out within an hour."},{"number":16,"prompt":"Peter _____ his love to Irene by a handwritten letter, hoping to win her heart.","options":{"A":"conveyed","B":"deserved","C":"abandoned","D":"equipped"},"answer":"A","sentence":"Peter conveyed his love to Irene by a handwritten letter, hoping to win her heart."},{"number":17,"prompt":"The emperor who usually didn't trust others had raised ______ about the honesty and the loyalty of the queen.","options":{"A":"slogans","B":"doubts","C":"borders","D":"shelters"},"answer":"B","sentence":"The emperor who usually didn't trust others had raised doubts about the honesty and the loyalty of the queen."},{"number":18,"prompt":"According to the weather report, there will be _____ in the morning and then the temperature will go up at noon.","options":{"A":"crisis","B":"model","C":"offer","D":"chill"},"answer":"D","sentence":"According to the weather report, there will be chill in the morning and then the temperature will go up at noon."},{"number":19,"prompt":"All the seats on this bus are ______ with USB chargers so that passengers can charge their smartphones during their trips.","options":{"A":"abandoned","B":"aided","C":"equipped","D":"featured"},"answer":"C","sentence":"All the seats on this bus are equipped with USB chargers so that passengers can charge their smartphones during their trips."},{"number":20,"prompt":"Smile is an universal _____ of friendliness and politeness. When you smile, the world is open to you.","options":{"A":"border","B":"gesture","C":"doubt","D":"crisis"},"answer":"B","sentence":"Smile is an universal gesture of friendliness and politeness. When you smile, the world is open to you."},{"number":21,"prompt":"Even in the face of _____, Amber can always stay calm and find out the solutions.","options":{"A":"shelter","B":"gesture","C":"bunch","D":"crisis"},"answer":"D","sentence":"Even in the face of crisis, Amber can always stay calm and find out the solutions."},{"number":22,"prompt":"The educational system in Finland presents as a role _____ for many countries to improve the current teaching and learning environment.","options":{"A":"gesture","B":"model","C":"doubt","D":"slogan"},"answer":"B","sentence":"The educational system in Finland presents as a role model for many countries to improve the current teaching and learning environment."},{"number":23,"prompt":"Because of his love and care for stray animals, Eric has volunteered for an animal _____ for years.","options":{"A":"shelter","B":"border","C":"model","D":"doubt"},"answer":"A","sentence":"Because of his love and care for stray animals, Eric has volunteered for an animal shelter for years."},{"number":24,"prompt":"Feeling _____ and lonely, the old man turns to church for some comfort peace.","options":{"A":"equipped","B":"abandoned","C":"conveyed","D":"sheltered"},"answer":"B","sentence":"Feeling abandoned and lonely, the old man turns to church for some comfort peace."},{"number":25,"prompt":"Mastery of English _______ us with a very important tool for acquiring knowledge and information.","options":{"A":"accesses","B":"conveys","C":"deprives","D":"equips"},"answer":"D","sentence":"Mastery of English equips us with a very important tool for acquiring knowledge and information."},{"number":26,"prompt":"Once you finish using the pepper, please ______ it ______ to another one.","options":{"A":"think; through","B":"pass; on","C":"cater; to","D":"equip; with"},"answer":"B","sentence":"Once you finish using the pepper, please pass it on to another one."},{"number":27,"prompt":"All the audience were impressed by the _____ performance given by Cirque du Soleil.","options":{"A":"regular","B":"doubtful","C":"extraordinary","D":"chilly"},"answer":"C","sentence":"All the audience were impressed by the extraordinary performance given by Cirque du Soleil."},{"number":28,"prompt":"The New Year Countdown Party this year _____ a fifteen-minute firework display and drew over hundreds of thousands of visitors to the event.","options":{"A":"bordered","B":"featured","C":"gestured","D":"deserved"},"answer":"B","sentence":"The New Year Countdown Party this year featured a fifteen-minute firework display and drew over hundreds of thousands of visitors to the event."},{"number":29,"prompt":"All the classrooms in this school are _____ with computers and Wi-Fi connection to provide the students with a good learning environment.","options":{"A":"overlooked","B":"sheltered","C":"bordered","D":"equipped"},"answer":"D","sentence":"All the classrooms in this school are equipped with computers and Wi-Fi connection to provide the students with a good learning environment."},{"number":30,"prompt":"William is such an honest and sincere man that no one would ever _____ what he says.","options":{"A":"abandon","B":"convey","C":"doubt","D":"equip"},"answer":"C","sentence":"William is such an honest and sincere man that no one would ever doubt what he says."},{"number":31,"prompt":"As long as you make a(n) _____ apology, I am sure Amanda will forgive you.","options":{"A":"ordinary","B":"irregular","C":"genuine","D":"doubtful"},"answer":"C","sentence":"As long as you make a(n) genuine apology, I am sure Amanda will forgive you."},{"number":32,"prompt":"Many universities are willing to _____ Gloria scholarships for her excellent academic performances.","options":{"A":"border","B":"offer","C":"chill","D":"seek"},"answer":"B","sentence":"Many universities are willing to offer Gloria scholarships for her excellent academic performances."},{"number":33,"prompt":"Sarah's parents exchanged ______ glances when Sarah first invited her foreign boyfriend to her home for dinner. They just couldn't help feeling awkward.","options":{"A":"ambitious","B":"irregular","C":"extraordinary","D":"meaningful"},"answer":"D","sentence":"Sarah's parents exchanged meaningful glances when Sarah first invited her foreign boyfriend to her home for dinner. They just couldn't help feeling awkward."},{"number":34,"prompt":"Miranda is no longer nervous about speaking to the public. Instead, she feels _____ whenever she gives a speech.","options":{"A":"at home","B":"on time","C":"beyond belief","D":"for sure"},"answer":"A","sentence":"Miranda is no longer nervous about speaking to the public. Instead, she feels at home whenever she gives a speech."},{"number":35,"prompt":"The most memorable part of my trip to Brazil was those friendly _____ who kindly showed me the directions.","options":{"A":"ingredients","B":"slogans","C":"locals","D":"shelters"},"answer":"C","sentence":"The most memorable part of my trip to Brazil was those friendly locals who kindly showed me the directions."},{"number":36,"prompt":"This smart watch can send messages to your emergency contact when it detects any _____ heartbeat or blood pressure.","options":{"A":"irregular","B":"ordinary","C":"meaningful","D":"genuine"},"answer":"A","sentence":"This smart watch can send messages to your emergency contact when it detects any irregular heartbeat or blood pressure."},{"number":37,"prompt":"The advertiser has come out with a catchy _____ for the new TV commercial.","options":{"A":"crisis","B":"border","C":"slogan","D":"shelter"},"answer":"C","sentence":"The advertiser has come out with a catchy slogan for the new TV commercial."},{"number":38,"prompt":"The landslide after the typhoon signals that environmental protection _______ our attention.","options":{"A":"accuses","B":"stretches","C":"obtains","D":"deserves"},"answer":"D","sentence":"The landslide after the typhoon signals that environmental protection deserves our attention."},{"number":39,"prompt":"The chef has an incredible sense of taste. He can tell all the _____ in a dish with just one taste.","options":{"A":"gestures","B":"aids","C":"ingredients","D":"refugees"},"answer":"C","sentence":"The chef has an incredible sense of taste. He can tell all the ingredients in a dish with just one taste."},{"number":40,"prompt":"Most of the flood victims were saved in this super typhoon ______ the aid of remotecontrolled rescue boats.","options":{"A":"except for","B":"in spite of","C":"in addition to","D":"thanks to"},"answer":"D","sentence":"Most of the flood victims were saved in this super typhoon thanks to the aid of remotecontrolled rescue boats."},{"number":41,"prompt":"In the desert, a huge mall with art galleries, theaters, and museums will be constructed to _____ visitors from the heat outside.","options":{"A":"convert","B":"defend","C":"shelter","D":"vacuum"},"answer":"C","sentence":"In the desert, a huge mall with art galleries, theaters, and museums will be constructed to shelter visitors from the heat outside."},{"number":42,"prompt":"The opening of this shopping mall has brought much convenience to the ______ people.","options":{"A":"local","B":"regular","C":"ordinary","D":"genuine"},"answer":"A","sentence":"The opening of this shopping mall has brought much convenience to the local people."},{"number":43,"prompt":"Our parents ______ our respect and gratitude for their unconditional love to us.","options":{"A":"deserve","B":"overlook","C":"seek","D":"offer"},"answer":"A","sentence":"Our parents deserve our respect and gratitude for their unconditional love to us."},{"number":44,"prompt":"Because Mr. Chang has been busy these days, it’s whether he will come to the party.","options":{"A":"unlikely","B":"impossible","C":"doubtful","D":"inevitable"},"answer":"C","sentence":"Because Mr. Chang has been busy these days, it’s doubtful whether he will come to the party."}]};const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let flat=[],index=0,wrong=new Map(),attempted=new Set(),firstTry=new Set(),recognition=null;
function flatten(){if(QUIZ.kind==='mcq')return QUIZ.data.map(x=>({...x,id:String(x.number)}));if(QUIZ.kind==='translation')return QUIZ.data.map(x=>({...x,id:String(x.number)}));return QUIZ.data.flatMap(set=>set.answers.map((answer,i)=>({id:`${set.set}-${i+1}`,set:set.set,passage:set.passage,options:set.options,answer,blank:i+1,sentence:set.sentences[i],structure:set.structure})))}
function fillPassage(text,answers,options){let out=text;answers.forEach((a,i)=>{const word=options[a];const n=i+1;const pats=[new RegExp(`__\\(?${n}\\)?__`),new RegExp(`__${n}__`),new RegExp(`　${n}　`),new RegExp(`\\(${n}\\)`)];for(const p of pats){if(p.test(out)){out=out.replace(p,word);break}}});return out.replace(/\n+/g,' ').replace(/\s+/g,' ').trim()}
function markBlank(text,n){const tag=`<span class="blank-now">Blank ${n}</span>`;let out=esc(text),done=false;for(const p of [new RegExp(`__\\(?${n}\\)?__`),new RegExp(`__${n}__`),new RegExp(`　${n}　`),new RegExp(`\\(${n}\\)`)]){if(!done&&p.test(out)){out=out.replace(p,tag);done=true}}return out}
function norm(s){return String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ')}function speak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}
function show(){try{recognition?.abort()}catch(e){}speechSynthesis?.cancel();const q=flat[index];$('#meta').textContent=`第 ${index+1} / ${flat.length} 題`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=((index+1)/flat.length*100)+'%';$('#feedback').className='feedback hidden';$('#reference').classList.add('hidden');$('#voiceBox').classList.add('hidden');$('#next').classList.add('hidden');$('#check').classList.toggle('hidden',QUIZ.kind!=='translation');$('#answerArea').innerHTML='';if(QUIZ.kind==='mcq')renderChoice(q.prompt,q.options);else if(QUIZ.kind==='translation')renderTranslation(q);else{$('#question').innerHTML=`<div class="passage">${markBlank(q.passage,q.blank)}</div>`;renderChoice(`第 ${q.blank} 格`,q.options)}}
function renderChoice(prompt,options){$('#question').innerHTML=QUIZ.kind==='mcq'?`<div class="prompt">${esc(prompt)}</div>`:$('#question').innerHTML;$('#answerArea').innerHTML='<div class="options">'+Object.entries(options).map(([k,v])=>`<button class="option" data-key="${k}"><b>${k}.</b> ${esc(v)}</button>`).join('')+'</div>';document.querySelectorAll('.option').forEach(b=>b.onclick=()=>checkChoice(b.dataset.key,b))}
function renderTranslation(q){let i=0;const rendered=esc(q.prompt).replace(/_{3,}/g,()=>`<input class="inline-input" data-i="${i++}" aria-label="第 ${i} 格答案">`);$('#question').innerHTML=`<div class="translation">${rendered}</div>`;setTimeout(()=>document.querySelector('.inline-input')?.focus(),0)}
function recordWrong(q,value){if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(value);$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
function checkChoice(key,button){const q=flat[index];attempted.add(q.id);if(key!==q.answer){recordWrong(q,key);button.classList.add('wrong');$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 不正確，請再試一次。';return}if(!wrong.has(q.id))firstTry.add(q.id);document.querySelectorAll('.option').forEach(b=>b.disabled=true);button.classList.add('correct');pass(q)}
function checkTranslation(){const q=flat[index],values=[...document.querySelectorAll('.inline-input')].map(x=>x.value);attempted.add(q.id);const ok=values.length===q.answers.length&&values.every((v,i)=>norm(v)===norm(q.answers[i]));if(!ok){recordWrong(q,values.join(' / '));$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 尚有空格不正確，請修正後再檢查。';return}if(!wrong.has(q.id))firstTry.add(q.id);document.querySelectorAll('.inline-input').forEach(x=>x.disabled=true);pass(q)}
function pass(q){$('#feedback').className='feedback ok';$('#feedback').textContent='✅ 正確！';$('#reference').classList.remove('hidden');$('#reference').textContent='完整句：'+q.sentence;$('#check').classList.add('hidden');$('#next').classList.remove('hidden');$('#voiceBox').classList.remove('hidden');$('#voiceTarget').textContent=q.sentence;$('#voiceResult').className='voice-result';$('#voiceResult').textContent='尚未進行朗讀評分。';speak(q.sentence)}
function similarity(a,b){a=norm(a).replace(/[^a-z0-9' ]/g,'').split(' ').filter(Boolean);b=norm(b).replace(/[^a-z0-9' ]/g,'').split(' ').filter(Boolean);const used=new Set;let hit=0;for(const w of a){const j=b.findIndex((x,i)=>x===w&&!used.has(i));if(j>=0){hit++;used.add(j)}}return Math.round(100*hit/Math.max(a.length,b.length,1))}
function startMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('#voiceResult').textContent='此瀏覽器不支援語音辨識，建議使用 Chrome。';return}recognition=new SR;recognition.lang='en-US';recognition.interimResults=false;$('#voiceResult').textContent='正在聆聽，請朗讀完整句子…';recognition.onresult=e=>{const said=e.results[0][0].transcript,target=flat[index].sentence,score=similarity(target,said);$('#voiceResult').className='voice-result '+(score>=80?'good':'retry');$('#voiceResult').textContent=`辨識：${said}\n正確率：${score}%`};recognition.onerror=e=>$('#voiceResult').textContent='語音辨識未完成：'+e.error;recognition.start()}
function finish(){try{recognition?.abort()}catch(e){}speechSynthesis?.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');const rows=[...wrong.values()];$('#summary').innerHTML=`<div class="stat">實際作答<b>${attempted.size}</b></div><div class="stat">一次答對<b>${firstTry.size}</b></div><div class="stat">曾答錯<b>${rows.length}</b></div>`;$('#wrongList').innerHTML=rows.length?rows.map((r,i)=>`<div class="wrong-card"><b>${i+1}. 第 ${esc(r.q.id)} 題</b><p>${esc(r.q.prompt||`第 ${r.q.blank} 格`)}</p><p>作答：${r.attempts.map(esc).join('；')}</p><p>答案：${esc(r.q.answer||r.q.answers.join(' / '))}</p></div>`).join(''):(attempted.size?'<div class="feedback ok">🎉 本輪全部一次答對！</div>':'<p class="muted">本輪尚未作答，因此不登錄成績。</p>');$('#download').classList.toggle('hidden',!rows.length);if(attempted.size)document.dispatchEvent(new CustomEvent('quiz-result-ready',{detail:{total:attempted.size,correct:firstTry.size,wrong:rows.length,mistakeQuestionNumbers:rows.map(r=>r.q.id).join(', ')}}))}
