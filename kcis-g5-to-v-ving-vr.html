<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KCIS G5 to V / V-ing / VR</title><style>

</style></head><body><main class="wrap"><section class="hero"><h1>KCIS G5 to V / V-ing / VR</h1><p>Typhoon Day Quest｜附件 B–G 全部文法題＋原形動詞補充</p><p class="muted">共 46 題｜逐題即時批改｜答錯可重填｜正確答案英文朗讀｜錯題 DOCX 下載</p><div class="toolbar"><a class="btn" href="dashboard.html">← 回測驗總覽</a></div></section><section id="select" class="card"><h2>選擇練習範圍</h2><div id="groups" class="grid"></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="passage" class="passage hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="reference" class="reference hidden"></div><div id="voiceBox" class="voicebox hidden"><b id="voiceTarget"></b><button id="speak" class="btn voice">🔊 再聽一次</button></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束本輪</button></div></section><section id="result" class="card hidden"><h2>練習結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="download" class="btn primary">下載錯題 DOCX</button><button id="back" class="btn">選擇其他範圍</button><button id="restart" class="btn">重新開始</button></div></section></main><script>
const DATA={"title":"KCIS G5 to V / V-ing / VR","subtitle":"Typhoon Day Quest｜附件 B–G 全部文法題＋原形動詞補充","groups":[{"title":"B｜V + V-ing：框內字完成句子","items":[{"id":"1-1","number":1,"prompt":"On typhoon days, my brother always _____ _____ late. (sleep · 享受＋睡)","answer":"enjoys sleeping","accepted":["enjoys sleeping"],"type":"fill","cue":"","wordbank":[],"sentence":"On typhoon days, my brother always enjoys sleeping late."},{"id":"1-2","number":2,"prompt":"The wind was so strong that I _____ _____ _____ my umbrella yesterday. (hold · 很難＋拿住)","answer":"had trouble holding","accepted":["had trouble holding"],"type":"fill","cue":"","wordbank":[],"sentence":"The wind was so strong that I had trouble holding my umbrella yesterday."},{"id":"1-3","number":3,"prompt":"It _____ _____ all day on Friday, October 23. (rain · 持續＋下雨)","answer":"kept raining","accepted":["kept raining"],"type":"fill","cue":"","wordbank":[],"sentence":"It kept raining all day on Friday, October 23."},{"id":"1-4","number":4,"prompt":"Mia _____ _____ Chiikawa every day. (draw · 練習＋畫)","answer":"practices drawing","accepted":["practices drawing"],"type":"fill","cue":"","wordbank":[],"sentence":"Mia practices drawing Chiikawa every day."},{"id":"1-5","number":5,"prompt":"Did you _____ _____ your homework before you went to Xinyi? (do · 完成＋做)","answer":"finish doing","accepted":["finish doing"],"type":"fill","cue":"","wordbank":[],"sentence":"Did you finish doing your homework before you went to Xinyi?"},{"id":"1-6","number":6,"prompt":"Nina didn't _____ _____ in the long line at the pop-up store. (wait · 介意＋等)","answer":"mind waiting","accepted":["mind waiting"],"type":"fill","cue":"","wordbank":[],"sentence":"Nina didn't mind waiting in the long line at the pop-up store."},{"id":"1-7","number":7,"prompt":"We _____ _____ hot pot with our relatives last night. (eat · 享受＋吃)","answer":"enjoyed eating","accepted":["enjoyed eating"],"type":"fill","cue":"","wordbank":[],"sentence":"We enjoyed eating hot pot with our relatives last night."},{"id":"1-8","number":8,"prompt":"Dad _____ _____ _____ a parking space in Xinyi on Saturday. (find · 很難＋找到)","answer":"had difficulty finding","accepted":["had difficulty finding"],"type":"fill","cue":"","wordbank":[],"sentence":"Dad had difficulty finding a parking space in Xinyi on Saturday."}]},{"title":"C｜V + sb. + (not) to V / hope","items":[{"id":"2-1","number":1,"prompt":"Mom _____ us not to go outside during the typhoon. (告訴)","answer":"told","accepted":["told"],"type":"fill","cue":"","wordbank":[],"sentence":"Mom told us not to go outside during the typhoon."},{"id":"2-2","number":2,"prompt":"Our teacher _____ us to finish the worksheet at home. (要求)","answer":"asked","accepted":["asked"],"type":"fill","cue":"","wordbank":[],"sentence":"Our teacher asked us to finish the worksheet at home."},{"id":"2-3","number":3,"prompt":"Nina _____ to catch a pink Pikachu in Pokémon GO. (希望)","answer":"hopes","accepted":["hopes","hoped"],"type":"fill","cue":"","wordbank":[],"sentence":"Nina hopes to catch a pink Pikachu in Pokémon GO."},{"id":"2-4","number":4,"prompt":"Mia _____ Dad to take her to the Chiikawa store. (想要)","answer":"wanted","accepted":["wanted"],"type":"fill","cue":"","wordbank":[],"sentence":"Mia wanted Dad to take her to the Chiikawa store."},{"id":"2-5","number":5,"prompt":"Grandpa _____ us to play Chinese chess on Friday. (教)","answer":"taught","accepted":["taught"],"type":"fill","cue":"","wordbank":[],"sentence":"Grandpa taught us to play Chinese chess on Friday."},{"id":"2-6","number":6,"prompt":"Mia _____ Grandma to wash the dishes after dinner. (幫忙)","answer":"helped","accepted":["helped"],"type":"fill","cue":"","wordbank":[],"sentence":"Mia helped Grandma to wash the dishes after dinner."},{"id":"2-7","number":7,"prompt":"Dad _____ us to charge our phones before the typhoon came. (需要)","answer":"needed","accepted":["needed"],"type":"fill","cue":"","wordbank":[],"sentence":"Dad needed us to charge our phones before the typhoon came."},{"id":"2-8","number":8,"prompt":"We all _____ the typhoon doesn't hurt anyone. (希望)","answer":"hope","accepted":["hope"],"type":"fill","cue":"","wordbank":[],"sentence":"We all hope the typhoon doesn't hurt anyone."}]},{"title":"D｜to V / V-ing / VR：選擇題","items":[{"id":"3-1","number":1,"prompt":"Mom asked us _____ near the windows.","answer":"not to stand","accepted":["not to stand"],"type":"choice","cue":"","wordbank":[],"options":["not to stand","standing","stand"],"correct":0,"sentence":"Mom asked us not to stand near the windows."},{"id":"3-2","number":2,"prompt":"The rain kept _____ all night.","answer":"falling","accepted":["falling"],"type":"choice","cue":"","wordbank":[],"options":["fall","to fall","falling"],"correct":2,"sentence":"The rain kept falling all night."},{"id":"3-3","number":3,"prompt":"Nina hopes _____ more Pokémon postcards.","answer":"to collect","accepted":["to collect"],"type":"choice","cue":"","wordbank":[],"options":["collecting","to collect","collect"],"correct":1,"sentence":"Nina hopes to collect more Pokémon postcards."},{"id":"3-4","number":4,"prompt":"Did you finish _____ the Chiikawa sticker book?","answer":"reading","accepted":["reading"],"type":"choice","cue":"","wordbank":[],"options":["to read","read","reading"],"correct":2,"sentence":"Did you finish reading the Chiikawa sticker book?"},{"id":"3-5","number":5,"prompt":"Dad told us _____ raincoats, not umbrellas.","answer":"to wear","accepted":["to wear"],"type":"choice","cue":"","wordbank":[],"options":["to wear","wearing","wore"],"correct":0,"sentence":"Dad told us to wear raincoats, not umbrellas."},{"id":"3-6","number":6,"prompt":"I have trouble _____ when the wind is loud.","answer":"sleeping","accepted":["sleeping"],"type":"choice","cue":"","wordbank":[],"options":["to sleep","sleeping","sleep"],"correct":1,"sentence":"I have trouble sleeping when the wind is loud."},{"id":"3-7","number":7,"prompt":"The reporter told people _____ to the beach.","answer":"not to go","accepted":["not to go"],"type":"choice","cue":"","wordbank":[],"options":["go","not to go","not going"],"correct":1,"sentence":"The reporter told people not to go to the beach."},{"id":"3-8","number":8,"prompt":"Do you mind _____ the window? It's cold.","answer":"closing","accepted":["closing"],"type":"choice","cue":"","wordbank":[],"options":["to close","closed","closing"],"correct":2,"sentence":"Do you mind closing the window? It's cold."}]},{"title":"E｜Combine the Sentences：句子合併","items":[{"id":"4-1","number":1,"prompt":"Mom told the twins. \"Don't go outside.\"","answer":"Mom told the twins not to go outside.","accepted":["Mom told the twins not to go outside."],"type":"fill","cue":"","wordbank":[],"sentence":"Mom told the twins not to go outside."},{"id":"4-2","number":2,"prompt":"Mia asked Dad. \"Please drive us to Xinyi.\"","answer":"Mia asked Dad to drive them to Xinyi.","accepted":["Mia asked Dad to drive them to Xinyi."],"type":"fill","cue":"","wordbank":[],"sentence":"Mia asked Dad to drive them to Xinyi."},{"id":"4-3","number":3,"prompt":"Our teacher told us. \"Check the weather forecast every day.\"","answer":"Our teacher told us to check the weather forecast every day.","accepted":["Our teacher told us to check the weather forecast every day."],"type":"fill","cue":"","wordbank":[],"sentence":"Our teacher told us to check the weather forecast every day."},{"id":"4-4","number":4,"prompt":"Nina plays Pokémon GO too much. Her parents ask her not to do it.","answer":"Nina's parents ask her not to play Pokémon GO too much.","accepted":["Nina's parents ask her not to play Pokémon GO too much."],"type":"fill","cue":"","wordbank":[],"sentence":"Nina's parents ask her not to play Pokémon GO too much."},{"id":"4-5","number":5,"prompt":"Mia always draws Chiikawa in math class. Her teacher tells her not to do it.","answer":"Mia's teacher tells her not to draw Chiikawa in math class.","accepted":["Mia's teacher tells her not to draw Chiikawa in math class."],"type":"fill","cue":"","wordbank":[],"sentence":"Mia's teacher tells her not to draw Chiikawa in math class."},{"id":"4-6","number":6,"prompt":"The twins did their homework on Friday morning. They finished it before lunch.","answer":"The twins finished doing their homework before lunch on Friday.","accepted":["The twins finished doing their homework before lunch on Friday."],"type":"fill","cue":"","wordbank":[],"sentence":"The twins finished doing their homework before lunch on Friday."}]},{"title":"F｜not to V：改寫否定句","items":[{"id":"5-1","number":1,"prompt":"Mom tells us to eat instant noodles every day.","answer":"Mom tells us not to eat instant noodles every day.","accepted":["Mom tells us not to eat instant noodles every day."],"type":"fill","cue":"","wordbank":[],"sentence":"Mom tells us not to eat instant noodles every day."},{"id":"5-2","number":2,"prompt":"Dad asked Nina to open the window during the storm.","answer":"Dad asked Nina not to open the window during the storm.","accepted":["Dad asked Nina not to open the window during the storm."],"type":"fill","cue":"","wordbank":[],"sentence":"Dad asked Nina not to open the window during the storm."},{"id":"5-3","number":3,"prompt":"Grandma wants the twins to stay up late.","answer":"Grandma wants the twins not to stay up late.","accepted":["Grandma wants the twins not to stay up late."],"type":"fill","cue":"","wordbank":[],"sentence":"Grandma wants the twins not to stay up late."},{"id":"5-4","number":4,"prompt":"The teacher told the students to play outside on typhoon days.","answer":"The teacher told the students not to play outside on typhoon days.","accepted":["The teacher told the students not to play outside on typhoon days."],"type":"fill","cue":"","wordbank":[],"sentence":"The teacher told the students not to play outside on typhoon days."}]},{"title":"G｜Translate：翻譯","items":[{"id":"6-1","number":1,"prompt":"媽媽要我們不要在颱風天出門。 (Hint: Mom asked …)","answer":"Mom asked us not to go out on the typhoon day.","accepted":["Mom asked us not to go out on the typhoon day."],"type":"fill","cue":"","wordbank":[],"sentence":"Mom asked us not to go out on the typhoon day."},{"id":"6-2","number":2,"prompt":"Mia 很喜歡畫吉伊卡哇。 (Hint: enjoy)","answer":"Mia enjoys drawing Chiikawa.","accepted":["Mia enjoys drawing Chiikawa."],"type":"fill","cue":"","wordbank":[],"sentence":"Mia enjoys drawing Chiikawa."},{"id":"6-3","number":3,"prompt":"雨一直下個不停。 (Hint: keep)","answer":"It kept raining.","accepted":["It kept raining.","The rain kept falling."],"type":"fill","cue":"","wordbank":[],"sentence":"It kept raining."},{"id":"6-4","number":4,"prompt":"Nina 希望能抓到粉紅色皮卡丘。 (Hint: hope)","answer":"Nina hopes to catch a pink Pikachu.","accepted":["Nina hopes to catch a pink Pikachu."],"type":"fill","cue":"","wordbank":[],"sentence":"Nina hopes to catch a pink Pikachu."}]},{"title":"H｜VR 原形動詞：颱風日補充","items":[{"id":"7-1","number":1,"prompt":"We can _____ at home during the typhoon.","answer":"stay","accepted":["stay"],"type":"choice","cue":"","wordbank":[],"options":["stay","to stay","staying"],"correct":0,"sentence":"We can stay at home during the typhoon."},{"id":"7-2","number":2,"prompt":"You should _____ the weather forecast.","answer":"check","accepted":["check"],"type":"choice","cue":"","wordbank":[],"options":["checking","check","to check"],"correct":1,"sentence":"You should check the weather forecast."},{"id":"7-3","number":3,"prompt":"Did Dad let you _____ board games?","answer":"play","accepted":["play"],"type":"choice","cue":"","wordbank":[],"options":["play","to play","playing"],"correct":0,"sentence":"Did Dad let you play board games?"},{"id":"7-4","number":4,"prompt":"Mom made us _____ the windows.","answer":"close","accepted":["close"],"type":"choice","cue":"","wordbank":[],"options":["to close","closing","close"],"correct":2,"sentence":"Mom made us close the windows."},{"id":"7-5","number":5,"prompt":"We must not _____ outside during the storm.","answer":"go","accepted":["go"],"type":"choice","cue":"","wordbank":[],"options":["going","go","to go"],"correct":1,"sentence":"We must not go outside during the storm."},{"id":"7-6","number":6,"prompt":"The strong wind may _____ down trees.","answer":"knock","accepted":["knock"],"type":"choice","cue":"","wordbank":[],"options":["knock","to knock","knocking"],"correct":0,"sentence":"The strong wind may knock down trees."},{"id":"7-7","number":7,"prompt":"Students could _____ their homework at home.","answer":"finish","accepted":["finish"],"type":"choice","cue":"","wordbank":[],"options":["finishing","finish","to finish"],"correct":1,"sentence":"Students could finish their homework at home."},{"id":"7-8","number":8,"prompt":"Please help me _____ the bottles of water.","answer":"carry","accepted":["carry"],"type":"choice","cue":"","wordbank":[],"options":["carry","carrying","carried"],"correct":0,"sentence":"Please help me carry the bottles of water."}]}]};
let items=[],index=0,currentTitle='',wrong=new Map(),correct=new Set();
function norm(s){return String(s).trim().toLowerCase().replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/\b(didn't)\b/g,'did not').replace(/\b(don't)\b/g,'do not').replace(/\b(doesn't)\b/g,'does not').replace(/\b(can't)\b/g,'cannot').replace(/\b(isn't)\b/g,'is not').replace(/\b(aren't)\b/g,'are not').replace(/\b(wasn't)\b/g,'was not').replace(/\b(weren't)\b/g,'were not').replace(/[,.!?;:]/g,'').replace(/\s+/g,' ').trim()}
function renderGroups(){const total=DATA.groups.flatMap(g=>g.items).length;$('#groups').innerHTML=`<button class="group-btn" data-all="1"><b>全部練習</b><span>${total} 題｜依原題順序</span></button>`+DATA.groups.map((g,i)=>`<button class="group-btn" data-i="${i}"><b>${esc(g.title)}</b><span>${g.items.length} 題</span></button>`).join('');document.querySelectorAll('.group-btn').forEach(b=>b.onclick=()=>b.dataset.all?start(DATA.groups.flatMap(g=>g.items.map(x=>({...x,group:g.title}))),'全部練習'):start(DATA.groups[+b.dataset.i].items.map(x=>({...x,group:DATA.groups[+b.dataset.i].title})),DATA.groups[+b.dataset.i].title))}
function start(chosen,title){items=chosen;currentTitle=title;index=0;wrong=new Map();correct=new Set();$('#select').classList.add('hidden');$('#result').classList.add('hidden');$('#quiz').classList.remove('hidden');show()}
function renderPassage(item){const p=item.passage||item.factFile||[];if(!p.length){$('#passage').classList.add('hidden');return}$('#passage').innerHTML=(item.factFile?'<h3>Rosa Parks Fact File</h3>':'')+p.map(x=>`<p>${esc(x)}</p>`).join('');$('#passage').classList.remove('hidden')}
function show(){speechSynthesis?.cancel();const item=items[index];$('#meta').textContent=`${item.group||currentTitle}｜第 ${index+1} / ${items.length} 題`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=(index+1)/items.length*100+'%';$('#feedback').className='feedback hidden';$('#reference').classList.add('hidden');$('#voiceBox').classList.add('hidden');$('#check').classList.remove('hidden');$('#next').classList.add('hidden');renderPassage(item);const q=$('#question'),a=$('#answerArea');if(item.type==='edit'){q.innerHTML=`${esc(item.prompt)}<br><span class="edit-target">${esc(item.wrong)}</span>`;a.innerHTML='<input class="answer" spellcheck="false" placeholder="輸入正確片語">'}else{q.textContent=item.prompt;if(item.type==='choice'){a.innerHTML='<div class="options">'+item.options.map((o,i)=>`<label class="option"><input type="radio" name="choice" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')+'</div>'}else if(item.type==='qa'){a.innerHTML='<label>Question<input class="answer q-answer" spellcheck="false" placeholder="依畫線部分寫問句"></label><label>Answer<input class="answer r-answer" spellcheck="false" placeholder="依 Fact File 完整回答"></label>'}else if(item.type==='tf'){a.innerHTML='<div class="options"><label class="option"><input type="radio" name="truth" value="true">That\'s right.</label><label class="option"><input type="radio" name="truth" value="false">That\'s wrong.</label></div>'+(!item.truth?'<input class="answer correction-answer" spellcheck="false" placeholder="若錯誤，請寫出正確句子">':'')}else{a.innerHTML=(item.wordbank?.length?'<div class="wordbank">'+item.wordbank.map(w=>`<span class="word">${esc(w)}</span>`).join('')+'</div>':'')+'<input class="answer" spellcheck="false" placeholder="輸入答案">'}}setTimeout(()=>a.querySelector('input')?.focus(),0)}
function answerText(item){if(item.sentence)return item.sentence;if(item.type==='qa')return `Q: ${item.questionAnswer}\nA: ${item.responseAnswer}`;if(item.type==='tf')return item.truth?"That's right.":`That's wrong. ${item.answer}`;return item.answer||item.options?.[item.correct]||''}
function recordWrong(item,value){const key=item.id;if(!wrong.has(key))wrong.set(key,{item,attempts:[]});wrong.get(key).attempts.push(value);$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
function speak(text=answerText(items[index])){if(!speechSynthesis||!text)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.86;speechSynthesis.speak(u)}
$('#speak').onclick=()=>speak();
$('#check').onclick=()=>{const item=items[index];let ok=false,value='';if(item.type==='choice'){const s=document.querySelector('input[name="choice"]:checked');if(!s)return alert('請先選擇答案。');value=String.fromCharCode(65+(+s.value));ok=+s.value===item.correct}else if(item.type==='qa'){const q=$('.q-answer').value.trim(),r=$('.r-answer').value.trim();if(!q||!r)return alert('請完成問句與答句。');value=`Q: ${q} A: ${r}`;ok=norm(q)===norm(item.questionAnswer)&&norm(r)===norm(item.responseAnswer)}else if(item.type==='tf'){const s=document.querySelector('input[name="truth"]:checked');if(!s)return alert('請先判斷正誤。');const chosen=s.value==='true',correction=$('.correction-answer')?.value.trim()||'';if(!item.truth&&!correction)return alert('請寫出正確句子。');value=chosen?"That's right.":`That's wrong. ${correction}`;ok=chosen===item.truth&&(item.truth||norm(correction)===norm(item.answer))}else{value=$('#answerArea .answer').value.trim();if(!value)return alert('請先輸入答案。');ok=(item.accepted||[item.answer]).some(x=>norm(value)===norm(x))}if(ok){correct.add(item.id);$('#feedback').className='feedback ok';$('#feedback').textContent='✅ 正確！';$('#check').classList.add('hidden');$('#next').classList.remove('hidden');$('#voiceTarget').textContent=answerText(item);$('#voiceBox').classList.remove('hidden');speak()}else{recordWrong(item,value);$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 不正確，請修改後再試。';$('#reference').textContent='參考答案：\n'+answerText(item);$('#reference').classList.remove('hidden')}};
$('#next').onclick=()=>{index++;index>=items.length?finish():show()};$('#finish').onclick=finish;
function finish(){speechSynthesis?.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');$('#summary').innerHTML=`<div class="stat">本輪題數<b>${items.length}</b></div><div class="stat">完成題數<b>${correct.size}</b></div><div class="stat">曾答錯<b>${wrong.size}</b></div>`;$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>`<div class="wrong-card"><b>${i+1}. ${esc(r.item.id)}</b><p>${esc(r.item.prompt||r.item.wrong)}</p><p><strong>作答：</strong>${r.attempts.map(esc).join('；')}</p><p><strong>答案：</strong>${esc(answerText(r.item))}</p></div>`).join(''):'<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size)}
$('#back').onclick=()=>{speechSynthesis?.cancel();$('#quiz').classList.add('hidden');$('#result').classList.add('hidden');$('#select').classList.remove('hidden')};$('#restart').onclick=()=>location.reload();
$('#download').onclick=async()=>{if(!wrong.size)return;try{if(!window.docx)await new Promise((ok,fail)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js';s.onload=ok;s.onerror=fail;document.head.append(s)});const{Document,Packer,Paragraph,TextRun,HeadingLevel}=window.docx,children=[new Paragraph({text:DATA.title+' 錯題紀錄',heading:HeadingLevel.TITLE})];for(const r of wrong.values())children.push(new Paragraph({children:[new TextRun({text:r.item.id,bold:true})]}),new Paragraph(r.item.prompt||r.item.wrong),new Paragraph('作答：'+r.attempts.join('；')),new Paragraph('答案：'+answerText(r.item)));const blob=await Packer.toBlob(new Document({sections:[{children}]})),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='KCIS_'+DATA.title.replace(/\s+/g,'_')+'_錯題.docx';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){alert('目前無法產生 DOCX，請稍後再試。')}};
renderGroups();
</script></body></html>
