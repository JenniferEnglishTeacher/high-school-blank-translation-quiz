  <script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 5｜文法選擇（其他考點）","mode":"mcq","questions":[{"id":1,"question":"Working out at a gym at least three times a week makes Arnold ____________, and that’s why he attracts many girls.","options":["strongly","strong","strength","strengthen"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"本題考點為make + O + adj.，表「使……變得……」，受語補語要使用形容詞來修飾受詞，故答案要選擇strong","explanationSource":"source"},{"id":2,"question":"Tiffany’s father ____________ is a famous basketball coach, often asks the players to practice overtime.","options":[", who",", which","who","that"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"由於先行詞Tiffany’s father所指的對象非常明確且獨特，故在此處要使用關係子句的非限定用法。此外，因為先行詞是「人」，故關代要用who。因此本題答案要選擇「, who」","explanationSource":"source"},{"id":3,"question":"Last night, Grace kept working on her homework ____________ she completed it.","options":["despite","upon","through","until"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"由於在空格後面是完整的子句，故可推知空格裡要用連接詞，而在選項中只有until可以當作連接詞，其他都是介系詞，因此答案要選擇until，意為「直到……」","explanationSource":"source"},{"id":4,"question":"You should eat more fruit and vegetables to ____________ yourself healthy.","options":["keeps","kept","keep","keeping"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"本題考點為用不定詞片語來表達「目的」，故空格裡的答案要選擇原形動詞keep","explanationSource":"source"},{"id":5,"question":"These days, it seems that ____________ and ____________ people buy what they need on the Internet.","options":["more; many","more; more","many; more","many; many"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"由於兩個空格中間有and連接，且後面接複數名詞people，以語意判斷應為「愈來愈多人上網買所需之物」，故可推知考點為「比較級 + and + 比較級」的句型，本題答案要選擇more; more","explanationSource":"source"},{"id":6,"question":"As winter approaches, it is getting ____________. Therefore, be sure to wear a coat or jacket when you go out.","options":["colder","coldly","coldness","colds"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"get為連綴動詞，故後面要接形容詞當作主詞補語，因此答案要選擇colder","explanationSource":"source"},{"id":7,"question":"Last weekend, Jason took his American friends ____________ Shilin Night Market, which is a famous tourist spot.","options":["of","by","on","to"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"本題考點為take sb. to + 地點，表「帶某人到……」，故答案要選擇to","explanationSource":"source"},{"id":8,"question":"According ____________ the news report, a large fire broke out last night, killing dozens of people.","options":["by","of","to","at"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"according to + N表「根據……」","explanationSource":"source"},{"id":9,"question":"Leo is tired of ____________ the same work every day, so he plans to look for a new job.","options":["did","doing","done","do"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"本題考點為be tired of + V-ing，表「厭倦做……」，所以答案要選擇動名詞doing","explanationSource":"source"},{"id":10,"question":"The worker is going to send some furniture from the factory ____________ a store.","options":["to","by","for","within"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"此處所考的是send sth. from A to B的句型，意指「把某物從某處送到另一處」，故答案要選擇to","explanationSource":"source"},{"id":11,"question":"The old man is getting ____________, unable to walk without help.","options":["too weaker","weaker","weakly","more weak"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"get為連綴動詞，後面接形容詞","explanationSource":"source"},{"id":12,"question":"My friends envy my room with a good view, but actually I’m tired ____________ the view.","options":["in","about","of","for"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"be tired of sth. 對……感到厭倦","explanationSource":"source"},{"id":13,"question":"That nice lady lives in the house ____________ mine. She is my neighbor.","options":["next to","far from","besides","between"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"besides「除了……之外」應改為 beside「在……旁邊」才對。next to + N(P) 在……隔壁","explanationSource":"source"},{"id":14,"question":"Issac Newton came up with his theory of gravity when an apple suddenly fell on his head and dropped ____________ the ground.","options":["below","onto","above","upon"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"onto + 地方 到……上 come up with 想出（點子、計畫等）","explanationSource":"source"},{"id":15,"question":"Looking at her baby who died of hunger, the poor sick mother ____________ just cry, feeling helpless and hopeless.","options":["might","would","could","should"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"could表過去只能做……","explanationSource":"source"},{"id":16,"question":"There is a restaurant ____________ which is only open for breakfast and lunch.","options":["near","nearby","along","beside"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"nearby adv. 在附近","explanationSource":"source"},{"id":17,"question":"Ellen asked her friends to leave her ____________ for a while. She said she needed some space.","options":["lonely","around","along","alone"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"leave sb. alone 讓某人獨處","explanationSource":"source"},{"id":18,"question":"The movie Mission Impossible stars Tom Cruise ____________ is no doubt a superstar.","options":["who",", who","that",", that"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"此處使用非限定的形容詞子句補充說明Tom Cruise","explanationSource":"source"},{"id":19,"question":"The grocery store will shut down next month because ____________ customers come to buy goods.","options":["fewer and fewer","less fewer","more or less","a few"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"比較級 and 比較級 愈來愈……","explanationSource":"source"},{"id":20,"question":"Fiona’s meal tasted flat, so most of her dinner guests added salt to ____________ the food better.","options":["let","make","ask","have"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"make + O + adj. 使……變得……","explanationSource":"source"},{"id":21,"question":"Debby got ____________ when she found out she wasn’t invited to the party.","options":["sadly","sadness","angry","angrily"],"answer":2,"answerLabel":"C","source":"三合一學習手冊","explanation":"補充解析：get 是連綴動詞，後接形容詞 angry。Debby 發現自己沒受邀參加派對時生氣了。","explanationSource":"supplement"},{"id":22,"question":"The idea of talking in front of two hundred people on stage makes me ____________. I can’t imagine how horrifying it will be.","options":["worried","nervously","worries","worriedly"],"answer":0,"answerLabel":"A","source":"三合一學習手冊","explanation":"補充解析：make + 受詞 + 形容詞，故選 worried。在兩百人面前上臺說話的想法令我擔心。","explanationSource":"supplement"},{"id":23,"question":"I am tired ____________ doing nothing and waiting for someone to take care of me.","options":["of","with","out","from"],"answer":0,"answerLabel":"A","source":"習作簿","explanation":"補充解析：be tired of + V-ing 表示「厭倦做……」。我厭倦無所事事、等待別人照顧。","explanationSource":"supplement"},{"id":24,"question":"____________ the latest study, a large percentage of senior high students in Taiwan are nearsighted.","options":["According to","As for","Along with","Because of"],"answer":0,"answerLabel":"A","source":"習作簿","explanation":"補充解析：according to 表示「根據」。根據最新研究，臺灣有很高比例的高中生近視。","explanationSource":"supplement"},{"id":25,"question":"There are seven different ways to walk from my home ____________ the office, one for each day of the week.","options":["till","between","and","to"],"answer":3,"answerLabel":"D","source":"習作簿","explanation":"補充解析：from A to B 表示「從 A 到 B」，故選 to。從我家走到辦公室有七條不同路線。","explanationSource":"supplement"},{"id":26,"question":"Job interviews always ____________ Sam nervous, so he does a lot of preparation every time he has one.","options":["have","make","let","put"],"answer":1,"answerLabel":"B","source":"三合一學習手冊","explanation":"補充解析：make + 受詞 + 形容詞表示「使……變得……」。面試總讓 Sam 緊張，所以他每次都充分準備。","explanationSource":"supplement"},{"id":27,"question":"Whenever I get ____________ during the day, I take a short walk to refresh myself.","options":["tired","tiredly","tiredness","tiring"],"answer":0,"answerLabel":"A","source":"三合一學習手冊","explanation":"補充解析：get 後接形容詞 tired。白天感到疲倦時，我會散步片刻讓自己恢復精神。","explanationSource":"supplement"}]};</script>
