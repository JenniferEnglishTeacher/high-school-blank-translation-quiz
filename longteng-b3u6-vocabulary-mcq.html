rder-radius:9px;color:var(--amber);font-weight:800;margin-bottom:10px}.question{font-size:21px;font-weight:750;padding:16px;background:#f8fafc;border-radius:11px;white-space:pre-wrap}.options{display:grid;gap:9px;margin:14px 0}.option{display:flex;align-items:center;gap:11px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-size:18px;font-weight:750;cursor:pointer}.option:hover{border-color:#60a5fa;background:#eff6ff}.option:has(input:checked){border-color:var(--blue);background:#dbeafe;color:var(--navy)}.option input{width:20px;height:20px;accent-color:var(--blue)}.inputs{display:grid;gap:10px;margin:15px 0}.answer-row{display:grid;grid-template-columns:55px 1fr;gap:10px;align-items:center}.answer-row label{font-weight:900;color:var(--navy);text-align:center}.spell{width:100%;font:inherit;font-size:18px;padding:11px;border:2px solid #94a3b8;border-radius:9px}.feedback{padding:13px;border-radius:10px;font-weight:800;margin:13px 0}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.explain{font-weight:500;margin-top:7px}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:var(--voicebg);margin:13px 0}.voicebox b{display:block;font-size:19px;margin-bottom:8px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}.wrong p{margin:6px 0}.source{font-size:13px;color:var(--muted)}@media(max-width:600px){.wrap{padding:9px}.hero,.card{padding:15px}.question{font-size:18px;padding:13px}.option{font-size:17px}.answer-row{grid-template-columns:42px 1fr}.meta{display:block}}</style><link rel="stylesheet" href="longteng-vocab-required-pronunciation.css?v=20261026-4"></head><body><main class="wrap"><section class="hero"><h1>龍騰普高 B3U6 單字選擇</h1><p>共 30 題。可自行選題、隨機抽題；答錯後請重新作答。</p><p class="note">答對後顯示來源解析並播放完整英文句；STT 朗讀達 80% 才能進入下一題。完成後可重做錯題並下載 DOCX。</p><div class="toolbar"><a class="btn" href="dashboard.html">← 回測驗總覽</a></div></section><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn">全部選取</button><button id="none" class="btn">全部取消</button><button id="rand20" class="btn">隨機 20 題</button></div><label><input id="shuffle" type="checkbox"> 打亂出題順序</label><div id="list"></div><div class="actions"><button id="start" class="btn primary">開始作答</button><span id="picked" class="note"></span></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="voiceBox" class="voicebox hidden"><b id="voiceTarget"></b><button id="speak" class="btn voice">🔊 再聽一次</button></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="retry" class="btn primary">只重做錯題</button><button id="download" class="btn">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></main><script>const TITLE="龍騰普高 B3U6 單字選擇",MODE="mcq",Q=[{"id":1,"question":"The ____________ of the hill makes it difficult for the hikers to climb to the top without taking a break.","options":["bruise","slope","crop","gaze"],"answer":1,"explanation":"這山丘的斜坡使登山客很難不休息就爬到山頂。 (A)瘀傷；碰傷 (B)斜坡；坡地 (C)作物；莊稼 (D)凝視；注視","source":"龍騰自命題"},{"id":2,"question":"The little boy came home with a(n) ____________ face after he had a fight with his friend in the park.","options":["superior","intimate","skillful","bruised"],"answer":3,"explanation":"這位小男孩在公園和朋友打了一架之後帶著瘀傷的臉回家。 (A)優於；更好的 (B)密切的；親密的 (C)熟練的 (D)瘀傷的；碰傷的","source":"龍騰自命題"},{"id":3,"question":"After months of hard work, the ____________ of tomatoes is finally ready to be picked.","options":["crop","path","gaze","pity"],"answer":0,"explanation":"經過數月的努力之後，番茄的作物終於準備可以收成。 (A)作物；莊稼 (B)小路；小徑 (C)凝視；注視 (D)憐憫；同情","source":"龍騰自命題"},{"id":4,"question":"We walked along the ____________ in the park, enjoying the warm sunshine and the sound of birds singing nearby.","options":["pity","crop","path","gaze"],"answer":2,"explanation":"我們沿著公園的小徑走，享受溫暖的陽光以及附近的鳥鳴聲。 (A)憐憫；同情 (B)作物；莊稼 (C)小路；小徑 (D)凝視；注視","source":"龍騰自命題"},{"id":5,"question":"Amy felt like a(n) ____________ at the party because she didn’t share the same interests as the others.","options":["dilemma","outsider","twinkle","superior"],"answer":1,"explanation":"Amy覺得自己在這場派對像個外人，因為她和其他人並沒有共同的興趣。 (A)進退兩難的困境 (B)外人；外來者 (C)閃耀；閃亮 (D)上司；上級","source":"龍騰自命題"},{"id":6,"question":"If you move to a new country, it can take you some time to ____________ to the new culture and customs.","options":["confront","oppose","flee","adapt"],"answer":3,"explanation":"如果你搬到一個新國家，你會花一些時間去適應新的文化與習俗。 (A)面臨；面對 (B)反對；抵制 (C)逃離；逃跑 (D)（使）適應；（使）適合","source":"龍騰自命題"},{"id":7,"question":"Linda didn’t want anyone to ____________ her after she fell during the race, so she kept smiling.","options":["adapt","flee","pity","gaze"],"answer":2,"explanation":"在賽跑時跌倒之後，Linda不想要任何人同情她，所以她保持微笑。 (A)（使）適應；（使）適合 (B)逃離；逃跑 (C)憐憫；同情 (D)凝視；注視","source":"龍騰自命題"},{"id":8,"question":"Tom often ____________ out of window during class, daydreaming about the coming summer vacation.","options":["adapted","opposed","gazed","bruised"],"answer":2,"explanation":"Tom上課時常常凝視窗外，幻想著即將來臨的暑假。 (A)（使）適應；（使）適合 (B)反對；抵制 (C)凝視；注視 (D)使出現瘀傷；撞傷","source":"龍騰自命題"},{"id":9,"question":"We watched in surprise as the pile of books started to ____________ to the floor when the cat jumped onto the table.","options":["tumble","oppose","twinkle","bruise"],"answer":0,"explanation":"當貓跳上桌時，我們驚訝地看著這堆書開始掉落至地面。 (A)滾落 (B)反對；抵制 (C)閃耀；閃亮 (D)使出現瘀傷；撞傷","source":"龍騰自命題"},{"id":10,"question":"The thief attempted to ____________ the scene, but the police officers quickly arrested him before he could make his escape.","options":["pity","flee","gaze","bruise"],"answer":1,"explanation":"那名小偷試圖逃離現場，但在他逃脫之前警察便迅速地將他逮捕。 (A)憐憫；同情 (B)逃離；逃跑 (C)凝視；注視 (D)使出現瘀傷；撞傷","source":"龍騰自命題"},{"id":11,"question":"The weather conditions were not ideal for outdoor events; ______, the festival still attracted a large crowd.","options":["similarly","instead","nevertheless","immediately"],"answer":2,"explanation":"天氣狀況對於戶外活動來說並不理想；儘管如此，這場慶祝活動仍然吸引大量群眾。 (A)同樣地 (B)相反地 (C)儘管如此；然而 (D)立即地","source":"龍騰自命題"},{"id":12,"question":"The mayor’s ____________ lay in deciding whether to spend the town’s budget on improving the schools or repairing the roads.","options":["intimacy","twinkle","superior","dilemma"],"answer":3,"explanation":"市長的兩難在於決定要將城鎮預算花在改善學校上，還是用於修繕道路。 (A)密切；親密 (B)閃耀；閃亮 (C)上司；上級 (D)進退兩難的困境","source":"龍騰自命題"},{"id":13,"question":"Concerned about their safety, the workers decided to ____________ the manager about the unsafe working conditions in the factory.","options":["confront","oppose","twinkle","tumble"],"answer":0,"explanation":"由於擔心他們的安全，工人們決定面對經理談論工廠不安全的工作環境。 (A)面臨；面對 (B)反對；抵制 (C)閃耀；閃亮 (D)滾落","source":"龍騰自命題"},{"id":14,"question":"The ____________ design of the building, with its unusual angles and bold color, stood out against the skyline.","options":["bruised","peculiar","intimate","skillful"],"answer":1,"explanation":"這棟大樓獨特的設計，以它不尋常的角度和大膽的顏色，在天際線特別凸出。 (A)瘀傷的；碰傷的 (B)奇怪的；不尋常的 (C)密切的；親密的 (D)熟練的","source":"龍騰自命題"},{"id":15,"question":"Although there was ____________ from the local residents, the project went ahead as planned.","options":["intimacy","dilemma","adaptation","opposition"],"answer":3,"explanation":"儘管當地居民的反對，該計畫仍按原定規畫進行。 (A)密切；親密 (B)進退兩難的困境 (C)改編 (D)反對；抵制","source":"龍騰自命題"},{"id":16,"question":"The ____________ design of the latest cell phone makes it feel both modern and comfortable in the hand.","options":["bruised","twinkling","smooth","intimate"],"answer":2,"explanation":"最新款手機的平滑設計使它感覺既有現代感，拿在手中也很舒適。 (A)瘀傷的；碰傷的 (B)閃耀的；閃爍的 (C)平滑的；平整的 (D)密切的；親密的","source":"龍騰自命題"},{"id":17,"question":"All the children watched in ____________ as the magician pulled a scarf out of his hat, amazed by his skill.","options":["path","awe","gaze","pity"],"answer":1,"explanation":"當魔術師從他的帽子裡拉出一條領巾時，所有的小孩都敬畏地看著，對於他的技術感到驚訝。 (A)小路；小徑 (B)敬畏 (C)凝視；注視 (D)憐憫；同情","source":"龍騰自命題"},{"id":18,"question":"Little children tend to ____________ to their parents whenever they feel nervous in unfamiliar situations.","options":["cling","adapt","oppose","tumble"],"answer":0,"explanation":"每當他們在不熟悉的環境感到緊張時，小孩們傾向緊抓著他們父母親。 (A)抓緊；緊握 (B)（使）適應；（使）適合 (C)反對；抵制 (D)滾落","source":"龍騰自命題"},{"id":19,"question":"In our play, the director made a(n) ____________ of the original story to make it easier for kids to understand.","options":["adaptation","opposition","superiority","confrontation"],"answer":0,"explanation":"在我們這齣戲，導演把原來的故事改編使其對於小孩來說更容易理解。 (A)改編 (B)反對；抵制 (C)優越（性）；優勢 (D)衝突；對抗","source":"龍騰自命題"},{"id":20,"question":"The captain had to ____________ the ship carefully through the narrow channel to avoid hitting the rocks.","options":["oppose","confront","navigate","tumble"],"answer":2,"explanation":"船長必須小心地航行船隻通過這狹窄的水道以避免撞到岩石。 (A)反對；抵制 (B)面臨；面對 (C)（人）行走、確認方向；（船隻、車輛或飛機等）航行 (D)滾落","source":"龍騰自命題"},{"id":21,"question":"The chef ____________ arranged the ingredients on the plate, turning a simple dish into a work of art.","options":["regularly","skillfully","intimately","gradually"],"answer":1,"explanation":"主廚熟練地擺放盤中的食物，將一道簡單的料理變成一個藝術作品。 (A)規律地 (B)熟練地 (C)了如指掌地；密切地 (D)逐漸地","source":"龍騰自命題"},{"id":22,"question":"The best memory for Alice during the trip was having a(n) ____________ dinner on the beach with her husband at sunset.","options":["bruised","superior","skillful","intimate"],"answer":3,"explanation":"Alice這趟旅程最棒的回憶是日落時和她的丈夫在海邊共享一頓親密的晚餐。 (A)瘀傷的；碰傷的 (B)優於；更好的 (C)熟練的 (D)密切的；親密的","source":"龍騰自命題"},{"id":23,"question":"The ____________ design and quality of this piece of furniture made it a popular choice among customers.","options":["bruised","sightless","intimate","superior"],"answer":3,"explanation":"這件家具卓越的設計和品質使它成為顧客間受歡迎的選擇。 (A)瘀傷的；碰傷的 (B)看不見的；眼盲的 (C)密切的；親密的 (D)優於；更好的","source":"龍騰自命題"},{"id":24,"question":"The doctor said that the ____________ on my cheek would turn darker over the next few days and heal in a few weeks.","options":["twinkle","superior","slope","bruise"],"answer":3,"explanation":"醫生說我臉頰上的瘀傷接下來幾天顏色會變深，然後幾週後便會痊癒。 (A)閃耀；閃亮 (B)上司；上級 (C)斜坡；坡地 (D)瘀傷；碰傷","source":"龍騰自命題"},{"id":25,"question":"The scientist’s research was widely recognized, but his sense of ____________ made it difficult for other people to cooperate with him in group projects.","options":["opposition","adaptation","superiority","intimacy"],"answer":2,"explanation":"這位科學家的研究受到廣泛地認可，但是他的優越感使其他人很難和他在團隊計畫中合作。 (A)反對；抵制 (B)改編 (C)優越（性）；優勢 (D)密切；親密","source":"龍騰自命題"},{"id":26,"question":"The couple believed their shared memories would create a bond of ____________ that would enable them to navigate even the most difficult challenges.","options":["intimacy","superiority","outsider","opposition"],"answer":0,"explanation":"這對夫妻相信他們共享的回憶將會形成親密連結，而使他們能夠度過最困難的挑戰。 (A)密切；親密 (B)優越（性）；優勢 (C)外人；外來者 (D)反對；抵制","source":"龍騰自命題"},{"id":27,"question":"Researchers are developing an advanced ____________ system to help self-driving automobiles better respond to real-time traffic conditions.","options":["confrontation","opposition","adaptation","navigation"],"answer":3,"explanation":"研究者正在開發先進的導航系統來幫助自駕車能夠更好地回應即時交通狀況。 (A)衝突；對抗 (B)反對；抵制 (C)改編 (D)航行；導航","source":"龍騰自命題"},{"id":28,"question":"Following the ____________ in the demonstration, the police increased security measures to ensure the safety of all those involved.","options":["adaptation","confrontation","navigation","opposition"],"answer":1,"explanation":"緊接在示威衝突之後，警方加強了安全措施來確保所有參與者的安全。 (A)改編 (B)衝突；對抗 (C)航行；導航 (D)反對；抵制","source":"龍騰自命題"},{"id":29,"question":"The architect ____________ a city where modern technology and nature existed in perfect harmony, leading to a sustainable future.","options":["envisioned","navigated","confronted","twinkled"],"answer":0,"explanation":"這名建築師想像了一座現代科技與大自然和諧並存，通往永續未來的城市。 (A)想像；嚮往 (B)（人）行走、確認方向；（船隻、車輛或飛機等）航行 (C)面臨；面對 (D)閃耀；閃亮","source":"龍騰自命題"},{"id":30,"question":"The ____________ of excitement in the girl’s eyes made it clear that she had a secret she was eager to share with us.","options":["dilemma","intimacy","bruise","twinkle"],"answer":3,"explanation":"這名女孩眼中興奮的光彩明顯地透露出她有個祕密迫切地要和我們分享。 (A)進退兩難的困境 (B)密切；親密 (C)瘀傷；碰傷 (D)閃耀；閃亮","source":"龍騰自命題"}];const $=s=>document.querySelector(s),list=$('#list'),select=$('#select'),quiz=$('#quiz'),result=$('#result'),question=$('#question'),answerArea=$('#answerArea'),feedback=$('#feedback'),next=$('#next');let chosen=[],idx=0,mode='first';const wrong=new Map(),correct=new Set();const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ');const shuffled=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function renderList(){list.innerHTML=Q.map(q=>'<label class="pick"><input class="pickbox" type="checkbox" value="'+q.id+'" checked><b>第 '+q.id+' 題</b> <span class="source">'+esc(q.source||'')+'</span></label>').join('');count()}function count(){$('#picked').textContent='已選 '+document.querySelectorAll('.pickbox:checked').length+' 題'}list.addEventListener('change',count);$('#all').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=true);count()};$('#none').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=false);count()};$('#rand20').onclick=()=>{let ids=new Set(shuffled(Q).slice(0,Math.min answer:a.every((x,i)=>q.answers[i].split(/\|\||\//).some(v=>norm(x)===norm(v)))}function completedSentence(q){if(MODE==='mcq'){let s=q.question,v=q.options[q.answer],parts=(s.match(/_{3,}/g)||[]).length>1&&v.includes(';')?v.split(';').map(x=>x.trim()):[v];parts.forEach(x=>s=s.replace(/_{3,}/,x));return s}if(MODE==='spell')return q.question.replace(/[A-Za-z]?_{3,}[A-Za-z]?/,q.answers[0].split('||')[0]);let s=q.question,marks=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];q.answers.forEach((a,i)=>{let value=a.split('||')[0];let re=new RegExp(marks[i]+'\\s*[A-Za-z]?_{3,}[A-Za-z]?');if(re.test(s))s=s.replace(re,value);else s=s.replace(/_{3,}/,value)});return s.replace(/[①-⑩]/g,'')}function speak(){if(!speechSynthesis)return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance($('#voiceTarget').textContent);u.lang='en-US';u.rate=.86;speechSynthesis.speak(u)}$('#speak').onclick=speak;$('#check').onclick=()=>{const q=chosen[idx],a=currentAnswers();if((MODE==='mcq'&&!a.length)||(MODE!=='mcq'&&(a.length!==q.answers.length||a.some(x=>!x.trim()))))return alert('請完成所有答案。');if(isCorrect(q,a)){correct.add(q.id);feedback.className='feedback ok';feedback.innerHTML='✅ 全部正確！'+(q.explanation?'<div class="explain">解析：'+esc(q.explanation)+'</div>':'');$('#check').classList.add('hidden');next.classList.remove('hidden');$('#voiceTarget').textContent=completedSentence(q);$('#voiceBox').classList.remove('hidden');speak()}else{if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(MODE==='mcq'?String.fromCharCode(65+a[0]):a.join(' / '));$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';feedback.className='feedback bad';feedback.innerHTML='❌ 答案不正確。正確答案：<strong>'+esc(correctText(q))+'</strong><br>請重新作答。'+(q.explanation?'<div class="explain">解析：'+esc(q.explanation)+'</div>':'');if(MODE==='mcq')answerArea.querySelectorAll('input').forEach(x=>x.checked=false);else answerArea.querySelectorAll('.spell').forEach(x=>x.value='');answerArea.querySelector('input')?.focus()}};next.onclick=()=>{idx++;idx>=chosen.length?finish():show()};$('#finish').onclick=finish;function finish(){speechSynthesis?.cancel();quiz.classList.add('hidden');result.classList.remove('hidden');$('#summary').innerHTML='<div class="stat">本輪題數<b>'+chosen.length+'</b></div><div class="stat">完成答對<b>'+correct.size+'</b></div><div class="stat">曾答錯<b>'+wrong.size+'</b></div>';$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>'<div class="wrong"><b>'+(i+1)+'. 第 '+r.q.id+' 題</b><p>'+esc((r.q.zh?r.q.zh+'\n':'')+r.q.question)+'</p><p><strong>錯誤答案：</strong>'+r.attempts.map(esc).join('；')+'</p><p><strong>正確答案：</strong>'+esc(correctText(r.q))+'</p>'+(r.q.explanation?'<p><strong>解析：</strong>'+esc(r.q.explanation)+'</p>':'')+'</div>').join(''):'<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size);$('#retry').classList.toggle('hidden',!wrong.size)}$('#retry').onclick=()=>{chosen=[...wrong.values()].map(x=>x.q);idx=0;mode='retry';correct.clear();result.classList.add('hidden');quiz.classList.remove('hidden');show()};$('#restart').onclick=()=>location.reload();$('#download').onclick=async()=>{if(!wrong.size)return;try{if(!window.docx)await new Promise((ok,fail)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js';s.onload=ok;s.onerror=fail;document.head.append(s)});let{Document,Packer,Paragraph,TextRun,HeadingLevel}=window.docx,children=[new Paragraph({text:TITLE+' 錯題紀錄',heading:HeadingLevel.TITLE})];for(const [_,r] of wrong){children.push(new Paragraph({children:[new TextRun({text:'第 '+r.q.id+' 題',bold:true})]}));if(r.q.zh)children.push(new Paragraph(r.q.zh));children.push(new Paragraph(r.q.question),new Paragraph('錯誤答案：'+r.attempts.join('；')),new Paragraph('正確答案：'+correctText(r.q)));if(r.q.explanation)children.push(new Paragraph('解析：'+r.q.explanation));children.push(new Paragraph('重新作答：________________________________________'))}let blob=await Packer.toBlob(new Document({sections:[{children}]})),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=TITLE+'_錯題.docx';a.click();URL.revokeObjectURL(url)}catch(e){let text=[...wrong.values()].map(r=>'第 '+r.q.id+' 題\n'+(r.q.zh?r.q.zh+'\n':'')+r.q.question+'\n錯誤答案：'+r.attempts.join('；')+'\n正確答案：'+correctText(r.q)+(r.q.explanation?'\n解析：'+r.q.explanation:'')).join('\n\n');let blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=TITLE+'_錯題.txt';a.click();URL.revokeObjectURL(url)}};renderList();</script><script src="longteng-vocab-required-pronunciation.js?v=20261111-1"></script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
