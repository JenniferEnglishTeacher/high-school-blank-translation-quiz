<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="龍騰普高 B3R3 單字選擇互動練習"><title>龍騰普高 B3R3 單字選擇</title><style>:root{--blue:#2563eb;--navy:#1e3a8a;--bg:#f4f7fb;--card:#fff;--line:#dbe3ee;--ink:#172033;--muted:#64748b;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--voice:#6d28d9;--voicebg:#f5f3ff;--amber:#9a3412;--amberbg:#fff7ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}.wrap{max-width:920px;margin:auto;padding:16px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 5px 18px #0f172a0d}.hero{background:linear-gradient(135deg,#e8f1ff,#fff)}h1{margin:0 0 6px;font-size:clamp(25px,4vw,38px)}h2{margin-top:0}.note{color:var(--muted)}.hidden{display:none!important}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.btn{border:0;border-radius:10px;padding:11px 17px;font:800 16px inherit;cursor:pointer;background:#e5e7eb;color:var(--ink);text-decoration:none}.primary{background:var(--blue);color:#fff}.danger{background:#991b1b;color:#fff}.voice{background:var(--voice);color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.btn:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.pick{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin:7px 0;background:#fafcff}.pick input{margin-right:8px;width:17px;height:17px;accent-color:var(--blue)}#list{max-height:440px;overflow:auto;border:1px solid var(--line);padding:7px;border-radius:12px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:800;margin:8px 0 14px}.zh{padding:10px 13px;background:var(--amberbg);border-radius:9px;color:var(--amber);font-weight:800;margin-bottom:10px}.question{font-size:21px;font-weight:750;padding:16px;background:#f8fafc;border-radius:11px;white-space:pre-wrap}.options{display:grid;gap:9px;margin:14px 0}.option{display:flex;align-items:center;gap:11px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-size:18px;font-weight:750;cursor:pointer}.option:hover{border-color:#60a5fa;background:#eff6ff}.option:has(input:checked){border-color:var(--blue);background:#dbeafe;color:var(--navy)}.option input{width:20px;height:20px;accent-color:var(--blue)}.inputs{display:grid;gap:10px;margin:15px 0}.answer-row{display:grid;grid-template-columns:55px 1fr;gap:10px;align-items:center}.answer-row label{font-weight:900;color:var(--navy);text-align:center}.spell{width:100%;font:inherit;font-size:18px;padding:11px;border:2px solid #94a3b8;border-radius:9px}.feedback{padding:13px;border-radius:10px;font-weight:800;margin:13px 0}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.explain{font-weight:500;margin-top:7px}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:var(--voicebg);margin:13px 0}.voicebox b{display:block;font-size:19px;margin-bottom:8px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}.wrong p{margin:6px 0}.source{font-size:13px;color:var(--muted)}@media(max-width:600px){.wrap{padding:9px}.hero,.card{padding:15px}.question{font-size:18px;padding:13px}.option{font-size:17px}.answer-row{grid-template-columns:42px 1fr}.meta{display:block}}</style><link rel="stylesheet" href="longteng-vocab-required-pronunciation.css?v=20261026-4"></head><body><main class="wrap"><section class="hero"><h1>龍騰普高 B3R3 單字選擇</h1><p>共 15 題。可自行選題、隨機抽題；答錯後請重新作答。</p><p class="note">答對後顯示來源解析並播放完整英文句；STT 朗讀達 80% 才能進入下一題。完成後可重做錯題並下載 DOCX。</p><div class="toolbar"><a class="btn" href="dashboard.html">← 回測驗總覽</a></div></section><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn">全部選取</button><button id="none" class="btn">全部取消</button><button id="rand20" class="btn">隨機 20 題</button></div><label><input id="shuffle" type="checkbox"> 打亂出題順序</label><div id="list"></div><div class="actions"><button id="start" class="btn primary">開始作答</button><span id="picked" class="note"></span></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="voiceBox" class="voicebox hidden"><b id="voiceTarget"></b><button id="speak" class="btn voice">🔊 再聽一次</button></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="retry" class="btn primary">只重做錯題</button><button id="download" class="btn">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></main><script>const TITLE="龍騰普高 B3R3 單字選擇",MODE="mcq",Q=[{"id":1,"question":"The only ____________ to the island is by boat. You should book your ticket two months in advance.","options":["wage","trend","access","benefit"],"answer":2,"explanation":"到那個島的唯一途徑是搭船。你應該在兩個月前訂票。access to為搭配詞，表示「通往……的途徑」。 (A)工資 (B)潮流 (C)途徑 (D)利益","source":"龍騰自命題"},{"id":2,"question":"Even in a crowd of people, the dog can easily trace the ____________ smell of her one and only owner.","options":["stylish","distinctive","responsible","minimal"],"answer":1,"explanation":"即使在人群中，這隻狗也能很容易地追踪到她唯一無二的主人的獨特氣味。 (A)時髦的 (B)獨特的 (C)負責任的 (D)極少的","source":"龍騰自命題"},{"id":3,"question":"Students ____________ a lot from reading English magazines. They learn not only English but also new information.","options":["suffer","benefit","emerge","graduate"],"answer":1,"explanation":"學生從閱讀英文雜誌獲益良多。他們不但學習英文也學到了一些新知。benefit from為搭配詞，表示「得益於……」。 (A)受……所苦 (B)得益於……；對……有益 (C)出現；浮現 (D)畢業","source":"龍騰自命題"},{"id":4,"question":"In his position in the human resources department, Larry is ____________ for the recruitment and training of new employees.","options":["adequate","exhausted","responsible","enthusiastic"],"answer":2,"explanation":"在人力資源部門工作，Larry負責新進員工的招募和訓練。be responsible for為搭配詞，表示「負責……」。 (A)充足的；足夠的 (B)筋疲力竭的 (C)負責的 (D)熱心的","source":"龍騰自命題"},{"id":5,"question":"This book teaches its readers how to ____________ their negative thoughts into positive ones, helping them become more optimistic people.","options":["access","exploit","contribute","transform"],"answer":3,"explanation":"這本書教讀者如何將負面想法轉換為正面，幫助他們變得更樂觀。 (A)途徑；（接近……的）機會（或方法） (B)剝削 (C)貢獻 (D)轉換","source":"龍騰自命題"},{"id":6,"question":"The ____________ for food delivery services has been growing rapidly as consumers increasingly value convenience when it comes to their dining options.","options":["access","demand","situation","regulation"],"answer":1,"explanation":"對於食物外送服務的需求快速增加，因為當提到用餐選擇時，消費者愈來愈重視便利性。 (A)途徑；（接近……的）機會（或方法） (B)需求 (C)情況 (D)法規","source":"龍騰自命題"},{"id":7,"question":"The teacher hopes everyone will ____________ to the class discussion. Students are encouraged to actively participate instead of just listening.","options":["attach","access","benefit","contribute"],"answer":3,"explanation":"老師希望每個人都可以對課堂討論有所貢獻。學生被鼓勵主動參與討論，而非只是聆聽。contribute to為搭配詞，表示「對……有所貢獻」。 (A)附上 (B)進入；取得（資料） (C)得益於……；對……有益 (D)貢獻","source":"龍騰自命題"},{"id":8,"question":"There are three nuclear power plants in ____________ now. People are still debating whether we should continue using them or replace nuclear power with alternative energy sources.","options":["abuse","fashion","authority","operation"],"answer":3,"explanation":"現在有三個核能發電廠營運中。人們仍在爭論我們是否應該繼續使用它們或是用替代能源取代核能。in operation為搭配詞，表示「營運中」。 (A)虐待；濫用 (B)時尚 (C)權力；權威；當權（地位） (D)營運","source":"龍騰自命題"},{"id":9,"question":"They ____________ lots of old things before they moved to America. They couldn’t bring too many things with them.","options":["discarded","demanded","designated","dominated"],"answer":0,"explanation":"在搬去美國前，他們丟棄許多舊東西。他們沒辦法帶太多東西。 (A)丟棄 (B)要求 (C)指派 (D)支配","source":"龍騰自命題"},{"id":10,"question":"More and more people expect businesses to be socially responsible, and tend to prefer buying ____________ produced products.","options":["adequately","minimally","sustainably","undoubtedly"],"answer":2,"explanation":"愈來愈多人期待企業的社會責任，而且傾向購買永續生產的產品。 (A)充足地 (B)極少地 (C)永續地 (D)無疑地","source":"龍騰自命題"},{"id":11,"question":"To keep up with fashion ____________, you should invest in a pair of knee-high boots, which will be an essential part of every girl’s wardrobe this winter!","options":["trends","demands","situations","regulations"],"answer":0,"explanation":"要跟上流行趨勢，你應該投資一雙高筒靴，這是每個女孩衣櫃今年冬天必備的！ (A)趨勢 (B)需求 (C)情況 (D)法規","source":"龍騰自命題"},{"id":12,"question":"Everyone should follow traffic ____________; otherwise, there will be lots of accidents.","options":["situations","operations","regulations","contributions"],"answer":2,"explanation":"每個人都應該遵守交通法規；否則就會有很多事故。 (A)情況 (B)營運 (C)法規 (D)貢獻","source":"龍騰自命題"},{"id":13,"question":"The ____________ earthquake claimed more than ten thousand lives, and destroyed twenty villages.","options":["toxic","minimal","sustainable","devastating"],"answer":3,"explanation":"那場毀滅性的地震奪去了超過一萬人的生命，摧毀了二十座村莊。 (A)有毒的 (B)極少的 (C)永續的 (D)毀滅性的；令人震驚的","source":"龍騰自命題"},{"id":14,"question":"The diamond company is accused of ____________ child labor. Many consumers therefore refuse to buy its products.","options":["supplying","benefiting","exploiting","dominating"],"answer":2,"explanation":"那個鑽石公司被指控剝削童工。許多消費者因此拒絕購賣它的產品。 (A)供給 (B)對……有益 (C)剝削 (D)支配","source":"龍騰自命題"},{"id":15,"question":"Although everyone was convinced that Simpson was the murderer, the jury didn’t have ____________ evidence to convict him.","options":["minimal","adequate","undoubted","sustainable"],"answer":1,"explanation":"雖然大家都相信辛普森是謀殺者，但陪審團沒有足夠證據將他定罪。 (A)極少的 (B)充足的；足夠的 (C)無疑的 (D)永續的","source":"龍騰自命題"}];const $=s=>document.querySelector(s),list=$('#list'),select=$('#select'),quiz=$('#quiz'),result=$('#result'),question=$('#question'),answerArea=$('#answerArea'),feedback=$('#feedback'),next=$('#next');let chosen=[],idx=0,mode='first';const wrong=new Map(),correct=new Set();const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ');const shuffled=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function renderList(){list.innerHTML=Q.map(q=>'<label class="pick"><input class="pickbox" type="checkbox" value="'+q.id+'" checked><b>第 '+q.id+' 題</b> <span class="source">'+esc(q.source||'')+'</span></label>').join('');count()}function count(){$('#picked').textContent='已選 '+document.querySelectorAll('.pickbox:checked').length+' 題'}list.addEventListener('change',count);$('#all').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=true);count()};$('#none').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=false);count()};$('#rand20').onclick=()=>{let ids=new Set(shuffled(Q).slice(0,Math.min(20,Q.length)).map(q=>q.id));document.querySelectorAll('.pickbox').forEach(x=>x.checked=ids.has(+x.value));count()};$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));if($('#shuffle').checked)chosen=shuffled(chosen);idx=0;mode='first';wrong.clear();correct.clear();select.classList.add('hidden');result.classList.add('hidden');quiz.classList.remove('hidden');show()};function show(){const q=chosen[idx];speechSynthesis?.cancel();$('#meta').textContent=(mode==='retry'?'錯題重做｜':'')+'第 '+(idx+1)+' / '+chosen.length+' 題';$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';$('#bar').style.width=(idx+1)/chosen.length*100+'%';question.textContent=q.question;const zh=$('#zh');if(q.zh){zh.textContent=q.zh;zh.classList.remove('hidden')}else zh.classList.add('hidden');feedback.className='feedback hidden';$('#voiceBox').classList.add('hidden');$('#check').classList.remove('hidden');next.classList.add('hidden');if(MODE==='mcq')answerArea.innerHTML='<div class="options">'+q.options.map((o,i)=>'<label class="option"><input type="radio" name="answer" value="'+i+'"><b>'+String.fromCharCode(65+i)+'.</b> '+esc(o)+'</label>').join('')+'</div>';else answerArea.innerHTML='<div class="inputs">'+q.answers.map((_,i)=>'<div class="answer-row"><label>'+(MODE==='multi'?['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'][i]:'答案')+'</label><input class="spell" autocomplete="off" spellcheck="false" placeholder="請輸入完整答案"></div>').join('')+'</div>';setTimeout(()=>answerArea.querySelector('input')?.focus(),0)}function currentAnswers(){if(MODE==='mcq'){const x=answerArea.querySelector('input:checked');return x?[+x.value]:[]}return [...answerArea.querySelectorAll('.spell')].map(x=>x.value)}function correctText(q){return MODE==='mcq'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.answers.map(a=>a.split('||')[0]).join(' / ')}function isCorrect(q,a){return MODE==='mcq'?a[0]===q.answer:a.every((x,i)=>q.answers[i].split(/\|\||\//).some(v=>norm(x)===norm(v)))}function completedSentence(q){if(MODE==='mcq'){let s=q.question,v=q.options[q.answer],parts=(s.match(/_{3,}/g)||[]).length>1&&v.includes(';')?v.split(';').map(x=>x.trim()):[v];parts.forEach(x=>s=s.replace(/_{3,}/,x));return s}if(MODE==='spell')return q.question.replace(/[A-Za-z]?_{3,}[A-Za-z]?/,q.answers[0].split('||')[0]);let s=q.question,marks=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];q.answers.forEach((a,i)=>{let value=a.split('||')[0];let re=new RegExp(marks[i]+'\\s*[A-Za-z]?_{3,}[A-Za-z]?');if(re.test(s))s=s.replace(re,value);else s=s.replace(/_{3,}/,value)});return s.replace(/[①-⑩]/g,'')}function speak(){if(!speechSynthesis)return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance($('#voiceTarget').textContent);u.lang='en-US';u.rate=.86;speechSynthesis.speak(u)}$('#speak').onclick=speak;$('#check').onclick=()=>{const q=chosen[idx],a=currentAnswers();if((MODE==='mcq'&&!a.length)||(MODE!=='mcq'&&(a.length!==q.answers.length||a.some(x=>!x.trim()))))return alert('請完成所有答案。');if(isCorrect(q,a)){correct.add(q.id);feedback.className='feedback ok';feedback.innerHTML='✅ 全部正確！'+(q.explanation?'<div class="explain">解析：'+esc(q.explanation)+'</div>':'');$('#check').classList.add('hidden');next.classList.remove('hidden');$('#voiceTarget').textContent=completedSentence(q);$('#voiceBox').classList.remove('hidden');speak()}else{if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(MODE==='mcq'?String.fromCharCode(65+a[0]):a.join(' / '));$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';feedback.className='feedback bad';feedback.innerHTML='❌ 答案不正確。正確答案：<strong>'+esc(correctText(q))+'</strong><br>請重新作答。'+(q.explanation?'<div class="explain">解析：'+esc(q.explanation)+'</div>':'');if(MODE==='mcq')answerArea.querySelectorAll('input').forEach(x=>x.checked=false);else answerArea.querySelectorAll('.spell').forEach(x=>x.value='');answerArea.querySelector('input')?.focus()}};next.onclick=()=>{idx++;idx>=chosen.length?finish():show()};$('#finish').onclick=finish;function finish(){speechSynthesis?.cancel();quiz.classList.add('hidden');result.classList.remove('hidden');$('#summary').innerHTML='<div class="stat">本輪題數<b>'+chosen.length+'</b></div><div class="stat">完成答對<b>'+correct.size+'</b></div><div class="stat">曾答錯<b>'+wrong.size+'</b></div>';$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>'<div class="wrong"><b>'+(i+1)+'. 第 '+r.q.id+' 題</b><p>'+esc((r.q.zh?r.q.zh+'\n':'')+r.q.question)+'</p><p><strong>錯誤答案：</strong>'+r.attempts.map(esc).join('；')+'</p><p><strong>正確答案：</strong>'+esc(correctText(r.q))+'</p>'+(r.q.explanation?'<p><strong>解析：</strong>'+esc(r.q.explanation)+'</p>':'')+'</div>').join(''):'<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size);$('#retry').classList.toggle('hidden',!wrong.size)}$('#retry').onclick=()=>{chosen=[...wrong.values()].map(x=>x.q);idx=0;mode='retry';correct.clear();result.classList.add('hidden');quiz.classList.remove('hidden');show()};$('#restart').onclick=()=>location.reload();$('#download').onclick=async()=>{if(!wrong.size)return;try{if(!window.docx)await new Promise((ok,fail)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js';s.onload=ok;s.onerror=fail;document.head.append(s)});let{Document,Packer,Paragraph,TextRun,HeadingLevel}=window.docx,children=[new Paragraph({text:TITLE+' 錯題紀錄',heading:HeadingLevel.TITLE})];for(const [_,r] of wrong){children.push(new Paragraph({children:[new TextRun({text:'第 '+r.q.id+' 題',bold:true})]}));if(r.q.zh)children.push(new Paragraph(r.q.zh));children.push(new Paragraph(r.q.question),new Paragraph('錯誤答案：'+r.attempts.join('；')),new Paragraph('正確答案：'+correctText(r.q)));if(r.q.explanation)children.push(new Paragraph('解析：'+r.q.explanation));children.push(new Paragraph('重新作答：________________________________________'))}let blob=await Packer.toBlob(new Document({sections:[{children}]})),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=TITLE+'_錯題.docx';a.click();URL.revokeObjectURL(url)}catch(e){let text=[...wrong.values()].map(r=>'第 '+r.q.id+' 題\n'+(r.q.zh?r.q.zh+'\n':'')+r.q.question+'\n錯誤答案：'+r.attempts.join('；')+'\n正確答案：'+correctText(r.q)+(r.q.explanation?'\n解析：'+r.q.explanation:'')).join('\n\n');let blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=TITLE+'_錯題.txt';a.click();URL.revokeObjectURL(url)}};renderList();</script><script src="longteng-vocab-required-pronunciation.js?v=20261026-4"></script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
