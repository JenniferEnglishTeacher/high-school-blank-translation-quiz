<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>翰林 B4U2 第二大題 文法選擇題</title><style>:root{--bg:#f5f7fb;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#dbe2ea;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--accent:#2563eb}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}.wrap{max-width:980px;margin:auto;padding:18px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 5px 18px rgba(15,23,42,.05)}.hero{background:linear-gradient(135deg,#eaf2ff,#fff)}h1{margin:0 0 8px;font-size:clamp(25px,4vw,38px)}.note{color:var(--muted)}.hidden{display:none!important}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}.btn{border:0;border-radius:10px;padding:11px 16px;font-size:16px;font-weight:700;cursor:pointer;background:#e5e7eb}.btn.primary{background:var(--accent);color:white}.btn.danger{background:#991b1b;color:white}.pick{display:block;padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#fafafa}.pick input{margin-right:9px}.pick small{display:block;color:var(--muted);margin-left:25px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--accent)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:700;margin:8px 0 18px}.stem{font-size:21px;font-weight:700;margin:16px 0}.options{display:grid;gap:10px}.option{display:flex;gap:10px;padding:12px;border:2px solid var(--line);border-radius:10px;cursor:pointer}.option:has(input:checked){border-color:var(--accent);background:#eff6ff}.spell-input{font-size:20px;padding:10px;border:2px solid #94a3b8;border-radius:9px;width:min(260px,100%);margin:6px}.clue{font-weight:800;color:#5b21b6}.feedback{margin-top:14px;padding:13px;border-radius:10px;font-weight:700}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}@media(max-width:640px){.wrap{padding:10px}.hero,.card{padding:15px}.stem{font-size:18px}}</style></head><body><main class="wrap"><section class="hero"><h1>翰林 B4U2 第二大題 文法選擇題</h1><p>共 30 題。請選出最適合的答案。</p><p class="note">本測驗不使用錄音或麥克風。答錯會顯示正確答案並要求重新作答；結束後可下載 DOCX 錯題紀錄。</p></section><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn">全部選取</button><button id="none" class="btn">全部取消</button><button id="start" class="btn primary">開始作答</button></div><div id="list"></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="stem" class="stem"></div><div id="area" class="options"></div><div id="feedback" class="feedback hidden"></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="download" class="btn primary">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></main><script type="module">import{Document,Packer,Paragraph,TextRun,HeadingLevel}from'https://esm.sh/docx@9.5.1';const Q=[[1,"We have ______ rain in Taiwan in summer than in winter.",["fewer","little","much","more"],3,"rain 是不可數名詞；有 than 且語意為夏天雨量更多，因此用 more。"],[2,"Shelly doesn’t spend so much money as her husband or her daughter. Shelly spends ______ money of all.",["the most","the fewest","the least","the more"],2,"money 是不可數名詞；三人之中花最少的錢用 little 的最高級 the least。"],[3,"______ away from snakes is the first thing to do when you see them.",["By staying","Stay","Stayed","Staying"],3,"動名詞片語 Staying away from snakes 當主詞。"],[4,"After the heavy rain, vegetables ______, so many housewives could not buy a lot.",["became more and more expensive","got less and less low","are becoming cheaper and cheaper","get less and less expensive"],0,"敘述大雨後的過去情況，且蔬菜變得越來越貴，用 became more and more expensive。"],[5,"Jack: Do you have as many friends as your two brothers, Roy and Sam? Mike: Of course not. They are ______ handsome than I, so I have ______ friends of the three. Jack: I don’t think so. To me, you are ______ handsome of the three.",["less; the most; the least","more; least; the least","more; the fewest; the most","less; fewest; the most"],2,"兄弟較帥用 more handsome；朋友最少用 the fewest；三人中最帥用 the most handsome。"],[6,"Mom: You ______ tired. Max: I ______ very hungry, too. May I eat some buns before dinner? Mom: Sure.",["feel; look","sound; smell","look; feel","smell; sound"],2,"媽媽觀察 Max 用 look tired；Max 描述自己的感受用 feel hungry。"],[7,"Ann: Which is more ______, Turkey or Taiwan? Liz: Taiwan is. It is also ______ of the two countries.",["large; colder","good; smaller","special; beautiful","convenient; the warmer"],3,"more convenient 正確；兩者中的較暖者用限定比較級 the warmer。"],[8,"Take out the trash. It ______ terrible.",["sounds","feels","tastes","smells"],3,"垃圾「聞起來」很糟，用 smells。"],[9,"There are a lot of things to do, so we need help. The ______ people join the team, the ______ time we spend.",["many; little","more; little","more; less","much; little"],2,"the + 比較級, the + 比較級；people 用 more，time 不可數用 less。"],[10,"I prepared for the exam ______ 11 o’clock. I was really tired.",["until","before","after","when"],0,"持續準備到十一點，用 until。"],[11,"Nina’s Steak House is as good as Ruby’s, but Nina’s Steak House is more ______ than Ruby’s.",["special","smaller","good","big"],0,"more 後接 special；其餘選項需要 smaller、better、bigger。"],[12,"Becky: Who runs ______ in the class? Alec: Mike. He runs ______ than any other person in the class. He is born to run.",["faster; the faster","the fastest; faster","faster; the fastest","the fastest; fastet"],1,"全班跑最快用副詞最高級 the fastest；與任何其他人比較用 faster than。"],[13,"My daughter is much ______ now. The pants she wore last year are already too short for her.",["higher","longer","older","taller"],3,"去年的褲子已經太短，表示女兒現在高多了，用 taller。"],[14,"Who is ______, Grandpa or Grandma?",["more money","the more special","healthier","the older"],2,"兩人一般比較用 healthier；其餘選項的結構不正確。"],[15,"Mandy is the ______ beautiful girl in her class, so she has the ______ boyfriends of all.",["least; least","least; most","most; most","fewest; fewest"],2,"最美麗用 the most beautiful；最多男朋友用 the most boyfriends。"],[16,"Jane is the most ______ on the school soccer team.",["free","best","kind","special"],3,"the most special 是正確最高級形式。"],[17,"Ben: Is your math as good as your brother’s? Liz: No, mine is ______ his.",["more than","as good as","worse than","so bad as"],2,"否定回答表示 Liz 的數學比哥哥的差，用 worse than。"],[18,"His city is smaller than ______.",["I","me","my","mine"],3,"mine 代表 my city，可與 his city 比較。"],[19,"Rebecca is ______ woman at the party. Many men would like to dance with her.",["the most beautiful","the ugliest","most handsome","the cuter"],0,"派對上最美麗的女子用 the most beautiful woman。"],[20,"Kenji doesn’t eat as ______ meat as his brother.",["many","much","more","a lot"],1,"as...as 使用原級；meat 不可數，用 much。"],[21,"Who is the most ______ friend for you?",["deepest","interesting","best","latest"],1,"most 後接形容詞原級 interesting。"],[22,"Something in the kitchen ______ great. Aren’t you ______ hungry?",["tastes like; feeling","feels; becoming","smells; getting","looks; feeling like"],2,"東西聞起來很棒用 smells；漸漸變餓用 getting hungry。"],[23,"Joe: How was your vacation in China? Max: It couldn’t be ______. I don’t even want to talk about it.",["better","the best","worse","the worst"],2,"旅行糟到不想談，不可能更糟用 couldn’t be worse。"],[24,"The meat ______ turkey, but it doesn’t ______ yummy.",["tastes; taste","tastes; taste like","tastes like; taste","tastes like; taste like"],2,"taste like + 名詞；taste + 形容詞。"],[25,"It’s winter, but the weather today ______ summer. It ______ so hot.",["feels; feels","feels like; feels like","feels; feels like","feels like; feels"],3,"feel like + 名詞 summer；feel + 形容詞 hot。"],[26,"This restaurant sells the best steak in Taipei; you can’t find ______ steak in the city.",["delicious","more delicious","the most delicious","deliciously"],1,"已經是全市最好的，因此找不到更美味的牛排，用 more delicious。"],[27,"Sam is ______ tall than his good friend, Paul.",["less","more","much","a little"],0,"less + 形容詞原級 + than 表示「較不……」。"],[28,"Jacky is ______ tall in his family. He’s only 110 centimeters tall.",["less","more","the least","the most"],2,"家中最不高用 the least tall。"],[29,"Bob: ______ does he feel? Liz: He feels ______.",["How; hot","How; a doctor","What; like a doctor","What; even hotter"],0,"詢問感受用 How；feel 後接形容詞 hot。"],[30,"Jane: When was Mia born? Before or after you? Amy: She was born in 2005 after Father died. Mia is ______ child in the family.",["last","oldest","the least","the youngest"],3,"Mia 出生得較晚，因此是家中最年幼的孩子：the youngest。"]];const $=s=>document.querySelector(s),list=$('#list'),select=$('#select'),quiz=$('#quiz'),result=$('#result'),bar=$('#bar'),meta=$('#meta'),wrongCount=$('#wrongCount'),stem=$('#stem'),area=$('#area'),feedback=$('#feedback'),check=$('#check'),next=$('#next');let chosen=[],idx=0;const wrong=new Map(),attempted=new Set(),correct=new Set();const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s).trim().toLowerCase().replace(/\s+/g,' ');function renderList(){list.innerHTML=Q.map(q=>'<label class="pick"><input class="pickbox" type="checkbox" value="'+q[0]+'" checked><b>第 '+q[0]+' 題</b><small>'+esc(q[1])+'</small></label>').join('')}$('#all').onclick=()=>document.querySelectorAll('.pickbox').forEach(x=>x.checked=true);$('#none').onclick=()=>document.querySelectorAll('.pickbox').forEach(x=>x.checked=false);$('#start').onclick=function(){const ids=Array.from(document.querySelectorAll('.pickbox:checked')).map(x=>Number(x.value));if(!ids.length){alert('請至少選一題。');return}chosen=Q.filter(q=>ids.includes(q[0]));idx=0;wrong.clear();attempted.clear();correct.clear();select.classList.add('hidden');result.classList.add('hidden');quiz.classList.remove('hidden');show()};
function show(){var q=chosen[idx];meta.textContent='第 '+(idx+1)+' / '+chosen.length+' 題';bar.style.width=((idx+1)/chosen.length*100)+'%';stem.textContent=q[1];area.innerHTML=q[2].map(function(o,i){return '<label class="option"><input type="radio" name="answer" value="'+i+'"><b>'+String.fromCharCode(65+i)+'.</b><span>'+esc(o)+'</span></label>'}).join('');feedback.className='feedback hidden';check.classList.remove('hidden');next.classList.add('hidden')}
check.onclick=function(){var q=chosen[idx],sel=document.querySelector('input[name=answer]:checked');if(!sel){alert('請先選擇答案。');return}attempted.add(q[0]);var n=Number(sel.value);if(n===q[3]){correct.add(q[0]);feedback.className='feedback ok';feedback.innerHTML='✅ 答對了！<br>'+esc(q[4]);check.classList.add('hidden');next.classList.remove('hidden')}else{if(!wrong.has(q[0]))wrong.set(q[0],{q:q,attempts:[]});wrong.get(q[0]).attempts.push(String.fromCharCode(65+n)+'. '+q[2][n]);feedback.className='feedback bad';feedback.innerHTML='❌ 答錯了。正確答案：<strong>'+String.fromCharCode(65+q[3])+'. '+esc(q[2][q[3]])+'</strong><br>'+esc(q[4])+'<br>請重新選擇正確答案。'}};
next.onclick=function(){idx++;if(idx>=chosen.length)finishQuiz();else show()};$('#finish').onclick=finishQuiz;function finishQuiz(){quiz.classList.add('hidden');result.classList.remove('hidden');$('#summary').innerHTML='<div class="stat">選擇題數<b>'+chosen.length+'</b></div><div class="stat">已作答<b>'+attempted.size+'</b></div><div class="stat">完成答對<b>'+correct.size+'</b></div><div class="stat">曾答錯<b>'+wrong.size+'</b></div>';$('#wrongList').innerHTML=wrong.size?Array.from(wrong.values()).map(function(r,i){return '<div class="wrong"><b>'+(i+1)+'. '+esc(r.q[1])+'</b><p>錯誤紀錄：'+r.attempts.map(esc).join('<br>')+'</p><p><strong>正確答案：</strong>'+String.fromCharCode(65+r.q[3]) + '. ' + esc(r.q[2][r.q[3]])+'</p></div>'}).join(''):'<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size)}$('#restart').onclick=function(){result.classList.add('hidden');select.classList.remove('hidden')};$('#download').onclick=async function(){if(!wrong.size)return;const children=[new Paragraph({heading:HeadingLevel.TITLE,children:[new TextRun({text:'翰林 B4U2 第二大題 文法選擇題－錯題紀錄',bold:true})]})];Array.from(wrong.values()).forEach(function(r,i){children.push(new Paragraph({heading:HeadingLevel.HEADING_2,children:[new TextRun({text:(i+1)+'. '+r.q[1],bold:true})]}));children.push(new Paragraph({children:[new TextRun({text:'學生錯誤答案：',bold:true}),new TextRun({text:r.attempts.join(' | ')})]}));children.push(new Paragraph({children:[new TextRun({text:'正確答案：',bold:true}),new TextRun({text:String.fromCharCode(65+r.q[3])+'. '+r.q[2][r.q[3]]})]}))});const doc=new Document({sections:[{children}]});const blob=await Packer.toBlob(doc),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='翰林B4U2_第二大題文法選擇_錯題_'+new Date().toISOString().slice(0,10)+'.docx';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};renderList();</script></body></html>
