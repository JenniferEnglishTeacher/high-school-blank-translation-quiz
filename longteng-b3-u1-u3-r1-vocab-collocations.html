et ready to work hard","zh":"捲起袖子開始做","forms":null,"usage":[],"collos":[],"parts":["The classroom was a mess after the party, so we ",{"a":["roll"],"suf":"ed"}," ",{"a":["up"],"suf":""}," ",{"a":["our"],"suf":""}," ",{"a":["sleeves"],"suf":""}," and cleaned everything in an hour."],"full":"The classroom was a mess after the party, so we rolled up our sleeves and cleaned everything in an hour.","tr":"派對後教室一團亂，所以我們捲起袖子，一小時內就把一切打掃乾淨。"},{"id":206,"sec":"B","head":"run out of","pos":"(v.phr.)","def":"to use all of something so that none is left","zh":"用完","forms":"run – ran – run","usage":[],"collos":[],"parts":["We ",{"a":["ran"],"suf":""}," ",{"a":["out"],"suf":""}," ",{"a":["of"],"suf":""}," milk this morning, so I had to eat my cereal with orange juice instead."],"full":"We ran out of milk this morning, so I had to eat my cereal with orange juice instead.","tr":"我們今天早上牛奶用完了，所以我只好改用柳橙汁配麥片。"},{"id":207,"sec":"B","head":"set the stage for","pos":"(v.phr.)","def":"to make it possible for something to happen","zh":"為…做好準備；為…鋪路","forms":"set – set – set","usage":[],"collos":[],"parts":["Winning the national science fair in high school ",{"a":["set"],"suf":""}," ",{"a":["the"],"suf":""}," ",{"a":["stage"],"suf":""}," ",{"a":["for"],"suf":""}," her successful career as a scientist."],"full":"Winning the national science fair in high school set the stage for her successful career as a scientist.","tr":"高中時贏得全國科展為她成功的科學家生涯奠定了基礎。"},{"id":208,"sec":"B","head":"speed up","pos":"(v.phr.)","def":"to move or happen faster","zh":"加速","forms":"speed – sped – sped","usage":[],"collos":[],"parts":["The driver ",{"a":["sped"],"suf":""}," ",{"a":["up"],"suf":""}," when the traffic light turned yellow, which made the passengers feel very nervous."],"full":"The driver sped up when the traffic light turned yellow, which made the passengers feel very nervous.","tr":"交通號誌轉黃燈時，司機加速，讓乘客們非常緊張。"},{"id":209,"sec":"B","head":"strike a balance (between A and B)","pos":"(v.phr.)","def":"to find a way to give two things the right amount of attention","zh":"（在A和B之間）取得平衡","forms":"strike – struck – struck","usage":[],"collos":[],"parts":["Students need to ",{"a":["strike"],"suf":""}," ",{"a":["a"],"suf":""}," ",{"a":["balance"],"suf":""}," between studying and having fun, or they will feel stressed all the time."],"full":"Students need to strike a balance between studying and having fun, or they will feel stressed all the time.","tr":"學生需要在讀書和玩樂之間取得平衡，否則他們會一直感到壓力很大。"},{"id":210,"sec":"B","head":"succeed in + V-ing","pos":"(v.phr.)","def":"to manage to do something you tried to do","zh":"成功做到","forms":null,"usage":[],"collos":[],"parts":["After years of hard work, the scientists finally ",{"a":["succeed"],"suf":"ed"}," ",{"a":["in"],"suf":""}," finding a cure for the disease."],"full":"After years of hard work, the scientists finally succeeded in finding a cure for the disease.","tr":"經過多年的努力，科學家們終於成功找到治療這種疾病的方法。"},{"id":211,"sec":"B","head":"take … for granted","pos":"(v.phr.)","def":"to expect something to always be there and not value it","zh":"視…為理所當然","forms":"take – took – taken","usage":[],"collos":[],"parts":["Many people ",{"a":["take"],"suf":""}," clean water ",{"a":["for"],"suf":""}," ",{"a":["granted"],"suf":""},", but millions of people in the world cannot get it every day."],"full":"Many people take clean water for granted, but millions of people in the world cannot get it every day.","tr":"許多人把乾淨的水視為理所當然，但世界上數百萬人每天都無法取得乾淨的水。"},{"id":212,"sec":"B","head":"trial and error","pos":"(n.phr.)","def":"trying different ways until you find one that works","zh":"反覆試驗；嘗試錯誤","forms":null,"usage":[],"collos":[],"parts":["My grandmother never used a cookbook; she learned to cook through ",{"a":["trial"],"suf":""}," ",{"a":["and"],"suf":""}," ",{"a":["error"],"suf":""}," over many years."],"full":"My grandmother never used a cookbook; she learned to cook through trial and error over many years.","tr":"我奶奶從不用食譜；她多年來是透過反覆嘗試學會做菜的。"},{"id":213,"sec":"B","head":"turn … down","pos":"(v.phr.)","def":"to say no to an offer or a request","zh":"拒絕","forms":null,"usage":[],"collos":[],"parts":["Lisa ",{"a":["turn"],"suf":"ed"}," the job offer ",{"a":["down"],"suf":""}," because the company was too far away from her home."],"full":"Lisa turned the job offer down because the company was too far away from her home.","tr":"Lisa拒絕了那份工作邀約，因為那家公司離她家太遠了。"},{"id":214,"sec":"C","head":"It seems / appears that + S + V…","pos":"(句型)","def":"Use it to say what looks true from what you see or hear.","zh":"似乎…（It seems / appears that）","forms":null,"usage":[],"collos":[],"parts":["Kevin keeps yawning and rubbing his eyes, so ",{"a":["it"],"suf":""}," ",{"a":["seems"],"suf":""}," ",{"a":["that"],"suf":""}," he didn’t sleep well last night."],"full":"Kevin keeps yawning and rubbing his eyes, so it seems that he didn’t sleep well last night.","tr":"Kevin一直打哈欠、揉眼睛，所以看來他昨晚沒睡好。"},{"id":215,"sec":"C","head":"It seemed / appeared that + S + had + p.p.…","pos":"(句型)","def":"For something that seems to have happened even earlier in the past.","zh":"過去似乎已經…","forms":null,"usage":[],"collos":[],"parts":["When we got home, the door was open; ",{"a":["it"],"suf":""}," ",{"a":["seemed"],"suf":""}," that someone ",{"a":["had"],"suf":""}," ",{"a":["broken"],"suf":""}," in while we were out shopping."],"full":"When we got home, the door was open; it seemed that someone had broken in while we were out shopping.","tr":"我們回到家時門是開著的；似乎有人在我們出去購物時闖了進來。"},{"id":216,"sec":"C","head":"S + find / consider / think / feel + it + adj. (+ for 人) + to V","pos":"(句型)","def":"“it” is an empty object; the real object is the to-V part.","zh":"虛受詞 it（＋形容詞）","forms":null,"usage":[],"collos":[],"parts":["Many foreign visitors ",{"a":["find"],"suf":""}," ",{"a":["it"],"suf":""}," difficult ",{"a":["to"],"suf":""}," order food at night-market stalls without an English menu."],"full":"Many foreign visitors find it difficult to order food at night-market stalls without an English menu.","tr":"許多外國遊客覺得在沒有英文菜單的夜市小攤點餐很困難。"},{"id":217,"sec":"C","head":"S + find / consider / think / feel + it + N + to V","pos":"(句型)","def":"A noun can follow “it” to say how you see the to-V action.","zh":"虛受詞 it（＋名詞）","forms":null,"usage":[],"collos":[],"parts":["My parents ",{"a":["consider"],"suf":""}," ",{"a":["it"],"suf":""}," a waste of money ",{"a":["to"],"suf":""}," buy a new phone every year, so I still use my old one."],"full":"My parents consider it a waste of money to buy a new phone every year, so I still use my old one.","tr":"我爸媽認為每年買新手機是浪費錢，所以我還在用舊手機。"},{"id":218,"sec":"C","head":"see / hear / find + O + V-ing / p.p.","pos":"(句型)","def":"Use V-ing when the object is doing the action, and p.p. when the action is done to it.","zh":"感官動詞＋受詞＋V-ing / p.p.","forms":null,"usage":[],"collos":[],"parts":["When I walked past the music room, I ",{"a":["heard"],"suf":""}," someone ",{"a":["playing"],"suf":""}," the piano, so I stopped and listened for a while."],"full":"When I walked past the music room, I heard someone playing the piano, so I stopped and listened for a while.","tr":"我經過音樂教室時聽到有人在彈鋼琴，所以我停下來聽了一會兒。"},{"id":219,"sec":"C","head":"…than that / those + 介系詞片語","pos":"(句型)","def":"Use “that” for a singular noun and “those” for a plural noun so you don’t repeat it.","zh":"指示代名詞 that / those","forms":null,"usage":[],"collos":[],"parts":["The summer in Taipei is much more humid than ",{"a":["that"],"suf":""}," in Taichung, and the rents in Taipei are higher than ",{"a":["those"],"suf":""}," in Taichung, too."],"full":"The summer in Taipei is much more humid than that in Taichung, and the rents in Taipei are higher than those in Taichung, too.","tr":"台北的夏天比台中的夏天潮濕得多，台北的房租也比台中的房租高。"},{"id":220,"sec":"C","head":"S + not + V… + until + S + V…","pos":"(句型)","def":"The main action happens only after the until-time.","zh":"直到…才…","forms":null,"usage":[],"collos":[],"parts":["Jack ",{"a":["did"],"suf":""}," ",{"a":["not"],"suf":""}," go to the dentist ",{"a":["until"],"suf":""}," his toothache became too painful to stand."],"full":"Jack did not go to the dentist until his toothache became too painful to stand.","tr":"Jack直到牙痛到無法忍受才去看牙醫。"},{"id":221,"sec":"C","head":"Despite + N / V-ing ／ Despite the fact that + S + V…","pos":"(句型)","def":"“Despite” is a preposition; use a noun or V-ing, or “the fact that” + a clause.","zh":"儘管…","forms":null,"usage":[],"collos":[],"parts":[{"a":["Despite"],"suf":""}," ",{"a":["the"],"suf":""}," ",{"a":["fact"],"suf":""}," ",{"a":["that"],"suf":""}," she was seriously injured, Jenny kept on playing until the end of the game."],"full":"Despite the fact that she was seriously injured, Jenny kept on playing until the end of the game.","tr":"儘管受了重傷，Jenny仍繼續比賽直到結束。"},{"id":222,"sec":"C","head":"S + V…, whereas + S + V…","pos":"(句型)","def":"Use “whereas” to show a contrast between two facts.","zh":"然而（兩者對比）","forms":null,"usage":[],"collos":[],"parts":["My brother loves spicy food, ",{"a":["whereas"],"suf":""}," my sister cannot eat even a little chili without crying."],"full":"My brother loves spicy food, whereas my sister cannot eat even a little chili without crying.","tr":"我哥哥很愛吃辣，然而我姊姊連一點點辣椒都吃不了，一吃就流淚。"},{"id":223,"sec":"C","head":"not only A but (also) B","pos":"(句型)","def":"A and B must have the same form; with two subjects, the verb agrees with B.","zh":"不但…而且…","forms":null,"usage":[],"collos":[],"parts":[{"a":["Not"],"suf":""}," ",{"a":["only"],"suf":""}," my classmates ",{"a":["but"],"suf":""}," ",{"a":["also"],"suf":""}," my teacher ",{"a":["is"],"suf":""}," excited about the school trip to Hualien next week."],"full":"Not only my classmates but also my teacher is excited about the school trip to Hualien next week.","tr":"不只我的同學，連我的老師也對下週去花蓮的校外教學感到很興奮。"},{"id":224,"sec":"C","head":"By the time + S + V-ed…, S + had + p.p.…","pos":"(句型)","def":"The second action was already finished before a time in the past.","zh":"到…的時候（過去完成式）","forms":null,"usage":[],"collos":[],"parts":["By the time we arrived at the theater, the movie ",{"a":["had"],"suf":""}," already ",{"a":["started"],"suf":""},", so we missed the first ten minutes."],"full":"By the time we arrived at the theater, the movie had already started, so we missed the first ten minutes.","tr":"等到我們抵達電影院時，電影已經開始了，所以我們錯過了前十分鐘。"},{"id":225,"sec":"C","head":"By the time + S + V (現在式)…, S + will have + p.p.…","pos":"(句型)","def":"The action will be finished before a time in the future.","zh":"到…的時候（未來完成式）","forms":null,"usage":[],"collos":[],"parts":["By the time you come back from your trip next month, I ",{"a":["will"],"suf":""}," ",{"a":["have"],"suf":""}," ",{"a":["read"],"suf":""}," all the books on this shelf."],"full":"By the time you come back from your trip next month, I will have read all the books on this shelf.","tr":"等到你下個月旅行回來時，我將已經讀完這個書架上所有的書。"},{"id":226,"sec":"C","head":"Adj. / p.p. …, S + V…","pos":"(句型)","def":"A participle phrase at the start of a sentence describes the subject of the main clause.","zh":"分詞構句（形容詞／p.p. 放句首）","forms":null,"usage":[],"collos":[],"parts":[{"a":["Shocked"],"suf":""}," at the bad news, the whole class stayed silent for a long time, and nobody knew what to say."],"full":"Shocked at the bad news, the whole class stayed silent for a long time, and nobody knew what to say.","tr":"聽到這個壞消息感到震驚，全班沉默了很久，沒有人知道該說什麼。"},{"id":227,"sec":"C","head":"It takes + 人 + 時間 + to V…","pos":"(句型)","def":"Use it to say how much time someone needs to do something.","zh":"做…花某人多少時間","forms":null,"usage":[],"collos":[],"parts":[{"a":["It"],"suf":""}," ",{"a":["takes"],"suf":""}," me about forty minutes ",{"a":["to"],"suf":""}," get to school by bus, so I have to leave home before seven."],"full":"It takes me about forty minutes to get to school by bus, so I have to leave home before seven.","tr":"我搭公車上學要花大約四十分鐘，所以我必須在七點前出門。"}];

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm = s => String(s).trim().toLowerCase().replace(/[’‘`]/g, "'").replace(/\s+/g, ' ');
const list = $('#list'), select = $('#select'), quiz = $('#quiz'), result = $('#result'), feedback = $('#feedback');

let chosen = [], idx = 0, step = 1, tries = 0;
const wrong = new Map(), done = new Set();

/* ---------- selection screen ---------- */
function renderList() {
  $('#total').textContent = Q.length;
  let html = '', sec = '';
  Q.forEach(q => {
    if (q.sec !== sec) { sec = q.sec; html += '<div class="grp">' + ({A:'A. 單字＋詞類變化',B:'B. 片語／搭配詞',C:'C. 課本句型'}[sec]) + '</div>'; }
    html += '<label class="pick"><input class="pickbox" type="checkbox" value="' + q.id + '" checked><span><b>第 ' + q.id + ' 題</b>｜' + esc(q.zh) +
      ' <span class="pos">' + esc(q.pos) + '</span></span>' + (q.collos.length ? '<span class="tag">＋搭配詞</span>' : '') + '</label>';
  });
  list.innerHTML = html;
  countPicked();
}
const boxes = () => Array.from(document.querySelectorAll('.pickbox'));
const byId = id => Q.find(q => q.id === Number(id));
function setPicked(fn) { boxes().forEach(b => b.checked = fn(byId(b.value))); countPicked(); }
function countPicked() { $('#picked').textContent = '已選 ' + boxes().filter(b => b.checked).length + ' 題'; }
list.addEventListener('change', countPicked);
$('#all').onclick = () => setPicked(() => true);
$('#none').onclick = () => setPicked(() => false);
$('#secA').onclick = () => setPicked(q => q.sec === 'A');
$('#secB').onclick = () => setPicked(q => q.sec === 'B');
$('#secC').onclick = () => setPicked(q => q.sec === 'C');
$('#colloOnly').onclick = () => setPicked(q => q.collos.length > 0);
$('#rand20').onclick = () => { const ids = new Set(shuffled(Q).slice(0, 20).map(q => q.id)); setPicked(q => ids.has(q.id)); };
function shuffled(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

$('#start').onclick = () => {
  const ids = boxes().filter(b => b.checked).map(b => Number(b.value));
  if (!ids.length) { $('#picked').textContent = '請至少選一題。'; return; }
  begin(Q.filter(q => ids.includes(q.id)));
};
function begin(items) {
  chosen = $('#shuffle').checked ? shuffled(items) : items;
  idx = 0; wrong.clear(); done.clear();
  select.classList.add('hidden'); result.classList.add('hidden'); quiz.classList.remove('hidden');
  show();
}

/* ---------- one question ---------- */
function gap(answers, hintLen) {
  const x = document.createElement('input');
  x.className = 'gap'; x.type = 'text';
  x.autocomplete = 'off'; x.autocapitalize = 'off'; x.spellcheck = false;
  x.setAttribute('autocorrect', 'off');
  x.dataset.a = JSON.stringify(answers);
  x.style.width = Math.max(4.5, hintLen * 1.2 + 2.5) + 'ch';
  x.setAttribute('aria-label', '填空');
  return x;
}
function renderCollos(q) {
  const box = $('#collos'); box.innerHTML = '';
  q.collos.forEach(c => {
    const d = document.createElement('div'); d.className = 'collo';
    const zh = document.createElement('div'); zh.className = 'czh'; zh.textContent = c.zh; d.append(zh);
    const line = document.createElement('div'); line.className = 'line';
    c.toks.forEach(t => {
      if (t.g !== undefined) { const s = document.createElement('span'); s.className = 'given'; s.textContent = t.g; line.append(s); }
      else line.append(gap(t.a, Math.max(...t.a.map(a => a.length))));
      line.append(' ');
    });
    d.append(line); box.append(d);
  });
}
function renderSentence(q) {
  const s = $('#sent'); s.innerHTML = '';
  q.parts.forEach(p => {
    if (typeof p === 'string') s.append(document.createTextNode(p));
    else {
      s.append(gap(p.a, Math.max(...p.a.map(a => a.length))));
      if (p.suf) { const u = document.createElement('span'); u.className = 'suf'; u.textContent = p.suf; s.append(u); }
    }
  });
  $('#tr').innerHTML = q.tr;      // translation: only <b> marks, built from the source table
}
function show() {
  if (window.speechSynthesis) speechSynthesis.cancel();
  const q = chosen[idx];
  $('#meta').textContent = '第 ' + (idx + 1) + ' / ' + chosen.length + ' 題';
  $('#wrongCount').textContent = '曾答錯 ' + wrong.size + ' 題';
  $('#bar').style.width = (idx / chosen.length * 100) + '%';
  $('#zh').textContent = q.zh; $('#pos').textContent = q.pos; $('#def').textContent = q.def;
  const hasCollo = q.collos.length > 0;
  $('#step1').classList.toggle('hidden', !hasCollo);
  $('#step2title').textContent = (hasCollo ? '② ' : '') + '例句填空 Sentence';
  renderCollos(q); renderSentence(q);
  feedback.className = 'feedback hidden';
  $('#voicebox').classList.add('hidden');
  $('#check').classList.remove('hidden'); $('#next').classList.add('hidden');
  step = hasCollo ? 1 : 2; tries = 0;
  setStep();
}
function setStep() {
  const s1 = $('#step1'), s2 = $('#step2');
  s1.className = 'step' + (s1.classList.contains('hidden') ? ' hidden' : '') + (step === 1 ? ' active' : ' done');
  s2.className = 'step' + (step === 2 ? ' active' : step > 2 ? ' done' : '');
  s2.classList.toggle('hidden', step === 1);
  const first = activeGaps().find(g => !g.disabled);
  if (first) first.focus();
}
const activeGaps = () => Array.from(document.querySelectorAll((step === 1 ? '#collos' : '#sent') + ' .gap'));

function check() {
  const q = chosen[idx], gaps = activeGaps().filter(g => !g.disabled);
  const empty = gaps.filter(g => !g.value.trim());
  if (empty.length) {
    feedback.className = 'feedback info'; feedback.textContent = '還有 ' + empty.length + ' 格沒填。'; empty[0].focus(); return;
  }
  const bad = [];
  gaps.forEach(g => {
    const answers = JSON.parse(g.dataset.a);
    if (answers.map(norm).includes(norm(g.value))) { g.classList.remove('bad'); g.classList.add('ok'); g.disabled = true; }
    else { g.classList.add('bad'); bad.push(g); }
  });
  if (!bad.length) {
    tries = 0;
    if (step === 1) {
      step = 2; setStep();
      feedback.className = 'feedback ok'; feedback.textContent = '✅ 搭配詞正確！接著完成例句。';
    } else finishQuestion(q);
    return;
  }
  tries++;
  if (!wrong.has(q.id)) wrong.set(q.id, { q, attempts: [] });
  wrong.get(q.id).attempts.push((step === 1 ? '搭配詞' : '例句') + '：' + bad.map(g => g.value.trim()).join(' / '));
  $('#wrongCount').textContent = '曾答錯 ' + wrong.size + ' 題';
  feedback.className = 'feedback bad';
  if (tries === 1) {
    feedback.textContent = '❌ 有 ' + bad.length + ' 格不正確。紅色格子已顯示第一個字母，請再試一次。';
    bad.forEach(g => { const a = JSON.parse(g.dataset.a)[0]; g.value = ''; g.placeholder = a[0] + ' '.repeat(Math.max(0, a.length - 1)); });
  } else {
    feedback.innerHTML = '❌ 正確答案：' + bad.map(g => '<strong>' + esc(JSON.parse(g.dataset.a).join(' / ')) + '</strong>').join('、') + '<br>請照著拼一次，全部正確才能繼續。';
    bad.forEach(g => { g.value = ''; });
  }
  bad[0].focus();
}
function finishQuestion(q) {
  step = 3; setStep(); done.add(q.id);
  $('#bar').style.width = ((idx + 1) / chosen.length * 100) + '%';
  feedback.className = 'feedback ok'; feedback.textContent = '✅ 全部正確！聽一次完整句子。';
  $('#target').textContent = q.full;
  const notes = [];
  if (q.forms) notes.push('三態：<code>' + esc(q.forms) + '</code>');
  if (q.usage.length) notes.push('用法：' + q.usage.map(u => '<code>' + esc(u) + '</code>').join(''));
  $('#usage').innerHTML = notes.join('<br>'); $('#usage').classList.toggle('hidden', !notes.length);
  $('#voicebox').classList.remove('hidden');
  $('#check').classList.add('hidden');
  const n = $('#next'); n.classList.remove('hidden'); n.textContent = idx + 1 >= chosen.length ? '看結果 →' : '下一題 →';
  setTimeout(() => n.focus(), 0);
  setTimeout(speakCurrent, 250);
}

/* ---------- speech ---------- */
function speakCurrent() {
  const q = chosen[idx];
  if (!q || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(q.full);
  u.lang = 'en-US'; u.rate = 0.88;
  const vs = speechSynthesis.getVoices();
  u.voice = vs.find(v => /^en-US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
  speechSynthesis.speak(u);
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();   // warm up the voice list
$('#speak').onclick = speakCurrent;

/* ---------- navigation ---------- */
$('#check').onclick = check;
$('#next').onclick = () => { idx++; idx >= chosen.length ? finishQuiz() : show(); };
$('#finish').onclick = finishQuiz;
quiz.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.classList.contains('gap')) return;
  e.preventDefault();
  const open = activeGaps().filter(g => !g.disabled), i = open.indexOf(e.target);
  const nextEmpty = open.slice(i + 1).find(g => !g.value.trim());
  nextEmpty ? nextEmpty.focus() : check();
});

/* ---------- results ---------- */
function answerText(q) {
  const c = q.collos.map(c => c.en + '（' + c.zh + '）').join('；');
  return { collo: c, sentence: q.full, word: q.head };
}
function finishQuiz() {
  if (window.speechSynthesis) speechSynthesis.cancel();
  quiz.classList.add('hidden'); result.classList.remove('hidden');
  $('#summary').innerHTML = '<div class="stat">選擇題數<b>' + chosen.length + '</b></div><div class="stat">完成<b>' + done.size +
    '</b></div><div class="stat">一次答對<b>' + [...done].filter(id => !wrong.has(id)).length + '</b></div><div class="stat">曾答錯<b>' + wrong.size + '</b></div>';
  $('#wrongList').innerHTML = wrong.size ? Array.from(wrong.values()).map((r, i) => {
    const a = answerText(r.q);
    return '<div class="wrong"><b>' + (i + 1) + '. 第 ' + r.q.id + ' 題｜' + esc(r.q.zh) + ' ' + esc(r.q.pos) + '</b>' +
      '<p>錯誤紀錄：' + r.attempts.map(esc).join('<br>') + '</p><p><strong>單字／片語：</strong>' + esc(a.word) + '</p>' +
      (a.collo ? '<p><strong>搭配詞：</strong>' + esc(a.collo) + '</p>' : '') + '<p><strong>完整句：</strong>' + esc(a.sentence) + '</p></div>';
  }).join('') : '<div class="feedback ok">🎉 沒有錯題紀錄。</div>';
  $('#download').classList.toggle('hidden', !wrong.size);
  $('#retryWrong').classList.toggle('hidden', !wrong.size);
}
$('#restart').onclick = () => { result.classList.add('hidden'); select.classList.remove('hidden'); };
$('#retryWrong').onclick = () => begin(Array.from(wrong.values()).map(r => r.q));

$('#download').onclick = async () => {
  if (!wrong.size) return;
  const rows = Array.from(wrong.values()), stamp = new Date().toISOString().slice(0, 10), name = '龍騰B3_U1-U3_R1_單字搭配詞句型_錯題_' + stamp;
  const save = (blob, ext) => { const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = name + ext; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); };
  try {
    const { Document, Packer, Paragraph, TextRun, HeadingLevel } = await import('https://esm.sh/docx@9.5.1');
    const line = (label, text) => new Paragraph({ children: [new TextRun({ text: label, bold: true }), new TextRun({ text })] });
    const children = [new Paragraph({ heading: HeadingLevel.TITLE, children: [new TextRun({ text: TITLE + ' 錯題紀錄', bold: true })] })];
    rows.forEach((r, i) => {
      const a = answerText(r.q);
      children.push(new Paragraph({ heading: HeadingLevel.HEADING_2, children: [new TextRun({ text: (i + 1) + '. 第 ' + r.q.id + ' 題 ' + r.q.zh + ' ' + r.q.pos, bold: true })] }));
      children.push(line('錯誤紀錄：', r.attempts.join(' | ')), line('單字／片語：', a.word));
      if (a.collo) children.push(line('搭配詞：', a.collo));
      children.push(line('完整句：', a.sentence), line('中譯：', r.q.tr.replace(/<\/?b>/g, '')));
    });
    save(await Packer.toBlob(new Document({ sections: [{ children }] })), '.docx');
  } catch (e) {   // offline or CDN blocked: fall back to a plain-text file
    const txt = rows.map((r, i) => { const a = answerText(r.q); return (i + 1) + '. 第 ' + r.q.id + ' 題 ' + r.q.zh + ' ' + r.q.pos + '\n錯誤紀錄：' + r.attempts.join(' | ') + '\n單字／片語：' + a.word + (a.collo ? '\n搭配詞：' + a.collo : '') + '\n完整句：' + a.sentence + '\n'; }).join('\n');
    save(new Blob([TITLE + ' 錯題紀錄\n\n' + txt], { type: 'text/plain;charset=utf-8' }), '.txt');
  }
};

renderList();
</script>
