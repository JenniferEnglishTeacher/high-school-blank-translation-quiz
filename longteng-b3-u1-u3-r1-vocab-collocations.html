<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>龍騰普高 B3 U1–U3 + R1 單字・搭配詞・句型・例句填空</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#1f2937;--muted:#64748b;--line:#dbe2ea;--blue:#2563eb;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--voice:#7c3aed;--voicebg:#f5f3ff;--amber:#b45309;--amberbg:#fffbeb}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}
.wrap{max-width:980px;margin:auto;padding:18px}
.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 5px 18px rgba(15,23,42,.05)}
.hero{background:linear-gradient(135deg,#eaf2ff,#fff)}
h1{margin:0 0 8px;font-size:clamp(23px,4vw,34px);line-height:1.3}
h2{margin:0 0 6px;font-size:21px}
.note{color:var(--muted);margin:6px 0 0}
.hidden{display:none!important}
.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.btn{border:0;border-radius:10px;padding:11px 16px;font-size:16px;font-weight:700;cursor:pointer;background:#e5e7eb;color:var(--ink);font-family:inherit}
.btn.primary{background:var(--blue);color:#fff}
.btn.danger{background:#991b1b;color:#fff}
.btn.voice{background:var(--voice);color:#fff}
.btn.small{padding:7px 12px;font-size:14px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
.opt{display:flex;align-items:center;gap:8px;font-weight:700;margin:6px 0}
.opt input{width:18px;height:18px;accent-color:var(--blue)}
#list{max-height:430px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#fcfdff}
.grp{font-weight:800;color:#1d4ed8;margin:10px 4px 4px}
.pick{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin:6px 0;background:#fafafa;cursor:pointer}
.pick input{width:17px;height:17px;flex:none;accent-color:var(--blue)}
.pick .pos{color:var(--muted);font-size:14px}
.tag{margin-left:auto;flex:none;font-size:12px;font-weight:800;color:#6d28d9;background:var(--voicebg);border:1px solid #ddd6fe;border-radius:999px;padding:1px 8px}
.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}
.bar{height:100%;background:var(--blue);transition:width .2s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:700;margin:8px 0 14px}
.clue{background:var(--amberbg);border:1px solid #fde68a;border-radius:12px;padding:12px 14px}
.clue .zh{font-size:21px;font-weight:800;color:var(--amber)}
.clue .pos{font-weight:700;color:var(--muted);margin-left:8px}
.clue .def{color:#475569}
.step{margin-top:16px;padding:14px;border:2px solid var(--line);border-radius:13px;background:#f8fafc}
.step.active{border-color:#93c5fd;background:#f5f9ff}
.step.done{border-color:#bbf7d0;background:#f7fef9}
.step h3{margin:0 0 4px;font-size:17px;color:#1d4ed8}
.step.done h3{color:var(--ok)}
.step .how{color:var(--muted);font-size:14px;margin:0 0 8px}
.collo{padding:10px 0;border-top:1px dashed var(--line)}
.collo:first-of-type{border-top:0}
.collo .czh{font-weight:800;color:var(--amber);margin-bottom:6px}
.line{font-size:20px;font-weight:700;line-height:2.25}
.given{display:inline-block;color:#475569;background:#e2e8f0;border-radius:6px;padding:0 8px;margin:0 2px;line-height:1.6;font-size:17px}
.gap{font:inherit;font-weight:700;color:#1d4ed8;text-align:center;padding:3px 6px;margin:0 2px;border:0;border-bottom:3px solid #94a3b8;border-radius:6px 6px 0 0;background:#fff;max-width:100%}
.gap.ok{color:var(--ok);border-bottom-color:var(--ok);background:var(--okbg)}
.gap.bad{color:var(--bad);border-bottom-color:var(--bad);background:var(--badbg)}
.gap::placeholder{color:#94a3b8;font-weight:700}
.suf{color:#1d4ed8;margin-left:-2px}
.tr{margin:0 0 8px;color:#334155}
.tr b{color:#0f766e;background:#ccfbf1;border-radius:4px;padding:0 3px}
.feedback{margin-top:14px;padding:13px;border-radius:10px;font-weight:700}
.feedback.ok{background:var(--okbg);color:var(--ok)}
.feedback.bad{background:var(--badbg);color:var(--bad)}
.feedback.info{background:#eff6ff;color:#1d4ed8}
.voicebox{margin-top:16px;padding:16px;border:2px solid #ddd6fe;border-radius:13px;background:var(--voicebg)}
.voicebox h3{margin:0 0 6px;color:#5b21b6;font-size:17px}
.target{font-size:20px;font-weight:800;margin:6px 0 10px}
.usage{margin-top:10px;padding-top:10px;border-top:1px dashed #c4b5fd;color:#4c1d95}
.usage code{font-family:inherit;font-weight:800;background:#fff;border:1px solid #ddd6fe;border-radius:6px;padding:1px 7px;margin:2px 4px 2px 0;display:inline-block}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}
.stat b{display:block;font-size:28px}
.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}
.wrong p{margin:4px 0}
@media(max-width:640px){.wrap{padding:10px}.hero,.card{padding:15px}.line,.target{font-size:18px}.clue .zh{font-size:19px}.tag{display:none}}
</style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <h1>龍騰普高 B3 Units 1–3 + Review 1<br>單字・搭配詞・句型・例句填空</h1>
    <p><span id="total"></span> 題：先依中文拼出<strong>固定片語／搭配詞／課本句型</strong>，再把單字填進<strong>例句</strong>。</p>
    <p class="note">每題全部答對後，按 🔊 聽完整句子，再進入下一題。</p>
  </section>

  <section id="select" class="card">
    <h2>選擇題目</h2>
    <div class="toolbar">
      <button id="all" class="btn">全部選取</button>
      <button id="none" class="btn">全部取消</button>
      <button id="secA" class="btn">只選 A 單字</button>
      <button id="secB" class="btn">只選 B 片語</button>
      <button id="secC" class="btn">只選 C 句型</button>
      <button id="colloOnly" class="btn">只選有搭配詞的題目</button>
      <button id="rand20" class="btn">隨機 20 題</button>
    </div>
    <label class="opt"><input id="shuffle" type="checkbox"> 打亂出題順序</label>
    <div id="list"></div>
    <div class="actions"><button id="start" class="btn primary">開始作答</button><span id="picked" class="note" style="align-self:center"></span></div>
  </section>

  <section id="quiz" class="card hidden">
    <div class="progress"><div id="bar" class="bar"></div></div>
    <div class="meta"><span id="meta"></span><span id="wrongCount"></span></div>
    <div class="clue"><span id="zh" class="zh"></span><span id="pos" class="pos"></span><div id="def" class="def"></div></div>

    <div id="step1" class="step">
      <h3>① 搭配詞 Collocations</h3>
      <p class="how">看中文，拼出完整片語。灰色字是提示，不用填。</p>
      <div id="collos"></div>
    </div>

    <div id="step2" class="step">
      <h3 id="step2title">② 例句填空 Sentence</h3>
      <p id="tr" class="tr"></p>
      <div id="sent" class="line"></div>
    </div>

    <div id="feedback" class="feedback hidden" role="status" aria-live="polite"></div>

    <div id="voicebox" class="voicebox hidden">
      <h3>🔊 聽完整句子 Listen to the whole sentence</h3>
      <div id="target" class="target"></div>
      <button id="speak" class="btn voice">🔊 再聽一次</button>
      <div id="usage" class="usage hidden"></div>
    </div>

    <div class="actions">
      <button id="check" class="btn primary">檢查答案</button>
      <button id="next" class="btn primary hidden">下一題 →</button>
      <button id="finish" class="btn danger">結束作答</button>
    </div>
  </section>

  <section id="result" class="card hidden">
    <h2>作答結果</h2>
    <div id="summary" class="summary"></div>
    <div id="wrongList"></div>
    <div class="actions">
      <button id="retryWrong" class="btn primary">只重做錯題</button>
      <button id="download" class="btn">下載錯題 DOCX</button>
      <button id="restart" class="btn">重新選題</button>
    </div>
  </section>
</main>

 of sending someone away as a punishment","zh":"驅逐；放逐","forms":null,"usage":[],"collos":[],"parts":["After his ",{"a":["banishment"],"suf":""}," from the village, the young man had to build a new life alone in the mountains."],"full":"After his banishment from the village, the young man had to build a new life alone in the mountains.","tr":"被村子驅逐後，那位年輕人必須獨自在山中重新生活。"},{"id":16,"sec":"A","head":"benefit","pos":"(n.)","def":"a good or helpful effect","zh":"好處；益處\n為了某人的利益","forms":null,"usage":["for the benefit of 人"],"collos":[{"en":"for the benefit of 人","zh":"為了某人的利益","toks":[{"a":["for"]},{"a":["the"]},{"a":["benefit"]},{"a":["of"]},{"g":"人"}]}],"parts":["One of the biggest ",{"a":["benefit"],"suf":"s"}," of riding a bike to school is that you get exercise without spending extra time."],"full":"One of the biggest benefits of riding a bike to school is that you get exercise without spending extra time.","tr":"騎腳踏車上學最大的好處之一是你不用多花時間就能運動。"},{"id":17,"sec":"A","head":"benefit","pos":"(v.)","def":"to be helped by something; to be good for someone","zh":"受益；對…有益\n從…中受益\n對某人有益","forms":null,"usage":["benefit from N","benefit 人"],"collos":[{"en":"benefit from N","zh":"從…中受益","toks":[{"a":["benefit"]},{"a":["from"]},{"g":"N"}]},{"en":"benefit 人","zh":"對某人有益","toks":[{"a":["benefit"]},{"g":"人"}]}],"parts":["Students who read English news every day will ",{"a":["benefit"],"suf":""}," from it when they take the GSAT. The new park will ",{"a":["benefit"],"suf":""}," everyone in the neighborhood."],"full":"Students who read English news every day will benefit from it when they take the GSAT. The new park will benefit everyone in the neighborhood.","tr":"每天讀英文新聞的學生在考學測時會從中受益。新公園將有益於社區裡的每個人。"},{"id":18,"sec":"A","head":"beneficial","pos":"(adj.)","def":"helpful or good for someone or something","zh":"有益的\n對…有益","forms":null,"usage":["be beneficial to N"],"collos":[{"en":"be beneficial to N","zh":"對…有益","toks":[{"a":["be"]},{"a":["beneficial"]},{"a":["to"]},{"g":"N"}]}],"parts":["Getting enough sleep is ",{"a":["beneficial"],"suf":""}," to both your health and your grades, so try not to stay up late playing games."],"full":"Getting enough sleep is beneficial to both your health and your grades, so try not to stay up late playing games.","tr":"充足的睡眠對你的健康和成績都有益，所以盡量不要熬夜玩遊戲。"},{"id":19,"sec":"A","head":"capable","pos":"(adj.)","def":"having the ability to do something well","zh":"有能力的\n能夠…","forms":null,"usage":["be capable of + N/V-ing"],"collos":[{"en":"be capable of + N/V-ing","zh":"能夠…","toks":[{"a":["be"]},{"a":["capable"]},{"a":["of"]},{"g":"N/V-ing"}]}],"parts":["Our team leader is very ",{"a":["capable"],"suf":""},", so we all trust her to make the right decisions under pressure. Robots are now ",{"a":["capable"],"suf":""}," of cooking simple meals."],"full":"Our team leader is very capable, so we all trust her to make the right decisions under pressure. Robots are now capable of cooking simple meals.","tr":"我們的組長很有能力，所以我們都相信她能在壓力下做出正確的決定。機器人現在能夠煮簡單的餐點。"},{"id":20,"sec":"A","head":"incapable","pos":"(adj.)","def":"not able to do something","zh":"無能力的；不能的","forms":null,"usage":[],"collos":[],"parts":["After working for fifteen hours, I was so tired that I was ",{"a":["incapable"],"suf":""}," of thinking clearly about anything."],"full":"After working for fifteen hours, I was so tired that I was incapable of thinking clearly about anything.","tr":"工作了十五個小時後，我累到無法清楚思考任何事。"},{"id":21,"sec":"A","head":"capability","pos":"(n.)","def":"the ability to do something","zh":"能力","forms":null,"usage":[],"collos":[],"parts":["The new phone has the ",{"a":["capability"],"suf":""}," to translate a conversation between two languages in real time."],"full":"The new phone has the capability to translate a conversation between two languages in real time.","tr":"這款新手機有即時翻譯兩種語言對話的能力。"},{"id":22,"sec":"A","head":"civilization","pos":"(n.)","def":"a society with its own culture, government and way of life","zh":"文明","forms":null,"usage":[],"collos":[],"parts":["The ancient Egyptian ",{"a":["civilization"],"suf":""}," built huge pyramids thousands of years ago without any modern machines."],"full":"The ancient Egyptian civilization built huge pyramids thousands of years ago without any modern machines.","tr":"古埃及文明在數千年前沒有任何現代機器就建造了巨大的金字塔。"},{"id":23,"sec":"A","head":"civilized","pos":"(adj.)","def":"polite and reasonable; having a developed society","zh":"文明的；有教養的","forms":null,"usage":[],"collos":[],"parts":["Let’s discuss this problem in a ",{"a":["civilized"],"suf":""}," way instead of shouting at each other in front of the children."],"full":"Let’s discuss this problem in a civilized way instead of shouting at each other in front of the children.","tr":"我們以文明的方式討論這個問題吧，而不是在孩子面前互相吼叫。"},{"id":24,"sec":"A","head":"collaborate","pos":"(v.)","def":"to work together with someone to make or do something","zh":"合作\n和某人合作做…","forms":null,"usage":["collaborate with 人 on N"],"collos":[{"en":"collaborate with 人 on N","zh":"和某人合作做…","toks":[{"a":["collaborate"]},{"a":["with"]},{"g":"人"},{"a":["on"]},{"g":"N"}]}],"parts":["Our class ",{"a":["collaborate"],"suf":"d"}," with a school in Japan on a video project about the food culture of both countries."],"full":"Our class collaborated with a school in Japan on a video project about the food culture of both countries.","tr":"我們班和一所日本的學校合作，做一個介紹兩國飲食文化的影片專題。"},{"id":25,"sec":"A","head":"collaboration","pos":"(n.)","def":"the act of working together","zh":"合作\n與…合作","forms":null,"usage":["in collaboration with 人"],"collos":[{"en":"in collaboration with 人","zh":"與…合作","toks":[{"a":["in"]},{"a":["collaboration"]},{"a":["with"]},{"g":"人"}]}],"parts":["The new song was written in ",{"a":["collaboration"],"suf":""}," with a famous Korean singer, and it became a hit in both countries."],"full":"The new song was written in collaboration with a famous Korean singer, and it became a hit in both countries.","tr":"這首新歌是和一位知名韓國歌手合作寫成的，在兩國都大受歡迎。"},{"id":26,"sec":"A","head":"confine","pos":"(v.)","def":"to keep someone in a place that they cannot leave","zh":"使離不開（床、輪椅等）\n臥病在床／離不開輪椅","forms":null,"usage":["be confined to bed / a wheelchair"],"collos":[{"en":"be confined to bed / a wheelchair","zh":"臥病在床／離不開輪椅","toks":[{"a":["be"]},{"a":["confined"]},{"a":["to"]},{"a":["bed","a"]},{"a":["wheelchair"]}]}],"parts":["After the car accident, my grandfather was ",{"a":["confine"],"suf":"d"}," to a wheelchair for three months, so we took turns pushing him around."],"full":"After the car accident, my grandfather was confined to a wheelchair for three months, so we took turns pushing him around.","tr":"車禍後，我爺爺有三個月離不開輪椅，所以我們輪流推他出門。"},{"id":27,"sec":"A","head":"confine","pos":"(v.)","def":"to keep something within certain limits","zh":"侷限；限定\n把A限制在B","forms":null,"usage":["confine A to B"],"collos":[{"en":"confine A to B","zh":"把A限制在B","toks":[{"a":["confine"]},{"g":"A"},{"a":["to"]},{"g":"B"}]}],"parts":["Please ",{"a":["confine"],"suf":""}," your speech to five minutes, because there are twenty more students waiting to speak after you."],"full":"Please confine your speech to five minutes, because there are twenty more students waiting to speak after you.","tr":"請把你的演講限制在五分鐘內，因為你後面還有二十位同學在等著發言。"},{"id":28,"sec":"A","head":"conflict","pos":"(n.)","def":"a serious disagreement or fight","zh":"衝突\nA和B之間的衝突","forms":null,"usage":["conflict between A and B"],"collos":[{"en":"conflict between A and B","zh":"A和B之間的衝突","toks":[{"a":["conflict"]},{"a":["between"]},{"g":"A"},{"a":["and"]},{"g":"B"}]}],"parts":["The ",{"a":["conflict"],"suf":""}," between the two neighbors started with a parking space, but it soon turned into a big fight."],"full":"The conflict between the two neighbors started with a parking space, but it soon turned into a big fight.","tr":"這兩位鄰居之間的衝突起因於一個停車位，但很快就變成一場大吵。"},{"id":29,"sec":"A","head":"conflict","pos":"(v.)","def":"to be so different that both cannot happen or be true","zh":"相衝突；相牴觸\n與…衝突","forms":null,"usage":["conflict with N"],"collos":[{"en":"conflict with N","zh":"與…衝突","toks":[{"a":["conflict"]},{"a":["with"]},{"g":"N"}]}],"parts":["Unfortunately, the date of the concert ",{"a":["conflict"],"suf":"s"}," with my final exam, so I have to sell my ticket to a friend."],"full":"Unfortunately, the date of the concert conflicts with my final exam, so I have to sell my ticket to a friend.","tr":"可惜演唱會的日期和我的期末考衝突，所以我必須把票賣給朋友。"},{"id":30,"sec":"A","head":"conflicted","pos":"(adj.)","def":"unable to decide what you think or feel about something","zh":"內心矛盾的","forms":null,"usage":[],"collos":[],"parts":["I felt ",{"a":["conflicted"],"suf":""}," about studying abroad, because I wanted new experiences but didn’t want to leave my family."],"full":"I felt conflicted about studying abroad, because I wanted new experiences but didn’t want to leave my family.","tr":"我對出國讀書感到內心矛盾，因為我想要新的經歷，卻又不想離開家人。"},{"id":31,"sec":"A","head":"construct","pos":"(v.)","def":"to build something such as a road, a bridge or a building","zh":"建造；建構","forms":null,"usage":[],"collos":[],"parts":["The government plans to ",{"a":["construct"],"suf":""}," a new bridge across the river, which will cut the travel time in half."],"full":"The government plans to construct a new bridge across the river, which will cut the travel time in half.","tr":"政府計畫在河上建造一座新橋，這將使交通時間減少一半。"},{"id":32,"sec":"A","head":"construction","pos":"(n.)","def":"the process of building something","zh":"建造；建設；工程\n施工中","forms":null,"usage":["under construction"],"collos":[{"en":"under construction","zh":"施工中","toks":[{"a":["under"]},{"a":["construction"]}]}],"parts":["The noise from the ",{"a":["construction"],"suf":""}," site next door wakes me up at seven every morning, even on weekends. The new MRT station is still under ",{"a":["construction"],"suf":""},"."],"full":"The noise from the construction site next door wakes me up at seven every morning, even on weekends. The new MRT station is still under construction.","tr":"隔壁工地的噪音每天早上七點就把我吵醒，連週末也一樣。新的捷運站仍在施工中。"},{"id":33,"sec":"A","head":"constructive","pos":"(adj.)","def":"helpful and meant to improve something","zh":"建設性的\n有建設性的回饋／批評","forms":null,"usage":["constructive feedback / criticism"],"collos":[{"en":"constructive feedback / criticism","zh":"有建設性的回饋／批評","toks":[{"a":["constructive"]},{"a":["feedback","criticism"]}]}],"parts":["My teacher always gives ",{"a":["constructive"],"suf":""}," comments on my essays, so I know exactly how to improve my writing."],"full":"My teacher always gives constructive comments on my essays, so I know exactly how to improve my writing.","tr":"我的老師總是對我的作文給予有建設性的意見，所以我很清楚該如何改進寫作。"},{"id":34,"sec":"A","head":"contact","pos":"(v.)","def":"to call, write to, or email someone","zh":"聯絡","forms":null,"usage":["contact 人（不加 with）"],"collos":[{"en":"contact 人（不加 with）","zh":"聯絡","toks":[{"a":["contact"]},{"g":"人（不加"},{"g":"with）"}]}],"parts":["If you have any questions about the summer camp, please ",{"a":["contact"],"suf":""}," Ms. Lin by email or phone before Friday."],"full":"If you have any questions about the summer camp, please contact Ms. Lin by email or phone before Friday.","tr":"如果你對夏令營有任何問題，請在星期五前用電子郵件或電話聯絡林老師。"},{"id":35,"sec":"A","head":"contact","pos":"(n.)","def":"communication with someone; the state of touching something","zh":"聯絡；接觸\n和某人保持聯絡\n接觸到…","forms":null,"usage":["keep in contact with 人","come into contact with N"],"collos":[{"en":"keep in contact with 人","zh":"和某人保持聯絡","toks":[{"a":["keep"]},{"a":["in"]},{"a":["contact"]},{"a":["with"]},{"g":"人"}]},{"en":"come into contact with N","zh":"接觸到…","toks":[{"a":["come"]},{"a":["into"]},{"a":["contact"]},{"a":["with"]},{"g":"N"}]}],"parts":["Although my best friend moved to Canada, we still keep in ",{"a":["contact"],"suf":""}," with each other through video calls. Wash your hands if they come into ",{"a":["contact"],"suf":""}," with raw meat."],"full":"Although my best friend moved to Canada, we still keep in contact with each other through video calls. Wash your hands if they come into contact with raw meat.","tr":"雖然我最好的朋友搬到加拿大，我們仍然透過視訊電話保持聯絡。如果手接觸到生肉，要洗手。"},{"id":36,"sec":"A","head":"coral reef","pos":"(n.)","def":"a long line of hard rock in warm seas, formed by tiny sea animals","zh":"珊瑚礁","forms":null,"usage":[],"collos":[],"parts":["Many colorful fish live around the ",{"a":["coral"],"suf":""}," ",{"a":["reef"],"suf":""}," near Kenting, but rising sea temperatures are slowly killing it."],"full":"Many colorful fish live around the coral reef near Kenting, but rising sea temperatures are slowly killing it.","tr":"許多色彩鮮豔的魚住在墾丁附近的珊瑚礁周圍，但上升的海水溫度正慢慢殺死它。"},{"id":37,"sec":"A","head":"corporation","pos":"(n.)","def":"a big company","zh":"（大）公司；企業","forms":null,"usage":[],"collos":[],"parts":["My cousin works for a large ",{"a":["corporation"],"suf":""}," that has offices in Taipei, Tokyo and New York, so he travels a lot."],"full":"My cousin works for a large corporation that has offices in Taipei, Tokyo and New York, so he travels a lot.","tr":"我表哥在一家在台北、東京和紐約都有辦公室的大企業工作，所以他常常出差。"},{"id":38,"sec":"A","head":"corporate","pos":"(adj.)","def":"related to a big company","zh":"（大）公司的\n企業文化","forms":null,"usage":["corporate culture"],"collos":[{"en":"corporate culture","zh":"企業文化","toks":[{"a":["corporate"]},{"a":["culture"]}]}],"parts":["Many young people prefer companies with a relaxed ",{"a":["corporate"],"suf":""}," culture, where they can wear jeans and work from home."],"full":"Many young people prefer companies with a relaxed corporate culture, where they can wear jeans and work from home.","tr":"許多年輕人偏好企業文化輕鬆的公司，在那裡他們可以穿牛仔褲、在家工作。"},{"id":39,"sec":"A","head":"distribute","pos":"(v.)","def":"to give things to a number of people","zh":"分發；分配\n把A分發給B","forms":null,"usage":["distribute A to / among B"],"collos":[{"en":"distribute A to / among B","zh":"把A分發給B","toks":[{"a":["distribute"]},{"g":"A"},{"a":["to","among"]},{"g":"B"}]}],"parts":["Volunteers ",{"a":["distribute"],"suf":"d"}," food and blankets to the people who had lost their homes in the earthquake."],"full":"Volunteers distributed food and blankets to the people who had lost their homes in the earthquake.","tr":"志工們把食物和毯子分發給在地震中失去家園的人。"},{"id":40,"sec":"A","head":"distribution","pos":"(n.)","def":"the act of giving or sharing things among people","zh":"分發；分配；分布","forms":null,"usage":[],"collos":[],"parts":["The ",{"a":["distribution"],"suf":""}," of free masks at the train station started at seven, and the line was already very long."],"full":"The distribution of free masks at the train station started at seven, and the line was already very long.","tr":"火車站的免費口罩發放七點開始，隊伍已經排得很長了。"},{"id":41,"sec":"A","head":"drowsy","pos":"(adj.)","def":"tired and almost asleep","zh":"昏昏欲睡的","forms":null,"usage":[],"collos":[],"parts":["This cold medicine may make you ",{"a":["drowsy"],"suf":""},", so you should not drive or ride a scooter after taking it."],"full":"This cold medicine may make you drowsy, so you should not drive or ride a scooter after taking it.","tr":"這種感冒藥可能會讓你昏昏欲睡，所以服用後不應該開車或騎機車。"},{"id":42,"sec":"A","head":"drowsiness","pos":"(n.)","def":"the state of being tired and almost asleep","zh":"睏倦；想睡","forms":null,"usage":[],"collos":[],"parts":["Eating a big lunch often causes ",{"a":["drowsiness"],"suf":""}," in the afternoon, so I usually have a light meal before class."],"full":"Eating a big lunch often causes drowsiness in the afternoon, so I usually have a light meal before class.","tr":"午餐吃太多常會造成下午想睡，所以我通常在上課前吃得清淡些。"},{"id":43,"sec":"A","head":"electronic","pos":"(adj.)","def":"using electricity and very small computer parts","zh":"電子的\n電子裝置","forms":null,"usage":["electronic devices"],"collos":[{"en":"electronic devices","zh":"電子裝置","toks":[{"a":["electronic"]},{"a":["devices"]}]}],"parts":["Please turn off all ",{"a":["electronic"],"suf":""}," devices, including your phones and smartwatches, before the exam begins."],"full":"Please turn off all electronic devices, including your phones and smartwatches, before the exam begins.","tr":"考試開始前，請關閉所有電子裝置，  billions of years ago."],"full":"Space exploration has helped scientists learn more about how our planet was formed billions of years ago.","tr":"太空探索幫助科學家更了解我們的星球在數十億年前是如何形成的。"},{"id":61,"sec":"A","head":"explorer","pos":"(n.)","def":"a person who travels to places that few people have seen","zh":"探險家","forms":null,"usage":[],"collos":[],"parts":["The famous ",{"a":["explorer"],"suf":""}," spent two years walking across Africa and wrote a book about the people he met."],"full":"The famous explorer spent two years walking across Africa and wrote a book about the people he met.","tr":"那位著名的探險家花了兩年徒步穿越非洲，並寫了一本書介紹他遇到的人。"},{"id":62,"sec":"A","head":"feedback","pos":"(n.)","def":"comments about how good or useful something is (uncountable)","zh":"回饋；意見\n就…給某人回饋","forms":null,"usage":["give 人 feedback on N"],"collos":[{"en":"give 人 feedback on N","zh":"就…給某人回饋","toks":[{"a":["give"]},{"g":"人"},{"a":["feedback"]},{"a":["on"]},{"g":"N"}]}],"parts":["The teacher gave us useful ",{"a":["feedback"],"suf":""}," on our presentations, so we knew what to do better next time."],"full":"The teacher gave us useful feedback on our presentations, so we knew what to do better next time.","tr":"老師針對我們的報告給了有用的回饋，所以我們知道下次哪裡可以做得更好。"},{"id":63,"sec":"A","head":"flex","pos":"(v.)","def":"to bend or move part of your body so that the muscles get tight","zh":"彎曲；活動（肌肉）","forms":null,"usage":[],"collos":[],"parts":["Before the race, the runners ",{"a":["flex"],"suf":"ed"}," their arms and legs to warm up their muscles."],"full":"Before the race, the runners flexed their arms and legs to warm up their muscles.","tr":"比賽前，跑者們活動手腳來熱身肌肉。"},{"id":64,"sec":"A","head":"flexible","pos":"(adj.)","def":"able to bend easily; able to change easily","zh":"有彈性的；柔軟的；可變通的\n彈性工時","forms":null,"usage":["flexible working hours"],"collos":[{"en":"flexible working hours","zh":"彈性工時","toks":[{"a":["flexible"]},{"a":["working"]},{"a":["hours"]}]}],"parts":["Ballet dancers need very ",{"a":["flexible"],"suf":""}," bodies, so they stretch for at least thirty minutes every day. My mom’s company offers ",{"a":["flexible"],"suf":""}," working hours."],"full":"Ballet dancers need very flexible bodies, so they stretch for at least thirty minutes every day. My mom’s company offers flexible working hours.","tr":"芭蕾舞者需要非常柔軟的身體，所以他們每天至少伸展三十分鐘。我媽媽的公司提供彈性工時。"},{"id":65,"sec":"A","head":"flexibility","pos":"(n.)","def":"the ability to bend or change easily","zh":"柔軟度；彈性","forms":null,"usage":[],"collos":[],"parts":["Doing yoga three times a week can improve your ",{"a":["flexibility"],"suf":""}," and help you sleep better at night."],"full":"Doing yoga three times a week can improve your flexibility and help you sleep better at night.","tr":"每週做三次瑜伽可以改善你的柔軟度，並幫助你晚上睡得更好。"},{"id":66,"sec":"A","head":"inflexible","pos":"(adj.)","def":"not able or not willing to change","zh":"不能變通的；死板的","forms":null,"usage":[],"collos":[],"parts":["The rules at my old school were so ",{"a":["inflexible"],"suf":""}," that we could not even wear a jacket of a different color."],"full":"The rules at my old school were so inflexible that we could not even wear a jacket of a different color.","tr":"我以前學校的校規非常死板，我們連穿不同顏色的外套都不行。"},{"id":67,"sec":"A","head":"frail","pos":"(adj.)","def":"weak and thin, especially because of old age or illness","zh":"虛弱的","forms":null,"usage":[],"collos":[],"parts":["My great-grandmother is ninety-five and very ",{"a":["frail"],"suf":""},", so we always hold her arm when she walks."],"full":"My great-grandmother is ninety-five and very frail, so we always hold her arm when she walks.","tr":"我曾祖母九十五歲，身體很虛弱，所以她走路時我們總是扶著她的手臂。"},{"id":68,"sec":"A","head":"frailty","pos":"(n.)","def":"the state of being weak","zh":"虛弱","forms":null,"usage":[],"collos":[],"parts":["Because of her ",{"a":["frailty"],"suf":""},", the old lady could no longer climb the stairs to her fourth-floor apartment."],"full":"Because of her frailty, the old lady could no longer climb the stairs to her fourth-floor apartment.","tr":"因為身體虛弱，那位老太太再也無法爬樓梯到她四樓的公寓。"},{"id":69,"sec":"A","head":"freeze – froze – frozen","pos":"(v.)","def":"to become ice; to be very cold; to die from cold","zh":"結冰；凍結；受凍\n凍死","forms":null,"usage":["freeze to death"],"collos":[{"en":"freeze to death","zh":"凍死","toks":[{"a":["freeze"]},{"a":["to"]},{"a":["death"]}]}],"parts":["Water ",{"a":["freeze"],"suf":"s"}," at 0°C, so the pond in the park turns into ice in the coldest weeks of winter. Several sheep ",{"a":["froze"],"suf":""}," to death in the snowstorm last night."],"full":"Water freezes at 0°C, so the pond in the park turns into ice in the coldest weeks of winter. Several sheep froze to death in the snowstorm last night.","tr":"水在攝氏零度結冰，所以公園裡的池塘在冬天最冷的幾週會變成冰。昨晚有幾隻羊在暴風雪中凍死了。"},{"id":70,"sec":"A","head":"frozen","pos":"(adj.)","def":"turned into ice; kept very cold","zh":"冷凍的；結冰的","forms":null,"usage":[],"collos":[],"parts":["My mom was too busy to cook tonight, so we had ",{"a":["frozen"],"suf":""}," dumplings that she had bought at the supermarket."],"full":"My mom was too busy to cook tonight, so we had frozen dumplings that she had bought at the supermarket.","tr":"我媽媽今晚太忙沒空煮飯，所以我們吃了她在超市買的冷凍水餃。"},{"id":71,"sec":"A","head":"freezing","pos":"(adj.)","def":"extremely cold","zh":"極冷的；冰冷的","forms":null,"usage":[],"collos":[],"parts":["It was ",{"a":["freezing"],"suf":""}," on the top of Hehuan Mountain, so we put on gloves and two jackets to watch the sunrise."],"full":"It was freezing on the top of Hehuan Mountain, so we put on gloves and two jackets to watch the sunrise.","tr":"合歡山頂冷得要命，所以我們戴上手套、穿了兩件外套看日出。"},{"id":72,"sec":"A","head":"fright","pos":"(n.)","def":"a sudden feeling of fear","zh":"驚嚇\n嚇某人一跳","forms":null,"usage":["give 人 a fright"],"collos":[{"en":"give 人 a fright","zh":"嚇某人一跳","toks":[{"a":["give"]},{"g":"人"},{"a":["a"]},{"a":["fright"]}]}],"parts":["My little brother hid behind the door and jumped out at me, which gave me a terrible ",{"a":["fright"],"suf":""},"."],"full":"My little brother hid behind the door and jumped out at me, which gave me a terrible fright.","tr":"我弟弟躲在門後跳出來，嚇了我一大跳。"},{"id":73,"sec":"A","head":"frighten","pos":"(v.)","def":"to make someone afraid","zh":"使驚嚇；使害怕","forms":null,"usage":[],"collos":[],"parts":["The loud thunder ",{"a":["frighten"],"suf":"ed"}," the puppy, so it hid under my bed and wouldn’t come out all night."],"full":"The loud thunder frightened the puppy, so it hid under my bed and wouldn’t come out all night.","tr":"響亮的雷聲嚇壞了小狗，所以牠躲到我床底下，整晚都不肯出來。"},{"id":74,"sec":"A","head":"frightened","pos":"(adj.)","def":"feeling afraid","zh":"感到害怕的\n某人害怕…","forms":null,"usage":["人 be frightened of N / to V"],"collos":[{"en":"人 be frightened of N / to V","zh":"某人害怕…","toks":[{"g":"人"},{"a":["be"]},{"a":["frightened"]},{"a":["of"]},{"g":"N"},{"g":"/"},{"a":["to"]},{"g":"V"}]}],"parts":["My sister is ",{"a":["frightened"],"suf":""}," of the dark, so she always sleeps with a small light on in her room."],"full":"My sister is frightened of the dark, so she always sleeps with a small light on in her room.","tr":"我妹妹怕黑，所以她總是在房間裡開著一盞小燈睡覺。"},{"id":75,"sec":"A","head":"frightening","pos":"(adj.)","def":"making you feel afraid","zh":"令人害怕的","forms":null,"usage":[],"collos":[],"parts":["Riding the roller coaster for the first time was a ",{"a":["frightening"],"suf":""}," experience, but I wanted to do it again."],"full":"Riding the roller coaster for the first time was a frightening experience, but I wanted to do it again.","tr":"第一次坐雲霄飛車是一次令人害怕的經驗，但我還想再坐一次。"},{"id":76,"sec":"A","head":"fur","pos":"(n.)","def":"the thick soft hair of an animal","zh":"（動物的）毛；毛皮","forms":null,"usage":[],"collos":[],"parts":["Our cat’s ",{"a":["fur"],"suf":""}," gets all over the sofa, so we have to clean it with a special brush every day."],"full":"Our cat’s fur gets all over the sofa, so we have to clean it with a special brush every day.","tr":"我們家貓的毛弄得沙發到處都是，所以我們每天都得用特別的刷子清理。"},{"id":77,"sec":"A","head":"furry","pos":"(adj.)","def":"covered with fur","zh 儘管問我，別猶豫。"},{"id":89,"sec":"A","head":"hesitation","pos":"(n.)","def":"the act of stopping because you are not sure","zh":"猶豫\n毫不猶豫地","forms":null,"usage":["without hesitation"],"collos":[{"en":"without hesitation","zh":"毫不猶豫地","toks":[{"a":["without"]},{"a":["hesitation"]}]}],"parts":["When the teacher asked for a volunteer, Amy raised her hand without ",{"a":["hesitation"],"suf":""},", so she got the chance to sing."],"full":"When the teacher asked for a volunteer, Amy raised her hand without hesitation, so she got the chance to sing.","tr":"當老師找志願者時，Amy毫不猶豫地舉手，所以她得到了唱歌的機會。"},{"id":90,"sec":"A","head":"hollow","pos":"(adj.)","def":"having an empty space inside","zh":"中空的；空心的","forms":null,"usage":[],"collos":[],"parts":["The old tree in our schoolyard is ",{"a":["hollow"],"suf":""}," inside, and a family of birds has built a nest in it."],"full":"The old tree in our schoolyard is hollow inside, and a family of birds has built a nest in it.","tr":"我們校園裡那棵老樹的裡面是空心的，一窩鳥在裡面築了巢。"},{"id":91,"sec":"A","head":"solid","pos":"(adj.)","def":"hard and not hollow inside (≠ hollow)","zh":"實心的；堅固的","forms":null,"usage":[],"collos":[],"parts":["This table is made of ",{"a":["solid"],"suf":""}," wood, so it is much heavier than the cheap plastic ones in the cafeteria."],"full":"This table is made of solid wood, so it is much heavier than the cheap plastic ones in the cafeteria.","tr":"這張桌子是實心木頭做的，所以比餐廳裡便宜的塑膠桌重得多。"},{"id":92,"sec":"A","head":"hug","pos":"(v.)","def":"to put your arms around someone to show love or friendship","zh":"擁抱","forms":null,"usage":[],"collos":[],"parts":["When my grandmother saw me at the airport, she ",{"a":["hug"],"suf":"ged"}," me tightly and said that she had missed me."],"full":"When my grandmother saw me at the airport, she hugged me tightly and said that she had missed me.","tr":"奶奶在機場看到我時，緊緊擁抱我，說她很想我。"},{"id":93,"sec":"A","head":"hug","pos":"(n.)","def":"the act of holding someone in your arms","zh":"擁抱\n給某人一個擁抱","forms":null,"usage":["give 人 a hug"],"collos":[{"en":"give 人 a hug","zh":"給某人一個擁抱","toks":[{"a":["give"]},{"g":"人"},{"a":["a"]},{"a":["hug"]}]}],"parts":["My best friend looked so sad after the game that I gave her a big ",{"a":["hug"],"suf":""}," and told her not to worry."],"full":"My best friend looked so sad after the game that I gave her a big hug and told her not to worry.","tr":"比賽後我最好的朋友看起來很難過，所以我給了她一個大大的擁抱，叫她別擔心。"},{"id":94,"sec":"A","head":"humankind","pos":"(n.)","def":"all people, thought of as one group","zh":"人類","forms":null,"usage":[],"collos":[],"parts":["Climate change is one of the biggest problems facing ",{"a":["humankind"],"suf":""},", and every country needs to do something about it."],"full":"Climate change is one of the biggest problems facing humankind, and every country needs to do something about it.","tr":"氣候變遷是人類面臨的最大問題之一，每個國家都需要採取行動。"},{"id":95,"sec":"A","head":"ill","pos":"(adj.)","def":"sick; not healthy","zh":"生病的\n病重／生病","forms":null,"usage":["be seriously ill","fall ill"],"collos":[{"en":"be seriously ill","zh":"病重／生病","toks":[{"a":["be"]},{"a":["seriously"]},{"a":["ill"]}]},{"en":"fall ill","zh":"生病的\n病重／生病","toks":[{"a":["fall"]},{"a":["ill"]}]}],"parts":["Jenny has been ",{"a":["ill"],"suf":""}," for a week, so her classmates took notes for her and brought them to her house. My grandpa fell ",{"a":["ill"],"suf":""}," last winter."],"full":"Jenny has been ill for a week, so her classmates took notes for her and brought them to her house. My grandpa fell ill last winter.","tr":"Jenny已經生病一個星期了，所以同學們幫她抄筆記並送到她家。爺爺去年冬天病倒了。"},{"id":96,"sec":"A","head":"illness","pos":"(n.)","def":"a disease; the state of being sick","zh":"疾病；生病","forms":null,"usage":[],"collos":[],"parts":["Because of a serious ",{"a":["illness"],"suf":""},", the famous singer had to cancel all of her concerts this year."],"full":"Because of a serious illness, the famous singer had to cancel all of her concerts this year.","tr":"由於一場重病，這位知名歌手不得不取消今年所有的演唱會。"},{"id":97,"sec":"A","head":"individual","pos":"(n.)","def":"one person, thought of separately from the group","zh":"個人","forms":null,"usage":[],"collos":[],"parts":["Every ",{"a":["individual"],"suf":""}," has the right to his or her own opinion, so please listen to others even if you disagree."],"full":"Every individual has the right to his or her own opinion, so please listen to others even if you disagree.","tr":"每個人都有權利擁有自己的意見，所以即使你不同意，也請聽聽別人的想法。"},{"id":98,"sec":"A","head":"individual","pos":"(adj.)","def":"single; for one person only","zh":"個別的；個人的","forms":null,"usage":[],"collos":[],"parts":["The teacher met each student for an ",{"a":["individual"],"suf":""}," talk about their study plans before the final exam."],"full":"The teacher met each student for an individual talk about their study plans before the final exam.","tr":"老師在期末考前和每位學生進行個別談話，討論他們的讀書計畫。"},{"id":99,"sec":"A","head":"innovate","pos":"(v.)","def":"to bring in new ideas or methods","zh":"創新","forms":null,"usage":[],"collos":[],"parts":["Companies that do not ",{"a":["innovate"],"suf":""}," will soon fall behind, because customers always want something newer and better."],"full":"Companies that do not innovate will soon fall behind, because customers always want something newer and better.","tr":"不創新的公司很快就會落後，因為顧客總是想要更新更好的東西。"},{"id":100,"sec":"A","head":"innovation","pos":"(n.)","def":"a new idea, method or invention","zh":"創新；新發明","forms":null,"usage":[],"collos":[],"parts":["The smartphone was one of the greatest ",{"a":["innovation"],"suf":"s"}," of the 21st century, and it has changed how we live."],"full":"The smartphone was one of the greatest innovations of the 21st century, and it has changed how we live.","tr":"智慧型手機是21世紀最偉大的新發明之一，它改變了我們的生活方式。"},{"id":101,"sec":"A","head":"innovative","pos":"(adj.)","def":"using new and creative ideas","zh":"創新的","forms":null,"usage":[],"collos":[],"parts":["The young designer came up with an ",{"a":["innovative"],"suf":""}," way to turn old plastic bottles into school uniforms."],"full":"The young designer came up with an innovative way to turn old plastic bottles into school uniforms.","tr":"那位年輕設計師想出了一個把舊塑膠瓶做成學校制服的創新方法。"},{"id":102,"sec":"A","head":"laugh","pos":"(v.)","def":"to make sounds that show you think something is funny","zh":"笑\n嘲笑…","forms":null,"usage":["laugh at 人 / N"],"collos":[{"en":"laugh at 人 / N","zh":"嘲笑…","toks":[{"a":["laugh"]},{"a":["at"]},{"g":"人"},{"g":"/"},{"g":"N"}]}],"parts":["Everyone ",{"a":["laugh"],"suf":"ed"}," when the teacher accidentally wore two different shoes to class on Monday morning. It is unkind to ",{"a":["laugh"],"suf":""}," at other people’s mistakes."],"full":"Everyone laughed when the teacher accidentally wore two different shoes to class on Monday morning. It is unkind to laugh at other people’s mistakes.","tr":"星期一早上老師不小心穿了兩隻不同的鞋子來上課，大家都笑了。嘲笑別人的錯誤很不厚道。"},{"id":103,"sec":"A","head":"laughter","pos":"(n.)","def":"the sound of people laughing (uncountable)","zh":"笑；笑聲\n突然大笑","forms":null,"usage":["burst into laughter"],"collos":[{"en":"burst into laughter","zh":"突然大笑","toks":[{"a":["burst"]},{"a":["into"]},{"a":["laughter"]}]}],"parts":["The classroom was filled with ",{"a":["laughter"],"suf":""}," when the teacher told us a funny story about his first teaching job. The audience burst into ",{"a":["laughter"],"suf":""},"."],"full":"The classroom was filled with laughter when the teacher told us a funny story about his first teaching job. The audience burst into laughter.","tr":"老師講了一個關於他第一份教職的趣事，教室裡充滿了笑聲。觀眾突然哄堂大笑。"},{"id":104,"sec":"A","head":"layer","pos":"(n.)","def":"an amount of something that covers a surface; one level of something","zh":"層\n一層…","forms":null,"usage":["a layer of N"],"collos":[{"en":"a layer of N","zh":"一層…","toks":[{"a":["a"]},{"a":["layer"]},{"a":["of"]},{"g":"N"}]}],"parts":["After the long trip, there was a thick ",{"a":["layer"],"suf":""}," of dust on my desk, so I spent an hour cleaning my room. In winter, wear several ",{"a":["layer"],"suf":"s"}," of clothes."],"full":"After the long trip, there was a thick layer of dust on my desk, so I spent an hour cleaning my room. In winter, wear several layers of clothes.","tr":"長途旅行回來後，我的書桌上有一層厚厚的灰塵，所以我花了一小時打掃房間。冬天要穿好幾層衣服。"},{"id":105,"sec":"A","head":"material","pos":"(n.)","def":"a substance used for making things; information used for a task","zh":"材料；資料\n建材／教材","forms":null,"usage":["building / teaching materials"],"collos":[{"en":"building / teaching materials","zh":"建材／教材","toks":[{"a":["building","teaching"]},{"a":["materials"]}]}],"parts":["This jacket is made of a special ",{"a":["material"],"suf":""}," that keeps you dry in the rain and warm in the snow. The teacher prepared some reading ",{"a":["material"],"suf":"s"}," for us."],"full":"This jacket is made of a special material that keeps you dry in the rain and warm in the snow. The teacher prepared some reading materials for us.","tr":"這件外套是用一種特殊材料做的，能讓你在雨中保持乾爽、在雪中保持溫暖。老師為我們準備了一些閱讀資料。"},{"id":106,"sec":"A","head":"mention","pos":"(v.)","def":"to talk about something quickly without giving details","zh":"提到；提及\n更不用說…","forms":null,"usage":["not to mention N"],"collos":[{"en":"not to mention N","zh":"更不用說…","toks":[{"a":["not"]},{"a":["to"]},{"a":["mention"]},{"g":"N"}]}],"parts":["Did Lisa ",{"a":["mention"],"suf":""}," what time the party starts tomorrow night, or should I send her a message to ask? The hotel was expensive, not to ",{"a":["mention"],"suf":""}," the food."],"full":"Did Lisa mention what time the party starts tomorrow night, or should I send her a message to ask? The hotel was expensive, not to mention the food.","tr":"Lisa有提到明晚派對幾點開始嗎，還是我該傳訊息問她？那間飯店很貴，更不用說那裡的食物了。"},{"id":107,"sec":"A","head":"misery","pos":"(n.)","def":"great unhappiness or suffering","zh":"悲慘；痛苦；苦難","forms":null,"usage":[],"collos":[],"parts":["The war brought ",{"a":["misery"],"suf":""}," to millions of families, who lost their homes and had to live in tents."],"full":"The war brought misery to millions of families, who lost their homes and had to live in tents.","tr":"戰爭為數百萬個家庭帶來苦難，他們失去家園，不得不住在帳篷裡。"},{"id":108,"sec":"A","head":"miserable","pos":"(adj.)","def":"very unhappy or uncomfortable","zh":"悲慘的；痛苦的","forms":null,"usage":[],"collos":[],"parts":["I felt ",{"a":["miserable"],"suf":""}," all weekend because I had a bad cold and couldn’t go to my best friend’s party."],"full":"I felt miserable all weekend because I had a bad cold and couldn’t go to my best friend’s party.","tr":"我整個週末都覺得很痛苦，因為我得了重感冒，不能去參加最好朋友的派對。"},{"id":109,"sec":"A","head":"precious","pos":"(adj.)","def":"very valuable or important","zh":"珍貴的；寶貴的","forms":null,"usage":[],"collos":[],"parts":["Time with family is ",{"a":["precious"],"suf":""},", so I try to have dinner with my parents at least three times a week."],"full":"Time with family is precious, so I try to have dinner with my parents at least three times a week.","tr":"和家人相處的時間很珍貴，所以我盡量每週至少和父母吃三次晚餐。"},{"id":110,"sec":"A","head":"promise","pos":"(v.)","def":"to say that you will certainly do something","zh":"承諾；答應\n答應做…","forms":null,"usage":["promise to V"],"collos":[{"en":"promise to V","zh":"答應做…","toks":[{"a":["promise"]},{"a":["to"]},{"g":"V"}]}],"parts":["Dad ",{"a":["promise"],"suf":"d"}," to take us to the beach if we finished all our homework before Saturday morning."],"full":"Dad promised to take us to the beach if we finished all our homework before Saturday morning.","tr":"爸爸答應如果我們在星期六早上前寫完所有作業，就帶我們去海邊。"},{"id":111,"sec":"A","head":"promise","pos":"(n.)","def":"words saying that you will certainly do something","zh":"承諾\n遵守／違背承諾","forms":null,"usage":["keep / break a promise"],"collos":[{"en":"keep / break a promise","zh":"遵守／違背承諾","toks":[{"a":["keep","break"]},{"a":["a"]},{"a":["promise"]}]}],"parts":["Lily was upset because her father broke his ",{"a":["promise"],"suf":""}," again and missed her dance performance."],"full":"Lily was upset because her father broke his promise again and missed her dance performance.","tr":"Lily很難過，因為她爸爸又一次違背承諾，錯過了她的舞蹈表演。"},{"id":112,"sec":"A","head":"promising","pos":"(adj.)","def":"showing signs of future success","zh":"有前途的；有希望的","forms":null,"usage":[],"collos":[],"parts":["The coach believes that Tom is the most ",{"a":["promising"],"suf":""}," young player on the team and may play for Taiwan one day."],"full":"The coach believes that Tom is the most promising young player on the team and may play for Taiwan one day.","tr":"教練相信Tom是隊上最有前途的年輕球員，有一天可能會代表台灣出賽。"},{"id":113,"sec":"A","head":"prompt","pos":"(adj.)","def":"done quickly, without delay","zh":"立即的；迅速的","forms":null,"usage":[],"collos":[],"parts":["Thank you for your ",{"a":["prompt"],"suf":""}," reply to my email; now I can book the hotel before the prices go up."],"full":"Thank you for your prompt reply to my email; now I can book the hotel before the prices go up.","tr":"謝謝你迅速回覆我的電子郵件；現在我可以在房價上漲前訂飯店了。"},{"id":114,"sec":"A","head":"prompt","pos":"(v.)","def":"to make someone decide to do something","zh":"促使\n促使某人做…","forms":null,"usage":["prompt 人 to V"],"collos":[{"en":"prompt 人 to V","zh":"促使某人做…","toks":[{"a":["prompt"]},{"g":"人"},{"a":["to"]},{"g":"V"}]}],"parts":["The heavy air pollution ",{"a":["prompt"],"suf":"ed"}," the city government to limit the number of cars downtown."],"full":"The heavy air pollution prompted the city government to limit the number of cars downtown.","tr":"嚴重的空氣污染促使市政府限制市中心的汽車數量。"},{"id":115,"sec":"A","head":"promptly","pos":"(adv.)","def":"quickly; at exactly the right time","zh":"立即地；準時地","forms":null,"usage":[],"collos":[],"parts":["The meeting will start ",{"a":["promptly"],"suf":""}," at nine o’clock, so please don’t be late and turn off your phone."],"full":"The meeting will start promptly at nine o’clock, so please don’t be late and turn off your phone.","tr":"會議將在九點準時開始，所以請不要遲到，並關掉你的手機。"},{"id":116,"sec":"A","head":"protect","pos":"(v.)","def":"to keep someone or something safe from harm","zh":"保護\n保護A免於B","forms":null,"usage":["protect A from B"],"collos":[{"en":"protect A from B","zh":"保護A免於B","toks":[{"a":["protect"]},{"g":"A"},{"a":["from"]},{"g":"B"}]}],"parts":["Wear a hat and sunglasses to ",{"a":["protect"],"suf":""}," yourself from the strong sun when you go hiking in summer."],"full":"Wear a hat and sunglasses to protect yourself from the strong sun when you go hiking in summer.","tr":"夏天去健行時，戴帽子和太陽眼鏡保護自己免受強烈陽光照射。"},{"id":117,"sec":"A","head":"protection","pos":"(n.)","def":"the act of keeping something safe","zh":"保護","forms":null,"usage":[],"collos":[],"parts":["This area is under ",{"a":["protection"],"suf":""},", so visitors are not allowed to pick any flowers or feed the animals."],"full":"This area is under protection, so visitors are not allowed to pick any flowers or feed the animals.","tr":"這個地區受到保護，所以遊客不得摘花或餵食動物。"},{"id":118,"sec":"A","head":"protective","pos":"(adj.)","def":"used to protect; wanting to protect someone","zh":"保護的；防護的","forms":null,"usage":[],"collos":[],"parts":["Workers at the construction site must wear ",{"a":["protective"],"suf":""}," helmets in case something falls from above."],"full":"Workers at the construction site must wear protective helmets in case something falls from above.","tr":"工地的工人必須戴防護頭盔，以防有東西從上面掉下來。"},{"id":119,"sec":"A","head":"punish","pos":"(v.)","def":"to make someone suffer because they did something wrong","zh":"處罰；懲罰\n因…處罰某人","forms":null,"usage":["punish 人 for N/V-ing"],"collos":[{"en":"punish 人 for N/V-ing","zh":"因…處罰某人","toks":[{"a":["punish"]},{"g":"人"},{"a":["for"]},{"g":"N/V-ing"}]}],"parts":["The teacher ",{"a":["punish"],"suf":"ed"}," the boys for fighting in class by making them clean the bathroom for a week."],"full":"The teacher punished the boys for fighting in class by making them clean the bathroom for a week.","tr":"老師處罰那些在課堂上打架的男生，罰他們打掃廁所一星期。"},{"id":120,"sec":"A","head":"punishment","pos":"(n.)","def":"the act or way of punishing someone","zh":"處罰；懲罰","forms":null,"usage":[],"collos":[],"parts":["As a ",{"a":["punishment"],"suf":""}," for lying, Jack was not allowed to play video games for a whole month."],"full":"As a punishment for lying, Jack was not allowed to play video games for a whole month.","tr":"作為說謊的懲罰，Jack一整個月都不准玩電動。"},{"id":121,"sec":"A","head":"rank","pos":"(v.)","def":"to put someone or something in a position on a list","zh":"排名；名列\n被排名為…","forms":null,"usage":["be ranked + 名次"],"collos":[{"en":"be ranked + 名次","zh":"被排名為…","toks":[{"a":["be"]},{"a":["ranked"]},{"g":"名次"}]}],"parts":["Our school basketball team is ",{"a":["rank"],"suf":"ed"}," third in the city, so we have a good chance of winning the final."],"full":"Our school basketball team is ranked third in the city, so we have a good chance of winning the final.","tr":"我們學校的籃球隊在全市排名第三，所以我們很有機會贏得決賽。"},{"id":122,"sec":"A","head":"ranking","pos":"(n.)","def":"a position on a list of people or things","zh":"排名","forms":null,"usage":[],"collos":[],"parts":["The ",{"a":["ranking"],"suf":"s"}," of the world’s best universities come out every year, and many students check them before applying."],"full":"The rankings of the world’s best universities come out every year, and many students check them before applying.","tr":"世界最佳大學的排名每年都會公布，許多學生在申請前都會查看。"},{"id":123,"sec":"A","head":"reduce","pos":"(v.)","def":"to make something smaller in size or amount","zh":"減少；降低\n把A減少到B","forms":null,"usage":["reduce A to B"],"collos":[{"en":"reduce A to B","zh":"把A減少到B","toks":[{"a":["reduce"]},{"g":"A"},{"a":["to"]},{"g":"B"}]}],"parts":["To ",{"a":["reduce"],"suf":""}," waste, our school asks students to bring their own cups and chopsticks to lunch."],"full":"To reduce waste, our school asks students to bring their own cups and chopsticks to lunch.","tr":"為了減少浪費，我們學校要求學生午餐時自備杯子和筷子。"},{"id":124,"sec":"A","head":"reduction","pos":"(n.)","def":"a decrease in size, amount or price","zh":"減少；降低；減價","forms":null,"usage":[],"collos":[],"parts":["The store is offering a 30% ",{"a":["reduction"],"suf":""}," on all winter clothes, so let’s go shopping this weekend."],"full":"The store is offering a 30% reduction on all winter clothes, so let’s go shopping this weekend.","tr":"那家店所有冬裝都減價30%，所以我們這週末去逛街吧。"},{"id":125,"sec":"A","head":"refuse","pos":"(v.)","def":"to say that you will not do or accept something","zh":"拒絕\n拒絕做…","forms":null,"usage":["refuse to V"],"collos":[{"en":"refuse to V","zh":"拒絕做…","toks":[{"a":["refuse"]},{"a":["to"]},{"g":"V"}]}],"parts":["The little boy ",{"a":["refuse"],"suf":"d"}," to eat his vegetables, so his mother didn’t let him have any dessert."],"full":"The little boy refused to eat his vegetables, so his mother didn’t let him have any dessert.","tr":"那個小男孩拒絕吃蔬菜，所以他媽媽不讓他吃任何甜點。"},{"id":126,"sec":"A","head":"refusal","pos":"(n.)","def":"the act of saying no","zh":"拒絕","forms":null,"usage":[],"collos":[],"parts":["Her ",{"a":["refusal"],"suf":""}," to apologize made the problem worse, and the two friends didn’t talk to each other for months."],"full":"Her refusal to apologize made the problem worse, and the two friends didn’t talk to each other for months.","tr":"她拒絕道歉讓問題更糟，那兩個朋友好幾個月都沒和對方說話。"},{"id":127,"sec":"A","head":"relative","pos":"(n.)","def":"a member of your family","zh":"親戚","forms":null,"usage":[],"collos":[],"parts":["During the Lunar New Year, all my ",{"a":["relative"],"suf":"s"}," come to my grandparents’ house, and we eat dinner together."],"full":"During the Lunar New Year, all my relatives come to my grandparents’ house, and we eat dinner together.","tr":"農曆新年期間，我所有的親戚都會來祖父母家，大家一起吃年夜飯。"},{"id":128,"sec":"A","head":"relative","pos":"(adj.)","def":"compared with something else","zh":"相對的；比較的","forms":null,"usage":[],"collos":[],"parts":["After the long typhoon, the town enjoyed a week of ",{"a":["relative"],"suf":""}," peace before the next storm arrived."],"full":"After the long typhoon, the town enjoyed a week of relative peace before the next storm arrived.","tr":"在漫長的颱風過後，小鎮享受了一週相對的平靜，直到下一個暴風雨來臨。"},{"id":129,"sec":"A","head":"relatively","pos":"(adv.)","def":"quite, when compared with others","zh":"相對地；比較地","forms":null,"usage":[],"collos":[],"parts":["The math test was ",{"a":["relatively"],"suf":""}," easy this time, so most students finished it in thirty minutes."],"full":"The math test was relatively easy this time, so most students finished it in thirty minutes.","tr":"這次數學考試相對簡單，所以大部分學生三十分鐘內就寫完了。"},{"id":130,"sec":"A","head":"rely","pos":"(v.)","def":"to need or trust someone or something","zh":"依賴；信賴\n依靠…","forms":null,"usage":["rely on N"],"collos":[{"en":"rely on N","zh":"依靠…","toks":[{"a":["rely"]},{"a":["on"]},{"g":"N"}]}],"parts":["Many students ",{"a":["rely"],"suf":""}," on their phones too much, and they cannot even find their way without a map app."],"full":"Many students rely on their phones too much, and they cannot even find their way without a map app.","tr":"許多學生太依賴手機，沒有地圖應用程式甚至連路都找不到。"},{"id":131,"sec":"A","head":"reliable","pos":"(adj.)","def":"can be trusted","zh":"可靠的","forms":null,"usage":[],"collos":[],"parts":["My old scooter is not very ",{"a":["reliable"],"suf":""}," anymore, so I often have to take the bus to school."],"full":"My old scooter is not very reliable anymore, so I often have to take the bus to school.","tr":"我的舊機車已經不太可靠了，所以我常常得搭公車上學。"},{"id":132,"sec":"A","head":"unreliable","pos":"(adj.)","def":"cannot be trusted (≠ reliable)","zh":"不可靠的","forms":null,"usage":[],"collos":[],"parts":["Information on social media can be ",{"a":["unreliable"],"suf":""},", so always check the news on official websites before you share it."],"full":"Information on social media can be unreliable, so always check the news on official websites before you share it.","tr":"社群媒體上的資訊可能不可靠，所以分享前一定要到官方網站查證新聞。"},{"id":133,"sec":"A","head":"reliance","pos":"(n.)","def":"the state of needing someone or something","zh":"依賴","forms":null,"usage":[],"collos":[],"parts":["Our ",{"a":["reliance"],"suf":""}," on fossil fuels is causing serious pollution, so we need more clean energy like solar power."],"full":"Our reliance on fossil fuels is causing serious pollution, so we need more clean energy like solar power.","tr":"我們對化石燃料的依賴正造成嚴重污染，所以我們需要更多像太陽能這樣的乾淨能源。"},{"id":134,"sec":"A","head":"ridiculous","pos":"(adj.)","def":"very silly or unreasonable","zh":"可笑的；荒謬的","forms":null,"usage":[],"collos":[],"parts":["It is ",{"a":["ridiculous"],"suf":""}," to pay three hundred dollars for a cup of coffee, so I always make my own at home."],"full":"It is ridiculous to pay three hundred dollars for a cup of coffee, so I always make my own at home.","tr":"花三百元買一杯咖啡真是太荒謬了，所以我總是在家自己泡。"},{"id":135,"sec":"A","head":"route","pos":"(n.)","def":"a way from one place to another","zh":"路線；途徑\n通往…的路線","forms":null,"usage":["route to + 地方"],"collos":[{"en":"route to + 地方","zh":"通往…的路線","toks":[{"a":["route"]},{"a":["to"]},{"g":"地方"}]}],"parts":["The bus changed its ",{"a":["route"],"suf":""}," because of the parade, so I got off at the wrong stop and was late. This is the fastest ",{"a":["route"],"suf":""}," to the airport."],"full":"The bus changed its route because of the parade, so I got off at the wrong stop and was late. This is the fastest route to the airport.","tr":"因為遊行，公車改了路線，所以我在錯的站下車而遲到了。這是去機場最快的路線。"},{"id":136,"sec":"A","head":"slaughter","pos":"(v.)","def":"to kill animals for food; to kill many people cruelly","zh":"屠宰；屠殺","forms":null,"usage":[],"collos":[],"parts":["In the past, families in the village would ",{"a":["slaughter"],"suf":""}," a pig to celebrate the Lunar New Year together."],"full":"In the past, families in the village would slaughter a pig to celebrate the Lunar New Year together.","tr":"過去，村裡的人家會宰殺一頭豬一起慶祝農曆新年。"},{"id":137,"sec":"A","head":"slaughter","pos":"(n.)","def":"the cruel killing of many people or animals","zh":"屠殺；屠宰","forms":null,"usage":[],"collos":[],"parts":["The ",{"a":["slaughter"],"suf":""}," of elephants for their tusks has made some groups of them almost disappear in Africa."],"full":"The slaughter of elephants for their tusks has made some groups of them almost disappear in Africa.","tr":"為了象牙而屠殺大象，已使非洲一些象群幾乎消失。"},{"id":138,"sec":"A","head":"slight","pos":"(adj.)","def":"small; not serious","zh":"輕微的；微小的","forms":null,"usage":[],"collos":[],"parts":["I have a ",{"a":["slight"],"suf":""}," headache, so I think I will skip the movie and go to bed early tonight."],"full":"I have a slight headache, so I think I will skip the movie and go to bed early tonight.","tr":"我有輕微的頭痛，所以我想今晚不看電影，早點睡覺。"},{"id":139,"sec":"A","head":"slightly","pos":"(adv.)","def":"a little","zh":"稍微；略微","forms":null,"usage":[],"collos":[],"parts":["This shirt is ",{"a":["slightly"],"suf":""}," too big for me; do you have the same one in a smaller size?"],"full":"This shirt is slightly too big for me; do you have the same one in a smaller size?","tr":"這件襯衫對我來說稍微大了一點；你們有小一號的同款嗎？"},{"id":140,"sec":"A","head":"sparkle","pos":"(v.)","def":"to shine with small bright flashes of light","zh":"閃耀；閃閃發光","forms":null,"usage":[],"collos":[],"parts":["The diamond ring ",{"a":["sparkle"],"suf":"d"}," in the sunlight, and everyone at the party wanted to take a closer look."],"full":"The diamond ring sparkled in the sunlight, and everyone at the party wanted to take a closer look.","tr":"鑽戒在陽光下閃閃發光，派對上每個人都想湊近看看。"},{"id":141,"sec":"A","head":"sparkle","pos":"(n.)","def":"brightness; a lively quality","zh":"神采；光彩","forms":null,"usage":[],"collos":[],"parts":["There was a ",{"a":["sparkle"],"suf":""}," in her eyes when she talked about her plan to travel around the world."],"full":"There was a sparkle in her eyes when she talked about her plan to travel around the world.","tr":"當她談到環遊世界的計畫時，她的眼裡閃著光彩。"},{"id":142,"sec":"A","head":"sparkling","pos":"(adj.)","def":"shining brightly; having bubbles","zh":"閃閃發光的；冒氣泡的\n氣泡水","forms":null,"usage":["sparkling water"],"collos":[{"en":"sparkling water","zh":"氣泡水","toks":[{"a":["sparkling"]},{"a":["water"]}]}],"parts":["We walked along the beach at night, looking at the ",{"a":["sparkling"],"suf":""}," lights of the city across the bay. I prefer ",{"a":["sparkling"],"suf":""}," water to soda."],"full":"We walked along the beach at night, looking at the sparkling lights of the city across the bay. I prefer sparkling water to soda.","tr":"我們晚上沿著海灘散步，看著海灣對岸城市閃閃發光的燈光。比起汽水，我比較喜歡氣泡水。"},{"id":143,"sec":"A","head":"stable","pos":"(adj.)","def":"steady and not likely to change","zh":"穩定的","forms":null,"usage":[],"collos":[],"parts":["My grandfather’s condition is ",{"a":["stable"],"suf":""}," now, so the doctor says he can leave the hospital next week."],"full":"My grandfather’s condition is stable now, so the doctor says he can leave the hospital next week.","tr":"我爺爺的病情現在很穩定，所以醫生說他下週可以出院。"},{"id":144,"sec":"A","head":"stability","pos":"(n.)","def":"the state of being steady","zh":"穩定（性）","forms":null,"usage":[],"collos":[],"parts":["Parents want ",{"a":["stability"],"suf":""}," for their children, so they try not to move to a new city too often."],"full":"Parents want stability for their children, so they try not to move to a new city too often.","tr":"父母希望孩子生活穩定，所以他們盡量不要太常搬到新的城市。"},{"id":145,"sec":"A","head":"unstable","pos":"(adj.)","def":"likely to change or fall (≠ stable)","zh":"不穩定的","forms":null,"usage":[],"collos":[],"parts":["The ladder looks ",{"a":["unstable"],"suf":""},", so please hold it for me while I change the light bulb on the ceiling."],"full":"The ladder looks unstable, so please hold it for me while I change the light bulb on the ceiling.","tr":"這個梯子看起來不穩，所以我換天花板上的燈泡時，請你幫我扶著。"},{"id":146,"sec":"A","head":"stretch","pos":"(v.)","def":"to reach out your arm or leg; to make something longer","zh":"伸出（手臂或腿）；伸長；拉長\n伸展開","forms":null,"usage":["stretch out"],"collos":[{"en":"stretch out","zh":"伸展開","toks":[{"a":["stretch"]},{"a":["out"]}]}],"parts":["The cat woke up, ",{"a":["stretch"],"suf":"ed"}," its legs, and walked slowly to its bowl to look for food. He ",{"a":["stretch"],"suf":"ed"}," out on the sofa."],"full":"The cat woke up, stretched its legs, and walked slowly to its bowl to look for food. He stretched out on the sofa.","tr":"貓醒來後伸了伸腿，慢慢走到牠的碗邊找食物。他在沙發上伸展開身子躺著。"},{"id":147,"sec":"A","head":"structure","pos":"(n.)","def":"the way parts are arranged; something that has been built","zh":"結構；建築物","forms":null,"usage":[],"collos":[],"parts":["Before you write your essay, plan its ",{"a":["structure"],"suf":""}," carefully, with an introduction, three body paragraphs and a conclusion."],"full":"Before you write your essay, plan its structure carefully, with an introduction, three body paragraphs and a conclusion.","tr":"寫作文前，要仔細規劃它的結構：一段引言、三段主體和一段結論。"},{"id":148,"sec":"A","head":"structural","pos":"(adj.)","def":"related to the structure of something","zh":"結構上的","forms":null,"usage":[],"collos":[],"parts":["After the earthquake, engineers checked every building for ",{"a":["structural"],"suf":""}," damage before people could move back in."],"full":"After the earthquake, engineers checked every building for structural damage before people could move back in.","tr":"地震後，工程師檢查每棟建築是否有結構損壞，居民才能搬回去。"},{"id":149,"sec":"A","head":"suffer","pos":"(v.)","def":"to feel pain or be badly affected by something","zh":"受苦；遭受\n患有…；受…之苦","forms":null,"usage":["suffer from + 疾病／問題"],"collos":[{"en":"suffer from + 疾病／問題","zh":"患有…；受…之苦","toks":[{"a":["suffer"]},{"a":["from"]},{"g":"疾病／問題"}]}],"parts":["My father ",{"a":["suffer"],"suf":"s"}," from back pain because he sits in front of a computer for ten hours a day."],"full":"My father suffers from back pain because he sits in front of a computer for ten hours a day.","tr":"我爸爸患有背痛，因為他一天坐在電腦前十個小時。"},{"id":150,"sec":"A","head":"suffering","pos":"(n.)","def":"pain or great sadness","zh":"痛苦；苦難","forms":null,"usage":[],"collos":[],"parts":["The doctors and nurses did everything they could to reduce the patient’s ",{"a":["suffering"],"suf":""}," during his last days."],"full":"The doctors and nurses did everything they could to reduce the patient’s suffering during his last days.","tr":"醫生和護理師盡一切努力減輕病人最後幾天的痛苦。"},{"id":151,"sec":"A","head":"temperature","p ull":"as you know, our school will hold its sports day next Friday, so please bring your sports uniform.","tr":"如你們所知，我們學校下週五將舉行運動會，所以請帶運動服。"},{"id":176,"sec":"B","head":"be about to + V","pos":"(v.phr.)","def":"to be going to do something very soon","zh":"正要","forms":null,"usage":[],"collos":[],"parts":["I ",{"a":["was"],"suf":""}," ",{"a":["about"],"suf":""}," ",{"a":["to"],"suf":""}," leave home when it suddenly started to rain, so I went back to get my umbrella."],"full":"I was about to leave home when it suddenly started to rain, so I went back to get my umbrella.","tr":"我正要出門時突然下起雨來，所以我回去拿雨傘。"},{"id":177,"sec":"B","head":"be capable of + N/V-ing","pos":"(v.phr.)","def":"to have the ability to do something","zh":"能夠","forms":null,"usage":[],"collos":[],"parts":["My little sister is only five, but she ",{"a":["is"],"suf":""}," already ",{"a":["capable"],"suf":""}," ",{"a":["of"],"suf":""}," reading simple English storybooks by herself."],"full":"My little sister is only five, but she is already capable of reading simple English storybooks by herself.","tr":"我妹妹才五歲，但她已經能夠自己讀簡單的英文故事書。"},{"id":178,"sec":"B","head":"be equipped with","pos":"(v.phr.)","def":"to have the tools or machines that are needed","zh":"配備有","forms":null,"usage":[],"collos":[],"parts":["The new library ",{"a":["is"],"suf":""}," ",{"a":["equipped"],"suf":""}," ",{"a":["with"],"suf":""}," comfortable sofas and fast Wi-Fi, so students love studying there after school."],"full":"The new library is equipped with comfortable sofas and fast Wi-Fi, so students love studying there after school.","tr":"新圖書館配備有舒適的沙發和高速網路，所以學生放學後很喜歡在那裡讀書。"},{"id":179,"sec":"B","head":"be known as","pos":"(v.phr.)","def":"to be called something; to be famous as something","zh":"以…（稱號）為人所知；被稱為","forms":null,"usage":[],"collos":[],"parts":["Taipei 101 ",{"a":["is"],"suf":""}," ",{"a":["known"],"suf":""}," ",{"a":["as"],"suf":""}," one of the tallest buildings in the world, and it attracts many tourists every year."],"full":"Taipei 101 is known as one of the tallest buildings in the world, and it attracts many tourists every year.","tr":"台北101被稱為世界最高的建築之一，每年吸引許多觀光客。"},{"id":180,"sec":"B","head":"be made out of","pos":"(v.phr.)","def":"to be produced from a material","zh":"由…製成","forms":null,"usage":[],"collos":[],"parts":["This beautiful bag ",{"a":["is"],"suf":""}," ",{"a":["made"],"suf":""}," ",{"a":["out"],"suf":""}," ",{"a":["of"],"suf":""}," old jeans, so it is both fashionable and good for the environment."],"full":"This beautiful bag is made out of old jeans, so it is both fashionable and good for the environment.","tr":"這個漂亮的包包是用舊牛仔褲做成的，所以既時尚又環保。"},{"id":181,"sec":"B","head":"build on","pos":"(v.phr.)","def":"to use something as a base for further progress","zh":"以…為基礎","forms":"build – built – built","usage":[],"collos":[],"parts":["The new research ",{"a":["build"],"suf":"s"}," ",{"a":["on"],"suf":""}," the work of earlier scientists, who studied the same disease twenty years ago."],"full":"The new research builds on the work of earlier scientists, who studied the same disease twenty years ago.","tr":"這項新研究建立在早期科學家的研究基礎上，他們二十年前研究過同一種疾病。"},{"id":182,"sec":"B","head":"cheer … up","pos":"(v.phr.)","def":"to make someone feel happier","zh":"使振作；使高興","forms":null,"usage":[],"collos":[],"parts":["Ben was sad after losing the game, so we bought him his favorite pizza to ",{"a":["cheer"],"suf":""}," him ",{"a":["up"],"suf":""},"."],"full":"Ben was sad after losing the game, so we bought him his favorite pizza to cheer him up.","tr":"Ben輸了比賽後很難過，所以我們買了他最愛的披薩來讓他振作起來。"},{"id":183,"sec":"B","head":"come to + V","pos":"(v.phr.)","def":"to slowly begin to feel or know something","zh":"（漸漸）變得…","forms":"come – came – come","usage":[],"collos":[],"parts":["At first I didn’t like my new school, but I soon ",{"a":["came"],"suf":""}," ",{"a":["to"],"suf":""}," love my teachers and classmates."],"full":"At first I didn’t like my new school, but I soon came to love my teachers and classmates.","tr":"起初我不喜歡我的新學校，但我很快就漸漸喜歡上我的老師和同學了。"},{"id":184,"sec":"B","head":"cost an arm and a leg","pos":"(v.phr.)","def":"to be very expensive","zh":"非常昂貴","forms":"cost – cost – cost","usage":[],"collos":[],"parts":["Eating at that famous steakhouse ",{"a":["cost"],"suf":"s"}," ",{"a":["an"],"suf":""}," ",{"a":["arm"],"suf":""}," ",{"a":["and"],"suf":""}," ",{"a":["a"],"suf":""}," ",{"a":["leg"],"suf":""},", so we only go there on special occasions."],"full":"Eating at that famous steakhouse costs an arm and a leg, so we only go there on special occasions.","tr":"在那家知名牛排館吃飯非常昂貴，所以我們只在特殊場合才去。"},{"id":185,"sec":"B","head":"decide on","pos":"(v.phr.)","def":"to choose something after thinking about it","zh":"決定（選擇）","forms":null,"usage":[],"collos":[],"parts":["We still haven’t ",{"a":["decide"],"suf":"d"}," ",{"a":["on"],"suf":""}," a restaurant for Mom’s birthday dinner, so let’s look at some online reviews."],"full":"We still haven’t decided on a restaurant for Mom’s birthday dinner, so let’s look at some online reviews.","tr":"我們還沒決定媽媽生日晚餐要去哪家餐廳，所以來看看網路評論吧。"},{"id":186,"sec":"B","head":"do damage to","pos":"(v.phr.)","def":"to harm something","zh":"對…造成傷害","forms":"do – did – done","usage":[],"collos":[],"parts":["Staying up late every night can ",{"a":["do"],"suf":""}," serious ",{"a":["damage"],"suf":""}," ",{"a":["to"],"suf":""}," your health, so try to go to bed before midnight."],"full":"Staying up late every night can do serious damage to your health, so try to go to bed before midnight.","tr":"每晚熬夜會對你的健康造成嚴重的傷害，所以盡量在午夜前睡覺。"},{"id":187,"sec":"B","head":"dream of + V-ing","pos":"(v.phr.)","def":"to hope very much to do something","zh":"夢想（做…）","forms":null,"usage":[],"collos":[],"parts":["Since he was a little boy, Jack has ",{"a":["dream"],"suf":"ed"}," ",{"a":["of"],"suf":""}," becoming a pilot and flying around the world."],"full":"Since he was a little boy, Jack has dreamed of becoming a pilot and flying around the world.","tr":"Jack從小就夢想成為一名飛行員，飛遍全世界。"},{"id":188, "}," ",{"a":["of"],"suf":""}," the school trip, so ask her if you have any questions about the schedule."],"full":"Ms. Chen is in charge of the school trip, so ask her if you have any questions about the schedule.","tr":"陳老師負責這次校外教學，所以如果你對行程有任何問題就問她。"},{"id":197,"sec":"B","head":"make a difference (to / in N)","pos":"(v.phr.)","def":"to have an effect, especially a good one","zh":"產生影響；有作用","forms":"make – made – made","usage":[],"collos":[],"parts":["Even small actions, like bringing your own shopping bag, can ",{"a":["make"],"suf":""}," ",{"a":["a"],"suf":""}," ",{"a":["difference"],"suf":""}," to the environment."],"full":"Even small actions, like bringing your own shopping bag, can make a difference to the environment.","tr":"即使是自備購物袋這樣的小行動，也能對環境產生影響。"},{"id":198,"sec":"B","head":"make up for","pos":"(v.phr.)","def":"to do something good because you did something wrong before","zh":"彌補","forms":"make – made – made","usage":[],"collos":[],"parts":["I forgot my best friend’s birthday, so I took her out for dinner to ",{"a":["make"],"suf":""}," ",{"a":["up"],"suf":""}," ",{"a":["for"],"suf":""}," my mistake."],"full":"I forgot my best friend’s birthday, so I took her out for dinner to make up for my mistake.","tr":"我忘了我最好朋友的生日，所以我請她吃晚餐來彌補我的錯。"},{"id":199,"sec":"B","head":"make use of","pos":"(v.phr.)","def":"to use something in a helpful way","zh":"利用","forms":"make – made – made","usage":[],"collos":[],"parts":["You should ",{"a":["make"],"suf":""}," ",{"a":["use"],"suf":""}," ",{"a":["of"],"suf":""}," your summer vacation to learn a new skill, like swimming or cooking."],"full":"You should make use of your summer vacation to learn a new skill, like swimming or cooking.","tr":"你應該利用暑假學一項新技能，像是游泳或煮飯。"},{"id":200,"sec":"B","head":"map out","pos":"(v.phr.)","def":"to plan something carefully and in detail","zh":"詳細規劃","forms":null,"usage":[],"collos":[],"parts":["Before the trip to Japan, we ",{"a":["map"],"suf":"ped"}," ",{"a":["out"],"suf":""}," our route so that w
