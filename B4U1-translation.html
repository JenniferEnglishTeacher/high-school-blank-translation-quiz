<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hanlin B4U1 翻譯題</title><style>:root{--b:#2563eb;--g:#15803d;--r:#b91c1c;--p:#7c3aed;--bg:#f5f7fb;--line:#dbe2ea}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1f2937;font-family:Arial,"Microsoft JhengHei",sans-serif;line-height:1.7}.wrap{max-width:1000px;margin:auto;padding:16px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}.hero{background:linear-gradient(135deg,#eaf2ff,#fff)}h1,h2{margin-top:0}.note{color:#64748b}.hidden{display:none!important}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 15px;font-size:16px;font-weight:700;cursor:pointer;background:#e5e7eb}.primary{background:var(--b);color:#fff}.danger{background:#991b1b;color:#fff}.voice{background:var(--p);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.pick{display:flex;gap:10px;padding:10px;border-bottom:1px solid #eee}.progress{height:9px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--b)}.zh{font-size:22px;font-weight:800;padding:14px;background:#eff6ff;border-left:5px solid var(--b);border-radius:8px;margin:16px 0}.answerInput{width:100%;min-height:90px;font:inherit;font-size:18px;padding:12px;border:2px solid #94a3b8;border-radius:10px;resize:vertical}.answerInput.ok{border-color:var(--g);background:#ecfdf3}.answerInput.bad{border-color:var(--r);background:#fff1f2}.feedback{padding:13px;border-radius:10px;margin-top:14px}.feedback.ok{background:#ecfdf3;color:var(--g)}.feedback.bad{background:#fff1f2;color:var(--r)}.voicebox{margin-top:14px;padding:14px;border:2px solid #ddd6fe;background:#f5f3ff;border-radius:12px}.voiceTarget{font-weight:700;font-size:18px;margin:7px 0}.wrongcard{border:1px solid #fecaca;background:#fff7f7;border-radius:12px;padding:14px;margin:10px 0}.wrongcard p{margin:5px 0}@media(max-width:600px){.wrap{padding:10px}.zh{font-size:19px}.answerInput{font-size:17px}}</style></head><body><div class="wrap"><section class="hero"><h1>Hanlin B4U1 翻譯題</h1><p>共 38 題。請依中文翻成英文。</p><p class="note">答錯會立即顯示正確答案，並要求重新輸入。曾答錯的題目會保留，完成後可再做錯題並下載 DOCX。填對後需朗讀完整英文，語音辨識達 90% 才能進下一題。</p></section><section id="sel" class="card"><h2>選擇題目</h2><div class="toolbar"><button class="btn" id="all">全部選取</button><button class="btn" id="none">全部取消</button><button class="btn primary" id="start">開始作答</button></div><div id="list"></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><p id="meta"></p><div id="zh" class="zh"></div><textarea id="input" class="answerInput" placeholder="請輸入完整英文答案"></textarea><div id="fb" class="feedback hidden"></div><div id="voiceBox" class="voicebox hidden"><b>🔊 整句朗讀</b><div id="voiceTarget" class="voiceTarget"></div><div class="toolbar"><button id="speak" class="btn voice">🔊 聽一次</button><button id="mic" class="btn voice">🎤 開始朗讀</button></div><div id="vr" class="note">朗讀正確性須達 90%。</div></div><div class="toolbar" style="margin-top:14px"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden" disabled>下一題</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary"></div><div id="wrongList"></div><div class="toolbar"><button id="retry" class="btn primary">再做一次錯題</button><button id="download" class="btn primary">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></div><script type="module">import{Document,Packer,Paragraph,TextRun,HeadingLevel}from'https://esm.sh/docx@9.5.1';const Q=[
{n:1,zh:'人造肉嘗起來就像真的肉一樣。',a:['Lab meat tastes just like real meat.','Lab meat tastes just like the real thing.'],e:'taste like＋名詞，表示「嘗起來像……」。'},
{n:2,zh:'天氣漸漸變得越來越熱了。（get）',a:['The weather is getting hotter and hotter.','It is getting hotter and hotter.'],e:'is getting＋比較級 and 比較級。'},
{n:3,zh:'我們去學校附近的那間牛排館吧。',a:["Let's go to the steak house near the school."],e:"Let's＋原形動詞。"},
{n:4,zh:'這裡的牛肉料理比家鄉的還好吃。',a:['Beef dishes here are more delicious than the ones back home.'],e:'more delicious than；ones 代替 beef dishes。'},
{n:5,zh:'Roy：我漸漸越來越餓了。Ben：我們去學校附近的牛排館吧！',a:["Roy: I'm getting hungrier and hungrier. Ben: Let's go to the steak house near the school!"],e:'hungrier and hungrier 表示越來越餓。'},
{n:6,zh:'它可能聞起來糟透了，但它吃起來很棒。',a:['It may smell terrible, but it tastes great.'],e:'smell＋形容詞；taste＋形容詞。'},
{n:7,zh:'這裡生活很方便，在臺灣四處遊走也比在土耳其容易許多。',a:['Life here is convenient, and getting around in Taiwan is easier than in Türkiye.','Life here is convenient, and getting around in Taiwan is easier than in Turkey.'],e:'getting around 當主詞；easier than。'},
{n:8,zh:'你的三明治比她的派好吃。',a:['Your sandwich is more delicious than her pie.','Your sandwich is yummier than her pie.'],e:'more delicious / yummier than。'},
{n:9,zh:'它看起來不像肉。',a:["It doesn't look like meat.",'It does not look like meat.'],e:'look like＋名詞；否定句使用 does not / doesn’t。'},
{n:10,zh:'Mia：這些派聞起來怎麼樣？Emi：它們聞起來比那些薯條香。',a:['Mia: How do the pies smell? Emi: They smell better than the fries do.'],e:'How do... smell?；better than。'},
{n:11,zh:'我可以要南瓜派佐冰淇淋嗎？它看起來很棒。',a:['May I have the pumpkin pie with ice cream? It looks great.'],e:'May I have...；with 表示搭配。'},
{n:12,zh:'在這家牛排館，音樂聽起來很糟，而且食物吃起來不好吃。',a:["At this steak house, the music sounds terrible, and the food doesn't taste yummy.","At this steak house, the music sounds terrible, and the food doesn't taste delicious.",'At this steak house, the music sounds terrible, and the food does not taste yummy.','At this steak house, the music sounds terrible, and the food does not taste delicious.'],e:'sound / taste 後接形容詞。'},
{n:13,zh:'吃少一些，你將不會變得越來越胖。',a:["Eat less, and you won't get fatter and fatter.","Eat less, and you won't become fatter and fatter.",'Eat less, and you will not get fatter and fatter.','Eat less, and you will not become fatter and fatter.'],e:'get / become＋fatter and fatter。'},
{n:14,zh:'許多人試過人造肉之後都無法將其與真正的肉作分辨。',a:["Many people tried lab meat and couldn't tell it from real meat.",'Many people tried lab meat and could not tell it from real meat.'],e:'tell A from B 表示分辨 A 與 B。'},
{n:15,zh:'這裡的起司漢堡比來自土耳其的起司漢堡美。',a:['Cheeseburgers here are more beautiful than the ones from Turkey.','Cheeseburgers here are more beautiful than the ones from Türkiye.'],e:'more beautiful than；ones 代替 cheeseburgers。'},
{n:16,zh:'這牛排比菜單上所有其他的東西更貴並且更好吃。',a:['The steak is more expensive and more delicious than all the other things on the menu.','The steak is more expensive and yummier than all the other things on the menu.'],e:'more expensive；more delicious / yummier。'},
{n:17,zh:'我想要兩個漢堡和一個南瓜派佐冰淇淋。',a:["I'll have two hamburgers and one pumpkin pie with ice cream.",'I will have two hamburgers and one pumpkin pie with ice cream.','I would like two hamburgers and one pumpkin pie with ice cream.'],e:'點餐可用 I’ll have / I would like。'},
{n:18,zh:'那間牛排館比學校附近所有其他餐廳更受歡迎。',a:['That steak house is more popular than all the other restaurants near the school.'],e:'more popular than all the other restaurants。'},
{n:19,zh:'Zac 的胃口比 Jasmine 的好。（... has... than...）',a:['Zac has a better appetite than Jasmine does.'],e:'have a better appetite than...。'},
{n:20,zh:'我家人跟我不吃豬肉，但這裡的人喜愛豬肉。',a:["My family and I don't eat pork, but people here love pork.",'My family and I do not eat pork, but people here love pork.'],e:'but 連接語意相反的兩句。'},
{n:21,zh:'這家餐廳比那家餐廳有名；它的食物是兩家中比較美味的。',a:['This restaurant is more famous than that one; its food is the more delicious of the two.','This restaurant is more famous than that one; its food is the yummier of the two.'],e:'限定比較級：the＋比較級＋of the two。'},
{n:22,zh:'藉由這樣做，就不會有動物喪失性命。',a:['By doing so, no animals lose their lives.'],e:'By doing so＝藉由這樣做。'},
{n:23,zh:'Dr. Post 和他的團隊從動物身上抽取細胞，然後將它們培養成肉類。',a:['Dr. Post and his team take cells from animals and then grow them into meat.'],e:'take... from...；grow... into...。'},
{n:24,zh:'此外，飼養動物會製造很多溫室氣體，但培養人造肉不會。',a:["What's more, raising animals creates a lot of greenhouse gas, but growing lab meat doesn't.",'What is more, raising animals creates a lot of greenhouse gas, but growing lab meat does not.'],e:'What’s more；raising / growing 動名詞當主詞。'},
{n:25,zh:'它吃起來像豬肉，但它吃起來不好吃。',a:["It tastes like pork, but it doesn't taste yummy.","It tastes like pork, but it doesn't taste delicious.",'It tastes like pork, but it does not taste yummy.','It tastes like pork, but it does not taste delicious.','It tasted like pork, but it did not taste yummy.','It tasted like pork, but it did not taste delicious.'],e:'taste like＋名詞；taste＋形容詞。'},
{n:26,zh:'那聽起來像個好主意嗎？',a:['Does that sound like a good idea?'],e:'Does＋主詞＋sound like＋名詞？'},
{n:27,zh:'我吃了一個豬肉三明治，而現在我漸漸感到好多了。',a:['I had a pork sandwich, and now I am feeling much better.','I ate a pork sandwich, and now I am feeling much better.'],e:'had / ate 使用過去式；am feeling much better。'},
{n:28,zh:'奶奶的健康漸漸變得越來越差。（become）',a:["Grandma's health is becoming worse and worse."],e:'is becoming worse and worse。'},
{n:29,zh:'Dr. Mark Post 對這個問題有一個答案。',a:['Dr. Mark Post has an answer to the question.'],e:'an answer to the question。'},
{n:30,zh:'它對環境較友善，對地球比較好。',a:['It is more friendly to the environment and better for the earth.'],e:'friendly to；better for。'},
{n:31,zh:'女服務生：我可以為您點餐嗎？May：好的。我要一個起司漢堡配薯條。',a:["Waitress: May I take your order? May: Yes. I'll have a cheeseburger with fries.",'Waitress: May I take your order? May: Yes. I will have a cheeseburger with fries.','Waitress: May I take your order? May: Yes. I would like a cheeseburger with fries.'],e:'May I take your order?；with fries。'},
{n:32,zh:'這女服務生漸漸變得越來越友善了。',a:['The waitress is getting more and more friendly.','The waitress is becoming more and more friendly.'],e:'is getting / becoming more and more friendly。'},
{n:33,zh:'公園附近的牛排館是兩間之中比較大的。',a:['The steak house near the park is the bigger of the two.'],e:'限定比較級 the bigger of the two。'},
{n:34,zh:'Sam：我們吃豬肉配薯條吧！Jane：聽起來是個好主意！',a:["Sam: Let's have the pork with fries! Jane: Sounds like a good idea!","Sam: Let's eat the pork with fries! Jane: Sounds like a good idea!","Sam: Let's have the pork with fries! Jane: That sounds like a good idea!","Sam: Let's eat the pork with fries! Jane: That sounds like a great idea!"],e:'Let’s have / eat；Sounds like a good idea。'},
{n:35,zh:'土耳其比臺灣大，也比臺灣冷。',a:['Türkiye is bigger and colder than Taiwan.','Turkey is bigger and colder than Taiwan.'],e:'bigger and colder than。'},
{n:36,zh:'這牛排館裡的女服務生們看起來很漂亮而且聽起來很友善。',a:['The waitresses in the steak house look beautiful and sound friendly.'],e:'look beautiful and sound friendly。'},
{n:37,zh:'這種肉比較乾淨，因為是從實驗室中培養。',a:['This kind of meat is cleaner because it comes from the lab.'],e:'cleaner；come from。'},
{n:38,zh:'女服務生：請問你的牛排要幾分熟？Vera：請做五分熟。',a:['Waitress: How would you like your steak? Vera: Medium, please.'],e:'How would you like your steak?；Medium, please.'}
];const $=id=>document.getElementById(id),norm=s=>String(s||'').toLowerCase().replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/[^a-z0-9'\s]/g,' ').replace(/\s+/g,' ').trim();let selected=[],idx=0,wrong=new Map(),attempted=new Set(),recognition=null;const primary=q=>q.a[0];function renderSelect(){list.innerHTML=Q.map(q=>`<label class="pick"><input type="checkbox" value="${q.n}" checked> <b>第 ${q.n} 題</b>　${q.zh}</label>`).join('')}function showQuestion(){if(idx>=selected.length)return finishQuiz();const q=selected[idx];meta.textContent=`第 ${idx+1} / ${selected.length} 題｜原題號 ${q.n}`;bar.style.width=`${idx/selected.length*100}%`;zh.textContent=q.zh;input.value='';input.className='answerInput';input.disabled=false;fb.className='feedback hidden';voiceBox.classList.add('hidden');next.classList.add('hidden');next.disabled=true;check.classList.remove('hidden');speechSynthesis?.cancel();if(recognition)try{recognition.abort()}catch{}}function startQuiz(arr){selected=arr;idx=0;sel.classList.add('hidden');result.classList.add('hidden');quiz.classList.remove('hidden');showQuestion()}function markWrong(q,ans){if(!wrong.has(q.n))wrong.set(q.n,[]);wrong.get(q.n).push(ans||'(空白)')}check.onclick=()=>{const q=selected[idx],v=input.value.trim();attempted.add(q.n);if(q.a.some(a=>norm(a)===norm(v))){input.classList.add('ok');input.disabled=true;fb.className='feedback ok';fb.innerHTML='✅ 正確！現在請朗讀完整句子。';check.classList.add('hidden');voiceTarget.textContent=primary(q);voiceBox.classList.remove('hidden');next.classList.remove('hidden');next.disabled=true;speakCurrent()}else{markWrong(q,v);input.classList.add('bad');fb.className='feedback bad';fb.innerHTML=`❌ 不正確。<div><b>正確答案：</b>${primary(q)}</div><div>${q.e}</div><div>請重新輸入正確答案。</div>`;input.value='';input.focus()}};next.onclick=()=>{idx++;showQuestion()};finish.onclick=finishQuiz;function finishQuiz(){quiz.classList.add('hidden');result.classList.remove('hidden');speechSynthesis?.cancel();const items=[...wrong.keys()].map(n=>Q.find(q=>q.n===n)).filter(Boolean);summary.innerHTML=`已作答 ${attempted.size} 題；曾答錯 <b>${items.length}</b> 題。`;wrongList.innerHTML=items.length?'<h3>錯題整理</h3>'+items.map(q=>`<div class="wrongcard"><b>第 ${q.n} 題</b><p>${q.zh}</p><p><b>你的錯誤答案：</b>${wrong.get(q.n).join('／')}</p><p><b>正確答案：</b>${primary(q)}</p><p>${q.e}</p></div>`).join(''):'<p>🎉 目前沒有錯題。</p>';retry.disabled=!items.length;download.disabled=!items.length}function speakCurrent(){const q=selected[idx];if(!q||!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(primary(q).replace(/^[A-Za-z]+:\s*/g,''));u.lang='en-US';u.rate=.88;window.speechSynthesis.speak(u)}speak.onclick=speakCurrent;function speechNorm(s){return norm(s).replace(/\bi'm\b/g,'i am').replace(/\bi'll\b/g,'i will').replace(/\bdon't\b/g,'do not').replace(/\bdoesn't\b/g,'does not').replace(/\bwon't\b/g,'will not').replace(/\blet's\b/g,'let us').replace(/\bwhat's\b/g,'what is')}function sim(a,b){const A=speechNorm(a).split(' ').filter(Boolean),B=speechNorm(b).split(' ').filter(Boolean),m=A.length,n=B.length,d=Array.from({length:m+1},()=>Array(n+1).fill(0));for(let i=0;i<=m;i++)d[i][0]=i;for(let j=0;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(A[i-1]===B[j-1]?0:1));return Math.max(0,1-d[m][n]/Math.max(m,n,1))}mic.onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){vr.textContent='此瀏覽器不支援語音辨識，建議使用最新版 Chrome 或 Edge。';next.disabled=false;return}const q=selected[idx];recognition=new SR();recognition.lang='en-US';recognition.interimResults=false;recognition.maxAlternatives=3;mic.disabled=true;vr.textContent='🎤 正在聆聽…';recognition.onresult=e=>{let best={t:'',s:0};for(const r of e.results[0]){const s=sim(r.transcript,primary(q));if(s>best.s)best={t:r.transcript,s}}const pct=Math.round(best.s*100);vr.innerHTML=`辨識：${best.t}<br>相似度：<b>${pct}%</b>`+(pct>=90?'<br>✅ 通過，可以進下一題。':'<br>🔁 未達 90%，請再試一次。');next.disabled=pct<90};recognition.onerror=e=>{vr.textContent=e.error==='not-allowed'?'請允許瀏覽器使用麥克風。':'語音辨識失敗，請再試一次。'};recognition.onend=()=>mic.disabled=false;recognition.start()};retry.onclick=()=>{const arr=[...wrong.keys()].map(n=>Q.find(q=>q.n===n)).filter(Boolean);wrong=new Map();attempted=new Set();startQuiz(arr)};restart.onclick=()=>{wrong=new Map();attempted=new Set();result.classList.add('hidden');sel.classList.remove('hidden')};download.onclick=async()=>{const items=[...wrong.keys()].map(n=>Q.find(q=>q.n===n)).filter(Boolean),children=[new Paragraph({text:'Hanlin B4U1 翻譯題－錯題整理',heading:HeadingLevel.TITLE}),new Paragraph(`錯題數：${items.length}`)];items.forEach(q=>{children.push(new Paragraph({children:[new TextRun({text:`第 ${q.n} 題`,bold:true})]}),new Paragraph(`中文：${q.zh}`),new Paragraph(`學生錯誤答案：${wrong.get(q.n).join('／')}`),new Paragraph(`正確答案：${primary(q)}`),new Paragraph(`解析：${q.e}`),new Paragraph('重新練習：________________________________________'),new Paragraph(''))});const doc=new Document({sections:[{children}]});const blob=await Packer.toBlob(doc),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Hanlin_B4U1_翻譯題_錯題_${new Date().toISOString().slice(0,10)}.docx`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};all.onclick=()=>document.querySelectorAll('#list input').forEach(x=>x.checked=true);none.onclick=()=>document.querySelectorAll('#list input').forEach(x=>x.checked=false);start.onclick=()=>{const ids=[...document.querySelectorAll('#list input:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');wrong=new Map();attempted=new Set();startQuiz(ids.map(n=>Q.find(q=>q.n===n)))};renderSelect();</script></body></html>
