<script>window.QUIZ_CONFIG={"title": "國中會考文法歷屆試題｜片語與搭配詞", "mode": "mcq", "questions": [{"id": 1, "question": "______ exercise after work is a good way for me to forget the troubles in the office.", "options": ["Playing", "Making", "Going", "Doing"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜do exercise（動詞搭配詞）＋Ving 主詞", "explanation": "【句型】Ving 片語當主詞；動詞搭配：do exercise＝做運動。\n【分析】四個選項都是 Ving，可當主詞；關鍵在搭配詞，exercise「運動」要搭配動詞 do，Doing exercise after work「下班後做運動」。\n【其他選項】(A) play 搭配球類（play basketball）；(B) make 不和 exercise 搭配；(C) go 搭配 Ving（go swimming），不接 exercise。\n【例句】Doing exercise every morning keeps my grandpa healthy.", "explanationSource": "source"}, {"id": 2, "question": "______ yoga before bed helps me sleep well.", "options": ["Making", "Doing", "Taking", "Going"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 1 題）", "explanation": "do yoga 為固定搭配。", "explanationSource": "supplemental"}, {"id": 3, "question": "______ jogging in the park is my dad's habit.", "options": ["Going", "Doing", "Making", "Playing"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 1 題）", "explanation": "go jogging 為固定搭配。", "explanationSource": "supplemental"}, {"id": 4, "question": "______ badminton with my sister is fun on weekends.", "options": ["Doing", "Going", "Playing", "Making"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 1 題）", "explanation": "球類運動用 play，play badminton。", "explanationSource": "supplemental"}, {"id": 5, "question": "Gina has always been ______ writing. In fact, she likes writing so much that she has decided to be a writer.", "options": ["embarrassed by", "fond of", "safe in", "worried about"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜be fond of 喜歡", "explanation": "【句型】be fond of + N / Ving「喜歡…」\n【分析】後句 she likes writing so much「她非常喜歡寫作」以 In fact 補充前句，所以前句是「一直很喜歡寫作」→ fond of。\n【其他選項】(A) embarrassed by「因…感到尷尬」、(D) worried about「擔心…」與「喜歡寫作、想當作家」相反；(C) safe in 非此用法，語意不通。\n【例句】My little brother is fond of playing video games.", "explanationSource": "source"}, {"id": 6, "question": "Amy is ______ animals. She has two cats, a dog, and three rabbits.", "options": ["worried about", "afraid of", "fond of", "tired of"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 5 題）", "explanation": "養很多動物表示喜歡動物 fond of。", "explanationSource": "supplemental"}, {"id": 7, "question": "Ryan is ______ his math test. He didn't study at all last night.", "options": ["fond of", "worried about", "proud of", "good at"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 5 題）", "explanation": "沒讀書所以擔心考試 worried about。", "explanationSource": "supplemental"}, {"id": 8, "question": "I was ______ my mistake when everyone laughed at me in class.", "options": ["embarrassed by", "fond of", "good at", "interested in"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 5 題）", "explanation": "大家笑我，因錯誤感到尷尬 embarrassed by。", "explanationSource": "supplemental"}, {"id": 9, "question": "Our school basketball team won the national game last night. We are so ______ them.", "options": ["popular with", "proud of", "sorry for", "worried about"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜be proud of 以…為榮", "explanation": "【句型】be proud of + N「以…為榮」\n【分析】校隊昨晚贏得全國比賽，大家當然以他們為榮 → proud of。\n【其他選項】(A) popular with「受…歡迎」主詞應為被喜愛者，we 不合；(C) sorry for「為…感到難過」、(D) worried about「擔心」都與贏球的喜悅不合。\n【例句】Mom is proud of me because I got first place in the speech contest.", "explanationSource": "source"}, {"id": 10, "question": "Mr. Wu is very ______ his students. They all listen to him and love his classes.", "options": ["sorry for", "worried about", "popular with", "afraid of"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 9 題）", "explanation": "學生都喜歡他 → 他受學生歡迎 popular with。", "explanationSource": "supplemental"}, {"id": 11, "question": "I feel ______ the old man. He lost his wallet and can't go home.", "options": ["proud of", "sorry for", "popular with", "fond of"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 9 題）", "explanation": "老人掉錢包回不了家，為他難過 sorry for。", "explanationSource": "supplemental"}, {"id": 12, "question": "Tina won the singing contest. Her parents are very ______ her.", "options": ["worried about", "sorry for", "tired of", "proud of"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 9 題）", "explanation": "女兒得獎，父母以她為榮 proud of。", "explanationSource": "supplemental"}, {"id": 13, "question": "Henry does well at school and is always polite to his teachers. His friends like him, and his parents are ______ him.", "options": ["good at", "interesting to", "proud of", "worried about"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜be proud of 以…為榮", "explanation": "【句型】be proud of + N「以…為榮」\n【分析】Henry 成績好、有禮貌、朋友喜歡他，父母當然以他為榮 → proud of。\n【其他選項】(A) good at「擅長」後接事物或技能，不接人；(B) interesting to「對…來說有趣」語意不合；(D) worried about「擔心」與前面正面描述矛盾。\n【例句】We are proud of our school's baseball team.", "explanationSource": "source"}, {"id": 14, "question": "Lisa is ______ drawing. She has won many art contests.", "options": ["proud of", "good at", "worried about", "sorry for"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 13 題）", "explanation": "得過很多美術比賽，擅長畫畫 good at。", "explanationSource": "supplemental"}, {"id": 15, "question": "Mom is ______ Dad because he hasn't come home yet and it's already midnight.", "options": ["worried about", "proud of", "good at", "fond of"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 13 題）", "explanation": "半夜還沒回家所以擔心 worried about。", "explanationSource": "supplemental"}, {"id": 16, "question": "Coach Lee is ______ his players. They practiced hard and won the game.", "options": ["afraid of", "tired of", "proud of", "bad at"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 13 題）", "explanation": "球員努力並贏球，教練以他們為榮 proud of。", "explanationSource": "supplemental"}, {"id": 17, "question": "The factory has been throwing trash into the river for years. Now ______ must be taken to stop this.", "options": ["action", "chances", "exercise", "notes"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜take action 採取行動（被動 action must be taken）", "explanation": "【句型】搭配詞 take action「採取行動」；被動語態 action must be taken\n【分析】工廠多年來把垃圾丟入河中，現在必須「採取行動」來阻止 → action must be taken (to V)。\n【其他選項】(B) take chances「冒險」、(D) take notes「做筆記」雖可搭配 take，但語意不合；(C) exercise 搭配 do/get exercise，且語意不通。\n【例句】We should take action to save the earth.", "explanationSource": "source"}, {"id": 18, "question": "Please ______ notes during the class. They will help you review.", "options": ["make", "take", "do", "have"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 17 題）", "explanation": "做筆記 take notes。", "explanationSource": "supplemental"}, {"id": 19, "question": "The government must ______ action to stop air pollution.", "options": ["make", "do", "take", "get"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 17 題）", "explanation": "採取行動 take action。", "explanationSource": "supplemental"}, {"id": 20, "question": "Don't take ______ when you ride a scooter. Always wear a helmet.", "options": ["notes", "action", "exercise", "chances"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 17 題）", "explanation": "不要冒險 take chances。", "explanationSource": "supplemental"}, {"id": 21, "question": "The beach party tonight ______ the end of our summer vacation. Tomorrow we are all going back home and getting ready for school.", "options": ["changes", "marks", "passes", "saves"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜mark the end of 標誌…的結束", "explanation": "【句型】搭配詞 mark the end/beginning of...「標誌著…的結束／開始」\n【分析】今晚的海灘派對之後，明天就要回家準備上學，表示派對「標誌著」暑假結束 → marks。\n【其他選項】(A) changes「改變」、(C) passes「通過、傳遞」、(D) saves「拯救、節省」都不能和 the end of 搭配成合理語意。\n【例句】The graduation ceremony marks the end of our junior high school life.", "explanationSource": "source"}, {"id": 22, "question": "Lunar New Year ______ the beginning of a new year in Taiwan.", "options": ["saves", "passes", "marks", "changes"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 21 題）", "explanation": "農曆新年標誌新一年開始 marks。", "explanationSource": "supplemental"}, {"id": 23, "question": "Turning off the lights when you leave the room ______ energy.", "options": ["marks", "saves", "passes", "changes"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 21 題）", "explanation": "隨手關燈節省能源 saves。", "explanationSource": "supplemental"}, {"id": 24, "question": "Time ______ quickly when you are having fun.", "options": ["passes", "marks", "saves", "changes"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 21 題）", "explanation": "時光飛逝 time passes。", "explanationSource": "supplemental"}, {"id": 25, "question": "Amy's father is very sick. The doctors can do nothing for him, so Amy went to the temple to ______ for him.", "options": ["care", "count", "look", "pray"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜pray for 為…祈禱", "explanation": "【句型】動詞片語 pray for + 人「為某人祈禱」\n【分析】爸爸病重、醫生束手無策，所以 Amy 去廟裡「為他祈禱」→ pray for him。線索 temple「廟」。\n【其他選項】(A) care for「照顧」：應在身邊照顧，不必去廟裡；(B) count for 非此語意；(C) look for「尋找」：爸爸不需要尋找。\n【例句】Let's pray for the people hurt in the earthquake.", "explanationSource": "source"}, {"id": 26, "question": "Nancy stays home every day to ______ her sick grandma.", "options": ["pray for", "care for", "look for", "wait for"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 25 題）", "explanation": "在家照顧生病的奶奶 care for。", "explanationSource": "supplemental"}, {"id": 27, "question": "I'm ______ my glasses. Have you seen them?", "options": ["praying for", "caring for", "looking for", "asking for"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 25 題）", "explanation": "找眼鏡 look for。", "explanationSource": "supplemental"}, {"id": 28, "question": "Many people go to the temple to ______ good luck before the big exam.", "options": ["pray for", "look after", "care about", "pay for"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 25 題）", "explanation": "去廟裡祈求好運 pray for。", "explanationSource": "supplemental"}, {"id": 29, "question": "The baby birds were still hungry so their parents had to fly out to ______ more food.", "options": ["get off", "give up", "look for", "put on"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜look for 尋找", "explanation": "【句型】動詞片語 look for + N「尋找…」\n【分析】小鳥還餓，所以鳥爸媽得飛出去「尋找」更多食物 → look for more food。\n【其他選項】(A) get off「下車」、(B) give up「放棄」、(D) put on「穿上」都與找食物語意不合。\n【例句】I'm looking for my cat. Have you seen her?", "explanationSource": "source"}, {"id": 30, "question": "Please ______ the bus at the next stop. The museum is right there.", "options": ["look for", "get off", "give up", "put on"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 29 題）", "explanation": "在下一站下車 get off。", "explanationSource": "supplemental"}, {"id": 31, "question": "It's cold outside. ______ your coat before you go out.", "options": ["Put on", "Look for", "Give up", "Get off"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 29 題）", "explanation": "天冷先穿外套 put on。", "explanationSource": "supplemental"}, {"id": 32, "question": "Mr. Chen lost his job, so he is ______ a new one now.", "options": ["giving up", "getting off", "looking for", "putting on"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 29 題）", "explanation": "失業後在找新工作 look for。", "explanationSource": "supplemental"}, {"id": 33, "question": "Sally got angry because her little brother ______ the fan when she was still working on the computer.", "options": ["cheated", "closed", "got off", "turned off"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜turn off 關掉（電器）", "explanation": "【句型】動詞片語 turn off + 電器「關掉（電器、開關）」\n【分析】Sally 還在用電腦時，弟弟把電扇「關掉」，所以她生氣 → turned off the fan。\n【其他選項】(A) cheated「欺騙」語意不合；(B) closed「關（門窗等）」，電器開關要用 turn off；(C) got off「下（車）」不合。\n【例句】Please turn off the lights when you leave the classroom.", "explanationSource": "source"}, {"id": 34, "question": "It's too dark in here. Can you ______ the light?", "options": ["turn on", "turn off", "close", "get off"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 33 題）", "explanation": "太暗要開燈 turn on。", "explanationSource": "supplemental"}, {"id": 35, "question": "Please ______ the window. It's raining outside.", "options": ["turn off", "get off", "close", "put on"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 33 題）", "explanation": "關窗戶用 close。", "explanationSource": "supplemental"}, {"id": 36, "question": "Don't forget to ______ the TV before you go to bed.", "options": ["get off", "turn off", "close down", "put off"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 33 題）", "explanation": "睡前關電視 turn off。", "explanationSource": "supplemental"}, {"id": 37, "question": "I told you this road went the wrong way, but you just wouldn't listen. Now we have to ______ and take another road.", "options": ["go ahead", "move away", "pass by", "turn back"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜turn back 折返、往回走", "explanation": "【句型】動詞片語 turn back「往回走、折返」\n【分析】走錯路了，現在得「折返」改走另一條路 → turn back and take another road。\n【其他選項】(A) go ahead「繼續前進」與換路矛盾；(B) move away「搬走」；(C) pass by「經過」都不合語意。\n【例句】It started to rain, so we turned back and went home.", "explanationSource": "source"}, {"id": 38, "question": "Our family will ______ to Kaohsiung next month because Dad got a new job there.", "options": ["turn back", "move away", "pass by", "go ahead"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 37 題）", "explanation": "因工作搬離（到高雄）move away。", "explanationSource": "supplemental"}, {"id": 39, "question": "Can I ask you a question? —Sure, ______.", "options": ["go ahead", "turn back", "pass by", "move away"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 37 題）", "explanation": "「請說」go ahead。", "explanationSource": "supplemental"}, {"id": 40, "question": "I ______ the bookstore every day on my way to school.", "options": ["turn back", "go ahead", "pass by", "move away"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 37 題）", "explanation": "上學途中經過書店 pass by。", "explanationSource": "supplemental"}, {"id": 41, "question": "Though Jack was poor and sick, he never ______ any chance to write. That is why he finally became a successful writer.", "options": ["agreed to", "gave up", "looked for", "thought of"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜give up 放棄", "explanation": "【句型】動詞片語 give up + N/Ving「放棄…」\n【分析】雖然又窮又病（Though），他從不「放棄」任何寫作的機會，因此最後成為成功作家 → never gave up any chance。\n【其他選項】(A) agreed to「同意」、(C) looked for「尋找」、(D) thought of「想到」放入 never ___ any chance 都無法說明他成功的原因。\n【例句】Don't give up your dream just because it's hard.", "explanationSource": "source"}, {"id": 42, "question": "Grandpa ______ smoking last year because it was bad for his health.", "options": ["gave up", "looked for", "agreed to", "put on"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 41 題）", "explanation": "為健康戒菸 give up smoking。", "explanationSource": "supplemental"}, {"id": 43, "question": "Mom finally ______ let us keep a dog.", "options": ["gave up", "agreed to", "looked for", "thought of"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 41 題）", "explanation": "終於同意讓我們養狗 agreed to + V。", "explanationSource": "supplemental"}, {"id": 44, "question": "Have you ______ a good name for your new puppy?", "options": ["given up", "agreed to", "thought of", "taken off"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 41 題）", "explanation": "想到好名字 think of。", "explanationSource": "supplemental"}, {"id": 45, "question": "Lexie ______ reading maps. Even with a map, she still cannot find her way when she is in a foreign city.", "options": ["is careful about", "is good at", "has fun", "has trouble"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜have trouble (in) Ving 做…有困難", "explanation": "【句型】have trouble (in) + Ving「做…有困難」\n【分析】後句「就算有地圖，在外國城市還是找不到路」，表示她看地圖有困難 → has trouble reading maps。\n【其他選項】(A) is careful about「對…很小心」、(B) is good at「擅長」與找不到路矛盾；(C) has fun (Ving)「做…很開心」也不合語意。\n【例句】Many students have trouble remembering new words.", "explanationSource": "source"}, {"id": 46, "question": "Joe ______ singing. He won first place in the school singing contest.", "options": ["has trouble", "is good at", "is afraid of", "is tired of"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 45 題）", "explanation": "得歌唱比賽冠軍表示擅長唱歌 good at。", "explanationSource": "supplemental"}, {"id": 47, "question": "My grandma ______ hearing, so please speak louder to her.", "options": ["has trouble", "has fun", "is good at", "is fond of"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 45 題）", "explanation": "要大聲說話，表示她聽力有困難 has trouble hearing。", "explanationSource": "supplemental"}, {"id": 48, "question": "We ______ playing in the snow on our trip to Japan last winter.", "options": ["had trouble", "were careful", "had fun", "were worried"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 45 題）", "explanation": "在雪地玩得很開心 had fun Ving。", "explanationSource": "supplemental"}, {"id": 49, "question": "Joseph was painting the wall when the phone rang. He quickly ______ his brush and ran to answer it.", "options": ["gave up", "handed in", "put down", "took away"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜put down 放下", "explanation": "【句型】動詞片語 put down + N「放下…」\n【分析】油漆牆壁時電話響了，他很快「放下」刷子跑去接電話 → put down his brush。\n【其他選項】(A) gave up「放棄」、(B) handed in「繳交」、(D) took away「拿走」都不符合接電話前的動作。\n【例句】Please put down your pencils. The test is over.", "explanationSource": "source"}, {"id": 50, "question": "Please ______ your reports before Friday.", "options": ["put down", "hand in", "take away", "give up"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 49 題）", "explanation": "週五前交報告 hand in。", "explanationSource": "supplemental"}, {"id": 51, "question": "The waiter ______ our plates after we finished eating.", "options": ["took away", "put down", "handed in", "gave up"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 49 題）", "explanation": "吃完後服務生收走盤子 took away。", "explanationSource": "supplemental"}, {"id": 52, "question": "When the teacher came in, the students ______ their phones and opened their books.", "options": ["handed in", "gave up", "took away", "put down"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 49 題）", "explanation": "老師進來，學生放下手機 put down。", "explanationSource": "supplemental"}, {"id": 53, "question": "Jack likes to ______. He always tells his friends that he has many beautiful girlfriends.", "options": ["get off", "give up", "shut up", "show off"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜show off 炫耀", "explanation": "【句型】show off 炫耀、賣弄。\n【分析】後句說他總是告訴朋友自己有很多漂亮女友，這是在「炫耀」，故選 show off。\n【其他選項】(A) get off 下車；(B) give up 放棄；(C) shut up 閉嘴，皆與「到處誇耀」語意不符。\n【例句】Tina likes to show off her new phone at school.（Tina 喜歡在學校炫耀她的新手機。）", "explanationSource": "source"}, {"id": 54, "question": "Kevin got a new bike, and he rode it around the park to ______ to everyone.", "options": ["show off", "take off", "put off", "turn off"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 53 題）", "explanation": "到處騎給大家看是在「炫耀」，show off 為正解。", "explanationSource": "supplemental"}, {"id": 55, "question": "I'm tired. Please ______ the TV and let me sleep.", "options": ["show off", "give up", "turn off", "get off"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 53 題）", "explanation": "想睡覺要「關掉」電視，turn off。", "explanationSource": "supplemental"}, {"id": 56, "question": "Don't ______ trying. You will learn to swim if you keep practicing.", "options": ["get off", "show off", "put on", "give up"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 53 題）", "explanation": "勸人持續練習，即「不要放棄」，give up。", "explanationSource": "supplemental"}, {"id": 57, "question": "Jim grew up with many animals at home and knows well how to ______ pets.", "options": ["belong to", "get away from", "take care of", "wake up"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜take care of 照顧", "explanation": "【句型】take care of + 人／動物＝照顧。\n【分析】Jim 從小和許多動物一起長大，所以很懂得如何「照顧」寵物，選 take care of。\n【其他選項】(A) belong to 屬於；(B) get away from 逃離；(D) wake up 醒來／叫醒，皆不合語意。\n【例句】Amy takes care of her little brother after school.（Amy 放學後照顧弟弟。）", "explanationSource": "source"}, {"id": 58, "question": "When my parents are away, my grandma ______ me and my sister.", "options": ["looks for", "takes care of", "belongs to", "gets along"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 57 題）", "explanation": "父母不在時由奶奶「照顧」我們，take care of。", "explanationSource": "supplemental"}, {"id": 59, "question": "This old bike ______ my uncle. He rode it to school when he was young.", "options": ["takes care of", "wakes up", "belongs to", "looks after"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 57 題）", "explanation": "「屬於」叔叔的腳踏車，belong to。", "explanationSource": "supplemental"}, {"id": 60, "question": "Ben must ______ early tomorrow because his train leaves at six.", "options": ["take care of", "get away from", "belong to", "wake up"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 57 題）", "explanation": "火車六點開，要「早起」，wake up。", "explanationSource": "supplemental"}, {"id": 61, "question": "This restaurant is ______ for its chicken soup. Many people come to eat it.", "options": ["crazy", "delicious", "famous", "sharp"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜be famous for 以…聞名", "explanation": "【句型】be famous for + N＝因…而有名。\n【分析】空格後接 for its chicken soup，且「很多人來吃」，可知是「以雞湯聞名」，選 famous。\n【其他選項】(A) be crazy about 才是「熱愛」，且 crazy for 不符語意；(B) delicious 美味的，不接 for；(D) sharp 尖銳的，不合語意。\n【例句】Tainan is famous for its delicious snacks.（台南以美味小吃聞名。）", "explanationSource": "source"}, {"id": 62, "question": "Yilan is ______ for its hot springs. Many visitors go there in winter.", "options": ["famous", "afraid", "proud", "full"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 61 題）", "explanation": "冬天很多遊客去泡溫泉，宜蘭「以溫泉聞名」，be famous for。", "explanationSource": "supplemental"}, {"id": 63, "question": "My brother is ______ about baseball. He watches every CPBL game.", "options": ["famous", "afraid", "crazy", "able"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 61 題）", "explanation": "每場比賽都看，表示他「熱愛」棒球，be crazy about。", "explanationSource": "supplemental"}, {"id": 64, "question": "Be careful with that knife. It's very ______.", "options": ["famous", "sharp", "delicious", "serious"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 61 題）", "explanation": "刀子要小心，因為很「鋒利」，sharp。", "explanationSource": "supplemental"}, {"id": 65, "question": "The driving test is not very difficult, and most people are ______ to pass it.", "options": ["able", "afraid", "correct", "serious"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜be able to V 能夠", "explanation": "【句型】be able to + 原形 V＝能夠做…。\n【分析】前句說駕照考試不難，所以大部分人都「能夠」通過，選 able。\n【其他選項】(B) be afraid to V 害怕去做，與「考試不難」矛盾；(C) correct 正確的，不接 to V；(D) serious 嚴肅的，不合語意。\n【例句】After practicing for a month, Leo was able to ride a bike.（練了一個月後，Leo 能騎腳踏車了。）", "explanationSource": "source"}, {"id": 66, "question": "The box is too heavy. I'm not ______ to carry it by myself.", "options": ["afraid", "able", "sure", "famous"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 65 題）", "explanation": "箱子太重，我「無法」自己搬，be able to。", "explanationSource": "supplemental"}, {"id": 67, "question": "Mia is ______ to speak in front of the class because she is very shy.", "options": ["able", "famous", "afraid", "correct"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 65 題）", "explanation": "她很害羞，所以「害怕」在全班面前說話，be afraid to V。", "explanationSource": "supplemental"}, {"id": 68, "question": "Please check your answers again. Make sure they are all ______.", "options": ["correct", "able", "afraid", "serious"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 65 題）", "explanation": "檢查答案確保都「正確」，correct。", "explanationSource": "supplemental"}, {"id": 69, "question": "The turtle is the animal my sister is most ______ of. She cries and runs away even when she sees a picture of one.", "options": ["sure", "shy", "proud", "afraid"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜be afraid of 害怕", "explanation": "【句型】be afraid of + N＝害怕…。\n【分析】看到烏龜圖片就哭著跑開，表示最「害怕」烏龜；空格後有 of，選 afraid。\n【其他選項】(A) be sure of 確定；(B) shy 害羞的，常接 with/about；(C) be proud of 以…為傲，皆與「哭著跑開」不符。\n【例句】Many children are afraid of the dark.（許多小孩怕黑。）", "explanationSource": "source"}, {"id": 70, "question": "Lucy won first prize in the speech contest. Her parents are very ______ of her.", "options": ["afraid", "proud", "tired", "full"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 69 題）", "explanation": "得獎讓父母「以她為傲」，be proud of。", "explanationSource": "supplemental"}, {"id": 71, "question": "Ken never goes near the water because he is ______ of swimming in deep places.", "options": ["afraid", "proud", "famous", "full"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 69 題）", "explanation": "不靠近水是因為「害怕」，be afraid of。", "explanationSource": "supplemental"}, {"id": 72, "question": "Are you ______ of the time of the meeting? I don't want to be late.", "options": ["proud", "afraid", "sure", "tired"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 69 題）", "explanation": "確認開會時間，be sure of「確定」。", "explanationSource": "supplemental"}, {"id": 73, "question": "When I heard my baby girl say her first word, my heart was ______ with joy.", "options": ["filled", "marked", "prepared", "shown"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜be filled with 充滿", "explanation": "【句型】be filled with + N＝充滿…（= be full of）。\n【分析】聽到女兒說出第一個字，心中「充滿」喜悅；空格後接 with joy，選 filled。\n【其他選項】(B) marked 被標記；(C) prepared 被準備；(D) shown 被展示，都不能和 with joy 搭配成合理語意。\n【例句】The classroom was filled with laughter.（教室裡充滿笑聲。）", "explanationSource": "source"}, {"id": 74, "question": "After the concert, the streets were ______ with happy fans.", "options": ["shown", "filled", "marked", "covered by"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 73 題）", "explanation": "街上「擠滿」歌迷，be filled with。", "explanationSource": "supplemental"}, {"id": 75, "question": "The bottle is ______ of water. Don't put any more in it.", "options": ["full", "filled", "empty", "made"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 73 題）", "explanation": "空格後接 of，be full of「裝滿」。", "explanationSource": "supplemental"}, {"id": 76, "question": "The mountain is ______ with snow in winter, so it looks white.", "options": ["filled", "full", "covered", "made"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 73 題）", "explanation": "山「被雪覆蓋」，be covered with。", "explanationSource": "supplemental"}, {"id": 77, "question": "Jean: Thanks for driving me to the station. You didn't have to.\nSam: But I wanted to. It's my ______. And I had a good time talking with you.", "options": ["bus", "homework", "pleasure", "problem"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜It's my pleasure. 我的榮幸／不客氣", "explanation": "【句型】回應道謝：It's my pleasure. / My pleasure.＝不客氣、這是我的榮幸。\n【分析】Jean 道謝，Sam 說「是我想做的」，又說和她聊得很開心，故回答「這是我的榮幸」，選 pleasure。\n【其他選項】(A) bus 公車；(B) homework 作業；(D) problem 問題，It's my problem 意思為「是我的問題」，不合道謝情境。\n【例句】A: Thank you for helping me. B: It's my pleasure.（A：謝謝你幫我。B：不客氣。）", "explanationSource": "source"}, {"id": 78, "question": "Ann: Thanks for lending me your umbrella.\nBob: ______ I'm glad I could help.", "options": ["My pleasure.", "That's too bad.", "Not at all bad.", "Good luck."], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 77 題）", "explanation": "回應道謝用 My pleasure.「不客氣」。", "explanationSource": "supplemental"}, {"id": 79, "question": "Eric: I'm sorry I broke your pencil.\nDora: ______ I have another one.", "options": ["My pleasure.", "Congratulations!", "Never mind.", "Help yourself."], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 77 題）", "explanation": "回應道歉用 Never mind.「沒關係」。", "explanationSource": "supplemental"}, {"id": 80, "question": "Grace: Can I have some cookies?\nHenry: Sure. ______", "options": ["Never mind.", "It's my problem.", "No way.", "Help yourself."], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 77 題）", "explanation": "請對方自己取用：Help yourself.", "explanationSource": "supplemental"}, {"id": 81, "question": "Denny: I guess Alice likes you. Her face always turns red when you talk to her.\nDavid: ______ She's just shy with boys.", "options": ["Why not?", "I'm really surprised!", "That's right!", "I don't think so."], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜對話回應語 I don't think so.", "explanation": "【句型】表達不同意：I don't think so.＝我不這麼認為。\n【分析】David 接著說「她只是對男生害羞」，表示他不同意 Alice 喜歡他的說法，選 I don't think so.\n【其他選項】(A) Why not? 為何不（表贊成邀約）；(B) 真驚訝，但後句是在解釋否定；(C) That's right! 表同意，與後句矛盾。\n【例句】A: Is it going to rain today? B: I don't think so. The sky is clear.（A：今天會下雨嗎？B：我不這麼認為，天空很晴朗。）", "explanationSource": "source"}, {"id": 82, "question": "Olivia: Let's go to the night market tonight.\nPeter: ______ I'm hungry, too.", "options": ["I don't think so.", "Why not?", "Never mind.", "That's too bad."], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 81 題）", "explanation": "接受邀約可說 Why not?「好啊」。", "explanationSource": "supplemental"}, {"id": 83, "question": "Rita: I think the test is very easy.\nSteve: ______ I couldn't finish half of it.", "options": ["That's right!", "Why not?", "I don't think so.", "Me too."], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 81 題）", "explanation": "後句說寫不完一半，表示不同意，I don't think so。", "explanationSource": "supplemental"}, {"id": 84, "question": "Tony: Paris is the capital of France, right?\nUma: ______ I went there last year.", "options": ["That's right!", "I don't think so.", "No way.", "Why not?"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 81 題）", "explanation": "陳述正確，表示同意：That's right!", "explanationSource": "supplemental"}, {"id": 85, "question": "At the end of the baseball game, all the players ______ the fans to thank them for coming to the game.", "options": ["agreed with", "arrived with", "bowed to", "checked out"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜bow to 向…鞠躬", "explanation": "【句型】bow to + 人＝向某人鞠躬。\n【分析】比賽結束後，球員為了「感謝」球迷到場而向球迷「鞠躬」，選 bowed to。\n【其他選項】(A) agreed with 同意；(B) arrived with 與…一起抵達；(D) checked out 退房／查看，皆不合「致謝」的動作。\n【例句】The students bowed to their teacher on Teachers' Day.（學生在教師節向老師鞠躬。）", "explanationSource": "source"}, {"id": 86, "question": "After the show, the dancers ______ the audience and walked off the stage.", "options": ["agreed with", "bowed to", "checked out", "belonged to"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 85 題）", "explanation": "表演結束向觀眾「鞠躬」，bow to。", "explanationSource": "supplemental"}, {"id": 87, "question": "I don't ______ you. I think the movie was boring.", "options": ["bow to", "check out", "arrive at", "agree with"], "answer": 3, "answerLabel": "D", "source": "類似題 2（對應第 85 題）", "explanation": "後句表達不同看法，「同意」agree with 的否定。", "explanationSource": "supplemental"}, {"id": 88, "question": "We have to ______ of the hotel before eleven tomorrow morning.", "options": ["check out", "bow to", "agree with", "arrive at"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 85 題）", "explanation": "離開飯店要「退房」，check out of。", "explanationSource": "supplemental"}, {"id": 89, "question": "We don't have enough toys for each child, so they will have to ______ them with each other.", "options": ["follow", "prepare", "repeat", "share"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜share A with B 與…分享", "explanation": "【句型】share + 物 + with + 人＝和某人分享某物。\n【分析】玩具不夠每個孩子各一個，所以要彼此「分享」；空格後有 with each other，選 share。\n【其他選項】(A) follow 跟隨；(B) prepare 準備；(C) repeat 重複，都不合「玩具不夠」的語意。\n【例句】Kelly shared her lunch with her new classmate.（Kelly 和新同學分享午餐。）", "explanationSource": "source"}, {"id": 90, "question": "There's only one umbrella, so Lisa ______ it with her brother on the way home.", "options": ["shared", "followed", "repeated", "prepared"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 89 題）", "explanation": "只有一把傘，和弟弟「共用」，share A with B。", "explanationSource": "supplemental"}, {"id": 91, "question": "Mom is in the kitchen ______ dinner for the family.", "options": ["sharing", "preparing", "repeating", "following"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 89 題）", "explanation": "在廚房「準備」晚餐，prepare。", "explanationSource": "supplemental"}, {"id": 92, "question": "I didn't hear you clearly. Could you ______ the question, please?", "options": ["share", "prepare", "repeat", "follow"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 89 題）", "explanation": "沒聽清楚，請對方「重複」問題，repeat。", "explanationSource": "supplemental"}, {"id": 93, "question": "You have been in front of the computer for more than five hours. It's time for you to ______ and relax.", "options": ["get up early", "show off", "shut up", "get some exercise"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜get some exercise 做些運動", "explanation": "【句型】get / do some exercise＝做點運動；It's time for sb to V＝該是某人做…的時候了。\n【分析】已經在電腦前五小時以上，應該起來「做點運動」放鬆一下，and relax 是線索，選 get some exercise。\n【其他選項】(A) get up early 早起，與「坐太久」無關；(B) show off 炫耀；(C) shut up 閉嘴，都不合語意。\n【例句】Let's get some exercise in the park after dinner.（晚餐後我們去公園運動一下吧。）", "explanationSource": "source"}, {"id": 94, "question": "You look tired after studying all day. Why don't you go out and ______?", "options": ["show off", "get some exercise", "shut up", "give up"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 93 題）", "explanation": "讀書一整天很累，建議出去「運動一下」，get some exercise。", "explanationSource": "supplemental"}, {"id": 95, "question": "If you want to catch the first bus, you have to ______ tomorrow.", "options": ["get up early", "show off", "get some exercise", "shut up"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 93 題）", "explanation": "要趕第一班公車就要「早起」，get up early。", "explanationSource": "supplemental"}, {"id": 96, "question": "The movie has started. Could you please ______? I can't hear anything.", "options": ["get up early", "get some exercise", "show off", "shut up"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 93 題）", "explanation": "電影開始還在講話，請對方「閉嘴」，shut up。", "explanationSource": "supplemental"}, {"id": 97, "question": "I need a quiet place to study in, because I am going to ______ tomorrow.", "options": ["take a test", "take a seat", "have a bath", "have a dialogue"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜take a test 參加考試", "explanation": "【句型】take a test / an exam＝參加考試。\n【分析】需要安靜地方「讀書」，因為明天要「考試」，選 take a test。\n【其他選項】(B) take a seat 坐下；(C) have a bath 洗澡；(D) have a dialogue 對話，都和「需要讀書」沒有因果關係。\n【例句】We will take a math test next Monday.（我們下週一要考數學。）", "explanationSource": "source"}, {"id": 98, "question": "Please ______. The doctor will see you in a few minutes.", "options": ["take a test", "take a seat", "take a bath", "take a walk"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 97 題）", "explanation": "請病人先「坐下」等候，take a seat。", "explanationSource": "supplemental"}, {"id": 99, "question": "Owen studied hard all week because he had to ______ on Friday.", "options": ["take a seat", "take a bath", "take a test", "take a picture"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 97 題）", "explanation": "整週用功是因為週五要「考試」，take a test。", "explanationSource": "supplemental"}, {"id": 100, "question": "After playing basketball, Ray felt dirty, so he went home to ______.", "options": ["take a test", "take a seat", "take a walk", "take a bath"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 97 題）", "explanation": "打完球很髒，回家「洗澡」，take a bath。", "explanationSource": "supplemental"}, {"id": 101, "question": "(On the cell phone)\nStacy: Where are you? I can't see you here at the theater.\nGreg: ______. I'm just one block away.", "options": ["Nice talking to you", "I'm coming", "Hurry up", "Hope to see you soon"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜電話用語 I'm coming. 我馬上到", "explanation": "【句型】I'm coming.＝我就來了／我快到了（現在進行式表即將發生）。\n【分析】Stacy 找不到 Greg，Greg 說他只差一個街區，表示「我快到了」，選 I'm coming。\n【其他選項】(A) 很高興和你聊天，用於結束對話；(C) Hurry up 快點，應是等人的 Stacy 說的話；(D) 希望很快見到你，語氣像道別，不合情境。\n【例句】A: Dinner is ready! B: I'm coming!（A：晚餐好了！B：我來了！）", "explanationSource": "source"}, {"id": 102, "question": "Mom: Kevin, it's time for school. Where are you?\nKevin: ______ I'm putting on my shoes.", "options": ["Hurry up!", "I'm coming!", "Nice to meet you.", "Help yourself."], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 101 題）", "explanation": "媽媽在催，Kevin 回答「我來了」，I'm coming。", "explanationSource": "supplemental"}, {"id": 103, "question": "Wendy: The bus will leave in two minutes. ______\nZack: OK, I'm running!", "options": ["Hurry up!", "I'm coming!", "Take your time.", "Never mind."], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 101 題）", "explanation": "公車快開了，催對方「快點」，Hurry up。", "explanationSource": "supplemental"}, {"id": 104, "question": "Ivy: I have to go now. Bye!\nJoe: Bye! ______", "options": ["I'm coming.", "Hurry up.", "Nice talking to you.", "Who's calling?"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 101 題）", "explanation": "結束對話道別時說「很高興和你聊天」。", "explanationSource": "supplemental"}, {"id": 105, "question": "Ms. Smith is ______ at telling stories, so all of her students enjoy story time in her class very much.", "options": ["convenient", "excellent", "lucky", "ready"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜be excellent at 擅長", "explanation": "【句型】be excellent at + N / Ving＝擅長…（= be good at）。\n【分析】學生都很喜歡她的說故事時間，因為她「很會」說故事；空格後接 at telling，選 excellent。\n【其他選項】(A) convenient 方便的；(C) lucky 幸運的；(D) be ready for/to 準備好，都不接 at Ving 表擅長。\n【例句】Paul is excellent at playing the piano.（Paul 很擅長彈鋼琴。）", "explanationSource": "source"}, {"id": 106, "question": "Ella is ______ at drawing. Her pictures often win prizes.", "options": ["excellent", "ready", "lucky", "convenient"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 105 題）", "explanation": "畫作常得獎，表示她「擅長」畫畫，be excellent at。", "explanationSource": "supplemental"}, {"id": 107, "question": "The MRT station is near my home, so it's very ______ for me to go downtown.", "options": ["excellent", "ready", "convenient", "lucky"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 105 題）", "explanation": "捷運站在附近，去市區很「方便」，convenient。", "explanationSource": "supplemental"}, {"id": 108, "question": "Are you ______ for the trip? We're leaving in ten minutes.", "options": ["excellent", "convenient", "lucky", "ready"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 105 題）", "explanation": "十分鐘後出發，問是否「準備好」，be ready for。", "explanationSource": "supplemental"}, {"id": 109, "question": "Michael: Mom, I got the best grade on the English test today.\nMrs. Lee: Good job, son. I'm ______ of you.", "options": ["sure", "sick", "afraid", "proud"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜be proud of 以…為傲", "explanation": "【句型】be proud of + 人／事＝以…為榮。\n【分析】兒子英文考最高分，媽媽說 Good job，表示「以你為傲」，選 proud。\n【其他選項】(A) be sure of 確定；(B) be sick of 厭倦；(C) be afraid of 害怕，都不合稱讚的語氣。\n【例句】Taiwanese people are proud of their baseball team.（台灣人以他們的棒球隊為傲。）", "explanationSource": "source"}, {"id": 110, "question": "I'm ______ of eating instant noodles every day. I want something different.", "options": ["proud", "sick", "sure", "afraid"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 109 題）", "explanation": "每天吃泡麵想換口味，表示「厭倦」，be sick of。", "explanationSource": "supplemental"}, {"id": 111, "question": "Mr. Chen is very ______ of his daughter because she helped many old people.", "options": ["afraid", "sick", "proud", "sure"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 109 題）", "explanation": "女兒幫助許多老人，爸爸「以她為傲」，be proud of。", "explanationSource": "supplemental"}, {"id": 112, "question": "Are you ______ of your answer? You can still change it.", "options": ["sure", "proud", "sick", "afraid"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 109 題）", "explanation": "問對方是否「確定」答案，be sure of。", "explanationSource": "supplemental"}, {"id": 113, "question": "When we stayed at the country house, we had only enough water for drinking. That's why we did not take a ______ for two days.", "options": ["bath", "rest", "vacation", "walk"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜take a bath 洗澡", "explanation": "【句型】take a bath＝洗澡；take a rest／walk／vacation 分別為休息／散步／度假。\n【分析】水只夠喝，所以兩天沒「洗澡」，選 bath。\n【其他選項】(B) rest 休息；(C) vacation 度假；(D) walk 散步，都不需要用水，與「水只夠喝」沒有因果關係。\n【例句】Linda takes a hot bath before going to bed.（Linda 睡前洗熱水澡。）", "explanationSource": "source"}, {"id": 114, "question": "You've been working for hours. Sit down and take a ______.", "options": ["bath", "rest", "vacation", "test"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 113 題）", "explanation": "工作好幾小時，坐下來「休息」一下，take a rest。", "explanationSource": "supplemental"}, {"id": 115, "question": "It's a nice evening. Let's take a ______ along the river.", "options": ["bath", "test", "rest", "walk"], "answer": 3, "answerLabel": "D", "source": "類似題 2（對應第 113 題）", "explanation": "天氣好去河邊「散步」，take a walk。", "explanationSource": "supplemental"}, {"id": 116, "question": "Mr. Huang worked hard all year, so he is going to take a ______ in Japan.", "options": ["walk", "bath", "vacation", "seat"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 113 題）", "explanation": "辛苦一年去日本「度假」，take a vacation。", "explanationSource": "supplemental"}, {"id": 117, "question": "The noise those boys are making is giving me a(n) ______. Can you do anything about it?", "options": ["break", "excuse", "hand", "headache"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜give sb a headache 讓人頭痛", "explanation": "【句型】give sb a headache＝讓某人頭痛（可指真的頭痛或很煩）。\n【分析】男孩們製造的噪音讓我「頭痛」，所以請對方處理，選 headache。\n【其他選項】(A) give sb a break 讓某人休息／饒了某人；(B) excuse 藉口；(C) give sb a hand 幫忙，都不是噪音造成的結果。\n【例句】This math problem is giving me a headache.（這道數學題讓我很頭痛。）", "explanationSource": "source"}, {"id": 118, "question": "This box is heavy. Can you give me a ______?", "options": ["hand", "headache", "break", "excuse"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 117 題）", "explanation": "箱子很重請人「幫忙」，give sb a hand。", "explanationSource": "supplemental"}, {"id": 119, "question": "You've been studying for three hours. Give yourself a ______ and have some tea.", "options": ["hand", "headache", "break", "chance"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 117 題）", "explanation": "讀了三小時，讓自己「休息一下」，give yourself a break。", "explanationSource": "supplemental"}, {"id": 120, "question": "Sam was late again, and he gave the teacher another ______ about missing the bus.", "options": ["break", "hand", "headache", "excuse"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 117 題）", "explanation": "又遲到並說沒趕上公車，是「藉口」，excuse。", "explanationSource": "supplemental"}, {"id": 121, "question": "Everyone ______ mistakes in his or her life. The important thing is not to repeat them.", "options": ["does", "forgets", "makes", "takes"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜make mistakes 犯錯", "explanation": "【句型】make a mistake / mistakes＝犯錯（固定搭配動詞為 make）。\n【分析】每個人一生中都會「犯錯」，重要的是不要重蹈覆轍，mistakes 搭配 make。\n【其他選項】(A) do 不與 mistakes 搭配；(B) forget mistakes 忘記錯誤，與後句「不要重複」邏輯不合；(D) take 不與 mistakes 搭配。\n【例句】Don't be afraid to make mistakes when you speak English.（說英文時別怕犯錯。）", "explanationSource": "source"}, {"id": 122, "question": "Please check your homework again. You ______ three mistakes in it.", "options": ["did", "made", "took", "had"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 121 題）", "explanation": "犯錯固定用 make mistakes。", "explanationSource": "supplemental"}, {"id": 123, "question": "Jenny always ______ her homework right after dinner.", "options": ["makes", "takes", "does", "gives"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 121 題）", "explanation": "做功課固定用 do homework。", "explanationSource": "supplemental"}, {"id": 124, "question": "Let's ______ a picture in front of Taipei 101.", "options": ["make", "do", "give", "take"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 121 題）", "explanation": "拍照固定用 take a picture。", "explanationSource": "supplemental"}, {"id": 125, "question": "Jane: Ned hasn't talked to me for two days because I laughed at his hair color. What should I do?\nLois: You should go and tell him that you're sorry. He's nice, and I'm sure he'll give you another ______.", "options": ["chance", "excuse", "headache", "lesson"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜give sb another chance 再給某人一次機會", "explanation": "【句型】give sb another chance＝再給某人一次機會。\n【分析】勸 Jane 去道歉，Ned 人很好，一定會「再給妳一次機會」，選 chance。\n【其他選項】(B) excuse 藉口；(C) headache 頭痛；(D) lesson 課／教訓，皆不合「原諒」的語意。\n【例句】I failed the test, but my teacher gave me another chance.（我考不及格，但老師再給我一次機會。）", "explanationSource": "source"}, {"id": 126, "question": "I'm sorry I broke your cup. Please give me another ______. I'll be more careful.", "options": ["chance", "lesson", "headache", "letter"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 125 題）", "explanation": "請求原諒並保證小心，「再給一次機會」，chance。", "explanationSource": "supplemental"}, {"id": 127, "question": "Losing the game taught us an important ______: we need more practice.", "options": ["chance", "excuse", "lesson", "headache"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 125 題）", "explanation": "比賽輸了學到「教訓」，lesson。", "explanationSource": "supplemental"}, {"id": 128, "question": "Bill always has an ______ for not doing his homework.", "options": ["lesson", "chance", "headache", "excuse"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 125 題）", "explanation": "沒做功課總有「藉口」，excuse。", "explanationSource": "supplemental"}, {"id": 129, "question": "Mike: I always forget what I want to buy when I go to the market.\nOscar: Well, you can make a ______ of things you want to buy.", "options": ["habit", "list", "pack", "wish"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜make a list 列清單", "explanation": "【句型】make a list of + N＝列出…的清單。\n【分析】Mike 總是忘記要買什麼，Oscar 建議他把要買的東西「列成清單」，選 list。\n【其他選項】(A) make a habit of 養成…習慣，不合；(C) pack 包裹；(D) make a wish 許願，都無法解決「忘記要買什麼」。\n【例句】Mom made a list of things to buy for the party.（媽媽列了派對要買的東西清單。）", "explanationSource": "source"}, {"id": 130, "question": "Before the trip, Rose made a ______ of everything she needed to bring.", "options": ["wish", "list", "habit", "noise"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 129 題）", "explanation": "旅行前把要帶的東西「列成清單」，make a list。", "explanationSource": "supplemental"}, {"id": 131, "question": "Close your eyes and make a ______ before you blow out the candles.", "options": ["list", "habit", "wish", "mistake"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 129 題）", "explanation": "吹蠟燭前「許願」，make a wish。", "explanationSource": "supplemental"}, {"id": 132, "question": "Ted wants to make a ______ of reading for twenty minutes every night.", "options": ["habit", "wish", "list", "pack"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 129 題）", "explanation": "每晚讀書成為「習慣」，make a habit of Ving。", "explanationSource": "supplemental"}, {"id": 133, "question": "The weather is nice and cool today. Let's go for a ______ on the grass and enjoy some food and drinks.", "options": ["drive", "picnic", "swim", "vacation"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜go for a picnic 去野餐", "explanation": "【句型】go for a picnic / go on a picnic＝去野餐。\n【分析】在「草地上」享用「食物和飲料」，就是「野餐」，選 picnic。\n【其他選項】(A) go for a drive 兜風，不會在草地上；(C) go for a swim 游泳，不在草地上；(D) vacation 度假，與「在草地上吃東西」不符。\n【例句】We went for a picnic in Daan Forest Park last Sunday.（上週日我們去大安森林公園野餐。）", "explanationSource": "source"}, {"id": 134, "question": "It's too hot today. Let's go for a ______ in the pool.", "options": ["picnic", "drive", "swim", "walk"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 133 題）", "explanation": "天氣熱去泳池「游泳」，go for a swim。", "explanationSource": "supplemental"}, {"id": 135, "question": "Dad bought a new car, and he took us for a ______ along the coast.", "options": ["drive", "swim", "picnic", "bath"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 133 題）", "explanation": "開新車沿海岸「兜風」，go for a drive。", "explanationSource": "supplemental"}, {"id": 136, "question": "We brought sandwiches and juice and had a ______ under a big tree.", "options": ["drive", "swim", "vacation", "picnic"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 133 題）", "explanation": "帶三明治果汁在樹下「野餐」，have a picnic。", "explanationSource": "supplemental"}, {"id": 137, "question": "When the teacher was not in the classroom, the students talked loudly and made a lot of ______.", "options": ["excuses", "heat", "languages", "noise"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜make noise 製造噪音", "explanation": "【句型】make (a lot of) noise＝製造（很多）噪音；noise 為不可數名詞。\n【分析】學生大聲講話，「製造很多噪音」，talked loudly 是線索，選 noise。\n【其他選項】(A) make excuses 找藉口，與大聲講話無關；(B) heat 熱；(C) languages 語言，皆不合。\n【例句】Please don't make any noise in the library.（在圖書館請勿製造噪音。）", "explanationSource": "source"}, {"id": 138, "question": "The dogs next door make a lot of ______ at night, so I can't sleep well.", "options": ["noise", "heat", "excuses", "language"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 137 題）", "explanation": "狗吵得睡不著，make noise。", "explanationSource": "supplemental"}, {"id": 139, "question": "Stop making ______. Just tell me why you didn't come.", "options": ["noise", "heat", "excuses", "mistakes"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 137 題）", "explanation": "叫對方別再「找藉口」，make excuses。", "explanationSource": "supplemental"}, {"id": 140, "question": "The sun gives us light and ______.", "options": ["noise", "excuses", "languages", "heat"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 137 題）", "explanation": "太陽提供光和「熱」，heat。", "explanationSource": "supplemental"}, {"id": 141, "question": "Mark: I've got a lot of exercise these days, but still can't lose weight.\nDoris: Exercise is not enough. You should also ______. Eating the right foods is very important for weight control.", "options": ["quit eating", "start an exercise class", "take some medicine", "go on a diet"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜go on a diet 節食", "explanation": "【句型】go on a diet = 節食、控制飲食。\n【分析】後句 Eating the right foods is very important（吃對食物很重要）→ 要控制飲食，選 go on a diet。also 表示「除了運動之外還要」。\n【其他選項】(A) quit eating 停止進食，不合理也不健康；(B) start an exercise class 仍是運動，與 Exercise is not enough 矛盾；(C) take some medicine 吃藥，與「吃對食物」無關。\n【例句】My sister went on a diet and stopped eating fried chicken.", "explanationSource": "source"}, {"id": 142, "question": "Ben: I want to lose some weight before summer.\nAmy: Then you should ______ and stop drinking soda.", "options": ["go on a diet", "go on a trip", "take a rest", "take a bath"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 141 題）", "explanation": "想減重且不喝汽水 → 節食 go on a diet。", "explanationSource": "supplemental"}, {"id": 143, "question": "The doctor told Mr. Lin to ______ because he was too heavy and ate too much meat.", "options": ["take a walk", "go shopping", "go on a diet", "make a wish"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 141 題）", "explanation": "太重又吃太多肉 → 醫生要他節食。", "explanationSource": "supplemental"}, {"id": 144, "question": "Lisa is ______ a diet, so she only eats vegetables and fruit for dinner.", "options": ["in", "at", "with", "on"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 141 題）", "explanation": "be on a diet 正在節食，介系詞用 on。", "explanationSource": "supplemental"}, {"id": 145, "question": "You will become a good learner if you ______ the tips your teachers talk about.", "options": ["do", "ask", "answer", "follow"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜follow the tips 遵循建議", "explanation": "【句型】follow + 建議/規則/指示（tips, advice, rules）= 遵守、照著做。\n【分析】「如果你照著老師說的 tips（訣竅）去做，就會成為好學習者」→ follow the tips。\n【其他選項】(A) do the tips 不是正確搭配；(B) ask 詢問，tips 是老師說的不是你要問的；(C) answer 回答，tips 不是問題。\n【例句】If you follow the doctor's advice, you will get better soon.", "explanationSource": "source"}, {"id": 146, "question": "Please ______ the rules when you swim in the pool.", "options": ["follow", "make", "break", "watch"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 145 題）", "explanation": "遵守規則 follow the rules；break 是違反，語意不合。", "explanationSource": "supplemental"}, {"id": 147, "question": "Amy didn't ______ her mom's advice, so she got lost on the way.", "options": ["give", "take", "say", "keep"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 145 題）", "explanation": "take one's advice 接受建議；沒聽建議所以迷路。", "explanationSource": "supplemental"}, {"id": 148, "question": "Just ______ the steps on the box, and you can make the cake easily.", "options": ["ask", "answer", "follow", "forget"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 145 題）", "explanation": "照著盒子上的步驟做 follow the steps。", "explanationSource": "supplemental"}, {"id": 149, "question": "I feel it great to take ______ in the hot springs in Yangmingshan.", "options": ["an interest", "a bath", "a trip", "some medicine"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜take a bath 泡澡", "explanation": "【句型】take a bath = 洗澡、泡澡。\n【分析】in the hot springs（在溫泉裡）→ 在溫泉裡做的事是泡澡 take a bath。\n【其他選項】(A) take an interest 對…產生興趣（須接 in），不能「在溫泉裡」；(C) take a trip 去旅行，不會在溫泉「裡面」旅行；(D) take some medicine 吃藥，不合語意。\n【例句】After the long hike, we took a bath in the hot springs.", "explanationSource": "source"}, {"id": 150, "question": "It's cold today. Let's ______ in the hot springs in Beitou.", "options": ["take a bath", "take a picture", "take a seat", "take a walk"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 149 題）", "explanation": "在溫泉裡 → 泡澡 take a bath。", "explanationSource": "supplemental"}, {"id": 151, "question": "Ted always ______ before he goes to bed, so he feels clean and relaxed.", "options": ["takes a trip", "takes a test", "takes a shower", "takes a look"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 149 題）", "explanation": "睡前讓自己乾淨 → 洗澡 take a shower。", "explanationSource": "supplemental"}, {"id": 152, "question": "We plan to ______ to Hualien this summer vacation.", "options": ["take a bath", "take a nap", "take a rest", "take a trip"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 149 題）", "explanation": "去花蓮 → 旅行 take a trip to。", "explanationSource": "supplemental"}, {"id": 153, "question": "I have no ______ in cooking so I always ask my brother to cook for me.", "options": ["rule", "point", "example", "interest"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜have no interest in 對…沒興趣", "explanation": "【句型】have (no) interest in + N/Ving = 對…（沒）有興趣。\n【分析】後句 always ask my brother to cook for me（總是叫哥哥煮）→ 自己對烹飪沒興趣，空格後的 in 是 interest 的搭配介系詞。\n【其他選項】(A) rule 規則、(B) point 重點、(C) example 例子，都不與 in cooking 搭配成合理語意。\n【例句】Tom has no interest in sports; he prefers reading.", "explanationSource": "source"}, {"id": 154, "question": "Kelly has a strong ______ in music, so she plays the piano every day.", "options": ["interest", "reason", "chance", "habit"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 153 題）", "explanation": "have an interest in 對…有興趣，所以天天彈琴。", "explanationSource": "supplemental"}, {"id": 155, "question": "My grandpa is interested ______ old movies.", "options": ["at", "with", "in", "on"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 153 題）", "explanation": "be interested in 對…感興趣。", "explanationSource": "supplemental"}, {"id": 156, "question": "Joe showed no interest ______ the game, so he left early.", "options": ["for", "in", "of", "to"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 153 題）", "explanation": "show interest in 對…有興趣；沒興趣所以早走。", "explanationSource": "supplemental"}, {"id": 157, "question": "Look! There is not a cloud in the sky. I think the chances of getting some rain today are really ______.", "options": ["far", "good", "possible", "small"], "answer": 3, "answerLabel": "D", "source": "115會考｜搭配詞：the chances of … are small / good", "explanation": "【句型】the chances of + Ving + are small / good（機會小／大）；chance 常搭配 good、small、high、low。\n【分析】線索 There is not a cloud in the sky：萬里無雲，下雨的機會「很小」→ small。\n【其他選項】(A) far 遠的：不能形容機會；(B) good：機會大，與萬里無雲矛盾；(C) possible：主詞應為「事情」（It is possible that…），不說 chances are possible。\n【例句】The chances of seeing snow in Taipei are very small.\n※ 本題亦可歸「詞彙題」。", "explanationSource": "source"}, {"id": 158, "question": "Our team has the best players this year. The chances of winning the game are ______.", "options": ["good", "far", "easy", "possible"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 157 題）", "explanation": "球員最好 → 贏的機會「大」，chances are good。", "explanationSource": "supplemental"}, {"id": 159, "question": "Ted didn't study at all, so his chances of passing the test are ______.", "options": ["big", "low", "high", "tall"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 157 題）", "explanation": "沒讀書 → 及格機會「低」，chance 搭配 low。", "explanationSource": "supplemental"}, {"id": 160, "question": "It's ______ that it will rain this afternoon. The sky is getting dark.", "options": ["chance", "small", "possible", "far"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 157 題）", "explanation": "It is possible that… 「有可能……」，possible 的主詞是事情。", "explanationSource": "supplemental"}, {"id": 161, "question": "Alex fell down in the race and hurt his leg. When he got up and ran to the finish line, everybody ______.", "options": ["gave him a hand", "gave him a big hand", "put themselves in his shoes", "had it both ways"], "answer": 1, "answerLabel": "B", "source": "講義錯題｜give sb. a big hand（為某人熱烈鼓掌）", "explanation": "【句型】give sb. a big hand = 為某人熱烈鼓掌；give sb. a hand = 幫某人忙。\n【分析】Alex 受傷後仍跑到終點（ran to the finish line），大家為他熱烈鼓掌，選 gave him a big hand。\n【其他選項】(A) 幫他忙，但他已自己跑到終點；(C) put oneself in one's shoes 是「設身處地」，不合情境；(D) have it both ways 是「兩者兼得」，不合語意。\n【例句】After the speech, the students gave the principal a big hand.\n備註：講義 p.60", "explanationSource": "source"}, {"id": 162, "question": "This box is too heavy for me. Could you ______?", "options": ["give me a big hand", "give me a hand", "make me a hand", "take my hand"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 161 題）", "explanation": "give sb. a hand 是「幫某人忙」。", "explanationSource": "supplemental"}, {"id": 163, "question": "When the little girl finished playing the piano, the audience ______ her ______.", "options": ["gave; a big hand", "took; a hand", "made; a big hand", "had; a hand"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 161 題）", "explanation": "表演結束為她熱烈鼓掌，用 give sb. a big hand。", "explanationSource": "supplemental"}, {"id": 164, "question": "Before you get angry at Ben, try to ______. He just lost his dog.", "options": ["give him a big hand", "have it both ways", "put yourself in his shoes", "keep an eye on him"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 161 題）", "explanation": "put yourself in his shoes 是「設身處地為他著想」。", "explanationSource": "supplemental"}, {"id": 165, "question": "Helen: How often do I need to water this plant? Do I need to do it every day?\nWendy: No. Watering it ______ will be quite enough. About three or four times a week.", "options": ["once in a while", "every other day", "twice a day", "every three days"], "answer": 1, "answerLabel": "B", "source": "講義錯題｜every other day（每隔一天）", "explanation": "【句型】every other day = 每隔一天；every three days = 每三天一次。\n【分析】Wendy 說「一週大約三到四次」（About three or four times a week），正好是每隔一天澆一次。\n【其他選項】(A) once in a while 是「偶爾」，次數不明確；(C) twice a day 一天兩次，比每天更多；(D) every three days 一週只有兩次多。\n【例句】I go jogging every other day, so I run about three times a week.\n備註：講義 p.60", "explanationSource": "source"}, {"id": 166, "question": "Mr. Lin has English class on Monday, Wednesday, and Friday. He has it ______.", "options": ["every day", "once a week", "every other day", "twice a day"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 165 題）", "explanation": "一、三、五上課是每隔一天。", "explanationSource": "supplemental"}, {"id": 167, "question": "Kim doesn't eat fast food often. She only has it ______, maybe once or twice a month.", "options": ["once in a while", "every day", "every other day", "three times a day"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 165 題）", "explanation": "一個月一兩次是「偶爾」once in a while。", "explanationSource": "supplemental"}, {"id": 168, "question": "Take this medicine ______: after breakfast, after lunch, and after dinner.", "options": ["every other day", "three times a day", "once a week", "every three days"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 165 題）", "explanation": "三餐飯後各一次是一天三次。", "explanationSource": "supplemental"}, {"id": 169, "question": "No one loses ______ in playing with the gift toy through the party.", "options": ["to interest", "interests", "interested", "interesting"], "answer": 1, "answerLabel": "B", "source": "講義錯題｜lose interest in（對…失去興趣），interest 當名詞", "explanation": "【句型】lose interest in + N／Ving = 對…失去興趣；lose 是及物動詞，後接名詞當受詞。\n【分析】空格是 loses 的受詞，又接 in playing…，需名詞 interest；選項中只有 (B) interests 是名詞形式。\n【其他選項】(A) to interest 是不定詞，lose 不接 to V；(C) interested、(D) interesting 是形容詞，不能當受詞。\n【例句】Many kids lose interest in a new toy after a few days.\n備註：講義 p.258；一般用法多為不可數 lose interest in，但本題選項中只有 (B) 為名詞，故答案保留 (B)。", "explanationSource": "source"}, {"id": 170, "question": "Ben used to love comic books, but he has lost ______ in them now.", "options": ["interest", "interesting", "interested", "to interest"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 169 題）", "explanation": "lose interest in，lose 後接名詞 interest。", "explanationSource": "supplemental"}, {"id": 171, "question": "Sara is very ______ in Japanese culture, so she is learning Japanese.", "options": ["interest", "interests", "interesting", "interested"], "answer": 3, "answerLabel": "D", "source": "類似題 2（對應第 169 題）", "explanation": "be interested in 表人「對…感興趣」。", "explanationSource": "supplemental"}, {"id": 172, "question": "The science museum is so ______ that we stayed there all day.", "options": ["interest", "interesting", "interested", "interests"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 169 題）", "explanation": "形容事物「有趣的」用 interesting。", "explanationSource": "supplemental"}, {"id": 173, "question": "Look at the picture. The girl is ______. [圖：戴派對帽的女孩雙手合十、閉眼，面前有插著蠟燭的生日蛋糕]", "options": ["making a wish", "blowing out the candles", "putting on a hat", "eating a cake"], "answer": 0, "answerLabel": "A", "source": "講義錯題｜make a wish（許願）", "explanation": "【句型】make a wish = 許願；blow out the candles = 吹熄蠟燭。\n【分析】圖中女孩雙手合十、閉著眼睛，蠟燭仍點著，表示她正在許願。\n【其他選項】(B) 蠟燭還亮著，沒有在吹；(C) 帽子已經戴好了，不是正在戴；(D) 她沒有在吃蛋糕。\n【例句】Close your eyes and make a wish before you blow out the candles.\n備註：講義 p.260", "explanationSource": "source"}, {"id": 174, "question": "Before blowing out the candles on the cake, Joe closed his eyes and ______.", "options": ["made a wish", "took a wish", "did a wish", "had a wish"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 173 題）", "explanation": "「許願」的固定搭配是 make a wish。", "explanationSource": "supplemental"}, {"id": 175, "question": "After making a wish, Linda ______ the candles with one breath.", "options": ["put on", "blew out", "took off", "turned on"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 173 題）", "explanation": "吹熄蠟燭是 blow out the candles。", "explanationSource": "supplemental"}, {"id": 176, "question": "It's cold outside. ______ your jacket before you go out.", "options": ["Take off", "Make", "Put on", "Blow out"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 173 題）", "explanation": "put on 是「穿上、戴上」。", "explanationSource": "supplemental"}, {"id": 177, "question": "When I was walking past the store, I saw that beautiful dress in the window and couldn't help stopping to ______ it.", "options": ["put on", "try on", "pick up", "look at"], "answer": 3, "answerLabel": "D", "source": "講義錯題｜look at vs. 可分片語動詞 try on（代名詞置中）", "explanation": "【句型】可分片語動詞（V + adv.）受詞為代名詞時要放中間：try it on；look at（V + prep.）受詞放介系詞後：look at it\n【分析】走過商店、看到櫥窗（in the window）裡的洋裝，忍不住停下來「看」它 → look at it。\n【其他選項】(A) put on、(B) try on、(C) pick up 受詞是 it 時須寫成 put it on / try it on / pick it up；且人在店外也不會穿上或拿起櫥窗裡的衣服。\n【例句】This hat looks nice. Can I try it on?\n備註：講義 p.319", "explanationSource": "source"}, {"id": 178, "question": "It's cold outside. Your jacket is on the chair. Please ______.", "options": ["put on it", "put it on", "put on them", "put them on it"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 177 題）", "explanation": "put on 為可分片語，代名詞 it 放中間。", "explanationSource": "supplemental"}, {"id": 179, "question": "The baby was crying, so Dad walked over to ______ her.", "options": ["look at", "try on", "pick up", "put on"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 177 題）", "explanation": "受詞 her 在後，只有 look at 可接；pick up 須寫 pick her up。", "explanationSource": "supplemental"}, {"id": 180, "question": "There's some trash on the floor. Could you ______?", "options": ["pick up it", "look it at", "try it on", "pick it up"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 177 題）", "explanation": "撿起垃圾用 pick up，代名詞 it 放中間。", "explanationSource": "supplemental"}, {"id": 181, "question": "We are feeling down. Let's go shopping to ______ ourselves ______!", "options": ["look; up", "give; up", "pick; up", "cheer; up"], "answer": 3, "answerLabel": "D", "source": "講義錯題｜cheer sb. up（使振作）", "explanation": "【句型】cheer sb. up 使某人振作、高興起來\n【分析】feeling down（心情低落）→ 去購物讓自己振作 → cheer ourselves up。\n【其他選項】(A) look up 查詢；(B) give up 放棄；(C) pick up 撿起、接人，皆不合語意。\n【例句】Grandpa told funny stories to cheer me up.\n備註：講義 p.319", "explanationSource": "source"}, {"id": 182, "question": "Sara lost the game and looked sad, so we bought her ice cream to ______.", "options": ["give her up", "cheer her up", "look her up", "pick her out"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 181 題）", "explanation": "讓難過的人開心用 cheer sb. up。", "explanationSource": "supplemental"}, {"id": 183, "question": "Don't ______ your dream just because it's hard. Keep trying!", "options": ["give up", "cheer up", "look up", "pick up"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 181 題）", "explanation": "不要放棄夢想，用 give up。", "explanationSource": "supplemental"}, {"id": 184, "question": "If you don't know this word, you can ______ in the dictionary.", "options": ["cheer it up", "give it up", "look it up", "pick it up"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 181 題）", "explanation": "查字典用 look sth. up。", "explanationSource": "supplemental"}]};</script><script src="longteng-b1u5-quiz.js?v=20261027-2"></script><script>document.querySelector("#description").textContent="共 184 題（會考歷屆＋講義錯題 46 題＋類似題 138 題）｜選答後顯示中文解析｜答錯可重做並下載錯題";</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
