  <script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 5｜文意字彙","mode":"spell","questions":[{"id":1,"question":"The singer performed her three newest songs in front of a c____________d of excited fans.","answers":["crowd"],"source":"課本例句填空","explanation":"補充解析：crowd 表示「人群」。歌手在一群興奮的歌迷面前演唱她最新的三首歌。","explanationSource":"supplement"},{"id":2,"question":"It is useless to e____________y other people for their success and good fortune. Instead, you should make more of an effort to succeed.","answers":["envy"],"source":"All in One","explanation":"補充解析：envy 表示「羨慕」。羨慕別人的成功與好運沒有用；你應該更加努力讓自己成功。","explanationSource":"supplement"},{"id":3,"question":"O____________sly Helen’s boss didn’t like her ideas, for he walked out of the meeting room after only a few minutes.","answers":["Obviously"],"source":"All in One","explanation":"補充解析：obviously 表示「顯然地」。Helen 的老闆顯然不喜歡她的想法，因為會議才開始幾分鐘他就走出去了。","explanationSource":"supplement"},{"id":4,"question":"That homeless man is poor and doesn’t have a suitcase for his belongings, so he carries them in a p____________c bag.","answers":["plastic"],"source":"All in One","explanation":"補充解析：plastic 表示「塑膠的」。那位遊民很窮，也沒有手提箱裝物品，所以用塑膠袋攜帶東西。","explanationSource":"supplement"},{"id":5,"question":"It is believed that a happy family provides a loving e____________t in which children feel safe and secure.","answers":["environment"],"source":"All in One","explanation":"補充解析：environment 表示「環境」。人們相信，幸福家庭能提供充滿愛的環境，讓孩子感到安全安心。","explanationSource":"supplement"},{"id":6,"question":"The little girl is wearing yellow shoes, a yellow dress, and has painted her nails yellow. O____________y, she likes this color.","answers":["Obviously"],"source":"課本例句填空","explanation":"補充解析：obviously 表示「顯然地」。小女孩穿黃鞋和黃洋裝，還把指甲塗黃；顯然她喜歡黃色。","explanationSource":"supplement"},{"id":7,"question":"P____________s materials should always be kept in a locked cabinet, so that children can’t touch them.","answers":["Poisonous"],"source":"All in One","explanation":"補充解析：poisonous 表示「有毒的」。有毒物品應放在上鎖的櫃子裡，以免兒 d and changed into something we can use again.","answers":["recycling"],"source":"龍騰自命題","explanation":"透過回收，大約百分之七十五的廢棄物被收集並改造成可以再度被我們使用的東西。","explanationSource":"source"},{"id":17,"question":"People in Taiwan are taught to put paper, metal, glass, and plastic into different bins for r____________g.","answers":["recycling"],"source":"龍騰自命題","explanation":"在臺灣，人們被教導將紙張、金屬、玻璃和塑膠放入不同的桶子以便回收。","explanationSource":"source"},{"id":18,"question":"S____________es like PM2.5 found in polluted air can cause lung cancer.","answers":["Substances"],"source":"龍騰自命題","explanation":"在汙染的空氣中所發現的物質，如細懸浮微粒（PM2.5），會造成肺癌。","explanationSource":"source"},{"id":19,"question":"People had better eat less sugar. Studies show that sugar is a s____________e that is bad for the brain.","answers":["substance"],"source":"龍騰自命題","explanation":"人們最好少吃糖。研究顯示糖是一種對大腦有害的物質。","explanationSource":"source"},{"id":20,"question":"The most exciting part of the movie was when the leading actress was forced to drink the wine mixed with p____________n and the leading actor came to save her.","answers":["poison"],"source":"龍騰自命題","explanation":"這部電影最精采的部分是在女主角被迫喝下混合了毒藥的葡萄酒，然後男主角前來英雄救美的時候。","explanationSource":"source"},{"id":21,"question":"Don’t feed your dog dark chocolate; chocolate can be a deadly p____________n for pets.","answers":["poison"],"source":"龍騰自命題","explanation":"別用黑巧克力餵你的狗；巧克力對寵物而言可能是一種致命的毒藥。","explanationSource":"source"},{"id":22,"question":"Dog keepers shouldn’t feed their pets chocolate as it is p____________s to dogs and can take their lives.","answers":["poisonous"],"source":"龍騰自命題","explanation":"養狗的人絕不可以餵狗兒吃巧克力，因為巧克力對狗是有毒的而且會讓狗兒死亡。","explanationSource":"source"},{"id":23,"question":"The woman died after she had eaten some p____________s wild plants.","answers":["poisonous"],"source":"龍騰自命題","explanation":"這個婦女在吃了有毒的野生植物後死亡。","explanationSource":"source"},{"id":24,"question":"Wise c____________rs pay more attention to food safety. They want what they eat to be good for their bodies.","answers":["consumers"],"source":"龍騰自命題","explanation":"聰明的消費者比較注意食品安全。他們想要吃進去的食物有益身體。","explanationSource":"source"},{"id":25,"question":"Taking care of the twin babies had c____________ed much of the mother’s energy. She felt very tired.","answers":["consumed"],"source":"龍騰自命題","explanation":"照顧這對雙胞胎寶寶耗去這個媽媽不少體力。她覺得非常疲倦。","explanationSource":"source"},{"id":26,"question":"Studies have shown that people who love to c____________e high-calorie foods but exercise little are more likely to suffer from heart disease.","answers":["consume"],"source":"龍騰自命題","explanation":"研究已顯示喜歡吃高熱量食物卻又很少運動的人，較有可能罹患心臟病。","explanationSource":"source"},{"id":27,"question":"Japanese people c____________e lots of fish, with each eating more than 150 pounds of fish per year.","answers":["consume"],"source":"龍騰自命題","explanation":"日本人吃很多魚，每人一年吃超過150磅的魚。","explanationSource":"source"},{"id":28,"question":"More robots are used in the modern p____________n line, which in turn causes some workers to lose their jobs.","answers":["production"],"source":"龍騰自命題","explanation":"愈來愈多的機器人被使用於現代的生產線上，這也接著造成一些員工的失業。","explanationSource":"source"},{"id":29,"question":"A worker bee has to fly among thousands of flowers to collect sweet liquids before it can p____________e a drop of honey.","answers":["produce"],"source":"龍騰自命題","explanation":"一隻工蜂必須在數千朵花間飛行，採集甜蜜的汁液後，才能製造出一滴的蜂蜜。","explanationSource":"source"},{"id":30,"question":"The store sells only organic p____________ts in which no chemicals will be found.","answers":["products"],"source":"龍騰自命題","explanation":"這家店只販售有機產品，產品內找不到化學藥劑。","explanationSource":"source"},{"id":31,"question":"People say that the p____________ts made by that factory are of high quality.","answers":["products"],"source":"龍騰自命題","explanation":"人們說那家工廠製造的產品品質很高。","explanationSource":"source"},{"id":32,"question":"Gases released from cars can not only cause air pollution but also be very h____________l to our health.","answers":["harmful"],"source":"龍騰自命題","explanation":"汽車排放出來的氣體不僅僅會造成空氣 機場的候機室擠滿了乘客。","explanationSource":"source"},{"id":41,"question":"On weekends, the night market is always c____________ded with visitors who come to enjoy delicious food.","answers":["crowded"],"source":"龍騰自命題","explanation":"每到周末，這個夜市總是擠滿前來享受美食的遊客。","explanationSource":"source"},{"id":42,"question":"While Daniel was happily licking his ice cream, other kids looked at him with e____________y.","answers":["envy"],"source":"龍騰自命題","explanation":"正當Daniel開心地舔著他的冰淇淋時，其他的孩子羨慕地望著他。","explanationSource":"source"},{"id":43,"question":"I e____________y Sandy, who was born with a silver spoon in her mouth. She is also the apple of her parents’ eye.","answers":["envy"],"source":"龍騰自命題","explanation":"我羨慕Sandy，她銜著銀湯匙出生，而且是父母的掌上明珠。","explanationSource":"source"},{"id":44,"question":"Many young girls e____________y supermodels because of their beauty and fame.","answers":["envy"],"source":"龍騰自命題","explanation":"許多年輕女生羨慕超模的美貌與名氣。","explanationSource":"source"},{"id":45,"question":"It was a miracle that the sailor was saved after he had d____________ted at sea for over a week.","answers":["drifted"],"source":"龍騰自命題","explanation":"這個水手在海上漂流超過一週後獲救，真是個奇蹟。","explanationSource":"source"},{"id":46,"question":"Some leaves fell into the river and d____________ted down with the current.","answers":["drifted"],"source":"龍騰自命題","explanation":"有些葉子落入河中，順流漂流而下。","explanationSource":"source"},{"id":47,"question":"Some insects can change the color of their bodies so as to blend in with the s____________gs.","answers":["surroundings"],"source":"龍騰自命題","explanation":"有些昆蟲可以改變身體的顏色以便融入周遭環境。","explanationSource":"source"},{"id":48,"question":"The selfish giant s____________ded his garden with a high fence so that no one could enter it.","answers":["surrounded"],"source":"龍騰自命題","explanation":"自私的巨人用高高的籬笆圍住他的花園，這樣一來就沒人進得來。","explanationSource":"source"},{"id":49,"question":"The teacher was s____________ded by little kids; she was telling them a story about a beautiful princess and a handsome prince."
