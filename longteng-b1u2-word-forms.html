  <script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 2｜詞類變化","mode":"fill","questions":[{"id":1,"question":"Today, we’ll discuss the problem of food waste, which bears some ____________ (relate) to the movie we saw last week.","answers":["relation/relationship"],"source":"All in One","explanation":"正確字詞為 relation/relationship；請將答案補入後朗讀完整例句。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":2,"question":"Jane feels it is difficult to ____________ (communication) with her boss because he rarely gives her a chance to express her ideas.","answers":["communicate"],"source":"All in One","explanation":"正確字詞為 communicate；請將答案補入後朗讀完整例句。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":3,"question":"I sent the food company some e-mails complaining about their goods, but I haven’t gotten any ____________ (respond) yet.","answers":["response"],"source":"All in One","explanation":"正確字詞為 response，意思是「回應」；請將答案補入後朗讀完整例句。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":4,"question":"Sheila was Elvis’s ____________ (inspire) for this song. He wrote the song after he met her.","answers":["inspiration"],"source":"All in One","explanation":"正確字詞為 inspiration，意思是「靈感」；請將答案補入後朗讀完整例句。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":5,"question":"The teacher nodded with ____________ (satisfying) after our group finished the tough job.","answers":["satisfaction"],"source":"All in One","explanation":"正確字詞為 satisfaction，意思是「滿意」；請將答案補入後朗讀完整例句。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":6,"question":"His grades have slipped a lot recently, which deeply ____________ (disappoint) his parents.","answers":["disappointed"],"source":"龍騰自命題","explanation":"他的成績最近退步很多讓他的父母很失望。","explanationSource":"source"},{"id":7,"question":"J.K. Rowling drew ____________ (inspire) from ancient Greek stories about gods and goddesses when she wrote the Harry Potter books.","answers":["inspiration"],"source":"龍騰自命題","explanation":"J.K.羅琳創作哈利波特系列時從古希臘關於眾神的故事中獲取靈感。考點句構：draw inspiration from 從某處獲取靈感。","explanationSource":"source"},{"id":8,"question":"The exhibition of Treasures of the Natural World has received a very positive ____________ (respond) from visitors. Most people consider the exhibition worth visiting.","answers":["response"],"source":"龍騰自命題","explanation":"Treasures of the Natural World的展覽獲得參觀者正面迴響。大多數人認為這展覽值得參觀。考點句構：receive a positive response。","explanationSource":"source"},{"id":9,"question":"Since I got a pay raise, I have been living in a ____________ (relation) comfortable life.","answers":["relatively"],"source":"龍騰自命題","explanation":"自從加薪後，我過著比較優渥的生活。","explanationSource":"source"},{"id":10,"question":"The geography teacher gave a brief ____________ (introduce) to the lands, features, people and climates of Africa.","answers":["introduction"],"source":"龍騰自命題","explanation":"地理老師簡略的介紹非洲的地形，特色，人民和氣候。考點句構：a brief introduction 簡略的介紹。","explanationSource":"source"},{"id":11,"question":"Her brilliant piano performance made her the ____________ (focus) of attention in the party.","answers":["focus"],"source":"龍騰自命題","explanation":"她卓越的鋼琴演奏使她成為宴會中的焦點。","explanationSource":"source"},{"id":12,"question":"He ____________ (deny) cheating in the exam even though the teacher had caught him on the spot.","answers":["denied"],"source":"龍騰自命題","explanation":"即便老師當場抓到他作弊，他還是矢口否認。考點句構：deny + V-ing。","explanationSource":"source"},{"id":13,"question":"The study ____________ (relationship) the shortage of workers to the low wages being offered.","answers":["related"],"source":"龍騰自命題","explanation":"這項研究把勞動力短缺和低薪連結在一起了。考點句構：relate A to B。","explanationSource":"source"},{"id":14,"question":"Several studies have shown that there is a direct ____________ (connect) between air pollution and lung cancer.","answers":["connection"],"source":"龍騰自命題","explanation":"幾份研究已顯示空氣汙染和肺癌有直接關係。考點句構：a connection between A and B。","explanationSource":"source"},{"id":15,"question":"When Jennifer was awarded the gold medal, she smiled with ____________ (satisfying).","answers":["satisfaction"],"source":"龍騰自命題","explanation":"當Jennifer獲得金牌，她心滿意足地微笑。考點句構：with + N.。","explanationSource":"source"}]};</script>
