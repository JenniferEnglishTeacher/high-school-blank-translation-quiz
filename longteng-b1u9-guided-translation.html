 ②____________ ③____________ weight, remember to get ④____________ of the CRAP. CRAP ⑤____________ for carbonated drinks, refined sugars, artificial sweeteners and colors, and processed foods.","answers":["comes","to","losing","rid","stands"],"source":"龍騰自命題","explanation":"crap這字正是「大便」之意，是很粗鄙的俚語，意即這四種垃圾食品就跟糞便一樣，一語雙關。注意when it comes to的to是介系詞，後面接名詞或動名詞","explanationSource":"source"},{"id":7,"zh":"臺灣政府的領導人計畫擺脫核能發電為了來保護我們的孩子。","question":"Taiwan’s government leaders plan to ①____________ ②____________ ③____________ nuclear power in order to protect our children.","answers":["get","rid","of"],"source":"龍騰自命題","explanation":"nuclear power plant核電廠","explanationSource":"source"},{"id":8,"zh":"一提到塗鴉，大部分人都認為它不過是一種視覺污染的形式。","question":"①____________ ②____________ ③____________ to graffiti, most people consider it ④____________ ⑤____________ a form of visual pollution.","answers":["When","it","comes","nothing","but"],"source":"龍騰自命題","explanation":"nothing but = only 只是","explanationSource":"source"},{"id":9,"zh":"這藝術家花了很久的時間詳細解釋如何用畫畫來表達我們對真愛的需求。","question":"The artist ①____________ a long time ②____________ in detail how to paint something that shows our need for true love.","answers":["spent","explaining"],"source":"龍騰自命題","explanation":"spend + 時間 + V-ing","explanationSource":"source"},{"id":10,"zh":"《魔戒》這本小說作者為J. R. R. Tolkien。縮寫J. R. R.代表作者的名字是John Ronald Reuel。","question":"The novel The Lord of the Rings was written by J. R. R. Tolkien. The abbreviation J. R. R. ①____________ ②____________ the name of the author, John Ronald Reuel.","answers":["stands","for"],"source":"龍騰自命題","explanation":"abbreviation 縮寫","explanationSource":"source"},{"id":11,"zh":"一談到學英文，第一步就是擺脫張口說出來的恐懼。","question":"When ①____________ ②____________ ③____________ ④____________ English, the first step is to get ⑤____________ of your fear of speaking up.","answers":["it","comes","to","learning","rid"],"source":"龍騰自命題","explanation":"注意When it comes to的to是介系詞，後面要接名詞或動名詞","explanationSource":"source"},{"id":12,"zh":"我靠自己做完功課只不過花了我一點空閒時間。","question":"It ①____________ me ②____________ ③____________ a little free time to finish the homework by myself.","answers":["took","nothing","but"],"source":"龍騰自命題","explanation":"by myself 靠我自己；獨自","explanationSource":"source"},{"id":13,"zh":"他花了三個月才戒除他的壞習慣","question":"①____________ ②____________ him three months to get ③____________ ④____________ his bad habits.","answers":["It","took","rid","of"],"source":"龍騰自命題","explanation":"It + take + sb. + 時間 + to VR","explanationSource":"source"},{"id":14,"zh":"這店員仔細的說明這套西裝有五種尺寸。","question":"The clerk explained in detail the suit ①____________ ②____________ five sizes.","answers":["came","in"],"source":"龍騰自命題","explanation":"in detail 詳細地","explanationSource":"source"},{"id":15,"zh":"在原子筆在她的口袋裡漏水搞得亂七八糟後，她把它給丟了。","question":"After the pen leaked and made a mess in her pocket, she ①____________ ②____________ ③____________ it.","answers":["got","rid","of"],"source":"龍騰自命題","explanation":"leak 漏水  make a mess of... 把……搞得亂七八糟","explanationSource":"source"},{"id":16,"zh":"當談到裝飾聖誕樹時，許多家庭喜歡最後才把星星或天使放到樹枝頭。","question":"①____________ ②____________ ③____________ ④____________ decorating the Christmas tree, many families like to put a star or angel on top at the end.","answers":["When","it","comes","to"],"source":"課本例句填空","explanation":"句意：當談到裝飾聖誕樹時，許多家庭喜歡最後才把星星或天使放到樹枝頭。 本題依序填入：When、it、comes、to。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":17,"zh":"Betsy要求她的丈夫丟掉在冰箱裡所有那些噁心腐爛掉的食物。","question":"Betsy asked her husband to ①____________ ②____________ ③____________ all the disgusting rotten food in the refrigerator.","answers":["get","rid","of"],"source":"課本例句填空","explanation":"句意：Betsy要求她的丈夫丟掉在冰箱裡所有那些噁心腐爛掉的食物。 本題依序填入：get、rid、of。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":18,"zh":"Rogers先生只不過想要快樂，以及與他的家人有很多好好相聚的寶貴時間。","question":"Mr. Rogers wants to have ①____________ ②____________ happiness and a lot of quality time with his family.","answers":["nothing","but"],"source":"課本例句填空","explanation":"句意：Rogers先生只不過想要快樂，以及與他的家人有很多好好相聚的寶貴時間。 本題依序填入：nothing、but。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":19,"zh":"在WHO這個詞當中，W代表著世界，H代表著健康，而O代表著組織。","question":"In the term WHO, W ①____________ ②____________ “World,” H ③____________ ④____________ “Health,” and O ⑤____________ ⑥____________ “Organization.”","answers":["stands","for","stands","for","stands","for"],"source":"課本例句填空","explanation":"句意：在WHO這個詞當中，W代表著世界，H代表著健康，而O代表著組織。 本題依序填入：stands、for、stands、for、stands、for。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":20,"zh":"你正在試穿的這件T恤現在也有白色的、黑色的和海軍藍。","question":"The T-shirt you are trying on right now also ①____________ ②____________ white, black, and navy blue.","answers":["comes","in"],"source":"課本例句填空","explanation":"句意：你正在試穿的這件T恤現在也有白色的、黑色的和海軍藍。 本題依序填入：comes、in。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":21,"zh":"Peter擅長修理電腦。說到這，沒有人比得上他。","question":"Peter is good at repairing computers. ①____________ ②____________ ③____________ ④____________ this, he is second to none.","answers":["When","it","comes","to"],"source":"習作簿","explanation":"句意：Peter擅長修理電腦。說到這，沒有人比得上他。 本題依序填入：When、it、comes、to。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":22,"zh":"這家店販賣各式各樣的蛋糕，有不同的尺寸和口味。","question":"This store sells a variety of cakes. They ①____________ ②____________ all sizes and flavors.","answers":["come","in"],"source":"習作簿","explanation":"句意：這家店販賣各式各樣的蛋糕，有不同的尺寸和口味。 本題依序填入：come、in。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":23,"zh":"你必須擺脫把該做的事拖到最後一刻的壞習慣。","question":"You must ①____________ ②____________ ③____________ the bad habit of postponing what you should do until the last minute.","answers":["get","rid","of"],"source":"習作簿","explanation":"句意：你必須擺脫把該做的事拖到最後一刻的壞習慣。 本題依序填入：get、rid、of。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":24,"zh":"這種車的模型有三種不同的顏色讓你選擇。","question":"This car model ①____________ ②____________ three different colors for you to choose from.","answers":["comes","in"],"source":"All in One","explanation":"句意：這種車的模型有三種不同的顏色讓你選擇。 本題依序填入：comes、in。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":25,"zh":"是他的努力使他成功。","question":"It is his ①____________ ②____________ that leads to his success.","answers":["hard","work"],"source":"三合一學習手冊","explanation":"句意：是他的努力使他成功。 本題依序填入：hard、work。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":26,"zh":"有些人喜歡在網上購物，然而有些人偏愛到實體商店買東西。","question":"Some people like ①____________ ②____________, ③____________ ④____________ prefer buying things at a real store.","answers":["shopping","online","while/whereas","others"],"source":"三合一學習手冊","explanation":"句意：有些人喜歡在網上購物，然而有些人偏愛到實體商店買東西。 本題依序填入：shopping、online、while/whereas、others。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":27,"zh":"我稱這個城市為家，因為我在這裡找到真正的歸屬感。","question":"I ①____________ ②____________ ③____________ ④____________ because I find a real sense of belonging here.","answers":["call","this","city","home"],"source":"三合一學習手冊","explanation":"句意：我稱這個城市為家，因為我在這裡找到真正的歸屬感。 本題依序填入：call、this、city、home。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":28,"zh":"如果你對照一下這位詩人早期的作品和他晚期的作品，你會發現許多有趣的差異。","question":"You will see many interesting differences if you ①____________ the poet’s early works ②____________ his later ones.","answers":["contrast","with"],"source":"三合一學習手冊","explanation":"句意：如果你對照一下這位詩人早期的作品和他晚期的作品，你會發現許多有趣的差異。 本題依序填入：contrast、with。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":29,"zh":"丟掉你不需要的東西會給你一個嶄新的生活。","question":"①____________ ②____________ ③____________ things you don’t need will give you a brand-new life.","answers":["Getting","rid","of"],"source":"三合一學習手冊","explanation":"句意：丟掉你不需要的東西會給你一個嶄新的生活。 本題依序填入：Getting、rid、of。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":30,"zh":"僅一個奇蹟就可以拯救我們的公司。","question":"①____________ ②____________ a miracle can save our company.","answers":["Nothing","but"],"source":"三合一學習手冊","explanation":"句意：僅一個奇蹟就可以拯救我們的公司。 本題依序填入：Nothing、but。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":31,"zh":"提到烹飪，我媽媽絕對是專家。","question":"When ①____________ ②____________ ③____________ ④____________, my mother is definitely an expert.","answers":["it","comes","to","cooking"],"source":"三合一學習手冊","explanation":"句意：提到烹飪，我媽媽絕對是專家。 本題依序填入：it、comes、to、cooking。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":32,"zh":"「ASAP」這個詞的意思是「盡可能地快」。如果你在信件中看到這個詞，你必須快速回應。","question":"The term “ASAP” ①____________ ②____________ “as soon as possible.” If you see it in a letter, you must respond quickly.","answers":["stands","for"],"source":"三合一學習手冊","explanation":"句意：「ASAP」這個詞的意思是「盡可能地快」。如果你在信件中看到這個詞，你必須快速回應。 本題依序填入：stands、for。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":33,"zh":"這款車有五種顏色可以選，包括你最喜歡的珍珠白。","question":"The car ①____________ ②____________ five colors, including your favorite, pearl white.","answers":["comes","in"],"source":"三合一學習手冊","explanation":"句意：這款車有五種顏色可以選，包括你最喜歡的珍珠白。 本題依序填入：comes、in。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":34,"zh":"沒有父母親的允許，我就不能在農場露營度假。","question":"I cannot ①____________ the holiday ②____________ on the farm without my parents’ permission.","answers":["spend","camping"],"source":"龍騰自命題","explanation":"without沒有","explanationSource":"source"},{"id":35,"zh":"「FYR」代表「供您參考」。“FY","question":"R”①____________ ②____________ “for your reference.”","answers":["stands","for"],"source":"龍騰自命題","explanation":"stand for代表","explanationSource":"source"},{"id":36,"zh":"停電持續了將近三小時，為這個鄰近地區帶來混亂。","question":"The blackout continued ①____________ nearly three hours, ②____________ chaos to the neighborhood.","answers":["for","bringing"],"source":"龍騰自命題","explanation":"本題運用S + V..., V-ing...的句構。","explanationSource":"source"},{"id":37,"zh":"Ketty站在這個舞臺上，忘記了她想說什麼。","question":"Ketty stood on the stage, ①____________ ②____________ she had wanted to say.","answers":["forgetting","what"],"source":"龍騰自命題","explanation":"本題運用S + V..., V-ing...的句構。","explanationSource":"source"},{"id":38,"zh":"如果妳試著用化妝來遮蓋臉上的粉刺，這只會讓情況更糟。","question":"If you try to cover pimples on your face with make-up, it will make things ①____________ ②____________.","answers":["even","worse"],"source":"龍騰自命題","explanation":"even worse 更糟。","explanationSource":"source"},{"id":39,"zh":"在大火之後，留在原野上的僅剩灰燼。","question":"After the huge fire, there was ①____________②____________ ash left in the field.","answers":["nothing","but"],"source":"龍騰自命題","explanation":"nothing but 僅僅。","explanationSource":"source"},{"id":40,"zh":"小偷闖進了房子，偷走了一大筆錢。","question":"The thief broke into the house, ____________ a large sum of money.","answers":["stealing"],"source":"三合一學習手冊","explanation":"句意：小偷闖進了房子，偷走了一大筆錢。 本題依序填入：stealing。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":41,"zh":"這颱風這麼具破壞力，要清掉它所造成的混亂就花掉我們五天的時間。","question":"The typhoon was so destructive that it ①____________ us five days to ②____________ ③____________ the mess it had made.","answers":["took","clean","up"],"source":"龍騰自命題","explanation":"It + take + sb. + 時間 + to VR","explanationSource":"source"},{"id":42,"zh":"有五個顧客在咖啡廳裡。兩個在閱讀，其餘的都在聊天。","question":"There are five customers in the café. Two are reading, and ①____________ ②____________ are chatting.","answers":["the","others"],"source":"三合一學習手冊","explanation":"句意：有五個顧客在咖啡廳裡。兩個在閱讀，其餘的都在聊天。 本題依序填入：the、others。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"}]};</script><script src="longteng-b1u5-quiz.js?v=20261027-2"></script><script src="longteng-vocab-required-pronunciation.js?v=20261027-2"></script></body></html>
