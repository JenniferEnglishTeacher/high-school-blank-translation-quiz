  <script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 5｜單字選擇","mode":"mcq","questions":[{"id":1,"question":"You should clean your teeth in the ____________ way every day to protect them from decay.","options":["harmful","crowded","proper","obvious"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"你應該以適當的方式每天清潔牙齒來防止蛀牙。 (A)有害的 (B)擠滿的；擁擠的 (C)適當的 (D)明顯的","explanationSource":"source"},{"id":2,"question":"Many experts have pointed out the importance of ____________ protection in government policy-making.","options":["poisonous","environmental","obvious","proper"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"許多專家已經指出在政府制定政策的過程裡，環境保護的重要性。 (A)有毒的 (B)自然環境的 (C)明顯的 (D)適當的","explanationSource":"source"},{"id":3,"question":"Eating too much fast food is ____________ to your health, so you should stop eating it so often.","options":["harmful","proper","obvious","eager"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"吃太多速食對你的健康有害，所以你應該別太常吃速食。 (A)有害的 (B)適當的 (C)明顯的 (D)渴望的","explanationSource":"source"},{"id":4,"question":"Before you throw something away, you had better check whether it can be ____________.","options":["harmed","envied","poisoned","recycled"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"在你把某個東西丟掉之前，你最好檢查一下它是否可以被回收。 (A)傷害 (B)羨慕 (C)毒害 (D)回收","explanationSource":"source"},{"id":5,"question":"This chemical is used to ____________ rats, and if children eat it by mistake, they might die.","options":["produce","consume","poison","recycle"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"這種化學物質被用來毒害老鼠，而如果兒童誤食的話，他們可能會死亡。 (A)製造；生產 (B)吃喝 (C)毒害 (D)回收","explanationSource":"source"},{"id":6,"question":"In order to make profits, many companies have to try to make ____________ happy and satisfied.","options":["products","consumers","substances","surroundings"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"為了賺取利潤，許多公司必須設法使消費者開心及滿意。 (A)產品 (B)消費者 (C)物質 (D)環境","explanationSource":"source"},{"id":7,"question":"Kevin felt so hungry that he quickly ____________ all the food on the table.","options":["consumed","produced","surrounded","recycled"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"Kevin覺得如此飢餓以致於他快速吃完桌上所有的食物。 (A)吃喝 (B)製造；生產 (C)圍繞 (D)回收","explanationSource":"source"},{"id":8,"question":"It’s amazing that this factory can ____________ up to one thousand cars every day.","options":["surround","consume","drift","produce"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"這間工廠每天能夠製造多達一千輛車，真是令人驚訝。 (A)圍繞 (B)吃喝 (C)漂流 (D)製造；生產","explanationSource":"source"},{"id":9,"question":"It is ____________ that Harold is in a good mood now because he has a big smile on his face.","options":["proper","plastic","obvious","eager"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"很明顯的Harold現在心情很好，因為他臉上有著大大的微笑。 (A)適當的 (B)塑膠（製）的 (C)明顯的 (D)渴望的","explanationSource":"source"},{"id":10,"question":"There was a large ____________ of workers in front of the factory asking for higher wages.","options":["product","crowd","consumer","poison"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"在那間工廠前面有一大群工人正在要求更高的工資。 (A)產品 (B)人群 (C)消費者 (D)毒藥","explanationSource":"source"},{"id":11,"question":"If you always ____________ what others have, you’ll never feel happy.","options":["envy","poison","harm","drift"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"如果你總是羨慕別人擁有的東西，你將永不會感到快樂。 (A)羨慕 (B)毒害 (C)傷害 (D)漂流","explanationSource":"source"},{"id":12,"question":"Some insects are able to blend in with their ____________ so that they won’t be caught easily.","options":["consumers","products","substances","surroundings"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"有些昆蟲能夠與牠們的環境融合在一起，如此一來，牠們就不會輕易地被抓到。 (A)消費者 (B)產品 (C)物質 (D)環境","explanationSource":"source"},{"id":13,"question":"As a fan of Taylor Swift, Blake is ____________ to meet her in person and take pictures with her.","options":["plastic","proper","eager","harmful"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"身為泰勒絲的粉絲，Blake渴望能親自見到她並與她合照。 (A)塑膠（製）的 (B)適當的 (C)渴望的 (D)有害的","explanationSource":"source"},{"id":14,"question":"Sharon usually buys a cup of hot coffee at a(n) ____________ store before she goes to work every morning.","options":["product","convenience","substance","environment"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"Sharon每天早上去上班前通常會在便利商店買一杯熱咖啡。 (A)產品 (B)便利 (C)物質 (D)自然環境","explanationSource":"source"},{"id":15,"question":"This chair is light and easy to carry around because it is made of ____________ rather than wood.","options":["plastic","crowd","product","harm"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"這把椅子很輕且容易帶著到處走，因為它由塑膠製成，而非木頭。 (A)塑膠 (B)人群 (C)產品 (D)傷害","explanationSource":"source"},{"id":16,"question":"The island is famous for its beautiful natural ____________ that has remained unharmed.","options":["product","convenience","substance","environment"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"這座島嶼以未受到破壞的美麗自然環境聞名。 (A)產品 (B)便利 (C)物質 (D)環境","explanationSource":"source"},{"id":17,"question":"As we all know, smoking can ____________ our health.","options":["drift","consume","harm","envy"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"如同我們所知的，抽菸有害健康。 (A)漂流 (B)吃喝 (C)傷害 (D)羨慕","explanationSource":"source"},{"id":18,"question":"Standing in the ____________ bus, I felt very uncomfortable and was sweating all over.","options":["crowded","surrounded","envied","drifted"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"站在擁擠的公車上，我覺得很不舒服，汗流浹背。 (A)擁擠的 (B)圍繞 (C)羨慕 (D)漂流","explanationSource":"source"},{"id":19,"question":"Sandy said she did not care if Lily was very popular. But in fact, she said it out of ____________.","options":["envy","poison","harm","crowd"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"Sandy說她不在乎是否Lily很受歡迎；但其實她這麼說是出於羨慕。 (A)羨慕 (B)毒藥 (C)傷害 (D)人群","explanationSource":"source"},{"id":20,"question":"Christine turned her back on Tim, not wanting to say a word to him. ____________, she was angry at him.","options":["Eagerly","Harmfully","Properly","Obviously"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"Christine轉身不理Tim，不想跟他說任何話。顯然地，她在生他的氣。 (A)渴望地 (B)有害地 (C)合適地 (D)顯然地","explanationSource":"source"},{"id":21,"question":"We should avoid using ____________ bags because they are not good for the environment.","options":["proper","plastic","eager","crowded"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"我們應該避免使用塑膠袋，因為它們有害環境。 (A)適當的 (B)塑膠的 (C)渴望的 (D)擁擠的","explanationSource":"source"},{"id":22,"question":"On a peaceful afternoon, I love to lie on the grass, watching the clouds ____________ by.","options":["harm","drift","surround","recycle"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"在寧靜的下午，我喜歡躺在草地上，看著雲朵飄過。 (A)傷害 (B)漂流 (C)環繞 (D)回收","explanationSource":"source"},{"id":23,"question":"The mother asked her son to put the toys back where they ____________ belonged.","options":["eagerly","poisonously","crowdedly","properly"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"這個媽媽要求她的兒子把玩具放回原本正確的位置。 (A)渴望地 (B)有毒地 (C)擁擠地 (D)適當地；正確地","explanationSource":"source"},{"id":24,"question":"The teacher was ____________ by little kids who were listening to a story she was telling.","options":["surrounded","consumed","recycled","produced"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"這位老師被正聽著她講故事的孩童包圍。 (A)包圍 (B)吃喝 (C)回收 (D)製造","explanationSource":"source"},{"id":25,"question":"My mother buys blueberries very often, and she thinks the ____________ they contain can improve our eyesight.","options":["products","substances","convenience","environment"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"我媽媽很常買藍莓，她認為藍莓中所含的物質可以改善我們的視力。 (A)產品 (B)物質 (C)便利 (D)環境","explanationSource":"source"},{"id":26,"question":"Looking ____________ at the candy, the little boy kept licking his lips.","options":["obviously","properly","eagerly","harmfully"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"渴望地看著糖果，這個小男孩不停地舔嘴唇。 (A)明顯地 (B)適合地 (C)渴望地 (D)有害地","explanationSource":"source"},{"id":27,"question":"Some mushrooms and toadstools that we find in the wild are ____________. We’d better not touch them.","options":["eager","obvious","poisonous","proper"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"有些我們在野外發現的蘑菇和蕈類是有毒的。我們最好別碰它們。 (A)渴望的 (B)顯然的 (C)有毒的 (D)合宜的","explanationSource":"source"},{"id":28,"question":"The supermodel is an animal lover. She always says “no” to beauty ____________ that have been tested on animals.","options":["products","crowds","substances","surroundings"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"這位超模是動物愛好者。她拒用動物試驗的美容產品。 (A)產品 (B)人群 (C)物質 (D)周遭環境","explanationSource":"source"},{"id":29,"question":"Many volunteers have joined the ____________ program; they are busy putting paper, cans, and plastic bottles into different baskets.","options":["substance","recycling","poison","convenience"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"許多志工已經加入這個回收計畫；他們正忙著把紙張、罐頭和塑膠瓶放入不同的籃子裡。 (A)物質 (B)回收 (C)毒物 (D)便利","explanationSource":"source"},{"id":30,"question":"Solar power is a kind of energy that can never be totally ____________ or used up. It is clean and green.","options":["drifted","surrounded","harmed","consumed"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"太陽能是一種永遠不會被消耗殆盡的能源。它乾淨又環保。 (A)漂流 (B)圍繞 (C)傷害 (D)消耗","explanationSource":"source"}]};</script>
