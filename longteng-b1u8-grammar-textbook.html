<script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 8｜文法選擇（課本句型）","mode":"mcq","questions":[{"id":1,"question":"Isaac left for work early so that ____________.","options":["traffic jam be avoided","avoided a traffic jam","he could avoid a traffic jam","to avoid a traffic jam"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"考點句構：so that表示「為了；以便於」，後面接一個「表目的」的子句；只有he could avoid a traffic jam為完整的子句。","explanationSource":"source"},{"id":2,"question":"The actor practiced saying the lines several times so that ____________.","options":["win the heart of the audience","to win the heart of the audience","performing well on the stage","he could perform well on the stage"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"考點句構：so that表示「為了；以便於」，後面接一個「表目的」的子句；只有he could perform well on the stage為完整的子句。","explanationSource":"source"},{"id":3,"question":"Jill goes to gym every day ____________ she can keep fit.","options":["thus","so that","in order to","though"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"考點句構：so that表示「為了；以便於」，後面接一個「表目的」的子句；thus為副詞，其前需要一個對等連接詞，才能接子句；though雖然是連接詞，但語意不符，in order to後只能接原形動詞。","explanationSource":"source"},{"id":4,"question":"Joe applied for this challenging job so that ____________.","options":["to earn more money","for him to earn more money","he would be able to earn more money","earning more money be possible"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"考點句構：so that表示「為了；以便於」，後面接一個「表目的」的子句；只有he would be able to earn more money為完整的子句。","explanationSource":"source"},{"id":5,"question":"____________ you practice, ____________ mistakes you will make.","options":["The much; the less","The more; the few","The more; the fewer","The most; the least"],"answer":2,"answerLabel":"C","source":"三合一學習手冊","explanation":"正確答案為 The more; the fewer；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":6,"question":"Simon lowered his voice ____________ he wouldn’t wake the sleeping baby.","options":["but","as a result","therefore","so that"],"answer":3,"answerLabel":"D","source":"三合一學習手冊","explanation":"正確答案為 so that；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":7,"question":"____________ the weather gets, ____________ I feel.","options":["The hotter; the uncomfortable","The more cold; the more uncomfortable","The cold; the much uncomfortable","The hotter; the more uncomfortable"],"answer":3,"answerLabel":"D","source":"三合一學習手冊","explanation":"正確答案為 The hotter; the more uncomfortable；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":8,"question":"____________ you spend with your family, ____________ you will get.","options":["The more time; the closer","The more time; the more close","The much time; the closet","More time; the close"],"answer":0,"answerLabel":"A","source":"三合一學習手冊","explanation":"正確答案為 The more time; the closer；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":9,"question":"Allen likes to have a cup of coffee for breakfast ____________ he can stay awake for the whole morning.","options":["in order to","so that","although","whether"],"answer":1,"answerLabel":"B","source":"三合一學習手冊","explanation":"正確答案為 so that；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":10,"question":"Sally left the office early ____________ she could make it to her son’s piano recital.","options":["as for","so as to","so what","so that"],"answer":3,"answerLabel":"D","source":"三合一學習手冊","explanation":"正確答案為 so that；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":11,"question":"Please turn down the music ____________ I can focus on my studying.","options":["so that","or","that","therefore"],"answer":0,"answerLabel":"A","source":"習作簿","explanation":"正確答案為 so that；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":12,"question":"The advertisement says the more you buy, ____________.","options":["and the more you save","the more you save","you save more","and you save more"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"考點句構：The + more + S + V, the + more + S + V. 逗點後的the more前不需要對等連接詞；其餘的兩個都不符合the more..., the more....句型。","explanationSource":"source"},{"id":13,"question":"My aunt is a fun-loving person, and she likes to invite a lot of people to her house for parties. She believes in the saying, “The more, ____________.”","options":["merrier","the merry","the merrier","merriest"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"此為諺語「多多益善；愈多愈好」，省略主詞及動詞的用法。","explanationSource":"source"},{"id":14,"question":"The more effort you put in, ____________.","options":["you will get more satisfying results","the more satisfying your results will be","and you are more likely to get satisfying results","and the results will be more satisfying than you can ever imagine"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"考點句構：The + more + S + V, the + 形容詞比較級 + S + V. 只有the more satisfying your results will be符合此句型，本句較複雜，若不用the more..., the more....，可寫為When you put in more effort, your results will be more satisfying.","explanationSource":"source"},{"id":15,"question":"The more calories you put into your body, ____________.","options":["the fatter you will need to burn","the more fat you will need to burn","and the more fat you will need to burn","and you will need to burn more fat"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"考點句構：The + more + N + S + V, the + more + N + S + V. 逗點後的the more前不需要對等連接詞；其餘的兩個都不符合the more..., the more....句型。","explanationSource":"source"},{"id":16,"question":"The hotter it gets, ____________.","options":["more air conditioners will be turned on","more and more people will turn on their air conditioners","and the more air conditioners will be turned on","the more often people will turn on their air conditioners"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"考點句構：The + 形容詞比較級 + S + V, the + more + 副詞 + S + V. 只有the more often people will turn on their air conditioners符合此句型，本句較複雜，若不用the more..., the more....，可寫為When it gets hotter, people will turn on their air conditioners more often.","explanationSource":"source"},{"id":17,"question":"The harder you study, the ____________ you will get good grades.","options":["easily","more easily","easy","much easily"],"answer":1,"answerLabel":"B","source":"習作簿","explanation":"正確答案為 more easily；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":18,"question":"I always bring a large bag with me so that ____________.","options":["carrying things that I buy","I can use the bag to carry things that I buy","to be able to carry things that I buy","being able to carry things that I buy"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"考點句構：so that表示「為了；以便於」，後面接一個「表目的」的子句；只有I can use the bag to carry things that I buy是子句。","explanationSource":"source"}]};</script><script src="longteng-b1u5-quiz.js?v=20261027-1"></script><script src="longteng-vocab-required-pronunciation.js?v=20261027-1"></script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
