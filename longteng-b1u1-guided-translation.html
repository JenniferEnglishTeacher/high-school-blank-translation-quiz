to cancel the fan meeting.", "answers": ["let", "down"]}, {"id": 20, "zh": "明天早上我們會去動物園，然後剩下的時間我們會去百貨公司購物。", "question": "We will go to the zoo tomorrow morning, and then for ①____________ ②____________ ③____________ the day, we will go shopping at the department store.", "answers": ["the", "rest", "of"]}, {"id": 21, "zh": "親自購物的一個優點是你可以試穿衣服，看看它們是否合身。", "question": "One of the advantages of shopping ①____________ ②____________ is that you can try on clothes to see if they fit.", "answers": ["in", "person"]}, {"id": 22, "zh": "到京都的遊客通常會租用和服並穿上它們，作為他們旅遊活動的一部分。", "question": "Tourists to Kyoto tend to rent kimonos and ①____________ ②____________ in them as a part of their tour activities.", "answers": ["dress", "up"]}, {"id": 23, "zh": "身為一位醫生，Jasmine總是將她病人的需求放在第一位，即使這代表長時間工作。", "question": "As a doctor, Jasmine always ①____________ her patients’ needs ②____________, even if it means working long hours.", "answers": ["puts", "first"]}, {"id": 24, "zh": "每晚睡覺前，Maggie都會確保全部的門和窗都有鎖好。", "question": "Every night before Maggie goes to bed, she ①____________ ②____________ all the doors and windows are locked.", "answers": ["makes", "sure"]}, {"id": 25, "zh": "我祖父被認為是一個很有智慧的人，因此每個人總是認真看待他的忠告。", "question": "My grandfather is regarded as a man of great wisdom, so everyone always ①____________ his advice ②____________.", "answers": ["takes", "seriously"]}, {"id": 26, "zh": "在與他姊姊討論後，Jason決定為今年的萬聖夜派對裝扮成美國隊長。", "question": "After a discussion with his sister, Jason decided to ①____________ ②____________ ③____________ Captain America for the Halloween party this year.", "answers": ["dress", "up", "as"]}, {"id": 27, "zh": "在這個班級裡，只有五位學生來自臺灣，其他學生都是來自美國或歐洲。", "question": "In this class, only five students are from Taiwan, and ①____________ ②(r)____________ come from the US or Europe.", "answers": ["the", "rest"]}, {"id": 28, "zh": "Monica去參加Bryan的生日派對前，花了數小時裝扮。", "question": "Monica spent several hours ①____________ ②____________ before she went to Bryan’s birthday party.", "answers": ["dressing", "up"]}, {"id": 29, "zh": "Richard認為他孩子的健康最重要，並鼓勵他們規律運動。", "question": "Richard ①____________ his children’s health ②____________ and encourages them to exercise regularly.", "answers": ["puts", "first"]}, {"id": 30, "zh": "Lucas沒有讓他的教練失望，因為他在賽跑中贏得了第一名。", "question": "Lucas didn’t ①____________ his coach ②____________ because he won first place in the race.", "answers": ["let", "down"]}, {"id": 31, "zh": "Adam只是在開玩笑，所以你不應該太認真看待他說的話。", "question": "Adam is just kidding, so you shouldn’t ①____________ his words ②____________.", "answers": ["take", "seriously"]}, {"id": 32, "zh": "Sidney希望他有一天能夠親自造訪巴黎的艾菲爾鐵塔。", "question": "Sidney hopes that he can visit the Eiffel Tower in Paris ①____________ ②____________ one day.", "answers": ["in", "person"]}, {"id": 33, "zh": "我們都知道華倫．巴菲特是美國最有錢的人之一，而且他每年都捐出很多錢。", "question": "We all know ①____________ Warren Buffett is one of the richest men in the US, ②____________ ③____________ he gives away a lot of money every year.", "answers": ["that", "and", "that"]}, {"id": 34, "zh": "看起來好像要下雨，所以我認為你最好要帶傘。", "question": "It ①____________ ②____________ ③____________, so I think ④____________ you had better take an umbrella with you.", "answers": ["looks", "like", "rain", "that"]}, {"id": 35, "zh": "我很驚訝現代人似乎只在乎自己的問題。", "question": "I am ①____________ ②____________ people today seem to care only about their own problems.", "answers": ["surprised", "that"]}, {"id": 36, "zh": "Gary終於了解健康比任何事物都重要。", "question": "Gary finally ①r____________ ②____________ health is more important than anything.", "answers": ["realized", "that"]}, {"id": 37, "zh": "我的班上同學很興奮聖誕節派對將如期舉行。", "question": "My classmates are ①____________ ②____________ the Christmas party will be held as scheduled.", "answers": ["excited", "that"]}, {"id": 38, "zh": "Eddie賣掉他的其中一間房子後，將有足夠的錢度過餘生。", "question": "Eddie will have enough money for ①____________ ②____________ ③____________ his life after he sells one of his houses.", "answers": ["the", "rest", "of"]}, {"id": 39, "z .question;const zh=$('#zh');if(q.zh){zh.textContent=q.zh;zh.classList.remove('hidden')}else zh.classList.add('hidden');feedback.className='feedback hidden';$('#check').classList.remove('hidden');next.classList.add('hidden');if(MODE==='mcq')answerArea.innerHTML='<div class="options">'+q.options.map((o,i)=>'<label class="option"><input type="radio" name="answer" value="'+i+'"><b>'+String.fromCharCode(65+i)+'.</b> '+esc(o)+'</label>').join('')+'</div>';else answerArea.innerHTML='<div class="inputs">'+q.answers.map((_,i)=>'<div class="answer-row"><label>'+(MODE==='multi'?['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'][i]:'答案')+'</label><input class="spell" autocomplete="off" spellcheck="false" placeholder="請輸入完整答案"></div>').join('')+'</div>';setTimeout(()=>answerArea.querySelector('input')?.focus(),0)}function currentAnswers(){if(MODE==='mcq'){const x=answerArea.querySelector('input:checked');return x?[+x.value]:[]}return [...answerArea.querySelectorAll('.spell')].map(x=>x.value)}function correctText(q){return MODE==='mcq'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.answers.join(' / ')}$('#check').onclick=()=>{const q=chosen[idx],a=currentAnswers();if((MODE==='mcq'&&!a.length)||(MODE!=='mcq'&&(a.length!==q.answers.length||a.some(x=>!x.trim()))))return alert('請完成所有答案。');const ok=MODE==='mcq'?a[0]===q.answer:a.every((x,i)=>norm(x)===norm(q.answers[i]));if(ok){correct.add(q.id);feedback.className='feedback ok';feedback.textContent='✅ 全部正確！';$('#check').classList.add('hidden');next.classList.remove('hidden')}else{if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(MODE==='mcq'?String.fromCharCode(65+a[0]):a.join(' / '));$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';feedback.className='feedback bad';feedback.innerHTML='❌ 答案不正確。正確答案：<strong>'+esc(correctText(q))+'</strong><br>請重新作答。';if(MODE==='mcq')answerArea.querySelectorAll('input').forEach(x=>x.checked=false);else answerArea.querySelectorAll('.spell').forEach(x=>x.value='');answerArea.querySelector('input')?.focus()}};next.onclick=()=>{idx++;idx>=chosen.length?finish():show()};$('#finish').onclick=finish;function finish(){quiz.classList.add('hidden');result.classList.remove('hidden');$('#summary').innerHTML='<div class="stat">選擇題數<b>'+chosen.length+'</b></div><div class="stat">完成答對<b>'+correct.size+'</b></div><div class="stat">曾答錯<b>'+wrong.size+'</b></div>';$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>'<div class="wrong"><b>'+(i+1)+'. 第 '+r.q.id+' 題</b><p>'+esc((r.q.zh?r.q.zh+'\n':'')+r.q.question)+'</p><p><strong>錯誤答案：</strong>'+r.attempts.map(esc).join('；')+'</p><p><strong>正確答案：</strong>'+esc(correctText(r.q))+'</p></div>').join(''):'<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size)}$('#restart').onclick=()=>{result.classList.add('hidden');select.classList.remove('hidden')};$('#download').onclick=async()=>{if(!wrong.size)return;const children=[new Paragraph({heading:HeadingLevel.TITLE,children:[new TextRun({text:TITLE+' 錯題紀錄',bold:true})]})];[...wrong.values()].forEach((r,i)=>{children.push(new Paragraph({heading:HeadingLevel.HEADING_2,children:[new TextRun({text:(i+1)+'. 第 '+r.q.id+' 題',bold:true})]}));if(r.q.zh)children.push(new Paragraph({children:[new TextRun({text:r.q.zh})]}));children.push(new Paragraph({children:[new TextRun({text:r.q.question})]}));children.push(new Paragraph({children:[new TextRun({text:'錯誤答案：',bold:true}),new TextRun({text:r.attempts.join('；')})]}));children.push(new Paragraph({children:[new TextRun({text:'正確答案：',bold:true}),new TextRun({text:correctText(r.q)})]}))});const doc=new Document({sections:[{children}]}),blob=await Packer.toBlob(doc),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=TITLE+'_錯題_'+new Date().toISOString().slice(0,10)+'.docx';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};renderList();</script></body></html>
