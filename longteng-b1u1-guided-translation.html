  <script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 1｜引導式翻譯","mode":"multi","questions":[{"id":1,"zh":"我得確定這項計畫能有效。","question":"I must ①____________ ②____________ that the plan can work.","answers":["make","sure"],"source":"龍騰自命題","explanation":"make sure（確定）後常接that子句或疑問詞子句。","explanationSource":"source"},{"id":2,"zh":"很多人喜歡嚐起來又甜又酸的菜餚。","question":"Many people like dishes which ①____________ both ②____________ and ③____________.","answers":["taste","sweet","sour"],"source":"龍騰自命題","explanation":"taste解作「嚐起來」，後接形容詞。","explanationSource":"source"},{"id":3,"zh":"在你離開廚房前，要確定你已經關上瓦斯。","question":"Before you leave the kitchen, ①____________ ②____________ ③____________ you have turned off the gas.","answers":["make","sure","that"],"source":"龍騰自命題","explanation":"make sure（確定）後常接that子句或疑問詞子句。","explanationSource":"source"},{"id":4,"zh":"這位護士總是看起來忙得像蜜蜂，但是她未曾抱怨。","question":"The nurse always ①____________ as ②____________ as a bee, but she has never complained.","answers":["looks","busy"],"source":"龍騰自命題","explanation":"look解作「看起來」，後方接形容詞。","explanationSource":"source"},{"id":5,"zh":"我記得你的姊姊在派對上看起來像神力女超人。","question":"I remember your sister ①____________ ②____________ Wonder Woman at the party.","answers":["looked","like"],"source":"龍騰自命題","explanation":"look + like + N表示「看起來像……」。","explanationSource":"source"},{"id":6,"zh":"每年的萬聖夜，年幼的堂表弟妹們都會裝扮成他們最喜愛的卡通角色。","question":"Every Halloween, the young cousins ①____________ ②____________ as their favorite cartoon characters.","answers":["dress","up"],"source":"課本例句填空","explanation":"句意：每年的萬聖夜，年幼的堂表弟妹們都會裝扮成他們最喜愛的卡通角色。 本題依序填入：dress、up。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":7,"zh":"大多數的父母認為其子女的需求最重要，並希望他們可以開心健康。","question":"Most parents ①____________ their children’s needs ②____________ and want them to be happy and healthy.","answers":["put","first"],"source":"課本例句填空","explanation":"句意：大多數的父母認為其子女的需求最重要，並希望他們可以開心健康。 本題依序填入：put、first。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":8,"zh":"請確保當你開車時不會超速。","question":"Please ①____________ ②____________ that you don’t go over the speed limit when you are driving.","answers":["make","sure"],"source":"課本例句填空","explanation":"句意：請確保當你開車時不會超速。 本題依序填入：make、sure。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":9,"zh":"Roy答應他女兒會出席她的學校話劇表演，而且他沒有讓她失望。","question":"Roy promised his daughter that he would attend her school play, and he didn’t ①____________ her ②____________.","answers":["let","down"],"source":"課本例句填空","explanation":"句意：Roy答應他女兒會出席她的學校話劇表演，而且他沒有讓她失望。 本題依序填入：let、down。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":10,"zh":"Archie喜愛嘲笑人，所以不要把他的話當真。","question":"Archie loves making fun of people, so don’t ①____________ his words ②____________.","answers":["take","seriously"],"source":"課本例句填空","explanation":"句意：Archie喜愛嘲笑人，所以不要把他的話當真。 本題依序填入：take、seriously。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":11,"zh":"Deborah決定親自參觀博物館去看那些畫作，而非在網上閱覽它們。","question":"Deborah decided to visit the museum ①____________ ②____________ to see the paintings instead of looking at them online.","answers":["in","person"],"source":"課本例句填空","explanation":"句意：Deborah決定親自參觀博物館去看那些畫作，而非在網上閱覽它們。 本題依序填入：in、person。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":12,"zh":"Daryl吃了幾口蛋糕，然後把剩下的蛋糕給他的小妹妹。","question":"Daryl took a few bites of the cake and then gave ①____________ ②____________ ③____________ it to his little sister.","answers":["the","rest","of"],"source":"課本例句填空","explanation":"句意：Daryl吃了幾口蛋糕，然後把剩下的蛋糕給他的小妹妹。 本題依序填入：the、rest、of。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":13,"zh":"那位粗心的騎士在車禍中受傷嚴重，餘生必須借助義肢行走。","question":"The careless rider was badly hurt in the accident and had to walk with the aid of an artificial leg for ①____________ ②____________ ③____________ his life.","answers":["the","rest","of"],"source":"All in One","explanation":"句意：那位粗心的騎士在車禍中受傷嚴重，餘生必須借助義肢行走。 本題依序填入：the、rest、of。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":14,"zh":"不要讓你的父母失望，因為他們犧牲了很多把你撫養長大。","question":"Don’t ①____________ your parents ②____________, for they have sacrificed a lot to bring you up.","answers":["let","down"],"source":"All in One","explanation":"句意：不要讓你的父母失望，因為他們犧牲了很多把你撫養長大。 本題依序填入：let、down。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":15,"zh":"David說的只是笑話；不必過於認真。","question":"David’s remarks were nothing but a joke; don’t ①____________ ②____________ too ③____________.","answers":["take","them","seriously"],"source":"All in One","explanation":"句意：David說的只是笑話；不必過於認真。 本題依序填入：take、them、seriously。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":16,"zh":"Nick不在意飯後洗碗。相反地，他挺喜歡這麼做。","question":"Nick doesn’t mind ①(w)____________ the dishes after meals. On the contrary, he really ②____________ ③____________ so.","answers":["washing","enjoys","doing"],"source":"三合一學習手冊","explanation":"句意：Nick不在意飯後洗碗。相反地，他挺喜歡這麼做。 本題依序填入：washing、enjoys、doing。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":17,"zh":"這香水聞起來像薰衣草。","question":"The perfume ①____________ ②____________ lavender.","answers":["smells","like"],"source":"三合一學習手冊","explanation":"句意：這香水聞起來像薰衣草。 本題依序填入：smells、like。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":18,"zh":"Sherry認真對待她的健身目標，從不錯過一次健身課。","question":"Sherry ①____________ her fitness goals ②____________ and never misses a workout session.","answers":["takes","seriously"],"source":"三合一學習手冊","explanation":"句意：Sherry認真對待她的健身目標，從不錯過一次健身課。 本題依序填入：takes、seriously。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":19,"zh":"這位韓國演員不想讓他的粉絲失望，所以他決定不取消這場粉絲見面會。","question":"The Korean actor didn’t want to ①____________ his fans ②____________, so he decided not to cancel the fan meeting.","answers":["let","down"],"source":"三合一學習手冊","explanation":"句意：這位韓國演員不想讓他的粉絲失望，所以他決定不取消這場粉絲見面會。 本題依序填入：let、down。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":20,"zh":"明天早上我們會去動物園，然後剩下的時間我們會去百貨公司購物。","question":"We will go to the zoo tomorrow morning, and then for ①____________ ②____________ ③____________ the day, we will go shopping at the department store.","answers":["the","rest","of"],"source":"三合一學習手冊","explanation":"句意：明天早上我們會去動物園，然後剩下的時間我們會去百貨公司購物。 本題依序填入：the、rest、of。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":21,"zh":"親自購物的一個優點是你可以試穿衣服，看看它們是否合身。","question":"One of the advantages of shopping ①____________ ②____________ is that you can try on clothes to see if they fit.","answers":["in","person"],"source":"三合一學習手冊","explanation":"句意：親自購物的一個優點是你可以試穿衣服，看看它們是否合身。 本題依序填入：in、person。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":22,"zh":"到京都的遊客通常會租用和服並穿上它們，作為他們旅遊活動的一部分。","question":"Tourists to Kyoto tend to rent kimonos and ①____________ ②____________ in them as a part of their tour activities.","answers":["dress","up"],"source":"三合一學習手冊","explanation":"句意：到京都的遊客通常會租用和服並穿上它們，作為他們旅遊活動的一部分。 本題依序填入：dress、up。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":23,"zh":"身為一位醫生，Jasmine總是將她病人的需求放在第一位，即使這代表長時間工作。","question":"As a doctor, Jasmine always ①____________ her patients’ needs ②____________, even if it means working long hours.","answers":["puts","first"],"source":"三合一學習手冊","explanation":"句意：身為一位醫生，Jasmine總是將她病人的需求放在第一位，即使這代表長時間工作。 本題依序填入：puts、first。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":24,"zh":"每晚睡覺前，Maggie都會確保全部的門和窗都有鎖好。","question":"Every night before Maggie goes to bed, she ①____________ ②____________ all the doors and windows are locked.","answers":["makes","sure"],"source":"三合一學習手冊","explanation":"句意：每晚睡覺前，Maggie都會確保全部的門和窗都有鎖好。 本題依序填入：makes、sure。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":25,"zh":"我祖父被認為是一個很有智慧的人，因此每個人總是認真看待他的忠告。","question":"My grandfather is regarded as a man of great wisdom, so everyone always ①____________ his advice ②____________.","answers":["takes","seriously"],"source":"龍騰自命題","explanation":"因為前後子句有因果關係，所以用so來連接兩個子句；be regarded as 被認為是……；a man of wisdom 有智慧的人；advice　n. [U] 忠告；建議；everyone為單數主詞，因此動詞要用takes；take sth. seriously 認真看待某事","explanationSource":"source"},{"id":26,"zh":"在與他姊姊討論後，Jason決定為今年的萬聖夜派對裝扮成美國隊長。","question":"After a discussion with his sister, Jason decided to ①____________ ②____________ ③____________ Captain America for the Halloween party this year.","answers":["dress","up","as"],"source":"龍騰自命題","explanation":"discussion　n. [C] 討論；decide to VR指「決定去做……」，因此空格內要填入原形動詞片語；dress up as是指「裝扮成……（角色、人物）」","explanationSource":"source"},{"id":27,"zh":"在這個班級裡，只有五位學生來自臺灣，其他學生都是來自美國或歐洲。","question":"In this class, only five students are from Taiwan, and ①____________ ②(r)____________ come from the US or Europe.","answers":["the","rest"],"source":"龍騰自命題","explanation":"這裡的the rest是指其他的學生，視為複數主詞，需搭配複數動詞come","explanationSource":"source"},{"id":28,"zh":"Monica去參加Bryan的生日派對前，花了數小時裝扮。","question":"Monica spent several hours ①____________ ②____________ before she went to Bryan’s birthday party.","answers":["dressing","up"],"source":"龍騰自命題","explanation":"spend + 時間 + V-ing指「某人花時間做某事」，故後面要接動名詞片語dressing up；dress up 裝扮","explanationSource":"source"},{"id":29,"zh":"Richard認為他孩子的健康最重要，並鼓勵他們規律運動。","question":"Richard ①____________ his children’s health ②____________ and encourages them to exercise regularly.","answers":["puts","first"],"source":"龍騰自命題","explanation":"and連接兩個動詞片語，and後的動詞為現在簡單式，and前應為同時態的動詞片語puts...first；put...first認為……最重要","explanationSource":"source"},{"id":30,"zh":"Lucas沒有讓他的教練失望，因為他在賽跑中贏得了第一名。","question":"Lucas didn’t ①____________ his coach ②____________ because he won first place in the race.","answers":["let","down"],"source":"龍騰自命題","explanation":"由於空格前面有助動詞didn’t，所以要填入原形動詞let；let...down讓……失望；win first place 贏得第一名","explanationSource":"source"},{"id":31,"zh":"Adam只是在開玩笑，所以你不應該太認真看待他說的話。","question":"Adam is just kidding, so you shouldn’t ①____________ his words ②____________.","answers":["take","seriously"],"source":"龍騰自命題","explanation":"因為前後子句有因果關係，所以用so來連接兩個子句；kid　vi. 開玩笑；shouldn’t為助動詞，故後面要接原形動詞；take sth. seriously 認真看待某事","explanationSource":"source"},{"id":32,"zh":"Sidney希望他有一天能夠親自造訪巴黎的艾菲爾鐵塔。","question":"Sidney hopes that he can visit the Eiffel Tower in Paris ①____________ ②____________ one day.","answers":["in","person"],"source":"龍騰自命題","explanation":"that引導名詞子句作為hopes的受詞；the Eiffel Tower 艾菲爾鐵塔；one day 有一天","explanationSource":"source"},{"id":33,"zh":"我們都知道華倫．巴菲特是美國最有錢的人之一，而且他每年都捐出很多錢。","question":"We all know ①____________ Warren Buffett is one of the richest men in the US, ②____________ ③____________ he gives away a lot of money every year.","answers":["that","and","that"],"source":"龍騰自命題","explanation":"that引導的名詞子句，可放在及物動詞後方當受詞。若接兩個that子句，第一個that可省略，第二個that不得省略：S + V + (that +) S + V… + and + that + S + V….。","explanationSource":"source"},{"id":34,"zh":"看起來好像要下雨，所以我認為你最好要帶傘。","question":"It ①____________ ②____________ ③____________, so I think ④____________ you had better take an umbrella with you.","answers":["looks","like","rain","that"],"source":"龍騰自命題","explanation":"look + like + N表示「看起來像……」。that引導的名詞子句，可放在及物動詞後方當受詞，且that可省略：S + V + (that +) S + V….。","explanationSource":"source"},{"id":35,"zh":"我很驚訝現代人似乎只在乎自己的問題。","question":"I am ①____________ ②____________ people today seem to care only about their own problems.","answers":["surprised","that"],"source":"龍騰自命題","explanation":"surprising解作「（事物）令人驚訝的」；surprised解作「（人）感到驚訝的」。that引導的名詞子句，可放在表達情緒或感受的形容詞後方，且that可省略：S + be + adj. + (that +) S + V….。","explanationSource":"source"},{"id":36,"zh":"Gary終於了解健康比任何事物都重要。","question":"Gary finally ①r____________ ②____________ health is more important than anything.","answers":["realized","that"],"source":"龍騰自命題","explanation":"that引導的名詞子句，可放在及物動詞後當受詞，且that可省略：S + V + (that +) S + V….。","explanationSource":"source"},{"id":37,"zh":"我的班上同學很興奮聖誕節派對將如期舉行。","question":"My classmates are ①____________ ②____________ the Christmas party will be held as scheduled.","answers":["excited","that"],"source":"龍騰自命題","explanation":"that引導的名詞子句，可放在表達情緒或感受的形容詞後方，且that可省略：S + be + adj. + (that +) S + V….exciting解作「（事物）令人興奮的」；excited解作「（人）感到興奮的」。","explanationSource":"source"},{"id":38,"zh":"Eddie賣掉他的其中一間房子後，將有足夠的錢度過餘生。","question":"Eddie will have enough money for ①____________ ②____________ ③____________ his life after he sells one of his houses.","answers":["the","rest","of"],"source":"龍騰自命題","explanation":"the rest of（剩餘的）後接可數名詞、不可數名詞均可。","explanationSource":"source"},{"id":39,"zh":"Tracy只吃了幾口點心，然後將剩下的部分留給她弟弟。","question":"Tracy took only a few bites of the dessert and then left ①____________ ②____________ ③____________ it for her little brother.","answers":["the","rest","of"],"source":"龍騰自命題","explanation":"the rest of（剩餘的）後方接可數名詞、不可數名詞均可。","explanationSource":"source"},{"id":40,"zh":"雖然打三份工很累人，但Tina每個月拿到薪水時覺得滿足。","question":"Although working three part-time jobs is ①____________, Tina feels ②____________ when she gets paid every month.","answers":["tiring","satisfied"],"source":"三合一學習手冊","explanation":"句意：雖然打三份工很累人，但Tina每個月拿到薪水時覺得滿足。 本題依序填入：tiring、satisfied。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":41,"zh":"Queenie很確定Stacy不會回答如此私人的問題。","question":"Queenie ①____________ ②____________ ③____________ Stacy won’t ④____________ ⑤____________such a private question.","answers":["is","sure","that","reply","to"],"source":"三合一學習手冊","explanation":"句意：Queenie很確定Stacy不會回答如此私人的問題。 本題依序填入：is、sure、that、reply、to。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"}]};</script>
