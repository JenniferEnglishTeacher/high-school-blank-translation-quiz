  <script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 2｜文法選擇（課本句型）","mode":"mcq","questions":[{"id":1,"question":"It is difficult for me ____________ 100 math problems in one hour.","options":["solves","solving","to solve","have solved"],"answer":2,"source":"三合一學習手冊","explanation":"正確答案為 to solve；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":2,"question":"Tim ____________ to the library to prepare for the final exam. He’s not home.","options":["has been","is going","has gone","went"],"answer":2,"source":"三合一學習手冊","explanation":"正確答案為 has gone；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":3,"question":"It is ____________ for some people ____________ their ways of doing things.","options":["hard; to change","hard; changing","hardly; to change","easily; changing"],"answer":0,"source":"三合一學習手冊","explanation":"正確答案為 hard; to change；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":4,"question":"____________ is ____________ for you to apologize to her for lying to her.","options":["It; easily","It; important","That; correct","This; right"],"answer":1,"source":"三合一學習手冊","explanation":"正確答案為 It; important；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":5,"question":"Michael ____________ 10 kilograms since he ____________ his leg.","options":["gains; breaks","gained; broke","has gained; has broken","has gained; broke"],"answer":3,"source":"三合一學習手冊","explanation":"正確答案為 has gained; broke；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":6,"question":"What ____________ lately? I haven’t seen you for a while.","options":["do you do","are you busy","have you been busy with","have you been"],"answer":2,"source":"三合一學習手冊","explanation":"正確答案為 have you been busy with；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":7,"question":"He ____________ busy ____________ housework for the whole day. He must be very tired now.","options":["is; to do","will be; doing","has; to do","has been; doing"],"answer":3,"source":"三合一學習手冊","explanation":"正確答案為 has been; doing；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":8,"question":"It is ____________ to put personal information on social networking websites.","options":["danger","dangerous","risk","risked"],"answer":1,"source":"龍騰自命題","explanation":"It + be + adj. (for sb.) to VR.","explanationSource":"source"},{"id":9,"question":"It is ____________ to play computer games with friends.","options":["pleasure","enjoy","funny","fun"],"answer":3,"source":"龍騰自命題","explanation":"It + be + adj. (for sb.) to VR.。funny滑稽的  fun 好玩的，有樂趣的","explanationSource":"source"},{"id":10,"question":"It is necessary ____________ your seat belt while driving.","options":["fastening","for fastening","to fasten","fasten"],"answer":2,"source":"龍騰自命題","explanation":"It + be + adj. (for sb.) to VR.","explanationSource":"source"},{"id":11,"question":"She has moved to the United States since she ____________ married.","options":["had gotten","got","gets","has gotten"],"answer":1,"source":"龍騰自命題","explanation":"S + have/has + p.p. + since + 過去的時間點或事件","explanationSource":"source"},{"id":12,"question":"My big brother has worked in that company ____________ a decade.","options":["during","in","since","for"],"answer":3,"source":"龍騰自命題","explanation":"S + have/has + p.p. + for + 一段時間","explanationSource":"source"},{"id":13,"question":"Although John ____________ four novels, he is still unknown to the public.","options":["wrote","has written","is writing","was writing"],"answer":1,"source":"龍騰自命題","explanation":"S + have/has + p.p... 已經","explanationSource":"source"},{"id":14,"question":"It is unwise ____________ people to spend so much time on online games.","options":["of","for","with","as"],"answer":0,"source":"龍騰自命題","explanation":"It + be + adj. + of sb. + to VR.  本句型的形容詞在形容人的特質，常見形容詞有 kind, foolish, unwise, thoughtful, careless…等。","explanationSource":"source"},{"id":15,"question":"Many areas in the city are flooded because it ____________ for a whole month.","options":["rains","raining","has been raining","was raining"],"answer":2,"source":"龍騰自命題","explanation":"for + 一段時間，用現在完成進行式。","explanationSource":"source"},{"id":16,"question":"Sandy ____________ a lot of time and effort into preparing for the speech contest since last month.","options":["put","putting","puts","has put"],"answer":3,"source":"龍騰自命題","explanation":"S + have/has + p.p. + since +過去的時間點或事件","explanationSource":"source"},{"id":17,"question":"It is impossible ____________ the little boy to lift such a heavy metal box.","options":["in","of","for","with"],"answer":2,"source":"龍騰自命題","explanation":"It + be + adj. (for sb.) to VR.","explanationSource":"source"}]};</script>
