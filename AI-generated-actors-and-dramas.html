<div class="hero"><h1>AI generated actors and dramas</h1><p><b>Academic Sentence Pattern Training</b></p><p>Part A：先修正文法，再聽寫 Academic Rephrase。Part B：先自己 academic paraphrase，再聽寫標準答案。每個單字都會用相同字母數的底線提示。</p></div>

<script>const D={"a":[["If studio use AI actor, they are more easy to save money and make movie fast.","If studios use AI actors, it is easier for them to save money and make movies fast.","Using AI actors makes it easier for studios to save money and produce dramas quickly."],["AI technology let small studio can make drama even they don't have much money.","AI technology lets small studios make dramas even when they don't have much money.","AI technology enables small studios to produce dramas even without a large budget."],["It is very hard for people to know if the actor is AI or real.","It is very hard for people to know if the actor is AI or real.","It is increasingly difficult for audiences to distinguish between an AI-generated actor and a real one."],["A lot of problem happen because of AI actor, like actor lose job.","A lot of problems happen because of AI actors, like actors losing jobs.","Numerous ethical problems arise from the use of AI actors, including the loss of jobs for human performers."],["AI can copy real actor voice, this thing make people worry.","AI can copy a real actor's voice, and this makes people worry.","AI can replicate a real actor's voice without consent, which raises serious ethical concerns."],["By use AI actor, studio can save a lot of money on salary.","By using AI actors, studios can save a lot of money on salaries.","By employing AI actors, studios can significantly reduce salary expenses."],["Rather than hire real actor, some studio now use AI to save cost.","Rather than hiring real actors, some studios now use AI to save costs.","Rather than hiring human actors, some studios now rely on AI to cut production costs."],["AI actor not only save money, it also can work all day no need rest.","AI actors not only save money, but they can also work all day without needing rest.","AI-generated actors not only reduce production costs, but they also work continuously without needing rest."],["Studio use more AI actor now, so a lot of real actor cannot find job.","Studios use more AI actors now, so a lot of real actors cannot find jobs.","Studios are increasingly relying on AI actors; consequently, many human performers are struggling to find work."],["Using AI actor make the cost go down very much.","Using AI actors makes the cost go down very much.","Using AI-generated actors reduces production costs considerably."],["Using AI in drama make the special effect look better.","Using AI in dramas makes the special effects look better.","Incorporating AI technology enhances the visual quality of special effects in dramas."],["AI technology make more people want to try make their own drama.","AI technology makes more people want to try making their own dramas.","The availability of AI technology encourages independent creators to produce their own dramas."],["Using too much AI stop new actor from getting chance to act.","Using too much AI stops new actors from getting chances to act.","The overreliance on AI-generated performers prevents new actors from gaining valuable industry experience."],["AI technology give studio a way to make drama cheaper.","AI technology gives studios a way to make dramas more cheaply.","AI technology provides studios with a cost-effective alternative to traditional casting."],["Watching too much AI drama make audience start to not trust what they see.","Watching too many AI dramas makes audiences start to distrust what they see.","Exposure to convincing AI-generated dramas leads audiences to question the authenticity of what they watch."],["Using AI actor reduce the chance for new actor to get famous.","Using AI actors reduces the chance for new actors to get famous.","The rise of AI-generated performers reduces the chance for emerging actors to gain public recognition."],["The best way to stop this problem is to make law about AI actor.","The best way to stop this problem is to make laws about AI actors.","The best way to address this problem is to establish clear legal regulations governing the use of AI-generated performers."],["Young audience tend to don't care if actor is AI or not.","Young audiences tend not to care if an actor is AI or not.","Younger audiences tend to care less about whether a performer is human or AI-generated."],["Small studio are more likely to use AI because they don't have much money.","Small studios are more likely to use AI because they don't have much money.","Small studios are more likely to adopt AI actors because of their limited budgets."]],"b":[["[Ving] + makes it + adj. + for sb. + to + VR1 and VR2.",[["If director use AI for background actor, it more easy to finish the scene fast.","Using AI for background actors makes it easier to finish the scene quickly."],["When company use AI technology, they more easy to cut down the budget.","Using AI technology makes it easier for companies to cut down the budget."],["If we use AI to make voice, it more easy to translate drama to other language.","Using AI to generate voices makes it easier to translate dramas into other languages."],["Using AI actor, it more easy for small studio to compete with big company.","Using AI actors makes it easier for small studios to compete with major companies."],["If people use AI to act dangerous scene, it more easy to keep actor safe.","Using AI for dangerous scenes makes it easier to keep human actors safe."]]],["[Ving] + enables / allows + sb. + to + V.",[["AI let independent creator can make movie without hire real actor.","AI technology enables independent creators to make films without hiring human actors."],["Using AI, director let they can film dangerous scene safely.","Using AI enables directors to film dangerous scenes safely."],["AI technology let company can finish drama much faster than before.","AI technology enables companies to finish dramas much faster than before."],["AI let actor voice can be use in many different language version.","AI technology enables an actor's voice to be used in many different language versions."],["Using AI actor let studio can save a lot of money on salary.","Using AI actors enables studios to save considerable money on salaries."]]],["It is + adj. + for + sb. + to + V.",[["It is very hard for actor to compete with AI because AI don't need salary.","It is very difficult for human actors to compete with AI, since AI performers do not require a salary."],["It is very easy for studio to make many version of drama use AI.","It is very simple for studios to produce multiple versions of a drama using AI."],["It is not fair for real actor if AI use their voice without permission.","It is unfair to real actors if AI is used to replicate their voice without permission."],["It is very important for government to make law control AI actor.","It is essential for governments to establish laws regulating the use of AI actors."],["It is very difficult for audience to trust drama if they don't know is it AI or not.","It is increasingly difficult for audiences to trust a drama when they are unsure whether the performer is AI or human."]]],["A wide range of / A number of / Numerous + plural noun + V.",[["A lot of studio now start using AI actor to save money.","Numerous studios have begun using AI actors to reduce costs."],["A lot of actor worry they will lose job because of AI.","A wide range of actors worry about losing their jobs because of AI."],["A lot of audience don't like watch drama that use only AI actor.","A number of audiences dislike watching dramas that rely solely on AI actors."],["A lot of question about copyright happen because of AI-generated drama.","Numerous copyright questions have arisen because of AI-generated dramas."],["A lot of country still don't have law about using AI actor.","A number of countries still lack laws regulating the use of AI actors."]]],["[Main clause], which + V.",[["AI can make actor look younger, this thing make some people confuse.","AI can make an actor appear younger, which confuses some viewers."],["Studio use AI to save money, this thing make many actor angry.","Studios use AI to cut costs, which has angered many human actors."],["AI can create whole new actor face, this thing raise a lot of question.","AI can create an entirely new actor's face, which raises numerous ethical questions."],["Company sell AI actor to other studio, this thing cause copyright problem.","Companies sell AI actors to other studios, which causes copyright disputes."],["AI drama become very popular, this thing change how people watch TV.","AI-generated dramas have become extremely popular, which is changing how audiences watch television."]]],["By + [Ving], + S + V.",[["By use AI technology, small studio can make drama look very professional.","By using AI technology, small studios can make their dramas look highly professional."],["By train AI with old movie, company can create brand new actor.","By training AI on old footage, companies can create entirely new digital actors."],["By use AI voice, studio can translate drama to many language fast.","By using AI-generated voices, studios can translate dramas into many languages quickly."],["By replace real actor with AI, company can film dangerous scene safe.","By replacing human actors with AI in hazardous scenes, companies can film safely."],["By use AI to generate script, writer can finish story much faster.","By using AI to generate scripts, writers can finish stories much faster."]]],["Rather than + [Ving], + S + V.",[["Rather than pay expensive actor salary, company choose use AI instead.","Rather than paying expensive actor salaries, companies now choose to rely on AI instead."],["Rather than ban AI completely, government should make clear rule for it.","Rather than banning AI completely, governments should establish clear regulations for its use."],["Rather than replace all actor with AI, studio should use it only for small role.","Rather than replacing all actors with AI, studios should limit its use to minor roles."],["Rather than worry about AI, actor should learn how to work together with it.","Rather than worrying about AI, actors should learn to collaborate with it."],["Rather than copy real actor without permission, company should ask for consent first.","Rather than replicating a real actor's likeness without permission, companies should seek consent first."]]],["Not only does + S + V, but [S/it] also + V.",[["AI drama not only save time, it also can finish very fast.","AI-generated dramas not only save time, but they also finish production very quickly."],["Using AI not only make studio angry actor, it also make audience confuse.","Using AI not only angers human actors, but it also confuses audiences."],["AI technology not only change how movie made, it also change who can be actor.","AI technology not only changes how films are made, but it also changes who can become an actor."],["This new law not only protect actor right, it also control how AI use their face.","This new law not only protects actors' rights, but it also regulates how AI can use their likeness."],["AI actor not only look very real, it also can speak many language.","AI actors not only look highly realistic, but they also can speak multiple languages."]]],["As a result, / Consequently, + S + V.",[["More studio use AI now, so background actor lose many job opportunity.","More studios are now using AI; as a result, background actors are losing many job opportunities."],["AI technology get better very fast, so it hard to tell AI actor from real one.","AI technology has improved rapidly; consequently, it has become difficult to distinguish AI actors from real ones."],["Government still don't have clear law, so many actor worry about their right.","Governments still lack clear regulations; as a result, many actors worry about their rights."],["AI drama cost much less to make, so more small studio start use it.","AI-generated dramas cost far less to produce; consequently, more small studios have begun using them."],["Audience start doubt what they watch, so trust in TV drama go down.","Audiences have started to doubt what they are watching; as a result, trust in television dramas has declined."]]],["[Subject] + V + significantly / considerably.",[["AI technology improve very much in the last few year.","AI technology has improved considerably over the past few years."],["Using AI change the way drama get made very much.","Using AI has significantly changed the way dramas are made."],["This new law reduce the ethical problem very much.","This new law significantly reduces the ethical problems associated with AI actors."],["AI actor increase the speed of production very much.","AI actors considerably increase the speed of production."],["Public trust in media go down very much because of AI drama.","Public trust in media has declined significantly because of AI-generated dramas."]]]]},W=new Map();function n(s){return s.toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' -]/g,' ').replace(/\s+/g,' ').trim()}function e(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function part(x){A.classList.toggle('hidden',x!='A');B.classList.toggle('hidden',x!='B')}function wrong(id,p,g,c){if(!W.has(id))W.set(id,{p,t:[],c});W.get(id).t.push(g);wr.innerHTML=[...W].map(([k,v])=>`<div class=card><b>${k}</b><br>${e(v.p)}<div class=bad>錯誤：${v.t.map(e).join(' / ')}</div><div class=good>正確：${e(v.c)}</div></div>`).join('')}function speak(s){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}function toks(s){return s.match(/[A-Za-z]+(?:[-'][A-Za-z]+)*|[0-9]+|[^\w\s]/g)||[]}function dict(id,s){return `<div class=dict>${toks(s).map(t=>/^[A-Za-z]+(?:[-'][A-Za-z]+)*$/.test(t)?`<span class=w><span class=hint>${'_ '.repeat(t.replace(/[-']/g,'').length)}</span><input data-a="${e(t)}" style="width:${Math.max(38,t.length*11)}px"></span>`:`<span>${e(t)}</span>`).join('')}</div><button class=blue onclick="cd('${id}')">檢查聽寫</button>`}function cd(id){let b=document.getElementById('d'+id),ins=[...b.querySelectorAll('input')],bad=0;ins.forEach(x=>{let ok=n(x.value)==n(x.dataset.a);x.style.background=ok?'#dcfce7':'#fee2e2';bad+=!ok});let f=document.getElementById('df'+id);f.className='fb '+(bad?'bad':'good');f.textContent=bad?`❌ 還有 ${bad} 個字需要修正。`:'✅ 聽寫完成！';if(bad)wrong(id,'Academic dictation',ins.map(x=>x.value).join(' '),b.dataset.s)}function buildA(){D.a.forEach((q,i)=>{let id='A'+(i+1),d=document.createElement('div');d.className='card';d.innerHTML=`<b>Q${i+1}</b><p class=badbox>❌ ${e(q[0])}</p><b>Step 1｜Correct the grammar first.</b><textarea id=g${id}></textarea><button class=blue onclick="cg('${id}',${i})">檢查文法</button><div id=gf${id} class=fb></div><div id=s${id} class=hidden><b>Step 2｜Academic revision dictation</b><br><button class=purple onclick="speak(D.a[${i}][2])">🔊 Listen</button><div id=d${id} data-s="${e(q[2])}">${dict(id,q[2])}</div><div id=df${id} class=fb></div><details><summary>顯示 Academic Rephrase</summary><div class=model>${e(q[2])}</div></details></div>`;alist.appendChild(d)})}function cg(id,i){let q=D.a[i],v=document.getElementById('g'+id).value,f=document.getElementById('gf'+id);if(n(v)==n(q[1])){f.className='fb good';f.textContent='✅ Grammar correct. Now do the academic dictation.';document.getElementById('s'+id).classList.remove('hidden')}else{f.className='fb bad';f.innerHTML='❌ Correct grammar: <b>'+e(q[1])+'</b>';wrong(id,q[0],v,q[1])}}function buildB(){D.b.forEach((p,pi)=>{let h=document.createElement('div');h.className='card';h.innerHTML=`<h3>Pattern ${pi+1}: ${e(p[0])}</h3>`;blist.appendChild(h);p[1].forEach((q,qi)=>{let id='B'+(pi+1)+'-'+(qi+1),d=document.createElement('div');d.className='card';d.innerHTML=`<b>Pattern ${pi+1} — Q${qi+1}</b><p class=badbox>❌ ${e(q[0])}</p><b>Step 1｜Rewrite academically.</b><textarea id=r${id}></textarea><button class=blue onclick="cr('${id}',${pi},${qi})">檢查改寫</button><div id=rf${id} class=fb></div><div id=bs${id} class=hidden><b>Step 2｜Listen and dictate the model sentence.</b><br><button class=purple onclick="speak(D.b[${pi}][1][${qi}][1])">🔊 Listen</button><div id=d${id} data-s="${e(q[1])}">${dict(id,q[1])}</div><div id=df${id} class=fb></div><details><summary>顯示標準答案</summary><div class=model>${e(q[1])}</div></details></div>`;blist.appendChild(d)})})}function cr(id,pi,qi){let q=D.b[pi][1][qi],v=document.getElementById('r'+id).value,f=document.getElementById('rf'+id);if(n(v)==n(q[1])){f.className='fb good';f.textContent='✅ Matches the model academic sentence.'}else{f.className='fb bad';f.textContent='📝 已記錄。接著用聽寫練習標準 academic version。';wrong(id,q[0],v,q[1])}document.getElementById('bs'+id).classList.remove('hidden')}buildA();buildB();</script></body></html>
