 "is going", "will go"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 133 題）", "explanation": "經驗次數 → has been。", "explanationSource": "supplemental"}, {"id": 136, "question": "I ______ this song so many times that I can sing it by heart.", "options": ["hear", "will hear", "have heard", "am hearing"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 133 題）", "explanation": "累積次數 → have heard。", "explanationSource": "supplemental"}, {"id": 137, "question": "(21-24)\nMy mother likes to tell me the story about my name, Stella. She __(21)__ about it many times.\nI was born on a night full of stars. My mom ______(22) a hard time when the doctor said I was too big to be pulled out. At that moment, Mom looked into the sky, making a wish with all her heart, \"Let the baby live, please, even if I may die!\"\nJust then, a very bright star __(23)__ from the sky. All her troubles were soon gone, and my little head came out of her body.\nWith the falling of a star came a new life. That's how I __(24)__ the name \"Stella,\" which means \"star.\"\n\n▶ 請選出第 22 格的答案", "options": ["was having", "has", "has had", "will have"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜克漏字第 22 格｜時態＋整句結構", "explanation": "【句型】過去進行式 was/were + Ving + when + 過去式：某事正在進行時，另一事發生。\n【分析】作者出生是過去的事；醫生說話（said）那時，媽媽「正在經歷」難產的辛苦 → was having a hard time。\n【其他選項】(B) has 現在式、(C) 現在完成式、(D) 未來式都與過去敘事 I was born / said 不合。\n【例句】I was having dinner when the phone rang.", "explanationSource": "source"}, {"id": 138, "question": "We ______ a hard time finding the hotel when a kind man helped us.", "options": ["have", "were having", "have had", "will have"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 137 題）", "explanation": "when 子句過去式，主句正在進行 → were having。", "explanationSource": "supplemental"}, {"id": 139, "question": "Tina ______ a shower when the lights went out.", "options": ["was taking", "takes", "has taken", "will take"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 137 題）", "explanation": "停電時正在洗澡。", "explanationSource": "supplemental"}, {"id": 140, "question": "When the teacher came in, the students ______ loudly.", "options": ["talk", "have talked", "were talking", "will talk"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 137 題）", "explanation": "老師進來時正在講話。", "explanationSource": "supplemental"}, {"id": 141, "question": "(21-24)\nMy mother likes to tell me the story about my name, Stella. She __(21)__ about it many times.\nI was born on a night full of stars. My mom __(22)__ a hard time when the doctor said I was too big to be pulled out. At that moment, Mom looked into the sky, making a wish with all her heart, \"Let the baby live, please, even if I may die!\"\nJust then, a very bright star ______(23) from the sky. All her troubles were soon gone, and my little head came out of her body.\nWith the falling of a star came a new life. That's how I __(24)__ the name \"Stella,\" which means \"star.\"\n\n▶ 請選出第 23 格的答案", "options": ["would fall", "fell", "falls", "is falling"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜克漏字第 23 格｜時態＋整句結構", "explanation": "【句型】Just then（就在那時）+ 過去簡單式，描述過去發生的一個動作。\n【分析】故事以過去式敘述（looked, came out），一顆星「就在那時落下」→ fell（fall 的過去式）。\n【其他選項】(A) would fall 表過去的未來或假設；(C)(D) 現在式／現在進行式與過去敘事不一致。\n【例句】Just then, a cat jumped out of the box.", "explanationSource": "source"}, {"id": 142, "question": "I was about to leave. Just then, my phone ______.", "options": ["rings", "rang", "is ringing", "would ring"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 141 題）", "explanation": "Just then + 過去式。", "explanationSource": "supplemental"}, {"id": 143, "question": "We were walking home. Suddenly, a big dog ______ toward us.", "options": ["runs", "is running", "ran", "will run"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 141 題）", "explanation": "過去敘事中突然發生 → ran。", "explanationSource": "supplemental"}, {"id": 144, "question": "At that moment, the door ______ open and Dad walked in.", "options": ["opened", "opens", "has opened", "will open"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 141 題）", "explanation": "與 walked 一致 → opened。", "explanationSource": "supplemental"}, {"id": 145, "question": "(21-24)\nMy mother likes to tell me the story about my name, Stella. She __(21)__ about it many times.\nI was born on a night full of stars. My mom __(22)__ a hard time when the doctor said I was too big to be pulled out. At that moment, Mom looked into the sky, making a wish with all her heart, \"Let the baby live, please, even if I may die!\"\nJust then, a very bright star __(23)__ from the sky. All her troubles were soon gone, and my little head came out of her body.\nWith the falling of a star came a new life. That's how I ______(24) the name \"Stella,\" which means \"star.\"\n\n▶ 請選出第 24 格的答案", "options": ["got", "get", "am getting", "will get"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜克漏字第 24 格｜時態＋整句結構", "explanation": "【句型】That's how + S + 過去式：說明過去某事「就是這樣」發生的。\n【分析】名字是出生時取得的（過去），That's how I got the name \"Stella\"。\n【其他選項】(B) get 現在式、(C) 現在進行式、(D) 未來式，都不符合「出生時已得到名字」。\n【例句】That's how I met my best friend.", "explanationSource": "source"}, {"id": 146, "question": "I fell off my bike when I was six. That's how I ______ this scar.", "options": ["get", "got", "am getting", "will get"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 145 題）", "explanation": "過去得到 → got。", "explanationSource": "supplemental"}, {"id": 147, "question": "We sat next to each other on the first day of school. That's how we ______ friends.", "options": ["become", "will become", "are becoming", "became"], "answer": 3, "answerLabel": "D", "source": "類似題 2（對應第 145 題）", "explanation": "過去成為朋友 → became。", "explanationSource": "supplemental"}, {"id": 148, "question": "My uncle worked in Japan for ten years. That's how he ______ Japanese.", "options": ["learned", "learns", "is learning", "will learn"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 145 題）", "explanation": "過去學會 → learned。", "explanationSource": "supplemental"}, {"id": 149, "question": "(21-24)\nLong long time ago, a girl named Doris lost her ring. She felt so bad that she could not sleep well. When Doris turned over in her bed, she found the black horse in the picture on the wall ______(21). She was very surprised, so she got out of bed to have a closer look. When Doris touched the head of the horse, she __(22)__ into the picture!\nNow Doris was sitting on the back of the running horse! It was so exciting to be riding a horse in the beautiful sky, but Doris did not know where the horse __(23)__ her. Finally, they stopped in front of an old church. There Doris found a gift bag. She opened the bag and saw her ring inside. Doris was very happy. When she put on the ring, she woke up from her dream. At that moment, Doris could not believe her eyes – the ring __(24)__ there back on her finger!\n\n▶ 請選出第 21 格的答案", "options": ["is moving", "has moved", "was moving", "will move"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜克漏字第 21 格｜時態＋整句結構", "explanation": "【句型】過去敘事中描述「當時正在進行」的動作用過去進行式。\n【分析】她 turned over 時發現（found）畫裡的馬「正在動」，所以她才 very surprised → was moving。\n【其他選項】(A) 現在進行式與過去敘事不一致；(B) 現在完成式不合；(D) will move 表未來，不能解釋她當下的驚訝。\n【例句】When I looked out, I saw that the leaves were moving in the wind.", "explanationSource": "source"}, {"id": 150, "question": "When I opened the door, I found that my cat ______ on my bed.", "options": ["is sleeping", "was sleeping", "has slept", "will sleep"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 149 題）", "explanation": "過去某時正在睡 → was sleeping。", "explanationSource": "supplemental"}, {"id": 151, "question": "Mike looked up and saw that the plane ______ over the mountain.", "options": ["was flying", "flies", "has flown", "will fly"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 149 題）", "explanation": "當時正在飛。", "explanationSource": "supplemental"}, {"id": 152, "question": "When we got home, we heard that the baby ______.", "options": ["cries", "has cried", "was crying", "will cry"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 149 題）", "explanation": "當時正在哭 → was crying。", "explanationSource": "supplemental"}, {"id": 153, "question": "(21-24)\nLong long time ago, a girl named Doris lost her ring. She felt so bad that she could not sleep well. When Doris turned over in her bed, she found the black horse in the picture on the wall __(21)__. She was very surprised, so she got out of bed to have a closer look. When Doris touched the head of the horse, she ______(22) into the picture!\nNow Doris was sitting on the back of the running horse! It was so exciting to be riding a horse in the beautiful sky, but Doris did not know where the horse __(23)__ her. Finally, they stopped in front of an old church. There Doris found a gift bag. She opened the bag and saw her ring inside. Doris was very happy. When she put on the ring, she woke up from her dream. At that moment, Doris could not believe her eyes – the ring __(24)__ there back on her finger!\n\n▶ 請選出第 22 格的答案", "options": ["is pulled", "was pulled", "has been pulled", "would be pulled"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜克漏字第 22 格｜主動與被動語態", "explanation": "【句型】被動語態 be + p.p.；過去式被動 was/were + p.p.。\n【分析】Doris 是「被拉進」畫中（她不是自己拉），且故事為過去 → was pulled into the picture。\n【其他選項】(A) 現在式被動與過去敘事不合；(C) 現在完成式被動不合；(D) would be pulled 表過去的未來或假設，但事情當下就發生了。\n【例句】The boy was pulled out of the water by his father.", "explanationSource": "source"}, {"id": 154, "question": "The little dog fell into the river, but it ______ out by a kind man.", "options": ["pulls", "was pulled", "is pulled", "has pulled"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 153 題）", "explanation": "被拉出來，過去 → was pulled。", "explanationSource": "supplemental"}, {"id": 155, "question": "My bike ______ last night, so I walked to school today.", "options": ["was stolen", "stole", "is stolen", "steals"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 153 題）", "explanation": "腳踏車被偷，過去被動。", "explanationSource": "supplemental"}, {"id": 156, "question": "These photos ______ by my uncle during his trip to Japan last year.", "options": ["take", "took", "were taken", "are taking"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 153 題）", "explanation": "照片被拍，過去被動 → were taken。", "explanationSource": "supplemental"}, {"id": 157, "question": "(21-24)\nLong long time ago, a girl named Doris lost her ring. She felt so bad that she could not sleep well. When Doris turned over in her bed, she found the black horse in the picture on the wall __(21)__. She was very surprised, so she got out of bed to have a closer look. When Doris touched the head of the horse, she __(22)__ into the picture!\nNow Doris was sitting on the back of the running horse! It was so exciting to be riding a horse in the beautiful sky, but Doris did not know where the horse ______(23) her. Finally, they stopped in front of an old church. There Doris found a gift bag. She opened the bag and saw her ring inside. Doris was very happy. When she put on the ring, she woke up from her dream. At that moment, Doris could not believe her eyes – the ring __(24)__ there back on her finger!\n\n▶ 請選出第 23 格的答案", "options": ["took", "is taking", "has taken", "would take"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜克漏字第 23 格｜時態＋整句結構", "explanation": "【句型】過去敘事中提到「接下來會發生」的事，用 would + V（過去的未來）。\n【分析】騎馬當下 Doris 不知道馬「將會」帶她去哪裡（之後才停在教堂前）→ where the horse would take her。\n【其他選項】(A) took 表已帶到某地，但當時還在飛；(B) 現在進行式時態不一致；(C) 現在完成式不合。\n【例句】We didn't know what would happen next.", "explanationSource": "source"}, {"id": 158, "question": "On the first day of school, Ben didn't know who ______ his new teacher.", "options": ["is", "would be", "has been", "will be"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 157 題）", "explanation": "過去不知道未來的事 → would be。", "explanationSource": "supplemental"}, {"id": 159, "question": "When we got on the boat, we had no idea where it ______ us.", "options": ["would take", "takes", "has taken", "took"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 157 題）", "explanation": "過去的未來 → would take。", "explanationSource": "supplemental"}, {"id": 160, "question": "Amy wasn't sure if her mom ______ her go to the party.", "options": ["lets", "has let", "would let", "let"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 157 題）", "explanation": "過去不確定未來 → would let。", "explanationSource": "supplemental"}, {"id": 161, "question": "(21-24)\nLong long time ago, a girl named Doris lost her ring. She felt so bad that she could not sleep well. When Doris turned over in her bed, she found the black horse in the picture on the wall __(21)__. She was very surprised, so she got out of bed to have a closer look. When Doris touched the head of the horse, she __(22)__ into the picture!\nNow Doris was sitting on the back of the running horse! It was so exciting to be riding a horse in the beautiful sky, but Doris did not know where the horse __(23)__ her. Finally, they stopped in front of an old church. There Doris found a gift bag. She opened the bag and saw her ring inside. Doris was very happy. When she put on the ring, she woke up from her dream. At that moment, Doris could not believe her eyes – the ring ______(24) there back on her finger!\n\n▶ 請選出第 24 格的答案", "options": ["is", "was", "has been", "would be"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜克漏字第 24 格｜時態＋整句結構", "explanation": "【句型】過去敘事中描述當時的狀態用過去式。\n【分析】At that moment, Doris could not believe her eyes（過去）——戒指「當時」就在她手指上 → was。\n【其他選項】(A) is 現在式、(C) 現在完成式與過去敘事不合；(D) would be 表過去的未來，但戒指已經在那裡了。\n【例句】When I woke up, my phone was still in my hand.", "explanationSource": "source"}, {"id": 162, "question": "When I got home, my keys ______ on the table.", "options": ["are", "were", "have been", "would be"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 161 題）", "explanation": "過去敘事 → were。", "explanationSource": "supplemental"}, {"id": 163, "question": "Kevin opened the box. A little puppy ______ inside!", "options": ["was", "is", "has been", "will be"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 161 題）", "explanation": "過去敘事 → was。", "explanationSource": "supplemental"}, {"id": 164, "question": "When the sun came up, the snow ______ still on the ground.", "options": ["is", "will be", "was", "has been"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 161 題）", "explanation": "過去敘事 → was。", "explanationSource": "supplemental"}, {"id": 165, "question": "(21-23)\nMonica ______(21) the thin old man who lives next to her must be very poor and lonely. She often saw him wearing old clothes and sitting in the park by himself.\nLast Christmas, when Monica was jogging in the park, the old man came up to her with a large bag on his shoulder. Monica guessed the old man __(22)__ her for some money or help. But she was surprised to find many children following him. The old man took out a box from his bag and said to her with a big smile, \"Merry Christmas! I bought presents for everybody. This one is for you.\" At that moment, Monica understood her mistake and changed her idea about the old man. Since then, she __(23)__ not to judge people by how they look. She now knows how people look is not the same as what they really are.\n(judge 判斷)\n\n▶ 請選出第 21 格的答案", "options": ["used to think", "is thinking", "thinks", "will think"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜克漏字第 21 格｜used to", "explanation": "【句型】used to + 原形V：過去曾經……（現在不再）。\n【分析】下文 Monica understood her mistake and changed her idea about the old man，表示她「以前認為」老人很窮很孤單，現在不這麼想了 → used to think。\n【其他選項】(B)(C) 現在式表現在仍這麼想，與 changed her idea 矛盾；(D) 未來式不合。\n【例句】I used to think math was boring, but now I love it.", "explanationSource": "source"}, {"id": 166, "question": "Kelly ______ that cats were unfriendly. After she got one, she changed her mind.", "options": ["thinks", "used to think", "is thinking", "will think"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 165 題）", "explanation": "後來改變想法 → used to think。", "explanationSource": "supplemental"}, {"id": 167, "question": "People ______ the earth was flat. Now we know it is round.", "options": ["used to believe", "believe", "are believing", "will believe"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 165 題）", "explanation": "過去的想法 → used to believe。", "explanationSource": "supplemental"}, {"id": 168, "question": "Max ______ that English was too hard for him. Now he is the best in his class.", "options": ["thinks", "will think", "used to think", "is thinking"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 165 題）", "explanation": "現在不同 → used to think。", "explanationSource": "supplemental"}, {"id": 169, "question": "(21-23)\nMonica __(21)__ the thin old man who lives next to her must be very poor and lonely. She often saw him wearing old clothes and sitting in the park by himself.\nLast Christmas, when Monica was jogging in the park, the old man came up to her with a large bag on his shoulder. Monica guessed the old man ______(22) her for some money or help. But she was surprised to find many children following him. The old man took out a box from his bag and said to her with a big smile, \"Merry Christmas! I bought presents for everybody. This one is for you.\" At that moment, Monica understood her mistake and changed her idea about the old man. Since then, she __(23)__ not to judge people by how they look. She now knows how people look is not the same as what they really are.\n(judge 判斷)\n\n▶ 請選出第 22 格的答案", "options": ["asked", "would ask", "is asking", "has asked"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜克漏字第 22 格｜時態＋整句結構", "explanation": "【句型】主要動詞為過去式（guessed / thought / said）時，子句中表「將要」用 would + V。\n【分析】Monica guessed（過去）老人「會」向她要錢，但事實上並沒有發生 → would ask。\n【其他選項】(A) asked 表老人真的要了錢，與後文矛盾；(C) 現在進行式時態不一致；(D) 現在完成式不合。\n【例句】I thought it would rain, so I took an umbrella.", "explanationSource": "source"}, {"id": 170, "question": "When Ann saw the dark clouds, she guessed it ______ soon.", "options": ["rains", "would rain", "has rained", "is raining"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 169 題）", "explanation": "guessed 過去 → would rain。", "explanationSource": "supplemental"}, {"id": 171, "question": "Tom thought his parents ______ angry, but they just smiled.", "options": ["would be", "are", "have been", "will be"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 169 題）", "explanation": "過去的猜測 → would be。", "explanationSource": "supplemental"}, {"id": 172, "question": "We believed the bus ______ on time, but it was thirty minutes late.", "options": ["comes", "has come", "would come", "is coming"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 169 題）", "explanation": "believed 過去 → would come。", "explanationSource": "supplemental"}, {"id": 173, "question": "(21-23)\nMonica __(21)__ the thin old man who lives next to her must be very poor and lonely. She often saw him wearing old clothes and sitting in the park by himself.\nLast Christmas, when Monica was jogging in the park, the old man came up to her with a large bag on his shoulder. Monica guessed the old man __(22)__ her for some money or help. But she was surprised to find many children following him. The old man took out a box from his bag and said to her with a big smile, \"Merry Christmas! I bought presents for everybody. This one is for you.\" At that moment, Monica understood her mistake and changed her idea about the old man. Since then, she ______(23) not to judge people by how they look. She now knows how people look is not the same as what they really are.\n(judge 判斷)\n\n▶ 請選出第 23 格的答案", "options": ["tried", "is trying", "has tried", "will try"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜克漏字第 23 格｜時態＋整句結構", "explanation": "【句型】since then（從那時起）+ 現在完成式 have/has + p.p.。\n【分析】Since then 表從去年聖誕節起一直到現在，後句 She now knows… 也是現在 → has tried。\n【其他選項】(A) tried 只表過去，不能和 since then 表延續；(B) 進行式不和 since then 連用；(D) 未來式不合。\n【例句】I broke my leg last year. Since then, I have been careful on the stairs.", "explanationSource": "source"}, {"id": 174, "question": "Peter got a cold last month. Since then, he ______ warm clothes every day.", "options": ["wore", "has worn", "wears", "will wear"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 173 題）", "explanation": "since then → has worn。", "explanationSource": "supplemental"}, {"id": 175, "question": "My aunt moved to Canada in 2018. Since then, I ______ her only twice.", "options": ["have seen", "saw", "see", "will see"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 173 題）", "explanation": "since then → have seen。", "explanationSource": "supplemental"}, {"id": 176, "question": "Joy lost her phone at the MRT station. Since then, she ______ more careful with her things.", "options": ["was", "is being", "has been", "will be"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 173 題）", "explanation": "since then → has been。", "explanationSource": "supplemental"}, {"id": 177, "question": "(17-20)\nPeople in Quiet Town are very sad that their old friend, Time River, is facing the end of its life next October. The river ______(17) a lot to the people in the town. They all grow up and live with it all their lives.\nIn the old times, people in the town __(18)__ their houses on both sides of the river. The houses in each block shared a public washing room. On Mondays, people came and washed their clothes together there. They hung their clothes at the back of each house. Those clothes with different colors __(19)__ a beautiful picture along the river.\nNow Time River is going to be filled in to make more land to build on. People are happy that they __(20)__ more living space. But at the same time, they feel sorry that they must say good-bye to their old friend. So they have decided to give a party one day a year to remember the river.\n(hung（原形為hang） 懸掛)\n\n▶ 請選出第 17 格的答案", "options": ["means", "is meaning", "will mean", "meant"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜克漏字第 17 格｜時態＋整句結構", "explanation": "【句型】現在簡單式表示現在的狀態／事實；mean（對…很重要）是狀態動詞，不用進行式。\n【分析】前後句都是現在式（are very sad, grow up and live），河流「現在」對居民意義重大 → means a lot。\n【其他選項】(B) mean 為狀態動詞，不用進行式；(C) will mean 表未來，但現在就很重要；(D) meant 表過去，不合現在情境。\n【例句】This old watch means a lot to my grandpa.", "explanationSource": "source"}, {"id": 178, "question": "This letter from my best friend ______ a lot to me. I keep it in my desk.", "options": ["is meaning", "means", "meant", "will mean"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 177 題）", "explanation": "現在的狀態 → means。", "explanationSource": "supplemental"}, {"id": 179, "question": "My dog ______ the world to me. I take him everywhere.", "options": ["means", "is meaning", "has meant", "will mean"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 177 題）", "explanation": "現在事實 → means。", "explanationSource": "supplemental"}, {"id": 180, "question": "Lisa ______ the new phone very much. She uses it all the time.", "options": ["is liking", "will like", "likes", "liked"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 177 題）", "explanation": "like 狀態動詞，現在 → likes。", "explanationSource": "supplemental"}, {"id": 181, "question": "(17-20)\nPeople in Quiet Town are very sad that their old friend, Time River, is facing the end of its life next October. The river __(17)__ a lot to the people in the town. They all grow up and live with it all their lives.\nIn the old times, people in the town ______(18) their houses on both sides of the river. The houses in each block shared a public washing room. On Mondays, people came and washed their clothes together there. They hung their clothes at the back of each house. Those clothes with different colors __(19)__ a beautiful picture along the river.\nNow Time River is going to be filled in to make more land to build on. People are happy that they __(20)__ more living space. But at the same time, they feel sorry that they must say good-bye to their old friend. So they have decided to give a party one day a year to remember the river.\n(hung（原形為hang） 懸掛)\n\n▶ 請選出第 18 格的答案", "options": ["build", "are building", "have built", "built"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜克漏字第 18 格｜時態＋整句結構", "explanation": "【句型】過去時間 In the old times / long ago + 過去簡單式。\n【分析】In the old times 表示過去，後文 came, washed, hung 都是過去式 → built。\n【其他選項】(A) 現在式、(B) 現在進行式、(C) 現在完成式都不能和明確的過去時間 In the old times 連用。\n【例句】In the old times, people built their houses with wood.", "explanationSource": "source"}, {"id": 182, "question": "In the old days, people ______ letters to keep in touch.", "options": ["write", "have written", "wrote", "are writing"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 181 題）", "explanation": "In the old days → 過去式。", "explanationSource": "supplemental"}, {"id": 183, "question": "Long ago, my great-grandparents ______ rice on this land.", "options": ["grew", "grow", "have grown", "are growing"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 181 題）", "explanation": "Long ago → grew。", "explanationSource": "supplemental"}, {"id": 184, "question": "Many years ago, there ______ no MRT in Taipei.", "options": ["is", "was", "has been", "will be"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 181 題）", "explanation": "Many years ago → was。", "explanationSource": "supplemental"}, {"id": 185, "question": "(17-20)\nPeople in Quiet Town are very sad that their old friend, Time River, is facing the end of its life next October. The river __(17)__ a lot to the people in the town. They all grow up and live with it all their lives.\nIn the old times, people in the town __(18)__ their houses on both sides of the river. The houses in each block shared a public washing room. On Mondays, people came and washed their clothes together there. They hung their clothes at the back of each house. Those clothes with different colors ______(19) a beautiful picture along the river.\nNow Time River is going to be filled in to make more land to build on. People are happy that they __(20)__ more living space. But at the same time, they feel sorry that they must say good-bye to their old friend. So they have decided to give a party one day a year to remember the river.\n(hung（原形為hang） 懸掛)\n\n▶ 請選出第 19 格的答案", "options": ["make", "are making", "have made", "made"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜克漏字第 19 格｜時態＋整句結構", "explanation": "【句型】描述過去的習慣或情景，前後時態一致用過去式。\n【分析】同段 came, washed, hung 都是過去式，描寫以前的景象：五顏六色的衣服「形成」美麗畫面 → made。\n【其他選項】(A)(B)(C) 現在式、進行式、完成式都與「以前的景象」不一致。\n【例句】On holidays, the lanterns made the old street look beautiful.", "explanationSource": "source"}, {"id": 186, "question": "Back then, the children played in the street, and their laughter ______ the town lively.", "options": ["makes", "made", "has made", "is making"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 185 題）", "explanation": "描述過去景象 → made。", "explanationSource": "supplemental"}, {"id": 187, "question": "When I was young, my grandma ______ dumplings for us every weekend.", "options": ["made", "makes", "has made", "is making"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 185 題）", "explanation": "When I was young → 過去式。", "explanationSource": "supplemental"}, {"id": 188, "question": "Years ago, the old trees along the road ______ shade for people walking by.", "options": ["give", "have given", "gave", "are giving"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 185 題）", "explanation": "Years ago → gave。", "explanationSource": "supplemental"}, {"id": 189, "question": "(17-20)\nPeople in Quiet Town are very sad that their old friend, Time River, is facing the end of its life next October. The river __(17)__ a lot to the people in the town. They all grow up and live with it all their lives.\nIn the old times, people in the town __(18)__ their houses on both sides of the river. The houses in each block shared a public washing room. On Mondays, people came and washed their clothes together there. They hung their clothes at the back of each house. Those clothes with different colors __(19)__ a beautiful picture along the river.\nNow Time River is going to be filled in to make more land to build on. People are happy that they ______(20) more living space. But at the same time, they feel sorry that they must say good-bye to their old friend. So they have decided to give a party one day a year to remember the river.\n(hung（原形為hang） 懸掛)\n\n▶ 請選出第 20 格的答案", "options": ["have", "have had", "will have", "had"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜克漏字第 20 格｜時態＋整句結構", "explanation": "【句型】未來式 will + V：表將來會發生的事。\n【分析】Now Time River is going to be filled in…（尚未填平），居民高興他們「將會有」更多居住空間 → will have。\n【其他選項】(A) have 表現在已有；(B) have had 表已經有了；(D) had 表過去，都與「河還沒填」不合。\n【例句】When the new park opens, we will have more places to play.", "explanationSource": "source"}, {"id": 190, "question": "The new MRT line is going to open next year. People are glad that they ______ an easier way to get to work.", "options": ["have", "will have", "had", "have had"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 189 題）", "explanation": "明年才開 → will have。", "explanationSource": "supplemental"}, {"id": 191, "question": "Our school is going to build a new gym. Students are happy that they ______ more space to play basketball.", "options": ["will have", "had", "have had", "are having"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 189 題）", "explanation": "尚未蓋好 → will have。", "explanationSource": "supplemental"}, {"id": 192, "question": "The bookstore is moving to a bigger place next month. The owner says he ______ more room for books.", "options": ["had", "has had", "will have", "have"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 189 題）", "explanation": "next month → will have。", "explanationSource": "supplemental"}, {"id": 193, "question": "(19-21)\nMr. Hutman owns a restaurant. One day, one of his two cooks ran away with some money. Mr. Hutman was sad and worried because the next day was Saturday, and the restaurant ______(19) very busy then. So that night he called his friends, but could not find anyone to help.\nOn Saturday, many people came to the restaurant for lunch. __(20)__ cook got so busy that he wanted to leave, too. __(21)__, one of the waiters, Henry, told Mr. Hutman that he could help in the kitchen. People who had lunch in the restaurant that day enjoyed the food Henry cooked. Mr. Hutman was very happy and made Henry a new cook of the restaurant.\n\n▶ 請選出第 19 格的答案", "options": ["would be", "is", "has been", "will be"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜克漏字第 19 格｜時態＋整句結構", "explanation": "【句型】過去敘事中提到「之後會發生」的事，用 would + V。\n【分析】故事為過去（was sad and worried），而 the next day（隔天週六）餐廳「將會」很忙 → would be。\n【其他選項】(B) is 現在式、(C) has been 現在完成式與過去敘事不合；(D) will be 是以現在為基準的未來，過去敘事中應改為 would。\n【例句】Amy was nervous because the test would be on the next day.", "explanationSource": "source"}, {"id": 194, "question": "Ben went to bed early because the next day ______ his first day of school.", "options": ["is", "would be", "has been", "will be"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 193 題）", "explanation": "過去敘事中的隔天 → would be。", "explanationSource": "supplemental"}, {"id": 195, "question": "The farmers were worried. The weather report said a typhoon ______ the next morning.", "options": ["would come", "comes", "has come", "will come"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 193 題）", "explanation": "said 過去 → would come。", "explanationSource": "supplemental"}, {"id": 196, "question": "We bought a lot of food, because ten friends ______ to our house that night.", "options": ["come", "have come", "were coming", "will come"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 193 題）", "explanation": "過去預定之事 → were coming（過去的未來）。", "explanationSource": "supplemental"}, {"id": 197, "question": "(19-21)\nMr. Hutman owns a restaurant. One day, one of his two cooks ran away with some money. Mr. Hutman was sad and worried because the next day was Saturday, and the restaurant __(19)__ very busy then. So that night he called his friends, but could not find anyone to help.\nOn Saturday, many people came to the restaurant for lunch. ______(20) cook got so busy that he wanted to leave, too. __(21)__, one of the waiters, Henry, told Mr. Hutman that he could help in the kitchen. People who had lunch in the restaurant that day enjoyed the food Henry cooked. Mr. Hutman was very happy and made Henry a new cook of the restaurant.\n\n▶ 請選出第 20 格的答案", "options": ["One", "Each", "Another", "The only"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜克漏字第 20 格｜名詞、冠詞、代名詞、數量詞", "explanation": "【句型】the only + N：唯一的……。\n【分析】文首說他有兩位廚師，one of his two cooks ran away，所以只剩一位 → The only cook got so busy…, too（too 表示他也想走）。\n【其他選項】(A) One cook 表「某一位」，但只剩一人；(B) Each cook 指每一位，但只剩一位；(C) Another cook 指「另一位（新的）」，不合語意。\n【例句】Tom is the only student who finished the test early.", "explanationSource": "source"}, {"id": 198, "question": "Lily has two cats. One ran away last week, so now Kitty is ______ cat she has.", "options": ["another", "the only", "each", "one"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 197 題）", "explanation": "兩隻跑一隻，只剩一隻 → the only。", "explanationSource": "supplemental"}, {"id": 199, "question": "There were two cookies on the plate. I ate one, and my brother ate ______ one.", "options": ["the other", "another", "each", "one"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 197 題）", "explanation": "兩者中的另一個 → the other。", "explanationSource": "supplemental"}, {"id": 200, "question": "All the other students went home. Jack was ______ person left in the classroom.", "options": ["another", "each", "the only", "one"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 197 題）", "explanation": "只剩他 → the only。", "explanationSource": "supplemental"}, {"id": 201, "question": "(19-21)\nMr. Hutman owns a restaurant. One day, one of his two cooks ran away with some money. Mr. Hutman was sad and worried because the next day was Saturday, and the restaurant __(19)__ very busy then. So that night he called his friends, but could not find anyone to help.\nOn Saturday, many people came to the restaurant for lunch. __(20)__ cook got so busy that he wanted to leave, too. ______(21), one of the waiters, Henry, told Mr. Hutman that he could help in the kitchen. People who had lunch in the restaurant that day enjoyed the food Henry cooked. Mr. Hutman was very happy and made Henry a new cook of the restaurant.\n\n▶ 請選出第 21 格的答案", "options": ["Also", "In fact", "Luckily", "For example"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜克漏字第 21 格｜詞彙題", "explanation": "【句型】轉承副詞 Luckily：幸運地、幸好（困境後出現好結果）。\n【分析】前句廚師忙到也想離開，餐廳陷入困境；接著服務生 Henry 說他能幫忙，是好事 → Luckily。\n【其他選項】(A) Also 表補充，不合；(B) In fact 表「事實上」，用來補充或更正前面說法；(D) For example 表舉例，不合。\n【例句】I missed the bus. Luckily, my dad drove me to school.", "explanationSource": "source"}, {"id": 202, "question": "I forgot my lunch at home. ______, my friend shared her sandwich with me.", "options": ["Also", "Luckily", "For example", "In fact"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 201 題）", "explanation": "困境後的好事 → Luckily。", "explanationSource": "supplemental"}, {"id": 203, "question": "Tom is not lazy. ______, he is the hardest-working student in our class.", "options": ["In fact", "Luckily", "For example", "Also"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 201 題）", "explanation": "更正、強調 → In fact。", "explanationSource": "supplemental"}, {"id": 204, "question": "There are many ways to stay healthy. ______, you can jog or swim every day.", "options": ["Luckily", "In fact", "For example", "Also"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 201 題）", "explanation": "舉例 → For example。", "explanationSource": "supplemental"}, {"id": 205, "question": "(20-22)\nShu-mei is in the third year of senior high school. She is very good at singing and ______(20) many prizes in the past few years with her beautiful voice. Although Shu-mei always gets good grades at school, she does not want to spend too much time studying. She __(21)__ singing more than studying. Her biggest dream is to become a great singer in the future. Shu-mei's parents have sent her to a music teacher to learn singing, and Shu-mei __(22)__ hard every day. She hopes she can get into a music school to study singing after she finishes high school.\n(prize 獎賞)\n\n▶ 請選出第 20 格的答案", "options": ["wins", "was winning", "has won", "is going to win"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜克漏字第 20 格｜時態＋整句結構", "explanation": "【句型】in the past/last + 時間（在過去幾年來）+ 現在完成式。\n【分析】in the past few years 表從幾年前到現在的累積成果 → has won many prizes。\n【其他選項】(A) wins 現在式不和 in the past few years 連用；(B) 過去進行式不合；(D) 未來式不合「過去幾年」。\n【例句】Our team has won three games in the past two weeks.", "explanationSource": "source"}, {"id": 206, "question": "Mr. Chen ______ five books in the past ten years.", "options": ["writes", "has written", "wrote", "is writing"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 205 題）", "explanation": "in the past ten years → has written。", "explanationSource": "supplemental"}, {"id": 207, "question": "In the last few months, Ivy ______ a lot of weight.", "options": ["has lost", "loses", "is losing", "will lose"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 205 題）", "explanation": "in the last few months → has lost。", "explanationSource": "supplemental"}, {"id": 208, "question": "This shop ______ more and more customers in the past year.", "options": ["gets", "will get", "has gotten", "is getting"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 205 題）", "explanation": "in the past year → has gotten。", "explanationSource": "supplemental"}, {"id": 209, "question": "(20-22)\nShu-mei is in the third year of senior high school. She is very good at singing and __(20)__ many prizes in the past few years with her beautiful voice. Although Shu-mei always gets good grades at school, she does not want to spend too much time studying. She ______(21) singing more than studying. Her biggest dream is to become a great singer in the future. Shu-mei's parents have sent her to a music teacher to learn singing, and Shu-mei __(22)__ hard every day. She hopes she can get into a music school to study singing after she finishes high school.\n(prize 獎賞)\n\n▶ 請選出第 21 格的答案", "options": ["loves", "loved", "is loving", "will love"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜克漏字第 21 格｜時態＋整句結構", "explanation": "【句型】現在簡單式表現在的喜好／狀態；love 為狀態動詞，一般不用進行式。\n【分析】前後句皆為現在式（does not want, Her biggest dream is），她「現在」喜愛唱歌勝過讀書 → loves。\n【其他選項】(B) loved 過去式不合；(C) love 為狀態動詞不用進行式；(D) 未來式不合。\n【例句】My sister loves drawing more than playing games.", "explanationSource": "source"}, {"id": 210, "question": "My brother ______ basketball more than baseball.", "options": ["likes", "is liking", "liked", "will like"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 209 題）", "explanation": "現在的喜好 → likes。", "explanationSource": "supplemental"}, {"id": 211, "question": "Jenny ______ cats. She has three of them at home.", "options": ["is loving", "loves", "loved", "will love"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 209 題）", "explanation": "現在事實 → loves。", "explanationSource": "supplemental"}, {"id": 212, "question": "Mark ______ reading comics more than doing homework.", "options": ["is preferring", "preferred", "prefers", "will prefer"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 209 題）", "explanation": "現在偏好 → prefers。", "explanationSource": "supplemental"}, {"id": 213, "question": "(20-22)\nShu-mei is in the third year of senior high school. She is very good at singing and __(20)__ many prizes in the past few years with her beautiful voice. Although Shu-mei always gets good grades at school, she does not want to spend too much time studying. She __(21)__ singing more than studying. Her biggest dream is to become a great singer in the future. Shu-mei's parents have sent her to a music teacher to learn singing, and Shu-mei ______(22) hard every day. She hopes she can get into a music school to study singing after she finishes high school.\n(prize 獎賞)\n\n▶ 請選出第 22 格的答案", "options": ["practices", "practiced", "has practiced", "is going to practice"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜克漏字第 22 格｜時態＋整句結構", "explanation": "【句型】現在簡單式＋every day：表現在的習慣動作。\n【分析】every day 表示現在的習慣，主詞 Shu-mei 第三人稱單數 → practices。\n【其他選項】(B) 過去式不合現在情境；(C) 現在完成式不和 every day 表習慣連用；(D) 未來式不合每天的習慣。\n【例句】Ken jogs in the park every morning.", "explanationSource": "source"}, {"id": 214, "question": "Tim ______ the piano for an hour every day.", "options": ["practiced", "practices", "has practiced", "is going to practice"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 213 題）", "explanation": "every day → 現在簡單式。", "explanationSource": "supplemental"}, {"id": 215, "question": "My mom ______ to work by bus every morning.", "options": ["goes", "went", "has gone", "is going to go"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 213 題）", "explanation": "習慣 → goes。", "explanationSource": "supplemental"}, {"id": 216, "question": "Linda usually ______ her homework before dinner.", "options": ["did", "has done", "does", "will do"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 213 題）", "explanation": "usually → does。", "explanationSource": "supplemental"}, {"id": 217, "question": "(21-23)\nKaren: Good morning, Sheryl. You look different today.\nSheryl: Really? Do I look thinner? I just ______(21) doing some work on my apartment.\nKaren: I see. What did you do?\nSheryl: I __(22)__ the apartment myself and got a new couch and coffee table for the living room.\nKaren: It sounds like a big job. What colors did you paint your apartment?\nSheryl: Several different ones. Let me see . . . white, yellow, green, blue and pink.\nKaren: So that's why you __(23)__ all those colors on your hair?\nSheryl: Oh, no!\n\n▶ 請選出第 21 格的答案", "options": ["finish", "will finish", "finished", "would finish"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜克漏字第 21 格｜時態＋整句結構", "explanation": "【句型】just + 過去式（或 have just p.p.）：剛剛做完某事；finish + Ving。\n【分析】下一句 Karen 問 What did you do?（過去式），可知整理公寓已經「剛做完」→ just finished doing。\n【其他選項】(A) finish 現在式不合；(B) will finish 表還沒做完，與 What did you do? 矛盾；(D) would finish 表假設或過去的未來。\n【例句】I just finished cleaning my room.", "explanationSource": "source"}, {"id": 218, "question": "A: You look tired. B: I just ______ running ten kilometers.", "options": ["finish", "finished", "will finish", "would finish"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 217 題）", "explanation": "剛跑完 → just finished。", "explanationSource": "supplemental"}, {"id": 219, "question": "A: Are you free now? B: Yes, I just ______ my homework.", "options": ["finished", "finish", "will finish", "am finishing"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 217 題）", "explanation": "剛完成 → just finished。", "explanationSource": "supplemental"}, {"id": 220, "question": "A: Why is the floor wet? B: Mom just ______ it.", "options": ["washes", "will wash", "washed", "would wash"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 217 題）", "explanation": "剛洗過 → washed。", "explanationSource": "supplemental"}, {"id": 221, "question": "(21-23)\nKaren: Good morning, Sheryl. You look different today.\nSheryl: Really? Do I look thinner? I just __(21)__ doing some work on my apartment.\nKaren: I see. What did you do?\nSheryl: I ______(22) the apartment myself and got a new couch and coffee table for the living room.\nKaren: It sounds like a big job. What colors did you paint your apartment?\nSheryl: Several different ones. Let me see . . . white, yellow, green, blue and pink.\nKaren: So that's why you __(23)__ all those colors on your hair?\nSheryl: Oh, no!\n\n▶ 請選出第 22 格的答案", "options": ["paint", "painted", "was painting", "would paint"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜克漏字第 22 格｜時態＋整句結構", "explanation": "【句型】對等連接詞 and 連接的動詞時態一致。\n【分析】Karen 問 What did you do?；後半句 and got a new couch 是過去式，前面並列動詞也用過去式 → painted。\n【其他選項】(A) paint 現在式與 got 不一致；(C) 過去進行式表某時正在做，不合「已完成的事」；(D) would paint 表假設。\n【例句】Last weekend I cleaned my room and washed my clothes.", "explanationSource": "source"}, {"id": 222, "question": "A: What did you do last night? B: I ______ a movie and went to bed early.", "options": ["watch", "watched", "was watching", "would watch"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 221 題）", "explanation": "與 went 一致 → watched。", "explanationSource": "supplemental"}, {"id": 223, "question": "Yesterday Dad ______ the car and cooked dinner for us.", "options": ["washed", "washes", "was washing", "would wash"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 221 題）", "explanation": "與 cooked 一致 → washed。", "explanationSource": "supplemental"}, {"id": 224, "question": "A: How was your trip? B: Great! We ______ the night market and ate a lot.", "options": ["visit", "would visit", "visited", "are visiting"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 221 題）", "explanation": "與 ate 一致 → visited。", "explanationSource": "supplemental"}, {"id": 225, "question": "(21-23)\nKaren: Good morning, Sheryl. You look different today.\nSheryl: Really? Do I look thinner? I just __(21)__ doing some work on my apartment.\nKaren: I see. What did you do?\nSheryl: I __(22)__ the apartment myself and got a new couch and coffee table for the living room.\nKaren: It sounds like a big job. What colors did you paint your apartment?\nSheryl: Several different ones. Let me see . . . white, yellow, green, blue and pink.\nKaren: So that's why you ______(23) all those colors on your hair?\nSheryl: Oh, no!\n\n▶ 請選出第 23 格的答案", "options": ["have", "will have", "had", "would have"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜克漏字第 23 格｜時態＋整句結構", "explanation": "【句型】have（擁有）表現在狀態用現在簡單式。\n【分析】對話發生在現在，Karen 看著 Sheryl 說「這就是為什麼你頭髮上（現在）有這些顏色？」→ have。\n【其他選項】(B) will have 表未來；(C) had 表過去，但顏色現在還在頭髮上；(D) would have 表假設。\n【例句】Why do you have paint on your shirt?", "explanationSource": "source"}, {"id": 226, "question": "A: Why ______ mud on your shoes? B: I just played soccer in the rain.", "options": ["do you have", "will you have", "did you have", "would you have"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 225 題）", "explanation": "現在鞋上有泥 → do you have。", "explanationSource": "supplemental"}, {"id": 227, "question": "So that's why Jimmy ______ a smile on his face. He got a new bike!", "options": ["had", "has", "will have", "would have"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 225 題）", "explanation": "現在臉上有笑容 → has。", "explanationSource": "supplemental"}, {"id": 228, "question": "Look! Your dog ______ something in its mouth.", "options": ["had", "would have", "has", "will have"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 225 題）", "explanation": "現在 → has。", "explanationSource": "supplemental"}, {"id": 229, "question": "(18-20)\nOne Thursday morning in Blue Town, I noticed a lot of people going to the church. Later, all the people in the streets stopped and just stood where they were. All of them ______(18) quiet for two minutes. Everyone looked serious.\nI found this strange and asked a woman what was happening. She said that they were commemorating the birthday of St. George, who __(19)__ for helping the farmers of the town to get back their land from the king. Later, I saw some people wearing and selling flowers on the streets. They told me the money would be used to help poor farmers.\nSince that trip, I __(20)__ about Blue Town a lot. I often tell my friends about this experience and show them some pictures I took there.\n(commemorate 紀念)\n\n▶ 請選出第 18 格的答案", "options": ["are", "have been", "were", "would be"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜克漏字第 18 格｜時態＋整句結構", "explanation": "【句型】過去敘事中描述當時狀態用過去式；主詞 All of them 為複數 → were。\n【分析】前後句 stopped, stood, looked 都是過去式，所有人「當時」安靜兩分鐘 → were quiet。\n【其他選項】(A) are 現在式、(B) have been 現在完成式與過去敘事不合；(D) would be 表過去的未來或假設。\n【例句】During the test, all of the students were quiet.", "explanationSource": "source"}, {"id": 230, "question": "When the movie started, everyone in the theater ______ quiet.", "options": ["is", "was", "has been", "would be"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 229 題）", "explanation": "過去敘事 → was。", "explanationSource": "supplemental"}, {"id": 231, "question": "Last night all of us ______ tired after the long hike.", "options": ["were", "are", "have been", "would be"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 229 題）", "explanation": "last night → were。", "explanationSource": "supplemental"}, {"id": 232, "question": "At the meeting yesterday, the students ______ very excited about the trip.", "options": ["are", "have been", "were", "will be"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 229 題）", "explanation": "yesterday → were。", "explanationSource": "supplemental"}, {"id": 233, "question": "(18-20)\nOne Thursday morning in Blue Town, I noticed a lot of people going to the church. Later, all the people in the streets stopped and just stood where they were. All of them __(18)__ quiet for two minutes. Everyone looked serious.\nI found this strange and asked a woman what was happening. She said that they were commemorating the birthday of St. George, who ______(19) for helping the farmers of the town to get back their land from the king. Later, I saw some people wearing and selling flowers on the streets. They told me the money would be used to help poor farmers.\nSince that trip, I __(20)__ about Blue Town a lot. I often tell my friends about this experience and show them some pictures I took there.\n(commemorate 紀念)\n\n▶ 請選出第 19 格的答案", "options": ["has been killed", "was killed", "would be killed", "is going to be killed"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜克漏字第 19 格｜主動與被動語態", "explanation": "【句型】被動語態 be + p.p.；過去發生的事用 was/were + p.p.。\n【分析】St. George 是「被殺」（被動），而且是很久以前的歷史事件（現在在紀念他的生日）→ was killed。\n【其他選項】(A) 現在完成式不用於明確的歷史事件；(C) would be killed 表過去的未來或假設；(D) is going to be 表未來，不合。\n【例句】The old temple was built two hundred years ago.", "explanationSource": "source"}, {"id": 234, "question": "The man ______ by a car while he was crossing the street last night.", "options": ["is hit", "was hit", "has hit", "hits"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 233 題）", "explanation": "過去被動 → was hit。", "explanationSource": "supplemental"}, {"id": 235, "question": "This bridge ______ in 1990.", "options": ["was built", "built", "is built", "has built"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 233 題）", "explanation": "1990 年被建 → was built。", "explanationSource": "supplemental"}, {"id": 236, "question": "Many trees ______ down by the strong wind during the typhoon last week.", "options": ["blew", "are blown", "were blown", "have blown"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 233 題）", "explanation": "過去被動 → were blown。", "explanationSource": "supplemental"}, {"id": 237, "question": "(18-20)\nOne Thursday morning in Blue Town, I noticed a lot of people going to the church. Later, all the people in the streets stopped and just stood where they were. All of them __(18)__ quiet for two minutes. Everyone looked serious.\nI found this strange and asked a woman what was happening. She said that they were commemorating the birthday of St. George, who __(19)__ for helping the farmers of the town to get back their land from the king. Later, I saw some people wearing and selling flowers on the streets. They told me the money would be used to help poor farmers.\nSince that trip, I ______(20) about Blue Town a lot. I often tell my friends about this experience and show them some pictures I took there.\n(commemorate 紀念)\n\n▶ 請選出第 20 格的答案", "options": ["thought", "was thinking", "have thought", "will think"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜克漏字第 20 格｜時態＋整句結構", "explanation": "【句型】since + 過去時間點（since that trip）+ 現在完成式。\n【分析】Since that trip 表從那次旅行到現在，後句 I often tell my friends… 也是現在式 → have thought。\n【其他選項】(A) thought 只表過去；(B) 過去進行式不和 since 連用；(D) 未來式不合。\n【例句】Since the summer camp, I have kept in touch with my new friends.", "explanationSource": "source"}, {"id": 238, "question": "Since that day, Sandy ______ about her dream a lot.", "options": ["talked", "has talked", "was talking", "will talk"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 237 題）", "explanation": "since → has talked。", "explanationSource": "supplemental"}, {"id": 239, "question": "Since the accident, Mr. Wang ______ more carefully.", "options": ["has driven", "drove", "was driving", "will drive"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 237 題）", "explanation": "since → has driven。", "explanationSource": "supplemental"}, {"id": 240, "question": "Since our trip to Japan, my sister ______ Japanese food very much.", "options": ["loved", "was loving", "has loved", "will love"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 237 題）", "explanation": "since → has loved。", "explanationSource": "supplemental"}, {"id": 241, "question": "(19-21)\nDate: Wednesday, Oct. 24　Weather: sunny\nThis evening before dinner, Mom asked Kevin to go to the supermarket to buy some eggs. He ______(19) my jacket without asking me first. When he was putting his keys into the jacket, he found some cigarettes and showed them to Mom and Dad.\nBoth of them were very surprised. They said smoking was bad for my health. I told them that I just tried it once. In fact, I did not like it at all. I promised I __(20)__ again. Right now my mouth __(21)__ quite dry, and the smell of smoke is still in my hair and clothes. I think I need a lot of water and a hot bath.\n(cigarette 香煙　not . . . at all 一點也不　promise 承諾)\n\n▶ 請選出第 19 格的答案", "options": ["put on", "is putting on", "has put on", "would put on"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜克漏字第 19 格｜時態＋整句結構", "explanation": "【句型】過去簡單式描述過去發生的事；put 三態同形 put-put-put。\n【分析】This evening before dinner, Mom asked…（過去式），Kevin 沒問就「穿了」我的外套，後文 he was putting…, found 也是過去 → put on（過去式）。\n【其他選項】(B) 現在進行式、(C) 現在完成式與過去敘事不合；(D) would put on 表過去習慣或假設，不合單次事件。\n【例句】Yesterday my sister put on my shoes without asking me.", "explanationSource": "source"}, {"id": 242, "question": "This morning my brother ______ my hat and went out.", "options": ["puts on", "put on", "is putting on", "has put on"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 241 題）", "explanation": "this morning 已過 → put on。", "explanationSource": "supplemental"}, {"id": 243, "question": "Last night Dad ______ his glasses and read the newspaper.", "options": ["put on", "puts on", "has put on", "would put on"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 241 題）", "explanation": "last night → put on。", "explanationSource": "supplemental"}, {"id": 244, "question": "Before she left, Grandma ______ her coat because it was cold.", "options": ["puts on", "is putting on", "put on", "will put on"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 241 題）", "explanation": "left 過去 → put on。", "explanationSource": "supplemental"}, {"id": 245, "question": "(19-21)\nDate: Wednesday, Oct. 24　Weather: sunny\nThis evening before dinner, Mom asked Kevin to go to the supermarket to buy some eggs. He __(19)__ my jacket without asking me first. When he was putting his keys into the jacket, he found some cigarettes and showed them to Mom and Dad.\nBoth of them were very surprised. They said smoking was bad for my health. I told them that I just tried it once. In fact, I did not like it at all. I promised I ______(20) again. Right now my mouth __(21)__ quite dry, and the smell of smoke is still in my hair and clothes. I think I need a lot of water and a hot bath.\n(cigarette 香煙　not . . . at all 一點也不　promise 承諾)\n\n▶ 請選出第 20 格的答案", "options": ["am never smoking", "never smoked", "have never smoked", "would never smoke"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜克漏字第 20 格｜時態＋整句結構", "explanation": "【句型】過去式的 promise/say/tell 後，子句表未來用 would + V。\n【分析】I promised（過去）「我以後再也不會抽」，是承諾未來的事 → would never smoke again。\n【其他選項】(A) 現在進行式時態不一致；(B) never smoked 表過去從未抽過，與 I just tried it once 矛盾；(C) have never smoked 同樣矛盾。\n【例句】Tom promised he would never lie to me again.", "explanationSource": "source"}, {"id": 246, "question": "After the fight, Ryan promised he ______ his sister again.", "options": ["never hits", "would never hit", "has never hit", "never hit"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 245 題）", "explanation": "promised 過去 → would never hit。", "explanationSource": "supplemental"}, {"id": 247, "question": "I told my teacher that I ______ late again.", "options": ["would never be", "am never", "have never been", "was never"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 245 題）", "explanation": "told 過去 → would never be。", "explanationSource": "supplemental"}, {"id": 248, "question": "Amy promised her mom that she ______ her room every weekend.", "options": ["cleans", "has cleaned", "would clean", "cleaned"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 245 題）", "explanation": "promised → would clean。", "explanationSource": "supplemental"}, {"id": 249, "question": "(19-21)\nDate: Wednesday, Oct. 24　Weather: sunny\nThis evening before dinner, Mom asked Kevin to go to the supermarket to buy some eggs. He __(19)__ my jacket without asking me first. When he was putting his keys into the jacket, he found some cigarettes and showed them to Mom and Dad.\nBoth of them were very surprised. They said smoking was bad for my health. I told them that I just tried it once. In fact, I did not like it at all. I promised I __(20)__ again. Right now my mouth ______(21) quite dry, and the smell of smoke is still in my hair and clothes. I think I need a lot of water and a hot bath.\n(cigarette 香煙　not . . . at all 一點也不　promise 承諾)\n\n▶ 請選出第 21 格的答案", "options": ["feels", "felt", "was feeling", "will feel"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜克漏字第 21 格｜時態＋整句結構", "explanation": "【句型】Right now 表示寫日記的「現在」；feel（感覺起來）為連綴／狀態動詞，用現在簡單式。\n【分析】Right now…, and the smell of smoke is still in my hair（現在式）→ 現在嘴巴「感覺」很乾 → feels。\n【其他選項】(B) felt、(C) was feeling 為過去，與 Right now 不合；(D) will feel 表未來。\n【例句】Right now my legs feel very tired.", "explanationSource": "source"}, {"id": 250, "question": "Right now my head ______ hot. I think I have a fever.", "options": ["feels", "felt", "will feel", "was feeling"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 249 題）", "explanation": "Right now → feels。", "explanationSource": "supplemental"}, {"id": 251, "question": "This soup ______ delicious. Can I have some more?", "options": ["tasted", "tastes", "is tasting", "will taste"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 249 題）", "explanation": "現在嚐起來 → tastes。", "explanationSource": "supplemental"}, {"id": 252, "question": "Your new sweater ______ soft. Where did you buy it?", "options": ["felt", "is feeling", "feels", "will feel"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 249 題）", "explanation": "現在摸起來 → feels。", "explanationSource": "supplemental"}, {"id": 253, "question": "(19-21)\nDad left us several months ago. He ______(19) a man who loved his family and his life a lot. He liked to help others, and everyone around him liked him very much.\nLast year, Dad got very sick and had to stay in the hospital. Mom __(20)__ very busy running between the house and the hospital. Six months later, Dad died. I couldn't believe I __(21)__ him again.\nToday is Dad's 50th birthday. I really want to tell him how much I miss him....\n\n▶ 請選出第 19 格的答案", "options": ["was", "is", "has been", "will be"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜克漏字第 19 格｜時態＋整句結構", "explanation": "【句型】描述已不在世的人，用過去式。\n【分析】Dad left us several months ago（已過世），後句 loved, liked 都是過去式 → He was a man who…。\n【其他選項】(B) is 現在式，但父親已過世；(C) has been 表延續到現在，不合；(D) 未來式不合。\n【例句】My grandfather was a kind man who loved to read.", "explanationSource": "source"}, {"id": 254, "question": "My grandma died last year. She ______ a great cook.", "options": ["is", "was", "has been", "will be"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 253 題）", "explanation": "已過世 → was。", "explanationSource": "supplemental"}, {"id": 255, "question": "Mr. Lin left our school two years ago. He ______ a funny teacher.", "options": ["was", "is", "has been", "will be"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 253 題）", "explanation": "過去 → was。", "explanationSource": "supplemental"}, {"id": 256, "question": "Our old dog died in May. He ______ always happy to see us.", "options": ["is", "has been", "was", "will be"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 253 題）", "explanation": "已過世 → was。", "explanationSource": "supplemental"}, {"id": 257, "question": "(19-21)\nDad left us several months ago. He __(19)__ a man who loved his family and his life a lot. He liked to help others, and everyone around him liked him very much.\nLast year, Dad got very sick and had to stay in the hospital. Mom ______(20) very busy running between the house and the hospital. Six months later, Dad died. I couldn't believe I __(21)__ him again.\nToday is Dad's 50th birthday. I really want to tell him how much I miss him....\n\n▶ 請選出第 20 格的答案", "options": ["became", "becomes", "has become", "is becoming"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜克漏字第 20 格｜時態＋整句結構", "explanation": "【句型】Last year + 過去簡單式；become + adj. 表「變得」。\n【分析】Last year, Dad got very sick（過去），媽媽「變得」很忙 → became。\n【其他選項】(B) 現在式、(C) 現在完成式、(D) 現在進行式都不能和 Last year 連用。\n【例句】After the baby was born, Mom became very busy.", "explanationSource": "source"}, {"id": 258, "question": "Last winter, the weather ______ very cold.", "options": ["becomes", "became", "has become", "is becoming"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 257 題）", "explanation": "last winter → became。", "explanationSource": "supplemental"}, {"id": 259, "question": "When Jim moved to a new school, he ______ shy.", "options": ["became", "becomes", "has become", "is becoming"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 257 題）", "explanation": "過去 → became。", "explanationSource": "supplemental"}, {"id": 260, "question": "After she won the contest last month, Sara ______ famous in our town.", "options": ["becomes", "has become", "became", "is becoming"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 257 題）", "explanation": "last month → became。", "explanationSource": "supplemental"}, {"id": 261, "question": "(19-21)\nDad left us several months ago. He __(19)__ a man who loved his family and his life a lot. He liked to help others, and everyone around him liked him very much.\nLast year, Dad got very sick and had to stay in the hospital. Mom __(20)__ very busy running between the house and the hospital. Six months later, Dad died. I couldn't believe I ______(21) him again.\nToday is Dad's 50th birthday. I really want to tell him how much I miss him....\n\n▶ 請選出第 21 格的答案", "options": ["did not see", "have not seen", "am not seeing", "would not see"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜克漏字第 21 格｜時態＋整句結構", "explanation": "【句型】主要子句為過去式（couldn't believe）時，子句表未來用 would + V。\n【分析】父親過世時，我不敢相信我「以後將再也見不到」他 → would not see him again。\n【其他選項】(A) did not see 表過去沒看到，與 again 表未來不合；(B) 現在完成式、(C) 現在進行式與 couldn't believe 時態不一致。\n【例句】I couldn't believe I would never go back to that school.", "explanationSource": "source"}, {"id": 262, "question": "When my best friend moved away, I couldn't believe I ______ her every day anymore.", "options": ["won't see", "wouldn't see", "didn't see", "haven't seen"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 261 題）", "explanation": "過去的未來 → wouldn't see。", "explanationSource": "supplemental"}, {"id": 263, "question": "Tom didn't know he ______ his wallet on the bus.", "options": ["would leave", "leaves", "has left", "is leaving"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 261 題）", "explanation": "過去的未來 → would leave。", "explanationSource": "supplemental"}, {"id": 264, "question": "We never thought the old store ______ forever.", "options": ["closes", "has closed", "would close", "is closing"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 261 題）", "explanation": "thought 過去 → would close。", "explanationSource": "supplemental"}, {"id": 265, "question": "(19-21)\nOne day after dinner, Lois went to the park for a walk. On her way there, she was stopped by a man who ______(19) his fingernails. \"Somebody took my bag,\" he said, \"and I have no money to get home.\" He asked Lois if she could lend him some money. Lois was afraid and said \"no\" to him in a polite way. The man did not listen and kept asking for money. Lois did not change her mind. The man got angry and cried out, \"You __(20)__ a cold person. I hate you!\" Lois felt so bad that she ran home quickly.\nEven today, Lois is still wondering whether what she __(21)__ to that man was right or wrong.\n(fingernail 指甲　wonder 疑惑)\n\n▶ 請選出第 19 格的答案", "options": ["bites", "has bit", "was biting", "would bite"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜克漏字第 19 格｜時態＋整句結構", "explanation": "【句型】過去進行式 was/were + Ving：過去某時正在進行。\n【分析】故事為過去（went, was stopped），攔住她的那個男人「當時正在」咬指甲 → was biting。\n【其他選項】(A) 現在式、(B) 現在完成式與過去敘事不合；(D) would bite 表過去習慣或假設，不合當下動作。\n【例句】I saw a boy who was crying at the bus stop.", "explanationSource": "source"}, {"id": 266, "question": "Yesterday I met a girl who ______ for her lost cat.", "options": ["looks", "was looking", "has looked", "would look"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 265 題）", "explanation": "過去當時正在找 → was looking。", "explanationSource": "supplemental"}, {"id": 267, "question": "At the park, Ted saw an old man who ______ the birds.", "options": ["was feeding", "feeds", "has fed", "will feed"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 265 題）", "explanation": "當時正在餵 → was feeding。", "explanationSource": "supplemental"}, {"id": 268, "question": "The woman who ______ next to me on the train was reading a book.", "options": ["sits", "has sat", "was sitting", "will sit"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 265 題）", "explanation": "當時正坐著 → was sitting。", "explanationSource": "supplemental"}, {"id": 269, "question": "(19-21)\nOne day after dinner, Lois went to the park for a walk. On her way there, she was stopped by a man who __(19)__ his fingernails. \"Somebody took my bag,\" he said, \"and I have no money to get home.\" He asked Lois if she could lend him some money. Lois was afraid and said \"no\" to him in a polite way. The man did not listen and kept asking for money. Lois did not change her mind. The man got angry and cried out, \"You ______(20) a cold person. I hate you!\" Lois felt so bad that she ran home quickly.\nEven today, Lois is still wondering whether what she __(21)__ to that man was right or wrong.\n(fingernail 指甲　wonder 疑惑)\n\n▶ 請選出第 20 格的答案", "options": ["are", "were", "will be", "would be"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜克漏字第 20 格｜時態＋整句結構", "explanation": "【句型】引號內的直接引述，依說話者當時的「現在」用現在式。\n【分析】男人當面對 Lois 說「你是個冷漠的人。我恨你！」，同句 I hate you 是現在式 → You are…。\n【其他選項】(B) were 表過去，不合直接引述；(C) will be 表未來；(D) would be 表假設。\n【例句】She said, \"You are my best friend.\"", "explanationSource": "source"}, {"id": 270, "question": "The teacher smiled and said, \"You ______ a very good student.\"", "options": ["were", "are", "will be", "would be"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 269 題）", "explanation": "直接引述 → are。", "explanationSource": "supplemental"}, {"id": 271, "question": "My little brother shouted, \"I ______ hungry! When is dinner?\"", "options": ["am", "was", "will be", "would be"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 269 題）", "explanation": "直接引述現在 → am。", "explanationSource": "supplemental"}, {"id": 272, "question": "The old man said to us, \"This park ______ my favorite place.\"", "options": ["was", "will be", "is", "would be"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 269 題）", "explanation": "直接引述 → is。", "explanationSource": "supplemental"}, {"id": 273, "question": "(19-21)\nOne day after dinner, Lois went to the park for a walk. On her way there, she was stopped by a man who __(19)__ his fingernails. \"Somebody took my bag,\" he said, \"and I have no money to get home.\" He asked Lois if she could lend him some money. Lois was afraid and said \"no\" to him in a polite way. The man did not listen and kept asking for money. Lois did not change her mind. The man got angry and cried out, \"You __(20)__ a cold person. I hate you!\" Lois felt so bad that she ran home quickly.\nEven today, Lois is still wondering whether what she ______(21) to that man was right or wrong.\n(fingernail 指甲　wonder 疑惑)\n\n▶ 請選出第 21 格的答案", "options": ["says", "said", "will say", "would say"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜克漏字第 21 格｜時態＋整句結構", "explanation": "【句型】what + S + V 名詞子句；說的話發生在過去，用過去式。\n【分析】她對那男人說話是那天晚上的事（過去），子句後面 was right or wrong 也是過去式 → what she said。\n【其他選項】(A) says 現在式、(C) will say 未來式不合；(D) would say 表假設或過去的未來，但話已經說了。\n【例句】I still remember what my teacher said on the first day.", "explanationSource": "source"}, {"id": 274, "question": "Kevin still thinks about what his coach ______ to him after the game last week.", "options": ["says", "said", "will say", "would say"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 273 題）", "explanation": "last week → said。", "explanationSource": "supplemental"}, {"id": 275, "question": "I don't know if what I ______ yesterday hurt my friend.", "options": ["did", "do", "will do", "would do"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 273 題）", "explanation": "yesterday → did。", "explanationSource": "supplemental"}, {"id": 276, "question": "Mom asked me whether what I ______ at the party was true.", "options": ["say", "will say", "said", "would say"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 273 題）", "explanation": "已說過 → said。", "explanationSource": "supplemental"}, {"id": 277, "question": "(20-22)\nWhen Marcy was a little girl, her parents were always worried about not having enough money. Their sad faces made her decide to help, so she left school and ______(20) to work at the age of fifteen. Since then, she has done many different jobs. Most of the jobs did not pay well, but she tried her best in all of them and learned a lot.\nMarcy is now thirty years old, and her family has a better life. But Marcy's friends keep telling her that she should learn to make more money. They __(21)__ her several ways, but she has not tried any of them. She is not interested in anything risky. What she wants most now is to go back to school. She knows she __(22)__ really happy if she can be a student again.\n(risky 有風險的)\n\n▶ 請選出第 20 格的答案", "options": ["starts", "started", "has started", "will start"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜克漏字第 20 格｜時態＋整句結構", "explanation": "【句型】and 連接的動詞時態一致；at the age of + 數字（過去的年紀）用過去式。\n【分析】她 left school（過去式）and「開始」工作，at the age of fifteen 是過去的時間點 → started。\n【其他選項】(A) 現在式、(C) 現在完成式、(D) 未來式都和 left、at the age of fifteen 不一致。\n【例句】My dad left home and started his own business at the age of twenty.", "explanationSource": "source"}, {"id": 278, "question": "Kelly finished high school and ______ to study in Japan at the age of eighteen.", "options": ["goes", "went", "has gone", "will go"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 277 題）", "explanation": "與 finished 一致、過去年紀 → went。", "explanationSource": "supplemental"}, {"id": 279, "question": "At the age of six, Leo ______ to play the violin.", "options": ["began", "begins", "has begun", "will begin"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 277 題）", "explanation": "at the age of six → began。", "explanationSource": "supplemental"}, {"id": 280, "question": "My grandpa sold his farm and ______ to the city in 1980.", "options": ["moves", "has moved", "moved", "will move"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 277 題）", "explanation": "in 1980 → moved。", "explanationSource": "supplemental"}, {"id": 281, "question": "(20-22)\nWhen Marcy was a little girl, her parents were always worried about not having enough money. Their sad faces made her decide to help, so she left school and __(20)__ to work at the age of fifteen. Since then, she has done many different jobs. Most of the jobs did not pay well, but she tried her best in all of them and learned a lot.\nMarcy is now thirty years old, and her family has a better life. But Marcy's friends keep telling her that she should learn to make more money. They ______(21) her several ways, but she has not tried any of them. She is not interested in anything risky. What she wants most now is to go back to school. She knows she __(22)__ really happy if she can be a student again.\n(risky 有風險的)\n\n▶ 請選出第 21 格的答案", "options": ["are teaching", "were teaching", "have taught", "will teach"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜克漏字第 21 格｜時態＋整句結構", "explanation": "【句型】現在完成式 have/has + p.p.：到目前為止已經做過的事。\n【分析】後半句 but she has not tried any of them（現在完成式），朋友「已經教了」她好幾種方法（到現在為止）→ have taught。\n【其他選項】(A) 現在進行式表正在教，與「已經提過幾種方法、她都沒試」不合；(B) 過去進行式不合；(D) will teach 表還沒教，與 has not tried any of them 矛盾。\n【例句】My teacher has given us many tips, but I haven't used any of them yet.", "explanationSource": "source"}, {"id": 282, "question": "My parents ______ me many times to go to bed early, but I still stay up late.", "options": ["tell", "have told", "will tell", "were telling"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 281 題）", "explanation": "到目前已說很多次 → have told。", "explanationSource": "supplemental"}, {"id": 283, "question": "Our coach ______ us several ways to run faster, but we haven't tried them yet.", "options": ["has shown", "is showing", "was showing", "will show"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 281 題）", "explanation": "與 haven't tried 呼應 → has shown。", "explanationSource": "supplemental"}, {"id": 284, "question": "Doctors ______ Mr. Chen to stop smoking, but he hasn't listened.", "options": ["are asking", "will ask", "have asked", "were asking"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 281 題）", "explanation": "到目前已要求 → have asked。", "explanationSource": "supplemental"}, {"id": 285, "question": "(20-22)\nWhen Marcy was a little girl, her parents were always worried about not having enough money. Their sad faces made her decide to help, so she left school and __(20)__ to work at the age of fifteen. Since then, she has done many different jobs. Most of the jobs did not pay well, but she tried her best in all of them and learned a lot.\nMarcy is now thirty years old, and her family has a better life. But Marcy's friends keep telling her that she should learn to make more money. They __(21)__ her several ways, but she has not tried any of them. She is not interested in anything risky. What she wants most now is to go back to school. She knows she ______(22) really happy if she can be a student again.\n(risky 有風險的)\n\n▶ 請選出第 22 格的答案", "options": ["is", "was", "has been", "will be"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜克漏字第 22 格｜時態＋整句結構", "explanation": "【句型】If + 現在式（條件）, S + will + V；knows (that) 後接主要子句。\n【分析】if she can be a student again 表示還沒發生的條件，她知道「到時會」很快樂 → will be。\n【其他選項】(A) is 表現在已很快樂；(B) was 過去式；(C) has been 現在完成式，都與條件句不合。\n【例句】I know I will feel better if I get more sleep.", "explanationSource": "source"}, {"id": 286, "question": "Jack knows he ______ the game if he practices harder.", "options": ["wins", "will win", "won", "has won"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 285 題）", "explanation": "if 條件 → will win。", "explanationSource": "supplemental"}, {"id": 287, "question": "Mom thinks we ______ late if we don't leave now.", "options": ["will be", "are", "were", "have been"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 285 題）", "explanation": "條件句 → will be。", "explanationSource": "supplemental"}, {"id": 288, "question": "I'm sure Grandma ______ very happy if you visit her this weekend.", "options": ["is", "was", "will be", "has been"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 285 題）", "explanation": "if 條件 → will be。", "explanationSource": "supplemental"}, {"id": 289, "question": "(21-23)\nShu-fen is in her third year of junior high school. She has many tests every day, but she does not even want to look at her books. Shu-fen was not like this before. In fact, she ______(21) studying during her first two years of high school and always got high grades on tests. She was happy then.\nBut these days Shu-fen always feels tired and bored. There __(22)__ so many tests that Shu-fen cannot relax and do the things she likes. But what can she do? She can only tell herself that things __(23)__ better after she starts senior high school.\n(relax 放鬆)\n\n▶ 請選出第 21 格的答案", "options": ["enjoys", "enjoyed", "has enjoyed", "will enjoy"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜克漏字第 21 格｜時態＋整句結構", "explanation": "【句型】過去時間 during her first two years（國一、國二）+ 過去式；enjoy + Ving。\n【分析】前句 Shu-fen was not like this before，後半 always got high grades / She was happy then 都是過去式 → enjoyed。\n【其他選項】(A) 現在式，但她現在不想看書；(C) has enjoyed 表延續到現在，與現況矛盾；(D) 未來式不合。\n【例句】In elementary school, I enjoyed reading comic books.", "explanationSource": "source"}, {"id": 290, "question": "When Jerry was a child, he ______ playing in the rain.", "options": ["enjoys", "enjoyed", "has enjoyed", "will enjoy"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 289 題）", "explanation": "過去 → enjoyed。", "explanationSource": "supplemental"}, {"id": 291, "question": "During her first year in Taipei, Amy ______ alone in a small apartment.", "options": ["lived", "lives", "has lived", "will live"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 289 題）", "explanation": "過去時段 → lived。", "explanationSource": "supplemental"}, {"id": 292, "question": "Last summer, we ______ swimming in the river every day.", "options": ["go", "have gone", "went", "will go"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 289 題）", "explanation": "last summer → went。", "explanationSource": "supplemental"}, {"id": 293, "question": "(21-23)\nShu-fen is in her third year of junior high school. She has many tests every day, but she does not even want to look at her books. Shu-fen was not like this before. In fact, she __(21)__ studying during her first two years of high school and always got high grades on tests. She was happy then.\nBut these days Shu-fen always feels tired and bored. There ______(22) so many tests that Shu-fen cannot relax and do the things she likes. But what can she do? She can only tell herself that things __(23)__ better after she starts senior high school.\n(relax 放鬆)\n\n▶ 請選出第 22 格的答案", "options": ["are", "were", "would be", "are going to be"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜克漏字第 22 格｜There be／代名詞 it, they", "explanation": "【句型】There be + N：be 動詞依時態與後面名詞單複數決定。\n【分析】these days 表現在，後面 so many tests 為複數，且同句 cannot relax 是現在式 → There are。\n【其他選項】(B) were 過去式不合 these days；(C) would be 表假設；(D) are going to be 表未來，但考試現在就很多。\n【例句】There are too many people on the bus today.", "explanationSource": "source"}, {"id": 294, "question": "These days there ______ a lot of homework, so Ted goes to bed late.", "options": ["is", "was", "will be", "would be"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 293 題）", "explanation": "these days + 不可數 homework → is。", "explanationSource": "supplemental"}, {"id": 295, "question": "There ______ two new students in our class this year.", "options": ["is", "are", "was", "has"], "answer": 1, "ans
