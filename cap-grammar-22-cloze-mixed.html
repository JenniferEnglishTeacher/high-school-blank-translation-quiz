<script>window.QUIZ_CONFIG={"title": "國中會考文法歷屆試題｜綜合", "mode": "mcq", "questions": [{"id": 1, "question": "(38–41) [克漏字] Usually I wouldn't cross the park at this time of night. ... Soon after I walked into the park, I saw a man under a tree up ahead. My heart fell. The stories I'd heard about the park __38__ into my head at this moment. ... I did __39__ stupid thing: I decided to hurry past him. ... I had hoped the trees would keep some rain off. And they __40__. But they also made the park look even darker. ... \"What? I __41__ to give back your bag! You dropped it,\" the man gave me my bag.\n\n38. The stories I'd heard about the park ______ into my head at this moment.\n\n▶ 請選出第 38 格的答案", "options": ["are all coming", "have all come", "were all coming", "would all come"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜克漏字第 38 格｜時態＋整句結構", "explanation": "【句型】過去敘事中描述「當時正在發生」的動作 → 過去進行式 was/were + Ving。\n【分析】全文用過去式敘事（saw, fell），at this moment 指故事當下 → 那些故事「當時正湧進腦海」，用 were all coming。\n【其他選項】(A) are coming 現在進行式，與過去敘事不合；(B) have come 現在完成式，不合過去敘事；(D) would come 表過去的未來或習慣，不是當下正在發生。\n【例句】When I opened the door, my brothers were all watching TV.\n備註：克漏字題組（同一張圖含 38–41 四題）", "explanationSource": "source"}, {"id": 2, "question": "When the teacher walked in, the students ______ loudly.", "options": ["are talking", "were talking", "have talked", "will talk"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 1 題）", "explanation": "過去某時正在進行 → were talking。", "explanationSource": "supplemental"}, {"id": 3, "question": "I saw a strange man at the gate. Many scary thoughts ______ through my mind at that moment.", "options": ["were running", "are running", "have run", "run"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 1 題）", "explanation": "過去敘事當下正在發生 → were running。", "explanationSource": "supplemental"}, {"id": 4, "question": "At eight last night, my dad ______ dinner in the kitchen.", "options": ["cooks", "has cooked", "was cooking", "is cooking"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 1 題）", "explanation": "過去特定時間正在做 → was cooking。", "explanationSource": "supplemental"}, {"id": 5, "question": "(38–41) [克漏字] Usually I wouldn't cross the park at this time of night. ... Soon after I walked into the park, I saw a man under a tree up ahead. My heart fell. The stories I'd heard about the park __38__ into my head at this moment. ... I did __39__ stupid thing: I decided to hurry past him. ... I had hoped the trees would keep some rain off. And they __40__. But they also made the park look even darker. ... \"What? I __41__ to give back your bag! You dropped it,\" the man gave me my bag.\n\n39. But me? No. I did ______ stupid thing: I decided to hurry past him.\n\n▶ 請選出第 39 格的答案", "options": ["another", "one", "the last", "the other"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜克漏字第 39 格｜名詞、冠詞、代名詞、數量詞", "explanation": "【句型】another + 單數名詞 = 另一個、又一個（不特定，數量未限定）。\n【分析】第一段已說 And that was the first stupid thing I did tonight，此處是「又做了一件」蠢事 → another。\n【其他選項】(B) one stupid thing 沒有「又」的意思，與前文連結不上；(C) the last 最後一件，但文末還有 the stupidest thing；(D) the other 用於「兩者中的另一個」，此處並非只有兩件。\n【例句】I ate one cookie, and then I ate another.", "explanationSource": "source"}, {"id": 6, "question": "This cup is dirty. Can I have ______ one?", "options": ["other", "another", "the others", "others"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 5 題）", "explanation": "另一個（不特定）單數 → another。", "explanationSource": "supplemental"}, {"id": 7, "question": "I have two pens. One is red, and ______ is blue.", "options": ["another", "other", "the other", "others"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 5 題）", "explanation": "兩者中的另一個 → the other。", "explanationSource": "supplemental"}, {"id": 8, "question": "Joe made a mistake on the test, and then he made ______ one.", "options": ["another", "the other", "other", "the others"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 5 題）", "explanation": "又一個錯誤 → another。", "explanationSource": "supplemental"}, {"id": 9, "question": "(38–41) [克漏字] Usually I wouldn't cross the park at this time of night. ... Soon after I walked into the park, I saw a man under a tree up ahead. My heart fell. The stories I'd heard about the park __38__ into my head at this moment. ... I did __39__ stupid thing: I decided to hurry past him. ... I had hoped the trees would keep some rain off. And they __40__. But they also made the park look even darker. ... \"What? I __41__ to give back your bag! You dropped it,\" the man gave me my bag.\n\n40. I had hoped the trees would keep some rain off. And they ______. But they also made the park look even darker.\n\n▶ 請選出第 40 格的答案", "options": ["have", "did", "had", "would"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜克漏字第 40 格｜省略句（助動詞／be動詞）", "explanation": "【句型】為避免重複，用助動詞代替前面的一般動詞片語：they did = they kept some rain off。\n【分析】And they ___ 表「樹也真的擋了雨」，是過去的事實，用 did 代替 kept some rain off；後句 made 也是過去式。\n【其他選項】(A) have 現在式不合過去敘事；(C) had 會變成 had kept，表更早的過去，不合；(D) would 表推測或過去的未來，不表已發生的事實。\n【例句】I hoped my mom would buy me a cake, and she did.", "explanationSource": "source"}, {"id": 10, "question": "Tim said he would call me last night, and he ______.", "options": ["does", "did", "has", "is"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 9 題）", "explanation": "did = called，表過去確實做了。", "explanationSource": "supplemental"}, {"id": 11, "question": "I don't like spicy food, but my brother ______.", "options": ["does", "is", "did", "doesn't"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 9 題）", "explanation": "現在式肯定 → does。", "explanationSource": "supplemental"}, {"id": 12, "question": "Amy can swim fast, and her sister ______, too.", "options": ["does", "is", "can", "did"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 9 題）", "explanation": "前面助動詞 can → 用 can 代替。", "explanationSource": "supplemental"}, {"id": 13, "question": "(38–41) [克漏字] Usually I wouldn't cross the park at this time of night. ... Soon after I walked into the park, I saw a man under a tree up ahead. My heart fell. The stories I'd heard about the park __38__ into my head at this moment. ... I did __39__ stupid thing: I decided to hurry past him. ... I had hoped the trees would keep some rain off. And they __40__. But they also made the park look even darker. ... \"What? I __41__ to give back your bag! You dropped it,\" the man gave me my bag.\n\n41. \"What? I ______ to give back your bag! You dropped it,\" the man gave me my bag.\n\n▶ 請選出第 41 格的答案", "options": ["was trying", "try", "would try", "will try"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜克漏字第 41 格｜時態＋整句結構", "explanation": "【句型】過去進行式 was/were + Ving 表示過去某段時間正在進行的動作。\n【分析】男子說「我（剛才追你時）一直在試著把包包還給你」，且 You dropped it 用過去式 → was trying。\n【其他選項】(B) try 現在式，表習慣，不合；(C) would try 表假設或過去的未來；(D) will try 表未來，但他已經把包包拿給我了。\n【例句】Sorry, I didn't hear you. I was listening to music.", "explanationSource": "source"}, {"id": 14, "question": "\"Why didn't you answer the phone?\" \"I ______ a shower.\"", "options": ["take", "was taking", "will take", "have taken"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 13 題）", "explanation": "打電話當時正在洗澡 → was taking。", "explanationSource": "supplemental"}, {"id": 15, "question": "Sorry for shouting. I ______ to tell you that your bus was coming.", "options": ["was trying", "try", "will try", "would try"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 13 題）", "explanation": "剛才一直試著告訴你 → was trying。", "explanationSource": "supplemental"}, {"id": 16, "question": "While I ______ my homework, the lights went out.", "options": ["do", "will do", "was doing", "have done"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 13 題）", "explanation": "While + 過去進行式，被過去式動作打斷。", "explanationSource": "supplemental"}, {"id": 17, "question": "(38–41) [克漏字] Elizabeth Alexandra Mary Windsor was born in London on April 21, 1926. No one thought one day she __38__ the queen of the UK. After her grandfather, King George V, died in 1936, Elizabeth's uncle, Prince Edward, became King Edward VIII. Edward __39__ in love with a married American woman long before, and he decided to marry her after he became the king. However, Edward was asked to choose between the throne and his love. Finally, he decided to give up the throne.\n__40__. After Edward VIII gave up the throne, Elizabeth's father became King George VI. As the oldest child without any brothers, Elizabeth became next in line to the throne. She needed to say goodbye to her good old life and prepare to be a queen. After her father died in 1952, she became Queen Elizabeth II.\nEver since she became head of her country, Queen Elizabeth II __41__: She has held meetings with important people in the UK, and has visited many foreign countries. In the few hours she keeps to herself, however, she reads and enjoys horseback riding. (throne 王位)\n\n38. No one thought one day she ______ the queen of the UK.\n\n▶ 請選出第 38 格的答案", "options": ["has become", "became", "had become", "would become"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜克漏字第 38 格｜時態＋整句結構", "explanation": "【句型】過去式主要子句（thought）+ that 子句中表「當時看來的未來」→ would + V（過去未來式）。\n【分析】No one thought（過去）+ one day（將來有一天）→ 當時沒人想到她「將會」成為女王，用 would become。\n【其他選項】(A) has become 現在完成式，不配 thought 的過去敘事；(B) became 表已成為的事實，與 one day（將來）不合；(C) had become 表更早已完成，與 one day 矛盾。\n【例句】I never thought I would win the contest.\n備註：克漏字題組（同一張圖含 38–41 四題）", "explanationSource": "source"}, {"id": 18, "question": "When Tom was little, he never thought he ______ a doctor someday.", "options": ["will be", "would be", "has been", "is"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 17 題）", "explanation": "過去觀點的未來 → would be。", "explanationSource": "supplemental"}, {"id": 19, "question": "My mom said she ______ me a new bike for my birthday.", "options": ["would buy", "buys", "has bought", "will have bought"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 17 題）", "explanation": "said（過去）+ 未來 → would buy。", "explanationSource": "supplemental"}, {"id": 20, "question": "Nobody knew the little shop ______ so famous ten years later.", "options": ["becomes", "has become", "would become", "had become"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 17 題）", "explanation": "過去當時看來的未來 → would become。", "explanationSource": "supplemental"}, {"id": 21, "question": "(38–41) [克漏字] Elizabeth Alexandra Mary Windsor was born in London on April 21, 1926. No one thought one day she __38__ the queen of the UK. After her grandfather, King George V, died in 1936, Elizabeth's uncle, Prince Edward, became King Edward VIII. Edward __39__ in love with a married American woman long before, and he decided to marry her after he became the king. However, Edward was asked to choose between the throne and his love. Finally, he decided to give up the throne.\n__40__. After Edward VIII gave up the throne, Elizabeth's father became King George VI. As the oldest child without any brothers, Elizabeth became next in line to the throne. She needed to say goodbye to her good old life and prepare to be a queen. After her father died in 1952, she became Queen Elizabeth II.\nEver since she became head of her country, Queen Elizabeth II __41__: She has held meetings with important people in the UK, and has visited many foreign countries. In the few hours she keeps to herself, however, she reads and enjoys horseback riding. (throne 王位)\n\n39. Edward ______ in love with a married American woman long before, and he decided to marry her after he became the king.\n\n▶ 請選出第 39 格的答案", "options": ["has fallen", "is falling", "had fallen", "would fall"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜克漏字第 39 格｜時態＋整句結構", "explanation": "【句型】過去完成式 had + p.p. 表示「比過去某時間更早」發生的事。\n【分析】long before（早在之前）指在他成為國王（過去）之前，就已經愛上她 → had fallen。\n【其他選項】(A) has fallen 現在完成式，不用於過去敘事；(B) is falling 現在進行式不合；(D) would fall 表過去的未來，與 long before 矛盾。\n【例句】When I got to the station, the train had left.", "explanationSource": "source"}, {"id": 22, "question": "By the time we arrived, the movie ______.", "options": ["has started", "had started", "starts", "would start"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 21 題）", "explanation": "比 arrived 更早發生 → had started。", "explanationSource": "supplemental"}, {"id": 23, "question": "Lily ______ Japanese for three years before she moved to Tokyo.", "options": ["had studied", "has studied", "studies", "would study"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 21 題）", "explanation": "搬家前已學 → 過去完成式 had studied。", "explanationSource": "supplemental"}, {"id": 24, "question": "I didn't watch the show because I ______ it before.", "options": ["see", "have seen", "would see", "had seen"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 21 題）", "explanation": "比 didn't watch 更早看過 → had seen。", "explanationSource": "supplemental"}, {"id": 25, "question": "(38–41) [克漏字] Elizabeth Alexandra Mary Windsor was born in London on April 21, 1926. No one thought one day she __38__ the queen of the UK. After her grandfather, King George V, died in 1936, Elizabeth's uncle, Prince Edward, became King Edward VIII. Edward __39__ in love with a married American woman long before, and he decided to marry her after he became the king. However, Edward was asked to choose between the throne and his love. Finally, he decided to give up the throne.\n__40__. After Edward VIII gave up the throne, Elizabeth's father became King George VI. As the oldest child without any brothers, Elizabeth became next in line to the throne. She needed to say goodbye to her good old life and prepare to be a queen. After her father died in 1952, she became Queen Elizabeth II.\nEver since she became head of her country, Queen Elizabeth II __41__: She has held meetings with important people in the UK, and has visited many foreign countries. In the few hours she keeps to herself, however, she reads and enjoys horseback riding. (throne 王位)\n\n40. ______. After Edward VIII gave up the throne, Elizabeth's father became King George VI. ...\n\n▶ 請選出第 40 格的答案", "options": ["This changed Elizabeth's life", "It was not easy to give up the throne", "It was good news to Elizabeth and her family", "This part of history made the UK a strong country"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜克漏字第 40 格｜綜合", "explanation": "【句型】段落主題句：空格在段首，需概括本段內容並承接上一段。\n【分析】上段末 Edward 放棄王位；本段說伊莉莎白因此成為王位繼承人、要告別舊生活準備當女王 → 這件事「改變了伊莉莎白的人生」。\n【其他選項】(B) 本段沒有談放棄王位有多難；(C) 文中說她需 say goodbye to her good old life，看不出是好消息；(D) 本段沒有談英國變強大。\n【例句】Moving to Taipei changed my life. I made many new friends there.", "explanationSource": "source"}, {"id": 26, "question": "______. After Ken's family got a dog, he started to walk it every morning and became much healthier.", "options": ["The dog changed Ken's life", "Ken didn't like dogs", "Dogs are expensive", "Ken's family moved away"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 25 題）", "explanation": "後文描述 Ken 生活改變 → 主題句為狗改變了他的生活。", "explanationSource": "supplemental"}, {"id": 27, "question": "______. Mia practiced the piano for three hours every day and finally won first prize.", "options": ["Mia gave up the piano", "Hard work brought Mia success", "Mia didn't like music", "The contest was canceled"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 25 題）", "explanation": "努力練習後得獎 → 努力帶來成功。", "explanationSource": "supplemental"}, {"id": 28, "question": "______. Because of the typhoon, all the schools were closed, and the trains stopped running.", "options": ["The weather was nice", "People went to the beach", "The typhoon changed everyone's plans", "Students had a test"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 25 題）", "explanation": "颱風導致停課停駛 → 颱風改變大家的計畫。", "explanationSource": "supplemental"}, {"id": 29, "question": "(38–41) [克漏字] Elizabeth Alexandra Mary Windsor was born in London on April 21, 1926. No one thought one day she __38__ the queen of the UK. After her grandfather, King George V, died in 1936, Elizabeth's uncle, Prince Edward, became King Edward VIII. Edward __39__ in love with a married American woman long before, and he decided to marry her after he became the king. However, Edward was asked to choose between the throne and his love. Finally, he decided to give up the throne.\n__40__. After Edward VIII gave up the throne, Elizabeth's father became King George VI. As the oldest child without any brothers, Elizabeth became next in line to the throne. She needed to say goodbye to her good old life and prepare to be a queen. After her father died in 1952, she became Queen Elizabeth II.\nEver since she became head of her country, Queen Elizabeth II __41__: She has held meetings with important people in the UK, and has visited many foreign countries. In the few hours she keeps to herself, however, she reads and enjoys horseback riding. (throne 王位)\n\n41. Ever since she became head of her country, Queen Elizabeth II ______: She has held meetings with important people in the UK, and has visited many foreign countries.\n\n▶ 請選出第 41 格的答案", "options": ["has worked hard for the UK", "has been popular with the people of the UK", "has been the queen of the UK for a long time", "has brought the people of the UK much closer"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜克漏字第 41 格｜綜合", "explanation": "【句型】冒號（:）後的內容是對前句的說明或舉例，前句須能概括後面的細節。\n【分析】冒號後說她與重要人士開會、出訪許多國家，都是「為國家努力工作」的例子；下一句 however 提到她少數的私人時間，也呼應她很忙 → has worked hard for the UK。\n【其他選項】(B) 冒號後沒有提到人民喜愛她；(C) 雖為事實，但開會、出訪無法說明「在位很久」；(D) 沒有提到拉近人民的距離。\n【例句】My dad works very hard: he gets up at six and comes home at ten every day.", "explanationSource": "source"}, {"id": 30, "question": "Coach Wang ______: he gets to school at 6 a.m. and practices with the team every day.", "options": ["works very hard", "is very rich", "likes music", "is new at school"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 29 題）", "explanation": "冒號後舉早到和天天練習 → 很努力。", "explanationSource": "supplemental"}, {"id": 31, "question": "Our town ______: there are many parks, and the streets are always clean.", "options": ["is very old", "is a nice place to live", "is very noisy", "has many factories"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 29 題）", "explanation": "公園多、街道乾淨 → 宜居的好地方。", "explanationSource": "supplemental"}, {"id": 32, "question": "Grandma ______: she grows vegetables, cooks for us, and walks the dog every day.", "options": ["is always tired", "doesn't like animals", "keeps herself busy", "lives alone in the city"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 29 題）", "explanation": "種菜、煮飯、遛狗 → 讓自己保持忙碌。", "explanationSource": "supplemental"}, {"id": 33, "question": "(19-21)\nIf you cannot live without your car, Zurich might be the last city you would like to visit. In Zurich, people are welcome, but cars are not! Over the past 20 years, this city has used smart ways ______(19). One is to keep the same total number of parking spaces. For example, if 50 new parking spaces are built in one part of the city, then 50 old spaces in other parts are taken away for other uses. So the total number does not change. Some are unhappy that there are never enough spaces. That is just what the city has in mind: If people find parking more difficult, they will drive less.\n__(20)__, the total number of cars in the city is counted. Over 3,500 little computers are put under Zurich roads to check the number of cars that enter the city. If the number is higher than the city can deal with, the traffic lights on the roads that enter the city will be kept red. So drivers who are traveling into Zurich have to stop and wait until there are fewer cars in the city. Now, you may wonder __(21)__. The answer is simple: The city wants to make more space for its people.\n\n▶ 請選出第 19 格的答案", "options": ["to make traffic lighter", "to invite people to visit", "to make itself a famous city", "to build more parking spaces"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜克漏字第 19 格｜綜合", "explanation": "【句型】smart ways + to V（表目的）；克漏字須依全文主旨判斷。\n【分析】全文說蘇黎世「歡迎人、不歡迎車」，後面舉例「停車位總數不變」「車太多就亮紅燈」，又說 If people find parking more difficult, they will drive less，目的都是減少車流 → to make traffic lighter。\n【其他選項】(B) 邀請人來玩，文中沒提；(C) 讓城市出名，與內容無關；(D) 文中說停車位總數不變，並沒有蓋更多。\n【例句】Our school uses many ways to keep the classrooms clean.", "explanationSource": "source"}, {"id": 34, "question": "The city closed some roads on weekends ______. Now people can walk and ride bikes there safely.", "options": ["to sell more cars", "to make the streets safer for people", "to build more parking lots", "to invite more drivers"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 33 題）", "explanation": "後句說人們可安全步行騎車，目的是讓街道對人更安全。", "explanationSource": "supplemental"}, {"id": 35, "question": "Mr. Lin turns off the lights when he leaves the room ______. He wants to pay less every month.", "options": ["to save money", "to make the room brighter", "to wake up early", "to visit his friends"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 33 題）", "explanation": "後句「每月想付少一點」→ 目的是省錢。", "explanationSource": "supplemental"}, {"id": 36, "question": "Our school started a \"No Plastic Day\" ______. On that day, students bring their own cups and bags.", "options": ["to sell more drinks", "to win a sports game", "to use less plastic", "to buy new bags"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 33 題）", "explanation": "自備杯袋 → 目的是少用塑膠。", "explanationSource": "supplemental"}, {"id": 37, "question": "(19-21)\nIf you cannot live without your car, Zurich might be the last city you would like to visit. In Zurich, people are welcome, but cars are not! Over the past 20 years, this city has used smart ways __(19)__. One is to keep the same total number of parking spaces. For example, if 50 new parking spaces are built in one part of the city, then 50 old spaces in other parts are taken away for other uses. So the total number does not change. Some are unhappy that there are never enough spaces. That is just what the city has in mind: If people find parking more difficult, they will drive less.\n______(20), the total number of cars in the city is counted. Over 3,500 little computers are put under Zurich roads to check the number of cars that enter the city. If the number is higher than the city can deal with, the traffic lights on the roads that enter the city will be kept red. So drivers who are traveling into Zurich have to stop and wait until there are fewer cars in the city. Now, you may wonder __(21)__. The answer is simple: The city wants to make more space for its people.\n\n▶ 請選出第 20 格的答案", "options": ["This way", "However", "For example", "Also"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜克漏字第 20 格｜連接詞", "explanation": "【句型】轉承語：Also（此外）表「再補充一點」；However 表轉折；For example 表舉例；This way 表「這樣一來」(結果)。\n【分析】第一段已說 One is to keep the same total number of parking spaces（第一個方法），第二段開頭介紹「計算車輛總數」是第二個方法 → Also，補充另一種做法。\n【其他選項】(A) This way 表前面做法帶來的結果，但第二段是新做法；(B) However 表相反，前後並不對立；(C) For example 用來舉例，而第二段不是第一個方法的例子。\n【例句】Eat more vegetables. Also, try to go to bed early.", "explanationSource": "source"}, {"id": 38, "question": "There are two ways to get to the zoo. One is to take the MRT. ______, you can take a bus from the train station.", "options": ["However", "Also", "For example", "This way"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 37 題）", "explanation": "第二個方法，用 Also 補充。", "explanationSource": "supplemental"}, {"id": 39, "question": "Kevin studied hard every day. ______, he still failed the math test.", "options": ["Also", "For example", "However", "This way"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 37 題）", "explanation": "努力卻不及格，前後相反 → However。", "explanationSource": "supplemental"}, {"id": 40, "question": "Many animals sleep during the day. ______, owls hunt at night and rest when the sun is up.", "options": ["For example", "However", "Also", "Besides that way"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 37 題）", "explanation": "貓頭鷹是「白天睡覺的動物」的例子 → For example。", "explanationSource": "supplemental"}, {"id": 41, "question": "(19-21)\nIf you cannot live without your car, Zurich might be the last city you would like to visit. In Zurich, people are welcome, but cars are not! Over the past 20 years, this city has used smart ways __(19)__. One is to keep the same total number of parking spaces. For example, if 50 new parking spaces are built in one part of the city, then 50 old spaces in other parts are taken away for other uses. So the total number does not change. Some are unhappy that there are never enough spaces. That is just what the city has in mind: If people find parking more difficult, they will drive less.\n__(20)__, the total number of cars in the city is counted. Over 3,500 little computers are put under Zurich roads to check the number of cars that enter the city. If the number is higher than the city can deal with, the traffic lights on the roads that enter the city will be kept red. So drivers who are traveling into Zurich have to stop and wait until there are fewer cars in the city. Now, you may wonder ______(21). The answer is simple: The city wants to make more space for its people.\n\n▶ 請選出第 21 格的答案", "options": ["why Zurich is doing this", "what all this has cost Zurich", "if Zurich should try other ways", "if Zurich can deal with angry drivers"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜克漏字第 21 格｜綜合", "explanation": "【句型】you may wonder + 疑問詞子句（why + S + V）；由下句 The answer is… 反推問題。\n【分析】下一句 The answer is simple: The city wants to make more space for its people. 回答的是「為什麼」，所以前面問的是 why Zurich is doing this。\n【其他選項】(B) 花了多少錢，答案沒談費用；(C) 是否該試別的方法，答案不是 yes/no；(D) 能否應付生氣的駕駛，答案沒提。\n【例句】You may wonder why the store is closed. The owner is on vacation.", "explanationSource": "source"}, {"id": 42, "question": "You may ask ______. The answer is easy: she wants to be a nurse in the future.", "options": ["where Amy lives", "why Amy studies so hard", "when Amy got up", "how old Amy is"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 41 題）", "explanation": "答案說「她想當護士」是原因 → why。", "explanationSource": "supplemental"}, {"id": 43, "question": "People often wonder ______. Well, the trip takes about three hours by train.", "options": ["how long it takes to get to Hualien", "who Mark is traveling with", "why Mark likes trains", "what Mark bought"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 41 題）", "explanation": "答案講「花三小時」→ how long it takes。", "explanationSource": "supplemental"}, {"id": 44, "question": "Many students want to know ______. The answer: the teacher will tell them next Monday.", "options": ["why the test is hard", "where the test is", "when they will get their test scores", "what the test is about"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 41 題）", "explanation": "答案是「下週一」→ when。", "explanationSource": "supplemental"}, {"id": 45, "question": "(34-37)\nJerry Stevens has been unhappy these months. He ______(34) a proud businessman of a successful shaved ice shop. His highest sales numbers were 1,899 plates a week; people called him \"Ice King.\" But all this changed when the cookie shop across the street started selling ice cream cookies. It took away half of his business.\nAnd __(35)__ when Dan, his dead sister's only son, came to work for him.\nDan was a nice young man with a simple mind, too simple, maybe. He always let people try some shaved ice for free, but he never learned to see when \"some\" became \"too much.\" Many people came, but few bought. When the sales did not grow with the heat, Jerry started to worry. He wanted to send Dan home. But how could he? Dan had no family except him.\nThen, one day, __(36)__. And it was from across the street. The cookie shop __(37)__ a clerk. For Jerry, it was a great chance to get Dan out of his store without sending him home. After taking the shopkeeper to several nice dinners, Jerry got Dan the job.\nNow Jerry could finally try and save his store. And maybe Dan would help by sending him a few people who are thirsty from eating too many cookies.\n(shaved ice 刨冰)\n\n▶ 請選出第 34 格的答案", "options": ["is", "has been", "used to be", "was going to be"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜克漏字第 34 格｜used to", "explanation": "【句型】used to + 原形V：過去曾經……（現在已不是）。\n【分析】首句 has been unhappy these months 表示他現在不開心；後面 But all this changed when the cookie shop… 說明情況已改變 → 他「過去曾是」驕傲的老闆 → used to be。\n【其他選項】(A) is 表現在仍是，與 all this changed 矛盾；(B) has been 表一直到現在都是，也矛盾；(D) was going to be 表「過去本來要成為」，但他確實已經是，且有銷售紀錄。\n【例句】This park used to be a parking lot.", "explanationSource": "source"}, {"id": 46, "question": "My grandpa ______ a bus driver, but now he stays home and grows vegetables.", "options": ["is", "has been", "used to be", "is going to be"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 45 題）", "explanation": "現在在家種菜 → 過去曾是 used to be。", "explanationSource": "supplemental"}, {"id": 47, "question": "Tina ______ afraid of dogs. Now she has two dogs at home.", "options": ["used to be", "is", "has been", "will be"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 45 題）", "explanation": "現在養兩隻狗 → 以前怕狗 used to be。", "explanationSource": "supplemental"}, {"id": 48, "question": "There ______ a big tree in front of our school, but it was cut down last year.", "options": ["is", "has been", "will be", "used to be"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 45 題）", "explanation": "樹去年被砍 → 以前有 used to be。", "explanationSource": "supplemental"}, {"id": 49, "question": "(34-37)\nJerry Stevens has been unhappy these months. He __(34)__ a proud businessman of a successful shaved ice shop. His highest sales numbers were 1,899 plates a week; people called him \"Ice King.\" But all this changed when the cookie shop across the street started selling ice cream cookies. It took away half of his business.\nAnd ______(35) when Dan, his dead sister's only son, came to work for him.\nDan was a nice young man with a simple mind, too simple, maybe. He always let people try some shaved ice for free, but he never learned to see when \"some\" became \"too much.\" Many people came, but few bought. When the sales did not grow with the heat, Jerry started to worry. He wanted to send Dan home. But how could he? Dan had no family except him.\nThen, one day, __(36)__. And it was from across the street. The cookie shop __(37)__ a clerk. For Jerry, it was a great chance to get Dan out of his store without sending him home. After taking the shopkeeper to several nice dinners, Jerry got Dan the job.\nNow Jerry could finally try and save his store. And maybe Dan would help by sending him a few people who are thirsty from eating too many cookies.\n(shaved ice 刨冰)\n\n▶ 請選出第 35 格的答案", "options": ["things didn't get better", "he was ready to give up", "the sales of shaved ice finally started to rise", "the cookie shop was not successful for long"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜克漏字第 35 格｜綜合", "explanation": "【句型】克漏字文意題：選項須與前後文的情節方向一致。\n【分析】前段說生意被搶走一半，後段說 Dan 讓人免費試吃、Many people came, but few bought、Jerry started to worry → 情況「沒有變好」→ things didn't get better。\n【其他選項】(B) 他並沒有放棄，最後還 try and save his store；(C) 業績上升與 few bought 矛盾；(D) 餅乾店沒有失敗，後來還要徵店員。\n【例句】We changed the plan, but things didn't get better.", "explanationSource": "source"}, {"id": 50, "question": "Amy lost her wallet in the morning. And ______ when it started to rain and she had no umbrella.", "options": ["her day got worse", "she found her wallet", "the sun came out", "she felt very happy"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 49 題）", "explanation": "掉錢包又淋雨 → 一天更糟。", "explanationSource": "supplemental"}, {"id": 51, "question": "Leo practiced English every day. And ______ when he got an A on the final exam.", "options": ["he gave up", "his hard work paid off", "he forgot everything", "he felt bored"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 49 題）", "explanation": "拿到 A → 努力有回報。", "explanationSource": "supplemental"}, {"id": 52, "question": "The store had few customers. And ______ when a new supermarket opened next door. Soon the store closed.", "options": ["things got better", "the owner got rich", "business got even worse", "more people came"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 49 題）", "explanation": "後來關店 → 生意更糟。", "explanationSource": "supplemental"}, {"id": 53, "question": "(34-37)\nJerry Stevens has been unhappy these months. He __(34)__ a proud businessman of a successful shaved ice shop. His highest sales numbers were 1,899 plates a week; people called him \"Ice King.\" But all this changed when the cookie shop across the street started selling ice cream cookies. It took away half of his business.\nAnd __(35)__ when Dan, his dead sister's only son, came to work for him.\nDan was a nice young man with a simple mind, too simple, maybe. He always let people try some shaved ice for free, but he never learned to see when \"some\" became \"too much.\" Many people came, but few bought. When the sales did not grow with the heat, Jerry started to worry. He wanted to send Dan home. But how could he? Dan had no family except him.\nThen, one day, ______(36). And it was from across the street. The cookie shop __(37)__ a clerk. For Jerry, it was a great chance to get Dan out of his store without sending him home. After taking the shopkeeper to several nice dinners, Jerry got Dan the job.\nNow Jerry could finally try and save his store. And maybe Dan would help by sending him a few people who are thirsty from eating too many cookies.\n(shaved ice 刨冰)\n\n▶ 請選出第 36 格的答案", "options": ["his only hope died", "good news arrived", "worse trouble came", "the hard time passed"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜克漏字第 36 格｜綜合", "explanation": "【句型】克漏字文意題：從後文推出空格內容。\n【分析】後文 And it was from across the street. The cookie shop was looking for a clerk… it was a great chance → 從對面傳來的是「好消息」→ good news arrived。\n【其他選項】(A) 唯一的希望破滅，與 great chance 相反；(C) 更大的麻煩，同樣相反；(D) 困難時期過去，但下文說的是「一個機會」，且 it was from across the street 指的是一則消息，不是時期。\n【例句】Then, one day, good news arrived: Mom got a new job.", "explanationSource": "source"}, {"id": 54, "question": "Kevin waited for weeks. Then, one day, ______. It was a letter from the school: he got in!", "options": ["bad news came", "good news arrived", "his dog ran away", "the letter got lost"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 53 題）", "explanation": "錄取了 → 好消息來了。", "explanationSource": "supplemental"}, {"id": 55, "question": "Everything was going well. Then, one day, ______. The typhoon broke all the windows of the shop.", "options": ["good luck came", "a gift arrived", "trouble came", "the sun came out"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 53 題）", "explanation": "颱風打破窗戶 → 麻煩來了。", "explanationSource": "supplemental"}, {"id": 56, "question": "Lily felt nervous all week. Then, ______: the doctor said her mother was fine.", "options": ["the hard news came", "the good news came", "her test began", "the rain started"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 53 題）", "explanation": "醫生說媽媽沒事 → 好消息。", "explanationSource": "supplemental"}, {"id": 57, "question": "(34-37)\nJerry Stevens has been unhappy these months. He __(34)__ a proud businessman of a successful shaved ice shop. His highest sales numbers were 1,899 plates a week; people called him \"Ice King.\" But all this changed when the cookie shop across the street started selling ice cream cookies. It took away half of his business.\nAnd __(35)__ when Dan, his dead sister's only son, came to work for him.\nDan was a nice young man with a simple mind, too simple, maybe. He always let people try some shaved ice for free, but he never learned to see when \"some\" became \"too much.\" Many people came, but few bought. When the sales did not grow with the heat, Jerry started to worry. He wanted to send Dan home. But how could he? Dan had no family except him.\nThen, one day, __(36)__. And it was from across the street. The cookie shop ______(37) a clerk. For Jerry, it was a great chance to get Dan out of his store without sending him home. After taking the shopkeeper to several nice dinners, Jerry got Dan the job.\nNow Jerry could finally try and save his store. And maybe Dan would help by sending him a few people who are thirsty from eating too many cookies.\n(shaved ice 刨冰)\n\n▶ 請選出第 37 格的答案", "options": ["used to look for", "has looked for", "was looking for", "had looked for"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜克漏字第 37 格｜時態＋整句結構", "explanation": "【句型】過去進行式 was/were + Ving：表過去某時正在進行的事。\n【分析】故事用過去式敘述（got Dan the job），當時餅乾店「正在找」店員 → was looking for；之後 Jerry 才幫 Dan 得到工作。\n【其他選項】(A) used to 表過去習慣，現已不再，不合情境；(B) 現在完成式不用於過去敘事；(D) had looked for 表更早以前找過（已結束），則不需要 Dan 了。\n【例句】When I called Anna, she was looking for her keys.", "explanationSource": "source"}, {"id": 58, "question": "When I got to the shop, the owner ______ a new cook.", "options": ["looks for", "was looking for", "has looked for", "will look for"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 57 題）", "explanation": "過去某時正在找 → 過去進行式。", "explanationSource": "supplemental"}, {"id": 59, "question": "At eight last night, my brother ______ a movie in his room.", "options": ["watches", "has watched", "was watching", "is watching"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 57 題）", "explanation": "last night 某時正在 → was watching。", "explanationSource": "supplemental"}, {"id": 60, "question": "While Ben ______ for the bus, it started to rain.", "options": ["was waiting", "waits", "has waited", "will wait"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 57 題）", "explanation": "while + 過去進行式，下雨插入。", "explanationSource": "supplemental"}, {"id": 61, "question": "(35-38)\nIt was 11 p.m. and Molly walked out of her bakery. She turned and looked at her store one last time. She wanted to remember what it ______(35) at the moment. A few hours later, people would come and clean out everything in the store. A young man had bought it. He __(36)__ it into a flower shop.\nBefore it was a bakery, this place __(37)__ a small coffee shop. Molly worked in the shop as a waitress. But taking orders was never Molly's dream; baking was. When she knew her boss planned to sell the shop, she borrowed money and bought it.\nHer bakery had been open for thirty years. Thirty very wonderful years. However, it would all come to an end tonight. Molly __(38)__ the bakery to be a family business. But her daughter was never interested in baking. Molly did not want her business in a stranger's hands, so after some serious thinking, she decided to close it.\n\"Goodbye, my dear old friend,\" Molly looked at the store, whispering.\n(whisper 低語)\n\n▶ 請選出第 35 格的答案", "options": ["had looked like", "looked like", "would look like", "has looked like"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜克漏字第 35 格｜時態＋整句結構", "explanation": "【句型】過去式敘事中，描述「當時」的狀態用過去簡單式。\n【分析】全文以過去式敘事（It was 11 p.m.… walked out），she wanted to remember what it looked like at the moment，at the moment 指當時那一刻 → looked like。\n【其他選項】(A) 過去完成式表更早以前的樣子，不是「此刻」；(C) would look like 表未來的樣子（之後會變花店）；(D) 現在完成式不用於過去敘事。\n【例句】I took a photo to remember what the old house looked like.", "explanationSource": "source"}, {"id": 62, "question": "Before we moved, I walked around my room. I wanted to remember what it ______ then.", "options": ["looked like", "has looked like", "will look like", "looks like"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 61 題）", "explanation": "過去敘事中的當時 → looked like。", "explanationSource": "supplemental"}, {"id": 63, "question": "Grandma showed me a photo. It showed what our town ______ fifty years ago.", "options": ["looks like", "was looked like", "looked like", "will look like"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 61 題）", "explanation": "fifty years ago → 過去式。", "explanationSource": "supplemental"}, {"id": 64, "question": "It was dark, and I couldn't see what the man ______.", "options": ["looks like", "looked like", "has looked like", "will look like"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 61 題）", "explanation": "過去敘事 → 子句也用過去式。", "explanationSource": "supplemental"}, {"id": 65, "question": "(35-38)\nIt was 11 p.m. and Molly walked out of her bakery. She turned and looked at her store one last time. She wanted to remember what it __(35)__ at the moment. A few hours later, people would come and clean out everything in the store. A young man had bought it. He ______(36) it into a flower shop.\nBefore it was a bakery, this place __(37)__ a small coffee shop. Molly worked in the shop as a waitress. But taking orders was never Molly's dream; baking was. When she knew her boss planned to sell the shop, she borrowed money and bought it.\nHer bakery had been open for thirty years. Thirty very wonderful years. However, it would all come to an end tonight. Molly __(38)__ the bakery to be a family business. But her daughter was never interested in baking. Molly did not want her business in a stranger's hands, so after some serious thinking, she decided to close it.\n\"Goodbye, my dear old friend,\" Molly looked at the store, whispering.\n(whisper 低語)\n\n▶ 請選出第 36 格的答案", "options": ["had changed", "changed", "was going to change", "has changed"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜克漏字第 36 格｜時態＋整句結構", "explanation": "【句型】was/were going to + V：站在過去時間點說「打算／將要」做的事。\n【分析】店才剛被買下，A few hours later, people would come and clean out everything，表示改成花店是「之後才要做」的事 → was going to change。\n【其他選項】(A)(B) 表已經改了，但當時店還是麵包店；(D) 現在完成式不用於過去敘事。\n【例句】Dad bought some wood. He was going to build a doghouse.", "explanationSource": "source"}, {"id": 66, "question": "Mr. Wu bought the old house last week. He ______ it into a small café, but he hasn't started yet.", "options": ["turned", "has turned", "was going to turn", "had turned"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 65 題）", "explanation": "尚未開始，是過去打算的事 → was going to。", "explanationSource": "supplemental"}, {"id": 67, "question": "Jenny bought some flour and eggs yesterday. She ______ a cake for her mom's birthday.", "options": ["was going to make", "made", "has made", "had made"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 65 題）", "explanation": "買材料是為了之後要做 → was going to make。", "explanationSource": "supplemental"}, {"id": 68, "question": "I packed my bag last night because I ______ to Tainan this morning.", "options": ["went", "have gone", "was going", "had gone"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 65 題）", "explanation": "昨晚打包，為了今早要出發 → was going。", "explanationSource": "supplemental"}, {"id": 69, "question": "(35-38)\nIt was 11 p.m. and Molly walked out of her bakery. She turned and looked at her store one last time. She wanted to remember what it __(35)__ at the moment. A few hours later, people would come and clean out everything in the store. A young man had bought it. He __(36)__ it into a flower shop.\nBefore it was a bakery, this place ______(37) a small coffee shop. Molly worked in the shop as a waitress. But taking orders was never Molly's dream; baking was. When she knew her boss planned to sell the shop, she borrowed money and bought it.\nHer bakery had been open for thirty years. Thirty very wonderful years. However, it would all come to an end tonight. Molly __(38)__ the bakery to be a family business. But her daughter was never interested in baking. Molly did not want her business in a stranger's hands, so after some serious thinking, she decided to close it.\n\"Goodbye, my dear old friend,\" Molly looked at the store, whispering.\n(whisper 低語)\n\n▶ 請選出第 37 格的答案", "options": ["used to be", "would be", "has been", "is"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜克漏字第 37 格｜used to", "explanation": "【句型】used to + V：過去曾經是（現在不是）。\n【分析】Before it was a bakery 指出在當麵包店之前，這地方「曾經是」咖啡店，現在已不是 → used to be。\n【其他選項】(B) would be 表過去的未來，時間反了；(C) has been 表到現在仍是；(D) is 表現在，與 Before it was a bakery 矛盾。\n【例句】This bookstore used to be a movie theater.", "explanationSource": "source"}, {"id": 70, "question": "Before it became a museum, this building ______ a train station.", "options": ["is", "used to be", "has been", "will be"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 69 題）", "explanation": "以前是車站，現在是博物館 → used to be。", "explanationSource": "supplemental"}, {"id": 71, "question": "My little brother ______ shy, but now he talks to everyone.", "options": ["used to be", "is", "has been", "would be"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 69 題）", "explanation": "現在不害羞 → 以前是 used to be。", "explanationSource": "supplemental"}, {"id": 72, "question": "There ______ many fish in this river. Now it is too dirty.", "options": ["are", "have been", "used to be", "will be"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 69 題）", "explanation": "現在很髒沒魚 → 以前有 used to be。", "explanationSource": "supplemental"}, {"id": 73, "question": "(35-38)\nIt was 11 p.m. and Molly walked out of her bakery. She turned and looked at her store one last time. She wanted to remember what it __(35)__ at the moment. A few hours later, people would come and clean out everything in the store. A young man had bought it. He __(36)__ it into a flower shop.\nBefore it was a bakery, this place __(37)__ a small coffee shop. Molly worked in the shop as a waitress. But taking orders was never Molly's dream; baking was. When she knew her boss planned to sell the shop, she borrowed money and bought it.\nHer bakery had been open for thirty years. Thirty very wonderful years. However, it would all come to an end tonight. Molly ______(38) the bakery to be a family business. But her daughter was never interested in baking. Molly did not want her business in a stranger's hands, so after some serious thinking, she decided to close it.\n\"Goodbye, my dear old friend,\" Molly looked at the store, whispering.\n(whisper 低語)\n\n▶ 請選出第 38 格的答案", "options": ["had wanted", "has wanted", "would want", "will want"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜克漏字第 38 格｜時態＋整句結構", "explanation": "【句型】過去完成式 had + p.p.：表比過去某時間更早就存在的狀態。\n【分析】故事在「關店的今晚」（過去），Molly 早就一直希望麵包店成為家族事業（比決定關店更早）→ had wanted；後句 But her daughter was never interested 說明願望沒實現。\n【其他選項】(B) 現在完成式不用於過去敘事；(C) would want 表過去的未來，不合；(D) will want 是未來式。\n【例句】Ken had wanted a dog for years before he finally got one.", "explanationSource": "source"}, {"id": 74, "question": "Before she moved to Japan, Amy ______ to learn Japanese for a long time.", "options": ["has wanted", "had wanted", "wants", "will want"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 73 題）", "explanation": "移居前早就想 → had wanted。", "explanationSource": "supplemental"}, {"id": 75, "question": "When the store closed, Mr. Lee was sad. He ______ it for twenty years.", "options": ["has run", "runs", "had run", "will run"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 73 題）", "explanation": "關店之前已經營二十年 → had run。", "explanationSource": "supplemental"}, {"id": 76, "question": "By the time we got to the station, the train ______.", "options": ["had left", "has left", "leaves", "will leave"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 73 題）", "explanation": "到站前車已開走 → had left。", "explanationSource": "supplemental"}, {"id": 77, "question": "(19-21)\nDear Sir,\nI'm sorry that I have to write this letter, but if I ______(19), you'll never see what your problem is.\nOn Saturday evening, my family and I went to your restaurant for my birthday. Many people __(20)__ in the restaurant. We were very hungry and didn't want to wait, but your waiter said we __(21)__ served in twenty minutes. We believed him, but we ended up waiting for ONE HOUR!\nI have to say the steak was delicious, but it was still wrong to keep people waiting for so long.\nJulia Wu\n(serve 服務)\n\n▶ 請選出第 19 格的答案", "options": ["didn't", "don't", "hadn't", "haven't"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜克漏字第 19 格｜省略句（助動詞／be動詞）", "explanation": "【句型】If + 現在式, S + will + V（條件句）；助動詞後可省略重複的動詞：if I don't (write this letter)。\n【分析】主要子句 you'll never see 是未來式，if 子句用現在式代替未來 → if I don't（= don't write this letter），省略前面出現過的 write this letter。\n【其他選項】(A) didn't 過去式，與 you'll 不搭（若是假設語氣應為 would）；(C) hadn't 是過去完成式；(D) haven't 須接 p.p.（written），且不合條件句。\n【例句】Take an umbrella. If you don't, you'll get wet.", "explanationSource": "source"}, {"id": 78, "question": "Finish your homework now. If you ______, you won't be able to watch TV tonight.", "options": ["didn't", "don't", "haven't", "won't"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 77 題）", "explanation": "if 子句現在式代替未來，省略 finish your homework。", "explanationSource": "supplemental"}, {"id": 79, "question": "I'll call Grandma tonight. If I ______, she will worry about me.", "options": ["don't", "didn't", "won't", "haven't"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 77 題）", "explanation": "條件句 if 子句用現在式 don't。", "explanationSource": "supplemental"}, {"id": 80, "question": "You should ask the teacher. If you ______, you will never know the answer.", "options": ["didn't", "haven't", "don't", "won't"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 77 題）", "explanation": "if + 現在式 + 省略原動詞 ask。", "explanationSource": "supplemental"}, {"id": 81, "question": "(19-21)\nDear Sir,\nI'm sorry that I have to write this letter, but if I __(19)__, you'll never see what your problem is.\nOn Saturday evening, my family and I went to your restaurant for my birthday. Many people ______(20) in the restaurant. We were very hungry and didn't want to wait, but your waiter said we __(21)__ served in twenty minutes. We believed him, but we ended up waiting for ONE HOUR!\nI have to say the steak was delicious, but it was still wrong to keep people waiting for so long.\nJulia Wu\n(serve 服務)\n\n▶ 請選出第 20 格的答案", "options": ["were already", "are already", "have already been", "will already be"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜克漏字第 20 格｜時態＋整句結構", "explanation": "【句型】描述過去某時的狀態用過去式；already 放 be 動詞後。\n【分析】On Saturday evening… went（過去），當時餐廳裡已經有很多人 → were already。\n【其他選項】(B) are 是現在式；(C) 現在完成式不和過去時間 On Saturday evening 連用；(D) 未來式不合。\n【例句】When we got to the beach, many people were already there.", "explanationSource": "source"}, {"id": 82, "question": "When I got to the classroom, most of my classmates ______ there.", "options": ["are already", "were already", "have already been", "will already be"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 81 題）", "explanation": "過去某時已在 → were already。", "explanationSource": "supplemental"}, {"id": 83, "question": "Last night when Dad came home, we ______ asleep.", "options": ["were already", "are already", "have already been", "will be"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 81 題）", "explanation": "last night → 過去式。", "explanationSource": "supplemental"}, {"id": 84, "question": "At the concert yesterday, the seats ______ full when we arrived.", "options": ["are", "will be", "were already", "have been"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 81 題）", "explanation": "yesterday → were already。", "explanationSource": "supplemental"}, {"id": 85, "question": "(19-21)\nDear Sir,\nI'm sorry that I have to write this letter, but if I __(19)__, you'll never see what your problem is.\nOn Saturday evening, my family and I went to your restaurant for my birthday. Many people __(20)__ in the restaurant. We were very hungry and didn't want to wait, but your waiter said we ______(21) served in twenty minutes. We believed him, but we ended up waiting for ONE HOUR!\nI have to say the steak was delicious, but it was still wrong to keep people waiting for so long.\nJulia Wu\n(serve 服務)\n\n▶ 請選出第 21 格的答案", "options": ["were", "would be", "have been", "are going to be"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜克漏字第 21 格｜主動與被動語態", "explanation": "【句型】過去時間的間接引述：said (that) S + would + V（過去的未來）；被動：would be + p.p.。\n【分析】服務生當時說「我們二十分鐘內會被服務」，是過去說的「未來」→ would be served（被動，因為我們是被服務的人）。\n【其他選項】(A) were served 表已經被服務了，與後面等了一小時矛盾；(C) have been 現在完成式不合過去敘事；(D) are going to be 是現在角度的未來，主要動詞 said 是過去式，應改為 would。\n【例句】The teacher said the tests would be returned on Friday.", "explanationSource": "source"}, {"id": 86, "question": "The man at the counter said our pizza ______ ready in ten minutes.", "options": ["is", "has been", "would be", "was being"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 85 題）", "explanation": "said 之後表過去的未來 → would be。", "explanationSource": "supplemental"}, {"id": 87, "question": "Mom told me the package ______ sent the next day.", "options": ["would be", "is", "has been", "was"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 85 題）", "explanation": "過去的未來＋被動 → would be sent。", "explanationSource": "supplemental"}, {"id": 88, "question": "The news said the road ______ closed until Sunday.", "options": ["will be", "would be", "has been", "is"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 85 題）", "explanation": "主句 said 過去式 → would be closed。", "explanationSource": "supplemental"}, {"id": 89, "question": "(57-60) Reader's Story\nIt's never comfortable to take a bus during rush hour on a hot summer day. All my friends hate it. And I..., well, I ______(57) it too.\nThe story happened two months ago. I was on a bus that was packed with almost everyone in the city. I __(58)__ my friend Neal to see a show. And then he called and said he couldn't come. \"This is not what I planned for Friday!\" I thought. The air on the bus was terrible; the man in front of me smelled like dead fish. While I was feeling sorry for myself, a girl called my name. I didn't recognize her at first. Then I was surprised to find that she was Hui-ting, my old neighbor. I __(59)__ Hui-ting in years. We used to play together every day when we were kids. We were happy to see each other, so we decided to have dinner together. And that was the start of many dinners after.\nWith Hui-ting, the bus ride __(60)__ something I love. The bus is still packed with people, but I enjoy the ride every day.\n(Xiang Chang, Taipei)\n(rush hour 尖峰時間　recognize 認出)\n\n▶ 請選出第 57 格的答案", "options": ["hate", "have hated", "used to hate", "would hate"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜克漏字第 57 格｜used to", "explanation": "【句型】used to + 原形V：過去曾經……，現在已不是。\n【分析】「And I…, well, I」的猶豫語氣，加上文末 the bus ride has become something I love，表示作者「以前」也討厭，現在不了 → used to hate。\n【其他選項】(A) hate 表現在仍討厭，與結尾矛盾；(B) have hated 表一直討厭到現在，也矛盾；(D) would hate 表假設或過去的未來，不合。\n【例句】I used to hate vegetables, but now I eat them every day.", "explanationSource": "source"}, {"id": 90, "question": "Jack ______ swimming, but after his summer class he loves it.", "options": ["used to hate", "hates", "has hated", "will hate"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 89 題）", "explanation": "現在喜歡 → 以前討厭 used to hate。", "explanationSource": "supplemental"}, {"id": 91, "question": "Mia ______ late for school, but now she always arrives early.", "options": ["is", "has been", "used to be", "will be"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 89 題）", "explanation": "現在準時 → 以前常遲到 used to be。", "explanationSource": "supplemental"}, {"id": 92, "question": "My dad ______ coffee every morning. Now he only drinks tea.", "options": ["drinks", "used to drink", "has drunk", "is drinking"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 89 題）", "explanation": "現在只喝茶 → 以前喝咖啡。", "explanationSource": "supplemental"}, {"id": 93, "question": "(57-60) Reader's Story\nIt's never comfortable to take a bus during rush hour on a hot summer day. All my friends hate it. And I..., well, I __(57)__ it too.\nThe story happened two months ago. I was on a bus that was packed with almost everyone in the city. I ______(58) my friend Neal to see a show. And then he called and said he couldn't come. \"This is not what I planned for Friday!\" I thought. The air on the bus was terrible; the man in front of me smelled like dead fish. While I was feeling sorry for myself, a girl called my name. I didn't recognize her at first. Then I was surprised to find that she was Hui-ting, my old neighbor. I __(59)__ Hui-ting in years. We used to play together every day when we were kids. We were happy to see each other, so we decided to have dinner together. And that was the start of many dinners after.\nWith Hui-ting, the bus ride __(60)__ something I love. The bus is still packed with people, but I enjoy the ride every day.\n(Xiang Chang, Taipei)\n(rush hour 尖峰時間　recognize 認出)\n\n▶ 請選出第 58 格的答案", "options": ["used to meet", "was going to meet", "have met", "had met"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜克漏字第 58 格｜時態＋整句結構", "explanation": "【句型】was/were going to + V：過去原本打算……（常暗示沒有實現）。\n【分析】作者在公車上，「本來要」去見 Neal 看表演，And then he called and said he couldn't come，計畫沒實現 → was going to meet。\n【其他選項】(A) used to meet 表過去習慣，不合單次計畫；(C) 現在完成式不用於過去敘事；(D) had met 表已經見過了，但後來對方說不能來，並沒見到。\n【例句】I was going to call you, but my phone died.", "explanationSource": "source"}, {"id": 94, "question": "We ______ a picnic last Sunday, but it rained all day.", "options": ["had", "were going to have", "have had", "used to have"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 93 題）", "explanation": "原本計畫但下雨沒辦 → were going to have。", "explanationSource": "supplemental"}, {"id": 95, "question": "Sam ______ his grandparents yesterday, but his car broke down.", "options": ["was going to visit", "visited", "has visited", "visits"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 93 題）", "explanation": "本來要拜訪但車壞了。", "explanationSource": "supplemental"}, {"id": 96, "question": "I ______ you a birthday card, but I forgot.", "options": ["sent", "have sent", "was going to send", "send"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 93 題）", "explanation": "本來要寄但忘了 → was going to send。", "explanationSource": "supplemental"}, {"id": 97, "question": "(57-60) Reader's Story\nIt's never comfortable to take a bus during rush hour on a hot summer day. All my friends hate it. And I..., well, I __(57)__ it too.\nThe story happened two months ago. I was on a bus that was packed with almost everyone in the city. I __(58)__ my friend Neal to see a show. And then he called and said he couldn't come. \"This is not what I planned for Friday!\" I thought. The air on the bus was terrible; the man in front of me smelled like dead fish. While I was feeling sorry for myself, a girl called my name. I didn't recognize her at first. Then I was surprised to find that she was Hui-ting, my old neighbor. I ______(59) Hui-ting in years. We used to play together every day when we were kids. We were happy to see each other, so we decided to have dinner together. And that was the start of many dinners after.\nWith Hui-ting, the bus ride __(60)__ something I love. The bus is still packed with people, but I enjoy the ride every day.\n(Xiang Chang, Taipei)\n(rush hour 尖峰時間　recognize 認出)\n\n▶ 請選出第 59 格的答案", "options": ["won't see", "wouldn't see", "haven't seen", "hadn't seen"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜克漏字第 59 格｜時態＋整句結構", "explanation": "【句型】過去完成式 had (not) + p.p.：到過去某時為止已經（沒有）……；常和 in years / for + 時間 連用。\n【分析】重逢發生在兩個月前（過去），到那時為止「已經好幾年沒見到」Hui-ting → hadn't seen … in years。\n【其他選項】(A)(B) 表未來，不合；(C) haven't seen 以「現在」為基準，但重逢是過去的事，且他們現在每天見面。\n【例句】When I met Tom at the station, I hadn't seen him in five years.", "explanationSource": "source"}, {"id": 98, "question": "Grace was so happy at the party. She ______ her cousins in three years.", "options": ["hasn't seen", "hadn't seen", "won't see", "doesn't see"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 97 題）", "explanation": "過去的派對之前多年未見 → hadn't seen。", "explanationSource": "supplemental"}, {"id": 99, "question": "When I opened the box last week, I found a toy I ______ for a long time.", "options": ["hadn't played with", "haven't played with", "won't play with", "don't play with"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 97 題）", "explanation": "過去某時之前一直沒玩 → 過去完成式。", "explanationSource": "supplemental"}, {"id": 100, "question": "Ray ______ his old teacher for ten years, so he didn't recognize her yesterday.", "options": ["hasn't seen", "won't see", "hadn't seen", "didn't see"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 97 題）", "explanation": "昨天之前十年沒見 → hadn't seen。", "explanationSource": "supplemental"}, {"id": 101, "question": "(57-60) Reader's Story\nIt's never comfortable to take a bus during rush hour on a hot summer day. All my friends hate it. And I..., well, I __(57)__ it too.\nThe story happened two months ago. I was on a bus that was packed with almost everyone in the city. I __(58)__ my friend Neal to see a show. And then he called and said he couldn't come. \"This is not what I planned for Friday!\" I thought. The air on the bus was terrible; the man in front of me smelled like dead fish. While I was feeling sorry for myself, a girl called my name. I didn't recognize her at first. Then I was surprised to find that she was Hui-ting, my old neighbor. I __(59)__ Hui-ting in years. We used to play together every day when we were kids. We were happy to see each other, so we decided to have dinner together. And that was the start of many dinners after.\nWith Hui-ting, the bus ride ______(60) something I love. The bus is still packed with people, but I enjoy the ride every day.\n(Xiang Chang, Taipei)\n(rush hour 尖峰時間　recognize 認出)\n\n▶ 請選出第 60 格的答案", "options": ["has become", "had become", "will become", "would become"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜克漏字第 60 格｜時態＋整句結構", "explanation": "【句型】現在完成式 have/has + p.p.：過去開始的變化，結果延續到現在。\n【分析】後句 The bus is still packed… but I enjoy the ride every day（現在式），表示公車之旅「已經變成」作者現在所愛 → has become。\n【其他選項】(B) had become 以過去為基準，不合「現在」；(C) will become 表還沒發生，但他現在已每天享受；(D) would become 表假設或過去的未來。\n【例句】Since I joined the team, basketball has become my favorite sport.", "explanationSource": "source"}, {"id": 102, "question": "Since Lisa moved to Tainan, the city ______ her second home.", "options": ["became", "has become", "will become", "had become"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 101 題）", "explanation": "到現在已成為 → 現在完成式。", "explanationSource": "supplemental"}, {"id": 103, "question": "Thanks to his new friends, school ______ much more fun for Eric. He loves going there now.", "options": ["has become", "had become", "will become", "would become"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 101 題）", "explanation": "now → 結果延續到現在。", "explanationSource": "supplemental"}, {"id": 104, "question": "Over the years, this small shop ______ very famous. Now people wait in line every day.", "options": ["becomes", "will become", "has become", "would become"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 101 題）", "explanation": "over the years 到現在 → has become。", "explanationSource": "supplemental"}, {"id": 105, "question": "(57-60) Sports News\nMaria Sharapova is a world-famous tennis player. She was born in Russia in 1987. At the age of four, she started her first tennis lesson. From then on, she ______(57) that she's one of the best tennis players ever. Tennis fans all over the world enjoy watching her play.\nAlthough her family had little money, Sharapova moved to America with her father in 1994. Soon after they arrived, Sharapova's father brought her to a famous tennis school in Florida. Back in Russia, her father __(58)__ a great future ahead of little Sharapova. He wanted to do his best to help her, and an American tennis school would be a good start. Now the seven-year-old girl __(59)__ at the school and would start to make her dream come true.\nThe little girl surprised the teachers when she knocked off the hat of one teacher with a strong serve. They told her father that she __(60)__ a scholarship when she was old enough to enter the school in 1995.\nThat is where it all began. Sharapova has since caught the eye of the world with her excellent tennis skills.\n(serve 發球　scholarship 獎學金　skill 技巧)\n\n▶ 請選出第 57 格的答案", "options": ["has shown", "had shown", "showed", "will show"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜克漏字第 57 格｜時態＋整句結構", "explanation": "【句型】from then on / since then + 現在完成式：從過去某時起一直到現在。\n【分析】From then on（從四歲起）一直到現在，她「已經展現出」自己是最好的選手之一，後句 Tennis fans… enjoy（現在式）也顯示延續至今 → has shown。\n【其他選項】(B) had shown 以過去為基準，不合；(C) showed 只講過去，無法表示延續到現在；(D) will show 表未來，但她已是世界知名選手。\n【例句】Tim joined the club in 2020. From then on, he has made many friends.", "explanationSource": "source"}, {"id": 106, "question": "Amy started playing piano at five. Since then, she ______ in many concerts.", "options": ["played", "has played", "had played", "will play"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 105 題）", "explanation": "since then → 現在完成式。", "explanationSource": "supplemental"}, {"id": 107, "question": "Our school built a new library last year. From then on, more students ______ books there.", "options": ["have read", "had read", "read", "will read"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 105 題）", "explanation": "from then on 到現在 → 現在完成式。", "explanationSource": "supplemental"}, {"id": 108, "question": "Ken moved to Taichung in 2019. He ______ there since then.", "options": ["lived", "lives", "has lived", "will live"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 105 題）", "explanation": "since then → has lived。", "explanationSource": "supplemental"}, {"id": 109, "question": "(57-60) Sports News\nMaria Sharapova is a world-famous tennis player. She was born in Russia in 1987. At the age of four, she started her first tennis lesson. From then on, she __(57)__ that she's one of the best tennis players ever. Tennis fans all over the world enjoy watching her play.\nAlthough her family had little money, Sharapova moved to America with her father in 1994. Soon after they arrived, Sharapova's father brought her to a famous tennis school in Florida. Back in Russia, her father ______(58) a great future ahead of little Sharapova. He wanted to do his best to help her, and an American tennis school would be a good start. Now the seven-year-old girl __(59)__ at the school and would start to make her dream come true.\nThe little girl surprised the teachers when she knocked off the hat of one teacher with a strong serve. They told her father that she __(60)__ a scholarship when she was old enough to enter the school in 1995.\nThat is where it all began. Sharapova has since caught the eye of the world with her excellent tennis skills.\n(serve 發球　scholarship 獎學金　skill 技巧)\n\n▶ 請選出第 58 格的答案", "options": ["has seen", "had seen", "sees", "would see"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜克漏字第 58 格｜時態＋整句結構", "explanation": "【句型】過去完成式 had + p.p.：比另一個過去動作更早發生。\n【分析】Back in Russia（還在俄國時），比 1994 年搬到美國更早，父親「早已看到」女兒的大好前途 → had seen。\n【其他選項】(A) 現在完成式不用於過去敘事；(C) sees 現在式不合；(D) would see 表過去的未來，但「看出潛力」發生在搬家前。\n【例句】Before they moved to Taipei, the Chens had lived in Kaohsiung for ten years.", "explanationSource": "source"}, {"id": 110, "question": "Back in elementary school, Jay ______ that he wanted to be a chef.", "options": ["has decided", "decides", "had decided", "will decide"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 109 題）", "explanation": "比後來的過去事件更早 → had decided。", "explanationSource": "supplemental"}, {"id": 111, "question": "When I got to the theater, the movie ______.", "options": ["had started", "has started", "starts", "will start"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 109 題）", "explanation": "我到之前電影已開始 → had started。", "explanationSource": "supplemental"}, {"id": 112, "question": "Linda wasn't hungry at the party because she ______ dinner at home.", "options": ["has eaten", "had eaten", "eats", "would eat"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 109 題）", "explanation": "派對前已吃過 → had eaten。", "explanationSource": "supplemental"}, {"id": 113, "question": "(57-60) Sports News\nMaria Sharapova is a world-famous tennis player. She was born in Russia in 1987. At the age of four, she started her first tennis lesson. From then on, she __(57)__ that she's one of the best tennis players ever. Tennis fans all over the world enjoy watching her play.\nAlthough her family had little money, Sharapova moved to America with her father in 1994. Soon after they arrived, Sharapova's father brought her to a famous tennis school in Florida. Back in Russia, her father __(58)__ a great future ahead of little Sharapova. He wanted to do his best to help her, and an American tennis school would be a good start. Now the seven-year-old girl ______(59) at the school and would start to make her dream come true.\nThe little girl surprised the teachers when she knocked off the hat of one teacher with a strong serve. They told her father that she __(60)__ a scholarship when she was old enough to enter the school in 1995.\nThat is where it all began. Sharapova has since caught the eye of the world with her excellent tennis skills.\n(serve 發球　scholarship 獎學金　skill 技巧)\n\n▶ 請選出第 59 格的答案", "options": ["has been", "had been", "was", "will be"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜克漏字第 59 格｜時態＋整句結構", "explanation": "【句型】過去敘事裡的 Now 指「故事當時」，仍用過去式。\n【分析】後半句 and would start to make her dream come true 用 would（過去的未來），可知敘事時間在過去；Now 指當時（1994 年）她「在」那所學校 → was。\n【其他選項】(A) has been 以現在為基準；(B) had been 表更早以前已在那裡，不合剛到學校的時間點；(D) will be 是現在角度的未來，與 would 不一致。\n【例句】It was 1990. Now my mother was in high school and would soon meet my father.", "explanationSource": "source"}, {"id": 114, "question": "In 2010, Mr. Lin moved to Tainan. Now he ______ a teacher there and would work there for ten years.", "options": ["is", "was", "has been", "will be"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 113 題）", "explanation": "過去敘事中的 Now → was。", "explanationSource": "supplemental"}, {"id": 115, "question": "After a long trip, the family finally arrived in the new town. Now they ______ ready to start a new life.", "options": ["are", "have been", "were", "will be"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 113 題）", "explanation": "故事為過去 → were。", "explanationSource": "supplemental"}, {"id": 116, "question": "The tired boy got home at last. Now he ______ safe and could finally rest.", "options": ["was", "is", "has been", "had been"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 113 題）", "explanation": "與 could 一致 → was。", "explanationSource": "supplemental"}, {"id": 117, "question": "(57-60) Sports News\nMaria Sharapova is a world-famous tennis player. She was born in Russia in 1987. At the age of four, she started her first tennis lesson. From then on, she __(57)__ that she's one of the best tennis players ever. Tennis fans all over the world enjoy watching her play.\nAlthough her family had little money, Sharapova moved to America with her father in 1994. Soon after they arrived, Sharapova's father brought her to a famous tennis school in Florida. Back in Russia, her father __(58)__ a great future ahead of little Sharapova. He wanted to do his best to help her, and an American tennis school would be a good start. Now the seven-year-old girl __(59)__ at the school and would start to make her dream come true.\nThe little girl surprised the teachers when she knocked off the hat of one teacher with a strong serve. They told her father that she ______(60) a scholarship when she was old enough to enter the school in 1995.\nThat is where it all began. Sharapova has since caught the eye of the world with her excellent tennis skills.\n(serve 發球　scholarship 獎學金　skill 技巧)\n\n▶ 請選出第 60 格的答案", "options": ["has got", "had got", "got", "would get"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜克漏字第 60 格｜時態＋整句結構", "explanation": "【句型】told/said (that) S + would + V：過去說的「未來」。\n【分析】老師們（過去）告訴她父親，她「將會得到」獎學金 when she was old enough to enter the school in 1995 → 從 1994 看 1995 是未來 → would get。\n【其他選項】(A) 現在完成式不合；(B)(C) 表已經得到，但要等到 1995 年才入學。\n【例句】The coach told us we would get new uniforms next month.", "explanationSource": "source"}, {"id": 118, "question": "Mom said she ______ me a bike when I turned twelve.", "options": ["bought", "would buy", "has bought", "buys"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 117 題）", "explanation": "過去說的未來 → would buy。", "explanationSource": "supplemental"}, {"id": 119, "question": "The teacher told us that we ______ a test the next day.", "options": ["would have", "had", "have had", "have"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 117 題）", "explanation": "told + the next day → would have。", "explanationSource": "supplemental"}, {"id": 120, "question": "Tom promised that he ______ back by six.", "options": ["has come", "came", "would come", "comes"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 117 題）", "explanation": "promised 過去式＋未來 → would come。", "explanationSource": "supplemental"}, {"id": 121, "question": "(21-23)\nDear Jean,\nHow have you been? I'm writing this to say I'm sorry that ______(21) your birthday. These days I felt there was something wrong, but I just couldn't think of what it was. Yesterday afternoon on the bus, I __(22)__ remembered what it was. Your birthday is this month, and it was two weeks ago! I feel so bad. I picked out a gift for you. I hope you like it.\nBy the way, __(23)__ a great time on your birthday? I can't wait to hear about it.\nLove,\nLinda\n(by the way 順便一提)\n\n▶ 請選出第 21 格的答案", "options": ["I forget", "I forgot", "I'm forgetting", "I've forgotten"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜克漏字第 21 格｜時態＋整句結構", "explanation": "【句型】說明過去發生的事用過去式；I'm sorry that + S + 過去式。\n【分析】生日 was two weeks ago，而且作者昨天已經 remembered，所以「忘記」是過去的事 → I forgot。\n【其他選項】(A) forget 現在式表現在仍忘記，不合；(C) 進行式不合；(D) I've forgotten 表到現在仍忘記，但她已想起來了。\n【例句】I'm sorry that I forgot to call you last night.", "explanationSource": "source"}, {"id": 122, "question": "I'm sorry that I ______ your book at home yesterday.", "options": ["leave", "left", "am leaving", "will leave"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 121 題）", "explanation": "yesterday → 過去式。", "explanationSource": "supplemental"}, {"id": 123, "question": "Ben ______ his homework at home this morning, so the teacher was not happy.", "options": ["forgets", "forgot", "is forgetting", "will forget"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 121 題）", "explanation": "this morning 已過去 → forgot。", "explanationSource": "supplemental"}, {"id": 124, "question": "Ann said sorry because she ______ to bring my umbrella back last week.", "options": ["forgets", "has forgotten", "forgot", "will forget"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 121 題）", "explanation": "last week → forgot。", "explanationSource": "supplemental"}, {"id": 125, "question": "(21-23)\nDear Jean,\nHow have you been? I'm writing this to say I'm sorry that __(21)__ your birthday. These days I felt there was something wrong, but I just couldn't think of what it was. Yesterday afternoon on the bus, I ______(22) remembered what it was. Your birthday is this month, and it was two weeks ago! I feel so bad. I picked out a gift for you. I hope you like it.\nBy the way, __(23)__ a great time on your birthday? I can't wait to hear about it.\nLove,\nLinda\n(by the way 順便一提)\n\n▶ 請選出第 22 格的答案", "options": ["also", "finally", "only", "still"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜克漏字第 22 格｜詞彙題", "explanation": "【句型】finally + V：經過一段時間後「終於」。\n【分析】前句 These days I felt there was something wrong, but I just couldn't think of what it was（一直想不起來），昨天在公車上「終於」想起來 → finally。\n【其他選項】(A) also 也，前面沒有可呼應的事；(C) only 只有，語意不通；(D) still 仍然，與「想起來了」不搭。\n【例句】After waiting for an hour, we finally saw the bus.", "explanationSource": "source"}, {"id": 126, "question": "Joe looked for his keys all morning, and he ______ found them under the sofa.", "options": ["also", "still", "finally", "only"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 125 題）", "explanation": "找了一早上，終於找到。", "explanationSource": "supplemental"}, {"id": 127, "question": "It's ten o'clock, but Amy is ______ sleeping. She is going to be late.", "options": ["finally", "still", "also", "only"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 125 題）", "explanation": "十點了「仍然」在睡 → still。", "explanationSource": "supplemental"}, {"id": 128, "question": "My brother likes dogs. I ______ like dogs, so we want to get one.", "options": ["also", "finally", "still", "only"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 125 題）", "explanation": "我也喜歡 → also。", "explanationSource": "supplemental"}, {"id": 129, "question": "(21-23)\nDear Jean,\nHow have you been? I'm writing this to say I'm sorry that __(21)__ your birthday. These days I felt there was something wrong, but I just couldn't think of what it was. Yesterday afternoon on the bus, I __(22)__ remembered what it was. Your birthday is this month, and it was two weeks ago! I feel so bad. I picked out a gift for you. I hope you like it.\nBy the way, ______(23) a great time on your birthday? I can't wait to hear about it.\nLove,\nLinda\n(by the way 順便一提)\n\n▶ 請選出第 23 格的答案", "options": ["have you had", "are you having", "would you have", "did you have"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜克漏字第 23 格｜時態＋整句結構", "explanation": "【句型】問過去發生的事：Did + S + 原形V…?\n【分析】生日 was two weeks ago，已經過去，詢問當時是否玩得愉快 → did you have a great time。\n【其他選項】(A) 現在完成式不和特定過去事件（on your birthday，兩週前）連用；(B) 進行式表正在；(C) would 表假設或意願，不合。\n【例句】Did you have a good time at the party last night?", "explanationSource": "source"}, {"id": 130, "question": "______ a nice trip to Kenting last weekend?", "options": ["Do you have", "Did you have", "Will you have", "Are you having"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 129 題）", "explanation": "last weekend → Did you have。", "explanationSource": "supplemental"}, {"id": 131, "question": "Your test was yesterday. ______ well?", "options": ["Did you do", "Do you do", "Will you do", "Have you do"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 129 題）", "explanation": "yesterday → Did you do。", "explanationSource": "supplemental"}, {"id": 132, "question": "How ______ your summer vacation? Tell me about it.", "options": ["is", "will be", "was", "are"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 129 題）", "explanation": "暑假已過 → was。", "explanationSource": "supplemental"}, {"id": 133, "question": "(21-24)\nMy mother likes to tell me the story about my name, Stella. She ______(21) about it many times.\nI was born on a night full of stars. My mom __(22)__ a hard time when the doctor said I was too big to be pulled out. At that moment, Mom looked into the sky, making a wish with all her heart, \"Let the baby live, please, even if I may die!\"\nJust then, a very bright star __(23)__ from the sky. All her troubles were soon gone, and my little head came out of her body.\nWith the falling of a star came a new life. That's how I __(24)__ the name \"Stella,\" which means \"star.\"\n\n▶ 請選出第 21 格的答案", "options": ["talked", "is talking", "has talked", "will talk"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜克漏字第 21 格｜時態＋整句結構", "explanation": "【句型】現在完成式 have/has + p.p. + 次數（many times / twice）：到目前為止的經驗。\n【分析】前句 My mother likes to tell me…（現在式），到現在為止她「已經講了很多次」→ has talked … many times。\n【其他選項】(A) talked 只表過去，無法表示到現在的累積經驗；(B) 進行式不和 many times 連用；(D) 未來式不合。\n【例句】I have watched this movie three times.", "explanationSource": "source"}, {"id": 134, "question": "Grandpa loves this story. He ______ it to us many times.", "options": ["told", "has told", "is telling", "will tell"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 133 題）", "explanation": "到現在講了很多次 → has told。", "explanationSource": "supplemental"}, {"id": 135, "question": "Mrs. Wang ______ to Japan five times. She really loves it there.", "options": ["has been", "went",
