werLabel": "B", "source": "類似題 2（對應第 293 題）", "explanation": "this year + 複數 → are。", "explanationSource": "supplemental"}, {"id": 296, "question": "Last night there ______ a big storm in our town.", "options": ["is", "are", "was", "were"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 293 題）", "explanation": "last night + 單數 → was。", "explanationSource": "supplemental"}, {"id": 297, "question": "(21-23)\nShu-fen is in her third year of junior high school. She has many tests every day, but she does not even want to look at her books. Shu-fen was not like this before. In fact, she __(21)__ studying during her first two years of high school and always got high grades on tests. She was happy then.\nBut these days Shu-fen always feels tired and bored. There __(22)__ so many tests that Shu-fen cannot relax and do the things she likes. But what can she do? She can only tell herself that things ______(23) better after she starts senior high school.\n(relax 放鬆)\n\n▶ 請選出第 23 格的答案", "options": ["get", "got", "have got", "will get"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜克漏字第 23 格｜副詞子句與名詞子句的時態", "explanation": "【句型】主要子句 will + V + after/when + 現在式（時間副詞子句以現在式代替未來）。\n【分析】after she starts senior high school 是未來的事（時間子句用現在式），主要子句要用未來式 → things will get better。\n【其他選項】(A) get 現在式不能表示將來的改變；(B) got 過去式；(C) have got 現在完成式，都不合。\n【例句】You will feel better after you take this medicine.", "explanationSource": "source"}, {"id": 298, "question": "We ______ dinner after Dad comes home.", "options": ["have", "will have", "had", "have had"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 297 題）", "explanation": "after + 現在式，主句用未來 → will have。", "explanationSource": "supplemental"}, {"id": 299, "question": "Call me when you ______ at the station.", "options": ["arrive", "will arrive", "arrived", "have arrived"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 297 題）", "explanation": "when 子句用現在式代替未來 → arrive。", "explanationSource": "supplemental"}, {"id": 300, "question": "The weather ______ warmer after spring comes.", "options": ["got", "gets", "will get", "has got"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 297 題）", "explanation": "主要子句用未來 → will get。", "explanationSource": "supplemental"}, {"id": 301, "question": "(17-19)\nMs. Li: A-fu, why were you late every day this week?\nA-fu: I'm sorry, Ms. Li, but there ______(17) a traffic jam on Monday morning.\nMs. Li: How about Tuesday and Wednesday?\nA-fu: I missed the bus.\nMs. Li: Why did you miss the bus?\nA-fu: I __(18)__ very hard and went to bed late.\nMs. Li: If you keep being late, I __(19)__ you dump garbage for the class for one month!\nA-fu: But Ms. Li, I was NOT late this morning!\nMs. Li: No, you weren't. But why are you still wearing your slippers?\nA-fu: What? I...!?\n(traffic jam 塞車　dump 倒　slipper 拖鞋)\n\n▶ 請選出第 17 格的答案", "options": ["was", "is", "has been", "will be"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜克漏字第 17 格｜There be／代名詞 it, they", "explanation": "【句型】There be + N；過去時間 on Monday morning 用 There was。\n【分析】on Monday morning 是本週已過去的時間，老師問 why were you late（過去式）→ there was a traffic jam。\n【其他選項】(B) is 現在式、(C) has been 現在完成式不和明確過去時間連用；(D) will be 未來式不合。\n【例句】There was a big fire near my house last night.", "explanationSource": "source"}, {"id": 302, "question": "There ______ a lot of people at the night market last Saturday.", "options": ["are", "were", "have been", "will be"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 301 題）", "explanation": "last Saturday + 複數 → were。", "explanationSource": "supplemental"}, {"id": 303, "question": "Sorry I'm late. There ______ an accident on the road this morning.", "options": ["was", "is", "will be", "has"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 301 題）", "explanation": "this morning 已過 → was。", "explanationSource": "supplemental"}, {"id": 304, "question": "There ______ a basketball game at our school tomorrow.", "options": ["was", "has been", "will be", "were"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 301 題）", "explanation": "tomorrow → will be。", "explanationSource": "supplemental"}, {"id": 305, "question": "(17-19)\nMs. Li: A-fu, why were you late every day this week?\nA-fu: I'm sorry, Ms. Li, but there __(17)__ a traffic jam on Monday morning.\nMs. Li: How about Tuesday and Wednesday?\nA-fu: I missed the bus.\nMs. Li: Why did you miss the bus?\nA-fu: I ______(18) very hard and went to bed late.\nMs. Li: If you keep being late, I __(19)__ you dump garbage for the class for one month!\nA-fu: But Ms. Li, I was NOT late this morning!\nMs. Li: No, you weren't. But why are you still wearing your slippers?\nA-fu: What? I...!?\n(traffic jam 塞車　dump 倒　slipper 拖鞋)\n\n▶ 請選出第 18 格的答案", "options": ["studied", "am studying", "have studied", "will study"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜克漏字第 18 格｜時態＋整句結構", "explanation": "【句型】and 連接的動詞時態一致；說明過去原因用過去式。\n【分析】回答 Why did you miss the bus?（過去式），後半句 and went to bed late 是過去式 → studied。\n【其他選項】(B) 現在進行式、(C) 現在完成式、(D) 未來式都與 went 不一致。\n【例句】I played games and went to bed late last night.", "explanationSource": "source"}, {"id": 306, "question": "A: Why are you so tired? B: I ______ a scary movie and couldn't sleep last night.", "options": ["watch", "watched", "have watched", "will watch"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 305 題）", "explanation": "last night → watched。", "explanationSource": "supplemental"}, {"id": 307, "question": "A: Why did you miss breakfast? B: I ______ up late and had to run to school.", "options": ["got", "get", "have got", "will get"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 305 題）", "explanation": "與 had to 一致 → got。", "explanationSource": "supplemental"}, {"id": 308, "question": "A: Why didn't you come to the party? B: I ______ a fever and stayed in bed.", "options": ["have", "will have", "had", "am having"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 305 題）", "explanation": "與 stayed 一致 → had。", "explanationSource": "supplemental"}, {"id": 309, "question": "(17-19)\nMs. Li: A-fu, why were you late every day this week?\nA-fu: I'm sorry, Ms. Li, but there __(17)__ a traffic jam on Monday morning.\nMs. Li: How about Tuesday and Wednesday?\nA-fu: I missed the bus.\nMs. Li: Why did you miss the bus?\nA-fu: I __(18)__ very hard and went to bed late.\nMs. Li: If you keep being late, I ______(19) you dump garbage for the class for one month!\nA-fu: But Ms. Li, I was NOT late this morning!\nMs. Li: No, you weren't. But why are you still wearing your slippers?\nA-fu: What? I...!?\n(traffic jam 塞車　dump 倒　slipper 拖鞋)\n\n▶ 請選出第 19 格的答案", "options": ["was making", "make", "have made", "will make"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜克漏字第 19 格｜使役動詞", "explanation": "【句型】If + 現在式, S + will + V；使役動詞 make + 受詞 + 原形動詞（make you dump）。\n【分析】If you keep being late（條件），老師警告「我將會叫你」倒垃圾一個月 → will make you dump。\n【其他選項】(A) 過去進行式、(C) 現在完成式不合條件句；(B) make 現在式不能表示「如果…就會…」的未來結果。\n【例句】If you don't finish your homework, Mom will make you stay home.", "explanationSource": "source"}, {"id": 310, "question": "If you keep talking in class, I ______ you stand at the back.", "options": ["made", "will make", "have made", "was making"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 309 題）", "explanation": "條件句主句用 will → will make。", "explanationSource": "supplemental"}, {"id": 311, "question": "My dad always makes me ______ my room on Sundays.", "options": ["clean", "to clean", "cleaning", "cleaned"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 309 題）", "explanation": "make + O + 原形V → clean。", "explanationSource": "supplemental"}, {"id": 312, "question": "If the dog breaks the vase again, Mom ______ it sleep outside.", "options": ["makes", "made", "will make", "has made"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 309 題）", "explanation": "條件句 → will make。", "explanationSource": "supplemental"}, {"id": 313, "question": "(20-22)\nLast night I had a bad dream. In my dream, I ______(20) to a room by three strange-looking people. They talked to each other in a language I didn't understand. I didn't know what they __(21)__ to me. Would they do anything bad? I was so afraid that I started to cry. Suddenly, one of them came up to me and tried to hurt me with a knife. I cried out loudly and then I __(22)__ up. Luckily, there were no people around--I was in my own bed!\n(strange-looking 長相奇怪的　suddenly 突然地)\n\n▶ 請選出第 20 格的答案", "options": ["am taken", "was taken", "have been taken", "would be taken"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜克漏字第 20 格｜主動與被動語態", "explanation": "【句型】被動語態 be + p.p. + by + 動作者；過去式被動 was/were + p.p.。\n【分析】有 by three strange-looking people，「我被帶到」房間（被動）；Last night 夢是過去 → was taken。\n【其他選項】(A) 現在式被動、(C) 現在完成式被動與過去敘事不合；(D) would be taken 表過去的未來或假設。\n【例句】The little boy was taken to the hospital by his parents.", "explanationSource": "source"}, {"id": 314, "question": "Yesterday the lost dog ______ to the police station by a kind girl.", "options": ["is taken", "was taken", "takes", "has taken"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 313 題）", "explanation": "過去被動 → was taken。", "explanationSource": "supplemental"}, {"id": 315, "question": "This picture ______ by my father last summer.", "options": ["was painted", "painted", "is painted", "has painted"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 313 題）", "explanation": "last summer 被畫 → was painted。", "explanationSource": "supplemental"}, {"id": 316, "question": "The students ______ to the museum by bus last Friday.", "options": ["take", "were taking", "were taken", "have taken"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 313 題）", "explanation": "學生被帶去，過去被動 → were taken。", "explanationSource": "supplemental"}, {"id": 317, "question": "(20-22)\nLast night I had a bad dream. In my dream, I __(20)__ to a room by three strange-looking people. They talked to each other in a language I didn't understand. I didn't know what they ______(21) to me. Would they do anything bad? I was so afraid that I started to cry. Suddenly, one of them came up to me and tried to hurt me with a knife. I cried out loudly and then I __(22)__ up. Luckily, there were no people around--I was in my own bed!\n(strange-looking 長相奇怪的　suddenly 突然地)\n\n▶ 請選出第 21 格的答案", "options": ["are doing", "did", "have done", "would do"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜克漏字第 21 格｜時態＋整句結構", "explanation": "【句型】主要子句過去式（didn't know），子句表「接下來會做」用 would + V。\n【分析】我不知道他們「將會」對我做什麼，下一句 Would they do anything bad? 也用 would → what they would do to me。\n【其他選項】(A) 現在進行式時態不一致；(B) did 表已經做了，但當時還沒發生；(C) 現在完成式不合。\n【例句】I didn't know what my parents would say about my test.", "explanationSource": "source"}, {"id": 318, "question": "Amy didn't know what her friends ______ for her birthday.", "options": ["will plan", "would plan", "have planned", "plan"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 317 題）", "explanation": "didn't know + 未來 → would plan。", "explanationSource": "supplemental"}, {"id": 319, "question": "We had no idea how the movie ______.", "options": ["would end", "ends", "has ended", "is ending"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 317 題）", "explanation": "過去不知未來 → would end。", "explanationSource": "supplemental"}, {"id": 320, "question": "Ben wasn't sure what the teacher ______ about his late homework.", "options": ["says", "has said", "would say", "is saying"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 317 題）", "explanation": "過去不確定未來 → would say。", "explanationSource": "supplemental"}, {"id": 321, "question": "(20-22)\nLast night I had a bad dream. In my dream, I __(20)__ to a room by three strange-looking people. They talked to each other in a language I didn't understand. I didn't know what they __(21)__ to me. Would they do anything bad? I was so afraid that I started to cry. Suddenly, one of them came up to me and tried to hurt me with a knife. I cried out loudly and then I ______(22) up. Luckily, there were no people around--I was in my own bed!\n(strange-looking 長相奇怪的　suddenly 突然地)\n\n▶ 請選出第 22 格的答案", "options": ["wake", "woke", "was waking", "was going to wake"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜克漏字第 22 格｜時態＋整句結構", "explanation": "【句型】過去連續動作用過去簡單式；wake 的過去式為 woke。\n【分析】I cried out loudly and then I woke up：「大叫然後醒來」是先後發生的兩個過去動作，與 cried 一致 → woke。\n【其他選項】(A) wake 現在式不合；(C) 過去進行式表正在醒，不合 and then 的接續；(D) was going to wake 表本來要醒，不合，因為他真的醒了（I was in my own bed）。\n【例句】The alarm rang, and then I woke up.", "explanationSource": "source"}, {"id": 322, "question": "I heard a loud noise and then I ______ up.", "options": ["wake", "woke", "was waking", "have woken"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 321 題）", "explanation": "與 heard 接續 → woke。", "explanationSource": "supplemental"}, {"id": 323, "question": "Jim opened the door and then ______ into the room.", "options": ["ran", "runs", "was running", "has run"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 321 題）", "explanation": "接續動作 → ran。", "explanationSource": "supplemental"}, {"id": 324, "question": "The baby cried for a while and then ______ asleep.", "options": ["falls", "was falling", "fell", "has fallen"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 321 題）", "explanation": "接續動作 → fell。", "explanationSource": "supplemental"}, {"id": 325, "question": "(21-23)\nLast Saturday, I decided to go to a movie in the evening. My little sister said that she wanted to go with me because she was bored at home. When we got to the theater, a lot of people ______(21) there to buy tickets. I saw a friend in the crowd, so I walked up and talked to him for a while. When we finished talking, I found my sister was gone! I __(22)__ her name loudly and looked for her for thirty minutes. Everyone was looking at me. Finally, I found my sister in a toyshop near the theater. She was playing happily there.\nWe __(23)__ the movie that night and went home early. I have learned from this experience to be more careful if I have to take my sister out with me again.\n(crowd 人群)\n\n▶ 請選出第 21 格的答案", "options": ["wait", "have waited", "will wait", "were waiting"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜克漏字第 21 格｜時態＋整句結構", "explanation": "【句型】When + 過去式, S + was/were + Ving：某事發生時，另一事正在進行。\n【分析】When we got to the theater（過去），當時很多人「正在」排隊等買票 → were waiting。\n【其他選項】(A) 現在式、(B) 現在完成式、(C) 未來式都與過去敘事不一致。\n【例句】When I got home, my parents were watching TV.", "explanationSource": "source"}, {"id": 326, "question": "When we arrived at the station, many people ______ for the train.", "options": ["wait", "were waiting", "have waited", "will wait"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 325 題）", "explanation": "到達時正在等 → were waiting。", "explanationSource": "supplemental"}, {"id": 327, "question": "When the bell rang, the students ______ their lunch.", "options": ["were eating", "eat", "have eaten", "will eat"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 325 題）", "explanation": "鈴響時正在吃。", "explanationSource": "supplemental"}, {"id": 328, "question": "When I walked into the gym, my classmates ______ basketball.", "options": ["play", "have played", "were playing", "will play"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 325 題）", "explanation": "進去時正在打球。", "explanationSource": "supplemental"}, {"id": 329, "question": "(21-23)\nLast Saturday, I decided to go to a movie in the evening. My little sister said that she wanted to go with me because she was bored at home. When we got to the theater, a lot of people __(21)__ there to buy tickets. I saw a friend in the crowd, so I walked up and talked to him for a while. When we finished talking, I found my sister was gone! I ______(22) her name loudly and looked for her for thirty minutes. Everyone was looking at me. Finally, I found my sister in a toyshop near the theater. She was playing happily there.\nWe __(23)__ the movie that night and went home early. I have learned from this experience to be more careful if I have to take my sister out with me again.\n(crowd 人群)\n\n▶ 請選出第 22 格的答案", "options": ["have called", "will call", "called", "was calling"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜克漏字第 22 格｜時態＋整句結構", "explanation": "【句型】and 連接的動詞時態一致，過去發生的連續動作用過去式。\n【分析】I ___ her name loudly and looked for her for thirty minutes：後半句 looked 是過去式，前面也用過去式 → called。\n【其他選項】(A) 現在完成式、(B) 未來式與過去敘事不合；(D) was calling 表當時正在叫，與並列的 looked 時態不一致，且這是一連串完成的動作。\n【例句】I called my dog and looked for him everywhere.", "explanationSource": "source"}, {"id": 330, "question": "Mia ______ her mom and told her the good news.", "options": ["calls", "called", "has called", "was calling"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 329 題）", "explanation": "與 told 一致 → called。", "explanationSource": "supplemental"}, {"id": 331, "question": "The boy ______ his ball and ran home.", "options": ["picked up", "picks up", "has picked up", "will pick up"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 329 題）", "explanation": "與 ran 一致 → picked up。", "explanationSource": "supplemental"}, {"id": 332, "question": "Yesterday I ______ my room and washed the dishes.", "options": ["clean", "will clean", "cleaned", "have cleaned"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 329 題）", "explanation": "與 washed 一致 → cleaned。", "explanationSource": "supplemental"}, {"id": 333, "question": "(21-23)\nLast Saturday, I decided to go to a movie in the evening. My little sister said that she wanted to go with me because she was bored at home. When we got to the theater, a lot of people __(21)__ there to buy tickets. I saw a friend in the crowd, so I walked up and talked to him for a while. When we finished talking, I found my sister was gone! I __(22)__ her name loudly and looked for her for thirty minutes. Everyone was looking at me. Finally, I found my sister in a toyshop near the theater. She was playing happily there.\nWe ______(23) the movie that night and went home early. I have learned from this experience to be more careful if I have to take my sister out with me again.\n(crowd 人群)\n\n▶ 請選出第 23 格的答案", "options": ["have not seen", "will not see", "did not see", "were not seeing"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜克漏字第 23 格｜時態＋整句結構", "explanation": "【句型】明確的過去時間（that night）+ 過去簡單式；否定 did not + 原形V。\n【分析】找妹妹花了三十分鐘，所以那晚「沒看」電影就回家了；that night 是過去時間，後半 went home early 也是過去式 → did not see。\n【其他選項】(A) 現在完成式不和 that night 連用；(B) 未來式不合；(D) 過去進行式不適合描述整件事「沒發生」。\n【例句】We did not go out that night because it rained.", "explanationSource": "source"}, {"id": 334, "question": "It rained hard, so we ______ to the beach last Sunday.", "options": ["don't go", "didn't go", "haven't gone", "won't go"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 333 題）", "explanation": "last Sunday → didn't go。", "explanationSource": "supplemental"}, {"id": 335, "question": "I was too tired, so I ______ my homework that night.", "options": ["did not finish", "have not finished", "will not finish", "am not finishing"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 333 題）", "explanation": "that night → did not finish。", "explanationSource": "supplemental"}, {"id": 336, "question": "Kevin was sick yesterday, so he ______ to school.", "options": ["doesn't come", "hasn't come", "didn't come", "won't come"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 333 題）", "explanation": "yesterday → didn't come。", "explanationSource": "supplemental"}, {"id": 337, "question": "(19-21)\n(Doris sees Carol on her way to school.)\nDoris: Hi, Carol. Would you like to go to the movie The Doll World with me tonight?\nCarol: I'd love to, but I have to take care of my sister Kelly. My parents ______(19) home tonight.\nDoris: You can take her to the movie with us.\nCarol: I don't think so. I __(20)__ taking her to a movie with me once. She kept talking during the movie, and even cried loudly. I was so embarrassed.\nDoris: That's too bad. But I've heard this movie is really popular with young children. Maybe she __(21)__ it.\nCarol: Well, let me think about it. I'll tell you later when I see you at lunch.\nDoris: Sure. See you then.\n(take care of 照顧)\n\n▶ 請選出第 19 格的答案", "options": ["don't be", "weren't", "won't be", "haven't been"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜克漏字第 19 格｜時態＋整句結構", "explanation": "【句型】未來時間 tonight + will (not) + V；be 動詞未來否定 won't be。\n【分析】對話在早上上學途中，tonight 是之後的時間，父母「今晚不會在家」→ won't be。\n【其他選項】(A) don't be 是否定祈使句，不能接主詞；(B) weren't 過去式；(D) haven't been 現在完成式，都不合 tonight（未來）。\n【例句】My brother won't be home for dinner tonight.", "explanationSource": "source"}, {"id": 338, "question": "I'm sorry, but I ______ at school tomorrow. I have to see a doctor.", "options": ["am not", "won't be", "wasn't", "haven't been"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 337 題）", "explanation": "tomorrow → won't be。", "explanationSource": "supplemental"}, {"id": 339, "question": "Mom ______ back until nine tonight, so we'll cook dinner ourselves.", "options": ["won't be", "wasn't", "isn't being", "hasn't been"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 337 題）", "explanation": "tonight 之後 → won't be。", "explanationSource": "supplemental"}, {"id": 340, "question": "Don't call Mr. Lin this weekend. He ______ in Taipei.", "options": ["wasn't", "hasn't been", "won't be", "doesn't be"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 337 題）", "explanation": "this weekend → won't be。", "explanationSource": "supplemental"}, {"id": 341, "question": "(19-21)\n(Doris sees Carol on her way to school.)\nDoris: Hi, Carol. Would you like to go to the movie The Doll World with me tonight?\nCarol: I'd love to, but I have to take care of my sister Kelly. My parents __(19)__ home tonight.\nDoris: You can take her to the movie with us.\nCarol: I don't think so. I ______(20) taking her to a movie with me once. She kept talking during the movie, and even cried loudly. I was so embarrassed.\nDoris: That's too bad. But I've heard this movie is really popular with young children. Maybe she __(21)__ it.\nCarol: Well, let me think about it. I'll tell you later when I see you at lunch.\nDoris: Sure. See you then.\n(take care of 照顧)\n\n▶ 請選出第 20 格的答案", "options": ["try", "tried", "will try", "am trying"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜克漏字第 20 格｜動詞形式（to V / Ving / 祈使句）", "explanation": "【句型】try + Ving：試試看做某事；once（曾經一次）+ 過去式。\n【分析】後句 She kept talking…, and even cried loudly. I was so embarrassed. 都是過去式，表示過去曾經「試過」帶她去一次 → tried taking her。\n【其他選項】(A) try 現在式、(C) 未來式、(D) 現在進行式都與 once 及後面的過去經驗不合。\n【例句】I tried cooking dinner for my family once, but it was terrible.", "explanationSource": "source"}, {"id": 342, "question": "I ______ eating stinky tofu once. I didn't like it at all.", "options": ["try", "tried", "will try", "am trying"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 341 題）", "explanation": "once + 過去經驗 → tried。", "explanationSource": "supplemental"}, {"id": 343, "question": "Lily ______ making cookies by herself last week, and they were delicious.", "options": ["tried", "tries", "will try", "is trying"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 341 題）", "explanation": "last week → tried。", "explanationSource": "supplemental"}, {"id": 344, "question": "If the door doesn't open, try ______ the key the other way.", "options": ["turn", "turned", "turning", "turns"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 341 題）", "explanation": "try + Ving（試試看）→ turning。", "explanationSource": "supplemental"}, {"id": 345, "question": "(19-21)\n(Doris sees Carol on her way to school.)\nDoris: Hi, Carol. Would you like to go to the movie The Doll World with me tonight?\nCarol: I'd love to, but I have to take care of my sister Kelly. My parents __(19)__ home tonight.\nDoris: You can take her to the movie with us.\nCarol: I don't think so. I __(20)__ taking her to a movie with me once. She kept talking during the movie, and even cried loudly. I was so embarrassed.\nDoris: That's too bad. But I've heard this movie is really popular with young children. Maybe she ______(21) it.\nCarol: Well, let me think about it. I'll tell you later when I see you at lunch.\nDoris: Sure. See you then.\n(take care of 照顧)\n\n▶ 請選出第 21 格的答案", "options": ["loves", "loved", "will love", "was going to love"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜克漏字第 21 格｜時態＋整句結構", "explanation": "【句型】Maybe + S + will + V：對未來的推測。\n【分析】Doris 說這部片很受小孩歡迎，推測 Kelly 今晚去看「也許會喜歡」→ will love。\n【其他選項】(A) loves 現在式，她還沒看過電影；(B) loved 過去式；(D) was going to love 是過去的未來，不合。\n【例句】Try this cake. Maybe you will like it.", "explanationSource": "source"}, {"id": 346, "question": "This book is about dinosaurs. Maybe your son ______ it.", "options": ["likes", "liked", "will like", "was going to like"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 345 題）", "explanation": "對未來的推測 → will like。", "explanationSource": "supplemental"}, {"id": 347, "question": "Take a jacket with you. Maybe it ______ cold tonight.", "options": ["will get", "got", "gets", "was going to get"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 345 題）", "explanation": "tonight 推測 → will get。", "explanationSource": "supplemental"}, {"id": 348, "question": "Ask Ms. Wu for help. Maybe she ______ the answer.", "options": ["knew", "will know", "was knowing", "has known"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 345 題）", "explanation": "推測 → will know。", "explanationSource": "supplemental"}, {"id": 349, "question": "(17-19)\nDate: 01/21/2002　weather: sunny\nToday is the first day of winter vacation. I'm very excited because Chinese New Year is coming. Mom told me this morning that we ______(17) Grandmother's place for the new year. Dad won't be back from Tokyo before the holidays are over. It has been two weeks since Dad left. I miss him so much.\nMom went shopping for food and presents, so I took Lucy and Annie to the library. We __(18)__ at the Children's Reading Room all the afternoon. We found some books about animals we were interested in. After we left the library, we went to Mendy's to buy hamburgers and fries. I was hungry, but I didn't eat much. I __(19)__ two kilos in the last two weeks. I hope I can lose six kilos before summer comes.\n(library 圖書館)\n\n▶ 請選出第 17 格的答案", "options": ["go to", "went to", "have gone to", "are going to"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜克漏字第 17 格｜時態＋整句結構", "explanation": "【句型】be going to + 地點（go to 省略 go）／be going to + V：已安排好的未來計畫。\n【分析】過年 is coming（還沒到），媽媽說「我們要去」奶奶家過年，是未來計畫 → are going to Grandmother's place。\n【其他選項】(A) go to 現在式不能表示這次的未來計畫；(B) went to 表已經去了；(C) have gone to 表已經去了（人在那裡），都與「新年還沒到」不合。\n【例句】We are going to Kenting for summer vacation.\n備註：be going to 屬未來式；Mom told me 為過去式，但「新年」仍在未來，故不需時態後移。", "explanationSource": "source"}, {"id": 350, "question": "Dad told us that we ______ Hualien next weekend.", "options": ["went to", "are going to", "have gone to", "go to"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 349 題）", "explanation": "next weekend 計畫 → are going to。", "explanationSource": "supplemental"}, {"id": 351, "question": "Look at those dark clouds! It ______ rain soon.", "options": ["is going to", "went to", "has gone to", "goes to"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 349 題）", "explanation": "跡象推測未來 → is going to。", "explanationSource": "supplemental"}, {"id": 352, "question": "Lucy ______ visit her aunt in Tainan tomorrow.", "options": ["went to", "has gone to", "is going to", "goes to"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 349 題）", "explanation": "tomorrow → is going to。", "explanationSource": "supplemental"}, {"id": 353, "question": "(17-19)\nDate: 01/21/2002　weather: sunny\nToday is the first day of winter vacation. I'm very excited because Chinese New Year is coming. Mom told me this morning that we __(17)__ Grandmother's place for the new year. Dad won't be back from Tokyo before the holidays are over. It has been two weeks since Dad left. I miss him so much.\nMom went shopping for food and presents, so I took Lucy and Annie to the library. We ______(18) at the Children's Reading Room all the afternoon. We found some books about animals we were interested in. After we left the library, we went to Mendy's to buy hamburgers and fries. I was hungry, but I didn't eat much. I __(19)__ two kilos in the last two weeks. I hope I can lose six kilos before summer comes.\n(library 圖書館)\n\n▶ 請選出第 18 格的答案", "options": ["stayed", "will stay", "have stayed", "were going to stay"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜克漏字第 18 格｜時態＋整句結構", "explanation": "【句型】描述今天已經發生（過去）的事用過去簡單式。\n【分析】日記中 Mom went shopping…, so I took…（過去式），之後 found, left, went 也是過去式，我們整個下午「待在」閱覽室 → stayed。\n【其他選項】(B) will stay 未來式不合；(C) 現在完成式不和已結束的「整個下午＋後續動作」敘述連用；(D) were going to stay 表本來要待（可能沒待），與後文找到書矛盾。\n【例句】We stayed at the park all afternoon yesterday.", "explanationSource": "source"}, {"id": 354, "question": "Yesterday Tom ______ at home all day because of the rain.", "options": ["stays", "stayed", "has stayed", "will stay"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 353 題）", "explanation": "yesterday → stayed。", "explanationSource": "supplemental"}, {"id": 355, "question": "Yesterday morning we ______ at the beach for three hours.", "options": ["played", "play", "have been playing", "will play"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 353 題）", "explanation": "Yesterday morning → played。", "explanationSource": "supplemental"}, {"id": 356, "question": "After dinner, my family ______ TV in the living room.", "options": ["watch", "will watch", "watched", "have watched"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 353 題）", "explanation": "過去敘述 → watched。", "explanationSource": "supplemental"}, {"id": 357, "question": "(17-19)\nDate: 01/21/2002　weather: sunny\nToday is the first day of winter vacation. I'm very excited because Chinese New Year is coming. Mom told me this morning that we __(17)__ Grandmother's place for the new year. Dad won't be back from Tokyo before the holidays are over. It has been two weeks since Dad left. I miss him so much.\nMom went shopping for food and presents, so I took Lucy and Annie to the library. We __(18)__ at the Children's Reading Room all the afternoon. We found some books about animals we were interested in. After we left the library, we went to Mendy's to buy hamburgers and fries. I was hungry, but I didn't eat much. I ______(19) two kilos in the last two weeks. I hope I can lose six kilos before summer comes.\n(library 圖書館)\n\n▶ 請選出第 19 格的答案", "options": ["lose", "have lost", "am losing", "was going to lose"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜克漏字第 19 格｜時態＋整句結構", "explanation": "【句型】in the last/past + 時間 + 現在完成式：過去一段時間到現在的結果。\n【分析】in the last two weeks（最近兩週到現在），已經瘦了兩公斤 → have lost；後句 I hope I can lose six kilos 也顯示是到目前的成果。\n【其他選項】(A) lose 現在式不和 in the last two weeks 連用；(C) 現在進行式不能表示「已達成兩公斤」；(D) was going to lose 表本來要瘦，不合。\n【例句】I have read three books in the last month.", "explanationSource": "source"}, {"id": 358, "question": "My brother ______ five centimeters in the past year.", "options": ["grows", "has grown", "is growing", "was going to grow"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 357 題）", "explanation": "in the past year → has grown。", "explanationSource": "supplemental"}, {"id": 359, "question": "We ______ a lot of rain in the last few days.", "options": ["have had", "have", "are having", "were going to have"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 357 題）", "explanation": "in the last few days → have had。", "explanationSource": "supplemental"}, {"id": 360, "question": "Jenny ______ three new friends in the past two weeks.", "options": ["makes", "is making", "has made", "was going to make"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 357 題）", "explanation": "in the past two weeks → has made。", "explanationSource": "supplemental"}, {"id": 361, "question": "(21-23)\nBilly is one of my classmates in junior high school. Three years ago, he was very heavy, but he looks wonderful now. Here is his story about how he lost weight.\nBilly ______(21) a lot of snacks and fast food in his elementary school days. Besides, he did not do much exercise. So he kept putting on weight. He became so heavy that one day he broke the chair he was sitting on when he was in class.\nAfter this experience, Billy decided to lose some kilos. First, he went to see a doctor and __(22)__ to avoid fast food. Also, the doctor said he should start exercising. Billy followed the doctor's advice: he __(23)__ away from fast food for one year, and most important of all, he jogged every day.\nThat is how Billy lost 20 kilos before he entered junior high school.\n(advice 建議)\n\n▶ 請選出第 21 格的答案", "options": ["eats", "has eaten", "ate", "was going to eat"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜克漏字第 21 格｜時態＋整句結構", "explanation": "【句型】過去時間 in his elementary school days + 過去簡單式；eat 的過去式 ate。\n【分析】小學時期是過去，後句 did not do, kept putting on 都是過去式 → ate。\n【其他選項】(A) eats 現在式，他現在已經瘦了；(B) 現在完成式不和明確過去時段連用；(D) was going to eat 表本來要吃，不合。\n【例句】In my childhood, I ate candy every day.", "explanationSource": "source"}, {"id": 362, "question": "In her high school days, my mom ______ in the school band.", "options": ["plays", "played", "has played", "was going to play"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 361 題）", "explanation": "過去時期 → played。", "explanationSource": "supplemental"}, {"id": 363, "question": "When he was young, Grandpa ______ to school on foot.", "options": ["walked", "walks", "has walked", "is walking"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 361 題）", "explanation": "When he was young → walked。", "explanationSource": "supplemental"}, {"id": 364, "question": "In his college days, Mr. Ho ______ in Kaohsiung.", "options": ["lives", "has lived", "lived", "will live"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 361 題）", "explanation": "過去時期 → lived。", "explanationSource": "supplemental"}, {"id": 365, "question": "(21-23)\nBilly is one of my classmates in junior high school. Three years ago, he was very heavy, but he looks wonderful now. Here is his story about how he lost weight.\nBilly __(21)__ a lot of snacks and fast food in his elementary school days. Besides, he did not do much exercise. So he kept putting on weight. He became so heavy that one day he broke the chair he was sitting on when he was in class.\nAfter this experience, Billy decided to lose some kilos. First, he went to see a doctor and ______(22) to avoid fast food. Also, the doctor said he should start exercising. Billy followed the doctor's advice: he __(23)__ away from fast food for one year, and most important of all, he jogged every day.\nThat is how Billy lost 20 kilos before he entered junior high school.\n(advice 建議)\n\n▶ 請選出第 22 格的答案", "options": ["is asked", "was asked", "will be asked", "would be asked"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜克漏字第 22 格｜主動與被動語態", "explanation": "【句型】被動 be asked to V（被要求做…）；過去式被動 was + p.p.；and 前後時態一致。\n【分析】他去看醫生並「被（醫生）要求」避免速食；與前面 went 一致用過去式，且 Billy 是被要求的一方 → was asked to avoid。\n【其他選項】(A) is asked 現在式與 went 不一致；(C) will be asked 未來式不合；(D) would be asked 表過去的未來或假設，但事情當場就發生了。\n【例句】Tom was asked to clean the classroom after school.", "explanationSource": "source"}, {"id": 366, "question": "Yesterday Jenny went to the office and ______ to help the teacher.", "options": ["is asked", "was asked", "will be asked", "asks"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 365 題）", "explanation": "與 went 一致＋被動 → was asked。", "explanationSource": "supplemental"}, {"id": 367, "question": "All the students ______ to wear uniforms on Monday last week.", "options": ["were told", "told", "are told", "tell"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 365 題）", "explanation": "last week 被告知 → were told。", "explanationSource": "supplemental"}, {"id": 368, "question": "Ben went to the doctor and ______ to rest for three days.", "options": ["tells", "will be told", "was told", "told"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 365 題）", "explanation": "被告知，過去 → was told。", "explanationSource": "supplemental"}, {"id": 369, "question": "(21-23)\nBilly is one of my classmates in junior high school. Three years ago, he was very heavy, but he looks wonderful now. Here is his story about how he lost weight.\nBilly __(21)__ a lot of snacks and fast food in his elementary school days. Besides, he did not do much exercise. So he kept putting on weight. He became so heavy that one day he broke the chair he was sitting on when he was in class.\nAfter this experience, Billy decided to lose some kilos. First, he went to see a doctor and __(22)__ to avoid fast food. Also, the doctor said he should start exercising. Billy followed the doctor's advice: he ______(23) away from fast food for one year, and most important of all, he jogged every day.\nThat is how Billy lost 20 kilos before he entered junior high school.\n(advice 建議)\n\n▶ 請選出第 23 格的答案", "options": ["has stayed", "is staying", "will stay", "stayed"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜克漏字第 23 格｜時態＋整句結構", "explanation": "【句型】and 連接的動詞時態一致；stay away from 遠離。\n【分析】Billy followed the doctor's advice（過去），後半句 he jogged every day 也是過去式，而且整件事在他上國中前就結束了 → stayed away from。\n【其他選項】(A) has stayed 表延續到現在，但這件事已經結束（for one year, before he entered junior high school）；(B) 現在進行式、(C) 未來式不合。\n【例句】Last year, Kim stayed away from sugar and walked to school every day.", "explanationSource": "source"}, {"id": 370, "question": "Last summer, Ray ______ away from video games and read many books.", "options": ["stays", "stayed", "has stayed", "will stay"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 369 題）", "explanation": "與 read（過去）一致 → stayed。", "explanationSource": "supplemental"}, {"id": 371, "question": "During the test week, Lisa ______ off her phone and studied hard.", "options": ["turned", "turns", "has turned", "will turn"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 369 題）", "explanation": "與 studied 一致 → turned。", "explanationSource": "supplemental"}, {"id": 372, "question": "For two months, my dad ______ drinking soda and lost five kilos.", "options": ["stops", "will stop", "stopped", "has stopped"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 369 題）", "explanation": "與 lost 一致 → stopped。", "explanationSource": "supplemental"}, {"id": 373, "question": "(16-18)\nTed sat next to me when we were in elementary school. He had serious problems communicating with people. One always had to guess what he was saying. Besides, most of my classmates did not like to be with him because his hands and shirts were always dirty. I ______(16) let him know the importance of being clean by telling him several times a day to wash his hands. But he just could not understand.\nOne day, our teacher Miss Hsieh walked up to Ted. Without saying anything, she took Ted to the washroom. Slowly, Miss Hsieh washed his hands and told him that he should keep himself clean. She __(17)__ that every day for one month. Finally, Ted understood.\nMiss Hsieh's love has given me a good example to follow when I __(18)__ my job. I always remember to teach my students by showing them the right ways to do things. And most important of all, I always remember to give them more time to learn and to grow up.\n(guess 猜測　washroom 盥洗室　finally 終於)\n\n▶ 請選出第 16 格的答案", "options": ["tried to", "am trying to", "have tried to", "will try to"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜克漏字第 16 格｜時態＋整句結構", "explanation": "【句型】過去敘事用過去簡單式；try to V（試著做…）。\n【分析】小學時的事（when we were in elementary school），後句 But he just could not understand 也是過去式 → tried to。\n【其他選項】(B) 現在進行式、(C) 現在完成式、(D) 未來式都與過去敘事不合。\n【例句】I tried to help my friend with math, but he didn't listen.", "explanationSource": "source"}, {"id": 374, "question": "When I was in third grade, I ______ teach my little brother to read.", "options": ["try to", "tried to", "have tried to", "will try to"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 373 題）", "explanation": "過去 → tried to。", "explanationSource": "supplemental"}, {"id": 375, "question": "Last night, Amy ______ call you, but your phone was off.", "options": ["tried to", "tries to", "has tried to", "will try to"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 373 題）", "explanation": "last night → tried to。", "explanationSource": "supplemental"}, {"id": 376, "question": "In elementary school, Ted ______ make friends, but it was hard for him.", "options": ["tries to", "will try to", "tried to", "is trying to"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 373 題）", "explanation": "過去 → tried to。", "explanationSource": "supplemental"}, {"id": 377, "question": "(16-18)\nTed sat next to me when we were in elementary school. He had serious problems communicating with people. One always had to guess what he was saying. Besides, most of my classmates did not like to be with him because his hands and shirts were always dirty. I __(16)__ let him know the importance of being clean by telling him several times a day to wash his hands. But he just could not understand.\nOne day, our teacher Miss Hsieh walked up to Ted. Without saying anything, she took Ted to the washroom. Slowly, Miss Hsieh washed his hands and told him that he should keep himself clean. She ______(17) that every day for one month. Finally, Ted understood.\nMiss Hsieh's love has given me a good example to follow when I __(18)__ my job. I always remember to teach my students by showing them the right ways to do things. And most important of all, I always remember to give them more time to learn and to grow up.\n(guess 猜測　washroom 盥洗室　finally 終於)\n\n▶ 請選出第 17 格的答案", "options": ["did", "was doing", "has done", "was going to do"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜克漏字第 17 格｜時態＋整句結構", "explanation": "【句型】do that 代替前面提過的動作；過去重複一段時間的事用過去簡單式。\n【分析】謝老師把洗手、提醒這件事「做了」一個月（every day for one month），之後 Finally, Ted understood（過去式）→ did。\n【其他選項】(B) 過去進行式表某時正在做，不和 for one month 的完整動作搭配；(C) 現在完成式不合過去敘事；(D) was going to do 表本來要做，但她真的做了，Ted 也懂了。\n【例句】Grandma walked me to school. She did that every day for six years.", "explanationSource": "source"}, {"id": 378, "question": "Dad drove me to the bus stop. He ______ that every morning last year.", "options": ["does", "did", "has done", "was going to do"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 377 題）", "explanation": "last year → did。", "explanationSource": "supplemental"}, {"id": 379, "question": "My teacher read us a story after lunch. She ______ that every day last semester.", "options": ["did", "does", "has done", "will do"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 377 題）", "explanation": "last semester → did。", "explanationSource": "supplemental"}, {"id": 380, "question": "Mom hugged me before I left. She ______ that every time I went on a trip when I was little.", "options": ["does", "has done", "did", "will do"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 377 題）", "explanation": "when I was little → did。", "explanationSource": "supplemental"}, {"id": 381, "question": "(16-18)\nTed sat next to me when we were in elementary school. He had serious problems communicating with people. One always had to guess what he was saying. Besides, most of my classmates did not like to be with him because his hands and shirts were always dirty. I __(16)__ let him know the importance of being clean by telling him several times a day to wash his hands. But he just could not understand.\nOne day, our teacher Miss Hsieh walked up to Ted. Without saying anything, she took Ted to the washroom. Slowly, Miss Hsieh washed his hands and told him that he should keep himself clean. She __(17)__ that every day for one month. Finally, Ted understood.\nMiss Hsieh's love has given me a good example to follow when I ______(18) my job. I always remember to teach my students by showing them the right ways to do things. And most important of all, I always remember to give them more time to learn and to grow up.\n(guess 猜測　washroom 盥洗室　finally 終於)\n\n▶ 請選出第 18 格的答案", "options": ["did", "am doing", "have done", "am going to do"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜克漏字第 18 格｜時態＋整句結構", "explanation": "【句型】現在式／現在進行式描述「現在」的情況；when 子句說明作者目前做這份工作時。\n【分析】同段 has given、I always remember to teach my students 都是現在，作者現在是老師，正在「做」這份工作時以謝老師為榜樣 → am doing my job。\n【其他選項】(A) did 過去式，但作者現在仍在教書；(C) have done 表已完成；(D) am going to do 表還沒開始，但他已經有學生了。\n【例句】Mr. Lee always smiles when he is working in his garden.\n備註：最自然說法是 when I do my job；選項中只有 am doing 符合「現在」時態。", "explanationSource": "source"}, {"id": 382, "question": "My mom listens to music when she ______ her housework these days.", "options": ["did", "is doing", "has done", "is going to do"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 381 題）", "explanation": "現在一段時期 → is doing。", "explanationSource": "supplemental"}, {"id": 383, "question": "Ms. Chen always thinks of her old teacher when she ______ with her own students now.", "options": ["is working", "worked", "has worked", "was working"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 381 題）", "explanation": "now → is working。", "explanationSource": "supplemental"}, {"id": 384, "question": "Leo is a nurse now. He always tries to be kind when he ______ care of sick people.", "options": ["took", "has taken", "is taking", "was taking"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 381 題）", "explanation": "現在 → is taking。", "explanationSource": "supplemental"}]};</script><script src="longteng-b1u5-quiz.js?v=20261027-2"></script><script>document.querySelector("#description").textContent="共 384 題（會考歷屆＋講義錯題 96 題＋類似題 288 題）｜選答後顯示中文解析｜答錯可重做並下載錯題";</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
