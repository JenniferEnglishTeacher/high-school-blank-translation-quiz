gain next time.", "id": 113}, {"type": "mcq", "prompt": "✗ Don't give down! I'll help you.", "options": ["Doesn't give up! I'll help you.", "Don't gave up! I'll help you.", "Don't give off! I'll help you.", "Don't give up! I'll help you."], "answers": ["Don't give up! I'll help you."], "say": "Don't give up! I'll help you.", "id": 114}, {"type": "mcq", "prompt": "✗ No, it hasn't matter. I give up.", "options": ["No, it doesn't matters. I give up.", "No, it isn't matter. I give up.", "No, it don't matter. I give up.", "No, it doesn't matter. I give up."], "answers": ["No, it doesn't matter. I give up."], "say": "No, it doesn't matter. I give up.", "id": 115}]}, {"title": "Part K Reading 1: Dear Gabby", "en": "Read the letters. Choose the correct answer.", "zh": "閱讀信件，選出正確答案", "items": [{"type": "mcq", "prompt": "Kevin's aunt gave him the sneakers.", "options": ["True", "False"], "answers": ["False"], "say": "Kevin's aunt gave him the sneakers.", "id": 116}, {"type": "mcq", "prompt": "The sneakers were cheap.", "options": ["True", "False"], "answers": ["False"], "say": "The sneakers were cheap.", "id": 117}, {"type": "mcq", "prompt": "Kevin likes the color of the sneakers.", "options": ["True", "False"], "answers": ["False"], "say": "Kevin likes the color of the sneakers.", "id": 118}, {"type": "mcq", "prompt": "What are the TWO problems with the sneakers?", "options": ["They are uncomfortable and cheap.", "They are too small and an ugly color.", "They are too big and too expensive.", "They are old and dirty."], "answers": ["They are too small and an ugly color."], "say": "What are the TWO problems with the sneakers?", "id": 119}, {"type": "mcq", "prompt": "What does Gabby tell Kevin to ask his uncle for?", "options": ["a refund", "the receipt", "a birthday cake", "a credit card"], "answers": ["the receipt"], "say": "What does Gabby tell Kevin to ask his uncle for?", "id": 120}, {"type": "mcq", "prompt": "\"I don't want to wear them, either.\" Here, \"either\" means ___.", "options": ["maybe", "also not", "again", "very much"], "answers": ["also not"], "say": "\"I don't want to wear them, either.\" Here, \"either\" means also not.", "id": 121}, {"type": "mcq", "prompt": "Why will Kevin's uncle be happy?", "options": ["Kevin will throw the sneakers away.", "Kevin will give the sneakers back to him.", "Kevin will buy him a gift.", "Kevin will wear the new sneakers when he visits."], "answers": ["Kevin will wear the new sneakers when he visits."], "say": "Why will Kevin's uncle be happy?", "id": 122}], "passage": "Dear Gabby,\nI have a problem. My uncle gave me a pair of sneakers for my birthday. He bought them at May's Department Store, and they were the most expensive sneakers in the store. But they are too small, and they are the ugliest color in the world — bright orange! My uncle is coming to visit next week. I don't want to hurt his feelings, but I don't want to wear them, either. What should I do?\nKevin\n\nDear Kevin,\nYou're right. You shouldn't hurt your uncle's feelings. But you shouldn't wear shoes that are too small, either! Here is my suggestion. Ask your uncle for the receipt. Then you can exchange the sneakers for a bigger pair at May's. Maybe there is a color you like better. You can wear the new sneakers when your uncle visits. That will make him happy. Be honest and tell him the sneakers are too small. I think he will understand.\nGabby"}, {"title": "Part L Reading 2: An Email", "en": "Read the email. Choose the correct answer.", "zh": "閱讀電子郵件，選出正確答案", "items": [{"type": "mcq", "prompt": "How many passengers are on the ship?", "options": ["18,000", "1,800", "2,000", "180"], "answers": ["1,800"], "say": "How many passengers are on the ship?", "id": 123}, {"type": "mcq", "prompt": "Why doesn't Emily swim in the pools?", "options": ["The water is very cold.", "She has a sunburn.", "There are no pools.", "She is sick."], "answers": ["The water is very cold."], "say": "Why doesn't Emily swim in the pools?", "id": 124}, {"type": "mcq", "prompt": "What did Emily see through her binoculars?", "options": ["a town", "a whale", "a bear", "a shark"], "answers": ["a whale"], "say": "What did Emily see through her binoculars?", "id": 125}, {"type": "mcq", "prompt": "\"Sam isn't as happy as I am.\" This means ___.", "options": ["Emily is happier than Sam", "Sam is happier than Emily", "Emily isn't happy", "Sam and Emily are both as happy as a clam"], "answers": ["Emily is happier than Sam"], "say": "\"Sam isn't as happy as I am.\" This means Emily is happier than Sam.", "id": 126}, {"type": "mcq", "prompt": "Why is Sam sick?", "options": ["He swims in cold water.", "He plays bingo.", "He eats too much pizza.", "He goes hiking."], "answers": ["He eats too much pizza."], "say": "Why is Sam sick?", "id": 127}, {"type": "mcq", "prompt": "What is Emily going to do in Juneau?", "options": ["go snorkeling with Sam", "go hiking with her mom", "play bingo with her dad", "stay on the ship"], "answers": ["go hiking with her mom"], "say": "What is Emily going to do in Juneau?", "id": 128}, {"type": "mcq", "prompt": "Emily will be home next Saturday.", "options": ["True", "False"], "answers": ["True"], "say": "Emily will be home next Saturday.", "id": 129}], "passage": "From: Emily@Sunnyville.com\nTo: Annie@Sunnyville.com\nDate: October 20\nSubject: Greetings from Alaska!\n\nHi, Annie!\nMy dream came true! I'm on a cruise to Alaska with my family. The ship is as big as a town. There are 1,800 passengers, four restaurants, a library, and a fitness center. There are three pools, but the water is as cold as ice, so I don't swim. Yesterday, I stood on the deck and looked through my binoculars. I saw a whale! I was as happy as a clam.\nMy little brother Sam isn't as happy as I am. He's as hungry as a bear all day, and he eats ten slices of pizza every night. Now he is sick. Poor Sam!\nTomorrow we're going to stop in Juneau. Mom and I want to go hiking, but Dad wants to stay on the ship and play bingo. I'll be home next Saturday. See you then!\nYour friend,\nEmily"}, {"title": "Part M Reading 3: Newspaper", "en": "Read the article. Choose the correct answer.", "zh": "閱讀新聞報導，選出正確答案", "items": [{"type": "mcq", "prompt": "Who won the three-legged race?", "options": ["Amy Chen", "Lucy Park", "Ben and Tony Wu", "Lucy and her grandma"], "answers": ["Ben and Tony Wu"], "say": "Who won the three-legged race?", "id": 130}, {"type": "mcq", "prompt": "How did Lucy feel last year?", "options": ["discouraged", "full", "proud", "envious"], "answers": ["discouraged"], "say": "How did Lucy feel last year?", "id": 131}, {"type": "mcq", "prompt": "Who helped Lucy every weekend?", "options": ["Sunnyville Weekly", "Amy Chen", "her teacher", "her grandma"], "answers": ["her grandma"], "say": "Who helped Lucy every weekend?", "id": 132}, {"type": "mcq", "prompt": "What kind of cookies did Lucy make this year?", "options": ["peach-and-pineapple", "peanut butter", "chocolate-and-banana", "blueberry"], "answers": ["chocolate-and-banana"], "say": "What kind of cookies did Lucy make this year?", "id": 133}, {"type": "mcq", "prompt": "What is going to be in Lucy's secret recipe?", "options": ["bananas", "brown sugar", "peanut butter", "chocolate"], "answers": ["peanut butter"], "say": "What is going to be in Lucy's secret recipe?", "id": 134}, {"type": "mcq", "prompt": "\"The competition was fierce\" means ___.", "options": ["the food tasted awful", "nobody wanted to win", "the fair was very small", "many people tried very hard to win"], "answers": ["many people tried very hard to win"], "say": "\"The competition was fierce\" means many people tried very hard to win.", "id": 135}, {"type": "mcq", "prompt": "When did Sunnyville Weekly talk to Lucy?", "options": ["every weekend", "after the awards ceremony", "last year", "before the contest"], "answers": ["after the awards ceremony"], "say": "When did Sunnyville Weekly talk to Lucy?", "id": 136}], "passage": "SUNNYVILLE WEEKLY ─ September 12\nCITY FAIR WINNERS\nThe competition was fierce at the Sunnyville City Fair this year. There were more than 15 different contests. Amy Chen, of Maple Town, won the pie-eating contest. Ben and Tony Wu, of Sunnyville, won the three-legged race. Lucy Park, age 11, won the cookie-baking contest. Sunnyville Weekly talked to Lucy after the awards ceremony.\nSW: Lucy, how do you feel?\nLucy: I'm so proud! Last year my cookies came in last place. I was discouraged, but my grandma helped me every weekend.\nSW: What kind of cookies did you make?\nLucy: Chocolate-and-banana cookies. It's my own recipe. Try one!\nSW: Mmm, they taste great! Are you going to enter the contest next year?\nLucy: Yes, I am. I'm going to invent a new recipe. Something with peanut butter… oops! It's a secret."}, {"title": "Part N Reading 4: Soccer", "en": "Read the passage. Choose the answer or complete the summary.", "zh": "閱讀文章，選答案或完成摘要", "items": [{"type": "mcq", "prompt": "How many players are on a soccer team?", "options": ["nine", "four", "two", "eleven"], "answers": ["eleven"], "say": "How many players are on a soccer team?", "id": 137}, {"type": "mcq", "prompt": "Who can catch the ball with his hands?", "options": ["every player", "the batter", "the pitcher", "the goalkeeper"], "answers": ["the goalkeeper"], "say": "Who can catch the ball with his hands?", "id": 138}, {"type": "mcq", "prompt": "When does a team score a point?", "options": ["when a player catches the ball", "when the goalkeeper kicks the ball", "when the ball goes out of the field", "when the ball goes into the goal"], "answers": ["when the ball goes into the goal"], "say": "When does a team score a point?", "id": 139}, {"type": "mcq", "prompt": "\"Each team tries to score the most goals.\" \"Score\" means ___.", "options": ["stop", "throw", "lose", "get points"], "answers": ["get points"], "say": "\"Each team tries to score the most goals.\" \"Score\" means get points.", "id": 140}, {"type": "fill", "prompt": "Summary: Soccer is a ball game for two ___.", "bank": ["teams", "kick", "goalkeeper", "point", "field"], "answers": ["teams"], "say": "Summary: Soccer is a ball game for two teams.", "id": 141}, {"type": "fill", "prompt": "Summary: Players ___ the ball with their feet.", "bank": ["teams", "kick", "goalkeeper", "point", "field"], "answers": ["kick"], "say": "Summary: Players kick the ball with their feet.", "id": 142}, {"type": "fill", "prompt": "Summary: Only the ___ can catch the ball.", "bank": ["teams", "kick", "goalkeeper", "point", "field"], "answers": ["goalkeeper"], "say": "Summary: Only the goalkeeper can catch the ball.", "id": 143}, {"type": "fill", "prompt": "Summary: A team gets one ___ when the ball goes into the goal.", "bank": ["teams", "kick", "goalkeeper", "point", "field"], "answers": ["point"], "say": "Summary: A team gets one point when the ball goes into the goal.", "id": 144}], "passage": "Soccer\nSoccer is a ball game for two teams. There are eleven players on each team. They play on a large field with a goal at each end. Each team tries to score the most goals. Players kick the ball with their feet. Only one player on each team, the goalkeeper, can catch the ball with his hands. The goalkeeper stands in front of the goal and tries to stop the ball. When the ball goes into the goal, the team scores one point. If a player kicks the ball out at the side of the field, a player on the other team throws it back in."}, {"title": "Part O Reading 5: A Traffic Report", "en": "Read the report and the chart. Choose the correct answer.", "zh": "閱讀報告與圖表，選出正確答案", "items": [{"type": "mcq", "prompt": "When did the most bikes pass the park?", "options": ["15:00–18:00", "9:00–12:00", "7:00–9:00", "12:00–15:00"], "answers": ["15:00–18:00"], "say": "When did the most bikes pass the park?", "id": 145}, {"type": "mcq", "prompt": "When did the fewest bikes pass the park?", "options": ["12:00–15:00", "9:00–12:00", "7:00–9:00", "15:00–18:00"], "answers": ["12:00–15:00"], "say": "When did the fewest bikes pass the park?", "id": 146}, {"type": "mcq", "prompt": "How many more bikes passed from 15:00–18:00 than from 7:00–9:00?", "options": ["15", "45", "105", "5"], "answers": ["15"], "say": "How many more bikes passed from 15:00–18:00 than from 7:00–9:00?", "id": 147}, {"type": "mcq", "prompt": "Why were there many bikes in the morning?", "options": ["Parents rode bikes to drop off their children.", "The teacher counted the bikes.", "Parents were coming home from work.", "Students were riding home from school."], "answers": ["Parents rode bikes to drop off their children."], "say": "Why were there many bikes in the morning?", "id": 148}, {"type": "mcq", "prompt": "How long did the students count the bikes?", "options": ["one week", "one month", "one day", "two weeks"], "answers": ["one week"], "say": "How long did the students count the bikes?", "id": 149}], "passage": "Bikes Passing the Park\nThree students did a report on the number of bikes passing the park near their school. They counted the bikes for one week. Here is what they found (average each day):\n 7:00–9:00 ▇▇▇▇▇▇▇▇▇ 45 bikes\n 9:00–12:00 ▇▇▇▇ 20 bikes\n12:00–15:00 ▇▇▇ 15 bikes\n15:00–18:00 ▇▇▇▇▇▇▇▇▇▇▇▇ 60 bikes\nMost of the traffic was in the afternoon, when students were riding home from school. In the morning, many parents rode bikes to drop off their children at school. The teacher thought the report was very interesting."}, {"title": "Part P Writing: Answer in Full Sentences", "en": "Answer the question with the word in ( ). Write a full sentence.", "zh": "依括號提示，用完整句子回答", "items": [{"type": "qa", "prompt": "Ted ate six burgers. Wasn't he full?", "hint": "Yes", "answers": ["Yes, he was."], "say": "Yes, he was.", "id": 150}, {"type": "qa", "prompt": "Aren't you scared when you see a spider?", "hint": "Yes", "answers": ["Yes, I am."], "say": "Yes, I am.", "id": 151}, {"type": "qa", "prompt": "What's your dream vacation?", "hint": "a cruise to Alaska", "answers": ["My dream vacation is a cruise to Alaska.", "It's a cruise to Alaska."], "say": "My dream vacation is a cruise to Alaska.", "id": 152}, {"type": "qa", "prompt": "Which is more comfortable, a couch or a chair?", "hint": "couch", "answers": ["A couch is more comfortable than a chair.", "The couch is more comfortable than the chair.", "A couch is more comfortable."], "say": "A couch is more comfortable than a chair.", "id": 153}, {"type": "qa", "prompt": "How does the soup smell?", "hint": "good", "answers": ["It smells good.", "The soup smells good."], "say": "It smells good.", "id": 154}, {"type": "qa", "prompt": "Who runs the fastest in your class?", "hint": "Jeremy", "answers": ["Jeremy runs the fastest in my class.", "Jeremy runs fastest in my class.", "Jeremy runs the fastest.", "Jeremy does."], "say": "Jeremy runs the fastest in my class.", "id": 155}, {"type": "qa", "prompt": "If you work 16 hours a day, what are you as busy as?", "hint": "a bee", "answers": ["I'm as busy as a bee.", "I am as busy as a bee."], "say": "I'm as busy as a bee.", "id": 156}, {"type": "qa", "prompt": "Is Taipei 101 taller than your school?", "hint": "Yes", "answers": ["Yes, it is.", "Yes, Taipei 101 is taller than my school.", "Yes, it is taller than my school."], "say": "Yes, it is.", "id": 157}, {"type": "qa", "prompt": "What's the best food?", "hint": "pizza", "answers": ["Pizza is the best.", "Pizza is the best food."], "say": "Pizza is the best.", "id": 158}, {"type": "qa", "prompt": "How does your homework seem today?", "hint": "easy", "answers": ["It seems easy.", "My homework seems easy.", "It seems easy today.", "My homework seems easy today."], "say": "It seems easy.", "id": 159}]}]};
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
DATA.groups.forEach(g=>g.items.forEach(x=>{x.group=g.title;x.en=g.en;x.zh=g.zh;if(g.passage)x.passage=g.passage}));
const ALL=DATA.groups.flatMap(g=>g.items);
function norm(s){return String(s).toLowerCase().replace(/[‘’]/g,"'").replace(/[“”"]/g,'')
 .replace(/\bi'm\b/g,'i am').replace(/\bhe's\b/g,'he is').replace(/\bshe's\b/g,'she is').replace(/\bit's\b/g,'it is').replace(/\bthey're\b/g,'they are').replace(/\bwe're\b/g,'we are').replace(/\byou're\b/g,'you are').replace(/\bdoesn't\b/g,'does not').replace(/\bdon't\b/g,'do not').replace(/\bisn't\b/g,'is not').replace(/\baren't\b/g,'are not').replace(/\bwasn't\b/g,'was not').replace(/\bweren't\b/g,'were not').replace(/\bcan't\b/g,'cannot')
 .replace(/[.,!?;]/g,' ').replace(/\s+/g,' ').trim()}
let items=[],idx=0,wrong=new Map(),firstOk=0,done=false,sel=null,built=[];
function renderGroups(){$('#groups').innerHTML='<button class="group-btn all" data-all="1"><b>全部練習 All</b><span>'+ALL.length+' 題｜依原題順序</span></button>'+DATA.groups.map((g,i)=>'<button class="group-btn" data-i="'+i+'"><b>'+esc(g.title)+'</b><span>'+g.items.length+' 題｜Q'+g.items[0].id+'–'+g.items[g.items.length-1].id+'</span></button>').join('');
 document.querySelectorAll('.group-btn').forEach(b=>b.onclick=()=>start(b.dataset.all?ALL:DATA.groups[b.dataset.i].items))}
function start(list){items=list;idx=0;wrong=new Map();firstOk=0;$('#select').classList.add('hidden');$('#result').classList.add('hidden');$('#quiz').classList.remove('hidden');show()}
function show(){speechSynthesis&&speechSynthesis.cancel();const x=items[idx];done=false;sel=null;built=[];x.tries=0;
 $('#meta').textContent=x.group+'｜第 '+(idx+1)+' / '+items.length+' 題（Q'+x.id+'）';$('#wrongCount').textContent='答錯 '+wrong.size+' 題';$('#bar').style.width=(idx/items.length*100)+'%';
 $('#instr').textContent=x.en+'（'+x.zh+'）';$('#feedback').className='feedback hidden';$('#next').classList.add('hidden');$('#speak').classList.add('hidden');$('#check').classList.remove('hidden');
 let h='';
 if(x.type==='fill'){h='<div class="bank">'+x.bank.map(w=>'<button class="chip">'+esc(w)+'</button>').join('')+'</div><div class="prompt">'+esc(x.prompt).replace('___','<span class="blank" id="blankShow">?</span>')+(x.hint?' <span class="hint">'+esc(x.hint)+'</span>':'')+'</div><input class="answer" id="ans" placeholder="'+(x.bank.length?'Type or tap a word 輸入或點選單字':'Type the word 輸入單字')+'" autocomplete="off">'}
 else if(x.type==='mcq'){h='<div class="prompt">'+esc(x.prompt).replace('___','<span class="blank">?</span>')+'</div><div class="opts">'+x.options.map((o,i)=>'<button class="opt" data-i="'+i+'">('+'ABCD'[i]+') '+esc(o)+'</button>').join('')+'</div>'}
 else if(x.type==='order'){x.shuf=x.shuf||x.tiles.map((t,i)=>i);h='<div class="prompt">Tap the words in order. 依序點選</div><div class="built" id="built"></div><div class="tiles" id="tiles"></div><div class="row"><button class="btn gray" id="clear">↺ 重來</button></div>'}
 else{h='<div class="prompt">Q: '+esc(x.prompt)+' <span class="hint">('+esc(x.hint)+')</span></div><input class="answer" id="ans" placeholder="A: Type a full sentence 寫完整句子" autocomplete="off">'}
 if(x.passage)h='<div class="passage">'+esc(x.passage)+'</div>'+h;$('#area').innerHTML=h;
 if(x.type==='fill'){const a=$('#ans');const upd=()=>{$('#blankShow').textContent=a.value||'?'};a.oninput=upd;document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{if(done)return;a.value=c.textContent;upd()});a.focus()}
 if(x.type==='mcq')document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(done)return;document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));b.classList.add('sel');sel=+b.dataset.i});
 if(x.type==='order'){renderTiles();$('#clear').onclick=()=>{if(done)return;built=[];renderTiles()}}
 if(x.type==='qa')$('#ans').focus();
 const a=$('#ans');if(a)a.onkeydown=e=>{if(e.key==='Enter'){done?$('#next').click():$('#check').click()}}}
function renderTiles(){const x=items[idx];$('#built').innerHTML=built.map((i,k)=>'<button class="tile" data-k="'+k+'">'+esc(x.tiles[i])+'</button>').join('');
 $('#tiles').innerHTML=x.tiles.map((t,i)=>built.includes(i)?'':'<button class="tile" data-i="'+i+'">'+esc(t)+'</button>').join('');
 document.querySelectorAll('#tiles .tile').forEach(b=>b.onclick=()=>{if(done)return;built.push(+b.dataset.i);renderTiles()});
 document.querySelectorAll('#built .tile').forEach(b=>b.onclick=()=>{if(done)return;built.splice(+b.dataset.k,1);renderTiles()})}
function value(){const x=items[idx];if(x.type==='mcq')return sel==null?'':x.options[sel];if(x.type==='order'){if(built.length<x.tiles.length)return '';return built.map(i=>x.tiles[i]).join(' ').replace(/\s+([.?])/g,'$1')}return $('#ans').value.trim()}
$('#check').onclick=()=>{if(done)return;const x=items[idx];const v=value();if(!v){alert(x.type==='order'?'請把所有字詞都排上去。':'請先作答。');return}
 const ok=x.answers.some(a=>norm(a)===norm(v));x.tries++;const fb=$('#feedback');
 if(ok){done=true;if(x.tries===1&&!wrong.has(x.id))firstOk++;fb.className='feedback ok';fb.textContent='✅ Correct! 答對了！'+(x.type==='qa'||x.type==='order'?'\n'+x.answers[0]:'');
  if(x.type==='mcq')document.querySelector('.opt[data-i="'+sel+'"]').classList.add('right');
  $('#check').classList.add('hidden');$('#next').classList.remove('hidden');$('#speak').classList.remove('hidden');speak();$('#next').focus()}
 else{if(!wrong.has(x.id))wrong.set(x.id,{x,tries:[]});wrong.get(x.id).tries.push(v);$('#wrongCount').textContent='答錯 '+wrong.size+' 題';fb.className='feedback bad';
  if(x.tries>=2){fb.textContent='❌ 正確答案：'+x.answers.join('  /  ')+'\n請照著正確答案再做一次。'}else fb.textContent='❌ Try again! 再試一次！';
  if(x.type==='mcq')document.querySelector('.opt[data-i="'+sel+'"]').classList.add('wrong')}};
function speak(){const x=items[idx];if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(x.say);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}
$('#speak').onclick=speak;
$('#next').onclick=()=>{idx++;idx>=items.length?finish():show()};
function finish(){$('#bar').style.width='100%';$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');
 $('#summary').innerHTML='<div class="stat">題數<b>'+items.length+'</b></div><div class="stat">一次答對<b>'+firstOk+'</b></div><div class="stat">答錯過<b>'+wrong.size+'</b></div><div class="stat">得分<b>'+Math.round(firstOk/items.length*100)+'</b></div>';
 $('#wlist').innerHTML=wrong.size?'<h3>錯題回顧 Review</h3>'+[...wrong.values()].map(w=>'<div class="witem"><small>Q'+w.x.id+'｜'+esc(w.x.group)+'</small><div>'+esc(w.x.type==='order'?w.x.tiles.join(' / '):w.x.prompt)+(w.x.hint?' ('+esc(w.x.hint)+')':'')+'</div><div class="y">你的答案：'+esc(w.tries.join('｜'))+'</div><div class="a">正確答案：'+esc(w.x.answers.join(' / '))+'</div></div>').join(''):'<p>全部一次答對，太棒了！🌟</p>';
 $('#redo').classList.toggle('hidden',!wrong.size)}
$('#redo').onclick=()=>start([...wrong.values()].map(w=>w.x));
$('#menu').onclick=$('#back').onclick=()=>{speechSynthesis&&speechSynthesis.cancel();$('#quiz').classList.add('hidden');$('#result').classList.add('hidden');$('#select').classList.remove('hidden')};
renderGroups();
</script></body></html>
