<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="龍騰普高 B3U4 整句式翻譯互動練習"><title>龍騰普高 B3U4 整句式翻譯</title><style>:root{--blue:#2563eb;--navy:#1e3a8a;--bg:#f4f7fb;--card:#fff;--line:#dbe3ee;--ink:#172033;--muted:#64748b;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--voice:#6d28d9;--voicebg:#f5f3ff;--amber:#9a3412;--amberbg:#fff7ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}.wrap{max-width:920px;margin:auto;padding:16px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 5px 18px #0f172a0d}.hero{background:linear-gradient(135deg,#e8f1ff,#fff)}h1{margin:0 0 6px;font-size:clamp(25px,4vw,38px)}h2{margin-top:0}.note{color:var(--muted)}.hidden{display:none!important}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.btn{border:0;border-radius:10px;padding:11px 17px;font:800 16px inherit;cursor:pointer;background:#e5e7eb;color:var(--ink);text-decoration:none}.primary{background:var(--blue);color:#fff}.danger{background:#991b1b;color:#fff}.voice{background:var(--voice);color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.btn:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.pick{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin:7px 0;background:#fafcff}.pick input{margin-right:8px;width:17px;height:17px;accent-color:var(--blue)}#list{max-height:440px;overflow:auto;border:1px solid var(--line);padding:7px;border-radius:12px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:800;margin:8px 0 14px}.zh{padding:10px 13px;background:var(--amberbg);border-radius:9px;color:var(--amber);font-weight:800;margin-bottom:10px}.question{font-size:21px;font-weight:750;padding:16px;background:#f8fafc;border-radius:11px;white-space:pre-wrap}.options{display:grid;gap:9px;margin:14px 0}.option{display:flex;align-items:center;gap:11px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-size:18px;font-weight:750;cursor:pointer}.option:hover{border-color:#60a5fa;background:#eff6ff}.option:has(input:checked){border-color:var(--blue);background:#dbeafe;color:var(--navy)}.option input{width:20px;height:20px;accent-color:var(--blue)}.inputs{display:grid;gap:10px;margin:15px 0}.answer-row{display:grid;grid-template-columns:55px 1fr;gap:10px;align-items:center}.answer-row label{font-weight:900;color:var(--navy);text-align:center}.spell{width:100%;font:inherit;font-size:18px;padding:11px;border:2px solid #94a3b8;border-radius:9px}.feedback{padding:13px;border-radius:10px;font-weight:800;margin:13px 0}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.explain{font-weight:500;margin-top:7px}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:var(--voicebg);margin:13px 0}.voicebox b{display:block;font-size:19px;margin-bottom:8px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}.wrong p{margin:6px 0}.source{font-size:13px;color:var(--muted)}@media(max-width:600px){.wrap{padding:9px}.hero,.card{padding:15px}.question{font-size:18px;padding:13px}.option{font-size:17px}.answer-row{grid-template-columns:42px 1fr}.meta{display:block}}</style><link rel="stylesheet" href="longteng-vocab-required-pronunciation.css?v=20261026-4"></head><body><main class="wrap"><section class="hero"><h1>龍騰普高 B3U4 整句式翻譯</h1><p>共 25 題。輸入完整英文句；系統會以關鍵語意、句型與文法結構彈性判定，答錯後請重新作答。</p><p class="note">答對後顯示解析卷參考答案並播放完整英文句；STT 朗讀達 80% 才能進入下一題。完成後可重做錯題並下載 DOCX。</p><div class="toolbar"><a class="btn" href="dashboard.html">← 回測驗總覽</a></div></section><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn">全部選取</button><button id="none" class="btn">全部取消</button><button id="rand20" class="btn">隨機 20 題</button></div><label><input id="shuffle" type="checkbox"> 打亂出題順序</label><div id="list"></div><div class="actions"><button id="start" class="btn primary">開始作答</button><span id="picked" class="note"></span></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="voiceBox" class="voicebox hidden"><b id="voiceTarget"></b><button id="speak" class="btn voice">🔊 再聽一次</button></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="retry" class="btn primary">只重做錯題</button><button id="download" class="btn">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></main><script>const TITLE="龍騰普高 B3U4 整句式翻譯",MODE="spell",Q=[{"id":1,"zh":"我在一個人們仁慈又友善的小村莊長大。（...where...）","question":"________________________________________","answers":["I grew up in a small village where people are kind and friendly."],"accepted":["I grew up in a small village where people are kind and friendly."],"reference":"I grew up in a small village where people are kind and friendly.","explanation":"此題用形容詞子句來修飾先行詞a small village","source":"龍騰自命題"},{"id":2,"zh":"我們直到上週五才知道事實。(We...till....)","question":"________________________________________","answers":["We didn't know the truth till last Friday."],"accepted":["We didn't know the truth till last Friday."],"reference":"We didn’t know the truth till last Friday.","explanation":"","source":"三合一學習手冊"},{"id":3,"zh":"聽說Steve上週四已經搬到臺南了。(Steve....)","question":"________________________________________","answers":["Steve is said to have moved to Tainan last Thursday."],"accepted":["Steve is said to have moved to Tainan last Thursday."],"reference":"Steve is said to have moved to Tainan last Thursday.","explanation":"","source":"三合一學習手冊"},{"id":4,"zh":"Tina寧願餓死也不要在那家餐廳吃飯。(...would...rather than....)","question":"________________________________________","answers":["Tina would starve to death rather than dine at that restaurant."],"accepted":["Tina would starve to death rather than dine at that restaurant."],"reference":"Tina would starve to death rather than dine at that restaurant.","explanation":"","source":"三合一學習手冊"},{"id":5,"zh":"Jessica想在一個有許多國際學生的大學讀書。","question":"________________________________________","answers":["Jessica would like to study at a university where there are many international students."],"accepted":["Jessica would like to study at a university where there are many international students."],"reference":"Jessica would like to study at a university where there are many international students.","explanation":"","source":"三合一學習手冊"},{"id":6,"zh":"你已工作六小時了。何不聽些音樂並放鬆一下？(....Why not....)","question":"________________________________________","answers":["You have been working for six hours. Why not listen to some music and relax?"],"accepted":["You have been working for six hours. Why not listen to some music and relax?"],"reference":"You have been working for six hours. Why not listen to some music and relax?","explanation":"","source":"三合一學習手冊"},{"id":7,"zh":"許多人直到失去良好健康後才了解它的重要性。(...not...till....)","question":"________________________________________","answers":["Many people don't realize the importance of good health till they lose it."],"accepted":["Many people don't realize the importance of good health till they lose it."],"reference":"Many people don’t realize the importance of good health till they lose it.","explanation":"","source":"三合一學習手冊"},{"id":8,"zh":"何不在傳統市場購買水果與蔬菜呢？","question":"________________________________________","answers":["Why not purchase fruit and vegetables in traditional markets?"],"accepted":["Why not purchase fruit and vegetables in traditional markets?","Why not buy fruit and vegetables in traditional markets?"],"reference":"Why not purchase/buy fruit and vegetables in traditional markets?","explanation":"","source":"三合一學習手冊"},{"id":9,"zh":"我寧可事先準備考試也不願事後遺憾。(would...rather than...)","question":"________________________________________","answers":["I would prepare for an exam in advance rather than feel sorry about it later."],"accepted":["I would prepare for an exam in advance rather than feel sorry about it later.","I would prepare for an exam in advance rather than feel sorry regret it later."],"reference":"I would prepare for an exam in advance rather than feel sorry about/regret it later.","explanation":"","source":"All in One"},{"id":10,"zh":"智慧型手機被認為是一個必需品而不是一個昂貴的奢侈品（luxury）。","question":"________________________________________","answers":["Smartphones are thought to be a necessity rather than an expensive luxury."],"accepted":["Smartphones are thought to be a necessity rather than an expensive luxury."],"reference":"Smartphones are thought to be a necessity rather than an expensive luxury.","explanation":"","source":"三合一學習手冊"},{"id":11,"zh":"據說那老房子會發出一種讓人們毛骨悚然的奇怪聲音。(The old house....)","question":"________________________________________","answers":["The old house is said to make a strange sound that makes people's hair stand on end."],"accepted":["The old house is said to make a strange sound that makes people's hair stand on end."],"reference":"The old house is said to make a strange sound that makes people’s hair stand on end.","explanation":"","source":"All in One"},{"id":12,"zh":"Bill被相信是這個國家裡最有錢的人。（S + be + believed + to VR/have + p.p.....）","question":"________________________________________","answers":["Bill is believed to be the wealthiest person in this country."],"accepted":["Bill is believed to be the wealthiest person in this country."],"reference":"Bill is believed to be the wealthiest person in this country.","explanation":"此題考S + be + thought/said/believed + to VR/have + p.p.....的句型，句子所提到的為當下的事實，故is believed後面用to VR","source":"龍騰自命題"},{"id":13,"zh":"Linda為了昨天的派對盛裝穿著公主的服裝。","question":"________________________________________","answers":["Linda dressed up in a princess costume for the party yesterday."],"accepted":["Linda dressed up in a princess costume for the party yesterday."],"reference":"Linda dressed up in a princess costume for the party yesterday.","explanation":"「dress up in + 衣服／顏色」表「盛裝穿著……；打扮為……」","source":"龍騰自命題"},{"id":14,"zh":"那些對人生有正面態度的人不會如此輕易地失去希望。","question":"________________________________________","answers":["Those who have a positive attitude to life don't lose hope so easily."],"accepted":["Those who have a positive attitude to life don't lose hope so easily."],"reference":"Those who have a positive attitude to life don’t lose hope so easily.","explanation":"those who...……的那些人","source":"龍騰自命題"},{"id":15,"zh":"面對這麼固執的人，我寧可不理他也不想浪費時間說服他改變心意。（would rather...than...）","question":"________________________________________","answers":["Facing such a stubborn man, I would rather ignore him than waste time persuading him to change his mind."],"accepted":["Facing such a stubborn man, I would rather ignore him than waste time persuading him to change his mind."],"reference":"Facing such a stubborn man, I would rather ignore him than waste time persuading him to change his mind.","explanation":"此題考的是S + would rather...than...，would rather和than後面都要用原形動詞。stubborn 固執的；persuade sb. to VR 說服某人做……","source":"龍騰自命題"},{"id":16,"zh":"Tina永遠都不會忘記她丈夫日落時在海灘上向她求婚的那一天。（...when...）","question":"________________________________________","answers":["Tina will never forget the day when her husband proposed to her on the beach at sunset."],"accepted":["Tina will never forget the day when her husband proposed to her on the beach at sunset."],"reference":"Tina will never forget the day when her husband proposed to her on the beach at sunset.","explanation":"此題用形容詞子句來修飾先行詞the day，而the day表時間，故用關係副詞when來引導形容詞子句","source":"龍騰自命題"},{"id":17,"zh":"在這麼冷的天，我寧可待在家也不願出門逛街。（would rather...than...）","question":"________________________________________","answers":["I would rather stay home than go shopping on such a cold day."],"accepted":["I would rather stay home than go shopping on such a cold day."],"reference":"I would rather stay home than go shopping on such a cold day.","explanation":"此題考的是S + would rather...than...，would rather和than後面都要用原形動詞","source":"龍騰自命題"},{"id":18,"zh":"Sandy被認為是位友善的人，因為她總是面帶微笑。（S + be + thought + to VR/have + p.p.....）","question":"________________________________________","answers":["Sandy is thought to be a friendly person because she always wears a smile."],"accepted":["Sandy is thought to be a friendly person because she always wears a smile."],"reference":"Sandy is thought to be a friendly person because she always wears a smile.","explanation":"此題考S + be + thought/said/believed + to VR/have + p.p.....的句型，句子所提到的為當下的事實，故is thought後面用to VR","source":"龍騰自命題"},{"id":19,"zh":"高大、強壯且技巧熟練，Andy被選為籃球校隊。（Adj., S + V....）","question":"________________________________________","answers":["Tall, strong, and skillful, Andy was selected for the school basketball team."],"accepted":["Tall, strong, and skillful, Andy was selected for the school basketball team."],"reference":"Tall, strong, and skillful, Andy was selected for the school basketball team.","explanation":"此題考Adj., S + V....的分詞構句，省略being，僅留下形容詞","source":"龍騰自命題"},{"id":20,"zh":"因為正在下雨，我想我會搭計程車而不是等公車來。（would...rather than...）","question":"________________________________________","answers":["Since it's raining, I think I would take a taxi rather than wait for the bus."],"accepted":["Since it's raining, I think I would take a taxi rather than wait for the bus."],"reference":"Since it’s raining, I think I would take a taxi rather than wait for the bus.","explanation":"此題考的是S + would...rather than...， rather than前後連接對等的詞組。因would後接原形動詞，故rather than後面也要用原形動詞","source":"龍騰自命題"},{"id":21,"zh":"站在舞臺上的歌手邀請所有的粉絲跟他一起唱。","question":"________________________________________","answers":["The singer standing on the stage invited all his fans to sing along with him."],"accepted":["The singer standing on the stage invited all his fans to sing along with him."],"reference":"The singer standing on the stage invited all his fans to sing along with him.","explanation":"invite + sb. + to VR邀請某人做……","source":"龍騰自命題"},{"id":22,"zh":"Peter今晚選擇在家看電視而不是去看電影。（instead of）","question":"________________________________________","answers":["Peter chose to watch TV at home instead of going to a movie tonight."],"accepted":["Peter chose to watch TV at home instead of going to a movie tonight."],"reference":"Peter chose to watch TV at home instead of going to a movie tonight.","explanation":"instead of為介系詞片語，後面要用V-ing","source":"龍騰自命題"},{"id":23,"zh":"雖然Emily已經十年沒有見過William了，但她馬上就認出了他。","question":"________________________________________","answers":["Although Emily hadn't seen William for ten years, she recognized him right away."],"accepted":["Although Emily hadn't seen William for ten years, she recognized him right away."],"reference":"Although Emily hadn’t seen William for ten years, she recognized him right away.","explanation":"recognize 認出","source":"龍騰自命題"},{"id":24,"zh":"這位有名的女演員據說在去年捐了一千萬元給一家醫院以資助癌症研究。（S + be + said + to VR/have + p.p.....）","question":"________________________________________","answers":["The famous actress is said to have donated ten million dollars to a hospital to support cancer research last year."],"accepted":["The famous actress is said to have donated ten million dollars to a hospital to support cancer research last year."],"reference":"The famous actress is said to have donated ten million dollars to a hospital to support cancer research last year.","explanation":"此題考S + be + thought/said/believed + to VR/have + p.p.....的句型，句子所述為已經發生過的事，故is said後面用to have p.p.","source":"龍騰自命題"},{"id":25,"zh":"老師提供的指導對學生非常有幫助。（N(,) + V-ing/p.p....）","question":"________________________________________","answers":["The instructions provided by the teacher were very helpful for the students."],"accepted":["The instructions provided by the teacher were very helpful for the students."],"reference":"The instructions provided by the teacher were very helpful for the students.","explanation":"此題考由形容詞子句簡化而來的分詞片語，省略which were，僅留下provided。","source":"龍騰自命題"}];const $=s=>document.querySelector(s),list=$('#list'),select=$('#select'),quiz=$('#quiz'),result=$('#result'),question=$('#question'),answerArea=$('#answerArea'),feedback=$('#feedback'),next=$('#next');let chosen=[],idx=0,mode='first';const wrong=new Map(),correct=new Set();const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ');const shuffled=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function renderList(){list.innerHTML=Q.map(q=>'<label class="pick"><input class="pickbox" type="checkbox" value="'+q.id+'" checked><b>第 '+q.id+' 題</b> <span class="source">'+esc(q.source||'')+'</span></label>').join('');count()}function count(){$('#picked').textContent='已選 '+document.querySelectorAll('.pickbox:checked').length+' 題'}list.addEventListener('change',count);$('#all').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=true);count n q.reference||q.answers[0]}function words(s){return norm(s).replace(/\b(can't|cannot)\b/g,'can not').replace(/\b(won't)\b/g,'will not').replace(/n't\b/g,' not').replace(/'m\b/g,' am').replace(/'re\b/g,' are').replace(/'s\b/g,' is').replace(/'ve\b/g,' have').replace(/'d\b/g,' would').replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean)}function distance(a,b){const r=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let d=r[0];r[0]=i;for(let j=1;j<=b.length;j++){const old=r[j];r[j]=Math.min(r[j]+1,r[j-1]+1,d+(a[i-1]===b[j-1]?0:1));d=old}}return r[b.length]}function overlap(a,b){const pool=b.slice();let hit=0;a.forEach(x=>{let i=pool.indexOf(x);if(i>=0){hit++;pool.splice(i,1)}});return a.length?hit/a.length:0}function sentenceMatch(input,ref){const a=words(input),b=words(ref);if(!a.length||!b.length)return false;if(a.join(' ')==b.join(' '))return true;const seq=1-distance(a,b)/Math.max(a.length,b.length);const stop=new Set('a an the and or but so to of in on at for from with by as than that this these those it its is are was were be been being do does did have has had will would can could should may might must not no'.split(' '));const bc=b.filter(x=>!stop.has(x)),ac=a.filter(x=>!stop.has(x));const content=overlap(bc,ac),structure=overlap(b.filter(x=>stop.has(x)),a.filter(x=>stop.has(x))),ratio=a.length/b.length;const hasVerb=a.some(x=>/^(am|is|are|was|were|be|been|being|do|does|did|have|has|had|can|could|will|would|shall|should|may|might|must)$/.test(x)||/(ed|ing|en|es|s)$/.test(x));return seq>=.86||(content>=.82&&structure>=.68&&ratio>=.72&&ratio<=1.35&&hasVerb)}function isCorrect(q,a){return (q.accepted||q.answers).some(ref=>sentenceMatch(a[0],ref))}function completedSentence(q){if(MODE==='mcq'){let s=q.question,v=q.options[q.answer],parts=(s.match(/_{3,}/g)||[]).length>1&&v.includes(';')?v.split(';').map(x=>x.trim()):[v];parts.forEach(x=>s=s.replace(/_{3,}/,x));return s}if(MODE==='spell')return q.question.replace(/[A-Za-z]?_{3,}[A-Za-z]?/,q.
