const TITLE="翰林 Book 6 Unit 3 文法選擇",KIND="mcq",Q=[{"id": 1, "stem": "(   ) When Jack’s mom entered the room, Jack ______ with friends on the Net.", "options": ["talked", "was talking", "talks", "will talk"], "answer": 1, "explanation": "當 Jack 的媽媽進房時，Jack 正在和朋友在線上閒聊。用過去進行式，表示正在進行的動作。", "full": "When Jack’s mom entered the room, Jack was talking with friends on the Net.", "src": 1}, {"id": 2, "stem": "(   ) If you don’t know the meanings of the word, why not ______ them ______ in the dictionary?", "options": ["pick; up", "point; out", "look; up", "take; away"], "answer": 2, "explanation": "不知道那字的語意，何不在字典「查閱」一下呢？", "full": "If you don’t know the meanings of the word, why not look them up in the dictionary?", "src": 2}, {"id": 3, "stem": "(   ) Dad got home while Mom ______ dinner.", "options": ["was cooked", "has cooked", "was cooking", "would cook"], "answer": 2, "explanation": "while 引導的副詞子句動詞通常用「過去進行式」。", "full": "Dad got home while Mom was cooking dinner.", "src": 3}, {"id": 4, "stem": "(   ) ______ Jeff knows watching too much TV is not good for his eyes, he still can’t live without it.", "options": ["Although", "Because", "As soon as", "If"], "answer": 0, "explanation": "「雖然」Jeff 知道看太多電視對眼睛不好，他仍然沒有它就活不下去。", "full": "Although Jeff knows watching too much TV is not good for his eyes, he still can’t live without it.", "src": 4}, {"id": 5, "stem": "(   ) Dad was reading in the living room while Mom ______ in the kitchen.", "options": ["was cooking", "cooks", "cooked", "will cook"], "answer": 0, "explanation": "while（當…時）接「過去進行式」。", "full": "Dad was reading in the living room while Mom was cooking in the kitchen.", "src": 5}, {"id": 6, "stem": "(   ) ______ you don’t have time for dinner tonight, perhaps we can just have a quick drink together.〔111.會考補考〕", "options": ["Before", "If", "Until", "When"], "answer": 1, "explanation": "「如果」你今晚沒空吃晚餐，也許我們可以一起喝杯飲料，故選(Ｂ)。(Ａ)在…之前(Ｃ)直到(Ｄ)當…時。", "full": "If you don’t have time for dinner tonight, perhaps we can just have a quick drink together.", "src": 6}, {"id": 7, "stem": "(   ) It is dangerous to use a cellphone up in a plane. So remember to ______ before you get on the plane.〔112.會考陸考〕", "options": ["find it out", "turn it off", "put it down", "give it up"], "answer": 1, "explanation": "前句提到在飛機上使用手機不安全，推知後句是「關掉」手機，所以選(Ｂ)關掉它。(Ａ)找到它(Ｂ)關掉它(Ｃ)放下它(Ｄ)放棄它。", "full": "It is dangerous to use a cellphone up in a plane. So remember to turn it off before you get on the plane.", "src": 7}, {"id": 8, "stem": "(   ) ______ she went to bed, she drank a glass of milk.", "options": ["After", "Although", "If", "Before"], "answer": 3, "explanation": "上床睡覺「之前」，她喝了一杯牛奶。", "full": "Before she went to bed, she drank a glass of milk.", "src": 8}, {"id": 9, "stem": "(   ) My cousin ______ in Japan for more than ten years since she studied there.", "options": ["will live", "lives", "has lived", "lived"], "answer": 2, "explanation": "have / has＋Vp.p....＋for＋一段時間。", "full": "My cousin has lived in Japan for more than ten years since she studied there.", "src": 9}, {"id": 10, "stem": "(   ) Sam didn’t know how to do the math homework ______ he asked Ann for help.", "options": ["if", "while", "since", "until"], "answer": 3, "explanation": "正確答案：until", "full": "Sam didn’t know how to do the math homework until he asked Ann for help.", "src": 10}, {"id": 11, "stem": "(   ) ______ it was raining hard, ______ they still got to school on time.", "options": ["Though; ×", "Although; but", "Because; ×", "Because; so"], "answer": 0, "explanation": "從屬連接詞 Although / Though，不可與對等連接詞 but 合用。", "full": "Though it was raining hard, they still got to school on time.", "src": 11}, {"id": 12, "stem": "(   ) A ball rolled over to her ______ under the tree.", "options": ["when reading", "while she was reading", "until she could read", "since she read"], "answer": 1, "explanation": "主要句子主詞是 A ball，附屬子句主詞是 she，須各自出現，因此選項(Ａ)須改成 when she was reading 方為正解。", "full": "A ball rolled over to her while she was reading under the tree.", "src": 12}, {"id": 13, "stem": "(   ) ______ Annie knows fast food is not good for her health, she still eats it.〔102.基測〕", "options": ["Although", "Because", "If", "When"], "answer": 0, "explanation": "「雖然」Annie 知道速食對她的健康不好，她仍然繼續吃。", "full": "Although Annie knows fast food is not good for her health, she still eats it.", "src": 13}, {"id": 14, "stem": "(   ) Todd is important to his family ______ they count on him to make money.", "options": ["if", "because", "while", "though"], "answer": 1, "explanation": "because＋原因。", "full": "Todd is important to his family because they count on him to make money.", "src": 14}, {"id": 15, "stem": "(   ) Neil didn’t go to bed ______ 11:30 p.m. last night because he had a lot of homework.", "options": ["when", "until", "though", "since"], "answer": 1, "explanation": "not... until...：直到…才…。", "full": "Neil didn’t go to bed until 11:30 p.m. last night because he had a lot of homework.", "src": 15}, {"id": 16, "stem": "(   ) Carol entered the pet shop ______ the shopkeeper ______ the cages.（籠子）", "options": ["while; was cleaning", "before; cleans", "when; would clean", "after; has cleaned"], "answer": 0, "explanation": "選項(Ｂ)用 before 是連接「後發生的動作」，須把「現在簡單式」改成「過去簡單式」；選項(Ｄ)用 after 是連接「先發生的動作」，不會用到「現在完成式」。", "full": "Carol entered the pet shop while the shopkeeper was cleaning the cages.", "src": 16}, {"id": 17, "stem": "(   ) ______ I forgot to bring my umbrella, ______ I ran back home in the rain.", "options": ["Although; ×", "Though; but", "Because; ×", "Because; so"], "answer": 2, "explanation": "從屬連接詞 Because，不可與對等連接詞 so 合用。", "full": "Because I forgot to bring my umbrella, I ran back home in the rain.", "src": 17}, {"id": 18, "stem": "(   ) Judy hasn’t seen her cousins ______ they moved to Taipei, so she is excited to see them next week.", "options": ["if", "when", "after", "since"], "answer": 3, "explanation": "正確答案：since", "full": "Judy hasn’t seen her cousins since they moved to Taipei, so she is excited to see them next week.", "src": 18}, {"id": 19, "stem": "(   ) If nobody ______ the puppy after 7 days, he ______ her.", "options": ["will take away; will keep", "took away; kept", "takes away; will keep", "has taken away; would keep"], "answer": 2, "explanation": "If（如果）引導的「副詞子句」，須用「現在式」代替「未來式」，而主要句子動詞仍用「未來式」。", "full": "If nobody takes away the puppy after 7 days, he will keep her.", "src": 19}, {"id": 20, "stem": "(   ) Mrs.\nLu: Robert, will you still study in the library this evening?\nRobert: Yeah. I think I’ll study ______ nine.\nMrs.\nLu: OK. I’ll go pick you up, so just wait in front of it.", "options": ["at", "for", "until", "since"], "answer": 2, "explanation": "今晚 Robert 會在圖書館讀書「直到」9：00，他媽媽會去接他。", "full": "Mrs. Lu: Robert, will you still study in the library this evening? Robert: Yeah. I think I’ll study until nine. Mrs. Lu: OK. I’ll go pick you up, so just wait in front of it.", "src": 20}, {"id": 21, "stem": "(   ) When Dad ______ home, Mom ______ in the study.", "options": ["was getting; read", "got; was reading", "got; is reading", "gets; would read"], "answer": 1, "explanation": "爸爸「到」家時，用「過去簡單式」，媽媽「正」在書房「看書」，用「過去進行式」。選項(Ｄ)須把 would 改成 will。", "full": "When Dad got home, Mom was reading in the study.", "src": 21}, {"id": 22, "stem": "(   ) While Mom ______ dinner, Dad rang the doorbell.", "options": ["cooked", "cooks", "was cooking", "would cook"], "answer": 2, "explanation": "正當媽媽「在煮」晚餐時，爸爸按門鈴了。強調過去正在做的動作，用「過去進行式」。", "full": "While Mom was cooking dinner, Dad rang the doorbell.", "src": 22}, {"id": 23, "stem": "(   ) Jeff entered the pet shop while the shopkeeper ______ a cute puppy a bath.", "options": ["was giving", "has given", "was given", "was going to give"], "answer": 0, "explanation": "當店主「正在給」一隻可愛的幼犬洗澡時，Jeff 進入寵物店。", "full": "Jeff entered the pet shop while the shopkeeper was giving a cute puppy a bath.", "src": 23}, {"id": 24, "stem": "(   ) Dad was watering the flowers and the plants in the garden when he ______ a loud noise.", "options": ["will hear", "heard", "hearing", "to hear"], "answer": 1, "explanation": "爸爸「聽到」很大聲的吵雜聲時，他正在花園裡澆花和植物，用「過去簡單式」作答。選項(Ｃ)須把其前的 he 去掉。", "full": "Dad was watering the flowers and the plants in the garden when he heard a loud noise.", "src": 24}, {"id": 25, "stem": "(   ) Lisa ______ the dishes when her son hugged her from behind.", "options": ["has done", "would do", "did", "was doing"], "answer": 3, "explanation": "當 Lisa 的兒子從後面抱住她時，她「正在洗」碗盤，用「過去進行式」。", "full": "Lisa was doing the dishes when her son hugged her from behind.", "src": 25}, {"id": 26, "stem": "(   ) Alice ______ the Net when her little baby fell off the bed.", "options": ["surfed", "has surfed", "is going to surf", "was surfing"], "answer": 3, "explanation": "Alice 的小嬰兒從床上跌下時，她「正在上網」，用「過去進行式」。", "full": "Alice was surfing the Net when her little baby fell off the bed.", "src": 26}, {"id": 27, "stem": "(   ) Tonight Dad will stay at the office ______ he finishes the work.", "options": ["as long as", "as soon as", "though", "until"], "answer": 3, "explanation": "今晚爸爸會待在辦公室「直到」他做完工作。", "full": "Tonight Dad will stay at the office until he finishes the work.", "src": 27}, {"id": 28, "stem": "(   ) Jeremy adopted（領養）the dog ______ he looked like his lost dog.", "options": ["so", "though", "because", "but"], "answer": 2, "explanation": "Jeremy 領養了那隻狗「因為」他看起來很像他遺失的狗。", "full": "Jeremy adopted the dog because he looked like his lost dog.", "src": 28}, {"id": 29, "stem": "(   ) They still went hiking ______ the wind blew really hard.", "options": ["although", "but", "because", "so"], "answer": 0, "explanation": "「雖然」風吹得相當強勁，他們仍然去健行。", "full": "They still went hiking although the wind blew really hard.", "src": 29}, {"id": 30, "stem": "(   ) ______ the vet（獸醫）was checking the dog, her cellphone rang.", "options": ["If", "After", "Before", "When"], "answer": 3, "explanation": "「當」獸醫正在檢查狗狗時，她的手機響了。", "full": "When the vet was checking the dog, her cellphone rang.", "src": 30}, {"id": 31, "stem": "(   ) Let’s keep waiting ______ the sun rises from behind the mountains.", "options": ["because", "until", "though", "if"], "answer": 1, "explanation": "我們一直等候「直到」太陽從山的後方上升起來吧。", "full": "Let’s keep waiting until the sun rises from behind the mountains.", "src": 31}, {"id": 32, "stem": "(   ) Emma was surfing the Net ______ Daniel was making some cards.", "options": ["if", "though", "while", "since"], "answer": 2, "explanation": "while 連接兩個過去進行式的句子。", "full": "Emma was surfing the Net while Daniel was making some cards.", "src": 32}, {"id": 33, "stem": "(   ) Jimmy adopted（領養）the dog ______ it did not look like his lost dog.", "options": ["though", "if", ", so", "because"], "answer": 0, "explanation": "Jimmy 領養了那隻狗「雖然」牠看起來不像他遺失的狗。", "full": "Jimmy adopted the dog though it did not look like his lost dog.", "src": 33}, {"id": 34, "stem": "(   ) While Eric ______ the road, he saw a lady waving at him.", "options": ["crosses", "crossed", "is crossing", "was crossing"], "answer": 3, "explanation": "正確答案：was crossing", "full": "While Eric was crossing the road, he saw a lady waving at him.", "src": 34}, {"id": 35, "stem": "(   ) Mr. Lee speaks good Japanese ______ he lived in Japan for many years.", "options": ["because", "but", "so", "if"], "answer": 0, "explanation": "Lee 先生日語說得流利「因為」他住過日本很多年。", "full": "Mr. Lee speaks good Japanese because he lived in Japan for many years.", "src": 35}, {"id": 36, "stem": "(   ) She ______ a bath when she saw a spider on the bathroom wall. She shouted for help right away.", "options": ["took", "has taken", "would take", "was taking"], "answer": 3, "explanation": "當她看見蜘蛛在浴室牆上時，她「正在洗澡」，用「過去進行式」表達當時正在進行的動作。", "full": "She was taking a bath when she saw a spider on the bathroom wall. She shouted for help right away.", "src": 36}, {"id": 37, "stem": "(   ) ______ Robert left his wallet at home, ______ he didn’t eat lunch today.", "options": ["Because; ×", "Though; ×", "Because; so", "Though; but"], "answer": 0, "explanation": "句子意思是「因為 Robert 把錢包忘在家裡，所以 他今天沒吃午餐。」兩個句子之間是因果關係，但 because 和 so 皆為連接兩個句子的連接詞，所以不能同時使用。\n正確寫法應為：\n1. Because Robert left his wallet at home, he didn’t eat lunch today.（用 because 開頭）\n2. Robert left his wallet at home, so he didn’t eat lunch today.（用 so 連接）", "full": "Because Robert left his wallet at home, he didn’t eat lunch today.", "src": 37}, {"id": 38, "stem": "(   ) They waited and waited ______ the sun came up from behind the mountains. What a beautiful sight!", "options": ["when", "while", "if", "until"], "answer": 3, "explanation": "他們等了又等「一直」到太陽從山的後面升上來。多麼美麗的景象啊！", "full": "They waited and waited until the sun came up from behind the mountains. What a beautiful sight!", "src": 38}, {"id": 39, "stem": "(   ) When Ethan got home, his mom ______ the dishes.", "options": ["was washed", "would wash", "was washing", "is washing"], "answer": 2, "explanation": "當 Ethan 到家時，他媽媽當時「正在洗」碗盤，用「過去進行式」。", "full": "When Ethan got home, his mom was washing the dishes.", "src": 39}, {"id": 40, "stem": "(   ) I heard someone ring the bell ______ I was taking a shower.", "options": ["since", "until", "while", "because"], "answer": 2, "explanation": "正確答案：while", "full": "I heard someone ring the bell while I was taking a shower.", "src": 40}, {"id": 41, "stem": "(   ) Susan has taken care of the cat ______ she found her at her door half a year ago.", "options": ["when", "while", "until", "since"], "answer": 3, "explanation": "Susan「自從」半年前在她家門口發現那隻貓起，她就一直照顧她。", "full": "Susan has taken care of the cat since she found her at her door half a year ago.", "src": 41}, {"id": 42, "stem": "(   ) To catch the first train, my mom ______ every morning.", "options": ["wakes up me", "wakes me up", "woke up me", "woke me up"], "answer": 1, "explanation": "wake up 是可分片語，要把人稱受詞放中間。", "full": "To catch the first train, my mom wakes me up every morning.", "src": 42}, {"id": 43, "stem": "(   ) Nobody knows ______ .", "options": ["why did he celebrate this day", "how to sign up online courses", "who is the best class leader", "when will they leave"], "answer": 1, "explanation": "間接問句不可以將助動詞放置主詞前面，而是以子句方式順寫（主詞＋動詞），若無主詞時，則可直接「疑問詞＋to V」作答。", "full": "Nobody knows how to sign up online courses.", "src": 43}, {"id": 44, "stem": "(   ) Her son ______ off the chair when she ______ on the cellphone.", "options": ["was falling; talked", "has fallen; talked", "falls; will talk", "fell; was talking"], "answer": 3, "explanation": "「跌下」是瞬間動作，用「過去簡單式」，「講電話」則可以持續，用「過去進行式」。", "full": "Her son fell off the chair when she was talking on the cellphone.", "src": 44}, {"id": 45, "stem": "(   ) Grace and George have known each other ______ they were young.", "options": ["when", "since", "until", "because"], "answer": 1, "explanation": "「自從」他們小時候就認識，選(Ｂ)。", "full": "Grace and George have known each other since they were young.", "src": 45}, {"id": 46, "stem": "(   ) After ______ his homework, his mom asked him to go to bed.", "options": ["to do", "doing", "he did", "he would do"], "answer": 2, "explanation": "After 引導的副詞子句中主詞是 he，與主要句子主詞 his mom 並非同一人，故不能選(Ｂ)，(Ｄ) would do 須改成 did。", "full": "After he did his homework, his mom asked him to go to bed.", "src": 46}, {"id": 47, "stem": "(   ) The movie star is ______ what he does because he is closely watched by many reporters.〔112.會考陸考〕", "options": ["careful about", "helpful in", "lucky with", "surprised at"], "answer": 0, "explanation": "由許多記者密切關注，推知要「小心謹慎」，所以選(Ａ)。", "full": "The movie star is careful about what he does because he is closely watched by many reporters.", "src": 47}, {"id": 48, "stem": "(   ) Bill doesn’t like dancing, but he went to the party last night ______ his girlfriend asked him.", "options": ["if", "when", "until", "though"], "answer": 1, "explanation": "Bill 不喜歡跳舞，但是昨天晚上「當」他的女朋友要求他去參加派對時，他還是去了。", "full": "Bill doesn’t like dancing, but he went to the party last night when his girlfriend asked him.", "src": 48}, {"id": 49, "stem": "(   ) The students didn’t stop talking ______ their teacher walked into the classroom.", "options": ["until", "when", "after", "since"], "answer": 0, "explanation": "學生「直到」老師走進教室才停止說話，用 not...until（直到…才…）。", "full": "The students didn’t stop talking until their teacher walked into the classroom.", "src": 49}, {"id": 50, "stem": "(   ) Sally ______ on the phone when her son ______ off the bed.", "options": ["was talking; fell", "talked; fell", "will talk; falls", "is talking; was falling"], "answer": 0, "explanation": "當 Sally 的兒子從床上「跌」下去時，用「過去簡單式」，她「正在講」電話，用「過去進行式」。", "full": "Sally was talking on the phone when her son fell off the bed.", "src": 50}, {"id": 51, "stem": "(   ) ______ we don’t like Neil, ______ we have to be in the same group in science class.", "options": ["Though; but", "Though; ×", "Because; so", "Because; ×"], "answer": 1, "explanation": "though 和 but 不能出現在同一句子中。", "full": "Though we don’t like Neil, we have to be in the same group in science class.", "src": 51}, {"id": 52, "stem": "(   ) Vivi ______ her bedroom before she had lunch with her friends.", "options": ["was cheaning", "cleaned", "has cleaned", "will clean"], "answer": 1, "explanation": "before 連接兩個過去式的句子。", "full": "Vivi cleaned her bedroom before she had lunch with her friends.", "src": 52}, {"id": 53, "stem": "(   ) ______ nobody ______ going to the game with me, I will go on my own.", "options": ["If; feels like", "While; wants", "When; keeps", "Because; hates"], "answer": 0, "explanation": "「如果」沒有人「想要」和我去看比賽，我會自己去。", "full": "If nobody feels like going to the game with me, I will go on my own.", "src": 53}, {"id": 54, "stem": "(   ) After Sean finishes his mission（任務）, he ______ back to his country.", "options": ["will go", "went", "has gone", "goes"], "answer": 0, "explanation": "Sean 完成任務後就要回到自己的國家，用未來式。", "full": "After Sean finishes his mission, he will go back to his country.", "src": 54}, {"id": 55, "stem": "(   ) Amanda promised（答應）that she ______ the dog good manners（規矩）.", "options": ["taught", "was teaching", "has taught", "would teach"], "answer": 3, "explanation": "Amanda 答應她「會教」狗狗好規矩，在過去動作 promised 之後的過去未來動作，用 would＋原形 V...。", "full": "Amanda promised that she would teach the dog good manners.", "src": 55}, {"id": 56, "stem": "(   ) As soon as Alice ______ the living room, her baby started to cry.", "options": ["leaves", "is leaving", "left", "leave"], "answer": 2, "explanation": "as soon as 前後的時態一致，皆為過去式。", "full": "As soon as Alice left the living room, her baby started to cry.", "src": 56}, {"id": 57, "stem": "(   ) There’s some trash near your chair. Please ______ .", "options": ["wake it up", "pick it up", "wake them up", "pick them up"], "answer": 1, "explanation": "trash 為不可數名詞，用代名詞 it，且放在可分片語 pick up 的中間。", "full": "There’s some trash near your chair. Please pick it up.", "src": 57}, {"id": 58, "stem": "(   ) Tonight I’ll stay at the office until I ______ the work.〔104.會考〕", "options": ["finish", "am finishing", "finished", "will finish"], "answer": 0, "explanation": "主要句子是未來式，但從屬連接詞 until 引導的副詞子句，須用「現在簡單式」代替未來式。", "full": "Tonight I’ll stay at the office until I finish the work.", "src": 58}, {"id": 59, "stem": "(   ) Alice kept studying ______ her dad told her to take a break.", "options": ["when", "while", "until", "since"], "answer": 2, "explanation": "Alice 繼續讀書「直到」她的爸爸告訴她休息一下。", "full": "Alice kept studying until her dad told her to take a break.", "src": 59}, {"id": 60, "stem": "(   ) While Jane ______ a bath in the bathroom, her younger brother ______ off the light.", "options": ["took; was turning", "was taking; turned", "took; turned", "was taking; was turning"], "answer": 1, "explanation": "正當 Jane 在浴室「洗澡」時，她的弟弟把電燈「關掉」。前者持續中，用「過去進行式」，後者是瞬間動作，用「過去簡單式」。", "full": "While Jane was taking a bath in the bathroom, her younger brother turned off the light.", "src": 60}, {"id": 61, "stem": "(   ) Jimmy would not get up for breakfast, ______ his dad had already（已經）tried to pull him from his bed several times.［110.會考〕", "options": ["although", "because", "if", "until"], "answer": 0, "explanation": "「雖然」Jimmy 的爸爸已經好幾次試著把他從床上拉起來，但是他還是沒起床吃早餐。", "full": "Jimmy would not get up for breakfast, although his dad had already tried to pull him from his bed several times.", "src": 61}, {"id": 62, "stem": "(   ) We won’t be able to have a picnic if there ______ heavy rain tomorrow.", "options": ["has", "is", "will be", "will have"], "answer": 1, "explanation": "if 子句表達條件，用現在式表達未來時態。", "full": "We won’t be able to have a picnic if there is heavy rain tomorrow.", "src": 62}, {"id": 63, "stem": "(   ) Justin lost his cellphone while ______ the bus this afternoon.", "options": ["he’s riding on", "he was riding in", "riding on", "he’s taking"], "answer": 2, "explanation": "主要句子動詞 lost 是過去式，因此附屬子句要用「過去進行式」，選項(Ｂ) in 須改成 on；選項(Ｃ)是把 while he was riding on... 中的 he was 省略。", "full": "Justin lost his cellphone while riding on the bus this afternoon.", "src": 63}, {"id": 64, "stem": "(   ) I saw a dog walking ______ the train while I was riding ______ the metro this morning.", "options": ["into; in", "on; on", "×; on", "on; in"], "answer": 1, "explanation": "「在」火車「上」走，用 walk on...；「搭乘」捷運，用 ride on...。", "full": "I saw a dog walking on the train while I was riding on the metro this morning.", "src": 64}, {"id": 65, "stem": "(   ) The students felt a little scared ______ around their teacher and ______ to a ghost story.", "options": ["when they sit; listen", "while they are sitting; listening", "when they were sitting; listened", "while sitting; listening"], "answer": 3, "explanation": "當學生「正坐」在老師周圍並「聽著」鬼故事時，他們覺得有點害怕。可用 when / while (they were) sitting around their teacher and listening to... 作答。", "full": "The students felt a little scared while sitting around their teacher and listening to a ghost story.", "src": 65}];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

let chosen=[],idx=0;const wrong=new Map(),attempted=new Set(),correct=new Set();
function preview(q){return KIND==='mcq'?q.stem:q.prompt}
function renderList(){$('#list').innerHTML=Q.map(q=>`<label class="pick"><input class="pickbox" type="checkbox" value="${q.id}" checked><span><b>第 ${q.id} 題</b><small>${esc(preview(q))}</small></span></label>`).join('')}

$('#all').onclick=()=>setAll(true);$('#none').onclick=()=>setAll(false);$('#random').onclick=()=>{setAll(false);const ids=new Set(shuffled(Q).slice(0,20).map(q=>q.id));document.querySelectorAll('.pickbox').forEach(x=>x.checked=ids.has(+x.value))};
$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));idx=0;wrong.clear();attempted.clear();correct.clear();$('#select').classList.add('hidden');$('#result').classList.add('hidden');$('#quiz').classList.remove('hidden');show()};
function show(){if(window.speechSynthesis)speechSynthesis.cancel();const q=chosen[idx];$('#meta').textContent=`第 ${idx+1} / ${chosen.length} 題｜原題 ${q.id}`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=`${idx/chosen.length*100}%`;$('#stem').textContent=KIND==='mcq'?q.stem:q.prompt;const pic=$('#picture');if(q.image){pic.src=q.image;pic.classList.remove('hidden')}else{pic.classList.add('hidden');pic.removeAttribute('src')};if(KIND==='mcq'){$('#area').className='options';$('#area').innerHTML=q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b><span>${esc(o)}</span></label>`).join('')}else{$('#area').className='answer-grid';$('#area').innerHTML=q.answers.map((a,i)=>`<div class="answer-row"><label>空格 ${i+1}</label><input class="answer-input" data-i="${i}" autocomplete="off" spellcheck="false" placeholder="請輸入答案"></div>`).join('')};$('#feedback').className='feedback hidden';$('#voicebox').classList.add('hidden');$('#check').classList.remove('hidden');$('#next').classList.add('hidden')}
function remember(q,value){if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(value);$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
function spoken(q){return q.full||((KIND==='mcq')?q.stem.replace(/^\(\s*\)\s*/,'').replace(/_{3,}/,q.options[q.answer]):q.answers.map(a=>a.accepted[0]).join(' '))}
function speak(){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(spoken(chosen[idx]));u.lang='en-US';u.rate=.88;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/^en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;speechSynthesis.speak(u)}
function success(q){correct.add(q.id);$('#bar').style.width=`${(idx+1)/chosen.length*100}%`;$('#feedback').className='feedback ok';$('#feedback').innerHTML='✅ 全部正確！<br>'+esc(q.explanation||'');$('#target').textContent=spoken(q);$('#voicebox').classList.remove('hidden');$('#check').classList.add('hidden');$('#next').classList.remove('hidden');speak()}
$('#check').onclick=()=>{const q=chosen[idx];attempted.add(q.id);if(KIND==='mcq'){const sel=document.querySelector('input[name=answer]:checked');if(!sel)return alert('請先選擇答案。');const n=+sel.value;if(n===q.answer)return success(q);remember(q,String.fromCharCode(65+n)+'. '+q.options[n]);$('#feedback').className='feedback bad';$('#feedback').innerHTML=`❌ 答錯了。正確答案：<strong>${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</strong><br>${esc(q.explanation||'')}<br>請重新選擇正確答案。`;return}const ins=[...document.querySelectorAll('.answer-input')];if(ins.some(x=>!x.value.trim()))return alert('請完成所有答案。');const bad=[];ins.forEach((input,i)=>{const a=q.answers[i];input.classList.remove('ok','bad');if(a.accepted.some(x=>norm(x)===norm(input.value))){input.classList.add('ok');input.disabled=true}else{input.classList.add('bad');bad.push(`${i+1}. ${input.value} → ${a.display}`);input.value=''}});if(!bad.length)return success(q);remember(q,bad.join('；'));$('#feedback').className='feedback bad';$('#feedback').innerHTML=`❌ 有 ${bad.length} 格不正確。<br>正確答案：${q.answers.map((a,i)=>`${i+1}. <strong>${esc(a.display)}</strong>`).join('；')}<br>${esc(q.explanation||'')}<br>請依提示重新填寫。`;ins.find(x=>!x.disabled)?.focus()};
$('#speak').onclick=speak;$('#next').onclick=()=>{idx++;idx>=chosen.length?finish():show()};$('#finish').onclick=finish;

function finish(){if(window.speechSynthesis)speechSynthesis.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');$('#summary').innerHTML=`<div class="stat">選擇題數<b>${chosen.length}</b></div><div class="stat">已作答<b>${attempted.size}</b></div><div class="stat">完成答對<b>${correct.size}</b></div><div class="stat">曾答錯<b>${wrong.size}</b></div>`;$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>`<div class="wrong"><b>${i+1}. 原題 ${r.q.id}｜${esc(preview(r.q))}</b><p>錯誤紀錄：${r.attempts.map(esc).join('<br>')}</p><p><strong>正確答案：</strong>${esc(answerText(r.q))}</p><p>${esc(r.q.explanation||'')}</p></div>`).join(''):'<div class="feedback ok">🎉 沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size)}
$('#restart').onclick=()=>location.reload();$('#download').onclick=async()=>{if(!wrong.size)return;const rows=[...wrong.values()],stamp=new Date().toISOString().slice(0,10),name=TITLE.replace(/\s+/g,'_')+'_錯題_'+stamp;const save=(blob,ext)=>{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name+ext;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};try{const{Document,Packer,Paragraph,TextRun,HeadingLevel}=await import('https://esm.sh/docx@9.5.1');const children=[new Paragraph({heading:HeadingLevel.TITLE,children:[new TextRun({text:TITLE+' 錯題紀錄',bold:true})]})];rows.forEach((r,i)=>{children.push(new Paragraph({heading:HeadingLevel.HEADING_2,children:[new TextRun({text:`${i+1}. 原題 ${r.q.id}`,bold:true})]}),new Paragraph({text:preview(r.q)}),new Paragraph({children:[new TextRun({text:'錯誤紀錄：',bold:true}),new TextRun({text:r.attempts.join(' | ')})]}),new Paragraph({children:[new TextRun({text:'正確答案：',bold:true}),new TextRun({text:answerText(r.q)})]}),new Paragraph({children:[new TextRun({text:'解析：',bold:true}),new TextRun({text:r.q.explanation||''})]}))});save(await Packer.toBlob(new Document({sections:[{children}]})),'.docx')}catch(e){save(new Blob([TITLE+' 錯題紀錄\n\n'+rows.map(r=>preview(r.q)+'\n正確答案：'+answerText(r.q)+'\n').join('\n')],{type:'text/plain;charset=utf-8'}),'.txt')}};
renderList();
