<meta name="viewport" content="width=device-width,initial-scale=1">

<title>國中小進階800字｜單字例句填空</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dbe3ee;--blue:#1d4ed8;--blue2:#eff6ff;--teal:#0f766e;--teal2:#ecfdf5;--violet:#6d28d9;--amber:#a16207;--bad:#b91c1c;--bad2:#fff1f2}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.62}.wrap{max-width:1050px;margin:auto;padding:18px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 6px 20px #0f172a0e}.hero{background:linear-gradient(135deg,#dbeafe,#f5f3ff 58%,#ecfdf5)}h1{font-size:clamp(27px,5vw,40px);line-height:1.2;margin:0 0 8px}h2{font-size:23px;margin:0 0 8px}.eyebrow{font-weight:900;color:#4338ca;letter-spacing:.05em}.note{color:var(--muted);margin:5px 0}.hidden{display:none!important}.toolbar,.actions,.letters{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}.btn{appearance:none;border:0;border-radius:11px;padding:10px 15px;font:700 16px inherit;cursor:pointer;background:#e5e7eb;color:var(--ink);text-decoration:none}.btn.primary{background:var(--blue);color:#fff}.btn.voice{background:var(--violet);color:#fff}.btn.danger{background:#991b1b;color:#fff}.btn.active{background:#1e40af;color:#fff}.btn:disabled{opacity:.43;cursor:not-allowed}.letter{min-width:54px;padding:9px 8px}.letter small{display:block;font-size:11px;font-weight:700}.btn:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.opt{display:flex;align-items:center;gap:8px;font-weight:800}.opt input{width:18px;height:18px;accent-color:var(--blue)}#list{max-height:390px;overflow:auto;border:1px solid var(--line);border-radius:13px;background:#fcfdff;padding:10px}.group{margin:7px 0 13px}.group h3{position:sticky;top:0;margin:0 0 6px;padding:6px 10px;border-radius:8px;background:#eaf2ff;color:#1e40af}.word-list{display:flex;flex-wrap:wrap;gap:6px}.word-chip{border:1px solid var(--line);border-radius:999px;padding:4px 9px;background:#fff;color:#334155}.progress{height:10px;border-radius:999px;background:#e5e7eb;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--blue),var(--violet));transition:width .25s}.meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-weight:800;margin:8px 0 14px}.prompt{padding:18px;border:2px solid #bfdbfe;border-radius:15px;background:var(--blue2)}.meaning{font-size:25px;font-weight:900;color:var(--amber)}.badge{display:inline-block;border-radius:999px;background:#fff;padding:3px 9px;margin-right:6px;color:#475569;font-size:13px;font-weight:900}.sentence{margin-top:16px;padding:18px;border:2px solid var(--line);border-radius:13px;background:#f8fafc;font-size:20px;font-weight:750;line-height:2.4}.gap{font:700 18px inherit;color:#1d4ed8;text-align:center;padding:3px 5px;margin:0 3px;border:0;border-bottom:3px solid #94a3b8;border-radius:6px 6px 0 0;background:#fff;max-width:100%}.gap.ok{color:var(--teal);border-color:var(--teal);background:var(--teal2)}.gap.bad{color:var(--bad);border-color:var(--bad);background:var(--bad2)}.feedback{margin-top:10px;padding:10px 12px;border-radius:9px;font-weight:800}.feedback.good{color:var(--teal);background:var(--teal2)}.feedback.bad{color:var(--bad);background:var(--bad2)}.zh{color:#475569;margin-top:8px;font-size:16px}.listen-box{margin-top:16px;padding:15px;border:2px solid #ddd6fe;border-radius:13px;background:#f5f3ff}.listen-box.locked{opacity:.65}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fafafa}.stat b{display:block;font-size:28px}.review{border:1px solid #fecaca;background:#fff7f7;border-radius:12px;padding:13px;margin:10px 0}.review b{font-size:19px;color:#1d4ed8}.footer{text-align:center;color:var(--muted);padding:10px 0 24px;font-size:14px}@media(max-width:650px){.wrap{padding:10px}.hero,.card{padding:15px}.meta{display:block}.sentence{font-size:18px}.gap{font-size:16px}.btn{flex:1 1 auto}.letter{flex:0 0 55px}}
</style>
</head>
<body><main class="wrap">
<section class="hero"><div class="eyebrow">國中小英文單字</div><h1>國中小進階800字</h1><p><b>804 筆教材字彙</b>，依 A–Z 字首分類。看中文與例句完成英文單字，答對後會自動播放完整英文句子。</p><p class="note">動詞須依時態與主詞變化，名詞須使用正確單複數；答案不分大小寫。X 字首在原始教材中沒有資料，因此按鈕會停用。</p><div class="toolbar"><a class="btn" href="dashboard.html">← 回測驗總覽</a></div></section>

<section id="select" class="card"><h2>選擇練習字首</h2><div id="letters" class="letters"></div><div class="toolbar"><button id="all" class="btn">全部 A–Z</button><button id="none" class="btn">全部取消</button><button id="random20" class="btn">隨機 20 題</button><button id="weakOnly" class="btn">只練待加強</button></div><label class="opt"><input id="shuffle" type="checkbox" checked> 打亂出題順序</label><p id="picked" class="note"></p><div id="list"></div><div class="actions"><button id="start" class="btn primary">開始練習</button></div></section>

<section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="letterMeta"></span></div><div class="prompt"><div><span id="letterBadge" class="badge"></span><span id="pos" class="badge"></span></div><div id="meaning" class="meaning"></div></div><div class="sentence"><h2 style="font-size:19px">完成例句</h2><div id="example"></div><div id="translation" class="zh"></div><div class="toolbar"><button id="check" class="btn primary">檢查答案</button></div><div id="feedback" class="feedback hidden"></div></div><div id="listenBox" class="listen-box locked"><b>🔊 英文完整句子</b><p id="listenStatus" class="note">答對後自動播放，聽完即可進入下一題。</p><button id="speak" class="btn voice" disabled>再聽一次</button></div><div class="actions"><button id="next" class="btn primary" disabled>下一題 →</button><button id="weak" class="btn" disabled>待加強，下一題 →</button><button id="finish" class="btn danger">結束練習</button></div></section>

<section id="result" class="card hidden"><h2>練習結果</h2><div id="summary" class="summary"></div><div id="reviewList"></div><div class="actions"><button id="retry" class="btn primary">重練本輪錯題</button><button id="download" class="btn">下載待加強 DOCX</button><button id="restart" class="btn">重新選擇字首</button></div></section>
<p class="footer">字彙、詞性、中文、英文例句與翻譯依附件「國中進階800字」呈現。</p>
</main>
<script src="advanced-800-data.js?v=20261028-2"></script>
<script>
const Q=window.ADVANCED_800||[],STORE='advanced-800-vocab-v1',$=id=>document.getElementById(id),alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
let saved={weak:[]};try{saved=Object.assign(saved,JSON.parse(localStorage.getItem(STORE)||'{}'))}catch(e){}saved.weak=Array.isArray(saved.weak)?saved.weak:[];
let selected=new Set(['A']),randomIds=null,pool=[],idx=0,wrongThisRound=new Set(),attemptedWrong=new Set(),currentFull='',sentencePassed=false,audioRun=0,audioTimer=null;
const save=()=>localStorage.setItem(STORE,JSON.stringify(saved)),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=s=>String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9' -]/g,' ').replace(/\s+/g,' ').trim();
const shuffle=a=>{for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const counts=Object.fromEntries(alphabet.map(l=>[l,Q.filter(q=>q.letter===l).length]));
function renderLetters(){ $('letters').innerHTML=alphabet.map(l=>'<button class="btn letter '+(selected.has(l)?'active':'')+'" data-letter="'+l+'" '+(counts[l]?'':'disabled')+'>'+l+'<small>'+counts[l]+' 字</small></button>').join('') }
function chosen(){if(randomIds)return Q.filter(q=>randomIds.includes(q.id));return Q.filter(q=>selected.has(q.letter))}
function renderList(){let arr=chosen(),groups={};for(const q of arr)(groups[q.letter]??=[]).push(q);$('picked').textContent=randomIds?'已選隨機 '+arr.length+' 題':'已選 '+selected.size+' 個字首，共 '+arr.length+' 題';$('start').disabled=!arr.length;$('list').innerHTML=arr.length?Object.entries(groups).map(([l,items])=>'<div class="group"><h3>'+l+'｜'+items.length+' 字</h3><div class="word-list">'+items.map(q=>'<span class="word-chip">'+esc(q.word)+'</span>').join('')+'</div></div>').join(''):'<p class="note">請至少選擇一個有資料的字首。</p>'}
$('letters').onclick=e=>{let b=e.target.closest('[data-letter]');if(!b)return;randomIds=null;let l=b.dataset.letter;selected.has(l)?selected.delete(l):selected.add(l);renderLetters();renderList()};
$('all').onclick=()=>{randomIds=null;selected=new Set(alphabet.filter(l=>counts[l]));renderLetters();renderList()};$('none').onclick=()=>{randomIds=null;selected.clear();renderLetters();renderList()};
$('random20').onclick=()=>{selected.clear();randomIds=shuffle(Q.map(q=>q.id)).slice(0,20);renderLetters();renderList()};
$('weakOnly').onclick=()=>{let ids=new Set(saved.weak);randomIds=Q.filter(q=>ids.has(q.id)).map(q=>q.id);selected.clear();renderLetters();renderList();if(!randomIds.length)alert('目前沒有待加強單字。')};
const expected=q=>q.answer||q.word;
function renderQuestion(){audioRun++;clearTimeout(audioTimer);if(window.speechSynthesis)speechSynthesis.cancel();let q=pool[idx];sentencePassed=false;currentFull='';$('bar').style.width=(idx/pool.length*100)+'%';$('meta').textContent='第 '+(idx+1)+' / '+pool.length+' 題';$('letterMeta').textContent=q.letter+' 字首｜教材第 '+q.id+' 筆';$('letterBadge').textContent=q.letter;$('pos').textContent=q.pos;$('meaning').textContent=q.meaning;$('translation').textContent=q.translation;$('feedback').className='feedback hidden';$('check').disabled=false;$('next').disabled=$('weak').disabled=true;$('listenBox').classList.add('locked');$('speak').disabled=true;$('listenStatus').textContent='答對後自動播放，聽完即可進入下一題。';let answer=expected(q),width=Math.max(7,Math.min(24,answer.length+3));$('example').innerHTML=esc(q.example).replace(/_{3,}/g,'<input class="gap" style="width:'+width+'ch" aria-label="例句單字填空" autocomplete="off" autocapitalize="off" spellcheck="false">');document.querySelector('.gap')?.focus()}
function inputs(){return [...document.querySelectorAll('#example .gap')]}
function markWrong(q){attemptedWrong.add(q.id);wrongThisRound.add(q.id);if(!saved.weak.includes(q.id))saved.weak.push(q.id);save()}
function check(){let q=pool[idx],answer=expected(q),ok=true;for(const x of inputs()){let good=norm(x.value)===norm(answer);x.classList.toggle('ok',good);x.classList.toggle('bad',!good);if(good)x.disabled=true;else ok=false}if(!ok){markWrong(q);$('feedback').className='feedback bad';$('feedback').textContent='❌ 不正確，請注意動詞變化與名詞單複數，再重新填寫。';inputs().find(x=>!x.disabled)?.focus();return}sentencePassed=true;currentFull=q.example.replace(/_{3,}/g,answer);$('feedback').className='feedback good';$('feedback').innerHTML='✅ 正確：<b>'+esc(answer)+'</b>'+(answer!==q.word?'（原形／單字：'+esc(q.word)+'）':'')+'。正在播放完整英文句子。';$('check').disabled=true;$('listenBox').classList.remove('locked');$('speak').disabled=false;playSentence(true)}
$('check').onclick=check;$('example').addEventListener('keydown',e=>{if(e.key==='Enter')check()});
function unlockAudio(token){if(token!==audioRun)return;clearTimeout(audioTimer);$('next').disabled=$('weak').disabled=false;$('speak').disabled=false;$('listenStatus').textContent='✅ 已聽完整句子，可以進入下一題。'}
function playSentence(auto=false){if(!sentencePassed)return;let token=++audioRun;clearTimeout(audioTimer);$('next').disabled=$('weak').disabled=true;$('speak').disabled=true;$('listenStatus').textContent=auto?'正在自動播放完整句子…':'正在再次播放完整句子…';if(!window.speechSynthesis){$('listenStatus').textContent='此瀏覽器無法播放語音，已開放下一題。';unlockAudio(token);return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(currentFull),wordCount=currentFull.trim().split(/\s+/).length,ms=Math.max(5000,Math.min(26000,Math.round((wordCount/2+2.5)*1000)));u.lang='en-US';u.rate=.82;u.onend=()=>unlockAudio(token);u.onerror=()=>{$('listenStatus').textContent='語音未回報完成；若已聽到整句，系統稍後會自動開放下一題。'};audioTimer=setTimeout(()=>unlockAudio(token),ms);speechSynthesis.speak(u)}$('speak').onclick=()=>playSentence(false);
function advance(forceWeak=false){let q=pool[idx];if(forceWeak){wrongThisRound.add(q.id);if(!saved.weak.includes(q.id))saved.weak.push(q.id);save()}idx++;idx<pool.length?renderQuestion():finish()}$('next').onclick=()=>advance(false);$('weak').onclick=()=>advance(true);
function finish(){audioRun++;clearTimeout(audioTimer);if(window.speechSynthesis)speechSynthesis.cancel();$('quiz').classList.add('hidden');$('result').classList.remove('hidden');let wrong=pool.filter(q=>wrongThisRound.has(q.id));$('summary').innerHTML='<div class="stat"><span>本輪題數</span><b>'+pool.length+'</b></div><div class="stat"><span>一次答對</span><b>'+(pool.length-attemptedWrong.size)+'</b></div><div class="stat"><span>本輪待加強</span><b>'+wrong.length+'</b></div><div class="stat"><span>累積待加強</span><b>'+saved.weak.length+'</b></div>';$('reviewList').innerHTML=wrong.length?'<h2>本輪待加強</h2>'+wrong.map(q=>'<div class="review"><b>'+esc(q.word)+' <small>'+esc(q.pos)+'</small></b>'+(expected(q)!==q.word?'<div>句中形式：<b>'+esc(expected(q))+'</b></div>':'')+'<div>'+esc(q.meaning)+'</div><div>'+esc(q.example.replace(/_{3,}/g,expected(q)))+'</div><div class="zh">'+esc(q.translation)+'</div></div>').join(''):'<p class="feedback good">本輪全部一次答對！</p>';$('retry').disabled=!wrong.length}
$('finish').onclick=finish;
$('start').onclick=()=>{pool=[...chosen()];if(!pool.length)return alert('請至少選擇一個字首。');if($('shuffle').checked)shuffle(pool);idx=0;wrongThisRound.clear();attemptedWrong.clear();$('select').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');renderQuestion()};
$('retry').onclick=()=>{pool=pool.filter(q=>wrongThisRound.has(q.id));idx=0;wrongThisRound.clear();attemptedWrong.clear();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');renderQuestion()};
$('restart').onclick=()=>{$('result').classList.add('hidden');$('quiz').classList.add('hidden');$('select').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})};
async function download(){let ids=new Set(saved.weak),arr=Q.filter(q=>ids.has(q.id));if(!arr.length)return alert('目前沒有待加強題目。');try{if(!window.docx){await new Promise((ok,fail)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js';s.onload=ok;s.onerror=fail;document.head.append(s)})}let {Document,Packer,Paragraph,TextRun,HeadingLevel}=window.docx,ch=[new Paragraph({text:'國中小進階800字｜待加強單字',heading:HeadingLevel.TITLE})];for(const q of arr)ch.push(new Paragraph({children:[new TextRun({text:q.word+' '+q.pos,bold:true})]}),...(expected(q)!==q.word?[new Paragraph('句中形式：'+expected(q))]:[]),new Paragraph(q.meaning),new Paragraph('例句：'+q.example.replace(/_{3,}/g,expected(q))),new Paragraph('中文：'+q.translation),new Paragraph(''));let blob=await Packer.toBlob(new Document({sections:[{children:ch}]})),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='國中小進階800字_待加強.docx';a.click();URL.revokeObjectURL(u)}catch(e){let text=arr.map(q=>q.word+' '+q.pos+(expected(q)!==q.word?'\n句中形式：'+expected(q):'')+'\n'+q.meaning+'\n'+q.example.replace(/_{3,}/g,expected(q))+'\n'+q.translation).join('\n\n'),blob=new Blob([text],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='國中小進階800字_待加強.txt';a.click();URL.revokeObjectURL(u)}}$('download').onclick=download;
renderLetters();renderList();
</script>
