<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>康軒B1U1 文法測驗</title><style>:root{--blue:#2563eb;--navy:#1e3a8a;--bg:#f4f7fb;--card:#fff;--line:#dbe3ee;--ink:#172033;--muted:#64748b;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}.wrap{max-width:900px;margin:auto;padding:16px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 5px 18px #0f172a0d}.hero{background:linear-gradient(135deg,#e8f1ff,#fff)}h1{margin:0 0 6px;font-size:clamp(25px,4vw,38px)}h2{margin-top:0}.note{color:var(--muted)}.hidden{display:none!important}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.btn{border:0;border-radius:10px;padding:11px 17px;font-size:16px;font-weight:800;cursor:pointer;background:#e5e7eb;font-family:inherit}.primary{background:var(--blue);color:#fff}.danger{background:#991b1b;color:#fff}.pick{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin:7px 0;background:#fafcff}.pick input{margin-right:8px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:800;margin:8px 0 14px}.zh{padding:10px 13px;background:#fff7ed;border-radius:9px;color:#9a3412;font-weight:800;margin-bottom:10px}.question{font-size:21px;font-weight:750;padding:16px;background:#f8fafc;border-radius:11px;white-space:pre-wrap}.question u{text-decoration-thickness:3px;text-underline-offset:4px;text-decoration-color:var(--blue)}.question img{display:block;max-width:240px;width:100%;height:auto;margin:10px 0 0;border:1px solid var(--line);border-radius:10px;background:#fff}.options{display:grid;gap:9px;margin:14px 0}.option{display:flex;align-items:center;gap:11px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-size:18px;font-weight:750;cursor:pointer}.option:hover{border-color:#60a5fa;background:#eff6ff}.option:has(input:checked){border-color:var(--blue);background:#dbeafe;color:var(--navy)}.option input{width:20px;height:20px;accent-color:var(--blue)}.inputs{display:grid;gap:10px;margin:15px 0}.answer-row{display:grid;grid-template-columns:55px 1fr;gap:10px;align-items:center}.answer-row label{font-weight:900;color:var(--navy);text-align:center}.spell{width:100%;font:inherit;font-size:18px;padding:11px;border:2px solid #94a3b8;border-radius:9px}.feedback{padding:13px;border-radius:10px;font-weight:800;margin:13px 0}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.explain{padding:12px 14px;border-radius:10px;background:#eff6ff;border:1px solid #bfdbfe;color:var(--navy);margin:13px 0}.explain b{margin-right:4px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}.wrong p{margin:6px 0;white-space:pre-wrap}@media(max-width:600px){.wrap{padding:9px}.hero,.card{padding:15px}.question{font-size:18px;padding:13px}.option{font-size:17px}.answer-row{grid-template-columns:42px 1fr}}</style></head>
<body><main class="wrap"><section class="hero"><h1>康軒B1U1 文法測驗</h1><p>共 70 題。可自行選題；答錯會顯示正確答案並要求重新作答。</p><p class="note">完成後可下載包含錯誤答案與正確答案的 DOCX 錯題紀錄。</p></section><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn">全部選取</button><button id="none" class="btn">全部取消</button><button id="start" class="btn primary">開始作答</button></div><div id="list"></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden" role="status" aria-live="polite"></div><div id="explain" class="explain hidden"></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="download" class="btn primary">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></main>
<script>
// MODE: "input" = spell one word, "mcq" = four options, "sentence" = type a whole sentence (several accepted answers)
const TITLE = "康軒B1U1 文法測驗", MODE = "mcq", IMG = {}, Q = [{"id": 1, "question": "My name ______ Helen. I’m a math teacher.", "exp": "主詞 my name 為第三人稱單數，故應搭配單數 be動詞 is。", "options": ["am", "is", "are", "be"], "answer": 1}, {"id": 2, "question": "A：______ this your pen?\nB：Yes, ______. Thank you.", "exp": "由 this 及 your pen 可知為單數名詞，用單數 be動詞 is 詢問及回答。", "options": ["Are; it’s", "Are; its", "Is; its", "Is; it is"], "answer": 3}, {"id": 3, "question": "A：______ is Stanley from?\nB：______ from Taiwan.", "exp": "由回答「他來自臺灣。」，可推知是詢問 Stanley「來自哪裡」，疑問詞用 Where。", "options": ["Where; His", "Where; He’s", "What; His", "What; He’s"], "answer": 1}, {"id": 4, "question": "Linda is a student. Her brother, Joe, is a student, ______.", "exp": "too 表示「也」，常置於句尾，前方常以逗號隔開。", "options": ["no", "not", "too", "right"], "answer": 2}, {"id": 5, "question": "Tina and Ian are talking at ______ art museum（博物館）.", "exp": "空格前有介系詞 at，後面有以母音開頭的單數名詞 art museum，可知空格內應置入 an 或 the，故選 (A)。", "options": ["an", "a", "these", "╳"], "answer": 0}, {"id": 6, "question": "Sophia is ______ actress（女演員）. She is a doctor.", "exp": "actress 字首發音為母音，前面的不定冠詞須用 an。表否定時，not 要接在 be 動詞後面。", "options": ["not an", "not a", "an not", "no an"], "answer": 0}, {"id": 7, "question": "A：Is Ms. Li a nurse?\nB：No, ______ a doctor.", "exp": "Ms. 為女性，代名詞用 she。", "options": ["I’m", "he’s", "she’s", "it’s"], "answer": 2}, {"id": 8, "question": "A：______ are you?\nB：I’m good. What about you?\nA：I’m good, too. Thanks.", "exp": "由答句可知，此處在問「狀態」，疑問詞用 How。", "options": ["What", "How", "Who", "Where"], "answer": 1}, {"id": 9, "question": "The color of（……的）my car ______ red.", "exp": "color 是單數名詞，be 動詞用 is。", "options": ["is", "are", "be", "╳"], "answer": 0}, {"id": 10, "question": "A：Is Maggie’s father a nurse? B：Yes, ______.", "exp": "Maggie 的父親是男性，代名詞用 he；由 Yes 可知是肯定回答，故用 he is。肯定簡答不可縮寫。", "options": ["he is", "she is", "he isn’t", "he’s"], "answer": 0}, {"id": 11, "question": "A：Is that ______ cup yellow?\nB：No, it’s ______ orange cup.", "exp": "問句中，that 是指示形容詞，cup 前面不用加冠詞；答句中，orange 為母音開頭，不定冠詞用 an。", "options": ["a; ╳", "a; an", "╳; an", "╳; a"], "answer": 2}, {"id": 12, "question": "A：Isn’t that ______?\nB：______, it isn’t. It’s new.", "exp": "that 當指示代名詞時第一格用 an old doll，當指示形容詞時，則用 doll old；否定的 Yes / No 問句與肯定的回答方式一樣，由 it isn’t 可知第二格用 No。", "options": ["doll old; Yes", "an old doll; Yes", "old doll; No", "an old doll; No"], "answer": 3}, {"id": 13, "question": "A：Who is Mike?\nB：______ is a new student in Miss Lin’s class.\nA：Wow. Anna is a new student in ______ class, too.", "exp": "Mike 為男子名，且在這為主詞，故用代名詞 he；名詞前可搭配所有格，又由句尾的 too 可知應用 her。", "options": ["He; his", "He; her", "His; my", "His; she"], "answer": 1}, {"id": 14, "question": "A：______ your daughter a good girl?\nB：Yes, ______.", "exp": "主詞 your daughter 為第三人稱單數，句首須用 be 動詞 Is / Isn’t 問；由回答 Yes 可知是肯定，後接簡答 she is。", "options": ["Isn’t; she isn’t", "Are; she is", "Is; she is", "Are; I am"], "answer": 2}, {"id": 15, "question": "A：Are you ______? B：Yes, I am.", "exp": "由答句主詞 I 可知，問句應用 a student。", "options": ["students", "student", "a student", "the students"], "answer": 2}, {"id": 16, "question": "A：______ the men ______? B：Yes.", "exp": "the men 是複數主詞，故 be 動詞用 are。", "options": ["Are; a cook", "Is; a cook", "Are; cooks", "Is; cooks"], "answer": 2}, {"id": 17, "question": "A：Look! Who is ______?\nB：He is my brother.", "exp": "形容詞可放在名詞前，修飾名詞。由 B 的回答可知此男孩的身分，要用指示代名詞 this，故選 this cute boy。", "options": ["a cute boy", "this cute boy", "this boy cute", "cute boy"], "answer": 1}, {"id": 18, "question": "Ivy and Leo’s dog ______ brown（棕色的）. It’s not black.", "exp": "由後句「牠不是黑色的。」，可推知只有一隻狗，且前句是以共同所有格表示，故用 is。", "options": ["is", "are", "am", "be"], "answer": 0}, {"id": 19, "question": "A：Isn’t Julia a thin girl?\nB：______ She only weighs（只有……重）42 kilograms（公斤）.", "exp": "由回答「她體重只有 42 公斤。」，可知應為肯定回答。", "options": ["No, she isn’t.", "No, she is.", "Yes, she isn’t.", "Yes, she is."], "answer": 3}, {"id": 20, "question": "A: ______ is your pet? B: It’s a cat.", "exp": "由 a cat 可知問句是問你的寵物是「什麼」，疑問詞用 What。", "options": ["How old", "Where", "Who", "What"], "answer": 3}, {"id": 21, "question": "A：Is Tony ______ Canada（加拿大）?\nB：No, he isn’t. He is from ______ Taiwan.", "exp": "表示「來自某處」，介系詞用 from。", "options": ["in; the", "from; the", "from; ╳", "to; ╳"], "answer": 2}, {"id": 22, "question": "A：______ your mother a nurse?\nB：Yes, ______.", "exp": "由 Yes 可知是肯定回答；your mother 為第三人稱單數，須用 be 動詞 Is 問，回答否定疑問句時，跟肯定疑問句一樣，肯定簡答時，人稱代名詞跟 be 動詞不能縮寫。", "options": ["Isn’t; she isn’t", "Are; she’s not", "Isn’t; she is", "Is; she’s"], "answer": 2}, {"id": 23, "question": "A：Is the fish yummy? B：Yes, ______.", "exp": "由回答 Yes 可知為肯定，問句用 Is 問，回答用單數代名詞跟 be 動詞，故選 it is。", "options": ["they are", "they’re", "it is", "it’s"], "answer": 2}, {"id": 24, "question": "A：Is that ______ pen?\nB：______, it isn’t. It’s red.", "exp": "形容詞常置於名詞之前，並視情況加上冠詞。另由答句 It’s red. 可知答句為否定。", "options": ["a blue; Yes", "a blue; No", "blue; Yes", "blue; No"], "answer": 1}, {"id": 25, "question": "Joe：Mom, ______ my friend Sean.\nMrs. Lee：Welcome, Sean.\nSean：Nice to meet you, Mrs. Lee.", "exp": "介紹某人給對方認識要用 this is。", "options": ["this is", "you are", "she is", "it is"], "answer": 0}, {"id": 26, "question": "A：______ the book in the box great?\nB：Yes.", "exp": "由 B 回答 Yes可知是 Yes / No 問句。", "options": ["╳", "What is", "Is", "How is"], "answer": 2}, {"id": 27, "question": "The cat is cute. ______ black with white spots（斑點）.", "exp": "空格後的 black 為形容詞，可知空格應填主詞與 be 動詞，故選 (B)。", "options": ["They", "It’s", "Its", "It"], "answer": 1}, {"id": 28, "question": "A：Who is that woman? B：She is ______.", "exp": "疑問詞 Who 用在問「關係」或「姓名」，故選 Lily。", "options": ["Lily", "a nurse", "friend", "waiters"], "answer": 0}, {"id": 29, "question": "The rabbit is cute. ______ ears are big.", "exp": "由前句 be 動詞 is 可知為第三人稱單數，且名詞前面應為所有格，故選 Its。", "options": ["Their", "It’s", "Its", "It"], "answer": 2}, {"id": 30, "question": "A：Is this your phone number?\nB：Yes, ______.", "exp": "Yes / No 問句，用單數 be 動詞 is 問，答句也用單數 be 動詞 is 回答；肯定簡答須用代名詞，且不可與 be 動詞縮寫，this 的代名詞須用 it。", "options": ["it’s", "this is", "it is", "that is"], "answer": 2}, {"id": 31, "question": "A：My school is big. Is ______, too?\nB：No, it isn’t. My school is small.", "exp": "形容詞問句的句型為「Be 動詞＋名詞＋形容詞?」。", "options": ["your big school", "your a big school", "your school big", "a big school"], "answer": 2}, {"id": 32, "question": "A：Is Mr. Lin ______ PE teacher?\nB：No, he isn’t. He’s ______ English teacher.", "exp": "單數可數名詞前面須加不定冠詞 a，若為母音開頭的字則用 an。", "options": ["a; a", "a; an", "an; an", "an; a"], "answer": 1}, {"id": 33, "question": "Mary is ______ girl. She is not old.", "exp": "ten-year-old 是形容詞的用法，year 後面不可加 s，連字號 “-” 也不能刪掉。", "options": ["ten years old", "ten year old", "a ten-years-old", "a ten-year-old"], "answer": 3}, {"id": 34, "question": "A：Is the show（表演）good?\nB：Yes, ______.", "exp": "the show 是第三人稱單數，代名詞用 it；答句為肯定，故簡答用 it is。", "options": ["it is", "it isn’t", "is not", "is it"], "answer": 0}, {"id": 35, "question": "A：Are you Mr. Li?\nB：Yes, and you are?\nA：Mr. Li, ______. I’m Andy, your son’s teacher.", "exp": "Nice to meet you. 為習慣用法，用於第一次見面時，表示「很高興見到你。」。", "options": ["nice to see you", "nice to see you, too", "nice to meet you", "nice to meet you, too"], "answer": 2}, {"id": 36, "question": "A：Isn’t that ______?\nB：______, she is. She is famous（出名的）at my school.", "exp": "形容詞可放在名詞前面和 be 動詞後面，問句是問「那女孩不是很漂亮嗎？」句型應是「Be 動詞＋名詞＋形容詞……?」另外，否定問句的簡答跟肯定問句一樣，故此處用 Yes。", "options": ["beautiful girl; Yes", "girl beautiful; No", "beautiful girl; No", "girl beautiful; Yes"], "answer": 3}, {"id": 37, "question": "A：Look! ______ brother is on TV.\nB：Yes. He is ______ actor（男演員）.", "exp": "名詞前用所有格；母音開頭的單數可數名詞，須搭配不定冠詞 an。", "options": ["Your; a", "Your; an", "You; the", "You; ╳"], "answer": 1}, {"id": 38, "question": "______ house（房子）is big and new.", "exp": "名詞前方應為所有格；由 be 動詞 is 可知為個別所有，故 (D) 不可選。", "options": ["You", "They", "James’", "Mr. Li’s and Mrs. Lin’s"], "answer": 2}, {"id": 39, "question": "______ dad’s nose is big, but（但是）______ nose isn’t.", "exp": "空格後皆有名詞 dad’s nose 與 nose，可知空格應填所有格，故選 (D)。", "options": ["My; I", "I; my", "I; I", "My; my"], "answer": 3}, {"id": 40, "question": "A：Who’s that tall man over there（在那裡）?\nB：Oh, ______ our new PE teacher.", "exp": "man 是「男人」，代名詞用 he。", "options": ["he’s", "she’s", "I’m", "it’s"], "answer": 0}, {"id": 41, "question": "A：Is ______?\nB：No, she isn’t. She is happy.", "exp": "由答句可知，問句是問「某人悲傷嗎？」，句型為「Be 動詞＋主詞＋形容詞?」或「Be 動詞＋主詞＋（冠詞＋）形容詞＋名詞?」。", "options": ["teacher the sad", "sad the teacher", "the sad teacher", "the teacher sad"], "answer": 3}, {"id": 42, "question": "A：Is ______ our new teacher, Mr. Wang?\nB：Yes, you’re right.", "exp": "由 Mr. Wang 可知所指何人，故用指示代名詞 this。", "options": ["this", "his", "they", "it"], "answer": 0}, {"id": 43, "question": "A：______\nB：Yes. It’s really big.", "exp": "由答句可知 A 問「車子很大嗎？」，句型為「Be 動詞＋主詞＋形容詞?」。", "options": ["The car is not big.", "Is the car big?", "How big is the car?", "Is it a small car?"], "answer": 1}, {"id": 44, "question": "Jay：Isn’t Miss Lin home?\nIan：No, ______.", "exp": "回答否定疑問句時，跟回答肯定疑問句一樣：肯定句回答 Yes，否定句回答 No。由於 Miss Lin 為女性，故選 (C)。", "options": ["she is", "he is not", "she is not", "they are not"], "answer": 2}, {"id": 45, "question": "Mrs. Bryant ______.", "exp": "形容詞可放在 be 動詞後面，修飾主詞。", "options": ["a happy farmer", "is happy farmer", "is happy", "is a happy"], "answer": 2}, {"id": 46, "question": "A：Isn’t ______?\nB：Yes, she is my favorite singer. I love all her songs.", "exp": "由問句 be 動詞 Isn’t 可知主詞為第三人稱單數 woman，且答句已知所指何人，須在 woman 前面加定冠詞 the，句型為「Be 動詞＋主詞＋形容詞?」。", "options": ["women beautiful", "the beautiful woman", "woman beautiful", "the woman beautiful"], "answer": 3}, {"id": 47, "question": "______ Kevin and Vicky’s uncle ______?", "exp": "主詞為 Kevin 和 Vicky 共同的一個叔叔，應為單數名詞，須用單數 be 動詞 is 及單數名詞 a cook。", "options": ["Is; a cook", "Are; a cook", "Is; cook", "Are; cook"], "answer": 0}, {"id": 48, "question": "The cat is cute. ______ eyes are big.", "exp": "空格後的 eyes 為名詞，亦有 be 動詞 are 與形容詞 big，可知空格應填所有格，故選 (C)。", "options": ["They", "It’s", "Its", "It"], "answer": 2}, {"id": 49, "question": "A：Is that ______?\nB：No, he isn’t. He is 50 years old.", "exp": "形容詞的疑問句句型為「Be 動詞＋主詞＋形容詞?」。", "options": ["young man", "young a man", "man young", "a man young"], "answer": 2}, {"id": 50, "question": "Look at my sister’s smile（微笑）. She is ______.", "exp": "主詞 She 是單數，應用不定冠詞 a，且形容詞須放在名詞前面。", "options": ["happy girl", "happy a girl", "a happy girl", "a happy"], "answer": 2}, {"id": 51, "question": "A：Isn’t John your brother?\nB：______, he is my classmate.", "exp": "回答否定疑問句時，跟肯定疑問句一樣，回答內容與問句相同用 Yes，不同則用 No。", "options": ["No", "Yes", "Right", "╳"], "answer": 0}, {"id": 52, "question": "A：Your toy ______ cool. Where ______ from?\nB：Japan（日本）.", "exp": "toy 是單數物品，應搭配單數 be 動詞 is 與代名詞 it。", "options": ["is; is it", "is; it is", "are; are they", "are; they are"], "answer": 0}, {"id": 53, "question": "A：Our school is old.\nB：Yes, but（但是）it is ______.", "exp": "形容詞可放在名詞前面修飾名詞，也可放在 be 動詞後面修飾主詞。", "options": ["a big", "school big", "big", "a school big"], "answer": 2}, {"id": 54, "question": "A：Who is that boy? B：He is ______.", "exp": "疑問詞 Who 用在問「關係」或「姓名」，故選 my brother。", "options": ["a waiter", "tall", "my brother", "a student"], "answer": 2}, {"id": 55, "question": "The ______ in the room are so tall.", "exp": "由 be 動詞 are 可知，前方應為複數名詞。", "options": ["man", "men", "student", "a student"], "answer": 1}, {"id": 56, "question": "That boy is Bob. And robots are ______ favorite（最喜愛的）toys.", "exp": "由前句可知 Bob 是男孩，所有格用 his。", "options": ["she", "her", "he", "his"], "answer": 3}, {"id": 57, "question": "Mom：Bella, where’s your dad?\nBella：Isn’t he in the living room（客廳）?\nMom：______", "exp": "回答否定疑問句時，跟回答肯定疑問句一樣：肯定句回答 Yes，否定句回答 No。而且肯定簡答時，人稱代名詞跟 be 動詞不能縮寫。", "options": ["Yes, he’s.", "Yes, he isn’t.", "No, he isn’t.", "No, he is."], "answer": 2}, {"id": 58, "question": "A：Is Nancy a cook? B：No, ______.", "exp": "由回答 No，可知為否定，最符合文意之選項為「她是醫生」。", "options": ["she’s a cook", "she’s a doctor", "Nancy is good", "she’s not a doctor"], "answer": 1}, {"id": 59, "question": "A：Are you a student?\nB：No, ______. I’m a teacher at a junior high school.\nA：Really? You look like（看起來像）a student.", "exp": "注意答句人稱的轉換，問句為第二人稱時，須用第一人稱回答。", "options": ["you aren’t", "you’re not", "I’m not", "I am"], "answer": 2}, {"id": 60, "question": "The puppy is cute. ______ black with white spots（斑點）.", "exp": "由前句 be 動詞 is 可知為第三人稱單數，且形容詞前面應有主詞跟動詞，故選 It’s。", "options": ["Their", "It’s", "Its", "It"], "answer": 1}, {"id": 61, "question": "A：______ the beautiful woman your sister or cousin?\nB：______ is my cousin.", "exp": "由 woman 可知為第三人稱單數，用 be 動詞 Is 問；問句中有連接詞 or，不須先回答 Yes 或 No，直接回答即可。", "options": ["Is; No, she", "Are; No, she", "Is; She", "Are; She"], "answer": 2}, {"id": 62, "question": "A：This is ______.\nB：Wow! It’s beautiful and big.", "exp": "形容詞須放在名詞前面，人名的所有格是「人名+ ’s」，應放在形容詞前面。", "options": ["box", "Mr. Su’s box", "new box", "Mr. Su new box"], "answer": 1}, {"id": 63, "question": "A：Is she ______? B：Yes, she is.", "exp": "形容詞常置於名詞之前，並視情況加上冠詞。", "options": ["woman beautiful", "a woman beautiful", "beautiful woman", "a beautiful woman"], "answer": 3}, {"id": 64, "question": "A：Frank, ______ a cook?\nB：Yes, ______.", "exp": "(A) I am 要改成 you are；(B) Nick is 要改成 he is；(D) I’m 要改成 I am。", "options": ["am I; I am", "is Nick; Nick is", "is Rita; she is", "are you; I’m"], "answer": 2}, {"id": 65, "question": "Sam：Who’s the man in the photo（照片）?\nBrad：______（選錯的）", "exp": "由問句的疑問詞 who，可知應回答「關係」或「姓名」，故 (B) 選項錯誤。", "options": ["He’s my doctor.", "He’s a tall man.", "He’s my uncle.", "He’s Leo."], "answer": 1}, {"id": 66, "question": "A：Is this ______ watch new?\nB：No, it’s ______ old watch.", "exp": "問句中，this 是指示形容詞，watch 前面不用加冠詞；答句中，old 為母音開頭，不定冠詞用 an。", "options": ["a; ╳", "a; an", "╳; a", "╳; an"], "answer": 3}, {"id": 67, "question": "______ son is tall and thin.", "exp": "名詞前用所有格；由單數 be 動詞 is 可知在此的名詞為單數 son，為Leo 跟 Mary 兩人共同擁有。", "options": ["Leo and Mary", "Leo’s and Mary’s", "Leo and Mary’s", "Leo’s and Mary"], "answer": 2}, {"id": 68, "question": "A：______ you a nurse?\nB：Yes, ______.", "exp": "第一空格可用 Are 或 Aren’t；第二空格若是簡答，I’m 不可縮寫，要改成 I am，故選詳答。", "options": ["Am; you are", "Aren’t; I’m a nurse", "Are; I’m", "Is; she is"], "answer": 1}, {"id": 69, "question": "Look at ______ woman over there. She is our Chinese teacher.", "exp": "兩個以上的形容詞，其排序為：主觀評價＋大／小＋新／舊＋高／矮＋胖／瘦＋顏色，此處應為 beautiful（主觀）＋young（年輕）。由後句可知這個女人的身分，前面可加定冠詞 the。", "options": ["the beautiful young", "young beautiful", "beautiful young", "the young beautiful"], "answer": 0}, {"id": 70, "question": "That ______ car is good. My dad loves（喜愛）it.", "exp": "形容詞的排序是「新／舊＋顏色」，此處 that 當指示形容詞，後面不可接不定冠詞。", "options": ["a red old", "red old", "an old red", "old red"], "answer": 3}];

const $ = s => document.querySelector(s), list = $('#list'), select = $('#select'), quiz = $('#quiz'), result = $('#result'),
  question = $('#question'), answerArea = $('#answerArea'), feedback = $('#feedback'), explain = $('#explain'), next = $('#next');
let chosen = [], idx = 0;
const wrong = new Map(), correct = new Set();
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm = s => String(s).trim().toLowerCase().replace(/[’‘`]/g, "'").replace(/\s+/g, ' ');
const plain = s => String(s).replace(/<\/?u>/g, '');

/* sentence answers: contractions count as the full form; case and punctuation are checked separately */
const CONTRACTIONS = [[/\b(is|are|was|were|do|does|did|has|have|had)n't\b/gi, '$1 not'], [/\bcan't\b/gi, 'cannot'],
  [/\b(he|she|it|that|what|who|where|how|there|here)'s\b/gi, '$1 is'], [/\bi'm\b/gi, 'I am'], [/\b(you|we|they)'re\b/gi, '$1 are']];
function expand(s) { s = String(s).replace(/[’‘`]/g, "'").replace(/\s+/g, ' ').replace(/\s+([.,?!])/g, '$1').trim(); CONTRACTIONS.forEach(([r, t]) => s = s.replace(r, t)); return s; }
const loose = s => expand(s).toLowerCase().replace(/[.,?!;:]/g, '').replace(/\s+/g, ' ').trim();
function judgeSentence(q, value) {
  const strict = expand(value);
  if (q.answers.some(a => expand(a) === strict)) return 'ok';
  if (q.answers.some(a => loose(a) === loose(value))) return 'form';
  return 'bad';
}

function renderList() { list.innerHTML = Q.map(q => '<label class="pick"><input class="pickbox" type="checkbox" value="' + q.id + '" checked><b>第 ' + q.id + ' 題</b></label>').join(''); }
$('#all').onclick = () => document.querySelectorAll('.pickbox').forEach(x => x.checked = true);
$('#none').onclick = () => document.querySelectorAll('.pickbox').forEach(x => x.checked = false);
$('#start').onclick = () => {
  const ids = [...document.querySelectorAll('.pickbox:checked')].map(x => +x.value);
  if (!ids.length) return alert('請至少選一題。');
  chosen = Q.filter(q => ids.includes(q.id)); idx = 0; wrong.clear(); correct.clear();
  select.classList.add('hidden'); result.classList.add('hidden'); quiz.classList.remove('hidden'); show();
};
function show() {
  const q = chosen[idx];
  $('#meta').textContent = '第 ' + (idx + 1) + ' / ' + chosen.length + ' 題';
  $('#wrongCount').textContent = '曾答錯 ' + wrong.size + ' 題';
  $('#bar').style.width = (idx + 1) / chosen.length * 100 + '%';
  // question text is escaped; only <u> (underlined part of the prompt) is let through
  question.innerHTML = esc(q.question).replace(/&lt;u&gt;/g, '<u>').replace(/&lt;\/u&gt;/g, '</u>') + (q.img ? '<img alt="題目圖片" src="' + IMG[q.img] + '">' : '');
  const zh = $('#zh'); if (q.zh) { zh.textContent = q.zh; zh.classList.remove('hidden'); } else zh.classList.add('hidden');
  feedback.className = 'feedback hidden'; explain.classList.add('hidden');
  $('#check').classList.remove('hidden'); next.classList.add('hidden');
  if (MODE === 'mcq') answerArea.innerHTML = '<div class="options">' + q.options.map((o, i) => '<label class="option"><input type="radio" name="answer" value="' + i + '"><b>' + String.fromCharCode(65 + i) + '.</b> ' + esc(o) + '</label>').join('') + '</div>';
  else answerArea.innerHTML = '<div class="inputs"><div class="answer-row"><label>答案</label><input class="spell" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="' + (MODE === 'sentence' ? '請輸入完整句子（注意大小寫與標點）' : '請輸入完整單字') + '"></div></div>';
  setTimeout(() => answerArea.querySelector('input')?.focus(), 0);
}
function correctText(q) { return MODE === 'mcq' ? String.fromCharCode(65 + q.answer) + '. ' + q.options[q.answer] : MODE === 'sentence' ? q.show : q.answers.join(' / '); }
function showExplain(q) { if (!q.exp) return; explain.innerHTML = '<b>詳解</b>' + esc(q.exp); explain.classList.remove('hidden'); }
function check() {
  const q = chosen[idx];
  let given, ok, formNote = false;
  if (MODE === 'mcq') {
    const x = answerArea.querySelector('input:checked'); if (!x) return alert('請完成所有答案。');
    given = String.fromCharCode(65 + (+x.value)); ok = +x.value === q.answer;
  } else {
    given = answerArea.querySelector('.spell').value; if (!given.trim()) return alert('請完成所有答案。');
    if (MODE === 'sentence') { const j = judgeSentence(q, given); ok = j !== 'bad'; formNote = j === 'form'; }
    else ok = q.answers.some(a => norm(a) === norm(given));
  }
  if (ok) {
    correct.add(q.id); feedback.className = 'feedback ok';
    if (formNote) feedback.innerHTML = '✅ 句子正確！但請注意<strong>大小寫與標點</strong>，標準寫法：<strong>' + esc(q.show) + '</strong>';
    else feedback.textContent = '✅ 全部正確！';
    showExplain(q);
    $('#check').classList.add('hidden'); next.classList.remove('hidden'); next.focus();
  } else {
    if (!wrong.has(q.id)) wrong.set(q.id, { q, attempts: [] });
    wrong.get(q.id).attempts.push(given);
    $('#wrongCount').textContent = '曾答錯 ' + wrong.size + ' 題';
    feedback.className = 'feedback bad';
    feedback.innerHTML = '❌ 答案不正確。正確答案：<strong>' + esc(correctText(q)) + '</strong><br>請重新作答。';
    showExplain(q);
    if (MODE === 'mcq') answerArea.querySelectorAll('input').forEach(x => x.checked = false); else answerArea.querySelector('.spell').value = '';
    answerArea.querySelector('input')?.focus();
  }
}
$('#check').onclick = check;
answerArea.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList.contains('spell')) { e.preventDefault(); check(); } });
next.onclick = () => { idx++; idx >= chosen.length ? finish() : show(); };
$('#finish').onclick = finish;
function finish() {
  quiz.classList.add('hidden'); result.classList.remove('hidden');
  $('#summary').innerHTML = '<div class="stat">選擇題數<b>' + chosen.length + '</b></div><div class="stat">完成答對<b>' + correct.size + '</b></div><div class="stat">曾答錯<b>' + wrong.size + '</b></div>';
  $('#wrongList').innerHTML = wrong.size ? [...wrong.values()].map((r, i) => '<div class="wrong"><b>' + (i + 1) + '. 第 ' + r.q.id + ' 題</b><p>' + esc(plain(r.q.question)) + '</p><p><strong>錯誤答案：</strong>' + r.attempts.map(esc).join('；') + '</p><p><strong>正確答案：</strong>' + esc(correctText(r.q)) + '</p>' + (r.q.exp ? '<p><strong>詳解：</strong>' + esc(r.q.exp) + '</p>' : '') + '</div>').join('') : '<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>';
  $('#download').classList.toggle('hidden', !wrong.size);
}
$('#restart').onclick = () => { result.classList.add('hidden'); select.classList.remove('hidden'); };
$('#download').onclick = async () => {
  if (!wrong.size) return;
  const rows = [...wrong.values()], name = TITLE + '_錯題_' + new Date().toISOString().slice(0, 10);
  const save = (blob, ext) => { const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = name + ext; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); };
  try {
    const { Document, Packer, Paragraph, TextRun, HeadingLevel } = await import('https://esm.sh/docx@9.5.1');
    const line = (label, text) => new Paragraph({ children: [new TextRun({ text: label, bold: true }), new TextRun({ text })] });
    const children = [new Paragraph({ heading: HeadingLevel.TITLE, children: [new TextRun({ text: TITLE + ' 錯題紀錄', bold: true })] })];
    rows.forEach((r, i) => {
      children.push(new Paragraph({ heading: HeadingLevel.HEADING_2, children: [new TextRun({ text: (i + 1) + '. 第 ' + r.q.id + ' 題', bold: true })] }));
      plain(r.q.question).split('\n').forEach(t => children.push(new Paragraph({ children: [new TextRun({ text: t })] })));
      if (MODE === 'mcq') children.push(new Paragraph({ children: [new TextRun({ text: r.q.options.map((o, k) => '(' + String.fromCharCode(65 + k) + ') ' + o).join('　') })] }));
      children.push(line('錯誤答案：', r.attempts.join('；')), line('正確答案：', correctText(r.q)));
      if (r.q.exp) children.push(line('詳解：', r.q.exp));
    });
    save(await Packer.toBlob(new Document({ sections: [{ children }] })), '.docx');
  } catch (e) {   // offline or CDN blocked
    const txt = rows.map((r, i) => (i + 1) + '. 第 ' + r.q.id + ' 題\n' + plain(r.q.question) + '\n錯誤答案：' + r.attempts.join('；') + '\n正確答案：' + correctText(r.q) + (r.q.exp ? '\n詳解：' + r.q.exp : '') + '\n').join('\n');
    save(new Blob([TITLE + ' 錯題紀錄\n\n' + txt], { type: 'text/plain;charset=utf-8' }), '.txt');
  }
};
renderList();
</script></body></html>
