r-row label{font-weight:800;min-width:58px}.answer-input{font:inherit;font-size:18px;padding:9px 10px;border:2px solid #94a3b8;border-radius:9px;flex:1;min-width:0}.answer-input.ok{border-color:var(--ok);background:var(--okbg)}.answer-input.bad{border-color:var(--bad);background:var(--badbg)}.picture{display:block;max-width:100%;max-height:330px;object-fit:contain;margin:12px auto;border:1px solid var(--line);border-radius:12px;background:#fff}.feedback,.voicebox{padding:13px;margin-top:14px;border-radius:10px}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.voicebox{background:var(--voicebg);border:2px solid #ddd6fe}.target{font-size:19px;font-weight:800;margin:6px 0 10px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}@media(max-width:640px){.wrap{padding:10px}.hero,.card{padding:15px}.stem{font-size:18px}}

const TITLE="翰林 Book 4 Unit 3 第二大題 文法選擇",KIND="mcq",Q=[{"id":1,"stem":"(   ) Simon is a factory worker.  He gets tired 　　　.","options":["easy","easier","easily","easiest"],"answer":2,"explanation":"gets tired　是「連綴動詞+形容詞」，因此使用副詞　easily　修飾動詞　gets，選(C)。"},{"id":2,"stem":"(   ) My father is a 　　　 driver.  He always drives 　　　.","options":["careful; carefully","carefully; careful","careful; careful","carefully; carefully"],"answer":0,"explanation":"形容詞　careful　修飾名詞　driver，而副詞　carefully　修飾其前的動詞　drives。"},{"id":3,"stem":"(   ) If（如果）I finish my homework before eight o’clock, my parents will let me 　　　 TV for one hour.〔94.基測Ⅱ〕","options":["watch","watching","to watch","have watched"],"answer":0,"explanation":"使役動詞　let＋受詞＋原形　V...。"},{"id":4,"stem":"(   ) Deborah put some sugar and cream（奶油）in her coffee to make it 　　　 better.〔97.基測Ⅱ〕","options":["taste","tasted","tasting","to taste"],"answer":0,"explanation":"使役動詞　make＋受詞＋原形　V。"},{"id":5,"stem":"(   ) I like summer 　　　 than all the other seasons because I can eat as much ice cream as I can and also go swimming.","options":["less","worse","fewer","more"],"answer":3,"explanation":"喜歡夏天「勝過」其他季節，可用　more　或　better　修飾動作。"},{"id":6,"stem":"(   ) Alex: 　　　 does Jimmy swim?  Brian: He swims slowly.","options":["How","What","Why","Where"],"answer":0,"explanation":"詢問「如何」做某動作，疑問詞用　How。"},{"id":7,"stem":"(   ) Jacky jumps 　　　 than any other student in his class, but he does not want to join the school team.  His PE teacher will talk with him 　　　 about it later.","options":["farther; farther","further; further","farther; further","further; farther"],"answer":2,"explanation":"第一空格是「實質距離上更遠」用　farther；第二空格是「程度上更深遠」用　further。"},{"id":8,"stem":"(   ) Anna: Didn’t he run 　　　?  Pete: No, he ran 　　　.","options":["fast; fast","slow; fast","slowly; fast","slowly; slowly"],"answer":2,"explanation":"用　No　回答，答句中又沒有　not　成分，表示問句與答句兩副詞要互為相反詞。"},{"id":9,"stem":"(   ) The old man is looking at his granddaughter 　　　.  He has not seen（已沒有見過）her for a long time.","options":["happy","happier","happily","the happiest"],"answer":2,"explanation":"... looking at...＋副詞（正…地看著…）。"},{"id":10,"stem":"(   ) Don’t let kids 　　　 bicycles on this busy street; it’s very dangerous.〔111.會考補考〕","options":["ride","to ride","riding","are riding"],"answer":0,"explanation":"let（讓）是使役動詞，後面接原形動詞，故選(Ａ)。"},{"id":11,"stem":"(   ) Michael didn’t finish the homework, so his mom didn’t let him 　　　 basketball with us.","options":["play","to play","playing","played"],"answer":0,"explanation":"使役動詞　let＋受詞＋原形　V...。"},{"id":12,"stem":"(   ) She 　　　 her mom to do the housework.","options":["let","made","had","helped"],"answer":3,"explanation":"只有(Ｄ)　helped　之後可接原形　V... 或　to V...。其他選項之後的動作須是原形　V...。"},{"id":13,"stem":"(   ) My mom asked me to drive 　　　 this morning, but I was not 　　　 enough.  I hit a taxi and hurt my head.","options":["careful; carefully","carefully; careful","careful; careful","carefully; carefully"],"answer":1,"explanation":"第一空格用「副詞」修飾動詞　drive；第二空格「人不夠小心」，只須用「形容詞」。"},{"id":14,"stem":"(   ) Julia is a 　　　 girl.  She always does everything 　　　.","options":["happy; happy","happily; happily","happily; happy","happy; happily"],"answer":3,"explanation":"「形容詞」修飾名詞，而「副詞」修飾動作。"},{"id":15,"stem":"(   ) Of all the cars, the blue one is the cheapest because it runs 　　　.","options":["slow","slowly","most slowly","more slowly"],"answer":2,"explanation":"所有的車子中，這臺藍色的車子是最便宜的，因為它跑得「最慢」。"},{"id":16,"stem":"(   ) Steve 　　　 his son take out the trash.","options":["asked","made","wanted","told"],"answer":1,"explanation":"使役動詞　made＋受詞＋原形　V...。其他選項之後的動作須是　to V...。"},{"id":17,"stem":"(   ) Sam, don’t be late for school again, or（否則）I’ll 　　　 you stand in the back of the classroom for fifteen minutes.","options":["ask","have","get","help"],"answer":1,"explanation":"Sam，不要又上學遲到，否則我會「叫」你站在教室的後面十五分鐘。(Ａ)(Ｃ)之後須接　to stand　(Ｄ)語意不符。"},{"id":18,"stem":"(   ) My sister 　　　 me put on my sweater because it was hard to put it on.","options":["helped","had","made","let"],"answer":0,"explanation":"我姐姐「幫忙」我把毛衣穿上，因為它很難穿上。"},{"id":19,"stem":"(   ) My mom cooks more 　　　 than my sister and me; she cooks 　　　 of the three.","options":["badly; worst","worse; most terribly","terribly; the worst","better; the best"],"answer":2,"explanation":"more　已是「比較級」，不可再接比較級的字（worse / better），尤其注意　badly　的比較級是「不規則變化」worse，絕不可以是　more badly，故選(Ｃ)。"},{"id":20,"stem":"(   ) My dad makes me 　　　 him 　　　 the car on Sunday mornings, and then he plays basketball with me in his free time.","options":["to help; to wash","help; washes","helping; washing","help; to wash"],"answer":3,"explanation":"使役動詞　make　之後接原形　V...，而　help　之後則可接原形　V... 或　to V... 。"},{"id":21,"stem":"(   ) Alex is a 　　　 runner than Mary.  He runs 　　　 than her.","options":["more slowly; the more slowly","slower; the slower","slower; more slowly","the more slowly; slower"],"answer":2,"explanation":"第一空格用形容詞　slow　的比較級，修飾名詞　runner，第二空格則用副詞「慢慢地」的比較級，可用　more slowly　或　slower　作答。"},{"id":22,"stem":"(   ) The movie last night made her 　　　.","options":["to feel sad","felt sad","feeling sad","sad"],"answer":3,"explanation":"使役動詞　made＋受詞＋原形　V... / 形容詞。"},{"id":23,"stem":"(   ) Josh likes English the 　　　 because he never does well on English tests（考試）.","options":["best","least","more","less"],"answer":1,"explanation":"Josh「最不」喜歡英語，因為他英語考試從沒考好過。"},{"id":24,"stem":"(   ) Why can’t time go much 　　　?  I need more time to finish doing my math homework.","options":["slower","most slowly","quicker","more quickly"],"answer":0,"explanation":"時間不能過得「更慢」些嗎？much　之後修飾副詞比較級　slower　或　more slowly　作答。"},{"id":25,"stem":"(   ) Jacky looked 　　　 at the party, and he looked 　　　 at everyone around him.","options":["sad; sad","sadly; sadly","sad; sadly","sadly; sad"],"answer":2,"explanation":"第一空格　looked（看起來）是連綴動詞，其後接「形容詞」；第二空格　looked... at...（看著…）是雙字片語動詞，須用「副詞」修飾。"},{"id":26,"stem":"(   ) Would you speak 　　　?  I want to hear you 　　　 clearly.","options":["more loudly; less","louder; more","less loudly; more","louder; less"],"answer":1,"explanation":"講「更大聲」，可用　louder　或　more loudly，以便「更清楚地」聽見，用　more clearly。"},{"id":27,"stem":"(   ) Miss Chen had him 　　　 the door.","options":["to open","opening","open","opened"],"answer":2,"explanation":"使役動詞　had＋受詞＋原形　V...。"},{"id":28,"stem":"(   ) My dad does not want me to spend too little time studying English.  He asks me to study English more 　　　.","options":["often","better","hard","early"],"answer":0,"explanation":"我爸爸不要我花費太少的時間研讀英語。他要求我要「更常」讀英語。(Ｂ)已是比較級，其前不可出現　more　(Ｃ)(Ｄ)比較級形式分別是　harder / earlier。"},{"id":29,"stem":"(   ) My mother 　　　 me send a letter（信）yesterday.〔93.基測Ⅰ〕","options":["asked","had","told","wanted"],"answer":1,"explanation":"使役動詞　have / has / had＋受詞＋原形　V...。(Ａ)(Ｃ)(Ｄ)之後須接　to V...。"},{"id":30,"stem":"(   ) Bill: Does Roy cook more 　　　 than Joe or Leo?  Hank: That’s right.  He cooks 　　　 of the three.","options":["badly; most poorly","worse; the worst","poor; the poorest","terribly; most terribly"],"answer":3,"explanation":"修飾動作須用副詞，前半句「比較級」可用　worse / more poorly / more terribly；後半句「最高級」可用(the) worst / most poorly / most terribly　作答。"},{"id":31,"stem":"(   ) Of all the dancers at the party, Ruth dances 　　　.  I want to learn something from her.","options":["the most beautiful","much more slowly","loudest","the best"],"answer":3,"explanation":"在派對上所有的舞者中，Ruth　跳得「最好」，用「副詞最高級」，(Ａ)　beautiful　須改成　beautifully　(Ｃ)語意不合。"},{"id":32,"stem":"(   ) Be as 　　　 as you can.","options":["careful","carefully","less careful","more careful"],"answer":0,"explanation":"Be　動詞之後接「形容詞」即可，而　as... as　只須用原級作答。"},{"id":33,"stem":"(   ) Honey, I can’t walk any 　　　.  Why don’t we sit under the tree first and talk 　　　 about our trip to Japan next month?","options":["farther; further","farther; farther","further; farther","further; further"],"answer":0,"explanation":"不能再走「更遠」，用「實質距離上」的字　farther；「再更進一步」談論下個月日本之旅，用「程度上」的字　further。"},{"id":34,"stem":"(   ) Billy: I’ve been fixing（一直在修理）the computer for over three hours, but it still doesn’t work.  Nana: Why don’t you take a rest and try 　　　?  Maybe you’ll do better then.〔99.基測Ⅰ〕","options":["early","finally","later","once"],"answer":2,"explanation":"Billy　一直在修電腦三個多小時了，但仍然行不通。Nana　要他「待會兒」再試。或許屆時他會做得更好。"},{"id":35,"stem":"(   ) Mom 　　　 me to take out the trash last night.","options":["had","made","asked","let"],"answer":2,"explanation":"人1＋asked（要求）＋人2＋to V...。其他選項都是使役動詞，其後須接原形　V...。"},{"id":36,"stem":"(   ) Jim just got his wife 　　　 all the floors.","options":["mop","mopping","to mop","mopped"],"answer":2,"explanation":"使役動詞　get(s) / got（要…做…）接完受詞後，須接不定詞（to V...）的形式。"},{"id":37,"stem":"(   ) Your English is much 　　　 than your brother’s, so you need to study more 　　　.","options":["bad; harder","worse; often","more terrible; long","poorer; early"],"answer":1,"explanation":"英語「比較差」，可用　bad　的比較級　worse / more terrible / poorer，而第二空格(Ｃ)(Ｄ)的比較級分別為　longer / earlier。"},{"id":38,"stem":"(   ) Jack helped his mother 　　　 the car a few minutes ago.","options":["washing","washes","washed","to wash"],"answer":3,"explanation":"動詞　helped＋受詞＋原形　V / to V...。"},{"id":39,"stem":"(   ) Drive as 　　　 as you can.","options":["careful","carefully","more careful","more carefully"],"answer":1,"explanation":"一般動詞　Drive　之後接「副詞」，而　as... as　只須用原級即可。"},{"id":40,"stem":"(   ) Jo likes summer the 　　　 because she has serious（嚴重的）problems sleeping in the summer heat（高溫）.〔100.基測Ⅱ〕","options":["first","best","last","least"],"answer":3,"explanation":"Jo「最不」喜歡夏天因為她很難在夏季高溫下睡得好。"},{"id":41,"stem":"(   ) Joe practices very 　　　 because he wants to be on the school basketball team.","options":["fast","hardly","wonderful","hard"],"answer":3,"explanation":"「努力地」練習，副詞是　hard，而　hardly　是「幾乎不」之意。"},{"id":42,"stem":"(   ) Joe: Don’t you cook 　　　 than your dad and mom?  Liz: No.  I cook the most 　　　 of all.","options":["better; best","worse; badly","better; poorly","worse; well"],"answer":2,"explanation":"否定回答，表示問句與答句所用的副詞必須是語氣相反，第一空格用比較級，第二空格用最高級，可用　the worst / the most poorly / the most terribly　表達「最差」。"},{"id":43,"stem":"(   ) Mia: Try hard to jump as 　　　 as you can.  Ben: All right.  I’ll try my best to jump 　　　 at our school.","options":["far; the farther","far; farthest","farthest; the farthest","farther; the farther"],"answer":1,"explanation":"as... as　之間用副詞原級（far）修飾動作　jump，而　at our school　之前則用副詞最高級（the）farthest　修飾動詞　jump。"},{"id":44,"stem":"(   ) All the packages（包裹）are 　　　 checked（被檢查）at the airport to keep everyone safe.〔95.基測Ⅰ〕","options":["careful","carefully","more careful","the most careful"],"answer":1,"explanation":"在飛機場所有的包裹都要「小心地」檢查，副詞才能修飾動作。"},{"id":45,"stem":"(   ) 　　　 the earth, I’ll get my husband 　　　 to work less often.","options":["Help to save; to drive","Helping to save; drive","To help save; to drive","Help save; driving"],"answer":2,"explanation":"第一空格用「不定詞…」表達「目的」；第二空格則是較特殊的使役動詞，須是人1＋get(s)＋人2＋to V...（人1　叫人2　做　V　…的動作）。"},{"id":46,"stem":"(   ) It’s raining 　　　.  We can’t go out, so why not just study 　　　 at home?","options":["heavy; hard","hard; hard","heavily; hardly","heavy; hardly"],"answer":1,"explanation":"「下大雨」可用　rain hard / heavily　表達，而「努力地讀書」則用　study hard。hardly　是「幾乎不」之意。"},{"id":47,"stem":"(   ) Vivian dances more 　　　 than any other girl at the party.","options":["badly","beautiful","better","poorly"],"answer":3,"explanation":"修飾動詞須用副詞，而已有　more，不可再用比較級　better。(Ａ)　badly　的比較級是　worse　(Ｂ)須改成　beautifully。"},{"id":48,"stem":"(   ) Mrs. Lin 　　　 her 　　　 TV two hours ago.","options":["let; to watch","lets; watched","let; watch","lets; watch"],"answer":2,"explanation":"句尾時間　two hours ago（兩小時前），須用動詞過去式　let，其後則接原形　V...。"}];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=s=>String(s??'').trim().toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:()“”"]/g,'').replace(/\s+/g,' ');
let chosen=[],idx=0;const wrong=new Map(),attempted=new Set(),correct=new Set();
function preview(q){return KIND==='mcq'?q.stem:q.prompt}
function renderList(){$('#list').innerHTML=Q.map(q=>`<label class="pick"><input class="pickbox" type="checkbox" value="${q.id}" checked><span><b>第 ${q.id} 題</b><small>${esc(preview(q))}</small></span></label>`).join('')}
function setAll(v){document.querySelectorAll('.pickbox').forEach(x=>x.checked=v)}
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
$('#all').onclick=()=>setAll(true);$('#none').onclick=()=>setAll(false);$('#random').onclick=()=>{setAll(false);const ids=new Set(shuffled(Q).slice(0,20).map(q=>q.id));document.querySelectorAll('.pickbox').forEach(x=>x.checked=ids.has(+x.value))};
$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));idx=0;wrong.clear();attempted.clear();correct.clear();$('#select').classList.add('hidden');$('#result').classList.add('hidden');$('#quiz').classList.remove('hidden');show()};
function show(){if(window.speechSynthesis)speechSynthesis.cancel();const q=chosen[idx];$('#meta').textContent=`第 ${idx+1} / ${chosen.length} 題｜原題 ${q.id}`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=`${idx/chosen.length*100}%`;$('#stem').textContent=KIND==='mcq'?q.stem:q.prompt;const pic=$('#picture');if(q.image){pic.src=q.image;pic.classList.remove('hidden')}else{pic.classList.add('hidden');pic.removeAttribute('src')};if(KIND==='mcq'){$('#area').className='options';$('#area').innerHTML=q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b><span>${esc(o)}</span></label>`).join('')}else{$('#area').className='answer-grid';$('#area').innerHTML=q.answers.map((a,i)=>`<div class="answer-row"><label>空格 ${i+1}</label><input class="answer-input" data-i="${i}" autocomplete="off" spellcheck="false" placeholder="請輸入答案"></div>`).join('')};$('#feedback').className='feedback hidden';$('#voicebox').classList.add('hidden');$('#check').classList.remove('hidden');$('#next').classList.add('hidden')}
function remember(q,value){if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(value);$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
function spoken(q){if(KIND==='mcq')return q.stem+' '+q.options[q.answer];return q.answers.map(a=>a.accepted[0]).join(' ')}
function speak(){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(spoken(chosen[idx]));u.lang='en-US';u.rate=.88;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/^en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;speechSynthesis.speak(u)}
function success(q){correct.add(q.id);$('#bar').style.width=`${(idx+1)/chosen.length*100}%`;$('#feedback').className='feedback ok';$('#feedback').innerHTML='✅ 全部正確！<br>'+esc(q.explanation||'');$('#target').textContent=spoken(q);$('#voicebox').classList.remove('hidden');$('#check').classList.add('hidden');$('#next').classList.remove('hidden');speak()}
$('#check').onclick=()=>{const q=chosen[idx];attempted.add(q.id);if(KIND==='mcq'){const sel=document.querySelector('input[name=answer]:checked');if(!sel)return alert('請先選擇答案。');const n=+sel.value;if(n===q.answer)return success(q);remember(q,String.fromCharCode(65+n)+'. '+q.options[n]);$('#feedback').className='feedback bad';$('#feedback').innerHTML=`❌ 答錯了。正確答案：<strong>${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</strong><br>${esc(q.explanation||'')}<br>請重新選擇正確答案。`;return}const ins=[...document.querySelectorAll('.answer-input')];if(ins.some(x=>!x.value.trim()))return alert('請完成所有答案。');const bad=[];ins.forEach((input,i)=>{const a=q.answers[i];input.classList.remove('ok','bad');if(a.accepted.some(x=>norm(x)===norm(input.value))){input.classList.add('ok');input.disabled=true}else{input.classList.add('bad');bad.push(`${i+1}. ${input.value} → ${a.display}`);input.value=''}});if(!bad.length)return success(q);remember(q,bad.join('；'));$('#feedback').className='feedback bad';$('#feedback').innerHTML=`❌ 有 ${bad.length} 格不正確。<br>正確答案：${q.answers.map((a,i)=>`${i+1}. <strong>${esc(a.display)}</strong>`).join('；')}<br>${esc(q.explanation||'')}<br>請依提示重新填寫。`;ins.find(x=>!x.disabled)?.focus()};
$('#speak').onclick=speak;$('#next').onclick=()=>{idx++;idx>=chosen.length?finish():show()};$('#finish').onclick=finish;
function answerText(q){return KIND==='mcq'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.answerRaw}
function finish(){if(window.speechSynthesis)speechSynthesis.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');$('#summary').innerHTML=`<div class="stat">選擇題數<b>${chosen.length}</b></div><div class="stat">已作答<b>${attempted.size}</b></div><div class="stat">完成答對<b>${correct.size}</b></div><div class="stat">曾答錯<b>${wrong.size}</b></div>`;$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>`<div class="wrong"><b>${i+1}. 原題 ${r.q.id}｜${esc(preview(r.q))}</b><p>錯誤紀錄：${r.attempts.map(esc).join('<br>')}</p><p><strong>正確答案：</strong>${esc(answerText(r.q))}</p><p>${esc(r.q.explanation||'')}</p></div>`).join(''):'<div class="feedback ok">🎉 沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size)}
$('#restart').onclick=()=>location.reload();$('#download').onclick=async()=>{if(!wrong.size)return;const rows=[...wrong.values()],stamp=new Date().toISOString().slice(0,10),name=TITLE.replace(/\s+/g,'_')+'_錯題_'+stamp;const save=(blob,ext)=>{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name+ext;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};try{const{Document,Packer,Paragraph,TextRun,HeadingLevel}=await import('https://esm.sh/docx@9.5.1');const children=[new Paragraph({heading:HeadingLevel.TITLE,children:[new TextRun({text:TITLE+' 錯題紀錄',bold:true})]})];rows.forEach((r,i)=>{children.push(new Paragraph({heading:HeadingLevel.HEADING_2,children:[new TextRun({text:`${i+1}. 原題 ${r.q.id}`,bold:true})]}),new Paragraph({text:preview(r.q)}),new Paragraph({children:[new TextRun({text:'錯誤紀錄：',bold:true}),new TextRun({text:r.attempts.join(' | ')})]}),new Paragraph({children:[new TextRun({text:'正確答案：',bold:true}),new TextRun({text:answerText(r.q)})]}),new Paragraph({children:[new TextRun({text:'解析：',bold:true}),new TextRun({text:r.q.explanation||''})]}))});save(await Packer.toBlob(new Document({sections:[{children}]})),'.docx')}catch(e){save(new Blob([TITLE+' 錯題紀錄\n\n'+rows.map(r=>preview(r.q)+'\n正確答案：'+answerText(r.q)+'\n').join('\n')],{type:'text/plain;charset=utf-8'}),'.txt')}};
renderList();
</script></body></html>
