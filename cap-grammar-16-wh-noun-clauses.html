<script>window.QUIZ_CONFIG={"title": "國中會考文法歷屆試題｜疑問詞、WH名詞子句、that名詞子句", "mode": "mcq", "questions": [{"id": 1, "question": "Jill: Have you decided ______ you will celebrate your 30th birthday?\nSue: Yeah, I'm going to have a big barbecue party.", "options": ["how", "where", "what", "when"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜WH 名詞子句 how（如何）", "explanation": "【句型】decide ＋ 疑問詞 ＋ S ＋ V（間接問句當受詞，用直述句語序）\n【分析】Sue 回答「要辦一個烤肉派對」，說的是慶祝的「方式」，所以問 how you will celebrate。\n【其他選項】(B) where 應回答地點；(C) what 需要子句缺受詞，但 celebrate 已有受詞 your 30th birthday；(D) when 應回答時間。\n【例句】I don't know how I can get to the museum.", "explanationSource": "source"}, {"id": 2, "question": "Tim: Do you know ______ the concert will start?\nLisa: At seven thirty, I think.", "options": ["where", "when", "why", "who"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 1 題）", "explanation": "回答「七點半」是時間，用 when。", "explanationSource": "supplemental"}, {"id": 3, "question": "Mom: Can you tell me ______ you got this cut on your arm?\nRay: I fell off my bike on the way home.", "options": ["what", "who", "which", "how"], "answer": 3, "answerLabel": "D", "source": "類似題 2（對應第 1 題）", "explanation": "回答受傷的經過方式，用 how。", "explanationSource": "supplemental"}, {"id": 4, "question": "Have you decided ______ you will go for the summer vacation?\nI'm going to Hualien with my family.", "options": ["where", "what", "who", "how much"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 1 題）", "explanation": "回答「花蓮」是地點，用 where。", "explanationSource": "supplemental"}, {"id": 5, "question": "Alice: Do you know ______ Grandma is going to visit us?\nWilly: It's next week. She told me on the phone. And we'll take her to the national park.", "options": ["where", "when", "whether", "why"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜WH 名詞子句 when（何時）", "explanation": "【句型】Do you know ＋ 疑問詞 ＋ S ＋ V？（間接問句）\n【分析】Willy 回答「It's next week」，是時間，所以問 when Grandma is going to visit us。\n【其他選項】(A) where 應回答地點；(C) whether 應回答是否（Yes/No）；(D) why 應回答原因。\n【例句】Do you know when the next bus will come?", "explanationSource": "source"}, {"id": 6, "question": "Ann: Do you know ______ Mr. Wu is absent today?\nBen: He has a bad cold.", "options": ["why", "when", "where", "what"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 5 題）", "explanation": "回答「他重感冒」是原因，用 why。", "explanationSource": "supplemental"}, {"id": 7, "question": "Kim: Could you tell me ______ the library is?\nMan: It's across from the post office.", "options": ["when", "why", "where", "whether"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 5 題）", "explanation": "回答位置，用 where。", "explanationSource": "supplemental"}, {"id": 8, "question": "Sam: I wonder ______ the school sports day will be held.\nJoy: On November 20th.", "options": ["where", "who", "what", "when"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 5 題）", "explanation": "回答日期，用 when。", "explanationSource": "supplemental"}, {"id": 9, "question": "George: ______ do you practice playing the piano?\nTommy: When my mom is at home, I have to practice EVERY DAY, but she's away on a business trip this week!", "options": ["How about", "How long", "How much", "How often"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜疑問詞 How often（頻率）", "explanation": "【句型】How often ＋ 助動詞 ＋ S ＋ V？問「多久一次」（頻率）\n【分析】Tommy 回答「媽媽在家時要 EVERY DAY 練習」，是頻率，所以用 How often。\n【其他選項】(A) How about 提議或詢問意見，後接名詞／Ving；(B) How long 問時間長度；(C) How much 問價錢或數量。\n【例句】How often do you go to the gym? — Twice a week.", "explanationSource": "source"}, {"id": 10, "question": "Lily: ______ does it take to walk to the MRT station?\nOscar: About ten minutes.", "options": ["How often", "How long", "How far", "How many"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 9 題）", "explanation": "回答「十分鐘」是所需時間長度，用 How long。", "explanationSource": "supplemental"}, {"id": 11, "question": "Dad: ______ do you clean your room?\nAmy: Once a week, on Saturday.", "options": ["How often", "How soon", "How long", "How much"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 9 題）", "explanation": "回答「一週一次」是頻率，用 How often。", "explanationSource": "supplemental"}, {"id": 12, "question": "Jay: ______ is your school from your home?\nEric: About two kilometers.", "options": ["How long", "How often", "How far", "How soon"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 9 題）", "explanation": "回答距離「兩公里」，用 How far。", "explanationSource": "supplemental"}, {"id": 13, "question": "Ken: ______ is a boat ticket for children?\nPaul: How old is your child? It's free for kids under three years old.", "options": ["How long", "How much", "How often", "How soon"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜疑問詞 How much（價錢）", "explanation": "【句型】How much ＋ be ＋ 物品？詢問價錢\n【分析】Paul 回答「三歲以下免費（free）」，說的是票價，所以問 How much is a boat ticket。\n【其他選項】(A) How long 問時間長度；(C) How often 問頻率；(D) How soon 問「多快、還要多久」。\n【例句】How much is this T-shirt? — It's 300 dollars.", "explanationSource": "source"}, {"id": 14, "question": "Customer: ______ are these apples?\nClerk: Three for 100 dollars.", "options": ["How many", "How old", "How much", "How long"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 13 題）", "explanation": "回答價錢「三顆一百元」，用 How much。", "explanationSource": "supplemental"}, {"id": 15, "question": "Nick: ______ will the train arrive?\nStaff: In five minutes.", "options": ["How soon", "How much", "How often", "How far"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 13 題）", "explanation": "回答「五分鐘後」，問還要多快，用 How soon。", "explanationSource": "supplemental"}, {"id": 16, "question": "Teacher: ______ students are there in your class?\nJoe: Twenty-eight.", "options": ["How much", "How long", "How often", "How many"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 13 題）", "explanation": "students 為可數名詞，問數量用 How many。", "explanationSource": "supplemental"}, {"id": 17, "question": "We are surprised that Sally and Ray decided to get married. No one knows ______. They often fight with each other and are unhappy together.", "options": ["why", "where", "when", "how"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜WH 名詞子句（省略）why", "explanation": "【句型】know ＋ 疑問詞（＋ S ＋ V）；此處 why 後省略 they decided to get married\n【分析】大家很驚訝，因為他們常吵架、在一起不快樂，所以沒人知道他們「為什麼」要結婚，用 why。\n【其他選項】(B) where 地點；(C) when 時間；(D) how 方式，都不能解釋後句「常吵架」所帶出的疑惑。\n【例句】Lisa left the party early, but nobody knows why.", "explanationSource": "source"}, {"id": 18, "question": "Ray was not at school today, and his teacher doesn't know ______. Maybe he is sick.", "options": ["where", "why", "what", "which"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 17 題）", "explanation": "後句猜測「也許生病了」，是在推測原因，用 why。", "explanationSource": "supplemental"}, {"id": 19, "question": "I want to visit Sun Moon Lake, but I'm not sure ______ to get there. Is there a bus?", "options": ["how", "why", "who", "what"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 17 題）", "explanation": "問有沒有公車，是交通方式，how to get there。", "explanationSource": "supplemental"}, {"id": 20, "question": "Someone left a bag in the classroom, but no one knows ______ it belongs to.", "options": ["what", "why", "whom", "when"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 17 題）", "explanation": "belong to 後缺受詞，指「人」，用 whom（口語亦可 who）。", "explanationSource": "supplemental"}, {"id": 21, "question": "Carson: Bye, girls. See you tomorrow, Phoebe.\nShirley: ______ did Carson say he would see you tomorrow?\nPhoebe: We're going out for a picnic. Do you want to come?", "options": ["What", "When", "Where", "Why"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜疑問詞 Why ＋ did ＋ S ＋ say ＋ 子句", "explanation": "【句型】疑問詞 ＋ did ＋ S ＋ say ＋ (that) 子句？\n【分析】Phoebe 回答「我們明天要去野餐」，說明 Carson 會見到她的「原因」，所以問 Why。\n【其他選項】(A) What：say 後已有完整子句 he would see you tomorrow，不缺受詞；(B) When：時間 tomorrow 已知；(C) Where：回答並未針對地點。\n【例句】Why did Mom say we couldn't watch TV tonight?", "explanationSource": "source"}, {"id": 22, "question": "Kevin: ______ did the teacher say about the test?\nJane: She said it would be on Friday.", "options": ["Why", "What", "Where", "How"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 21 題）", "explanation": "say about 後缺受詞（說了什麼），用 What。", "explanationSource": "supplemental"}, {"id": 23, "question": "Ella: ______ did you say we would meet?\nHank: In front of the library.", "options": ["Where", "Why", "What", "Who"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 21 題）", "explanation": "回答「圖書館前」為地點，用 Where。", "explanationSource": "supplemental"}, {"id": 24, "question": "Dad: ______ did Tina say she would come home?\nMom: Around nine o'clock.", "options": ["Why", "What", "When", "How"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 21 題）", "explanation": "回答「九點左右」為時間，用 When。", "explanationSource": "supplemental"}, {"id": 25, "question": "Willy found ______ the novel he bought last week was under his bed.", "options": ["that", "where", "whether", "which"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜that 名詞子句當受詞（found that）", "explanation": "【句型】S ＋ V（find/know/think）＋ that ＋ 完整句子（that 名詞子句當受詞）\n【分析】空格後 the novel (he bought last week) was under his bed 是完整句子，表示發現「一件事實」，用 that。\n【其他選項】(B) where：子句已有地點 under his bed，不缺地點；(C) whether 是否，與 found 一個確定事實不合；(D) which 為關係代名詞，前面須有先行詞且子句須缺主詞／受詞。\n【例句】Emma found that her phone was in her school bag.", "explanationSource": "source"}, {"id": 26, "question": "Mr. Lee told us ______ the field trip was canceled because of the rain.", "options": ["what", "that", "which", "who"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 25 題）", "explanation": "後接完整句子表告知事實，用 that 名詞子句。", "explanationSource": "supplemental"}, {"id": 27, "question": "I'm not sure ______ Ben will join us tonight. He hasn't answered my message.", "options": ["that", "what", "whether", "which"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 25 題）", "explanation": "not sure「不確定是否」，用 whether。", "explanationSource": "supplemental"}, {"id": 28, "question": "Sandy didn't know ______ her brother put her umbrella. She looked everywhere.", "options": ["where", "that", "what", "which"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 25 題）", "explanation": "put her umbrella 後缺地點，且她到處找，用 where。", "explanationSource": "supplemental"}, {"id": 29, "question": "A-wei: This typhoon is so terrible!\nA-fen: Yes, I'm not sure ______ we can still go fishing tomorrow.", "options": ["who", "what", "which", "whether"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜whether 名詞子句（是否）", "explanation": "【句型】not sure ＋ whether/if ＋ S ＋ V：不確定是否…\n【分析】颱風很可怕，所以不確定明天「是否」還能去釣魚；空格後是完整句子，表「是或否」，用 whether。\n【其他選項】(A) who、(B) what、(C) which 引導的子句須缺主詞或受詞，但 we can still go fishing tomorrow 是完整句子。\n【例句】I wonder whether it will rain this weekend.", "explanationSource": "source"}, {"id": 30, "question": "Mia: Can you ask Mark ______ he wants to come to the movies with us?\nTom: Sure, I'll call him now.", "options": ["what", "whether", "which", "who"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 29 題）", "explanation": "問「是否」想來，後接完整句子，用 whether。", "explanationSource": "supplemental"}, {"id": 31, "question": "I don't know ______ to buy for Mom's birthday. Any ideas?", "options": ["what", "whether", "where", "why"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 29 題）", "explanation": "buy 後缺受詞（買什麼），用 what to buy。", "explanationSource": "supplemental"}, {"id": 32, "question": "The teacher asked us ______ we had finished the reading report.", "options": ["which", "what", "who", "if"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 29 題）", "explanation": "問是否完成，後接完整句子，用 if（＝whether）。", "explanationSource": "supplemental"}, {"id": 33, "question": "Susan: Do you know ______ you have talked on the phone? Aren't you thirsty?\nWalter: Oh, come on! I've only talked for thirty minutes!", "options": ["how old", "how often", "how many", "how long"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜間接問句 how long（多久）", "explanation": "【句型】Do you know + 疑問詞 + S + V（間接問句）；how long 問「多久（一段時間）」。\n【分析】Walter 回答 I've only talked for thirty minutes（才講三十分鐘），回答的是一段時間，且 have talked 為現在完成式，搭配 how long 問持續多久。\n【其他選項】(A) how old 問年紀；(B) how often 問頻率（多常）；(C) how many 後面要接可數名詞，問數量。\n【例句】Do you know how long the movie will last?（你知道這部電影會播多久嗎？）", "explanationSource": "source"}, {"id": 34, "question": "Tom: Do you know ______ Mr. Lin has taught at our school?\nAmy: For about ten years.", "options": ["how long", "how often", "how far", "how soon"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 33 題）", "explanation": "回答 For about ten years 是一段時間，用 how long 問「多久」。", "explanationSource": "supplemental"}, {"id": 35, "question": "Mom: How ______ have you played video games today?\nKen: Only one hour, Mom.", "options": ["often", "many", "long", "much"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 33 題）", "explanation": "回答 one hour 為時間長度，How long 問持續多久。", "explanationSource": "supplemental"}, {"id": 36, "question": "I wonder ______ it takes to get to Kaohsiung by train. Is it more than two hours?", "options": ["how much", "how long", "how often", "how old"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 33 題）", "explanation": "it takes + 時間，問「花多久時間」用 how long。", "explanationSource": "supplemental"}, {"id": 37, "question": "Jane is going fishing tomorrow. She wants to know ______ the weather will be fine.", "options": ["how", "what", "whether", "why"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜whether 是否（名詞子句）", "explanation": "【句型】know + whether/if + S + V：「是否……」，引導 Yes/No 問句改成的名詞子句。\n【分析】the weather will be fine 是完整句子，不缺主詞或受詞；Jane 想知道「天氣是否會好」，是 Yes/No 的問題，用 whether。\n【其他選項】(A) how 問方法或程度，語意不通；(B) what 後面子句需缺少名詞（主詞或受詞），此句完整；(D) why 問原因，語意不合「明天要去釣魚，想知道天氣……」。\n【例句】I don't know whether Amy will come to the party.（我不知道 Amy 是否會來派對。）", "explanationSource": "source"}, {"id": 38, "question": "Kevin asked me ______ I had finished my science report. I said, \"Not yet.\"", "options": ["what", "whether", "where", "which"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 37 題）", "explanation": "子句完整且回答是 Not yet（Yes/No 題），用 whether 表「是否」。", "explanationSource": "supplemental"}, {"id": 39, "question": "We are not sure ______ the school trip will be canceled because of the rain.", "options": ["if", "what", "how", "who"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 37 題）", "explanation": "子句結構完整，表示「是否會取消」，用 if/whether。", "explanationSource": "supplemental"}, {"id": 40, "question": "Mia: Can you tell me ______ the library is open on Sundays?\nClerk: Yes, it opens at nine.", "options": ["why", "what", "when", "whether"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 37 題）", "explanation": "店員回答 Yes，原問題是 Yes/No 問句，改成名詞子句用 whether。", "explanationSource": "supplemental"}, {"id": 41, "question": "Nancy: Did the teacher tell us ______ to get to the station?\nSusan: Yes. She said we should meet there at ten.", "options": ["how", "what", "when", "where"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜疑問詞 when + to V（何時）", "explanation": "【句型】疑問詞 + to V（when to V = 何時做……）。\n【分析】Susan 回答 She said we should meet there at ten（老師說十點在那裡集合），回答的是「時間」，所以 Nancy 問老師是否說了「何時要到車站」，用 when to get to the station。\n【其他選項】(A) how to get to... 問交通方式，回答應是搭公車、走路等；(B) what to get to...：get to 後已有 the station，不缺受詞；(D) where to get to the station：地點 the station 已出現，重複。\n【例句】Please tell me when to start the test.（請告訴我何時開始考試。）", "explanationSource": "source"}, {"id": 42, "question": "Mr. Lee didn't tell us ______ to hand in the report. Is it due on Friday?", "options": ["when", "what", "who", "how"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 41 題）", "explanation": "後句問是不是星期五交，問時間用 when to V。", "explanationSource": "supplemental"}, {"id": 43, "question": "Grandpa doesn't know ______ to send a message on his new phone, so I'm teaching him.", "options": ["how", "where", "who", "whose"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 41 題）", "explanation": "教爺爺「如何」傳訊息，用 how to V。", "explanationSource": "supplemental"}, {"id": 44, "question": "Lily: I can't decide ______ to buy for Mom's birthday.\nJoe: How about some flowers?", "options": ["how", "where", "what", "when"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 41 題）", "explanation": "buy 缺受詞（買什麼），用 what to buy。", "explanationSource": "supplemental"}, {"id": 45, "question": "I want to go camping in the mountains this afternoon, but a typhoon is coming. I'm not sure ______ the road to the mountains will be closed.", "options": ["how", "what", "whether", "why"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜whether 是否（名詞子句）", "explanation": "【句型】be not sure + whether/if + S + V：「不確定是否……」。\n【分析】颱風要來，「不確定通往山區的路是否會封閉」；the road ... will be closed 是完整句子，表 Yes/No 的不確定，用 whether。\n【其他選項】(A) how 問方式，語意不通；(B) what 後的子句需缺名詞，此句完整；(D) why 問原因，與「颱風來了不確定路況」語意不合。\n【例句】I'm not sure whether I can finish the work today.（我不確定今天能否做完工作。）", "explanationSource": "source"}, {"id": 46, "question": "It's cloudy now. Dad isn't sure ______ we can see the stars tonight.", "options": ["whether", "what", "which", "who"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 45 題）", "explanation": "子句完整，表「是否能看到星星」用 whether。", "explanationSource": "supplemental"}, {"id": 47, "question": "Ben: Is the new restaurant open today?\nAnn: I don't know. Let me call and ask ______ it's open.", "options": ["what", "where", "if", "why"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 45 題）", "explanation": "問「是否營業」，Yes/No 問題用 if。", "explanationSource": "supplemental"}, {"id": 48, "question": "The doctor will check ______ Grandma's leg is getting better.", "options": ["that", "what", "how many", "whether"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 45 題）", "explanation": "check whether + 完整子句：檢查是否好轉。", "explanationSource": "supplemental"}, {"id": 49, "question": "Anita: I saw Nora in the teacher's office this morning. Do you know ______ she was there?\nBrian: She cheated on tests.", "options": ["how", "if", "when", "why"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜間接問句 why（原因）", "explanation": "【句型】Do you know + why + S + V：問「為什麼」，回答說明原因。\n【分析】Brian 回答 She cheated on tests（她考試作弊），是在說明 Nora 在辦公室的「原因」，所以用 why。\n【其他選項】(A) how 問方式；(B) if 問「是否」，回答應為 Yes/No；(C) when 問時間，但 Anita 已說 this morning，且回答不是時間。\n【例句】Do you know why Ken was late for school?（你知道 Ken 為什麼上學遲到嗎？）", "explanationSource": "source"}, {"id": 50, "question": "Mom: Do you know ______ your sister is crying?\nTim: She lost her favorite doll.", "options": ["where", "why", "when", "how"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 49 題）", "explanation": "回答說明哭的原因，用 why。", "explanationSource": "supplemental"}, {"id": 51, "question": "Jenny: Can you tell me ______ Eric didn't come to the meeting?\nLeo: He was sick in bed.", "options": ["why", "what", "which", "whose"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 49 題）", "explanation": "回答生病是原因，用 why。", "explanationSource": "supplemental"}, {"id": 52, "question": "Nobody knows ______ the old man moved to this small village. Some say he wanted a quiet life.", "options": ["what", "whether", "why", "who"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 49 題）", "explanation": "後句推測搬來的理由，用 why 問原因。", "explanationSource": "supplemental"}, {"id": 53, "question": "Teacher: Does anyone know ______ the famous writer was born?\nMei-ling: I know! In Taitung, right?\nTeacher: You got it!", "options": ["how", "when", "where", "whether"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜間接問句 where（地點）", "explanation": "【句型】Does anyone know + where + S + V：問地點。\n【分析】Mei-ling 回答 In Taitung（在台東），是地點，所以問「這位作家在哪裡出生」用 where。\n【其他選項】(A) how 問方式；(B) when 問時間，答案應是年份；(D) whether 問「是否」，語意不通（是否出生？）。\n【例句】Do you know where Kevin lives?（你知道 Kevin 住在哪裡嗎？）", "explanationSource": "source"}, {"id": 54, "question": "Sam: Do you know ______ Mom put my soccer shoes?\nSis: They're under your bed.", "options": ["when", "how", "where", "who"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 53 題）", "explanation": "回答 under your bed 是地點，用 where。", "explanationSource": "supplemental"}, {"id": 55, "question": "I forgot ______ I parked my bike. Was it near the gym or the library?", "options": ["where", "what", "why", "which"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 53 題）", "explanation": "後句在想地點，用 where。", "explanationSource": "supplemental"}, {"id": 56, "question": "Teacher: Who can tell me ______ the first Olympic Games were held?\nAndy: In Greece!", "options": ["when", "where", "how", "whether"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 53 題）", "explanation": "回答 In Greece 是地點，用 where。", "explanationSource": "supplemental"}, {"id": 57, "question": "Alice: How often do you wash your hair?\nBetty: ______.", "options": ["One day", "Twice a week", "Since yesterday", "Three days ago"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜How often 的回答（頻率）", "explanation": "【句型】How often…? 問頻率，回答用 once/twice/three times + a day/week、every day、sometimes 等。\n【分析】Alice 問 How often（多常洗頭），Betty 要回答頻率 Twice a week（一週兩次）。\n【其他選項】(A) One day 是「某一天」，不是頻率；(C) Since yesterday 用於完成式，回答 How long；(D) Three days ago 回答 When（過去時間點）。\n【例句】A: How often do you go swimming? B: Once a month.（一個月一次。）", "explanationSource": "source"}, {"id": 58, "question": "Ted: How often do you visit your grandparents?\nJoy: ______.", "options": ["Last Sunday", "Every weekend", "For two hours", "Next month"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 57 題）", "explanation": "How often 問頻率，Every weekend 是頻率。", "explanationSource": "supplemental"}, {"id": 59, "question": "Doctor: ______ do you eat fast food?\nPaul: About three times a week.", "options": ["How long", "How soon", "How much", "How often"], "answer": 3, "answerLabel": "D", "source": "類似題 2（對應第 57 題）", "explanation": "回答 three times a week 是頻率，用 How often。", "explanationSource": "supplemental"}, {"id": 60, "question": "Kate: How often does the bus come?\nMan: ______.", "options": ["Every twenty minutes", "Twenty minutes ago", "In twenty minutes", "For twenty minutes"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 57 題）", "explanation": "every + 時間表示「每隔……」，回答頻率。", "explanationSource": "supplemental"}, {"id": 61, "question": "Lisa is new here, so she doesn't know ______ the restroom is.", "options": ["that", "where", "whether", "which"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜間接問句 where（地點）", "explanation": "【句型】know + where + S + be：問位置。\n【分析】Lisa 是新來的，不知道「洗手間在哪裡」；the restroom is 後面缺地點，用 where。\n【其他選項】(A) that 後接完整句，但 the restroom is 不完整（缺補語）；(C) whether 後需完整子句，也不合語意；(D) which 需接名詞或在選擇中使用，語意不合。\n【例句】Could you tell me where the bus stop is?（你能告訴我公車站在哪裡嗎？）", "explanationSource": "source"}, {"id": 62, "question": "I can't remember ______ my keys are. Have you seen them?", "options": ["what", "where", "that", "whether"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 61 題）", "explanation": "my keys are 後缺地點，用 where 問鑰匙在哪。", "explanationSource": "supplemental"}, {"id": 63, "question": "The visitor asked me ______ the museum was.", "options": ["where", "that", "which", "what"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 61 題）", "explanation": "問博物館在哪裡，the museum was 後缺地點，用 where。", "explanationSource": "supplemental"}, {"id": 64, "question": "Ivy just moved to Taichung. She wants to know ______ the nearest MRT station is.", "options": ["whose", "whether", "where", "who"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 61 題）", "explanation": "問最近的捷運站在哪，用 where。", "explanationSource": "supplemental"}, {"id": 65, "question": "Kevin: ______ sweater looks better on me, the red one or the blue one?\nBetty: The red one, I think.", "options": ["Which", "How", "Where", "What"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜Which + 名詞（二選一）", "explanation": "【句型】Which + 名詞…, A or B?：在有限選項中「哪一個」。\n【分析】句尾給了兩個選擇 the red one or the blue one，在兩者中選一個，用 Which sweater。\n【其他選項】(B) How 不能直接接名詞 sweater；(C) Where 問地點；(D) What 用於沒有限定範圍的問題，有明確選項時用 Which。\n【例句】Which do you like better, cats or dogs?（貓和狗你比較喜歡哪個？）", "explanationSource": "source"}, {"id": 66, "question": "Waiter: ______ would you like, tea or coffee?\nMrs. Wang: Coffee, please.", "options": ["What time", "Which", "How", "Who"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 65 題）", "explanation": "有 tea or coffee 兩個選擇，用 Which。", "explanationSource": "supplemental"}, {"id": 67, "question": "Ray: ______ bus goes to the zoo, No. 5 or No. 12?\nDriver: No. 12.", "options": ["Which", "Whose", "What time", "How"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 65 題）", "explanation": "在兩路公車中選一，用 Which + 名詞。", "explanationSource": "supplemental"}, {"id": 68, "question": "Sue: There are three pens here. ______ one is yours?\nMax: The green one.", "options": ["How", "Who", "Which", "Where"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 65 題）", "explanation": "從三支筆中挑出一支，用 Which one。", "explanationSource": "supplemental"}, {"id": 69, "question": "Lucy: ______ is Ted doing in the kitchen?\nRyan: He's cooking dinner for us.", "options": ["What", "Where", "Who", "Why"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜What 問做什麼", "explanation": "【句型】What + be + S + doing?：問「正在做什麼」。\n【分析】doing 缺受詞，且 Ryan 回答 He's cooking dinner（他在煮晚餐），說明做的事情，用 What。\n【其他選項】(B) Where 問地點，但題目已有 in the kitchen；(C) Who 問人，但主詞 Ted 已有；(D) Why 問原因，回答應有 because 等原因說明。\n【例句】What are you doing now? I'm doing my homework.（你在做什麼？我在寫功課。）", "explanationSource": "source"}, {"id": 70, "question": "Dad: ______ did you do last weekend?\nJudy: I went hiking with my classmates.", "options": ["Where", "What", "How", "Who"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 69 題）", "explanation": "回答做了什麼事，用 What。", "explanationSource": "supplemental"}, {"id": 71, "question": "Amy: ______ are the boys doing on the playground?\nTom: They're playing basketball.", "options": ["What", "Why", "When", "Which"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 69 題）", "explanation": "doing 缺受詞，問做什麼用 What。", "explanationSource": "supplemental"}, {"id": 72, "question": "Jack: ______ is Grandpa going to do after he retires?\nMom: He's going to grow vegetables.", "options": ["Where", "How", "What", "Whose"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 69 題）", "explanation": "do 缺受詞，回答要做的事，用 What。", "explanationSource": "supplemental"}, {"id": 73, "question": "I was surprised to know from the newspaper yesterday ______ flowers do not always smell sweet; some can smell like dead fish.", "options": ["that", "when", "where", "which"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜that 名詞子句（know that…）", "explanation": "【句型】know + that + 完整子句（陳述一個事實）。\n【分析】flowers do not always smell sweet 是完整句子，表示從報紙得知的「事實內容」，用 that 引導名詞子句當 know 的受詞。\n【其他選項】(B) when 表時間，語意不通；(C) where 表地點，語意不通；(D) which 不能引導這種陳述事實的受詞子句（也不能當關代，前面無先行詞）。\n【例句】I know that you are trying your best.（我知道你盡力了。）", "explanationSource": "source"}, {"id": 74, "question": "We learned in class ______ bats are not blind.", "options": ["that", "which", "what", "where"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 73 題）", "explanation": "learned 後接完整事實子句，用 that。", "explanationSource": "supplemental"}, {"id": 75, "question": "Did you hear ______ our school will have a new swimming pool next year?", "options": ["what", "where", "that", "which"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 73 題）", "explanation": "後面是完整句子的消息內容，用 that。", "explanationSource": "supplemental"}, {"id": 76, "question": "The scientist found ______ some fish can climb trees.", "options": ["which", "when", "who", "that"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 73 題）", "explanation": "found that + 完整子句，表示發現的事實。", "explanationSource": "supplemental"}, {"id": 77, "question": "My father told me last night ______ we're going to the Food Festival this weekend. My brother and I felt very excited.", "options": ["whether", "where", "what", "that"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜that 名詞子句（tell + 人 + that…）", "explanation": "【句型】tell + 人 + that + 完整子句：告訴某人某事。\n【分析】we're going to the Food Festival this weekend 是完整句子，是爸爸告訴的「內容」，而且我們因此很興奮，表示是確定的事，用 that。\n【其他選項】(A) whether 表「是否」，不確定，與 felt very excited 不合；(B) where 問地點，但地點 Food Festival 已出現；(C) what 後的子句需缺名詞，此句完整。\n【例句】Ms. Chen told us that the test was put off.（陳老師告訴我們考試延期了。）", "explanationSource": "source"}, {"id": 78, "question": "Mom told me ______ she would make my favorite cake. I couldn't wait to get home.", "options": ["that", "what", "whether", "how"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 77 題）", "explanation": "完整子句是告知的內容且是確定的事，用 that。", "explanationSource": "supplemental"}, {"id": 79, "question": "Coach said ______ we played very well in the game. We were so happy.", "options": ["what", "that", "where", "which"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 77 題）", "explanation": "said that + 完整子句。", "explanationSource": "supplemental"}, {"id": 80, "question": "Our teacher told us ______ there would be no class tomorrow because of the typhoon.", "options": ["where", "which", "that", "what"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 77 題）", "explanation": "完整的消息內容用 that 引導。", "explanationSource": "supplemental"}, {"id": 81, "question": "Jacky would like to bring that poor dog back home, but he isn't sure ______ his mother likes dogs.", "options": ["how", "what", "whether", "which"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜whether 是否（名詞子句）", "explanation": "【句型】be not sure + whether + 完整子句：不確定是否……\n【分析】his mother likes dogs 是完整子句，他「不確定媽媽是否喜歡狗」，是 Yes/No 的不確定，用 whether。\n【其他選項】(A) how 問程度/方式，語意不通；(B) what 後子句要缺名詞，likes dogs 已有受詞；(D) which 須在選項中選擇，語意不合。\n【例句】I'm not sure whether my brother is at home now.（我不確定我哥現在在不在家。）", "explanationSource": "source"}, {"id": 82, "question": "Rita wants to join the dance club, but she doesn't know ______ her parents will agree.", "options": ["whether", "which", "what", "that"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 81 題）", "explanation": "不知道父母「是否」同意，用 whether。", "explanationSource": "supplemental"}, {"id": 83, "question": "Can you check ______ the store has any milk left?", "options": ["what", "where", "if", "how"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 81 題）", "explanation": "check if + 完整子句，查看是否還有牛奶。", "explanationSource": "supplemental"}, {"id": 84, "question": "Steve wondered ______ the girl remembered his name.", "options": ["who", "what", "which", "whether"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 81 題）", "explanation": "wonder whether + 完整子句，不知是否記得。", "explanationSource": "supplemental"}, {"id": 85, "question": "Daisy: I went to Taitung to visit my uncle there.\nGrace: Really? ______ were you there?\nDaisy: For two weeks.", "options": ["How long", "How often", "How soon", "What time"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜How long 問期間", "explanation": "【句型】How long…? 問「多久」，回答用 for + 一段時間。\n【分析】Daisy 回答 For two weeks（兩個星期），表示待了一段時間，用 How long。\n【其他選項】(B) How often 問頻率；(C) How soon 問「再過多久」（未來），回答用 in + 時間；(D) What time 問幾點。\n【例句】A: How long have you lived here? B: For five years.（五年了。）", "explanationSource": "source"}, {"id": 86, "question": "Peter: ______ did you stay in Japan?\nMay: For ten days.", "options": ["What time", "How often", "How long", "How soon"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 85 題）", "explanation": "for ten days 是期間，用 How long。", "explanationSource": "supplemental"}, {"id": 87, "question": "Joan: ______ will the concert be over?\nStaff: In about twenty minutes.", "options": ["How soon", "How long", "How often", "What day"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 85 題）", "explanation": "in + 時間表示「再過多久」，用 How soon。", "explanationSource": "supplemental"}, {"id": 88, "question": "Nick: ______ have you known Linda?\nOlive: Since we were in elementary school.", "options": ["How often", "How long", "What time", "When"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 85 題）", "explanation": "since + 過去時間配完成式，問持續多久，用 How long。", "explanationSource": "supplemental"}, {"id": 89, "question": "Alice learned from the TV news ______ Nora Jones was coming to Taiwan the next day.", "options": ["that", "where", "which", "whether"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜that 名詞子句（learn that…）", "explanation": "【句型】learn (from…) + that + 完整子句：得知某事。\n【分析】Nora Jones was coming to Taiwan the next day 是完整句子，是從電視新聞「得知的事實」，用 that。\n【其他選項】(B) where 問地點，但 to Taiwan 已有地點；(C) which 不能引導這個名詞子句；(D) whether 表「是否」，新聞報導的是確定的事。\n【例句】I learned from my friend that the shop was closed.（我從朋友那裡得知那家店關了。）", "explanationSource": "source"}, {"id": 90, "question": "We heard from the radio ______ the MRT would stop running because of the storm.", "options": ["which", "that", "where", "whether"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 89 題）", "explanation": "聽到的是確定消息，完整子句用 that。", "explanationSource": "supplemental"}, {"id": 91, "question": "Grace read in a magazine ______ eating breakfast is good for students.", "options": ["that", "what", "who", "which"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 89 題）", "explanation": "read that + 完整事實子句。", "explanationSource": "supplemental"}, {"id": 92, "question": "Ken found out from his classmates ______ the field trip was canceled.", "options": ["what", "whose", "where", "that"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 89 題）", "explanation": "得知的事實內容，用 that。", "explanationSource": "supplemental"}, {"id": 93, "question": "Kathy: ______ your French class, Jerry?\nJerry: I couldn't understand a word the first month, but it's getting better now.", "options": ["How's", "What's", "When is", "Which is"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜How is…?（問情況如何）", "explanation": "【句型】How is + 名詞?：問某事「情況如何、進行得怎樣」。\n【分析】Jerry 回答第一個月聽不懂、現在越來越好，是在描述課上得「怎麼樣」，用 How's（How is）。\n【其他選項】(B) What's your French class? 問「是什麼課」，語意不合；(C) When is 問時間，回答應是時間；(D) Which is 用於選擇，此處沒有選項。\n【例句】A: How's your new school? B: It's great!（新學校怎麼樣？很棒！）", "explanationSource": "source"}, {"id": 94, "question": "Grandma: ______ your new job, Tina?\nTina: It's busy, but I like it a lot.", "options": ["What's", "How's", "Where's", "Who's"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 93 題）", "explanation": "回答描述工作狀況，用 How's 問情況。", "explanationSource": "supplemental"}, {"id": 95, "question": "Dad: ______ the weather in Hualien today?\nUncle: It's sunny and warm.", "options": ["How's", "When's", "Which is", "Whose is"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 93 題）", "explanation": "How's the weather? 問天氣如何。", "explanationSource": "supplemental"}, {"id": 96, "question": "Coach: ______ your leg now, Danny?\nDanny: Much better, thanks.", "options": ["Where is", "What is", "How is", "Which is"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 93 題）", "explanation": "問腿的狀況，用 How is。", "explanationSource": "supplemental"}, {"id": 97, "question": "Emma: ______ umbrella is it?\nSherry: It's Ann's. She forgot to take it home.", "options": ["What", "Where", "Which", "Whose"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜Whose + 名詞（誰的）", "explanation": "【句型】Whose + 名詞 + is it?：問「誰的……」，回答用所有格（Ann's / mine…）。\n【分析】Sherry 回答 It's Ann's（是 Ann 的），表所有者，用 Whose umbrella。\n【其他選項】(A) What umbrella 問「什麼雨傘」，不合回答；(B) Where 不能直接接名詞；(C) Which umbrella 用於在幾把中選一把，回答應是 The red one 等。\n【例句】A: Whose bike is this? B: It's my brother's.（是我哥的。）", "explanationSource": "source"}, {"id": 98, "question": "Teacher: ______ notebook is this? There's no name on it.\nBilly: It's mine.", "options": ["Whose", "Which", "What", "Who"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 97 題）", "explanation": "回答 mine 表所有，用 Whose。", "explanationSource": "supplemental"}, {"id": 99, "question": "Kelly: ______ shoes are these?\nAndy: They're my sister's.", "options": ["Which", "Who", "Whose", "Where"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 97 題）", "explanation": "回答 my sister's，用 Whose 問誰的。", "explanationSource": "supplemental"}, {"id": 100, "question": "Mom: ______ cell phone is ringing?\nEddie: It's Dad's. He left it on the sofa.", "options": ["What", "Whose", "Which", "How"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 97 題）", "explanation": "回答 Dad's，問所有者用 Whose。", "explanationSource": "supplemental"}, {"id": 101, "question": "Sarah: ______ does your little sister get up?\nWilly: About six.", "options": ["How often", "How old", "What day", "What time"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜What time 問幾點", "explanation": "【句型】What time…? 問「幾點」，回答用 at + 時刻 / about + 時刻。\n【分析】Willy 回答 About six（大約六點），是時刻，用 What time。\n【其他選項】(A) How often 問頻率；(B) How old 問年紀，且 How old does she get up 不合文法；(C) What day 問星期幾。\n【例句】A: What time does the movie start? B: At seven thirty.（七點半。）", "explanationSource": "source"}, {"id": 102, "question": "Ann: ______ do you usually go to bed?\nBob: At ten thirty.", "options": ["What time", "What day", "How long", "How often"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 101 題）", "explanation": "At ten thirty 是時刻，用 What time。", "explanationSource": "supplemental"}, {"id": 103, "question": "Lisa: ______ is it today?\nJohn: It's Friday.", "options": ["What time", "What date", "What day", "How long"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 101 題）", "explanation": "Friday 是星期，用 What day。", "explanationSource": "supplemental"}, {"id": 104, "question": "Tourist: ______ does the last train leave?\nClerk: At 11:45 p.m.", "options": ["How soon", "What time", "How often", "Which day"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 101 題）", "explanation": "回答具體時刻，用 What time。", "explanationSource": "supplemental"}, {"id": 105, "question": "Son: Mom, ______ are my glasses?\nMom: Aren't they on the table in the living room?", "options": ["what", "when", "where", "how"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜Where 問地點", "explanation": "【句型】Where + be + S?：問「……在哪裡」。\n【分析】媽媽回答 on the table in the living room（在客廳桌上），是位置，用 where。\n【其他選項】(A) what 問事物；(B) when 問時間；(D) how 問方式或狀況，都不合回答。\n【例句】A: Where is my backpack? B: It's behind the door.（在門後面。）", "explanationSource": "source"}, {"id": 106, "question": "Dad: ______ is your brother?\nMia: He's in his room.", "options": ["Where", "Who", "How", "When"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 105 題）", "explanation": "回答 in his room 是地點，用 Where。", "explanationSource": "supplemental"}, {"id": 107, "question": "Joe: ______ did you buy this cap?\nRay: At the night market.", "options": ["When", "Where", "Why", "Which"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 105 題）", "explanation": "At the night market 是地點，用 Where。", "explanationSource": "supplemental"}, {"id": 108, "question": "Lucy: Excuse me. ______ is the nearest bank?\nWoman: It's across from the park.", "options": ["What", "When", "Where", "How"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 105 題）", "explanation": "問位置，回答 across from the park，用 Where。", "explanationSource": "supplemental"}, {"id": 109, "question": "Alan works hard in his new job, and he wants to know ______ his boss feels about him.", "options": ["how", "that", "whether", "why"], "answer": 0, "answerLabel": "A", "source": "115會考｜間接問句 how + S + V（how … feels about）", "explanation": "【句型】know + 疑問詞 + 主詞 + 動詞（間接問句當受詞）；How do you feel about…? → how + S + feels about…（對……的看法／感受如何）。\n【分析】Alan 努力工作，想知道老闆「怎麼看」他 → how his boss feels about him。\n【其他選項】(B) that：引導已知事實，且 feels about him 缺少「感受內容」；(C) whether：whether 子句須是完整句，his boss feels about him 缺少 feels 的補語（feels good/bad），句子不完整；(D) why：還不知道老闆的感受，就無從問原因，語意不合。\n【例句】I want to know how my parents feel about my new haircut.", "explanationSource": "source"}, {"id": 110, "question": "Jenny asked me ______ I thought about the new teacher.", "options": ["how", "what", "that", "why"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 109 題）", "explanation": "think about 後缺受詞，用 what 問「想法是什麼」。", "explanationSource": "supplemental"}, {"id": 111, "question": "Please tell me ______ you like your new school.", "options": ["what", "which", "how", "that"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 109 題）", "explanation": "How do you like…? 問「覺得如何」，間接問句用 how + S + V。", "explanationSource": "supplemental"}, {"id": 112, "question": "Nobody knows ______ Leo was absent today. He didn't call the teacher.", "options": ["why", "how much", "which", "that"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 109 題）", "explanation": "沒人知道他缺席的「原因」，用 why。", "explanationSource": "supplemental"}, {"id": 113, "question": "Jill: Have you decided ______ you will celebrate your 30th birthday?\nSue: Yeah, I'm going to have a big barbecue party.", "options": ["how", "where", "what", "when"], "answer": 0, "answerLabel": "A", "source": "講義錯題｜WH 名詞子句：how（方式）", "explanation": "【句型】decide + 疑問詞 + S + V（名詞子句當受詞）。\n【分析】Sue 回答「要辦一場大型烤肉派對」（have a big barbecue party），說的是慶祝的「方式」，用 how。\n【其他選項】(B) where 問地點，答句沒有提到地點；(C) what 用於子句中缺受詞時，這裡 celebrate 已有受詞 your 30th birthday；(D) when 問時間，答句未提。\n【例句】I don't know how my brother fixed the old bike.\n備註：講義 p.275", "explanationSource": "source"}, {"id": 114, "question": "Ann: Do you know ______ the school trip will be?\nTom: It'll be next Friday.", "options": ["where", "how", "when", "what"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 113 題）", "explanation": "答句說時間 next Friday，用 when。", "explanationSource": "supplemental"}, {"id": 115, "question": "Leo: Can you tell me ______ you bought this cap?\nMay: At the night market near my house.", "options": ["where", "when", "what", "how"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 113 題）", "explanation": "答句說地點，用 where。", "explanationSource": "supplemental"}, {"id": 116, "question": "I'm not sure ______ Grandma wants for her birthday. Maybe a new scarf?", "options": ["how", "what", "when", "why"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 113 題）", "explanation": "wants 缺受詞，用 what 當子句受詞。", "explanationSource": "supplemental"}, {"id": 117, "question": "Drew: Do you know ______ as the team leader?\nWendy: It may be Jane.", "options": ["who will our teacher pick", "our teacher will pick", "who will be picked", "who is picking our teacher"], "answer": 2, "answerLabel": "C", "source": "講義錯題｜間接問句：who 當主詞＋被動 will be picked", "explanation": "【句型】間接問句用直述句語序：疑問詞 + (S) + V；疑問詞當主詞時直接接動詞。\n【分析】空格後接 as the team leader，問「誰會被選為隊長」，who 當主詞且是「被選」，用被動 who will be picked。\n【其他選項】(A) 間接問句不可倒裝（will our teacher pick 錯）；(B) 缺少疑問詞，know 後不合語意；(D) 變成「誰在挑我們的老師」，不合理。\n【例句】Do you know who will be invited to the party?\n備註：講義 p.276", "explanationSource": "source"}, {"id": 118, "question": "Can you tell me ______?", "options": ["where is the post office", "where the post office is", "the post office is where", "is where the post office"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 117 題）", "explanation": "間接問句用直述句語序：where + S + V。", "explanationSource": "supplemental"}, {"id": 119, "question": "I wonder ______ the window in our classroom yesterday.", "options": ["who broke", "who did break", "did who break", "who was broken"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 117 題）", "explanation": "who 當主詞，直接接動詞 broke，主動語意。", "explanationSource": "supplemental"}, {"id": 120, "question": "Nobody knows ______ to the school party next week.", "options": ["who will invite", "will who be invited", "who will be invited", "who invited"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 117 題）", "explanation": "who 當主詞且是「被邀請」，用被動 will be invited。", "explanationSource": "supplemental"}, {"id": 121, "question": "I wasn't able to decide ______ and ended up buying both of them.", "options": ["to buy which of the two skirts", "which of the two skirts should I buy", "which of the two skirts to buy", "I should buy which of the two skirts"], "answer": 2, "answerLabel": "C", "source": "講義錯題｜疑問詞 + to V（which of… to buy）", "explanation": "【句型】decide / know / tell + 疑問詞(片語) + to V。\n【分析】「無法決定要買兩件裙子中的哪一件」= decide which of the two skirts to buy，結果兩件都買了（ended up buying both of them）。\n【其他選項】(A)(D) 疑問詞片語必須放在前面；(B) 間接問句不可倒裝，應為 which of the two skirts I should buy。\n【例句】Could you tell me which bus to take to the zoo?\n備註：講義 p.276", "explanationSource": "source"}, {"id": 122, "question": "Lucy doesn't know ______ for her mother's birthday.", "options": ["to buy what", "what to buy", "what should she buy", "she to buy what"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 121 題）", "explanation": "疑問詞 + to V：what to buy。", "explanationSource": "supplemental"}, {"id": 123, "question": "The new student asked me ______ to the library.", "options": ["how to get", "how get", "how did he get", "to get how"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 121 題）", "explanation": "how to get 表「如何到達」。", "explanationSource": "supplemental"}, {"id": 124, "question": "We haven't decided ______ for our class trip.", "options": ["where should we go", "we should go where", "to go where", "where to go"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 121 題）", "explanation": "疑問詞 + to V：where to go。", "explanationSource": "supplemental"}, {"id": 125, "question": "Of the three parks, ______ do you think is the best for us to camp?", "options": ["that", "what", "which", "where"], "answer": 2, "answerLabel": "C", "source": "講義錯題｜疑問詞 which（有限範圍選擇）＋插入語 do you think", "explanation": "【句型】疑問詞 + do you think + (主詞) + V？（do you think 為插入語，疑問詞放句首）；在限定範圍內選一個用 which\n【分析】Of the three parks 表示「三座公園中」，是有限範圍的選擇 → which；which 當 is the best 的主詞。\n【其他選項】(A) that 不是疑問詞；(B) what 用於範圍不限定的「什麼」；(D) where 是副詞，不能當 is 的主詞。\n【例句】Of these two jackets, which do you think looks better?\n備註：講義 p.291", "explanationSource": "source"}, {"id": 126, "question": "Of all the subjects, ______ do you think is the most useful?", "options": ["that", "which", "where", "when"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 125 題）", "explanation": "在所有科目中選一個，用 which 當主詞。", "explanationSource": "supplemental"}, {"id": 127, "question": "______ do you think will win the game, the Lions or the Monkeys?", "options": ["Which team", "What", "Where", "How"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 125 題）", "explanation": "兩隊之中選一隊，用 Which team 當 will win 的主詞。", "explanationSource": "supplemental"}, {"id": 128, "question": "There are four cakes here. ______ do you think Mom will like most?", "options": ["Where", "That", "Which", "How"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 125 題）", "explanation": "四個蛋糕中選一個，且當 like 的受詞，用 which。", "explanationSource": "supplemental"}, {"id": 129, "question": "______ everybody dies is a fact, so live at the moment.", "options": ["It", "That", "Why", "What"], "answer": 1, "answerLabel": "B", "source": "講義錯題｜That 子句當主詞", "explanation": "【句型】That + 完整句子 + V…（that 子句當主詞，表「…這件事」）\n【分析】everybody dies 是完整句子，整個子句當 is 的主詞，句意「人都會死是個事實」→ That。\n【其他選項】(A) It 是代名詞，不能連接兩個動詞 dies 和 is；(C) Why 表「為什麼…」，語意不合；(D) What 須在子句中當主詞或受詞，後不能接完整句。\n【例句】That he lied to us made me angry.\n備註：講義 p.334", "explanationSource": "source"}, {"id": 130, "question": "______ Amy won the speech contest surprised everyone in our class.", "options": ["What", "It", "That", "Which"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 129 題）", "explanation": "Amy won the speech contest 為完整句，當主詞用 That。", "explanationSource": "supplemental"}, {"id": 131, "question": "______ he said at the meeting made his boss happy.", "options": ["What", "That", "It", "Because"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 129 題）", "explanation": "he said 缺受詞，用 What 當子句受詞。", "explanationSource": "supplemental"}, {"id": 132, "question": "______ exercise is good for our health is true.", "options": ["What", "That", "Why", "It"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 129 題）", "explanation": "exercise is good for our health 為完整句，用 That 引導主詞子句。", "explanationSource": "supplemental"}, {"id": 133, "question": "Each of the items on the menu looked so delicious that I had a hard time deciding ______.", "options": ["which one should I order", "that one I should order", "which one to order", "which one I have ordered"], "answer": 2, "answerLabel": "C", "source": "講義錯題｜疑問詞 + to V（which one to order）", "explanation": "【句型】decide/know/learn + 疑問詞 + to V ＝ 疑問詞 + S + should + V\n【分析】每道菜都很好吃，難以決定「要點哪一道」→ which one to order。\n【其他選項】(A) 間接問句要用直述句語序 which one I should order；(B) that one 不是疑問詞，語意不完整；(D) 已點過就不用再決定，時態語意不合。\n【例句】I don't know what to buy for Dad's birthday.\n備註：講義 p.337", "explanationSource": "source"}, {"id": 134, "question": "I'm new here. Can you tell me ______?", "options": ["where to go", "where should I go", "where I went", "to go where"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 133 題）", "explanation": "疑問詞 + to V：where to go。", "explanationSource": "supplemental"}, {"id": 135, "question": "Ken can't decide ______ for the school trip, the blue bag or the black one.", "options": ["which should he bring", "which bag to bring", "that bag to bring", "which bag he brought"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 133 題）", "explanation": "兩者擇一，用 which bag to bring。", "explanationSource": "supplemental"}, {"id": 136, "question": "Our teacher showed us ______ the robot by using a computer.", "options": ["how do we control", "what to control", "how to control", "how controlled"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 133 題）", "explanation": "教我們「如何」操控，用 how to control。", "explanationSource": "supplemental"}, {"id": 137, "question": "Could you give me some ideas about ______ so that I know what to expect?", "options": ["you will carry out the plan", "will you carry out the plan", "how will you carry out the plan", "how you will carry out the plan"], "answer": 3, "answerLabel": "D", "source": "講義錯題｜間接問句語序（疑問詞 + S + V）", "explanation": "【句型】介系詞/動詞 + 疑問詞 + 主詞 + 動詞（間接問句用直述句語序）\n【分析】about 後接名詞子句，問「你要如何執行計畫」→ how you will carry out the plan。\n【其他選項】(A) 缺疑問詞，句子不能直接接在介系詞後；(B)(C) 是直接問句的倒裝語序，不能放在句中。\n【例句】I'm thinking about where we should go this weekend.\n備註：講義 p.338", "explanationSource": "source"}, {"id": 138, "question": "Do you know ______?", "options": ["when does the movie start", "when the movie starts", "the movie starts when", "when will the movie start"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 137 題）", "explanation": "間接問句用疑問詞 + 主詞 + 動詞。", "explanationSource": "supplemental"}, {"id": 139, "question": "We talked about ______ for Teacher's Day.", "options": ["what we should prepare", "what should we prepare", "we should prepare what", "should we prepare"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 137 題）", "explanation": "about 後接間接問句，用直述句語序。", "explanationSource": "supplemental"}, {"id": 140, "question": "Can you tell me ______ to the train station?", "options": ["how can I get", "how do I get", "how I can get", "I can get how"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 137 題）", "explanation": "間接問句語序為 how I can get。", "explanationSource": "supplemental"}]};</script><script src="longteng-b1u5-quiz.js?v=20261027-2"></script><script>document.querySelector("#description").textContent="共 140 題（會考歷屆＋講義錯題 35 題＋類似題 105 題）｜選答後顯示中文解析｜答錯可重做並下載錯題";</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
