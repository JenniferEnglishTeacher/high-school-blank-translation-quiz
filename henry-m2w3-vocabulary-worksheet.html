</style></head><body><main class="wrap"><section class="hero"><h1>Henry 靜心 M2W3 Vocabulary Worksheet</h1><p>附件題目完整互動練習：改錯、單字選擇、定義配對、選詞填空、完整句作答與閱讀理解。</p><p class="note">改錯題會把錯誤字詞標成紅色；只需在旁邊輸入正確字詞。全部改對後會朗讀完整正確段落。</p><div class="toolbar"><a class="btn" href="dashboard.html">← 回測驗總覽</a></div></section><section id="select" class="card"><h2>選擇練習題型</h2><div id="sectionGrid" class="grid"></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="passage" class="passage hidden"></div><div id="instructions" class="instructions hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="reference" class="reference hidden"></div><div id="voiceBox" class="voicebox hidden"><b id="voiceTarget"></b><button id="speak" class="btn voice">🔊 再聽一次</button></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="showAnswer" class="btn hidden">顯示參考答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束本輪</button></div></section><section id="result" class="card hidden"><h2>練習結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="download" class="btn primary">下載錯題 DOCX</button><button id="back" class="btn">選擇其他題型</button><button id="restart" class="btn">重新開始</button></div></section></main><script>const DATA={"code":"M2W3","title":"Henry 靜心 M2W3 Vocabulary Worksheet","corrections":[{"id":1,"word":"absurd","answer":"My classmates are very funny. Yesterday, Tom told the teacher an absurd excuse. He said a dog ate his homework. When all the students heard that, they all laughed at him. It is absurd to believe crazy stories like that.","original":"My classmates (is/are) very funny. Yesterday, Tom tell the teacher an absurd excuse. He say a dog eat his homework. When all the student hear that, they all laugh at him. It is absurd to believes crazy story like that.","mistakes":7,"alternatives":[]},{"id":2,"word":"despise","answer":"I am a kind person, but I despise bullies. Last week, several boys pushed some of my friends and took their lunch boxes. Now the teacher is talking to these boys. Most students despise people who are mean to others. Our teacher says everyone has to be nice to other people.","original":"I (am/is/are) a kind person, but I despise bully. Last week, several boy push some of my friend and take there lunch box. Now the teacher is talk to these boy. Most student despises people who is mean to other. Our teacher say that everyone have to nice to others people.","mistakes":null,"alternatives":[]},{"id":3,"word":"ferocious","answer":"Tigers are ferocious animals. Last Sunday, we visited the zoo and saw a tiger. It has very sharp teeth and claws. Now my brother is drawing a picture of the ferocious tiger.","original":"Tiger (is/are) ferocious animal. Last Sunday, we visit zoo and see tiger. It have very sharp tooth and claw. It look scared. My best friend feel scary. Now my brother is draw a picture of ferocious tiger.","mistakes":null,"alternatives":["A tiger is a ferocious animal. Last Sunday, we visited the zoo and saw a tiger. It had very sharp teeth and claws. It looked scary. My best friend felt scared. Now my brother is drawing a picture of the ferocious tiger."]},{"id":4,"word":"forfeit","answer":"Our team is very sad today. Last Saturday, only three players came to the game. So we forfeited the game. Now the coach is making a new rule. Every player has to come at all times.","original":"Our team (is/are) very sad today. Last Saturday, only three player come to the game. So we forfeit the game. Now the coach is make new rule. Every players have to come at all time.","mistakes":6,"alternatives":[]},{"id":5,"word":"taunt","answer":"Ken is a quiet boy. Every day, some older kids taunt him about his old shoes. Yesterday, they shouted taunts at him again. Ken ignored the taunts and walked away. Now his friends are helping him.","original":"Ken (is/are) a quiet boy. Every day, some older kids taunt him about his old shoe. Yesterday, they shout taunts at him again. Ken ignore the taunts and walk away. Now his friends is helping him","mistakes":6,"alternatives":[]},{"id":6,"word":"covet","answer":"My brother and I are big fans of games. Last month, my friend bought a new game console. I covet his console every day. Now I am saving my pocket money every week. My parents say it is a good idea.","original":"My brother and I (am/is/are) big fan of game. Last month, my friend buy a new game console 遊戲機. I covet his console every day. Now I am save my pocket money every week. My parents says it is a good idea","mistakes":5,"alternatives":[]},{"id":7,"word":"elaborately","answer":"The classroom is elaborately decorated for the party now. Yesterday, all the students hung colorful lights on the walls. Look! Our teacher is carrying a big cake. Everyone loves the beautiful decoration.","original":"The classroom (is/are) elaborately decorated for the party now. Yesterday, all the student hang colorful light on the wall. Look! Our teacher is carry big cake. Everyone love the beautiful decoration.","mistakes":null,"alternatives":[]}],"vocabularyMcq":[{"id":1,"question":"Tom said we should build a ladder to the moon for our science project, but everyone laughed because the idea was completely __________.","options":["absurd","ancient","transparent","mighty"],"answer":0},{"id":2,"question":"Only three players from our basketball team showed up on Saturday, so we had to __________ the game, and the other team won.","options":["savor","forfeit","despise","covet"],"answer":1},{"id":3,"question":"Most students __________ bullies who push smaller kids around and take their lunch money on the playground.","options":["savor","illuminate","adapt","despise"],"answer":3},{"id":4,"question":"Our soccer team won the match by __________ because the other team did not have enough players and never came onto the field.","options":["trickle","forfeit","taunt","heritage"],"answer":1},{"id":5,"question":"Leo's coach told him to ignore the __________ from the other team's fans and keep his eyes on the ball.","options":["hoards","resolutions","trickles","taunts"],"answer":3},{"id":6,"question":"It is __________ to wear a thick winter coat and a wool hat to the beach when the temperature is over thirty-five degrees.","options":["luminous","ancient","absurd","majestic"],"answer":2},{"id":7,"question":"The greedy king was __________ by all the people in his country because he took their food and money for himself.","options":["despised","illuminated","savored","descended"],"answer":0},{"id":8,"question":"The small village was badly damaged after a __________ attack by a pack of hungry wolves during the cold winter night.","options":["sumptuous","ferocious","transparent","mundane"],"answer":1},{"id":9,"question":"The older boys __________ Ken about his old shoes every day, but he just smiled and walked away quietly.","options":["illuminated","descended","taunted","forfeited"],"answer":2},{"id":10,"question":"A __________ storm hit the island last night, with strong winds that pulled down trees and broke many windows.","options":["ferocious","mundane","transparent","sumptuous"],"answer":0},{"id":11,"question":"Amy __________ her cousin for lying to her parents and blaming her for the broken vase last summer.","options":["relished","despised","illuminated","savored"],"answer":1},{"id":12,"question":"The zookeeper warned us not to get too close to the cage because the __________ tiger had attacked another animal that morning.","options":["ferocious","luminous","transparent","mundane"],"answer":0},{"id":13,"question":"My father __________ waiting in long lines, so he always goes to the supermarket early in the morning when it is quiet.","options":["adapts","descends","illuminates","despises"],"answer":3},{"id":14,"question":"The birthday cake was __________ decorated with chocolate flowers, colorful candles, and tiny sugar animals, so nobody wanted to cut it.","options":["elaborately","inadvertently","ferociously","cautiously"],"answer":0},{"id":15,"question":"Some rude kids shouted __________ at the new student because of his accent, so the teacher asked them to say sorry.","options":["trickles","resolutions","taunts","hoards"],"answer":2},{"id":16,"question":"The clown told a very __________ story about a cow that flew to the moon and ate cheese there, and all the children laughed loudly.","options":["ancient","mundane","transparent","absurd"],"answer":3},{"id":17,"question":"The runner came first, but she __________ her gold medal because she took a shortcut through the park during the race.","options":["forfeited","adapted","illuminated","savored"],"answer":0},{"id":18,"question":"Jack always __________ his best friend's new gaming laptop and wishes his parents would buy him the same one for his birthday.","options":["illuminates","forfeits","descends","covets"],"answer":3},{"id":19,"question":"Students who cheat on the final exam will __________ the right to join the class trip to Kenting next month.","options":["covet","adapt","forfeit","savor"],"answer":2},{"id":20,"question":"When Mia came to school late again, she said a giant frog sat on her bike, which was the most __________ excuse the teacher had ever heard.","options":["luminous","absurd","majestic","sumptuous"],"answer":1},{"id":21,"question":"The two dogs had a __________ fight in the park, barking and biting each other until their owners finally pulled them apart.","options":["familiar","transparent","ferocious","luminous"],"answer":2}],"matching":[{"id":22,"word":"absurd","options":["to make something better, stronger, or more beautiful.","something that blocks your way or makes it hard to do something.","completely silly, unreasonable, and not making sense.","known to you because you have seen or heard it before.","very fierce, violent, and dangerous.","to dislike someone or something very much and have no respect for them."],"answer":2},{"id":23,"word":"despise","options":["to make something better, stronger, or more beautiful.","something that blocks your way or makes it hard to do something.","completely silly, unreasonable, and not making sense.","known to you because you have seen or heard it before.","very fierce, violent, and dangerous.","to dislike someone or something very much and have no respect for them."],"answer":5},{"id":24,"word":"ferocious","options":["to make something better, stronger, or more beautiful.","something that blocks your way or makes it hard to do something.","completely silly, unreasonable, and not making sense.","known to you because you have seen or heard it before.","very fierce, violent, and dangerous.","to dislike someone or something very much and have no respect for them."],"answer":4},{"id":25,"word":"familiar","options":["to make something better, stronger, or more beautiful.","something that blocks your way or makes it hard to do something.","completely silly, unreasonable, and not making sense.","known to you because you have seen or heard it before.","very fierce, violent, and dangerous.","to dislike someone or something very much and have no respect for them."],"answer":3},{"id":26,"word":"obstacle","options":["to make something better, stronger, or more beautiful.","something that blocks your way or makes it hard to do something.","completely silly, unreasonable, and not making sense.","known to you because you have seen or heard it before.","very fierce, violent, and dangerous.","to dislike someone or something very much and have no respect for them."],"answer":1}],"wordbank":["relish","taunts","comfort","adapt","forfeit"],"wordbankQuestions":[{"id":27,"question":"“We will have to __________ the match,” said the coach sadly. “Only four of our players are here, and we need five to play.”","answer":"forfeit"},{"id":28,"question":"The little girl cried after she fell off her scooter. “Don't worry, sweetie,” said her mother, trying to __________ her with a warm hug.","answer":"comfort"},{"id":29,"question":"“Moving to Canada was hard at first,” said Amy. “It took me three months to __________ to the cold weather and the new food.”","answer":"adapt"},{"id":30,"question":"“Don't listen to their __________,” said Leo's coach. “They are only trying to make you angry so that you will play badly.”","answer":"taunts"}],"openQuestions":[{"id":31,"question":"What is something that you despise? Why?","sample":"I despise people who cheat in games because it is not fair to the other players."},{"id":32,"question":"What is a ferocious animal that you have seen or read about? What does it do?","sample":"I think a crocodile is a ferocious animal because it has sharp teeth and attacks other animals."}],"reading":[{"title":"The Pizza-Box Oven","paragraphs":["Mia loved science, but she was not the most popular girl in her class. When Mr. Lin announced the school science fair, Mia raised her hand and said she wanted to cook food using only sunlight and an old pizza box.","Some of her classmates laughed. “That's absurd!” shouted Jason. “You can't cook anything in a box!” For the next two weeks, Jason and his friends taunted Mia every day. They called her “Chef Pizza Box” and drew funny pictures of her on the board.","Mia felt hurt, but she did not give up. Every afternoon, she worked in her backyard. She covered the inside of the box with aluminum foil to reflect the sunlight, and she put clear plastic wrap over the top to keep the heat inside. Her first three tries failed, but she kept changing her design.","On the day of the science fair, the sun was shining brightly. While the judges watched, Mia put a slice of bread with cheese inside her oven. Thirty minutes later, the cheese had melted perfectly. The judges were amazed, and Mia won first prize.","After the fair, Jason walked up to Mia. “I'm sorry I laughed at you,” he said quietly. “Can you show me how you made it?” Mia smiled. “Sure,” she said. “Good ideas sometimes sound silly at first.”"],"questions":[{"id":33,"type":"mcq","question":"What is the story mainly about? (Main Idea)","options":["how to make a pizza at home","a girl who kept working on her idea even when others laughed at her","why Jason is the most popular boy in the class","the rules of the school science fair"],"answer":1},{"id":34,"type":"mcq","question":"Why did Mia cover the inside of the box with aluminum foil? (Cause & Effect)","options":["to make the box look shiny for the judges","to stop Jason from drawing on it","to keep the bread from getting wet","to reflect the sunlight into the box"],"answer":3},{"id":35,"type":"mcq","question":"Which of the following is NOT true according to the story? (Detail)","options":["Mia cooked a whole pizza at the science fair.","Mia's first three tries did not work.","Jason gave Mia a nickname to make fun of her.","Jason said sorry to Mia after the fair."],"answer":0},{"id":36,"type":"open","question":"How did Jason's feelings about Mia's idea change? Give ONE example from the story to support your answer. (2 pts)","sample":"At first, Jason thought Mia's idea was absurd — he shouted “That's absurd!” and taunted her (para. 2). Later, he respected her idea because he said sorry and asked her to show him how she made it (para. 5)."}]},{"title":"Sharks: Ferocious Monsters?","paragraphs":["In many movies, sharks are shown as ferocious monsters that hunt people in the ocean. Because of these movies, many people are afraid to swim in the sea. But are sharks really as dangerous as they look on the big screen?","Scientists say the answer is no. There are more than 500 kinds of sharks, and most of them are harmless to humans. The whale shark, the biggest fish in the world, eats mostly tiny plants and animals called plankton. Many other sharks are smaller than a person and are shy around divers.","Shark attacks on people are very rare. Every year, only about 70 to 80 shark attacks happen around the world. In fact, a person is more likely to be hit by lightning than bitten by a shark. Most attacks happen because the shark thinks a swimmer is a seal or a fish.","Sadly, humans are much more dangerous to sharks than sharks are to humans. Every year, people catch about 100 million sharks, often just to use their fins for soup. Because of this, some kinds of sharks may disappear forever.","Sharks are important to the ocean. They eat sick and weak fish, which helps keep the ocean healthy. Instead of fearing sharks, we should learn about them and protect them."],"questions":[{"id":37,"type":"mcq","question":"What is the main idea of the passage? (Main Idea)","options":["Sharks are the most dangerous animals in the ocean.","People should never swim in the sea.","Most sharks are not as dangerous as movies show, and they need our protection.","Whale sharks are the biggest fish in the world."],"answer":2},{"id":38,"type":"mcq","question":"How does the author feel about sharks? (Author's Attitude)","options":["The author thinks sharks are important and should be protected.","The author despises sharks and wants people to stay away from them.","The author believes shark movies show the truth.","The author does not care what happens to sharks."],"answer":0},{"id":39,"type":"mcq","question":"Which of the following is NOT true according to the passage? (Detail)","options":["There are more than 500 kinds of sharks.","Whale sharks eat mostly plankton.","People catch about 100 million sharks every year.","Most shark attacks happen because sharks want to eat humans."],"answer":3},{"id":40,"type":"open","question":"Why does the author think sharks are important to the ocean? Use evidence from the text to support your answer. (2 pts)","sample":"The author thinks sharks are important because they eat sick and weak fish, which helps keep the ocean healthy (para. 5)."}]}]};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const SECTION_INFO={corrections:['改錯題｜局部修正','correction'],vocabularyMcq:['單字選擇','mcq'],matching:['定義配對','mcq'],wordbankQuestions:['選詞填空','fill'],openQuestions:['完整句子作答','open'],reading:['閱讀理解','reading']};
let section='',items=[],index=0,wrong=new Map(),correct=new Set(),attempts=0;
function norm(s){return String(s).trim().toLowerCase().replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/\b(didn't)\b/g,'did not').replace(/\b(don't)\b/g,'do not').replace(/\b(doesn't)\b/g,'does not').replace(/\b(can't)\b/g,'cannot').replace(/\b(isn't)\b/g,'is not').replace(/\b(aren't)\b/g,'are not').replace(/\b(wasn't)\b/g,'was not').replace(/\b(weren't)\b/g,'were not').replace(/\s+([,.!?;:])/g,'$1').replace(/([,.!?;:])(?!\s|$)/g,'$1 ').replace(/\s+/g,' ').trim()}
function normPart(s){return norm(s).replace(/[,.!?;:]/g,'')}
function correctionTarget(item){return item.alternatives?.[0]||item.answer}
function correctionTokens(s){return (String(s).replace(/[\u3400-\u9fff]+/gu,' ').replace(/\s+([,.!?;:])/g,'$1').match(/\([^)]*\)[,.!?;:]?|[A-Za-z]+(?:['’][A-Za-z]+)?[,.!?;:]?|\d+[,.!?;:]?/g)||[])}
function correctionParts(item){const original=correctionTokens(item.original),target=correctionTokens(correctionTarget(item)),n=original.length,m=target.length,dp=Array.from({length:n+1},()=>Array(m+1).fill(0));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=norm(original[i])===norm(target[j])?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);const parts=[];let i=0,j=0,equal=[];const flushEqual=()=>{if(equal.length){parts.push({same:equal.join(' ')});equal=[]}};while(i<n||j<m){if(i<n&&j<m&&norm(original[i])===norm(target[j])){equal.push(original[i]);i++;j++;continue}flushEqual();const wrong=[],right=[];while((i<n||j<m)&&!(i<n&&j<m&&norm(original[i])===norm(target[j]))){if(i<n&&(j>=m||dp[i+1][j]>=dp[i][j+1]))wrong.push(original[i++]);else if(j<m)right.push(target[j++])}if(right.length)parts.push({wrong:wrong.join(' ')||'（缺字）',answer:right.join(' ')});else if(wrong.length)parts.push({wrong:wrong.join(' '),answer:''})}flushEqual();return parts}
function correctionHtml(item){return '<div class="correction-flow">'+correctionParts(item).map((p,i)=>p.same?`<span>${esc(p.same)}</span>`:p.answer?`<span class="correction-edit"><del>${esc(p.wrong)}</del><input class="correction-input" data-answer="${esc(p.answer)}" aria-label="第 ${i+1} 個錯誤的正確字詞" size="${Math.min(18,Math.max(7,p.answer.length))}" placeholder="改成？"></span>`:`<span class="correction-edit"><del>${esc(p.wrong)}</del></span>`).join('')+'</div>'}
function sectionCount(key){if(key==='reading')return DATA.reading.reduce((n,p)=>n+p.questions.length,0);return DATA[key].length}
function renderSections(){const labels={corrections:'錯誤字詞標紅，只需逐格改正',vocabularyMcq:'四選一即時批改',matching:'依定義選出正確配對',wordbankQuestions:'從單字庫輸入正確答案',openQuestions:'完整句作答並對照範例',reading:'文章、選擇題與文字作答'};$('#sectionGrid').innerHTML=Object.keys(SECTION_INFO).map(key=>`<button class="section-btn" data-section="${key}"><b>${SECTION_INFO[key][0]}</b><span>${sectionCount(key)} 題｜${labels[key]}</span></button>`).join('');document.querySelectorAll('.section-btn').forEach(btn=>btn.onclick=()=>start(btn.dataset.section))}
function start(key){section=key;items=key==='reading'?DATA.reading.flatMap(p=>p.questions.map(q=>({...q,passage:p}))):DATA[key];index=0;wrong=new Map();correct=new Set();$('#select').classList.add('hidden');$('#result').classList.add('hidden');$('#quiz').classList.remove('hidden');show()}
function show(){speechSynthesis?.cancel();attempts=0;const item=items[index];$('#meta').textContent=`${SECTION_INFO[section][0]}｜第 ${index+1} / ${items.length} 題`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=(index+1)/items.length*100+'%';$('#passage').classList.add('hidden');$('#reference').classList.add('hidden');$('#voiceBox').classList.add('hidden');$('#feedback').className='feedback hidden';$('#showAnswer').classList.add('hidden');$('#check').classList.remove('hidden');$('#next').classList.add('hidden');const q=$('#question'),a=$('#answerArea'),ins=$('#instructions');ins.classList.add('hidden');if(section==='corrections'){ins.textContent='紅色刪除線是錯誤字詞；請只在旁邊的格子輸入正確字詞。';ins.classList.remove('hidden');q.className='question wrong-sentence';q.innerHTML=correctionHtml(item);a.innerHTML=''}else if(section==='vocabularyMcq'||section==='matching'){q.className='question';q.textContent=section==='matching'?`${item.id}. ${item.word}`:`${item.id}. ${item.question}`;a.innerHTML='<div class="options">'+item.options.map((o,i)=>`<label class="option"><input type="radio" name="choice" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')+'</div>'}else if(section==='wordbankQuestions'){q.className='question';q.textContent=`${item.id}. ${item.question}`;a.innerHTML='<div class="wordbank">'+DATA.wordbank.map(w=>`<span class="word">${esc(w)}</span>`).join('')+'</div><input class="answer" autocomplete="off" spellcheck="false" placeholder="輸入單字">'}else if(section==='openQuestions'){q.className='question';q.textContent=`${item.id}. ${item.question}`;a.innerHTML='<textarea class="answer" rows="5" placeholder="請用完整英文句子作答"></textarea>';$('#check').textContent='查看參考答案'}else{const p=item.passage;$('#passage').innerHTML=`<h3>${esc(p.title)}</h3>`+p.paragraphs.map(x=>`<p>${esc(x)}</p>`).join('');$('#passage').classList.remove('hidden');q.className='question';q.textContent=`${item.id}. ${item.question}`;if(item.type==='mcq')a.innerHTML='<div class="options">'+item.options.map((o,i)=>`<label class="option"><input type="radio" name="choice" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')+'</div>';else{a.innerHTML='<textarea class="answer" rows="5" placeholder="請用文章證據完整作答"></textarea>';$('#check').textContent='查看參考答案'}}if(section!=='openQuestions'&&!(section==='reading'&&item.type==='open'))$('#check').textContent='檢查答案';setTimeout(()=>a.querySelector('input,textarea')?.focus(),0)}
function recordWrong(item,value){const key=section+'-'+item.id;if(!wrong.has(key))wrong.set(key,{item,section,attempts:[]});wrong.get(key).attempts.push(value);$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
function completedText(item){if(section==='corrections')return correctionTarget(item);if(section==='vocabularyMcq')return item.question.replace(/_{3,}/,item.options[item.answer]);if(section==='matching')return `${item.word}: ${item.options[item.answer]}`;if(section==='wordbankQuestions')return item.question.replace(/_{3,}/,item.answer);return item.sample||''}
function speak(text=completedText(items[index])){if(!speechSynthesis||!text)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.86;speechSynthesis.speak(u)}
$('#speak').onclick=()=>speak();
$('#check').onclick=()=>{const item=items[index],open=section==='openQuestions'||(section==='reading'&&item.type==='open');if(open){const value=$('#answerArea .answer').value.trim();if(!value)return alert('請先輸入完整答案。');$('#reference').textContent='參考答案：\n'+item.sample;$('#reference').classList.remove('hidden');$('#check').classList.add('hidden');$('#next').classList.remove('hidden');$('#voiceTarget').textContent=item.sample;$('#voiceBox').classList.remove('hidden');speak(item.sample);correct.add(section+'-'+item.id);return}let value,ok=false,answerText='';if(section==='corrections'){const fields=[...document.querySelectorAll('.correction-input')];if(fields.some(x=>!x.value.trim()))return alert('請先完成所有紅色錯誤旁的格子。');fields.forEach(x=>{const good=normPart(x.value)===normPart(x.dataset.answer);x.classList.toggle('correct',good);x.classList.toggle('incorrect',!good)});value=fields.map(x=>x.dataset.answer+'→'+x.value.trim()).join('；');ok=fields.every(x=>normPart(x.value)===normPart(x.dataset.answer));answerText=correctionTarget(item)}else if(section==='vocabularyMcq'||section==='matching'||(section==='reading'&&item.type==='mcq')){const selected=document.querySelector('input[name="choice"]:checked');if(!selected)return alert('請先選擇答案。');value=String.fromCharCode(65+(+selected.value));ok=+selected.value===item.answer;answerText=String.fromCharCode(65+item.answer)+'. '+item.options[item.answer]}else{value=$('#answerArea .answer').value.trim();if(!value)return alert('請先輸入答案。');ok=norm(value)===norm(item.answer);answerText=item.answer}if(ok){correct.add(section+'-'+item.id);$('#feedback').className='feedback ok';$('#feedback').textContent='✅ 正確！';$('#check').classList.add('hidden');$('#showAnswer').classList.add('hidden');$('#next').classList.remove('hidden');$('#voiceTarget').textContent=completedText(item);$('#voiceBox').classList.remove('hidden');speak()}else{attempts++;recordWrong(item,value);$('#feedback').className='feedback bad';if(section==='corrections'){$('#feedback').textContent='❌ 紅框中的修改仍不正確，請只重填這些格子。';$('#showAnswer').classList.remove('hidden')}else{$('#feedback').textContent='❌ 不正確。正確答案：'+answerText+'\n請重新作答。';document.querySelectorAll('input[name="choice"]').forEach(x=>x.checked=false);$('#answerArea .answer')?.select()}}};
$('#showAnswer').onclick=()=>{const item=items[index];$('#reference').textContent='完整正確段落：\n'+correctionTarget(item);$('#reference').classList.remove('hidden')};
$('#next').onclick=()=>{index++;index>=items.length?finish():show()};$('#finish').onclick=finish;
function finish(){speechSynthesis?.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');$('#summary').innerHTML=`<div class="stat">本輪題數<b>${items.length}</b></div><div class="stat">完成題數<b>${correct.size}</b></div><div class="stat">曾答錯<b>${wrong.size}</b></div>`;$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>`<div class="wrong-card"><b>${i+1}. 第 ${r.item.id} 題</b><p>${esc(r.item.original||r.item.question||r.item.word)}</p><p><strong>錯誤答案：</strong>${r.attempts.map(esc).join('；')}</p><p><strong>正確答案：</strong>${esc(r.item.answer||r.item.options?.[r.item.answer]||'請參考範例')}</p></div>`).join(''):'<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size)}
$('#restart').onclick=()=>{location.reload()};$('#back').onclick=()=>{speechSynthesis?.cancel();$('#quiz').classList.add('hidden');$('#result').classList.add('hidden');$('#select').classList.remove('hidden')};
$('#download').onclick=async()=>{if(!wrong.size)return;try{if(!window.docx)await new Promise((ok,fail)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js';s.onload=ok;s.onerror=fail;document.head.append(s)});const{Document,Packer,Paragraph,TextRun,HeadingLevel}=window.docx,children=[new Paragraph({text:DATA.title+' 錯題紀錄',heading:HeadingLevel.TITLE})];for(const r of wrong.values()){children.push(new Paragraph({children:[new TextRun({text:'第 '+r.item.id+' 題',bold:true})]}),new Paragraph(r.item.original||r.item.question||r.item.word),new Paragraph('錯誤答案：'+r.attempts.join('；')),new Paragraph('正確答案：'+(r.item.answer||r.item.options?.[r.item.answer]||'請參考範例')))}const blob=await Packer.toBlob(new Document({sections:[{children}]})),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=DATA.code+'_錯題紀錄.docx';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){alert('目前無法產生 DOCX，請稍後再試。')}};
renderSections();
</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
