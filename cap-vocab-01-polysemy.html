<script>window.QUIZ_CONFIG={"title": "國中會考單字片語｜一字多義 Polysemy", "mode": "mcq", "questions": [{"id": 1, "question": "Jeremy made a great ______ and scored two points for his team.", "options": ["case", "rule", "sound", "shot"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) shot\n【單字】shot (n.)：投籃；射門\n【中譯】Jeremy 漂亮地投籃，為他的隊伍得了兩分。", "explanationSource": "supplemental"}, {"id": 2, "question": "Mom left a ______ on the table: \"Your lunch is in the fridge.\"", "options": ["note", "ground", "level", "land"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) note\n【單字】note (n.)：便條\n【中譯】媽媽在桌上留了一張便條：「你的午餐在冰箱裡。」", "explanationSource": "supplemental"}, {"id": 3, "question": "A ______ is a small animal. It sleeps in the day and flies at night.", "options": ["bat", "seal", "sentence", "book"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) bat\n【單字】bat (n.)：蝙蝠\n【中譯】蝙蝠是一種小動物。牠白天睡覺，晚上飛行。", "explanationSource": "supplemental"}, {"id": 4, "question": "I tried to fix my bike, but I ______. It is still broken.", "options": ["danced", "smiled", "failed", "stayed"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) failed\n【單字】fail (v.)：失敗\n【中譯】我試著修理我的腳踏車，但是我失敗了。它還是壞的。", "explanationSource": "supplemental"}, {"id": 5, "question": "In the movie, the bad man always wears ______ clothes, so it is hard to see him at night.", "options": ["blank", "giant", "black", "present"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) black\n【單字】black (adj.)：黑色的\n【中譯】在電影裡，那個壞人總是穿黑色的衣服，所以晚上很難看見他。", "explanationSource": "supplemental"}, {"id": 6, "question": "There is a ______ swimming in the lake. It says, \"Quack, quack.\"", "options": ["paper", "cut", "duck", "bow"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) duck\n【單字】duck (n.)：鴨\n【中譯】湖裡有一隻鴨子在游泳。牠叫著：「呱呱。」", "explanationSource": "supplemental"}, {"id": 7, "question": "I got up at five this morning. It was too ______ for my brother, so he was still sleeping.", "options": ["early", "giant", "pop", "down"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) early\n【單字】early (adj.)：早的\n【中譯】我今天早上五點起床。對我弟弟來說太早了，所以他還在睡覺。", "explanationSource": "supplemental"}, {"id": 8, "question": "Don't take out your money. Dinner tonight is my ______.", "options": ["treat", "screen", "gas", "nose"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) treat\n【單字】treat (n.)：請客\n【中譯】別拿出你的錢。今晚的晚餐我請客。", "explanationSource": "supplemental"}, {"id": 9, "question": "Mia started to play the piano at three, and she plays beautifully. She is a ______ musician.", "options": ["born", "smooth", "first", "present"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) born\n【單字】born (adj.)：天生的\n【中譯】Mia 三歲就開始彈鋼琴，而且她彈得很美。她是個天生的音樂家。", "explanationSource": "supplemental"}, {"id": 10, "question": "Stop! The traffic light is ______. You can't cross the street now.", "options": ["kind", "open", "mean", "red"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) red\n【單字】red (adj.)：紅色的\n【中譯】停！紅綠燈是紅色的。你現在不能過馬路。", "explanationSource": "supplemental"}, {"id": 11, "question": "The shoe store is having a big ______ this week. Everything is half price.", "options": ["level", "sale", "screen", "line"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) sale\n【單字】sale (n.)：特賣\n【中譯】那家鞋店這星期在舉行大特賣。所有東西都半價。", "explanationSource": "supplemental"}, {"id": 12, "question": "My cousin is a ______. She wears beautiful clothes in fashion shows.", "options": ["model", "patient", "cook", "course"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) model\n【單字】model (n.)：模特兒\n【中譯】我的表姊是模特兒。她在時裝秀中穿漂亮的衣服。", "explanationSource": "supplemental"}, {"id": 13, "question": "Ben has no brothers or sisters. He is the ______ child in his family.", "options": ["only", "many", "each", "all"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) only\n【單字】only (adj.)：唯一的\n【中譯】Ben 沒有兄弟姊妹。他是家中唯一的小孩。", "explanationSource": "supplemental"}, {"id": 14, "question": "Don't be nervous. Just stay ______ and answer the questions slowly.", "options": ["mad", "fat", "cool", "terrible"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) cool\n【單字】cool (adj.)：冷靜的\n【中譯】別緊張。只要保持冷靜，慢慢回答問題。", "explanationSource": "supplemental"}, {"id": 15, "question": "I take piano ______ every Saturday. My teacher is Ms. Wang.", "options": ["times", "lessons", "hands", "answers"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) lessons\n【單字】lesson (n.)：課程\n【中譯】我每個星期六上鋼琴課。我的老師是王老師。", "explanationSource": "supplemental"}, {"id": 16, "question": "We took the ______ from Taipei Station to Hsinchu. It was fast and comfortable.", "options": ["nose", "sentence", "level", "train"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) train\n【單字】train (n.)：火車\n【中譯】我們從台北車站搭火車到新竹。又快又舒服。", "explanationSource": "supplemental"}, {"id": 17, "question": "My family lived in Hualien in 2015. I was only six years old ______.", "options": ["yet", "far", "then", "hard"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) then\n【單字】then (adv.)：在那時\n【中譯】我家在 2015 年住在花蓮。我那時只有六歲。", "explanationSource": "supplemental"}, {"id": 18, "question": "I ______ my English teacher at the supermarket yesterday. She said hi to me.", "options": ["booked", "met", "hunted", "fed"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) met\n【單字】meet (v.)：遇見\n【中譯】我昨天在超市遇見我的英文老師。她跟我打招呼。", "explanationSource": "supplemental"}, {"id": 19, "question": "Have you seen my ______ dog? He ran away last night, and I can't find him.", "options": ["hundred", "pop", "lost", "thousand"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) lost\n【單字】lost (adj.)：遺失的\n【中譯】你有看到我走失的狗嗎？牠昨晚跑走了，我找不到牠。", "explanationSource": "supplemental"}, {"id": 20, "question": "Ken told a funny ______, and everyone in the class laughed.", "options": ["nose", "dish", "joke", "bank"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) joke\n【單字】joke (n.)：玩笑\n【中譯】Ken 說了一個好笑的笑話，全班都笑了。", "explanationSource": "supplemental"}, {"id": 21, "question": "I wrote a ______ to my grandma and sent it to her by mail.", "options": ["party", "ground", "slice", "letter"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) letter\n【單字】letter (n.)：信件\n【中譯】我寫了一封信給我奶奶，並用郵寄寄給她。", "explanationSource": "supplemental"}, {"id": 22, "question": "Walk to the ______ of this street, and you will see the post office.", "options": ["answer", "feed", "dish", "end"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) end\n【單字】end (n.)：盡頭\n【中譯】走到這條街的盡頭，你就會看到郵局。", "explanationSource": "supplemental"}, {"id": 23, "question": "A: Would you like some more tea?\nB: Yes, ______. Thank you.", "options": ["please", "before", "or", "until"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) please\n【單字】please (int.)：請\n【中譯】A：你想再來點茶嗎？\nB：好的，麻煩你了。謝謝。", "explanationSource": "supplemental"}, {"id": 24, "question": "The ______ on my little finger broke when I opened the can.", "options": ["slice", "bow", "sentence", "nail"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) nail\n【單字】nail (n.)：指甲\n【中譯】我打開罐頭時，小指的指甲斷了。", "explanationSource": "supplemental"}, {"id": 25, "question": "There was so much ______ last night that the streets were all wet this morning.", "options": ["rain", "feed", "play", "land"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) rain\n【單字】rain (n.)：雨\n【中譯】昨晚下了好多雨，所以今天早上街道都是濕的。", "explanationSource": "supplemental"}, {"id": 26, "question": "We are going on a ______ to Japan next week. We will stay there for five days.", "options": ["case", "hand", "trip", "bank"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) trip\n【單字】trip (n.)：旅程\n【中譯】我們下星期要去日本旅行。我們會在那裡待五天。", "explanationSource": "supplemental"}, {"id": 27, "question": "Our school basketball team won the ______ last night. The score was 60 to 52.", "options": ["screen", "seal", "book", "game"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) game\n【單字】game (n.)：比賽\n【中譯】我們學校的籃球隊昨晚贏了比賽。比數是 60 比 52。", "explanationSource": "supplemental"}, {"id": 28, "question": "Let's go to the ______ and play on the grass under the trees.", "options": ["park", "slice", "answer", "feed"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) park\n【單字】park (n.)：公園\n【中譯】我們去公園，在樹下的草地上玩吧。", "explanationSource": "supplemental"}, {"id": 29, "question": "Ms. Lin is very ______. She never gets angry when we ask the same question again and again.", "options": ["patient", "down", "giant", "many"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) patient\n【單字】patient (adj.)：有耐心的\n【中譯】林老師很有耐心。我們一再問同樣的問題時，她從不生氣。", "explanationSource": "supplemental"}, {"id": 30, "question": "In spring, the grass and the leaves on the trees are ______.", "options": ["mean", "cross", "present", "green"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) green\n【單字】green (adj.)：綠色的\n【中譯】春天時，草和樹上的葉子是綠色的。", "explanationSource": "supplemental"}, {"id": 31, "question": "My sister loves art. She ______ pictures of flowers every weekend.", "options": ["mops", "feeds", "paints", "catches"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) paints\n【單字】paint (v.)：繪畫\n【中譯】我姊姊熱愛藝術。她每個週末都畫花的圖畫。", "explanationSource": "supplemental"}, {"id": 32, "question": "Hurry up! The bus is coming. We don't want to be ______ for school.", "options": ["smooth", "late", "light", "giant"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) late\n【單字】late (adj.)：晚的；遲的\n【中譯】快點！公車來了。我們上學可不想遲到。", "explanationSource": "supplemental"}, {"id": 33, "question": "Tom looked at his friend's answers during the math test. The teacher said, \"Don't ______!\"", "options": ["land", "fish", "row", "cheat"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) cheat\n【單字】cheat (v.)：作弊\n【中譯】Tom 在數學考試時看他朋友的答案。老師說：「不准作弊！」", "explanationSource": "supplemental"}, {"id": 34, "question": "Put the milk ______ the fridge, or it will go bad.", "options": ["by", "through", "in", "over"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) in\n【單字】in (prep.)：在…裡面\n【中譯】把牛奶放進冰箱裡，否則它會壞掉。", "explanationSource": "supplemental"}, {"id": 35, "question": "I have to write a ______ about Taiwan's animals for my science class.", "options": ["report", "gas", "land", "bow"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) report\n【單字】report (n.)：報告\n【中譯】我必須為自然課寫一篇關於台灣動物的報告。", "explanationSource": "supplemental"}, {"id": 36, "question": "It takes ______ twenty minutes to walk from my home to school.", "options": ["up", "far", "back", "around"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) around\n【單字】around (adv.)：大約\n【中譯】從我家走路到學校大約要二十分鐘。", "explanationSource": "supplemental"}, {"id": 37, "question": "Please ______ my hand when we cross the street.", "options": ["hold", "comb", "save", "mop"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) hold\n【單字】hold (v.)：握\n【中譯】我們過馬路時，請握住我的手。", "explanationSource": "supplemental"}, {"id": 38, "question": "The bird flew out of its cage. Now it is ______ and can go anywhere.", "options": ["thousand", "free", "mean", "first"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) free\n【單字】free (adj.)：自由的\n【中譯】那隻鳥飛出了籠子。現在牠自由了，可以去任何地方。", "explanationSource": "supplemental"}, {"id": 39, "question": "My brother is a big ______ of that baseball team. He goes to all of their games.", "options": ["time", "fan", "cut", "answer"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) fan\n【單字】fan (n.)：粉絲\n【中譯】我哥哥是那支棒球隊的超級粉絲。他會去看他們所有的比賽。", "explanationSource": "supplemental"}, {"id": 40, "question": "Bananas turn ______ when they are ready to eat.", "options": ["present", "kind", "yellow", "thousand"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) yellow\n【單字】yellow (adj.)：黃色的\n【中譯】香蕉可以吃的時候會變成黃色。", "explanationSource": "supplemental"}, {"id": 41, "question": "Class starts at eight, and it's a ______ to eight now. We have fifteen minutes.", "options": ["kid", "dish", "nose", "quarter"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) quarter\n【單字】quarter (n.)：一刻鐘\n【中譯】八點上課，現在是七點四十五分（差一刻八點）。我們還有十五分鐘。", "explanationSource": "supplemental"}, {"id": 42, "question": "We have studied for two hours. Let's take a ______ and drink some water.", "options": ["ground", "break", "nose", "land"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) break\n【單字】break (n.)：休息\n【中譯】我們已經讀了兩個小時的書。我們休息一下，喝點水吧。", "explanationSource": "supplemental"}, {"id": 43, "question": "The singer is singing in the stadium right now, and you can watch the ______ show on TV.", "options": ["mean", "fat", "down", "live"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) live\n【單字】live (adj.)：現場的\n【中譯】那位歌手現在正在體育館唱歌，你可以在電視上看現場節目。", "explanationSource": "supplemental"}, {"id": 44, "question": "In the story, an old man gives Jack some ______ beans. They grow into a very tall tree in one night.", "options": ["blank", "first", "magic", "present"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) magic\n【單字】magic (adj.)：神奇的\n【中譯】在故事裡，一位老人給了 Jack 一些神奇的豆子。它們在一夜之間長成一棵非常高的樹。", "explanationSource": "supplemental"}, {"id": 45, "question": "The cat is sleeping ______ the roof. I can see it from my window.", "options": ["on", "to", "until", "since"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) on\n【單字】on (prep.)：在…上面\n【中譯】貓正在屋頂上睡覺。我從窗戶就能看到牠。", "explanationSource": "supplemental"}, {"id": 46, "question": "Mom wrote a ______ of things to buy before she went to the supermarket.", "options": ["ring", "cover", "list", "pipe"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) list\n【單字】list (n.)：清單\n【中譯】媽媽去超市之前寫了一張要買的東西的清單。", "explanationSource": "supplemental"}, {"id": 47, "question": "The basketball game is ______. Our team won 80 to 75!", "options": ["patient", "over", "white", "kind"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) over\n【單字】over (adj.)：結束\n【中譯】籃球比賽結束了。我們隊以80比75獲勝！", "explanationSource": "supplemental"}, {"id": 48, "question": "She has a big smile on her ______.", "options": ["can", "ticket", "stop", "face"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) face\n【單字】face (n.)：臉\n【中譯】她臉上帶著大大的微笑。", "explanationSource": "supplemental"}, {"id": 49, "question": "I had two pieces of ______ with butter and jam for breakfast.", "options": ["sight", "fear", "smell", "toast"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) toast\n【單字】toast (n.)：土司\n【中譯】我早餐吃了兩片塗奶油和果醬的土司。", "explanationSource": "supplemental"}, {"id": 50, "question": "My sister looks ______ my mom. They both have big eyes and long hair.", "options": ["through", "like", "since", "besides"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) like\n y to school every morning, and it always smells great.", "options": ["fail", "cheat", "pass", "comb"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) pass\n【單字】pass (v.)：路過\n【中譯】我每天早上上學途中都會路過一家麵包店，那裡總是很香。", "explanationSource": "supplemental"}, {"id": 58, "question": "A ______ landed on my sandwich, so I didn't eat it.", "options": ["order", "kind", "figure", "fly"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) fly\n【單字】fly (n.)：蒼蠅\n【中譯】一隻蒼蠅停在我的三明治上，所以我沒有吃它。", "explanationSource": "supplemental"}, {"id": 59, "question": "Long ago, people ______ deer and rabbits for food.", "options": ["fooled", "bullied", "hunted", "felt"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) hunted\n【單字】hunt (v.)：打獵\n【中譯】很久以前，人們獵捕鹿和兔子當作食物。", "explanationSource": "supplemental"}, {"id": 60, "question": "We had a party for Dad's birthday, and he didn't know about it. It was a big ______ for him.", "options": ["yard", "pot", "block", "surprise"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) surprise\n【單字】surprise (n.)：驚喜\n【中譯】我們為爸爸辦了生日派對，而他事先不知道。這對他來說是一個大驚喜。", "explanationSource": "supplemental"}, {"id": 61, "question": "Carrots and pumpkins are usually ______.", "options": ["patient", "orange", "pop", "cross"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) orange\n【單字】orange (adj.)：橘色的\n【中譯】紅蘿蔔和南瓜通常是橘色的。", "explanationSource": "supplemental"}, {"id": 62, "question": "About two ______ people live in this big city.", "options": ["million", "second", "half", "early"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) million\n【單字】million (adj.)：百萬\n【中譯】大約有兩百萬人住在這座大城市裡。", "explanationSource": "supplemental"}, {"id": 63, "question": "Our dance teacher taught us a cool new dance ______ today.", "options": ["comb", "seal", "move", "pipe"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) move\n【單字】move (n.)：舞蹈動作\n【中譯】我們的舞蹈老師今天教我們一個很酷的新舞蹈動作。", "explanationSource": "supplemental"}, {"id": 64, "question": "I put a red ______ on the map to show where our school is.", "options": ["mark", "cold", "trouble", "age"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) mark\n【單字】mark (n.)：記號\n【中譯】我在地圖上畫了一個紅色記號，標出我們學校的位置。", "explanationSource": "supplemental"}, {"id": 65, "question": "Our class leader always picks up trash first, and the other students follow her ______.", "options": ["lead", "floor", "salt", "nail"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) lead\n【單字】lead (n.)：帶頭；榜樣\n【中譯】我們的班長總是第一個撿垃圾，其他同學都以她為榜樣、跟著她做。", "explanationSource": "supplemental"}, {"id": 66, "question": "Bees make ______. It is sweet and good in tea.", "options": ["lead", "rock", "gas", "honey"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) honey\n【單字】honey (n.)：蜂蜜\n【中譯】蜜蜂會製造蜂蜜。它很甜，加在茶裡很好喝。", "explanationSource": "supplemental"}, {"id": 67, "question": "I hurt my left ______ when I played soccer, so I can't walk well now.", "options": ["foot", "heat", "nose", "bank"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) foot\n【單字】foot (n.)：腳\n【中譯】我踢足球時傷到了左腳，所以現在不太能好好走路。", "explanationSource": "supplemental"}, {"id": 68, "question": "Drink more milk, and you will ______ tall.", "options": ["take", "cheat", "mop", "grow"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) grow\n【單字】grow (v.)：成長\n【中譯】多喝牛奶，你就會長高。", "explanationSource": "supplemental"}, {"id": 69, "question": "The ______ on my bag is broken, so I can't close it.", "options": ["burn", "star", "zip", "rule"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) zip\n【單字】zip (n.)：拉鍊\n【中譯】我包包上的拉鍊壞了，所以我關不起來。", "explanationSource": "supplemental"}, {"id": 70, "question": "There are many ______ waiting in line at the bus stop.", "options": ["nails", "rules", "pots", "people"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) people\n【單字】people (n.)：人們（複數）\n【中譯】有很多人在公車站排隊等車。", "explanationSource": "supplemental"}, {"id": 71, "question": "Dad was ______ because I broke his new phone.", "options": ["close", "mad", "even", "born"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) mad\n【單字】mad (adj.)：生氣的\n【中譯】爸爸很生氣，因為我弄壞了他的新手機。", "explanationSource": "supplemental"}, {"id": 72, "question": "Grandma smiled with ______ when she opened our present.", "options": ["pleasure", "quarter", "pipe", "level"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) pleasure\n【單字】pleasure (n.)：愉快\n【中譯】奶奶打開我們的禮物時愉快地笑了。", "explanationSource": "supplemental"}, {"id": 73, "question": "The name ______ my dog is Lucky.", "options": ["through", "since", "until", "of"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) of\n【單字】of (prep.)：屬於…的\n【中譯】我的狗的名字是 Lucky。", "explanationSource": "supplemental"}, {"id": 74, "question": "The ______ on the door says \"No Smoking.\"", "options": ["smile", "sign", "dish", "shot"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) sign\n【單字】sign (n.)：標誌\n【中譯】門上的標誌寫著「禁止吸菸」。", "explanationSource": "supplemental"}, {"id": 75, "question": "My mom keeps a ______ of all the money she spends every day.", "options": ["record", "sale", "bow", "swing"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) record\n【單字】record (n.)：紀錄\n【中譯】我媽媽把她每天花的錢都做了紀錄。", "explanationSource": "supplemental"}, {"id": 76, "question": "Don't be ______ to your little brother. Be nice to him.", "options": ["free", "hard", "mean", "still"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) mean\n【單字】mean (adj.)：兇的；刻薄的\n【中譯】不要對你弟弟那麼兇 rLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) chair\n【單字】chair (n.)：椅子\n【中譯】請坐這張椅子。它有軟軟的座墊和椅背。", "explanationSource": "supplemental"}, {"id": 84, "question": "My cat is very fat. It weighs fifteen ______.", "options": ["seconds", "pounds", "grades", "yards"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) pounds\n【單字】pound (n.)：磅\n【中譯】我的貓很胖。牠重十五磅。", "explanationSource": "supplemental"}, {"id": 85, "question": "Young kids should sit in the ______ seat of the car, not in the front seat.", "options": ["key", "back", "late", "live"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) back\n【單字】back (adj.)：後面的\n【中譯】年幼的孩子應該坐在汽車的後座，而不是前座。", "explanationSource": "supplemental"}, {"id": 86, "question": "Please ______ the sleeping baby on the bed gently.", "options": ["surf", "row", "lay", "cheat"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) lay\n【單字】lay (v.)：放置\n【中譯】請把睡著的寶寶輕輕地放在床上。", "explanationSource": "supplemental"}, {"id": 87, "question": "This stone feels ______. There are no rough parts on it.", "options": ["pretty", "lost", "smooth", "present"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) smooth\n【單字】smooth (adj.)：平滑的（觸感）\n【中譯】這塊石頭摸起來很平滑。上面沒有粗糙的地方。", "explanationSource": "supplemental"}, {"id": 88, "question": "My grandparents live in the ______. They have a farm and many animals.", "options": ["country", "party", "race", "sentence"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) country\n【單字】country (n.)：鄉下\n【中譯】我的祖父母住在鄉下。他們有一座農場和許多動物。", "explanationSource": "supplemental"}, {"id": 89, "question": "The bus is so ______ today. I think we will be late for school.", "options": ["only", "own", "slow", "top"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) slow\n【單字】slow (adj.)：慢的\n【中譯】今天公車好慢。我想我們上學會遲到。", "explanationSource": "supplemental"}, {"id": 90, "question": "We heard a loud ______ for help from the river.", "options": ["course", "cry", "comb", "pack"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) cry\n【單字】cry (n.)：呼喊聲；叫聲\n【中譯】我們聽到河邊傳來一聲大聲的呼救聲。", "explanationSource": "supplemental"}, {"id": 91, "question": "Good job! All your answers on the test are ______.", "options": ["lost", "right", "mad", "cross"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) right\n【單字】right (adj.)：正確的\n【中譯】做得好！你考試的答案全部都是正確的。", "explanationSource": "supplemental"}, {"id": 92, "question": "The little girl sat on the ______, and her dad pushed her high into the air.", "options": ["mop", "swing", "toast", "fan"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) swing\n【單字】swing (n.)：鞦韆\n【中譯】小女孩坐在鞦韆上，她爸爸把她推得高高的。", "explanationSource": "supplemental"}, {"id": 93, "question": "Let's get some fresh juice at the juice ______ next to the gym.", "options": ["pipe", "bar", "yard", "nail"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) bar\n【單字】bar (n.)：（賣飲料、點心的）櫃臺；吧\n【中譯】我們去體育館旁邊的果汁吧買些新鮮果汁吧。", "explanationSource": "supplemental"}, {"id": 94, "question": "Did the mailman bring any ______ for me? I'm waiting for a letter from Grandma.", "options": ["smoke", "honey", "mail", "rock"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) mail\n【單字】mail (n.)：信件\n【中譯】郵差有送我的信件來嗎？我在等奶奶寄來的信。", "explanationSource": "supplemental"}, {"id": 95, "question": "Please don't throw kitchen ______ into the river. It makes the water dirty.", "options": ["fear", "magic", "pop", "waste"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) waste\n【單字】waste (n.)：廢棄物\n【中譯】請不要把廚房廢棄物丟進河裡，它會讓河水變髒。", "explanationSource": "supplemental"}, {"id": 96, "question": "Every night, Mom reads me a ______ before I go to sleep.", "options": ["story", anation": "【答案】(D) host\n【單字】host (n.)：主人\n【中譯】林先生在他的派對上是個很棒的主人，他給所有客人食物和飲料。", "explanationSource": "supplemental"}, {"id": 103, "question": "The soup is ______ hot that I can't eat it now.", "options": ["even", "so", "yet", "still"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) so\n【單字】so (adv.)：如此地\n【中譯】這湯如此燙，所以我現在沒辦法喝。", "explanationSource": "supplemental"}, {"id": 104, "question": "The teacher drew a big ______ on the board and said, \"This is the sun.\"", "options": ["cross", "line", "circle", "key"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) circle\n【單字】circle (n.)：圓圈\n【中譯】老師在黑板上畫了一個大圓圈，說：「這是太陽。」", "explanationSource": "supplemental"}, {"id": 105, "question": "Amy wore a long red ______ to her sister's wedding.", "options": ["zip", "pin", "dress", "watch"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) dress\n【單字】dress (n.)：洋裝\n【中譯】艾咪穿了一件紅色長洋裝去參加她姊姊的婚禮。", "explanationSource": "supplemental"}, {"id": 106, "question": "December is the ______ month of the year.", "options": ["first", "second", "last", "third"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) last\n【單字】last (adj.)：最後的\n【中譯】十二月是一年中的最後一個月。", "explanationSource": "supplemental"}, {"id": 107, "question": "Our neighbor is very ______. She often helps old people carry their bags.", "options": ["mad", "kind", "cross", "mean"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) kind\n【單字】kind (adj.)：仁慈的\n【中譯】我們的鄰居非常仁慈，她常常幫老人家提袋子。", "explanationSource": "supplemental"}, {"id": 108, "question": "There may be a ______ this afternoon, so take an umbrella with you.", "options": ["toast", "sale", "smile", "shower"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) shower\n【單字】shower (n.)：陣雨\n【中譯】今天下午可能會有陣雨，所以帶把傘在身上。", "explanationSource": "supplemental"}, {"id": 109, "question": "The train went ______ a long tunnel under the mountain.", "options": ["through", "until", "since", "of"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) through\n【單字】through (prep.)：穿越\n【中譯】火車穿越了山底下一條長長的隧道。", "explanationSource": "supplemental"}, {"id": 110, "question": "I'll mix red and blue paint to make ______ paint.", "options": ["green", "yellow", "purple", "orange"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) purple\n【單字】purple (adj.)：紫色的\n【中譯】我要把紅色和藍色的顏料混在一起，調出紫色的顏料。", "explanationSource": "supplemental"}, {"id": 111, "question": "Don't let the little boy stay ______ at home. He is only five.", "options": ["giant", "present", "key", "alone"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) alone\n【單字】alone (adj.)：獨自的；單獨的\n【中譯】不要讓那個小男孩獨自待在家，他才五歲。", "explanationSource": "supplemental"}, {"id": 112, "question": "The workers will ______ next week if they don't get more money.", "options": ["row", "bow", "surf", "strike"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) strike\n【單字】strike (v.)：（v.）罷工\n【中譯】如果工人們沒有拿到更多錢，他們下週就會罷工。", "explanationSource": "supplemental"}, {"id": 113, "question": "We finished dinner, and Dad asked the waiter for the ______.", "options": ["rock", "cover", "check", "match"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) check\n【單字】check (n.)：帳單；買單\n【中譯】我們吃完晚餐，爸爸請服務生拿帳單來（買單）。", "explanationSource": "supplemental"}, {"id": 114, "question": "With one ______ of the mouse, you can buy the shoes online.", "options": ["beat", "click", "cry", "drop"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) click\n【單字】click (n.)：點擊聲；點擊動作\n【中譯】只要點擊一下滑鼠，你就可以在網路上買到這雙鞋。", "explanationSource": "supplemental"}, {"id": 115, "question": "Our cat eats too much and sleeps all day. Now he's very ______.", "options": ["magic", "fat", "blank", "early"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) fat\n【單字】fat (adj.)：胖的\n【中譯】我們的貓吃太多又整天睡覺，現在牠非常胖。", "explanationSource": "supplemental"}, {"id": 116, "question": "The sky is ______ today. There isn't a cloud in it.", "options": ["late", "mean", "cross", "clear"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) clear\n【單字】clear (adj.)：晴朗的\n【中譯】今天天空很晴朗，一朵雲都沒有。", "explanationSource": "supplemental"}, {"id": 117, "question": "The ______ of this cup is broken, so it's hard to hold.", "options": ["nose", "bill", "handle", "pound"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) handle\n【單字】handle (n.)：把手\n【中譯】這個杯子的把手壞了，所以很難拿。", "explanationSource": "supplemental"}, {"id": 118, "question": "My ______ job is to be a pilot. I've wanted it since I was little.", "options": ["dream", "cross", "blank", "giant"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) dream\n【單字】dream (adj.)：理想的、夢想的\n【中譯】我的夢想工作是當飛行員，我從小就想當。", "explanationSource": "supplemental"}, {"id": 119, "question": "On a sunny day, the sky is ______ and the clouds are white.", "options": ["brown", "black", "red", "blue"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) blue\n【單字】blue (adj.)：藍色的\n【中譯】在晴朗的日子裡，天空是藍色的，雲是白色的。", "explanationSource": "supplemental"}, {"id": 120, "question": "The road is ______, so it's easy to ride a bike on it.", "options": ["mean", "even", "far", "late"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) even\n【單字】even (adj.)：平的；平均的\n【中譯】這條路很平，所以在上面騎腳踏車很容易。", "explanationSource": "supplemental"}, {"id": 121, "question": "This cup is dirty. Please give me ______ cup.", "options": ["most", "another", "both", "many"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) another\n【單字】another (adj.)：另一（個）的\n【中譯】這個杯子髒了，請給我另一個杯子。", "explanationSource": "supplemental"}, {"id": 122, "question": "I can't sleep because of the summer ______. Please turn on the fan.", "options": ["rock", "snow", "toast", "heat"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) heat\n【單字】heat (n.)：熱\n【中譯】因為夏天的炎熱我睡不著，請打開電風扇。", "explanationSource": "supplemental"}, {"id": 123, "question": "Our school team needs one more ______ for the soccer game tomorrow.", "options": ["player", "patient", "host", "honey"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) player\n【單字】player (n.)：運動員\n【中譯】我們校隊明天的足球比賽還需要一名球員。", "explanationSource": "supplemental"}, {"id": 124, "question": "My uncle is a ______ at a famous restaurant. His fried rice is the best.", "options": ["player", "model", "cook", "guide"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) cook\n【單字】cook (n.)：廚師\n【中譯】我叔叔是一家有名餐廳的廚師，他的炒飯是最好吃的。", "explanationSource": "supplemental"}, {"id": 125, "question": "In cartoons, pigs are usually ______.", "options": ["black", "pink", "blue", "green"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) pink\n【單字】pink (adj.)：粉紅色的\n【中譯】在卡通裡，豬通常是粉紅色的。", "explanationSource": "supplemental"}, {"id": 126, "question": "Dad bought me a ______ of colored pencils. There are 24 different colors in it.", "options": ["set", "drop", "yard", "quarter"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) set\n【單字】set (n.)：套；副\n【中譯】爸爸買了一套色鉛筆給我，裡面有24種不同的顏色。", "explanationSource": "supplemental"}, {"id": 127, "question": "The temperature will ______ to 35°C this afternoon. It'll be very hot.", "options": ["fail", "rise", "hunt", "cheat"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) rise\n【單字】rise (v.)：提高\n【中譯】今天下午氣溫會提高到攝氏35度，會非常熱。", "explanationSource": "supplemental"}, {"id": 128, "question": "I'm not ______ today. I have a headache, so I can't go to school.", "options": ["fat", "magic", "mean", "well"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) well\n【單字】well (adj.)：身體健康的\n【中譯】我今天身體不舒服（不健康），我頭痛，所以不能去上學。", "explanationSource": "supplemental"}, {"id": 129, "question": "I have a math test ______, so I need to study tonight.", "options": ["far", "fast", "tomorrow", "yesterday"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) tomorrow\n【單字】tomorrow (adv.)：明天\n【中譯】我明天有數學考試，所以今晚需要讀書。", "explanationSource": "supplemental"}, {"id": 130, "question": "You can take ______ book you like from this shelf.", "options": ["any", "both", "half", "many"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) any\n【單字】any (adj.)：任何的\n【中譯】你可以從這個書架上拿任何一本你喜歡的書。", "explanationSource": "supplemental"}, {"id": 131, "question": "Tom sits in the first ______ in class, right in front of the teacher.", "options": ["model", "row", "pot", "grade"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) row\n【單字】row (n.)：排；列\n【中譯】湯姆在班上坐第一排，就在老師正前方。", "explanationSource": "supplemental"}, {"id": 132, "question": "Dad's black ______ has a jacket and pants. He wears it with a tie to work every day.", "options": ["dress", "seal", "suit", "lead"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) suit\n【單字】suit (n.)：西裝\n【中譯】爸爸的黑色西裝有外套和褲子，他每天搭配領帶穿去上班。", "explanationSource": "supplemental"}, {"id": 133, "question": "Visiting Japan was a great ______. I learned a lot there.", "options": ["bill", "experience", "cut", "mop"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) experience\n【單字】experience (n.)：經驗\n【中譯】去日本玩是很棒的經驗，我在那裡學到很多。", "explanationSource": "supplemental"}, {"id": 134, "question": "This candy has a strange ______. It's both sweet and salty.", "options": ["fear", "cry", "taste", "shock"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) taste\n【單字】taste (n.)：味道\n【中譯】這顆糖果有種奇怪的味道，又甜又鹹。", "explanationSource": "supplemental"}, {"id": 135, "question": "The sunset over the sea was a beautiful ______.", "options": ["trick", "sight", "rule", "sentence"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) sight\n【單字】sight (n.)：景象\n【中譯】海上的夕陽是一幅美麗的景象。", "explanationSource": "supplemental"}, {"id": 136, "question": "Chocolate ice cream is ______, and vanilla ice cream is white.", "options": ["brown", "purple", "green", "blue"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) brown\n【單字】brown (adj.)：棕色的\n【中譯】巧克力冰淇淋是棕色的，香草冰淇淋是白色的。", "explanationSource": "supplemental"}, {"id": 137, "question": "When you mix black and white paint, you get ______ paint.", "options": ["yellow", "red", "gray", "orange"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) gray\n【單字】gray (adj.)：灰色的\n【中譯】當你把黑色和白色的顏料混在一起，你會得到灰色的顏料。", "explanationSource": "supplemental"}, {"id": 138, "question": "The ______ on the school gate says, \"No dogs in the school.\"", "options": ["dream", "plant", "notice", "smile"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) notice\n【單字】notice (n.)：告示\n【中譯】校門上的告示寫著：「學校內禁止帶狗。」", "explanationSource": "supplemental"}, {"id": 139, "question": "Grandma always has a big ______ on her face when she sees us.", "options": ["smile", "cut", "mop", "rock"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) smile\n【單字】smile (n.)：微笑\n【中譯】奶奶看到我們時，臉上總是帶著大大的微笑。", "explanationSource": "supplemental"}, {"id": 140, "question": "I read a good ______ of the movie online, so I want to see it.", "options": ["dip", "review", "wish", "shock"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) review\n【單字】review (n.)：評論；回顧\n【中譯】我在網路上讀到這部電影的好評，所以我想去看。", "explanationSource": "supplemental"}, {"id": 141, "question": "Mom used a ______ to put the flower on her dress.", "options": ["key", "pin", "bill", "mop"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) pin\n【單字】pin (n.)：別針\n【中譯】媽媽用一根別針把花別在她的洋裝上。", "explanationSource": "supplemental"}, {"id": 142, "question": "After the cold winter, flowers come out in ______.", "options": ["block", "spring", "fall", "class"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) spring\n【單字】spring (n.)：春天\n【中譯】寒冷的冬天過後，花朵在春天開放。", "explanationSource": "supplemental"}, {"id": 143, "question": "The ______ in our class often hits smaller kids and takes their lunch money.", "options": ["bully", "cook", "guide", "patient"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) bully\n【單字】bully (n.)：惡霸；霸凌者\n【中譯】我們班上的那個惡霸常常打比較小的孩子，還拿走他們的午餐錢。", "explanationSource": "supplemental"}, {"id": 144, "question": "Amy drew a ______ of her cat with colored pencils.", "options": ["wish", "excuse", "bet", "picture"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) picture\n【單字】picture (n.)：圖畫\n【中譯】艾咪用色鉛筆畫了一幅她的貓的圖畫。", "explanationSource": "supplemental"}, {"id": 145, "question": "The boy threw a ______ into the river, and it went down to the bottom.", "options": ["type", "smile", "mind", "rock"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) rock\n【單字】rock (n.)：石塊；岩石\n【中譯】那個男孩把一顆石頭丟進河裡，它沉到了河底。", "explanationSource": "supplemental"}, {"id": 146, "question": "Mom was very ______ because I broke her favorite cup again.", "options": ["open", "cross", "correct", "far"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) cross\n【單字】cross (adj.)：生氣的\n【中譯】媽媽很生氣，因為我又打破了她最喜歡的杯子。", "explanationSource": "supplemental"}, {"id": 147, "question": "Do you ______ the answer to this question?", "options": ["dip", "smoke", "mop", "know"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) know\n【單字】know (v.)：知道\n【中譯】你知道這個問題的答案嗎？", "explanationSource": "supplemental"}, {"id": 148, "question": "Don't be a ______! You can't put your hand into the fire!", "options": ["pin", "copy", "plant", "fool"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) fool\n【單字】fool (n.)：傻瓜\n【中譯】別當傻瓜！你不能把手伸進火裡！", "explanationSource": "supplemental"}, {"id": 149, "question": "Please wait here ______ your mom comes to get you.", "options": ["after", "until", "or", "since"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) until\n【單字】until (conj.)：直到\n【中譯】請在這裡等，直到你媽媽來接你。", "explanationSource": "supplemental"}, {"id": 150, "question": "Dad cleaned the wet floor with a ______.", "options": ["mop", "bill", "pin", "dip"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) mop\n【單字】mop (n.)：拖把\n【中譯】爸爸用拖把把濕的地板清乾淨。", "explanationSource": "supplemental"}, {"id": 151, "question": "The new library is ______ from 9 a.m. to 8 p.m. every day.", "options": ["cross", "brown", "correct", "open"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) open\n【單字】open (adj.)：開放的\n【中譯】新的圖書館每天早上九點到晚上八點開放。", "explanationSource": "supplemental"}, {"id": 152, "question": "Jack has lived in Taipei ______ he was five years old.", "options": ["since", "before", "until", "or"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) since\n【單字】since (conj.)：自從…以來\n【中譯】傑克從五歲起就一直住在台北。", "explanationSource": "supplemental"}, {"id": 153, "question": "There are ______ thirty students in my class, maybe twenty-nine or thirty-one.", "options": ["still", "about", "just", "over"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) about\n【單字】about (adv.)：大約\n【中譯】我們班上大約有三十個學生，可能是二十九或三十一個。", "explanationSource": "supplemental"}, {"id": 154, "question": "Our team played badly, so we ______ the game 2 to 5.", "options": ["lost", "mopped", "crossed", "planted"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) lost\n【單字】lose (v.)：輸\n【中譯】我們隊打得很差，所以我們以二比五輸了比賽。", "explanationSource": "supplemental"}, {"id": 155, "question": "Sleep is ______ to good health. You can't be healthy without it.", "options": ["cross", "key", "far", "brown"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) key\n【單字】key (adj.)：關鍵的\n【中譯】睡眠是健康的關鍵。沒有它你就無法健康。", "explanationSource": "supplemental"}, {"id": 156, "question": "I made a ______ with Tom: if I lose the race, I will buy him lunch.", "options": ["bet", "rock", "pin", "dip"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) bet\n【單字】bet (n.)：打賭；賭注\n【中譯】我和湯姆打了個賭：如果我賽跑輸了，我就請他吃午餐。", "explanationSource": "supplemental"}, {"id": 157, "question": "After dinner, Dad asked the waiter for the ______ and paid for the meal.", "options": ["rock", "block", "bill", "race"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) bill\n【單字】bill (n.)：帳單\n【中譯】晚餐後，爸爸向服務生要帳單並付了餐費。", "explanationSource": "supplemental"}, {"id": 158, "question": "Reading books is good for your ______; it helps you think better.", "options": ["bill", "mind", "stop", "rock"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) mind\n【單字】mind (n.)：心智\n【中譯】讀書對你的心智有益；它幫助你思考得更好。", "explanationSource": "supplemental"}, {"id": 159, "question": "Close your eyes and make a ______ before you blow out the candles.", "options": ["pipe", "mop", "wish", "block"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) wish\n【單字】wish (n.)：願望\n【中譯】在你吹熄蠟燭之前，閉上眼睛許個願望。", "explanationSource": "supplemental"}, {"id": 160, "question": "I have two brothers, and ______ brothers are taller than me.", "options": ["all", "most", "both", "many"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) both\n【單字】both (adj.)：兩者的\n【中譯】我有兩個哥哥，兩個哥哥都比我高。", "explanationSource": "supplemental"}, {"id": 161, "question": "The news of the big earthquake was a ______ to everyone.", "options": ["shock", "plant", "type", "pin"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) shock\n【單字】shock (n.)：震驚；驚訝\n【中譯】大地震的消息讓每個人都很震驚。", "explanationSource": "supplemental"}, {"id": 162, "question": "There is black ______ coming out of the kitchen. Is something burning?", "options": ["rain", "smoke", "salt", "rock"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) smoke\n【單字】smoke (n.)：煙\n【中譯】有黑煙從廚房冒出來。是有東西燒焦了嗎？", "explanationSource": "supplemental"}, {"id": 163, "question": "I waited for the bus for ______ an hour. That's thirty minutes!", "options": ["about", "half", "just", "over"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) half\n【單字】half (adj.)：一半的\n【中譯】我等公車等了半小時。那可是三十分鐘！", "explanationSource": "supplemental"}, {"id": 164, "question": "Get off the bus at the next ______; the museum is right there.", "options": ["bet", "mind", "stop", "mop"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) stop\n【單字】stop (n.)：車站\n【中譯】在下一站下公車；博物館就在那裡。", "explanationSource": "supplemental"}, {"id": 165, "question": "Tina ran very fast and won the 100-meter ______.", "options": ["pipe", "dip", "bill", "race"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) race\n【單字】race (n.)：競賽\n【中譯】蒂娜跑得非常快，贏得了一百公尺賽跑比賽。", "explanationSource": "supplemental"}, {"id": 166, "question": "The station is too ______ to walk to. Let's take a bus.", "options": ["correct", "far", "key", "brown"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) far\n【單字】far (adj.)：遠的\n【中譯】車站太遠了，走不到。我們搭公車吧。", "explanationSource": "supplemental"}, {"id": 167, "question": "There isn't a ______ of water in the bottle. It's empty.", "options": ["bet", "pin", "drop", "block"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) drop\n【單字】drop (n.)：滴\n【中譯】瓶子裡一滴水也沒有。它是空的。", "explanationSource": "supplemental"}, {"id": 168, "question": "What ______ of music do you like? I like pop music.", "options": ["wish", "bill", "type", "stop"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) type\n【單字】type (n.)：類型\n【中譯】你喜歡哪一種類型的音樂？我喜歡流行音樂。", "explanationSource": "supplemental"}, {"id": 169, "question": "The teacher made thirty ______ of the test, one for each student.", "options": ["races", "rocks", "wishes", "copies"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) copies\n【單字】copy (n.)：拷貝；副本\n【中譯】老師把考卷印了三十份，每個學生一份。", "explanationSource": "supplemental"}, {"id": 170, "question": "Your answer is ______. You get ten points!", "options": ["correct", "gray", "cross", "far"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) correct\n【單字】correct (adj.)：正確的\n【中譯】你的答案是正確的。你得到十分！", "explanationSource": "supplemental"}, {"id": 171, "question": "Jeremy is the ______ player on our basketball team; he gets the most points in every game.", "options": ["cross", "gray", "open", "star"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) star\n【單字】star (adj.)：傑出的；明星級的\n【中譯】傑瑞米是我們籃球隊的明星球員；他每場比賽都得最多分。", "explanationSource": "supplemental"}, {"id": 172, "question": "Don't forget to water the ______ by the window, or they will die.", "options": ["bills", "rocks", "plants", "pins"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) plants\n【單字】plant (n.)：植物\n【中譯】別忘了給窗邊的植物澆水，不然它們會死掉。", "explanationSource": "supplemental"}, {"id": 173, "question": "The bookstore is two ______ away from my house, so I can walk there in five minutes.", "options": ["minds", "blocks", "drops", "wishes"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) blocks\n【單字】block (n.)：街區\n【中譯】書店離我家兩個街區遠，所以我五分鐘就能走到那裡。", "explanationSource": "supplemental"}, {"id": 174, "question": "Ben didn't do his homework, and his ______ was \"My dog ate it.\"", "options": ["stop", "mop", "bill", "excuse"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) excuse\n【單字】excuse (n.)：藉口\n【中譯】班沒有寫作業，而他的藉口是「我的狗把它吃掉了。」", "explanationSource": "supplemental"}, {"id": 175, "question": "Mr. Lee is always kind ______ his students.", "options": ["through", "until", "to", "since"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) to\n【單字】to (prep.)：對\n【中譯】李老師對他的學生總是很親切。", "explanationSource": "supplemental"}, {"id": 176, "question": "Please stand ______ and don't move while I take your picture.", "options": ["key", "brown", "cross", "still"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) still\n【單字】still (adj.)：靜止的\n【中譯】我幫你拍照時，請站著別動。", "explanationSource": "supplemental"}, {"id": 177, "question": "My aunt exercises every day, so she has a nice ______.", "options": ["drop", "bill", "notice", "figure"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) figure\n【單字】figure (n.)：（n.）身材\n【中譯】我阿姨每天運動，所以她身材很好。", "explanationSource": "supplemental"}, {"id": 178, "question": "Grandpa likes to smoke a ______ after dinner.", "options": ["pipe", "pin", "mop", "rock"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) pipe\n【單字】pipe (n.)：菸斗\n【中譯】爺爺喜歡在晚餐後抽菸斗。", "explanationSource": "supplemental"}, {"id": 179, "question": "In Taiwan, children start elementary school at the ______ of six.", "options": ["age", "stop", "block", "bill"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) age\n【單字】age (n.)：年齡\n【中譯】在台灣，孩子在六歲的年齡開始上小學。", "explanationSource": "supplemental"}, {"id": 180, "question": "We ate the chips with a cheese ______.", "options": ["dip", "rock", "pin", "mop"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) dip\n【單字】dip (n.)：沾醬\n【中譯】我們用起司沾醬配洋芋片吃。", "explanationSource": "supplemental"}, {"id": 181, "question": "Mom washed my white shirt, so it is ______ now.", "options": ["clean", "patient", "early", "slow"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) clean\n【單字】clean (adj.)：乾淨的\n【中譯】媽媽洗了我的白襯衫，所以它現在是乾淨的。", "explanationSource": "supplemental"}, {"id": 182, "question": "We watched a magic ______ at the night market last night.", "options": ["nail", "show", "bill", "pipe"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) show\n【單字】show (n.)：表演\n【中譯】我們昨晚在夜市看了一場魔術表演。", "explanationSource": "supplemental"}, {"id": 183, "question": "My brother and I don't share a bedroom; I have my ______ room.", "options": ["patient", "born", "mean", "own"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) own\n【單字】own (adj.)：自己的\n【中譯】我和哥哥沒有共用臥室；我有自己的房間。", "explanationSource": "supplemental"}, {"id": 184, "question": "Tom has a great ______ in baseball, and he watches every game on TV.", "options": ["block", "seal", "excuse", "interest"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) interest\n【單字】interest (n.)：興趣\n【中譯】湯姆對棒球很有興趣，他在電視上看每一場比賽。", "explanationSource": "supplemental"}, {"id": 185, "question": "My sister is wearing a suit because she has a job ______ this afternoon.", "options": ["comb", "interview", "yard", "bat"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) interview\n【單字】interview (n.)：面試\n【中譯】我姊姊穿著西裝，因為她今天下午有一場工作面試。", "explanationSource": "supplemental"}, {"id": 186, "question": "Dad gave Mom a red ______, and she put the flower in water.", "options": ["pipe", "mop", "rose", "bat"], "answer": 2, "answerLabel": "C", "source": "一字多 220, "question": "The ______ of the trip to Japan is about 30,000 dollars.", "options": ["rule", "smell", "cost", "nose"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) cost\n【單字】cost (n.)：成本；費用\n【中譯】去日本旅行的費用大約三萬元。", "explanationSource": "supplemental"}, {"id": 221, "question": "Only Tom came to school by bike; all the ______ students took the bus.", "options": ["other", "another", "each", "both"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) other\n【單字】other (adj.)：其他的\n【中譯】只有湯姆騎腳踏車上學；其他所有的學生都搭公車。", "explanationSource": "supplemental"}, {"id": 222, "question": "On April Fools' Day, my brother played a ______ on me.", "options": ["fan", "wish", "bill", "trick"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) trick\n【單字】trick (n.)：惡作劇\n【中譯】在愚人節那天，我哥哥對我惡作劇。", "explanationSource": "supplemental"}, {"id": 223, "question": "My favorite TV ______ is on at eight o'clock every Friday.", "options": ["comb", "program", "table", "pipe"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) program\n【單字】program (n.)：節目\n【中譯】我最喜歡的電視節目每週五晚上八點播出。", "explanationSource": "supplemental"}, {"id": 224, "question": "My uncle ______ a big house with a beautiful garden.", "options": ["swings", "drops", "cuts", "has"], "answer": 3, "answerLabel": "D", "source": "一字多義 Polysemy", "explanation": "【答案】(D) has\n【單字】have (v.)：擁有\n【中譯】我叔叔擁有一棟有漂亮花園的大房子。", "explanationSource": "supplemental"}, {"id": 225, "question": "I ate only a small ______ of the cake because I was full.", "options": ["rule", "part", "nose", "fear"], "answer": 1, "answerLabel": "B", "source": "一字多義 Polysemy", "explanation": "【答案】(B) part\n【單字】part (n.)：部分\n【中譯】因為我吃飽了，所以我只吃了蛋糕的一小部分。", "explanationSource": "supplemental"}, {"id": 226, "question": "The phone rang ______ I was taking a shower.", "options": ["as", "so", "until", "or"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) as\n【單字】as (conj.)：當⋯時\n【中譯】當我在淋浴時，電話響了。", "explanationSource": "supplemental"}, {"id": 227, "question": "The book was 80 dollars. I paid with 100 dollars, so the clerk gave me 20 dollars in ______.", "options": ["interest", "tip", "change", "cost"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) change\n【單字】change (n.)：零錢\n【中譯】這本書八十元。我付了一百元，所以店員找我二十元零錢。", "explanationSource": "supplemental"}, {"id": 228, "question": "I'm thirsty. Can I have a cold ______, please?", "options": ["drink", "ticket", "watch", "comb"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) drink\n【單字】drink (n.)：飲料\n【中譯】我口渴了。請給我一杯冷飲好嗎？", "explanationSource": "supplemental"}, {"id": 229, "question": "My father works very hard, so his boss gave him a ______ this year. Now he makes more money.", "options": ["raise", "break", "lesson", "bill"], "answer": 0, "answerLabel": "A", "source": "一字多義 Polysemy", "explanation": "【答案】(A) raise\n【單字】raise (n.)：加薪\n【中譯】我爸爸工作很努力，所以他的老闆今年幫他加薪。現在他賺更多錢了。", "explanationSource": "supplemental"}, {"id": 230, "question": "The waves are big today, so my brother is going to ______ at the beach.", "options": ["cheat", "mop", "surf", "type"], "answer": 2, "answerLabel": "C", "source": "一字多義 Polysemy", "explanation": "【答案】(C) surf\n【單字】surf (v.)：衝浪\n【中譯】今天浪很大，所以我哥哥要去海邊衝浪。", "explanationSource": "supplemental"}]};</script><script>window.LEARN_DATA=[{"g": "", "t": "about", "p": "(adv.)", "e": "a little more or less than; almost", "z": "大約", "s": "It takes _____ twenty minutes to walk from my home to school, so I usually leave at seven in the morning.", "c": "從我家走路到學校【大約】要二十分鐘，所以我通常早上七點出門。", "f": "It takes about twenty minutes to walk from my home to school, so I usually leave at seven in the morning."}, {"g": "", "t": "about", "p": "(prep.)", "e": "on the subject of", "z": "關於", "s": "Our English teacher told us a funny story _____ her first trip to London, and the whole class laughed.", "c": "我們英文老師告訴我們一個【關於】她第一次去倫敦旅行的有趣故事，全班都笑了。", "f": "Our English teacher told us a funny story about her first trip to London, and the whole class laughed."}, {"g": "", "t": "act", "p": "(n.)", "e": "a thing that someone does", "z": "行為", "s": "Helping the old man cross the street was a kind _____, and the principal praised Leo in front of the school.", "c": "扶那位老先生過馬路是一個善良的【行為】，校長在全校面前稱讚了 Leo。", "f": "Helping the old man cross the street was a kind act, and the principal praised Leo in front of the school."}, {"g": "", "t": "act", "p": "(v.)", "e": "to do something; to take action", "z": "行動", "s": "When the fire started in the kitchen, Mom _____ quickly and turned off the gas before calling 119.", "c": "廚房起火時，媽媽迅速【行動】，先關掉瓦斯再打119。", "f": "When the fire started in the kitchen, Mom acted quickly and turned off the gas before calling 119."}, {"g": "", "t": "act", "p": "(v.)", "e": "to play a part in a play or movie", "z": "演戲", "s": "Yu-ting loves to _____ in school plays, and this year she will be the queen in our English drama show.", "c": "雨婷很喜歡在學校話劇中【演戲】，今年她將在我們的英語話劇表演中飾演皇后。", "f": "Yu-ting loves to act in school plays, and this year she will be the queen in our English drama show."}, {"g": "", "t": "act", "p": "(v.)", "e": "to behave in a certain way", "z": "表現；舉止", "s": "When the teacher left the room, Jason began to _____ like a little child, so the class leader told him to sit down.", "c": "老師離開教室時，Jason 開始【表現】得像個小孩子，所以班長叫他坐下。", "f": "When the teacher left the room, Jason began to act like a little child, so the class leader told him to sit down."}, {"g": "", "t": "after", "p": "(conj.)", "e": "later than the time when", "z": "在…之後", "s": "_____ Mia finished her homework, she helped her dad wash the dishes and then watched TV with him.", "c": "米亞寫完功課【之後】，幫爸爸洗碗，然後和他一起看電視。", "f": "After Mia finished her homework, she helped her dad wash the dishes and then watched TV with him."}, {"g": "", "t": "after", "p": "(prep.)", "e": "later than something", "z": "在…之後", "s": "We usually play basketball in the park _____ school, but today we went home because it was raining.", "c": "我們通常在放學【之後】去公園打籃球，但今天下雨，所以我們就回家了。", "f": "We usually play basketball in the park after school, but today we went home because it was raining."}, {"g": "", "t": "age", "p": "(n.)", "e": "how old someone is", "z": "年齡", "s": "My grandfather is eighty years old, but he still rides his bike every morning because he says _____ is just a number.", "c": "我爺爺八十歲了，但他每天早上還是騎腳踏車，因為他說【年齡】只是個數字。", "f": "My grandfather is eighty years old, but he still rides his bike every morning because he says age is just a number."}, {"g": "", "t": "age", "p": "(v.)", "e": "to become older", "z": "變老", "s": "My dog has started to _____ quickly in the past two years, so he sleeps a lot and walks more slowly now.", "c": "我的狗過去兩年很快地【變老】了，所以牠現在常常睡覺，走路也比較慢。", "f": "My dog has started to age quickly in the past two years, so he sleeps a lot and walks more slowly now."}, {"g": "", "t": "all", "p": "(adj.)", "e": "the whole of; every one of", "z": "全部的", "s": "_____ the students in my class passed the test because the teacher gave us extra lessons after school.", "c": "我們班【所有的】學生都通過了考試，因為老師放學後幫我們額外上課。", "f": "All the students in my class passed the test because the teacher gave us extra lessons after school."}, {"g": "", "t": "all", "p": "(adv.)", "e": "completely", "z": "全部地；完全", "s": "When Grandma came back from the market, she was _____ wet because she forgot her umbrella.", "c": "奶奶從市場回來時【全】身濕透了，因為她忘了帶雨傘。", "f": "When Grandma came back from the market, she was all wet because she forgot her umbrella."}, {"g": "", "t": "all", "p": "(pron.)", "e": "everyone or everything", "z": "全部", "s": "I bought some cookies for the party, but my little brother ate _____ of them before the guests arrived.", "c": "我為派對買了一些餅乾，但我弟弟在客人到之前就把它們【全部】吃光了。", "f": "I bought some cookies for the party, but my little brother ate all of them before the guests arrived."}, {"g": "", "t": "alone", "p": "(adj.)", "e": "without other people", "z": "獨自的；單獨的", "s": "When Jenny was _____ at home on a stormy night, she felt scared, so she called her best friend for a long chat.", "c": "Jenny 在一個暴風雨的夜晚【獨自】在家時，她感到害怕，所以打電話給她最好的朋友聊了很久。", "f": "When Jenny was alone at home on a stormy night, she felt scared, so she called her best friend for a long chat."}, {"g": "", "t": "alone", "p": "(adv.)", "e": "only; just this one thing", "z": "光是；僅僅", "s": "The shoes _____ cost three thousand dollars, so Mom said we could not buy the jacket and the hat too.", "c": "【光是】那雙鞋就要三千元，所以媽媽說我們不能再買外套和帽子了。", "f": "The shoes alone cost three thousand dollars, so Mom said we could not buy the jacket and the hat too."}, {"g": "", "t": "American", "p": "(adj.)", "e": "from or about the USA", "z": "美國的", "s": "My brother loves _____ football, so he watches the games on TV every Monday morning before school.", "c": "我哥哥很愛【美國】足球，所以他每個星期一上學前都會看電視轉播比賽。", "f": "My brother loves American football, so he watches the games on TV every Monday morning before school."}, {"g": "", "t": "American", "p": "(n.)", "e": "a person from the USA", "z": "美國人", "s": "Our new English teacher is an _____ from New York, and she loves bubble tea and stinky tofu.", "c": "我們的新英文老師是一位來自紐約的【美國人】，她很愛珍珠奶茶和臭豆腐。", "f": "Our new English teacher is an American from New York, and she loves bubble tea and stinky tofu."}, {"g": "", "t": "another", "p": "(adj.)", "e": "one more; a different one", "z": "另一（個）的", "s": "The shirt was too small for me, so the clerk brought me _____ size, and it fit perfectly.", "c": "那件襯衫我穿太小了，所以店員拿了【另一個】尺寸給我，結果非常合身。", "f": "The shirt was too small for me, so the clerk brought me another size, and it fit perfectly."}, {"g": "", "t": "another", "p": "(pron.)", "e": "one more of the same kind", "z": "另一（個）", "s": "This cupcake is so delicious that I want to have _____, but Mom says one is enough before dinner.", "c": "這個杯子蛋糕太好吃了，我想再吃【另一個】，但媽媽說晚餐前吃一個就夠了。", "f": "This cupcake is so delicious that I want to have another, but Mom says one is enough before dinner."}, {"g": "", "t": "answer", "p": "(n.)", "e": "what you say or write back to a question", "z": "答案", "s": "Peter wrote the wrong _____ on the math test because he did not read the question carefully.", "c": "彼得在數學考試上寫錯了【答案】，因為他沒有仔細看題目。", "f": "Peter wrote the wrong answer on the math test because he did not read the question carefully."}, {"g": "", "t": "answer", "p": "(v.)", "e": "to say or write something back to a question", "z": "回答", "s": "When the teacher asked who broke the window, nobody wanted to _____ because everyone was afraid.", "c": "老師問誰打破窗戶時，沒有人想【回答】，因為大家都很害怕。", "f": "When the teacher asked who broke the window, nobody wanted to answer because everyone was afraid."}, {"g": "", "t": "any", "p": "(adj.)", "e": "some, it doesn't matter which or how much", "z": "任何的", "s": "Do you have _____ questions about the homework? If you do, you can ask me after class today.", "c": "你對作業有【任何】問題嗎？如果有的話，你今天下課後可以問我。", "f": "Do you have any questions about the homework? If you do, you can ask me after class today."}, {"g": "", "t": "any", "p": "(pron.)", "e": "one or some of a thing", "z": "任何（一個）", "s": "I wanted to buy some milk on the way home, but the store didn't have _____ left, so I bought juice.", "c": "我想在回家路上買些牛奶，但那家店一瓶都沒有了（沒有【任何】剩下的），所以我買了果汁。", "f": "I wanted to buy some milk on the way home, but the store didn't have any left, so I bought juice."}, {"g": "", "t": "around", "p": "(adv.)", "e": "about; not exactly", "z": "大約", "s": "The movie starts at _____ seven o'clock, so let's eat dinner first and meet at the theater later.", "c": "電影【大約】七點開始，所以我們先吃晚餐，晚點在電影院碰面吧。", "f": "The movie starts at around seven o'clock, so let's eat dinner first and meet at the theater later."}, {"g": "", "t": "around", "p": "(adv.)", "e": "in many places; here and there", "z": "到處", "s": "Ben lost his house key at school, so he walked _____ for an hour, but he could not find it.", "c": "班在學校弄丟了家裡鑰匙，所以他【到處】走了一個小時，但還是找不到。", "f": "Ben lost his house key at school, so he walked around for an hour, but he could not find it."}, {"g": "", "t": "around", "p": "(prep.)", "e": "on every side of something", "z": "在…周圍", "s": "The students sat _____ the campfire and sang songs together while their teacher told funny stories.", "c": "學生們坐在營火【周圍】一起唱歌，而老師則講著有趣的故事。", "f": "The students sat around the campfire and sang songs together while their teacher told funny stories."}, {"g": "", "t": "as", "p": "(conj.)", "e": "when; at the same time that", "z": "當⋯時", "s": "_____ I was walking home from the bus stop, it suddenly started to rain, so I ran into a convenience store.", "c": "我從公車站走回家【的時候】，突然開始下雨，所以我跑進一家便利商店。", "f": "As I was walking home from the bus stop, it suddenly started to rain, so I ran into a convenience store."}, {"g": "", "t": "as", "p": "(conj.)", "e": "in the same way that; just like", "z": "依照；就如同", "s": "Please fold the paper _____ I showed you, and then your paper airplane will fly farther than everyone else's.", "c": "請【依照】我示範給你看的方式摺紙，這樣你的紙飛機就會飛得比其他人的更遠。", "f": "Please fold the paper as I showed you, and then your paper airplane will fly farther than everyone else's."}, {"g": "", "t": "back", "p": "(adj.)", "e": "at the back of something", "z": "後面的", "s": "Grandpa always sits in the _____ seat of the car because he likes to sleep while Dad drives us to the beach.", "c": "爺爺總是坐在車子的【後】座，因為爸爸開車載我們去海邊時，他喜歡睡覺。", "f": "Grandpa always sits in the back seat of the car because he likes to sleep while Dad drives us to the beach."}, {"g": "", "t": "back", "p": "(adv.)", "e": "to the place where you were before", "z": "回原處", "s": "Please put the books _____ on the shelf after you finish reading, because other students need them too.", "c": "讀完之後請把書放【回】書架上，因為其他同學也需要用到。", "f": "Please put the books back on the shelf after you finish reading, because other students need them too."}, {"g": "", "t": "back", "p": "(n.)", "e": "the part of your body behind your chest", "z": "背部", "s": "My grandfather often t if I felt hungry or tired."}, {"g": "", "t": "bat", "p": "(n.)", "e": "a small animal that flies at night", "z": "蝙蝠", "s": "When we walked into the dark cave with our flashlights, a _____ flew over our heads and scared everyone.", "c": "當我們拿著手電筒走進黑暗的山洞時，一隻【蝙蝠】從我們頭上飛過，嚇到了大家。", "f": "When we walked into the dark cave with our flashlights, a bat flew over our heads and scared everyone."}, {"g": "", "t": "bat", "p": "(n.)", "e": "a stick used to hit the ball in baseball", "z": "球棒", "s": "Wang Wei bought a new _____ before the baseball game, and he hit a home run with it in the first inning.", "c": "王偉在棒球比賽前買了一支新【球棒】，而且他在第一局就用它擊出了全壘打。", "f": "Wang Wei bought a new bat before the baseball game, and he hit a home run with it in the first inning."}, {"g": "", "t": "beat", "p": "(n.)", "e": "the regular sound in music", "z": "節奏；拍子", "s": "When the music started, everyone at the party clapped their hands to the _____ and began to dance.", "c": "音樂一開始，派對上的每個人都跟著【節奏】拍手，然後開始跳舞。", "f": "When the music started, everyone at the party clapped their hands to the beat and began to dance."}, {"g": "", "t": "beat", "p": "(v.)", "e": "to win against someone in a game", "z": "打敗", "s": "Our school basketball team _____ the team from Taichung by ten points, so we had a party after the game.", "c": "我們學校的籃球隊以十分之差【打敗】了台中的隊伍，所以賽後我們開了慶祝派對。", "f": "Our school basketball team beat the team from Taichung by ten points, so we had a party after the game."}, {"g": "", "t": "before", "p": "(conj.)", "e": "earlier than the time when", "z": "在…之前", "s": "Remember to turn off the lights _____ you leave the classroom, or the teacher will be unhappy.", "c": "離開教室【之前】記得關燈，不然老師會不高興。", "f": "Remember to turn off the lights before you leave the classroom, or the teacher will be unhappy."}, {"g": "", "t": "before", "p": "(prep.)", "e": "earlier than something", "z": "在…之前", "s": "Please wash your hands _____ dinner, because you have been playing outside with the dog all afternoon.", "c": "晚餐【之前】請先洗手，因為你整個 .)", "e": "until now (in negatives/questions)", "z": "還（沒）", "s": "Mom asked if I had cleaned my room, but I haven't done it _____ because I was busy with my science project.", "c": "媽媽問我有沒有打掃房間，但我【還沒】做，因為我在忙我的自然科作業。", "f": "Mom asked if I had cleaned my room, but I haven't done it yet because I was busy with my science project."}, {"g": "", "t": "zip", "p": "(n.)", "e": "a metal or plastic thing that closes clothes or bags", "z": "拉鍊", "s": "The _____ on my backpack broke this morning, so my books almost fell out when I was running to school.", "c": "我背包的【拉鍊】今天早上壞了，所以我跑去學校時書差點掉出來。", "f": "The zip on my backpack broke this morning, so my books almost fell out when I was running to school."}, {"g": "", "t": "zip", "p": "(v.)", "e": "to close something with a zipper", "z": "拉上拉鍊", "s": "It was very cold and windy outside, so Mom told me to _____ up my jacket before I left the house.", "c": "外面又冷風又大，所以媽媽叫我出門前把外套的【拉鍊拉上】。", "f": "It was very cold and windy outside, so Mom told me to zip up my jacket before I left the house."}];</script><script src="longteng-b1u5-quiz.js?v=20261027-2"></script><script src="cap-vocab-learn.js?v=20261105-1"></script><script>document.querySelector("#description").textContent="先在「教學 Learn」看完 688 筆詞彙表，再到「測驗 Quiz」做 230 題四選一｜選答後顯示答案、用語中文與整句中譯｜答錯可重做並下載錯題";</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
