<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三民普高 B3U10｜引導式翻譯</title><style>
:root{--blue:#2563eb;--deep:#172554;--bg:#f4f7fb;--line:#d9e2ef;--ok:#15803d;--bad:#b91c1c;--violet:#6d28d9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font-family:Arial,"Microsoft JhengHei",sans-serif;line-height:1.7}main{max-width:1060px;margin:auto;padding:14px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 7px 24px #0f172a0c}.hero{background:linear-gradient(135deg,#eff6ff,#fff)}h1{margin:0;font-size:clamp(25px,4vw,38px)}h2,h3{margin:0 0 10px}.muted{color:#64748b}.hidden{display:none!important}.btn{border:0;border-radius:10px;padding:10px 15px;font:800 16px inherit;cursor:pointer;background:#e5e7eb;color:#172033;text-decoration:none}.primary{background:var(--blue);color:#fff}.voice{background:var(--violet);color:#fff}.danger{background:#991b1b;color:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;font-weight:800;color:#64748b;margin:9px 0}.prompt,.passage{font-size:18px;background:#f8fafc;border-radius:12px;padding:16px;white-space:pre-wrap}.passage{max-height:48vh;overflow:auto}.blank-now{background:#fef3c7;color:#92400e;padding:2px 7px;border-radius:6px;font-weight:900}.options{display:grid;gap:9px;margin:14px 0}.option{border:2px solid #cbd5e1;background:#fff;border-radius:11px;padding:12px 14px;text-align:left;font:700 16px inherit;cursor:pointer}.option:hover{border-color:var(--blue)}.option.wrong{border-color:#fecaca;background:#fff1f2}.option.correct{border-color:#86efac;background:#f0fdf4}.feedback,.reference{padding:13px;border-radius:10px;margin:12px 0;font-weight:800;white-space:pre-wrap}.feedback.ok{background:#ecfdf3;color:var(--ok)}.feedback.bad{background:#fff1f2;color:var(--bad)}.reference{border:2px solid #bbf7d0;background:#f0fdf4}.translation{white-space:pre-wrap;background:#f8fafc;padding:16px;border-radius:12px;font-size:18px}.inline-input{width:150px;max-width:100%;font:inherit;padding:7px 9px;border:2px solid #94a3b8;border-radius:8px;margin:3px}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:#f5f3ff;margin:12px 0}.voice-result{background:#fff;border:1px solid #ddd6fe;padding:10px;border-radius:9px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat,.wrong-card{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong-card{margin:10px 0;background:#fff7f7;border-color:#fecaca}@media(max-width:620px){main{padding:8px}.hero,.card{padding:15px}.meta{display:block}.prompt,.passage,.translation{font-size:16px}}
</style></head><body><main><section class="hero"><h1>三民普高 B3U10｜引導式翻譯</h1><p class="muted">原題互動練習｜32 題｜即時批改｜錯誤重填｜答對後整句播放＋選做 STT｜錯題 DOCX｜成績登錄</p><div class="actions"><a class="btn" href="dashboard.html">← 回 Dashboard</a></div></section><section id="quiz" class="card"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="reference" class="reference hidden"></div><div id="voiceBox" class="voicebox hidden"><h3>🎙️ Pronunciation Check（選做）</h3><p><b id="voiceTarget"></b></p><div class="actions"><button id="speak" class="btn voice">🔊 再聽一次</button><button id="mic" class="btn primary">🎤 開始朗讀評分</button></div><div id="voiceResult" class="voice-result">尚未進行朗讀評分。</div></div><div class="actions"><button id="check" class="btn primary hidden">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束本輪</button></div></section><section id="result" class="card hidden"><h2>練習結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="download" class="btn primary">下載錯題 DOCX</button><button id="restart" class="btn">重新練習</button></div></section></main><script>
const QUIZ={"unit":"B3U10","kind":"translation","title":"引導式翻譯","count":32,"data":[{"number":1,"prompt":"玉山比臺灣其他任何一座山都高。\nYushan _____________ _____________ _____________ _____________ _____________ _____________ in Taiwan.","answers":["is","taller","than","any","other","mountain"],"sentence":"Yushan is taller than any other mountain in Taiwan."},{"number":2,"prompt":"The trade imbalance between China and Great Britain since the 18th century had _____________ _____________ _____________ _____________ the First Opium War.\n自十八世紀起，中國與英國之間的貿易不平等就種下了第一次鴉片戰爭的種子。","answers":["sown","the","seeds","of"],"sentence":"The trade imbalance between China and Great Britain since the 18th century had sown the seeds of the First Opium War."},{"number":3,"prompt":"城市暴動的種子在警察與學生的衝突爆發時就已播下。\nThe _____________ of the unrest in city were _____________ when the quarrel between the police and the students _____________ _____________.","answers":["seeds","sowed","broke","out"],"sentence":"The seeds of the unrest in city were sowed when the quarrel between the police and the students broke out."},{"number":4,"prompt":"這位銷售員試圖說服我媽買一組新沙發。不過，她拒絕了。\nThe salesman tried to _____________ my mom to buy a new sofa. _____________, she rejected it.","answers":["persuade","Nevertheless"],"sentence":"The salesman tried to persuade my mom to buy a new sofa. Nevertheless, she rejected it."},{"number":5,"prompt":"為了預防非洲豬瘟在臺灣爆發，國際機場開始實行嚴格的行李檢驗程序。\nTo prevent the African swine fever (ASF) from _____________ _____________ in Taiwan, the international airports launched a serious luggage-screening process.","answers":["breaking","out"],"sentence":"To prevent the African swine fever (ASF) from breaking out in Taiwan, the international airports launched a serious luggage-screening process."},{"number":6,"prompt":"得知巴黎聖母院失火而且好幾個處燒毀時，每個人都感到震驚。\nEveryone was shocked upon hearing the news that Notre-Dame Cathedral was on fire and several parts of it had _____________ _____________.","answers":["burned","down"],"sentence":"Everyone was shocked upon hearing the news that Notre-Dame Cathedral was on fire and several parts of it had burned down."},{"number":7,"prompt":"Charlotte堅持要John承諾他會在星期五交出報告。\nCharlotte _____________ that John _____________ _____________ _____________ to hand the report in on Friday.","answers":["insisted","make","a","promise"],"sentence":"Charlotte insisted that John make a promise to hand the report in on Friday."},{"number":8,"prompt":"夜深人靜時，帕里斯將海倫從斯巴達國王身邊帶走，造成了特洛伊戰爭。\nIn the _____________ of _____________, Paris took Helen away from the king of Sparta, which caused the Trojan War.","answers":["dead","night"],"sentence":"In the dead of night, Paris took Helen away from the king of Sparta, which caused the Trojan War."},{"number":9,"prompt":"According to the news, a fight _____________ _____________ between two street gangs outside a KTV bar last night.\n根據新聞，昨晚在一家KTV外爆發兩個街頭幫派的拚鬥。","answers":["broke","out"],"sentence":"According to the news, a fight broke out between two street gangs outside a KTV bar last night."},{"number":10,"prompt":"土地的紛爭成為這兩國戰爭的肇端。\nThe dispute over the land _____________ _____________ _____________ of war between the two countries.","answers":["sowed","the","seeds"],"sentence":"The dispute over the land sowed the seeds of war between the two countries."},{"number":11,"prompt":"Tony's fiancee _____________ _____________ _____________ her first love the night before their wedding, and this came as a terrible blow to him.\nTony的未婚妻在他們婚禮前一晚和初戀情人私奔，這對他造成沉重的打擊。","answers":["ran","off","with"],"sentence":"Tony's fiancee ran off with her first love the night before their wedding, and this came as a terrible blow to him."},{"number":12,"prompt":"Daniel didn't know how to complete his history assignment, so he _____________ _____________ his elder sister for advice.\nDaniel不知道如何完成歷史作業，因此求助姐姐給他建議。","answers":["turned","to"],"sentence":"Daniel didn't know how to complete his history assignment, so he turned to his elder sister for advice."},{"number":13,"prompt":"國土的佔領種下了兩國間戰爭的種子。\nThe occupation of the land _____________ _____________ _____________ _____________ war between the two countries.","answers":["sowed","the","seeds","of"],"sentence":"The occupation of the land sowed the seeds of war between the two countries."},{"number":14,"prompt":"當Jay看到他的前女友和她的新男友在他剛踏進的餐廳裡用餐時，他立即轉身並隨即離去。\nWhen Jay saw his ex-girlfriend dining with her new boyfriend in the restaurant he had just entered, he turned around right away and _____________ _____________.","answers":["ran","off"],"sentence":"When Jay saw his ex-girlfriend dining with her new boyfriend in the restaurant he had just entered, he turned around right away and ran off."},{"number":15,"prompt":"教授要學生做關於老鼠行為的實驗。\nThe professor _____________ _____________ _____________ _____________ an experiment on rats' behavior.","answers":["had","the","students","do"],"sentence":"The professor had the students do an experiment on rats' behavior."},{"number":16,"prompt":"為了種下經濟成長的種子，政府決定降低貨物稅。\n_____________ _____________ _____________ _____________ _____________ economic growth, the government has decided to cut down on the taxes of goods.","answers":["To","sow","the","seeds","of"],"sentence":"To sow the seeds of economic growth, the government has decided to cut down on the taxes of goods."},{"number":17,"prompt":"土地的紛爭成為這兩國戰爭的肇端。\nThe dispute over the land _____________ _____________ _____________ of war between the two countries.","answers":["sowed","the","seeds"],"sentence":"The dispute over the land sowed the seeds of war between the two countries."},{"number":18,"prompt":"這對夫妻以前彼此相愛，但不同的生活習慣種下了分開的種子。\nThe couple was deeply in love, but different lifestyles _____________ _____________ _____________ _____________ their separation.","answers":["sowed","the","seeds","of"],"sentence":"The couple was deeply in love, but different lifestyles sowed the seeds of their separation."},{"number":19,"prompt":"儘管醫生建議 Danny 休息一下，他仍然繼續工作。\n_____________ _____________ _____________ _____________ the doctor suggested Danny take a rest, he still kept working.","answers":["Despite","the","fact","that"],"sentence":"Despite the fact that the doctor suggested Danny take a rest, he still kept working."},{"number":20,"prompt":"這場激烈的戰爭燒毀了村民的房子，使得他們無家可歸。\nThe fierce war _____________ _____________ the villagers' houses, leaving them homeless.","answers":["burned","down"],"sentence":"The fierce war burned down the villagers' houses, leaving them homeless."},{"number":21,"prompt":"老師命令那學生上課時把電玩收起來。\nThe teacher _____________ _____________ _____________ _____________ _____________ _____________ the video game in class.","answers":["ordered","that","the","student","put","away"],"sentence":"The teacher ordered that the student put away the video game in class."},{"number":22,"prompt":"士兵們一爬出木馬，就試著焚毀敵人的皇宮。\nThe soldiers tried to _____________ _____________ the enemy's palace as soon as they crept out of the wooden horse.","answers":["burn","down"],"sentence":"The soldiers tried to burn down the enemy's palace as soon as they crept out of the wooden horse."},{"number":23,"prompt":"那母親在跟鄰居講話時，讓她的小孩在花園裡玩耍。\nThe mother _____________ _____________ _____________ _____________ in the garden while she was talking to the neighbor.","answers":["left","her","child","playing"],"sentence":"The mother left her child playing in the garden while she was talking to the neighbor."},{"number":24,"prompt":"當他獨自做家事時，Levi 通常會放著音樂。\nLevi usually _____________ the music _____________ when he does the housework alone.","answers":["leaves","playing"],"sentence":"Levi usually leaves the music playing when he does the housework alone."},{"number":25,"prompt":"Vicky通常不會在夜深人靜時走進暗巷中。\nVicky usually tends not to go into dark alleys _____________ _____________ _____________ _____________ _____________.","answers":["in","the","dead","of","night"],"sentence":"Vicky usually tends not to go into dark alleys in the dead of night."},{"number":26,"prompt":"In 2019, more than 90 percent of the National Museum of Brazil _____________ _____________, and numerous works of fine art were destroyed in the fire.\n2019年，巴西國立博物館被燒毀九成以上，無數藝術品在大火中付之一炬。","answers":["burned","down"],"sentence":"In 2019, more than 90 percent of the National Museum of Brazil burned down, and numerous works of fine art were destroyed in the fire."},{"number":27,"prompt":"Mary跟Jerry轉而向父母求助，希望他們能幫忙解決他們的問題。\nMary and Jerry _____________ _____________ their parents for help, _____________ they can help to solve their problems.","answers":["turned","to","hoping"],"sentence":"Mary and Jerry turned to their parents for help, hoping they can help to solve their problems."},{"number":28,"prompt":"iPhone的價格高得不可思議。對我來說，它就只是用來接聽電話的手機而已。\nThe price of iPhone is incredibly high. For me, it is _____________ _____________ _____________ a mobile phone to give and receive calls.","answers":["nothing","more","than"],"sentence":"The price of iPhone is incredibly high. For me, it is nothing more than a mobile phone to give and receive calls."},{"number":29,"prompt":"The thief crept into the jewelry store and stole the valuable necklace _____________ _____________ _____________ _____________ _____________.\n夜深人靜時，小偷潛進珠寶店，偷走價值連城的項鍊。","answers":["in","the","dead","of","night"],"sentence":"The thief crept into the jewelry store and stole the valuable necklace in the dead of night."},{"number":30,"prompt":"美國總統下令美軍在日本投下原子彈，促使了第二次世界大戰的結束。\nThe US president ordered _____________ the US army _____________ the atom bomb in Japan, _____________ prompted the end of WWII.","answers":["that","drop","which"],"sentence":"The US president ordered that the US army drop the atom bomb in Japan, which prompted the end of WWII."},{"number":31,"prompt":"儘管這對夫妻沒有太多的閒錢，他們仍然享受生活。\n_____________ _____________ _____________ _____________ the couple does not have\nmuch spare money, they still enjoy their lives.","answers":["Despite","the","fact","that"],"sentence":"Despite the fact that the couple does not have much spare money, they still enjoy their lives."},{"number":32,"prompt":"夏天的用電量比其他季節的用電量還高。\nElectricity consumption is higher in summer than that in _____________ _____________ _____________ _____________.","answers":["all","the","other","seasons"],"sentence":"Electricity consumption is higher in summer than that in all the other seasons."}]};const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let flat=[],index=0,wrong=new Map(),attempted=new Set(),firstTry=new Set(),recognition=null;
function flatten(){if(QUIZ.kind==='mcq')return QUIZ.data.map(x=>({...x,id:String(x.number)}));if(QUIZ.kind==='translation')return QUIZ.data.map(x=>({...x,id:String(x.number)}));return QUIZ.data.flatMap(set=>set.answers.map((answer,i)=>({id:`${set.set}-${i+1}`,set:set.set,passage:set.passage,options:set.options,answer,blank:i+1,sentence:set.sentences[i],structure:set.structure})))}
function fillPassage(text,answers,options){let out=text;answers.forEach((a,i)=>{const word=options[a];const n=i+1;const pats=[new RegExp(`__\\(?${n}\\)?__`),new RegExp(`__${n}__`),new RegExp(`　${n}　`),new RegExp(`\\(${n}\\)`)];for(const p of pats){if(p.test(out)){out=out.replace(p,word);break}}});return out.replace(/\n+/g,' ').replace(/\s+/g,' ').trim()}
function markBlank(text,n){const tag=`<span class="blank-now">Blank ${n}</span>`;let out=esc(text),done=false;for(const p of [new RegExp(`__\\(?${n}\\)?__`),new RegExp(`__${n}__`),new RegExp(`　${n}　`),new RegExp(`\\(${n}\\)`)]){if(!done&&p.test(out)){out=out.replace(p,tag);done=true}}return out}
function norm(s){return String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ')}function speak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}
function show(){try{recognition?.abort()}catch(e){}speechSynthesis?.cancel();const q=flat[index];$('#meta').textContent=`第 ${index+1} / ${flat.length} 題`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=((index+1)/flat.length*100)+'%';$('#feedback').className='feedback hidden';$('#reference').classList.add('hidden');$('#voiceBox').classList.add('hidden');$('#next').classList.add('hidden');$('#check').classList.toggle('hidden',QUIZ.kind!=='translation');$('#answerArea').innerHTML='';if(QUIZ.kind==='mcq')renderChoice(q.prompt,q.options);else if(QUIZ.kind==='translation')renderTranslation(q);else{$('#question').innerHTML=`<div class="passage">${markBlank(q.passage,q.blank)}</div>`;renderChoice(`第 ${q.blank} 格`,q.options)}}
function renderChoice(prompt,options){$('#question').innerHTML=QUIZ.kind==='mcq'?`<div class="prompt">${esc(prompt)}</div>`:$('#question').innerHTML;$('#answerArea').innerHTML='<div class="options">'+Object.entries(options).map(([k,v])=>`<button class="option" data-key="${k}"><b>${k}.</b> ${esc(v)}</button>`).join('')+'</div>';document.querySelectorAll('.option').forEach(b=>b.onclick=()=>checkChoice(b.dataset.key,b))}
function renderTranslation(q){let i=0;const rendered=esc(q.prompt).replace(/_{3,}/g,()=>`<input class="inline-input" data-i="${i++}" aria-label="第 ${i} 格答案">`);$('#question').innerHTML=`<div class="translation">${rendered}</div>`;setTimeout(()=>document.querySelector('.inline-input')?.focus(),0)}
function recordWrong(q,value){if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(value);$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
function checkChoice(key,button){const q=flat[index];attempted.add(q.id);if(key!==q.answer){recordWrong(q,key);button.classList.add('wrong');$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 不正確，請再試一次。';return}if(!wrong.has(q.id))firstTry.add(q.id);document.querySelectorAll('.option').forEach(b=>b.disabled=true);button.classList.add('correct');pass(q)}
function checkTranslation(){const q=flat[index],values=[...document.querySelectorAll('.inline-input')].map(x=>x.value);attempted.add(q.id);const ok=values.length===q.answers.length&&values.every((v,i)=>norm(v)===norm(q.answers[i]));if(!ok){recordWrong(q,values.join(' / '));$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 尚有空格不正確，請修正後再檢查。';return}if(!wrong.has(q.id))firstTry.add(q.id);document.querySelectorAll('.inline-input').forEach(x=>x.disabled=true);pass(q)}
function pass(q){$('#feedback').className='feedback ok';$('#feedback').textContent='✅ 正確！';$('#reference').classList.remove('hidden');$('#reference').textContent='完整句：'+q.sentence;$('#check').classList.add('hidden');$('#next').classList.remove('hidden');$('#voiceBox').classList.remove('hidden');$('#voiceTarget').textContent=q.sentence;$('#voiceResult').className='voice-result';$('#voiceResult').textContent='尚未進行朗讀評分。';speak(q.sentence)}
function similarity(a,b){a=norm(a).replace(/[^a-z0-9' ]/g,'').split(' ').filter(Boolean);b=norm(b).replace(/[^a-z0-9' ]/g,'').split(' ').filter(Boolean);const used=new Set;let hit=0;for(const w of a){const j=b.findIndex((x,i)=>x===w&&!used.has(i));if(j>=0){hit++;used.add(j)}}return Math.round(100*hit/Math.max(a.length,b.length,1))}
function startMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('#voiceResult').textContent='此瀏覽器不支援語音辨識，建議使用 Chrome。';return}recognition=new SR;recognition.lang='en-US';recognition.interimResults=false;$('#voiceResult').textContent='正在聆聽，請朗讀完整句子…';recognition.onresult=e=>{const said=e.results[0][0].transcript,target=flat[index].sentence,score=similarity(target,said);$('#voiceResult').className='voice-result '+(score>=80?'good':'retry');$('#voiceResult').textContent=`辨識：${said}\n正確率：${score}%`};recognition.onerror=e=>$('#voiceResult').textContent='語音辨識未完成：'+e.error;recognition.start()}
function finish(){try{recognition?.abort()}catch(e){}speechSynthesis?.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');const rows=[...wrong.values()];$('#summary').innerHTML=`<div class="stat">實際作答<b>${attempted.size}</b></div><div class="stat">一次答對<b>${firstTry.size}</b></div><div class="stat">曾答錯<b>${rows.length}</b></div>`;$('#wrongList').innerHTML=rows.length?rows.map((r,i)=>`<div class="wrong-card"><b>${i+1}. 第 ${esc(r.q.id)} 題</b><p>${esc(r.q.prompt||`第 ${r.q.blank} 格`)}</p><p>作答：${r.attempts.map(esc).join('；')}</p><p>答案：${esc(r.q.answer||r.q.answers.join(' / '))}</p></div>`).join(''):(attempted.size?'<div class="feedback ok">🎉 本輪全部一次答對！</div>':'<p class="muted">本輪尚未作答，因此不登錄成績。</p>');$('#download').classList.toggle('hidden',!rows.length);if(attempted.size)document.dispatchEvent(new CustomEvent('quiz-result-ready',{detail:{total:attempted.size,correct:firstTry.size,wrong:rows.length,mistakeQuestionNumbers:rows.map(r=>r.q.id).join(', ')}}))}
$('#check').onclick=checkTranslation;$('#next').onclick=()=>{if(++index>=flat.length)finish();else show()};$('#finish').onclick=finish;$('#restart').onclick=()=>location.reload();$('#speak').onclick=()=>speak(flat[index].sentence);$('#mic').onclick=startMic;$('#download').onclick=async()=>{const rows=[...wrong.values()];if(!rows.length)return;try{if(!window.docx)await new Promise((ok,fail)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js';s.onload=ok;s.onerror=fail;document.head.append(s)});const{Document,Packer,Paragraph,HeadingLevel}=window.docx,children=[new Paragraph({text:`三民普高 ${QUIZ.unit} ${QUIZ.title} 錯題紀錄`,heading:HeadingLevel.TITLE})];rows.forEach(r=>children.push(new Paragraph({text:`第 ${r.q.id} 題`,heading:HeadingLevel.HEADING_2}),new Paragraph(r.q.prompt||r.q.passage||''),new Paragraph('作答：'+r.attempts.join('；')),new Paragraph('答案：'+(r.q.answer||r.q.answers.join(' / ')))));const blob=await Packer.toBlob(new Document({sections:[{children}]})),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Sanmin_${QUIZ.unit}_${QUIZ.kind}_錯題.docx`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){alert('目前無法產生 DOCX，請稍後再試。')}};flat=flatten();show();
</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
