].map(x=>({n:x[0],q:x[1],o:x[2],a:x[3],e:x[4]}));let pool=[],idx=0,wrong=new Set(),wrongChoice=new Map(),mode='first',rec=null;const $=id=>document.getElementById(id);const letters=['A','B','C','D'];function renderList(){$('list').innerHTML=Q.map(x=>`<label class="pick"><input type="checkbox" value="${x.n}" checked>第 ${x.n} 題　${x.q}</label>`).join('')}function show(){let x=pool[idx];$('meta').textContent=`${mode==='retry'?'錯題重做｜':''}第 ${idx+1} / ${pool.length} 題（原題 ${x.n}）`;$('bar').style.width=`${(idx+1)/pool.length*100}%`;$('qtext').textContent=x.n+'. '+x.q;$('opts').innerHTML=x.o.map((v,i)=>`<label class="opt" data-i="${i}"><input type="radio" name="ans" value="${i}">(${letters[i]}) ${v}</label>`).join('');$('fb').className='feedback hidden';$('voiceBox').classList.add('hidden');$('check').classList.remove('hidden');$('next').classList.add('hidden')}function spoken(x){return x.q.replace(/_{2,}/g,x.o[x.a].includes(';')?x.o[x.a].split(';').join(' / '):x.o[x.a])}function check(){let x=pool[idx],r=document.querySelector('input[name=ans]:checked');if(!r)return alert('請先選一個答案');let v=+r.value;document.querySelectorAll('.opt').forEach((el,i)=>{el.classList.toggle('correct',i===x.a);el.classList.toggle('wrong',i===v&&v!==x.a);el.querySelector('input').disabled=true});let ok=v===x.a;if(!ok){wrong.add(x.n);if(!wrongChoice.has(x.n))wrongChoice.set(x.n,[]);wrongChoice.get(x.n).push(letters[v])}$('fb').className='feedback '+(ok?'ok':'bad');$('fb').innerHTML=`<b>${ok?'✅ 答對了！':'❌ 答錯了。'} 正確答案：(${letters[x.a]}) ${x.o[x.a]}</b><div class="explain">解析：${x.e}</div>`;$('voiceTarget').textContent=spoken(x);$('voiceBox').classList.remove('hidden');$('check').classList.add('hidden');$('next').classList.remove('hidden')}function speak(){if(!speechSynthesis)return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance($('voiceTarget').textContent);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u)}function norm(s){return String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim()}function sim(a,b){a=norm(a).split(' ');b=norm(b).split(' ');let d=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)d[i][0]=i;for(let j=0;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return Math.round((1-d[a.length][b.length]/Math.max(a.length,b.length,1))*100)}function listen(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$('vr').textContent='此瀏覽器不支援語音辨識；可直接進下一題。';return}rec=new R;rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=3;$('mic').disabled=true;$('vr').textContent='🎤 正在聽…';rec.onresult=e=>{let best={s:0,t:''};for(let i=0;i<e.results[0].length;i++){let t=e.results[0][i].transcript,s=sim(t,$('voiceTarget').textContent);if(s>best.s)best={s,t}}$('vr').innerHTML=`辨識：<b>${best.t}</b><br>相似度：<b>${best.s}%</b>（本測驗錄音不影響作答進度）`};rec.onerror=()=>{$('vr').textContent='語音辨識失敗，可重試或直接下一題。'};rec.onend=()=>{$('mic').disabled=false};rec.start()}function end(){if(mode==='retry'){showResult(true);return}showResult(false)}function showResult(retryDone){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('resultTitle').textContent=retryDone?'錯題重做完成':'第一次作答完成';let chosen=mode==='retry'?pool.length:pool.length;$('summary').innerHTML=`<span class="stat">本輪題數：${chosen}</span><span class="stat">曾答錯題數：${wrong.size}</span>`;let arr=[...wrong].sort((a,b)=>a-b);$('wrongList').innerHTML=arr.length?'<h3>需要複習的題目</h3>'+arr.map(n=>{let x=Q.find(q=>q.n===n);return`<div class="wrongcard"><b>第 ${n} 題</b><div>${x.q}</div>${x.o.map((v,i)=>`<div>(${letters[i]}) ${v}</div>`).join('')}<div class="answer">正確答案：(${letters[x.a]}) ${x.o[x.a]}</div><div>解析：${x.e}</div></div>`}).join(''):'<p class="feedback ok">🎉 全部答對，沒有錯題！</p>';$('retry').classList.toggle('hidden',!arr.length)}function retryWrong(){pool=[...wrong].sort((a,b)=>a-b).map(n=>Q.find(q=>q.n===n));idx=0;mode='retry';$('result').classList.add('hidden');$('quiz').classList.remove('hidden');show()}async function download(){let arr=[...wrong].sort((a,b)=>a-b),children=[new Paragraph({text:'Hanlin B4U1 Grammar MCQ 錯題整理',heading:HeadingLevel.TITLE}),new Paragraph(`錯題數：${arr.length}`)];for(let n of arr){let x=Q.find(q=>q.n===n);children.push(new Paragraph({children:[new TextRun({text:`第 ${n} 題　${x.q}`,bold:true})]}));x.o.forEach((v,i)=>children.push(new Paragraph(`(${letters[i]}) ${v}`)));children.push(new Paragraph({children:[new TextRun({text:`正確答案：(${letters[x.a]}) ${x.o[x.a]}`,bold:true})]}),new Paragraph('解析：'+x.e),new Paragraph('我的重做答案：__________'),new Paragraph(''));}let blob=await Packer.toBlob(new Document({sections:[{children}]})),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='Hanlin_B4U1_Grammar_MCQ_錯題.docx';a.click();URL.revokeObjectURL(u)}renderList();$('all').onclick=()=>document.querySelectorAll('#list input').forEach(x=>x.checked=true);$('none').onclick=()=>document.querySelectorAll('#list input').forEach(x=>x.checked=false);$('start').onclick=()=>{pool=[...document.querySelectorAll('#list input:checked')].map(x=>Q.find(q=>q.n==x.value));if(!pool.length)return alert('請至少選一題');idx=0;wrong.clear();wrongChoice.clear();mode='first';$('sel').classList.add('hidden');$('quiz').classList.remove('hidden');show()};$('check').onclick=check;$('next').onclick=()=>{if(++idx>=pool.length)end();else show()};$('finish').onclick=end;$('speak').onclick=speak;$('mic').onclick=listen;$('retry').onclick=retryWrong;$('download').onclick=download;$('restart').onclick=()=>location.reload();</script></body></html>
