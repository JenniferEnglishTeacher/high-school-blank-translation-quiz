rder-radius:9px;color:var(--amber);font-weight:800;margin-bottom:10px}.question{font-size:21px;font-weight:750;padding:16px;background:#f8fafc;border-radius:11px;white-space:pre-wrap}.options{display:grid;gap:9px;margin:14px 0}.option{display:flex;align-items:center;gap:11px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-size:18px;font-weight:750;cursor:pointer}.option:hover{border-color:#60a5fa;background:#eff6ff}.option:has(input:checked){border-color:var(--blue);background:#dbeafe;color:var(--navy)}.option input{width:20px;height:20px;accent-color:var(--blue)}.inputs{display:grid;gap:10px;margin:15px 0}.answer-row{display:grid;grid-template-columns:55px 1fr;gap:10px;align-items:center}.answer-row label{font-weight:900;color:var(--navy);text-align:center}.spell{width:100%;font:inherit;font-size:18px;padding:11px;border:2px solid #94a3b8;border-radius:9px}.feedback{padding:13px;border-radius:10px;font-weight:800;margin:13px 0}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.explain{font-weight:500;margin-top:7px}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:var(--voicebg);margin:13px 0}.voicebox b{display:block;font-size:19px;margin-bottom:8px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}.wrong p{margin:6px 0}.source{font-size:13px;color:var(--muted)}@media(max-width:600px){.wrap{padding:9px}.hero,.card{padding:15px}.question{font-size:18px;padding:13px}.option{font-size:17px}.answer-row{grid-template-columns:42px 1fr}.meta{display:block}}</style><link rel="stylesheet" href="longteng-vocab-required-pronunciation.css?v=20261026-4"></head><body><main class="wrap"><section class="hero"><h1>龍騰普高 B3U5 單字選擇</h1><p>共 30 題。可自行選題、隨機抽題；答錯後請重新作答。</p><p class="note">答對後顯示來源解析並播放完整英文句；STT 朗讀達 80% 才能進入下一題。完成後可重做錯題並下載 DOCX。</p><div class="toolbar"><a class="btn" href="dashboard.html">← 回測驗總覽</a></div></section><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn">全部選取</button><button id="none" class="btn">全部取消</button><button id="rand20" class="btn">隨機 20 題</button></div><label><input id="shuffle" type="checkbox"> 打亂出題順序</label><div id="list"></div><div class="actions"><button id="start" class="btn primary">開始作答</button><span id="picked" class="note"></span></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="voiceBox" class="voicebox hidden"><b id="voiceTarget"></b><button id="speak" class="btn voice">🔊 再聽一次</button></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="retry" class="btn primary">只重做錯題</button><button id="download" class="btn">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></main><script>const TITLE="龍騰普高 B3U5 單字選擇",MODE="mcq",Q=[{"id":1,"question":"Metaphors and similes are two of the most common ____________ devices used by writers to express their ideas.","options":["previous","splendid","leisurely","literary"],"answer":3,"explanation":"暗喻和明喻是作家們用來表達他們想法最常見的兩種文學技巧。 (A)之前的 (B)壯觀的 (C)悠閒的 (D)文學的","source":"龍騰自命題"},{"id":2,"question":"After breakfast, the couple took a ____________ walk along the path, taking in the smell of freshly cut grass.","options":["literary","leisurely","historical","deliberate"],"answer":1,"explanation":"吃完早餐後，這對夫婦沿著小徑悠閒地散步，聞著剛割草過後的味道。 (A)文學的 (B)悠閒的 (C)歷史的 (D)故意的","source":"龍騰自命題"},{"id":3,"question":"To everyone’s surprise, it was revealed that the ____________ photos had been taken with smartphones.","options":["generous","inevitable","deliberate","stunning"],"answer":3,"explanation":"令大家驚訝的是，據透露這些撼動人心的照片是用智慧型手機拍攝的。 (A)慷慨的 (B)不可避免的 (C)故意的 (D)撼動人心的","source":"龍騰自命題"},{"id":4,"question":"It was a ____________ occasion when Barack Obama became the first black president of the US in 2009.","options":["previous","historic","stunning","delicate"],"answer":1,"explanation":"當歐巴馬在2009年成為美國第一位黑人總統時，那是歷史性的場合。 (A)之前的 (B)具歷史意義的 (C)驚人的 (D)精美的","source":"龍騰自命題"},{"id":5,"question":"Mount Fuji is Japan’s No. 1 tourist attraction. Its ____________ scenery never fails to impress anyone who goes there.","options":["historical","previous","splendid","deliberate"],"answer":2,"explanation":"富士山是日本第一名的旅遊景點。它壯觀的景色從不會讓去到那裡的人失望。 (A)歷史的 (B)之前的 (C)壯觀的 (D)小心翼翼的","source":"龍騰自命題"},{"id":6,"question":"The man ____________ out of nowhere and robbed the old lady before she could shout for help.","options":["stunned","appeared","boasted","blossomed"],"answer":1,"explanation":"這個男人不知道從哪冒出來，在老婦人尖叫求救前搶劫她。 (A)使……驚訝 (B)出現 (C)炫耀 (D)開花","source":"龍騰自命題"},{"id":7,"question":"The news that Kobe Bryant had died in a plane crash ____________ basketball fans all over the world.","options":["appeared","boasted","stunned","mocked"],"answer":2,"explanation":"Kobe Bryant死於墜機的消息使全世界的籃球迷驚訝。 (A)出現 (B)炫耀 (C)使……驚訝 (D)譏笑","source":"龍騰自命題"},{"id":8,"question":"Taipei 101 is no doubt the ____________ of Taipei. It attracts hundreds of thousands of tourists every year.","options":["capital","landmark","entrance","literature"],"answer":1,"explanation":"臺北101無疑是臺北的地標。它每年吸引數十萬的遊客。 (A)首都 (B)地標 (C)入口 (D)文學","source":"龍騰自命題"},{"id":9,"question":"At the front ____________ of the theater stands a life-sized cardboard cutout of the superstar, Tom Cruise.","options":["entrance","blossom","appearance","destination"],"answer":0,"explanation":"在戲院的前門立著一個巨星湯姆．克魯斯真人大小的人形立牌。 (A)入口 (B)花朵 (C)外貌 (D)目的地","source":"龍騰自命題"},{"id":10,"question":"The recently opened fitness center was ____________ a flagship bookstore, which shut down earlier this year as online shopping took off.","options":["stunningly","distinctively","previously","magnificently"],"answer":2,"explanation":"這間最近開幕的健身中心先前是間旗艦書局；因網路購物興起，書店今年稍早結束營業。 (A)驚人地 (B)獨特地 (C)先前地 (D)壯觀地","source":"龍騰自命題"},{"id":11,"question":"On my birthday, I received a very ____________ doll, which was carefully handmade by my best friend, Julia.","options":["delicate","historic","leisurely","previous"],"answer":0,"explanation":"我生日當天收到一個非常精美的娃娃，那是我最好的朋友Julia細心手工打造的。 (A)精美的 (B)歷史的 (C)悠閒的 (D)先前的","source":"龍騰自命題"},{"id":12,"question":"A violent typhoon caused our flight to Paris to be canceled. We were delayed for more than ten hours before we finally arrived at our ____________.","options":["capital","entrance","destination","literature"],"answer":2,"explanation":"強烈的颱風造成我們前往巴黎的班機被取消。在我們最終抵達目的地之前，我們已經被延誤了超過10小時。 (A)首都 (B)入口 (C)目的地 (D)文學","source":"龍騰自命題"},{"id":13,"question":"This restaurant ____________ delicious food, good service, and a romantic atmosphere.","options":["appears","stuns","boasts","blossoms"],"answer":2,"explanation":"這間餐廳標榜美食、優質服務和浪漫的氣氛。 (A)出現 (B)使……驚訝 (C)擁有；標榜 (D)開花","source":"龍騰自命題"},{"id":14,"question":"Louis is a very____________ person; he always thinks twice before he takes action.","options":["leisurely","deliberate","distinctive","breathtaking"],"answer":1,"explanation":"Louis是個非常謹慎的人；他在採取行動之前總是再三考慮。 (A)悠閒的 (B)細心謹慎的 (C)獨特的 (D)驚人的","source":"龍騰自命題"},{"id":15,"question":"The ____________ of the lace wedding gown caught the eye of the bride-to-be. She tried it on and knew this was the one for her.","options":["destination","delicacy","leisure","blossom"],"answer":1,"explanation":"這件精美的蕾絲婚紗吸引這位準新娘的目光；她試穿後知道，她要的就是這件。 (A)目的地 (B)精美 (C)休閒 (D)開花","source":"龍騰自命題"},{"id":16,"question":"The twin brothers look very much alike, but the nail-sized birthmark on the little one’s right cheek makes for a ____________ difference.","options":["delicate","splendid","distinct","deliberate"],"answer":2,"explanation":"這對雙胞胎長得超像，但在弟弟右臉頰上指甲大小的胎記是明顯的差異。 (A)精緻的 (B)壯麗的 (C)明顯的 (D)小心翼翼的","source":"龍騰自命題"},{"id":17,"question":"As the saying goes, “Don’t judge a person by his or her ____________.” It means our mind is more important than our looks.","options":["literature","landscape","splendor","appearance"],"answer":3,"explanation":"正如諺語所說：「不要以貌取人。」意思就是我們的心智比我們的外貌更重要。 (A)文學 (B)景色 (C)壯麗 (D)外貌","source":"龍騰自命題"},{"id":18,"question":"The breathtaking ____________ of the mountains, with its lush forests and clear lakes, is a perfect getaway.","options":["literature","landscape","distinction","delicacy"],"answer":1,"explanation":"令人驚嘆的山脈風景，茂密的森林和清澈的湖泊交織其中，是完美的度假勝地。 (A)文學 (B)景色 (C)差別 (D)佳餚","source":"龍騰自命題"},{"id":19,"question":"It is so romantic to sit under a cherry tree in ____________, chatting and enjoying some snacks and drinks with friends.","options":["splendor","blossom","appearance","literature"],"answer":1,"explanation":"和朋友一起坐在盛開櫻花的樹下聊天、享受一些點心飲料，真是浪漫。 (A)壯麗 (B)花開 (C)外貌 (D)文學","source":"龍騰自命題"},{"id":20,"question":"As I gazed upon the ____________ of the Grand Canyon, I couldn’t help feeling how small human beings are within the vastness of Nature.","options":["splendor","distinction","literature","destination"],"answer":0,"explanation":"當我凝望著大峽谷的壯麗時，我不禁覺得置身於大自然的廣袤無邊，人類是多麼地渺小。 (A)壯麗 (B)差別 (C)文學 (D)目的地","source":"龍騰自命題"},{"id":21,"question":"In order to afford a house in Taipei, Brian is working day and night, so he doesn’t have time for any ____________ activities.","options":["breathtaking","distinctive","historic","leisure"],"answer":3,"explanation":"為了在臺北買一間房子，Brian日夜工作，所以他沒有時間從事任何休閒活動。 (A)極為美麗的 (B)獨特的 (C)歷史悠久的 (D)休閒","source":"龍騰自命題"},{"id":22,"question":"Tourists visiting Spain shouldn’t miss the chance to take a good look at Gaudi’s ____________ La Sagrada Familia.","options":["magnificent","deliberate","leisurely","previous"],"answer":0,"explanation":"造訪西班牙的遊客不該錯過好好欣賞由高第設計的壯觀的聖家堂這個機會。 (A)壯觀的 (B)有意的 (C)悠閒的 (D)之前的","source":"龍騰自命題"},{"id":23,"question":"Jazz singer Louis Armstrong had such a(n) ____________ way of singing that most people can easily identify his voice.","options":["constructive","deliberate","previous","distinctive"],"answer":3,"explanation":"爵士樂歌手Louis Armstrong有如此獨特的唱歌方式以致於大部分的人可以輕易地辨識他的聲音。 (A)有建設性的 (B)故意的 (C)先前的 (D)獨特的","source":"龍騰自命題"},{"id":24,"question":"Younger audiences are advised not to watch this video, as they may not be able to make a clear ____________ between fact and fiction.","options":["distinction","appearance","landmark","capital"],"answer":0,"explanation":"年紀較小的觀眾不被建議觀看這部影片，因為他們可能無法清楚區分事實與虛構。 (A)區別 (B)外表 (C)地標 (D)首都","source":"龍騰自命題"},{"id":25,"question":"Of all the works of classical Chinese ____________, Romance of the Three Kingdoms is my favorite.","options":["destination","literature","blossom","appearance"],"answer":1,"explanation":"在所有經典中國文學作品中，《三國演義》是我的最愛。 (A)目的地 (B)文學 (C)花朵 (D)外表","source":"龍騰自命題"},{"id":26,"question":"All members of the audience were really attracted by the ____________ movements of the ballet dancer.","options":["historic","leisurely","literary","elegant"],"answer":3,"explanation":"所有的觀眾確實都被這位芭蕾舞者優雅的動作所吸引。 (A)歷史的 (B)悠閒的 (C)文學的 (D)優雅的","source":"龍騰自命題"},{"id":27,"question":"I will never forget my first experience of seeing Niagara Falls. The sight and thundering sound of its powerful rushing water were truly ____________.","options":["delicate","leisurely","breathtaking","elegant"],"answer":2,"explanation":"我永不會忘記初見尼加拉大瀑布的情景。它震耳欲聾的聲音和磅薄的水流真是驚人。 (A)精美的 (B)悠閒的 (C)驚人的 (D)優雅的","source":"龍騰自命題"},{"id":28,"question":"Andre’s writing style combines clarity with ____________, making even complex ideas easy to understand.","options":["elegance","leisure","capital","blossom"],"answer":0,"explanation":"Andre的寫作風格清晰而優雅，即使是複雜的想法也變得易於理解。 (A)優雅 (B)休閒 (C)首都 (D)花朵","source":"龍騰自命題"},{"id":29,"question":"Without enough start-up ____________, Kevin has no choice but to delay his plan to start his own business.","options":["delicacy","elegance","capital","entrance"],"answer":2,"explanation":"沒有足夠的創業基金，Kevin別無選擇只能推遲他創立自己事業的計畫。 (A)纖細 (B)優雅 (C)資金 (D)入口","source":"龍騰自命題"},{"id":30,"question":"Viewers can’t wait to watch the next season because they are having a hard time guessing who the real murderer is based on the ____________ episodes of the drama.","options":["elegant","splendid","previous","literary"],"answer":2,"explanation":"觀眾們等不及看下一季，因為他們根據這齣戲的前幾集很難猜測誰是真正的凶手。 (A)優雅的 (B)壯觀的 (C)之前的 (D)文學的","source":"龍騰自命題"}];const $=s=>document.querySelector(s),list=$('#list'),select=$('#select'),quiz=$('#quiz'),result=$('#result'),question=$('#question'),answerArea=$('#answerArea'),feedback=$('#feedback'),next=$('#next');let chosen=[],idx=0,mode='first';const wrong=new Map(),correct=new Set();const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ');const shuffled=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function renderList(){list.innerHTML=Q.map(q=>'<label class="pick"><input class="pickbox" type="checkbox" value="'+q.id+'" checked><b>第 '+q.id+' 題</b> <span class="source">'+esc(q.source||'')+'</span></label>').join('');count()}function count(){$('#picked').textContent='已選 '+document.querySelectorAll('.pickbox:checked').length+' 題'}list.addEventListener('change',count);$('#all').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=true);count()};$('#none').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=false);count()};$('#rand20').onclick=()=>{let ids=new Set(shuffled(Q).slice(0,Math.min(20,Q.length)).map(q=>q.id));document.querySelectorAll('.pickbox').forEach(x=>x.checked=ids.has(+x.value));count()};$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));if($('#shuffle').checked)chosen=shuffled(chosen);idx=0;mode='first';wrong.clear();correct.clear();select.classList.add('hidden');result.classList.add('hidden');quiz.classList.remove('hidden');show()};function show(){const q=chosen[idx];speechSynthesis?.cancel();$('#meta').textContent=(mode==='retry'?'錯題重做｜':'')+'第 '+(idx+1)+' / '+chosen.length+' 題';$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';$('#bar').style.width=(idx+1)/chosen.length*100+'%';question.textContent=q.question;const zh=$('#zh');if(q.zh){zh.textContent=q.zh;zh.classList.remove('hidden')}else zh.classList.add('hidden');feedback.className='feedback hidden';$('#voiceBox').classList.add('hidden');$('#check').classList.remove('hidden');next.classList.add('hidden');if(MODE==='mcq')answerArea.innerHTML='<div class="options">'+q.options.map((o,i)=>'<label class="option"><input type="radio" name="answer" value="'+i+'"><b>'+String.fromCharCode(65+i)+'.</b> '+esc(o)+'</label>').join('')+'</div>';else answerArea.innerHTML='<div class="inputs">'+q.answers.map((_,i)=>'<div class="answer-row"><label>'+(MODE==='multi'?['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'][i]:'答案')+'</label><input class="spell" autocomplete="off" spellcheck="false" placeholder="請輸入完整答案"></div>').join('')+'</div>';setTimeout(()=>answerArea.querySelector('input')?.focus(),0)}function currentAnswers(){if(MODE==='mcq'){const x=answerArea.querySelector('input:checked');return x?[+x.value]:[]}return [...answerArea.querySelectorAll('.spell')].map(x=>x.value)}function correctText(q){return MODE==='mcq'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.answers.map(a=>a.split('||')[0]).join(' / ')}function isCorrect(q,a){return MODE==='mcq'?a[0]===q.answer:a.every((x,i)=>q.answers[i].s
