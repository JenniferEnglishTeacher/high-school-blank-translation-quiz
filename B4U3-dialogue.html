<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>翰林 B4U3 Dialogue 課文填空</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#1f2937;--muted:#64748b;--line:#dbe2ea;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--accent:#2563eb;--accent2:#1d4ed8;--voice:#7c3aed;--voicebg:#f5f3ff}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}.wrap{max-width:980px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#eaf2ff,#fff);border:1px solid #dbeafe;border-radius:18px;padding:24px;margin-bottom:18px}.hero h1{margin:0 0 6px;font-size:clamp(25px,4vw,38px)}.hero p{margin:4px 0;color:var(--muted)}.home{display:inline-block;margin-top:12px;color:var(--accent);font-weight:800;text-decoration:none}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 5px 18px rgba(15,23,42,.05)}.hidden{display:none!important}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.btn{border:0;border-radius:10px;padding:11px 16px;font-size:16px;font-weight:700;cursor:pointer;background:#e5e7eb;color:#111827}.btn.primary{background:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent2)}.btn.danger{background:#991b1b;color:#fff}.btn.voice{background:var(--voice);color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.question-list{display:grid;gap:8px;margin-top:15px}.pick{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fafafa}.pick input{margin-top:5px;transform:scale(1.15)}.pick small{display:block;color:var(--muted)}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--accent);transition:width .2s}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-weight:700;margin:8px 0 18px}.zh{font-size:22px;font-weight:800;padding:16px;border-left:5px solid var(--accent);background:#eff6ff;border-radius:8px;margin-bottom:18px}.english{font-size:20px;line-height:2.2}.blank{display:inline-block;vertical-align:middle;margin:2px 4px}.blank input,.blank select{font:inherit;min-width:88px;max-width:240px;padding:6px 8px;border:2px solid #94a3b8;border-radius:8px;background:#fff}.blank.correct input,.blank.correct select{border-color:var(--ok);background:var(--okbg)}.blank.wrong input,.blank.wrong select{border-color:var(--bad);background:var(--badbg)}.answer{display:block;color:var(--bad);font-size:13px;font-weight:800;line-height:1.3}.feedback{margin-top:14px;padding:12px 14px;border-radius:10px;font-weight:800}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.voice-box{margin-top:16px;padding:16px;border:2px solid #ddd6fe;border-radius:14px;background:var(--voicebg)}.voice-box h3{margin:0 0 6px;color:#5b21b6}.voice-sentence{font-size:20px;font-weight:800;margin:8px 0 12px}.actions{margin-top:18px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:15px 0}.stat{padding:15px;border:1px solid var(--line);border-radius:12px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong-card{border:1px solid #fecaca;background:#fff7f7;border-radius:12px;padding:14px;margin:10px 0}.wrong-card p{margin:5px 0}.note{font-size:14px}@media(max-width:640px){.wrap{padding:12px}.card{padding:16px}.zh{font-size:19px}.english{font-size:18px}.blank input,.blank select{min-width:75px;max-width:180px}.meta{font-size:14px}}
</style>
</head>
<body><main class="wrap">
<section class="hero"><h1>翰林 B4U3 Dialogue 課文填空</h1><p>先看完整中文，再依課文完成英文挖空。答錯的空格會顯示正確答案，請重新填對。</p><p class="note">整句答對後會自動朗讀英文。判定會忽略大小寫、標點、前後空白、多餘空格及直／彎撇號差異。</p><a class="home" href="index.html">← 回練習總覽</a></section>
<section id="selectScreen" class="card"><h2>選擇要練習的句子</h2><div class="toolbar"><button class="btn" id="allBtn">全部選取</button><button class="btn" id="noneBtn">全部取消</button><button class="btn primary" id="startBtn">開始作答</button></div><div id="questionList" class="question-list"></div></section>
<section id="quizScreen" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="progressText"></span><span id="wrongCount"></span></div><div id="zhText" class="zh"></div><div id="enText" class="english"></div><div id="feedback" class="feedback hidden"></div><div id="voiceBox" class="voice-box hidden"><h3>🔊 完整英文</h3><div id="voiceSentence" class="voice-sentence"></div><button class="btn voice" id="speakBtn">🔊 再聽一次</button></div><div class="actions"><button class="btn primary" id="checkBtn">檢查答案</button><button class="btn primary hidden" id="nextBtn">下一題</button><button class="btn danger" id="finishBtn">結束作答</button></div></section>
<section id="resultScreen" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="resultMessage"></div><div id="wrongList"></div><div class="actions"><button class="btn primary" id="downloadBtn">下載錯題 DOCX</button><button class="btn" id="restartBtn">重新選題</button></div></section>
</main>
<script type="module">
import {Document,Packer,Paragraph,TextRun,HeadingLevel} from "https://esm.sh/docx@9.5.1";
const T=text=>({type:'text',text});
const B=(answer,opts={})=>({type:'blank',answer,accept:opts.accept||[answer],options:opts.options||null,width:opts.width||Math.max(84,Math.min(230,String(answer).length*15+30))});
const Q=(id,zh,full,s)=>({id,zh,full,s});
const qs=[
Q(1,'（深夜，一些動物在談論農場的主人瓊斯先生。）','(Late at night, some animals are talking about Mr. Jones, the owner of the farm.)',[T('(Late at night, some animals are '),B('talking'),T(' '),B('about'),T(' Mr. Jones, '),B('the owner of'),T(' the farm.)')]),
Q(2,'艾達牛：瓊斯先生對我們很壞。他要我們日夜工作，且很少讓我們休息。馬兒們，你們一天工作幾小時？','Ida the Cow: Mr. Jones is mean to us. He makes us work day and night and seldom lets us take a break. Horses, how many hours a day do you work?',[T('Ida the Cow: Mr. Jones is '),B('mean'),T(' '),B('to'),T(' us. He '),B('makes'),T(' us '),B('work'),T(' day and night and '),B('seldom'),T(' '),B('lets'),T(' us '),B('take'),T(' a break. Horses, '),B('how many'),T(' hours a day do you work?')]),
Q(3,'瑞歐馬：超過十小時。我們努力工作，但是瓊斯先生並沒有善待我們。他從不分享水果給我們吃。我們又瘦又虛弱。',"Rio the Horse: Over ten hours. We work hard, but Mr. Jones doesn't treat us well. He never shares fruit with us. We are thin and weak.",[T('Rio the Horse: Over ten hours. We '),B('work hard'),T(', but Mr. Jones '),B("doesn't treat"),T(' us '),B('well'),T('. He never '),B('shares'),T(' fruit '),B('with'),T(' us. We are '),B('thin'),T(' and '),B('weak'),T('.')]),
Q(4,'艾達牛：母雞，那麼你們呢？','Ida the Cow: Hens, what about you?',[T('Ida the Cow: Hens, '),B('what about'),T(' you?')]),
Q(5,'帕克絲雞：我們工作最勤奮，生產了大量的蛋，但是瓊斯先生對我們很惡劣。我們的屋子又小又髒，而且我們的生活很艱苦。','Pox the Hen: We work the hardest and produce lots of eggs, but Mr. Jones is bad to us. Our house is small and dirty, and we live a hard life.',[T('Pox the Hen: We work '),B('the hardest'),T(' and '),B('produce'),T(' '),B('lots of'),T(' eggs, but Mr. Jones is '),B('bad'),T(' '),B('to'),T(' us. Our house is '),B('small'),T(' and '),B('dirty'),T(', and we '),B('live a hard life'),T('.')]),
Q(6,'艾達牛：是的，我可憐的朋友們。瓊斯先生對我們很壞。沒有他，我們可以活得更好。我們讓他下臺吧！',"Ida the Cow: Yes, my poor friends. Mr. Jones treats us badly. We can live better without him. Let's take him down!",[T('Ida the Cow: Yes, my '),B('poor'),T(' friends. Mr. Jones '),B('treats'),T(' us '),B('badly'),T('. We can '),B('live better'),T(' '),B('without'),T(' him. Let\'s '),B('take'),T(' him '),B('down'),T('!')]),
Q(7,'大家：抗爭！抗爭！抗爭！抗爭！','Everyone: Fight! Fight! Fight! Fight!',[T('Everyone: '),B('Fight'),T('! '),B('Fight'),T('! '),B('Fight'),T('! '),B('Fight'),T('!')]),
Q(8,'艾達牛：瑞歐，你是所有人之中跑得最快的。去告訴大家吧。','Ida the Cow: Rio, you run the most quickly of all. Go tell everybody.',[T('Ida the Cow: Rio, you run '),B('the most quickly'),T(' '),B('of all'),T('. Go '),B('tell'),T(' '),B('everybody'),T('.')]),
Q(9,'瑞歐馬：好的。','Rio the Horse: All right.',[T('Rio the Horse: '),B('All right'),T('.')]),
Q(10,'艾迪豬：等等。各位請聽我說。我們何不用另一種不同的方式來爭取我們的權利呢？',"Eddie the Pig: Wait. Everyone, please listen to me. Why don't we fight for our rights in a different way?",[T('Eddie the Pig: Wait. Everyone, please '),B('listen to'),T(' me. '),B("Why don't we"),T(' '),B('fight for'),T(' our '),B('rights'),T(' in '),B('a different way'),T('?')]),
Q(11,'艾達牛：怎麼做？','Ida the Cow: How?',[T('Ida the Cow: '),B('How'),T('?')]),
Q(12,'艾迪豬：法律保護每一個人，所以我們可以向勞動部檢舉瓊斯先生。他們會要求他改善我們的生活。',"Eddie the Pig: The law protects everyone, so we can report Mr. Jones to the Labor Department. They'll have him improve our lives.",[T('Eddie the Pig: The '),B('law'),T(' '),B('protects'),T(' everyone, so we can '),B('report'),T(' Mr. Jones '),B('to'),T(' the Labor Department. They\'ll '),B('have'),T(' him '),B('improve'),T(' our lives.')]),
Q(13,'艾達牛：我們會需要律師，但是我們沒錢請律師。',"Ida the Cow: We'll need a lawyer, but we don't have money for that.",[T('Ida the Cow: We\'ll '),B('need'),T(' a '),B('lawyer'),T(', but we '),B("don't have money"),T(' '),B('for'),T(' that.')]),
Q(14,'艾迪豬：看看這位律師的網頁。她提供免費的服務。',"Eddie the Pig: Have a look at this lawyer's web page. She provides free services.",[T('Eddie the Pig: '),B('Have a look at'),T(' this lawyer\'s '),B('web page'),T('. She '),B('provides'),T(' '),B('free services'),T('.')]),
Q(15,'艾達牛：真的嗎？帕克絲，你可以幫我查證一下這項資訊嗎？我看不清楚。',"Ida the Cow: Really? Pox, could you help me check out this information? I can't see clearly.",[T('Ida the Cow: Really? Pox, '),B('could you help me'),T(' '),B('check out'),T(' this '),B('information'),T('? I '),B("can't"),T(' see '),B('clearly'),T('.')]),
Q(16,'帕克絲雞：沒問題。嗯，這資訊是真的。','Pox the Hen: No problem. Well, the information is true.',[T('Pox the Hen: '),B('No problem'),T('. Well, the information is '),B('true'),T('.')]),
Q(17,'艾達牛：很好。各位，我們來試試看艾迪的點子吧，好嗎？',"Ida the Cow: Good. Everyone, let's try Eddie's idea, OK?",[T('Ida the Cow: Good. Everyone, let\'s '),B('try'),T(' Eddie\'s '),B('idea'),T(', OK?')]),
Q(18,'大家：當然！那是個明智的做法。',"Everyone: Sure! That's a wise thing to do.",[T('Everyone: '),B('Sure'),T('! That\'s '),B('a wise thing'),T(' '),B('to do'),T('.')])
];
const $=s=>document.querySelector(s),state={selected:[],i:0,wrong:new Map(),attempted:new Set(),correct:new Set()};
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=s=>String(s??'').trim().toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?;:()“”\"]/g,'').replace(/\s+/g,' ');
function spoken(q){return q.full.replace(/^[^:]+:\s*/,'').replace(/^\(|\)$/g,'').trim()}
function speak(q){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(spoken(q));u.lang='en-US';u.rate=.88;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>/^en-US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang))||null;speechSynthesis.speak(u)}
function renderList(){questionList.innerHTML=qs.map(q=>`<label class="pick"><input class="qpick" type="checkbox" value="${q.id}" checked><span><b>第 ${q.id} 題</b><small>${esc(q.zh)}</small></span></label>`).join('')}
function start(){const ids=[...document.querySelectorAll('.qpick:checked')].map(x=>+x.value);if(!ids.length){alert('請至少選一題。');return}state.selected=qs.filter(q=>ids.includes(q.id));state.i=0;state.wrong.clear();state.attempted.clear();state.correct.clear();selectScreen.classList.add('hidden');resultScreen.classList.add('hidden');quizScreen.classList.remove('hidden');show()}
function show(){speechSynthesis?.cancel();const q=state.selected[state.i];progressText.textContent=`第 ${state.i+1} / ${state.selected.length} 題`;wrongCount.textContent=`曾答錯 ${state.wrong.size} 題`;bar.style.width=`${(state.i+1)/state.selected.length*100}%`;zhText.textContent=q.zh;enText.innerHTML='';q.s.forEach(seg=>{if(seg.type==='text'){enText.append(document.createTextNode(seg.text));return}const span=document.createElement('span');span.className='blank';let field;if(seg.options){field=document.createElement('select');field.innerHTML='<option value="">請選擇</option>'+seg.options.map(o=>`<option>${esc(o)}</option>`).join('')}else{field=document.createElement('input');field.type='text';field.autocomplete='off';field.style.width=seg.width+'px';field.placeholder='______'}span.append(field);enText.append(span)});feedback.className='feedback hidden';voiceBox.classList.add('hidden');checkBtn.classList.remove('hidden');nextBtn.classList.add('hidden');setTimeout(()=>enText.querySelector('input,select')?.focus(),20)}
function check(){const q=state.selected[state.i],defs=q.s.filter(x=>x.type==='blank'),fields=[...enText.querySelectorAll('input,select')];if(fields.some(f=>!f.value.trim())){alert('請完成所有空格後再檢查。');return}state.attempted.add(q.id);let all=true;const wrong=[];fields.forEach((f,i)=>{const span=f.closest('.blank'),d=defs[i],value=f.value;span.classList.remove('correct','wrong');span.querySelector('.answer')?.remove();if(d.accept.some(a=>norm(a)===norm(value))){span.classList.add('correct');f.disabled=true}else{all=false;wrong.push(`空格 ${i+1}: ${value}`);span.classList.add('wrong');const a=document.createElement('span');a.className='answer';a.textContent=`正確：${d.answer}`;span.append(a);f.value='';f.disabled=false}});if(!all){if(!state.wrong.has(q.id))state.wrong.set(q.id,{q,attempts:[]});state.wrong.get(q.id).attempts.push(wrong.join('； '));wrongCount.textContent=`曾答錯 ${state.wrong.size} 題`;feedback.className='feedback bad';feedback.textContent='❌ 有空格錯誤。請依紅色提示重填，再按一次「檢查答案」。';enText.querySelector('input:not(:disabled),select:not(:disabled)')?.focus();return}state.correct.add(q.id);feedback.className='feedback ok';feedback.textContent='✅ 全部正確！已自動朗讀完整英文。';voiceSentence.textContent=q.full;voiceBox.classList.remove('hidden');checkBtn.classList.add('hidden');nextBtn.classList.remove('hidden');speak(q)}
function finish(){speechSynthesis?.cancel();quizScreen.classList.add('hidden');resultScreen.classList.remove('hidden');summary.innerHTML=`<div class="stat">選擇題數<b>${state.selected.length}</b></div><div class="stat">已作答<b>${state.attempted.size}</b></div><div class="stat">完成答對<b>${state.correct.size}</b></div><div class="stat">曾答錯<b>${state.wrong.size}</b></div>`;const rows=[...state.wrong.values()];resultMessage.innerHTML=rows.length?'<p><b>以下題目曾經答錯；改正後仍保留在錯題紀錄。</b></p>':'<div class="feedback ok">🎉 本次沒有錯題！</div>';wrongList.innerHTML=rows.map((r,i)=>`<div class="wrong-card"><b>${i+1}. ${esc(r.q.zh)}</b><p>錯誤紀錄：${r.attempts.map(esc).join('<br>')}</p><p><strong>正確英文：</strong>${esc(r.q.full)}</p></div>`).join('');downloadBtn.classList.toggle('hidden',!rows.length)}
async function download(){if(!state.wrong.size)return;const children=[new Paragraph({heading:HeadingLevel.TITLE,children:[new TextRun({text:'翰林 B4U3 Dialogue 課文填空 錯題紀錄',bold:true})]}),new Paragraph({text:`曾答錯共 ${state.wrong.size} 題`})];[...state.wrong.values()].forEach((r,i)=>{children.push(new Paragraph({heading:HeadingLevel.HEADING_2,children:[new TextRun({text:`${i+1}. ${r.q.zh}`,bold:true})]}),new Paragraph({children:[new TextRun({text:'學生錯誤答案：',bold:true}),new TextRun({text:r.attempts.join(' | ')})]}),new Paragraph({children:[new TextRun({text:'正確完整英文：',bold:true}),new TextRun({text:r.q.full})]}),new Paragraph({text:'重新練習：____________________________________________________________'}))});const doc=new Document({sections:[{children}]});const blob=await Packer.toBlob(doc),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`翰林B4U3_Dialogue_錯題_${new Date().toISOString().slice(0,10)}.docx`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
allBtn.onclick=()=>document.querySelectorAll('.qpick').forEach(x=>x.checked=true);noneBtn.onclick=()=>document.querySelectorAll('.qpick').forEach(x=>x.checked=false);startBtn.onclick=start;checkBtn.onclick=check;speakBtn.onclick=()=>speak(state.selected[state.i]);nextBtn.onclick=()=>{state.i++;state.i<state.selected.length?show():finish()};finishBtn.onclick=finish;restartBtn.onclick=()=>{resultScreen.classList.add('hidden');selectScreen.classList.remove('hidden')};downloadBtn.onclick=download;renderList();
</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
