<script>window.QUIZ_CONFIG={"title": "國中會考文法歷屆試題｜附加問句", "mode": "mcq", "questions": [{"id": 1, "question": "Robert: Charles wanted to borrow $1,000 from me yesterday.\nMandy: You didn't lend him the money, ______?", "options": ["would you", "wouldn't you", "did you", "didn't you"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜附加問句 前否定後肯定（didn't → did you）", "explanation": "【句型】附加問句：前句否定 → 附加問句肯定；助動詞依前句時態。\n【分析】You didn't lend him the money 為過去式否定句，附加問句用肯定的 did you。\n【其他選項】(A)(B) would 與前句 didn't 不對應；(D) didn't you 是否定，前後同為否定不合規則。\n【例句】You didn't tell Mom about it, did you?", "explanationSource": "source"}, {"id": 2, "question": "Your brother doesn't eat meat, ______?", "options": ["doesn't he", "does he", "is he", "did he"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 1 題）", "explanation": "前否定（doesn't）後肯定，用 does he。", "explanationSource": "supplemental"}, {"id": 3, "question": "Ms. Chang was your English teacher last year, ______?", "options": ["wasn't she", "was she", "didn't she", "isn't she"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 1 題）", "explanation": "前肯定 was，後否定 wasn't she。", "explanationSource": "supplemental"}, {"id": 4, "question": "You haven't seen my glasses, ______?", "options": ["did you", "do you", "haven't you", "have you"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 1 題）", "explanation": "前否定 haven't，後肯定 have you。", "explanationSource": "supplemental"}, {"id": 5, "question": "Getting up early on a cold morning is not easy, ______?", "options": ["are you", "do you", "does it", "is it"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜附加問句 Ving 主詞→it", "explanation": "【句型】Ving（動名詞）當主詞 → 附加問句主詞用 it；前否定、後肯定。\n【分析】主詞 Getting up early on a cold morning 是動名詞片語，代名詞用 it；動詞 is not 是 be 動詞否定 → is it。\n【其他選項】(A)(B) 主詞 you 不對；(C) does 為一般動詞助動詞，但前句是 be 動詞 is。\n【例句】Swimming in the river is dangerous, isn't it?", "explanationSource": "source"}, {"id": 6, "question": "Playing video games all night is bad for your eyes, ______?", "options": ["are they", "isn't it", "doesn't it", "is it"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 5 題）", "explanation": "動名詞主詞用 it，前句 be 動詞肯定，後用 isn't it。", "explanationSource": "supplemental"}, {"id": 7, "question": "To finish the report in one day wasn't easy for Leo, ______?", "options": ["was it", "wasn't it", "did he", "was he"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 5 題）", "explanation": "不定詞主詞用 it，前句 wasn't 否定，後用肯定 was it。", "explanationSource": "supplemental"}, {"id": 8, "question": "Everyone in Class 8 likes Ms. Lin, ______?", "options": ["doesn't she", "does it", "don't they", "isn't it"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 5 題）", "explanation": "Everyone 當主詞時附加問句用 they，前肯定後用 don't they。", "explanationSource": "supplemental"}, {"id": 9, "question": "Alice really likes having noodles for breakfast, ______?", "options": ["doesn't she", "is she", "hasn't she", "did she"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜附加問句 現在式一般動詞 doesn't", "explanation": "【句型】現在簡單式一般動詞肯定句 → 附加問句用 don't/doesn't + 代名詞。\n【分析】likes 為一般動詞現在式（第三人稱單數），主詞 Alice → she，前肯定後否定 → doesn't she。\n【其他選項】(B) is 是 be 動詞，且未變否定；(C) hasn't 用於現在完成式；(D) did 是過去式且未變否定。\n【例句】Your father works in a bank, doesn't he?", "explanationSource": "source"}, {"id": 10, "question": "Your brother plays basketball after school, ______?", "options": ["does he", "doesn't he", "isn't he", "didn't he"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 9 題）", "explanation": "plays 為現在式一般動詞，前肯定後用 doesn't he。", "explanationSource": "supplemental"}, {"id": 11, "question": "Mark and Joe don't eat meat, ______?", "options": ["do they", "don't they", "are they", "did they"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 9 題）", "explanation": "前句 don't eat 為否定，後用肯定 do they。", "explanationSource": "supplemental"}, {"id": 12, "question": "Grandma watched the news last night, ______?", "options": ["doesn't she", "wasn't she", "hasn't she", "didn't she"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 9 題）", "explanation": "watched 為過去式一般動詞，附加問句用 didn't she。", "explanationSource": "supplemental"}, {"id": 13, "question": "The tall man over there is our new English teacher, ______?", "options": ["is he", "is there", "isn't he", "isn't there"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜附加問句 be 動詞，主詞換代名詞", "explanation": "【句型】be 動詞肯定句 → 附加問句 isn't/aren't + 代名詞（主詞名詞要改成代名詞）。\n【分析】主詞 The tall man 為男性單數 → he；動詞 is 肯定 → isn't he。over there 是地點副詞，不是 There be 句型。\n【其他選項】(A) 未變否定；(B)(D) there 是誤把 over there 當成 There be 句型的主詞。\n【例句】The girl next to Amy is your cousin, isn't she?", "explanationSource": "source"}, {"id": 14, "question": "The girl in the red dress is your cousin, ______?", "options": ["is she", "isn't it", "isn't she", "doesn't she"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 13 題）", "explanation": "主詞 The girl → she，be 動詞肯定，用 isn't she。", "explanationSource": "supplemental"}, {"id": 15, "question": "Those shoes on the floor aren't yours, ______?", "options": ["are they", "aren't they", "are those", "do they"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 13 題）", "explanation": "Those shoes 用 they 代替，前否定後用 are they。", "explanationSource": "supplemental"}, {"id": 16, "question": "That was a great game, ______?", "options": ["was it", "isn't it", "didn't it", "wasn't it"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 13 題）", "explanation": "主詞 That 用 it 代替，was 過去式肯定，後用 wasn't it。", "explanationSource": "supplemental"}, {"id": 17, "question": "Lucy: Do you think Sally and Martin should get married?\nRose: Why not? They love each other, ______?", "options": ["will they", "won't they", "do they", "don't they"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜附加問句 複數主詞 don't they", "explanation": "【句型】現在簡單式一般動詞肯定句（複數主詞）→ 附加問句 don't they。\n【分析】They love each other 為現在式一般動詞、肯定句，主詞複數 → don't they。\n【其他選項】(A)(B) will/won't 是未來式，與 love 現在式不對應；(C) do they 沒有變否定。\n【例句】Your cousins live in Kaohsiung, don't they?", "explanationSource": "source"}, {"id": 18, "question": "Ivy: Let's ask Tom and Kate to go with us.\nRay: Good idea. They like hiking, ______?", "options": ["do they", "don't they", "aren't they", "didn't they"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 17 題）", "explanation": "They like 現在式肯定，後用 don't they。", "explanationSource": "supplemental"}, {"id": 19, "question": "Your parents work in Taichung, ______?", "options": ["don't they", "aren't they", "do they", "doesn't it"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 17 題）", "explanation": "Your parents 複數用 they，work 現在式肯定，後用 don't they。", "explanationSource": "supplemental"}, {"id": 20, "question": "The twins never go to bed before midnight, ______?", "options": ["don't they", "are they", "do they", "aren't they"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 17 題）", "explanation": "never 使句子為否定，附加問句要用肯定 do they。", "explanationSource": "supplemental"}, {"id": 21, "question": "Oscar: I'm going to the museum. Bus Number 286 goes there, ______?\nDavid: Yes, but you can take a Number 287, too.", "options": ["does it", "doesn't it", "is it", "isn't it"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜附加問句 單數名詞主詞→it, doesn't it", "explanation": "【句型】現在式一般動詞肯定句（第三人稱單數）→ 附加問句 doesn't + 代名詞。\n【分析】主詞 Bus Number 286 是物 → it；goes 為一般動詞現在式肯定 → doesn't it。\n【其他選項】(A) does it 沒有變否定；(C)(D) is/isn't 是 be 動詞，與一般動詞 goes 不對應。\n【例句】This bus stops at Taipei Main Station, doesn't it?", "explanationSource": "source"}, {"id": 22, "question": "This train stops at Banqiao, ______?", "options": ["does it", "is it", "isn't it", "doesn't it"], "answer": 3, "answerLabel": "D", "source": "類似題 1（對應第 21 題）", "explanation": "主詞 This train → it，stops 現在式肯定，後用 doesn't it。", "explanationSource": "supplemental"}, {"id": 23, "question": "Your cat doesn't eat fish, ______?", "options": ["doesn't it", "does it", "is it", "isn't it"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 21 題）", "explanation": "前句 doesn't eat 否定，後用肯定 does it。", "explanationSource": "supplemental"}, {"id": 24, "question": "The library opens at nine on Sundays, ______?", "options": ["doesn't it", "isn't it", "does it", "won't it"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 21 題）", "explanation": "opens 為現在式一般動詞肯定，後用 doesn't it。", "explanationSource": "supplemental"}, {"id": 25, "question": "She's going to Europe, ______ she?", "options": ["doesn't", "hasn't", "isn't", "won't"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜附加問句 be going to → isn't she", "explanation": "【句型】be going to + V → 附加問句用 be 動詞（isn't/aren't）。\n【分析】She's = She is，句子是 She is going to (go to) Europe，前肯定 → isn't she。\n【其他選項】(A) doesn't 用於一般動詞；(B) 誤把 's 當成 has，但後面是 going 不是 p.p.；(D) won't 雖有未來意思，但句中助動詞是 is，不是 will。\n【例句】You're going to join the contest, aren't you?", "explanationSource": "source"}, {"id": 26, "question": "Your parents are going to buy a new car, ______?", "options": ["don't they", "won't they", "aren't they", "haven't they"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 25 題）", "explanation": "be going to 的附加問句用 be 動詞，前肯定用 aren't they。", "explanationSource": "supplemental"}, {"id": 27, "question": "Lisa isn't going to join the dance contest, ______?", "options": ["is she", "isn't she", "does she", "will she"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 25 題）", "explanation": "前句 isn't going to 否定，後用肯定 is she。", "explanationSource": "supplemental"}, {"id": 28, "question": "It's going to rain this afternoon, ______?", "options": ["doesn't it", "won't it", "hasn't it", "isn't it"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 25 題）", "explanation": "It's = It is，be going to 用 isn't it。", "explanationSource": "supplemental"}, {"id": 29, "question": "You've studied English for a long time, ______?", "options": ["did you", "didn't you", "have you", "haven't you"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜附加問句 現在完成式 haven't you", "explanation": "【句型】現在完成式肯定句 → 附加問句 haven't/hasn't + 代名詞。\n【分析】You've studied = You have studied（for a long time 為完成式線索），前肯定 → haven't you。\n【其他選項】(A)(B) did/didn't 用於過去簡單式；(C) have you 沒有變否定。\n【例句】Mike has lived here for ten years, hasn't he?", "explanationSource": "source"}, {"id": 30, "question": "Kelly has lived in Tainan since she was five, ______?", "options": ["doesn't she", "hasn't she", "didn't she", "isn't she"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 29 題）", "explanation": "has lived 為現在完成式，後用 hasn't she。", "explanationSource": "supplemental"}, {"id": 31, "question": "You haven't finished your science report yet, ______?", "options": ["have you", "haven't you", "did you", "do you"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 29 題）", "explanation": "前句 haven't finished 否定，後用肯定 have you。", "explanationSource": "supplemental"}, {"id": 32, "question": "Your brother has a new phone, ______?", "options": ["hasn't he", "isn't he", "doesn't he", "didn't he"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 29 題）", "explanation": "has 在此是一般動詞「擁有」（不是完成式助動詞），附加問句用 doesn't he。", "explanationSource": "supplemental"}, {"id": 33, "question": "Having three cups of coffee a day can't be bad for our health, ______?", "options": ["can it", "can they", "is it", "are they"], "answer": 0, "answerLabel": "A", "source": "115會考｜動名詞主詞的附加問句（單數 it；否定句接肯定問句）", "explanation": "【句型】附加問句：前否定 → 後肯定；助動詞跟主要句相同；主詞用代名詞。動名詞（Ving 片語）當主詞視為單數，用 it 代替。\n【分析】主要句助動詞是 can't，所以附加問句用肯定的 can；主詞 Having three cups of coffee a day 是一件事，代名詞用 it → can it。\n【其他選項】(B) can they：動名詞主詞不能用 they；(C) is it、(D) are they：主要句的助動詞是 can，不是 be 動詞。\n【例句】Reading in bed isn't good for your eyes, is it?", "explanationSource": "source"}, {"id": 34, "question": "Playing video games all night won't help you get good grades, ______?", "options": ["will it", "won't it", "will they", "do you"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 33 題）", "explanation": "動名詞主詞視為單數 it；前句 won't 否定，後接肯定 will it。", "explanationSource": "supplemental"}, {"id": 35, "question": "Swimming in the river is dangerous, ______?", "options": ["is it", "isn't it", "aren't they", "doesn't it"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 33 題）", "explanation": "前句肯定 is，附加問句用否定 isn't；動名詞主詞用 it。", "explanationSource": "supplemental"}, {"id": 36, "question": "Eating vegetables every day can keep you healthy, ______?", "options": ["can it", "can't they", "can't it", "doesn't it"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 33 題）", "explanation": "前句肯定 can，附加問句用 can't；動名詞主詞用 it。", "explanationSource": "supplemental"}]};</script><script src="longteng-b1u5-quiz.js?v=20261106-3"></script><script>document.querySelector("#description").textContent="共 36 題（會考歷屆＋講義錯題 9 題＋類似題 27 題）｜選答後顯示中文解析｜答錯可重做並下載錯題";</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
