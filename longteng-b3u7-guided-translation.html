>共 44 題。可自行選題、隨機抽題；答錯後請重新作答。</p><p class="note">答對後顯示來源解析並播放完整英文句；STT 朗讀達 80% 才能進入下一題。完成後可重做錯題並下載 DOCX。</p><div class="toolbar"><a class="btn" href="dashboard.html">← 回測驗總覽</a></div></section><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn">全部選取</button><button id="none" class="btn">全部取消</button><button id="rand20" class="btn">隨機 20 題</button></div><label><input id="shuffle" type="checkbox"> 打亂出題順序</label><div id="list"></div><div class="actions"><button id="start" class="btn primary">開始作答</button><span id="picked" class="note"></span></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="voiceBox" class="voicebox hidden"><b id="voiceTarget"></b><button id="speak" class="btn voice">🔊 再聽一次</button></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="retry" class="btn primary">只重做錯題</button><button id="download" class="btn">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></main><script>const TITLE="龍騰普高 B3U7 引導式翻譯",MODE="multi",Q=[{"id":1,"zh":"這小男孩是否在說謊仍未知。","question":"①____________ ②____________ ③____________ the little boy was lying was still unknown.","answers":["Whether","or","not"],"explanation":"","source":"三合一學習手冊"},{"id":2,"zh":"全世界的球迷都被那名棒球球員在車禍中喪生的消息震驚了。","question":"Fans around the world were shocked by ①____________ ②____________ ③____________ the baseball player had been killed in a car accident.","answers":["the","news","that"],"explanation":"此句中，that所引導的名詞子句為the news的同位語，用來補充說明，此時that不可省略。","source":"龍騰自命題"},{"id":3,"zh":"戴眼鏡的學生佔了將近全班的三分之二。","question":"Students wearing glasses ①____________ ②____________ close to two-thirds of the whole class.","answers":["account","for"],"explanation":"表「（數量上）佔……」的片語用account for...","source":"龍騰自命題"},{"id":4,"zh":"Helen生日那天和她的男友在一家法國餐廳享用一頓美好的晚餐。最棒的是，她的男友還向她求婚。","question":"Helen had a wonderful dinner with her boyfriend at a French restaurant on her birthday. ①____________ ②____________ ③____________, her boyfriend proposed to her.","answers":["Best","of","all"],"explanation":"表「最棒地」的片語用best of all","source":"龍騰自命題"},{"id":5,"zh":"除了幾個又新又酷的功能外，這款最新的智慧型手機螢幕更大，價格卻更低。","question":"①____________ ②____________ several new cool functions, the latest model of the smartphone has a larger screen and a cheaper price.","answers":["Aside","from"],"explanation":"表「除了……之外」的片語用aside from","source":"龍騰自命題"},{"id":6,"zh":"除了年輕貌美之外，真的讓這位女演員一舉成名的絕對是她吸睛的演技。","question":"①____________ ②____________ ③____________ young and pretty, what caused this actress to shoot to fame was certainly her engaging acting skills.","answers":["Aside","from","being"],"explanation":"表「除了……之外」的片語用aside from，而from後須接名詞，故be動詞須改成動名詞being","source":"龍騰自命題"},{"id":7,"zh":"觀光業收入就幾乎佔了這個小島國的經濟一半。","question":"Tourism revenues ①____________ ②____________ nearly half of the total economy of this small island country.","answers":["account","for"],"explanation":"表「（數量上）佔……」的片語用account for....","source":"龍騰自命題"},{"id":8,"zh":"我超推薦這間泰式餐廳。那裡的菜餚絕不會讓你失望。用餐環境也很棒。","question":"I highly recommend this Thai restaurant. The dishes there will never disappoint you. And the dining environment is wonderful ①____________ ②____________.","answers":["as","well"],"explanation":"表「也」的片語若放句尾用as well","source":"龍騰自命題"},{"id":9,"zh":"完成這項任務可能對大部分學生並不容易。然而，就極聰明的學生而言，他們大概可在十分鐘內完成。","question":"Finishing this task may not be easy for most students. However, ①____________ the ②____________ ③____________ very bright students, they could probably finish it within ten minutes.","answers":["in","case","of"],"explanation":"表「就……而言」的片語用in the case of....（關於；在……的情況下）","source":"龍騰自命題"},{"id":10,"zh":"既然好幾家購物網站都降價，我們也別無選擇跟著這麼做。","question":"Now that several online shopping websites are lowering prices, we have no choice but to ①____________ ②____________.","answers":["follow","suit"],"explanation":"表「跟著做；照著做」的片語用follow suit","source":"龍騰自命題"},{"id":11,"zh":"突然間，霧變得如此濃以至於我們看不到前面的任何事物。在這種情況下，我們只好靠邊停車再等一下子。","question":"Suddenly, the fog became so thick that we could not see anything ahead. ①____________ ②____________ ③____________, we had to pull the car over and wait for a while.","answers":["Under","the","circumstances"],"explanation":"表「在這種情況下」的片語用under the circumstances","source":"龍騰自命題"},{"id":12,"zh":"這間坐落在湖邊的旅館真的名符其實地是這地區最佳旅館。它提供了美食還有奢華服務。最棒的是房間看出去的景色是絕讚。","question":"The hotel situated by the lake lives up to its name as the area’s best hotel. It provides gourmet food and luxury service. ①____________ ②____________ ③____________, the view from the rooms is absolutely gorgeous.","answers":["Best","of","all"],"explanation":"表「最棒地」的片語用best of all","source":"龍騰自命題"},{"id":13,"zh":"這部電影頗為無聊，所以我忍不住就在電影院裡睡著了。","question":"The movie was quite dull, so I ①____________ ②____________ ③____________ fall asleep in the theater.","answers":["couldn’t","help","but"],"explanation":"表「忍不住做……」且後接原型動詞的句型用S + can’t help but + VR....；過去式can’t改成couldn’t","source":"龍騰自命題"},{"id":14,"zh":"我們的街頭食物珍珠飲品一直都很流行，它現在也受到所有亞洲國家歡迎。","question":"Our street food tapioca drinks have always been very popular, gaining popularity throughout Asia ①____________ ②____________.","answers":["as","well"],"explanation":"表「也」的片語若放句尾用as well","source":"龍騰自命題"},{"id":15,"zh":"追蹤氣味對於人類來說從來都不簡單。對狗而言，追蹤氣味只不過是平凡的事情。","question":"Tracking scents is never easy for human beings. But① ____________ ②____________ ③____________ of dogs, tracing a scent is very common behavior.","answers":["in","the","case"],"explanation":"表「就……而言」的片語用in the case of....（關於；在……的情況下）","source":"龍騰自命題"},{"id":16,"zh":"強颱正快速逼近。在這樣的情況下，這機場的所有國際航班目前都是取消的。","question":"The strong typhoon is fast approaching. ①____________ ②____________ ③____________, all the international flights at the airport have been are currently cancelled.","answers":["Under","the","circumstances"],"explanation":"表「在這種情況下」的片語用under the circumstances","source":"龍騰自命題"},{"id":17,"zh":"這家速食餐廳賣好吃到舔指頭的炸雞，所以在我們短暫停留該城鎮時，我們忍不住在那吃午餐跟晚餐。","question":"This fast-food restaurant sells finger-licking good fried chicken, so we ①____________ ②____________ stopping there for both lunch and dinner on our short stay in town.","answers":["couldn’t","help"],"explanation":"表「忍不住做……」且後接V-ing的句型用S + can’t help + V-ing....","source":"龍騰自命題"},{"id":18,"zh":"外送至少佔了我們全部生意的百分之六十。","question":"Food delivery ①____________ ②____________ at least 60% of our total business.","answers":["accounts","for"],"explanation":"","source":"三合一學習手冊"},{"id":19,"zh":"在這種情況下，經理無法接受這提議。","question":"The manager can’t accept the proposal ①____________ the ②____________.","answers":["under","circumstances"],"explanation":"","source":"三合一學習手冊"},{"id":20,"zh":"你可以在電視上看這個脫口秀，也可以在網飛上看。","question":"You can watch the talk show on television and on Netflix ①____________ ②____________.","answers":["as","well"],"explanation":"","source":"三合一學習手冊"},{"id":21,"zh":"除了不同句型之外，學生們還必須學習新單字以及如何使用它們。","question":"①____________ ②____________ different sentence patterns, the students have to learn new words and how to use them.","answers":["Aside","from"],"explanation":"","source":"三合一學習手冊"},{"id":22,"zh":"在實驗室裡，王老師的學生仔細地觀察他，然後照著做。","question":"In the lab, Mr. Wang’s students watched him carefully and then ①____________ ②____________.","answers":["followed","suit"],"explanation":"","source":"三合一學習手冊"},{"id":23,"zh":"Robert的女兒經常問他一些沒有簡單答案的問題。","question":"Robert’s daughter often asks him questions ①____________ ②____________ there are no easy answers.","answers":["to","which"],"explanation":"","source":"三合一學習手冊"},{"id":24,"zh":"國際學生佔這所大學學生人數的一半。","question":"International students ①____________ ②____________ half of the student population in the university.","answers":["account","for"],"explanation":"","source":"課本例句填空"},{"id":25,"zh":"班上所有的學生都喜歡Rita的報告。老師也對其評價很高。","question":"All the students in the class loved Rita’s presentation. The teacher thought highly of it ①____________ ②____________.","answers":["as","well"],"explanation":"","source":"課本例句填空"},{"id":26,"zh":"除了種類眾多的茶與咖啡，這家飲料店還提供新鮮的果汁和奶昔。","question":"①____________ ②____________ numerous teas and coffees, the drink shop also serves fresh juice and milkshakes.","answers":["Aside","from"],"explanation":"","source":"課本例句填空"},{"id":27,"zh":"Leanne開心度過野餐的一天，她喜愛所有的食物。最棒的是，她交了幾個新朋友。","question":"Leanne had a great day at the picnic and loved all the food. ①____________ ②____________ ③____________, she made several new friends.","answers":["Best","of","all"],"explanation":"","source":"課本例句填空"},{"id":28,"zh":"那件新夾克時髦，穿在妳身上好看。最棒的是，它不貴。","question":"The new jacket is stylish and looks good on you; ①____________ ②____________ ③____________, it’s not expensive.","answers":["best","of","all"],"explanation":"","source":"習作簿"},{"id":29,"zh":"根據一份官方報告，從日本進口的東西占去年全部稅收的百分之四十。","question":"According to an official report, imports from Japan ①____________ ②____________ 40% of last year’s total revenue.","answers":["accounted","for"],"explanation":"","source":"習作簿"},{"id":30,"zh":"除了新聞外，我還看探索頻道。對我來說，兩者都是很好的資訊來源。","question":"①____________ ②____________ the news, I watch the Discovery Channel ③____________ ④____________. To me, both are good sources of information.","answers":["Aside","from","as","well"],"explanation":"","source":"習作簿"},{"id":31,"zh":"國際學生只占我們學校學生的百分之十五。","question":"International students ①____________ ②____________ only 15 percent of the students in our school.","answers":["account","for"],"explanation":"","source":"All in One"},{"id":32,"zh":"除了是學校裡最聰明的學生外，Donald也是最棒的運動選手。","question":"①____________ ②____________ being the smartest student in the school, Donald is also the best athlete.","answers":["Aside","from"],"explanation":"","source":"All in One"},{"id":33,"zh":"吉娃娃的壽命大約是12至20年。而就黃金獵犬來說，牠們通常可以活12至15年。","question":"Chihuahuas have a lifespan of about twelve to twenty years. ①____________ ②____________ ③____________ ④____________ golden retrievers, they usually live around twelve to fifteen years.","answers":["In","the","case","of"],"explanation":"","source":"All in One"},{"id":34,"zh":"我們無線耳機已經因為創新還有聲音品質贏得許多國際大獎。最棒的是，現在它配有鮮艷顏色的水晶，讓它們成為時尚配件的必備品。","question":"Our wireless earphones have won numerous international awards for their innovation and sound quality. ①____________ ②____________ ③____________, they now come in bright colors with crystals, making them a fashion accessory necessity.","answers":["Best","of","all"],"explanation":"表「最棒地」的片語用best of all","source":"龍騰自命題"},{"id":35,"zh":"關於臺灣的天災，颱風與地震是最危險的。","question":"①____________ ②____________ ③____________ ④____________ natural disasters in Taiwan, typhoons and earthquakes are the most dangerous.","answers":["In","the","case","of"],"explanation":"","source":"三合一學習手冊"},{"id":36,"zh":"行動支付方便又快速，最棒地，它們幫你省下一些信用卡費用。","question":"Mobile payments are convenient and fast. ①____________ ②____________ ③____________, they help you save money on some credit card fees.","answers":["Best","of","all"],"explanation":"","source":"三合一學習手冊"},{"id":37,"zh":"突然吸到一些二手菸的煙味時，Clark太太忍不住咳了出來。","question":"Mrs. Clark ①____________ ②____________ ③____________ ④____________ when she suddenly breathed in some second-hand smoke.","answers":["couldn’t","help","but","cough"],"explanation":"","source":"三合一學習手冊"},{"id":38,"zh":"成年的公白犀牛重約2,300公斤。至於母獸，牠們的平均體重約1,700公斤。","question":"Adult male white rhinos weigh about 2,300 kg. ①____________ ②____________ ③____________ ④____________ females, their average body weight is around 1,700 kg.","answers":["In","the","case","of"],"explanation":"","source":"課本例句填空"},{"id":39,"zh":"Eric討厭向父母伸手要錢，但他無法負擔學費。在這種情況之下，他別無選擇。","question":"Eric hated asking his parents for money, but he couldn’t afford the tuition. ①____________ ②____________ ③____________, he had no other choice.","answers":["Under","the","circumstances"],"explanation":"","source":"課本例句填空"},{"id":40,"zh":"醫院病房裡一旦有一個嬰兒開始哭，其他的通常會跟著做，所以很快地他們全都會哭。","question":"Once a baby in the hospital room starts crying, the others usually ①____________ ②____________, so soon they’ll all be in tears.","answers":["follow","suit"],"explanation":"","source":"課本例句填空"},{"id":41,"zh":"Jay今年夏天要去英國讀書，而他最好的朋友也即將去國外讀書。","question":"Jay is going to study in the U.K. this summer, and his best friend is going to study abroad ①____________ ②____________.","answers":["as","well"],"explanation":"表「也」的片語若放句尾用as well","source":"龍騰自命題"},{"id":42,"zh":"巧克力對於各年齡層的人來說都是美食甜點。然而，就狗而言，這食物對他們來說是有劇毒的。","question":"Chocolate is a delicious treat for people of all ages. In ①____________ ②____________ of dogs, however, this food can be extremely poisonous.","answers":["the","case"],"explanation":"表「就……而言」的片語用in the case of....（關於；在……的情況下）","source":"龍騰自命題"},{"id":43,"zh":"不管我做什麼，我妹妹總是照著做，並做得一模一樣。","question":"Whatever I do, my younger sister will just ①____________ ②____________ and do exactly the same thing.","answers":["follow","suit"],"explanation":"表「照著做」的片語用follow suit","source":"龍騰自命題"},{"id":44,"zh":"當地球繞著太陽運行的這個理論第一次被提出時，並不為大眾所接受。","question":"①____________ ②____________ ③____________ the earth travels around the sun was not accepted by the public when it was first proposed.","answers":["The","theory","that"],"explanation":"","source":"三合一學習手冊"}];const $=s=>document.querySelector(s),list=$('#list'),select=$('#select'),quiz=$('#quiz'),result=$('#result'),question=$('#question'),answerArea=$('#answerArea'),feedback=$('#feedback'),next=$('#next');let chosen=[],idx=0,mode='first';const wrong=new Map(),correct=new Set();const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const nor
