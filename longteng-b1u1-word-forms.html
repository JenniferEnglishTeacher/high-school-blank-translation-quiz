  <script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 1｜詞類變化","mode":"fill","questions":[{"id":1,"question":"At the meeting, the marketing team ____________ (presentation) a good plan to attract more buyers.","answers":["presented"],"source":"All in One","explanation":"正確字詞為 presented，意思是「提交」；請將答案補入後朗讀完整例句。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":2,"question":"On Halloween, many American children enjoy the ____________ (tradition) custom of trick-or-treating.","answers":["traditional"],"source":"龍騰自命題","explanation":"在萬聖夜，許多美國小孩樂於參與不給糖就搗蛋的傳統習俗。考點句構：custom是名詞，前面應放形容詞來修飾，所以答案為traditional。","explanationSource":"source"},{"id":3,"question":"As the guest of honor, the old scholar was ____________ (presentation) with gifts.","answers":["presented"],"source":"龍騰自命題","explanation":"這位老學者以貴賓身分被授予了禮物。考點句構：被動語態（be + p.p.）。","explanationSource":"source"},{"id":4,"question":"Linda was surprised to see how tired she looked when she saw her ____________ (reflect) in the mirror.","answers":["reflection"],"source":"All in One","explanation":"正確字詞為 reflection，意思是「映出的影像」；請將答案補入後朗讀完整例句。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":5,"question":"We were very ____________(fortunately) to meet Taylor Swift at the Heathrow Airport in London.","answers":["fortunate"],"source":"龍騰自命題","explanation":"我們非常幸運在倫敦的希斯羅機場遇到Taylor Swift（泰勒絲）。考點句構：be + adj.。","explanationSource":"source"},{"id":6,"question":"Kim ____________ (memory) all the English words on the list in twenty minutes, but she forgot most of them just as quickly.","answers":["memorized"],"source":"All in One","explanation":"正確字詞為 memorized，意思是「記憶；記住」；請將答案補入後朗讀完整例句。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":7,"question":"Sara has been feeling ____________ (depress) lately, so I am going to visit her and try to cheer her up.","answers":["depressed"],"source":"All in One","explanation":"正確字詞為 depressed，意思是「沮喪的；消沉的」；請將答案補入後朗讀完整例句。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":8,"question":"My grandmother is ____________ (fortunately) to be in such good health at her age.","answers":["fortunate"],"source":"All in One","explanation":"正確字詞為 fortunate，意思是「幸運的」；請將答案補入後朗讀完整例句。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":9,"question":"Bill failed the English exam again, so he felt ____________(depressing) and could not help crying.","answers":["depressed"],"source":"龍騰自命題","explanation":"Bill又沒通過英文考試，所以他感到沮喪，忍不住哭了。考點句構：feel + 情狀形容詞，修飾人以過去分詞表示；修飾事物則以現在分詞表示。","explanationSource":"source"},{"id":10,"question":"It was ____________(embarrassed) for Yolanda to suddenly realize that she was wearing her uniform inside out.","answers":["embarrassing"],"source":"龍騰自命題","explanation":"Yolanda突然間發現她把制服穿反，這令她尷尬。考點句構：be + 情狀形容詞，修飾人以過去分詞表示；修飾事物則以現在分詞表示。","explanationSource":"source"},{"id":11,"question":"Candy is good at ____________(memory) people’s names. That is one reason why she has such good relationships with others.","answers":["memorizing"],"source":"龍騰自命題","explanation":"Candy很擅長記人們的名字。那就是她和其他人關係這麼好的原因之一。考點句構：介系詞後接動作時以V-ing接續。","explanationSource":"source"},{"id":12,"question":"Repeated failures ____________(upset) Jack so much that he wanted to give up, but his father encouraged him to hang on.","answers":["upset"],"source":"龍騰自命題","explanation":"一再的失敗使Jack難過到想放棄，但是他的爸爸鼓勵他堅持下去。","explanationSource":"source"},{"id":13,"question":"When the puppy saw itself ____________(reflection) in the mirror, it was surprised and started barking wildly.","answers":["reflected"],"source":"龍騰自命題","explanation":"當小狗看到鏡中映出的自己時，感到驚訝並開始瘋狂地吠叫。考點句構：感官動詞 + O + OC，此處OC為了要表達被動語態，所以以過去分詞作補語。","explanationSource":"source"},{"id":14,"question":"Before you make a ____________(reply), consider whether what you say will hurt anyone.","answers":["reply"],"source":"龍騰自命題","explanation":"在你回覆前，考慮一下你說的話是否會傷害任何人。","explanationSource":"source"},{"id":15,"question":"Jane was considered a terrible girl who would bring ____________(ruin) to the town, so no one wanted to spend time with her.","answers":["ruin"],"source":"龍騰自命題","explanation":"Jane被視為將帶給小鎮毀滅的可怕女孩，所以沒人想花時間與她在一起。","explanationSource":"source"}]};</script>
