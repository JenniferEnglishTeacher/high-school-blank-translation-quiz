<script>window.QUIZ_CONFIG={"title": "國中會考文法歷屆試題｜使役動詞", "mode": "mcq", "questions": [{"id": 1, "question": "The teacher ______ his students vacuum the floor of the classroom after the party.", "options": ["asked", "wanted", "found", "had"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜使役動詞 have + 人 + 原形動詞", "explanation": "【句型】使役動詞 have / make / let + 受詞 + 原形動詞（V）。\n【分析】受詞 his students 後面接原形動詞 vacuum，只有使役動詞 had 可以這樣用：老師叫學生派對後吸地板。\n【其他選項】(A) asked、(B) wanted 後面要接 to V（asked them to vacuum）；(C) found 後接 Ving 或形容詞（found them vacuuming）。\n【例句】My mom had me wash the dishes after dinner.", "explanationSource": "source"}, {"id": 2, "question": "Mr. Lin ______ his son clean the car last Sunday.", "options": ["told", "had", "wanted", "asked"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 1 題）", "explanation": "受詞後接原形 clean，用使役動詞 had。", "explanationSource": "supplemental"}, {"id": 3, "question": "The coach ______ the players run around the field ten times.", "options": ["made", "asked", "wanted", "told"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 1 題）", "explanation": "受詞後接原形 run，用使役動詞 made。", "explanationSource": "supplemental"}, {"id": 4, "question": "Ms. Wang ______ us to bring our dictionaries tomorrow.", "options": ["let", "had", "made", "asked"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 1 題）", "explanation": "受詞後接 to V，用 asked。", "explanationSource": "supplemental"}, {"id": 5, "question": "The teachers make us ______ harder by giving us tests.", "options": ["study", "studied", "to study", "studying"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜使役動詞 make + 人 + 原形動詞", "explanation": "【句型】make（使役動詞）+ 受詞 + 原形動詞＝讓/迫使某人做某事。\n【分析】make us 後面接原形動詞，所以用 study：老師用考試讓我們更用功念書。\n【其他選項】(B) studied 是過去式；(C) to study：主動的 make 後不接 to；(D) studying 不接在 make + 受詞後。\n【例句】The sad movie made my sister cry.", "explanationSource": "source"}, {"id": 6, "question": "The funny clown made all the children ______.", "options": ["laughing", "to laugh", "laugh", "laughed"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 5 題）", "explanation": "make + 受詞 + 原形動詞 laugh。", "explanationSource": "supplemental"}, {"id": 7, "question": "My parents let me ______ out with my friends on Saturday nights.", "options": ["go", "going", "to go", "went"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 5 題）", "explanation": "let + 受詞 + 原形動詞 go。", "explanationSource": "supplemental"}, {"id": 8, "question": "Mom had the repairman ______ the washing machine yesterday.", "options": ["fixing", "fix", "to fix", "fixes"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 5 題）", "explanation": "have + 人 + 原形動詞 fix。", "explanationSource": "supplemental"}, {"id": 9, "question": "Deborah put some sugar and cream in her coffee to make it ______ better.", "options": ["taste", "tasted", "tasting", "to taste"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜使役動詞 make + 物 + 原形動詞（連綴動詞 taste）", "explanation": "【句型】make + 受詞 + 原形動詞；taste + 形容詞/副詞比較級（better）＝嚐起來…。\n【分析】make it ___ 中 make 是使役動詞，後接原形動詞 taste：加糖和奶精讓咖啡「嚐起來」更好喝。\n【其他選項】(B) tasted：make 後不接過去式（咖啡不是「被嚐」）；(C) tasting、(D) to taste 都不能接在主動的 make + 受詞之後。\n【例句】Adding some lemon makes the fish taste fresher.", "explanationSource": "source"}, {"id": 10, "question": "This new haircut makes Ray ______ younger.", "options": ["looking", "look", "to look", "looks"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 9 題）", "explanation": "make + 受詞 + 原形動詞 look。", "explanationSource": "supplemental"}, {"id": 11, "question": "Opening the windows will make the room ______ less hot.", "options": ["feel", "felt", "feeling", "to feel"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 9 題）", "explanation": "make + 受詞 + 原形動詞 feel。", "explanationSource": "supplemental"}, {"id": 12, "question": "Some salt will make the soup ______ much better.", "options": ["tastes", "to taste", "tasting", "taste"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 9 題）", "explanation": "make + 受詞 + 原形動詞 taste。", "explanationSource": "supplemental"}, {"id": 13, "question": "Mrs. Wilson ______ her son wash the dishes after dinner.", "options": ["had", "told", "wanted", "invited"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜使役動詞 have + O + 原形V", "explanation": "【句型】使役動詞 have / make / let + 受詞 + 原形動詞。\n【分析】空格後是 her son + wash（原形動詞），只有使役動詞 had 可接「受詞＋原形V」，意為「叫兒子晚餐後洗碗」。\n【其他選項】(B) told、(C) wanted、(D) invited 後面都要接 O + to V（told her son to wash…），不能接原形動詞。\n【例句】Mr. Lin had the students clean the classroom.", "explanationSource": "source"}, {"id": 14, "question": "Ms. Chen ______ her students read the story aloud in class yesterday.", "options": ["asked", "had", "wanted", "told"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 13 題）", "explanation": "空格後接 her students + read（原形），只有使役動詞 had 可接「受詞＋原形V」。", "explanationSource": "supplemental"}, {"id": 15, "question": "Dad ______ me take out the trash every night.", "options": ["makes", "asks", "tells", "wants"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 13 題）", "explanation": "使役動詞 make + 受詞 + 原形V；asks / tells / wants 都要接 to V。", "explanationSource": "supplemental"}, {"id": 16, "question": "The coach ______ the players run around the field ten times this morning.", "options": ["told", "wanted", "had", "asked"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 13 題）", "explanation": "run 為原形動詞，只能搭配使役動詞 had（叫…做…）。", "explanationSource": "supplemental"}, {"id": 17, "question": "If I finish my homework before eight o'clock, my parents will let me ______ TV for one hour.", "options": ["watch", "watching", "to watch", "have watched"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜let + O + 原形V", "explanation": "【句型】let + 受詞 + 原形動詞（讓某人做某事）。\n【分析】let me 之後必須接原形動詞，故選 watch：「爸媽會讓我看一小時電視」。\n【其他選項】(B) watching 為 Ving；(C) to watch 為不定詞，let 後不加 to；(D) have watched 為完成式，不能放在受詞後。\n【例句】My mom let me go to the movies with Amy.", "explanationSource": "source"}, {"id": 18, "question": "Our teacher won't let us ______ our cell phones in class.", "options": ["using", "to use", "used", "use"], "answer": 3, "answerLabel": "D", "source": "類似題 1（對應第 17 題）", "explanation": "let + 受詞 + 原形V，故選 use。", "explanationSource": "supplemental"}, {"id": 19, "question": "Please let me ______ you with those heavy boxes.", "options": ["help", "to help", "helping", "helped"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 17 題）", "explanation": "let me 後接原形動詞 help。", "explanationSource": "supplemental"}, {"id": 20, "question": "Kevin's father let him ______ the new bike in the park last Sunday.", "options": ["to ride", "riding", "ride", "rode"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 17 題）", "explanation": "let 為使役動詞，受詞後接原形 ride，過去式由 let 表達。", "explanationSource": "supplemental"}, {"id": 21, "question": "My mother ______ me send a letter yesterday.", "options": ["asked", "had", "told", "wanted"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜使役動詞 have + O + 原形V", "explanation": "【句型】have + 受詞 + 原形動詞（叫某人去做某事）。\n【分析】空格後為 me + send（原形動詞），只有使役動詞 had 符合：「媽媽昨天叫我去寄一封信」。\n【其他選項】(A) asked、(C) told、(D) wanted 須接 O + to V（asked me to send），不能直接接原形。\n【例句】I had my brother turn off the lights.", "explanationSource": "source"}, {"id": 22, "question": "Grandma ______ me buy some eggs at the store this morning.", "options": ["wanted", "told", "had", "asked"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 21 題）", "explanation": "buy 為原形，只有使役動詞 had 可用。", "explanationSource": "supplemental"}, {"id": 23, "question": "Mr. Wu ______ Tina to close the windows before she left.", "options": ["told", "had", "made", "let"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 21 題）", "explanation": "空格後是 to close，只有 told 可接 O + to V；had / made / let 接原形V。", "explanationSource": "supplemental"}, {"id": 24, "question": "The manager ______ Leo fix the copy machine yesterday afternoon.", "options": ["wanted", "had", "asked", "hoped"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 21 題）", "explanation": "fix 為原形動詞，只有使役動詞 had 可接「受詞＋原形V」。", "explanationSource": "supplemental"}, {"id": 25, "question": "Jenny plays the piano very well. Her mother makes her ______ two hours every day.", "options": ["practice", "practiced", "practicing", "to practice"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜make + O + 原形V", "explanation": "【句型】make + 受詞 + 原形動詞（強迫／使某人做某事）。\n【分析】makes her 之後要接原形動詞 practice：「媽媽每天要她練兩小時」。\n【其他選項】(B) practiced 為過去式；(C) practicing 為 Ving；(D) to practice 為不定詞，主動語態的 make 後不加 to。\n【例句】The sad movie made me cry.", "explanationSource": "source"}, {"id": 26, "question": "The funny video made all of us ______ out loud.", "options": ["to laugh", "laughing", "laughed", "laugh"], "answer": 3, "answerLabel": "D", "source": "類似題 1（對應第 25 題）", "explanation": "make + 受詞 + 原形V，故選 laugh。", "explanationSource": "supplemental"}, {"id": 27, "question": "Our English teacher makes us ______ ten new words every week.", "options": ["learn", "to learn", "learning", "learned"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 25 題）", "explanation": "makes us 後接原形 learn。", "explanationSource": "supplemental"}, {"id": 28, "question": "Don't make your little sister ______ alone at home.", "options": ["to stay", "stay", "staying", "stayed"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 25 題）", "explanation": "使役動詞 make 後接受詞＋原形 stay。", "explanationSource": "supplemental"}]};</script><script src="longteng-b1u5-quiz.js?v=20261106-3"></script><script>document.querySelector("#description").textContent="共 28 題（會考歷屆＋講義錯題 7 題＋類似題 21 題）｜選答後顯示中文解析｜答錯可重做並下載錯題";</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
