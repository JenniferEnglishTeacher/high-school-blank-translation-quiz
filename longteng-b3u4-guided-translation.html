border-radius:9px;color:var(--amber);font-weight:800;margin-bottom:10px}.question{font-size:21px;font-weight:750;padding:16px;background:#f8fafc;border-radius:11px;white-space:pre-wrap}.options{display:grid;gap:9px;margin:14px 0}.option{display:flex;align-items:center;gap:11px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-size:18px;font-weight:750;cursor:pointer}.option:hover{border-color:#60a5fa;background:#eff6ff}.option:has(input:checked){border-color:var(--blue);background:#dbeafe;color:var(--navy)}.option input{width:20px;height:20px;accent-color:var(--blue)}.inputs{display:grid;gap:10px;margin:15px 0}.answer-row{display:grid;grid-template-columns:55px 1fr;gap:10px;align-items:center}.answer-row label{font-weight:900;color:var(--navy);text-align:center}.spell{width:100%;font:inherit;font-size:18px;padding:11px;border:2px solid #94a3b8;border-radius:9px}.feedback{padding:13px;border-radius:10px;font-weight:800;margin:13px 0}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.explain{font-weight:500;margin-top:7px}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:var(--voicebg);margin:13px 0}.voicebox b{display:block;font-size:19px;margin-bottom:8px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}.wrong p{margin:6px 0}.source{font-size:13px;color:var(--muted)}@media(max-width:600px){.wrap{padding:9px}.hero,.card{padding:15px}.question{font-size:18px;padding:13px}.option{font-size:17px}.answer-row{grid-template-columns:42px 1fr}.meta{display:block}}</style></head><body><main class="wrap"><section class="hero"><h1>龍騰普高 B3U4 引導式翻譯</h1><p>共 40 題。可自行選題、隨機抽題；答錯會顯示正確答案並要求重新作答。</p><p class="note">答對後會朗讀完整英文句子；完成後可重做錯題並下載 DOCX 錯題紀錄。</p><div class="toolbar"><a class="btn" href="dashboard.html">← 回測驗總覽</a></div></section><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn">全部選取</button><button id="none" class="btn">全部取消</button><button id="rand20" class="btn">隨機 20 題</button></div><label><input id="shuffle" type="checkbox"> 打亂出題順序</label><div id="list"></div><div class="actions"><button id="start" class="btn primary">開始作答</button><span id="picked" class="note"></span></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="voiceBox" class="voicebox hidden"><b id="voiceTarget"></b><button id="speak" class="btn voice">🔊 再聽一次</button></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="retry" class="btn primary">只重做錯題</button><button id="download" class="btn">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></main><script>const TITLE="龍騰普高 B3U4 引導式翻譯",MODE="multi",Q=[{"id":1,"zh":"在牠們消失之前，恐龍曾統治地球超過一億年。","question":"Before they ①____________ ②____________, dinosaurs had dominated the earth for more than 100 million years.","answers":["died","out"],"explanation":"","source":"All in One"},{"id":2,"zh":"隨著Mike上樓進到臥室，他的腳步聲逐漸消失。","question":"As Mike went upstairs and got into his bedroom, the sound of his footsteps slowly ①d____________ ②____________.","answers":["died","out"],"explanation":"die out逐漸消失","source":"龍騰自命題"},{"id":3,"zh":"隨著救護車駛離，它的警報聲也逐漸消失。","question":"The siren sound ①____________ ②o____________ as the ambulance drove off.","answers":["died","out"],"explanation":"die out逐漸消失","source":"龍騰自命題"},{"id":4,"zh":"大多數的旅行者偏好在旅行前訂好班機以及住宿。","question":"Most travelers prefer to book flights and accommodation well ①____________ ②____________ of their trip.","answers":["in","advance"],"explanation":"","source":"課本例句填空"},{"id":5,"zh":"寄送紙本聖誕節卡片的傳統逐漸消失，這是因為現在有許多人在社群媒體上傳遞節慶祝福。","question":"The custom of sending paper Christmas cards is ①____________ ②____________, as many people nowadays send holiday greetings on social media.","answers":["dying","out"],"explanation":"","source":"課本例句填空"},{"id":6,"zh":"因為Jason即將要去旅遊好幾個星期，他預付下個月的房租給他的房東。","question":"Because Jason was about to go traveling for several weeks, he paid his landlord the next month’s rent ①____________ ②____________.","answers":["in","advance"],"explanation":"","source":"課本例句填空"},{"id":7,"zh":"全球的人都想知道何時這個疾病才會終於消失。","question":"People around the globe are all wondering when the disease will eventually ①____________ ②____________.","answers":["die","out"],"explanation":"","source":"三合一學習手冊"},{"id":8,"zh":"這場音樂會是為了紀念那些在戰爭中喪生的人而舉辦。","question":"The concert was held ①____________ ②h____________ ③____________ those killed in the war.","answers":["in","honor","of"],"explanation":"","source":"三合一學習手冊"},{"id":9,"zh":"別再講那個鬼故事了。你把我嚇得要命。","question":"Stop telling that ghost story. You are ①____________ me ②____________ ③____________.","answers":["scaring","to","death"],"explanation":"","source":"三合一學習手冊"},{"id":10,"zh":"看牙醫前務必事先預約。","question":"Make sure you make an appointment ①____________ ②____________ before you see the dentist.","answers":["in","advance"],"explanation":"","source":"三合一學習手冊"},{"id":11,"zh":"房間的費用不僅包含電視上的電影而且還有早餐。","question":"The room fee includes breakfast ①____________ ②____________ ③____________ the movies on TV.","answers":["as","well","as"],"explanation":"","source":"三合一學習手冊"},{"id":12,"zh":"Bruno不看恐怖電影。光是看恐怖電影的想法都使他毛骨悚然。","question":"Bruno doesn’t watch horror movies. Even the thought of watching horror movies ①____________ his ②____________ ③____________ ④____________ ⑤____________.","answers":["makes","hair","stand","on","end"],"explanation":"","source":"三合一學習手冊"},{"id":13,"zh":"Brian被認為是這職位最有資格的候選人。","question":"Brian ①____________ ②____________ ③____________ ④____________ the most qualified candidate for this position.","answers":["is","thought","to","be"],"explanation":"","source":"三合一學習手冊"},{"id":14,"zh":"很多人寧願抱怨他們遭遇到的問題也不願設法想想如何解決。","question":"Many people ①____________ ②____________ complain about the problem they have encountered ③____________ try to figure out how to solve it.","answers":["would","rather","than"],"explanation":"","source":"三合一學習手冊"},{"id":15,"zh":"許多遊客喜歡到臺灣旅遊，這裡的人民很容易相處。","question":"Many tourists love to travel to Taiwan, ____________ people are easy to get along with.","answers":["where"],"explanation":"","source":"三合一學習手冊"},{"id":16,"zh":"Mike會待在印度直到月底。","question":"Mike ①____________ ②____________ in India ③t____________ the end of the month.","answers":["will","stay","till"],"explanation":"","source":"三合一學習手冊"},{"id":17,"zh":"如果你真的覺得很孤單，何不領養一隻寵物作伴？","question":"①____________ ②____________ adopt a pet to keep you company if you really feel lonely?","answers":["Why","not"],"explanation":"","source":"三合一學習手冊"},{"id":18,"zh":"我無法想像獨自一個人在森林過夜—這念頭把我嚇死了。","question":"I can’t imagine spending a night in a forest alone—the idea ①____________ me to ②____________.","answers":["scares","death"],"explanation":"","source":"All in One"},{"id":19,"zh":"當Daniel從灌木後突然出現並大叫我的名字時，把我嚇得要命。","question":"When Daniel popped out from behind the bush and shouted my name, it ①____________ me ②____________ ③____________.","answers":["scared","to","death"],"explanation":"","source":"課本例句填空"},{"id":20,"zh":"就在那時，Walter看到了一個從頭到腳穿著白色衣服的身影在黑暗中出現，使他毛骨悚然！","question":"Just then, Walter saw a figure dressed in white from head to toe come out of the dark. It ①____________ ②____________ ③____________ ④____________ ⑤____________ ⑥____________!","answers":["made","his","hair","stand","on","end"],"explanation":"","source":"課本例句填空"},{"id":21,"zh":"每年春天有一個大型的盛宴舉行以紀念大地之母。","question":"Every spring, a large feast is held ①____________ ②____________ ③____________ the earth goddess.","answers":["in","honor","of"],"explanation":"","source":"課本例句填空"},{"id":22,"zh":"政府豎立雕像來紀念那位犧牲生命拯救小孩的幼稚園老師。","question":"The government put up a statue ①____________ ②____________ ③____________ the kindergarten teacher who gave her life to save the young children.","answers":["in","honor","of"],"explanation":"","source":"All in One"},{"id":23,"zh":"設立這個紀念碑是為了要紀念那些為國犧牲的人。","question":"The monument was erected ①____________ ②h____________ ③____________ those who had sacrificed themselves for their country.","answers":["in","honor","of"],"explanation":"in honor of紀念","source":"龍騰自命題"},{"id":24,"zh":"這位富有的老人寧可把錢捐給慈善機構也不願留給他的子女們。","question":"This wealthy old man ①____________ ②____________ ③____________ all his money to charity ④____________ ⑤____________ it to his children.","answers":["would","rather","donate","than","leave"],"explanation":"此題考的是S + would rather...than...，would rather和than後面都要用原形動詞","source":"龍騰自命題"},{"id":25,"zh":"當清教徒在1620年首度抵達新大陸時，印地安人被相信曾經對他們伸出援手。","question":"The Indians are ①b____________ ②____________ ③____________ ④o____________ a helping hand to the Pilgrims in 1620 when the Pilgrims first arrived in the New World.","answers":["believed","to","have","offered"],"explanation":"此題考S + be + thought/said/believed + to VR/have + p.p.....的句型，句子所提到的為過去發生的事情，故are believed後面用 to have p.p.","source":"龍騰自命題"},{"id":26,"zh":"政府舉辦了一場典禮來紀念地震的受害者。","question":"The government held a ceremony ①____________ ②h____________ ③____________ the victims of the earthquake.","answers":["in","honor","of"],"explanation":"in honor of紀念","source":"龍騰自命題"},{"id":27,"zh":"據信，這位年輕紳士每個星期天都會去做禮拜。","question":"This young gentleman is ①b____________ ②____________ ③____________ to church every Sunday.","answers":["believed","to","go"],"explanation":"此題考S + be + thought/said/believed + to VR/have + p.p.....的句型，句子所提到的是當下的事實，故is said後面用 to VR","source":"龍騰自命題"},{"id":28,"zh":"Jean說她寧可一直餓著也不要在三更半夜出去找東西吃。","question":"Jean says that she ①____________ ②____________ ③____________ hungry ④____________ ⑤____________ out late at night to find food.","answers":["would","rather","stay","than","go"],"explanation":"此題考的是S + would rather...than...，would rather和than後面都要用原形動詞","source":"龍騰自命題"},{"id":29,"zh":"面對挑戰時，即使會失敗，我寧可竭盡所能，也不願什麼都不做而等待失敗。","question":"Faced with a challenge, I ①____________ ②____________ try my best even if I fail ③____________ do nothing and wait for failure.","answers":["would","rather","than"],"explanation":"此題考的是S + would rather...than...，表「寧可……也不願……」","source":"龍騰自命題"},{"id":30,"zh":"Peter被認為是全社區最小氣的人；換句話說，他被視為吝嗇鬼。","question":"Peter is ①t____________ ②____________ ③____________ the stingiest person in the community; in other words, he is recognized as a miser.","answers":["thought","to","be"],"explanation":"此題考S + be + thought/said/believed + to VR/have + p.p.....的句型，句子所提到的是當下的事實，故is thought後面用 to VR","source":"龍騰自命題"},{"id":31,"zh":"在颱風即將來襲時，預先採取保護措施是有效的災難預防方式。","question":"Adopting protective measures ①____________ ②____________ is an effective method of disaster prevention when a typhoon is approaching.","answers":["in","advance"],"explanation":"in advance 事先","source":"龍騰自命題"},{"id":32,"zh":"這位導演據說在她二十多歲時曾經當過空服員。","question":"The director is ①s____________ ②____________ ③____________ ④____________ a flight attendant in her twenties.","answers":["said","to","have","been"],"explanation":"此題考S + be + thought/said/believed + to VR/have + p.p.....的句型，句子所提到的為過去發生的事情，故is said後面用 to have p.p.","source":"龍騰自命題"},{"id":33,"zh":"Owen態度積極；他寧可面對失敗並從中學習，而不願被失敗擊倒。","question":"Owen has a positive attitude; he ①____________ ②____________ face failures and learn from them ③____________ ④b____________ defeated by them.","answers":["would","rather","than","be"],"explanation":"此題考的是S + would rather...than...，would rather和than後面都要用原形動詞","source":"龍騰自命題"},{"id":34,"zh":"這位企業家為紀念他已故的母親設立了一個非營利的組織，目的是幫助孤兒。","question":"The entrepreneur established a nonprofit organization aimed at helping orphans ①____________ ②h____________ ③____________ his deceased mother.","answers":["in","honor","of"],"explanation":"in honor of紀念","source":"龍騰自命題"},{"id":35,"zh":"如果你打算去拜訪朋友的話，事先通知比較有禮貌。","question":"It is polite to inform your friend ①____________ ②____________ if you plan to pay him or her a visit.","answers":["in","advance"],"explanation":"in advance事先","source":"龍騰自命題"},{"id":36,"zh":"我半夜被持續不斷的吱吱聲吵醒。這聲音讓我毛骨悚然。","question":"I was woken up by repeated squeaking sounds around midnight. The sounds ①____________ my ②____________ ③____________ ④____________ ⑤____________.","answers":["made","hair","stand","on","end"],"explanation":"make one’s hair stand on end使人毛骨悚然","source":"龍騰自命題"},{"id":37,"zh":"一輛摩托車從後方高速接近，並且差點撞到我。這真是把我給嚇得要命。","question":"A motorcycle approached me from behind at high speed and almost hit me. It ①____________ me ②____________ ③____________.","answers":["scared","to","death"],"explanation":"scare...to death把……嚇得要命","source":"龍騰自命題"},{"id":38,"zh":"一隻惡狗突然跑向Mandy並差點咬了她，這把她嚇得要命。","question":"When a fierce dog suddenly ran toward Mandy and almost bit her, it ①____________ her ②____________ ③____________.","answers":["scared","to","death"],"explanation":"scare...to death把……嚇得要命","source":"龍騰自命題"},{"id":39,"zh":"我寧可花更多時間陪家人，也不願賺更多錢但要住在離他們很遠的地方。","question":"I ①____________ ②____________ ③____________ more time with my family ④____________ make more money but live far away from them.","answers":["would","rather","spend","than"],"explanation":"此題考的是S + would rather...than...，would rather和than後面都要用原形動詞","source":"龍騰自命題"},{"id":40,"zh":"如果你提早一個月訂票，可以獲得10%的折扣。","question":"You can get a 10% discount if you book the tickets a month ①____________ ②____________.","answers":["in","advance"],"explanation":"in advance事先","source":"龍騰自命題"}];const $=s=>document.querySelector(s),list=$('#list'),select=$('#select'),quiz=$('#quiz'),result=$('#result'),question=$('#question'),answerArea=$('#answerArea'),feedback=$('#feedback'),next=$('#next');let chosen=[],idx=0,mode='first';const wrong=new Map(),correct=new Set();const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ');const shuffled=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function renderList(){list.innerHTML=Q.map(q=>'<label class="pick"><input class="pickbox" type="checkbox" value="'+q.id+'" checked><b>第 '+q.id+' 題</b> <span class="source">'+esc(q.source||'')+'</span></label>').join('');count()}function count(){$('#picked').textContent='已選 '+document.querySelectorAll('.pickbox:checked').length+' 題'}list.addEventListener('change',count);$('#all').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=true);count()};$('#none').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=false);count()};$('#rand20').onclick=()=>{let ids=new Set(shuffled(Q).slice(0,Math.min(20,Q.length)).map(q=>q.id));document.querySelectorAll('.pickbox').forEach(x=>x.checked=ids.has(+x.value));count()};$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));if($('#shuffle').checked)chosen=shuffled(chosen);idx=0;mode='first';wrong.clear();correct.clear();select.classList.add('hidden');result.classList.add('hidden');quiz.classList.remove('hidden');show()};function show(){const q=chosen[idx];speechSynthesis?.cancel();$('#meta').textContent=(mode==='retry'?'錯題重做｜':'')+'第 '+(idx+1)+' / '+chosen.length+' 題';$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';$('#bar').style.width=(idx+1)/chosen.length*100+'%';question.textContent=q.question;const zh=$('#zh');if(q.zh){zh.textContent=q.zh;zh.classList.remove('hidden')}else zh.classList.add('hidden');feedback.className='feedback hidden';$('#voiceBox').classList.add('hidden');$('#check').classList.remove('hidden');next.classList.add('hidden');if(MODE==='mcq')answerArea.innerHTML='<div class="options">'+q.options.map((o,i)=>'<label class="option"><input type="radio" name="answer" value="'+i+'"><b>'+String.fromCharCode(65+i)+'.</b> '+esc(o)+'</label>').join('')+'</div>';else answerArea.innerHTML='<div class="inputs">'+q.answers.map((_,i)=>'<div class="answer-row"><label>'+(MODE==='multi'?['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'][i]:'答案')+'</label><input class="spell" autocomplete="off" spellcheck="false" placeholder="請輸入完整答案"></div>').join('')+'</div>';setTimeout(()=>answerArea.querySelector('input')?.focus(),0)}function currentAnswers(){if(MODE==='mcq'){const x=answerArea.querySelector('input:checked');return x?[+x.value]:[]}return [...answerArea.querySelectorAll('.spell')].map(x=>x.value)}function correctText(q){return MODE==='mcq'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.answers.map(a=>a.split('||')[0]).join(' / ')}function isCorrect(q,a){return MODE==='mcq'?a[0]===q.answer:a.every((x,i)=>q.answers[i].split(/\|\||\//).some(v=>norm(x)===norm(v)))}function completedSentence(q){if(MODE==='mcq')return q.question.replace(/_{3,}/,q.options[q.answer]);if(MODE==='spell')return q.question.replace(/[A-Za-z]?_{3,}[A-Za-z]?/,q.answers[0].split('||')[0]);let s=q.question,marks=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];q.answers.forEach((a,i)=>{let value=a.split('||')[0];let re=new RegExp(marks[i]+'[A-Za-z]?_{3,}[A-Za-z]?');if(re.test(s))s=s.replace(re,value);else s=s.replace(/_{3,}/,value)});return s.replace(/[①-⑩]/g,'')}function speak(){if(!speechSynthesis)return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance($('#voiceTarget').textContent);u.lang='en-US';u.rate=.86;speechSynthesis.speak(u)}$('#speak').onclick=speak;$('#check').onclick=()=>{const q=chosen[idx],a=currentAnswers();if((MODE==='mcq'&&!a.length)||(MODE!=='mcq'&&(a.length!==q.answers.length||a.some(x=>!x.trim()))))return alert('請完成所有答案。');if(isCorrect(q,a)){correct.add(q.id);feedback.className='feedback ok';feedback.innerHTML='✅ 全部正確！'+(q.explanation?'<div class="explain">解析：'+esc(q.explanation)+'</div>':'');$('#check').classList.add('hidden');next.classList.remove('hidden');$('#voiceTarget').textContent=completedSentence(q);$('#voiceBox').classList.remove('hidden');speak()}else{if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(MODE==='mcq'?String.fromCharCode(65+a[0]):a.join(' / '));$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';feedback.className='feedback bad';feedback.innerHTML='❌ 答案不正確。正確答案：<strong>'+esc(correctText(q))+'</strong><br>請重新作答。'+(q.explanation?'<div class="explain">解析：'+esc(q.explanation)+'</div>':'');if(MODE==='mcq')answerArea.querySelectorAll('input').forEach(x=>x.checked=false);else answerArea.querySelectorAll('.spell').forEach(x=>x.value='');answerArea.querySelector('input')?.focus()}};next.onclick=()=>{idx++;idx>=chosen.length?finish():show()};$('#finish').onclick=finish;function finish(){speechSynthesis?.cancel();quiz.classList.add('hidden');result.classList.remove('hidden');$('#summary').innerHTML='<div class="stat">本輪題數<b>'+chosen.length+'</b></div><div class="stat">完成答對<b>'+correct.size+'</b></div><div class="stat">曾答錯<b>'+wrong.size+'</b></div>';$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>'<div class="wrong"><b>'+(i+1)+'. 第 '+r.q.id+' 題</b><p>'+esc((r.q.zh?r.q.zh+'\n':'')+r.q.question)+'</p><p><strong>錯誤答案：</strong>'+r.attempts.map(esc).join('；')+'</p><p><strong>正確答案：</strong>'+esc(correctText(r.q))+'</p>'+(r.q.explanation?'<p><strong>解析：</strong>'+esc(r.q.explanation)+'</p>':'')+'</div>').join(''):'<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size);$('#retry').classList.toggle('hidden',!wrong.size)}$('#retry').onclick=()=>{chosen=[...wrong.values()].map(x=>x.q);idx=0;mode='retry';correct.clear();result.classList.add('hidden');quiz.classList.remove('hidden');show()};$('#restart').onclick=()=>location.reload();$('#download').onclick=async()=>{if(!wrong.size)return;try{if(!window.docx)await new Promise((ok,fail)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js';s.onload=ok;s.onerror=fail;document.head.append(s)});let{Document,Packer,Paragraph,TextRun,HeadingLevel}=window.docx,children=[new Paragraph({text:TITLE+' 錯題紀錄',heading:HeadingLevel.TITLE})];for(const [_,r] of wrong){children.push(new Paragraph({children:[new TextRun({text:'第 '+r.q.id+' 題',bold:true})]}));if(r.q.zh)children.push(new Paragraph(r.q.zh));children.push(new Paragraph(r.q.question),new Paragraph('錯誤答案：'+r.attempts.join('；')),new Paragraph('正確答案：'+correctText(r.q)));if(r.q.explanation)children.push(new Paragraph('解析：'+r.q.explanation));children.push(new Paragraph('重新作答：________________________________________'))}let blob=await Packer.toBlob(new Document({sections:[{children}]})),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=TITLE+'_錯題.docx';a.click();URL.revokeObjectURL(url)}catch(e){let text=[...wrong.values()].map(r=>'第 '+r.q.id+' 題\n'+(r.q.zh?r.q.zh+'\n':'')+r.q.question+'\n錯誤答案：'+r.attempts.join('；')+'\n正確答案：'+correctText(r.q)+(r.q.explanation?'\n解析：'+r.q.explanation:'')).join('\n\n');let blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=TITLE+'_錯題.txt';a.click();URL.revokeObjectURL(url)}};renderList();</script></body></html>
