  <script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 3｜單字選擇","mode":"mcq","questions":[{"id":1,"question":"Many people are curious about how the sailors could ____________ on a remote island with little food and water.","options":["impress","amaze","survive","awake"],"answer":2,"source":"龍騰自命題","explanation":"許多人很好奇那些水手如何在幾乎沒有食物和水的情況下，在那個偏遠的島上生存。　(A)使人留下深刻印象　(B)使人驚奇　(C)生存；倖存　(D)醒來；喚醒","explanationSource":"source"},{"id":2,"question":"We all think of Anthony as a(n) ____________ in art because he really knows a lot about it.","options":["survival","expert","creature","impression"],"answer":1,"source":"龍騰自命題","explanation":"我們都認為Anthony是個藝術方面的專家，因為他真的很懂藝術。　(A)生存；倖存　(B)專家；行家　(C)生物　(D)印象","explanationSource":"source"},{"id":3,"question":"This large store provides ____________ daily necessities for customers to choose from, and that’s why it’s always so crowded.","options":["various","awake","distant","average"],"answer":0,"source":"龍騰自命題","explanation":"這間大型商店提供了各式各樣的日常必需品給顧客選擇，那就是它為什麼總是客滿的原因。　(A)各式各樣的　(B)醒著的　(C)遙遠的　(D)平均的","explanationSource":"source"},{"id":4,"question":"Due to a strong typhoon, our ____________ to Japan has been canceled, and we’re still waiting for further notice.","options":["distance","surface","variety","flight"],"answer":3,"source":"龍騰自命題","explanation":"由於一個強烈颱風，我們到日本的航班已經被取消，而我們還在等待更進一步的通知。　(A)距離　(B)（水、地板等）表面　(C)多種樣式、變化　(D)航班","explanationSource":"source"},{"id":5,"question":"Jordan was surprised to learn that some kinds of birds can sleep while in ____________ in the sky.","options":["distance","average","flight","surface"],"answer":2,"source":"龍騰自命題","explanation":"Jordan驚訝的知道有些種類的鳥能夠在空中飛行時睡覺。　(A)距離　(B)平均　(C)飛行　(D)（水、地板等）表面","explanationSource":"source"},{"id":6,"question":"The ____________ from my home to the nearest MRT station is about one kilometer.","options":["breath","distance","surface","average"],"answer":1,"source":"龍騰自命題","explanation":"從我家到最近捷運站的距離大約是一公里。　(A)呼吸的氣息　(B)距離　(C)（水、地板等）表面　(D)平均","explanationSource":"source"},{"id":7,"question":"At the job interview, Ryan ____________ the manager with his excellent communication skills and years of practical experience.","options":["impressed","breathed","survived","awoke"],"answer":0,"source":"龍騰自命題","explanation":"在這次工作面試中，Ryan以他絕佳的溝通技巧與多年的實務經驗而使那位經理留下深刻印象。　(A)使人留下深刻印象　(B)呼吸　(C)生存；倖存　(D)醒來；喚醒","explanationSource":"source"},{"id":8,"question":"As we all know, Taipei 101 is a(n) ____________ building which attracts many tourists every day.","options":["distant","average","awake","impressive"],"answer":3,"source":"龍騰自命題","explanation":"正如我們都知道的，臺北101是一棟令人印象深刻的建築物，每天吸引許多觀光客。　(A)遙遠的　(B)平均的　(C)醒著的　(D)令人印象深刻的","explanationSource":"source"},{"id":9,"question":"When Sandy got home after work at midnight, she walked into her room quietly in order not to ____________ her parents.","options":["breathe","float","awake","wonder"],"answer":2,"source":"龍騰自命題","explanation":"當Sandy半夜下班回到家時，她靜悄悄地走進她房間，以便不吵醒她父母。　(A)呼吸　(B)漂浮　(C)喚醒　(D)想知道","explanationSource":"source"},{"id":10,"question":"Lisa and her husband had a wonderful time taking a walk and ____________ the fresh air in the forest.","options":["awaking","breathing","surviving","impressing"],"answer":1,"source":"龍騰自命題","explanation":"Lisa與她丈夫愉快地在森林裡散步並且呼吸新鮮空氣。　(A)醒來；喚醒　(B)呼吸　(C)生存；倖存　(D)使人留下深刻印象","explanationSource":"source"},{"id":11,"question":"There are several small boats ____________ on the sea, and one of them belongs to my uncle.","options":["floating","avoiding","amazing","wondering"],"answer":0,"source":"龍騰自命題","explanation":"有好幾艘小船漂浮在海上，而其中一艘屬於我伯父。　(A)漂浮　(B)避免　(C)使人驚奇　(D)想知道","explanationSource":"source"},{"id":12,"question":"My grandfather has a habit of ____________ for about thirty minutes after having lunch to refresh himself.","options":["awaking","amazing","surviving","napping"],"answer":3,"source":"龍騰自命題","explanation":"我爺爺習慣在吃完午餐後小睡大約三十分鐘以恢復自己精神。　(A)醒來；喚醒　(B)使人驚奇　(C)生存；倖存　(D)小睡","explanationSource":"source"},{"id":13,"question":"For the ____________ person, earning ten million dollars a year is something he or she can only dream of.","options":["awake","distant","average","impressive"],"answer":2,"source":"龍騰自命題","explanation":"對於普通人而言，一年賺一千萬元是一件他或她只能夢想的事。　(A)醒著的　(B)遙遠的　(C)一般的；普通的　(D)令人印象深刻的","explanationSource":"source"},{"id":14,"question":"Adam is lazy and seldom studies hard, so he always scores below ____________ on the exams.","options":["breath","average","distance","journey"],"answer":1,"source":"龍騰自命題","explanation":"Adam懶惰而且幾乎不認真讀書，所以他考試的分數總是低於平均。　(A)呼吸的氣息　(B)平均　(C)距離　(D)旅行","explanationSource":"source"},{"id":15,"question":"The magician ____________ the audience members by making a pretty woman in front of them suddenly disappear.","options":["amazed","wondered","survived","avoided"],"answer":0,"source":"龍騰自命題","explanation":"那位魔術師讓一位在觀眾面前的美女突然消失而使他們感到驚奇。　(A)使人驚奇　(B)想知道　(C)生存；倖存　(D)避免","explanationSource":"source"},{"id":16,"question":"I plan to go on a ____________ to Australia with my family next month.","options":["surface","journey","survival","creature"],"answer":1,"source":"龍騰自命題","explanation":"我計畫下個月和家人到澳洲旅行。go on a journey 去旅行　(A)表面　(B)旅行　(C)生存　(D)生物","explanationSource":"source"},{"id":17,"question":"Parents should teach their children road safety, thus helping them to ____________ road accidents.","options":["wonder","amaze","avoid","breathe"],"answer":2,"source":"龍騰自命題","explanation":"父母親應該教導自己的孩子道路安全，如此能幫助他們避免車禍。　(A)想知道　(B)使人驚奇　(C)避免　(D)呼吸","explanationSource":"source"},{"id":18,"question":"I ____________ why Kevin looks so sad. Something must have happened.","options":["wonder","avoid","impress","awake"],"answer":0,"source":"龍騰自命題","explanation":"我在想為什麼Kevin看起來如此哀傷。一定有什麼事發生了。　(A)想知道　(B)避免　(C)使人留下深刻印象　(D)醒來","explanationSource":"source"},{"id":19,"question":"My older brother is going to study in a ____________ school, one which is really far away from our house.","options":["personal","similar","various","distant"],"answer":3,"source":"龍騰自命題","explanation":"我哥哥即將要到一間遙遠的學校就讀，這所學校真的離我們家很遠。　(A)個人的　(B)相似的　(C)各式各樣的　(D)遙遠的","explanationSource":"source"},{"id":20,"question":"After a long walk, Peter sat under the tree and took a ____________ so he would have more energy to continue his trip.","options":["distance","flight","nap","surface"],"answer":2,"source":"龍騰自命題","explanation":"在走了長長的一段路後，Peter坐在樹下小睡片刻才能有更多精力繼續他的旅程。take a nap 小睡一下  take a flight 坐飛機　(A)距離　(B)飛行　(C)小睡　(D)表面","explanationSource":"source"},{"id":21,"question":"The train was moving at a(n) ____________ speed of 130 kilometers per hour.","options":["awake","average","various","scientific"],"answer":1,"source":"龍騰自命題","explanation":"這輛火車正以平均每小時130公里的速度移動。　(A)醒著的　(B)平均的　(C)各式各樣的　(D)科學的","explanationSource":"source"},{"id":22,"question":"Her confidence helped her to make a great first ____________ on her interviewers.","options":["journey","average","distance","impression"],"answer":3,"source":"龍騰自命題","explanation":"她的自信幫助她在口試官面前留下很好的第一印象。　(A)旅行　(B)平均　(C)距離　(D)印象","explanationSource":"source"},{"id":23,"question":"Turtles in the pond are coming to the ____________ of the water in order to feed.","options":["variety","average","distance","surface"],"answer":3,"source":"龍騰自命題","explanation":"池塘裡的烏龜都游到水面吃東西。　(A)各式各樣　(B)平均　(C)距離　(D)表面","explanationSource":"source"},{"id":24,"question":"People all around the world enjoy drinking coffee, but its taste may ____________ from place to place.","options":["vary","wonder","float","journey"],"answer":0,"source":"龍騰自命題","explanation":"世界各地的人都喜歡喝咖啡，但是咖啡的口味也許會因地而異。vary from place to place 因地而異　(A)變化　(B)想知道　(C)漂浮　(D)旅行","explanationSource":"source"},{"id":25,"question":"Human beings should respect all living ____________ and be responsible for protecting our environment.","options":["journeys","guides","flights","creatures"],"answer":3,"source":"龍騰自命題","explanation":"人類應該尊敬所有的生物，並負起保護環境的責任。living creature 生物　(A)旅行　(B)嚮導　(C)航班　(D)生物","explanationSource":"source"},{"id":26,"question":"After running the whole way to catch the bus, Joe could hardly catch his ____________ .","options":["distance","average","breath","journey"],"answer":2,"source":"龍騰自命題","explanation":"跑了整條路追公車後，Joe幾乎上氣不接下氣。catch one’s breath 喘氣　(A)距離　(B)平均　(C)呼吸　(D)旅行","explanationSource":"source"},{"id":27,"question":"Two coats of fur and a thick layer of fat equip polar bears for ____________ throughout the harsh weather.","options":["variety","breath","impression","survival"],"answer":3,"source":"龍騰自命題","explanation":"兩層皮毛和一層厚厚的脂肪讓北極熊能在嚴酷的天氣中存活下來。　(A)各式各樣　(B)呼吸　(C)印象　(D)生存","explanationSource":"source"},{"id":28,"question":"It is ____________ that the silk of the spider’s web is tougher and stronger than steel.","options":["average","distant","embarrassing","amazing"],"answer":3,"source":"龍騰自命題","explanation":"蜘蛛絲比鋼鐵還要堅韌真是令人大感驚奇。It is amazing that... 令人訝異　(A)平均的　(B)遙遠的　(C)令人尷尬的　(D)令人大感驚奇的","explanationSource":"source"},{"id":29,"question":"Joan was wide ____________ all night, worrying about the speech contest to be held the next morning.","options":["various","awake","distant","average"],"answer":1,"source":"龍騰自命題","explanation":"Joan整夜十分清醒，擔心隔天早上舉辦的演講比賽。wide awake 十分清醒　(A)各式各樣的　(B)清醒的　(C)遙遠的　(D)平均的","explanationSource":"source"},{"id":30,"question":"To make sure you get enough vitamins, your diet should include a ____________ of fruits and vegetables.","options":["variety","surface","creature","breath"],"answer":0,"source":"龍騰自命題","explanation":"為了確保你得到足夠的維他命，你的飲食應該包括各式各樣的水果和蔬菜。　(A)多種樣式、變化　(B)表面　(C)生物　(D)呼吸的氣息","explanationSource":"source"}]};</script>
