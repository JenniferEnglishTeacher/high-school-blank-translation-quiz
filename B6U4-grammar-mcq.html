const TITLE="翰林 Book 6 Unit 4 文法選擇",KIND="mcq",Q=[{"id": 1, "stem": "(   ) I like cats ______ have long and pretty hair.", "options": ["what", "which", "where", "whose"], "answer": 1, "explanation": "先行詞 cats 為主詞，所以用關代 which。", "full": "I like cats which have long and pretty hair.", "src": 1}, {"id": 2, "stem": "(   ) Students ______ to go on the school trip should ask their parents first.〔113.會考〕", "options": ["who want", "want", "who they want", "what they want"], "answer": 0, "explanation": "由關係代名詞 who 來表示那些想要參加學校旅行的學生，所以答案為(Ａ)。(Ｂ)該句存在兩個動詞，不符合英文文法(Ｃ) who 用來指前方的先行詞 students，已為主詞，所以應刪去 they (Ｄ)先行詞 students 的關係代名詞應使用 who，並刪去 they。", "full": "Students who want to go on the school trip should ask their parents first.", "src": 2}, {"id": 3, "stem": "(   ) Scott wasn’t sure if the young woman before him was ______ pulled him out of a car on fire.〔112.會考〕", "options": ["who", "the one", "the one she", "the one who"], "answer": 3, "explanation": "the one 是 if 子句中的主詞（the young woman）補語，同時做為關係子句（who pulled him out of a car on fire）的先行詞，所以選(Ｄ)。", "full": "Scott wasn’t sure if the young woman before him was the one who pulled him out of a car on fire.", "src": 3}, {"id": 4, "stem": "(   ) Sandy: Do you know ______ Miss Lin asks us to use English? Jim: Because it’s a language ______ helps us get to know more about the world.", "options": ["whether; ×", "why; that", "why; ×", "how; which"], "answer": 1, "explanation": "Jim 回答「因為…」可推知 Sandy 以 why 引導的名詞子句詢問原因；用關係代名詞 that / which 代替先行詞 language，作為 helps us... 的主詞，關係代名詞不可省略。", "full": "Sandy: Do you know why Miss Lin asks us to use English? Jim: Because it’s a language that helps us get to know more about the world.", "src": 4}, {"id": 5, "stem": "(   ) Do you know the singer ______ songs are popular with many young people?", "options": ["which", "that", "when", "whose"], "answer": 3, "explanation": "關代所有格 whose＋名詞（songs）。", "full": "Do you know the singer whose songs are popular with many young people?", "src": 5}, {"id": 6, "stem": "(   ) The classes ______ by the language school were so popular that it was not easy to get a seat.", "options": ["offering", "which offered", "that / which were offered", "that were offering"], "answer": 2, "explanation": "用關係代名詞 which / that 代替先行詞 the classes＋被動語態（be＋p.p.）。關係代名詞＋be 可同時省略，故選(Ｃ) offered。", "full": "The classes that / which were offered by the language school were so popular that it was not easy to get a seat.", "src": 6}, {"id": 7, "stem": "(   ) It broke Rex’s heart to find out ______ his dear son died in the earthquake.〔112.會考陸考〕", "options": ["that", "what", "which", "who"], "answer": 0, "explanation": "that 引導名詞子句當動詞 find out 的受詞，(Ｂ)(Ｃ)(Ｄ)選項均有字義，放入句中語意不通順，所以選(Ａ)。", "full": "It broke Rex’s heart to find out that his dear son died in the earthquake.", "src": 7}, {"id": 8, "stem": "(   ) The young man ______ long legs does not feel like dancing with the short woman ______ blue.", "options": ["in; in", "with; with", "in; with", "with; in"], "answer": 3, "explanation": "名詞＋with...：有…的～；名詞＋in 顏色：穿…色的～。", "full": "The young man with long legs does not feel like dancing with the short woman in blue.", "src": 8}, {"id": 9, "stem": "(   ) We are not sure ______ the train will arrive on time.", "options": ["that", "why", "when", "whether"], "answer": 3, "explanation": "我們不確定火車「是否」準時到達。", "full": "We are not sure whether the train will arrive on time.", "src": 9}, {"id": 10, "stem": "(   ) In my class, Sally is the only student ______ is interested in reading science books.", "options": ["who", "what", "which", "whose"], "answer": 0, "explanation": "先行詞含有 the only＋人，傳統文法關係代名詞只能用 that，但現今文法也可用 who。", "full": "In my class, Sally is the only student who is interested in reading science books.", "src": 10}, {"id": 11, "stem": "(   ) Alice learned from the TV news ______ Nora Jones was coming to Taiwan the next day.〔97.基測Ⅰ〕", "options": ["that", "where", "which", "whether"], "answer": 0, "explanation": "Alice 從電視新聞獲悉「一件事」，此件事就由連接詞 that 引導出名詞子句當動詞 learned 的「受詞」。(Ｄ)是否。", "full": "Alice learned from the TV news that Nora Jones was coming to Taiwan the next day.", "src": 11}, {"id": 12, "stem": "(   ) I’d like to know ______ you want to go shopping with me or not.", "options": ["if", "that", "why", "when"], "answer": 0, "explanation": "現今文法，可用 whether / if... or not（是否…）。", "full": "I’d like to know if you want to go shopping with me or not.", "src": 12}, {"id": 13, "stem": "(   ) Jacky would like to bring that poor dog back home, but he isn’t sure ______ his mother likes dogs.〔95.基測Ⅰ〕", "options": ["how", "what", "whether", "which"], "answer": 2, "explanation": "Jacky 想要把那隻可憐的狗狗帶回家，但是他不確定他媽媽「是否」喜歡狗。", "full": "Jacky would like to bring that poor dog back home, but he isn’t sure whether his mother likes dogs.", "src": 13}, {"id": 14, "stem": "(   ) Do you know ______ our new class leader is? It’s Amanda!", "options": ["who", "what", "which", "that"], "answer": 0, "explanation": "你知道我們新班長是「誰」嗎？是 Amanda！", "full": "Do you know who our new class leader is? It’s Amanda!", "src": 14}, {"id": 15, "stem": "(   ) Brian doesn’t know ______ he can finish all the work by 5 p.m. He has too many reports to write.", "options": ["if", "where", "that", "when"], "answer": 0, "explanation": "正確答案：if", "full": "Brian doesn’t know if he can finish all the work by 5 p.m. He has too many reports to write.", "src": 15}, {"id": 16, "stem": "(   ) The woman ______ on the cellphone ______ long legs.", "options": ["is talking; which has", "that is talking; that has", "who is talking; has", "is talking; has"], "answer": 2, "explanation": "第一空格為「關係子句」，可用 who / that is talking，形成「正在講手機的」那女士，第二空格則是主要動詞，用單數動詞即可。", "full": "The woman who is talking on the cellphone has long legs.", "src": 16}, {"id": 17, "stem": "(   ) I was surprised to know from the newspaper yesterday ______ flowers do not always smell sweet; some can smell like dead fish.〔102.基測〕", "options": ["that", "when", "where", "which"], "answer": 0, "explanation": "昨天我很驚訝地從報紙得知「並非所有的花都聞起來很芳香；有些聞起來像死魚呢。」，選由連接詞 that 引導的「名詞子句」，當作動詞 know 的受詞。", "full": "I was surprised to know from the newspaper yesterday that flowers do not always smell sweet; some can smell like dead fish.", "src": 17}, {"id": 18, "stem": "(   ) The medicine I ______ you this morning should be taken three times a day.〔100.基測Ⅱ〕", "options": ["to give", "given", "giving", "gave"], "answer": 3, "explanation": "先行詞 The medicine，其後接省略關係代名詞 which 或 that 的關係子句（I gave you this morning），形成「今天早上我給你的藥」，「給」用能當動詞的「過去簡單式」，其後再接主句的動詞部分。", "full": "The medicine I gave you this morning should be taken three times a day.", "src": 18}, {"id": 19, "stem": "(   ) I want to go camping in the mountains this afternoon, but a typhoon is coming. I’m not sure ______ the road to the mountains will be closed.〔100.北北基〕", "options": ["how", "what", "whether", "why"], "answer": 2, "explanation": "今天下午我想在山中露營，但是颱風即將來襲。我不確定通往山中的道路「是否」將會封閉。", "full": "I want to go camping in the mountains this afternoon, but a typhoon is coming. I’m not sure whether the road to the mountains will be closed.", "src": 19}, {"id": 20, "stem": "(   ) My father told me last night ______ we’re going to the Food Festival this weekend. My brother and I felt very excited.〔99.基測Ⅱ〕", "options": ["whether", "where", "what", "that"], "answer": 3, "explanation": "爸爸昨晚告訴我「這個週末將去參加食物節」，選由連接詞 that 引導的「名詞子句」當動詞 told 的受詞。", "full": "My father told me last night that we’re going to the Food Festival this weekend. My brother and I felt very excited.", "src": 20}, {"id": 21, "stem": "(   ) The building blew up this morning, and the people ______ were badly injured were sent to the hospital.", "options": ["who", "where", "which", "whose"], "answer": 0, "explanation": "正確答案：who", "full": "The building blew up this morning, and the people who were badly injured were sent to the hospital.", "src": 21}, {"id": 22, "stem": "(   ) I’m not sure if they ______ a barbecue（烤肉）next weekend.", "options": ["having", "have", "will have", "have had"], "answer": 2, "explanation": "「名詞子句」未來的動作，仍用「未來式」作答。", "full": "I’m not sure if they will have a barbecue next weekend.", "src": 22}, {"id": 23, "stem": "(   ) Jane is going fishing tomorrow. She wants to know ______ the weather will be fine.〔102.試辦會考〕", "options": ["how", "what", "whether", "why"], "answer": 2, "explanation": "明天 Jane 將去釣魚。她想要知道天氣「是否」會晴朗。", "full": "Jane is going fishing tomorrow. She wants to know whether the weather will be fine.", "src": 23}, {"id": 24, "stem": "(   ) The woman doesn’t know ______ her son will give thanks to his teachers or not.", "options": ["what", "if", "how much", "which"], "answer": 1, "explanation": "名詞子句 whether / if... or not（是否）。", "full": "The woman doesn’t know if her son will give thanks to his teachers or not.", "src": 24}, {"id": 25, "stem": "(   ) Sally: Do you know ______ Grandpa’s birthday party will be held? David: Isn’t it next Saturday?", "options": ["when", "if", "why", "where"], "answer": 0, "explanation": "由 David 答句「不是下星期六嗎？」，可推知 Sally 是詢問「爺爺的生日派對何時將舉辦呢？」。", "full": "Sally: Do you know when Grandpa’s birthday party will be held? David: Isn’t it next Saturday?", "src": 25}, {"id": 26, "stem": "(   ) Alice: Do you know ______ Grandma is going to visit us? Willy: It’s next week. She told me on the phone. And we’ll take her to the national park.〔107.會考〕", "options": ["where", "when", "whether", "why"], "answer": 1, "explanation": "根據 Willy 的第一句回應可知 Alice 的問題是問時間，故選 when。", "full": "Alice: Do you know when Grandma is going to visit us? Willy: It’s next week. She told me on the phone. And we’ll take her to the national park.", "src": 26}, {"id": 27, "stem": "(   ) The woman ______ child sat in front of me in the classroom took us to the zoo yesterday.", "options": ["who", "what", "which", "whose"], "answer": 3, "explanation": "「女人的」孩子坐在我前面，用關係代名詞所有格 whose 作答。", "full": "The woman whose child sat in front of me in the classroom took us to the zoo yesterday.", "src": 27}, {"id": 28, "stem": "(   ) I believe ______ you will be chosen to be a member of the soccer team. You practice really hard.", "options": ["if", "that", "how", "why"], "answer": 1, "explanation": "正確答案：that", "full": "I believe that you will be chosen to be a member of the soccer team. You practice really hard.", "src": 28}, {"id": 29, "stem": "(   ) Teacher: Does anyone know ______ the famous writer was born? Mei-ling: I know! In Taitung, right? Teacher: You got it!〔99.基測Ⅰ〕", "options": ["how", "when", "where", "whether"], "answer": 2, "explanation": "由答句「在臺東」，可見是詢問「在哪裡」。", "full": "Teacher: Does anyone know where the famous writer was born? Mei-ling: I know! In Taitung, right? Teacher: You got it!", "src": 29}, {"id": 30, "stem": "(   ) The girl ______ is giving thanks to Mr. Wang is my classmate.", "options": ["which", "whom", "×", "who"], "answer": 3, "explanation": "先行詞是 the girl，並且在關係子句中關係代名詞是主詞，因此關係代名詞可以用 who 或是 that，不可省略。", "full": "The girl who is giving thanks to Mr. Wang is my classmate.", "src": 30}, {"id": 31, "stem": "(   ) Anita: I saw Nora in the teacher’s office this morning. Do you know ______ she was there? Brian: She cheated on tests.〔99.基測Ⅱ〕", "options": ["how", "if", "when", "why"], "answer": 3, "explanation": "今天早上 Anita 在教師辦公室看到 Nora，因此詢問 Brian 她「為什麼」在那裡，原來她考試作弊。", "full": "Anita: I saw Nora in the teacher’s office this morning. Do you know why she was there? Brian: She cheated on tests.", "src": 31}, {"id": 32, "stem": "(   ) The boys broke the window and didn’t know what ______ . They just stood there without doing anything.", "options": ["can do", "to do", "doing", "did they do"], "answer": 1, "explanation": "當主要子句和名詞子句中的主詞相同，可以用 wh-＋to V 取代 wh-＋主詞＋助動詞＋V。因此 The boys didn’t know what they could / should do. 可以用 The boys didn’t know what to do. 改寫。", "full": "The boys broke the window and didn’t know what to do. They just stood there without doing anything.", "src": 32}, {"id": 33, "stem": "(   ) Selina has so many dresses, but I don’t know ______ she never wears any of them.", "options": ["whether", "when", "how", "why"], "answer": 3, "explanation": "Selina 有這麼多件洋裝，但是我不知道「為何」她從不穿其中任何一件。", "full": "Selina has so many dresses, but I don’t know why she never wears any of them.", "src": 33}, {"id": 34, "stem": "(   ) This is the most expensive gift ______ I’ve ever got.", "options": ["that", "where", "what", "whose"], "answer": 0, "explanation": "先行詞含有「形容詞最高級」時，關係代名詞通常用 that。", "full": "This is the most expensive gift that I’ve ever got.", "src": 34}, {"id": 35, "stem": "(   ) Was he not the first man ______ took a spacewalk（太空漫步）on the moon?", "options": ["who", "when", "which", "where"], "answer": 0, "explanation": "先行詞含有序數時，傳統文法關係代名詞只能用 that，但現今文法也可用 who 代替「人」。", "full": "Was he not the first man who took a spacewalk on the moon?", "src": 35}, {"id": 36, "stem": "(   ) I sent gifts to the ones ______ names are on the list.", "options": ["who", "who’s", "whose", "those"], "answer": 2, "explanation": "用關係代名詞所有格 whose。", "full": "I sent gifts to the ones whose names are on the list.", "src": 36}, {"id": 37, "stem": "(   ) Can you believe ______ all the students raised their hands?", "options": ["it", "what", "which", "that"], "answer": 3, "explanation": "連接詞 that 引導出名詞子句，當動詞 believe 的受詞。", "full": "Can you believe that all the students raised their hands?", "src": 37}, {"id": 38, "stem": "(   ) The girl ______ on the cellphone ______ long hair.", "options": ["is talking; has", "who is talking; who has", "is talking; which has", "that is talking; has"], "answer": 3, "explanation": "第一空格是關係子句，可用關係代名詞 who / that 代替 The girl，第二空格是主要動詞，取單數動詞。", "full": "The girl that is talking on the cellphone has long hair.", "src": 38}, {"id": 39, "stem": "(   ) Frank: Excuse me, could you tell me ______ to go to the bank? Sue: Go straight for one block and turn right. It’s on the left.", "options": ["how", "when", "where", "which"], "answer": 0, "explanation": "正確答案：how", "full": "Frank: Excuse me, could you tell me how to go to the bank? Sue: Go straight for one block and turn right. It’s on the left.", "src": 39}, {"id": 40, "stem": "(   ) The students hope to see their teacher, ______ stopped working at the school.", "options": ["in which", "with whom", "who", "whose"], "answer": 2, "explanation": "先行詞是人，逗點後面關係代名詞用 who。", "full": "The students hope to see their teacher, who stopped working at the school.", "src": 40}, {"id": 41, "stem": "(   ) The restaurant ______ is on Park Road.", "options": ["we’ve been to twice", "it is famous for its steak", "John fell in love with Mary", "is popular with young people"], "answer": 0, "explanation": "(Ｂ) it 須改成 which / that (Ｃ)句首加進 where (Ｄ)句首加進 which / that。", "full": "The restaurant we’ve been to twice is on Park Road.", "src": 41}, {"id": 42, "stem": "(   ) The girl ______ to be a successful singer keeps practicing singing for long hours every day.", "options": ["that is interested in", "who have dreamed", "whose dream is", "that dreams about"], "answer": 2, "explanation": "(Ａ)(Ｄ)之後接 being (Ｂ)須把 have 改成 has，而且 dreamed 之後是接 of / about＋V-ing。", "full": "The girl whose dream is to be a successful singer keeps practicing singing for long hours every day.", "src": 42}, {"id": 43, "stem": "(   ) Children ______ next to us are my new classmates.", "options": ["that is playing", "who plays", "that play", "played"], "answer": 2, "explanation": "用關係代名詞 who 代替先行詞 children，再接複數動詞修飾 children，也可用分詞片語 playing next to us。", "full": "Children that play next to us are my new classmates.", "src": 43}, {"id": 44, "stem": "(   ) A lady with long hair is standing at the gate. She is our new science teacher. Which one is correct?", "options": ["A lady is standing at the gate that is our new science teacher.", "A lady whom is standing at the gate is our new science teacher.", "A lady which is our new science teacher.", "A lady whose hair is long is our new science teacher."], "answer": 3, "explanation": "先找出各句子關代，接著判斷用法是否正確，最後語意檢查。(Ａ) that 在這裡是陷阱，讓你看到前面單字 gate 而誤選。(Ｂ) whom 是受詞用法，“is standing at ...” 缺乏主詞而非受詞。(Ｃ) which 是用來表示東西、事情而非人。(Ｄ) whose 搭配名詞，表示「誰的…」，故選(Ｄ)。", "full": "A lady whose hair is long is our new science teacher.", "src": 44}, {"id": 45, "stem": "(   ) It was a busy day. My mom made me (A) tidy my room up this morning. However, I lost my ring (B) which was sent by my mom as my birthday gift during cleaning up the floor. I took a half hour to (C) look it for everywhere, but I found nothing out. I was (D) too upset to do anything. To cool down myself, I sat at the desk. Wait! My ring was just next to my pencil case.\nWhich one is NOT correct?", "options": ["tidy my room up", "which was sent", "look it for", "too upset to do"], "answer": 2, "explanation": "選項(Ａ)(Ｃ) →考動詞片語可否分割的認識，look for 為不可拆用法，故選(Ｃ)。選項(Ｂ) → my ring 是物品，且後面句子缺乏主詞，故關代用 which（主詞）。選項(Ｄ) → too... to V 太…以致「不能」…，故語意合理。", "full": "look it for", "src": 45}, {"id": 46, "stem": "(   ) Maggie bought the sofa ______ was red.", "options": ["whose color", "its color", "the color", "that color"], "answer": 0, "explanation": "所有格 whose＋名詞。", "full": "Maggie bought the sofa whose color was red.", "src": 46}, {"id": 47, "stem": "(   ) The woman put the cake ______ the refrigerator to keep it fresh.", "options": ["for", "into", "with", "in"], "answer": 1, "explanation": "put… into 放進去。", "full": "The woman put the cake into the refrigerator to keep it fresh.", "src": 47}, {"id": 48, "stem": "(   ) Jerry wanted to know ______ he was kicked off the soccer team, but no one gave him a good reason.〔112.會考〕", "options": ["where", "when", "whether", "why"], "answer": 3, "explanation": "從 a good reason（好理由）推知 Jerry 想知道「為什麼」被踢出足球隊，所以選(Ｄ)。", "full": "Jerry wanted to know why he was kicked off the soccer team, but no one gave him a good reason.", "src": 48}, {"id": 49, "stem": "(   ) I’d like to know when ______ .", "options": ["the movie ending", "will the movie end", "the movie will end", "end the movie"], "answer": 2, "explanation": "間接問句 when the movie will end。", "full": "I’d like to know when the movie will end.", "src": 49}, {"id": 50, "stem": "(   ) A: I kept getting bad grades on my tests. I don’t know ______ . B: Well, you need to have good study habits.", "options": ["what to do", "what should I do", "how to do", "who can I ask for help"], "answer": 0, "explanation": "名詞子句 what I should do＝名詞片語 what to do。", "full": "A: I kept getting bad grades on my tests. I don’t know what to do. B: Well, you need to have good study habits.", "src": 50}, {"id": 51, "stem": "(   ) Did you see the fishermen ______ working under the heat of sun?", "options": ["who was", "that were", "what is", "which are"], "answer": 1, "explanation": "先行詞 the fishermen 複數；關代 that 代替 who，後接複數動詞。", "full": "Did you see the fishermen that were working under the heat of sun?", "src": 51}, {"id": 52, "stem": "(   ) I like to read comic books ______ me laugh.〔95.基測Ⅱ〕", "options": ["made", "to have made", "that make", "which makes"], "answer": 2, "explanation": "先行詞為複數名詞 comic books，其後關係代名詞可用 which / that，再接複數動詞，即「使我開懷大笑的漫畫書」。", "full": "I like to read comic books that make me laugh.", "src": 52}, {"id": 53, "stem": "(   ) Let’s go to the town ______ our house used to be.", "options": ["that", "on which", "where", "whose"], "answer": 2, "explanation": "我們去我們房子以前曾經所在的城鎮。用關係副詞 where 作答。", "full": "Let’s go to the town where our house used to be.", "src": 53}, {"id": 54, "stem": "(   ) Do you remember ______ Dad went to the dentist?", "options": ["what", "whether", "how much", "where"], "answer": 1, "explanation": "你記得爸爸「是否」去看過牙醫了嗎？", "full": "Do you remember whether Dad went to the dentist?", "src": 54}, {"id": 55, "stem": "(   ) They are looking for a hotel at ______ they can stay for a week.", "options": ["where", "that", "what", "which"], "answer": 3, "explanation": "主要句子（They are looking for a hotel）＋關係子句［介系詞（at）＋關係代名詞（which）＋主詞（they）＋助動詞（can）＋原形 V（stay）＋時間片語］。介系詞之後的關係代名詞受格，只能用 which 代替先行詞 a hotel，而且不可以予以省略。", "full": "They are looking for a hotel at which they can stay for a week.", "src": 55}, {"id": 56, "stem": "(   ) The tall man ______ at the bookstore is my high school teacher.〔102.試辦會考〕", "options": ["you saw", "who saw", "you saw him", "that you saw him"], "answer": 0, "explanation": "先行詞是「人」The tall man，其後接關係子句（who / that）you saw at the bookstore，形成「你在書店看見的那高個子男士」，最後接本句動詞 is... teacher（是我的中學老師），選項(Ｂ)其後須加進「某人」當受詞。", "full": "The tall man you saw at the bookstore is my high school teacher.", "src": 56}, {"id": 57, "stem": "(   ) The old building ______ windows were all broken looked a little scary.", "options": ["of which", "whose", "that", "where"], "answer": 1, "explanation": "用關係代名詞所有格 whose，代替其前先行詞「那棟舊建築物的」，即「窗戶全破掉的那棟舊建築物看起來有點兒令人害怕的。」。", "full": "The old building whose windows were all broken looked a little scary.", "src": 57}, {"id": 58, "stem": "(   ) I’m not sure if she ______ me. I’ll be happy if she ______ me.", "options": ["will help; will help", "helps; will help", "will help; helps", "helps; helps"], "answer": 2, "explanation": "if 引導的名詞子句，未來動作仍然用未來式；if 引導的條件句，用現在式代替未來式。", "full": "I’m not sure if she will help me. I’ll be happy if she helps me.", "src": 58}, {"id": 59, "stem": "(   ) Tony: Do you have any idea ______ gave me the card? Kelly: I guess it was from Mike, who you offered help.", "options": ["what", "who", "which", "how much"], "answer": 1, "explanation": "由 Kelly 猜測是 Mike，可推知這裡是用 who 引導的名詞子句詢問「誰」給了這張卡片。", "full": "Tony: Do you have any idea who gave me the card? Kelly: I guess it was from Mike, who you offered help.", "src": 59}, {"id": 60, "stem": "(   ) The teacher took us to the park ______ many different kinds of animals live in.", "options": ["that", "whose", "what", "where"], "answer": 0, "explanation": "用關係代名詞 that / which 代替先行詞 park。", "full": "The teacher took us to the park that many different kinds of animals live in.", "src": 60}, {"id": 61, "stem": "(   ) She really does not know ______ to show her thanks to those who helped her.", "options": ["how", "what", "how should she", "what she should"], "answer": 0, "explanation": "「如何」表示感謝，須用 how 修飾動作 show her thanks... her. 選項(Ｃ)須改為 how she should show... 方為正解。", "full": "She really does not know how to show her thanks to those who helped her.", "src": 61}, {"id": 62, "stem": "(   ) Dad hopes ______ Grandma will get better soon as long as she ______ Dr. Lu’s advice（建議）.", "options": ["that; will take", "if; takes", "whether; will take", "×; takes"], "answer": 3, "explanation": "hopes 之後接由連接詞 that 引導的名詞子句當受詞，that 可予以省略，而名詞子句中出現從屬連接詞 as long as 引導的副詞子句，未來的動作須用「現在簡單式」代替「未來式」。", "full": "Dad hopes Grandma will get better soon as long as she takes Dr. Lu’s advice.", "src": 62}, {"id": 63, "stem": "(   ) Can you tell me ______ Josh ______ dinner with us next Saturday or not?", "options": ["that; is going to have", "if; will have", "why; has had", "whether; has"], "answer": 1, "explanation": "現代文法口語或書面都可用 if / whether... or not（是否…），未來動作仍用「未來式」。", "full": "Can you tell me if Josh will have dinner with us next Saturday or not?", "src": 63}, {"id": 64, "stem": "(   ) The doctor with ______ Josh is working is my best friend.", "options": ["that", "whom", "who", "which"], "answer": 1, "explanation": "先行詞是「人」時，若介系詞前移到關係代名詞之前時，只能用 whom 作答。", "full": "The doctor with whom Josh is working is my best friend.", "src": 64}, {"id": 65, "stem": "(   ) Tommy is looking for the watch his uncle ______ him on his birthday.〔97.基測Ⅰ〕", "options": ["gives", "gave", "to give", "has given"], "answer": 1, "explanation": "先行詞 the watch，其後的關係子句為〔關係代名詞（which / that / ×）＋主詞（his uncle）＋過去式動詞（gave）＋間接受詞（him）＋時間介系詞片語〕，gave 的直接受詞則是 which / that，可予以省略。", "full": "Tommy is looking for the watch his uncle gave him on his birthday.", "src": 65}, {"id": 66, "stem": "(   ) Would you please pick up the book ______ on the ground?", "options": ["what I just dropped", "I just dropped it", "was dropping", "which was just dropped by me"], "answer": 3, "explanation": "先行詞 the book，其後所接的關係子句，關係代名詞可用 which / that；選項(Ｂ)關係代名詞當受格可予以省略，代名詞 it 要刪除；選項(Ｃ)須改成 dropped。", "full": "Would you please pick up the book which was just dropped by me on the ground?", "src": 66}, {"id": 67, "stem": "(   ) This is all ______ I know about the restaurant ______ is famous for its steak and spaghetti（義大利麵）.", "options": ["which; which", "which; that", "that; that", "what; what"], "answer": 2, "explanation": "第一空格先行詞是 all，關係代名詞用 that；第二空格先行詞是 the restaurant，在關係子句中用 which / that 代替之，是當「主詞」用，不可予以省略。", "full": "This is all that I know about the restaurant that is famous for its steak and spaghetti.", "src": 67}, {"id": 68, "stem": "(   ) We’d like to make sure ______ .", "options": ["where is the restaurant", "what can we do for you", "whether the party is on Friday", "why did the students come to school"], "answer": 2, "explanation": "由 wh- 引導的名詞子句，wh-＋主詞＋助動詞／be 動詞，若助動詞為 do、does、did，則將 do、does、did 去掉，後方動詞依照人稱和時態做變化。故(Ａ)應改為 where the restaurant is (Ｂ)應改為 what we can do for you (Ｄ)應改為 why the students came to school。", "full": "We’d like to make sure whether the party is on Friday.", "src": 68}, {"id": 69, "stem": "(   ) How many smiling faces you’d like to put on the card is the only thing ______ I need to know.", "options": ["why", "what", "×", "if"], "answer": 2, "explanation": "先行詞前有 the only 在傳統文法上關係代名詞用 that，that 當作形容詞子句 I need to know 的受詞，that 可以省略。", "full": "How many smiling faces you’d like to put on the card is the only thing I need to know.", "src": 69}, {"id": 70, "stem": "(   ) The house ______ they live is bigger and more comfortable than the apartment ______ we live in.", "options": ["which; which", "where; where", "which; where", "where; that"], "answer": 3, "explanation": "第一空格用「關係副詞」where，也可代換成 in which；第二空格用「關係代名詞」which / that，當介系詞 in 的受詞。", "full": "The house where they live is bigger and more comfortable than the apartment that we live in.", "src": 70}, {"id": 71, "stem": "(   ) Can you tell me ______ else people can do to give thanks to others?", "options": ["what", "how", "which", "why"], "answer": 0, "explanation": "疑問詞 what 當名詞子句中動詞 do 的受詞。", "full": "Can you tell me what else people can do to give thanks to others?", "src": 71}, {"id": 72, "stem": "(   ) The restaurant ______ lots of people is now going to close.", "options": ["which has filled with", "that used to be full of", "filling with", "used to be packed with"], "answer": 1, "explanation": "先行詞 The restaurant，其後可接關係子句［關係代名詞（which / that）＋used to＋原形 be＋形容詞片語（full of）＋... people］＋未來式動詞...。選項(Ａ) has 須改成 was；(Ｃ)至少須改成過去分詞片語 filled with；(Ｄ)加進關係代名詞 which / that。", "full": "The restaurant that used to be full of lots of people is now going to close.", "src": 72}, {"id": 73, "stem": "(   ) I wonder（想知道）when I ______ my dream come true. I’ll be very happy when I ______ .", "options": ["will make; do", "will make; will", "make; will do", "make; do"], "answer": 0, "explanation": "第一空格為 when（何時）引導出名詞子句，未來動作須用「未來式」；第二空格為 when（當）引導出副詞子句，未來動作須用「現在簡單式」代替「未來式」，用助動詞 do 代替 make my dream come true。", "full": "I wonder when I will make my dream come true. I’ll be very happy when I do.", "src": 73}, {"id": 74, "stem": "(   ) This is the only thing ______ we can do for you.", "options": ["who", "what", "that", "whose"], "answer": 2, "explanation": "先行詞含有 the only＋物，傳統文法關係代名詞只能用 that，但現今文法也可用 which。", "full": "This is the only thing that we can do for you.", "src": 74}, {"id": 75, "stem": "(   ) Dad’s going to take us back to the town ______ he was born and grew up.", "options": ["which", "that", "when", "where"], "answer": 3, "explanation": "本題可用關係副詞 where 或 in which 作答。", "full": "Dad’s going to take us back to the town where he was born and grew up.", "src": 75}, {"id": 76, "stem": "(   ) Let’s take the dog to the animal hospital ______ my uncle works.", "options": ["what", "that", "which", "where"], "answer": 3, "explanation": "把狗狗帶去「我舅舅工作的」動物醫院，可用○ in which ○ where 作答。", "full": "Let’s take the dog to the animal hospital where my uncle works.", "src": 76}, {"id": 77, "stem": "(   ) She kept writing about everything ______ happened in her everyday life.", "options": ["what", "that", "who", "in which"], "answer": 1, "explanation": "先行詞 everything 的關係代名詞通常用 that。", "full": "She kept writing about everything that happened in her everyday life.", "src": 77}, {"id": 78, "stem": "(   ) ______ he didn’t know the phone number was the main problem.", "options": ["What", "When", "That", "×"], "answer": 2, "explanation": "that 引導的名詞子句當作主詞用。", "full": "That he didn’t know the phone number was the main problem.", "src": 78}, {"id": 79, "stem": "(   ) I’m interested in the new class. Tell me ______ you know about it.", "options": ["which", "whom", "what", "that"], "answer": 2, "explanation": "告訴我關於課程的「事情」，不需要先行詞並用來取代事情的關係代名詞是 what。", "full": "I’m interested in the new class. Tell me what you know about it.", "src": 79}, {"id": 80, "stem": "(   ) The restaurant ______ they have eaten steak several times offers good prices. They can enjoy ______ they like to eat with less money.", "options": ["which; that", "where; what", "that; all", "in which; that"], "answer": 1, "explanation": "第一空格用關係副詞 where，可代換成 in / at which；第二空格則是用不需先行詞的關係代名詞 what，表達「他們喜歡吃的東西」。", "full": "The restaurant where they have eaten steak several times offers good prices. They can enjoy what they like to eat with less money.", "src": 80}, {"id": 81, "stem": "(   ) The books that ______ bought by the man were really boring.", "options": ["be", "was", "were", "has been"], "answer": 2, "explanation": "關係代名詞代替先行詞 the books，因此搭配複數 be 動詞 were。", "full": "The books that were bought by the man were really boring.", "src": 81}, {"id": 82, "stem": "(   ) When I entered the house for the first time, I found ______ was a big round table in the dining room.", "options": ["it", "that", "there", "this"], "answer": 2, "explanation": "動詞 found 之後接連接詞 that 引導的「名詞子句」當受詞，即「連接詞（that）＋主詞（there）＋be 動詞（was）＋... dining room」，連接詞 that 可予以省略。", "full": "When I entered the house for the first time, I found there was a big round table in the dining room.", "src": 82}, {"id": 83, "stem": "(   ) Lisa drove her friends to the house ______ the party was held.", "options": ["what", "which", "where", "whose"], "answer": 2, "explanation": "正確答案：where", "full": "Lisa drove her friends to the house where the party was held.", "src": 83}, {"id": 84, "stem": "(   ) Do you know the girl to ______ Joe is talking?", "options": ["who", "whom", "that", "whose"], "answer": 1, "explanation": "先行詞 the girl＋關係子句［介系詞（to）＋關係代名詞（whom）＋主詞（Joe）＋現在進行式動詞（is talking）］。介系詞之後的關係代名詞受格，只能用 whom 代替先行詞 the girl，而且不可予以省略。", "full": "Do you know the girl to whom Joe is talking?", "src": 84}, {"id": 85, "stem": "(   ) I haven’t decided ______ to get married to that poor young man I’ve known for only three months or not.", "options": ["if", "when", "how", "whether"], "answer": 3, "explanation": "只有 whether（是否）其後可接 to V... or not，即「我還沒決定是否和我已認識只有三個月的貧窮年輕男子結婚。」。", "full": "I haven’t decided whether to get married to that poor young man I’ve known for only three months or not.", "src": 85}, {"id": 86, "stem": "(   ) I’m sorry to hear ______ your car got stolen（被偷）. I’m wondering（想知道）if you ______ a ride later.", "options": ["if; need", "about; will need", "that; will need", "×; need"], "answer": 2, "explanation": "第一空格為連接詞 that 引導出來的名詞子句，that 可予以省略；第二空格 if（是否）引導出「名詞子句」，未來的動作仍須用「未來式」。", "full": "I’m sorry to hear that your car got stolen. I’m wondering if you will need a ride later.", "src": 86}, {"id": 87, "stem": "(   ) The planet on ______ we live is called Earth.", "options": ["that", "which", "where", "whom"], "answer": 1, "explanation": "先行詞是「物」時，若介系詞前移到關係代名詞之前時，只能用 which 作答。", "full": "The planet on which we live is called Earth.", "src": 87}, {"id": 88, "stem": "(   ) Has John told you ______ the welcome party is at Tracy’s place?", "options": ["who", "that", "how", "where"], "answer": 1, "explanation": "連接詞 that 引導名詞子句，當動詞 told 的受詞。", "full": "Has John told you that the welcome party is at Tracy’s place?", "src": 88}, {"id": 89, "stem": "(   ) The office ______ my father works is not only big but also comfortable.", "options": ["that", "on which", "where", "which"], "answer": 2, "explanation": "爸爸「在辦公室裡面」工作，可用○ in which ○ where 作答。", "full": "The office where my father works is not only big but also comfortable.", "src": 89}, {"id": 90, "stem": "(   ) The bookstore doesn’t have anything ______ I want to buy.", "options": ["why", "who", "that", "what"], "answer": 2, "explanation": "先行詞是 something、everything、anything 等字，關係代名詞用 that。", "full": "The bookstore doesn’t have anything that I want to buy.", "src": 90}, {"id": 91, "stem": "(   ) At dinner time, I often enjoy telling Mom everything ______ at school.〔98.基測Ⅰ〕", "options": ["happened", "was happening", "that happened", "which happening"], "answer": 2, "explanation": "先行詞 everything，關係代名詞通常用 that，再接過去式動詞 happened，即「在學校發生過的每件事」。", "full": "At dinner time, I often enjoy telling Mom everything that happened at school.", "src": 91}, {"id": 92, "stem": "(   ) We are all excited ______ he won first place in the swimming race.", "options": ["about", "why", "whether", "that"], "answer": 3, "explanation": "be excited about＋名詞；be excited (that)＋句子。", "full": "We are all excited that he won first place in the swimming race.", "src": 92}, {"id": 93, "stem": "(   ) I believe ______ you hid something in the desk.", "options": ["what", "whether", "which", "×"], "answer": 3, "explanation": "連接詞 that 引導名詞子句，當動詞 believe 的受詞，此時 that 也可予以省略。", "full": "I believe you hid something in the desk.", "src": 93}, {"id": 94, "stem": "(   ) Grandma misses the couch ______ at the back yard sale.", "options": ["which sold", "was sold", "that was sold", "who was selling"], "answer": 2, "explanation": "用 which / that 代替先行詞 the couch，再接過去式被動語態。", "full": "Grandma misses the couch that was sold at the back yard sale.", "src": 94}, {"id": 95, "stem": "(   ) To make sure the baby is safe, the mother holds the baby ______ her hands.", "options": ["into", "on", "at", "with"], "answer": 3, "explanation": "with her hands 用手抱著。", "full": "To make sure the baby is safe, the mother holds the baby with her hands.", "src": 95}, {"id": 96, "stem": "(   ) Do you remember how much ______ the salesman for the new car?", "options": ["did you pay", "did you pay for", "you paid", "you paid for"], "answer": 2, "explanation": "名詞子句取「疑問詞＋主詞＋動詞」的字序排列，而 pay＋人 / 錢＋for＋物。", "full": "Do you remember how much you paid the salesman for the new car?", "src": 96}, {"id": 97, "stem": "(   ) All the excuses Nick made ______ a lot about how much he hates to do the job.〔106.會考〕", "options": ["say", "saying", "which say", "to say"], "answer": 0, "explanation": "本句中的關係代名詞 which / that 被省略了，還原為：All the excuses which / that Nick made say a lot about… 把形容詞子句 which / that Nick made 拿掉，就可以選出正確的動詞形態，故選（Ａ）。", "full": "All the excuses Nick made say a lot about how much he hates to do the job.", "src": 97}, {"id": 98, "stem": "(   ) That all of those in the classroom are hard-working students ______ known by everyone in the office.", "options": ["is", "are", "being", "has"], "answer": 0, "explanation": "that 引導的名詞子句（that all of those in the classroom are hard-working students）整件事情當作主詞，是被辦公室裡的大家知道的，用被動語態 is known...，故選(Ａ)。", "full": "That all of those in the classroom are hard-working students is known by everyone in the office.", "src": 98}, {"id": 99, "stem": "(   ) The museum ______ we used to visit has become more and more famous.", "options": ["in which", "what", "where", "×"], "answer": 3, "explanation": "先行詞／主詞（The museum）＋關係子句〔關係代名詞（which / that / ×）＋主詞（we）＋動詞（used to visit）〕＋現在完成式動詞（has become）＋形容詞比較級，關係代名詞是動詞 visit 的受詞，可予以省略。", "full": "The museum we used to visit has become more and more famous.", "src": 99}, {"id": 100, "stem": "(   ) Do you have any idea how many smiling faces ______ in the picture?", "options": ["are there", "is seen", "there were", "has been seen"], "answer": 2, "explanation": "名詞子句須用「疑問詞＋主詞＋動詞」或「疑問詞（主詞）＋動詞」的字序排列，因此選項(Ａ)須改成 there are，(Ｂ) 及(Ｄ)分別改成複數動詞 are seen 及 have been seen。", "full": "Do you have any idea how many smiling faces there were in the picture?", "src": 100}, {"id": 101, "stem": "(   ) Actor David Piper became tired of talking about the movie ______ after he was interviewed about it many times.〔104.會考〕", "options": ["he is famous", "that he is famous", "that is famous for", "he is famous for"], "answer": 3, "explanation": "演員 David Piper 在被訪問很多次後，厭倦談論「他以它成名的」電影。用關係子句〔關係代名詞（which / that / ×）＋主詞（he）＋be 動詞（is）＋形容詞片語（famous for）〕後位修飾先行詞 the movie，關係代名詞當介系詞 for 的受詞，可予以省略。", "full": "Actor David Piper became tired of talking about the movie he is famous for after he was interviewed about it many times.", "src": 101}, {"id": 102, "stem": "(   ) The desk ______ five drawers is ______ Kenny wants to buy.", "options": ["which has; that", "that has; what", "which is having; all", "who is having; which"], "answer": 1, "explanation": "第一空格用「關係代名詞 which / that＋單數現在式動詞 has」，因為 have（有）沒有「進行式」，第二空格用「不需先行詞的關係代名詞」what 作答。", "full": "The desk that has five drawers is what Kenny wants to buy.", "src": 102}, {"id": 103, "stem": "(   ) The man wants to find out ______ to do to thank his parents who did everything to support（支持）him.", "options": ["how", "what", "how he can", "what can he"], "answer": 1, "explanation": "男人要找出做些什麼能感謝他的父母，用 what 當 do 的受詞。選項(Ｄ)應該改成 what he can do to thank his parents。", "full": "The man wants to find out what to do to thank his parents who did everything to support him.", "src": 103}, {"id": 104, "stem": "(   ) Ryan, ______ is a salesman, gives thanks to those ______ help him along the way.", "options": ["that; who", "who; who", "who; that", "that; that"], "answer": 1, "explanation": "先行詞後有逗點，代替人的關係代名詞只能用 who；先行詞是 those，代替人的關係代名詞只能用 who。", "full": "Ryan, who is a salesman, gives thanks to those who help him along the way.", "src": 104}, {"id": 105, "stem": "(   ) The photo ______ in the bedroom was taken when Ryan and his family went surfing at the beach.", "options": ["found", "he found it", "which was finding", "to be found"], "answer": 0, "explanation": "當 Ryan 跟他家人在海灘衝浪的時候，在房間被找到的照片被拿走了。主詞／先行詞（The photo），其後可接○關係子句〔關係代名詞（which / that）＋過去式被動語態（was found）＋地方介系詞片語（in the bedroom）〕或○分詞片語（found in the bedroom）做後位修飾。", "full": "The photo found in the bedroom was taken when Ryan and his family went surfing at the beach.", "src": 105}, {"id": 106, "stem": "(   ) This is ______ I know about the girl ______ is called Tina.", "options": ["what; who", "all that; whose name", "that; that", "what; whose name"], "answer": 0, "explanation": "第一空格因為沒有先行詞，故用 what 作答，但若出現先行詞 all，則關係代名詞用 that；第二空格只能用 who / that，若用 whose name 時，須把 is called 中的 called 去掉。", "full": "This is what I know about the girl who is called Tina.", "src": 106}, {"id": 107, "stem": "(   ) People ______ next to us are our neighbors.", "options": ["that are lived", "who lives", "living", "lived"], "answer": 2, "explanation": "住在我們隔壁的人們是我們的鄰居。先行詞 People，其後的關係代名詞用 who，再接複數動詞，因此選項(Ｂ)須改成 who live，也可用「分詞片語」（living... us）做後位修飾。", "full": "People living next to us are our neighbors.", "src": 107}];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=s=>String(s??'').trim().toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:()“”"]/g,'').replace(/\s+/g,' ');
let chosen=[],idx=0;const wrong=new Map(),attempted=new Set(),correct=new Set();
function preview(q){return KIND==='mcq'?q.stem:q.prompt}
function renderList(){$('#list').innerHTML=Q.map(q=>`<label class="pick"><input class="pickbox" type="checkbox" value="${q.id}" checked><span><b>第 ${q.id} 題</b><small>${esc(preview(q))}</small></span></label>`).join('')}

function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
$('#all').onclick=()=>setAll(true);$('#none').onclick=()=>setAll(false);$('#random').onclick=()=>{setAll(false);const ids=new Set(shuffled(Q).slice(0,20).map(q=>q.id));document.querySelectorAll('.pickbox').forEach(x=>x.checked=ids.has(+x.value))};
$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));idx=0;wrong.clear();attempted.clear();correct.clear();$('#select').classList.add('hidden');$('#result').classList.add('hidden');$('#quiz').classList.remove('hidden');show()};
function show(){if(window.speechSynthesis)speechSynthesis.cancel();const q=chosen[idx];$('#meta').textContent=`第 ${idx+1} / ${chosen.length} 題｜原題 ${q.id}`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=`${idx/chosen.length*100}%`;$('#stem').textContent=KIND==='mcq'?q.stem:q.prompt;const pic=$('#picture');if(q.image){pic.src=q.image;pic.classList.remove('hidden')}else{pic.classList.add('hidden');pic.removeAttribute('src')};if(KIND==='mcq'){$('#area').className='options';$('#area').innerHTML=q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b><span>${esc(o)}</span></label>`).join('')}else{$('#area').className='answer-grid';$('#area').innerHTML=q.answers.map((a,i)=>`<div class="answer-row"><label>空格 ${i+1}</label><input class="answer-input" data-i="${i}" autocomplete="off" spellcheck="false" placeholder="請輸入答案"></div>`).join('')};$('#feedback').className='feedback hidden';$('#voicebox').classList.add('hidden');$('#check').classList.remove('hidden');$('#next').classList.add('hidden')}
function remember(q,value){if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(value);$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
function spoken(q){return q.full||((KIND==='mcq')?q.stem.replace(/^\(\s*\)\s*/,'').replace(/_{3,}/,q.options[q.answer]):q.answers.map(a=>a.accepted[0]).join(' '))}
function speak(){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(spoken(chosen[idx]));u.lang='en-US';u.rate=.88;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/^en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;speechSynthesis.speak(u)}
function success(q){correct.add(q.id);$('#bar').style.width=`${(idx+1)/chosen.length*100}%`;$('#feedback').className='feedback ok';$('#feedback').innerHTML='✅ 全部正確！<br>'+esc(q.explanation||'');$('#target').textContent=spoken(q);$('#voicebox').classList.remove('hidden');$('#check').classList.add('hidden');$('#next').classList.remove('hidden');speak()}
$('#check').onclick=()=>{const q=chosen[idx];attempted.add(q.id);if(KIND==='mcq'){const sel=document.querySelector('input[name=answer]:checked');if(!sel)return alert('請先選擇答案。');const n=+sel.value;if(n===q.answer)return success(q);remember(q,String.fromCharCode(65+n)+'. '+q.options[n]);$('#feedback').className='feedback bad';$('#feedback').innerHTML=`❌ 答錯了。正確答案：<strong>${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</strong><br>${esc(q.explanation||'')}<br>請重新選擇正確答案。`;return}const ins=[...document.querySelectorAll('.answer-input')];if(ins.some(x=>!x.value.trim()))return alert('請完成所有答案。');const bad=[];ins.forEach((input,i)=>{const a=q.answers[i];input.classList.remove('ok','bad');if(a.accepted.some(x=>norm(x)===norm(input.value))){input.classList.add('ok');input.disabled=true}else{input.classList.add('bad');bad.push(`${i+1}. ${input.value} → ${a.display}`);input.value=''}});if(!bad.length)return success(q);remember(q,bad.join('；'));$('#feedback').className='feedback bad';$('#feedback').innerHTML=`❌ 有 ${bad.length} 格不正確。<br>正確答案：${q.answers.map((a,i)=>`${i+1}. <strong>${esc(a.display)}</strong>`).join('；')}<br>${esc(q.explanation||'')}<br>請依提示重新填寫。`;ins.find(x=>!x.disabled)?.focus()};
$('#speak').onclick=speak;$('#next').onclick=()=>{idx++;idx>=chosen.length?finish():show()};$('#finish').onclick=finish;

function finish(){if(window.speechSynthesis)speechSynthesis.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');$('#summary').innerHTML=`<div class="stat">選擇題數<b>${chosen.length}</b></div><div class="stat">已作答<b>${attempted.size}</b></div><div class="stat">完成答對<b>${correct.size}</b></div><div class="stat">曾答錯<b>${wrong.size}</b></div>`;$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>`<div class="wrong"><b>${i+1}. 原題 ${r.q.id}｜${esc(preview(r.q))}</b><p>錯誤紀錄：${r.attempts.map(esc).join('<br>')}</p><p><strong>正確答案：</strong>${esc(answerText(r.q))}</p><p>${esc(r.q.explanation||'')}</p></div>`).join(''):'<div class="feedback ok">🎉 沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size)}
$('#restart').onclick=()=>location.reload();$('#download').onclick=async()=>{if(!wrong.size)return;const rows=[...wrong.values()],stamp=new Date().toISOString().slice(0,10),name=TITLE.replace(/\s+/g,'_')+'_錯題_'+stamp;const save=(blob,ext)=>{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name+ext;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};try{const{Document,Packer,Paragraph,TextRun,HeadingLevel}=await import('https://esm.sh/docx@9.5.1');const children=[new Paragraph({heading:HeadingLevel.TITLE,children:[new TextRun({text:TITLE+' 錯題紀錄',bold:true})]})];rows.forEach((r,i)=>{children.push(new Paragraph({heading:HeadingLevel.HEADING_2,children:[new TextRun({text:`${i+1}. 原題 ${r.q.id}`,bold:true})]}),new Paragraph({text:preview(r.q)}),new Paragraph({children:[new TextRun({text:'錯誤紀錄：',bold:true}),new TextRun({text:r.attempts.join(' | ')})]}),new Paragraph({children:[new TextRun({text:'正確答案：',bold:true}),new TextRun({text:answerText(r.q)})]}),new Paragraph({children:[new TextRun({text:'解析：',bold:true}),new TextRun({text:r.q.explanation||''})]}))});save(await Packer.toBlob(new Document({sections:[{children}]})),'.docx')}catch(e){save(new Blob([TITLE+' 錯題紀錄\n\n'+rows.map(r=>preview(r.q)+'\n正確答案：'+answerText(r.q)+'\n').join('\n')],{type:'text/plain;charset=utf-8'}),'.txt')}};
renderList();
