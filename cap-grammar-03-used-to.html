<script>window.QUIZ_CONFIG={"title": "國中會考文法歷屆試題｜used to", "mode": "mcq", "questions": [{"id": 1, "question": "Now I often think of those days with Pip, my pet dog. When I read in my room, he ______ quietly beside me.", "options": ["will come and sit", "comes and sits", "has come and sat", "used to come and sit"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜used to＋V 表過去習慣", "explanation": "【句型】S ＋ used to ＋ V，表「過去常常…（現在已不再）」。\n【分析】Now I often think of those days 表示在回憶過去，Pip 已不在身邊；「以前我看書時他常來坐在我身邊」用 used to come and sit。\n【其他選項】(A) 未來式不合回憶；(B) 現在式表示現在仍如此，與 those days 矛盾；(C) 現在完成式不表過去的習慣。\n【例句】My grandpa used to tell me stories before bed.", "explanationSource": "source"}, {"id": 2, "question": "There ______ a big tree in front of my school, but it was cut down last year.", "options": ["used to be", "is used to", "uses to be", "is using"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 1 題）", "explanation": "表示過去有但現在沒有，用 used to be。", "explanationSource": "supplemental"}, {"id": 3, "question": "When I was little, my mom ______ me to the park every Sunday.", "options": ["takes", "is taking", "used to take", "has taken"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 1 題）", "explanation": "When I was little 過去習慣，用 used to take。", "explanationSource": "supplemental"}, {"id": 4, "question": "Andy ______ shy, but now he talks to everyone in class.", "options": ["is", "has been", "is used to", "used to be"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 1 題）", "explanation": "過去如此、現在不同，用 used to be。", "explanationSource": "supplemental"}, {"id": 5, "question": "In my school days, I ______ to English radio programs every day. That was how I learned English at that time.", "options": ["listen", "have listened", "used to listen", "was listening"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜used to + 原V（過去習慣）", "explanation": "【句型】S + used to + 原V 表「過去常常…（現在不再）」。\n【分析】In my school days、at that time 指過去一段時期，every day 表當時的習慣，用 used to listen。\n【其他選項】(A) 現在式不合過去時間；(B) 現在完成式表持續到現在，不合 at that time；(D) 過去進行式表過去某一時刻正在做，不表長期習慣。\n【例句】I used to ride my bike to school when I was in elementary school.", "explanationSource": "source"}, {"id": 6, "question": "When my grandpa was young, he ______ go fishing in the river behind his house.", "options": ["used to", "is used to", "uses to", "was used to"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 5 題）", "explanation": "表過去的習慣用 used to + 原V。", "explanationSource": "supplemental"}, {"id": 7, "question": "Amy ______ shy, but now she talks with everyone in class.", "options": ["is used to be", "used to be", "was used to", "uses to be"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 5 題）", "explanation": "過去的狀態現在已改變，用 used to be。", "explanationSource": "supplemental"}, {"id": 8, "question": "Jason: Did you ______ play the piano?\nNancy: Yes, but I stopped when I was ten.", "options": ["used to", "uses to", "use to", "using to"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 5 題）", "explanation": "疑問句有 did，後面 used to 要改原形 use to。", "explanationSource": "supplemental"}, {"id": 9, "question": "Willy has changed a lot. He ______ get up early to do exercise. But now he wakes up late and is late for school every day.", "options": ["forgot to", "hated to", "used to", "volunteered to"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜used to + 原V vs. But now", "explanation": "【句型】S + used to + 原V, but now… 表「以前常…，但現在不再」。\n【分析】Willy has changed a lot 與 But now he wakes up late 形成今昔對比，前句是過去的習慣，用 used to get up early。\n【其他選項】(A) forgot to「忘了去做」；(B) hated to「討厭做」；(D) volunteered to「自願做」，都無法呈現「以前常做、現在不做」的改變。\n【例句】Eric used to eat a lot of fast food, but now he eats vegetables every day.", "explanationSource": "source"}, {"id": 10, "question": "Ms. Lin ______ drive to work, but now she takes the MRT to save money.", "options": ["used to", "hoped to", "forgot to", "refused to"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 9 題）", "explanation": "今昔對比（but now），用 used to 表過去習慣。", "explanationSource": "supplemental"}, {"id": 11, "question": "There ______ a big tree in front of our school, but it was cut down last year.", "options": ["is used to be", "used to be", "was used to", "uses to be"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 9 題）", "explanation": "過去存在現在不在，用 There used to be。", "explanationSource": "supplemental"}, {"id": 12, "question": "My brother ______ play online games all night. Now he goes to bed at ten.", "options": ["decided to", "is used to", "used to", "learned to"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 9 題）", "explanation": "Now 對比過去的習慣，用 used to + 原V。", "explanationSource": "supplemental"}, {"id": 13, "question": "My husband ______ send me flowers every week before we got married. But now he never does.", "options": ["should", "used to", "was going to", "was afraid to"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜used to + 原V（過去習慣）", "explanation": "【句型】S + used to + 原V 表過去的習慣。\n【分析】before we got married（過去）與 But now he never does（現在）對比，「以前每週送花，現在都不送了」，用 used to send。\n【其他選項】(A) should「應該」；(C) was going to「當時打算」；(D) was afraid to「不敢」，皆不合今昔對比的語意。\n【例句】We used to visit our grandparents every summer, but now we seldom do.", "explanationSource": "source"}, {"id": 14, "question": "Before she moved to Taipei, Grandma ______ take a walk by the sea every evening.", "options": ["used to", "is used to", "was going to", "should"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 13 題）", "explanation": "before she moved 指過去，表過去習慣用 used to。", "explanationSource": "supplemental"}, {"id": 15, "question": "Kevin ______ be afraid of dogs, but now he has two dogs at home.", "options": ["is used to", "used to", "was used to", "uses to"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 13 題）", "explanation": "過去狀態現已改變，用 used to be。", "explanationSource": "supplemental"}, {"id": 16, "question": "Ben: Do you still collect stamps?\nAnn: No, but I ______ when I was a kid.", "options": ["use to", "am used to", "used to", "was used"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 13 題）", "explanation": "省略句 I used to (collect stamps)，表小時候的習慣。", "explanationSource": "supplemental"}, {"id": 17, "question": "We know you ______ work for big shopping centers. Would you tell us why you choose such a small shoe store like us now?", "options": ["are used to", "get used to", "used to", "will be used to"], "answer": 2, "answerLabel": "C", "source": "講義錯題｜used to + VR（過去習慣）vs. be used to + Ving", "explanation": "【句型】used to + 原形動詞（過去常常，現在不再）；be/get used to + Ving/N（習慣於）\n【分析】空格後是原形 work，且後句 now 選了小鞋店，表示「以前」在大型購物中心工作 → used to work。\n【其他選項】(A)(B)(D) be/get used to 的 to 是介系詞，後要接 working，且「習慣」不合語意。\n【例句】I used to live in Kaohsiung, but now I live in Taipei.\n備註：講義 p.319", "explanationSource": "source"}, {"id": 18, "question": "There ______ a bookstore on this corner, but now it's a coffee shop.", "options": ["is used to be", "used to be", "was used to being", "gets used to be"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 17 題）", "explanation": "以前是書店、現在不是，用 used to + 原形 be。", "explanationSource": "supplemental"}, {"id": 19, "question": "Jason moved to Canada last year. Now he ______ the cold weather.", "options": ["used to", "uses to", "is used to", "used to being"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 17 題）", "explanation": "現在習慣於冷天氣，be used to + 名詞。", "explanationSource": "supplemental"}, {"id": 20, "question": "My dad ______ smoke, but he stopped five years ago.", "options": ["used to", "is used to", "gets used to", "was used to"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 17 題）", "explanation": "過去抽菸、現在不抽，used to + 原形 smoke。", "explanationSource": "supplemental"}]};</script><script src="longteng-b1u5-quiz.js?v=20261106-3"></script><script>document.querySelector("#description").textContent="共 20 題（會考歷屆＋講義錯題 5 題＋類似題 15 題）｜選答後顯示中文解析｜答錯可重做並下載錯題";</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
