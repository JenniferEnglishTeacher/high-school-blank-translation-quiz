<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KCIS G5 Past Simple：Active and Passive Voices</title><style>
:root{--accent:#2563eb;--bg:#f4f7fb;--ink:#172033;--muted:#65748b;--line:#d9e2ef;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--voice:#6d28d9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.65}.wrap{max-width:1020px;margin:auto;padding:15px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:15px 0;box-shadow:0 6px 22px #0f172a0c}.hero{background:linear-gradient(135deg,#eef5ff,#fff)}h1{margin:0;font-size:clamp(25px,4vw,38px)}h2,h3{margin-top:0}.muted{color:var(--muted)}.hidden{display:none!important}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.btn{border:0;border-radius:10px;padding:11px 16px;font:800 16px inherit;cursor:pointer;background:#e5e7eb;color:var(--ink);text-decoration:none}.primary{background:var(--accent);color:#fff}.voice{background:var(--voice);color:#fff}.danger{background:#991b1b;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.group-btn{padding:16px;text-align:left;border:2px solid var(--line);border-radius:13px;background:#fff;cursor:pointer}.group-btn:hover{border-color:var(--accent);background:#f8fbff}.group-btn b{display:block;font-size:19px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--accent)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:800;margin:8px 0 14px}.passage{padding:16px;border:1px solid var(--line);border-radius:12px;background:#f8fafc;margin:12px 0}.passage p{margin:9px 0}.question{font-size:19px;font-weight:750;padding:16px;background:#f8fafc;border-radius:12px;white-space:pre-wrap}.answer{width:100%;font:inherit;font-size:17px;padding:12px;border:2px solid #94a3b8;border-radius:10px;margin:10px 0}.options{display:grid;gap:9px;margin:14px 0}.option{display:flex;gap:10px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-size:17px;font-weight:700;cursor:pointer}.option:has(input:checked){border-color:var(--accent);background:#eaf2ff}.option input{width:20px;height:20px;accent-color:var(--accent)}.wordbank{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.word{padding:5px 11px;border-radius:999px;background:#dbeafe;color:#1e3a8a;font-weight:800}.feedback,.reference{padding:13px;border-radius:10px;font-weight:800;margin:12px 0;white-space:pre-wrap}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.reference{border:2px solid #bbf7d0;background:#f0fdf4}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:#f5f3ff;margin:12px 0}.voicebox .note{color:var(--muted);margin:6px 0 10px}.voice-result{margin-top:10px;padding:11px;border-radius:9px;background:#fff;border:1px solid #ddd6fe}.voice-result.good{background:var(--okbg);color:var(--ok);border-color:#86efac}.voice-result.retry{background:var(--badbg);color:var(--bad);border-color:#fecaca}.edit-target{display:inline-block;color:var(--bad);background:var(--badbg);padding:5px 10px;border-radius:8px;font-weight:900;text-decoration:line-through;text-decoration-thickness:2px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat,.wrong-card{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong-card{margin:10px 0;background:#fff7f7;border-color:#fecaca}@media(max-width:620px){.wrap{padding:8px}.hero,.card{padding:15px}.meta{display:block}.question{font-size:17px}}

lass="voice-result">尚未進行朗讀評分。</div></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束本輪</button></div></section><section id="result" class="card hidden"><h2>練習結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="download" class="btn primary">下載錯題 DOCX</button><button id="back" class="btn">選擇其他範圍</button><button id="restart" class="btn">重新開始</button></div></section></main><script>
const DATA={"title":"KCIS G5 Past Simple：Active and Passive Voices","subtitle":"Typhoon Day｜過去簡單式主動與被動語態｜附件故事情境＋文法練習","groups":[{"title":"A｜Past Simple：颱風日故事","items":[{"id":"1-1","number":1,"prompt":"On Thursday evening, my family _____ (watch) the TV news at home.","answer":"watched","accepted":["watched"],"type":"fill","cue":"","wordbank":[],"sentence":"On Thursday evening, my family watched the TV news at home."},{"id":"1-2","number":2,"prompt":"The reporter _____ (say) that a strong typhoon was coming.","answer":"said","accepted":["said"],"type":"fill","cue":"","wordbank":[],"sentence":"The reporter said that a strong typhoon was coming."},{"id":"1-3","number":3,"prompt":"Mia and Nina _____ (jump) up and down when they heard the news.","answer":"jumped","accepted":["jumped"],"type":"fill","cue":"","wordbank":[],"sentence":"Mia and Nina jumped up and down when they heard the news."},{"id":"1-4","number":4,"prompt":"Dad _____ (decide) to drive the family to the department store.","answer":"decided","accepted":["decided"],"type":"fill","cue":"","wordbank":[],"sentence":"Dad decided to drive the family to the department store."},{"id":"1-5","number":5,"prompt":"They _____ (look) out of the car window.","answer":"looked","accepted":["looked"],"type":"fill","cue":"","wordbank":[],"sentence":"They looked out of the car window."},{"id":"1-6","number":6,"prompt":"They _____ (see) many surprising things on the way.","answer":"saw","accepted":["saw"],"type":"fill","cue":"","wordbank":[],"sentence":"They saw many surprising things on the way."},{"id":"1-7","number":7,"prompt":"Some trees _____ (fall) down on the sidewalk.","answer":"fell","accepted":["fell"],"type":"fill","cue":"","wordbank":[],"sentence":"Some trees fell down on the sidewalk."},{"id":"1-8","number":8,"prompt":"A shop sign _____ (blow) away in the strong wind.","answer":"blew","accepted":["blew"],"type":"fill","cue":"","wordbank":[],"sentence":"A shop sign blew away in the strong wind."},{"id":"1-9","number":9,"prompt":"People _____ (have) trouble walking through the water.","answer":"had","accepted":["had"],"type":"fill","cue":"","wordbank":[],"sentence":"People had trouble walking through the water."},{"id":"1-10","number":10,"prompt":"Mom _____ (tell) the twins not to open the windows.","answer":"told","accepted":["told"],"type":"fill","cue":"","wordbank":[],"sentence":"Mom told the twins not to open the windows."},{"id":"1-11","number":11,"prompt":"The family _____ (get) to SOGO in the afternoon.","answer":"got","accepted":["got"],"type":"fill","cue":"","wordbank":[],"sentence":"The family got to SOGO in the afternoon."},{"id":"1-12","number":12,"prompt":"They _____ (eat) instant noodles after they went home.","answer":"ate","accepted":["ate"],"type":"fill","cue":"","wordbank":[],"sentence":"They ate instant noodles after they went home."}]},{"title":"B｜Active or Passive：選出正確語態","items":[{"id":"2-1","number":1,"prompt":"The mayor _____ a typhoon day on the TV news.","answer":"announced","accepted":["announced"],"type":"choice","cue":"","wordbank":[],"options":["announced","was announced"],"correct":0,"sentence":"The mayor announced a typhoon day on the TV news."},{"id":"2-2","number":2,"prompt":"School _____ because of the strong typhoon.","answer":"was canceled","accepted":["was canceled"],"type":"choice","cue":"","wordbank":[],"options":["canceled","was canceled"],"correct":1,"sentence":"School was canceled because of the strong typhoon."},{"id":"2-3","number":3,"prompt":"The storm _____ several streets in Taipei.","answer":"flooded","accepted":["flooded"],"type":"choice","cue":"","wordbank":[],"options":["flooded","was flooded"],"correct":0,"sentence":"The storm flooded several streets in Taipei."},{"id":"2-4","number":4,"prompt":"Several streets _____ by the heavy rain.","answer":"were flooded","accepted":["were flooded"],"type":"choice","cue":"","wordbank":[],"options":["flooded","were flooded"],"correct":1,"sentence":"Several streets were flooded by the heavy rain."},{"id":"2-5","number":5,"prompt":"The strong wind _____ a shop sign away.","answer":"blew","accepted":["blew"],"type":"choice","cue":"","wordbank":[],"options":["blew","was blown"],"correct":0,"sentence":"The strong wind blew a shop sign away."},{"id":"2-6","number":6,"prompt":"A shop sign _____ away by the strong wind.","answer":"was blown","accepted":["was blown"],"type":"choice","cue":"","wordbank":[],"options":["blew","was blown"],"correct":1,"sentence":"A shop sign was blown away by the strong wind."},{"id":"2-7","number":7,"prompt":"A power outage _____ all the stores.","answer":"closed","accepted":["closed"],"type":"choice","cue":"","wordbank":[],"options":["closed","were closed"],"correct":0,"sentence":"A power outage closed all the stores."},{"id":"2-8","number":8,"prompt":"All the stores _____ because of a power outage.","answer":"were closed","accepted":["were closed"],"type":"choice","cue":"","wordbank":[],"options":["closed","were closed"],"correct":1,"sentence":"All the stores were closed because of a power outage."},{"id":"2-9","number":9,"prompt":"Dad _____ the family to the department store.","answer":"drove","accepted":["drove"],"type":"choice","cue":"","wordbank":[],"options":["drove","was driven"],"correct":0,"sentence":"Dad drove the family to the department store."},{"id":"2-10","number":10,"prompt":"The family _____ to the department store by Dad.","answer":"was driven","accepted":["was driven"],"type":"choice","cue":"","wordbank":[],"options":["drove","was driven"],"correct":1,"sentence":"The family was driven to the department store by Dad."}]},{"title":"C｜Active ↔ Passive：整句改寫","items":[{"id":"3-1","number":1,"prompt":"改成被動句：The strong wind blew a shop sign away.","answer":"A shop sign was blown away by the strong wind.","accepted":["A shop sign was blown away by the strong wind."],"type":"fill","cue":"","wordbank":[],"sentence":"A shop sign was blown away by the strong wind."},{"id":"3-2","number":2,"prompt":"改成被動句：The storm flooded the street.","answer":"The street was flooded by the storm.","accepted":["The street was flooded by the storm."],"type":"fill","cue":"","wordbank":[],"sentence":"The street was flooded by the storm."},{"id":"3-3","number":3,"prompt":"改成被動句：The wind turned the umbrellas inside out.","answer":"The umbrellas were turned inside out by the wind.","accepted":["The umbrellas were turned inside out by the wind."],"type":"fill","cue":"","wordbank":[],"sentence":"The umbrellas were turned inside out by the wind."},{"id":"3-4","number":4,"prompt":"改成被動句：The news surprised Mia and Nina.","answer":"Mia and Nina were surprised by the news.","accepted":["Mia and Nina were surprised by the news."],"type":"fill","cue":"","wordbank":[],"sentence":"Mia and Nina were surprised by the news."},{"id":"3-5","number":5,"prompt":"改成被動句：The fallen tree blocked the sidewalk.","answer":"The sidewalk was blocked by the fallen tree.","accepted":["The sidewalk was blocked by the fallen tree."],"type":"fill","cue":"","wordbank":[],"sentence":"The sidewalk was blocked by the fallen tree."},{"id":"3-6","number":6,"prompt":"改成被動句：Mom told us not to open the windows.","answer":"We were told not to open the windows by Mom.","accepted":["We were told not to open the windows by Mom.","We were told by Mom not to open the windows."],"type":"fill","cue":"","wordbank":[],"sentence":"We were told not to open the windows by Mom."},{"id":"3-7","number":7,"prompt":"改成主動句：The family was driven to SOGO by Dad.","answer":"Dad drove the family to SOGO.","accepted":["Dad drove the family to SOGO."],"type":"fill","cue":"","wordbank":[],"sentence":"Dad drove the family to SOGO."},{"id":"3-8","number":8,"prompt":"改成主動句：All the stores were closed by a power outage.","answer":"A power outage closed all the stores.","accepted":["A power outage closed all the stores."],"type":"fill","cue":"","wordbank":[],"sentence":"A power outage closed all the stores."}]}]};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let items=[],index=0,currentTitle='',wrong=new Map(),correct=new Set(),recognition=null;
function norm(s){return String(s).trim().toLowerCase().replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/\b(didn't)\b/g,'did not').replace(/\b(don't)\b/g,'do not').replace(/\b(doesn't)\b/g,'does not').replace(/\b(can't)\b/g,'cannot').replace(/\b(isn't)\b/g,'is not').replace(/\b(aren't)\b/g,'are not').replace(/\b(wasn't)\b/g,'was not').replace(/\b(weren't)\b/g,'were not').replace(/[,.!?;:]/g,'').replace(/\s+/g,' ').trim()}
function renderGroups(){const total=DATA.groups.flatMap(g=>g.items).length;$('#groups').innerHTML=`<button class="group-btn" data-all="1"><b>全部練習</b><span>${total} 題｜依原題順序</span></button>`+DATA.groups.map((g,i)=>`<button class="group-btn" data-i="${i}"><b>${esc(g.title)}</b><span>${g.items.length} 題</span></button>`).join('');document.querySelectorAll('.group-btn').forEach(b=>b.onclick=()=>b.dataset.all?start(DATA.groups.flatMap(g=>g.items.map(x=>({...x,group:g.title}))),'全部練習'):start(DATA.groups[+b.dataset.i].items.map(x=>({...x,group:DATA.groups[+b.dataset.i].title})),DATA.groups[+b.dataset.i].title))}
function start(chosen,title){items=chosen;currentTitle=title;index=0;wrong=new Map();correct=new Set();$('#select').classList.add('hidden');$('#result').classList.add('hidden');$('#quiz').classList.remove('hidden');show()}
function renderPassage(item){const p=item.passage||item.factFile||[];if(!p.length){$('#passage').classList.add('hidden');return}$('#passage').innerHTML=(item.factFile?'<h3>Rosa Parks Fact File</h3>':'')+p.map(x=>`<p>${esc(x)}</p>`).join('');$('#passage').classList.remove('hidden')}
function show(){try{recognition?.abort()}catch(e){}speechSynthesis?.cancel();const item=items[index];$('#meta').textContent=`${item.group||currentTitle}｜第 ${index+1} / ${items.length} 題`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=(index+1)/items.length*100+'%';$('#feedback').className='feedback hidden';$('#reference').classList.add('hidden');$('#voiceBox').classList.add('hidden');$('#voiceResult').className='voice-result';$('#voiceResult').textContent='尚未進行朗讀評分。';$('#mic').disabled=false;$('#mic').textContent='🎤 開始朗讀評分';$('#check').classList.remove('hidden');$('#next').classList.add('hidden');renderPassage(item);const q=$('#question'),a=$('#answerArea');if(item.type==='edit'){q.innerHTML=`${esc(item.prompt)}<br><span class="edit-target">${esc(item.wrong)}</span>`;a.innerHTML='<input class="answer" spellcheck="false" placeholder="輸入正確片語">'}else{q.textContent=item.prompt;if(item.type==='choice'){a.innerHTML='<div class="options">'+item.options.map((o,i)=>`<label class="option"><input type="radio" name="choice" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')+'</div>'}else if(item.type==='qa'){a.innerHTML='<label>Question<input class="answer q-answer" spellcheck="false" placeholder="依畫線部分寫問句"></label><label>Answer<input class="answer r-answer" spellcheck="false" placeholder="依 Fact File 完整回答"></label>'}else if(item.type==='tf'){a.innerHTML='<div class="options"><label class="option"><input type="radio" name="truth" value="true">That\'s right.</label><label class="option"><input type="radio" name="truth" value="false">That\'s wrong.</label></div>'+(!item.truth?'<input class="answer correction-answer" spellcheck="false" placeholder="若錯誤，請寫出正確句子">':'')}else{a.innerHTML=(item.wordbank?.length?'<div class="wordbank">'+item.wordbank.map(w=>`<span class="word">${esc(w)}</span>`).join('')+'</div>':'')+'<input class="answer" spellcheck="false" placeholder="輸入答案">'}}setTimeout(()=>a.querySelector('input')?.focus(),0)}
function answerText(item){if(item.sentence)return item.sentence;if(item.type==='qa')return `Q: ${item.questionAnswer}\nA: ${item.responseAnswer}`;if(item.type==='tf')return item.truth?"That's right.":`That's wrong. ${item.answer}`;return item.answer||item.options?.[item.correct]||''}
function recordWrong(item,value){const key=item.id;if(!wrong.has(key))wrong.set(key,{item,attempts:[]});wrong.get(key).attempts.push(value);$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
function speak(text=answerText(items[index])){if(!speechSynthesis||!text)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.86;speechSynthesis.speak(u)}
function speechNorm(s){return String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim()}
function similarity(a,b){a=speechNorm(a).split(' ').filter(Boolean);b=speechNorm(b).split(' ').filter(Boolean);const d=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)d[i][0]=i;for(let j=0;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return 1-d[a.length][b.length]/Math.max(a.length,b.length,1)}
async function listen(){const box=$('#voiceResult'),mic=$('#mic'),SR=window.SpeechRecognition||window.webkitSpeechRecognition,reset=()=>{mic.disabled=false;mic.textContent='🎤 開始朗讀評分'};speechSynthesis?.cancel();if(!window.isSecureContext){box.className='voice-result retry';box.textContent='請使用 HTTPS 網址開啟測驗，才能使用麥克風。';return}if(!SR){box.className='voice-result retry';box.textContent='此瀏覽器不支援語音辨識；可直接進入下一題。建議使用最新版 Chrome 或 Edge。';return}mic.disabled=true;mic.textContent='🎤 正在開啟麥克風…';try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('mediaDevices-unavailable');const stream=await navigator.mediaDevices.getUserMedia({audio:true});stream.getTracks().forEach(t=>t.stop())}catch(e){reset();box.className='voice-result retry';box.textContent='麥克風權限未開啟。請在瀏覽器網站權限中允許麥克風後再試。';return}try{recognition?.abort()}catch(e){}recognition=new SR();recognition.lang='en-US';recognition.interimResults=false;recognition.continuous=false;recognition.maxAlternatives=5;box.className='voice-result';box.textContent='🎤 正在聆聽，請朗讀完整句子…';mic.textContent='🎤 聆聽中…';recognition.onresult=e=>{const target=answerText(items[index]),alts=[...e.results[0]].map(x=>x.transcript),best=alts.map(t=>({t,s:similarity(t,target)})).sort((a,b)=>b.s-a.s)[0],pct=Math.round(best.s*100);box.className='voice-result '+(pct>=80?'good':'retry');box.innerHTML=`<strong>辨識結果：</strong>${esc(best.t)}<br><strong>準確率：</strong>${pct}%<br>${pct>=80?'✅ 朗讀內容與目標句相符。':'🔁 建議再聽一次後重新朗讀。'}<br><small>朗讀為選做，不影響下一題。</small>`};recognition.onerror=e=>{box.className='voice-result retry';box.textContent=e.error==='no-speech'?'沒有偵測到語音，請靠近麥克風再試一次。':e.error==='not-allowed'?'麥克風權限被封鎖，請在網站權限中允許後再試。':'語音辨識暫時無法使用（'+e.error+'），可重試或直接下一題。'};recognition.onend=reset;try{recognition.start()}catch(e){reset();box.className='voice-result retry';box.textContent='無法啟動語音辨識，請重新整理頁面後再試。'}}
$('#speak').onclick=()=>speak();
$('#mic').onclick=listen;
$('#check').onclick=()=>{const item=items[index];let ok=false,value='';if(item.type==='choice'){const s=document.querySelector('input[name="choice"]:checked');if(!s)return alert('請先選擇答案。');value=String.fromCharCode(65+(+s.value));ok=+s.value===item.correct}else if(item.type==='qa'){const q=$('.q-answer').value.trim(),r=$('.r-answer').value.trim();if(!q||!r)return alert('請完成問句與答句。');value=`Q: ${q} A: ${r}`;ok=norm(q)===norm(item.questionAnswer)&&norm(r)===norm(item.responseAnswer)}else if(item.type==='tf'){const s=document.querySelector('input[name="truth"]:checked');if(!s)return alert('請先判斷正誤。');const chosen=s.value==='true',correction=$('.correction-answer')?.value.trim()||'';if(!item.truth&&!correction)return alert('請寫出正確句子。');value=chosen?"That's right.":`That's wrong. ${correction}`;ok=chosen===item.truth&&(item.truth||norm(correction)===norm(item.answer))}else{value=$('#answerArea .answer').value.trim();if(!value)return alert('請先輸入答案。');ok=(item.accepted||[item.answer]).some(x=>norm(value)===norm(x))}if(ok){correct.add(item.id);$('#feedback').className='feedback ok';$('#feedback').textContent='✅ 正確！';$('#check').classList.add('hidden');$('#next').classList.remove('hidden');$('#voiceTarget').textContent=answerText(item);$('#voiceBox').classList.remove('hidden');speak()}else{recordWrong(item,value);$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 不正確，請修改後再試。';$('#reference').textContent='參考答案：\n'+answerText(item);$('#reference').classList.remove('hidden')}};
$('#next').onclick=()=>{index++;index>=items.length?finish():show()};$('#finish').onclick=finish;
function finish(){try{recognition?.abort()}catch(e){}speechSynthesis?.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');$('#summary').innerHTML=`<div class="stat">本輪題數<b>${items.length}</b></div><div class="stat">完成題數<b>${correct.size}</b></div><div class="stat">曾答錯<b>${wrong.size}</b></div>`;$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>`<div class="wrong-card"><b>${i+1}. ${esc(r.item.id)}</b><p>${esc(r.item.prompt||r.item.wrong)}</p><p><strong>作答：</strong>${r.attempts.map(esc).join('；')}</p><p><strong>答案：</strong>${esc(answerText(r.item))}</p></div>`).join(''):'<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size)}
$('#back').onclick=()=>{speechSynthesis?.cancel();$('#quiz').classList.add('hidden');$('#result').classList.add('hidden');$('#select').classList.remove('hidden')};$('#restart').onclick=()=>location.reload();
$('#download').onclick=async()=>{if(!wrong.size)return;try{if(!window.docx)await new Promise((ok,fail)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js';s.onload=ok;s.onerror=fail;document.head.append(s)});const{Document,Packer,Paragraph,TextRun,HeadingLevel}=window.docx,children=[new Paragraph({text:DATA.title+' 錯題紀錄',heading:HeadingLevel.TITLE})];for(const r of wrong.values())children.push(new Paragraph({children:[new TextRun({text:r.item.id,bold:true})]}),new Paragraph(r.item.prompt||r.item.wrong),new Paragraph('作答：'+r.attempts.join('；')),new Paragraph('答案：'+answerText(r.item)));const blob=await Packer.toBlob(new Document({sections:[{children}]})),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='KCIS_'+DATA.title.replace(/\s+/g,'_')+'_錯題.docx';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){alert('目前無法產生 DOCX，請稍後再試。')}};
renderGroups();
</script></body></html>
