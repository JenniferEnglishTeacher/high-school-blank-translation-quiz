].map(x=>({part:x[0],no:x[1],prompt:x[2],answers:x[3]}));let selected=[],idx=0,wrong=new Map(),mode='main',rec=null;const $=id=>document.getElementById(id),norm=s=>String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ').trim();function rule(part){return({I:'Part I: Add -er / -est directly（直接加 -er / -est）',II:'Part II: Ends in -e, add -r / -st（字尾 -e，加 -r / -st）',III:'Part III: Double final consonant + -er / -est（CVC 重複字尾）',IV:'Part IV: Multi-syllable → more / most（多音節）',V:'Part V: Irregular forms（不規則變化）'})[part]}function filled(q){return q.prompt.replace('____',q.answers[0]).replace(/\([^)]*\|[^)]*\)/g,'').replace(/\s+/g,' ').trim()}function renderList(filter='all'){let qs=filter==='all'?D:D.filter(q=>q.part===filter);$('list').innerHTML=qs.map(q=>`<label class="pick"><input type="checkbox" value="${q.no}" checked><span><span class="part">${rule(q.part)}</span><br><b>${q.no}.</b> ${q.prompt}</span></label>`).join('')}function render(){let q=selected[idx];$('meta').textContent=`${mode==='retry'?'錯題重做｜':''}第 ${idx+1} / ${selected.length} 題｜原題 ${q.no}`;$('bar').style.width=`${(idx+1)/selected.length*100}%`;$('partLabel').textContent=rule(q.part);let parts=q.prompt.split('____');$('qtext').innerHTML='';$('qtext').append(document.createTextNode(parts[0]));let inp=document.createElement('input');inp.id='ans';inp.autocomplete='off';inp.spellcheck=false;$('qtext').append(inp);$('qtext').append(document.createTextNode(parts.slice(1).join('____')));let base=(q.prompt.match(/\|\s*([^\)]+)\)/)||[])[1]||'';$('hint').textContent='提示：請依句意與比較級／最高級規則變化'+(base?`；原級：${base.trim()}`:'。');$('fb').className='feedback hidden';$('voiceBox').classList.add('hidden');$('check').classList.remove('hidden');$('next').classList.add('hidden');$('next').disabled=true;inp.focus()}function check(){let q=selected[idx],inp=$('ans'),v=norm(inp.value),ok=q.answers.some(a=>norm(a)===v);if(!ok){inp.className='bad';if(!wrong.has(q.no))wrong.set(q.no,{q,attempts:[]});wrong.get(q.no).attempts.push(inp.value||'(空白)');$('fb').className='feedback bad';$('fb').innerHTML=`❌ 不正確。正確答案：<b>${q.answers.join(' / ')}</b><br>請重新輸入正確答案。`;inp.value='';inp.focus();return}inp.className='ok';inp.disabled=true;$('fb').className='feedback ok';$('fb').textContent='✅ 填空正確！接著朗讀完整句子。';$('check').classList.add('hidden');$('voiceBox').classList.remove('hidden');$('voiceTarget').textContent=filled(q);$('next').classList.remove('hidden');$('next').disabled=!!(window.SpeechRecognition||window.webkitSpeechRecognition);$('vr').textContent=$('next').disabled?'請朗讀完整句子，達 90% 才能進下一題。':'此瀏覽器不支援語音辨識，已開放下一題。';speak()}function speak(){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(filled(selected[idx]));u.lang='en-US';u.rate=.88;window.speechSynthesis.speak(u)}function speechNorm(s){return norm(s).replace(/[^a-z0-9' ]/g,'').replace(/\s+/g,' ').trim()}function sim(a,b){a=speechNorm(a).split(' ').filter(Boolean);b=speechNorm(b).split(' ').filter(Boolean);let d=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)d[i][0]=i;for(let j=0;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return 1-d[a.length][b.length]/Math.max(a.length,b.length,1)}function listen(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$('next').disabled=false;$('vr').textContent='此瀏覽器不支援語音辨識，已開放下一題。';return}rec=new R;rec.lang='en-US';rec.interimResults=false;rec.maxAlternatives=5;$('mic').disabled=true;$('vr').textContent='🎤 正在聽，請朗讀完整句子…';rec.onresult=e=>{let best={s:0,t:''};for(let i=0;i<e.results[0].length;i++){let t=e.results[0][i].transcript,s=sim(t,filled(selected[idx]));if(s>best.s)best={s,t}}let p=Math.round(best.s*100);$('vr').innerHTML=`辨識：<b>${best.t}</b><br>正確性：<b>${p}%</b>`+(p>=90?'<br>✅ 通過，可以進下一題。':'<br>❌ 未達 90%，請再試一次。');$('next').disabled=p<90};rec.onerror=()=>{$('vr').textContent='語音辨識失敗，請再試一次。'};rec.onend=()=>{$('mic').disabled=false};rec.start()}function finish(){window.speechSynthesis?.cancel();$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('resultTitle').textContent=mode==='retry'?'錯題重做結果':'作答結果';$('summary').innerHTML=`本輪完成 <b>${selected.length}</b> 題；整份練習曾答錯 <b>${wrong.size}</b> 題。`;$('wrongList').innerHTML=wrong.size?[...wrong.values()].map(({q,attempts})=>`<div class="wrongcard"><b>第 ${q.no} 題｜${rule(q.part)}</b><div>${q.prompt}</div><div>錯誤答案：${attempts.join(' / ')}</div><div style="color:#15803d"><b>正確答案：${q.answers.join(' / ')}</b></div></div>`).join(''):'<p class="feedback ok">🎉 沒有錯題。</p>';$('retry').classList.toggle('hidden',wrong.size===0)}async function download(){let children=[new Paragraph({text:'adjective comparative superlative 錯題整理',heading:HeadingLevel.TITLE})];for(let{q,attempts}of wrong.values()){children.push(new Paragraph({children:[new TextRun({text:`第 ${q.no} 題 - ${rule(q.part)}`,bold:true})]}),new Paragraph(q.prompt),new Paragraph('錯誤答案：'+attempts.join(' / ')),new Paragraph('正確答案：'+q.answers.join(' / ')),new Paragraph('重新練習：________________________________________'))}let blob=await Packer.toBlob(new Document({sections:[{children}]})),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='adjective_comparative_superlative_錯題.docx';a.click();URL.revokeObjectURL(u)}renderList();document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>renderList(b.dataset.part));$('all').onclick=()=>document.querySelectorAll('#list input').forEach(x=>x.checked=true);$('none').onclick=()=>document.querySelectorAll('#list input').forEach(x=>x.checked=false);$('start').onclick=()=>{selected=[...document.querySelectorAll('#list input:checked')].map(x=>D.find(q=>q.no==x.value));if(!selected.length)return alert('請至少選一題');idx=0;mode='main';wrong.clear();$('sel').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()};$('check').onclick=check;$('speak').onclick=speak;$('mic').onclick=listen;$('next').onclick=()=>{if($('next').disabled)return;if(++idx>=selected.length)finish();else render()};$('finish').onclick=finish;$('retry').onclick=()=>{selected=[...wrong.values()].map(x=>x.q);idx=0;mode='retry';$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()};$('restart').onclick=()=>location.reload();$('download').onclick=download;</script></body></html>
