<script>window.QUIZ_CONFIG={"title": "國中會考單字片語｜介系詞片語 Prepositional Phrases", "mode": "mcq", "questions": [{"id": 1, "question": "Mr. Lin made a lot of money ______ his health, and now he is very sick.", "options": ["on the back of", "in memory of", "in order of", "at the cost of"], "answer": 3, "answerLabel": "D", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(D) at the cost of\n【用語】at the cost/expense of + N (prep.phr.)：犧牲……、以……為代價\n【中譯】林先生犧牲健康賺了很多錢，現在他病得很重。", "explanationSource": "supplemental"}, {"id": 2, "question": "We stayed home ______ the heavy rain.", "options": ["because of", "in front of", "instead of", "in memory of"], "answer": 0, "answerLabel": "A", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(A) because of\n【用語】because of + N/V-ing (prep.phr.)：由於、因為\n【中譯】因為大雨，我們待在家裡。", "explanationSource": "supplemental"}, {"id": 3, "question": "My brother loves math, but ______ me, I like English better.", "options": ["thanks to", "next to", "instead of", "as for"], "answer": 3, "answerLabel": "D", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(D) as for\n【用語】as for + N (prep.phr.)：至於；關於\n【中譯】我哥哥喜歡數學，但至於我，我比較喜歡英文。", "explanationSource": "supplemental"}, {"id": 4, "question": "______ cooking, my mom is the best in our family.", "options": ["For fear of", "When it comes to", "At the price of", "In case of"], "answer": 1, "answerLabel": "B", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(B) When it comes to\n【用語】when it comes to + N/V-ing (prep.phr.)：說到、提及\n【中譯】說到烹飪，我媽媽是我們家最厲害的。", "explanationSource": "supplemental"}, {"id": 5, "question": "______ English, Amy can also speak Japanese.", "options": ["Away from", "Aside from", "According to", "In place of"], "answer": 1, "answerLabel": "B", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(B) Aside from\n【用語】aside from + N/V-ing (prep.phr.)：除了⋯⋯之外\n【中譯】除了英文之外，Amy也會說日文。", "explanationSource": "supplemental"}, {"id": 6, "question": "I have a question ______ the homework.", "options": ["with regard to", "in spite of", "away from", "in memory of"], "answer": 0, "answerLabel": "A", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(A) with regard to\n【用語】in/with regard to + N (prep.phr.)：關於\n【中譯】我有一個關於作業的問題。", "explanationSource": "supplemental"}, {"id": 7, "question": "The little monkey is riding ______ its mother.", "options": ["in spite of", "according to", "in case of", "on the back of"], "answer": 3, "answerLabel": "D", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(D) on the back of\n【用語】on the back of + N (prep.phr.)：在…的背上\n【中譯】小猴子騎在牠媽媽的背上。", "explanationSource": "supplemental"}, {"id": 8, "question": "The hungry cat walked around the kitchen ______ food.", "options": ["in search of", "in order of", "in memory of", "at the price of"], "answer": 0, "answerLabel": "A", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(A) in search of\n【用語】in search of + N (prep.phr.)：尋找\n【中譯】那隻飢餓的貓在廚房裡走來走去尋找食物。", "explanationSource": "supplemental"}, {"id": 9, "question": "This bus can carry ______ fifty people.", "options": ["in front of", "because of", "up to", "such as"], "answer": 2, "answerLabel": "C", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(C) up to\n【用語】up to + N (prep.phr.)：多達、高至、長達\n【中譯】這台公車可以載多達五十人。", "explanationSource": "supplemental"}, {"id": 10, "question": "I saw an old friend ______ school this morning.", "options": ["on my way to", "regardless of", "in spite of", "in place of"], "answer": 0, "answerLabel": "A", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(A) on my way to\n【用語】on one's way to + 地方 (prep.phr.)：在去……的路上\n【中譯】今天早上我在去學校的路上看到一位老朋友。", "explanationSource": "supplemental"}, {"id": 11, "question": "The driver always sits ______ the bus.", "options": ["instead of", "because of", "in memory of", "in the front of"], "answer": 3, "answerLabel": "D", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(D) in the front of\n【用語】in the front of + N (prep.phr.)：在⋯⋯的前部\n【中譯】司機總是坐在公車的前部。", "explanationSource": "supplemental"}, {"id": 12, "question": "______ my teacher's help, I passed the math test.", "options": ["In search of", "At the end of", "Thanks to", "Away from"], "answer": 2, "answerLabel": "C", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(C) Thanks to\n【用語】thanks to + N (prep.phr.)：多虧；由於\n【中譯】多虧老師的幫忙，我通過了數學考試。", "explanationSource": "supplemental"}, {"id": 13, "question": "Ben goes jogging every morning ______ the weather.", "options": ["in order of", "regardless of", "on the back of", "at the price of"], "answer": 1, "answerLabel": "B", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(B) regardless of\n【用語】regardless of + N (prep.phr.)：不論、不管、不顧\n【中譯】不論天氣如何，Ben每天早上都去慢跑。", "explanationSource": "supplemental"}, {"id": 14, "question": "I like fruits ______ apples and bananas.", "options": ["such as", "on behalf of", "in the face of", "in case of"], "answer": 0, "answerLabel": "A", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(A) such as\n【用語】such as + N (prep.phr.)：例如、像是\n【中譯】我喜歡水果，例如蘋果和香蕉。", "explanationSource": "supplemental"}, {"id": 15, "question": "Please keep the baby ______ the hot water.", "options": ["in terms of", "thanks to", "according to", "away from"], "answer": 3, "answerLabel": "D", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(D) away from\n【用語】away from + N (prep.phr.)：遠離\n【中譯】請讓寶寶遠離熱水。", "explanationSource": "supplemental"}, {"id": 16, "question": "This restaurant has great food, ______ its friendly service.", "options": ["at the sight of", "for fear of", "in place of", "not to mention"], "answer": 3, "answerLabel": "D", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(D) not to mention\n【用語】not to mention + N/V-ing (prep.phr.)：更別提、更不用說\n【中譯】這家餐廳有很棒的食物，更不用說它親切的服務。", "explanationSource": "supplemental"}, {"id": 17, "question": "The students had different ideas ______ where to go for the class trip.", "options": ["at the bottom of", "in front of", "right after", "as to"], "answer": 3, "answerLabel": "D", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(D) as to\n【用語】as to + N/wh- 子句 (prep.phr.)：關於、至於\n【中譯】學生們對於校外教學要去哪裡有不同的想法。", "explanationSource": "supplemental"}, {"id": 18, "question": "Mia did her homework ______ dinner.", "options": ["right after", "in memory of", "in terms of", "in search of"], "answer": 0, "answerLabel": "A", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(A) right after\n【用語】right after + N (prep.phr.)：就在……之後；緊接著\n【中譯】Mia晚餐後馬上就寫功課。", "explanationSource": "supplemental"}, {"id": 19, "question": "Wash your hands ______ eating.", "options": ["in order of", "in front of", "up to", "before"], "answer": 3, "answerLabel": "D", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(D) before\n【用語】before + N/V-ing (prep.phr.)：在……之前\n【中譯】吃東西之前要洗手。", "explanationSource": "supplemental"}, {"id": 20, "question": "There is a tall tree ______ our school.", "options": ["in front of", "in case of", "thanks to", "due to"], "answer": 0, "answerLabel": "A", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(A) in front of\n【用語】in front of + N (prep.phr.)：在……前面\n【中譯】我們學校前面有一棵高大的樹。", "explanationSource": "supplemental"}, {"id": 21, "question": "I found my lost key ______ my bag.", "options": ["because of", "at the bottom of", "regardless of", "in terms of"], "answer": 1, "answerLabel": "B", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(B) at the bottom of\n【用語】at the bottom of + N (prep.phr.)：在…底部\n【中譯】我在我的包包底部找到我遺失的鑰匙。", "explanationSource": "supplemental"}, {"id": 22, "question": "My phone rang ______ the movie, and everyone looked at me.", "options": ["in the middle of", "in place of", "in search of", "thanks to"], "answer": 0, "answerLabel": "A", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(A) in the middle of\n【用語】in the middle of + N (prep.phr.)：在……的中間\n【中譯】我的手機在電影播到一半時響了，大家都看著我。", "explanationSource": "supplemental"}, {"id": 23, "question": "The town built a statue ______ a kind old doctor who helped many people.", "options": ["in terms of", "away from", "in memory of", "in case of"], "answer": 2, "answerLabel": "C", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(C) in memory of\n【用語】in memory of + N (prep.phr.)：（為了）紀念、懷念\n【中譯】這個鎮為了紀念一位幫助過許多人的親切老醫生，建了一座雕像。", "explanationSource": "supplemental"}, {"id": 24, "question": "______ playing the piano, Lily also plays the violin.", "options": ["According to", "In addition to", "For fear of", "In the face of"], "answer": 1, "answerLabel": "B", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(B) In addition to\n【用語】in addition to + N/V-ing (prep.phr.)：除了……以外（還有）\n【中譯】除了彈鋼琴以外，Lily也會拉小提琴。", "explanationSource": "supplemental"}, {"id": 25, "question": "______ the weather report, it will rain tomorrow.", "options": ["Instead of", "In the back of", "According to", "In place of"], "answer": 2, "answerLabel": "C", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(C) According to\n【用語】according to + N (prep.phr.)：根據\n【中譯】根據氣象報告，明天會下雨。", "explanationSource": "supplemental"}, {"id": 26, "question": "Mr. Wang is sick today, so Ms. Chen will teach our class ______ him.", "options": ["in terms of", "in place of", "at the sight of", "at the bottom of"], "answer": 1, "answerLabel": "B", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(B) in place of\n【用語】in place of + 人 (prep.phr.)：代替某人\n【中譯】王老師今天生病，所以陳老師會代替他教我們班。", "explanationSource": "supplemental"}, {"id": 27, "question": "Our team is ten points ______ the other team.", "options": ["instead of", "in memory of", "because of", "ahead of"], "answer": 3, "answerLabel": "D", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(D) ahead of\n【用語】ahead of + N (prep.phr.)：在⋯⋯前面；領先\n【中譯】我們隊領先另一隊十分。", "explanationSource": "supplemental"}, {"id": 28, "question": "Please turn off your phone ______ the test.", "options": ["in terms of", "in search of", "at the price of", "prior to"], "answer": 3, "answerLabel": "D", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(D) prior to\n【用語】prior to + N/V-ing (prep.phr.)：在……之前\n【中譯】考試之前請關掉手機。", "explanationSource": "supplemental"}, {"id": 29, "question": "Amy sits ______ me in class, so we often talk.", "options": ["such as", "in case of", "next to", "in terms of"], "answer": 2, "answerLabel": "C", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(C) next to\n【用語】next to + N (prep.phr.)：在……旁邊\n【中譯】Amy上課坐在我旁邊，所以我們常聊天。", "explanationSource": "supplemental"}, {"id": 30, "question": "Let's walk to the park ______ taking the bus.", "options": ["in the face of", "in memory of", "instead of", "at the end of"], "answer": 2, "answerLabel": "C", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(C) instead of\n【用語】instead of + N/V-ing (prep.phr.)：代替；而不是\n【中譯】我們走路去公園，而不要搭公車吧。", "explanationSource": "supplemental"}, {"id": 31, "question": "Jenny finished her report two days ______ the deadline.", "options": ["ahead of", "in spite of", "in place of", "in order of"], "answer": 0, "answerLabel": "A", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(A) ahead of\n【用語】ahead of + N (prep.phr.)：在⋯⋯之前（時間）\n【中譯】Jenny比截止日期提前兩天完成了報告。", "explanationSource": "supplemental"}, {"id": 32, "question": "______ fire, please use the stairs, not the elevator.", "options": ["In addition to", "Along with", "Thanks to", "In case of"], "answer": 3, "answerLabel": "D", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(D) In case of\n【用語】in case of + N (prep.phr.)：以防萬一發生……\n【中譯】萬一發生火災，請走樓梯，不要搭電梯。", "explanationSource": "supplemental"}, {"id": 33, "question": "______ the heavy rain, they still played soccer.", "options": ["Because of", "In spite of", "Next to", "Such as"], "answer": 1, "answerLabel": "B", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(B) In spite of\n【用語】in spite of + N/V-ing (prep.phr.)：儘管\n【中譯】儘管下大雨，他們還是去踢足球。", "explanationSource": "supplemental"}, {"id": 34, "question": "The children are sleeping ______ the car.", "options": ["due to", "on behalf of", "in the back of", "in case of"], "answer": 2, "answerLabel": "C", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(C) in the back of\n【用語】in the back of + N (prep.phr.)：在…的後面（內部後方）\n【中譯】孩子們正在車子的後座睡覺。", "explanationSource": "supplemental"}, {"id": 35, "question": "We have a big test ______ this month.", "options": ["at the end of", "such as", "regardless of", "in place of"], "answer": 0, "answerLabel": "A", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(A) at the end of\n【用語】at the end of + N (prep.phr.)：在……的結尾\n【中譯】我們在這個月底有一個大考。", "explanationSource": "supplemental"}, {"id": 36, "question": "______ price, this phone is better than that one.", "options": ["In search of", "In place of", "At the sight of", "In terms of"], "answer": 3, "answerLabel": "D", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(D) In terms of\n【用語】in terms of + N (prep.phr.)：從……的角度、就……而言\n【中譯】就價格而言，這支手機比那支好。", "explanationSource": "supplemental"}, {"id": 37, "question": "Everyone went to the party ______ Tom, who was sick.", "options": ["except for", "in the face of", "at the price of", "in the center of"], "answer": 0, "answerLabel": "A", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(A) except for\n【用語】except for + N (prep.phr.)：除了……以外\n【中譯】除了生病的Tom以外，大家都去了派對。", "explanationSource": "supplemental"}, {"id": 38, "question": "She walked slowly on the ice ______ falling down.", "options": ["thanks to", "along with", "for fear of", "in terms of"], "answer": 2, "answerLabel": "C", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(C) for fear of\n【用語】for fear of + N/V-ing (prep.phr.)：因害怕⋯⋯；害怕⋯⋯而\n【中譯】她因為害怕跌倒，在冰上走得很慢。", "explanationSource": "supplemental"}, {"id": 39, "question": "Please line up ______ height, from short to tall.", "options": ["in order of", "on the back of", "away from", "in memory of"], "answer": 0, "answerLabel": "A", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(A) in order of\n【用語】in order of + N (prep.phr.)：以⋯⋯的順序；按照⋯⋯排列\n【中譯】請按照身高順序排隊，從矮到高。", "explanationSource": "supplemental"}, {"id": 40, "question": "The train was late ______ the typhoon.", "options": ["at the sight of", "due to", "in place of", "in addition to"], "answer": 1, "answerLabel": "B", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(B) due to\n【用語】due to + N (prep.phr.)：由於；因為\n【中譯】火車因為颱風而誤點了。", "explanationSource": "supplemental"}, {"id": 41, "question": "We went swimming ______ school.", "options": ["at the sight of", "for fear of", "according to", "after"], "answer": 3, "answerLabel": "D", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(D) after\n【用語】after + N (prep.phr.)：在……之後；隨後\n【中譯】我們放學後去游泳。", "explanationSource": "supplemental"}, {"id": 42, "question": "The teacher chose the class leader ______ the students' votes.", "options": ["on the basis of", "in memory of", "away from", "in the back of"], "answer": 0, "answerLabel": "A", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(A) on the basis of\n【用語】on the basis of + N (prep.phr.)：以……為基礎\n【中譯】老師以學生的投票為依據選出班長。", "explanationSource": "supplemental"}, {"id": 43, "question": "We stopped at a convenience store ______ the beach.", "options": ["regardless of", "on the way to", "thanks to", "in terms of"], "answer": 1, "answerLabel": "B", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(B) on the way to\n【用語】on the way to + 地方 (prep.phr.)：在前往……的路上\n【中譯】我們在去海邊的路上，在一家便利商店停了一下。", "explanationSource": "supplemental"}, {"id": 44, "question": "______ the long lines, we had a great time at the zoo.", "options": ["On the back of", "In search of", "Apart from", "In order of"], "answer": 2, "answerLabel": "C", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(C) Apart from\n【用語】apart from + N/V-ing (prep.phr.)：除了……之外\n【中譯】除了大排長龍之外，我們在動物園玩得很開心。", "explanationSource": "supplemental"}, {"id": 45, "question": "I bought this T-shirt ______ 200 dollars.", "options": ["in response to", "in memory of", "in the face of", "at the price of"], "answer": 3, "answerLabel": "D", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(D) at the price of\n【用語】at the price of + N (prep.phr.)：以……的價格\n【中譯】我以兩百元的價格買了這件T恤。", "explanationSource": "supplemental"}, {"id": 46, "question": "Let's meet at the bank; it is ______ the post office, just on the other side of the street.", "options": ["at the sight of", "in response to", "across from", "in memory of"], "answer": 2, "answerLabel": "C", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(C) across from\n【用語】across from + N (prep.phr.)：在…對面\n【中譯】我們在銀行見面吧；它就在郵局的對面，就在街道的另一邊。", "explanationSource": "supplemental"}, {"id": 47, "question": "Amy is our class leader, so she thanked the teacher ______ our whole class.", "options": ["at the bottom of", "on behalf of", "in search of", "in case of"], "answer": 1, "answerLabel": "B", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(B) on behalf of\n【用語】on behalf of + N (prep.phr.)：代表\n【中譯】Amy 是我們的班長，所以她代表我們全班向老師道謝。", "explanationSource": "supplemental"}, {"id": 48, "question": "______ the movie, the hero is a poor boy, but at the end he becomes a king.", "options": ["In search of", "At the price of", "At the beginning of", "For fear of"], "answer": 2, "answerLabel": "C", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(C) At the beginning of\n【用語】at the beginning of + N (prep.phr.)：在……的開始\n【中譯】在電影的開頭，主角是個窮男孩，但最後他成為了國王。", "explanationSource": "supplemental"}, {"id": 49, "question": "The little girl started to cry ______ the big dog.", "options": ["in terms of", "in place of", "at the sight of", "on behalf of"], "answer": 2, "answerLabel": "C", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(C) at the sight of\n【用語】at the sight of + N (prep.phr.)：一看到、一見到\n【中譯】小女孩一看到那隻大狗就開始哭。", "explanationSource": "supplemental"}, {"id": 50, "question": "There is a big fountain ______ the park, and many paths go out from it to every side.", "options": ["on the back of", "in response to", "in the center of", "at the cost of"], "answer": 2, "answerLabel": "C", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(C) in the center of\n【用語】in the center of + N (prep.phr.)：在…中央\n【中譯】公園的中央有一座大噴泉，許多小路從那裡通往四面八方。", "explanationSource": "supplemental"}, {"id": 51, "question": "The firefighters stayed calm and brave ______ great danger.", "options": ["on the back of", "in the face of", "in order of", "across from"], "answer": 1, "answerLabel": "B", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(B) in the face of\n【用語】in the face of + N (prep.phr.)：面對\n【中譯】消防員面對極大的危險時仍保持冷靜和勇敢。", "explanationSource": "supplemental"}, {"id": 52, "question": "______ the students' letters, the school decided to open the library on Saturdays.", "options": ["At the price of", "In response to", "Across from", "In the center of"], "answer": 1, "answerLabel": "B", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(B) In response to\n【用語】in response to + N (prep.phr.)：做為對……的回應\n【中譯】作為對學生來信的回應，學校決定在星期六開放圖書館。", "explanationSource": "supplemental"}, {"id": 53, "question": "Please bring your notebook ______ your English book because you will need both of them tomorrow.", "options": ["in the face of", "at the sight of", "along with", "on behalf of"], "answer": 2, "answerLabel": "C", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(C) along with\n【用語】along with + N (prep.phr.)：與、和\n【中譯】請把你的筆記本和英文課本一起帶來，因為你明天兩樣都會用到。", "explanationSource": "supplemental"}, {"id": 54, "question": "Tom played video games all night ______ his sleep, so he was very tired the next day.", "options": ["in memory of", "in the center of", "across from", "at the cost of"], "answer": 3, "answerLabel": "D", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(D) at the cost of\n【用語】at the cost/expense of + N (prep.phr.)：犧牲……、以……為代價\n【中譯】Tom 犧牲睡眠整晚打電動，所以隔天非常累。", "explanationSource": "supplemental"}, {"id": 55, "question": "The baseball game was stopped ______ the heavy rain.", "options": ["because of", "in spite of", "instead of", "such as"], "answer": 0, "answerLabel": "A", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(A) because of\n【用語】because of + N/V-ing (prep.phr.)：由於、因為\n【中譯】棒球比賽因為大雨而暫停了。", "explanationSource": "supplemental"}, {"id": 56, "question": "My parents both like coffee; ______ me, I prefer milk tea.", "options": ["in case of", "as for", "next to", "thanks to"], "answer": 1, "answerLabel": "B", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(B) as for\n【用語】as for + N (prep.phr.)：至於；關於\n【中譯】我爸媽都喜歡咖啡；至於我，我比較喜歡奶茶。", "explanationSource": "supplemental"}, {"id": 57, "question": "Tina is not good at sports, but ______ math, she is the best student in our class.", "options": ["in case of", "on the back of", "when it comes to", "at the bottom of"], "answer": 2, "answerLabel": "C", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(C) when it comes to\n【用語】when it comes to + N/V-ing (prep.phr.)：說到、提及\n【中譯】Tina 不擅長運動，但說到數學，她是我們班上最好的學生。", "explanationSource": "supplemental"}, {"id": 58, "question": "______ English, Ben also studies Japanese and Korean after school.", "options": ["Aside from", "At the sight of", "On behalf of", "In the face of"], "answer": 0, "answerLabel": "A", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(A) Aside from\n【用語】aside from + N/V-ing (prep.phr.)：除了⋯⋯之外\n【中譯】除了英文之外，Ben 放學後還學日文和韓文。", "explanationSource": "supplemental"}, {"id": 59, "question": "I have a question ______ the homework for tomorrow.", "options": ["across from", "in regard to", "for fear of", "at the price of"], "answer": 1, "answerLabel": "B", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(B) in regard to\n【用語】in/with regard to + N (prep.phr.)：關於\n【中譯】我有一個關於明天作業的問題。", "explanationSource": "supplemental"}, {"id": 60, "question": "The little boy is tired, so he is sitting ______ his father as they walk home together.", "options": ["at the beginning of", "on the back of", "in the back of", "at the bottom of"], "answer": 1, "answerLabel": "B", "source": "介系詞片語 Prepositional Phrases", "explanation": "【答案】(B) on the back of\n【用語】on the back of + N (prep.phr.)：在…的背上\n【中譯】小男孩累了，所以他們一起走路回家時，他坐在爸爸的背上。", "explanationSource": "supplemental"}]};</script><script>window.LEARN_DATA=[{"g": "", "t": "according to + N", "p": "(prep.phr.)", "e": "as said by; based on", "z": "根據", "s": "_____ _____ the weather report, it will rain heavily this afternoon, so Grandpa told me to bring an umbrella to school.", "c": "【根據】氣象報告，今天下午會下大雨，所以爺爺叫我帶雨傘去學校。", "f": "According to the weather report, it will rain heavily this afternoon, so Grandpa told me to bring an umbrella to school."}, {"g": "", "t": "across from + N", "p": "(prep.phr.)", "e": "on the other side of a street from", "z": "在…對面", "s": "There is a new bubble tea shop _____ _____ our school, so many students buy drinks there after class every day.", "c": "我們學校【對面】有一家新的珍奶店，所以很多學生每天放學後都去那裡買飲料。", "f": "There is a new bubble tea shop across from our school, so many students buy drinks there after class every day."}, {"g": "", "t": "after + N", "p": "(prep.phr.)", "e": "later than a time or an event", "z": "在……之後；隨後", "s": "We usually go jogging along the river _____ dinner, because the weather is much cooler at night in summer.", "c": "我們通常在晚餐【之後】沿著河邊慢跑，因為夏天晚上的天氣涼爽多了。", "f": "We usually go jogging along the river after dinner, because the weather is much cooler at night in summer."}, {"g": "", "t": "ahead of + N", "p": "(prep.phr.)", "e": "before a time or event", "z": "在⋯⋯之前（時間）", "s": "We finished our science project two days _____ _____ the deadline, so we had time to check every page.", "c": "我們【在截止日期之前】兩天就完成了科學報告，所以有時間檢查每一頁。", "f": "We finished our science project two days ahead of the deadline, so we had time to check every page."}, {"g": "", "t": "ahead of + N", "p": "(prep.phr.)", "e": "in front of; doing better than others", "z": "在⋯⋯前面；領先", "s": "In the race, Jason ran fast and stayed _____ _____ the other runners, so he won first place easily.", "c": "賽跑時，傑森跑得很快，一直【領先】其他選手，所以輕鬆拿下第一名。", "f": "In the race, Jason ran fast and stayed ahead of the other runners, so he won first place easily."}, {"g": "", "t": "along with + N", "p": "(prep.phr.)", "e": "together with", "z": "與、和", "s": "Mr. Chen went hiking on Yangmingshan last Sunday _____ _____ his two sons, and they saw many beautiful flowers on the way.", "c": "陳先生上週日【和】他的兩個兒子去陽明山健行，他們在路上看到許多美麗的花。", "f": "Mr. Chen went hiking on Yangmingshan last Sunday along with his two sons, and they saw many beautiful flowers on the way."}, {"g": "", "t": "apart from + N/V-ing", "p": "(prep.phr.)", "e": "except for", "z": "除了……之外", "s": "_____ _____ Kevin, everyone in my class went on the school trip to the zoo, because he had a bad cold that day.", "c": "【除了】凱文【之外】，我們班上每個人都去了動物園校外教學，因為他那天得了重感冒。", "f": "Apart from Kevin, everyone in my class went on the school trip to the zoo, because he had a bad cold that day."}, {"g": "", "t": "as for + N", "p": "(prep.phr.)", "e": "used to start talking about someone or something", "z": "至於；關於", "s": "Most of my classmates want to go to the beach this summer. _____ _____ me, I'd rather stay home and read comic books.", "c": "我大部分的同學這個暑假都想去海邊。【至於】我，我寧願待在家看漫畫。", "f": "Most of my classmates want to go to the beach this summer. As for me, I'd rather stay home and read comic books."}, {"g": "", "t": "as to + N/wh- 子句", "p": "(prep.phr.)", "e": "about; when talking about", "z": "關於、至於", "s": "We have decided to visit Tainan next weekend, but _____ _____ where we will stay, we still need to check some hotels online.", "c": "我們已經決定下週末去台南，但【至於】要住哪裡，我們還需要上網查一些飯店。", "f": "We have decided to visit Tainan next weekend, but as to where we will stay, we still need to check some hotels online."}, {"g": "", "t": "aside from + N/V-ing", "p": "(prep.phr.)", "e": "except for; also, besides", "z": "除了⋯⋯之外", "s": "_____ _____ swimming, Jason also likes playing basketball with his classmates after school on Fridays.", "c": "【除了】游泳以外，Jason也喜歡星期五放學後和同學打籃球。", "f": "Aside from swimming, Jason also likes playing basketball with his classmates after school on Fridays."}, {"g": "", "t": "at the beginning of + N", "p": "(prep.phr.)", "e": "in the first part of something", "z": "在……的開始", "s": "_____ _____ _____ _____ the new school year, our teacher asked each of us to write down three goals and share them.", "c": "在新學年【開始】的時候，老師要我們每個人寫下三個目標並分享出來。", "f": "At the beginning of the new school year, our teacher asked each of us to write down three goals and share them."}, {"g": "", "t": "at the bottom of + N", "p": "(prep.phr.)", "e": "at the lowest part of", "z": "在…底部", "s": "I finally found my lost math notebook _____ _____ _____ _____ my school bag, under all my books and pencil boxes.", "c": "我終於找到遺失的數學筆記本，它【在書包的底部】，壓在所有書和鉛筆盒下面。", "f": "I finally found my lost math notebook at the bottom of my school bag, under all my books and pencil boxes."}, {"g": "", "t": "at the cost/expense of + N", "p": "(prep.phr.)", "e": "by losing something else", "z": "犧牲……、以……為代價", "s": "Henry finished the whole video game in one weekend, but he did it _____ _____ _____ _____ his sleep and his homework.", "c": "亨利一個週末就破完整個電玩遊戲，但他是【犧牲】了睡眠和功課換來的。", "f": "Henry finished the whole video game in one weekend, but he did it at the cost of his sleep and his homework."}, {"g": "", "t": "at the end of + N", "p": "(prep.phr.)", "e": "in the last part of something", "z": "在……的結尾", "s": "_____ _____ _____ _____ the movie, the little dog finally found its family, and many people in the theater cried.", "c": "在電影的【結尾】，小狗終於找到了牠的家人，戲院裡很多人都哭了。", "f": "At the end of the movie, the little dog finally found its family, and many people in the theater cried."}, {"g": "", "t": "at the price of + N", "p": "(prep.phr.)", "e": "for a certain amount of money", "z": "以……的價格", "s": "The shop is selling these sneakers _____ _____ _____ _____ only five hundred dollars this week, so my cousin bought two pairs.", "c": "這家店本週【以】只要五百元【的價格】賣這些球鞋，所以我表哥買了兩雙。", "f": "The shop is selling these sneakers at the price of only five hundred dollars this week, so my cousin bought two pairs."}, {"g": "", "t": "at the sight of + N", "p": "(prep.phr.)", "e": "when seeing something", "z": "一看到、一見到", "s": "My little sister started crying _____ _____ _____ _____ the big spider on the wall, so Dad came and took it outside.", "c": "我妹妹【一看到】牆上的大蜘蛛就哭了起來，所以爸爸過來把牠拿到外面。", "f": "My little sister started crying at the sight of the big spider on the wall, so Dad came and took it outside."}, {"g": "", "t": "away from + N", "p": "(prep.phr.)", "e": "at a distance from someone or something", "z": "遠離", "s": "Please keep the medicine _____ _____ small children, and put it on the top shelf of the kitchen cabinet.", "c": "請把藥放在【遠離】小孩的地方，放在廚房櫃子的最上層。", "f": "Please keep the medicine away from small children, and put it on the top shelf of the kitchen cabinet."}, {"g": "", "t": "because of + N/V-ing", "p": "(prep.phr.)", "e": "for the reason of something", "z": "由於、因為", "s": "The baseball game between the two schools was canceled _____ _____ the heavy rain, so all the players went home early and felt disappointed.", "c": "兩校之間的棒球比賽【因為】大雨而取消，所以所有球員都提早回家，覺得很失望。", "f": "The baseball game between the two schools was canceled because of the heavy rain, so all the players went home early and felt disappointed."}, {"g": "", "t": "before + N/V-ing", "p": "(prep.phr.)", "e": "earlier than a time or an action", "z": "在……之前", "s": "Please wash your hands _____ eating dinner, because you played with the dog in the park all afternoon.", "c": "吃晚餐【之前】請先洗手，因為你整個下午都在公園裡跟狗玩。", "f": "Please wash your hands before eating dinner, because you played with the dog in the park all afternoon."}, {"g": "", "t": "due to + N", "p": "(prep.phr.)", "e": "because of something", "z": "由於；因為", "s": "The baseball game was stopped in the fifth inning _____ _____ the heavy rain, and all the fans had to go home early.", "c": "【由於】大雨，棒球比賽在第五局就停止了，所有球迷都只好提早回家。", "f": "The baseball game was stopped in the fifth inning due to the heavy rain, and all the fans had to go home early."}, {"g": "", "t": "except for + N", "p": "(prep.phr.)", "e": "not including someone or something", "z": "除了……以外", "s": "Everyone in my class passed the math test _____ _____ Peter, who was sick and missed most of the lessons.", "c": "【除了彼得以外】，我們班每個人數學考試都及格了，他生病缺了大部分的課。", "f": "Everyone in my class passed the math test except for Peter, who was sick and missed most of the lessons."}, {"g": "", "t": "for fear of + N/V-ing", "p": "(prep.phr.)", "e": "because you worry that something will happen", "z": "因害怕⋯⋯；害怕⋯⋯而", "s": "Lisa walked very slowly on the wet road _____ _____ _____ falling down and breaking her new phone.", "c": "Lisa在濕滑的路上走得很慢，【因為害怕】跌倒摔壞她的新手機。", "f": "Lisa walked very slowly on the wet road for fear of falling down and breaking her new phone."}, {"g": "", "t": "in addition to + N/V-ing", "p": "(prep.phr.)", "e": "as well as; besides", "z": "除了……以外（還有）", "s": "_____ _____ _____ English, Yu-xuan is learning Japanese because she wants to travel to Osaka with her family next year.", "c": "【除了英文以外】，宇萱也在學日文，因為她明年想和家人去大阪旅行。", "f": "In addition to English, Yu-xuan is learning Japanese because she wants to travel to Osaka with her family next year."}, {"g": "", "t": "in case of + N", "p": "(prep.phr.)", "e": "if something bad happens", "z": "以防萬一發生……", "s": "_____ _____ _____ fire, students should leave the classroom quietly and walk to the playground with their teacher.", "c": "【萬一發生】火災，學生應該安靜地離開教室，並跟著老師走到操場。", "f": "In case of fire, students should leave the classroom quietly and walk to the playground with their teacher."}, {"g": "", "t": "in front of + N", "p": "(prep.phr.)", "e": "at the place facing the front of something", "z": "在……前面", "s": "We agreed to meet _____ _____ _____ the convenience store at seven, but Jason was late because he missed the bus.", "c": "我們約好七點在便利商店【前面】碰面，但傑森因為錯過公車而遲到了。", "f": "We agreed to meet in front of the convenience store at seven, but Jason was late because he missed the bus."}, {"g": "", "t": "in memory of + N", "p": "(prep.phr.)", "e": "to remember a dead person", "z": "（為了）紀念、懷念", "s": "The students planted a tree near the school gate _____ _____ _____ their kind old principal, who passed away last year.", "c": "學生們在校門口附近種了一棵樹，【紀念】去年過世的慈祥老校長。", "f": "The students planted a tree near the school gate in memory of their kind old principal, who passed away last year."}, {"g": "", "t": "in order of + N", "p": "(prep.phr.)", "e": "arranged by size, number, time, and so on", "z": "以⋯⋯的順序；按照⋯⋯排列", "s": "Please stand in a line _____ _____ _____ height, so the shortest students are in the front and the tallest are at the back.", "c": "請【按照】身高【順序】排成一排，讓最矮的同學在前面，最高的在後面。", "f": "Please stand in a line in order of height, so the shortest students are in the front and the tallest are at the back."}, {"g": "", "t": "in place of + 人", "p": "(prep.phr.)", "e": "instead of someone", "z": "代替某人", "s": "Mr. Lin was sick today, so Ms. Chen taught our English class _____ _____ _____ him.", "c": "林老師今天生病了，所以陳老師【代替】他上我們的英文課。", "f": "Mr. Lin was sick today, so Ms. Chen taught our English class in place of him."}, {"g": "", "t": "in response to + N", "p": "(prep.phr.)", "e": "as an answer to", "z": "做為對……的回應", "s": "_____ _____ _____ many complaints from parents, the school decided to make the lunch menu healthier and less oily.", "c": "為了【回應】許多家長的抱怨，學校決定讓午餐菜單更健康、更少油。", "f": "In response to many complaints from parents, the school decided to make the lunch menu healthier and less oily."}, {"g": "", "t": "in search of + N", "p": "(prep.phr.)", "e": "looking for", "z": "尋找", "s": "Every evening our dog runs around the yard _____ _____ _____ his ball, and he barks happily when he finds it.", "c": "每天傍晚我們的狗都在院子裡到處跑，【尋找】牠的球，找到時就開心地吠叫。", "f": "Every evening our dog runs around the yard in search of his ball, and he barks happily when he finds it."}, {"g": "", "t": "in spite of + N/V-ing", "p": "(prep.phr.)", "e": "even though there is", "z": "儘管", "s": "_____ _____ _____ the heavy rain, thousands of fans waited outside the stadium because they wanted to see their favorite singer.", "c": "【儘管】下著大雨，數千名歌迷仍在體育場外等候，因為他們想見到最喜歡的歌手。", "f": "In spite of the heavy rain, thousands of fans waited outside the stadium because they wanted to see their favorite singer."}, {"g": "", "t": "in terms of + N", "p": "(prep.phr.)", "e": "when thinking about this part", "z": "從……的角度、就……而言", "s": "_____ _____ _____ price, the small phone is a better choice, but the bigger one takes much nicer photos.", "c": "【從價格的角度來看】，這支小手機是比較好的選擇，但大的那支拍照好看多了。", "f": "In terms of price, the small phone is a better choice, but the bigger one takes much nicer photos."}, {"g": "", "t": "in the back of + N", "p": "(prep.phr.)", "e": "in the back part inside something", "z": "在…的後面（內部後方）", "s": "The kids always like to sit _____ _____ _____ _____ the bus because they can chat and play games there.", "c": "孩子們總是喜歡坐【在公車的後面】，因為他們可以在那裡聊天和玩遊戲。", "f": "The kids always like to sit in the back of the bus because they can chat and play games there."}, {"g": "", "t": "in the center of + N", "p": "(prep.phr.)", "e": "in the middle of a place", "z": "在…中央", "s": "There is a big fountain _____ _____ _____ _____ the park, and kids like to play near it on hot summer days.", "c": "公園【中央】有一座大噴泉，炎熱的夏天孩子們喜歡在它附近玩。", "f": "There is a big fountain in the center of the park, and kids like to play near it on hot summer days."}, {"g": "", "t": "in the face of + N", "p": "(prep.phr.)", "e": "when dealing with something hard", "z": "面對", "s": "_____ _____ _____ _____ a strong team from Japan, our baseball players stayed calm and played their best game of the year.", "c": "【面對】來自日本的強隊，我們的棒球選手保持冷靜，打出了今年最好的一場比賽。", "f": "In the face of a strong team from Japan, our baseball players stayed calm and played their best game of the year."}, {"g": "", "t": "in the front of + N", "p": "(prep.phr.)", "e": "in the front part inside something", "z": "在⋯⋯的前部", "s": "Amy gets carsick easily, so she always sits _____ _____ _____ _____ the bus when our class goes on a field trip.", "c": "Amy很容易暈車，所以我們班去校外教學時，她總是坐在【公車前段】。", "f": "Amy gets carsick easily, so she always sits in the front of the bus when our class goes on a field trip."}, {"g": "", "t": "in the middle of + N", "p": "(prep.phr.)", "e": "in the center of something or during something", "z": "在……的中間", "s": "My phone rang loudly _____ _____ _____ _____ the concert, and everyone around me turned to look at me.", "c": "我的手機在音樂會【中間】大聲響起，我周圍的每個人都轉頭看我。", "f": "My phone rang loudly in the middle of the concert, and everyone around me turned to look at me."}, {"g": "", "t": "instead of + N/V-ing", "p": "(prep.phr.)", "e": "in the place of something or someone", "z": "代替；而不是", "s": "It was raining heavily on Sunday morning, so we stayed home and watched a movie _____ _____ going to the beach.", "c": "星期天早上下著大雨，所以我們待在家看電影，【而不是】去海邊。", "f": "It was raining heavily on Sunday morning, so we stayed home and watched a movie instead of going to the beach."}, {"g": "", "t": "in/with regard to + N", "p": "(prep.phr.)", "e": "about; on the subject of", "z": "關於", "s": "_____ _____ _____ the school trip, every student must bring a signed letter from their parents before next Friday.", "c": "【關於】校外教學，每位學生都必須在下週五前帶回家長簽名的同意書。", "f": "With regard to the school trip, every student must bring a signed letter from their parents before next Friday."}, {"g": "", "t": "next to + N", "p": "(prep.phr.)", "e": "right beside someone or something", "z": "在……旁邊", "s": "In the classroom, Lisa always sits _____ _____ the window because she likes to look at the trees when she feels tired.", "c": "在教室裡，麗莎總是坐在窗戶【旁邊】，因為她累的時候喜歡看看外面的樹。", "f": "In the classroom, Lisa always sits next to the window because she likes to look at the trees when she feels tired."}, {"g": "", "t": "not to mention + N/V-ing", "p": "(prep.phr.)", "e": "and also; and even more", "z": "更別提、更不用說", "s": "Living in the city is expensive because the rent is high, _____ _____ _____ the cost of food and transportation.", "c": "住在城市很貴，因為房租很高，【更別提】食物和交通的費用了。", "f": "Living in the city is expensive because the rent is high, not to mention the cost of food and transportation."}, {"g": "", "t": "on behalf of + N", "p": "(prep.phr.)", "e": "for someone else; in place of", "z": "代表", "s": "Lily went up to the stage and accepted the prize _____ _____ _____ our class because our class leader was sick that day.", "c": "莉莉走上台【代表】我們班領獎，因為我們班長那天生病了。", "f": "Lily went up to the stage and accepted the prize on behalf of our class because our class leader was sick that day."}, {"g": "", "t": "on one's way to + 地方", "p": "(prep.phr.)", "e": "while you are going to a place", "z": "在去……的路上", "s": "Jenny saw a little cat in the rain _____ her _____ _____ school, so she took it to the animal hospital near her home.", "c": "珍妮【在去】學校【的路上】看到一隻淋雨的小貓，所以她把牠帶到家附近的動物醫院。", "f": "Jenny saw a little cat in the rain on her way to school, so she took it to the animal hospital near her home."}, {"g": "", "t": "on the back of + N", "p": "(prep.phr.)", "e": "on the back part of an animal or person", "z": "在…的背上", "s": "In Thailand, Jenny took a short ride _____ _____ _____ _____ an elephant, and she said it was a little scary but fun.", "c": "在泰國，珍妮坐【在一頭大象的背上】短暫騎了一下，她說有點可怕但很好玩。", "f": "In Thailand, Jenny took a short ride on the back of an elephant, and she said it was a little scary but fun."}, {"g": "", "t": "on the basis of + N", "p": "(prep.phr.)", "e": "because of; using something as the reason", "z": "以……為基礎", "s": "The coach chose the players for the big game _____ _____ _____ _____ how hard they practiced, not just how tall they were.", "c": "教練【根據】球員練習的努力程度來挑選大賽的選手，而不只是看他們有多高。", "f": "The coach chose the players for the big game on the basis of how hard they practiced, not just how tall they were."}, {"g": "", "t": "on the way to + 地方", "p": "(prep.phr.)", "e": "while going to a place", "z": "在前往……的路上", "s": "I saw a cute little cat sleeping under a car _____ _____ _____ _____ school this morning, so I took a photo.", "c": "今天早上我【在去】學校【的路上】看到一隻可愛的小貓睡在車子底下，所以我拍了照。", "f": "I saw a cute little cat sleeping under a car on the way to school this morning, so I took a photo."}, {"g": "", "t": "prior to + N/V-ing", "p": "(prep.phr.)", "e": "before", "z": "在……之前", "s": "_____ _____ our trip to Japan, my family checked the weather every day and bought warm jackets for the snow.", "c": "去日本旅行【之前】，我們家每天都查看天氣，還買了保暖的外套來應付下雪。", "f": "Prior to our trip to Japan, my family checked the weather every day and bought warm jackets for the snow."}, {"g": "", "t": "regardless of + N", "p": "(prep.phr.)", "e": "not caring about; no matter what", "z": "不論、不管、不顧", "s": "The baseball team practices every afternoon _____ _____ the weather, so the players are used to rain and hot sun.", "c": "棒球隊【不論】天氣如何每天下午都會練習，所以球員們早已習慣下雨和大太陽。", "f": "The baseball team practices every afternoon regardless of the weather, so the players are used to rain and hot sun."}, {"g": "", "t": "right after + N", "p": "(prep.phr.)", "e": "immediately after something", "z": "就在……之後；緊接著", "s": "My sister always does her homework _____ _____ school, so she has plenty of free time to watch TV at night.", "c": "我姊姊總是【一】放學【就馬上】寫功課，所以她晚上有很多空閒時間看電視。", "f": "My sister always does her homework right after school, so she has plenty of free time to watch TV at night."}, {"g": "", "t": "such as + N", "p": "(prep.phr.)", "e": "for example; like", "z": "例如、像是", "s": "Our night market has many tasty snacks, _____ _____ stinky tofu and bubble tea, so tourists love to visit it on weekends.", "c": "我們的夜市有很多好吃的小吃，【像是】臭豆腐和珍珠奶茶，所以觀光客週末都很喜歡來逛。", "f": "Our night market has many tasty snacks, such as stinky tofu and bubble tea, so tourists love to visit it on weekends."}, {"g": "", "t": "thanks to + N", "p": "(prep.phr.)", "e": "because of someone or something good", "z": "多虧；由於", "s": "_____ _____ my brother's help with math, I finally passed the test and my parents took me out for dinner.", "c": "【多虧】我哥哥幫我複習數學，我終於通過考試，我爸媽還帶我出去吃晚餐。", "f": "Thanks to my brother's help with math, I finally passed the test and my parents took me out for dinner."}, {"g": "", "t": "up to + N", "p": "(prep.phr.)", "e": "as many or as much as", "z": "多達、高至、長達", "s": "This new bus can carry _____ _____ sixty passengers, so the whole class can go on the field trip together.", "c": "這台新巴士可以載【多達】六十名乘客，所以全班可以一起去校外教學。", "f": "This new bus can carry up to sixty passengers, so the whole class can go on the field trip together."}, {"g": "", "t": "when it comes to + N/V-ing", "p": "(prep.phr.)", "e": "when talking about a certain topic", "z": "說到、提及", "s": "My brother is not good at sports, but _____ _____ _____ _____ computers, he knows more than anyone in our family.", "c": "我哥哥不擅長運動，但【說到】電腦，他懂得比家裡任何人都多。", "f": "My brother is not good at sports, but when it comes to computers, he knows more than anyone in our family."}];</script><script src="longteng-b1u5-quiz.js?v=20261106-3"></script><script src="cap-vocab-learn.js?v=20261105-1"></script><script>document.querySelector("#description").textContent="先在「教學 Learn」看完 53 筆詞彙表，再到「測驗 Quiz」做 60 題四選一｜選答後顯示答案、用語中文與整句中譯｜答錯可重做並下載錯題";</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
