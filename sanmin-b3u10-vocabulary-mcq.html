<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三民普高 B3U10｜詞彙選擇</title><style>
:root{--blue:#2563eb;--deep:#172554;--bg:#f4f7fb;--line:#d9e2ef;--ok:#15803d;--bad:#b91c1c;--violet:#6d28d9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font-family:Arial,"Microsoft JhengHei",sans-serif;line-height:1.7}main{max-width:1060px;margin:auto;padding:14px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 7px 24px #0f172a0c}.hero{background:linear-gradient(135deg,#eff6ff,#fff)}h1{margin:0;font-size:clamp(25px,4vw,38px)}h2,h3{margin:0 0 10px}.muted{color:#64748b}.hidden{display:none!important}.btn{border:0;border-radius:10px;padding:10px 15px;font:800 16px inherit;cursor:pointer;background:#e5e7eb;color:#172033;text-decoration:none}.primary{background:var(--blue);color:#fff}.voice{background:var(--violet);color:#fff}.danger{background:#991b1b;color:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;font-weight:800;color:#64748b;margin:9px 0}.prompt,.passage{font-size:18px;background:#f8fafc;border-radius:12px;padding:16px;white-space:pre-wrap}.passage{max-height:48vh;overflow:auto}.blank-now{background:#fef3c7;color:#92400e;padding:2px 7px;border-radius:6px;font-weight:900}.options{display:grid;gap:9px;margin:14px 0}.option{border:2px solid #cbd5e1;background:#fff;border-radius:11px;padding:12px 14px;text-align:left;font:700 16px inherit;cursor:pointer}.option:hover{border-color:var(--blue)}.option.wrong{border-color:#fecaca;background:#fff1f2}.option.correct{border-color:#86efac;background:#f0fdf4}.feedback,.reference{padding:13px;border-radius:10px;margin:12px 0;font-weight:800;white-space:pre-wrap}.feedback.ok{background:#ecfdf3;color:var(--ok)}.feedback.bad{background:#fff1f2;color:var(--bad)}.reference{border:2px solid #bbf7d0;background:#f0fdf4}.translation{white-space:pre-wrap;background:#f8fafc;padding:16px;border-radius:12px;font-size:18px}.inline-input{width:150px;max-width:100%;font:inherit;padding:7px 9px;border:2px solid #94a3b8;border-radius:8px;margin:3px}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:#f5f3ff;margin:12px 0}.voice-result{background:#fff;border:1px solid #ddd6fe;padding:10px;border-radius:9px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat,.wrong-card{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong-card{margin:10px 0;background:#fff7f7;border-color:#fecaca}@media(max-width:620px){main{padding:8px}.hero,.card{padding:15px}.meta{display:block}.prompt,.passage,.translation{font-size:16px}}
</style></head><body><main><section class="hero"><h1>三民普高 B3U10｜詞彙選擇</h1><p class="muted">原題互動練習｜50 題｜即時批改｜錯誤重填｜答對後整句播放＋選做 STT｜錯題 DOCX｜成績登錄</p><div class="actions"><a class="btn" href="dashboard.html">← 回 Dashboard</a></div></section><section id="quiz" class="card"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="reference" class="reference hidden"></div><div id="voiceBox" class="voicebox hidden"><h3>🎙️ Pronunciation Check（選做）</h3><p><b id="voiceTarget"></b></p><div class="actions"><button id="speak" class="btn voice">🔊 再聽一次</button><button id="mic" class="btn primary">🎤 開始朗讀評分</button></div><div id="voiceResult" class="voice-result">尚未進行朗讀評分。</div></div><div class="actions"><button id="check" class="btn primary hidden">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束本輪</button></div></section><section id="result" class="card hidden"><h2>練習結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="download" class="btn primary">下載錯題 DOCX</button><button id="restart" class="btn">重新練習</button></div></section></main><script>
const QUIZ={"unit":"B3U10","kind":"mcq","title":"詞彙選擇","count":50,"data":[{"number":1,"prompt":"In Tom's speech, he illustrated his points by _____ from Winston Churchill's speech.","options":{"A":"pouring","B":"returning","C":"handling","D":"quoting"},"answer":"D","sentence":"In Tom's speech, he illustrated his points by quoting from Winston Churchill's speech."},{"number":2,"prompt":"Having no idea how to deal with the bully in class, Daniel _____ his teacher for help.","options":{"A":"looked into","B":"turned to","C":"came upon","D":"passed on"},"answer":"B","sentence":"Having no idea how to deal with the bully in class, Daniel turned to his teacher for help."},{"number":3,"prompt":"The gap between the rich and the poor is now beyond measure. More than 80 percent of the nation's wealth is in the _____ of a very few people.","options":{"A":"arms","B":"legs","C":"hands","D":"heads"},"answer":"C","sentence":"The gap between the rich and the poor is now beyond measure. More than 80 percent of the nation's wealth is in the hands of a very few people."},{"number":4,"prompt":"Have their proposals given in the campaign become realities or are they just _____ promises?","options":{"A":"mental","B":"tough","C":"original","D":"hollow"},"answer":"D","sentence":"Have their proposals given in the campaign become realities or are they just hollow promises?"},{"number":5,"prompt":"Julia uses _____ to gradually stop Joe from smoking so often.","options":{"A":"persuasion","B":"examination","C":"impression","D":"relaxation"},"answer":"A","sentence":"Julia uses persuasion to gradually stop Joe from smoking so often."},{"number":6,"prompt":"The government officials gave their _____ that there would be no more fake information on TV.","options":{"A":"command","B":"assurance","C":"wisdom","D":"offense"},"answer":"B","sentence":"The government officials gave their assurance that there would be no more fake information on TV."},{"number":7,"prompt":"The team members have ______ their failure in the final with their lack of practice over the whole game season.","options":{"A":"cast the spell on","B":"taken root in","C":"sowed the seeds of","D":"lost track of"},"answer":"C","sentence":"The team members have sowed the seeds of their failure in the final with their lack of practice over the whole game season."},{"number":8,"prompt":"When Lily is in a bad mood, she ______ music for comfort.","options":{"A":"turns to","B":"comes off","C":"runs off","D":"ends up"},"answer":"A","sentence":"When Lily is in a bad mood, she turns to music for comfort."},{"number":9,"prompt":"Judge Harris always has good points to make. Her arguments are very _____ as they are based on logic and sound reasoning.","options":{"A":"emphatic","B":"indifferent","C":"dominant","D":"persuasive"},"answer":"D","sentence":"Judge Harris always has good points to make. Her arguments are very persuasive as they are based on logic and sound reasoning."},{"number":10,"prompt":"Rita and May had a(n) _____ over some trivial problems three years ago, and they haven't spoken to each other since then.","options":{"A":"update","B":"comment","C":"quarrel","D":"promise"},"answer":"C","sentence":"Rita and May had a(n) quarrel over some trivial problems three years ago, and they haven't spoken to each other since then."},{"number":11,"prompt":"We seriously need to consider the word choice of our magazine because lots of readers have complained about the _____ language that is contained.","options":{"A":"imaginative","B":"persuasive","C":"positive","D":"offensive"},"answer":"D","sentence":"We seriously need to consider the word choice of our magazine because lots of readers have complained about the offensive language that is contained."},{"number":12,"prompt":"The travel agency ______ all its customers a full refund after airlines had suspended most of the flights due to the COVID-19 outbreak.","options":{"A":"disputed","B":"persuaded","C":"promised","D":"quarreled"},"answer":"C","sentence":"The travel agency promised all its customers a full refund after airlines had suspended most of the flights due to the COVID-19 outbreak."},{"number":13,"prompt":"The soldier was _____ by the enemy and sent to a prison camp for the rest of his life.","options":{"A":"rescued","B":"invented","C":"captured","D":"polished"},"answer":"C","sentence":"The soldier was captured by the enemy and sent to a prison camp for the rest of his life."},{"number":14,"prompt":"Grant won a _____ over Cooper in yesterday's tennis game by 12 to 3.","options":{"A":"horror","B":"status","C":"victory","D":"shake"},"answer":"C","sentence":"Grant won a victory over Cooper in yesterday's tennis game by 12 to 3."},{"number":15,"prompt":"Before I went to college, my father gave me a few words of _____. Now, these words still help me a lot in my life.","options":{"A":"trick","B":"reach","C":"symbol","D":"wisdom"},"answer":"D","sentence":"Before I went to college, my father gave me a few words of wisdom. Now, these words still help me a lot in my life."},{"number":16,"prompt":"Although Gina has failed to _____ her goal for several times, she never thinks of giving up.","options":{"A":"fulfill","B":"defeat","C":"promise","D":"pretend"},"answer":"A","sentence":"Although Gina has failed to fulfill her goal for several times, she never thinks of giving up."},{"number":17,"prompt":"The whole city becomes quiet and peaceful in the _____ of night.","options":{"A":"hands","B":"dead","C":"cry","D":"depth"},"answer":"B","sentence":"The whole city becomes quiet and peaceful in the dead of night."},{"number":18,"prompt":"______ between good friends should be resolved, not ignored.","options":{"A":"Compliments","B":"Concerns","C":"Conflicts","D":"Connections"},"answer":"C","sentence":"Conflicts between good friends should be resolved, not ignored."},{"number":19,"prompt":"If we work hard to _____ our dreams when we are young, we will not feel that we missed out on something when we get old.","options":{"A":"distribute","B":"fulfill","C":"convince","D":"monitor"},"answer":"B","sentence":"If we work hard to fulfill our dreams when we are young, we will not feel that we missed out on something when we get old."},{"number":20,"prompt":"Sam _____ that he didn't mind, but we could feel that he was quite disappointed at Sarah's decision.","options":{"A":"blamed","B":"pretended","C":"exploded","D":"arranged"},"answer":"B","sentence":"Sam pretended that he didn't mind, but we could feel that he was quite disappointed at Sarah's decision."},{"number":21,"prompt":"Romeo and Juliet could have _____ and lived a happy life if their plan had not been detected.","options":{"A":"spiced up","B":"gone by","C":"run off","D":"lived on"},"answer":"C","sentence":"Romeo and Juliet could have run off and lived a happy life if their plan had not been detected."},{"number":22,"prompt":"When I was asked by the teacher to solve a math question on the stage, I wanted my classmates to give me some _____.","options":{"A":"commands","B":"sparks","C":"hints","D":"promises"},"answer":"C","sentence":"When I was asked by the teacher to solve a math question on the stage, I wanted my classmates to give me some hints."},{"number":23,"prompt":"When I asked to speak to her manager, the waitress suddenly flew into a(n) _____ and even yelled at me.","options":{"A":"rage","B":"wave","C":"tear","D":"pride"},"answer":"A","sentence":"When I asked to speak to her manager, the waitress suddenly flew into a(n) rage and even yelled at me."},{"number":24,"prompt":"I was worried about my first overseas trip, but my father ______ me that he would help plan the trip so that nothing would go wrong.","options":{"A":"rescued","B":"assured","C":"inspired","D":"conveyed"},"answer":"B","sentence":"I was worried about my first overseas trip, but my father assured me that he would help plan the trip so that nothing would go wrong."},{"number":25,"prompt":"The disobedience of the traffic rules is the _____ of this serious car accident.","options":{"A":"offense","B":"dispute","C":"spark","D":"rage"},"answer":"C","sentence":"The disobedience of the traffic rules is the spark of this serious car accident."},{"number":26,"prompt":"The deadly disease first ______ in a city in China, and has spread at a terribly high speed across the world.","options":{"A":"broke out","B":"burned down","C":"ran off","D":"worked on"},"answer":"A","sentence":"The deadly disease first broke out in a city in China, and has spread at a terribly high speed across the world."},{"number":27,"prompt":"Many Asian countries have ended the import of pork products ever since the African Pig Fever _____.","options":{"A":"went off","B":"broke out","C":"paid off","D":"took on"},"answer":"B","sentence":"Many Asian countries have ended the import of pork products ever since the African Pig Fever broke out."},{"number":28,"prompt":"The author's new novel on a mother and her lost child is _____ to be her own story.","options":{"A":"warned","B":"pretended","C":"stressed","D":"supposed"},"answer":"D","sentence":"The author's new novel on a mother and her lost child is supposed to be her own story."},{"number":29,"prompt":"In the drama, the little girl made up her mind to take _____ on the man who had killed her parents.","options":{"A":"hint","B":"promise","C":"conflict","D":"revenge"},"answer":"D","sentence":"In the drama, the little girl made up her mind to take revenge on the man who had killed her parents."},{"number":30,"prompt":"Many people may easily have a ______ with others who hold different opinions about some difficult issues such as nuclear power and death penalty.","options":{"A":"command","B":"contribution","C":"conflict","D":"comment"},"answer":"C","sentence":"Many people may easily have a conflict with others who hold different opinions about some difficult issues such as nuclear power and death penalty."},{"number":31,"prompt":"In the conflict, rioters are _____ with firebombs and umbrellas to against the police barricades.","options":{"A":"armed","B":"offended","C":"contained","D":"reviewed"},"answer":"A","sentence":"In the conflict, rioters are armed with firebombs and umbrellas to against the police barricades."},{"number":32,"prompt":"Hoping for getting more thumbs up, the Internet celebrity took a photo of his passport, luggage, and a fake plane ticket to ______ to go aboard.","options":{"A":"pretend","B":"praise","C":"prompt","D":"preserve"},"answer":"A","sentence":"Hoping for getting more thumbs up, the Internet celebrity took a photo of his passport, luggage, and a fake plane ticket to pretend to go aboard."},{"number":33,"prompt":"The president warned that any kind of threat against his country would be interpreted as a(n) _____ of war.","options":{"A":"invention","B":"declaration","C":"imagination","D":"tradition"},"answer":"B","sentence":"The president warned that any kind of threat against his country would be interpreted as a(n) declaration of war."},{"number":34,"prompt":"Tom put in lots of effort and finally ______ his dream of becoming a top model.","options":{"A":"commanded","B":"promised","C":"dragged","D":"fulfilled"},"answer":"D","sentence":"Tom put in lots of effort and finally fulfilled his dream of becoming a top model."},{"number":35,"prompt":"Anything involving dancing can always _____ me. I just couldn't move my body in a way that is not awkward.","options":{"A":"assure","B":"capture","C":"defeat","D":"drag"},"answer":"C","sentence":"Anything involving dancing can always defeat me. I just couldn't move my body in a way that is not awkward."},{"number":36,"prompt":"The host of the talk show was criticized because his words, sometimes ______ and inappropriate, have made many audiences upset.","options":{"A":"practical","B":"offensive","C":"democratic","D":"doubtful"},"answer":"B","sentence":"The host of the talk show was criticized because his words, sometimes offensive and inappropriate, have made many audiences upset."},{"number":37,"prompt":"Many people were happy that the government had finally _____ Children's Day as a national holiday.","options":{"A":"appointed","B":"declared","C":"performed","D":"involved"},"answer":"B","sentence":"Many people were happy that the government had finally declared Children's Day as a national holiday."},{"number":38,"prompt":"Recent worries over air pollution have _____ the government to take necessary action.","options":{"A":"prompted","B":"stepped","C":"increased","D":"predicted"},"answer":"A","sentence":"Recent worries over air pollution have prompted the government to take necessary action."},{"number":39,"prompt":"The invasion of the Israeli army is likely to _____ of hatred in the younger generation of Palestinians.","options":{"A":"sow the seed of","B":"catch sight of","C":"take a look at","D":"live up to"},"answer":"A","sentence":"The invasion of the Israeli army is likely to sow the seed of of hatred in the younger generation of Palestinians."},{"number":40,"prompt":"Mary and Jane often fight over which radio station to listen to. Their _____ arises mainly from their different tastes in music.","options":{"A":"venture","B":"consent","C":"dispute","D":"temptation"},"answer":"C","sentence":"Mary and Jane often fight over which radio station to listen to. Their dispute arises mainly from their different tastes in music."},{"number":41,"prompt":"Mr. Wang's arguments were very, and the committee finally accepted his proposal.","options":{"A":"artificial","B":"inappropriate","C":"persuasive","D":"descriptive"},"answer":"C","sentence":"Mr. Wang's arguments were very, and the committee finally accepted his proposal."},{"number":42,"prompt":"There's a(n) _____ over working conditions and reasonable hourly pay between the labor and the employer.","options":{"A":"silence","B":"dispute","C":"delay","D":"sword"},"answer":"B","sentence":"There's a(n) dispute over working conditions and reasonable hourly pay between the labor and the employer."},{"number":43,"prompt":"The soldiers are under the _____ of a general who is very tough and demanding.","options":{"A":"command","B":"wisdom","C":"victory","D":"conflict"},"answer":"A","sentence":"The soldiers are under the command of a general who is very tough and demanding."},{"number":44,"prompt":"After hours of battling against the flame, all the main structures of Shuri Castle were still _____ in the fire.","options":{"A":"lit up","B":"knocked down","C":"locked up","D":"burned down"},"answer":"D","sentence":"After hours of battling against the flame, all the main structures of Shuri Castle were still burned down in the fire."},{"number":45,"prompt":"In early winter morning, it is hard to _____ myself out of bed and be ready for school.","options":{"A":"dare","B":"drag","C":"conflict","D":"declare"},"answer":"B","sentence":"In early winter morning, it is hard to drag myself out of bed and be ready for school."},{"number":46,"prompt":"Fire damage was confined to the door's _____ surface and the rest of the door was left intact.","options":{"A":"similar","B":"ordinary","C":"wooden","D":"active"},"answer":"C","sentence":"Fire damage was confined to the door's wooden surface and the rest of the door was left intact."},{"number":47,"prompt":"Both sides involved in the _____ agreed to end the war in their peace talk yesterday.","options":{"A":"effort","B":"recipe","C":"scene","D":"conflict"},"answer":"D","sentence":"Both sides involved in the conflict agreed to end the war in their peace talk yesterday."},{"number":48,"prompt":"The two managers of the companies have ______ the details of their business contract for several hours. They just couldn't come to any agreement.","options":{"A":"commanded","B":"disputed","C":"quoted","D":"armed"},"answer":"B","sentence":"The two managers of the companies have disputed the details of their business contract for several hours. They just couldn't come to any agreement."},{"number":49,"prompt":"The tenant had made the _____ to pay the rental in a week, but the landlord still asked him to leave in cold winter day.","options":{"A":"quarrel","B":"promise","C":"quotation","D":"spark"},"answer":"B","sentence":"The tenant had made the promise to pay the rental in a week, but the landlord still asked him to leave in cold winter day."},{"number":50,"prompt":"The ruling party had a serious ______ with the opposition party about the new labor law. What's worse, they even came to blows and ended up with a mess.","options":{"A":"defeat","B":"poison","C":"offense","D":"quarrel"},"answer":"D","sentence":"The ruling party had a serious quarrel with the opposition party about the new labor law. What's worse, they even came to blows and ended up with a mess."}]};const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let flat=[],index=0,wrong=new Map(),attempted=new Set(),firstTry=new Set(),recognition=null;
function flatten(){if(QUIZ.kind==='mcq')return QUIZ.data.map(x=>({...x,id:String(x.number)}));if(QUIZ.kind==='translation')return QUIZ.data.map(x=>({...x,id:String(x.number)}));return QUIZ.data.flatMap(set=>set.answers.map((answer,i)=>({id:`${set.set}-${i+1}`,set:set.set,passage:set.passage,options:set.options,answer,blank:i+1,sentence:set.sentences[i],structure:set.structure})))}
function fillPassage(text,answers,options){let out=text;answers.forEach((a,i)=>{const word=options[a];const n=i+1;const pats=[new RegExp(`__\\(?${n}\\)?__`),new RegExp(`__${n}__`),new RegExp(`　${n}　`),new RegExp(`\\(${n}\\)`)];for(const p of pats){if(p.test(out)){out=out.replace(p,word);break}}});return out.replace(/\n+/g,' ').replace(/\s+/g,' ').trim()}
function markBlank(text,n){const tag=`<span class="blank-now">Blank ${n}</span>`;let out=esc(text),done=false;for(const p of [new RegExp(`__\\(?${n}\\)?__`),new RegExp(`__${n}__`),new RegExp(`　${n}　`),new RegExp(`\\(${n}\\)`)]){if(!done&&p.test(out)){out=out.replace(p,tag);done=true}}return out}
function norm(s){return String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ')}function speak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}
function show(){try{recognition?.abort()}catch(e){}speechSynthesis?.cancel();const q=flat[index];$('#meta').textContent=`第 ${index+1} / ${flat.length} 題`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=((index+1)/flat.length*100)+'%';$('#feedback').className='feedback hidden';$('#reference').classList.add('hidden');$('#voiceBox').classList.add('hidden');$('#next').classList.add('hidden');$('#check').classList.toggle('hidden',QUIZ.kind!=='translation');$('#answerArea').innerHTML='';if(QUIZ.kind==='mcq')renderChoice(q.prompt,q.options);else if(QUIZ.kind==='translation')renderTranslation(q);else{$('#question').innerHTML=`<div class="passage">${markBlank(q.passage,q.blank)}</div>`;renderChoice(`第 ${q.blank} 格`,q.options)}}
function renderChoice(prompt,options){$('#question').innerHTML=QUIZ.kind==='mcq'?`<div class="prompt">${esc(prompt)}</div>`:$('#question').innerHTML;$('#answerArea').innerHTML='<div class="options">'+Object.entries(options).map(([k,v])=>`<button class="option" data-key="${k}"><b>${k}.</b> ${esc(v)}</button>`).join('')+'</div>';document.querySelectorAll('.option').forEach(b=>b.onclick=()=>checkChoice(b.dataset.key,b))}
function renderTranslation(q){let i=0;const rendered=esc(q.prompt).replace(/_{3,}/g,()=>`<input class="inline-input" data-i="${i++}" aria-label="第 ${i} 格答案">`);$('#question').innerHTML=`<div class="translation">${rendered}</div>`;setTimeout(()=>document.querySelector('.inline-input')?.focus(),0)}
function recordWrong(q,value){if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(value);$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
function checkChoice(key,button){const q=flat[index];attempted.add(q.id);if(key!==q.answer){recordWrong(q,key);button.classList.add('wrong');$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 不正確，請再試一次。';return}if(!wrong.has(q.id))firstTry.add(q.id);document.querySelectorAll('.option').forEach(b=>b.disabled=true);button.classList.add('correct');pass(q)}
function checkTranslation(){const q=flat[index],values=[...document.querySelectorAll('.inline-input')].map(x=>x.value);attempted.add(q.id);const ok=values.length===q.answers.length&&values.every((v,i)=>norm(v)===norm(q.answers[i]));if(!ok){recordWrong(q,values.join(' / '));$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 尚有空格不正確，請修正後再檢查。';return}if(!wrong.has(q.id))firstTry.add(q.id);document.querySelectorAll('.inline-input').forEach(x=>x.disabled=true);pass(q)}
function pass(q){$('#feedback').className='feedback ok';$('#feedback').textContent='✅ 正確！';$('#reference').classList.remove('hidden');$('#reference').textContent='完整句：'+q.sentence;$('#check').classList.add('hidden');$('#next').classList.remove('hidden');$('#voiceBox').classList.remove('hidden');$('#voiceTarget').textContent=q.sentence;$('#voiceResult').className='voice-result';$('#voiceResult').textContent='尚未進行朗讀評分。';speak(q.sentence)}
function similarity(a,b){a=norm(a).replace(/[^a-z0-9' ]/g,'').split(' ').filter(Boolean);b=norm(b).replace(/[^a-z0-9' ]/g,'').split(' ').filter(Boolean);const used=new Set;let hit=0;for(const w of a){const j=b.findIndex((x,i)=>x===w&&!used.has(i));if(j>=0){hit++;used.add(j)}}return Math.round(100*hit/Math.max(a.length,b.length,1))}
function startMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('#voiceResult').textContent='此瀏覽器不支援語音辨識，建議使用 Chrome。';return}recognition=new SR;recognition.lang='en-US';recognition.interimResults=false;$('#voiceResult').textContent='正在聆聽，請朗讀完整句子…';recognition.onresult=e=>{const said=e.results[0][0].transcript,target=flat[index].sentence,score=similarity(target,said);$('#voiceResult').className='voice-result '+(score>=80?'good':'retry');$('#voiceResult').textContent=`辨識：${said}\n正確率：${score}%`};recognition.onerror=e=>$('#voiceResult').textContent='語音辨識未完成：'+e.error;recognition.start()}

$('#check').onclick=checkTranslation;$('#next').onclick=()=>{if(++index>=flat.length)finish();else show()};$('#finish').onclick=finish;$('#restart').onclick=()=>location.reload();$('#speak').onclick=()=>speak(flat[index].sentence);$('#mic').onclick=startMic;$('#download').onclick=async()=>{const rows=[...wrong.values()];if(!rows.length)return;try{if(!window.docx)await new Promise((ok,fail)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js';s.onload=ok;s.onerror=fail;document.head.append(s)});const{Document,Packer,Paragraph,HeadingLevel}=window.docx,children=[new Paragraph({text:`三民普高 ${QUIZ.unit} ${QUIZ.title} 錯題紀錄`,heading:HeadingLevel.TITLE})];rows.forEach(r=>children.push(new Paragraph({text:`第 ${r.q.id} 題`,heading:HeadingLevel.HEADING_2}),new Paragraph(r.q.prompt||r.q.passage||''),new Paragraph('作答：'+r.attempts.join('；')),new Paragraph('答案：'+(r.q.answer||r.q.answers.join(' / ')))));const blob=await Packer.toBlob(new Document({sections:[{children}]})),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Sanmin_${QUIZ.unit}_${QUIZ.kind}_錯題.docx`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){alert('目前無法產生 DOCX，請稍後再試。')}};flat=flatten();show();
