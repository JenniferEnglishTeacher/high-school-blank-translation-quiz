<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="龍騰普高 B3U5 引導式翻譯互動練習"><title>龍騰普高 B3U5 引導式翻譯</title><style>:root{--blue:#2563eb;--navy:#1e3a8a;--bg:#f4f7fb;--card:#fff;--line:#dbe3ee;--ink:#172033;--muted:#64748b;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--voice:#6d28d9;--voicebg:#f5f3ff;--amber:#9a3412;--amberbg:#fff7ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}.wrap{max-width:920px;margin:auto;padding:16px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 5px 18px #0f172a0d}.hero{background:linear-gradient(135deg,#e8f1ff,#fff)}h1{margin:0 0 6px;font-size:clamp(25px,4vw,38px)}h2{margin-top:0}.note{color:var(--muted)}.hidden{display:none!important}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.btn{border:0;border-radius:10px;padding:11px 17px;font:800 16px inherit;cursor:pointer;background:#e5e7eb;color:var(--ink);text-decoration:none}.primary{background:var(--blue);color:#fff}.danger{background:#991b1b;color:#fff}.voice{background:var(--voice);color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.btn:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.pick{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin:7px 0;background:#fafcff}.pick input{margin-right:8px;width:17px;height:17px;accent-color:var(--blue)}#list{max-height:440px;overflow:auto;border:1px solid var(--line);padding:7px;border-radius:12px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:800;margin:8px 0 14px}.zh{padding:10px 13px;background:var(--amberbg);border-radius:9px;color:var(--amber);font-weight:800;margin-bottom:10px}.question{font-size:21px;font-weight:750;padding:16px;background:#f8fafc;border-radius:11px;white-space:pre-wrap}.options{display:grid;gap:9px;margin:14px 0}.option{display:flex;align-items:center;gap:11px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-size:18px;font-weight:750;cursor:pointer}.option:hover{border-color:#60a5fa;background:#eff6ff}.option:has(input:checked){border-color:var(--blue);background:#dbeafe;color:var(--navy)}.option input{width:20px;height:20px;accent-color:var(--blue)}.inputs{display:grid;gap:10px;margin:15px 0}.answer-row{display:grid;grid-template-columns:55px 1fr;gap:10px;align-items:center}.answer-row label{font-weight:900;color:var(--navy);text-align:center}.spell{width:100%;font:inherit;font-size:18px;padding:11px;border:2px solid #94a3b8;border-radius:9px}.feedback{padding:13px;border-radius:10px;font-weight:800;margin:13px 0}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.explain{font-weight:500;margin-top:7px}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:var(--voicebg);margin:13px 0}.voicebox b{display:block;font-size:19px;margin-bottom:8px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}.wrong p{margin:6px 0}.source{font-size:13px;color:var(--muted)}@media(max-width:600px){.wrap{padding:9px}.hero,.card{padding:15px}.question{font-size:18px;padding:13px}.option{font-size:17px}.answer-row{grid-template-columns:42px 1fr}.meta{display:block}}</style><link rel="stylesheet" href="longteng-vocab-required-pronunciation.css?v=20261026-4"></head><body><main class="wrap"><section class="hero"><h1>龍騰普高 B3U5 引導式翻譯</h1><p>共 41 題。可自行選題、隨機抽題；答錯後請重新作答。</p><p class="note">答對後顯示來源解析並播放完整英文句；STT 朗讀達 80% 才能進入下一題。完成後可重做錯題並下載 DOCX。</p><div class="toolbar"><a class="btn" href="dashboard.html">← 回測驗總覽</a></div></section><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn">全部選取</button><button id="none" class="btn">全部取消</button><button id="rand20" class="btn">隨機 20 題</button></div><label><input id="shuffle" type="checkbox"> 打亂出題順序</label><div id="list"></div><div class="actions"><button id="start" class="btn primary">開始作答</button><span id="picked" class="note"></span></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="voiceBox" class="voicebox hidden"><b id="voiceTarget"></b><button id="speak" class="btn voice">🔊 再聽一次</button></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="retry" class="btn primary">只重做錯題</button><button id="download" class="btn">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></main><script>const TITLE="龍騰普高 B3U5 引導式翻譯",MODE="multi",Q=[{"id":1,"zh":"人們大多不是為了追其中的劇情而去看Winsor McCay的經典連環漫畫《小尼莫》，反倒是為了一飽眼福欣賞其藝術畫作。","question":"Most people read Winsor McCay’s classic comic strip Little Nemo not to follow the plot but to ①____________ their ②____________ ③____________ the art.","answers":["feast","eyes","on"],"explanation":"","source":"習作簿"},{"id":2,"zh":"每當我壓力大時，我會來到這個露營場地並且盡情欣賞周圍美不勝收的風景。","question":"Whenever I am stressed, I come to the campsite and ①____________ my ②____________ ③____________ the breathtaking scenery around me.","answers":["feast","eyes","on"],"explanation":"feast one’s eyes on... 使人目不暇給；盡情欣賞","source":"龍騰自命題"},{"id":3,"zh":"無論宗教或性別，每個人應該要有受教育的平等管道。","question":"①____________ ②____________ religion or gender, everyone should have equal access to education.","answers":["Regardless","of"],"explanation":"regardless of 儘管，無論","source":"龍騰自命題"},{"id":4,"zh":"聽說這間汽車旅館的主人把汽車旅館變成養老院了。","question":"It’s said that the motel owner ①____________ the motel ②____________ a nursing home.","answers":["turned","into"],"explanation":"","source":"三合一學習手冊"},{"id":5,"zh":"Mary的才能讓她在學校顯眼出眾。","question":"Mary’s talents have made her ①____________ ②____________ at school.","answers":["stand","out"],"explanation":"","source":"三合一學習手冊"},{"id":6,"zh":"站在玉山頂端，Kevin盡情欣賞壯麗的自然景觀。","question":"Standing at the top of Jade Mountain, Kevin ①____________ his ②____________ ③____________ the splendid natural sights.","answers":["feasted","eyes","on"],"explanation":"","source":"三合一學習手冊"},{"id":7,"zh":"Mia在首爾求學時愛上一位韓國男孩與韓國的泡菜。","question":"Mia ①____________ ②____________ ③____________ ④____________ a Korean boy and kimchi when she studied in Seoul.","answers":["fell","in","love","with"],"explanation":"","source":"三合一學習手冊"},{"id":8,"zh":"不知我何時可以面對面見到我的偶像。","question":"I wonder when I can see my idol ①____________ ②____________ ③____________.","answers":["face","to","face"],"explanation":"","source":"三合一學習手冊"},{"id":9,"zh":"有位學生被看到考英文時正在作弊。","question":"One of the students ①____________ ②____________ ③____________ on the English exam.","answers":["was","seen","cheating"],"explanation":"","source":"三合一學習手冊"},{"id":10,"zh":"完成團隊計畫後，George與Tina到咖啡廳去慶祝。","question":"①____________ ②____________ their team project, George and Tina went to a café for a celebration.","answers":["Having","finished"],"explanation":"","source":"三合一學習手冊"},{"id":11,"zh":"這名勤奮的學生夢想成為舉世聞名的科學家。","question":"This ①____________ student is dreaming of becoming a ②____________ scientist.","answers":["hard-working","world-famous"],"explanation":"","source":"三合一學習手冊"},{"id":12,"zh":"我寧可面對面說也不想在電話裡講。","question":"I’d rather talk ①____________ ②____________ ③____________ than speak on the phone.","answers":["face","to","face"],"explanation":"","source":"All in One"},{"id":13,"zh":"在這群人中，只有少數能脫穎而出成為偉大的運動員。","question":"Of all the people in the group, only a few can ①____________ ②____________ as great athletes.","answers":["stand","out"],"explanation":"","source":"All in One"},{"id":14,"zh":"我走遍這間博物館，盡情欣賞周遭所有的藝術品。","question":"I walked through the museum and ①____________ ②____________ ③____________ ④____________ all the artwork around me.","answers":["feasted","my","eyes","on"],"explanation":"","source":"All in One"},{"id":15,"zh":"邪惡巫婆的詛咒將王子變為青蛙。","question":"The evil witch’s curse ①t____________ the prince ②____________ a frog.","answers":["turned","into"],"explanation":"turn A into B 將A變為B","source":"龍騰自命題"},{"id":16,"zh":"由於他的頭髮染成藍色，Tim在班級照中比所有其他學生顯眼。","question":"With his hair dyed blue, Tim ①____________ ②____________ from all the other students in the class photo.","answers":["stands","out"],"explanation":"dye vt. 染；stand out 顯眼","source":"龍騰自命題"},{"id":17,"zh":"這本小說的主題是關於斯德哥爾摩症候群──一種被害人愛上她的綁架者的狀況。","question":"The novel is about Stockholm syndrome—a condition where the victim ①____________ ②____________ ③____________④____________ her kidnapper.","answers":["falls","in","love","with"],"explanation":"fall in love with 愛上","source":"龍騰自命題"},{"id":18,"zh":"時間和經驗可以是最棒的老師。他們可以將我們從粗魯無知的人轉變成有禮貌且成熟的人。","question":"Time and experience can be the best teachers. They can ①____________ us from rude and ignorant people ②____________ polite and mature ones.","answers":["turn","into"],"explanation":"turn...into...（把……）變為……；ignorant adj. 無知的","source":"龍騰自命題"},{"id":19,"zh":"任何被看到或聽到傳播假新聞的人都會被嚴重處罰。","question":"Anyone who ①____________ ②____________ or ③____________ ④____________ ⑤____________ fake news will be heavily fined.","answers":["is","seen","heard","to","spread"],"explanation":"be seen/heard + to VR表某事進行的整個過程全被看見或聽見","source":"龍騰自命題"},{"id":20,"zh":"這位深思熟慮的編輯答應所有作者說，他絕不會沒有先和他們談過就修改任何句子。","question":"The thoughtful editor promised all authors that he would ①n____________ make any changes to their sentences ②____________ ③____________ with them first.","answers":["never","without","speaking"],"explanation":"thoughtful adj. 深思熟慮的；never...without N/V-ing為雙重否定。此處有「強調」的意味，強調某名詞或某行為的必要性","source":"龍騰自命題"},{"id":21,"zh":"在下個月舉行的世界博覽會中，訪客們可以盡情欣賞來自世界各地最先進的產品。","question":"At the World’s Fair to be held next month, visitors can ①____________ ②____________ ③____________ ④____________ the most advanced products from around the world.","answers":["feast","their","eyes","on"],"explanation":"feast one’s eyes on 盡情欣賞","source":"龍騰自命題"},{"id":22,"zh":"兩姊妹都超過兩公尺高，所以她們在人群中很顯眼。一英里外你就能看到她們！","question":"Both sisters are over two meters tall, so they really ①____________ ②____________ in a crowd. You’ll spot them from a mile off!","answers":["stand","out"],"explanation":"","source":"課本例句填空"},{"id":23,"zh":"我們用一些油漆，就讓陰暗的房間變得明亮。","question":"With a little paint, we ①____________ the dark room ②____________ a bright place.","answers":["turned","into"],"explanation":"","source":"習作簿"},{"id":24,"zh":"Kevin和Julie彼此一見鍾情，而且在相遇不久後就結婚了。","question":"Kevin and Julie ①____________ ②____________ ③____________ ④____________ each other at first sight and got married soon after they met.","answers":["fell","in","love","with"],"explanation":"","source":"習作簿"},{"id":25,"zh":"Diane每次到百貨公司一定會買些衣服。","question":"Diane ①____________ ②____________ to the department store ③____________ buying some clothes.","answers":["never","goes","without"],"explanation":"","source":"三合一學習手冊"},{"id":26,"zh":"Emma悠閒地散步走過花市，盡情欣賞所有五顏六色的美麗花朵。","question":"Emma took a leisurely walk through the flower market and ①____________ ②____________ ③____________ ④____________ all the splendid, colorful blossoms.","answers":["feasted","her","eyes","on"],"explanation":"","source":"課本例句填空"},{"id":27,"zh":"初次見到美麗的公主，王子就愛上她了。","question":"At first sight of the beautiful princess, the prince ①____________ ②____________ ③____________ ④____________ her.","answers":["fell","in","love","with"],"explanation":"fall in love with 愛上","source":"龍騰自命題"},{"id":28,"zh":"Nancy出眾的身高讓她在人群中很顯眼。","question":"Nancy’s exceptional height makes her ①____________ ②____________ in a group of people.","answers":["stand","out"],"explanation":"exceptional adj. 出眾的；stand out 顯眼","source":"龍騰自命題"},{"id":29,"zh":"我每次去超商一定買一條巧克力棒給自己。","question":"I ①n____________ go to a convenience store ②____________ ③____________ a chocolate bar for myself.","answers":["never","without","buying"],"explanation":"never...without N/V-ing為雙重否定。此處有「強調」的意味，強調某名詞或某行為的必要性","source":"龍騰自命題"},{"id":30,"zh":"我的同學Ellen，經常被看見在餵食流浪狗。","question":"My classmate, Ellen is often ①____________ ②____________ stray dogs.","answers":["seen","feeding"],"explanation":"be seen V-ing/to VR為感官動詞被動。感官動詞作被動使用時，後面的動詞應為V-ing或to VR；stray dog 流浪狗","source":"龍騰自命題"},{"id":31,"zh":"員工們與他們的老闆面對面協商加薪一事。","question":"The employees come ①____________ ②____________ ③____________ with their employer to negotiate a pay raise.","answers":["face","to","face"],"explanation":"A come face to face with B A與B面對面；negotiate vt. 協商","source":"龍騰自命題"},{"id":32,"zh":"墨西哥以它辣味的餐點聞名。沒有嘗一下它的特色辣味美食，到那裡的旅行就不完整。","question":"Mexico is famous for its spicy food. ①____________ trip there is complete ②____________ ③____________ its signature spicy cuisine.","answers":["No","without","trying"],"explanation":"no...without + N/V-ing為雙重否定。此處有「強調」的意味，強調某名詞或某行為的必要性；signature adj. 特色的","source":"龍騰自命題"},{"id":33,"zh":"忘了在會議後關掉麥克風，這位發言人被聽到說了髒話，損害了他紳士的形象。","question":"Forgetting to turn off his microphone after the meeting, the speaker ①____________ ②____________ ③____________ dirty words, which damaged his image as a gentleman.","answers":["was","heard","saying"],"explanation":"be heard + V-ing表當下某事進行的過程中被聽見","source":"龍騰自命題"},{"id":34,"zh":"動漫迷可以在國際動漫節中盡情欣賞各種表演及商品。","question":"Anime fans can ①____________ their ②____________ ③____________ a huge variety of shows and products at the international comics and animation festival.","answers":["feast","eyes","on"],"explanation":"feast one’s eyes on sth. 盡情欣賞","source":"龍騰自命題"},{"id":35,"zh":"澳洲的野火已經奪走許多野生動物的生命。受傷的動物可被見到虛弱地躺在路邊，等待救援。","question":"The wildfires in Australia have killed a lot of wildlife. Wounded animals ①____________ ②____________ ③____________ lying weakly by the side of the road, waiting for rescue.","answers":["can","be","seen"],"explanation":"be seen + V-ing表當下某事進行的過程中被看見","source":"龍騰自命題"},{"id":36,"zh":"如果你發現自己在森林中與一隻熊面對面，冷靜地向後退。","question":"If you ever find yourself ①____________ ②____________ ③____________ with a bear in the woods, calmly back away.","answers":["face","to","face"],"explanation":"face to face 面對面","source":"龍騰自命題"},{"id":37,"zh":"沒去拜訪大都會博物館的話，到紐約的旅行就不算完整。它貯藏的世界級藝術收藏終年都能使觀光客愜意愉快。","question":"A trip to New York is ①____________ complete ②____________ ③____________ the Metropolitan Museum. The world-class collection of art it houses delights tourists throughout the year.","answers":["not||never","without","visiting"],"explanation":"not/never...without N/V-ing為雙重否定，此處有「強調」的意味，強調某行為的必要性","source":"龍騰自命題"},{"id":38,"zh":"是因為颱風，學校取消了運動會。","question":"①____________ ②____________ ③b____________ ④____________ the typhoon ⑤____________ our school canceled the sports meet.","answers":["It","was","because","of","that"],"explanation":"","source":"三合一學習手冊"},{"id":39,"zh":"一隻奇特的蜘蛛咬了Peter Parker，把他變成蜘蛛人。","question":"A bite from a strange spider ①____________ Peter Parker ②____________ Spider-Man.","answers":["turned","into"],"explanation":"","source":"課本例句填空"},{"id":40,"zh":"Ronnie在電梯裡和他的前女友面對面碰上時非常震驚。他無處可逃！","question":"Ronnie was stunned when he came ①____________ ②____________ ③____________ with his ex-girlfriend in the elevator. There was no escape!","answers":["face","to","face"],"explanation":"","source":"課本例句填空"},{"id":41,"zh":"當Mimi第一次讀到珍．奧斯汀的小說和莎士比亞的戲劇時，她就愛上了西方文學。","question":"When Mimi first read Jane Austen’s novels and Shakespeare’s plays, she ①____________ ②____________ ③____________ ④____________ Western literature.","answers":["fell","in","love","with"],"explanation":"","source":"課本例句填空"}];const $=s=>document.querySelector(s),list=$('#list'),select=$('#select'),quiz=$('#quiz'),result=$('#result'),question=$('#question'),answerArea=$('#answerArea'),feedback=$('#feedback'),next=$('#next');let chosen=[],idx=0,mode='first';const wrong=new Map(),correct=new Set();const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ');const shuffled=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function renderList(){list.innerHTML=Q.map(q=>'<label class="pick"><input class="pickbox" type="checkbox" value="'+q.id+'" checked><b>第 '+q.id+' 題</b> <span class="source">'+esc(q.source||'')+'</span></label>').join('');count()}function count(){$('#picked').textContent='已選 '+document.querySelectorAll('.pickbox:checked').length+' 題'}list.addEventListener('change',count);$('#all').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=true);count()};$('#none').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=false);count()};$('#rand20').onclick=()=>{let ids=new Set(shuffled(Q).slice(0,Math.min(20,Q.length)).map(q=>q.id));document.querySelectorAll('.pickbox').forEach(x=>x.checked=ids.has(+x.value));count()};$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));if($('#shuffle').checked)chosen=shuffled(chosen);idx=0;mode='first';wrong.clear();correct.clear();select.classList.add('hidden');result.classList.add('hidden');quiz.classList.remove('hidden');show()};function show(){const q=chosen[idx];speechSynthesis?.cancel();$('#meta').textContent=(mode==='retry'?'錯題重做｜':'')+'第 '+(idx+1)+' / '+chosen.length+' 題';$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';$('#bar').style.width=(idx+1)/chosen.length*100+'%';question.textContent=q.question;const zh=$('#zh');if(q.zh){zh.textContent=q.zh;zh.classList.remove('hidden')}else zh.classList.add('hidden');feedback.className='feedback hidden';$('#voiceBox').classList.add('hidden');$('#check').classList.remove('hidden');next.classList.add('hidden');if(MODE==='mcq')answerArea.innerHTML='<div class="options">'+q.options.map((o,i)=>'<label class="option"><input type="radio" name="answer" value="'+i+'"><b>'+String.fromCharCode(65+i)+'.</b> '+esc(o)+'</label>').join('')+'</div>';else answerArea.innerHTML='<div class="inputs">'+q.answers.map((_,i)=>'<div class="answer-row"><label>'+(MODE==='multi'?['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'][i]:'答案')+'</label><input class="spell" autocomplete="off" spellcheck="false" placeholder="請輸入完整答案"></div>').join('')+'</div>';setTimeout(()=>answerArea.querySelector('input')?.focus(),0)}function currentAnswers(){if(MODE==='mcq'){const x=answerArea.querySelector('input:checked');return x?[+x.value]:[]}return [...answerArea.querySelectorAll('.spell')].map(x=>x.value)}function correctText(q){return MODE==='mcq'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.answers.map(a=>a.split('||')[0]).join(' / ')}function isCorrect(q,a){return MODE==='mcq'?a[0]===q.answer:a.every((x,i)=>q.answers[i].split(/\|\||\//).some(v=>norm(x)===norm(v)))}function completedSentence(q){if(MODE==='mcq'){let s=q.question,v=q.options[q.answer],parts=(s.match(/_{3,}/g)||[]).length>1&&v.includes(';')?v.split(';').map(x=>x.trim()):[v];parts.forEach(x=>s=s.replace(/_{3,}/,x));return s}if(MODE==='spell')return q.question.replace(/[A-Za-z]?_{3,}[A-Za-z]?/,q.answers[0].split('||')[0]);let s=q.question,marks=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];q.answers.forEach((a,i)=>{let value=a.split('||')[0];let re=new RegExp(marks[i]+'[A-Za-z]?_{3,}[A-Za-z]?');if(re.test(s))s=s.replace(re,value);else s=s.replace(/_{3,}/,value)});return s.replace(/[①-⑩]/g,'')}function speak(){if(!speechSynthesis)return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance($('#voiceTarget').textContent);u.lang='en-US';u.rate=.86;speechSynthesis.speak(u)}$('#speak').onclick=speak;$('#check').onclick=()=>{const q=chosen[idx],a=currentAnswers();if((MODE==='mcq'&&!a.length)||(MODE!=='mcq'&&(a.length!==q.answers.length||a.some(x=>!x.trim()))))return alert('請完成所有答案。');if(isCorrect(q,a)){correct.add(q.id);feedback.className='feedback ok';feedback.innerHTML='✅ 全部正確！'+(q.explanation?'<div class="explain">解析：'+esc(q.explanation)+'</div>':'');$('#check').classList.add('hidden');next.classList.remove('hidden');$('#voiceTarget').textContent=completedSentence(q);$('#voiceBox').classList.remove('hidden');speak()}else{if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(MODE==='mcq'?String.fromCharCode(65+a[0]):a.join(' / '));$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';feedback.className='feedback bad';feedback.innerHTML='❌ 答案不正確。正確答案：<strong>'+esc(correctText(q))+'</strong><br>請重新作答。'+(q.explanation?'<div class="explain">解析：'+esc(q.explanation)+'</div>':'');if(MODE==='mcq')answerArea.querySelectorAll('input').forEach(x=>x.checked=false);else answerArea.querySelectorAll('.spell').forEach(x=>x.value='');answerArea.querySelector('input')?.focus()}};next.onclick=()=>{idx++;idx>=chosen.length?finish():show()};$('#finish').onclick=finish;function finish(){speechSynthesis?.cancel();quiz.classList.add('hidden');result.classList.remove('hidden');$('#summary').innerHTML='<div class="stat">本輪題數<b>'+chosen.length+'</b></div><div class="stat">完成答對<b>'+correct.size+'</b></div><div class="stat">曾答錯<b>'+wrong.size+'</b></div>';$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>'<div class="wrong"><b>'+(i+1)+'. 第 '+r.q.id+' 題</b><p>'+esc((r.q.zh?r.q.zh+'\n':'')+r.q.question)+'</p><p><strong>錯誤答案：</strong>'+r.attempts.map(esc).join('；')+'</p><p><strong>正確答案：</strong>'+esc(correctText(r.q))+'</p>'+(r.q.explanation?'<p><strong>解析：</strong>'+esc(r.q.explanation)+'</p>':'')+'</div>').join(''):'<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size);$('#retry').classList.toggle('hidden',!wrong.size)}$('#retry').onclick=()=>{chosen=[...wrong.values()].map(x=>x.q);idx=0;mode='retry';correct.clear();result.classList.add('hidden');quiz.classList.remove('hidden');show()};$('#restart').onclick=()=>location.reload();$('#download').onclick=async()=>{if(!wrong.size)return;try{if(!window.docx)await new Promise((ok,fail)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js';s.onload=ok;s.onerror=fail;document.head.append(s)});let{Document,Packer,Paragraph,TextRun,HeadingLevel}=window.docx,children=[new Paragraph({text:TITLE+' 錯題紀錄',heading:HeadingLevel.TITLE})];for(const [_,r] of wrong){children.push(new Paragraph({children:[new TextRun({text:'第 '+r.q.id+' 題',bold:true})]}));if(r.q.zh)children.push(new Paragraph(r.q.zh));children.push(new Paragraph(r.q.question),new Paragraph('錯誤答案：'+r.attempts.join('；')),new Paragraph('正確答案：'+correctText(r.q)));if(r.q.explanation)children.push(new Paragraph('解析：'+r.q.explanation));children.push(new Paragraph('重新作答：________________________________________'))}let blob=await Packer.toBlob(new Document({sections:[{children}]})),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=TITLE+'_錯題.docx';a.click();URL.revokeObjectURL(url)}catch(e){let text=[...wrong.values()].map(r=>'第 '+r.q.id+' 題\n'+(r.q.zh?r.q.zh+'\n':'')+r.q.question+'\n錯誤答案：'+r.attempts.join('；')+'\n正確答案：'+correctText(r.q)+(r.q.explanation?'\n解析：'+r.q.explanation:'')).join('\n\n');let blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=TITLE+'_錯題.txt';a.click();URL.revokeObjectURL(url)}};renderList();</script><script src="longteng-vocab-required-pronunciation.js?v=20261111-1"></script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
