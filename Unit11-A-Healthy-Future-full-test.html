 stay young and healthy. However, he warns that people still won't live for ever, because accidents will still happen.\u003c/p> \u003cp>(3) Many scientists disagree. Professor Olshansky says people have made promises like this all through history. Long ago, a Chinese scientist believed that eating very little was the secret, and an English scientist believed in eating gold. Both of them died at a normal age. There is no evidence, he says, that anyone will live for 1,000 years.\u003c/p> \u003cp>(4) Readers have different opinions too. Simone thinks such a long life would be boring. Hannah thinks the idea is impossible, so she is going to look after her own health. Damian thinks Dr de Grey is probably right, but he wants scientists to cure cancer first.\u003c/p>"},{"id":103,"section":"Part F. Reading Comprehension 閱讀理解 (102–120)","stem":"Put the main ideas in the order of paragraphs (1)–(4). ① scientists who disagree ② readers' opinions ③ how long people live now ④ Dr de Grey's idea","options":["④ → ③ → ① → ②","③ → ④ → ① → ②","③ → ① → ④ → ②","① → ④ → ③ → ②"],"answer":1,"passage":"\u003cp>(1) How long will you live? A hundred years ago, most people died when they were about 50. Today, many people live to 90 or more, and doctors predict that most teenagers alive today will reach 100.\u003c/p> \u003cp>(2) One scientist, Dr Aubrey de Grey, believes people will soon live to the age of 1,000. He says that most people die from the diseases of old age. In his opinion, doctors can look after the human body just as we look after old cars. New drugs will repair old or damaged parts of the body, so people are going to stay young and healthy. However, he warns that people still won't live for ever, because accidents will still happen.\u003c/p> \u003cp>(3) Many scientists disagree. Professor Olshansky says people have made promises like this all through history. Long ago, a Chinese scientist believed that eating very little was the secret, and an English scientist believed in eatin
