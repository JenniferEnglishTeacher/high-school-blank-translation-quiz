<script>window.QUIZ_CONFIG={"title": "108 年國中會考英語｜單題＋克漏字", "mode": "mcq", "questions": [{"id": 1, "question": "第 1 題　Look at the picture. The mother duck is ______ the baby ducks across the street.", "options": ["carrying", "leading", "pushing", "watching"], "answer": 1, "answerLabel": "B", "source": "108 會考｜單題｜第 1 題", "explanation": "圖中母鴨走在前面，小鴨跟著過馬路，是在「帶領」：leading。", "explanationSource": "own", "section": "單題"}, {"id": 2, "question": "第 2 題　Ms. Liu usually gives us a lot of homework, ______ she didn’t give us any today.", "options": ["but", "if", "or", "so"], "answer": 0, "answerLabel": "A", "source": "108 會考｜單題｜第 2 題", "explanation": "老師通常出很多功課，「但」今天沒出，語意轉折用 but。", "explanationSource": "own", "section": "單題"}, {"id": 3, "question": "第 3 題　Playing games on the cellphone ______ popular with high school students.", "options": ["is", "are", "being", "to be"], "answer": 0, "answerLabel": "A", "source": "108 會考｜單題｜第 3 題", "explanation": "動名詞片語 Playing games... 當主詞視為單數，用 is。", "explanationSource": "own", "section": "單題"}, {"id": 4, "question": "第 4 題　There ______ more than twenty clubs in our school. Which one would you like to join?", "options": ["has", "have", "is", "are"], "answer": 3, "answerLabel": "D", "source": "108 會考｜單題｜第 4 題", "explanation": "表示「某地有…」用 There is/are；more than twenty clubs 是複數，用 are。", "explanationSource": "own", "section": "單題"}, {"id": 5, "question": "第 5 題　Diane had a bad cold last week. She is still too ______ to go mountain climbing with you.", "options": ["busy", "short", "weak", "young"], "answer": 2, "answerLabel": "C", "source": "108 會考｜單題｜第 5 題", "explanation": "上週重感冒，現在身體還太「虛弱」不能去爬山：too weak to...", "explanationSource": "own", "section": "單題"}, {"id": 6, "question": "第 6 題　The book under Mary’s desk is ______, but I don’t know why it is there.", "options": ["us", "me", "my", "mine"], "answer": 3, "answerLabel": "D", "source": "108 會考｜單題｜第 6 題", "explanation": "空格要代替 Mary’s book，用所有格代名詞 mine（我的書）。", "explanationSource": "own", "section": "單題"}, {"id": 7, "question": "第 7 題　Last night a garbage truck hit a tree and turned over. Now the street is ______ with lots of garbage.", "options": ["dark", "dirty", "heavy", "poor"], "answer": 1, "answerLabel": "B", "source": "108 會考｜單題｜第 7 題", "explanation": "垃圾車翻覆、滿街垃圾，街道很「髒」：dirty with garbage。", "explanationSource": "own", "section": "單題"}, {"id": 8, "question": "第 8 題　It almost killed Kevin to take care of his baby sister for one afternoon. He wondered how his mom could do ______ every day.", "options": ["her", "it", "one", "them"], "answer": 1, "answerLabel": "B", "source": "108 會考｜單題｜第 8 題", "explanation": "it 指前面整件事「照顧妹妹」；他不懂媽媽怎麼能每天做這件事。", "explanationSource": "own", "section": "單題"}, {"id": 9, "question": "第 9 題　Joyce tells her brother everything. She never ______ anything from him.", "options": ["covers", "believes", "hides", "takes"], "answer": 2, "answerLabel": "C", "source": "108 會考｜單題｜第 9 題", "explanation": "什麼都跟哥哥說，表示從不「隱瞞」任何事：hide sth. from sb.", "explanationSource": "own", "section": "單題"}, {"id": 10, "question": "第 10 題　Ben always uses his birthday as a(n) ______ to ask Dad to buy him something expensive.", "options": ["action", "excuse", "prize", "rule"], "answer": 1, "answerLabel": "B", "source": "108 會考｜單題｜第 10 題", "explanation": "拿生日當作「藉口」要爸爸買貴的東西：excuse。", "explanationSource": "own", "section": "單題"}, {"id": 11, "question": "第 11 題　______ that last piece of pie? If not, can I have it? I didn’t eat much this morning.", "options": ["Had you eaten", "Were you eating", "Do you eat", "Are you going to eat"], "answer": 3, "answerLabel": "D", "source": "108 會考｜單題｜第 11 題", "explanation": "問對方「是否打算吃」最後一塊派，如果不吃我可以吃嗎？表示未來打算：Are you going to eat...?", "explanationSource": "own", "section": "單題"}, {"id": 12, "question": "第 12 題　Everyone in the class enjoys playing chess ______ Bill; he thinks the game is boring.", "options": ["except", "for", "like", "of"], "answer": 0, "answerLabel": "A", "source": "108 會考｜單題｜第 12 題", "explanation": "全班都喜歡下棋，「除了」Bill，他覺得很無聊：except。", "explanationSource": "own", "section": "單題"}, {"id": 13, "question": "第 13 題　In my school days, I ______ to English radio programs every day. That was how I learned English at that time.", "options": ["listen", "have listened", "used to listen", "was listening"], "answer": 2, "answerLabel": "C", "source": "108 會考｜單題｜第 13 題", "explanation": "In my school days 是過去的習慣，用 used to listen（過去常常聽）。", "explanationSource": "own", "section": "單題"}, {"id": 14, "question": "第 14 題　Tom’s voice ______ when he talks about his neighbors. He speaks faster, his face becomes redder and you can almost see fire in his eyes.", "options": ["appears", "drops", "grows", "rises"], "answer": 3, "answerLabel": "D", "source": "108 會考｜單題｜第 14 題", "explanation": "講到鄰居就說話變快、臉變紅，表示生氣，聲音「提高」：rises。", "explanationSource": "own", "section": "單題"}, {"id": 15, "question": "第 15 題　______ other waiters in the restaurant have worked here longer than Clark; only Lois and Lana started working here before him.", "options": ["All", "Most", "Some", "Few"], "answer": 3, "answerLabel": "D", "source": "108 會考｜單題｜第 15 題", "explanation": "只有兩個人比 Clark 早來，所以「很少」其他服務生比他資深：Few。", "explanationSource": "own", "section": "單題"}, {"id": 36, "question": "【克漏字 第 36–37 題】\nDear Maggie,\nI know you won’t be happy but I still have to say this again. It hurts me to think that you’re going to __36__. I know you’ve always wanted to be like those actresses with big eyes and slim legs, but in fact you are already beautiful. What you are born with makes you special because nobody looks the same as you.\nIt worries me more that __37__. But sadly, there’s no quick fix to this, not even with the doctor’s help. If you don’t try to like yourself first, no one else will. People like you not because of your face, but because of your heart. You need to understand this first. Until you understand this, nothing is going to be different even if you have this change.\nI truly hope you think this through again.\nLove,\nLinda\n\n▶ 第 36 題　請選出 __36__ 的最佳答案", "options": ["change the way you are", "give up being an actress", "travel with a theater group", "run away from your friends"], "answer": 0, "answerLabel": "A", "source": "108 會考｜克漏字｜第 36 題", "explanation": "Maggie 想變得像大眼長腿的女演員，還提到醫生和 this change，表示她要去「改變外表」。", "explanationSource": "own", "section": "克漏字"}, {"id": 37, "question": "【克漏字 第 36–37 題】\nDear Maggie,\nI know you won’t be happy but I still have to say this again. It hurts me to think that you’re going to __36__. I know you’ve always wanted to be like those actresses with big eyes and slim legs, but in fact you are already beautiful. What you are born with makes you special because nobody looks the same as you.\nIt worries me more that __37__. But sadly, there’s no quick fix to this, not even with the doctor’s help. If you don’t try to like yourself first, no one else will. People like you not because of your face, but because of your heart. You need to understand this first. Until you understand this, nothing is going to be different even if you have this change.\nI truly hope you think this through again.\nLove,\nLinda\n\n▶ 第 37 題　請選出 __37__ 的最佳答案", "options": ["you’re too shy to talk with people", "you just don’t want to be like others", "you don’t think you’re good enough", "you don’t know what you’ve missed"], "answer": 2, "answerLabel": "C", "source": "108 會考｜克漏字｜第 37 題", "explanation": "後文說要先學會喜歡自己，可見 Linda 更擔心 Maggie「覺得自己不夠好」。", "explanationSource": "own", "section": "克漏字"}, {"id": 38, "question": "【克漏字 第 38–41 題】\nElizabeth Alexandra Mary Windsor was born in London on April 21, 1926. No one thought one day she __38__ the queen of the UK. After her grandfather, King George V, died in 1936, Elizabeth’s uncle, Prince Edward, became King Edward VIII. Edward __39__ in love with a married American woman long before, and he decided to marry her after he became the king. However, Edward was asked to choose between the throne and his love. Finally, he decided to give up the throne.\n__40__. After Edward VIII gave up the throne, Elizabeth’s father became King George VI. As the oldest child without any brothers, Elizabeth became next in line to the throne. She needed to say goodbye to her good old life and prepare to be a queen. After her father died in 1952, she became Queen Elizabeth II.\nEver since she became head of her country, Queen Elizabeth II __41__: She has held meetings with important people in the UK, and has visited many foreign countries. In the few hours she keeps to herself, however, she reads and enjoys horseback riding.\n（throne 王位）\n\n▶ 第 38 題　請選出 __38__ 的最佳答案", "options": ["has become", "became", "had become", "would become"], "answer": 3, "answerLabel": "D", "source": "108 會考｜克漏字｜第 38 題", "explanation": "過去的時間點「沒人想到她將來會成為」女王，過去式的未來用 would become。", "explanationSource": "own", "section": "克漏字"}, {"id": 39, "question": "【克漏字 第 38–41 題】\nElizabeth Alexandra Mary Windsor was born in London on April 21, 1926. No one thought one day she __38__ the queen of the UK. After her grandfather, King George V, died in 1936, Elizabeth’s uncle, Prince Edward, became King Edward VIII. Edward __39__ in love with a married American woman long before, and he decided to marry her after he became the king. However, Edward was asked to choose between the throne and his love. Finally, he decided to give up the throne.\n__40__. After Edward VIII gave up the throne, Elizabeth’s father became King George VI. As the oldest child without any brothers, Elizabeth became next in line to the throne. She needed to say goodbye to her good old life and prepare to be a queen. After her father died in 1952, she became Queen Elizabeth II.\nEver since she became head of her country, Queen Elizabeth II __41__: She has held meetings with important people in the UK, and has visited many foreign countries. In the few hours she keeps to herself, however, she reads and enjoys horseback riding.\n（throne 王位）\n\n▶ 第 39 題　請選出 __39__ 的最佳答案", "options": ["has fallen", "is falling", "had fallen", "would fall"], "answer": 2, "answerLabel": "C", "source": "108 會考｜克漏字｜第 39 題", "explanation": "long before（早在當上國王之前）就已愛上，比過去更早發生用過去完成式 had fallen。", "explanationSource": "own", "section": "克漏字"}, {"id": 40, "question": "【克漏字 第 38–41 題】\nElizabeth Alexandra Mary Windsor was born in London on April 21, 1926. No one thought one day she __38__ the queen of the UK. After her grandfather, King George V, died in 1936, Elizabeth’s uncle, Prince Edward, became King Edward VIII. Edward __39__ in love with a married American woman long before, and he decided to marry her after he became the king. However, Edward was asked to choose between the throne and his love. Finally, he decided to give up the throne.\n__40__. After Edward VIII gave up the throne, Elizabeth’s father became King George VI. As the oldest child without any brothers, Elizabeth became next in line to the throne. She needed to say goodbye to her good old life and prepare to be a queen. After her father died in 1952, she became Queen Elizabeth II.\nEver since she became head of her country, Queen Elizabeth II __41__: She has held meetings with important people in the UK, and has visited many foreign countries. In the few hours she keeps to herself, however, she reads and enjoys horseback riding.\n（throne 王位）\n\n▶ 第 40 題　請選出 __40__ 的最佳答案", "options": ["This changed Elizabeth’s life", "It was not easy to give up the throne", "It was good news to Elizabeth and her family", "This part of history made the UK a strong country"], "answer": 0, "answerLabel": "A", "source": "108 會考｜克漏字｜第 40 題", "explanation": "後文說父親繼位、她成為王位繼承人、要告別原本生活，這件事「改變了她的人生」。", "explanationSource": "own", "section": "克漏字"}, {"id": 41, "question": "【克漏字 第 38–41 題】\nElizabeth Alexandra Mary Windsor was born in London on April 21, 1926. No one thought one day she __38__ the queen of the UK. After her grandfather, King George V, died in 1936, Elizabeth’s uncle, Prince Edward, became King Edward VIII. Edward __39__ in love with a married American woman long before, and he decided to marry her after he became the king. However, Edward was asked to choose between the throne and his love. Finally, he decided to give up the throne.\n__40__. After Edward VIII gave up the throne, Elizabeth’s father became King George VI. As the oldest child without any brothers, Elizabeth became next in line to the throne. She needed to say goodbye to her good old life and prepare to be a queen. After her father died in 1952, she became Queen Elizabeth II.\nEver since she became head of her country, Queen Elizabeth II __41__: She has held meetings with important people in the UK, and has visited many foreign countries. In the few hours she keeps to herself, however, she reads and enjoys horseback riding.\n（throne 王位）\n\n▶ 第 41 題　請選出 __41__ 的最佳答案", "options": ["has worked hard for the UK", "has been popular with the people of the UK", "has been the queen of the UK for a long time", "has brought the people of the UK much closer"], "answer": 0, "answerLabel": "A", "source": "108 會考｜克漏字｜第 41 題", "explanation": "冒號後說明她開會、出訪多國，只剩很少私人時間，表示她「一直為國家努力工作」。", "explanationSource": "own", "section": "克漏字"}]};window.CAP_IMG={"第 1 題　Look at the picture. The mother duck is ______ the baby ducks across the street.": "assets/cap-past-exams/cap108-q1.png?v=20261119-1"};</script><script src="longteng-b1u5-quiz.js?v=20261106-3"></script><script>(function(){var M=window.CAP_IMG||{};var qn=document.getElementById('question');if(!qn)return;function put(){var old=document.getElementById('capImg');var t=qn.textContent;var src=M[t];if(old&&old.dataset.src===src)return;if(old)old.remove();if(!src)return;var im=document.createElement('img');im.id='capImg';im.dataset.src=src;im.src=src;im.alt='題目圖片';im.style.cssText='display:block;max-width:100%;max-height:420px;margin:10px auto;border:1px solid #dbe3ee;border-radius:10px;background:#fff';qn.insertAdjacentElement('afterend',im)}new MutationObserver(put).observe(qn,{childList:true,characterData:tr
