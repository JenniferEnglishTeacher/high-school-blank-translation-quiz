<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三民普高 B3U9｜詞彙選擇</title><style>
:root{--blue:#2563eb;--deep:#172554;--bg:#f4f7fb;--line:#d9e2ef;--ok:#15803d;--bad:#b91c1c;--violet:#6d28d9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font-family:Arial,"Microsoft JhengHei",sans-serif;line-height:1.7}main{max-width:1060px;margin:auto;padding:14px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 7px 24px #0f172a0c}.hero{background:linear-gradient(135deg,#eff6ff,#fff)}h1{margin:0;font-size:clamp(25px,4vw,38px)}h2,h3{margin:0 0 10px}.muted{color:#64748b}.hidden{display:none!important}.btn{border:0;border-radius:10px;padding:10px 15px;font:800 16px inherit;cursor:pointer;background:#e5e7eb;color:#172033;text-decoration:none}.primary{background:var(--blue);color:#fff}.voice{background:var(--violet);color:#fff}.danger{background:#991b1b;color:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;font-weight:800;color:#64748b;margin:9px 0}.prompt,.passage{font-size:18px;background:#f8fafc;border-radius:12px;padding:16px;white-space:pre-wrap}.passage{max-height:48vh;overflow:auto}.blank-now{background:#fef3c7;color:#92400e;padding:2px 7px;border-radius:6px;font-weight:900}.options{display:grid;gap:9px;margin:14px 0}.option{border:2px solid #cbd5e1;background:#fff;border-radius:11px;padding:12px 14px;text-align:left;font:700 16px inherit;cursor:pointer}.option:hover{border-color:var(--blue)}.option.wrong{border-color:#fecaca;background:#fff1f2}.option.correct{border-color:#86efac;background:#f0fdf4}.feedback,.reference{padding:13px;border-radius:10px;margin:12px 0;font-weight:800;white-space:pre-wrap}.feedback.ok{background:#ecfdf3;color:var(--ok)}.feedback.bad{background:#fff1f2;color:var(--bad)}.reference{border:2px solid #bbf7d0;background:#f0fdf4}.translation{white-space:pre-wrap;background:#f8fafc;padding:16px;border-radius:12px;font-size:18px}.inline-input{width:150px;max-width:100%;font:inherit;padding:7px 9px;border:2px solid #94a3b8;border-radius:8px;margin:3px}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:#f5f3ff;margin:12px 0}.voice-result{background:#fff;border:1px solid #ddd6fe;padding:10px;border-radius:9px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat,.wrong-card{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong-card{margin:10px 0;background:#fff7f7;border-color:#fecaca}@media(max-width:620px){main{padding:8px}.hero,.card{padding:15px}.meta{display:block}.prompt,.passage,.translation{font-size:16px}}
</style></head><body><main><section class="hero"><h1>三民普高 B3U9｜詞彙選擇</h1><p class="muted">原題互動練習｜37 題｜即時批改｜錯誤重填｜答對後整句播放＋選做 STT｜錯題 DOCX｜成績登錄</p><div class="actions"><a class="btn" href="dashboard.html">← 回 Dashboard</a></div></section><section id="quiz" class="card"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="reference" class="reference hidden"></div><div id="voiceBox" class="voicebox hidden"><h3>🎙️ Pronunciation Check（選做）</h3><p><b id="voiceTarget"></b></p><div class="actions"><button id="speak" class="btn voice">🔊 再聽一次</button><button id="mic" class="btn primary">🎤 開始朗讀評分</button></div><div id="voiceResult" class="voice-result">尚未進行朗讀評分。</div></div><div class="actions"><button id="check" class="btn primary hidden">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束本輪</button></div></section><section id="result" class="card hidden"><h2>練習結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="download" class="btn primary">下載錯題 DOCX</button><button id="restart" class="btn">重新練習</button></div></section></main><script>
const QUIZ={"unit":"B3U9","kind":"mcq","title":"詞彙選擇","count":37,"data":[{"number":1,"prompt":"Kevin's pressure was all _____ after he was informed that he got admitted to his dream school.","options":{"A":"dusted","B":"released","C":"doubled","D":"contributed"},"answer":"B","sentence":"Kevin's pressure was all released after he was informed that he got admitted to his dream school."},{"number":2,"prompt":"The president has made a lot of _____ to this country, which makes him respected by all the citizens.","options":{"A":"contributions","B":"surroundings","C":"economies","D":"economics"},"answer":"A","sentence":"The president has made a lot of contributions to this country, which makes him respected by all the citizens."},{"number":3,"prompt":"The global sea level is rising _____. Some islands and islets might disappear in a century.","options":{"A":"for example","B":"in addition","C":"far and near","D":"year after year"},"answer":"D","sentence":"The global sea level is rising year after year. Some islands and islets might disappear in a century."},{"number":4,"prompt":"The ancient wisdom of Confucius has been handed down for over thousand years and it has _____ in Chinese communities.","options":{"A":"consisted of","B":"taken root","C":"called off","D":"set off"},"answer":"B","sentence":"The ancient wisdom of Confucius has been handed down for over thousand years and it has taken root in Chinese communities."},{"number":5,"prompt":"Many factors may explain why people are addicted to the Internet. One factor to this phenomenon is the easy access to the Net.","options":{"A":"advancing","B":"occurring","C":"responding","D":"contributing"},"answer":"D","sentence":"Many factors may explain why people are addicted to the Internet. One factor to this phenomenon is the easy access to the Net."},{"number":6,"prompt":"I am always amazed by the beautiful and dazzling _____ in the dark sky on New Year's Eve.","options":{"A":"fireworks","B":"vehicles","C":"lungs","D":"economics"},"answer":"A","sentence":"I am always amazed by the beautiful and dazzling fireworks in the dark sky on New Year's Eve."},{"number":7,"prompt":"Interested in the knowledge of international trade, Leo has decided to study _____ after graduating from high school.","options":{"A":"fireworks","B":"surroundings","C":"tourists","D":"economics"},"answer":"D","sentence":"Interested in the knowledge of international trade, Leo has decided to study economics after graduating from high school."},{"number":8,"prompt":"Tons of _____ flocked to Times Square in New York to admire the magnificent fireworks on the eve of the New Year.","options":{"A":"tours","B":"tourists","C":"economies","D":"economics"},"answer":"B","sentence":"Tons of tourists flocked to Times Square in New York to admire the magnificent fireworks on the eve of the New Year."},{"number":9,"prompt":"_____ standards is not accepted in Mary's class. Therefore, she treats every student equally.","options":{"A":"Nearby","B":"Rural","C":"Double","D":"Surrounding"},"answer":"C","sentence":"Double standards is not accepted in Mary's class. Therefore, she treats every student equally."},{"number":10,"prompt":"The romantic impressions of Paris are _____ by the bad smell of urine and chewing gum on the street.","options":{"A":"dusted","B":"released","C":"spoiled","D":"approached"},"answer":"C","sentence":"The romantic impressions of Paris are spoiled by the bad smell of urine and chewing gum on the street."},{"number":11,"prompt":"The pouring rain washed away all the _____ of the missing girl, which made the search more difficult to complete.","options":{"A":"vehicles","B":"traces","C":"frames","D":"approaches"},"answer":"B","sentence":"The pouring rain washed away all the traces of the missing girl, which made the search more difficult to complete."},{"number":12,"prompt":"The spring fashion show was _____ because the designers could not accomplish the new collection of spring clothes in time.","options":{"A":"contributed to","B":"taken root","C":"called off","D":"set off"},"answer":"C","sentence":"The spring fashion show was called off because the designers could not accomplish the new collection of spring clothes in time."},{"number":13,"prompt":"My grandparents' house is located in the countryside, and there are many paddy fields _____.","options":{"A":"nearby","B":"poisonously","C":"internationally","D":"practically"},"answer":"A","sentence":"My grandparents' house is located in the countryside, and there are many paddy fields nearby."},{"number":14,"prompt":"It took Mia four days to finish the painting, but it was _____ by her naughty sister with crayons.","options":{"A":"framed","B":"swallowed","C":"ruined","D":"decreased"},"answer":"C","sentence":"It took Mia four days to finish the painting, but it was ruined by her naughty sister with crayons."},{"number":15,"prompt":"When the cleaner found _____ covering the bookshelf, she cleaned it up.","options":{"A":"dust","B":"trace","C":"tour","D":"ruin"},"answer":"A","sentence":"When the cleaner found dust covering the bookshelf, she cleaned it up."},{"number":16,"prompt":"It is convenient to rent a(n) _____ when people go on a self-organized trip in Japan.","options":{"A":"dust","B":"vehicle","C":"economy","D":"approach"},"answer":"B","sentence":"It is convenient to rent a(n) vehicle when people go on a self-organized trip in Japan."},{"number":17,"prompt":"The recent flood completely _____ my parents' farm. The farmhouse and fruit trees were all gone and nothing was left.","options":{"A":"ruined","B":"cracked","C":"hastened","D":"neglected"},"answer":"A","sentence":"The recent flood completely ruined my parents' farm. The farmhouse and fruit trees were all gone and nothing was left."},{"number":18,"prompt":"Human beings are born to have one heart, one liver, and two _____ inside the body.","options":{"A":"fireworks","B":"vehicles","C":"lungs","D":"traces"},"answer":"C","sentence":"Human beings are born to have one heart, one liver, and two lungs inside the body."},{"number":19,"prompt":"The territorial dispute can be back to the year 1917, when the two countries were at war.","options":{"A":"held","B":"recalled","C":"traced","D":"switched"},"answer":"C","sentence":"The territorial dispute can be back to the year 1917, when the two countries were at war."},{"number":20,"prompt":"The government calls for people to _____ the use of plastic products, like plastic bags and straws.","options":{"A":"release","B":"surround","C":"swallow","D":"decrease"},"answer":"D","sentence":"The government calls for people to decrease the use of plastic products, like plastic bags and straws."},{"number":21,"prompt":"Research suggests that people with outgoing personalities tend to be more _____, often expecting that good things will happen.","options":{"A":"efficient","B":"practical","C":"changeable","D":"optimistic"},"answer":"D","sentence":"Research suggests that people with outgoing personalities tend to be more optimistic, often expecting that good things will happen."},{"number":22,"prompt":"I prefer _____ products even though they do not look fancy. What matters to me is its function.","options":{"A":"double","B":"poisonous","C":"economic","D":"practical"},"answer":"D","sentence":"I prefer practical products even though they do not look fancy. What matters to me is its function."},{"number":23,"prompt":"The worker _____ the whole hamburger in just five minutes as if he had eaten nothing for a century.","options":{"A":"doubled","B":"swallowed","C":"spoiled","D":"approached"},"answer":"B","sentence":"The worker swallowed the whole hamburger in just five minutes as if he had eaten nothing for a century."},{"number":24,"prompt":"Mike was waiting for an important call from the international company, but he found out that the phone _____ was cut off.","options":{"A":"trace","B":"wire","C":"frame","D":"decrease"},"answer":"B","sentence":"Mike was waiting for an important call from the international company, but he found out that the phone wire was cut off."},{"number":25,"prompt":"To increase the national birth rate, the government came up with some new ______, one of which is tax reduction.","options":{"A":"discoveries","B":"identities","C":"protests","D":"approaches"},"answer":"D","sentence":"To increase the national birth rate, the government came up with some new approaches, one of which is tax reduction."},{"number":26,"prompt":"The dry weather and strong wind ______ to the spread of the wild fire.","options":{"A":"contributed","B":"neglected","C":"transported","D":"devoted"},"answer":"A","sentence":"The dry weather and strong wind contributed to the spread of the wild fire."},{"number":27,"prompt":"The Olympic Games are a(n) _____ event that takes place every four years in different countries.","options":{"A":"nearby","B":"surrounding","C":"international","D":"economic"},"answer":"C","sentence":"The Olympic Games are a(n) international event that takes place every four years in different countries."},{"number":28,"prompt":"Lara _____ a clear memory of her school days. She can vividly recall everything happening during those days.","options":{"A":"releases","B":"contributes","C":"traces","D":"retains"},"answer":"D","sentence":"Lara retains a clear memory of her school days. She can vividly recall everything happening during those days."},{"number":29,"prompt":"The detective found a clue to this case-a tiny bottle of _____ in the victim's pocket.","options":{"A":"firework","B":"poison","C":"trace","D":"ruin"},"answer":"B","sentence":"The detective found a clue to this case-a tiny bottle of poison in the victim's pocket."},{"number":30,"prompt":"It is normal that tourists are not familiar with the _____ when they arrive in a new city.","options":{"A":"fireworks","B":"contributions","C":"surroundings","D":"economics"},"answer":"C","sentence":"It is normal that tourists are not familiar with the surroundings when they arrive in a new city."},{"number":31,"prompt":"Candice's husband _____ the wedding picture and hung it on the wall of their bedroom.","options":{"A":"released","B":"traced","C":"framed","D":"swallowed"},"answer":"C","sentence":"Candice's husband framed the wedding picture and hung it on the wall of their bedroom."},{"number":32,"prompt":"Since there are too many buildings, we are not allowed to _____ fireworks in the city.","options":{"A":"take root","B":"give off","C":"call off","D":"set off"},"answer":"D","sentence":"Since there are too many buildings, we are not allowed to set off fireworks in the city."},{"number":33,"prompt":"The air of the _____ is much fresher than that of an urban area.","options":{"A":"dust","B":"release","C":"countryside","D":"tourism"},"answer":"C","sentence":"The air of the countryside is much fresher than that of an urban area."},{"number":34,"prompt":"The government has been asked to come up with effective _____ to solve the problem of unaffordable housing.","options":{"A":"vehicles","B":"surroundings","C":"economics","D":"approaches"},"answer":"D","sentence":"The government has been asked to come up with effective approaches to solve the problem of unaffordable housing."},{"number":35,"prompt":"After the criminal was ______ from prison, he rushed home to see his newborn son.","options":{"A":"relieved","B":"replaced","C":"released","D":"reflected"},"answer":"C","sentence":"After the criminal was released from prison, he rushed home to see his newborn son."},{"number":36,"prompt":"After delivering a very powerful speech, the award winner was _____ by a group of fans asking for her signature.","options":{"A":"deposited","B":"reserved","C":"vanished","D":"surrounded"},"answer":"D","sentence":"After delivering a very powerful speech, the award winner was surrounded by a group of fans asking for her signature."},{"number":37,"prompt":"There are still lots of glow-worms in this _____ area, which is different from the city where I live.","options":{"A":"rural","B":"double","C":"economic","D":"practical"},"answer":"A","sentence":"There are still lots of glow-worms in this rural area, which is different from the city where I live."}]};const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let flat=[],index=0,wrong=new Map(),attempted=new Set(),firstTry=new Set(),recognition=null;
function flatten(){if(QUIZ.kind==='mcq')return QUIZ.data.map(x=>({...x,id:String(x.number)}));if(QUIZ.kind==='translation')return QUIZ.data.map(x=>({...x,id:String(x.number)}));return QUIZ.data.flatMap(set=>set.answers.map((answer,i)=>({id:`${set.set}-${i+1}`,set:set.set,passage:set.passage,options:set.options,answer,blank:i+1,sentence:set.sentences[i],structure:set.structure})))}
function fillPassage(text,answers,options){let out=text;answers.forEach((a,i)=>{const word=options[a];const n=i+1;const pats=[new RegExp(`__\\(?${n}\\)?__`),new RegExp(`__${n}__`),new RegExp(`　${n}　`),new RegExp(`\\(${n}\\)`)];for(const p of pats){if(p.test(out)){out=out.replace(p,word);break}}});return out.replace(/\n+/g,' ').replace(/\s+/g,' ').trim()}
function markBlank(text,n){const tag=`<span class="blank-now">Blank ${n}</span>`;let out=esc(text),done=false;for(const p of [new RegExp(`__\\(?${n}\\)?__`),new RegExp(`__${n}__`),new RegExp(`　${n}　`),new RegExp(`\\(${n}\\)`)]){if(!done&&p.test(out)){out=out.replace(p,tag);done=true}}return out}
function norm(s){return String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ')}function speak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}
function show(){try{recognition?.abort()}catch(e){}speechSynthesis?.cancel();const q=flat[index];$('#meta').textContent=`第 ${index+1} / ${flat.length} 題`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=((index+1)/flat.length*100)+'%';$('#feedback').className='feedback hidden';$('#reference').classList.add('hidden');$('#voiceBox').classList.add('hidden');$('#next').classList.add('hidden');$('#check').classList.toggle('hidden',QUIZ.kind!=='translation');$('#answerArea').innerHTML='';if(QUIZ.kind==='mcq')renderChoice(q.prompt,q.options);else if(QUIZ.kind==='translation')renderTranslation(q);else{$('#question').innerHTML=`<div class="passage">${markBlank(q.passage,q.blank)}</div>`;renderChoice(`第 ${q.blank} 格`,q.options)}}
function renderChoice(prompt,options){$('#question').innerHTML=QUIZ.kind==='mcq'?`<div class="prompt">${esc(prompt)}</div>`:$('#question').innerHTML;$('#answerArea').innerHTML='<div class="options">'+Object.entries(options).map(([k,v])=>`<button class="option" data-key="${k}"><b>${k}.</b> ${esc(v)}</button>`).join('')+'</div>';document.querySelectorAll('.option').forEach(b=>b.onclick=()=>checkChoice(b.dataset.key,b))}
function renderTranslation(q){let i=0;const rendered=esc(q.prompt).replace(/_{3,}/g,()=>`<input class="inline-input" data-i="${i++}" aria-label="第 ${i} 格答案">`);$('#question').innerHTML=`<div class="translation">${rendered}</div>`;setTimeout(()=>document.querySelector('.inline-input')?.focus(),0)}
function recordWrong(q,value){if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(value);$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
function checkChoice(key,button){const q=flat[index];attempted.add(q.id);if(key!==q.answer){recordWrong(q,key);button.classList.add('wrong');$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 不正確，請再試一次。';return}if(!wrong.has(q.id))firstTry.add(q.id);document.querySelectorAll('.option').forEach(b=>b.disabled=true);button.classList.add('correct');pass(q)}
function checkTranslation(){const q=flat[index],values=[...document.querySelectorAll('.inline-input')].map(x=>x.value);attempted.add(q.id);const ok=values.length===q.answers.length&&values.every((v,i)=>norm(v)===norm(q.answers[i]));if(!ok){recordWrong(q,values.join(' / '));$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 尚有空格不正確，請修正後再檢查。';return}if(!wrong.has(q.id))firstTry.add(q.id);document.querySelectorAll('.inline-input').forEach(x=>x.disabled=true);pass(q)}
function pass(q){$('#feedback').className='feedback ok';$('#feedback').textContent='✅ 正確！';$('#reference').classList.remove('hidden');$('#reference').textContent='完整句：'+q.sentence;$('#check').classList.add('hidden');$('#next').classList.remove('hidden');$('#voiceBox').classList.remove('hidden');$('#voiceTarget').textContent=q.sentence;$('#voiceResult').className='voice-result';$('#voiceResult').textContent='尚未進行朗讀評分。';speak(q.sentence)}
function similarity(a,b){a=norm(a).replace(/[^a-z0-9' ]/g,'').split(' ').filter(Boolean);b=norm(b).replace(/[^a-z0-9' ]/g,'').split(' ').filter(Boolean);const used=new Set;let hit=0;for(const w of a){const j=b.findIndex((x,i)=>x===w&&!used.has(i));if(j>=0){hit++;used.add(j)}}return Math.round(100*hit/Math.max(a.length,b.length,1))}
function startMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('#voiceResult').textContent='此瀏覽器不支援語音辨識，建議使用 Chrome。';return}recognition=new SR;recognition.lang='en-US';recognition.interimResults=false;$('#voiceResult').textContent='正在聆聽，請朗讀完整句子…';recognition.onresult=e=>{const said=e.results[0][0].transcript,target=flat[index].sentence,score=similarity(target,said);$('#voiceResult').className='voice-result '+(score>=80?'good':'retry');$('#voiceResult').textContent=`辨識：${said}\n正確率：${score}%`};recognition.onerror=e=>$('#voiceResult').textContent='語音辨識未完成：'+e.error;recognition.start()}
function finish(){try{recognition?.abort()}catch(e){}speechSynthesis?.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');const rows=[...wrong.values()];$('#summary').innerHTML=`<div class="stat">實際作答<b>${attempted.size}</b></div><div class="stat">一次答對<b>${firstTry.size}</b></div><div class="stat">曾答錯<b>${rows.length}</b></div>`;$('#wrongList').innerHTML=rows.length?rows.map((r,i)=>`<div class="wrong-card"><b>${i+1}. 第 ${esc(r.q.id)} 題</b><p>${esc(r.q.prompt||`第 ${r.q.blank} 格`)}</p><p>作答：${r.attempts.map(esc).join('；')}</p><p>答案：${esc(r.q.answer||r.q.answers.join(' / '))}</p></div>`).join(''):(attempted.size?'<div class="feedback ok">🎉 本輪全部一次答對！</div>':'<p class="muted">本輪尚未作答，因此不登錄成績。</p>');$('#download').classList.toggle('hidden',!rows.length);if(attempted.size)document.dispatchEvent(new CustomEvent('quiz-result-ready',{detail:{total:attempted.size,correct:firstTry.size,wrong:rows.length,mistakeQuestionNumbers:rows.map(r=>r.q.id).join(', ')}}))}
$('#check').onclick=checkTranslation;$('#next').onclick=()=>{if(++index>=flat.length)finish();else show()};$('#finish').onclick=finish;$('#restart').onclick=()=>location.reload();$('#speak').onclick=()=>speak(flat[index].sentence);$('#mic').onclick=startMic;$('#download').onclick=async()=>{const rows=[...wrong.values()];if(!rows.length)return;try{if(!window.docx)await new Promise((ok,fail)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js';s.onload=ok;s.onerror=fail;document.head.append(s)});const{Document,Packer,Paragraph,HeadingLevel}=window.docx,children=[new Paragraph({text:`三民普高 ${QUIZ.unit} ${QUIZ.title} 錯題紀錄`,heading:HeadingLevel.TITLE})];rows.forEach(r=>children.push(new Paragraph({text:`第 ${r.q.id} 題`,heading:HeadingLevel.HEADING_2}),new Paragraph(r.q.prompt||r.q.passage||''),new Paragraph('作答：'+r.attempts.join('；')),new Paragraph('答案：'+(r.q.answer||r.q.answers.join(' / ')))));const blob=await Packer.toBlob(new Document({sections:[{children}]})),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Sanmin_${QUIZ.unit}_${QUIZ.kind}_錯題.docx`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){alert('目前無法產生 DOCX，請稍後再試。')}};flat=flatten();show();
</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
