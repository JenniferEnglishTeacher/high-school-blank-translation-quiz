<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="龍騰普高 B1U4 文法選擇（其他考點）互動練習"><title>龍騰普高 B1U4 文法選擇（其他考點）</title><style>:root{--blue:#2563eb;--navy:#1e3a8a;--bg:#f4f7fb;--card:#fff;--line:#dbe3ee;--ink:#172033;--muted:#64748b;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--voice:#6d28d9;--voicebg:#f5f3ff;--amber:#9a3412;--amberbg:#fff7ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}.wrap{max-width:920px;margin:auto;padding:16px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 5px 18px #0f172a0d}.hero{background:linear-gradient(135deg,#e8f1ff,#fff)}h1{margin:0 0 6px;font-size:clamp(25px,4vw,38px)}h2{margin-top:0}.note{color:var(--muted)}.hidden{display:none!important}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.btn{border:0;border-radius:10px;padding:11px 17px;font:800 16px inherit;cursor:pointer;background:#e5e7eb;color:var(--ink);text-decoration:none}.primary{background:var(--blue);color:#fff}.danger{background:#991b1b;color:#fff}.voice{background:var(--voice);color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.btn:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.pick{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin:7px 0;background:#fafcff}.pick input{margin-right:8px;width:17px;height:17px;accent-color:var(--blue)}#list{max-height:440px;overflow:auto;border:1px solid var(--line);padding:7px;border-radius:12px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:800;margin:8px 0 14px}.zh{padding:10px 13px;background:var(--amberbg);border-radius:9px;color:var(--amber);font-weight:800;margin-bottom:10px}.question{font-size:21px;font-weight:750;padding:16px;background:#f8fafc;border-radius:11px;white-space:pre-wrap}.options{display:grid;gap:9px;margin:14px 0}.option{display:flex;align-items:center;gap:11px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-size:18px;font-weight:750;cursor:pointer}.option:hover{border-color:#60a5fa;background:#eff6ff}.option:has(input:checked){border-color:var(--blue);background:#dbeafe;color:var(--navy)}.option input{width:20px;height:20px;accent-color:var(--blue)}.inputs{display:grid;gap:10px;margin:15px 0}.answer-row{display:grid;grid-template-columns:55px 1fr;gap:10px;align-items:center}.answer-row label{font-weight:900;color:var(--navy);text-align:center}.spell{width:100%;font:inherit;font-size:18px;padding:11px;border:2px solid #94a3b8;border-radius:9px}.feedback{padding:13px;border-radius:10px;font-weight:800;margin:13px 0}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.explain{font-weight:500;margin-top:7px}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:var(--voicebg);margin:13px 0}.voicebox b{display:block;font-size:19px;margin-bottom:8px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}.wrong p{margin:6px 0}.source{font-size:13px;color:var(--muted)}@media(max-width:600px){.wrap{padding:9px}.hero,.card{padding:15px}.question{font-size:18px;padding:13px}.option{font-size:17px}.answer-row{grid-template-columns:42px 1fr}.meta{display:block}}</style></head><body><main class="wrap"><section class="hero"><h1>龍騰普高 B1U4 文法選擇（其他考點）</h1><p>共 26 題。可自行選題、隨機抽題；答錯會顯示正確答案並要求重新作答。</p><p class="note">答對後會朗讀完整英文句子；完成後可重做錯題並下載 DOCX 錯題紀錄。</p><div class="toolbar"><a class="btn" href="dashboard.html">← 回測驗總覽</a></div></section><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn">全部選取</button><button id="none" class="btn">全部取消</button><button id="rand20" class="btn">隨機 20 題</button></div><label><input id="shuffle" type="checkbox"> 打亂出題順序</label><div id="list"></div><div class="actions"><button id="start" class="btn primary">開始作答</button><span id="picked" class="note"></span></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="voiceBox" class="voicebox hidden"><b id="voiceTarget"></b><button id="speak" class="btn voice">🔊 再聽一次</button></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="retry" class="btn primary">只重做錯題</button><button id="download" class="btn">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></main><script>const TITLE="龍騰普高 B1U4 文法選擇（其他考點）",MODE="mcq",Q=[{"id":1,"question":"Anyone who receives ____________ a beautiful gift is likely to feel very excited.","options":["so","such","very","much"],"answer":1,"explanation":"空格後面是名詞片語，因此空格內必須選擇形容詞來修飾，故答案要選擇such，以形成such + a + N，意指「那樣的……」。其他選項都是副詞，所以不能用來修飾名詞片語","source":"龍騰自命題"},{"id":2,"question":"My father worked for a small local bank ____________ he turned sixty-five years old.","options":["until","through","despite","upon"],"answer":0,"explanation":"由於空格後面是完整的子句，因此可以推知要選擇連接詞。而在選項中只有until可以當作連接詞，其他都是介系詞，故答案要選until，表示「直到……」","source":"龍騰自命題"},{"id":3,"question":"Frank invited Sharon to ____________ dinner with him, but she turned down his invitation.","options":["having","has","had","have"],"answer":3,"explanation":"此處考點為invite sb. to + VR，表「邀請某人去做……」，故答案要選擇原形動詞have","source":"龍騰自命題"},{"id":4,"question":"The information you found on the Internet is very useful ____________ me. Thanks a lot!","options":["in","of","to","at"],"answer":2,"explanation":"此處考點為be useful to + 人，表「對某人有用」，所以答案要選擇to","source":"龍騰自命題"},{"id":5,"question":"Our problem is ____________ we are running out of time and may not be able to finish the job in time.","options":["what","that","which","if"],"answer":1,"explanation":"此處考點為由that引導一個完整名詞子句當作主詞補語，故答案為that","source":"龍騰自命題"},{"id":6,"question":"Richard taught his students ____________ effective ways to improve their English.","options":["a few","a little","much","an amount of"],"answer":0,"explanation":"由於在空格後面是複數名詞片語，而在選項中只有a few後面可以接複數可數名詞，故為正確答案，其他選項都用於不可數名詞","source":"龍騰自命題"},{"id":7,"question":"The new house Ariel just bought is ____________ larger than her old one.","options":["very","too","such","far"],"answer":3,"explanation":"由於空格後面是比較級，故要選擇far來修飾","source":"龍騰自命題"},{"id":8,"question":"Mr. Li managed to make it to his flight to Europe by ____________ a taxi to the airport.","options":["took","taken","taking","takes"],"answer":2,"explanation":"本題考點為by + V-ing，表「藉由……方式」，故答案要選擇taking","source":"龍騰自命題"},{"id":9,"question":"It’s said that the pretty girl ____________ long black hair over there is Robin’s new girlfriend.","options":["from","with","for","upon"],"answer":1,"explanation":"此處要選擇介系詞with來表示「有……」的概念","source":"龍騰自命題"},{"id":10,"question":"The young man who is sitting ____________ Patrick seems to be Daniel.","options":["beside","between","among","within"],"answer":0,"explanation":"此處所考的是beside這個介系詞的用法，意思是指「在……旁邊」","source":"龍騰自命題"},{"id":11,"question":"The main actor and actress in the movie Ant Man and the Wasp visited Taipei, and fans ____________ Taiwan came to meet their idols.","options":["with","over","across","beside"],"answer":2,"explanation":"across + 地方 = all over + 地方，表「遍及」。","source":"龍騰自命題"},{"id":12,"question":"Joan has shaken off a lot of pounds in recent months. She is ____________ thinner than she was before.","options":["far","very","ever","so"],"answer":0,"explanation":"程度副詞far修飾形容詞比較級thinner，表示比以前瘦「很多」。","source":"龍騰自命題"},{"id":13,"question":"Andy hopes his future wife is a smart and kind-hearted woman, and Diana is just ____________ a lady. That’s why he loves her so much.","options":["so","such as","such","like"],"answer":2,"explanation":"such後面直接接名詞，表「那樣的；那一類的」。","source":"龍騰自命題"},{"id":14,"question":"____________ time goes by, I’m getting older and my memory is becoming weaker.","options":["As","If","Ever since","Though"],"answer":0,"explanation":"As S + V, S + V....，其中as當連接詞，表「隨著……」。","source":"龍騰自命題"},{"id":15,"question":"Patrick Dempsey is ____________ just an actor; he is a famous race car driver, too.","options":["as good as","more than","just only","no more than"],"answer":1,"explanation":"more than 不只是……","source":"龍騰自命題"},{"id":16,"question":"Kelly broke up with her boyfriend ____________ a good reason—he had cheated on her.","options":["for","in","to","at"],"answer":0,"explanation":"for + reason 基於……原因","source":"龍騰自命題"},{"id":17,"question":"Mrs. Brown gave me a bag of homemade cookies ____________ a reward for helping her wash her car.","options":["for","with","by","as"],"answer":3,"explanation":"as是介系詞，表「作為……」。","source":"龍騰自命題"},{"id":18,"question":"Harry says the food in the fancy restaurant is terrible, but the truth is ____________ it is too expensive for him.","options":["as","because","which","that"],"answer":3,"explanation":"連接詞that引導名詞子句，當主詞補語。","source":"龍騰自命題"},{"id":19,"question":"Nina cried out when she found that her piece of cake was much smaller than ____________.","options":["her brother","hers brother","hers brother’s","her brother’s"],"answer":3,"explanation":"her brother’s = her brother’s cake","source":"龍騰自命題"},{"id":20,"question":"Seeing me shaking from the cold, my mother handed ____________ to warm me up.","options":["a hot cup of coffee me","me a hot cup of coffee","a hot cup of coffee for me","me to a hot cup of coffee"],"answer":1,"explanation":"hand當授與動詞，後面先接間接受詞me，再接直接受詞a hot cup of coffee。","source":"龍騰自命題"},{"id":21,"question":"Here ____________ cookies I made myself. Grab some if you are hungry.","options":["is","has","are","have"],"answer":2,"explanation":"","source":"三合一學習手冊"},{"id":22,"question":"____________ I found my wallet was gone, I reported this to the police.","options":["Although","Once","Due to","Until"],"answer":1,"explanation":"","source":"三合一學習手冊"},{"id":23,"question":"____________ we know more about the universe, we will become more interested in it.","options":["Before","As","For","So"],"answer":1,"explanation":"","source":"三合一學習手冊"},{"id":24,"question":"____________ We can ask him what happened.","options":["There comes he.","There he came.","Here he coming.","Here he comes."],"answer":3,"explanation":"","source":"三合一學習手冊"},{"id":25,"question":"____________ I make up my mind, I will do my best to achieve my goal.","options":["Once","With","Because of","Though"],"answer":0,"explanation":"","source":"三合一學習手冊"},{"id":26,"question":"____________ it was getting late, we tried to look for a restaurant for dinner.","options":["That","Whether","As","If"],"answer":2,"explanation":"","source":"三合一學習手冊"}];const $=s=>document.querySelector(s),list=$('#list'),select=$('#select'),quiz=$('#quiz'),result=$('#result'),question=$('#question'),answerArea=$('#answerArea'),feedback=$('#feedback'),next=$('#next');let chosen=[],idx=0,mode='first';const wrong=new Map(),correct=new Set();const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ');const shuffled=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function renderList(){list.innerHTML=Q.map(q=>'<label class="pick"><input class="pickbox" type="checkbox" value="'+q.id+'" checked><b>第 '+q.id+' 題</b> <span class="source">'+esc(q.source||'')+'</span></label>').join('');count()}function count(){$('#picked').textContent='已選 '+document.querySelectorAll('.pickbox:checked').length+' 題'}list.addEventListener('change',count);$('#all').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=true);count()};$('#none').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=false);count()};$('#rand20').onclick=()=>{let ids=new Set(shuffled(Q).slice(0,Math.min(20,Q.length)).map(q=>q.id));document.querySelectorAll('.pickbox').forEach(x=>x.checked=ids.has(+x.value));count()};$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));if($('#shuffle').checked)chosen=shuffled(chosen);idx=0;mode='first';wrong.clear();correct.clear();select.classList.add('hidden');result.classList.add('hidden');quiz.classList.remove('hidden');show()};function show(){const q=chosen[idx];speechSynthesis?.cancel();$('#meta').textContent=(mode==='retry'?'錯題重做｜':'')+'第 '+(idx+1)+' / '+chosen.length+' 題';$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';$('#bar').style.width=(idx+1)/chosen.length*100+'%';question.textContent=q.question;const zh=$('#zh');if(q.zh){zh.textContent=q.zh;zh.classList.remove('hidden')}else zh.classList.add('hidden');feedback.className='feedback hidden';$('#voiceBox').classList.add('hidden');$('#check').classList.remove('hidden');next.classList.add('hidden');if(MODE==='mcq')answerArea.innerHTML='<div class="options">'+q.options.map((o,i)=>'<label class="option"><input type="radio" name="answer" value="'+i+'"><b>'+String.fromCharCode(65+i)+'.</b> '+esc(o)+'</label>').join('')+'</div>';else answerArea.innerHTML='<div class="inputs">'+q.answers.map((_,i)=>'<div class="answer-row"><label>'+(MODE==='multi'?['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'][i]:'答案')+'</label><input class="spell" autocomplete="off" spellcheck="false" placeholder="請輸入完整答案"></div>').join('')+'</div>';setTimeout(()=>answerArea.querySelector('input')?.focus(),0)}function currentAnswers(){if(MODE==='mcq'){const x=answerArea.querySelector('input:checked');return x?[+x.value]:[]}return [...answerArea.querySelectorAll('.spell')].map(x=>x.value)}function correctText(q){return MODE==='mcq'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.answers.map(a=>a.split('||')[0]).join(' / ')}function isCorrect(q,a){return MODE==='mcq'?a[0]===q.answer:a.every((x,i)=>q.answers[i].split(/\|\||\//).some(v=>norm(x)===norm(v)))}function completedSentence(q){if(MODE==='mcq')return q.question.replace(/_{3,}/,q.options[q.answer]);if(MODE==='spell')return q.question.replace(/[A-Za-z]?_{3,}[A-Za-z]?/,q.answers[0].split('||')[0]);let s=q.question,marks=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];q.answers.forEach((a,i)=>{let value=a.split('||')[0];let re=new RegExp(marks[i]+'[A-Za-z]?_{3,}[A-Za-z]?');if(re.test(s))s=s.replace(re,value);else s=s.replace(/_{3,}/,value)});return s.replace(/[①-⑩]/g,'')}function speak(){if(!speechSynthesis)return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance($('#voiceTarget').textContent);u.lang='en-US';u.rate=.86;speechSynthesis.speak(u)}$('#speak').onclick=speak;$('#check').onclick=()=>{const q=chosen[idx],a=currentAnswers();if((MODE==='mcq'&&!a.length)||(MODE!=='mcq'&&(a.length!==q.answers.length||a.some(x=>!x.trim()))))return alert('請完成所有答案。');if(isCorrect(q,a)){correct.add(q.id);feedback.className='feedback ok';feedback.innerHTML='✅ 全部正確！'+(q.explanation?'<div class="explain">解析：'+esc(q.explanation)+'</div>':'');$('#check').classList.add('hidden');next.classList.remove('hidden');$('#voiceTarget').textContent=completedSentence(q);$('#voiceBox').classList.remove('hidden');speak()}else{if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(MODE==='mcq'?String.fromCharCode(65+a[0]):a.join(' / '));$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';feedback.className='feedback bad';feedback.innerHTML='❌ 答案不正確。正確答案：<strong>'+esc(correctText(q))+'</strong><br>請重新作答。'+(q.explanation?'<div class="explain">解析：'+esc(q.explanation)+'</div>':'');if(MODE==='mcq')answerArea.querySelectorAll('input').forEach(x=>x.checked=false);else answerArea.querySelectorAll('.spell').forEach(x=>x.value='');answerArea.querySelector('input')?.focus()}};next.onclick=()=>{idx++;idx>=chosen.length?finish():show()};$('#finish').onclick=finish;function finish(){speechSynthesis?.cancel();quiz.classList.add('hidden');result.classList.remove('hidden');$('#summary').innerHTML='<div class="stat">本輪題數<b>'+chosen.length+'</b></div><div class="stat">完成答對<b>'+correct.size+'</b></div><div class="stat">曾答錯<b>'+wrong.size+'</b></div>';$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>'<div class="wrong"><b>'+(i+1)+'. 第 '+r.q.id+' 題</b><p>'+esc((r.q.zh?r.q.zh+'\n':'')+r.q.question)+'</p><p><strong>錯誤答案：</strong>'+r.attempts.map(esc).join('；')+'</p><p><strong>正確答案：</strong>'+esc(correctText(r.q))+'</p>'+(r.q.explanation?'<p><strong>解析：</strong>'+esc(r.q.explanation)+'</p>':'')+'</div>').join(''):'<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size);$('#retry').classList.toggle('hidden',!wrong.size)}$('#retry').onclick=()=>{chosen=[...wrong.values()].map(x=>x.q);idx=0;mode='retry';correct.clear();result.classList.add('hidden');quiz.classList.remove('hidden');show()};$('#restart').onclick=()=>location.reload();$('#download').onclick=async()=>{if(!wrong.size)return;try{if(!window.docx)await new Promise((ok,fail)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js';s.onload=ok;s.onerror=fail;document.head.append(s)});let{Document,Packer,Paragraph,TextRun,HeadingLevel}=window.docx,children=[new Paragraph({text:TITLE+' 錯題紀錄',heading:HeadingLevel.TITLE})];for(const [_,r] of wrong){children.push(new Paragraph({children:[new TextRun({text:'第 '+r.q.id+' 題',bold:true})]}));if(r.q.zh)children.push(new Paragraph(r.q.zh));children.push(new Paragraph(r.q.question),new Paragraph('錯誤答案：'+r.attempts.join('；')),new Paragraph('正確答案：'+correctText(r.q)));if(r.q.explanation)children.push(new Paragraph('解析：'+r.q.explanation));children.push(new Paragraph('重新作答：________________________________________'))}let blob=await Packer.toBlob(new Document({sections:[{children}]})),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=TITLE+'_錯題.docx';a.click();URL.revokeObjectURL(url)}catch(e){let text=[...wrong.values()].map(r=>'第 '+r.q.id+' 題\n'+(r.q.zh?r.q.zh+'\n':'')+r.q.question+'\n錯誤答案：'+r.attempts.join('；')+'\n正確答案：'+correctText(r.q)+(r.q.explanation?'\n解析：'+r.q.explanation:'')).join('\n\n');let blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=TITLE+'_錯題.txt';a.click();URL.revokeObjectURL(url)}};renderList();</script></body></html>
