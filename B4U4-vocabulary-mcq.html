went out, the man went into the house and saved the little boy."},{"id":8,"stem":"(   ) It’s two in the afternoon. Gina turns on the ______ and enjoys a cup of tea.","options":["balcony","space","garden","radio"],"answer":3,"explanation":"現在是下午兩點。Gina　打開「收音機」並享受一杯茶。","full":"It’s two in the afternoon. Gina turns on the radio and enjoys a cup of tea."},{"id":9,"stem":"(   ) John can’t sleep because his sister is making a lot of ______.","options":["garden","noise","rainbow","size"],"answer":1,"explanation":"John　無法入睡，因為他的姐姐正在製造很多「噪音」。","full":"John can’t sleep because his sister is making a lot of noise."},{"id":10,"stem":"(   ) It’s dark here. Let’s light up some ______.","options":["roses","candles","news","stars"],"answer":1,"explanation":"這裡很黑。讓我們點亮一些「蠟燭」。","full":"It’s dark here. Let’s light up some candles."},{"id":11,"stem":"(   ) Angus loves Ricky’s ______ song. He can sing it all day!","options":["sharp","mean","latest","pretty"],"answer":2,"explanation":"Angus　喜愛　Ricky「最新的」歌曲。他可以唱一整天！","full":"Angus loves Ricky’s latest song. He can sing it all day!"},{"id":12,"stem":"(   ) It’s hot today. Please ______ the fan.","options":["open","shine","light","turn on"],"answer":3,"explanation":"今天很熱。請「打開」電風扇。「打開」電器產品，用　turn on。","full":"It’s hot today. Please turn on the fan."},{"id":13,"stem":"(   ) Look! There are a lot of ______ shining in the sky.","options":["frogs","news","stars","roses"],"answer":2,"explanation":"看！天空中有好多「星星」閃耀著。","full":"Look! There are a lot of stars shining in the sky."},{"id":14,"stem":"(   ) Elma bought the expensive dress because it is ______.","options":["dangerous","scary","pretty","sharp"],"answer":2,"explanation":"Elma　買了那件昂貴的洋裝，因為它很「漂亮」。","full":"Elma bought the expensive dress because it is pretty."},{"id":15,"stem":"(   ) Tom enjoys watching the moon with his family on the ______ on Moon Festival.","options":["typhoon","earthquake","star","balcony"],"answer":3,"explanation":"Tom　喜歡在中秋節時和他的家人一起在「陽臺」賞月。","full":"Tom enjoys watching the moon with his family on the balcony on Moon Festival."},{"id":16,"stem":"(   ) The sun is ______ in the sky. It must be a good day!","options":["training","telling","shining","shouting"],"answer":2,"explanation":"太陽在天空中「閃耀」著。今天一定是個好天氣！","full":"The sun is shining in the sky. It must be a good day!"},{"id":17,"stem":"(   ) After the rain, it is not always easy to see a ______ with seven colors in the sky.","options":["rainbow","size","star","rose"],"answer":0,"explanation":"下雨過後，在空中要看到七色的「彩虹」並不總是很容易。","full":"After the rain, it is not always easy to see a rainbow with seven colors in the sky."},{"id":18,"stem":"(   ) There will be a lot of ______ singing by the lake in summer.","options":["roses","frogs","snakes","bees"],"answer":1,"explanation":"在夏天將會有很多「青蛙」在湖旁邊唱歌。","full":"There will be a lot of frogs singing by the lake in summer."},{"id":19,"stem":"(   ) Lucy was ______ some food when her son came home. Then they had dinner together.","options":["picking","staying","sharing","preparing"],"answer":3,"explanation":"當　Lucy　的兒子回家時，她正在「準備」一些食物。然後他們一起吃晚餐。","full":"Lucy was preparing some food when her son came home. Then they had dinner together."},{"id":20,"stem":"(   ) The knife is ______. Be careful when you use it.","options":["sharp","ugly","wise","delicious"],"answer":0,"explanation":"那把刀子很「尖銳」。使用它時要小心。","full":"The knife is sharp. Be careful when you use it."},{"id":21,"stem":"(   ) I like to watch fish swimming in the ______ near our house after school.","options":["star","vegetable","pond","radio"],"answer":2,"explanation":"我喜歡放學後在我家附近的「池塘」看魚游泳。","full":"I like to watch fish swimming in the pond near our house after school."},{"id":22,"stem":"(   ) Can you hear that strange ______? I think Little Johnny is crying.","options":["pond","noise","space","candle"],"answer":1,"explanation":"你有聽到那奇怪的「噪音」嗎？我認為是小　Johnny　在哭。","full":"Can you hear that strange noise? I think Little Johnny is crying."},{"id":23,"stem":"(   ) Watch out! A ______ rock is rolling down.","options":["giant","pretty","latest","dirty"],"answer":0,"explanation":"小心！一顆「巨大的」岩石正滾落下來。","full":"Watch out! A giant rock is rolling down."},{"id":24,"stem":"(   ) Ivy tried to ______ her dog to buy food in that restaurant. However, her dog ate all the food before they went home.","options":["train","face","reach","light"],"answer":0,"explanation":"Ivy　試著要「訓練」她的狗去那間餐廳買食物。然而，她的狗在回家前就把食物都吃光了。","full":"Ivy tried to train her dog to buy food in that restaurant. However, her dog ate all the food before they went home."},{"id":25,"stem":"(   ) After walking for two hours, we finally ______ the small house in the mountain.","options":["reached","prepared","answered","raised"],"answer":0,"explanation":"在走了兩個小時後，我們終於「到達」山中的小屋。","full":"After walking for two hours, we finally reached the small house in the mountain."},{"id":26,"stem":"(   ) I can see bright ______ there. There must be someone in the mountains.","options":["garden","turtle","news","light"],"answer":3,"explanation":"我可以看到那裡有亮「光」。山裡面一定有人。","full":"I can see bright light there. There must be someone in the mountains."},{"id":27,"stem":"(   ) We have to buy some food and water because of the strong ______.","options":["rainbow","typhoon","garden","size"],"answer":1,"explanation":"我們必須去買一些食物跟水，因為強烈「颱風」來了。","full":"We have to buy some food and water because of the strong typhoon."},{"id":28,"stem":"(   ) The room is full of Tony’s toys. There is no ______ for me to walk in.","options":["garden","space","cent","chance"],"answer":1,"explanation":"這間房間充滿　Tony　的玩具。沒有「空間」讓我走進去。","full":"The room is full of Tony’s toys. There is no space for me to walk in."},{"id":29,"stem":"(   ) It is dangerous to play in the ______ waves. Let’s go surfing next time.","options":["giant","weak","wise","real"],"answer":0,"explanation":"在「巨大的」海浪中玩耍很危險。讓我們下次再來衝浪吧。","full":"It is dangerous to play in the giant waves. Let’s go surfing next time."},{"id":30,"stem":"(   ) It’s getting dark. Why don’t you turn on the ______?","options":["candle","light","news","balcony  ______"],"answer":1,"explanation":"天色漸漸暗了。為何不打開「燈」呢？","full":"It’s getting dark. Why don’t you turn on the light?"},{"id":31,"stem":"(   ) The shoes are too big for me. Do you have ones with small ______?","options":["frog","space","size","radio"],"answer":2,"explanation":"這雙鞋子對我來說太大了。你有小一點的「尺寸」嗎？","full":"The shoes are too big for me. Do you have ones with small size?"},{"id":32,"stem":"(   ) Finally, Helen ______ the fear of dogs and played with Jojo yesterday.","options":["faced","reached","picked","prepared"],"answer":0,"explanation":"終於，Helen　昨天「面對」對狗的恐懼並和　Jojo　玩在一起。","full":"Finally, Helen faced the fear of dogs and played with Jojo yesterday."},{"id":33,"stem":"(   ) Don’t give up! You have to ______ your own problem.","options":["face","train","shine","light"],"answer":0,"explanation":"不要放棄！你必須「面對」你自己的問題。","full":"Don’t give up! You have to face your own problem."},{"id":34,"stem":"(   ) ______ Bob gets good grades（成績） next time, his mom will be happy.","options":["Because","But","Before","If"],"answer":3,"explanation":"「如果」下次　Bob　得到好成績，他媽媽會很高興。","full":"If Bob gets good grades（成績） next time, his mom will be happy."},{"id":35,"stem":"(   ) The cat is two ______ bigger than that dog. How interesting!","options":["stars","ponds","times","beans"],"answer":2,"explanation":"那隻貓比那隻狗大兩「倍」。多有趣呀！","full":"The cat is two times bigger than that dog. How interesting!"},{"id":36,"stem":"(   ) They walked bravely ______ the rainforest, and went home safely.","options":["as","over","through","without"],"answer":2,"explanation":"他們勇敢地走「過」雨林，並安全到家。","full":"They walked bravely through the rainforest, and went home safely."},{"id":37,"stem":"(   ) The man gave the woman ninety-nine ______ to show his love.","options":["roses","candles","turtles","spiders"],"answer":0,"explanation":"那位男人給那位女人九十九朵「玫瑰花」來表示他的愛。","full":"The man gave the woman ninety-nine roses to show his love."},{"id":38,"stem":"(   ) Mrs. Smith planted a lot of beautiful flowers in the ______.","options":["earthquake","garden","star","light"],"answer":1,"explanation":"Mrs. Smith　在「花園」裡種了很多漂亮的花朵。","full":"Mrs. Smith planted a lot of beautiful flowers in the garden."},{"id":39,"stem":"(   ) It is lucky to see a(n) ______ with seven colors after the rain.","options":["earthquake","star","candle","rainbow"],"answer":3,"explanation":"在雨後能看到七種顏色的「彩虹」是很幸運的。","full":"It is lucky to see a(n) rainbow with seven colors after the rain."},{"id":40,"stem":"(   ) Some people got hurt in that big ______. We should help them.","options":["size","earthquake","space","rose"],"answer":1,"explanation":"有些人在那場大「地震」中受傷了。我們應該要幫助他們。","full":"Some people got hurt in that big earthquake. We should help them."}];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=s=>String(s??'').trim().toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:()“”"]/g,'').replace(/\s+/g,' ');
let chosen=[],idx=0;const wrong=new Map(),attempted=new Set(),correct=new Set();
function preview(q){return KIND==='mcq'?q.stem:q.prompt}
function renderList(){$('#list').innerHTML=Q.map(q=>`<label class="pick"><input class="pickbox" type="checkbox" value="${q.id}" checked><span><b>第 ${q.id} 題</b><small>${esc(preview(q))}</small></span></label>`).join('')}
function setAll(v){document.querySelectorAll('.pickbox').forEach(x=>x.checked=v)}
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
$('#all').onclick=()=>setAll(true);$('#none').onclick=()=>setAll(false);$('#random').onclick=()=>{setAll(false);const ids=new Set(shuffled(Q).slice(0,20).map(q=>q.id));document.querySelectorAll('.pickbox').forEach(x=>x.checked=ids.has(+x.value))};
$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));idx=0;wrong.clear();attempted.clear();correct.clear();$('#select').classList.add('hidden');$('#result').classList.add('hidden');$('#quiz').classList.remove('hidden');show()};
function show(){if(window.speechSynthesis)speechSynthesis.cancel();const q=chosen[idx];$('#meta').textContent=`第 ${idx+1} / ${chosen.length} 題｜原題 ${q.id}`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=`${idx/chosen.length*100}%`;$('#stem').textContent=KIND==='mcq'?q.stem:q.prompt;const pic=$('#picture');if(q.image){pic.src=q.image;pic.classList.remove('hidden')}else{pic.classList.add('hidden');pic.removeAttribute('src')};if(KIND==='mcq'){$('#area').className='options';$('#area').innerHTML=q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b><span>${esc(o)}</span></label>`).join('')}else{$('#area').className='answer-grid';$('#area').innerHTML=q.answers.map((a,i)=>`<div class="answer-row"><label>空格 ${i+1}</label><input class="answer-input" data-i="${i}" autocomplete="off" spellcheck="false" placeholder="請輸入答案"></div>`).join('')};$('#feedback').className='feedback hidden';$('#voicebox').classList.add('hidden');$('#check').classList.remove('hidden');$('#next').classList.add('hidden')}
function remember(q,value){if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(value);$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
function spoken(q){return q.full||((KIND==='mcq')?q.stem.replace(/^\(\s*\)\s*/,'').replace(/_{3,}/,q.options[q.answer]):q.answers.map(a=>a.accepted[0]).join(' '))}
function speak(){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(spoken(chosen[idx]));u.lang='en-US';u.rate=.88;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/^en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;speechSynthesis.speak(u)}
function success(q){correct.add(q.id);$('#bar').style.width=`${(idx+1)/chosen.length*100}%`;$('#feedback').className='feedback ok';$('#feedback').innerHTML='✅ 全部正確！<br>'+esc(q.explanation||'');$('#target').textContent=spoken(q);$('#voicebox').classList.remove('hidden');$('#check').classList.add('hidden');$('#next').classList.remove('hidden');speak()}
$('#check').onclick=()=>{const q=chosen[idx];attempted.add(q.id);if(KIND==='mcq'){const sel=document.querySelector('input[name=answer]:checked');if(!sel)return alert('請先選擇答案。');const n=+sel.value;if(n===q.answer)return success(q);remember(q,String.fromCharCode(65+n)+'. '+q.options[n]);$('#feedback').className='feedback bad';$('#feedback').innerHTML=`❌ 答錯了。正確答案：<strong>${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</strong><br>${esc(q.explanation||'')}<br>請重新選擇正確答案。`;return}const ins=[...document.querySelectorAll('.answer-input')];if(ins.some(x=>!x.value.trim()))return alert('請完成所有答案。');const bad=[];ins.forEach((input,i)=>{const a=q.answers[i];input.classList.remove('ok','bad');if(a.accepted.some(x=>norm(x)===norm(input.value))){input.classList.add('ok');input.disabled=true}else{input.classList.add('bad');bad.push(`${i+1}. ${input.value} → ${a.display}`);input.value=''}});if(!bad.length)return success(q);remember(q,bad.join('；'));$('#feedback').className='feedback bad';$('#feedback').innerHTML=`❌ 有 ${bad.length} 格不正確。<br>正確答案：${q.answers.map((a,i)=>`${i+1}. <strong>${esc(a.display)}</strong>`).join('；')}<br>${esc(q.explanation||'')}<br>請依提示重新填寫。`;ins.find(x=>!x.disabled)?.focus()};
$('#speak').onclick=speak;$('#next').onclick=()=>{idx++;idx>=chosen.length?finish():show()};$('#finish').onclick=finish;
function answerText(q){return KIND==='mcq'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.answerRaw}
function finish(){if(window.speechSynthesis)speechSynthesis.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');$('#summary').innerHTML=`<div class="stat">選擇題數<b>${chosen.length}</b></div><div class="stat">已作答<b>${attempted.size}</b></div><div class="stat">完成答對<b>${correct.size}</b></div><div class="stat">曾答錯<b>${wrong.size}</b></div>`;$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>`<div class="wrong"><b>${i+1}. 原題 ${r.q.id}｜${esc(preview(r.q))}</b><p>錯誤紀錄：${r.attempts.map(esc).join('<br>')}</p><p><strong>正確答案：</strong>${esc(answerText(r.q))}</p><p>${esc(r.q.explanation||'')}</p></div>`).join(''):'<div class="feedback ok">🎉 沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size)}
$('#restart').onclick=()=>location.reload();$('#download').onclick=async()=>{if(!wrong.size)return;const rows=[...wrong.values()],stamp=new Date().toISOString().slice(0,10),name=TITLE.replace(/\s+/g,'_')+'_錯題_'+stamp;const save=(blob,ext)=>{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name+ext;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};try{const{Document,Packer,Paragraph,TextRun,HeadingLevel}=await import('https://esm.sh/docx@9.5.1');const children=[new Paragraph({heading:HeadingLevel.TITLE,children:[new TextRun({text:TITLE+' 錯題紀錄',bold:true})]})];rows.forEach((r,i)=>{children.push(new Paragraph({heading:HeadingLevel.HEADING_2,children:[new TextRun({text:`${i+1}. 原題 ${r.q.id}`,bold:true})]}),new Paragraph({text:preview(r.q)}),new Paragraph({children:[new TextRun({text:'錯誤紀錄：',bold:true}),new TextRun({text:r.attempts.join(' | ')})]}),new Paragraph({children:[new TextRun({text:'正確答案：',bold:true}),new TextRun({text:answerText(r.q)})]}),new Paragraph({children:[new TextRun({text:'解析：',bold:true}),new TextRun({text:r.q.explanation||''})]}))});save(await Packer.toBlob(new Document({sections:[{children}]})),'.docx')}catch(e){save(new Blob([TITLE+' 錯題紀錄\n\n'+rows.map(r=>preview(r.q)+'\n正確答案：'+answerText(r.q)+'\n').join('\n')],{type:'text/plain;charset=utf-8'}),'.txt')}};
renderList();
</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
