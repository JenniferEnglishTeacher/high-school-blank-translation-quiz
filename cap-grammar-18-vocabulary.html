<script>window.QUIZ_CONFIG={"title": "國中會考文法歷屆試題｜詞彙題", "mode": "mcq", "questions": [{"id": 1, "question": "Sam: Sorry, I'm late.\nBen: Here you are! I waited for you for one hour and ______ you wouldn't come.", "options": ["forgot", "found", "noticed", "thought"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜thought + 子句「原本以為」(搭配 would)", "explanation": "【句型】S + thought (that) + S + would/wouldn't + V:「(當時)以為…會/不會…」。\n【分析】Ben 等了一小時,當時「以為」Sam 不會來了,後面 you wouldn't come 是當時的猜想 → thought。\n【其他選項】(A) forgot「忘記」+ 子句語意不合;(B) found「發現」表事實,但 Sam 最後還是來了;(C) noticed「注意到」也表事實,與 Sam 已到不合。\n【例句】I thought you wouldn't be able to finish it today.\n備註：參考解答(4f68a85b.txt)為改編版(雙空格 thought; wouldn't);截圖原題為單空格動詞選擇,答案 D thought 一致。本題主要考動詞語意判斷,故建議歸入詞彙題。", "explanationSource": "source"}, {"id": 2, "question": "Mom: You're home early!\nKen: The meeting was canceled. I ______ it would take all afternoon.", "options": ["thought", "found", "forgot", "noticed"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 1 題）", "explanation": "原本以為會很久(結果沒有)→ thought。", "explanationSource": "supplemental"}, {"id": 3, "question": "I ______ the test would be hard, but it was easier than I expected.", "options": ["noticed", "forgot", "thought", "found"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 1 題）", "explanation": "原本以為難,實際上簡單 → thought。", "explanationSource": "supplemental"}, {"id": 4, "question": "When I opened the box, I ______ that the cup inside was broken.", "options": ["thought", "forgot", "wondered", "found"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 1 題）", "explanation": "打開箱子「發現」杯子破了(事實)→ found。", "explanationSource": "supplemental"}, {"id": 5, "question": "The little girl was ______ by a truck on her way home and was badly hurt.", "options": ["hit", "led", "lost", "paid"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜被動句中的動詞詞彙 be hit by", "explanation": "【句型】be hit by + 交通工具「被…撞到」。\n【分析】選項皆為 p.p.，考字義：被卡車「撞」到才會 badly hurt（受重傷）→ hit。\n【其他選項】(B) led 被帶領；(C) lost 被弄丟；(D) paid 被付錢，皆與 by a truck、受傷語意不合。\n【例句】The dog was hit by a car, but it's OK now.\n備註：四個選項皆為被動 p.p.，實際考的是動詞字義。", "explanationSource": "source"}, {"id": 6, "question": "The boy was ______ by a dog while he was walking in the park. His leg was bleeding.", "options": ["bitten", "bought", "built", "borrowed"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 5 題）", "explanation": "被狗「咬」才會流血，bite 的 p.p. 為 bitten。", "explanationSource": "supplemental"}, {"id": 7, "question": "The thief was ______ by the police when he was running out of the store.", "options": ["taught", "caught", "brought", "thought"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 5 題）", "explanation": "小偷被警察「抓到」→ caught。", "explanationSource": "supplemental"}, {"id": 8, "question": "Many houses were ______ by the strong typhoon last summer.", "options": ["planted", "invited", "destroyed", "followed"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 5 題）", "explanation": "房子被強颱「摧毀」→ destroyed。", "explanationSource": "supplemental"}, {"id": 9, "question": "John: What's wrong with Wendy?\nJean: Her knees hurt. She was ______ by a motorcycle this afternoon.\nJohn: Oh, that's too bad!", "options": ["caught", "hit", "killed", "saved"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜被動句中的動詞詞彙 be hit by", "explanation": "【句型】be hit by + 交通工具「被…撞到」。\n【分析】Her knees hurt 膝蓋受傷，且還能對話 → 被機車「撞到」hit。\n【其他選項】(A) caught 被抓住；(C) killed 被撞死，與膝蓋痛、還活著不合；(D) saved 被救，與受傷不合，且 That's too bad 表示壞事。\n【例句】My uncle was hit by a bike when he was crossing the street.\n備註：四個選項皆為被動 p.p.，實際考的是動詞字義。", "explanationSource": "source"}, {"id": 10, "question": "Henry: Why is Jane crying?\nAmy: She was ______ by a bee in the garden.", "options": ["stung", "sung", "sold", "shown"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 9 題）", "explanation": "被蜜蜂「螫」→ stung（sting 的 p.p.）。", "explanationSource": "supplemental"}, {"id": 11, "question": "The window was ______ by a baseball, and now there's glass all over the floor.", "options": ["cleaned", "opened", "closed", "broken"], "answer": 3, "answerLabel": "D", "source": "類似題 2（對應第 9 題）", "explanation": "地上都是玻璃，窗戶被棒球「打破」→ broken。", "explanationSource": "supplemental"}, {"id": 12, "question": "Ben was ______ in a car accident, but luckily he wasn't seriously hurt.", "options": ["invited", "included", "injured", "excited"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 9 題）", "explanation": "在車禍中「受傷」→ be injured。", "explanationSource": "supplemental"}, {"id": 13, "question": "Jean is crazy about the color purple. The walls of her house are all ______ purple.", "options": ["built", "dug", "painted", "shown"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜被動句中的動詞詞彙 be painted", "explanation": "【句型】S + be painted + 顏色「被漆成…色」。\n【分析】Jean 很喜歡紫色，所以牆壁都被「漆」成紫色 → painted。\n【其他選項】(A) built 被建造；(B) dug 被挖；(D) shown 被展示，後面都不能直接接顏色。\n【例句】The door was painted red last year.\n備註：四個選項皆為被動 p.p.，實際考的是動詞字義。", "explanationSource": "source"}, {"id": 14, "question": "The old house was ______ more than 100 years ago, but it still looks strong.", "options": ["built", "drawn", "grown", "cooked"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 13 題）", "explanation": "房子「被建造」→ built。", "explanationSource": "supplemental"}, {"id": 15, "question": "The letters were ______ in English, so Grandma couldn't read them.", "options": ["spoken", "written", "painted", "sung"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 13 題）", "explanation": "信是用英文「寫」的 → written。", "explanationSource": "supplemental"}, {"id": 16, "question": "The gift was ______ in beautiful paper with a red ribbon.", "options": ["hidden", "dropped", "washed", "wrapped"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 13 題）", "explanation": "禮物被漂亮的紙「包裝」→ wrapped。", "explanationSource": "supplemental"}, {"id": 17, "question": "Ms. Wang thought she lost her ring last night. But this morning she found that it was on the table and was ______ by a book.", "options": ["covered", "moved", "packed", "stopped"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜被動句中的動詞詞彙 be covered by", "explanation": "【句型】be covered by/with「被…蓋住」。\n【分析】戒指其實在桌上，只是「被書蓋住」才以為弄丟了 → covered。\n【其他選項】(B) moved 被移動，與 on the table 找到的情境不合；(C) packed 被打包；(D) stopped 被阻止，皆不合語意。\n【例句】The ground was covered with snow.\n備註：四個選項皆為被動 p.p.，實際考的是動詞字義。", "explanationSource": "source"}, {"id": 18, "question": "The mountain was ______ with snow, so everything looked white.", "options": ["filled", "covered", "made", "moved"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 17 題）", "explanation": "山「被雪覆蓋」→ be covered with。", "explanationSource": "supplemental"}, {"id": 19, "question": "The bottle was ______ with water, so it was very heavy.", "options": ["filled", "covered", "dressed", "mixed"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 17 題）", "explanation": "瓶子「裝滿」水 → be filled with。", "explanationSource": "supplemental"}, {"id": 20, "question": "My keys were ______ under the sofa, so I couldn't find them all morning.", "options": ["heard", "hurt", "hidden", "hit"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 17 題）", "explanation": "鑰匙「被藏／落」在沙發下所以找不到 → hidden。", "explanationSource": "supplemental"}, {"id": 21, "question": "Jessie felt sad because she was not ______ to the party. She really wanted to go.", "options": ["invited", "scared", "followed", "impressed"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜被動句中的動詞詞彙 be invited to", "explanation": "【句型】be invited to + 活動「被邀請參加…」。\n【分析】她很想去卻很難過 → 因為沒有「被邀請」去派對 → invited。\n【其他選項】(B) scared 害怕；(C) followed 被跟隨；(D) impressed 印象深刻，皆不合語意。\n【例句】All the students were invited to the school concert.\n備註：四個選項皆為被動 p.p.，實際考的是動詞字義。", "explanationSource": "source"}, {"id": 22, "question": "Dan was ______ to join the school team because he runs very fast.", "options": ["worried", "chosen", "bored", "closed"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 21 題）", "explanation": "跑得快所以「被選中」加入校隊 → chosen。", "explanationSource": "supplemental"}, {"id": 23, "question": "The students were ______ by the teacher for being late again.", "options": ["praised", "thanked", "blamed", "welcomed"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 21 題）", "explanation": "又遲到所以「被責備」→ blamed。", "explanationSource": "supplemental"}, {"id": 24, "question": "The new student was warmly ______ by everyone in the class on her first day.", "options": ["punished", "forgotten", "laughed", "welcomed"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 21 題）", "explanation": "新同學第一天受到熱情「歡迎」→ welcomed。", "explanationSource": "supplemental"}, {"id": 25, "question": "It is hard for trees to ______ along this beach because of the strong winds from the sea.", "options": ["blow", "build", "follow", "grow"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜動詞詞彙 grow", "explanation": "【句型】It is + adj. + for 人/物 + to V；本題考動詞字義：grow 生長。\n【分析】主詞是 trees，又提到 because of the strong winds「因為海上強風」，所以樹木很難在海邊「生長」，grow 最合理。\n【其他選項】(A) blow 吹（樹不會吹）；(B) build 建造；(C) follow 跟隨，都不符合語意。\n【例句】Rice grows well in warm and wet places.", "explanationSource": "source"}, {"id": 26, "question": "These flowers need a lot of sun to ______ well. Please put them by the window.", "options": ["grow", "cook", "throw", "sell"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 25 題）", "explanation": "花需要陽光才能「生長」，用 grow。", "explanationSource": "supplemental"}, {"id": 27, "question": "The wind ______ so hard last night that many trees fell down.", "options": ["built", "blew", "grew", "followed"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 25 題）", "explanation": "風「吹」得很強，用 blow 的過去式 blew。", "explanationSource": "supplemental"}, {"id": 28, "question": "It took the workers two years to ______ the new library.", "options": ["follow", "blow", "build", "grow"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 25 題）", "explanation": "工人花兩年「建造」圖書館，用 build。", "explanationSource": "supplemental"}, {"id": 29, "question": "It is ______ to sell fake CDs and watches. You will be caught by the police.", "options": ["illegal", "important", "convenient", "comfortable"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜形容詞詞彙 illegal", "explanation": "【句型】It is + adj. + to V（虛主詞 it 代替後面的不定詞）；考形容詞字義 illegal 違法的。\n【分析】後句 You will be caught by the police「你會被警察抓」，可知賣假 CD 和手錶是「違法的」，用 illegal。\n【其他選項】(B) important 重要的；(C) convenient 方便的；(D) comfortable 舒服的，都與「被警察抓」無關。\n【例句】It is illegal to ride a scooter without a license.", "explanationSource": "source"}, {"id": 30, "question": "It is ______ to drive after drinking. Many people get hurt because of it.", "options": ["comfortable", "dangerous", "convenient", "popular"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 29 題）", "explanation": "酒後開車會讓人受傷，是「危險的」dangerous。", "explanationSource": "supplemental"}, {"id": 31, "question": "In Taiwan, it is ______ to smoke in restaurants. You may have to pay a lot of money.", "options": ["important", "comfortable", "illegal", "convenient"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 29 題）", "explanation": "會被罰錢，表示在餐廳抽菸是「違法的」illegal。", "explanationSource": "supplemental"}, {"id": 32, "question": "It is ______ to drink enough water every day. It keeps you healthy.", "options": ["important", "illegal", "terrible", "boring"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 29 題）", "explanation": "喝足夠的水讓你健康，是「重要的」important。", "explanationSource": "supplemental"}, {"id": 33, "question": "It is ______ for me to go to work by bus. My office is very near the bus stop.", "options": ["convenient", "dangerous", "difficult", "special"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜形容詞詞彙 convenient", "explanation": "【句型】It is + adj. + for 人 + to V；考形容詞字義 convenient 方便的。\n【分析】後句說 My office is very near the bus stop「辦公室離公車站很近」，所以搭公車上班很「方便」，用 convenient。\n【其他選項】(B) dangerous 危險的；(C) difficult 困難的，與「很近」的線索矛盾；(D) special 特別的，語意不合。\n【例句】It is convenient to live near an MRT station.", "explanationSource": "source"}, {"id": 34, "question": "It is ______ for Grandma to go shopping now. There is a supermarket right next to her house.", "options": ["difficult", "convenient", "dangerous", "boring"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 33 題）", "explanation": "超市就在隔壁，購物很「方便」。", "explanationSource": "supplemental"}, {"id": 35, "question": "It is ______ for kids to play near the busy road. Cars drive very fast there.", "options": ["dangerous", "convenient", "special", "healthy"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 33 題）", "explanation": "車子開很快，在路邊玩很「危險」。", "explanationSource": "supplemental"}, {"id": 36, "question": "It was ______ for Tim to read the small words without his glasses.", "options": ["convenient", "special", "difficult", "careful"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 33 題）", "explanation": "沒戴眼鏡看小字很「困難」。", "explanationSource": "supplemental"}, {"id": 37, "question": "There are more and more cars in our city, so ______ has become a serious problem.", "options": ["jumping", "learning", "parking", "smoking"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜動名詞詞彙 parking", "explanation": "【句型】Ving 當主詞；考字義 parking 停車。\n【分析】前句 There are more and more cars「車子越來越多」，所以「停車」變成嚴重的問題，用 parking。\n【其他選項】(A) jumping 跳；(B) learning 學習；(D) smoking 抽菸，都與「車子多」沒有因果關係。\n【例句】Parking near the night market is not easy.", "explanationSource": "source"}, {"id": 38, "question": "More and more people use cellphones in bed, so ______ problems are getting serious.", "options": ["parking", "sleeping", "cooking", "dancing"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 37 題）", "explanation": "睡前用手機造成「睡眠」問題。", "explanationSource": "supplemental"}, {"id": 39, "question": "The road is full of cars in the morning, so ______ to work takes a long time.", "options": ["driving", "jumping", "smoking", "parking"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 37 題）", "explanation": "車多導致「開車」上班很久。", "explanationSource": "supplemental"}, {"id": 40, "question": "______ is not allowed in this building. Please put out your cigarette.", "options": ["Parking", "Swimming", "Smoking", "Learning"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 37 題）", "explanation": "put out your cigarette 表示「抽菸」是禁止的。", "explanationSource": "supplemental"}, {"id": 41, "question": "It's great that we can buy train tickets over the phone without going out. It ______ us a lot of time.", "options": ["lends", "prepares", "saves", "takes"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜save + 人 + 時間（為某人節省時間）", "explanation": "【句型】save + 人 + 時間／金錢（為某人省下時間／錢）。\n【分析】前句說「不用出門就能用電話買車票」，所以是「替我們省下很多時間」，選 saves。\n【其他選項】(A) lends 借出，語意不合；(B) prepares 準備，不能接「人＋時間」；(D) takes 花費（It takes us time to V），與「不用出門很方便」語意相反，且後面缺 to V。\n【例句】Riding the MRT saves me twenty minutes every day.", "explanationSource": "source"}, {"id": 42, "question": "Online shopping is convenient. It ______ people the trouble of going to the store.", "options": ["spends", "saves", "costs", "borrows"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 41 題）", "explanation": "save sb the trouble 替某人省去麻煩，符合「方便」的語意。", "explanationSource": "supplemental"}, {"id": 43, "question": "Taking the High Speed Rail ______ us two hours. We got to Kaohsiung before lunch.", "options": ["saved", "lent", "paid", "spent"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 41 題）", "explanation": "save + 人 + 時間 表示幫某人省下時間；spent 主詞須為人。", "explanationSource": "supplemental"}, {"id": 44, "question": "The new road is very long and full of traffic lights. It ______ me more time to get to school now.", "options": ["saves", "spends", "takes", "pays"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 41 題）", "explanation": "It takes + 人 + 時間 + to V 表示花費時間；路變遠所以花更多時間。", "explanationSource": "supplemental"}, {"id": 45, "question": "Joyce tells her brother everything. She never ______ anything from him.", "options": ["covers", "believes", "hides", "takes"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜hide sth from sb（對某人隱瞞某事）", "explanation": "【句型】hide + 事物 + from + 人（對某人隱藏／隱瞞某事）。\n【分析】前句「Joyce 什麼都告訴哥哥」，所以「她從不對他隱瞞任何事」，選 hides。\n【其他選項】(A) covers 覆蓋，不搭配 from 人表隱瞞；(B) believes 相信，語意不合；(D) takes anything from him 是「從他那裡拿東西」，與前句不呼應。\n【例句】Tom hid the broken cup from his mom.\n備註：此題考動詞詞彙，非 spend/cost/take 等特殊動詞句型。", "explanationSource": "source"}, {"id": 46, "question": "Kelly and Ann are best friends. They never ______ secrets from each other.", "options": ["hide", "borrow", "believe", "find"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 45 題）", "explanation": "hide sth from sb 對某人隱瞞，符合「好朋友」的語意。", "explanationSource": "supplemental"}, {"id": 47, "question": "The boy ______ his bad test score from his parents, but they found out later.", "options": ["showed", "told", "hid", "gave"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 45 題）", "explanation": "後句「但父母後來發現了」，表示他原本隱瞞，選 hid。", "explanationSource": "supplemental"}, {"id": 48, "question": "Sam is honest. He always ______ his teacher the truth.", "options": ["hides", "tells", "says", "speaks"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 45 題）", "explanation": "tell + 人 + the truth 告訴某人實話；say / speak 不接人當間接受詞。", "explanationSource": "supplemental"}, {"id": 49, "question": "There are online videos that teach you exercises you can do at home. They'll ______ you a trip to the gym, and some money too.", "options": ["cost", "give", "keep", "save"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜save + 人 + 事物（替某人省下）", "explanation": "【句型】save + 人 + 事物（替某人省下某事物，如時間、錢、一趟路）。\n【分析】在家看影片就能運動，所以「替你省下跑健身房的一趟路，也省錢」，選 save。\n【其他選項】(A) cost 花費，語意相反；(B) give you a trip 給你一趟旅程，不合；(C) keep 保留，不接「人＋事物」表此意。\n【例句】Cooking at home saves us a lot of money.", "explanationSource": "source"}, {"id": 50, "question": "Doing your homework at school will ______ you a lot of time at night.", "options": ["cost", "save", "spend", "lend"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 49 題）", "explanation": "save + 人 + 時間 替某人省下時間。", "explanationSource": "supplemental"}, {"id": 51, "question": "Buying things online can ______ you a trip to the mall.", "options": ["save", "take", "pay", "borrow"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 49 題）", "explanation": "save you a trip 替你省下跑一趟。", "explanationSource": "supplemental"}, {"id": 52, "question": "Taking a taxi will ______ you more money than taking the MRT.", "options": ["save", "spend", "cost", "pay"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 49 題）", "explanation": "事物 + cost + 人 + 金錢，搭計程車花較多錢。", "explanationSource": "supplemental"}, {"id": 53, "question": "\"Bad traffic\" is perhaps the ______ excuse for being late when your boss knows it only takes you five minutes to walk to work.", "options": ["easiest", "oldest", "smartest", "worst"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜最高級形容詞語意 worst", "explanation": "【句型】the + 最高級形容詞 + N；本題考形容詞語意判斷。\n【分析】走路上班只要五分鐘，用「塞車」當遲到藉口最站不住腳 → the worst excuse（最糟的藉口）。\n【其他選項】(A) easiest 最容易的、(B) oldest 最老舊的、(C) smartest 最聰明的，皆與「老闆知道你走路五分鐘就到」的語意不符。\n【例句】That was the worst movie I have ever seen.", "explanationSource": "source"}, {"id": 54, "question": "Leo forgot his mom's birthday again. That was the ______ thing he did this year.", "options": ["worst", "best", "kindest", "happiest"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 53 題）", "explanation": "忘記媽媽生日 → 最糟的事 → worst。", "explanationSource": "supplemental"}, {"id": 55, "question": "Lisa got 100 on every test. She is the ______ student in our class.", "options": ["laziest", "best", "worst", "busiest"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 53 題）", "explanation": "每次考一百分 → 最優秀 → best。", "explanationSource": "supplemental"}, {"id": 56, "question": "Winter is the ______ season in Hehuan Mountain; it sometimes snows there.", "options": ["hottest", "wettest", "coldest", "driest"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 53 題）", "explanation": "會下雪 → 最冷的季節 → coldest。", "explanationSource": "supplemental"}, {"id": 57, "question": "It is ______ to go out on a typhoon day. The sky is dark and the wind is strong.", "options": ["careful", "fashionable", "dangerous", "convenient"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜形容詞語意 dangerous", "explanation": "【句型】It is + adj. + to V（做……是……的）；本題考形容詞語意。\n【分析】颱風天天色暗、風很強 → 出門「很危險」→ dangerous。\n【其他選項】(A) careful 小心的，形容人，It is careful to… 不合；(B) fashionable 時髦的；(D) convenient 方便的；皆與颱風天語意不符。\n【例句】It is dangerous to swim in the river after heavy rain.", "explanationSource": "source"}, {"id": 58, "question": "It is ______ to ride a bike at night without lights.", "options": ["safe", "dangerous", "healthy", "cheap"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 57 題）", "explanation": "夜間騎車無燈 → 危險。", "explanationSource": "supplemental"}, {"id": 59, "question": "It is ______ to live near an MRT station. You can go anywhere quickly.", "options": ["convenient", "noisy", "careful", "lonely"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 57 題）", "explanation": "到哪都很快 → 方便 → convenient。", "explanationSource": "supplemental"}, {"id": 60, "question": "Please be ______ when you cross the street.", "options": ["dangerous", "famous", "careful", "popular"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 57 題）", "explanation": "過馬路要小心 → careful（形容人）。", "explanationSource": "supplemental"}, {"id": 61, "question": "With the new bus line, it is much more ______ for Fanny to go to school. It saves her a lot of time now.", "options": ["useful", "possible", "interesting", "convenient"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜形容詞語意 convenient", "explanation": "【句型】it is + adj. + for sb. + to V；much + 比較級；本題考形容詞語意。\n【分析】新公車路線「幫她省很多時間」→ 上學更「方便」→ convenient。\n【其他選項】(A) useful 有用的，通常形容物品，it is useful for her to go to school 語意怪；(B) possible 可能的，much more possible 不自然；(C) interesting 有趣的，與省時無關。\n【例句】It is convenient to buy snacks at a convenience store.", "explanationSource": "source"}, {"id": 62, "question": "My home is next to the MRT station, so it is very ______ for me to go downtown.", "options": ["convenient", "dangerous", "careful", "lonely"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 61 題）", "explanation": "住捷運旁 → 進城很方便。", "explanationSource": "supplemental"}, {"id": 63, "question": "A dictionary is very ______ when you learn new words.", "options": ["lucky", "useful", "honest", "sleepy"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 61 題）", "explanation": "字典學單字「有用」→ useful。", "explanationSource": "supplemental"}, {"id": 64, "question": "Is it ______ for you to finish the report by tomorrow?", "options": ["famous", "friendly", "possible", "honest"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 61 題）", "explanation": "問「是否可能」明天前完成 → possible。", "explanationSource": "supplemental"}, {"id": 65, "question": "The knife doesn't cut very well. It's not as ______ as before.", "options": ["bright", "heavy", "quick", "sharp"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜as + 形容詞原級 + as；sharp 語意", "explanation": "【句型】not as + 形容詞原級 + as =「不如……」；本題考形容詞語意。\n【分析】刀子切不好 → 不像以前那麼「鋒利」→ sharp。\n【其他選項】(A) bright 明亮的；(B) heavy 重的；(C) quick 快速的；皆與「切不好」無直接因果。\n【例句】My pencil isn't as sharp as yours.", "explanationSource": "source"}, {"id": 66, "question": "This street is not as ______ as before. Many shops have closed.", "options": ["busy", "sharp", "honest", "careful"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 65 題）", "explanation": "很多店關了 → 不像以前熱鬧 → busy。", "explanationSource": "supplemental"}, {"id": 67, "question": "You need a ______ knife to cut the beef.", "options": ["sharp", "bright", "soft", "quiet"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 65 題）", "explanation": "切牛肉需要鋒利的刀 → sharp。", "explanationSource": "supplemental"}, {"id": 68, "question": "My old phone is not as ______ as my new one. It takes a long time to open an app.", "options": ["heavy", "fast", "dark", "cheap"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 65 題）", "explanation": "開 app 很慢 → 不如新手機快 → fast。", "explanationSource": "supplemental"}, {"id": 69, "question": "After winning money in the card game, Jay decided to try again. He felt that he might also be ______ a second time.", "options": ["famous", "interested", "lucky", "ready"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜形容詞語意 lucky", "explanation": "【句型】be + 形容詞；本題考形容詞語意，lucky = 幸運的。\n【分析】玩牌贏了錢想再試一次 → 覺得第二次可能也會「幸運」→ lucky。\n【其他選項】(A) famous 有名的；(B) interested 感興趣的（需接 in）；(D) ready 準備好的；與「再贏一次」的語意不符。\n【例句】You are lucky to have such a nice teacher.", "explanationSource": "source"}, {"id": 70, "question": "Ella found a NT$1,000 bill on the street. What a ______ day!", "options": ["lucky", "boring", "sad", "busy"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 69 題）", "explanation": "撿到錢 → 幸運的一天。", "explanationSource": "supplemental"}, {"id": 71, "question": "Are you ______ for the test tomorrow?", "options": ["lucky", "ready", "famous", "honest"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 69 題）", "explanation": "準備好考試了嗎 → ready for。", "explanationSource": "supplemental"}, {"id": 72, "question": "Andy is very ______ in science. He reads science books every night.", "options": ["interesting", "famous", "interested", "lucky"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 69 題）", "explanation": "be interested in = 對……感興趣。", "explanationSource": "supplemental"}, {"id": 73, "question": "In the past, people thought it was a ______ idea to send e-mails and read news online, but now it is part of our everyday life.", "options": ["simple", "popular", "good", "fresh"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜形容詞語意 fresh（新穎的）", "explanation": "【句型】a + adj. + idea；fresh idea =「新奇、新穎的想法」；本題考形容詞語意。\n【分析】In the past … but now it is part of our everyday life → 以前覺得是「新鮮」的點子，現在已是日常 → fresh。\n【其他選項】(A) simple 簡單的、(B) popular 受歡迎的、(C) good 好的，都無法與「但現在已成日常」形成對比。\n【例句】Using robots to teach English is a fresh idea.", "explanationSource": "source"}, {"id": 74, "question": "Ten years ago, paying with a cell phone was a ______ idea, but now everyone does it.", "options": ["fresh", "boring", "usual", "old"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 73 題）", "explanation": "以前新奇、現在普遍 → fresh。", "explanationSource": "supplemental"}, {"id": 75, "question": "The fish is ______. It was caught this morning.", "options": ["fresh", "dark", "sharp", "honest"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 73 題）", "explanation": "今早剛捕的魚 → 新鮮。", "explanationSource": "supplemental"}, {"id": 76, "question": "Bubble tea is very ______ in Taiwan. You can find it on almost every street.", "options": ["lonely", "popular", "careful", "quiet"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 73 題）", "explanation": "到處都有 → 很受歡迎 → popular。", "explanationSource": "supplemental"}, {"id": 77, "question": "The paint on the wall is not as ______ as it was ten years ago. It has changed from white to gray.", "options": ["bright", "heavy", "sure", "young"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜not as + 形容詞 + as；bright 語意", "explanation": "【句型】not as + 形容詞原級 + as；本題考形容詞語意，bright = 明亮的（顏色鮮亮）。\n【分析】牆漆由白變灰 → 不像十年前那樣「明亮」→ bright。\n【其他選項】(B) heavy 重的；(C) sure 確定的，形容人；(D) young 年輕的，形容人或生物；皆不合油漆顏色。\n【例句】The sun is very bright today.", "explanationSource": "source"}, {"id": 78, "question": "Turn on the light. The room is not ______ enough for reading.", "options": ["bright", "heavy", "sharp", "loud"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 77 題）", "explanation": "房間不夠亮 → bright。", "explanationSource": "supplemental"}, {"id": 79, "question": "My grandfather is eighty, but he still feels ______.", "options": ["bright", "young", "sure", "sharp"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 77 題）", "explanation": "八十歲仍覺得年輕 → young。", "explanationSource": "supplemental"}, {"id": 80, "question": "This box is too ______ for me to carry. Can you help me?", "options": ["heavy", "bright", "young", "sure"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 77 題）", "explanation": "搬不動 → 太重 → heavy。", "explanationSource": "supplemental"}, {"id": 81, "question": "You've had the same food for breakfast for one week. Do you want something ______ for a change?", "options": ["bright", "different", "helpful", "round"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜something + 形容詞；different 語意", "explanation": "【句型】something / anything / nothing + 形容詞（形容詞放後面）；本題考形容詞語意。\n【分析】同樣早餐吃了一週 → for a change（換換口味）→ 想要「不一樣的」東西 → different。\n【其他選項】(A) bright 明亮的；(C) helpful 有幫助的；(D) round 圓的；皆與 the same / for a change 的對比無關。\n【例句】Let's do something different this weekend.", "explanationSource": "source"}, {"id": 82, "question": "Your idea is ______ from mine, but I think both are good.", "options": ["same", "different", "helpful", "bright"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 81 題）", "explanation": "be different from = 與……不同。", "explanationSource": "supplemental"}, {"id": 83, "question": "Is there anything ______ in today's newspaper?", "options": ["interesting", "interest", "interested", "interestingly"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 81 題）", "explanation": "anything + 形容詞（後置）；形容事物「有趣的」→ interesting。", "explanationSource": "supplemental"}, {"id": 84, "question": "My twin brother and I look the ______, but we like different things.", "options": ["different", "same", "round", "similar"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 81 題）", "explanation": "look the same = 看起來一樣。", "explanationSource": "supplemental"}, {"id": 85, "question": "Ms. Lee is a(n) ______ businesswoman. Just now in her shop, she gave me back the wallet I left on the table last week.", "options": ["famous", "honest", "important", "smart"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜形容詞語意 honest", "explanation": "【句型】a(n) + adj. + N；本題考形容詞語意，honest = 誠實的。\n【分析】她把我上週遺留的錢包還給我 → 她是「誠實的」商人 → an honest businesswoman。\n【其他選項】(A) famous 有名的、(C) important 重要的、(D) smart 聰明的，都無法由「歸還錢包」推知。\n【例句】Please be honest and tell me the truth.", "explanationSource": "source"}, {"id": 86, "question": "Tina always tells the truth. She is an ______ girl.", "options": ["honest", "angry", "awful", "empty"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 85 題）", "explanation": "總說實話 → honest。", "explanationSource": "supplemental"}, {"id": 87, "question": "Andy can solve any math problem in one minute. He is really ______.", "options": ["honest", "smart", "lazy", "shy"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 85 題）", "explanation": "一分鐘解數學題 → 聰明 → smart。", "explanationSource": "supplemental"}, {"id": 88, "question": "Jay Chou is a ______ singer. Almost everyone in Taiwan knows him.", "options": ["shy", "honest", "famous", "lazy"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 85 題）", "explanation": "大家都認識 → 有名的 → famous。", "explanationSource": "supplemental"}, {"id": 89, "question": "I can't believe you ate the ______ piece of pizza and didn't even leave one bite for me.", "options": ["last", "least", "less", "most"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜last（最後的）vs. least", "explanation": "【句型】the last + 單數名詞 =「最後一個……」。\n【分析】didn't even leave one bite for me（連一口都沒留）→ 你吃了「最後一片」披薩 → the last piece。\n【其他選項】(B) the least 最少的，修飾不可數名詞或表程度，the least piece 不通；(C) less 為比較級，不與 the…piece 搭配；(D) the most 最多的，piece 為單數，不合。\n【例句】Kevin was the last person to leave the classroom.", "explanationSource": "source"}, {"id": 90, "question": "December is the ______ month of the year.", "options": ["least", "last", "latest", "less"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 89 題）", "explanation": "一年的最後一個月 → last。", "explanationSource": "supplemental"}, {"id": 91, "question": "Who drank the ______ bottle of milk? I wanted it for breakfast.", "options": ["last", "least", "less", "most"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 89 題）", "explanation": "最後一瓶 → last。", "explanationSource": "supplemental"}, {"id": 92, "question": "Of the three boys, Ray spends the ______ money. He always saves it.", "options": ["last", "least", "less", "latter"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 89 題）", "explanation": "money 不可數 + 三者中最少 → the least。", "explanationSource": "supplemental"}, {"id": 93, "question": "The ______ is so strong today that my hair keeps blowing in the air.", "options": ["rain", "snow", "sun", "wind"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜名詞詞義 wind（so…that 句意線索）", "explanation": "【句型】so ＋ adj. ＋ that 子句：如此…以致於…\n【分析】that 子句說「頭髮一直在空中飄」，可知是「風」太強，用 wind。\n【其他選項】(A) rain 雨；(B) snow 雪；(C) sun 太陽，都不會讓頭髮飄起來。\n【例句】The rain was so heavy that we couldn't see the road.\n備註：空格考名詞詞義，so…that 僅為句意線索，建議歸「詞彙題」。", "explanationSource": "source"}, {"id": 94, "question": "The ______ is so hot today that the ice cream melted in a minute.", "options": ["moon", "sun", "cloud", "wind"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 93 題）", "explanation": "冰淇淋一下就融化，是「太陽」很熱。", "explanationSource": "supplemental"}, {"id": 95, "question": "The ______ was so heavy last night that the streets were full of water.", "options": ["rain", "sun", "sky", "air"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 93 題）", "explanation": "街道淹水，是「雨」下得很大，heavy rain。", "explanationSource": "supplemental"}, {"id": 96, "question": "The ______ was so thick this morning that drivers couldn't see the cars in front.", "options": ["sun", "wind", "fog", "heat"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 93 題）", "explanation": "看不到前車，是「霧」很濃，thick fog。", "explanationSource": "supplemental"}, {"id": 97, "question": "When I was a teenager, I was very ______. But now, it's easier for me to talk to people.", "options": ["happy", "lazy", "popular", "shy"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜形容詞 shy 害羞的", "explanation": "【句型】詞彙題：形容詞語意判斷 shy「害羞的」\n【分析】後句說「但現在比較容易和人說話了」，表示以前不敢和人說話，故為 shy。\n【其他選項】(A) happy「快樂的」、(B) lazy「懶惰的」、(C) popular「受歡迎的」都與「現在較容易跟人說話」的對比無關。\n【例句】Amy is too shy to sing in front of the class.", "explanationSource": "source"}, {"id": 98, "question": "Danny never says hello to new classmates. He's just a little ______.", "options": ["shy", "loud", "rude", "brave"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 97 題）", "explanation": "不敢打招呼表示害羞 shy。", "explanationSource": "supplemental"}, {"id": 99, "question": "Kelly always does her homework at the last minute and sleeps all weekend. She is so ______.", "options": ["honest", "lazy", "polite", "careful"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 97 題）", "explanation": "拖到最後一刻且整個週末睡覺，表示懶惰 lazy。", "explanationSource": "supplemental"}, {"id": 100, "question": "Everyone in our class likes Ray. He's very ______ with his classmates.", "options": ["angry", "quiet", "popular", "strange"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 97 題）", "explanation": "大家都喜歡他，表示受歡迎 popular with。", "explanationSource": "supplemental"}, {"id": 101, "question": "Lena doesn't want to go ______ with John because she is afraid of water.", "options": ["dancing", "hiking", "sailing", "shopping"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜名詞 sailing 航行／go + Ving 活動", "explanation": "【句型】詞彙題：go + Ving（從事某活動），依語意選 sailing「航行；駕帆船」\n【分析】線索 afraid of water「怕水」，所以不想去和水有關的活動 → go sailing。\n【其他選項】(A) dancing「跳舞」、(B) hiking「健行」、(D) shopping「購物」都與水無關，不是怕水而不去的理由。\n【例句】My uncle likes to go sailing on the lake in summer.", "explanationSource": "source"}, {"id": 102, "question": "Kevin is afraid of heights, so he never goes ______ with his friends.", "options": ["swimming", "shopping", "climbing", "fishing"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 101 題）", "explanation": "怕高所以不去爬山 climbing。", "explanationSource": "supplemental"}, {"id": 103, "question": "Let's go ______ at the mall. I need a new pair of shoes.", "options": ["shopping", "camping", "hiking", "skating"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 101 題）", "explanation": "在購物中心買鞋 → go shopping。", "explanationSource": "supplemental"}, {"id": 104, "question": "Dad bought a new fishing pole, and he wants to go ______ by the river this Sunday.", "options": ["dancing", "fishing", "jogging", "bowling"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 101 題）", "explanation": "買了釣竿要去河邊 → go fishing。", "explanationSource": "supplemental"}, {"id": 105, "question": "There are so many new ______ in the office. It'll take me some time to remember who is who.", "options": ["faces", "ideas", "rules", "tools"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜名詞 face 臉孔（new faces 新面孔）", "explanation": "【句型】詞彙題：new faces「新面孔＝新來的人」\n【分析】後句「要花時間記住誰是誰」(who is who)，表示辦公室有很多新來的人，用 faces。\n【其他選項】(B) ideas「點子」、(C) rules「規定」、(D) tools「工具」都不是「人」，與 who is who 不合。\n【例句】There are a lot of new faces in our class this year.", "explanationSource": "source"}, {"id": 106, "question": "I can't remember her name, but I'll never forget her ______. She has big eyes and a sweet smile.", "options": ["voice", "face", "hair", "hand"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 105 題）", "explanation": "大眼睛和甜美笑容描述的是臉 face。", "explanationSource": "supplemental"}, {"id": 107, "question": "Our school has some new ______ this year. For example, we can't use cellphones in class.", "options": ["faces", "rules", "tools", "hobbies"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 105 題）", "explanation": "不能在課堂用手機是規定 rules。", "explanationSource": "supplemental"}, {"id": 108, "question": "Peter always has great ______ for our class parties, so everyone asks him for help.", "options": ["ideas", "faces", "noises", "mistakes"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 105 題）", "explanation": "大家請他幫忙辦派對，因為他有好點子 ideas。", "explanationSource": "supplemental"}, {"id": 109, "question": "I feel like a ______. I was looking for my keys for hours but they have been in my pocket the whole time.", "options": ["fool", "ghost", "king", "stranger"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜名詞 fool 傻瓜（feel like a fool）", "explanation": "【句型】詞彙題：feel like a fool「覺得自己像個傻瓜」\n【分析】找鑰匙找了好幾個小時，結果一直在自己口袋裡，覺得自己很蠢 → fool。\n【其他選項】(B) ghost「鬼」、(C) king「國王」、(D) stranger「陌生人」都無法說明這種糊塗的感受。\n【例句】Don't be a fool. Nobody can finish all that homework in one hour.", "explanationSource": "source"}, {"id": 110, "question": "I'm new in this town and I don't know anyone here. I feel like a ______.", "options": ["king", "stranger", "fool", "hero"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 109 題）", "explanation": "不認識任何人，覺得像陌生人 stranger。", "explanationSource": "supplemental"}, {"id": 111, "question": "Grace laughed at herself. She wore her T-shirt inside out all day and felt like a ______.", "options": ["fool", "king", "ghost", "leader"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 109 題）", "explanation": "衣服整天穿反，覺得自己像傻瓜 fool。", "explanationSource": "supplemental"}, {"id": 112, "question": "Everyone gave Andy flowers after he saved the little girl from the river. He is a real ______.", "options": ["stranger", "fool", "hero", "ghost"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 109 題）", "explanation": "救了落水女孩是英雄 hero。", "explanationSource": "supplemental"}, {"id": 113, "question": "You may have a long drive because of the terrible ______. There are usually a lot of cars and buses during this time.", "options": ["experience", "machine", "service", "traffic"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜名詞 traffic 交通", "explanation": "【句型】詞彙題：terrible/heavy traffic「糟糕／擁擠的交通」\n【分析】後句「這段時間通常有很多汽車和公車」，所以開車會很久是因為交通很塞 → traffic。\n【其他選項】(A) experience「經驗」、(B) machine「機器」、(C) service「服務」都與車多造成車程久無關。\n【例句】The traffic is always heavy on Friday evenings.", "explanationSource": "source"}, {"id": 114, "question": "We were late for the movie because of the heavy ______ on the highway.", "options": ["traffic", "weather", "service", "machine"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 113 題）", "explanation": "高速公路上車很多→交通 traffic。", "explanationSource": "supplemental"}, {"id": 115, "question": "The ______ at this restaurant is great. The waiters are always polite and fast.", "options": ["traffic", "service", "experience", "price"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 113 題）", "explanation": "服務生有禮又快速，指服務 service。", "explanationSource": "supplemental"}, {"id": 116, "question": "Living in Japan for a year was a wonderful ______ for me. I learned a lot.", "options": ["machine", "traffic", "experience", "service"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 113 題）", "explanation": "在日本住一年學到很多，是一段經驗 experience。", "explanationSource": "supplemental"}, {"id": 117, "question": "My ______ hurts so much that I cannot even turn my head.", "options": ["arm", "knee", "neck", "stomach"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜名詞 neck 脖子（身體部位）", "explanation": "【句型】詞彙題：身體部位 neck「脖子」\n【分析】線索 cannot even turn my head「連頭都不能轉」，轉頭要用脖子 → neck。\n【其他選項】(A) arm「手臂」、(B) knee「膝蓋」、(D) stomach「胃；肚子」都與轉頭無關。\n【例句】Giraffes have very long necks.", "explanationSource": "source"}, {"id": 118, "question": "I ate too much ice cream, and now my ______ hurts.", "options": ["neck", "stomach", "knee", "ear"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 117 題）", "explanation": "吃太多冰淇淋會肚子痛 stomach。", "explanationSource": "supplemental"}, {"id": 119, "question": "Ken fell off his bike and hurt his ______. Now he can't bend his leg.", "options": ["knee", "neck", "nose", "shoulder"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 117 題）", "explanation": "不能彎腿是膝蓋受傷 knee。", "explanationSource": "supplemental"}, {"id": 120, "question": "Please raise your ______ if you know the answer.", "options": ["neck", "foot", "hand", "head"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 117 題）", "explanation": "舉手回答 raise your hand。", "explanationSource": "supplemental"}, {"id": 121, "question": "Tomorrow is Sam's last day in the office. Nobody knows why he decided to ______.", "options": ["hide", "leave", "pack", "walk"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜動詞 leave 離開（離職）", "explanation": "【句型】詞彙題：decide to + V；leave「離開（工作）」\n【分析】線索 last day in the office「在辦公室的最後一天」，表示他決定離職 → leave。\n【其他選項】(A) hide「躲藏」、(C) pack「打包」、(D) walk「走路」都不能表達離開這份工作。\n【例句】My sister decided to leave her job and study abroad.", "explanationSource": "source"}, {"id": 122, "question": "It's getting late. I have to ______ now, or I'll miss the last train.", "options": ["stay", "leave", "hide", "wait"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 121 題）", "explanation": "不然會錯過末班車，所以得離開 leave。", "explanationSource": "supplemental"}, {"id": 123, "question": "The cat always ______ under the bed when there's a typhoon.", "options": ["hides", "leaves", "packs", "walks"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 121 題）", "explanation": "颱風時貓會躲在床下 hides。", "explanationSource": "supplemental"}, {"id": 124, "question": "We're going to Kenting tomorrow. Don't forget to ______ your swimsuit tonight.", "options": ["hide", "leave", "pack", "wash"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 121 題）", "explanation": "出遊前一晚要打包 pack 泳衣。", "explanationSource": "supplemental"}, {"id": 125, "question": "It's not a good idea to go mountain climbing in this bad ______. We should wait until the typhoon goes away.", "options": ["chance", "dream", "habit", "weather"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜名詞 weather 天氣", "explanation": "【句型】詞彙題：bad weather「惡劣的天氣」\n【分析】線索 typhoon「颱風」，表示天氣不好，不適合爬山 → weather。\n【其他選項】(A) chance「機會」、(B) dream「夢想」、(C) habit「習慣」都與颱風無關。\n【例句】The weather in Taipei is often rainy in spring.", "explanationSource": "source"}, {"id": 126, "question": "Eating breakfast every day is a good ______. It keeps you healthy.", "options": ["habit", "weather", "dream", "chance"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 125 題）", "explanation": "每天吃早餐是好習慣 habit。", "explanationSource": "supplemental"}, {"id": 127, "question": "Becoming a pilot has been Henry's ______ since he was a little boy.", "options": ["habit", "weather", "dream", "traffic"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 125 題）", "explanation": "從小想當飛行員是夢想 dream。", "explanationSource": "supplemental"}, {"id": 128, "question": "The ______ is so nice today. Let's have a picnic in the park.", "options": ["chance", "habit", "dream", "weather"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 125 題）", "explanation": "天氣好適合野餐 weather。", "explanationSource": "supplemental"}, {"id": 129, "question": "The new guy at the help desk answers calls like a ______. There are no ups and downs in his voice and you can't tell if he is happy or sad.", "options": ["father", "foreigner", "radio", "robot"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜名詞 robot 機器人（like a robot）", "explanation": "【句型】詞彙題：like a robot「像機器人一樣（沒有感情）」\n【分析】線索「聲音沒有高低起伏」、「聽不出他是開心或難過」，表示說話毫無感情，像機器人 → robot。\n【其他選項】(A) father「父親」、(B) foreigner「外國人」、(C) radio「收音機」都不能表達「沒有情緒」的特徵。\n【例句】He walks like a robot because his new shoes are too tight.", "explanationSource": "source"}, {"id": 130, "question": "Mr. Lin speaks English with an accent, so people often think he's a ______.", "options": ["robot", "foreigner", "radio", "teacher"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 129 題）", "explanation": "說話有口音被以為是外國人 foreigner。", "explanationSource": "supplemental"}, {"id": 131, "question": "The ______ in this factory can work 24 hours a day without getting tired.", "options": ["robots", "foreigners", "fathers", "radios"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 129 題）", "explanation": "不會累、24 小時工作的是機器人 robots。", "explanationSource": "supplemental"}, {"id": 132, "question": "Grandpa likes to listen to the news on the ______ every morning.", "options": ["robot", "camera", "radio", "printer"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 129 題）", "explanation": "聽新聞用收音機 radio。", "explanationSource": "supplemental"}, {"id": 133, "question": "Jasmine planned to spend her summer in the country, but right after she got there, she started to ______ the noise in the city.", "options": ["enjoy", "mind", "miss", "notice"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜動詞 miss 想念", "explanation": "【句型】詞彙題：miss + N「想念…」\n【分析】她計畫在鄉下過暑假，但 but 表轉折，一到鄉下（很安靜）就開始想念城市的吵鬧 → miss。\n【其他選項】(A) enjoy「享受」：鄉下沒有城市噪音，無從享受；(B) mind「介意」：與 but 的轉折語意不合；(D) notice「注意到」：人在鄉下聽不到城市噪音。\n【例句】I miss my grandma's cooking when I'm away from home.", "explanationSource": "source"}, {"id": 134, "question": "Yuki moved to Taiwan last year. She sometimes ______ her friends in Japan.", "options": ["minds", "misses", "notices", "hates"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 133 題）", "explanation": "離開日本會想念朋友 misses。", "explanationSource": "supplemental"}, {"id": 135, "question": "Do you ______ if I open the window? It's hot in here.", "options": ["miss", "enjoy", "mind", "notice"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 133 題）", "explanation": "Do you mind if...「你介意…嗎」。", "explanationSource": "supplemental"}, {"id": 136, "question": "Did you ______ anything strange about Ted today? He didn't say a word all morning.", "options": ["notice", "miss", "mind", "enjoy"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 133 題）", "explanation": "有沒有注意到什麼奇怪的事 notice。", "explanationSource": "supplemental"}, {"id": 137, "question": "Don't let the children swim in the river. We don't know how ______ it is. It could be dangerous.", "options": ["deep", "far", "long", "thick"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜形容詞 deep 深的（how deep）", "explanation": "【句型】詞彙題：how + adj. 問程度；deep「深的」\n【分析】不讓孩子在河裡游泳，因為不知道河有多「深」，可能很危險 → how deep。\n【其他選項】(B) far「遠」、(C) long「長」、(D) thick「厚」都不是游泳時危險的關鍵（水深）。\n【例句】How deep is this swimming pool?", "explanationSource": "source"}, {"id": 138, "question": "How ______ is it from your home to the MRT station? —About ten minutes on foot.", "options": ["deep", "far", "thick", "high"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 137 題）", "explanation": "問距離用 how far。", "explanationSource": "supplemental"}, {"id": 139, "question": "This dictionary is so ______ that it's too heavy for me to carry.", "options": ["thick", "deep", "far", "short"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 137 題）", "explanation": "字典很厚所以很重 thick。", "explanationSource": "supplemental"}, {"id": 140, "question": "How ______ did you stay in Tainan? —For a week.", "options": ["far", "deep", "long", "often"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 137 題）", "explanation": "問待多久用 how long。", "explanationSource": "supplemental"}, {"id": 141, "question": "Ben always uses his birthday as a(n) ______ to ask Dad to buy him something expensive.", "options": ["action", "excuse", "prize", "rule"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜名詞 excuse 藉口", "explanation": "【句型】詞彙題：use sth as an excuse to V「把…當作藉口去做…」\n【分析】Ben 總是拿生日「當藉口」要爸爸買貴的東西給他 → excuse。題目有 a(n)，excuse 開頭為母音，用 an。\n【其他選項】(A) action「行動」、(C) prize「獎品」、(D) rule「規定」放入 use...as a(n) ___ to ask... 語意都不通。\n【例句】Don't use the rain as an excuse to skip PE class.", "explanationSource": "source"}, {"id": 142, "question": "Tim was late again, and his ______ was that his alarm clock didn't ring.", "options": ["prize", "excuse", "rule", "habit"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 141 題）", "explanation": "遲到的理由（藉口）excuse。", "explanationSource": "supplemental"}, {"id": 143, "question": "The first ______ in our classroom is: no eating during class.", "options": ["rule", "excuse", "prize", "action"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 141 題）", "explanation": "上課不准吃東西是規定 rule。", "explanationSource": "supplemental"}, {"id": 144, "question": "Nina won first ______ in the drawing contest and got a new bike.", "options": ["excuse", "rule", "prize", "action"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 141 題）", "explanation": "比賽第一名 first prize。", "explanationSource": "supplemental"}, {"id": 145, "question": "Tom's voice ______ when he talks about his neighbors. He speaks faster, his face becomes redder and you can almost see fire in his eyes.", "options": ["appears", "drops", "grows", "rises"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜動詞 rise 升高（聲音提高）", "explanation": "【句型】詞彙題：one's voice rises「聲音提高（變大聲）」\n【分析】後句說他講話變快、臉變紅、眼睛冒火，表示他很生氣，聲音會「提高」→ rises。\n【其他選項】(A) appears「出現」，聲音一直都在，不合；(B) drops「降低」與生氣相反；(C) grows「成長、變大」不用來形容音量提高。\n【例句】The price of vegetables always rises after a typhoon.", "explanationSource": "source"}, {"id": 146, "question": "The sun ______ in the east every morning.", "options": ["drops", "rises", "grows", "appears"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 145 題）", "explanation": "太陽從東方升起 rises。", "explanationSource": "supplemental"}, {"id": 147, "question": "The temperature ______ to 10°C last night, so we all wore jackets.", "options": ["rose", "grew", "dropped", "appeared"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 145 題）", "explanation": "大家穿外套，表示氣溫下降 dropped。", "explanationSource": "supplemental"}, {"id": 148, "question": "A rainbow ______ in the sky after the rain stopped.", "options": ["appeared", "dropped", "rose", "grew"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 145 題）", "explanation": "雨停後彩虹出現 appeared。", "explanationSource": "supplemental"}, {"id": 149, "question": "See the ruler on your right? Please ______ it to me. I need to draw a line.", "options": ["check", "collect", "hand", "turn"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜動詞 hand 遞交（hand sth to sb）", "explanation": "【句型】詞彙題：hand + 物 + to + 人「把某物遞給某人」\n【分析】「看到你右邊的尺嗎？請把它遞給我，我要畫線」→ hand it to me。\n【其他選項】(A) check「檢查」、(B) collect「收集」、(D) turn「轉動」都不接 it to me 表「遞給我」的意思。\n【例句】Could you hand me the salt, please?", "explanationSource": "source"}, {"id": 150, "question": "The teacher asked us to ______ our homework to the class leader before 8 a.m.", "options": ["hand", "check", "turn", "fold"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 149 題）", "explanation": "把作業交給班長 hand...to。", "explanationSource": "supplemental"}, {"id": 151, "question": "Please ______ your answers carefully before you hand in the test.", "options": ["collect", "check", "hand", "turn"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 149 題）", "explanation": "交卷前檢查答案 check。", "explanationSource": "supplemental"}, {"id": 152, "question": "My cousin likes to ______ stamps from different countries.", "options": ["hand", "turn", "collect", "check"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 149 題）", "explanation": "收集郵票 collect。", "explanationSource": "supplemental"}, {"id": 153, "question": "Mark: We can't enter the house. I can't find my key!\nBilly: Is it possible that you ______ it in the car?", "options": ["caught", "changed", "found", "left"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜動詞 leave 遺留（leave sth in/at 地點）", "explanation": "【句型】詞彙題：leave + 物 + 地點「把某物遺忘在某處」\n【分析】Mark 找不到鑰匙，Billy 問「有沒有可能你把它留在車上了？」→ left it in the car。\n【其他選項】(A) caught「抓到」、(B) changed「改變」不合語意；(C) found「找到」與「找不到鑰匙」矛盾。\n【例句】Oh no! I left my umbrella on the bus.", "explanationSource": "source"}, {"id": 154, "question": "I can't find my cellphone. Maybe I ______ it at school.", "options": ["left", "found", "caught", "changed"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 153 題）", "explanation": "把物品遺留在某地用 leave，left it at school。", "explanationSource": "supplemental"}, {"id": 155, "question": "Jason ______ a big fish in the river last Sunday.", "options": ["left", "changed", "caught", "lost"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 153 題）", "explanation": "釣到大魚 caught。", "explanationSource": "supplemental"}, {"id": 156, "question": "Good news! I ______ my lost wallet under the sofa.", "options": ["left", "found", "changed", "caught"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 153 題）", "explanation": "在沙發下找到錢包 found。", "explanationSource": "supplemental"}, {"id": 157, "question": "Jim always forgets my birthday. He has asked me many times and still can't ______ it.", "options": ["answer", "celebrate", "remember", "understand"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜動詞 remember 記得", "explanation": "【句型】詞彙題：remember「記得」（與 forget 相反）\n【分析】線索 always forgets「總是忘記」、問了很多次還是「記不住」→ can't remember it。\n【其他選項】(A) answer「回答」、(B) celebrate「慶祝」、(D) understand「理解」都與「忘記生日」的語意無關。\n【例句】I can't remember where I put my glasses.", "explanationSource": "source"}, {"id": 158, "question": "Please ______ to bring your PE clothes tomorrow.", "options": ["remember", "answer", "understand", "celebrate"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 157 題）", "explanation": "記得帶體育服 remember to V。", "explanationSource": "supplemental"}, {"id": 159, "question": "We'll ______ Grandpa's 80th birthday with a big dinner.", "options": ["understand", "celebrate", "answer", "remember"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 157 題）", "explanation": "慶祝生日 celebrate。", "explanationSource": "supplemental"}, {"id": 160, "question": "The teacher explained the question three times, but I still don't ______ it.", "options": ["celebrate", "answer", "understand", "forget"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 157 題）", "explanation": "解釋三次仍不懂 understand。", "explanationSource": "supplemental"}, {"id": 161, "question": "My sister was very ______ with me because I broke her new pencil box.", "options": ["popular", "shy", "honest", "angry"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜形容詞 angry 生氣的（angry with sb）", "explanation": "【句型】詞彙題：be angry with + 人「對某人生氣」\n【分析】因為我弄壞她的新鉛筆盒，所以姊姊（妹妹）對我很生氣 → angry with me。\n【其他選項】(A) popular with「受…歡迎」、(B) shy「害羞」、(C) honest with「對…誠實」都不是弄壞東西後的反應。\n【例句】Mom was angry with me because I came home late.", "explanationSource": "source"}, {"id": 162, "question": "You should be ______ with your parents and tell them the truth.", "options": ["angry", "honest", "shy", "busy"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 161 題）", "explanation": "說實話 → 對父母誠實 honest with。", "explanationSource": "supplemental"}, {"id": 163, "question": "Coach Chen is ______ with the students. Everyone loves his classes.", "options": ["angry", "shy", "popular", "honest"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 161 題）", "explanation": "大家都愛他的課，受歡迎 popular with。", "explanationSource": "supplemental"}, {"id": 164, "question": "Dad was ______ with my brother because he lied about his grades.", "options": ["proud", "popular", "happy", "angry"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 161 題）", "explanation": "說謊所以爸爸生氣 angry with。", "explanationSource": "supplemental"}, {"id": 165, "question": "You can't ______ Tasty Bakery's meat pie! It's so delicious that even some restaurants in town order it.", "options": ["cook", "cut", "hit", "miss"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜動詞 miss 錯過（You can't miss...）", "explanation": "【句型】詞彙題：You can't miss + N.「你絕不能錯過…」\n【分析】後句說肉派好吃到連餐廳都向他們訂，所以是「千萬別錯過」→ miss。\n【其他選項】(A) cook「烹煮」、(B) cut「切」、(C) hit「打」放入句中都無法表達推薦的語意。\n【例句】You can't miss the night markets when you visit Taipei.", "explanationSource": "source"}, {"id": 166, "question": "Hurry up, or we'll ______ the school bus.", "options": ["hit", "miss", "catch", "cut"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 165 題）", "explanation": "快點不然會錯過校車 miss。", "explanationSource": "supplemental"}, {"id": 167, "question": "Be careful with the knife when you ______ the onions.", "options": ["cut", "miss", "hit", "cook"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 165 題）", "explanation": "用刀切洋蔥 cut。", "explanationSource": "supplemental"}, {"id": 168, "question": "The typhoon is going to ______ southern Taiwan tomorrow night.", "options": ["miss", "cook", "hit", "cut"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 165 題）", "explanation": "颱風侵襲 hit。", "explanationSource": "supplemental"}, {"id": 169, "question": "Mark studies very hard and never ______ classes. He goes to school even when he is sick.", "options": ["loses", "misses", "changes", "forgets"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜動詞 miss 錯過（miss classes 缺課）", "explanation": "【句型】詞彙題：miss classes / school「缺課」\n【分析】後句說他「連生病都去上學」，所以從不缺課 → never misses classes。\n【其他選項】(A) loses「遺失」、(C) changes「改變」、(D) forgets「忘記」都不能與 classes 搭配表示缺課。\n【例句】Try not to miss any classes before the final exam.", "explanationSource": "source"}, {"id": 170, "question": "Ted got a cold and ______ school for two days.", "options": ["lost", "missed", "forgot", "changed"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 169 題）", "explanation": "感冒缺課 missed school。", "explanationSource": "supplemental"}, {"id": 171, "question": "I ______ my umbrella on the MRT, so I had to buy a new one.", "options": ["missed", "changed", "lost", "failed"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 169 題）", "explanation": "雨傘弄丟 lost。", "explanationSource": "supplemental"}, {"id": 172, "question": "Mom often ______ where she parks her car at the mall.", "options": ["misses", "loses", "changes", "forgets"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 169 題）", "explanation": "忘記車停哪裡 forgets。", "explanationSource": "supplemental"}, {"id": 173, "question": "If you are not afraid of talking to strangers, you'll have more ______ to make friends.", "options": ["languages", "opportunities", "prescriptions", "problems"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜名詞 opportunity 機會", "explanation": "【句型】have opportunities to V＝有機會做某事。\n【分析】不害怕和陌生人說話，就會有更多「機會」交朋友，opportunities 正確。\n【其他選項】(A) languages 語言；(C) prescriptions 處方箋；(D) problems 問題，皆不合「交朋友」的語意。\n【例句】Joining the club gives students more opportunities to practice English.（參加社團讓學生有更多機會練英文。）", "explanationSource": "source"}, {"id": 174, "question": "Studying abroad gave Lily a great ______ to learn about other cultures.", "options": ["problem", "opportunity", "reason", "language"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 173 題）", "explanation": "出國讀書給她「機會」認識其他文化，opportunity。", "explanationSource": "supplemental"}, {"id": 175, "question": "The doctor wrote a ______ for some medicine for my cough.", "options": ["prescription", "chance", "message", "program"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 173 題）", "explanation": "醫生開藥用的是「處方箋」，prescription。", "explanationSource": "supplemental"}, {"id": 176, "question": "Math is hard for Tom. He has many ______ with his homework every day.", "options": ["opportunities", "languages", "problems", "hobbies"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 173 題）", "explanation": "數學很難，作業上有很多「問題」，problems。", "explanationSource": "supplemental"}, {"id": 177, "question": "Some songs are forgotten very quickly. A really good song can pass the test of ______ and be remembered for many, many years.", "options": ["knowledge", "sound", "time", "weather"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜the test of time 時間的考驗", "explanation": "【句型】pass / stand the test of time＝經得起時間考驗。\n【分析】前句說有些歌很快被遺忘，後面說好歌能被記住「很多很多年」，所以是通過「時間」的考驗，選 time。\n【其他選項】(A) knowledge 知識；(B) sound 聲音；(D) weather 天氣，都與「被記住很多年」無關。\n【例句】This old bridge has passed the test of time.（這座老橋經得起時間的考驗。）", "explanationSource": "source"}, {"id": 178, "question": "Ms. Lin's ______ of history is amazing. She can answer any question about the past.", "options": ["weather", "knowledge", "sound", "season"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 177 題）", "explanation": "能回答任何歷史問題，代表她的歷史「知識」豐富，knowledge。", "explanationSource": "supplemental"}, {"id": 179, "question": "Turn down the ______ of the TV, please. The baby is sleeping.", "options": ["sound", "time", "test", "knowledge"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 177 題）", "explanation": "嬰兒在睡覺，要把電視「聲音」轉小，sound。", "explanationSource": "supplemental"}, {"id": 180, "question": "The ______ is getting colder. Remember to wear a jacket when you go out.", "options": ["knowledge", "sound", "weather", "habit"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 177 題）", "explanation": "變冷又要穿外套，指「天氣」，weather。", "explanationSource": "supplemental"}, {"id": 181, "question": "Roy: Why didn't you eat your cake?\nKay: I'm still full. Can I ______ it for later?\nRoy: Sure.", "options": ["pass", "save", "share", "stop"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜save sth for later 留到之後", "explanation": "【句型】save + 物 + for later＝把…留到之後。\n【分析】Kay 還很飽，想把蛋糕「留著」晚點吃，for later 是線索，選 save。\n【其他選項】(A) pass 傳遞；(C) share 分享；(D) stop 停止，都和 for later「留到之後」不搭。\n【例句】I'll save this chocolate for tomorrow.（我要把這塊巧克力留到明天。）", "explanationSource": "source"}, {"id": 182, "question": "Ivy wants to buy a new camera, so she ______ some money every month.", "options": ["spends", "saves", "stops", "passes"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 181 題）", "explanation": "為買相機每月「存」錢，save。", "explanationSource": "supplemental"}, {"id": 183, "question": "Could you ______ me the salt, please? I can't reach it.", "options": ["save", "stop", "pass", "share"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 181 題）", "explanation": "請別人「遞」鹽，pass。", "explanationSource": "supplemental"}, {"id": 184, "question": "It's dangerous to cross now. Please ______ and wait for the green light.", "options": ["save", "pass", "share", "stop"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 181 題）", "explanation": "危險要「停下」等綠燈，stop。", "explanationSource": "supplemental"}, {"id": 185, "question": "John has finished his studies at music school. Now with his good ______ of music, he can teach at school.", "options": ["future", "habit", "knowledge", "language"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜knowledge of 對…的知識", "explanation": "【句型】knowledge of + N＝對…的知識。\n【分析】John 讀完音樂學校，具備良好的音樂「知識」，所以能教書，選 knowledge。\n【其他選項】(A) future 未來；(B) habit 習慣；(D) language 語言，與「能教音樂」的原因不符。\n【例句】Mr. Wu has a lot of knowledge of Taiwanese history.（吳老師很懂台灣歷史。）", "explanationSource": "source"}, {"id": 186, "question": "Getting up early is a good ______. It helps you start the day well.", "options": ["knowledge", "habit", "future", "language"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 185 題）", "explanation": "早起是好「習慣」，habit。", "explanationSource": "supplemental"}, {"id": 187, "question": "Nina reads a lot of science books, so she has good ______ of nature.", "options": ["future", "language", "habit", "knowledge"], "answer": 3, "answerLabel": "D", "source": "類似題 2（對應第 185 題）", "explanation": "讀很多科學書，具備自然方面的「知識」，knowledge。", "explanationSource": "supplemental"}, {"id": 188, "question": "Jacob wants to be a doctor in the ______, so he studies very hard now.", "options": ["future", "knowledge", "habit", "past"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 185 題）", "explanation": "將來想當醫生，in the future「未來」。", "explanationSource": "supplemental"}, {"id": 189, "question": "Tim: Can you see what the word is? The first ______ is not clear.\nAnn: Oh, it's \"r.\" The word is \"ring.\"", "options": ["idea", "lesson", "letter", "sound"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜名詞 letter 字母", "explanation": "【句型】letter＝字母（亦可指「信」）。\n【分析】Ann 回答「是 r」，r 是一個「字母」，所以第一個字母看不清楚，選 letter。\n【其他選項】(A) idea 想法；(B) lesson 課；(D) sound 聲音，題目問的是「看」不清楚的字，不是聲音。\n【例句】The word \"apple\" begins with the letter \"a.\"（apple 這個字以字母 a 開頭。）", "explanationSource": "source"}, {"id": 190, "question": "There are twenty-six ______ in the English alphabet.", "options": ["letters", "words", "lessons", "sounds"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 189 題）", "explanation": "英文字母表有 26 個「字母」，letters。", "explanationSource": "supplemental"}, {"id": 191, "question": "I have a good ______. Let's have a picnic by the river this Sunday.", "options": ["letter", "idea", "lesson", "sound"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 189 題）", "explanation": "提出野餐的「點子」，idea。", "explanationSource": "supplemental"}, {"id": 192, "question": "Did you hear that strange ______ outside? It was like a cat crying.", "options": ["letter", "idea", "sound", "lesson"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 189 題）", "explanation": "聽到奇怪的「聲音」，sound。", "explanationSource": "supplemental"}, {"id": 193, "question": "Tom: Jack, put the letter in the ______ and send it to Mr. Wu, please.\nJack: Sure.", "options": ["closet", "envelope", "tunnel", "corner"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜名詞 envelope 信封", "explanation": "【句型】put the letter in the envelope＝把信放進信封。\n【分析】要把信寄給吳先生，信要放進「信封」，選 envelope。\n【其他選項】(A) closet 衣櫥；(C) tunnel 隧道；(D) corner 角落，皆不是寄信時裝信的東西。\n【例句】Don't forget to write the address on the envelope.（別忘了在信封上寫地址。）", "explanationSource": "source"}, {"id": 194, "question": "Please hang your coat in the ______ before you sit down.", "options": ["envelope", "closet", "tunnel", "stamp"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 193 題）", "explanation": "外套掛在「衣櫥」裡，closet。", "explanationSource": "supplemental"}, {"id": 195, "question": "Grandma put some red ______ under her pillow for us on Lunar New Year's Eve.", "options": ["closets", "corners", "envelopes", "tunnels"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 193 題）", "explanation": "除夕的「紅包」為 red envelope。", "explanationSource": "supplemental"}, {"id": 196, "question": "The train is going through a long ______, so it is dark outside.", "options": ["envelope", "closet", "corner", "tunnel"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 193 題）", "explanation": "火車穿過長「隧道」，外面很暗，tunnel。", "explanationSource": "supplemental"}, {"id": 197, "question": "I want to buy a cell phone. Which ______ is better?", "options": ["art", "fake", "light", "brand"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜名詞 brand 品牌", "explanation": "【句型】Which brand ...?＝哪個品牌…？\n【分析】要買手機，問哪個「品牌」比較好，選 brand。\n【其他選項】(A) art 藝術；(B) fake 假的／假貨，Which fake is better 不合理；(C) light 燈／光，皆不合買手機的情境。\n【例句】This brand of shoes is very popular with students.（這個品牌的鞋子很受學生歡迎。）", "explanationSource": "source"}, {"id": 198, "question": "My dad only drinks coffee from one ______. He says it tastes the best.", "options": ["art", "brand", "light", "fake"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 197 題）", "explanation": "只喝某一「品牌」的咖啡，brand。", "explanationSource": "supplemental"}, {"id": 199, "question": "Don't buy that bag at the night market. It may be a ______.", "options": ["brand", "light", "fake", "art"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 197 題）", "explanation": "夜市的包包可能是「假貨」，fake。", "explanationSource": "supplemental"}, {"id": 200, "question": "It's too dark in here. Can you turn on the ______?", "options": ["light", "brand", "art", "fake"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 197 題）", "explanation": "太暗了，打開「燈」，light。", "explanationSource": "supplemental"}, {"id": 201, "question": "House prices are ______, so you can buy a house at a lower price than before.", "options": ["moving", "growing", "dropping", "climbing"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜dropping 下跌", "explanation": "【句型】prices are dropping / going down＝價格正在下跌。\n【分析】後句說可以用「比以前低的價格」買房，表示房價正在「下跌」，選 dropping。\n【其他選項】(A) moving 移動；(B) growing 成長／上升；(D) climbing 攀升，(B)(D) 皆表上漲，與「較低價格」矛盾。\n【例句】The temperature is dropping quickly tonight.（今晚氣溫快速下降。）", "explanationSource": "source"}, {"id": 202, "question": "Oil prices keep ______, so it costs more to drive a car now.", "options": ["dropping", "climbing", "falling", "moving"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 201 題）", "explanation": "開車花費更多，表示油價「攀升」，climbing。", "explanationSource": "supplemental"}, {"id": 203, "question": "The number of students in the village is ______ because many families moved to the city.", "options": ["dropping", "growing", "climbing", "rising"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 201 題）", "explanation": "家庭搬到城市，學生人數「減少」，dropping。", "explanationSource": "supplemental"}, {"id": 204, "question": "This little tree is ______ fast. It is already taller than me.", "options": ["dropping", "moving", "growing", "falling"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 201 題）", "explanation": "樹已比我高，表示「長」得快，growing。", "explanationSource": "supplemental"}, {"id": 205, "question": "Alice doesn't take medicine when she has a cold. She believes the body is able to ______ the cold by itself.", "options": ["catch", "fight", "hunt", "pass"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜動詞 fight 對抗", "explanation": "【句型】fight (against) + 疾病＝對抗…。\n【分析】她感冒不吃藥，因為相信身體能自己「對抗」感冒，選 fight。\n【其他選項】(A) catch a cold 是「得到」感冒，不合語意；(C) hunt 獵捕；(D) pass 傳遞／通過，皆不合。\n【例句】Eating vegetables helps your body fight sickness.（吃蔬菜幫助身體對抗疾病。）", "explanationSource": "source"}, {"id": 206, "question": "Wear a jacket, or you'll ______ a cold.", "options": ["fight", "catch", "hunt", "pass"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 205 題）", "explanation": "不穿外套會「得到」感冒，catch a cold。", "explanationSource": "supplemental"}, {"id": 207, "question": "Doctors around the world are working together to ______ the disease.", "options": ["catch", "pass", "fight", "hunt"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 205 題）", "explanation": "醫生合作「對抗」疾病，fight。", "explanationSource": "supplemental"}, {"id": 208, "question": "Lions usually ______ for food in groups.", "options": ["fight", "pass", "catch", "hunt"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 205 題）", "explanation": "獅子成群「獵食」，hunt for food。", "explanationSource": "supplemental"}, {"id": 209, "question": "It is not safe to swim in the sea, so Susan's mother asked her to ______ it.", "options": ["invite", "draw", "avoid", "join"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜動詞 avoid 避免", "explanation": "【句型】ask sb to V＝要求某人做…；avoid＝避免、避開。\n【分析】在海裡游泳不安全，所以媽媽要她「避免」這件事，選 avoid。\n【其他選項】(A) invite 邀請；(B) draw 畫；(D) join 加入，皆與「不安全」的語意相反或無關。\n【例句】You should avoid eating too much fried food.（你應該避免吃太多油炸食物。）", "explanationSource": "source"}, {"id": 210, "question": "The road is very busy at eight. Let's leave earlier to ______ the traffic.", "options": ["join", "avoid", "invite", "follow"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 209 題）", "explanation": "提早出門「避開」車潮，avoid。", "explanationSource": "supplemental"}, {"id": 211, "question": "Mark wants to ______ the school band because he loves playing the drums.", "options": ["avoid", "draw", "join", "invite"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 209 題）", "explanation": "喜歡打鼓想「加入」樂隊，join。", "explanationSource": "supplemental"}, {"id": 212, "question": "Helen is going to ______ all her classmates to her birthday party.", "options": ["avoid", "join", "draw", "invite"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 209 題）", "explanation": "「邀請」同學參加生日派對，invite。", "explanationSource": "supplemental"}, {"id": 213, "question": "The movie star does not like his family to ______ in public places with him; he does not want people to know who they are.", "options": ["agree", "appear", "cheat", "decide"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜動詞 appear 出現", "explanation": "【句型】appear (in public)＝（公開）出現、露面。\n【分析】他不想讓別人知道家人是誰，所以不喜歡家人和他一起在公共場所「出現」，選 appear。\n【其他選項】(A) agree 同意；(C) cheat 欺騙／作弊；(D) decide 決定，都無法說明「不想被認出」。\n【例句】The singer appeared on TV last night.（那位歌手昨晚上了電視。）", "explanationSource": "source"}, {"id": 214, "question": "A rainbow ______ in the sky after the rain stopped.", "options": ["decided", "appeared", "agreed", "cheated"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 213 題）", "explanation": "雨停後彩虹「出現」，appear。", "explanationSource": "supplemental"}, {"id": 215, "question": "It's wrong to ______ on a test. You should study hard instead.", "options": ["appear", "agree", "cheat", "decide"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 213 題）", "explanation": "考試「作弊」是錯的，cheat。", "explanationSource": "supplemental"}, {"id": 216, "question": "Nora couldn't ______ which dress to wear, so she asked her sister for help.", "options": ["decide", "appear", "cheat", "agree"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 213 題）", "explanation": "無法「決定」穿哪件，decide。", "explanationSource": "supplemental"}, {"id": 217, "question": "The ______ of the house is too high. My parents do not have enough money to buy it.", "options": ["price", "size", "space", "wall"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜名詞 price 價格", "explanation": "【句型】The price is high / low＝價格高／低。\n【分析】父母錢不夠買，表示房子的「價格」太高，選 price。\n【其他選項】(B) size 大小；(C) space 空間；(D) wall 牆，雖可說「高」，但與「錢不夠」沒有因果關係。\n【例句】The price of this jacket is too high for me.（這件外套的價格對我來說太高了。）", "explanationSource": "source"}, {"id": 218, "question": "These shoes are on sale. The ______ is fifty percent lower than last week.", "options": ["size", "price", "space", "wall"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 217 題）", "explanation": "特價比上週低一半，指「價格」，price。", "explanationSource": "supplemental"}, {"id": 219, "question": "This T-shirt is too small. Do you have a bigger ______?", "options": ["price", "space", "size", "wall"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 217 題）", "explanation": "衣服太小要大一點的「尺寸」，size。", "explanationSource": "supplemental"}, {"id": 220, "question": "There isn't enough ______ in my room for a piano.", "options": ["price", "size", "wall", "space"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 217 題）", "explanation": "房間沒有足夠「空間」放鋼琴，space。", "explanationSource": "supplemental"}, {"id": 221, "question": "Christmas is coming. Jane and her brother are busy ______ their house with a Christmas tree and some flowers.", "options": ["visiting", "building", "cleaning", "decorating"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜動詞 decorate 裝飾（be busy Ving）", "explanation": "【句型】be busy + Ving＝忙著做…；decorate A with B＝用 B 裝飾 A。\n【分析】用「聖誕樹和花」來布置房子，是「裝飾」，with a Christmas tree and some flowers 是線索，選 decorating。\n【其他選項】(A) visiting 拜訪；(B) building 建造；(C) cleaning 打掃，都不會「用聖誕樹和花」來做。\n【例句】We decorated the classroom with balloons for the party.（我們用氣球布置教室準備派對。）", "explanationSource": "source"}, {"id": 222, "question": "Before Lunar New Year, everyone in my family is busy ______ the house. We wash windows and floors.", "options": ["decorating", "visiting", "cleaning", "building"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 221 題）", "explanation": "洗窗戶和地板是「打掃」，be busy cleaning。", "explanationSource": "supplemental"}, {"id": 223, "question": "Ruby decorated her room ______ pictures of her favorite singers.", "options": ["for", "with", "by", "in"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 221 題）", "explanation": "decorate A with B，用照片「裝飾」房間。", "explanationSource": "supplemental"}, {"id": 224, "question": "During the summer vacation, we ______ our grandparents in Hualien and stayed there for a week.", "options": ["visited", "decorated", "built", "cleaned"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 221 題）", "explanation": "放假去花蓮「拜訪」祖父母並住了一週，visit。", "explanationSource": "supplemental"}, {"id": 225, "question": "Joe: Where was Mary last weekend? I ______ her, but no one answered the phone.\nTom: I don't know. Why not try again?", "options": ["asked", "called", "found", "talked to"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜call 打電話給某人", "explanation": "【句型】call + 人 = 打電話給某人（及物動詞，後面直接接受詞）。\n【分析】後句 no one answered the phone（沒人接電話）→ 表示「我打電話給她」，用 called。\n【其他選項】(A) asked 詢問，與接電話無關；(C) found 找到，若找到她就不會沒人接；(D) talked to 和…說話，沒人接電話就無法交談。\n【例句】I called Grandma last night, but she was asleep.", "explanationSource": "source"}, {"id": 226, "question": "Kevin: Did you ______ Amy about the party?\nJill: Yes, but her phone was busy, so I sent her a message.", "options": ["call", "visit", "meet", "write"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 225 題）", "explanation": "her phone was busy（電話占線）表示有打電話給她，用 call。", "explanationSource": "supplemental"}, {"id": 227, "question": "Nobody ______ the phone when I called the store, so I went there myself.", "options": ["called", "answered", "asked", "heard"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 225 題）", "explanation": "answer the phone 接電話；沒人接，所以親自去。", "explanationSource": "supplemental"}, {"id": 228, "question": "Please ______ me when you get to the train station. I'll pick you up.", "options": ["take", "find", "call", "answer"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 225 題）", "explanation": "到站時「打電話給我」，我去接你，用 call me。", "explanationSource": "supplemental"}, {"id": 229, "question": "Soccer is a kind of ______ sport. That means you cannot play it by yourself.", "options": ["team", "popular", "funny", "boring"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜team sport 團隊運動", "explanation": "【句型】team sport = 團隊運動（需要多人一起進行的運動）。\n【分析】後句 you cannot play it by yourself（無法一個人玩）→ 是需要隊友的「團隊」運動。\n【其他選項】(B) popular 受歡迎的、(C) funny 好笑的、(D) boring 無聊的，都無法解釋「不能一個人玩」。\n【例句】Basketball is a team sport, but swimming is not.", "explanationSource": "source"}, {"id": 230, "question": "You need eleven players to play baseball because it is a ______ sport.", "options": ["dangerous", "team", "cheap", "quiet"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 229 題）", "explanation": "需要十一個人 → 團隊運動 team sport。", "explanationSource": "supplemental"}, {"id": 231, "question": "Ken likes running because he can do it ______. He doesn't need anyone else.", "options": ["by himself", "with a team", "in a group", "for others"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 229 題）", "explanation": "不需要別人 → 自己一個人 by himself。", "explanationSource": "supplemental"}, {"id": 232, "question": "Our class has a volleyball ______, and we practice together every Fri
