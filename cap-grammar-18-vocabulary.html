day.", "options": ["game", "ball", "team", "player"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 229 題）", "explanation": "一起練習的團體 → team 隊伍。", "explanationSource": "supplemental"}, {"id": 233, "question": "Our teacher ______ the old lessons before starting a new one.", "options": ["reviewed", "noticed", "previewed", "remembered"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜review 複習", "explanation": "【句型】review = 複習（舊的）；preview = 預習（新的）。\n【分析】the old lessons（舊課）+ before starting a new one（開始新課前）→ 先複習舊課，用 reviewed。\n【其他選項】(B) noticed 注意到，語意不合；(C) previewed 預習，對象應是新課；(D) remembered 記得，老師「記得舊課」不合理。\n【例句】I review my notes every night before the test.", "explanationSource": "source"}, {"id": 234, "question": "Before the final exam, Joy ______ all the words she learned this term.", "options": ["previewed", "reviewed", "noticed", "invited"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 233 題）", "explanation": "考前把學過的單字再看一次 → 複習 reviewed。", "explanationSource": "supplemental"}, {"id": 235, "question": "It's a good idea to ______ the next lesson so you know what the teacher will talk about tomorrow.", "options": ["preview", "review", "repeat", "return"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 233 題）", "explanation": "明天要上的新課 → 預習 preview。", "explanationSource": "supplemental"}, {"id": 236, "question": "Mr. Chen asked us to ______ Units 1 to 3 again because the test is on Monday.", "options": ["notice", "forget", "review", "preview"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 233 題）", "explanation": "Units 1–3 已學過且要考試 → 複習 review。", "explanationSource": "supplemental"}, {"id": 237, "question": "[圖：學校操場上，幾位學生正在運動：兩人在打羽毛球、一人在跳繩，另有幾位學生坐在長椅上休息；正在運動的三位學生都戴著眼鏡]\nLook at the picture. All of the students who are exercising are wearing ______.", "options": ["caps", "glasses", "jackets", "pants"], "answer": 1, "answerLabel": "B", "source": "115會考｜看圖選字：衣著配件 glasses", "explanation": "【句型】wear + 衣物／配件（戴著、穿著）；看圖找出「所有正在運動的學生」的共同點。\n【分析】線索 All of the students who are exercising：圖中打羽毛球、跳繩的學生都戴著眼鏡，故選 glasses（眼鏡）。\n【其他選項】(A) caps 帽子、(C) jackets 夾克、(D) pants 長褲：並非每位運動中的學生都有穿戴，不是共同點。\n【例句】My grandpa wears glasses when he reads the newspaper.", "explanationSource": "source"}, {"id": 238, "question": "[圖：三個小孩在雪地裡堆雪人，每個人都戴著手套，只有一人戴帽子]\nLook at the picture. All of the kids who are making the snowman are wearing ______.", "options": ["hats", "gloves", "shorts", "sunglasses"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 237 題）", "explanation": "三個堆雪人的小孩都戴手套，只有一人戴帽子，故選 gloves。", "explanationSource": "supplemental"}, {"id": 239, "question": "[圖：公園裡四個人在跑步，四人都穿著短褲，其中兩人戴帽子]\nLook at the picture. Everyone who is running in the park is wearing ______.", "options": ["caps", "jackets", "shorts", "scarves"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 237 題）", "explanation": "四位跑者共同穿著短褲；帽子只有兩人戴，故選 shorts。", "explanationSource": "supplemental"}, {"id": 240, "question": "[圖：教室裡有五位學生，坐著寫字的三位學生都戴著口罩，站著的兩位沒有]\nLook at the picture. All of the students who are sitting and writing are wearing ______.", "options": ["masks", "glasses", "coats", "boots"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 237 題）", "explanation": "坐著寫字的學生共同點是戴口罩，故選 masks。", "explanationSource": "supplemental"}, {"id": 241, "question": "Rita ______ her dogs many times a day. That's why they're too fat.", "options": ["feeds", "kisses", "walks", "washes"], "answer": 0, "answerLabel": "A", "source": "115會考｜動詞辨義 feed（餵食）", "explanation": "【句型】feed + 動物（餵食）；由後句結果推回原因。\n【分析】線索 That's why they're too fat：狗太胖是因為一天被餵很多次，故選 feeds（餵食）。\n【其他選項】(B) kisses 親吻、(D) washes 幫…洗澡：與變胖無關；(C) walks 遛（狗）：反而會讓狗消耗熱量變瘦。\n【例句】Please feed the fish before you go to school.", "explanationSource": "source"}, {"id": 242, "question": "Ben forgot to ______ his plants for two weeks, so they all died.", "options": ["water", "feed", "plant", "cut"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 241 題）", "explanation": "植物兩週沒澆水而枯死，water 當動詞為「澆水」。", "explanationSource": "supplemental"}, {"id": 243, "question": "My cat looks thin. Maybe we should ______ her more food every day.", "options": ["take", "give", "bring", "make"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 241 題）", "explanation": "give + 人／動物 + 東西：給牠更多食物。", "explanationSource": "supplemental"}, {"id": 244, "question": "Mr. Lin ______ his dog in the park every evening, so the dog is very healthy.", "options": ["feeds", "washes", "walks", "kisses"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 241 題）", "explanation": "每晚在公園「遛狗」讓狗健康，walk the dog 為遛狗。", "explanationSource": "supplemental"}, {"id": 245, "question": "You can ask Sophia anything about butterflies and bees. She has great ______ of insects.", "options": ["chances", "knowledge", "news", "power"], "answer": 1, "answerLabel": "B", "source": "115會考｜名詞辨義 knowledge（have great knowledge of）", "explanation": "【句型】have (great) knowledge of + 名詞：對……有豐富的知識。\n【分析】線索 You can ask Sophia anything about butterflies and bees：什麼都能問她，表示她對昆蟲懂很多，故選 knowledge（知識）。\n【其他選項】(A) chances 機會、(C) news 新聞／消息、(D) power 力量：都不能表達「懂得很多」，語意不合。\n【例句】Mr. Wang has great knowledge of Taiwanese history.", "explanationSource": "source"}, {"id": 246, "question": "Amy has read many books about stars. She has a lot of ______ about space.", "options": ["knowledge", "weather", "money", "noise"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 245 題）", "explanation": "讀了很多星星的書，對太空有很多「知識」。", "explanationSource": "supplemental"}, {"id": 247, "question": "If you have any ______ about the homework, you can ask Ms. Chen after class.", "options": ["answers", "questions", "stories", "colors"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 245 題）", "explanation": "對作業有「問題」可以下課問老師。", "explanationSource": "supplemental"}, {"id": 248, "question": "Kevin can fix almost any computer. He has great ______ in this area.", "options": ["luck", "pain", "skill", "fear"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 245 題）", "explanation": "什麼電腦都能修，表示他在這方面很有「技術」。", "explanationSource": "supplemental"}, {"id": 249, "question": "Adam slept ______ last night because he kept waking up from bad dreams.", "options": ["deeply", "early", "terribly", "quickly"], "answer": 2, "answerLabel": "C", "source": "115會考｜副詞辨義 terribly（睡得很糟）", "explanation": "【句型】一般動詞 + 情態副詞（修飾動作的方式）：sleep well / badly / terribly。\n【分析】線索 kept waking up from bad dreams：一直從惡夢中驚醒，表示睡得很糟，故選 terribly（很糟地）。\n【其他選項】(A) deeply 熟睡地：與一直驚醒矛盾；(B) early 早地：與惡夢無因果關係；(D) quickly 很快地：sleep quickly 不合語意。\n【例句】Lily sang terribly because she had a bad cold.", "explanationSource": "source"}, {"id": 250, "question": "The baby slept ______ after drinking her milk. She didn't wake up until morning.", "options": ["badly", "deeply", "loudly", "late"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 249 題）", "explanation": "直到早上才醒，表示「熟睡地」。", "explanationSource": "supplemental"}, {"id": 251, "question": "Jason did ______ on the math test because he didn't study at all.", "options": ["poorly", "carefully", "happily", "well"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 249 題）", "explanation": "完全沒讀書，所以考得「很差」。", "explanationSource": "supplemental"}, {"id": 252, "question": "The old man walked ______ because his leg hurt.", "options": ["quickly", "proudly", "slowly", "quietly"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 249 題）", "explanation": "腳痛所以走得「很慢」。", "explanationSource": "supplemental"}, {"id": 253, "question": "Tara enjoys being with all kinds of animals; she even ______ a snake as a pet.", "options": ["drops", "gives", "keeps", "makes"], "answer": 2, "answerLabel": "C", "source": "115會考｜keep + 動物 + as a pet（飼養）", "explanation": "【句型】keep + 動物 + as a pet：把……當寵物飼養。\n【分析】線索 enjoys being with all kinds of animals、even：喜歡各種動物，甚至「養」了一條蛇當寵物，故選 keeps。\n【其他選項】(A) drops 掉落、(B) gives 給予、(D) makes 製作：都無法和 as a pet 搭配表示飼養。\n【例句】My cousin keeps two rabbits as pets.", "explanationSource": "source"}, {"id": 254, "question": "Lisa ______ a turtle as a pet because it is quiet and easy to take care of.", "options": ["keeps", "takes", "finds", "feels"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 253 題）", "explanation": "keep ... as a pet 為「飼養當寵物」。", "explanationSource": "supplemental"}, {"id": 255, "question": "Our apartment is too small, so we can't ______ a big dog.", "options": ["make", "have", "give", "drop"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 253 題）", "explanation": "have a dog 也可表示「養狗」；公寓太小養不了大狗。", "explanationSource": "supplemental"}, {"id": 256, "question": "Tom wants to ______ care of the stray cat until it finds a new home.", "options": ["keep", "get", "take", "look"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 253 題）", "explanation": "take care of 為固定片語「照顧」。", "explanationSource": "supplemental"}, {"id": 257, "question": "After four hours of mountain climbing, Rosa's legs got ______, so she took a rest on the top of the mountain.", "options": ["dirty", "sick", "sore", "strong"], "answer": 2, "answerLabel": "C", "source": "115會考｜形容詞辨義 sore（痠痛的）＋連綴動詞 get", "explanation": "【句型】連綴動詞 get + 形容詞（變得……）；sore 痠痛的。\n【分析】線索 four hours of mountain climbing、took a rest：爬了四小時山，腿變得痠痛所以休息，故選 sore。\n【其他選項】(A) dirty 髒的：不需因此休息；(B) sick 生病的：通常形容人，不形容腿；(D) strong 強壯的：腿變強壯不會需要休息，因果不合。\n【例句】My arms got sore after I moved all the boxes.", "explanationSource": "source"}, {"id": 258, "question": "I talked for three hours at the party, and now my throat is ______.", "options": ["sore", "wet", "cheap", "empty"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 257 題）", "explanation": "講話太久喉嚨「痛」，sore throat 喉嚨痛。", "explanationSource": "supplemental"}, {"id": 259, "question": "After the long trip, everyone got ______ and went to bed early.", "options": ["hungry", "tired", "rich", "loud"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 257 題）", "explanation": "長途旅行後大家「累了」所以早睡。", "explanationSource": "supplemental"}, {"id": 260, "question": "Andy ate too much ice cream, and his stomach began to ______.", "options": ["smell", "laugh", "hurt", "sleep"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 257 題）", "explanation": "吃太多冰淇淋肚子開始「痛」。", "explanationSource": "supplemental"}, {"id": 261, "question": "Joe is happy he is not at the ______ of the class now. His grades are better than half of his classmates' this school year.", "options": ["side", "front", "center", "bottom"], "answer": 3, "answerLabel": "D", "source": "115會考｜名詞辨義 bottom（at the bottom of the class 班上墊底）", "explanation": "【句型】at the bottom of the class：在班上墊底；at the top of the class：班上頂尖。\n【分析】線索 His grades are better than half of his classmates'：成績贏過一半同學，表示不再是「墊底」，所以很開心 → bottom。\n【其他選項】(A) side 旁邊、(B) front 前面、(C) center 中間：都只是位置，無法表達成績排名的高低，語意不合。\n【例句】Mia studied hard and is now at the top of her class.", "explanationSource": "source"}, {"id": 262, "question": "Wendy got the highest score on every test. She is at the ______ of her class.", "options": ["top", "bottom", "side", "back"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 261 題）", "explanation": "每次考最高分 → 班上頂尖 at the top。", "explanationSource": "supplemental"}, {"id": 263, "question": "The ball rolled down the hill and stopped at the ______ of it.", "options": ["top", "bottom", "middle", "front"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 261 題）", "explanation": "球滾下山停在山「底」。", "explanationSource": "supplemental"}, {"id": 264, "question": "Sam was last in the race, but he was happy he finished it. He came in ______.", "options": ["first", "second", "last", "early"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 261 題）", "explanation": "比賽最後一名 came in last。", "explanationSource": "supplemental"}, {"id": 265, "question": "On windy days, the flowers in my garden ______ like shy children with their heads down.", "options": ["bow", "fall", "rise", "smell"], "answer": 0, "answerLabel": "A", "source": "115會考｜動詞辨義 bow（低頭、鞠躬）", "explanation": "【句型】bow：彎腰、低頭、鞠躬；本句用 like 把花比喻成低頭的害羞小孩。\n【分析】線索 like shy children with their heads down：風吹時花「低著頭」像害羞小孩，故選 bow。\n【其他選項】(B) fall 掉落／跌倒：不是低頭的樣子；(C) rise 上升：與 heads down 相反；(D) smell 聞起來：與低頭動作無關。\n【例句】The students bowed to their teacher at the end of the class.", "explanationSource": "source"}, {"id": 266, "question": "In Japan, people often ______ to say hello or thank you.", "options": ["bow", "shout", "cry", "jump"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 265 題）", "explanation": "日本人打招呼或道謝時常「鞠躬」。", "explanationSource": "supplemental"}, {"id": 267, "question": "In fall, the leaves turn yellow and ______ from the trees.", "options": ["rise", "fall", "grow", "bow"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 265 題）", "explanation": "秋天葉子變黃從樹上「掉落」。", "explanationSource": "supplemental"}, {"id": 268, "question": "Every morning, the sun ______ in the east.", "options": ["sets", "falls", "rises", "bows"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 265 題）", "explanation": "太陽從東方「升起」用 rises。", "explanationSource": "supplemental"}]};</script><script src="longteng-b1u5-quiz.js?v=20261027-2"></script><script>document.querySelector("#description").textContent="共 268 題（會考歷屆 67 題＋類似題 201 題）｜選答後顯示中文解析｜答錯可重做並下載錯題";</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
