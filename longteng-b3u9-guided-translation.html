<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="龍騰普高 B3U9 引導式翻譯互動練習"><title>龍騰普高 B3U9 引導式翻譯</title><style>:root{--blue:#2563eb;--navy:#1e3a8a;--bg:#f4f7fb;--card:#fff;--line:#dbe3ee;--ink:#172033;--muted:#64748b;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--voice:#6d28d9;--voicebg:#f5f3ff;--amber:#9a3412;--amberbg:#fff7ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}.wrap{max-width:920px;margin:auto;padding:16px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 5px 18px #0f172a0d}.hero{background:linear-gradient(135deg,#e8f1ff,#fff)}h1{margin:0 0 6px;font-size:clamp(25px,4vw,38px)}h2{margin-top:0}.note{color:var(--muted)}.hidden{display:none!important}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.btn{border:0;border-radius:10px;padding:11px 17px;font:800 16px inherit;cursor:pointer;background:#e5e7eb;color:var(--ink);text-decoration:none}.primary{background:var(--blue);color:#fff}.danger{background:#991b1b;color:#fff}.voice{background:var(--voice);color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.btn:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.pick{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin:7px 0;background:#fafcff}.pick input{margin-right:8px;width:17px;height:17px;accent-color:var(--blue)}#list{max-height:440px;overflow:auto;border:1px solid var(--line);padding:7px;border-radius:12px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:800;margin:8px 0 14px}.zh{padding:10px 13px;background:var(--amberbg);border-radius:9px;color:var(--amber);font-weight:800;margin-bottom:10px}.question{font-size:21px;font-weight:750;padding:16px;background:#f8fafc;border-radius:11px;white-space:pre-wrap}.options{display:grid;gap:9px;margin:14px 0}.option{display:flex;align-items:center;gap:11px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-size:18px;font-weight:750;cursor:pointer}.option:hover{border-color:#60a5fa;background:#eff6ff}.option:has(input:checked){border-color:var(--blue);background:#dbeafe;color:var(--navy)}.option input{width:20px;height:20px;accent-color:var(--blue)}.inputs{display:grid;gap:10px;margin:15px 0}.answer-row{display:grid;grid-template-columns:55px 1fr;gap:10px;align-items:center}.answer-row label{font-weight:900;color:var(--navy);text-align:center}.spell{width:100%;font:inherit;font-size:18px;padding:11px;border:2px solid #94a3b8;border-radius:9px}.feedback{padding:13px;border-radius:10px;font-weight:800;margin:13px 0}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.explain{font-weight:500;margin-top:7px}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:var(--voicebg);margin:13px 0}.voicebox b{display:block;font-size:19px;margin-bottom:8px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}.wrong p{margin:6px 0}.source{font-size:13px;color:var(--muted)}@media(max-width:600px){.wrap{padding:9px}.hero,.card{padding:15px}.question{font-size:18px;padding:13px}.option{font-size:17px}.answer-row{grid-template-columns:42px 1fr}.meta{display:block}}</style><link rel="stylesheet" href="longteng-vocab-required-pronunciation.css?v=20261026-4"></head><body><main class="wrap"><section class="hero"><h1>龍騰普高 B3U9 引導式翻譯</h1><p>共 39 題。可自行選題、隨機抽題；答錯後請重新作答。</p><p class="note">答對後顯示來源解析並播放完整英文句；STT 朗讀達 80% 才能進入下一題。完成後可重做錯題並下載 DOCX。</p><div class="toolbar"><a class="btn" href="dashboard.html">← 回測驗總覽</a></div></section><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn">全部選取</button><button id="none" class="btn">全部取消</button><button id="rand20" class="btn">隨機 20 題</button></div><label><input id="shuffle" type="checkbox"> 打亂出題順序</label><div id="list"></div><div class="actions"><button id="start" class="btn primary">開始作答</button><span id="picked" class="note"></span></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="voiceBox" class="voicebox hidden"><b id="voiceTarget"></b><button id="speak" class="btn voice">🔊 再聽一次</button></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="retry" class="btn primary">只重做錯題</button><button id="download" class="btn">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></main><script>const TITLE="龍騰普高 B3U9 引導式翻譯",MODE="multi",Q=[{"id":1,"zh":"Iris對動物的毛過敏，所以她很少會想要養寵物。","question":"Iris is allergic to animal fur, so ①r____________ ②____________ ③____________ ④____________ about getting a pet.","answers":["rarely","does","she","think"],"explanation":"","source":"三合一學習手冊"},{"id":2,"zh":"違反交通規則是Vita最不可能做的事。","question":"①B____________ ②____________ ③____________ ④____________ the last thing that Vita would do.","answers":["Breaking","traffic","rules","is"],"explanation":"","source":"三合一學習手冊"},{"id":3,"zh":"我的老闆正試圖擴展業務。","question":"My boss ①____________ ②____________ ③____________ expand his business.","answers":["is","looking","to"],"explanation":"","source":"三合一學習手冊"},{"id":4,"zh":"世界各地的生態系統正以各式各樣的方式被破壞。","question":"Ecological systems around the world are being destroyed in ①____________ ②m____________ ③____________ ways.","answers":["all","manner","of"],"explanation":"","source":"三合一學習手冊"},{"id":5,"zh":"禮拜天晚上你可以看到很多人在高鐵站正為他們的家人送行。","question":"You can see many people ①____________ their family members ②____________ at the HSR station on Sunday nights.","answers":["sending","off"],"explanation":"","source":"三合一學習手冊"},{"id":6,"zh":"英國清教徒們於1620年九月十六號，乘坐五月花號出發前往新大陸。","question":"The English Pilgrims ①____________ ②o____________t for the New World aboard the Mayflower on September 16, 1620.","answers":["set","out"],"explanation":"set out 出發","source":"龍騰自命題"},{"id":7,"zh":"那家量販店在週年慶期間促銷各種商品。","question":"That hypermarket promotes ①____________ ②m____________ ③____________ items during its anniversary sale.","answers":["all","manner","of"],"explanation":"all manner of 各式各樣的","source":"龍騰自命題"},{"id":8,"zh":"其他客人十分鐘後會到。在這期間，就讓我們喝點咖啡吧。","question":"The other guests will be here in ten minutes. ①____________ ②____________ ③m____________me, let’s have some coffee.","answers":["In","the","meantime"],"explanation":"in the meantime 期間","source":"龍騰自命題"},{"id":9,"zh":"為了出國念書，Susan試圖申請那份獎學金。","question":"Susan ①____________ ②l____________ ③____________ apply for the scholarship in order to study abroad.","answers":["is","looking","to"],"explanation":"be looking to 試圖","source":"龍騰自命題"},{"id":10,"zh":"在出發徒步橫越這片廣大無垠的沙漠前，你必須準備很久。","question":"You must prepare for a long time before ①____________ ②o____________t to cross this vast desert on foot.","answers":["setting","out"],"explanation":"set out 出發，接在介系詞before之後，動詞set須改為setting。","source":"龍騰自命題"},{"id":11,"zh":"這家百貨公司週年慶期間，有各式各樣的折扣商品供你選擇。","question":"There are ①____________ ②m____________ ③____________ discounted items for you to choose from during the department store’s anniversary sale.","answers":["all","manner","of"],"explanation":"all manner of 各式各樣的","source":"龍騰自命題"},{"id":12,"zh":"Eric今天早上八點搭飛機前往倫敦出差了。","question":"Eric ①____________ ②o____________t ③____________ London on a business trip by plane at 8:00 a.m. this morning.","answers":["set","out","for"],"explanation":"set out for + N 前往……","source":"龍騰自命題"},{"id":13,"zh":"Nancy的新筆電下週一才會到。在這期間，她將使用她弟弟的電腦寫作業。","question":"Nancy’s new laptop won’t arrive until next Monday. ①____________ ②____________ ③m____________me, she will use her brother’s computer to do her homework.","answers":["In","the","meantime"],"explanation":"in the meantime 期間","source":"龍騰自命題"},{"id":14,"zh":"享受過這家人三晚的熱情款待之後，這位朝聖者再度出發前往他的最終目的地。","question":"After enjoying the family’s hospitality for three nights, the pilgrim ①____________ ②____________ again for his final destination.","answers":["set","out"],"explanation":"","source":"課本例句填空"},{"id":15,"zh":"我稍後要出去買些日常用品。在此同時，你可以幫忙完成這些家事。","question":"I am going out to do some grocery shopping later. ①____________ ②____________ ③____________, you can help finish the chores.","answers":["In","the","meantime"],"explanation":"","source":"課本例句填空"},{"id":16,"zh":"當遊客在夜市裡來回漫步時，他們大快朵頤各式各樣的美味當地點心。","question":"As the visitors strolled up and down the night market, they feasted on ①____________ ②____________ ③____________ delicious local snacks.","answers":["all","manner","of"],"explanation":"","source":"課本例句填空"},{"id":17,"zh":"我在歐洲各地自助旅行時，碰到各式各樣有趣的人。","question":"I encountered ①____________ ②m____________ ③____________ interesting people while backpacking around Europe.","answers":["all","manner","of"],"explanation":"","source":"習作簿"},{"id":18,"zh":"我將為我們兩個煮晚餐。這期間，你可以放輕鬆和看電視就好。","question":"I’ll cook dinner for the two of us. ①____________ ②____________ ③____________, you can just relax and watch television.","answers":["In","the","meantime"],"explanation":"","source":"習作簿"},{"id":19,"zh":"這個生意人正試圖為他最近的計畫找投資者，那將需要大筆的金錢。","question":"The businessman ①____________ ②l____________ ③____________ find investors for his latest project, which will require a large sum of money.","answers":["is","looking","to"],"explanation":"","source":"習作簿"},{"id":20,"zh":"今天我們聚在這裡是為了要替我們最好的朋友Tom送行和祝福。","question":"We are gathered here today to ①____________ ②____________ our best friend Tom and give him our best wishes.","answers":["send","off"],"explanation":"","source":"All in One"},{"id":21,"zh":"Tina過去四年在學校非常努力並以優異成績畢業。同時，她也兼職工作來維持生計。 Tina worked hard in school for the past four years and graduated with honors.","question":"①____________ ②____________ ③____________, she took part-time jobs to earn her living.","answers":["In","the","meantime"],"explanation":"","source":"All in One"},{"id":22,"zh":"智慧型手機的銷售在國內市場一直在衰退，許多本地手機商正試圖開拓海外市場以提升銷售量。","question":"Smartphone sales in the domestic market have been declining, and many local phone vendors ①____________ ②____________ ③____________ explore overseas markets to boost their sales.","answers":["are","looking","to"],"explanation":"","source":"All in One"},{"id":23,"zh":"我的孩子跟我在他中學畢業後要出發前往法國旅遊。","question":"My child and I are ①____________ ②____________ on a journey to France after he graduates from high school.","answers":["setting","out"],"explanation":"","source":"三合一學習手冊"},{"id":24,"zh":"老師正在幫我們準備學習單。在這期間，讓我們來讀一下這篇文章的前兩段。","question":"The teacher is preparing the worksheets for us. ①____________ ②____________ ③____________, let’s read the first two paragraphs of the article.","answers":["In","the","meantime"],"explanation":"","source":"三合一學習手冊"},{"id":25,"zh":"世上的每個人至少都有些關心這個病毒，這麼說一點也不誇張。","question":"①____________ ②____________ ③____________ ④____________ ⑤____________ ⑥____________ that every person in the world is at least somewhat concerned about the virus.","answers":["It","is","no","exaggeration","to","say"],"explanation":"","source":"三合一學習手冊"},{"id":26,"zh":"當Harold踏上獨自橫跨歐洲的旅程時，他全家人都到機場為他送行。","question":"When Harold set out on a trip across Europe alone, his whole family came to the airport to ①____________ him ②____________.","answers":["send","off"],"explanation":"","source":"課本例句填空"},{"id":27,"zh":"Ryder多年來一直試圖開設他自己的公司，而今年他的夢想終於實現。","question":"Ryder had ①____________ ②____________ ③____________ open his own company for years, and this year his dream finally came true.","answers":["been","looking","to"],"explanation":"","source":"課本例句填空"},{"id":28,"zh":"Angela前往臺北念大學時，她全家人都到火車站為她送行。","question":"When Angela departed to Taipei for college, her whole family ①s____________t her ②____________ at the train station.","answers":["sent","off"],"explanation":"send off 送行","source":"龍騰自命題"},{"id":29,"zh":"說這位導演的電影與眾不同並不為過。","question":"It is ①____________ ②____________ ③____________ to say that this director’s movies are like no others.","answers":["not","too","much"],"explanation":"It is not too much to say that….表「說……並不為過」","source":"龍騰自命題"},{"id":30,"zh":"說我們現在收看的大多數電視節目都有置入品牌並不為過。","question":"①____________ ②____________ ③____________ ④____________ to say that most TV programs we watch today have brands “placed” in them.","answers":["It","is","no","exaggeration"],"explanation":"It is no exaggeration to say that….表「說……並不為過」。","source":"龍騰自命題"},{"id":31,"zh":"說全球暖化正影響地球上所有生物並不為過。","question":"①____________ ②____________ ③____________ ④____________ ⑤____________ to say that global warming is affecting all living things on Earth.","answers":["It","is","not","too","much"],"explanation":"It is not too much to say that….表「說……並不為過」。","source":"龍騰自命題"},{"id":32,"zh":"Jeremy很少獨享自己的點心，因為他總是將之與同學們分享。","question":"①S____________ ②____________ Jeremy enjoy his snacks alone, for he is always sharing them with his classmates.","answers":["Seldom","does"],"explanation":"否定副詞seldom置於句首時，該子句須倒裝，此句為現在簡單式，故於主詞Jeremy前加助動詞does。","source":"龍騰自命題"},{"id":33,"zh":"你很難想像整個馬拉松沿途的旁觀者多麼大聲地為跑者吶喊、加油的情景。","question":"①H____________ ②____________ you imagine how loudly the bystanders were shouting and cheering for the runners along the route of the marathon.","answers":["Hardly","can"],"explanation":"否定副詞hardly置於句首時，該子句須倒裝，故將助動詞can移至主詞you之前。","source":"龍騰自命題"},{"id":34,"zh":"鑒於香港動盪不安，許多外國企業紛紛企圖關閉他們在那裡的分公司。","question":"With Hong Kong in nonstop chaos, many foreign enterprises ①____________ ②l____________ ③____________ ④____________ down their branches there.","answers":["are","looking","to","shut"],"explanation":"be looking to + VR 試圖……","source":"龍騰自命題"},{"id":35,"zh":"試圖克服他對公開演講的恐懼，那位學者從不拒絕任何演講的機會。","question":"①L____________ ②____________ ③____________ his fear of public speaking, ④____________ ⑤____________ the academic turn down a chance to give a speech.","answers":["Looking","to","overcome","never","did"],"explanation":"be looking to + VR 試圖……，此處為分詞構句，故省略be動詞；否定副詞never置於主要子句句首時，該子句須倒裝，故於主詞the academic前加助動詞did。","source":"龍騰自命題"},{"id":36,"zh":"一群醫學專家已經出發到疫區，試圖調查病毒的來源。","question":"A group of medical experts has ①____________ ②o____________t ③____________ the epidemic zone, ④l____________ ⑤____________ investigate the origins of the virus.","answers":["set","out","for","looking","to"],"explanation":"set out for + N 前往……；be looking to 試圖，此處為分詞構句，故省略be動詞。","source":"龍騰自命題"},{"id":37,"zh":"Brown夫婦去機場為他們的大女兒送行，她要到澳洲打工度假。在此同時，他們付錢請一個保母來照顧小兒子。","question":"Mr. and Mrs. Browns went to the airport to ①s____________t ②____________ their eldest daughter, who was going on a working holiday in Australia. ③____________ ④____________ ⑤m____________me, they paid a babysitter to take care of their little boy.","answers":["send","off","In","the","meantime"],"explanation":"send off 送行；in the meantime 同時","source":"龍騰自命題"},{"id":38,"zh":"在秘魯的村莊待了十天後，當地人送Lisa離開。","question":"Lisa was ①s____________t ②____________ by the locals after staying in their village in Peru for ten days.","answers":["sent","off"],"explanation":"send off 送行","source":"龍騰自命題"},{"id":39,"zh":"說在這個夜市可以吃到來自全世界各式各樣的美食並不為過。","question":"It is ①____________ ②____________ to say that one can eat ③____________ ④m____________ ⑤____________ cuisines from around the world at this night market.","answers":["no","exaggeration","all","manner","of"],"explanation":"It is no exaggeration to say that.... 說……並不為過；all manner of 各式各樣的","source":"龍騰自命題"}];const $=s=>document.querySelector(s),list=$('#list'),select=$('#select'),quiz=$('#quiz'),result=$('#result'),question=$('#question'),answerArea=$('#answerArea'),feedback=$('#feedback'),next=$('#next');let chosen=[],idx=0,mode='first';const wrong=new Map(),correct=new Set();const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ');const shuffled=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function renderList(){list.innerHTML=Q.map(q=>'<label class="pick"><input class="pickbox" type="checkbox" value="'+q.id+'" checked><b>第 '+q.id+' 題</b> <span class="source">'+esc(q.source||'')+'</span></label>').join('');count()}function count(){$('#picked').textContent='已選 '+document.querySelectorAll('.pickbox:checked').length+' 題'}list.addEventListener('change',count);$('#all').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=true);count()};$('#none').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=false);count()};$('#rand20').onclick=()=>{let ids=new Set(shuffled(Q).slice(0,Math.min(20,Q.length)).map(q=>q.id));document.querySelectorAll('.pickbox').forEach(x=>x.checked=ids.has(+x.value));count()};$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));if($('#shuffle').checked)chosen=shuffled(chosen);idx=0;mode='first';wrong.clear();correct.clear();select.classList.add('hidden');result.classList.add('hidden');q
