<script>window.QUIZ_CONFIG={"title": "國中會考文法歷屆試題｜形容詞、比較級最高級、副詞", "mode": "mcq", "questions": [{"id": 1, "question": "For Mike, the price is ______ important thing when he shops for jeans. He cares even more about the shape and the size of the pockets.", "options": ["the more", "the most", "the less", "the least"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜the least + 形容詞（最不……）", "explanation": "【句型】the least + 形容詞 = 最不……（最高級的相反）。\n【分析】後句 He cares even more about the shape and the size（更在意款式和口袋大小）→ 價格是「最不重要」的事 → the least important。\n【其他選項】(A)(C) the more / the less 為比較級，不用在 the ___ thing 這種三者以上的最高級句中；(B) the most important 與後句「更在意別的」矛盾。\n【例句】For me, math is the least interesting subject.", "explanationSource": "source"}, {"id": 2, "question": "Ben never studies for tests. For him, grades are the ______ important thing in school.", "options": ["less", "least", "more", "most"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 1 題）", "explanation": "從不讀書 → 成績最不重要 → least。", "explanationSource": "supplemental"}, {"id": 3, "question": "This is the ______ expensive phone in the store; it costs only NT$2,000.", "options": ["least", "most", "more", "less"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 1 題）", "explanation": "只要兩千元 → 最便宜（最不貴）→ least。", "explanationSource": "supplemental"}, {"id": 4, "question": "Of all the sports, swimming is the ______ popular one in my class. Almost everyone loves it.", "options": ["least", "less", "most", "more"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 1 題）", "explanation": "幾乎人人都愛 → 最受歡迎 → most。", "explanationSource": "supplemental"}, {"id": 5, "question": "My daughter is much ______ now. The pants she wore last year are already too short for her.", "options": ["higher", "longer", "older", "taller"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜much + 比較級；tall 描述人身高", "explanation": "【句型】much + 比較級（……得多）；人的身高用 tall/taller。\n【分析】去年的褲子現在太短了 → 女兒長高了很多 → much taller。\n【其他選項】(A) higher 多用於物體離地高度，不用來說人長高；(B) longer 描述長度，不用於人；(C) older 雖然一年後確實變老，但不能解釋褲子變短的原因。\n【例句】Tom is much taller than his little brother.", "explanationSource": "source"}, {"id": 6, "question": "Jason grew a lot last year. He is much ______ than his father now.", "options": ["higher", "taller", "longer", "older"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 5 題）", "explanation": "人長高 → taller。", "explanationSource": "supplemental"}, {"id": 7, "question": "The kite flew ______ and ______ into the sky.", "options": ["taller; taller", "longer; longer", "higher; higher", "bigger; bigger"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 5 題）", "explanation": "物體離地越來越高 → higher and higher。", "explanationSource": "supplemental"}, {"id": 8, "question": "Your hair is much ______ now. Do you want a haircut?", "options": ["taller", "longer", "higher", "older"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 5 題）", "explanation": "頭髮變長 → longer。", "explanationSource": "supplemental"}, {"id": 9, "question": "The jacket is ______ than the dress or the pants.", "options": ["expensive", "very expensive", "more expensive", "the most expensive"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜比較級 more + 形容詞 + than", "explanation": "【句型】A + be + 比較級 + than + B；多音節形容詞用 more + adj.。\n【分析】句中有 than → 用比較級 more expensive。\n【其他選項】(A) 原級不可接 than；(B) very 修飾原級，不能接 than；(D) 最高級不能與 than 連用。\n【例句】This book is more interesting than that one.", "explanationSource": "source"}, {"id": 10, "question": "Riding a bike is ______ than driving a car for the earth.", "options": ["good", "better", "best", "the best"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 9 題）", "explanation": "有 than → 比較級，good 的比較級為 better。", "explanationSource": "supplemental"}, {"id": 11, "question": "This question is ______ than the last one. I can't answer it.", "options": ["more difficult", "difficult", "the most difficult", "very difficult"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 9 題）", "explanation": "有 than → more difficult。", "explanationSource": "supplemental"}, {"id": 12, "question": "Of all the dishes on the menu, the beef noodles are ______.", "options": ["more popular", "popular than", "the most popular", "very popular than"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 9 題）", "explanation": "Of all（在所有之中）→ 最高級。", "explanationSource": "supplemental"}, {"id": 13, "question": "This restaurant sells the best steak in Taipei; you can't find ______ steak in the city.", "options": ["delicious", "more delicious", "the most delicious", "deliciously"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜否定 + 比較級 = 最高級", "explanation": "【句型】否定詞 + 比較級（can't find more…）= 表達最高級意思「找不到更……的」。\n【分析】前句說這家是台北最好吃的牛排 → 在城裡找不到「更好吃的」牛排 → more delicious（隱含 than this）。\n【其他選項】(A) 說「找不到好吃的牛排」與前句矛盾；(C) 說「找不到最好吃的」也與前句矛盾；(D) deliciously 為副詞，不能修飾名詞 steak。\n【例句】Nobody in my class runs faster than Eric.", "explanationSource": "source"}, {"id": 14, "question": "Grace is the smartest girl in our school. No one is ______ than she is.", "options": ["smart", "smarter", "smartest", "the smartest"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 13 題）", "explanation": "No one + 比較級 = 最高級語意 → smarter。", "explanationSource": "supplemental"}, {"id": 15, "question": "This is the best day of my life. I have never felt ______.", "options": ["happy", "happiest", "happier", "the happiest"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 13 題）", "explanation": "never + 比較級（從沒更快樂過）→ happier。", "explanationSource": "supplemental"}, {"id": 16, "question": "Mount Jade is ______ than any other mountain in Taiwan.", "options": ["higher", "high", "highest", "the highest"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 13 題）", "explanation": "比較級 + than any other + 單數名詞 = 最高級語意。", "explanationSource": "supplemental"}, {"id": 17, "question": "Young boys really grow fast. Both my sons are already ______ than I am.", "options": ["tall", "taller", "tallest", "the tallest"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜比較級 + than", "explanation": "【句型】A + be + 形容詞比較級(-er) + than + B。\n【分析】句中有 than I am → 用比較級 taller。\n【其他選項】(A) 原級不可接 than；(C)(D) 最高級不能與 than 連用。\n【例句】My cat is heavier than my dog.", "explanationSource": "source"}, {"id": 18, "question": "Today is ______ than yesterday. Let's turn on the air conditioner.", "options": ["hot", "hotter", "hottest", "the hottest"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 17 題）", "explanation": "有 than → hotter（雙寫 t）。", "explanationSource": "supplemental"}, {"id": 19, "question": "Amy's room is ______ than mine. She cleans it every day.", "options": ["clean", "cleanest", "the cleanest", "cleaner"], "answer": 3, "answerLabel": "D", "source": "類似題 2（對應第 17 題）", "explanation": "有 than → cleaner。", "explanationSource": "supplemental"}, {"id": 20, "question": "Henry is the ______ of the three brothers.", "options": ["younger", "young", "youngest", "more young"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 17 題）", "explanation": "三者之中 → 最高級 the youngest。", "explanationSource": "supplemental"}, {"id": 21, "question": "My sister thinks red hair is ______ fashionable than black hair.", "options": ["very", "much", "more", "the most"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜more + 形容詞 + than（much 須接比較級）", "explanation": "【句型】多音節形容詞比較級 = more + adj. + than；much 只能修飾比較級，不能自己構成比較級。\n【分析】fashionable 為多音節，後有 than → more fashionable。\n【其他選項】(A) very 只修飾原級，不能接 than；(B) much 需寫成 much more fashionable，單用 much 錯誤；(D) the most 為最高級，不能接 than。\n【例句】Taking the MRT is more convenient than driving.", "explanationSource": "source"}, {"id": 22, "question": "I think playing outside is ______ interesting than watching TV.", "options": ["very", "much", "more", "most"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 21 題）", "explanation": "interesting 多音節 + than → more。", "explanationSource": "supplemental"}, {"id": 23, "question": "This dress is ______ more beautiful than that one.", "options": ["very", "much", "most", "so"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 21 題）", "explanation": "修飾比較級用 much，very 不能修飾比較級。", "explanationSource": "supplemental"}, {"id": 24, "question": "Science is ______ useful subject of all to me.", "options": ["more", "much", "the most", "very"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 21 題）", "explanation": "of all（所有之中）→ 最高級 the most useful。", "explanationSource": "supplemental"}, {"id": 25, "question": "Lucy looks ______ in pants than in a dress.", "options": ["pretty", "prettily", "prettier", "the prettiest"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜連綴動詞 look + 形容詞比較級", "explanation": "【句型】連綴動詞 look / feel / sound / taste / smell + 形容詞；有 than 用比較級。\n【分析】look 後接形容詞，且句中有 than → prettier（y 改 i 加 -er）。\n【其他選項】(A) 原級不可接 than；(B) prettily 為副詞，不能接在連綴動詞 look 後；(D) 最高級不能與 than 連用。\n【例句】This soup tastes better than that one.", "explanationSource": "source"}, {"id": 26, "question": "You look ______ with short hair than with long hair.", "options": ["young", "younger", "youngly", "youngest"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 25 題）", "explanation": "look + 形容詞比較級 + than → younger。", "explanationSource": "supplemental"}, {"id": 27, "question": "After a good sleep, Ken felt much ______ than yesterday.", "options": ["good", "well", "better", "best"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 25 題）", "explanation": "feel + 形容詞比較級 → better。", "explanationSource": "supplemental"}, {"id": 28, "question": "The cake smells ______. Can I have a piece?", "options": ["nicely", "nice", "nicer than", "the nicest"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 25 題）", "explanation": "smell 為連綴動詞，接形容詞原級 nice（無 than）。", "explanationSource": "supplemental"}, {"id": 29, "question": "The students got ______ when they saw their favorite movie star eating at the next table.", "options": ["excited", "excitedly", "exciting", "excitingly"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜get + -ed 形容詞（人的感受）", "explanation": "【句型】get / feel / be + V-ed 形容詞 = 人「感到……」；V-ing 形容詞 = 事物「令人……的」。\n【分析】主詞 The students 是人，看到偶像而「感到興奮」→ got excited。\n【其他選項】(B)(D) 為副詞，不能接在連綴動詞 get 後；(C) exciting 表「令人興奮的」，用來形容事物，學生本身不是令人興奮的。\n【例句】Mia got bored during the long speech.", "explanationSource": "source"}, {"id": 30, "question": "The baseball game was so ______ that everyone stood up and shouted.", "options": ["excited", "exciting", "excitedly", "excite"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 29 題）", "explanation": "形容比賽（事物）令人興奮 → exciting。", "explanationSource": "supplemental"}, {"id": 31, "question": "Sam was ______ when he heard the loud noise at midnight.", "options": ["frightening", "frightened", "frighten", "frighteningly"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 29 題）", "explanation": "人感到害怕 → frightened。", "explanationSource": "supplemental"}, {"id": 32, "question": "I felt ______ because the movie was too long and slow.", "options": ["bored", "boring", "boredly", "bore"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 29 題）", "explanation": "人感到無聊 → bored。", "explanationSource": "supplemental"}, {"id": 33, "question": "Rose: Who's that man wearing a white jacket?\nLisa: He's Dr. Wu's son.\nRose: Really? They look ______ like brothers than father and son.", "options": ["as", "less", "more", "not"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜look more like…than…（比較級）", "explanation": "【句型】look more like A than B =「看起來比較像 A 而不像 B」。\n【分析】Rose 很驚訝（Really?），表示兩人看起來年齡相近 →「看起來更像兄弟而不像父子」→ more like。\n【其他選項】(A) as 需用 as…as 句型，不能接 than；(B) less 意思變成「比較不像兄弟」，與 Really? 的驚訝不合；(D) not 不能與 than 搭配成比較句。\n【例句】The dog looks more like a wolf than a pet.", "explanationSource": "source"}, {"id": 34, "question": "Mr. Lin is fifty, but he looks ______ like a college student than a dad.", "options": ["more", "as", "most", "very"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 33 題）", "explanation": "看起來比較像大學生 → more like…than…。", "explanationSource": "supplemental"}, {"id": 35, "question": "The cat is as ______ as a small dog.", "options": ["big", "bigger", "biggest", "more big"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 33 題）", "explanation": "as + 原級 + as。", "explanationSource": "supplemental"}, {"id": 36, "question": "For me, math is ______ difficult than English, so I'm better at math.", "options": ["more", "less", "the least", "as"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 33 題）", "explanation": "數學比較好 → 數學「比較不難」→ less difficult。", "explanationSource": "supplemental"}, {"id": 37, "question": "Your refrigerator shouldn't be making loud noises now, but if it ______ does, just give me a call and I'll come check it again.", "options": ["already", "even", "finally", "still"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜頻率/強調副詞 still（仍然）", "explanation": "【句型】still = 仍然、還是（狀況持續）；放在一般動詞/助動詞 does 前。\n【分析】修理後「不應該」再有噪音，但如果它「仍然」有 → still does。\n【其他選項】(A) already 已經，用於肯定句表示提早完成，不合「萬一還有」；(B) even 甚至，語意不通；(C) finally 終於，表示等待後才發生，與語意不符。\n【例句】It's ten o'clock, but Ken is still sleeping.", "explanationSource": "source"}, {"id": 38, "question": "I told my brother to turn off the TV an hour ago, but he is ______ watching it.", "options": ["already", "still", "yet", "ever"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 37 題）", "explanation": "一小時前就叫他關了，他仍在看 → still。", "explanationSource": "supplemental"}, {"id": 39, "question": "Hurry up! The movie has ______ started.", "options": ["still", "yet", "already", "ever"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 37 題）", "explanation": "肯定句「已經開始」→ already。", "explanationSource": "supplemental"}, {"id": 40, "question": "We waited for two hours, and the bus ______ came.", "options": ["finally", "still", "already", "even"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 37 題）", "explanation": "等了兩小時後才來 → finally（終於）。", "explanationSource": "supplemental"}, {"id": 41, "question": "In the future, there will ______ be greater basketball players than Stephen Curry, but now we believe he is the best!", "options": ["again", "already", "never", "perhaps"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜副詞 perhaps（也許）", "explanation": "【句型】perhaps = maybe（也許），表推測；放在 will 之後、be 之前。\n【分析】but now we believe he is the best 表示「將來『也許』會有更好的球員，但現在他是最好的」→ perhaps。\n【其他選項】(A) again 再次，語意不合；(B) already 已經，不與 In the future 搭配；(C) never 意為「絕不會有」，與 but 的轉折語意不符。\n【例句】It will perhaps rain this afternoon, so take an umbrella.", "explanationSource": "source"}, {"id": 42, "question": "I'm not sure where Amy is. She is ______ in the library.", "options": ["never", "perhaps", "already", "again"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 41 題）", "explanation": "不確定 → 推測「也許」→ perhaps。", "explanationSource": "supplemental"}, {"id": 43, "question": "Jack promised he would ______ be late again.", "options": ["perhaps", "already", "never", "still"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 41 題）", "explanation": "承諾「再也不會」遲到 → never。", "explanationSource": "supplemental"}, {"id": 44, "question": "I have ______ finished my homework, so I can play now.", "options": ["already", "perhaps", "never", "yet"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 41 題）", "explanation": "肯定句、現在完成式「已經」完成 → already。", "explanationSource": "supplemental"}, {"id": 45, "question": "Angela: Do you know Oscar?\nGeorge: Of course. I know him very ______.", "options": ["often", "little", "young", "well"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜副詞 well（know sb. well）", "explanation": "【句型】know + sb. + (very) well =「非常了解某人」；well 為副詞修飾動詞 know。\n【分析】Of course（當然）表示很熟 → know him very well。\n【其他選項】(A) often 常常，know him very often 不通；(B) little 很少，與 Of course 矛盾；(C) young 為形容詞，不能修飾動詞 know。\n【例句】Lily speaks English very well.", "explanationSource": "source"}, {"id": 46, "question": "Ted plays the piano very ______. He has won many prizes.", "options": ["good", "well", "nice", "often"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 45 題）", "explanation": "修飾動詞 plays 用副詞 well。", "explanationSource": "supplemental"}, {"id": 47, "question": "Cindy is a ______ singer. Everyone loves her voice.", "options": ["well", "good", "better than", "best"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 45 題）", "explanation": "修飾名詞 singer 用形容詞 good。", "explanationSource": "supplemental"}, {"id": 48, "question": "I don't feel ______ today. I think I have a cold.", "options": ["good at", "best", "well", "better than"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 45 題）", "explanation": "feel well = 身體健康。", "explanationSource": "supplemental"}, {"id": 49, "question": "Simon is an interesting person. He gets excited ______.", "options": ["easy", "easier", "easiest", "easily"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜副詞修飾動詞/形容詞 easily", "explanation": "【句型】修飾動詞或整個動作用副詞（-ly）；get excited easily =「很容易興奮」。\n【分析】空格修飾 gets excited 這個動作 → 副詞 easily。\n【其他選項】(A)(B)(C) 都是形容詞（原級、比較級、最高級），不能修飾動作；且無 than / the 等比較句線索。\n【例句】My little sister cries easily.", "explanationSource": "source"}, {"id": 50, "question": "Ken is a good student. He can answer hard questions ______.", "options": ["easy", "easily", "easier", "easiest"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 49 題）", "explanation": "修飾動詞 answer → 副詞 easily。", "explanationSource": "supplemental"}, {"id": 51, "question": "Please speak ______. The baby is sleeping.", "options": ["quiet", "quieter", "quietly", "quietest"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 49 題）", "explanation": "修飾動詞 speak → quietly。", "explanationSource": "supplemental"}, {"id": 52, "question": "This math problem is ______. Everyone can do it.", "options": ["easy", "easily", "more easily", "easiest"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 49 題）", "explanation": "be 動詞後接形容詞 → easy。", "explanationSource": "supplemental"}, {"id": 53, "question": "I think the road ends here; it won't go any ______. Shouldn't we turn back?", "options": ["closer", "farther", "faster", "longer"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜not…any + 比較級 farther（更遠）", "explanation": "【句型】not … any + 比較級 =「再也不能更……」；farther = 更遠（距離）。\n【分析】路到盡頭了 → 不能「再往前更遠」→ won't go any farther；所以要回頭。\n【其他選項】(A) closer 更近，語意與「路已到盡頭」不合；(C) faster 更快，與路的盡頭無關；(D) longer 用於 no longer/not any longer 表時間「不再」，此處講距離，用 farther。\n【例句】I'm too tired. I can't walk any farther.", "explanationSource": "source"}, {"id": 54, "question": "The library is ______ from my home than the park, so I take a bus there.", "options": ["farther", "closer", "nearer", "shorter"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 53 題）", "explanation": "要搭公車 → 圖書館比較遠 → farther。", "explanationSource": "supplemental"}, {"id": 55, "question": "Ann moved to Tainan, so she doesn't live here any ______.", "options": ["farther", "longer", "faster", "closer"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 53 題）", "explanation": "not…any longer = 不再（時間）。", "explanationSource": "supplemental"}, {"id": 56, "question": "Please come ______. I can't hear you.", "options": ["farther", "closer", "longer", "later"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 53 題）", "explanation": "聽不見 → 靠近一點 → closer。", "explanationSource": "supplemental"}, {"id": 57, "question": "Jo likes summer the ______ because she has serious problems sleeping in the summer heat.", "options": ["least", "last", "first", "best"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜like…the least（最不喜歡）", "explanation": "【句型】like + N + the least / the best =「最不喜歡／最喜歡」。\n【分析】夏天太熱讓她嚴重失眠 → 最不喜歡夏天 → the least。\n【其他選項】(B) the last 最後的，不用來表喜好程度；(C) the first 第一的，不修飾 like；(D) the best 最喜歡，與失眠的原因矛盾。\n【例句】Of all the subjects, I like history the least.", "explanationSource": "source"}, {"id": 58, "question": "Eric likes basketball the ______. He plays it every day after school.", "options": ["least", "best", "last", "less"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 57 題）", "explanation": "每天打 → 最喜歡 → the best。", "explanationSource": "supplemental"}, {"id": 59, "question": "Lily is afraid of insects, so she likes summer camp the ______.", "options": ["least", "best", "most", "first"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 57 題）", "explanation": "怕蟲 → 最不喜歡 → the least。", "explanationSource": "supplemental"}, {"id": 60, "question": "Of all fruits, I like mangoes ______ than bananas.", "options": ["best", "the most", "better", "the least"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 57 題）", "explanation": "有 than → 比較級 better。", "explanationSource": "supplemental"}, {"id": 61, "question": "The singer sings beautifully. I cannot think of anyone with a ______ voice.", "options": ["best", "better", "more", "most"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜否定 + 比較級 = 最高級（a better voice）", "explanation": "【句型】否定 + 比較級 = 最高級語意（想不到有人擁有「更好」的聲音）；a + 比較級 + N。\n【分析】前句說歌手唱得很美 → 想不到有誰的聲音「更好」→ a better voice。\n【其他選項】(A) best 最高級需加 the，不能用 a best；(C) more 後需接形容詞，a more voice 不通；(D) most 同樣缺形容詞且需 the。\n【例句】I have never had a better meal than this.", "explanationSource": "source"}, {"id": 62, "question": "This is a great school. I can't imagine a ______ place to study.", "options": ["best", "better", "good", "most"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 61 題）", "explanation": "否定 + 比較級表最高級 → a better place。", "explanationSource": "supplemental"}, {"id": 63, "question": "Lucy is the kindest girl. No one is ______ than she is.", "options": ["kind", "kinder", "kindest", "the kindest"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 61 題）", "explanation": "No one + 比較級 + than → kinder。", "explanationSource": "supplemental"}, {"id": 64, "question": "That was ______ movie I have ever seen.", "options": ["a better", "good", "the best", "best"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 61 題）", "explanation": "I have ever seen → 最高級 the best。", "explanationSource": "supplemental"}, {"id": 65, "question": "All the packages are ______ checked at the airport to keep everyone safe.", "options": ["careful", "carefully", "more careful", "the most careful"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜副詞 carefully 修飾過去分詞（被動）", "explanation": "【句型】be + 副詞 + p.p.（被動語態中，副詞修飾過去分詞動作）。\n【分析】are checked 為被動，修飾「檢查」這個動作要用副詞 → carefully checked。\n【其他選項】(A)(C)(D) 都是形容詞（原級、比較級、最高級），不能修飾動詞 checked。\n【例句】The cake was carefully made by my mom.", "explanationSource": "source"}, {"id": 66, "question": "The old pictures were ______ kept in a box by my grandmother.", "options": ["careful", "carefully", "care", "carefuller"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 65 題）", "explanation": "修飾 kept 動作 → 副詞 carefully。", "explanationSource": "supplemental"}, {"id": 67, "question": "The children played ______ in the park all afternoon.", "options": ["happy", "happily", "happier", "happiest"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 65 題）", "explanation": "修飾動詞 played → happily。", "explanationSource": "supplemental"}, {"id": 68, "question": "Be ______! The floor is wet.", "options": ["carefully", "careful", "care", "more carefully"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 65 題）", "explanation": "Be + 形容詞 → careful。", "explanationSource": "supplemental"}, {"id": 69, "question": "In this five-person game, the one who finds ______ hidden balls will win the last free ticket for the movie A Born Player.", "options": ["many", "some", "the more", "the most"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜the most + 複數名詞（數量最多）", "explanation": "【句型】the most + 複數名詞 =「最多的……」（三者以上比較）。\n【分析】五人遊戲中，找到「最多」藏球的人贏得票 → the most hidden balls。\n【其他選項】(A) many 很多，無比較意，無法決定贏家；(B) some 一些，同樣無法比出勝負；(C) the more 用於 the + 比較級, the + 比較級 句型或兩者比較，五人中用最高級。\n【例句】The student who reads the most books this month will get a prize.", "explanationSource": "source"}, {"id": 70, "question": "In our class, Steve has ______ comic books. He has over 300.", "options": ["many", "the most", "more", "the more"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 69 題）", "explanation": "全班中最多 → the most。", "explanationSource": "supplemental"}, {"id": 71, "question": "Lisa has ______ stickers than her sister.", "options": ["much", "the most", "more", "most"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 69 題）", "explanation": "有 than → 比較級 more。", "explanationSource": "supplemental"}, {"id": 72, "question": "Of the four teams, our team scored ______ points, so we came in last.", "options": ["the fewest", "the most", "more", "many"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 69 題）", "explanation": "得最後一名 → 得分最少 → the fewest。", "explanationSource": "supplemental"}, {"id": 73, "question": "It's raining ______. I think you should stay here until the rain stops.", "options": ["politely", "heavily", "clearly", "easily"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜副詞詞義 rain heavily", "explanation": "【句型】rain heavily 雨下得很大（副詞修飾動詞）\n【分析】後句「你應該待到雨停」，可知雨下得很大，rain heavily 為固定搭配。\n【其他選項】(A) politely 有禮貌地；(C) clearly 清楚地；(D) easily 容易地，皆不能形容下雨。\n【例句】It snowed heavily last night, so the roads were closed.", "explanationSource": "source"}, {"id": 74, "question": "Please speak ______. The baby is sleeping in the next room.", "options": ["quietly", "loudly", "heavily", "quickly"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 73 題）", "explanation": "寶寶在睡覺，要「小聲地」說話，quietly 修飾動詞 speak。", "explanationSource": "supplemental"}, {"id": 75, "question": "The wind is blowing so ______ that many trees fell down.", "options": ["gently", "strongly", "slowly", "kindly"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 73 題）", "explanation": "樹都倒了，表示風颳得很「強烈」，blow strongly。", "explanationSource": "supplemental"}, {"id": 76, "question": "Kevin answered all the questions ______, so the teacher gave him full marks.", "options": ["carelessly", "badly", "correctly", "heavily"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 73 題）", "explanation": "拿到滿分，表示他答得「正確」，correctly 修飾 answered。", "explanationSource": "supplemental"}, {"id": 77, "question": "Johnny had been talking about going to England, but never got to go. This summer, he ______ did it.", "options": ["also", "even", "finally", "only"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜副詞詞義 finally 終於", "explanation": "【句型】finally ＋ 動詞：終於（做了某事）\n【分析】前面說他一直說要去英國卻「never got to go」，今年夏天他「終於」去了，finally 最符合語意。\n【其他選項】(A) also 也；(B) even 甚至；(D) only 只有，皆不合「盼了很久終於達成」的語意。\n【例句】After three tries, Mia finally passed the swimming test.", "explanationSource": "source"}, {"id": 78, "question": "We waited for the bus for almost an hour. It ______ came at 8:30.", "options": ["already", "finally", "seldom", "still"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 77 題）", "explanation": "等了快一小時，公車「終於」來了，用 finally。", "explanationSource": "supplemental"}, {"id": 79, "question": "Tina practiced the piano every day for months, and she ______ won first prize in the contest.", "options": ["finally", "never", "almost", "hardly"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 77 題）", "explanation": "長時間努力後「終於」得獎，用 finally。", "explanationSource": "supplemental"}, {"id": 80, "question": "Ben wanted a dog for years. Last week his parents ______ said yes.", "options": ["still", "yet", "ever", "finally"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 77 題）", "explanation": "想了很多年，父母「終於」答應，用 finally。", "explanationSource": "supplemental"}, {"id": 81, "question": "I sent Lucy two e-mails last week, but she has not answered me ______.", "options": ["already", "also", "either", "yet"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜否定句句尾 yet", "explanation": "【句型】現在完成式否定句 have/has not p.p. ... yet「還沒」\n【分析】has not answered 為現在完成式否定，表示「到現在還沒回覆」，句尾用 yet。\n【其他選項】(A) already 用於肯定句；(B) also 不放否定句尾；(C) either 表「也不」，需有前面的否定句呼應，此處語意不合。\n【例句】I haven't finished my homework yet.", "explanationSource": "source"}, {"id": 82, "question": "Has the movie started ______? I just got to the theater.", "options": ["yet", "still", "ago", "once"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 81 題）", "explanation": "現在完成式疑問句「已經…了嗎」句尾用 yet。", "explanationSource": "supplemental"}, {"id": 83, "question": "Don't worry. I have ______ bought the tickets for the concert.", "options": ["yet", "already", "ever", "either"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 81 題）", "explanation": "肯定句表「已經」用 already。", "explanationSource": "supplemental"}, {"id": 84, "question": "Amy hasn't decided what to cook for dinner ______.", "options": ["already", "too", "ago", "yet"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 81 題）", "explanation": "現在完成式否定句「還沒」，句尾用 yet。", "explanationSource": "supplemental"}, {"id": 85, "question": "Anyone who reads Loren's business plan will quickly see some serious problems in it, or ______ feel something is not right.", "options": ["at least", "even", "in fact", "still"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜副詞片語 at least 至少", "explanation": "【句型】A, or at least B：A，或「至少」B（退一步的說法）\n【分析】讀的人會看出嚴重問題，「或至少」會覺得哪裡不對勁；後者程度較弱，為退一步說法，用 at least。\n【其他選項】(B) even 甚至（程度更強，與後項較弱不合）；(C) in fact 事實上；(D) still 仍然，皆不合語意。\n【例句】You should call your grandma, or at least send her a message.", "explanationSource": "source"}, {"id": 86, "question": "I can't help you move today, but I can ______ lend you my car.", "options": ["at least", "at last", "at first", "at once"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 85 題）", "explanation": "不能幫忙搬家，但「至少」可以借車，退一步說法用 at least。", "explanationSource": "supplemental"}, {"id": 87, "question": "If you can't finish the whole book, ______ read the first three chapters.", "options": ["at all", "at least", "at times", "at most"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 85 題）", "explanation": "讀不完整本，「至少」讀前三章，用 at least。", "explanationSource": "supplemental"}, {"id": 88, "question": "The trip will cost ______ NT$5,000, so start saving now.", "options": ["at last", "at once", "at least", "at first"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 85 題）", "explanation": "「至少」要花五千元，at least 修飾數量。", "explanationSource": "supplemental"}, {"id": 89, "question": "Amy: Would you like some coffee?\nBill: No, thanks. I ______ drink coffee. Coffee hurts my stomach.", "options": ["almost", "already", "seldom", "still"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜頻率副詞 seldom 很少", "explanation": "【句型】頻率副詞 seldom（很少）放在一般動詞前\n【分析】Bill 說咖啡會傷胃，所以他「很少」喝咖啡，用 seldom。\n【其他選項】(A) almost 幾乎（需接 never/always 等）；(B) already 已經；(D) still 仍然，皆與「咖啡傷胃而拒絕」不合。\n【例句】My dad seldom eats fast food because it's not healthy.", "explanationSource": "source"}, {"id": 90, "question": "Jenny is very healthy. She ______ gets sick.", "options": ["often", "seldom", "usually", "always"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 89 題）", "explanation": "身體很健康，所以「很少」生病，用 seldom。", "explanationSource": "supplemental"}, {"id": 91, "question": "Mark loves sports. He ______ plays basketball after school.", "options": ["never", "seldom", "usually", "hardly"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 89 題）", "explanation": "熱愛運動，所以放學「通常」打籃球，用 usually。", "explanationSource": "supplemental"}, {"id": 92, "question": "It ______ snows in Kaohsiung because the weather there is warm.", "options": ["always", "often", "sometimes", "seldom"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 89 題）", "explanation": "高雄天氣溫暖，「很少」下雪，用 seldom。", "explanationSource": "supplemental"}, {"id": 93, "question": "Billy: I've been fixing the computer for over three hours, but it still doesn't work.\nNana: Why don't you take a rest and try ______? Maybe you'll do better then.", "options": ["early", "finally", "later", "once"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜時間副詞 later 稍後", "explanation": "【句型】try later 晚一點再試\n【分析】Nana 建議先休息（take a rest），「之後」再試，後句 then 指休息後那時，故用 later。\n【其他選項】(A) early 早；(B) finally 終於；(D) once 一次／曾經，皆不合「休息後再試」的語意。\n【例句】I'm busy now. Can you call me later?", "explanationSource": "source"}, {"id": 94, "question": "Mom: Dinner isn't ready yet. Can you set the table ______?\nKen: Sure, just call me.", "options": ["ago", "later", "already", "before"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 93 題）", "explanation": "晚餐還沒好，「待會」再擺餐具，用 later。", "explanationSource": "supplemental"}, {"id": 95, "question": "The store is closed now. Let's come back two hours ______.", "options": ["ago", "before", "later", "yet"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 93 題）", "explanation": "一段時間 + later 表「…之後」，用 later。", "explanationSource": "supplemental"}, {"id": 96, "question": "I met Rita at the station ten minutes ______, but she has left now.", "options": ["ago", "later", "soon", "after"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 93 題）", "explanation": "過去式 met 搭配「…以前」用 ago。", "explanationSource": "supplemental"}, {"id": 97, "question": "Sandy: How was your vacation in America?\nLinda: It couldn't be worse! I don't ______ want to talk about it!", "options": ["even", "least", "never", "then"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜副詞 even 甚至（加強語氣）", "explanation": "【句型】not even ＋ V：甚至連…都不\n【分析】It couldn't be worse 表示糟透了，所以「連談都不想談」，用 even 加強語氣。\n【其他選項】(B) least 最少，不能放此位置；(C) never 與 don't 構成雙重否定，文法錯誤；(D) then 然後，不合語意。\n【例句】Tom was so tired that he didn't even eat dinner.", "explanationSource": "source"}, {"id": 98, "question": "The test was so easy that ______ my little brother could answer the questions.", "options": ["even", "still", "yet", "ever"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 97 題）", "explanation": "「甚至連」弟弟都會，even 加強語氣。", "explanationSource": "supplemental"}, {"id": 99, "question": "Sam left in a hurry. He didn't ______ say goodbye to us.", "options": ["never", "even", "also", "too"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 97 題）", "explanation": "not even「甚至連…都沒」，匆忙到連再見都沒說。", "explanationSource": "supplemental"}, {"id": 100, "question": "This phone is ______ more expensive than the one I bought last year.", "options": ["very", "many", "even", "so"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 97 題）", "explanation": "even 可修飾比較級表「更加」；very、so 不能修飾比較級，many 修飾名詞。", "explanationSource": "supplemental"}, {"id": 101, "question": "Steve was ______ late for school this morning; the bell rang right after he walked into the classroom.", "options": ["almost", "already", "really", "seldom"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜副詞 almost 差點", "explanation": "【句型】almost ＋ adj./V：差一點、幾乎\n【分析】他一走進教室鐘就響了（right after），表示他「差點」遲到，但沒遲到，用 almost。\n【其他選項】(B) already 已經遲到，與鐘聲在他進教室後才響矛盾；(C) really 真的遲到，同樣矛盾；(D) seldom 很少，與 this morning 單一事件不合。\n【例句】I almost missed the train, but I got on it just in time.", "explanationSource": "source"}, {"id": 102, "question": "Lily ______ fell off her bike, but she caught the handle just in time.", "options": ["almost", "already", "seldom", "ever"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 101 題）", "explanation": "及時抓住把手，表示「差點」跌倒，用 almost。", "explanationSource": "supplemental"}, {"id": 103, "question": "It's ______ ten o'clock. We should go to bed soon.", "options": ["never", "hardly", "almost", "yet"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 101 題）", "explanation": "「快要」十點了，almost 修飾時間。", "explanationSource": "supplemental"}, {"id": 104, "question": "Hurry up! The movie has ______ started.", "options": ["almost", "already", "yet", "seldom"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 101 題）", "explanation": "現在完成式「已經」開始，用 already；almost 不放 has 與 p.p. 之間表此意。", "explanationSource": "supplemental"}, {"id": 105, "question": "Bobby: Where's the food I ordered? I've waited for thirty minutes!\nWaiter: I'm really sorry, but the kitchen is very busy. You'll have it ______.", "options": ["already", "early", "once", "soon"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜時間副詞 soon 很快", "explanation": "【句型】未來式 will ＋ V ... soon：很快就會…\n【分析】服務生道歉並說明廚房很忙，「很快」就會上菜，You'll（未來式）搭配 soon。\n【其他選項】(A) already 已經，不與未來式搭配；(B) early 提早，語意不合（已經等很久）；(C) once 一次／曾經，不合語意。\n【例句】Don't worry. The bus will come soon.", "explanationSource": "source"}, {"id": 106, "question": "Get well ______! We all miss you at school.", "options": ["soon", "ago", "yet", "already"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 105 題）", "explanation": "Get well soon「早日康復」，soon 表很快。", "explanationSource": "supplemental"}, {"id": 107, "question": "Mom is on her way home. She'll be here ______.", "options": ["ago", "yet", "soon", "ever"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 105 題）", "explanation": "未來式 she'll be here 搭配 soon「很快」。", "explanationSource": "supplemental"}, {"id": 108, "question": "Vivian got up ______ this morning to catch the first train.", "options": ["soon", "early", "late", "yet"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 105 題）", "explanation": "為了趕第一班車而「早」起，get up early。", "explanationSource": "supplemental"}, {"id": 109, "question": "Gina worked late and was worried she might not be able to catch the bus. ______, she saw a bus coming just after she arrived at the bus station.", "options": ["Luckily", "Quickly", "Safely", "Truly"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜句首副詞 Luckily 幸運地", "explanation": "【句型】句首副詞＋逗點，修飾整句（表說話者的看法）\n【分析】她擔心趕不上公車，結果一到站就看到公車來了，「幸運地」最合語意。\n【其他選項】(B) Quickly 快速地；(C) Safely 安全地；(D) Truly 真正地，皆無法表達「運氣好」的轉折。\n【例句】Luckily, nobody was hurt in the accident.", "explanationSource": "source"}, {"id": 110, "question": "I forgot my umbrella this morning. ______, it didn't rain all day.", "options": ["Sadly", "Luckily", "Slowly", "Loudly"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 109 題）", "explanation": "忘了帶傘但沒下雨，「幸運地」用 Luckily。", "explanationSource": "supplemental"}, {"id": 111, "question": "We planned a picnic for Sunday. ______, it rained heavily, so we stayed home.", "options": ["Luckily", "Happily", "Unluckily", "Easily"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 109 題）", "explanation": "下大雨只好待在家，「不幸地」用 Unluckily。", "explanationSource": "supplemental"}, {"id": 112, "question": "Leo studied hard for weeks. ______, he passed the test with a high score.", "options": ["Finally", "Rudely", "Sadly", "Lazily"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 109 題）", "explanation": "努力數週後「終於」高分通過，用 Finally。", "explanationSource": "supplemental"}, {"id": 113, "question": "The boss called from the airport an hour ______, so I guess he will arrive at the office soon.", "options": ["after", "ago", "before", "later"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜時間副詞 ago（過去式）", "explanation": "【句型】一段時間＋ago：…以前（搭配過去式）\n【分析】called 為過去式，「一小時前」從機場打電話來，所以很快會到辦公室，用 an hour ago。\n【其他選項】(A) after 須接受詞或作連接詞；(C) before 單獨用時多搭配完成式，表「以前某時」，此處語意不精確；(D) later 表「…之後」，與過去式 called 及後句語意不合。\n【例句】Jason left the classroom five minutes ago.", "explanationSource": "source"}, {"id": 114, "question": "My grandparents moved to Tainan twenty years ______.", "options": ["ago", "later", "after", "since"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 113 題）", "explanation": "過去式 moved 搭配「二十年前」，用 ago。", "explanationSource": "supplemental"}, {"id": 115, "question": "Joe started learning Japanese in 2022. Three years ______, he went to study in Tokyo.", "options": ["ago", "before", "later", "yet"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 113 題）", "explanation": "以過去某時點為準「三年後」，用 later。", "explanationSource": "supplemental"}, {"id": 116, "question": "Ivy: When did you see Mr. Lin?\nPeter: About ten minutes ______. He was in the office.", "options": ["later", "after", "soon", "ago"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 113 題）", "explanation": "回答過去時間「十分鐘前」用 ago。", "explanationSource": "supplemental"}, {"id": 117, "question": "This kind of animal is ______ seen in everyday life because it lives 4,000m under the sea and is hard to find.", "options": ["commonly", "possibly", "seldom", "still"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜頻率副詞 seldom 很少", "explanation": "【句型】be ＋ seldom ＋ p.p.（被動語態中頻率副詞放 be 動詞後）\n【分析】because 後說牠住在深海、很難找到，所以在日常生活中「很少」被看到，用 seldom。\n【其他選項】(A) commonly 常常地，與「很難找到」矛盾；(B) possibly 可能地；(D) still 仍然，皆不合因果。\n【例句】This old road is seldom used now.", "explanationSource": "source"}, {"id": 118, "question": "Mr. Chen is a very busy doctor. He is ______ at home before 10 p.m.", "options": ["always", "seldom", "usually", "often"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 117 題）", "explanation": "醫生很忙，所以「很少」十點前在家，用 seldom。", "explanationSource": "supplemental"}, {"id": 119, "question": "Grace is ______ late for school. She gets up at six every morning.", "options": ["often", "usually", "always", "seldom"], "answer": 3, "answerLabel": "D", "source": "類似題 2（對應第 117 題）", "explanation": "每天六點起床，所以「很少」遲到，用 seldom。", "explanationSource": "supplemental"}, {"id": 120, "question": "This song is ______ heard on the radio. Everyone knows it.", "options": ["often", "seldom", "never", "hardly"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 117 題）", "explanation": "大家都知道這首歌，因為「常常」在廣播聽到，用 often。", "explanationSource": "supplemental"}, {"id": 121, "question": "Marsha thought her friends would do something ______ to celebrate her birthday, but they just gave her a little card.", "options": ["correct", "honest", "quick", "special"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜something ＋ adj. 後位修飾", "explanation": "【句型】something/anything/nothing ＋ 形容詞（形容詞放後面修飾）\n【分析】but 後說朋友只給了一張小卡片，表示她原本期待「特別的」慶祝，用 something special。\n【其他選項】(A) correct 正確的；(B) honest 誠實的；(C) quick 快速的，皆不合「期待慶生」語意。\n【例句】Let's do something fun this weekend.", "explanationSource": "source"}, {"id": 122, "question": "I'm thirsty. Can I have something ______ to drink?", "options": ["cold", "hungry", "busy", "sleepy"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 121 題）", "explanation": "something＋adj.，口渴想喝「冷的」東西。", "explanationSource": "supplemental"}, {"id": 123, "question": "The news report was boring. There was ______ in it.", "options": ["interesting nothing", "nothing interesting", "something boring", "anything new"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 121 題）", "explanation": "nothing＋adj.，形容詞放後面，「沒有有趣的事」。", "explanationSource": "supplemental"}, {"id": 124, "question": "Did you see ______ at the night market last night?", "options": ["strange anything", "something stranger", "anything strange", "any strange thing it"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 121 題）", "explanation": "疑問句用 anything，形容詞放其後：anything strange。", "explanationSource": "supplemental"}, {"id": 125, "question": "When I am hungry, any food looks ______ to me.", "options": ["common", "delicious", "simple", "honest"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜連綴動詞 look ＋ adj.", "explanation": "【句型】連綴動詞 look/smell/taste/sound/feel ＋ 形容詞\n【分析】肚子餓的時候，任何食物看起來都很「美味」，looks delicious 最合理。\n【其他選項】(A) common 普通的；(C) simple 簡單的；(D) honest 誠實的，皆與「餓」無因果關係。\n【例句】The cake smells sweet and looks delicious.", "explanationSource": "source"}, {"id": 126, "question": "You look ______. Did you stay up late last night?", "options": ["tired", "tiredly", "tiring", "tire"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 125 題）", "explanation": "連綴動詞 look 後接形容詞，人覺得累用 tired。", "explanationSource": "supplemental"}, {"id": 127, "question": "This new song sounds ______. Let's listen to it again.", "options": ["badly", "nicely", "great", "greatly"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 125 題）", "explanation": "sound 為連綴動詞，後接形容詞 great。", "explanationSource": "supplemental"}, {"id": 128, "question": "The milk smells ______. Don't drink it.", "options": ["fresh", "sweet", "delicious", "bad"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 125 題）", "explanation": "叫你別喝，表示牛奶聞起來「壞了」，smell bad。", "explanationSource": "supplemental"}, {"id": 129, "question": "The town looks very ______ now. It has changed a lot.", "options": ["serious", "worried", "favorite", "different"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜look ＋ adj.（different 不同的）", "explanation": "【句型】連綴動詞 look ＋ 形容詞\n【分析】後句說「它改變很多」（has changed a lot），所以小鎮現在看起來很「不一樣」，用 different。\n【其他選項】(A) serious 嚴肅的；(B) worried 擔心的（形容人）；(C) favorite 最喜愛的，不能用 very 修飾且語意不合。\n【例句】You look different with short hair.\n備註：本題未使用 too…to／enough／so…that 句型，考的是連綴動詞＋形容詞詞義，建議改歸「形容詞、比較級最高級、副詞」。", "explanationSource": "source"}, {"id": 130, "question": "Kelly's new house is very ______ from her old one. It has a big garden now.", "options": ["different", "same", "similar", "famous"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 129 題）", "explanation": "be different from「與…不同」，有了大花園表示不同。", "explanationSource": "supplemental"}, {"id": 131, "question": "The twins look the ______, so it's hard to tell who is who.", "options": ["different", "same", "other", "alike"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 129 題）", "explanation": "look the same「看起來一樣」，所以分不出誰是誰。", "explanationSource": "supplemental"}, {"id": 132, "question": "After the rain, the air smells ______ and clean.", "options": ["freshly", "dirty", "fresh", "badly"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 129 題）", "explanation": "連綴動詞 smell 接形容詞 fresh，且與 clean 並列。", "explanationSource": "supplemental"}, {"id": 133, "question": "Mary had an accident and was badly hurt. The doctor says it is ______ for her to go to school today.", "options": ["illegal", "special", "convenient", "impossible"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜It is ＋ adj. ＋ for sb ＋ to V（impossible）", "explanation": "【句型】It is ＋ adj. ＋ for ＋ 人 ＋ to V\n【分析】她出了意外、傷得很重（badly hurt），醫生說今天她「不可能」去上學，用 impossible。\n【其他選項】(A) illegal 違法的；(B) special 特別的；(C) convenient 方便的，皆不合「受重傷」的語意。\n【例句】It is impossible for me to finish all this work in one hour.\n備註：本題為 It is adj. for sb to V 句型＋形容詞詞義，不是 too…to／enough／so…that，建議改歸「形容詞、比較級最高級、副詞」。", "explanationSource": "source"}, {"id": 134, "question": "It is ______ for children to swim in this river. The water is too deep.", "options": ["safe", "dangerous", "easy", "fun"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 133 題）", "explanation": "水太深，對小孩來說游泳很「危險」。", "explanationSource": "supplemental"}, {"id": 135, "question": "The MRT station is right next to my school, so it is very ______ for me to go home.", "options": ["convenient", "impossible", "difficult", "terrible"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 133 題）", "explanation": "捷運站就在學校旁，回家很「方便」。", "explanationSource": "supplemental"}, {"id": 136, "question": "It is ______ for students to read every day. It helps them learn more words.", "options": ["useless", "boring", "important", "illegal"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 133 題）", "explanation": "每天閱讀能學更多字，所以很「重要」。", "explanationSource": "supplemental"}, {"id": 137, "question": "There are five stories in this book. The one about a shy police officer is the most ______ to me.", "options": ["interest", "interested", "interesting", "interestingly"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜最高級 the most ＋ -ing 形容詞（interesting）", "explanation": "【句型】the most ＋ 形容詞（最高級）；V-ing 形容詞形容「事物令人…」，p.p. 形容詞形容「人感到…」\n【分析】主詞 The one（指那個故事）是事物，表「令人覺得有趣」，且 the most 後須接形容詞，用 interesting。\n【其他選項】(A) interest 為名詞／動詞；(B) interested 用於形容人感到有興趣；(D) interestingly 為副詞，不能當補語。\n【例句】This is the most exciting game I have ever watched.\n備註：本題考最高級與 -ing／-ed 形容詞，與 too…to／enough／so…that 無關，建議改歸「形容詞、比較級最高級、副詞」。", "explanationSource": "source"}, {"id": 138, "question": "Of all the subjects, science is the most ______ to Mia. She always falls asleep in class.", "options": ["bored", "boring", "bore", "boringly"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 137 題）", "explanation": "事物令人覺得無聊用 boring，the most＋adj.。", "explanationSource": "supplemental"}, {"id": 139, "question": "Everyone was ______ when they heard the news about the typhoon day off.", "options": ["excited", "exciting", "excitement", "excitingly"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 137 題）", "explanation": "主詞是人「感到興奮」，用 excited。", "explanationSource": "supplemental"}, {"id": 140, "question": "This is the ______ movie I have ever seen. I cried three times.", "options": ["more touching", "touched", "most touched", "most touching"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 137 題）", "explanation": "最高級 the most＋-ing 形容詞，電影「令人感動」用 touching。", "explanationSource": "supplemental"}]};</script><script src="longteng-b1u5-quiz.js?v=20261027-2"></script><script>document.querySelector("#description").textContent="共 140 題（會考歷屆 35 題＋類似題 105 題）｜選答後顯示中文解析｜答錯可重做並下載錯題";</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
