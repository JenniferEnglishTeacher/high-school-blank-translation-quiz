<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="龍騰普高 Book 1 Unit 7 互動測驗，附解析、整句朗讀與必做 STT 朗讀評分。"><title>龍騰普高 Book 1 Unit 7｜文法選擇（其他考點）</title><link rel="stylesheet" href="longteng-b1u5-quiz.css?v=20261026-3"><link rel="stylesheet" href="longteng-vocab-required-pronunciation.css?v=20261026-4"></head><body><main class="wrap"><header class="hero"><a class="btn" href="dashboard.html">← 回到 Dashboard</a><h1 id="title">龍騰普高 Book 1 Unit 7｜文法選擇（其他考點）</h1><p id="description" class="note"></p></header><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn" type="button">全選</button><button id="none" class="btn" type="button">取消全選</button><button id="random" class="btn" type="button">隨機 20 題</button><span id="picked" class="note"></span></div><div id="list"></div><label class="pick"><input id="shuffle" type="checkbox"> 隨機排列題目</label><button id="start" class="btn primary" type="button">開始測驗 →</button></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><div class="actions"><button id="check" class="btn primary" type="button">檢查答案</button><button id="next" class="btn primary hidden" type="button">下一題 →</button><button id="finish" class="btn danger" type="button">結束練習</button></div></section><section id="result" class="card hidden"><h2>練習結果</h2><div id="summary" class="summary"></div><h2>錯題紀錄</h2><div id="wrongList"></div><div class="actions"><button id="retry" class="btn primary" type="button">重做錯題</button><button id="download" class="btn" type="button">下載 DOCX 錯題</button><button id="restart" class="btn" type="button">重新選題</button></div></section></main><script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 7｜文法選擇（其他考點）","mode":"mcq","questions":[{"id":1,"question":"Nora took some water to her children, _____________ were playing under a tree.","options":["which","that","they","who"],"answer":3,"answerLabel":"D","source":"習作簿","explanation":"補充解析：非限定形容詞子句修飾人時使用 who。來源未附逐題解析。"},{"id":2,"question":"Playing games on cellphones ____________ quite popular among high school students.","options":["is","are","being","to be"],"answer":0,"answerLabel":"A","source":"習作簿","explanation":"補充解析：動名詞片語作主詞視為單數，使用 is。來源未附逐題解析。"},{"id":3,"question":"I got new glasses because I couldn’t see clearly with the old ____________.","options":["them","those","ones","some"],"answer":2,"answerLabel":"C","source":"習作簿","explanation":"補充解析：ones 代替前面提過的複數名詞 glasses。來源未附逐題解析。"},{"id":4,"question":"Debra has almost run out of milk; in other words, there is ____________ milk left in her fridge.","options":["a few","little","quite a little","few"],"answer":1,"answerLabel":"B","source":"三合一學習手冊","explanation":"補充解析：little 修飾不可數名詞，表示「幾乎沒有」。來源未附逐題解析。"},{"id":5,"question":"Andrew is interested in ____________ movies that will be released this weekend, but he has to go to the dentist, so he can choose only one to see.","options":["a little","little","few","a few"],"answer":3,"answerLabel":"D","source":"三合一學習手冊","explanation":"補充解析：a few 修飾可數複數，表示「一些」。來源未附逐題解析。"},{"id":6,"question":"Lillian provided her boss with many proposals, but ____________ were accepted right away.","options":["little","few","a little","quite a few"],"answer":1,"answerLabel":"B","source":"三合一學習手冊","explanation":"補充解析：few 修飾可數複數，表示「幾乎沒有」。來源未附逐題解析。"},{"id":7,"question":"Robert writes a postcard and mails it to his home whenever he travels abroad. This is ____________ he collects memories of every trip.","options":["where","how","when","why"],"answer":1,"answerLabel":"B","source":"三合一學習手冊","explanation":"補充解析：疑問詞 how + to VR 表示「如何做……」。來源未附逐題解析。"},{"id":8,"question":"Though these pink dresses do look pretty, I prefer the light green ____________ because the color looks much better on me.","options":["those","them","some","ones"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"此處以不定代名詞ones代替前面提過的複數名詞dresses"},{"id":9,"question":"As everyone knows, Ang Lee is a ____________ director and the pride of Taiwan; he spent years working hard to produce many excellent films.","options":["famous-world","world-fame","world-famous","fame-world"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"本題考的是複合形容詞world-famous，意為「世界知名的」"},{"id":10,"question":"Lisa decided to cook ____________ she had learned in her cooking class to surprise her family at dinner.","options":["that","what","how","where"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"此處由複合關係代名詞what (= the thing(s) that)引導名詞子句，作cook的受詞，意指「Lisa在烹飪課上學到的東西」，其他選項雖然也可引導名詞子句，但該子句必須是完整的，而此處空格後的子句中learned後面缺受詞，只有what能擔任其受詞"},{"id":11,"question":"Tina studies very hard every day, and this is ____________ she gets the highest scores in almost every subject.","options":["how","which","what","who"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"此處由how引導名詞子句，當作主詞補語使用，且由於空格後面是完整的子句，故只能選擇副詞how，而其他選項均為代名詞，不能用於此處的空格中"},{"id":12,"question":"As a teacher, Kelly has the ability ____________ her students understand difficult and complex ideas in math.","options":["helps","of helping","by helping","to help"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"ability to VR 做……的能力"},{"id":13,"question":"The manager is confident that Ryan is able ____________ this problem on his own.","options":["solves","solved","to solve","solving"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"be able to VR 能夠做……"},{"id":14,"question":"The young man decided to set up a company of his own ____________ the money his parents gave him.","options":["over","with","into","upon"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"此處要選擇with，表示「利用……」"},{"id":15,"question":"Our school invited a famous scholar ____________ a speech on global warming last month.","options":["to deliver","delivered","for delivering","delivers"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"此處為invite + O + to VR的句型，意為「邀請……做……」"},{"id":16,"question":"According to many experts, reading lots of books ____________ good for children’s mental development.","options":["are","have","has","is"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"在本題中，由於主詞是動名詞片語reading lots of books，視為單數主詞，故搭配單數動詞；而空格後面是be good for...的句型，意為「對……有益」，因此答案選擇is"},{"id":17,"question":"To everyone’s surprise, Leo managed ____________ his homework in time, so he wasn’t punished by the teacher.","options":["handed in","handing in","to hand in","to handing in"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"本題考的是manage to VR的用法，意思是「設法做到……」，故答案選擇to hand in"},{"id":18,"question":"Sharon deeply believes ____________ all her hard work will pay off one day.","options":["what","×","which","who"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"本題是以that引導的名詞子句當作動詞believes的受詞，而在此種情況下，that可以省略；what、which、who為後面子句的主詞或受詞，會接不完整的子句，故非正解"},{"id":19,"question":"We are surprised to hear that Andy’s new watch ____________ more than NT$20,000.","options":["cost","took","spent","paid"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"本題考的是cost的用法，由於主詞是事物，而空格後面是價格或花費，故使用cost，表示「某物花費……（錢）」"},{"id":20,"question":"Last Saturday, James and his friends kept ____________ basketball at the park even after it started to rain.","options":["played","to play","plays","playing"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"keep + V-ing 持續做……"},{"id":21,"question":"____________ talking to native speakers as often as possible, Lucas has greatly improved his English.","options":["To","With","By","From"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"by + V-ing 藉由……方式"},{"id":22,"question":"Nancy always talks to her teachers and elders ____________ a polite way.","options":["by","in","to","of"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"in a...way 以……方式"},{"id":23,"question":"Betty’s father is a photographer, and he is very good ____________ taking pictures of nature.","options":["at","in","on","of"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"be good at N/V-ing 擅長於……"},{"id":24,"question":"Do you know the handsome boy ____________ is singing on the stage?","options":["whose","whom","which","who"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"在本題中，由於後面的關係子句缺乏主詞，而且先行詞是「人」，故使用表示「人」的主格關代who"},{"id":25,"question":"You should exercise regularly, ____________ it can make you healthier and stronger.","options":["because of","due to","since","owing to"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"由於空格後面是完整子句，因此要選擇連接詞since，在此表「因為」，等同於because"},{"id":26,"question":"____________ the end of her birthday party, Kathy thanked everyone for coming.","options":["For","At","On","Of"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"at the end of... 在……的尾聲"},{"id":27,"question":"On the bus, some of the passengers are taking a nap, while ____________ are using their phones.","options":["other","another","the other","the others"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"空格指公車上「扣除睡覺乘客以外的其他乘客」，因此要選擇代名詞the others"}]};</script><script src="longteng-b1u5-quiz.js?v=20261026-3"></script><script src="longteng-vocab-required-pronunciation.js?v=20261026-4"></script></body></html>
