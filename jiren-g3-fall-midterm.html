const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
DATA.groups.forEach(g=>g.items.forEach(x=>{x.group=g.title;x.en=g.en;x.zh=g.zh}));
const ALL=DATA.groups.flatMap(g=>g.items);
function norm(s){return String(s).toLowerCase().replace(/[‘’]/g,"'").replace(/[“”"]/g,'')
 .replace(/\bi'm\b/g,'i am').replace(/\bhe's\b/g,'he is').replace(/\bshe's\b/g,'she is').replace(/\bit's\b/g,'it is').replace(/\bthey're\b/g,'they are').replace(/\bwe're\b/g,'we are').replace(/\byou're\b/g,'you are').replace(/\bdoesn't\b/g,'does not').replace(/\bdon't\b/g,'do not')
 .replace(/[.,!?;]/g,' ').replace(/\s+/g,' ').trim()}
let items=[],idx=0,wrong=new Map(),firstOk=0,done=false,sel=null,built=[];
function renderGroups(){$('#groups').innerHTML='<button class="group-btn all" data-all="1"><b>全部練習 All</b><span>'+ALL.length+' 題｜依原題順序</span></button>'+DATA.groups.map((g,i)=>'<button class="group-btn" data-i="'+i+'"><b>'+esc(g.title)+'</b><span>'+g.items.length+' 題｜Q'+g.items[0].id+'–'+g.items[g.items.length-1].id+'</span></button>').join('');
 document.querySelectorAll('.group-btn').forEach(b=>b.onclick=()=>start(b.dataset.all?ALL:DATA.groups[b.dataset.i].items))}
function start(list){items=list;idx=0;wrong=new Map();firstOk=0;$('#select').classList.add('hidden');$('#result').classList.add('hidden');$('#quiz').classList.remove('hidden');show()}
function show(){speechSynthesis&&speechSynthesis.cancel();const x=items[idx];done=false;sel=null;built=[];x.tries=0;
 $('#meta').textContent=x.group+'｜第 '+(idx+1)+' / '+items.length+' 題（Q'+x.id+'）';$('#wrongCount').textContent='答錯 '+wrong.size+' 題';$('#bar').style.width=(idx/items.length*100)+'%';
 $('#instr').textContent=x.en+'（'+x.zh+'）';$('#feedback').className='feedback hidden';$('#next').classList.add('hidden');$('#speak').classList.add('hidden');$('#check').classList.remove('hidden');
 let h='';
 if(x.type==='fill'){h='<div class="bank">'+x.bank.map(w=>'<button class="chip">'+esc(w)+'</button>').join('')+'</div><div class="prompt">'+esc(x.prompt).replace('___','<span class="blank" id="blankShow">?</span>')+'</div><input class="answer" id="ans" placeholder="Type or tap a word 輸入或點選單字" autocomplete="off">'}
 else if(x.type==='mcq'){h='<div class="prompt">'+esc(x.prompt).replace('___','<span class="blank">?</span>')+'</div><div class="opts">'+x.options.map((o,i)=>'<button class="opt" data-i="'+i+'">('+'ABC'[i]+') '+esc(o)+'</button>').join('')+'</div>'}
 else if(x.type==='order'){x.shuf=x.shuf||x.tiles.map((t,i)=>i);h='<div class="prompt">Tap the words in order. 依序點選</div><div class="built" id="built"></div><div class="tiles" id="tiles"></div><div class="row"><button class="btn gray" id="clear">↺ 重來</button></div>'}
 else{h='<div class="prompt">Q: '+esc(x.prompt)+' <span class="hint">('+esc(x.hint)+')</span></div><input class="answer" id="ans" placeholder="A: Type a full sentence 寫完整句子" autocomplete="off">'}
 $('#area').innerHTML=h;
 if(x.type==='fill'){const a=$('#ans');const upd=()=>{$('#blankShow').textContent=a.value||'?'};a.oninput=upd;document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{if(done)return;a.value=c.textContent;upd()});a.focus()}
 if(x.type==='mcq')document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(done)return;document.querySelectorAll('.opt').forEach(o=>o.classList.remove('sel'));b.classList.add('sel');sel=+b.dataset.i});
 if(x.type==='order'){renderTiles();$('#clear').onclick=()=>{if(done)return;built=[];renderTiles()}}
 if(x.type==='qa')$('#ans').focus();
 const a=$('#ans');if(a)a.onkeydown=e=>{if(e.key==='Enter'){done?$('#next').click():$('#check').click()}}}
function renderTiles(){const x=items[idx];$('#built').innerHTML=built.map((i,k)=>'<button class="tile" data-k="'+k+'">'+esc(x.tiles[i])+'</button>').join('');
 $('#tiles').innerHTML=x.tiles.map((t,i)=>built.includes(i)?'':'<button class="tile" data-i="'+i+'">'+esc(t)+'</button>').join('');
 document.querySelectorAll('#tiles .tile').forEach(b=>b.onclick=()=>{if(done)return;built.push(+b.dataset.i);renderTiles()});
 document.querySelectorAll('#built .tile').forEach(b=>b.onclick=()=>{if(done)return;built.splice(+b.dataset.k,1);renderTiles()})}
function value(){const x=items[idx];if(x.type==='mcq')return sel==null?'':x.options[sel];if(x.type==='order'){if(built.length<x.tiles.length)return '';return built.map(i=>x.tiles[i]).join(' ').replace(/\s+([.?])/g,'$1')}return $('#ans').value.trim()}
$('#check').onclick=()=>{if(done)return;const x=items[idx];const v=value();if(!v){alert(x.type==='order'?'請把所有字詞都排上去。':'請先作答。');return}
 const ok=x.answers.some(a=>norm(a)===norm(v));x.tries++;const fb=$('#feedback');
 if(ok){done=true;if(x.tries===1&&!wrong.has(x.id))firstOk++;fb.className='feedback ok';fb.textContent='✅ Correct! 答對了！'+(x.type==='qa'||x.type==='order'?'\n'+x.answers[0]:'');
  if(x.type==='mcq')document.querySelector('.opt[data-i="'+sel+'"]').classList.add('right');
  $('#check').classList.add('hidden');$('#next').classList.remove('hidden');$('#speak').classList.remove('hidden');speak();$('#next').focus()}
 else{if(!wrong.has(x.id))wrong.set(x.id,{x,tries:[]});wrong.get(x.id).tries.push(v);$('#wrongCount').textContent='答錯 '+wrong.size+' 題';fb.className='feedback bad';
  if(x.tries>=2){fb.textContent='❌ 正確答案：'+x.answers.join('  /  ')+'\n請照著正確答案再做一次。'}else fb.textContent='❌ Try again! 再試一次！';
  if(x.type==='mcq')document.querySelector('.opt[data-i="'+sel+'"]').classList.add('wrong')}};
function speak(){const x=items[idx];if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(x.say);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}
$('#speak').onclick=speak;
$('#next').onclick=()=>{idx++;idx>=items.length?finish():show()};
function finish(){$('#bar').style.width='100%';$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');
 $('#summary').innerHTML='<div class="stat">題數<b>'+items.length+'</b></div><div class="stat">一次答對<b>'+firstOk+'</b></div><div class="stat">答錯過<b>'+wrong.size+'</b></div><div class="stat">得分<b>'+Math.round(firstOk/items.length*100)+'</b></div>';
 $('#wlist').innerHTML=wrong.size?'<h3>錯題回顧 Review</h3>'+[...wrong.values()].map(w=>'<div class="witem"><small>Q'+w.x.id+'｜'+esc(w.x.group)+'</small><div>'+esc(w.x.type==='order'?w.x.tiles.join(' / '):w.x.prompt)+(w.x.hint?' ('+esc(w.x.hint)+')':'')+'</div><div class="y">你的答案：'+esc(w.tries.join('｜'))+'</div><div class="a">正確答案：'+esc(w.x.answers.join(' / '))+'</div></div>').join(''):'<p>全部一次答對，太棒了！🌟</p>';
 $('#redo').classList.toggle('hidden',!wrong.size)}
$('#redo').onclick=()=>start([...wrong.values()].map(w=>w.x));
$('#menu').onclick=$('#back').onclick=()=>{speechSynthesis&&speechSynthesis.cancel();$('#quiz').classList.add('hidden');$('#result').classList.add('hidden');$('#select').classList.remove('hidden')};
renderGroups();
</script></body></html>
