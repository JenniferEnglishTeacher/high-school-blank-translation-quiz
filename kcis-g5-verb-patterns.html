<section class="hero"><h1>KCIS G5 Verb Patterns：V-ing / to V / not to V / VR / p.p.</h1><p>主要動詞時態＋動詞型態選擇｜120 題｜main verbs 取自 Gerund–Infinitive 講義</p><p class="muted">共 120 題｜第一格寫主要動詞（注意時態與主詞），其餘從選單選出正確形式｜逐題批改｜答錯可重填｜答對後顯示中文、文法提示與朗讀</p><div class="toolbar"><a class="btn" href="dashboard.html">← 回測驗總覽</a></div></section>

const DATA={"title": "KCIS G5 Verb Patterns：V-ing / to V / not to V / VR / p.p.", "subtitle": "主要動詞時態＋動詞型態選擇｜120 題｜main verbs 取自 Gerund–Infinitive 講義", "slug": "kcis-g5-verb-patterns", "sections": [{"id": "A", "title": "Part A｜Verb + V-ing₁ and V-ing₂", "zh": "特定動詞／動詞片語＋V-ing", "rule": "these verbs/phrases + V-ing; two actions joined by and (negative → or)"}, {"id": "B", "title": "Part B｜Verb + to VR₁ and (to) VR₂", "zh": "特定動詞＋to V", "rule": "these verbs + to V; the second to can be left out after and/or"}, {"id": "C", "title": "Part C｜ask / tell / expect / want / need + O + not to VR₁ or VR₂", "zh": "要求動詞＋受詞＋not to V", "rule": "ask / tell / expect / want / need + O + not to V; the second verb after or is VR"}, {"id": "D", "title": "Part D｜make / have / let + O + VR  vs  ask / get / tell + O + to VR", "zh": "使役動詞＋原形 vs. ask / get / tell＋to V", "rule": "make / have / let + O + VR₁ and VR₂ ; ask / get / tell + O + to VR₁ and (to) VR₂"}, {"id": "E", "title": "Part E｜see / hear / watch / listen to + O + VR / V-ing / p.p.", "zh": "感官動詞＋受詞＋原形／V-ing／p.p.", "rule": "VR = the whole action (from start to finish); V-ing = in progress at that moment; p.p. = the object receives the action (by …)"}], "items": [{"id": "A1", "sec": "A", "n": 1, "group": "Part A｜Verb + V-ing₁ and V-ing₂", "p": "Every Sunday morning, Grandpa {1} {2} the newspaper and {3} hot tea in the garden.", "verb": "enjoy", "blanks": [{"answers": ["enjoys"], "options": null, "role": "main", "key": "enjoys"}, {"answers": ["reading"], "options": ["reading", "to read"], "role": "choice", "key": "reading"}, {"answers": ["drinking"], "options": ["drinking", "to drink"], "role": "choice", "key": "drinking"}], "sentence": "Every Sunday morning, Grandpa enjoys reading the newspaper and drinking hot tea in the garden.", "zh": "每個星期天早上，爺爺喜歡在花園裡看報紙、喝熱茶。", "tip": "enjoy + V-ing｜時態線索：every Sunday", "cue": "（enjoy｜reading / to read｜drinking / to drink）"}, {"id": "A2", "sec": "A", "n": 2, "group": "Part A｜Verb + V-ing₁ and V-ing₂", "p": "Last night, Leo {1} {2} his math homework and {3} his English notes before nine o'clock.", "verb": "finish", "blanks": [{"answers": ["finished"], "options": null, "role": "main", "key": "finished"}, {"answers": ["doing"], "options": ["to do", "doing"], "role": "choice", "key": "doing"}, {"answers": ["checking"], "options": ["checking", "to check"], "role": "choice", "key": "checking"}], "sentence": "Last night, Leo finished doing his math homework and checking his English notes before nine o'clock.", "zh": "昨晚 Leo 在九點前寫完數學作業並檢查完英文筆記。", "tip": "finish + V-ing｜時態線索：last night", "cue": "（finish｜to do / doing｜checking / to check）"}, {"id": "A3", "sec": "A", "n": 3, "group": "Part A｜Verb + V-ing₁ and V-ing₂", "p": "My little sister always {1} {2} songs and {3} in front of the mirror.", "verb": "keep", "blanks": [{"answers": ["keeps"], "options": null, "role": "main", "key": "keeps"}, {"answers": ["singing"], "options": ["singing", "to sing"], "role": "choice", "key": "singing"}, {"answers": ["dancing"], "options": ["to dance", "dancing"], "role": "choice", "key": "dancing"}], "sentence": "My little sister always keeps singing songs and dancing in front of the mirror.", "zh": "我妹妹總是在鏡子前一直唱歌跳舞。", "tip": "keep + V-ing｜時態線索：always", "cue": "（keep｜singing / to sing｜to dance / dancing）"}, {"id": "A4", "sec": "A", "n": 4, "group": "Part A｜Verb + V-ing₁ and V-ing₂", "p": "The basketball team {1} {2} free throws and {3} up and down the court every afternoon.", "verb": "practice", "blanks": [{"answers": ["practices"], "options": null, "role": "main", "key": "practices"}, {"answers": ["shooting"], "options": ["shooting", "to shoot"], "role": "choice", "key": "shooting"}, {"answers": ["running"], "options": ["running", "to run"], "role": "choice", "key": "running"}], "sentence": "The basketball team practices shooting free throws and running up and down the court every afternoon.", "zh": "籃球隊每天下午練習投罰球和來回跑球場。", "tip": "practice + V-ing｜時態線索：every afternoon", "cue": "（practice｜shooting / to shoot｜running / to run）"}, {"id": "A5", "sec": "A", "n": 5, "group": "Part A｜Verb + V-ing₁ and V-ing₂", "p": "When Mia was sick last week, she {1} {2} sweets and {3} cold drinks.", "verb": "avoid", "blanks": [{"answers": ["avoided"], "options": null, "role": "main", "key": "avoided"}, {"answers": ["eating"], "options": ["to eat", "eating"], "role": "choice", "key": "eating"}, {"answers": ["having"], "options": ["having", "to have"], "role": "choice", "key": "having"}], "sentence": "When Mia was sick last week, she avoided eating sweets and having cold drinks.", "zh": "Mia 上週生病時，避免吃甜食和喝冰飲。", "tip": "avoid + V-ing｜時態線索：last week", "cue": "（avoid｜to eat / eating｜having / to have）"}, {"id": "A6", "sec": "A", "n": 6, "group": "Part A｜Verb + V-ing₁ and V-ing₂", "p": "When Kevin saw the funny puppy at the park yesterday, he {1} {2} and {3} photos of it.", "verb": "can't help", "blanks": [{"answers": ["couldn't help"], "options": null, "role": "main", "key": "couldn't help"}, {"answers": ["laughing"], "options": ["laughing", "to laugh"], "role": "choice", "key": "laughing"}, {"answers": ["taking"], "options": ["to take", "taking"], "role": "choice", "key": "taking"}], "sentence": "When Kevin saw the funny puppy at the park yesterday, he couldn't help laughing and taking photos of it.", "zh": "Kevin 昨天在公園看到那隻好笑的小狗時，忍不住大笑並幫牠拍照。", "tip": "can't help + V-ing｜時態線索：yesterday", "cue": "（can't help｜laughing / to laugh｜to take / taking）"}, {"id": "A7", "sec": "A", "n": 7, "group": "Part A｜Verb + V-ing₁ and V-ing₂", "p": "My mom {1} {2} in long lines and {3} wet in the rain.", "verb": "can't stand", "blanks": [{"answers": ["can't stand"], "options": null, "role": "main", "key": "can't stand"}, {"answers": ["waiting"], "options": ["waiting", "to wait"], "role": "choice", "key": "waiting"}, {"answers": ["getting"], "options": ["to get", "getting"], "role": "choice", "key": "getting"}], "sentence": "My mom can't stand waiting in long lines and getting wet in the rain.", "zh": "我媽媽受不了排長隊和在雨中淋濕。", "tip": "can't stand + V-ing｜時態線索：general fact", "cue": "（can't stand｜waiting / to wait｜to get / getting）"}, {"id": "A8", "sec": "A", "n": 8, "group": "Part A｜Verb + V-ing₁ and V-ing₂", "p": "Amy moved to Taichung last year. Now she often {1} {2} with her old classmates and {3} at the night market near her old home.", "verb": "miss", "blanks": [{"answers": ["misses"], "options": null, "role": "main", "key": "misses"}, {"answers": ["playing"], "options": ["playing", "to play"], "role": "choice", "key": "playing"}, {"answers": ["eating"], "options": ["eating", "to eat"], "role": "choice", "key": "eating"}], "sentence": "Amy moved to Taichung last year. Now she often misses playing with her old classmates and eating at the night market near her old home.", "zh": "Amy 去年搬到台中。現在她常懷念和老同學玩、在老家附近的夜市吃東西。", "tip": "miss + V-ing｜時態線索：now, often", "cue": "（miss｜playing / to play｜eating / to eat）"}, {"id": "A9", "sec": "A", "n": 9, "group": "Part A｜Verb + V-ing₁ and V-ing₂", "p": "Two years ago, my uncle {1} {2} up late and {3} sugary drinks because he wanted to stay healthy.", "verb": "give up", "blanks": [{"answers": ["gave up"], "options": null, "role": "main", "key": "gave up"}, {"answers": ["staying"], "options": ["to stay", "staying"], "role": "choice", "key": "staying"}, {"answers": ["drinking"], "options": ["to drink", "drinking"], "role": "choice", "key": "drinking"}], "sentence": "Two years ago, my uncle gave up staying up late and drinking sugary drinks because he wanted to stay healthy.", "zh": "兩年前，我叔叔為了保持健康，戒掉熬夜和喝含糖飲料。", "tip": "give up + V-ing｜時態線索：two years ago", "cue": "（give up｜to stay / staying｜to drink / drinking）"}, {"id": "A10", "sec": "A", "n": 10, "group": "Part A｜Verb + V-ing₁ and V-ing₂", "p": "It was so hot yesterday afternoon that everyone {1} {2} ice cream and {3} in the pool.", "verb": "feel like", "blanks": [{"answers": ["felt like"], "options": null, "role": "main", "key": "felt like"}, {"answers": ["eating"], "options": ["eating", "to eat"], "role": "choice", "key": "eating"}, {"answers": ["swimming"], "options": ["swimming", "to swim"], "role": "choice", "key": "swimming"}], "sentence": "It was so hot yesterday afternoon that everyone felt like eating ice cream and swimming in the pool.", "zh": "昨天下午好熱，大家都想吃冰淇淋、在泳池游泳。", "tip": "feel like + V-ing｜時態線索：yesterday afternoon", "cue": "（feel like｜eating / to eat｜swimming / to swim）"}, {"id": "A11", "sec": "A", "n": 11, "group": "Part A｜Verb + V-ing₁ and V-ing₂", "p": "Our class {1} {2} the science museum and {3} the robot show next Friday.", "verb": "look forward to", "blanks": [{"answers": ["looks forward to"], "options": null, "role": "main", "key": "looks forward to"}, {"answers": ["visiting"], "options": ["to visit", "visiting"], "role": "choice", "key": "visiting"}, {"answers": ["watching"], "options": ["watching", "to watch"], "role": "choice", "key": "watching"}], "sentence": "Our class looks forward to visiting the science museum and watching the robot show next Friday.", "zh": "我們班很期待下週五參觀科學博物館和看機器人表演。", "tip": "look forward to + V-ing｜時態線索：現在的心情（next Friday 是期待的事）", "cue": "（look forward to｜to visit / visiting｜watching / to watch）"}, {"id": "A12", "sec": "A", "n": 12, "group": "Part A｜Verb + V-ing₁ and V-ing₂", "p": "When the teacher asked about it yesterday, Tom {1} {2} the window and {3} the ball.", "verb": "deny", "blanks": [{"answers": ["denied"], "options": null, "role": "main", "key": "denied"}, {"answers": ["breaking"], "options": ["breaking", "to break"], "role": "choice", "key": "breaking"}, {"answers": ["hiding"], "options": ["hiding", "to hide"], "role": "choice", "key": "hiding"}], "sentence": "When the teacher asked about it yesterday, Tom denied breaking the window and hiding the ball.", "zh": "昨天老師問起時，Tom 否認打破窗戶和藏起球。", "tip": "deny + V-ing｜時態線索：yesterday", "cue": "（deny｜breaking / to break｜hiding / to hide）"}, {"id": "A13", "sec": "A", "n": 13, "group": "Part A｜Verb + V-ing₁ and V-ing₂", "p": "Later that day, function start(chosen,title){items=chosen;currentTitle=title;index=0;wrong=new Map();correct=new Set();firstTry=new Set();$('#select').classList.add('hidden');$('#result').classList.add('hidden');$('#quiz').classList.remove('hidden');show()}

function speechNorm(s){return String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim()}
function similarity(a,b){a=speechNorm(a).split(' ').filter(Boolean);b=speechNorm(b).split(' ').filter(Boolean);const d=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)d[i][0]=i;for(let j=0;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return 1-d[a.length][b.length]/Math.max(a.length,b.length,1)}
async function listen(){const box=$('#voiceResult'),mic=$('#mic'),SR=window.SpeechRecognition||window.webkitSpeechRecognition,reset=()=>{mic.disabled=false;mic.textContent='🎤 開始朗讀評分'};window.speechSynthesis?.cancel();if(!window.isSecureContext){box.className='voice-result retry';box.textContent='請使用 HTTPS 網址開啟測驗，才能使用麥克風。';return}if(!SR){box.className='voice-result retry';box.textContent='此瀏覽器不支援語音辨識；可直接進入下一題。建議使用最新版 Chrome 或 Edge。';return}mic.disabled=true;mic.textContent='🎤 正在開啟麥克風…';try{const st=await navigator.mediaDevices.getUserMedia({audio:true});st.getTracks().forEach(t=>t.stop())}catch(e){reset();box.className='voice-result retry';box.textContent='麥克風權限未開啟。請在瀏覽器網站權限中允許麥克風後再試。';return}try{recognition?.abort()}catch(e){}recognition=new SR();recognition.lang='en-US';recognition.interimResults=false;recognition.maxAlternatives=5;box.className='voice-result';box.textContent='🎤 正在聆聽，請朗讀完整句子…';mic.textContent='🎤 聆聽中…';recognition.onresult=e=>{const target=items[index].sentence,best=[...e.results[0]].map(x=>({t:x.transcript,s:similarity(x.transcript,target)})).sort((a,b)=>b.s-a.s)[0],pct=Math.round(best.s*100);box.className='voice-result '+(pct>=80?'good':'retry');box.innerHTML=`<strong>辨識結果：</strong>${esc(best.t)}<br><strong>準確率：</strong>${pct}%<br>${pct>=80?'✅ 朗讀內容與目標句相符。':'🔁 建議再聽一次後重新朗讀。'}`};recognition.onerror=()=>{box.className='voice-result retry';box.textContent='沒有聽清楚，請再試一次。'};recognition.onend=reset;recognition.start()}
$('#mic').onclick=listen;
function finish(){try{recognition?.abort()}catch(e){}window.speechSynthesis?.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');$('#summary').innerHTML=`<div class="stat">本輪題數<b>${items.length}</b></div><div class="stat">完成題數<b>${correct.size}</b></div><div class="stat">一次答對<b>${firstTry.size}</b></div><div class="stat">曾答錯<b>${wrong.size}</b></div>`;$('#wrongList').innerHTML=wrong.size?'<h3>錯題紀錄</h3>'+[...wrong.values()].map(r=>`<div class="wrong-card"><b>${esc(r.item.id)}</b>　${esc(r.item.p.replace(/\{\d+\}/g,'____'))}<br><strong>作答：</strong>${r.attempts.map(esc).join('；')}<br><strong>答案：</strong>${esc(r.item.blanks.map(answerShow).join(' ／ '))}<br><span class="muted">${esc(r.item.tip)}</span></div>`).join(''):'<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>'}
$('#back').onclick=()=>{window.speechSynthesis?.cancel();$('#quiz').classList.add('hidden');$('#result').classList.add('hidden');$('#select').classList.remove('hidden')};$('#restart').onclick=()=>location.reload();
renderGroups();
</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
