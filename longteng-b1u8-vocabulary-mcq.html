<script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 8｜單字選擇","mode":"mcq","questions":[{"id":1,"question":"There are so many unexpected twists in the series that audience won’t know the ____________ outcome until the end of it.","options":["familiar","visible","eventual","similar"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"這部影集有如此多出乎意料的反轉，以致於觀眾直到結尾才知道最後的結果。　(A)熟悉的　(B)看得見的　(C)最後的　(D)相似的","explanationSource":"source"},{"id":2,"question":"Some of that famous photographer’s major works are on ____________ in this museum, which has attracted hundreds of thousands of visitors.","options":["impulse","display","awareness","purchase"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"那位知名攝影師的一些主要作品正在這間博物館裡展覽，這已經吸引了數十萬名訪客。　(A)衝動　(B)展覽；陳列　(C)意識；認識　(D)購買","explanationSource":"source"},{"id":3,"question":"One of the most obvious ____________ between Daniel and Josh is that they are both good at sports, especially basketball and swimming.","options":["impulses","profits","customers","similarities"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"Daniel和Josh之間最明顯的相似性之一是他們都擅長運動，尤其是籃球和游泳。　(A)衝動　(B)利潤　(C)顧客　(D)相似性；相似處","explanationSource":"source"},{"id":4,"question":"According to the mayor, though establishing this city park cost a large sum of money, all of the citizens will surely ____________ from it.","options":["profit","offer","display","purchase"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"根據市長的說法，雖然設置這個城市公園花了大筆金錢，但是所有的市民都一定可以從中獲得好處。　(A)獲得好處　(B)提供　(C)展示；陳列　(D)購買","explanationSource":"source"},{"id":5,"question":"Richard has come up with a ____________ solution to this difficult problem, which really impresses his boss.","options":["similar","familiar","clever","visible"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"Richard已經想出這個困難問題的一個聰明解決之道，而這件事讓他的老闆相當印象深刻。　(A)相似的　(B)熟悉的　(C)聰明的　(D)看得見的","explanationSource":"source"},{"id":6,"question":"The director made the documentary to raise people’s ____________ of the importance of environmental protection.","options":["advantage","awareness","similarity","strategy"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"那位導演拍這部紀錄片是為了提升人們對於環保重要性的意識。　(A)優勢；有利條件　(B)意識；認識　(C)相似性；相似處　(D)策略","explanationSource":"source"},{"id":7,"question":"Some people are ____________ in the burning building, and dozens of firefighters are trying to rescue them.","options":["trapped","offered","urged","aimed"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"有些人被困在那棟起火的建築物裡，而有數十名消防員正在試圖救他們。　(A)困住　(B)提供　(C)催促　(D)針對；對象是","explanationSource":"source"},{"id":8,"question":"This shop is always crowded because it provides ____________ with various goods at reasonable prices.","options":["strategies","customers","similarities","impulses"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"這家店總是門庭若市，因為它以合理的價格提供顧客各式各樣的商品。　(A)策略　(B)顧客；客戶　(C)相似性；相似處　(D)衝動","explanationSource":"source"},{"id":9,"question":"Don’t miss our buy-one-get-one-free ____________ on all the shirts and pants, for it will only last until the end of this month.","options":["awareness","profit","offer","impulse"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"不要錯過我們所有襯衫和長褲的買一送一特價活動，因為只到這個月底為止。　(A)意識；認識　(B)利潤　(C)特價　(D)衝動","explanationSource":"source"},{"id":10,"question":"The department store is going to present a ____________ of the latest fashion trends this weekend.","options":["strategy","purchase","display","customer"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"那家百貨公司將在這週末舉辦一場最新時尚趨勢的展覽。　(A)策略　(B)購買　(C)展覽　(D)顧客；客戶","explanationSource":"source"},{"id":11,"question":"Pauline suggested that we ____________ our marketing strategy for this new smartphone at consumers who put great emphasis on the quality of the cameras.","options":["aim","urge","offer","trap"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"Pauline建議這款新型智慧型手機的行銷策略應該以非常強調相機品質的消費者為對象。　(A)針對；對象是　(B)催促　(C)提供　(D)困住","explanationSource":"source"},{"id":12,"question":"I think Cathy is too smart to fall into your ____________; thus, don’t waste your time trying to cheat her.","options":["offer","display","urge","trap"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"我認為Cathy很聰明，不會落入你的圈套；因此，不要浪費時間試圖去欺騙她。　(A)特價　(B)展覽；陳列　(C)衝動　(D)圈套","explanationSource":"source"},{"id":13,"question":"This five-star hotel promises to ____________ its guests the best service in this city.","options":["offer","trap","display","aim"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"這家五星級飯店承諾提供其住宿客人在本市的最佳服務。　(A)提供　(B)困住　(C)展示；陳列　(D)針對；對象是","explanationSource":"source"},{"id":14,"question":"As for how to celebrate Mike’s birthday, John’s idea is quite ____________ to mine.","options":["aware","visible","similar","eventual"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"關於慶祝Mike生日的方式，John的想法和我的非常相似。　(A)知道；意識到　(B)看得見的　(C)相似的　(D)最後的","explanationSource":"source"},{"id":15,"question":"Henry’s company has made a huge ____________ recently because its new products sell very well.","options":["urge","profit","aim","offer"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"Henry的公司最近已經賺取一大筆利潤，因為它的新產品賣得非常好。　(A)衝動　(B)利潤　(C)目的；目標　(D)特價","explanationSource":"source"},{"id":16,"question":"I smelled something strange, and then I suddenly became ____________ that my bread was burned in the oven.","options":["profitable","clever","aware","eventual"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"我聞到怪怪的味道，然後我意識到我的麵包在烤箱中烤焦了。　(A)獲利的　(B)聰明的　(C)意識到　(D)最後的","explanationSource":"source"},{"id":17,"question":"Hank told his younger brother to try again because he believes that ____________ his efforts will pay off.","options":["eventually","similarly","profitably","cleverly"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"Hank叫他弟弟再試看看因為他相信最後他的努力會有回報的。　(A)最後　(B)同樣地　(C)獲利地　(D)聰明地","explanationSource":"source"},{"id":18,"question":"John’s working experience in a five-star hotel gives him a(n) ____________ over others in getting this job.","options":["impulse","awareness","advantage","trap"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"John在五星級飯店工作的經驗讓他比別人有更好的有利條件來得到這份工作。　(A)衝動　(B)意識　(C)有利條件　(D)圈套","explanationSource":"source"},{"id":19,"question":"Housing prices have gone up recently; ____________, the cost of food is also higher in many parts of Taiwan.","options":["eventually","familiarly","similarly","profitably"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"房價最近已高漲；同樣地，食物的花費也在臺灣許多地方變得較高。　(A)最後　(B)熟悉地　(C)同樣地　(D)有利潤地","explanationSource":"source"},{"id":20,"question":"This old bookstore owner tried to find some ways to keep the business ____________, so she decided to open a small café inside the bookstore.","options":["similar","visible","profitable","eventual"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"這家老書店的店主試圖找一些方法讓店保持獲利，所以她決定在書店裡開一間小咖啡館。　(A)類似的　(B)可看見的　(C)獲利的　(D)最後的","explanationSource":"source"},{"id":21,"question":"Can you believe that you can ____________ the same item online for only half the price?","options":["display","purchase","aim","offer"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"你能相信你可以在網路上購買一樣的東西但只要半價嗎？　(A)展示　(B)購買　(C)針對　(D)提供","explanationSource":"source"},{"id":22,"question":"The shooting stars were ____________ to the naked eye. I felt very lucky to have seen quite a few this evening.","options":["aware","eventual","visible","profitable"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"這些流星是肉眼可見的。我感到非常幸運今晚可以看到許多。　(A)意識到　(B)最後的　(C)看得見的　(D)有利潤的","explanationSource":"source"},{"id":23,"question":"Daniel’s ____________ in asking for a pay raise is to describe how he has achieved the sales targets many times.","options":["strategy","purchase","display","offer"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"Daniel要求加薪的策略就是描述他已經如何達到銷售目標許多次。　(A)策略　(B)購買　(C)展覽　(D)特價","explanationSource":"source"},{"id":24,"question":"The romantic English song sounds very ____________ to me, but somehow I just can’t remember the title.","options":["eventual","familiar","visible","profitable"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"這首浪漫的英文歌對我來說是很熟悉的，但不知怎麼的我就是記不起來歌名。　(A)最後的　(B)熟悉的　(C)看得到的　(D)獲利的","explanationSource":"source"},{"id":25,"question":"The best of students’ artwork will be ____________ on the blackboard for everyone to see.","options":["displayed","purchased","aimed","trapped"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"最棒的學生藝術作品將會被展示在黑板上讓每個人來看。　(A)展示　(B)購買　(C)瞄準　(D)困住","explanationSource":"source"},{"id":26,"question":"The sign says that if you make a ____________ of anything at the department store, then you can park your car for free.","options":["profit","similarity","strategy","purchase"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"牌子上寫說假如你在百貨公司購買任何東西，那麼你可以免費停車。　(A)利潤　(B)相似性　(C)策略　(D)購買","explanationSource":"source"},{"id":27,"question":"David said something unkind to his mom and hung up the phone on ____________, but later he felt really bad about this.","options":["display","profit","awareness","impulse"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"David衝動之下對媽媽說了一些不厚道的話，並掛斷電話，但是他之後對這件事感到很歉疚。　(A)展覽　(B)利潤　(C)意識　(D)衝動","explanationSource":"source"},{"id":28,"question":"Jason has been feeling a lot of pressure recently because his mother is ____________ him to get married to his long-time girlfriend as soon as possible.","options":["profiting","purchasing","urging","offering"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"Jason最近正飽受壓力因為他媽媽正催促他趕快跟他交往很久的女友結婚。　(A)獲利　(B)購買　(C)催促　(D)提供","explanationSource":"source"},{"id":29,"question":"Hannah suddenly had a strong ____________ to have a hot pot meal, so she called several of her friends to join her.","options":["strategy","urge","profit","purchase"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"Hannah突然間有強烈的衝動想吃火鍋，所以她叫了好幾位朋友一起加入。　(A)策略　(B)衝動　(C)利潤　(D)購買","explanationSource":"source"},{"id":30,"question":"The ____________ of this concert is to raise funds to help young children who have cancer. All the money from the concert will used to cover the medical expenses of these children.","options":["aim","similarity","trap","awareness"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"這場演唱會的目標是用來幫助罹癌幼童募款。所有從演唱會所得到的錢會被用來支付這些孩童的醫療費用。　(A)目標　(B)相似性　(C)圈套　(D)意識","explanationSource":"source"}]};</script><script src="longteng-b1u5-quiz.js?v=20261027-1"></script><script src="longteng-vocab-required-pronunciation.js?v=20261027-1"></script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
