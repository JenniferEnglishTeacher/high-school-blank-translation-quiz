<script>window.QUIZ_CONFIG={"title": "國中會考文法歷屆試題｜句首動詞的選擇（祈使句、Ving主詞、To V目的）", "mode": "mcq", "questions": [{"id": 1, "question": "Watching American movies ______ one of the activities we enjoy most in our English class.", "options": ["is", "are", "to be", "being"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜動名詞當主詞 + 單數動詞", "explanation": "【句型】動名詞（Ving）片語當主詞，視為單數，後接單數動詞 is。\n【分析】主詞是 Watching American movies（看美國電影這件事），雖然有 movies，但真正的主詞是動名詞 Watching，所以用單數 is。\n【其他選項】(B) are：誤把 movies 當主詞；(C) to be、(D) being 都不能當句子的主要動詞。\n【例句】Riding a bike to school is good exercise.", "explanationSource": "source"}, {"id": 2, "question": "Collecting stamps ______ my father's favorite hobby.", "options": ["are", "being", "is", "to be"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 1 題）", "explanation": "動名詞片語當主詞視為單數，用 is。", "explanationSource": "supplemental"}, {"id": 3, "question": "Eating too many snacks ______ bad for your teeth.", "options": ["is", "are", "have", "being"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 1 題）", "explanation": "主詞是 Eating（單數），用 is。", "explanationSource": "supplemental"}, {"id": 4, "question": "Taking care of three little kids ______ a lot of work for Mrs. Lin.", "options": ["are", "make", "to be", "means"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 1 題）", "explanation": "動名詞主詞視為單數，動詞用第三人稱單數 means。", "explanationSource": "supplemental"}, {"id": 5, "question": "Playing games on the cellphone ______ popular with high school students.", "options": ["is", "are", "being", "to be"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜動名詞當主詞 + 單數動詞", "explanation": "【句型】動名詞（Ving）片語當主詞，視為單數，用單數動詞。\n【分析】主詞是 Playing games on the cellphone（玩手機遊戲這件事），是動名詞片語，視為單數，用 is；不要被 games 誤導。\n【其他選項】(B) are：把 games 誤當主詞；(C) being、(D) to be 不能當主要動詞。\n【例句】Chatting with friends online is popular among teenagers.", "explanationSource": "source"}, {"id": 6, "question": "Sending messages on LINE ______ the easiest way to reach my parents.", "options": ["are", "is", "being", "to be"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 5 題）", "explanation": "動名詞片語當主詞視為單數，用 is。", "explanationSource": "supplemental"}, {"id": 7, "question": "Making new friends ______ not always easy for shy students.", "options": ["are", "to be", "is", "being"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 5 題）", "explanation": "Making new friends 為單數主詞，用 is。", "explanationSource": "supplemental"}, {"id": 8, "question": "Drinking sweet drinks every day ______ people gain weight easily.", "options": ["makes", "make", "making", "to make"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 5 題）", "explanation": "動名詞主詞為單數，用 makes。", "explanationSource": "supplemental"}, {"id": 9, "question": "Playing sports at least three times a week ______ good for your health.", "options": ["is", "are", "has", "have"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜動名詞當主詞 + 單數動詞", "explanation": "【句型】動名詞片語當主詞視為單數；be good for…＝對…有益。\n【分析】主詞是 Playing sports…（做運動這件事），視為單數；後面是形容詞 good，要用 be 動詞，所以用 is。\n【其他選項】(B) are 是複數，誤把 sports 當主詞；(C) has、(D) have 後面不能直接接形容詞 good。\n【例句】Going to bed early is good for growing kids.", "explanationSource": "source"}, {"id": 10, "question": "Eating breakfast every morning ______ important for students.", "options": ["are", "has", "is", "have"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 9 題）", "explanation": "動名詞主詞單數，後接形容詞用 is。", "explanationSource": "supplemental"}, {"id": 11, "question": "Using your cellphone in bed ______ bad for your eyes.", "options": ["is", "are", "has", "do"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 9 題）", "explanation": "主詞為動名詞片語，視為單數，用 is。", "explanationSource": "supplemental"}, {"id": 12, "question": "Swimming in this river ______ dangerous, so please don't do it.", "options": ["have", "are", "has", "is"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 9 題）", "explanation": "Swimming 為單數主詞，後接形容詞用 is。", "explanationSource": "supplemental"}, {"id": 13, "question": "Learning foreign languages ______ me to know more about other countries.", "options": ["helps", "helping", "help", "to help"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜動名詞當主詞 + 第三人稱單數動詞", "explanation": "【句型】動名詞片語當主詞，視為單數，現在式動詞加 -s；help + 人 + (to) V。\n【分析】主詞是 Learning foreign languages（學外語這件事），視為第三人稱單數，句子缺主要動詞，所以用 helps。\n【其他選項】(B) helping、(D) to help 不能當主要動詞；(C) help 是複數形，誤把 languages 當主詞。\n【例句】Reading English newspapers helps me learn new words.", "explanationSource": "source"}, {"id": 14, "question": "Traveling to different countries ______ people open their minds.", "options": ["help", "helps", "helping", "to help"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 13 題）", "explanation": "動名詞主詞單數，用 helps。", "explanationSource": "supplemental"}, {"id": 15, "question": "Doing yoga every night ______ my mom sleep better.", "options": ["make", "making", "to make", "makes"], "answer": 3, "answerLabel": "D", "source": "類似題 2（對應第 13 題）", "explanation": "Doing yoga 為單數主詞，用 makes。", "explanationSource": "supplemental"}, {"id": 16, "question": "Listening to English songs ______ me a lot of fun.", "options": ["gives", "give", "giving", "to give"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 13 題）", "explanation": "動名詞主詞單數，現在式用 gives。", "explanationSource": "supplemental"}, {"id": 17, "question": "Asking questions ______ Henna learn more and better.", "options": ["help", "helps", "helping", "to help"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜動名詞當主詞 + 第三人稱單數動詞", "explanation": "【句型】動名詞片語當主詞視為單數；help + 人 + (to) V。\n【分析】主詞是 Asking questions（問問題這件事），視為第三人稱單數，句子需要主要動詞，所以用 helps。\n【其他選項】(A) help：誤把 questions 當複數主詞；(C) helping、(D) to help 不能當主要動詞。\n【例句】Taking notes in class helps Andy remember the lessons.", "explanationSource": "source"}, {"id": 18, "question": "Writing a diary every day ______ Joy improve her English.", "options": ["help", "helping", "helps", "to help"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 17 題）", "explanation": "動名詞主詞單數，用 helps。", "explanationSource": "supplemental"}, {"id": 19, "question": "Drawing pictures ______ the little boy happy.", "options": ["makes", "make", "making", "to make"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 17 題）", "explanation": "Drawing pictures 為單數主詞，用 makes。", "explanationSource": "supplemental"}, {"id": 20, "question": "Taking a hot bath after work ______ my father relax.", "options": ["help", "to help", "helping", "helps"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 17 題）", "explanation": "動名詞主詞單數，用 helps。", "explanationSource": "supplemental"}, {"id": 21, "question": "I usually carry a camera on my trips; taking pictures ______ a good way for me to remember the experience.", "options": ["to be", "is", "being", "are"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜動名詞當主詞 + 單數動詞", "explanation": "【句型】動名詞片語當主詞，視為單數，用 is。\n【分析】分號後是新的句子，主詞是 taking pictures（拍照這件事），視為單數，用 is；不要被 pictures 誤導成 are。\n【其他選項】(A) to be、(C) being 不能當主要動詞；(D) are 誤把 pictures 當主詞。\n【例句】Keeping a diary is a good way to remember your school life.", "explanationSource": "source"}, {"id": 22, "question": "Walking the dogs ______ my brother's job every evening.", "options": ["are", "is", "being", "to be"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 21 題）", "explanation": "動名詞主詞單數，用 is。", "explanationSource": "supplemental"}, {"id": 23, "question": "I like art; visiting museums ______ one of my favorite things to do.", "options": ["is", "are", "to be", "being"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 21 題）", "explanation": "visiting museums 為單數主詞，用 is。", "explanationSource": "supplemental"}, {"id": 24, "question": "Watering the plants ______ the first thing Grandpa does every morning.", "options": ["are", "being", "were", "is"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 21 題）", "explanation": "動名詞主詞單數、現在式，用 is。", "explanationSource": "supplemental"}, {"id": 25, "question": "Reading comic books ______ fun.", "options": ["is", "are", "has", "have"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜動名詞當主詞 + 單數 be 動詞", "explanation": "【句型】動名詞片語當主詞視為單數；fun 在此當形容詞/名詞補語，前面用 be 動詞。\n【分析】主詞是 Reading comic books（看漫畫這件事），視為單數，後面接 fun 作補語，用 is。\n【其他選項】(B) are：誤把 books 當主詞；(C) has、(D) have：fun 前要用 be 動詞，不用 have。\n【例句】Cooking with my mom is fun.", "explanationSource": "source"}, {"id": 26, "question": "Flying kites on the beach ______ a lot of fun.", "options": ["are", "has", "is", "have"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 25 題）", "explanation": "動名詞主詞單數，接補語用 is。", "explanationSource": "supplemental"}, {"id": 27, "question": "Building sandcastles ______ fun for the kids.", "options": ["is", "are", "have", "has"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 25 題）", "explanation": "Building sandcastles 視為單數，用 is。", "explanationSource": "supplemental"}, {"id": 28, "question": "Telling jokes to my classmates ______ always fun.", "options": ["are", "has", "have", "is"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 25 題）", "explanation": "動名詞主詞單數，用 is。", "explanationSource": "supplemental"}, {"id": 29, "question": "Playing in the water ______ lots of fun on a hot summer day.", "options": ["is", "are", "has", "have"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜動名詞當主詞 + 單數 be 動詞", "explanation": "【句型】動名詞片語當主詞視為單數；S + be + (lots of) fun。\n【分析】主詞是 Playing in the water（玩水這件事），單數；lots of fun 是補語，前面用 be 動詞 is。\n【其他選項】(B) are 用於複數主詞；(C) has、(D) have 不能表示「是很好玩的」。\n【例句】Camping in the mountains is lots of fun.", "explanationSource": "source"}, {"id": 30, "question": "Riding a bike along the river ______ a lot of fun.", "options": ["have", "is", "has", "are"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 29 題）", "explanation": "動名詞主詞單數，用 is。", "explanationSource": "supplemental"}, {"id": 31, "question": "Making dumplings with my family ______ great fun during Chinese New Year.", "options": ["are", "have", "is", "has"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 29 題）", "explanation": "動名詞主詞單數，用 is。", "explanationSource": "supplemental"}, {"id": 32, "question": "Shopping with friends ______ more fun than shopping alone.", "options": ["is", "are", "has", "have"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 29 題）", "explanation": "Shopping 視為單數，用 is。", "explanationSource": "supplemental"}, {"id": 33, "question": "______ a map with you when you go to a place for the first time.", "options": ["Have taken", "Take", "Taking", "To take"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜祈使句句首用原形動詞", "explanation": "【句型】祈使句：句首用原形動詞，省略主詞 you，表示命令或建議。\n【分析】整句沒有主詞也沒有其他主要動詞，是給人的建議「第一次去一個地方時要帶地圖」，所以用原形動詞 Take。\n【其他選項】(A) Have taken 是完成式，缺主詞；(C) Taking 當主詞時後面要有動詞；(D) To take 表目的，後面缺主要子句。\n【例句】Wear a hat when you go out on a sunny day.", "explanationSource": "source"}, {"id": 34, "question": "______ your hands before you eat.", "options": ["Washing", "To wash", "Wash", "Washed"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 33 題）", "explanation": "祈使句句首用原形動詞 Wash。", "explanationSource": "supplemental"}, {"id": 35, "question": "______ some water with you when you go hiking.", "options": ["Bring", "Bringing", "Brought", "To bring"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 33 題）", "explanation": "給建議的祈使句用原形 Bring。", "explanationSource": "supplemental"}, {"id": 36, "question": "______ the light when you leave the classroom.", "options": ["Turning off", "To turn off", "Turned off", "Turn off"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 33 題）", "explanation": "祈使句用原形 Turn off。", "explanationSource": "supplemental"}, {"id": 37, "question": "______ in the daytime is not good for you. You may not sleep well at night and feel tired the next day.", "options": ["Slept", "Sleeps", "Have slept", "Sleeping"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜Ving 當主詞", "explanation": "【句型】句首 Ving（動名詞）當主詞 + 單數動詞。\n【分析】句子已有主要動詞 is，空格需要一個主詞，「白天睡覺」這件事用動名詞 Sleeping 當主詞。\n【其他選項】(A) Slept、(B) Sleeps、(C) Have slept 都是動詞的變化形，不能當主詞，且會讓句子有兩個動詞。\n【例句】Swimming in the sea is exciting.", "explanationSource": "source"}, {"id": 38, "question": "______ too much fast food is bad for your health.", "options": ["Eat", "Eats", "Eating", "Ate"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 37 題）", "explanation": "句子已有動詞 is，句首用 Ving 當主詞。", "explanationSource": "supplemental"}, {"id": 39, "question": "______ to music makes me relaxed.", "options": ["Listening", "Listen", "Listened", "Listens"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 37 題）", "explanation": "makes 為主要動詞，句首用動名詞 Listening。", "explanationSource": "supplemental"}, {"id": 40, "question": "______ on the phone while driving is very dangerous.", "options": ["Talks", "Talking", "Talk", "Talked"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 37 題）", "explanation": "句首動名詞 Talking 當主詞。", "explanationSource": "supplemental"}, {"id": 41, "question": "______ the lesson before class gives me a better idea about what the teacher is going to teach.", "options": ["Preview", "Previews", "Previewed", "Previewing"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜Ving 當主詞 + 單數動詞", "explanation": "【句型】句首 Ving（動名詞）片語當主詞，後接單數動詞。\n【分析】句子的主要動詞是 gives，空格需要主詞，用動名詞 Previewing（預習）：Previewing the lesson before class gives me…。\n【其他選項】(A) Preview 原形放句首是祈使句，但句子已有 gives；(B) Previews、(C) Previewed 是動詞，不能當主詞。\n【例句】Reviewing your notes after class helps you remember more.", "explanationSource": "source"}, {"id": 42, "question": "______ a cup of hot milk before bed makes Jenny sleepy.", "options": ["Drinks", "Drinking", "Drink", "Drank"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 41 題）", "explanation": "makes 為主要動詞，句首用 Drinking 當主詞。", "explanationSource": "supplemental"}, {"id": 43, "question": "______ English songs helps Kevin practice his listening.", "options": ["Singing", "Sing", "Sang", "Sings"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 41 題）", "explanation": "helps 為主要動詞，句首用動名詞 Singing。", "explanationSource": "supplemental"}, {"id": 44, "question": "______ with classmates gives me new ideas for the project.", "options": ["Talk", "Talks", "Talked", "Talking"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 41 題）", "explanation": "句首動名詞 Talking 當主詞。", "explanationSource": "supplemental"}, {"id": 45, "question": "John always goes to bed late at night, so ______ early is difficult for him.", "options": ["get up", "got up", "gets up", "getting up"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜Ving 當子句主詞", "explanation": "【句型】動名詞（Ving）片語當主詞 + 單數動詞。\n【分析】so 後是新的子句，主要動詞是 is，空格需要主詞，用動名詞 getting up early「早起這件事」。\n【其他選項】(A) get up、(B) got up、(C) gets up 都是動詞形式，不能當主詞，子句會有兩個動詞。\n【例句】Waking up at six is not easy for me.", "explanationSource": "source"}, {"id": 46, "question": "Mia is afraid of water, so ______ in the sea is scary for her.", "options": ["swimming", "swim", "swam", "swims"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 45 題）", "explanation": "is 為主要動詞，空格用動名詞 swimming 當主詞。", "explanationSource": "supplemental"}, {"id": 47, "question": "Ted is very shy, so ______ in front of people is hard for him.", "options": ["speaks", "speaking", "speak", "spoke"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 45 題）", "explanation": "子句主詞用動名詞 speaking。", "explanationSource": "supplemental"}, {"id": 48, "question": "My house is far from school, so ______ there takes me an hour.", "options": ["walk", "walked", "walking", "walks"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 45 題）", "explanation": "takes 為主要動詞，主詞用 walking。", "explanationSource": "supplemental"}]};</script><script src="longteng-b1u5-quiz.js?v=20261106-3"></script><script>document.querySelector("#description").textContent="共 48 題（會考歷屆＋講義錯題 12 題＋類似題 36 題）｜選答後顯示中文解析｜答錯可重做並下載錯題";</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
