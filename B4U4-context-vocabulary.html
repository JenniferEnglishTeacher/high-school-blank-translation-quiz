const TITLE="翰林 Book 4 Unit 4 第六大題 文意字彙",KIND="fill",Q=[{"id":1,"prompt":"My mom isn’t home tonight, so I have to cook dinner m ______ f.","answers":[{"display":"myself","accepted":["myself"]}],"answerRaw":"myself","explanation":"我媽媽今晚不在家，所以我必須「自己」煮晚餐。","full":"My mom isn’t home tonight, so I have to cook dinner myself."},{"id":2,"prompt":"Dad is p ______ ring lunch in the kitchen for Mom and me. We all can’t wait to eat it!","answers":[{"display":"preparing","accepted":["preparing"]}],"answerRaw":"preparing","explanation":"爸爸正在廚房「準備」午餐給媽媽和我。我們都等不及要吃了！","full":"Dad is preparing lunch in the kitchen for Mom and me. We all can’t wait to eat it!"},{"id":3,"prompt":"He sh ______ d do his homework before he watches TV.","answers":[{"display":"should","accepted":["should"]}],"answerRaw":"should","explanation":"看電視之前他「應該」做功課。","full":"He should do his homework before he watches TV."},{"id":4,"prompt":"Julia: What is the s ______ e of our classroom? Nora: I don’t know. Let’s go ask Mrs. Smith!","answers":[{"display":"size","accepted":["size"]}],"answerRaw":"size","explanation":"Julia：你知道我們教室的「尺寸」嗎？Nora：不知道。讓我們去問　Mrs. Smith　吧！","full":"Julia: What is the size of our classroom? Nora: I don’t know. Let’s go ask Mrs. Smith!"},{"id":5,"prompt":"People m ______ tn’t feed the animals in the zoo.","answers":[{"display":"mustn’t","accepted":["mustn’t"]}],"answerRaw":"mustn’t","explanation":"人們「絕不可以」餵食動物園裡的動物。","full":"People mustn’t’t feed the animals in the zoo."},{"id":6,"prompt":"There are a lot of butterflies（ 蝴蝶）flying in the g ______ n.","answers":[{"display":"garden","accepted":["garden"]}],"answerRaw":"garden","explanation":"「花園」裡有很多蝴蝶在飛。","full":"There are a lot of butterflies（ 蝴蝶）flying in the garden."},{"id":7,"prompt":"Look! The f ______ gs in the pond are singing happily.","answers":[{"display":"frogs","accepted":["frogs"]}],"answerRaw":"frogs","explanation":"看！那些池塘裡的「青蛙」正在開心唱著歌。","full":"Look! The frogs in the pond are singing happily."},{"id":8,"prompt":"When we are having dinner, we like to watch the n ______ s on TV.","answers":[{"display":"news","accepted":["news"]}],"answerRaw":"news","explanation":"當我們在吃晚餐時，我們喜歡看電視上的「新聞」。","full":"When we are having dinner, we like to watch the news on TV."},{"id":9,"prompt":"The hat is p ______ y. No wonder（難怪）every girl wants to get one.","answers":[{"display":"pretty","accepted":["pretty"]}],"answerRaw":"pretty","explanation":"那頂帽子很「漂亮」。難怪每個女孩都想要一頂。","full":"The hat is pretty. No wonder（難怪）every girl wants to get one."},{"id":10,"prompt":"After Dad went home last night, he turned on the l ______ t and watched TV.","answers":[{"display":"light","accepted":["light"]}],"answerRaw":"light","explanation":"爸爸昨晚回家後，他打開「電燈」並看電視。","full":"After Dad went home last night, he turned on the light and watched TV."},{"id":11,"prompt":"Jenny really wants to buy the l t shoes, so she asks her mom to give her some money.","answers":[{"display":"latest","accepted":["latest"]}],"answerRaw":"latest","explanation":"Jenny　真地很想要買那雙「最新的」鞋子，所以她要求她媽媽給她一些錢。","full":"Jenny really wants to buy the latest shoes, so she asks her mom to give her some money."},{"id":12,"prompt":"Please turn off the flashlight. The light is s ______ ning in my eyes.","answers":[{"display":"shining","accepted":["shining"]}],"answerRaw":"shining","explanation":"請關掉手電筒。燈光照到我的眼睛。","full":"Please turn off the flashlight. The light is shining in my eyes."},{"id":13,"prompt":"Kevin and his parents went camping yesterday. They saw many s rs shining in the sky at night.","answers":[{"display":"stars","accepted":["stars"]}],"answerRaw":"stars","explanation":"Kevin　和他父母昨天去露營。他們晚上在天上看到很多「星星」閃耀著。","full":"Kevin and his parents went camping yesterday. They saw many stars shining in the sky at night."},{"id":14,"prompt":"Grandma planted some r es in her garden last week.","answers":[{"display":"roses","accepted":["roses"]}],"answerRaw":"roses","explanation":"奶奶上週在花園種了一些「玫瑰花」。","full":"Grandma planted some roses in her garden last week."},{"id":15,"prompt":"It’s so dark here. Why don’t you turn on the l ______ ts?","answers":[{"display":"lights","accepted":["lights"]}],"answerRaw":"lights","explanation":"這裡好暗。你為何不開「燈」呢？","full":"It’s so dark here. Why don’t you turn on the lights?"},{"id":16,"prompt":"The sun finally came out after the rain, and we can see a r ______ w above the mountain.","answers":[{"display":"rainbow","accepted":["rainbow"]}],"answerRaw":"rainbow","explanation":"雨後終於出太陽，而我們可以在山的上方看到「彩虹」。","full":"The sun finally came out after the rain, and we can see a rainbow above the mountain."},{"id":17,"prompt":"Mom is happy because you did the dishes by y ______ f tonight.","answers":[{"display":"yourself","accepted":["yourself"]}],"answerRaw":"yourself","explanation":"媽媽很開心，因為你今晚「自己」洗碗。","full":"Mom is happy because you did the dishes by yourself tonight."},{"id":18,"prompt":"Look! The man is t ning his dog to catch a ball.","answers":[{"display":"training","accepted":["training"]}],"answerRaw":"training","explanation":"看！那個男人正在「訓練」他的狗接球。","full":"Look! The man is training his dog to catch a ball."},{"id":19,"prompt":"There is no s ______ e for Joe’s family to keep（飼養）a dog, so they decided to keep a bird.","answers":[{"display":"space","accepted":["space"]}],"answerRaw":"space","explanation":"Joe　的家庭沒有「空間」養一隻狗，所以他們決定養一隻鳥。","full":"There is no space for Joe’s family to keep（飼養）a dog, so they decided to keep a bird."},{"id":20,"prompt":"My grandmother keeps a lot of fish in the p ______ d near her house.","answers":[{"display":"pond","accepted":["pond"]}],"answerRaw":"pond","explanation":"我奶奶在她房子旁的「池塘」養了很多魚。","full":"My grandmother keeps a lot of fish in the pond near her house."},{"id":21,"prompt":"The strong t ______ n brought（ 帶來）a lot of rain. Many people have to leave their houses.","answers":[{"display":"typhoon","accepted":["typhoon"]}],"answerRaw":"typhoon","explanation":"那強烈「颱風」帶來大量的雨。很多人必須要離開他們的房子。","full":"The strong typhoon brought（ 帶來）a lot of rain. Many people have to leave their houses."},{"id":22,"prompt":"Let’s turn on the r ______ o to listen to some music.","answers":[{"display":"radio","accepted":["radio"]}],"answerRaw":"radio","explanation":"讓我們打開「收音機」來聽一些音樂吧。","full":"Let’s turn on the radio to listen to some music."},{"id":23,"prompt":"Mom and I will r ______ h Taipei at 5:30 by train, and Dad will pick us at the station.","answers":[{"display":"reach","accepted":["reach"]}],"answerRaw":"reach","explanation":"媽媽和我將會在五點半「到達」臺北，而爸爸會在車站接我們。","full":"Mom and I will reach Taipei at 5:30 by train, and Dad will pick us at the station."},{"id":24,"prompt":"Cheer up!（振作點！）You need to f ______ e your fears!","answers":[{"display":"face","accepted":["face"]}],"answerRaw":"face","explanation":"振作點！你需要面對你的恐懼！","full":"Cheer up!（振作點！）You need to face your fears!"},{"id":25,"prompt":"Judy’s mother works ______ a police officer. She is busy every day.","answers":[{"display":"as","accepted":["as"]}],"answerRaw":"as","explanation":"Judy　的媽媽的工作「為」一位警察。她每天都很忙碌。","full":"Judy’s mother works as a police officer. She is busy every day."},{"id":26,"prompt":"Mary will be very happy John buys her ninety-nine roses.","answers":[{"display":"if","accepted":["if"]}],"answerRaw":"if","explanation":"「假如」John　買九十九朵玫瑰花給　Mary，她將會非常開心。","full":"Mary will be very happy if John buys her ninety-nine roses."},{"id":27,"prompt":"Jane likes to the radio and read books at night.","answers":[{"display":"turn","accepted":["turn"]},{"display":"on","accepted":["on"]}],"answerRaw":"turn；on","explanation":"Jane　喜歡在晚上「打開」收音機並閱讀書籍。","full":"Jane likes to turn on the radio and read books at night."},{"id":28,"prompt":"When we were kids, we liked to sit under the g ______ t tree on the hot summer days.","answers":[{"display":"giant","accepted":["giant"]}],"answerRaw":"giant","explanation":"當我們是孩子時，我們喜歡在炎熱的夏日坐在「大」樹下。","full":"When we were kids, we liked to sit under the giant tree on the hot summer days."},{"id":29,"prompt":"You must do your homework now, ______ Mom will be very angry（生 氣的）.","answers":[{"display":"or","accepted":["or"]}],"answerRaw":"or","explanation":"你必須現在寫你的作業，「否則」媽媽會非常生氣。","full":"You must do your homework now, or Mom will be very angry（生 氣的）."},{"id":30,"prompt":"Many people got hurt in that big e ______ e. We have to help them.","answers":[{"display":"earthquake","accepted":["earthquake"]}],"answerRaw":"earthquake","explanation":"很多人在那場大「地震」中受傷了。我們必須幫助他們。","full":"Many people got hurt in that big earthquake. We have to help them."},{"id":31,"prompt":"My room is three t ______ es bigger than my sister’s, so my sister usually comes to my room to sleep with me.","answers":[{"display":"times","accepted":["times"]}],"answerRaw":"times","explanation":"我的房間是我妹妹的三「倍」大，所以我妹妹常常來我房間跟我一起睡覺。","full":"My room is three times bigger than my sister’s, so my sister usually comes to my room to sleep with me."},{"id":32,"prompt":"It’s eleven o’clock at night. Please do not make any n ______ e.","answers":[{"display":"noise","accepted":["noise"]}],"answerRaw":"noise","explanation":"現在是晚上十一點。請不要製造任何「噪音」。","full":"It’s eleven o’clock at night. Please do not make any noise."},{"id":33,"prompt":"The mother fought b ______ ly for her children, and she won（贏）at the end.","answers":[{"display":"bravely","accepted":["bravely"]}],"answerRaw":"bravely","explanation":"那位媽媽為她的孩子「勇敢地」戰鬥，而最後她贏了。","full":"The mother fought bravely for her children, and she won（贏）at the end."},{"id":34,"prompt":"The candle w ______ t o ______ t because of the strong wind.","answers":[{"display":"went","accepted":["went"]},{"display":"out","accepted":["out"]}],"answerRaw":"went；out","explanation":"蠟燭因為強風而「熄滅」了。","full":"The candle went out because of the strong wind."},{"id":35,"prompt":"Grandpa enjoys sitting on the b y and reading books every morning.","answers":[{"display":"balcony","accepted":["balcony"]}],"answerRaw":"balcony","explanation":"爺爺每天早上喜歡坐在「陽臺」上並閱讀書籍。","full":"Grandpa enjoys sitting on the balcony and reading books every morning."},{"id":36,"prompt":"If we want to go to the garden, we have to go t ______ h the building.","answers":[{"display":"through","accepted":["through"]}],"answerRaw":"through","explanation":"如果我們想要去花園，我們必須「穿越」那棟建築物。","full":"If we want to go to the garden, we have to go through the building."},{"id":37,"prompt":"To get good grades（成績）, Ken will t ______ y his b ______ t to study hard.","answers":[{"display":"try","accepted":["try"]},{"display":"best","accepted":["best"]}],"answerRaw":"try；best","explanation":"為了得到好成績，Ken　將會「盡力」認真讀書。","full":"To get good grades（成績）, Ken will try his best to study hard."},{"id":38,"prompt":"A beautiful r ______ w with seven colors sometimes hangs in the sky after the rain.","answers":[{"display":"rainbow","accepted":["rainbow"]}],"answerRaw":"rainbow","explanation":"雨後漂亮的七色「彩虹」有時高掛在天空中。","full":"A beautiful rainbow with seven colors sometimes hangs in the sky after the rain."},{"id":39,"prompt":"The wind is so strong. It blew out all the c ______ es in the room.","answers":[{"display":"candles","accepted":["candles"]}],"answerRaw":"candles","explanation":"那陣風很強。它把房間內所有的「蠟燭」都吹熄了。","full":"The wind is so strong. It blew out all the candles in the room."},{"id":40,"prompt":"Be careful of the s ______ p knife. Don’t hurt yourself.","answers":[{"display":"sharp","accepted":["sharp"]}],"answerRaw":"sharp","explanation":"小心那把「尖銳的」刀子。不要弄傷自己了。","full":"Be careful of the sharp knife. Don’t hurt yourself."}];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=s=>String(s??'').trim().toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:()“”"]/g,'').replace(/\s+/g,' ');
let chosen=[],idx=0;const wrong=new Map(),attempted=new Set(),correct=new Set();
function preview(q){return KIND==='mcq'?q.stem:q.prompt}
function renderList(){$('#list').innerHTML=Q.map(q=>`<label class="pick"><input class="pickbox" type="checkbox" value="${q.id}" checked><span><b>第 ${q.id} 題</b><small>${esc(preview(q))}</small></span></label>`).join('')}
function setAll(v){document.querySelectorAll('.pickbox').forEach(x=>x.checked=v)}
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
$('#all').onclick=()=>setAll(true);$('#none').onclick=()=>setAll(false);$('#random').onclick=()=>{setAll(false);const ids=new Set(shuffled(Q).slice(0,20).map(q=>q.id));document.querySelectorAll('.pickbox').forEach(x=>x.checked=ids.has(+x.value))};
$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));idx=0;wrong.clear();attempted.clear();correct.clear();$('#select').classList.add('hidden');$('#result').classList.add('hidden');$('#quiz').classList.remove('hidden');show()};
function show(){if(window.speechSynthesis)speechSynthesis.cancel();const q=chosen[idx];$('#meta').textContent=`第 ${idx+1} / ${chosen.length} 題｜原題 ${q.id}`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=`${idx/chosen.length*100}%`;$('#stem').textContent=KIND==='mcq'?q.stem:q.prompt;const pic=$('#picture');if(q.image){pic.src=q.image;pic.classList.remove('hidden')}else{pic.classList.add('hidden');pic.removeAttribute('src')};if(KIND==='mcq'){$('#area').className='options';$('#area').innerHTML=q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b><span>${esc(o)}</span></label>`).join('')}else{$('#area').className='answer-grid';$('#area').innerHTML=q.answers.map((a,i)=>`<div class="answer-row"><label>空格 ${i+1}</label><input class="answer-input" data-i="${i}" autocomplete="off" spellcheck="false" placeholder="請輸入答案"></div>`).join('')};$('#feedback').className='feedback hidden';$('#voicebox').classList.add('hidden');$('#check').classList.remove('hidden');$('#next').classList.add('hidden')}
function remember(q,value){if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(value);$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
function spoken(q){return q.full||((KIND==='mcq')?q.stem.replace(/^\(\s*\)\s*/,'').replace(/_{3,}/,q.options[q.answer]):q.answers.map(a=>a.accepted[0]).join(' '))}
function speak(){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(spoken(chosen[idx]));u.lang='en-US';u.rate=.88;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/^en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;speechSynthesis.speak(u)}
function success(q){correct.add(q.id);$('#bar').style.width=`${(idx+1)/chosen.length*100}%`;$('#feedback').className='feedback ok';$('#feedback').innerHTML='✅ 全部正確！<br>'+esc(q.explanation||'');$('#target').textContent=spoken(q);$('#voicebox').classList.remove('hidden');$('#check').classList.add('hidden');$('#next').classList.remove('hidden');speak()}
$('#check').onclick=()=>{const q=chosen[idx];attempted.add(q.id);if(KIND==='mcq'){const sel=document.querySelector('input[name=answer]:checked');if(!sel)return alert('請先選擇答案。');const n=+sel.value;if(n===q.answer)return success(q);remember(q,String.fromCharCode(65+n)+'. '+q.options[n]);$('#feedback').className='feedback bad';$('#feedback').innerHTML=`❌ 答錯了。正確答案：<strong>${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</strong><br>${esc(q.explanation||'')}<br>請重新選擇正確答案。`;return}const ins=[...document.querySelectorAll('.answer-input')];if(ins.some(x=>!x.value.trim()))return alert('請完成所有答案。');const bad=[];ins.forEach((input,i)=>{const a=q.answers[i];input.classList.remove('ok','bad');if(a.accepted.some(x=>norm(x)===norm(input.value))){input.classList.add('ok');input.disabled=true}else{input.classList.add('bad');bad.push(`${i+1}. ${input.value} → ${a.display}`);input.value=''}});if(!bad.length)return success(q);remember(q,bad.join('；'));$('#feedback').className='feedback bad';$('#feedback').innerHTML=`❌ 有 ${bad.length} 格不正確。<br>正確答案：${q.answers.map((a,i)=>`${i+1}. <strong>${esc(a.display)}</strong>`).join('；')}<br>${esc(q.explanation||'')}<br>請依提示重新填寫。`;ins.find(x=>!x.disabled)?.focus()};
$('#speak').onclick=speak;$('#next').onclick=()=>{idx++;idx>=chosen.length?finish():show()};$('#finish').onclick=finish;
function answerText(q){return KIND==='mcq'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.answerRaw}
function finish(){if(window.speechSynthesis)speechSynthesis.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');$('#summary').innerHTML=`<div class="stat">選擇題數<b>${chosen.length}</b></div><div class="stat">已作答<b>${attempted.size}</b></div><div class="stat">完成答對<b>${correct.size}</b></div><div class="stat">曾答錯<b>${wrong.size}</b></div>`;$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>`<div class="wrong"><b>${i+1}. 原題 ${r.q.id}｜${esc(preview(r.q))}</b><p>錯誤紀錄：${r.attempts.map(esc).join('<br>')}</p><p><strong>正確答案：</strong>${esc(answerText(r.q))}</p><p>${esc(r.q.explanation||'')}</p></div>`).join(''):'<div class="feedback ok">🎉 沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size)}
$('#restart').onclick=()=>location.reload();$('#download').onclick=async()=>{if(!wrong.size)return;const rows=[...wrong.values()],stamp=new Date().toISOString().slice(0,10),name=TITLE.replace(/\s+/g,'_')+'_錯題_'+stamp;const save=(blob,ext)=>{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name+ext;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};try{const{Document,Packer,Paragraph,TextRun,HeadingLevel}=await import('https://esm.sh/docx@9.5.1');const children=[new Paragraph({heading:HeadingLevel.TITLE,children:[new TextRun({text:TITLE+' 錯題紀錄',bold:true})]})];rows.forEach((r,i)=>{children.push(new Paragraph({heading:HeadingLevel.HEADING_2,children:[new TextRun({text:`${i+1}. 原題 ${r.q.id}`,bold:true})]}),new Paragraph({text:preview(r.q)}),new Paragraph({children:[new TextRun({text:'錯誤紀錄：',bold:true}),new TextRun({text:r.attempts.join(' | ')})]}),new Paragraph({children:[new TextRun({text:'正確答案：',bold:true}),new TextRun({text:answerText(r.q)})]}),new Paragraph({children:[new TextRun({text:'解析：',bold:true}),new TextRun({text:r.q.explanation||''})]}))});save(await Packer.toBlob(new Document({sections:[{children}]})),'.docx')}catch(e){save(new Blob([TITLE+' 錯題紀錄\n\n'+rows.map(r=>preview(r.q)+'\n正確答案：'+answerText(r.q)+'\n').join('\n')],{type:'text/plain;charset=utf-8'}),'.txt')}};
renderList();
