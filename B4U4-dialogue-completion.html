I watch TV for two hours? Mom: No way! ______","options":["I’ll let you watch TV for one hour if you finish your homework before dinner.","You can watch TV if you help me with my homework.","Watch TV first, and do your homework.","You can do that now."],"answer":0,"explanation":"Roy　想看兩小時的電視，但媽媽以「如果　Roy　晚餐前做完功課，就可以看一小時的電視。」回應。","full":"Roy: Mom, can I watch TV for two hours? Mom: No way! I’ll let you watch TV for one hour if you finish your homework before dinner."},{"id":7,"stem":"(   ) Joe: What must we do to get good grades（成績）? Fiona: ______","options":["We have to close all the windows.","We will go to school tomorrow.","We must study hard ourselves.","We can turn on the radio."],"answer":2,"explanation":"要得到好成績就必須要「自己努力讀書」。","full":"Joe: What must we do to get good grades（成績）? Fiona: We must study hard ourselves."},{"id":8,"stem":"(   ) Ann: What will you do if you have one thousand dollars? Leo: ______","options":["I closed the windows.","Enjoy yourself!","I’ll buy a gift for my mom.","No worries."],"answer":2,"explanation":"如果　Leo　有一千元的話，「他會買給他媽媽一份禮物。」","full":"Ann: What will you do if you have one thousand dollars? Leo: I’ll buy a gift for my mom."},{"id":9,"stem":"(   ) Mia: My husband and I are taking a trip to Japan this weekend. Liz: ______","options":["Enjoy yourselves.","Are you going to do that for fun?","Let’s go shopping later.","Help yourself to all the yummy food."],"answer":0,"explanation":"這個週末　Mia　和她先生將去日本旅行，Liz　對　Mia　說「祝你們玩得愉快。」。","full":"Mia: My husband and I are taking a trip to Japan this weekend. Liz: Enjoy yourselves."},{"id":10,"stem":"(   ) ______ if it is sunny tomorrow.","options":["We should stay at home","My sister had to close the windows","Mom will go shopping","I must be pretty"],"answer":2,"explanation":"if　引導的假設語氣，主要句子須用「未來式」。假如明天晴天，「媽媽將會去購物」。","full":"Mom will go shopping if it is sunny tomorrow."},{"id":11,"stem":"(   ) Jill: What should we do if a typhoon is coming? Sophia: ______","options":["We have to turn on flashlights.","It will be so dark.","We should move the plants inside the house.","We must go to school tomorrow."],"answer":2,"explanation":"颱風來要「把植物搬進房子內」。","full":"Jill: What should we do if a typhoon is coming? Sophia: We should move the plants inside the house."},{"id":12,"stem":"(   ) Kelly: What should we do when the lights go out? Ben: ______","options":["We can listen to the latest news.","You have to turn on the fan.","We must prepare some food.","We should turn on flashlights."],"answer":3,"explanation":"Kelly　問　Ben　沒有電的時候應該要做什麼，Ben　以「我們應該要打開手電筒。」回應。","full":"Kelly: What should we do when the lights go out? Ben: We should turn on flashlights."},{"id":13,"stem":"(   ) We need to move plants on the balcony, ______","options":["or the strong wind might blow them away","and we must be scared of typhoons","but we have flashlights","or we have to turn on the light"],"answer":0,"explanation":"我們需要搬動陽臺上的植物，「否則強風可能會把它們吹走」。","full":"We need to move plants on the balcony, or the strong wind might blow them away"},{"id":14,"stem":"(   ) Winnie: We don’t have to go to school tomorrow because of the strong typhoon. Ray: Great! ______","options":["No worries!","I’m scared!","A typhoon holiday!","I’m trying my best!"],"answer":2,"explanation":"因為強颱，所以明天不用上課。Ray　以「太棒了！颱風假！」回應。","full":"Winnie: We don’t have to go to school tomorrow because of the strong typhoon. Ray: Great! A typhoon holiday!"},{"id":15,"stem":"(   ) Gina: What should you do if an earthquake happens? Leo: ______","options":["We need to see the rainbow in the sky.","We must go through sharp glass.","We should stay outside（在 …外面）the house.","We can see rescue dogs."],"answer":2,"explanation":"當地震發生時，「我們應該要待在房子外面。」","full":"Gina: What should you do if an earthquake happens? Leo: We should stay outside（在 …外面）the house."},{"id":16,"stem":"(   ) We can often see rescue dogs in an earthquake rescue. ______","options":["We must save lives.","They make rescue work go faster.","They will work as survivors.","They shouldn’t reach small spaces."],"answer":1,"explanation":"我們常常可以在地震救援現場看到救難犬。「牠們可以讓救援工作更快速。」","full":"We can often see rescue dogs in an earthquake rescue. They make rescue work go faster."},{"id":17,"stem":"(   ) Ethan: Dad, Mom and I are going to Green Island next Sunday. Dad: ______ Ethan: Thanks, Dad.","options":["No worries.  ______","You did a good job.","That would be fine with me.","Enjoy yourselves!"],"answer":3,"explanation":"Ethan　跟媽媽下週將要去綠島，所以爸爸祝他們「玩得開心！」","full":"Ethan: Dad, Mom and I are going to Green Island next Sunday. Dad: Enjoy yourselves! Ethan: Thanks, Dad."},{"id":18,"stem":"(   ) ______ if it rains this afternoon.","options":["We visited the zoo","Let’s do more exercise at the park","We won’t have to practice soccer","Let’s go out for more fun"],"answer":2,"explanation":"如果今天下午下雨，「我們將不必練習足球」。","full":"We won’t have to practice soccer if it rains this afternoon."},{"id":19,"stem":"(   ) We should ______ when the lights go out.","options":["listen to the news","blow roses away","go shopping for some food","turn on flashlights"],"answer":3,"explanation":"當電燈熄滅時，我們應該要「打開手電筒」。","full":"We should turn on flashlights when the lights go out."},{"id":20,"stem":"(   ) It’s dark here. ______","options":["We can see the giant star shining in the sky.","There is a rainbow with seven colors.","We should turn off the light.","We must feel the ground shaking."],"answer":0,"explanation":"這裡好暗。「我們可以看到那顆巨大星星在天空中閃耀著。」","full":"It’s dark here. We can see the giant star shining in the sky."},{"id":21,"stem":"(   ) Hank: The typhoon is coming. May: Let’s go to the supermarket to buy some cookies. Hank: ______","options":["We should stay at home.","We must turn on the radio.","We don’t have candles.","We have to prepare some food."],"answer":3,"explanation":"Hank　說颱風要來了。「我們必須準備一些食物。」May　才會回應要去超市買一些餅乾。","full":"Hank: The typhoon is coming. May: Let’s go to the supermarket to buy some cookies. Hank: We have to prepare some food."},{"id":22,"stem":"(   ) Dora trained herself to ______, and now she doesn’t be scared of spiders.","options":["make breakfast","face the fear","walk to school","see the stars"],"answer":1,"explanation":"Dora　訓練自己「面對恐懼」，現在她不會害怕蜘蛛。","full":"Dora trained herself to face the fear, and now she doesn’t be scared of spiders."},{"id":23,"stem":"(   ) Ted: Mom, what happened to you? Mom: ______","options":["A rock hit our boat.","The sun is shining in the sky.","Fish are hiding under the rocks.","The turtles swam happily in the water."],"answer":0,"explanation":"Ted　想知道媽媽發生什麼事，媽媽以「一顆岩石撞到了我們的船。」回應。","full":"Ted: Mom, what happened to you? Mom: A rock hit our boat."},{"id":24,"stem":"(   ) Harper: It’s so dark. I am scared. I don’t want to sleep by myself. Mrs. Jones: ______ Good night, my dear.","options":["I’m trying my best.","You don’t have to sleep now.","Is everything OK?","You should face the fear of the dark."],"answer":3,"explanation":"Harper　覺得太黑了會害怕，不敢自己睡覺。Mrs. Jones　以「妳應該要面對黑暗的恐懼。」回應。","full":"Harper: It’s so dark. I am scared. I don’t want to sleep by myself. Mrs. Jones: You should face the fear of the dark. Good night, my dear."},{"id":25,"stem":"(   ) Vic: What will rescue dogs do if they find survivors? Penny: ______","options":["They will be a good rescue team.","They will make a sound to let their team know.","They do their job bravely.","They should let people know."],"answer":1,"explanation":"當救難犬找到生還者時，「牠們會發出聲音讓牠們的團隊知道」。","full":"Vic: What will rescue dogs do if they find survivors? Penny: They will make a sound to let their team know."},{"id":26,"stem":"(   ) Jenny ______. She is busy at school from Monday to Friday.","options":["works as a teacher","hears the baby crying","should go to school by bus","must be herself"],"answer":0,"explanation":"Jenny「是一位老師」。她週一到週五在學校忙碌著。","full":"Jenny works as a teacher. She is busy at school from Monday to Friday."},{"id":27,"stem":"(   ) ______ No one helped him to do it.","options":["Albert heard the wind blowing.","Mike made the breakfast by himself.","Kevin’s sister drove him to work.","Bill heard his brother crying."],"answer":1,"explanation":"「Mike　自己做早餐。」沒有人幫忙他。","full":"Mike made the breakfast by himself. No one helped him to do it."},{"id":28,"stem":"(   ) If you are lost in a strange place, ______","options":["stand in circles","save your lives","ask other people for help","you need to take pictures of yourself"],"answer":2,"explanation":"如果你在陌生的地方迷路了，「請求其他人的幫忙」。","full":"If you are lost in a strange place, ask other people for help"},{"id":29,"stem":"(   ) ______, we won’t need to go to school.","options":["If you are happy","If we should study hard","If you must try your best","If we don’t feel well"],"answer":3,"explanation":"「假如我們覺得不舒服」，我們將不需要去上學。","full":"If we don’t feel well, we won’t need to go to school."},{"id":30,"stem":"(   ) ______ I can hear the strong wind blow.","options":["The earthquake is terrible.","The typhoon is coming.","The frogs are making noises in the pond.","It is sunny."],"answer":1,"explanation":"「颱風要來了。」我可以聽到強風吹的聲音。","full":"The typhoon is coming. I can hear the strong wind blow."},{"id":31,"stem":"(   ) Alice ______. She is scared and could not even say a word.","options":["listened to frogs singing in the pond","saw a giant rock hit a car in front of her","felt the wind blowing","watched the star shining in the sky"],"answer":1,"explanation":"Alice「看到一顆巨石擊中她面前的車子」。她很害怕且一句話都說不出來。","full":"Alice saw a giant rock hit a car in front of her. She is scared and could not even say a word."},{"id":32,"stem":"(   ) You should get up early, or ______.","options":["you will be on time","you have to turn on the radio","you will miss the bus","you must close the window"],"answer":2,"explanation":"你應該要早起，否則「你會錯過公車」。","full":"You should get up early, or you will miss the bus."},{"id":33,"stem":"(   ) Rita: There is a typhoon coming. Cathy: We should ______ to listen to the latest news.","options":["see giant waves hitting rocks","go shopping","prepare some candles","turn on the radio"],"answer":3,"explanation":"颱風要來了，所以是要「打開收音機」來聆聽最新的新聞。","full":"Rita: There is a typhoon coming. Cathy: We should turn on the radio to listen to the latest news."},{"id":34,"stem":"(   ) Zoy: Thanks for inviting（邀請）me to your birthday party. Vincent: You are welcome! ______","options":["No worries.","Enjoy yourself.","I’m trying my best.","Is everything OK?"],"answer":1,"explanation":"Zoy　感謝　Vincent　邀請她去生日派對。Vincent　以「不客氣！好好享受。」回應。","full":"Zoy: Thanks for inviting（邀請）me to your birthday party. Vincent: You are welcome! Enjoy yourself."},{"id":35,"stem":"(   ) Rescue dogs can save lives, and ______","options":["they are truly our best friends","they are the smallest animals in the world","you can see them only in Taiwan","they must face their fears"],"answer":0,"explanation":"救難犬可以拯救生命，「牠們真的是我們最好的朋友」。","full":"Rescue dogs can save lives, and they are truly our best friends"},{"id":36,"stem":"(   ) The Wang family went camping near the pond last week. ______","options":["They will see birds flying in the sky.","They have to feel the wind blowing.","They heard frogs making noises all night.","They are watching the rainbow after the rain."],"answer":2,"explanation":"last week（上週）是已發生的事，要用過去式描述。在池塘旁邊露營，應是可以「聽到青蛙整晚發出噪音」。","full":"The Wang family went camping near the pond last week. They heard frogs making noises all night."},{"id":37,"stem":"(   ) The typhoon is coming. I can see ______","options":["the sun shining in the sky","people buying water and food","birds singing in the tree","a dog running after a cat"],"answer":1,"explanation":"颱風要來了，所以看到「人們在買水跟食物」。","full":"The typhoon is coming. I can see people buying water and food"},{"id":38,"stem":"(   ) Joe: It’s raining now, but I didn’t bring my umbrella! Zoe: ______ You can use mine.","options":["It’s so dark.","Let’s go shopping later.","No worries.","You must bring your umbrella."],"answer":2,"explanation":"下雨而　Joe　沒有帶雨傘。Zoe　以「別擔心。你可以用我的。」回應。","full":"Joe: It’s raining now, but I didn’t bring my umbrella! Zoe: No worries. You can use mine."},{"id":39,"stem":"(   ) Nina: What can you hear in the mountains? Coco: ______","options":["The girl painted a picture by herself.","You have to buy an umbrella.","I can hear the bird singing happily.","We are going to row a boat."],"answer":2,"explanation":"Nina　問　Coco　可以在山裡聽到什麼。Coco　以「鳥開心歌唱。」回應。","full":"Nina: What can you hear in the mountains? Coco: I can hear the bird singing happily."},{"id":40,"stem":"(   ) Alan is eleven years old. He ______ by himself.","options":["must be a birthday boy","should brush his teeth","had to see roses in the garden","will be scared"],"answer":1,"explanation":"Alan　十一歲。「他應該要自己刷牙」。","full":"Alan is eleven years old. He should brush his teeth by himself."}];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=s=>String(s??'').trim().toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:()“”"]/g,'').replace(/\s+/g,' ');
let chosen=[],idx=0;const wrong=new Map(),attempted=new Set(),correct=new Set();
function preview(q){return KIND==='mcq'?q.stem:q.prompt}
function renderList(){$('#list').innerHTML=Q.map(q=>`<label class="pick"><input class="pickbox" type="checkbox" value="${q.id}" checked><span><b>第 ${q.id} 題</b><small>${esc(preview(q))}</small></span></label>`).join('')}
function setAll(v){document.querySelectorAll('.pickbox').forEach(x=>x.checked=v)}
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
$('#all').onclick=()=>setAll(true);$('#none').onclick=()=>setAll(false);$('#random').onclick=()=>{setAll(false);const ids=new Set(shuffled(Q).slice(0,20).map(q=>q.id));document.querySelectorAll('.pickbox').forEach(x=>x.checked=ids.has(+x.value))};
$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));idx=0;wrong.clear();attempted.clear();correct.clear();$('#select').classList.add('hidden');$('#result').classList.add('hidden');$('#quiz').classList.remove('hidden');show()};
function show(){if(window.speechSynthesis)speechSynthesis.cancel();const q=chosen[idx];$('#meta').textContent=`第 ${idx+1} / ${chosen.length} 題｜原題 ${q.id}`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=`${idx/chosen.length*100}%`;$('#stem').textContent=KIND==='mcq'?q.stem:q.prompt;const pic=$('#picture');if(q.image){pic.src=q.image;pic.classList.remove('hidden')}else{pic.classList.add('hidden');pic.removeAttribute('src')};if(KIND==='mcq'){$('#area').className='options';$('#area').innerHTML=q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b><span>${esc(o)}</span></label>`).join('')}else{$('#area').className='answer-grid';$('#area').innerHTML=q.answers.map((a,i)=>`<div class="answer-row"><label>空格 ${i+1}</label><input class="answer-input" data-i="${i}" autocomplete="off" spellcheck="false" placeholder="請輸入答案"></div>`).join('')};$('#feedback').className='feedback hidden';$('#voicebox').classList.add('hidden');$('#check').classList.remove('hidden');$('#next').classList.add('hidden')}
function remember(q,value){if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(value);$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
function spoken(q){return q.full||((KIND==='mcq')?q.stem.replace(/^\(\s*\)\s*/,'').replace(/_{3,}/,q.options[q.answer]):q.answers.map(a=>a.accepted[0]).join(' '))}
function speak(){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(spoken(chosen[idx]));u.lang='en-US';u.rate=.88;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/^en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;speechSynthesis.speak(u)}
function success(q){correct.add(q.id);$('#bar').style.width=`${(idx+1)/chosen.length*100}%`;$('#feedback').className='feedback ok';$('#feedback').innerHTML='✅ 全部正確！<br>'+esc(q.explanation||'');$('#target').textContent=spoken(q);$('#voicebox').classList.remove('hidden');$('#check').classList.add('hidden');$('#next').classList.remove('hidden');speak()}
$('#check').onclick=()=>{const q=chosen[idx];attempted.add(q.id);if(KIND==='mcq'){const sel=document.querySelector('input[name=answer]:checked');if(!sel)return alert('請先選擇答案。');const n=+sel.value;if(n===q.answer)return success(q);remember(q,String.fromCharCode(65+n)+'. '+q.options[n]);$('#feedback').className='feedback bad';$('#feedback').innerHTML=`❌ 答錯了。正確答案：<strong>${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</strong><br>${esc(q.explanation||'')}<br>請重新選擇正確答案。`;return}const ins=[...document.querySelectorAll('.answer-input')];if(ins.some(x=>!x.value.trim()))return alert('請完成所有答案。');const bad=[];ins.forEach((input,i)=>{const a=q.answers[i];input.classList.remove('ok','bad');if(a.accepted.some(x=>norm(x)===norm(input.value))){input.classList.add('ok');input.disabled=true}else{input.classList.add('bad');bad.push(`${i+1}. ${input.value} → ${a.display}`);input.value=''}});if(!bad.length)return success(q);remember(q,bad.join('；'));$('#feedback').className='feedback bad';$('#feedback').innerHTML=`❌ 有 ${bad.length} 格不正確。<br>正確答案：${q.answers.map((a,i)=>`${i+1}. <strong>${esc(a.display)}</strong>`).join('；')}<br>${esc(q.explanation||'')}<br>請依提示重新填寫。`;ins.find(x=>!x.disabled)?.focus()};
$('#speak').onclick=speak;$('#next').onclick=()=>{idx++;idx>=chosen.length?finish():show()};$('#finish').onclick=finish;
function answerText(q){return KIND==='mcq'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.answerRaw}
function finish(){if(window.speechSynthesis)speechSynthesis.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');$('#summary').innerHTML=`<div class="stat">選擇題數<b>${chosen.length}</b></div><div class="stat">已作答<b>${attempted.size}</b></div><div class="stat">完成答對<b>${correct.size}</b></div><div class="stat">曾答錯<b>${wrong.size}</b></div>`;$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>`<div class="wrong"><b>${i+1}. 原題 ${r.q.id}｜${esc(preview(r.q))}</b><p>錯誤紀錄：${r.attempts.map(esc).join('<br>')}</p><p><strong>正確答案：</strong>${esc(answerText(r.q))}</p><p>${esc(r.q.explanation||'')}</p></div>`).join(''):'<div class="feedback ok">🎉 沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size)}
$('#restart').onclick=()=>location.reload();$('#download').onclick=async()=>{if(!wrong.size)return;const rows=[...wrong.values()],stamp=new Date().toISOString().slice(0,10),name=TITLE.replace(/\s+/g,'_')+'_錯題_'+stamp;const save=(blob,ext)=>{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name+ext;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};try{const{Document,Packer,Paragraph,TextRun,HeadingLevel}=await import('https://esm.sh/docx@9.5.1');const children=[new Paragraph({heading:HeadingLevel.TITLE,children:[new TextRun({text:TITLE+' 錯題紀錄',bold:true})]})];rows.forEach((r,i)=>{children.push(new Paragraph({heading:HeadingLevel.HEADING_2,children:[new TextRun({text:`${i+1}. 原題 ${r.q.id}`,bold:true})]}),new Paragraph({text:preview(r.q)}),new Paragraph({children:[new TextRun({text:'錯誤紀錄：',bold:true}),new TextRun({text:r.attempts.join(' | ')})]}),new Paragraph({children:[new TextRun({text:'正確答案：',bold:true}),new TextRun({text:answerText(r.q)})]}),new Paragraph({children:[new TextRun({text:'解析：',bold:true}),new TextRun({text:r.q.explanation||''})]}))});save(await Packer.toBlob(new Document({sections:[{children}]})),'.docx')}catch(e){save(new Blob([TITLE+' 錯題紀錄\n\n'+rows.map(r=>preview(r.q)+'\n正確答案：'+answerText(r.q)+'\n').join('\n')],{type:'text/plain;charset=utf-8'}),'.txt')}};
renderList();
</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
