<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>康軒B1U2 依提示回答問題</title><style>:root{--blue:#2563eb;--navy:#1e3a8a;--bg:#f4f7fb;--card:#fff;--line:#dbe3ee;--ink:#172033;--muted:#64748b;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}.wrap{max-width:900px;margin:auto;padding:16px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 5px 18px #0f172a0d}.hero{background:linear-gradient(135deg,#e8f1ff,#fff)}h1{margin:0 0 6px;font-size:clamp(25px,4vw,38px)}h2{margin-top:0}.note{color:var(--muted)}.hidden{display:none!important}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.btn{border:0;border-radius:10px;padding:11px 17px;font-size:16px;font-weight:800;cursor:pointer;background:#e5e7eb;font-family:inherit}.primary{background:var(--blue);color:#fff}.danger{background:#991b1b;color:#fff}.pick{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin:7px 0;background:#fafcff}.pick input{margin-right:8px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:800;margin:8px 0 14px}.zh{padding:10px 13px;background:#fff7ed;border-radius:9px;color:#9a3412;font-weight:800;margin-bottom:10px}.question{font-size:21px;font-weight:750;padding:16px;background:#f8fafc;border-radius:11px;white-space:pre-wrap}.question u{text-decoration-thickness:3px;text-underline-offset:4px;text-decoration-color:var(--blue)}.question img{display:block;max-width:240px;width:100%;height:auto;margin:10px 0 0;border:1px solid var(--line);border-radius:10px;background:#fff}.options{display:grid;gap:9px;margin:14px 0}.option{display:flex;align-items:center;gap:11px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-size:18px;font-weight:750;cursor:pointer}.option:hover{border-color:#60a5fa;background:#eff6ff}.option:has(input:checked){border-color:var(--blue);background:#dbeafe;color:var(--navy)}.option input{width:20px;height:20px;accent-color:var(--blue)}.inputs{display:grid;gap:10px;margin:15px 0}.answer-row{display:grid;grid-template-columns:55px 1fr;gap:10px;align-items:center}.answer-row label{font-weight:900;color:var(--navy);text-align:center}.spell{width:100%;font:inherit;font-size:18px;padding:11px;border:2px solid #94a3b8;border-radius:9px}.feedback{padding:13px;border-radius:10px;font-weight:800;margin:13px 0}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.explain{padding:12px 14px;border-radius:10px;background:#eff6ff;border:1px solid #bfdbfe;color:var(--navy);margin:13px 0}.explain b{margin-right:4px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}.wrong p{margin:6px 0;white-space:pre-wrap}@media(max-width:600px){.wrap{padding:9px}.hero,.card{padding:15px}.question{font-size:18px;padding:13px}.option{font-size:17px}.answer-row{grid-template-columns:42px 1fr}}</style></head>
<body><main class="wrap"><section class="hero"><h1>康軒B1U2 依提示回答問題</h1><p>共 28 題。可自行選題；答錯會顯示正確答案並要求重新作答。</p><p class="note">請輸入完整句子。縮寫（isn’t／is not）都算對；大小寫或標點不同會提醒你。完成後可下載 DOCX 錯題紀錄。</p></section><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn">全部選取</button><button id="none" class="btn">全部取消</button><button id="start" class="btn primary">開始作答</button></div><div id="list"></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden" role="status" aria-live="polite"></div><div id="explain" class="explain hidden"></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="download" class="btn primary">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></main>
<script>
// MODE: "input" = spell one word, "mcq" = four options, "sentence" = type a whole sentence (several accepted answers)
const TITLE = "康軒B1U2 依提示回答問題", MODE = "sentence", IMG = {}, Q = [{"id": 1, "question": "<u>The boy<\/u> is Helen’s child.（將畫線部分改為複數，並做適當變化）", "show": "The boys are Helen’s children.", "answers": ["The boys are Helen’s children."]}, {"id": 2, "question": "A：that / woman / tall / young（完成句子）\nB：She’s smart, too.", "show": "That woman is tall and young.", "answers": ["That woman is tall and young."]}, {"id": 3, "question": "<u>That<\/u> is the farmer’s ox.（將畫線部分改為複數，並做適當變化）", "show": "Those are the farmer’s oxen.", "answers": ["Those are the farmer’s oxen."]}, {"id": 4, "question": "Yes, they are students in this junior high school.\n（造原問句）", "show": "Are / Aren’t they students in this junior high school?", "answers": ["Are they students in this junior high school?", "Aren’t they students in this junior high school?"]}, {"id": 5, "question": "Are those people young?（先否定簡答，再用 old 詳答）", "show": "No, they aren’t. They are old.", "answers": ["No, they aren’t. They are old."]}, {"id": 6, "question": "<u>No<\/u>, those aren’t elephants in the pictures.\n（改成單數並依畫線部分造原問句）", "show": "Is / Isn’t that an elephant in the picture?", "answers": ["Is that an elephant in the picture?", "Isn’t that an elephant in the picture?"]}, {"id": 7, "question": "They are <u>zebras and monkeys<\/u>.\n（依畫線部分造原問句）", "show": "What are they / these / those?", "answers": ["What are they", "What are these", "What are those?"]}, {"id": 8, "question": "they / be / Jason / pet / mouse（完成句子）", "show": "They are Jason’s pet mice.", "answers": ["They are Jason’s pet mice."]}, {"id": 9, "question": "<u>The mouse<\/u> is David’s pet.（將畫線部分改為複數，並做適當變化）", "show": "The mice are David’s pets.", "answers": ["The mice are David’s pets."]}, {"id": 10, "question": "They’re <u>banana cakes<\/u>.（依畫線部分造原問句）", "show": "What are these / those / they?", "answers": ["What are these", "What are those", "What are they?"]}, {"id": 11, "question": "Are the men’s animal signs the rat?（先否定簡答，再以 the rooster 詳答）", "show": "No, they aren’t. Their animal signs are the rooster.", "answers": ["No, they aren’t. Their animal signs are the rooster."]}, {"id": 12, "question": "A：Are these your shoes?\nB：yes / they / we / shoes（完成句子）", "show": "Yes, they are our shoes.", "answers": ["Yes, they are our shoes."]}, {"id": 13, "question": "No, zebras are different from horses.（造原問句）", "show": "Are zebras different from horses?", "answers": ["Are zebras different from horses?"]}, {"id": 14, "question": "are / they / Mr. and Mrs. Brown / daughter（完成句子）", "show": "Are they Mr. and Mrs. Brown’s daughters?", "answers": ["Are they Mr. and Mrs. Brown’s daughters?"]}, {"id": 15, "question": "They are <u>toy cars<\/u>.（依畫線部分造原問句）", "show": "What are those / these / they?", "answers": ["What are those", "What are these", "What are they?"]}, {"id": 16, "question": "those horse / sheep / fox / be / the farmer / pet\n（完成句子）", "show": "Those horses, sheep, and foxes are the farmer’s pets.", "answers": ["Those horses, sheep, and foxes are the farmer’s pets."]}, {"id": 17, "question": "<u>This<\/u> is my pet’s picture.（將畫線部分改為複數，並做適當變化）", "show": "These are my pet’s pictures.", "answers": ["These are my pet’s pictures."]}, {"id": 18, "question": "A：be / this / boys / twelve / year old?（完成句子）\nB：No, they’re thirteen.", "show": "Are these boys twelve years old?", "answers": ["Are these boys twelve years old?"]}, {"id": 19, "question": "This is a beautiful zebra.（改成複數句）", "show": "These are beautiful zebras.", "answers": ["These are beautiful zebras."]}, {"id": 20, "question": "Is that Ariel’s <u>picture<\/u>?（將畫線部分改為 pictures，並做適當變化）", "show": "Are those Ariel’s pictures?", "answers": ["Are those Ariel’s pictures?"]}, {"id": 21, "question": "Ms. Huang is <u>the students’<\/u> English teacher.\n（將畫線部分改為代名詞）", "show": "Ms. Huang is their English teacher.", "answers": ["Ms. Huang is their English teacher."]}, {"id": 22, "question": "Are those Jenny’s grandmother and grandfather?\n（否定詳答）", "show": "No, they aren’t Jenny’s / her grandmother and grandfather.", "answers": ["No, they aren’t Jenny’s grandmother and grandfather.", "No, they aren’t her grandmother and grandfather."]}, {"id": 23, "question": "Are these those people’s cups?（肯定簡答）", "show": "Yes, they are.", "answers": ["Yes, they are."]}, {"id": 24, "question": "A：What is this?\nB：this / be / I / father’s picture（完成句子）", "show": "This is my father’s picture.", "answers": ["This is my father’s picture."]}, {"id": 25, "question": "They are <u>Fanny’s bags<\/u>.（依畫線部分造原問句）", "show": "What are they / those / these?", "answers": ["What are they", "What are those", "What are these?"]}, {"id": 26, "question": "those / the men / sheep / horse?（完成句子）", "show": "Are those the men’s sheep and horses?", "answers": ["Are those the men’s sheep and horses?"]}, {"id": 27, "question": "Is this a cute fox?（改成複數句）", "show": "Are these cute foxes?", "answers": ["Are these cute foxes?"]}, {"id": 28, "question": "Joan is a nice person. Emma is a nice person, too.（用 Joan and Emma 開頭合併句子）", "show": "Joan and Emma are nice people.", "answers": ["Joan and Emma are nice people."]}];

const $ = s => document.querySelector(s), list = $('#list'), select = $('#select'), quiz = $('#quiz'), result = $('#result'),
  question = $('#question'), answerArea = $('#answerArea'), feedback = $('#feedback'), explain = $('#explain'), next = $('#next');
let chosen = [], idx = 0;
const wrong = new Map(), correct = new Set();
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm = s => String(s).trim().toLowerCase().replace(/[’‘`]/g, "'").replace(/\s+/g, ' ');
const plain = s => String(s).replace(/<\/?u>/g, '');

/* sentence answers: contractions count as the full form; case and punctuation are checked separately */
const CONTRACTIONS = [[/\b(is|are|was|were|do|does|did|has|have|had)n't\b/gi, '$1 not'], [/\bcan't\b/gi, 'cannot'],
  [/\b(he|she|it|that|what|who|where|how|there|here)'s\b/gi, '$1 is'], [/\bi'm\b/gi, 'I am'], [/\b(you|we|they)'re\b/gi, '$1 are']];
function expand(s) { s = String(s).replace(/[’‘`]/g, "'").replace(/\s+/g, ' ').replace(/\s+([.,?!])/g, '$1').trim(); CONTRACTIONS.forEach(([r, t]) => s = s.replace(r, t)); return s; }
const loose = s => expand(s).toLowerCase().replace(/[.,?!;:]/g, '').replace(/\s+/g, ' ').trim();
function judgeSentence(q, value) {
  const strict = expand(value);
  if (q.answers.some(a => expand(a) === strict)) return 'ok';
  if (q.answers.some(a => loose(a) === loose(value))) return 'form';
  return 'bad';
}

function renderList() { list.innerHTML = Q.map(q => '<label class="pick"><input class="pickbox" type="checkbox" value="' + q.id + '" checked><b>第 ' + q.id + ' 題</b></label>').join(''); }
$('#all').onclick = () => document.querySelectorAll('.pickbox').forEach(x => x.checked = true);
$('#none').onclick = () => document.querySelectorAll('.pickbox').forEach(x => x.checked = false);
$('#start').onclick = () => {
  const ids = [...document.querySelectorAll('.pickbox:checked')].map(x => +x.value);
  if (!ids.length) return alert('請至少選一題。');
  chosen = Q.filter(q => ids.includes(q.id)); idx = 0; wrong.clear(); correct.clear();
  select.classList.add('hidden'); result.classList.add('hidden'); quiz.classList.remove('hidden'); show();
};
function show() {
  const q = chosen[idx];
  $('#meta').textContent = '第 ' + (idx + 1) + ' / ' + chosen.length + ' 題';
  $('#wrongCount').textContent = '曾答錯 ' + wrong.size + ' 題';
  $('#bar').style.width = (idx + 1) / chosen.length * 100 + '%';
  // question text is escaped; only <u> (underlined part of the prompt) is let through
  question.innerHTML = esc(q.question).replace(/&lt;u&gt;/g, '<u>').replace(/&lt;\/u&gt;/g, '</u>') + (q.img ? '<img alt="題目圖片" src="' + IMG[q.img] + '">' : '');
  const zh = $('#zh'); if (q.zh) { zh.textContent = q.zh; zh.classList.remove('hidden'); } else zh.classList.add('hidden');
  feedback.className = 'feedback hidden'; explain.classList.add('hidden');
  $('#check').classList.remove('hidden'); next.classList.add('hidden');
  if (MODE === 'mcq') answerArea.innerHTML = '<div class="options">' + q.options.map((o, i) => '<label class="option"><input type="radio" name="answer" value="' + i + '"><b>' + String.fromCharCode(65 + i) + '.</b> ' + esc(o) + '</label>').join('') + '</div>';
  else answerArea.innerHTML = '<div class="inputs"><div class="answer-row"><label>答案</label><input class="spell" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="' + (MODE === 'sentence' ? '請輸入完整句子（注意大小寫與標點）' : '請輸入完整單字') + '"></div></div>';
  setTimeout(() => answerArea.querySelector('input')?.focus(), 0);
}
function correctText(q) { return MODE === 'mcq' ? String.fromCharCode(65 + q.answer) + '. ' + q.options[q.answer] : MODE === 'sentence' ? q.show : q.answers.join(' / '); }
function showExplain(q) { if (!q.exp) return; explain.innerHTML = '<b>詳解</b>' + esc(q.exp); explain.classList.remove('hidden'); }
function check() {
  const q = chosen[idx];
  let given, ok, formNote = false;
  if (MODE === 'mcq') {
    const x = answerArea.querySelector('input:checked'); if (!x) return alert('請完成所有答案。');
    given = String.fromCharCode(65 + (+x.value)); ok = +x.value === q.answer;
  } else {
    given = answerArea.querySelector('.spell').value; if (!given.trim()) return alert('請完成所有答案。');
    if (MODE === 'sentence') { const j = judgeSentence(q, given); ok = j !== 'bad'; formNote = j === 'form'; }
    else ok = q.answers.some(a => norm(a) === norm(given));
  }
  if (ok) {
    correct.add(q.id); feedback.className = 'feedback ok';
    if (formNote) feedback.innerHTML = '✅ 句子正確！但請注意<strong>大小寫與標點</strong>，標準寫法：<strong>' + esc(q.show) + '</strong>';
    else feedback.textContent = '✅ 全部正確！';
    showExplain(q);
    $('#check').classList.add('hidden'); next.classList.remove('hidden'); next.focus();
  } else {
    if (!wrong.has(q.id)) wrong.set(q.id, { q, attempts: [] });
    wrong.get(q.id).attempts.push(given);
    $('#wrongCount').textContent = '曾答錯 ' + wrong.size + ' 題';
    feedback.className = 'feedback bad';
    feedback.innerHTML = '❌ 答案不正確。正確答案：<strong>' + esc(correctText(q)) + '</strong><br>請重新作答。';
    showExplain(q);
    if (MODE === 'mcq') answerArea.querySelectorAll('input').forEach(x => x.checked = false); else answerArea.querySelector('.spell').value = '';
    answerArea.querySelector('input')?.focus();
  }
}
$('#check').onclick = check;
answerArea.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList.contains('spell')) { e.preventDefault(); check(); } });
next.onclick = () => { idx++; idx >= chosen.length ? finish() : show(); };
$('#finish').onclick = finish;
function finish() {
  quiz.classList.add('hidden'); result.classList.remove('hidden');
  $('#summary').innerHTML = '<div class="stat">選擇題數<b>' + chosen.length + '</b></div><div class="stat">完成答對<b>' + correct.size + '</b></div><div class="stat">曾答錯<b>' + wrong.size + '</b></div>';
  $('#wrongList').innerHTML = wrong.size ? [...wrong.values()].map((r, i) => '<div class="wrong"><b>' + (i + 1) + '. 第 ' + r.q.id + ' 題</b><p>' + esc(plain(r.q.question)) + '</p><p><strong>錯誤答案：</strong>' + r.attempts.map(esc).join('；') + '</p><p><strong>正確答案：</strong>' + esc(correctText(r.q)) + '</p>' + (r.q.exp ? '<p><strong>詳解：</strong>' + esc(r.q.exp) + '</p>' : '') + '</div>').join('') : '<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>';
  $('#download').classList.toggle('hidden', !wrong.size);
}
$('#restart').onclick = () => { result.classList.add('hidden'); select.classList.remove('hidden'); };
$('#download').onclick = async () => {
  if (!wrong.size) return;
  const rows = [...wrong.values()], name = TITLE + '_錯題_' + new Date().toISOString().slice(0, 10);
  const save = (blob, ext) => { const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = name + ext; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); };
  try {
    const { Document, Packer, Paragraph, TextRun, HeadingLevel } = await import('https://esm.sh/docx@9.5.1');
    const line = (label, text) => new Paragraph({ children: [new TextRun({ text: label, bold: true }), new TextRun({ text })] });
    const children = [new Paragraph({ heading: HeadingLevel.TITLE, children: [new TextRun({ text: TITLE + ' 錯題紀錄', bold: true })] })];
    rows.forEach((r, i) => {
      children.push(new Paragraph({ heading: HeadingLevel.HEADING_2, children: [new TextRun({ text: (i + 1) + '. 第 ' + r.q.id + ' 題', bold: true })] }));
      plain(r.q.question).split('\n').forEach(t => children.push(new Paragraph({ children: [new TextRun({ text: t })] })));
      if (MODE === 'mcq') children.push(new Paragraph({ children: [new TextRun({ text: r.q.options.map((o, k) => '(' + String.fromCharCode(65 + k) + ') ' + o).join('　') })] }));
      children.push(line('錯誤答案：', r.attempts.join('；')), line('正確答案：', correctText(r.q)));
      if (r.q.exp) children.push(line('詳解：', r.q.exp));
    });
    save(await Packer.toBlob(new Document({ sections: [{ children }] })), '.docx');
  } catch (e) {   // offline or CDN blocked
    const txt = rows.map((r, i) => (i + 1) + '. 第 ' + r.q.id + ' 題\n' + plain(r.q.question) + '\n錯誤答案：' + r.attempts.join('；') + '\n正確答案：' + correctText(r.q) + (r.q.exp ? '\n詳解：' + r.q.exp : '') + '\n').join('\n');
    save(new Blob([TITLE + ' 錯題紀錄\n\n' + txt], { type: 'text/plain;charset=utf-8' }), '.txt');
  }
};
renderList();
</script></body></html>
