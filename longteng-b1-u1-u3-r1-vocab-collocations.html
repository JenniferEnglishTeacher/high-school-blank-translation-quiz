<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>龍騰普高 B1 U1–U3 + R1 單字・搭配詞・例句填空</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#1f2937;--muted:#64748b;--line:#dbe2ea;--blue:#2563eb;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--voice:#7c3aed;--voicebg:#f5f3ff;--amber:#b45309;--amberbg:#fffbeb}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}
.wrap{max-width:980px;margin:auto;padding:18px}
.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 5px 18px rgba(15,23,42,.05)}
.hero{background:linear-gradient(135deg,#eaf2ff,#fff)}
h1{margin:0 0 8px;font-size:clamp(23px,4vw,34px);line-height:1.3}
h2{margin:0 0 6px;font-size:21px}
.note{color:var(--muted);margin:6px 0 0}
.hidden{display:none!important}
.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
.btn{border:0;border-radius:10px;padding:11px 16px;font-size:16px;font-weight:700;cursor:pointer;background:#e5e7eb;color:var(--ink);font-family:inherit}
.btn.primary{background:var(--blue);color:#fff}
.btn.danger{background:#991b1b;color:#fff}
.btn.voice{background:var(--voice);color:#fff}
.btn.small{padding:7px 12px;font-size:14px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
.opt{display:flex;align-items:center;gap:8px;font-weight:700;margin:6px 0}
.opt input{width:18px;height:18px;accent-color:var(--blue)}
#list{max-height:430px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#fcfdff}
.grp{font-weight:800;color:#1d4ed8;margin:10px 4px 4px}
.pick{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;margin:6px 0;background:#fafafa;cursor:pointer}
.pick input{width:17px;height:17px;flex:none;accent-color:var(--blue)}
.pick .pos{color:var(--muted);font-size:14px}
.tag{margin-left:auto;flex:none;font-size:12px;font-weight:800;color:#6d28d9;background:var(--voicebg);border:1px solid #ddd6fe;border-radius:999px;padding:1px 8px}
.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}
.bar{height:100%;background:var(--blue);transition:width .2s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:700;margin:8px 0 14px}
.clue{background:var(--amberbg);border:1px solid #fde68a;border-radius:12px;padding:12px 14px}
.clue .zh{font-size:21px;font-weight:800;color:var(--amber)}
.clue .pos{font-weight:700;color:var(--muted);margin-left:8px}
.clue .def{color:#475569}
.step{margin-top:16px;padding:14px;border:2px solid var(--line);border-radius:13px;background:#f8fafc}
.step.active{border-color:#93c5fd;background:#f5f9ff}
.step.done{border-color:#bbf7d0;background:#f7fef9}
.step h3{margin:0 0 4px;font-size:17px;color:#1d4ed8}
.step.done h3{color:var(--ok)}
.step .how{color:var(--muted);font-size:14px;margin:0 0 8px}
.collo{padding:10px 0;border-top:1px dashed var(--line)}
.collo:first-of-type{border-top:0}
.collo .czh{font-weight:800;color:var(--amber);margin-bottom:6px}
.line{font-size:20px;font-weight:700;line-height:2.25}
.given{display:inline-block;color:#475569;background:#e2e8f0;border-radius:6px;padding:0 8px;margin:0 2px;line-height:1.6;font-size:17px}
.gap{font:inherit;font-weight:700;color:#1d4ed8;text-align:center;padding:3px 6px;margin:0 2px;border:0;border-bottom:3px solid #94a3b8;border-radius:6px 6px 0 0;background:#fff;max-width:100%}
.gap.ok{color:var(--ok);border-bottom-color:var(--ok);background:var(--okbg)}
.gap.bad{color:var(--bad);border-bottom-color:var(--bad);background:var(--badbg)}
.gap::placeholder{color:#94a3b8;font-weight:700}
.suf{color:#1d4ed8;margin-left:-2px}
.tr{margin:0 0 8px;color:#334155}
.tr b{color:#0f766e;background:#ccfbf1;border-radius:4px;padding:0 3px}
.feedback{margin-top:14px;padding:13px;border-radius:10px;font-weight:700}
.feedback.ok{background:var(--okbg);color:var(--ok)}
.feedback.bad{background:var(--badbg);color:var(--bad)}
.feedback.info{background:#eff6ff;color:#1d4ed8}
.voicebox{margin-top:16px;padding:16px;border:2px solid #ddd6fe;border-radius:13px;background:var(--voicebg)}
.voicebox h3{margin:0 0 6px;color:#5b21b6;font-size:17px}
.target{font-size:20px;font-weight:800;margin:6px 0 10px}
.usage{margin-top:10px;padding-top:10px;border-top:1px dashed #c4b5fd;color:#4c1d95}
.usage code{font-family:inherit;font-weight:800;background:#fff;border:1px solid #ddd6fe;border-radius:6px;padding:1px 7px;margin:2px 4px 2px 0;display:inline-block}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}
.stat b{display:block;font-size:28px}
.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}
.wrong p{margin:4px 0}
@media(max-width:640px){.wrap{padding:10px}.hero,.card{padding:15px}.line,.target{font-size:18px}.clue .zh{font-size:19px}.tag{display:none}}
</style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <h1>龍騰普高 B1 Units 1–3 + Review 1<br>單字・搭配詞・例句填空</h1>
    <p><span id="total"></span> 題：先依中文拼出<strong>固定片語／搭配詞</strong>，再把單字填進<strong>例句</strong>。</p>
    <p class="note">每題全部答對後，按 🔊 聽完整句子，再進入下一題。</p>
  </section>

  <section id="select" class="card">
    <h2>選擇題目</h2>
    <div class="toolbar">
      <button id="all" class="btn">全部選取</button>
      <button id="none" class="btn">全部取消</button>
      <button id="secA" class="btn">只選 A 單字</button>
      <button id="secB" class="btn">只選 B 片語</button>
      <button id="colloOnly" class="btn">只選有搭配詞的題目</button>
      <button id="rand20" class="btn">隨機 20 題</button>
    </div>
    <label class="opt"><input id="shuffle" type="checkbox"> 打亂出題順序</label>
    <div id="list"></div>
    <div class="actions"><button id="start" class="btn primary">開始作答</button><span id="picked" class="note" style="align-self:center"></span></div>
  </section>

  <section id="quiz" class="card hidden">
    <div class="progress"><div id="bar" class="bar"></div></div>
    <div class="meta"><span id="meta"></span><span id="wrongCount"></span></div>
    <div class="clue"><span id="zh" class="zh"></span><span id="pos" class="pos"></span><div id="def" class="def"></div></div>

    <div id="step1" class="step">
      <h3>① 搭配詞 Collocations</h3>
      <p class="how">看中文，拼出完整片語。灰色字是提示，不用填。</p>
      <div id="collos"></div>
    </div>

    <div id="step2" class="step">
      <h3 id="step2title">② 例句填空 Sentence</h3>
      <p id="tr" class="tr"></p>
      <div id="sent" class="line"></div>
    </div>

    <div id="feedback" class="feedback hidden" role="status" aria-live="polite"></div>

    <div id="voicebox" class="voicebox hidden">
      <h3>🔊 聽完整句子 Listen to the whole sentence</h3>
      <div id="target" class="target"></div>
      <button id="speak" class="btn voice">🔊 再聽一次</button>
      <div id="usage" class="usage hidden"></div>
    </div>

    <div class="actions">
      <button id="check" class="btn primary">檢查答案</button>
      <button id="next" class="btn primary hidden">下一題 →</button>
      <button id="finish" class="btn danger">結束作答</button>
    </div>
  </section>

  <section id="result" class="card hidden">
    <h2>作答結果</h2>
    <div id="summary" class="summary"></div>
    <div id="wrongList"></div>
    <div class="actions">
      <button id="retryWrong" class="btn primary">只重做錯題</button>
      <button id="download" class="btn">下載錯題 DOCX</button>
      <button id="restart" class="btn">重新選題</button>
    </div>
  </section>
</main>

:["amaze"],"suf":""}," the children, and they always ask him to do them again."],"full":"The magician’s tricks never fail to amaze the children, and they always ask him to do them again.","tr":"這位魔術師的戲法總是<b>讓<\/b>孩子們<b>驚奇<\/b>，他們總是要他再表演一次。"},{"id":6,"sec":"A","head":"amazed","pos":"(adj.)","def":"very surprised","zh":"感到驚奇的","forms":null,"usage":["be amazed at N","be amazed to V"],"collos":[{"en":"be amazed at N","zh":"對…感到驚奇","toks":[{"a":["be"]},{"a":["amazed"]},{"a":["at"]},{"g":"N"}]},{"en":"be amazed to V","zh":"很驚奇地（發現／得知）…","toks":[{"a":["be"]},{"a":["amazed"]},{"a":["to"]},{"g":"V"}]}],"parts":["I was ",{"a":["amazed"],"suf":""}," to learn that my eighty-year-old grandmother could use social media better than I could."],"full":"I was amazed to learn that my eighty-year-old grandmother could use social media better than I could.","tr":"得知我八十歲的奶奶比我還會用社群媒體，我感到很<b>驚奇<\/b>。"},{"id":7,"sec":"A","head":"amazement","pos":"(n.)","def":"a feeling of great surprise","zh":"驚奇","forms":null,"usage":["to my amazement"],"collos":[{"en":"to my amazement","zh":"令我驚奇的是","toks":[{"a":["to"]},{"a":["my"]},{"a":["amazement"]}]}],"parts":["The tourists stared in ",{"a":["amazement"],"suf":""}," as hundreds of sky lanterns slowly rose into the night sky over Pingxi."],"full":"The tourists stared in amazement as hundreds of sky lanterns slowly rose into the night sky over Pingxi.","tr":"當數百盞天燈在平溪的夜空緩緩升起時，遊客們<b>驚奇<\/b>地凝視著。"},{"id":8,"sec":"A","head":"amazing","pos":"(adj.)","def":"very surprising and wonderful","zh":"令人驚奇的","forms":null,"usage":[],"collos":[],"parts":["The view from the top of Taipei 101 was ",{"a":["amazing"],"suf":""},", and we could see the whole city shining at night."],"full":"The view from the top of Taipei 101 was amazing, and we could see the whole city shining at night.","tr":"從台北101頂樓看出去的景色<b>令人驚奇<\/b>，我們可以看到整座城市在夜裡閃閃發光。"},{"id":9,"sec":"A","head":"astonish","pos":"(v.)","def":"to surprise someone very much","zh":"使驚訝","forms":null,"usage":[],"collos":[],"parts":["The young pianist’s skill continues to ",{"a":["astonish"],"suf":""}," audiences around the world, although she is only twelve years old."],"full":"The young pianist’s skill continues to astonish audiences around the world, although she is only twelve years old.","tr":"這位年輕鋼琴家的技巧持續<b>讓<\/b>全世界的觀眾<b>驚訝<\/b>，儘管她只有十二歲。"},{"id":10,"sec":"A","head":"astonished","pos":"(adj.)","def":"very surprised","zh":"感到驚訝的","forms":null,"usage":["be astonished at","be astonished to V"],"collos":[{"en":"be astonished at","zh":"對…感到驚訝","toks":[{"a":["be"]},{"a":["astonished"]},{"a":["at"]}]},{"en":"be astonished to V","zh":"很驚訝地（發現／得知）…","toks":[{"a":["be"]},{"a":["astonished"]},{"a":["to"]},{"g":"V"}]}],"parts":["I was ",{"a":["astonished"],"suf":""}," to see how much my hometown had changed, because I had been away for only five years."],"full":"I was astonished to see how much my hometown had changed, because I had been away for only five years.","tr":"看到家鄉變了這麼多我很<b>驚訝<\/b>，因為我才離開五年。"},{"id":11,"sec":"A","head":"astonishing","pos":"(adj.)","def":"very surprising","zh":"驚人的","forms":null,"usage":[],"collos":[],"parts":["It is ",{"a":["astonishing"],"suf":""}," that the little boy can speak four languages, since he has never taken any language classes."],"full":"It is astonishing that the little boy can speak four languages, since he has never taken any language classes.","tr":"那個小男孩會說四種語言真是<b>驚人<\/b>，因為他從沒上過任何語言課。"},{"id":12,"sec":"A","head":"astonishment","pos":"(n.)","def":"a feeling of great surprise","zh":"驚訝","forms":null,"usage":["to my astonishment"],"collos":[{"en":"to my astonishment","zh":"令我驚訝的是","toks":[{"a":["to"]},{"a":["my"]},{"a":["astonishment"]}]}],"parts":["To my ",{"a":["astonishment"],"suf":""},", my shy brother stood up and sang in front of two hundred guests at the wedding."],"full":"To my astonishment, my shy brother stood up and sang in front of two hundred guests at the wedding.","tr":"令我<b>驚訝<\/b>的是，我害羞的弟弟在婚禮上站起來，在兩百位賓客面前唱歌。"},{"id":13,"sec":"A","head":"attention","pos":"(n.)","def":"the act of listening to or watching something carefully","zh":"注意；注意力","forms":null,"usage":["pay attention to N"],"collos":[{"en":"pay attention to N","zh":"注意…；把注意力放在…","toks":[{"a":["pay"]},{"a":["attention"]},{"a":["to"]},{"g":"N"}]}],"parts":["Please pay ",{"a":["attention"],"suf":""}," to the teacher’s instructions, or you won’t know how to finish the experiment safely."],"full":"Please pay attention to the teacher’s instructions, or you won’t know how to finish the experiment safely.","tr":"請<b>注意<\/b>聽老師的指示，否則你不會知道如何安全地完成實驗。"},{"id":14,"sec":"A","head":"attentive","pos":"(adj.)","def":"listening or watching carefully","zh":"專心的","forms":null,"usage":["be attentive to N"],"collos":[{"en":"be attentive to N","zh":"專心於…；留意…","toks":[{"a":["be"]},{"a":["attentive"]},{"a":["to"]},{"g":"N"}]}],"parts":["The students were so ",{"a":["attentive"],"suf":""}," to the teacher during the science show that nobody looked at their phones for the whole hour."],"full":"The students were so attentive to the teacher during the science show that nobody looked at their phones for the whole hour.","tr":"學生們在科學表演時非常<b>專心<\/b>，整整一小時都沒有人看手機。"},{"id":15,"sec":"A","head":"average","pos":"(adj.)","def":"typical or normal","zh":"一般的；平均的","forms":null,"usage":[],"collos":[],"parts":["The ",{"a":["average"],"suf":""}," student in my class sleeps only six hours a night, which is not enough for a teenager."],"full":"The average student in my class sleeps only six hours a night, which is not enough for a teenager.","tr":"我班上<b>一般的<\/b>學生每晚只睡六小時，這對青少年來說是不夠的。"},{"id":16,"sec":"A","head":"average","pos":"(n.)","def":"the usual level or amount","zh":"平均；平均數","forms":null,"usage":["on average"],"collos":[{"en":"on average","zh":"平均而言","toks":[{"a":["on"]},{"a":["average"]}]}],"parts":["Her math score was above the class ",{"a":["average"],"suf":""},", so her parents took her out for a nice dinner. On ",{"a":["average"],"suf":""},", women can live 3 years long ell my friends about my childhood nickname, because it will really ",{"a":["embarrass"],"suf":""}," me in front of them."],"full":"Please don’t tell my friends about my childhood nickname, because it will really embarrass me in front of them.","tr":"請不要告訴我朋友我小時候的綽號，因為那真的會<b>讓<\/b>我在他們面前很<b>尷尬<\/b>。"},{"id":55,"sec":"A","head":"embarrassed","pos":"(adj.)","def":"feeling shy or ashamed because of something you did","zh":"感到尷尬的","forms":null,"usage":["人 be embarrassed at/with"],"collos":[{"en":"人 be embarrassed at/with","zh":"某人對…感到尷尬","toks":[{"g":"人"},{"a":["be"]},{"a":["embarrassed"]},{"a":["at","with"]}]}],"parts":["I felt so ",{"a":["embarrassed"],"suf":""}," when I called my teacher “Mom” in front of the whole class, and everyone started laughing."],"full":"I felt so embarrassed when I called my teacher “Mom” in front of the whole class, and everyone started laughing.","tr":"我在全班面前叫老師「媽媽」時覺得好<b>尷尬<\/b>，大家都笑了起來。"},{"id":56,"sec":"A","head":"embarrassing","pos":"(adj.)","def":"making you feel shy or ashamed","zh":"令人尷尬的","forms":null,"usage":[],"collos":[],"parts":["It was really ",{"a":["embarrassing"],"suf":""}," to forget my lines on stage, but the audience was kind and clapped for me anyway."],"full":"It was really embarrassing to forget my lines on stage, but the audience was kind and clapped for me anyway.","tr":"在臺上忘詞真的很<b>令人尷尬<\/b>，但觀眾很親切，還是為我鼓掌。"},{"id":57,"sec":"A","head":"embarrassment","pos":"(n.)","def":"the feeling of being shy or ashamed","zh":"尷尬；難堪","forms":null,"usage":["to 人’s embarrassment"],"collos":[{"en":"to 人’s embarrassment","zh":"令某人尷尬的是","toks":[{"a":["to"]},{"g":"人’s"},{"a":["embarrassment"]}]}],"parts":["His face turned red with ",{"a":["embarrassment"],"suf":""}," when he realized that he had been wearing his T-shirt inside out all day."],"full":"His face turned red with embarrassment when he realized that he had been wearing his T-shirt inside out all day.","tr":"當他發現自己整天都把T恤穿反時，他因<b>尷尬<\/b>而臉紅。"},{"id":58,"sec":"A","head":"embrace","pos":"(v.)","def":"to accept something happily; to hold someone in your arms","zh":"欣然接受；擁抱","forms":null,"usage":[],"collos":[],"parts":["Older people sometimes find it hard to ",{"a":["embrace"],"suf":""}," new technology, but my grandmother loves her smartphone."],"full":"Older people sometimes find it hard to embrace new technology, but my grandmother loves her smartphone.","tr":"年長者有時很難<b>欣然接受<\/b>新科技，但我奶奶很愛她的智慧型手機。"},{"id":59,"sec":"A","head":"expert","pos":"(n.)","def":"a person who knows a lot about a subject","zh":"專家；行家","forms":null,"usage":[],"collos":[],"parts":["My uncle is an ",{"a":["expert"],"suf":""}," on computers, so everyone in the family calls him when something goes wrong."],"full":"My uncle is an expert on computers, so everyone in the family calls him when something goes wrong.","tr":"我叔叔是電腦<b>專家<\/b>，所以家裡每個人電腦出問題時都打電話給他。"},{"id":60,"sec":"A","head":"fail","pos":"(v.)","def":"to do something but not succeed","zh":"失敗","forms":null,"usage":["fail to V"],"collos":[{"en":"fail to V","zh":"未能做…；無法做…","toks":[{"a":["fail"]},{"a":["to"]},{"g":"V"}]}],"parts":["The lazy boy didn’t review, so he ",{"a":["fail"],"suf":"ed"}," his final exam. The ad is so boring that it ",{"a":["fail"],"suf":"s"}," to draw customers’ attention."],"full":"The lazy boy didn’t review, so he failed his final exam. The ad is so boring that it fails to draw customers’ attention.","tr":"那個懶散的男孩沒有複習，所以他期末考不及格。這個廣告是這麼無聊以至於<b>無法<\/b>抓住顧客的注意力。"},{"id":61,"sec":"A","head":"failure","pos":"(n.)","def":"a lack of success in doing something","zh":"失敗","forms":null,"usage":[],"collos":[],"parts":["Her first restaurant was a complete ",{"a":["failure"],"suf":""},", but she learned from her mistakes and opened a successful one later."],"full":"Her first restaurant was a complete failure, but she learned from her mistakes and opened a successful one later.","tr":"她的第一家餐廳徹底<b>失敗<\/b>，但她從錯誤中學習，後來開了一家成功的餐廳。"},{"id":62,"sec":"A","head":"flight","pos":"(n.)","def":"a trip on a plane; the act of flying","zh":"航班；飛行","forms":null,"usage":["flight attendant"],"collos":[{"en":"flight attendant","zh":"空服員","toks":[{"a":["flight"]},{"a":["attendant"]}]}],"parts":["Our ",{"a":["flight"],"suf":""}," to Tokyo was delayed for three hours because of the typhoon, so we had lunch at the airport. The ",{"a":["flight"],"suf":""}," attendants looked tired."],"full":"Our flight to Tokyo was delayed for three hours because of the typhoon, so we had lunch at the airport. The flight attendants looked tired.","tr":"我們飛往東京的<b>航班<\/b>因為颱風延誤了三小時，所以我們在機場吃了午餐。<b>空服員<\/b>看起來很疲累。"},{"id":63,"sec":"A","head":"float","pos":"(v.)","def":"to stay on the surface of water or in the air","zh":"漂浮","forms":null,"usage":[],"collos":[],"parts":["If you relax your body and lie on your back, you will ",{"a":["float"],"suf":""}," on the water without any effort."],"full":"If you relax your body and lie on your back, you will float on the water without any effort.","tr":"如果你放鬆身體仰躺，你就會毫不費力地<b>漂浮<\/b>在水面上。"},{"id":64,"sec":"A","head":"focus","pos":"(v.)","def":"to give all your attention to one thing","zh":"專注；集中","forms":null,"usage":["focus on"],"collos":[{"en":"focus on","zh":"專注於…","toks":[{"a":["focus"]},{"a":["on"]}]}],"parts":["It’s hard to ",{"a":["focus"],"suf":""}," on my homework when my brother is playing video games loudly in the same room."],"full":"It’s hard to focus on my homework when my brother is playing video games loudly in the same room.","tr":"當我弟弟在同一個房間大聲打電動時，我很難<b>專注<\/b>在功課上。"},{"id":65,"sec":"A","head":"focus","pos":"(n.)","def":"the thing that gets the most attention","zh":"焦點；重點","forms":null,"usage":[],"collos":[],"parts":["The main ",{"a":["focus"],"suf":""}," of today’s meeting is the school festival, so we will talk about the sports day next week."],"full":"The main focus of today’s meeting is the school festival, so we will talk about the sports day next week.","tr":"今天會議的主要<b>重點<\/b>是校慶，所以運動會我們下週再討論。"},{"id":66,"sec":"A","head":"focused","pos":"(adj.)","def":"g ","head":"ignore","pos":"(v.)","def":"to pay no attention to someone or something","zh":"忽略；不理會","forms":null,"usage":[],"collos":[],"parts":["I waved and said hello to her, but she chose to ",{"a":["ignore"],"suf":""}," me and kept walking down the street."],"full":"I waved and said hello to her, but she chose to ignore me and kept walking down the street.","tr":"我向她揮手打招呼，但她選擇<b>不理會<\/b>我，繼續沿著街道走。"},{"id":76,"sec":"A","head":"impress","pos":"(v.)","def":"to make someone admire you","zh":"使印象深刻","forms":null,"usage":[],"collos":[],"parts":["He wore his best suit and arrived early because he wanted to ",{"a":["impress"],"suf":""}," the managers at the job interview."],"full":"He wore his best suit and arrived early because he wanted to impress the managers at the job interview.","tr":"他穿上最好的西裝並提早到，因為他想在工作面試時<b>讓<\/b>主管們<b>印象深刻<\/b>。"},{"id":77,"sec":"A","head":"impressed","pos":"(adj.)","def":"admiring someone or something very much","zh":"感到印象深刻的","forms":null,"usage":[],"collos":[],"parts":["The judges were so ",{"a":["impressed"],"suf":""}," by her performance that they gave her the highest score of the night."],"full":"The judges were so impressed by her performance that they gave her the highest score of the night.","tr":"評審對她的表演<b>印象深刻<\/b>，給了她當晚的最高分。"},{"id":78,"sec":"A","head":"impression","pos":"(n.)","def":"the idea or feeling you have about someone or something","zh":"印象","forms":null,"usage":[],"collos":[],"parts":["He made a good ",{"a":["impression"],"suf":""}," on my parents because he was polite and helped wash the dishes after dinner."],"full":"He made a good impression on my parents because he was polite and helped wash the dishes after dinner.","tr":"他給我父母留下了好<b>印象<\/b>，因為他很有禮貌，而且晚餐後幫忙洗碗。"},{"id":79,"sec":"A","head":"impressive","pos":"(adj.)","def":"so good, large, or skillful that you admire it","zh":"令人印象深刻的","forms":null,"usage":[],"collos":[],"parts":["The fireworks show on New Year’s Eve was really ",{"a":["impressive"],"suf":""},", and thousands of people cheered when it ended."],"full":"The fireworks show on New Year’s Eve was really impressive, and thousands of people cheered when it ended.","tr":"跨年夜的煙火秀真的很<b>令人印象深刻<\/b>，結束時成千上萬的人歡呼。"},{"id":80,"sec":"A","head":"include","pos":"(v.)","def":"to have something as one part","zh":"包含；包括","forms":null,"usage":[],"collos":[],"parts":["Does the price of the room ",{"a":["include"],"suf":""}," breakfast, or do we have to pay extra for it in the morning?"],"full":"Does the price of the room include breakfast, or do we have to pay extra for it in the morning?","tr":"房價有<b>包含<\/b>早餐嗎？還是我們早上得另外付費？"},{"id":81,"sec":"A","head":"including","pos":"(prep.)","def":"having something or someone as one part of a group","zh":"包括","forms":null,"usage":["句子, including + N"],"collos":[],"parts":["Everyone in my family, ",{"a":["including"],"suf":""}," my eighty-year-old grandfather, joined the charity run last Sunday and finished it."],"full":"Everyone in my family, including my eighty-year-old grandfather, joined the charity run last Sunday and finished it.","tr":"我家每個人，<b>包括<\/b>我八十歲的爺爺，上週日都參加了公益路跑並跑完全程。"},{"id":82,"sec":"A","head":"inspiration","pos":"(n.)","def":"something that gives you new ideas or makes you want to do something","zh":"靈感；啟發","forms":null,"usage":[],"collos":[],"parts":["The singer gets her ",{"a":["inspiration"],"suf":""}," from everyday life, and many of her songs are about her family and friends."],"full":"The singer gets her inspiration from everyday life, and many of her songs are about her family and friends.","tr":"這位歌手從日常生活中得到<b>靈感<\/b>，她的許多歌都是關於家人和朋友。"},{"id":83,"sec":"A","head":"inspire","pos":"(v.)","def":"to make someone want to do something good","zh":"激勵；啟發","forms":null,"usage":[],"collos":[],"parts":["Good teachers don’t just give answers; they ",{"a":["inspire"],"suf":""}," their students to ask questions and think for themselves."],"full":"Good teachers don’t just give answers; they inspire their students to ask questions and think f al and easy to remember","zh":"難忘的","forms":null,"usage":[],"collos":[],"parts":["Our graduation trip to Kenting was truly ",{"a":["memorable"],"suf":""},", and we still talk about it whenever we get together."],"full":"Our graduation trip to Kenting was truly memorable, and we still talk about it whenever we get together.","tr":"我們去墾丁的畢業旅行真的很<b>難忘<\/b>，每次聚在一起我們還是會聊到它。"},{"id":89,"sec":"A","head":"memorize","pos":"(v.)","def":"to learn something so that you remember it exactly","zh":"記住；背熟","forms":null,"usage":[],"collos":[],"parts":["I have to ",{"a":["memorize"],"suf":""}," fifty new words before the English test tomorrow, so I can’t go out with you tonight."],"full":"I have to memorize fifty new words before the English test tomorrow, so I can’t go out with you tonight.","tr":"明天英文考試前我必須<b>背熟<\/b>五十個新單字，所以今晚不能跟你出去。"},{"id":90,"sec":"A","head":"memory","pos":"(n.)","def":"the ability to remember; something you remember from the past","zh":"記憶（力）；回憶","forms":null,"usage":[],"collos":[],"parts":["My grandfather has a very good ",{"a":["memory"],"suf":""},", and he can still remember the names of all his elementary school classmates."],"full":"My grandfather has a very good memory, and he can still remember the names of all his elementary school classmates.","tr":"我爺爺的<b>記憶力<\/b>很好，他仍然記得所有小學同學的名字。"},{"id":91,"sec":"A","head":"message","pos":"(n.)","def":"a short piece of information that you send or leave for someone","zh":"訊息；留言","forms":null,"usage":[],"collos":[],"parts":["I couldn’t answer the phone during class, so I asked my mom to leave a ",{"a":["message"],"suf":""}," and I called back later."],"full":"I couldn’t answer the phone during class, so I asked my mom to leave a message and I called back later.","tr":"我上課時不能接電話，所以請媽媽<b>留言<\/b>，之後我再回電。"},{"id":92,"sec":"A","head":"nap","pos":"(n.)","def":"a short sleep during the day","zh":"小睡","forms":null,"usage":[],"collos":[],"parts":["I usually take a short ",{"a":["nap"],"suf":""}," after lunch, and it helps me stay awake during the afternoon classes."],"full":"I usually take a short nap after lunch, and it helps me stay awake during the afternoon classes.","tr":"我通常午餐後<b>小睡<\/b>一下，這幫助我在下午的課保持清醒。"},{"id":93,"sec":"A","head":"nap","pos":"(v.)","def":"to sleep for a short time during the day","zh":"小睡；打盹","forms":null,"usage":[],"collos":[],"parts":["My grandfather likes to ",{"a":["nap"],"suf":""}," on the sofa after lunch, so we try to keep quiet in the living room."],"full":"My grandfather likes to nap on the sofa after lunch, so we try to keep quiet in the living room.","tr":"我爺爺喜歡午餐後在沙發上<b>打盹<\/b>，所以我們在客廳盡量保持安靜。"},{"id":94,"sec":"A","head":"perfect","pos":"(adj.)","def":"as good as possible, with no mistakes","zh":"完美的","forms":null,"usage":[],"collos":[],"parts":["The weather was ",{"a":["perfect"],"suf":""}," for a picnic, so we packed some sandwiches and spent the whole afternoon in the park."],"full":"The weather was perfect for a picnic, so we packed some sandwiches and spent the whole afternoon in the park.","tr":"那天的天氣對野餐來說很<b>完美<\/b>，所以我們帶了些三明治，在公園待了整個下午。"},{"id":95,"sec":"A","head":"perfectly","pos":"(adv.)","def":"in a way that could not be better","zh":"完美地","forms":null,"usage":[],"collos":[],"parts":["She had practiced the song for weeks, so she sang it ",{"a":["perfectly"],"suf":""}," at the school concert last night."],"full":"She had practiced the song for weeks, so she sang it perfectly at the school concert last night.","tr":"她練這首歌練了好幾個星期，所以昨晚在學校音樂會上她<b>完美地<\/b>唱完了這首歌。"},{"id":96,"sec":"A","head":"personal","pos":"(adj.)","def":"belonging to or about one person; private","zh":"個人的；私人的","forms":null,"usage":["personal belongings"],"collos":[{"en":"personal belongings","zh":"私人物品","toks":[{"a":["personal"]},{"a":["belongings"]}]}],"parts":["It’s not polite to ask people ",{"a":["personal"],"suf":""}," questions about their age or salary when you first meet them. Keep an eye on your ",{"a":["personal"],"suf":""}," belongings when you travel abroad."],"full":"It’s not polite to ask people personal questions about their age or salary when you first meet them. Keep an eye on your personal belongings when you travel abroad.","tr":"初次見面時問別人年齡或薪水這類<b>私人的<\/b>問題是不禮貌的。當你出國旅遊要看好<b>私人<\/b>物品。"},{"id":97,"sec":"A","head":"personally","pos":"(adv.)","def":"used to show that you are giving your own opinion","zh":"就個人而言","forms":null,"usage":[],"collos":[],"parts":["Many of my classmates love horror movies, but ",{"a":["personally"],"suf":""},", I think they are too scary to enjoy."],"full":"Many of my classmates love horror movies, but personally, I think they are too scary to enjoy.","tr":"我很多同學都愛看恐怖片，但<b>就我個人而言<\/b>，我覺得它們太可怕了，無法享受。"},{"id":98,"sec":"A","head":"present","pos":"(v.)","def":"to show or give something to people in a formal way","zh":"呈現；提交；授予","forms":null,"usage":[],"collos":[],"parts":["At the end of the semester, each group has to ",{"a":["present"],"suf":""}," its project to the class and answer questions from the teacher."],"full":"At the end of the semester, each group has to present its project to the class and answer questions from the teacher.","tr":"學期末，每一組都必須向全班<b>呈現<\/b>他們的專題，並回答老師的問題。"},{"id":99,"sec":"A","head":"present","pos":"(n.)","def":"a gift","zh":"禮物","forms":null,"usage":[],"collos":[],"parts":["God presents humans with a gift, which is the current moment. So the present time is a ",{"a":["present"],"suf":""}," from God."],"full":"God presents humans with a gift, which is the current moment. So the present time is a present from God.","tr":"上帝提供人類一個禮物，就是現在這一刻。所以現在的時間就是上帝的<b>禮物<\/b>。"},{"id":100,"sec":"A","head":"present","pos":"(adj.)","def":"the current time","zh":"現在的","forms":null,"usage":[],"collos":[],"parts":["God presents humans with a gift, which is the current moment. So the ",{"a":["present"],"suf":""}," time is a ",{"a":["present"],"suf":""}," from God."],"full":"God presents humans with a gift, which is the current moment. So the present time is a present from God.","tr":"上帝提供人類一個禮物，就是現在這一刻。所以<b>現在的<\/b>時間就是上帝的<b>禮物<\/b>。"},{"id":101,"sec":"A","head":"presentation","pos":"(n.)","def":"a talk in which you show or explain something to a group","zh":"報告；介紹","forms":null,"usage":[],"collos":[],"parts":["I was nervous about giving a ",{"a":["presentation"],"suf":""}," in English, but my classmates said that I spoke clearly and confidently."],"full":"I was nervous about giving a presentation in English, but my classmates said that I spoke clearly and confidently.","tr":"用英文做<b>報告<\/b>讓我很緊張，但同學們說我講得清楚又有自信。"},{"id":102,"sec":"A","head":"realization","pos":"(n.)","def":"the moment when you start to understand something","zh":"領悟；實現","forms":null,"usage":["人 comes to the realization that 句子"],"collos":[{"en":"人 comes to the realization that 句子","zh":"某人領悟到…","toks":[{"g":"人"},{"a":["comes"]},{"a":["to"]},{"a":["the"]},{"a":["realization"]},{"a":["that"]},{"g":"句子"}]}],"parts":["He came to the ",{"a":["realization"],"suf":""}," that money could not buy happiness, so he decided to spend more time with his family."],"full":"He came to the realization that money could not buy happiness, so he decided to spend more time with his family.","tr":"他有了金錢買不到快樂的<b>領悟<\/b>，所以決定花更多時間陪伴家人。"},{"id":103,"sec":"A","head":"realize","pos":"(v.)","def":"to understand or notice something that you did not know before","zh":"了解；意識到","forms":null,"usage":["realize N/that 句子"],"collos":[],"parts":["When I got to the bus stop, I began to ",{"a":["realize"],"suf":""}," that I had left my phone on the kitchen table."],"full":"When I got to the bus stop, I began to realize that I had left my phone on the kitchen table.","tr":"當我到公車站時，我才開始<b>意識到<\/b>我把手機忘在廚房桌上了。"},{"id":104,"sec":"A","head":"realize","pos":"(v.)","def":"to make goals or dreams come true","zh":"實現","forms":null,"usage":["realize a dream/goal"],"collos":[{"en":"realize a dream/goal","zh":"實現夢想／目標","toks":[{"a":["realize"]},{"a":["a"]},{"a":["dream","goal"]}]}],"parts":["He pays attention to his studies so that he can ",{"a":["realize"],"suf":""}," his dream of becoming an engineer."],"full":"He pays attention to his studies so that he can realize his dream of becoming an engineer.","tr":"他專注在他的學業所以他可以<b>實現<\/b>他想當工程師的夢想。"},{"id":105,"sec":"A","head":"recall","pos":"(v.)","def":"to remember something from the past","zh":"記起；回想起","forms":null,"usage":[],"collos":[],"parts":["I know I have met that woman before, but I can’t ",{"a":["recall"],"suf":""}," her name or where we first met."],"full":"I know I have met that woman before, but I can’t recall her name or where we first met.","tr":"我知道我以前見過那位女士，但我無法<b>回想起<\/b>她的名字或我們第一次見面的地方。"},{"id":106,"sec":"A","head":"recall","pos":"(v.)","def":"to get back a flawed or defective product/item","zh":"召回有瑕疵有問題的產品","forms":null,"usage":["recall a product"],"collos":[{"en":"recall a product","zh":"召回（有瑕疵的）產品","toks":[{"a":["recall"]},{"a":["a"]},{"a":["product"]}]}],"parts":["The car company admitted that its products are defective, so it decided to ",{"a":["recall"],"suf":""}," the flawed items."],"full":"The car company admitted that its products are defective, so it decided to recall the flawed items.","tr":"這個汽車製造公司承認它的產品有瑕疵，所以他決定<b>召回<\/b>有瑕疵的物件。"},{"id":107,"sec":"A","head":"reflect","pos":"(v.)","def":"(reflect on) to think carefully about something","zh":"（on）認真思考；反省","forms":null,"usage":["reflect on"],"collos":[{"en":"reflect on","zh":"認真思考；反省","toks":[{"a":["reflect"]},{"a":["on"]}]}],"parts":["At the end of every year, I like to ",{"a":["reflect"],"suf":""}," on what I have done and set new goals for the future."],"full":"At the end of every year, I like to reflect on what I have done and set new goals for the future.","tr":"每年年底，我喜歡<b>認真思考<\/b>自己做過的事，並為未來設定新目標。"},{"id":108,"sec":"A","head":"reflect","pos":"(v.)","def":"to show an image like a mirror","zh":"反射(光)；映照","forms":null,"usage":[],"collos":[],"parts":["The moonlight ",{"a":["reflect"],"suf":"s"}," on the clear lake surface."],"full":"The moonlight reflects on the clear lake surface.","tr":"月光<b>映照<\/b>在澄淨的湖水表面。"},{"id":109,"sec":"A","head":"reflection","pos":"(n.)","def":"an image that you see in a mirror or in water","zh":"映出的影像；倒影","forms":null,"usage":[],"collos":[],"parts":["The little cat saw its own ",{"a":["reflection"],"suf":""}," in the mirror, and it jumped back because it thought there was another cat."],"full":"The little cat saw its own reflection in the mirror, and it jumped back because it thought there was another cat.","tr":"小貓在鏡子裡看到自己的<b>倒影<\/b>，嚇得往後跳，因為牠以為有另一隻貓。"},{"id":110,"sec":"A","head":"reflection","pos":"(n.)","def":"thinking about one’s attitude or behavior","zh":"反省省思","forms":null,"usage":[],"collos":[],"parts":["After deep ",{"a":["reflection"],"suf":""}," on his rude behavior, he decided to apologize to his classmates."],"full":"After deep reflection on his rude behavior, he decided to apologize to his classmates.","tr":"經過深切的<b>反省自身的行為<\/b>，他決定要對同學道歉。"},{"id":111,"sec":"A","head":"reflective","pos":"(adj.)","def":"thinking deeply about things","zh":"沉思的；反省的","forms":null,"usage":[],"collos":[],"parts":["After the big argument with her best friend, Amy was in a ",{"a":["reflective"],"suf":""}," mood, and she stayed in her room all evening."],"full":"After the big argument with her best friend, Amy was in a reflective mood, and she stayed in her room all evening.","tr":"和最好的朋友大吵一架後，Amy陷入<b>沉思的<\/b>情緒，整晚都待在房間裡。"},{"id":112,"sec":"A","head":"reflective","pos":"(adj.)","def":"sending back light","zh":"反光的","forms":null,"usage":["reflective clothing/vest"],"collos":[{"en":"reflective clothing/vest","zh":"反光衣／反光背心","toks":[{"a":["reflective"]},{"a":["clothing","vest"]}]}],"parts":["If you go jogging at night, you had better wear ",{"a":["reflective"],"suf":""}," clothing so that drivers can see you clearly."],"full":"If you go jogging at night, you had better wear reflective clothing so that drivers can see you clearly.","tr":"如果你晚上去慢跑，最好穿<b>反光的<\/b>衣服，這樣駕駛才能清楚看見你。"},{"id":113,"sec":"A","head":"refresh","pos":"(v.)","def":"to update a web page so that it shows the newest information","zh":"重新整理；刷新（網頁）","forms":null,"usage":["refresh a (web) page"],"collos":[{"en":"refresh a (web) page","zh":"重新整理（網頁）頁面","toks":[{"a":["refresh"]},{"a":["a"]},{"g":"(web)"},{"a":["page"]}]}],"parts":["If the website doesn’t show the newest scores, just ",{"a":["refresh"],"suf":""}," the page and wait for a few seconds."],"full":"If the website doesn’t show the newest scores, just refresh the page and wait for a few seconds.","tr":"如果網站沒有顯示最新的比數，只要<b>刷新<\/b>頁面再等幾秒鐘。"},{"id":114,"sec":"A","head":"refresh","pos":"(v.)","def":"to make someone feel less tired or less hot","zh":"使恢復精神；使涼爽","forms":null,"usage":["refresh 人","refresh oneself with N"],"collos":[{"en":"refresh oneself with N","zh":"用…讓自己恢復精神","toks":[{"a":["refresh"]},{"g":"oneself"},{"a":["with"]},{"g":"N"}]}],"parts":["After walking in the hot sun for two hours, the hikers stopped by a stream to ",{"a":["refresh"],"suf":""}," themselves with cold water."],"full":"After walking in the hot sun for two hours, the hikers stopped by a stream to refresh themselves with cold water.","tr":"在大太陽下走了兩小時後，登山客在小溪邊停下來，用冷水<b>讓<\/b>自己<b>恢復精神<\/b>。"},{"id":115,"sec":"A","head":"refresh","pos":"(v.)","def":"to help someone remember something","zh":"喚起某人的記憶","forms":null,"usage":["refresh 人’s memory"],"collos":[{"en":"refresh 人’s memory","zh":"喚起某人的記憶","toks":[{"a":["refresh"]},{"g":"人’s"},{"a":["memory"]}]}],"parts":["I couldn’t recall the details of the story, so I read my notes again to ",{"a":["refresh"],"suf":""}," my memory before the test."],"full":"I couldn’t recall the details of the story, so I read my notes again to refresh my memory before the test.","tr":"我想不起故事的細節，所以考試前我又讀了一次筆記來<b>喚起<\/b>我的記憶。"},{"id":116,"sec":"A","head":"refreshed","pos":"(adj.)","def":"feeling less tired and full of energy again","zh":"恢復精神的","forms":null,"usage":["人 feel/be refreshed"],"collos":[{"en":"人 feel/be refreshed","zh":"某人感到恢復精神","toks":[{"g":"人"},{"a":["feel","be"]},{"a":["refreshed"]}]}],"parts":["After a long hot shower and a good night’s sleep, I felt completely ",{"a":["refreshed"],"suf":""}," and ready for the exam."],"full":"After a long hot shower and a good night’s sleep, I felt completely refreshed and ready for the exam.","tr":"洗了很久的熱水澡又睡了一夜好覺後，我感到完全<b>恢復精神<\/b>，準備好考試了。"},{"id":117,"sec":"A","head":"refreshing","pos":"(adj.)","def":"making you feel cool, fresh, or less tired","zh":"提神的；清涼的","forms":null,"usage":["a refreshing drink/breeze"],"collos":[{"en":"a refreshing drink/breeze","zh":"清涼的飲料／涼爽的微風","toks":[{"a":["a"]},{"a":["refreshing"]},{"a":["drink","breeze"]}]}],"parts":["Nothing is more ",{"a":["refreshing"],"suf":""}," than a glass of cold lemonade after you play basketball under the hot sun. We opened the windows, and a ",{"a":["refreshing"],"suf":""}," breeze blew into the classroom."],"full":"Nothing is more refreshing than a glass of cold lemonade after you play basketball under the hot sun. We opened the windows, and a refreshing breeze blew into the classroom.","tr":"在大太陽下打完籃球後，沒有什麼比一杯冰檸檬水更<b>清涼提神<\/b>的了。我們打開窗戶，一陣<b>涼爽的<\/b>微風吹進教室。"},{"id":118,"sec":"A","head":"refreshments","pos":"(n.)","def":"small amounts of food and drink that are served at a meeting or party","zh":"茶點；點心飲料","forms":null,"usage":[],"collos":[],"parts":["Light ",{"a":["refreshments"],"suf":""}," will be served after the presentation, so please stay and chat with the speakers."],"full":"Light refreshments will be served after the presentation, so please stay and chat with the speakers.","tr":"報告結束後會提供簡單的<b>茶點<\/b>，所以請留下來和講者聊聊。"},{"id":119,"sec":"A","head":"relate","pos":"(v.)","def":"to show or find a connection between two things","zh":"把A和B聯繫起來；認為…有關","forms":null,"usage":["relate A to B"],"collos":[{"en":"relate A to B","zh":"把A和B聯繫起來","toks":[{"a":["relate"]},{"g":"A"},{"a":["to"]},{"g":"B"}]}],"parts":["Scientists ",{"a":["relate"],"suf":""}," the rise in sea levels to global warming, and they warn that some islands may disappear."],"full":"Scientists relate the rise in sea levels to global warming, and they warn that some islands may disappear.","tr":"科學家<b>認為<\/b>海平面上升和全球暖化<b>有關聯<\/b>，並警告有些島嶼可能會消失。"},{"id":120,"sec":"A","head":"relate","pos":"(v.)","def":"to understand how someone feels because you have had a similar experience","zh":"能理解；有共鳴","forms":null,"usage":["relate to 人/N"],"collos":[{"en":"relate to 人/N","zh":"對…有共鳴；能理解…","toks":[{"a":["relate"]},{"a":["to"]},{"g":"人/N"}]}],"parts":["Many teenagers can ",{"a":["relate"],"suf":""}," to the main character in this movie, because she also feels great pressure from exams."],"full":"Many teenagers can relate to the main character in this movie, because she also feels great pressure from exams.","tr":"許多青少年對這部電影的主角<b>很有共鳴<\/b>，因為她也感受到很大的考試壓力。"},{"id":121,"sec":"A","head":"related","pos":"(adj.)","def":"connected in some way","zh":"有關聯的","forms":null,"usage":["A be related to B"],"collos":[{"en":"A be related to B","zh":"A和B有關聯","toks":[{"g":"A"},{"a":["be"]},{"a":["related"]},{"a":["to"]},{"g":"B"}]}],"parts":["The teacher only answered questions that were ",{"a":["related"],"suf":""}," to the lesson, and she asked us to save the others for later."],"full":"The teacher only answered questions that were related to the lesson, and she asked us to save the others for later.","tr":"老師只回答與課程<b>有關的<\/b>問題，並請我們把其他問題留到之後。"},{"id":122,"sec":"A","head":"related","pos":"(adj.)","def":"belonging to the same family","zh":"有親戚關係的","forms":null,"usage":["人 be related to 人"],"collos":[{"en":"人 be related to 人","zh":"某人和某人有親戚關係","toks":[{"g":"人"},{"a":["be"]},{"a":["related"]},{"a":["to"]},{"g":"人"}]}],"parts":["Tim and I have the same family name, but we are not ",{"a":["related"],"suf":""}," to each other; we are just classmates."],"full":"Tim and I have the same family name, but we are not related to each other; we are just classmates.","tr":"Tim和我同姓，但我們彼此沒有<b>親戚關係<\/b>；我們只是同學。"},{"id":123,"sec":"A","head":"unrelated","pos":"(adj.)","def":"not connected in any way","zh":"無關的","forms":null,"usage":["A be unrelated to B"],"collos":[{"en":"A be unrelated to B","zh":"A和B無關","toks":[{"g":"A"},{"a":["be"]},{"a":["unrelated"]},{"a":["to"]},{"g":"B"}]}],"parts":["The police said that the two fires were completely ",{"a":["unrelated"],"suf":""},", although they happened on the same street on the same night."],"full":"The police said that the two fires were completely unrelated, although they happened on the same street on the same night.","tr":"警方說這兩場火災完全<b>無關<\/b>，儘管它們發生在同一晚的同一條街上。"},{"id":124,"sec":"A","head":"relation","pos":"(n.)","def":"the way in which two things are connected","zh":"關聯；關係","forms":null,"usage":["relation between A and B","in relation to N"],"collos":[{"en":"relation between A and B","zh":"A和B之間的關聯","toks":[{"a":["relation"]},{"a":["between"]},{"g":"A"},{"a":["and"]},{"g":"B"}]},{"en":"in relation to N","zh":"關於…","toks":[{"a":["in"]},{"a":["relation"]},{"a":["to"]},{"g":"N"}]}],"parts":["There is a close ",{"a":["relation"],"suf":""}," between how much you practice and how well you play, so don’t skip your piano lessons. I have a few questions in ",{"a":["relation"],"suf":""}," to your report."],"full":"There is a close relation between how much you practice and how well you play, so don’t skip your piano lessons. I have a few questions in relation to your report.","tr":"你練習多少和你彈得多好之間有密切的<b>關聯<\/b>，所以不要蹺鋼琴課。我有幾個<b>關於<\/b>你報告的問題。"},{"id":125,"sec":"A","head":"relations","pos":"(n.)","def":"the way in which countries or groups deal with each other","zh":"（國家、團體間的）關係","forms":null,"usage":["relations between A and B","relations with N"],"collos":[{"en":"relations between A and B","zh":"A和B之間的（國際／團體）關係","toks":[{"a":["relations"]},{"a":["between"]},{"g":"A"},{"a":["and"]},{"g":"B"}]},{"en":"relations with N","zh":"和…的（國際／團體）關係","toks":[{"a":["relations"]},{"a":["with"]},{"g":"N"}]}],"parts":["The two countries have enjoyed friendly ",{"a":["relations"],"suf":""}," for decades, so their people can visit each other without a visa."],"full":"The two countries have enjoyed friendly relations for decades, so their people can visit each other without a visa.","tr":"這兩國數十年來維持友好的<b>關係<\/b>，所以兩國人民可以免簽證互訪。"},{"id":126,"sec":"A","head":"relationship","pos":"(n.)","def":"the way two people or groups feel and behave toward each other","zh":"關係","forms":null,"usage":["relationship with 人","relationship between A and B"],"collos":[{"en":"relationship with 人","zh":"和某人的關係","toks":[{"a":["relationship"]},{"a":["with"]},{"g":"人"}]},{"en":"relationship between A and B","zh":"A和B之間的關係","toks":[{"a":["relationship"]},{"a":["between"]},{"g":"A"},{"a":["and"]},{"g":"B"}]}],"parts":["I have a close ",{"a":["relationship"],"suf":""}," with my older sister, and I always ask her for advice when I’m in trouble."],"full":"I have a close relationship with my older sister, and I always ask her for advice when I’m in trouble.","tr":"我和姊姊<b>關係<\/b>很親密，遇到麻煩時我總是向她請教。"},{"id":127,"sec":"A","head":"relationship","pos":"(n.)","def":"a romantic connection between two people","zh":"戀愛關係；交往","forms":null,"usage":["be in a relationship (with 人)"],"collos":[{"en":"be in a relationship (with 人)","zh":"（和某人）交往；談戀愛","toks":[{"a":["be"]},{"a":["in"]},{"a":["a"]},{"a":["relationship"]},{"g":"(with 人)"}]}],"parts":["My cousin has been in a ",{"a":["relationship"],"suf":""}," with her boyfriend for five years, and they plan to get married next spring."],"full":"My cousin has been in a relationship with her boyfriend for five years, and they plan to get married next spring.","tr":"我表姊和她男朋友<b>交往<\/b>五年了，他們計畫明年春天結婚。"},{"id":128,"sec":"A","head":"relative","pos":"(n.)","def":"a member of your family","zh":"親戚；親屬","forms":null,"usage":["a close/distant relative"],"collos":[{"en":"a close/distant relative","zh":"近親／遠親","toks":[{"a":["a"]},{"a":["close","distant"]},{"a":["relative"]}]}],"parts":["He is not just a friend; he is a distant ",{"a":["relative"],"suf":""}," of mine, and we see each other at every family wedding."],"full":"He is not just a friend; he is a distant relative of mine, and we see each other at every family wedding.","tr":"他不只是朋友；他是我的一位遠房<b>親戚<\/b>，每次家族婚禮我們都會見面。"},{"id":129,"sec":"A","head":"relative","pos":"(adj.)","def":"compared with something else","zh":"相對的；比較的","forms":null,"usage":["relative to N"],"collos":[{"en":"relative to N","zh":"和…相比","toks":[{"a":["relative"]},{"a":["to"]},{"g":"N"}]}],"parts":["After a noisy week in Taipei, we enjoyed the ",{"a":["relative"],"suf":""}," peace of the mountain village, and we slept really well."],"full":"After a noisy week in Taipei, we enjoyed the relative peace of the mountain village, and we slept really well.","tr":"在臺北吵雜的一週後，我們享受山村裡<b>相對的<\/b>寧靜，而且睡得很好。"},{"id":130,"sec":"A","head":"relatively","pos":"(adv.)","def":"quite, when compared with other things","zh":"相對地","forms":null,"usage":[],"collos":[],"parts":["The tickets were ",{"a":["relatively"],"suf":""}," cheap compared with last year’s, so we bought four and invited our cousins."],"full":"The tickets were relatively cheap compared with last year’s, so we bought four and invited our cousins.","tr":"和去年的比起來，門票<b>相對<\/b>便宜，所以我們買了四張並邀請了表兄弟姊妹。"},{"id":131,"sec":"A","head":"remind","pos":"(v.)","def":"to tell someone again so that they do not forget","zh":"提醒","forms":null,"usage":["remind 人 to V","remind 人 that 句子"],"collos":[{"en":"remind 人 to V","zh":"提醒某人去做…","toks":[{"a":["remind"]},{"g":"人"},{"a":["to"]},{"g":"V"}]},{"en":"remind 人 that 句子","zh":"提醒某人（某件事）","toks":[{"a":["remind"]},{"g":"人"},{"a":["that"]},{"g":"句子"}]}],"parts":["Please ",{"a":["remind"],"suf":""}," me to call the dentist tomorrow morning, because I’m afraid that I will forget it again. The teacher ",{"a":["remind"],"suf":"ed"}," us that the report was due on Friday."],"full":"Please remind me to call the dentist tomorrow morning, because I’m afraid that I will forget it again. The teacher reminded us that the report was due on Friday.","tr":"明天早上請<b>提醒<\/b>我打電話給牙醫，因為我怕我又會忘記。老師<b>提醒<\/b>我們報告星期五要交。"},{"id":132,"sec":"A","head":"remind","pos":"(v.)","def":"to make someone think of a person or thing from the past","zh":"使想起","forms":null,"usage":["remind 人 of N"],"collos":[{"en":"remind 人 of N","zh":"使某人想起…","toks":[{"a":["remind"]},{"g":"人"},{"a":["of"]},{"g":"N"}]}],"parts":["The smell of fresh bread will always ",{"a":["remind"],"suf":""}," me of my grandmother’s kitchen, where I spent many happy afternoons."],"full":"The smell of fresh bread will always remind me of my grandmother’s kitchen, where I spent many happy afternoons.","tr":"新鮮麵包的味道總會<b>讓<\/b>我<b>想起<\/b>奶奶的廚房，我在那裡度過許多快樂的午後。"},{"id":133,"sec":"A","head":"reminder","pos":"(n.)","def":"something that helps you remember to do something","zh":"提醒的事物；提醒通知","forms":null,"usage":["set a reminder"],"collos":[{"en":"set a reminder","zh":"設定提醒","toks":[{"a":["set"]},{"a":["a"]},{"a":["reminder"]}]}],"parts":["I set a ",{"a":["reminder"],"suf":""}," on my phone for the dentist’s appointment, so I won’t forget it this time."],"full":"I set a reminder on my phone for the dentist’s appointment, so I won’t forget it this time.","tr":"我在手機上設了看牙醫的<b>提醒<\/b>，所以這次不會忘記了。"},{"id":134,"sec":"A","head":"reply","pos":"(v.)","def":"to answer someone by saying or writing something","zh":"回答；回覆","forms":null,"usage":["reply to N","reply that 句子"],"collos":[{"en":"reply to N","zh":"回覆…","toks":[{"a":["reply"]},{"a":["to"]},{"g":"N"}]},{"en":"reply that 句子","zh":"回答說…","toks":[{"a":["reply"]},{"a":["that"]},{"g":"句子"}]}],"parts":["I sent her three messages yesterday, but she was so busy that she didn’t ",{"a":["reply"],"suf":""}," until this morning. Please ",{"a":["reply"],"suf":""}," to my email as soon as possible."],"full":"I sent her three messages yesterday, but she was so busy that she didn’t reply until this morning. Please reply to my email as soon as possible.","tr":"我昨天傳了三則訊息給她，但她太忙了，直到今天早上才<b>回覆<\/b>。請盡快<b>回覆<\/b>我的電子郵件。"},{"id":135,"sec":"A","head":"reply","pos":"(n.)","def":"an answer","zh":"回答；回覆","forms":null,"usage":["make/give/receive a reply","in reply to N"],"collos":[{"en":"make/give/receive a reply","zh":"作出/收到回覆","toks":[{"a":["make","give","receive"]},{"a":["a"]},{"a":["reply"]}]},{"en":"in reply to N","zh":"作為對…的答覆","toks":[{"a":["in"]},{"a":["reply"]},{"a":["to"]},{"g":"N"}]}],"parts":["I wrote to the company about the broken phone two weeks ago, but I still haven’t received a ",{"a":["reply"],"suf":""},". I am writing in ",{"a":["reply"],"suf":""}," to your letter of May 5."],"full":"I wrote to the company about the broken phone two weeks ago, but I still haven’t received a reply. I am writing in reply to your letter of May 5.","tr":"我兩週前寫信給那家公司反映手機壞掉的事，但我到現在還沒收到<b>回覆<\/b>。我寫這封信是為了<b>回覆<\/b>您五月五日的來信。"},{"id":136,"sec":"A","head":"respond","pos":"(v.)","def":"to say or do something as an answer or a reaction","zh":"回應；回覆；作出反應","forms":null,"usage":["respond to N"],"collos":[{"en":"respond to N","zh":"回應…；對…作出反應","toks":[{"a":["respond"]},{"a":["to"]},{"g":"N"}]}],"parts":["The firefighters were able to ",{"a":["respond"],"suf":""}," to the emergency call quickly, and they saved everyone in the building."],"full":"The firefighters were able to respond to the emergency call quickly, and they saved everyone in the building.","tr":"消防員能夠迅速<b>回應<\/b>緊急電話，救出了大樓裡的每個人。"},{"id":137,"sec":"A","head":"response","pos":"(n.)","def":"an answer or a reaction to something","zh":"回應；回覆","forms":null,"usage":["in response to N"],"collos":[{"en":"in response to N","zh":"作為對…的回應","toks":[{"a":["in"]},{"a":["response"]},{"a":["to"]},{"g":"N"}]}],"parts":["I asked my boss for a day off last week, but I haven’t got any ",{"a":["response"],"suf":""}," from her yet. The city built more bike lanes in ",{"a":["response"],"suf":""}," to people’s complaints."],"full":"I asked my boss for a day off last week, but I haven’t got any response from her yet. The city built more bike lanes in response to people’s complaints.","tr":"我上週向老闆請一天假，但還沒得到她的任何<b>回應<\/b>。市政府為了<b>回應<\/b>民眾的抱怨而蓋了更多自行車道。"},{"id":138,"sec":"A","head":"responsive","pos":"(adj.)","def":"reacting quickly and in a helpful way","zh":"反應快的；回應熱烈的","forms":null,"usage":["be responsive to N"],"collos":[{"en":"be responsive to N","zh":"對…回應很快","toks":[{"a":["be"]},{"a":["responsive"]},{"a":["to"]},{"g":"N"}]}],"parts":["The online shop is very ",{"a":["responsive"],"suf":""}," to its customers, and it usually answers their questions within ten minutes."],"full":"The online shop is very responsive to its customers, and it usually answers their questions within ten minutes.","tr":"這家網路商店對顧客的<b>回應很快<\/b>，通常十分鐘內就回答他們的問題。"},{"id":139,"sec":"A","head":"romance","pos":"(n.)","def":"a love relationship, or the feeling of being in love","zh":"戀情；浪漫氣氛","forms":null,"usage":[],"collos":[],"parts":["Their ",{"a":["romance"],"suf":""}," began in senior high school, and they got married ten years after they first met."],"full":"Their romance began in senior high school, and they got married ten years after they first met.","tr":"他們的<b>戀情<\/b>始於高中，並在初次見面的十年後結婚。"},{"id":140,"sec":"A","head":"romance","pos":"(n.)","def":"a story or movie about love","zh":"愛情小說；愛情片","forms":null,"usage":[],"collos":[],"parts":["My sister doesn’t like action movies; she would rather stay home and read a ",{"a":["romance"],"suf":""}," with a happy ending."],"full":"My sister doesn’t like action movies; she would rather stay home and read a romance with a happy ending.","tr":"我姊姊不喜歡動作片；她寧願待在家讀一本有快樂結局的<b>愛情小說<\/b>。"},{"id":141,"sec":"A","head":"romantic","pos":"(adj.)","def":"showing strong feelings of love","zh":"浪漫的","forms":null,"usage":["a romantic dinner/movie"],"collos":[{"en":"a romantic dinner/movie","zh":"浪漫的晚餐／愛情電影","toks":[{"a":["a"]},{"a":["romantic"]},{"a":["dinner","movie"]}]}],"parts":["He planned a ",{"a":["romantic"],"suf":""}," dinner by the sea for their anniversary, and his wife was moved to tears."],"full":"He planned a romantic dinner by the sea for their anniversary, and his wife was moved to tears.","tr":"他為他們的紀念日安排了一頓海邊的<b>浪漫<\/b>晚餐，他太太感動得流下眼淚。"},{"id":142,"sec":"A","head":"unromantic","pos":"(adj.)","def":"not showing love in a special or exciting way","zh":"不浪漫的","forms":null,"usage":[],"collos":[],"parts":["My father is quite ",{"a":["unromantic"],"suf":""},", and he has never bought my mother flowers, but he cooks dinner for her every day."],"full":"My father is quite unromantic, and he has never bought my mother flowers, but he cooks dinner for her every day.","tr":"我爸爸相當<b>不浪漫<\/b>，他從沒買過花給我媽媽，但他每天為她煮晚餐。"},{"id":143,"sec":"A","head":"ruin","pos":"(v.)","def":"to damage something so badly that it is no longer good","zh":"破壞；毀壞","forms":null,"usage":["ruin N","ruin 人’s plans/chances"],"collos":[{"en":"ruin 人’s plans/chances","zh":"毀掉某人的計畫／機會","toks":[{"a":["ruin"]},{"g":"人’s"},{"a":["plans","chances"]}]}],"parts":["We planned a barbecue on the beach, but I was worried that the heavy rain would ",{"a":["ruin"],"suf":""}," our plans. One careless mistake could ",{"a":["ruin"],"suf":""}," your chances of winning."],"full":"We planned a barbecue on the beach, but I was worried that the heavy rain would ruin our plans. One careless mistake could ruin your chances of winning.","tr":"我們計畫在海邊烤肉，但我擔心大雨會<b>破壞<\/b>我們的計畫。一個粗心的錯誤可能會<b>毀掉<\/b>你獲勝的機會。"},{"id":144,"sec":"A","head":"ruin","pos":"(n.)","def":"the state of being destroyed or badly damaged","zh":"毀壞；破敗","forms":null,"usage":["fall into ruin"],"collos":[{"en":"fall into ruin","zh":"變得破敗","toks":[{"a":["fall"]},{"a":["into"]},{"a":["ruin"]}]}],"parts":["The old castle slowly fell into ",{"a":["ruin"],"suf":""}," after the war, and now only a few stone walls are still standing."],"full":"The old castle slowly fell into ruin after the war, and now only a few stone walls are still standing.","tr":"那座古堡在戰後逐漸<b>毀壞<\/b>，現在只剩幾面石牆還立著。"},{"id":145,"sec":"A","head":"ruins","pos":"(n.)","def":"the broken parts that are left of an old building or city","zh":"廢墟；遺跡","forms":null,"usage":["the ruins of N",
