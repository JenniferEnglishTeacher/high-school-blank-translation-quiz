oks":[{"a":["job"]},{"a":["satisfaction"]}]}],"parts":["She looked at her finished painting with great ",{"a":["satisfaction"],"suf":""},", because she had worked on it for three months. To my ",{"a":["satisfaction"],"suf":""},", all my students passed the exam."],"full":"She looked at her finished painting with great satisfaction, because she had worked on it for three months. To my satisfaction, all my students passed the exam.","tr":"她非常<b>滿足<\/b>地看著自己完成的畫，因為她已經畫了三個月。令我<b>滿意<\/b>的是，我所有的學生都通過了考試。"},{"id":148,"sec":"A","head":"satisfied","pos":"(adj.)","def":"pleased because you got what you wanted","zh":"感到滿意的","forms":null,"usage":["人 be satisfied with N"],"collos":[{"en":"人 be satisfied with N","zh":"某人對…感到滿意","toks":[{"g":"人"},{"a":["be"]},{"a":["satisfied"]},{"a":["with"]},{"g":"N"}]}],"parts":["The customers were ",{"a":["satisfied"],"suf":""}," with the service at the hotel, so they promised to come back next summer."],"full":"The customers were satisfied with the service at the hotel, so they promised to come back next summer.","tr":"顧客對飯店的服務感到<b>滿意<\/b>，所以他們答應明年夏天再來。"},{"id":149,"sec":"A","head":"satisfy","pos":"(v.)","def":"to make someone pleased by giving them what they want","zh":"使滿意；使滿足","forms":null,"usage":["satisfy 人","satisfy 人’s needs/hunger/curiosity"],"collos":[{"en":"satisfy 人’s needs/hunger/curiosity","zh":"滿足某人的需求／飢餓／好奇心","toks":[{"a":["satisfy"]},{"g":"人’s"},{"a":["needs","hunger","curiosity"]}]}],"parts":["The small snack didn’t ",{"a":["satisfy"],"suf":""}," my hunger, so I went to the night market and bought some fried chicken. It is hard to ",{"a":["satisfy"],"suf":""}," every customer."],"full":"The small snack didn’t satisfy my hunger, so I went to the night market and bought some fried chicken. It is hard to satisfy every customer.","tr":"那份小點心沒有<b>滿足<\/b>我的飢餓感，所以我去夜市買了些炸雞。要<b>讓<\/b>每位顧客都<b>滿意<\/b>很難。"},{"id":150,"sec":"A","head":"satisfying","pos":"(adj.)","def":"making you feel pleased","zh":"令人滿意的；令人滿足的","forms":null,"usage":["事物 be satisfying"],"collos":[{"en":"事物 be satisfying","zh":"某事物令人滿足","toks":[{"g":"事物"},{"a":["be"]},{"a":["satisfying"]}]}],"parts":["It is very ",{"a":["satisfying"],"suf":""}," to finish a difficult puzzle by yourself, even though it may take several hours."],"full":"It is very satisfying to finish a difficult puzzle by yourself, even though it may take several hours.","tr":"自己完成一個困難的拼圖非常<b>令人滿足<\/b>，即使可能要花好幾個小時。"},{"id":151,"sec":"A","head":"satisfactory","pos":"(adj.)","def":"good enough for a purpose, but not excellent","zh":"令人滿意的；合格的","forms":null,"usage":[],"collos":[],"parts":["Your report is ",{"a":["satisfactory"],"suf":""},", but it would be much better if you added a few more examples."],"full":"Your report is satisfactory, but it would be much better if you added a few more examples.","tr":"你的報告還算<b>令人滿意<\/b>，但如果你多加幾個例子會好得多。"},{"id":152,"sec":"A","head":"dissatisfied","pos":"(adj.)","def":"not pleased because something is not good enough","zh":"感到不滿意的","forms":null,"usage":["人 be dissatisfied with N"],"collos":[{"en":"人 be dissatisfied with N","zh":"某人對…感到不滿意","toks":[{"g":"人"},{"a":["be"]},{"a":["dissatisfied"]},{"a":["with"]},{"g":"N"}]}],"parts":["Many customers were ",{"a":["dissatisfied"],"suf":""}," with the slow service, so they left bad reviews about the restaurant online."],"full":"Many customers were dissatisfied with the slow service, so they left bad reviews about the restaurant online.","tr":"許多顧客對緩慢的服務感到<b>不滿意<\/b>，所以在網路上留下對這家餐廳的負評。"},{"id":153,"sec":"A","head":"dissatisfaction","pos":"(n.)","def":"the feeling of not being pleased with something","zh":"不滿","forms":null,"usage":["dissatisfaction with N"],"collos":[{"en":"dissatisfaction with N","zh":"對…的不滿","toks":[{"a":["dissatisfaction"]},{"a":["with"]},{"g":"N"}]}],"parts":["The workers showed their ",{"a":["dissatisfaction"],"suf":""}," with the low pay by refusing to work on the weekend."],"full":"The workers showed their dissatisfaction with the low pay by refusing to work on the weekend.","tr":"工人們以拒絕週末上班來表達他們對低薪的<b>不滿<\/b>。"},{"id":154,"sec":"A","head":"schedule","pos":"(n.)","def":"a plan that shows when things will happen","zh":"行程表；時間表","forms":null,"usage":["a tight/busy schedule"],"collos":[{"en":"a tight/busy schedule","zh":"行程很滿／忙碌的行程","toks":[{"a":["a"]},{"a":["tight","busy"]},{"a":["schedule"]}]}],"parts":["I have a very tight ",{"a":["schedule"],"suf":""}," this week, so I’m afraid that I can’t meet you until next Monday."],"full":"I have a very tight schedule this week, so I’m afraid that I can’t meet you until next Monday.","tr":"我這週的<b>行程<\/b>很滿，所以恐怕要到下週一才能跟你見面。"},{"id":155,"sec":"A","head":"schedule","pos":"(n.)","def":"at the planned time; earlier than planned; later than planned","zh":"準時；如期","forms":null,"usage":["on schedule","ahead of schedule","behind schedule"],"collos":[{"en":"on schedule","zh":"準時；如期","toks":[{"a":["on"]},{"a":["schedule"]}]},{"en":"ahead of schedule","zh":"進度超前","toks":[{"a":["ahead"]},{"a":["of"]},{"a":["schedule"]}]},{"en":"behind schedule","zh":"進度落後","toks":[{"a":["behind"]},{"a":["schedule"]}]}],"parts":["The new MRT line was finished on ",{"a":["schedule"],"suf":""},", so it opened to the public in June as planned. Our project is two weeks behind ",{"a":["schedule"],"suf":""},", so we must work faster."],"full":"The new MRT line was finished on schedule, so it opened to the public in June as planned. Our project is two weeks behind schedule, so we must work faster.","tr":"新的捷運線<b>如期<\/b>完工，所以按計畫在六月對大眾開放。我們的專題<b>進度落後<\/b>兩週，所以必須加快速度。"},{"id":156,"sec":"A","head":"schedule","pos":"(v.)","def":"to plan that something will happen at a certain time","zh":"安排；預定","forms":null,"usage":["be scheduled for + 時間","be scheduled to V"],"collos":[{"en":"be scheduled for + 時間","zh":"預定在…","toks":[{"a":["be"]},{"a":["scheduled"]},{"a":["for"]},{"g":"+"},{"g":"時間"}]},{"en":"be scheduled to V","zh":"預定要…","toks":[{"a":["be"]},{"a":["scheduled"]},{"a":["to"]},{"g":"V"}]}],"parts":["The school plans to ",{"a":["schedule"],"suf":""}," the sports day for late October, when the weather is usually cool and dry. The flight is ",{"a":["schedule"],"suf":"d"}," to arrive at noon."],"full":"The school plans to schedule the sports day for late October, when the weather is usually cool and dry. The flight is scheduled to arrive at noon.","tr":"學校打算把運動會<b>安排<\/b>在十月下旬，那時天氣通常涼爽又乾燥。這班飛機<b>預定<\/b>中午抵達。"},{"id":157,"sec":"A","head":"reschedule","pos":"(v.)","def":"to change the time of a planned event","zh":"重新安排時間；改期","forms":null,"usage":[],"collos":[],"parts":["The typhoon is coming this weekend, so we have to ",{"a":["reschedule"],"suf":""}," the school concert for next Friday."],"full":"The typhoon is coming this weekend, so we have to reschedule the school concert for next Friday.","tr":"颱風這個週末要來，所以我們必須把學校音樂會<b>改期<\/b>到下週五。"},{"id":158,"sec":"A","head":"skip","pos":"(v.)","def":"to not do something that you usually do or should do","zh":"故意不做；蹺（課）","forms":null,"usage":["skip N","skip class/school","skip a meal/breakfast"],"collos":[{"en":"skip class/school","zh":"蹺課","toks":[{"a":["skip"]},{"a":["class","school"]}]},{"en":"skip a meal/breakfast","zh":"不吃一餐／不吃早餐","toks":[{"a":["skip"]},{"a":["a"]},{"a":["meal","breakfast"]}]}],"parts":["You shouldn’t ",{"a":["skip"],"suf":""}," breakfast even if you are in a hurry, because you will feel tired and hungry in class. He was punished because he ",{"a":["skip"],"suf":"ped"}," class twice last week."],"full":"You shouldn’t skip breakfast even if you are in a hurry, because you will feel tired and hungry in class. He was punished because he skipped class twice last week.","tr":"即使你趕時間也不應該<b>略過<\/b>早餐不吃，因為你上課時會又累又餓。他因為上週<b>蹺<\/b>課兩次而被處罰。"},{"id":159,"sec":"A","head":"skip","pos":"(v.)","def":"to pass over a part and go on to the next one","zh":"略過；跳過","forms":null,"usage":["skip N","skip to N","skip over N"],"collos":[{"en":"skip to N","zh":"直接跳到…","toks":[{"a":["skip"]},{"a":["to"]},{"g":"N"}]},{"en":"skip over N","zh":"略過…","toks":[{"a":["skip"]},{"a":["over"]},{"g":"N"}]}],"parts":["This chapter is not on the test, so let’s ",{"a":["skip"],"suf":""}," it and go straight to Unit 5."],"full":"This chapter is not on the test, so let’s skip it and go straight to Unit 5.","tr":"這一章考試不考，所以我們<b>跳過<\/b>它，直接看第五單元吧。"},{"id":160,"sec":"A","head":"skip","pos":"(v.)","def":"to move forward with small quick jumps","zh":"蹦蹦跳跳","forms":null,"usage":["skip rope"],"collos":[{"en":"skip rope","zh":"跳繩","toks":[{"a":["skip"]},{"a":["rope"]}]}],"parts":["The little girl was so happy about her new shoes that she began to ",{"a":["skip"],"suf":""}," all the way to school."],"full":"The little girl was so happy about her new shoes that she began to skip all the way to school.","tr":"小女孩對她的新鞋子高興極了，開始一路<b>蹦蹦跳跳<\/b>去上學。"},{"id":161,"sec":"A","head":"surface","pos":"(n.)","def":"the outside or top part of something","zh":"表面；水面","forms":null,"usage":["on the surface of N"],"collos":[{"en":"on the surface of N","zh":"在…的表面","toks":[{"a":["on"]},{"a":["the"]},{"a":["surface"]},{"a":["of"]},{"g":"N"}]}],"parts":["The ",{"a":["surface"],"suf":""}," of the road was wet and slippery after the rain, so my father drove more slowly than usual. Leaves floated on the ",{"a":["surface"],"suf":""}," of the lake."],"full":"The surface of the road was wet and slippery after the rain, so my father drove more slowly than usual. Leaves floated on the surface of the lake.","tr":"雨後道路的<b>表面<\/b>又濕又滑，所以我爸爸開得比平常慢。樹葉漂浮在湖的<b>表面<\/b>上。"},{"id":162,"sec":"A","head":"surface","pos":"(n.)","def":"the way something seems when you do not look at it carefully","zh":"表面上；外表看來","forms":null,"usage":["on the surface"],"collos":[{"en":"on the surface","zh":"表面上；外表看來","toks":[{"a":["on"]},{"a":["the"]},{"a":["surface"]}]}],"parts":["On the ",{"a":["surface"],"suf":""},", he seemed calm and confident, but in fact he was very nervous about the interview."],"full":"On the surface, he seemed calm and confident, but in fact he was very nervous about the interview.","tr":"<b>表面上<\/b>他看起來冷靜又有自信，但事實上他對面試非常緊張。"},{"id":163,"sec":"A","head":"surface","pos":"(v.)","def":"to come up to the top of the water; to appear after being hidden","zh":"浮出水面；浮現","forms":null,"usage":[],"collos":[],"parts":["The diver stayed under water for three minutes, and everyone cheered when he began to ",{"a":["surface"],"suf":""}," near the boat."],"full":"The diver stayed under water for three minutes, and everyone cheered when he began to surface near the boat.","tr":"潛水員在水下待了三分鐘，當他開始在船邊<b>浮出水面<\/b>時，大家都歡呼。"},{"id":164,"sec":"A","head":"survival","pos":"(n.)","def":"the state of continuing to live, especially in a difficult situation","zh":"生存；倖存","forms":null,"usage":["chance of survival","survival skills"],"collos":[{"en":"chance of survival","zh":"存活機會","toks":[{"a":["chance"]},{"a":["of"]},{"a":["survival"]}]},{"en":"survival skills","zh":"求生技能","toks":[{"a":["survival"]},{"a":["skills"]}]}],"parts":["Clean water is necessary for ",{"a":["survival"],"suf":""},", so the hikers carried as much of it as they could. Every scout must learn basic ",{"a":["survival"],"suf":""}," skills."],"full":"Clean water is necessary for survival, so the hikers carried as much of it as they could. Every scout must learn basic survival skills.","tr":"乾淨的水是<b>生存<\/b>所必需的，所以登山客盡可能多帶水。每個童軍都必須學習基本的<b>求生<\/b>技能。"},{"id":165,"sec":"A","head":"survive","pos":"(v.)","def":"to continue to live","zh":"生存；存活","forms":null,"usage":["survive on N"],"collos":[{"en":"survive on N","zh":"靠…維生","toks":[{"a":["survive"]},{"a":["on"]},{"g":"N"}]}],"parts":["Camels can ",{"a":["survive"],"suf":""}," for weeks without water, which is why people have used them to cross deserts for centuries. The poor family ",{"a":["survive"],"suf":"d"}," on rice and vegetables."],"full":"Camels can survive for weeks without water, which is why people have used them to cross deserts for centuries. The poor family survived on rice and vegetables.","tr":"駱駝沒有水也能<b>存活<\/b>好幾週，這就是為什麼幾世紀以來人們用牠們橫越沙漠。這個貧困的家庭靠米飯和蔬菜<b>維生<\/b>。"},{"id":166,"sec":"A","head":"survive","pos":"(v.)","def":"to stay alive after a dangerous event","zh":"從…中倖存；熬過","forms":null,"usage":["survive + N（災難、事故）"],"collos":[],"parts":["Only three passengers managed to ",{"a":["survive"],"suf":""}," the plane crash, and they were sent to the hospital right away."],"full":"Only three passengers managed to survive the plane crash, and they were sent to the hospital right away.","tr":"只有三名乘客<b>從<\/b>這場空難中<b>倖存<\/b>，並立刻被送往醫院。"},{"id":167,"sec":"A","head":"survivor","pos":"(n.)","def":"a person who stays alive after a dangerous event","zh":"倖存者","forms":null,"usage":["survivor of N","the only/sole survivor"],"collos":[{"en":"survivor of N","zh":"…的倖存者","toks":[{"a":["survivor"]},{"a":["of"]},{"g":"N"}]},{"en":"the only/sole survivor","zh":"唯一的倖存者","toks":[{"a":["the"]},{"a":["only","sole"]},{"a":["survivor"]}]}],"parts":["The only ",{"a":["survivor"],"suf":""}," of the plane crash was a young girl, and she was found by a rescue team two days later."],"full":"The only survivor of the plane crash was a young girl, and she was found by a rescue team two days later.","tr":"這場空難唯一的<b>倖存者<\/b>是一名小女孩，兩天後她被搜救隊找到。"},{"id":168,"sec":"A","head":"therefore","pos":"(adv.)","def":"for that reason; so","zh":"因此","forms":null,"usage":["句子; therefore, 句子"],"collos":[],"parts":["The typhoon is expected to hit the island tonight; ",{"a":["therefore"],"suf":""},", all schools and offices will be closed tomorrow."],"full":"The typhoon is expected to hit the island tonight; therefore, all schools and offices will be closed tomorrow.","tr":"颱風預計今晚侵襲本島；<b>因此<\/b>，明天所有學校和公司都將停班停課。"},{"id":169,"sec":"A","head":"throughout","pos":"(prep.)","def":"during the whole time of something","zh":"在整個…期間；自始至終","forms":null,"usage":["throughout + 時間"],"collos":[],"parts":["It rained ",{"a":["throughout"],"suf":""}," the night, so the streets were still wet when we left for school this morning."],"full":"It rained throughout the night, so the streets were still wet when we left for school this morning.","tr":"雨下了<b>一整<\/b>夜，所以今天早上我們出門上學時街道還是濕的。"},{"id":170,"sec":"A","head":"throughout","pos":"(prep.)","def":"in every part of a place","zh":"遍及；到處","forms":null,"usage":["throughout + 地方"],"collos":[],"parts":["Bubble tea was invented in Taiwan, and now it is popular ",{"a":["throughout"],"suf":""}," the world, especially among young people."],"full":"Bubble tea was invented in Taiwan, and now it is popular throughout the world, especially among young people.","tr":"珍珠奶茶發明於臺灣，如今風靡<b>全<\/b>世界，尤其受年輕人歡迎。"},{"id":171,"sec":"A","head":"tradition","pos":"(n.)","def":"a custom or belief that people have followed for a long time","zh":"傳統","forms":null,"usage":["a family tradition","follow tradition","break with tradition"],"collos":[{"en":"a family tradition","zh":"家族傳統","toks":[{"a":["a"]},{"a":["family"]},{"a":["tradition"]}]},{"en":"follow tradition","zh":"遵循傳統","toks":[{"a":["follow"]},{"a":["tradition"]}]},{"en":"break with tradition","zh":"打破傳統","toks":[{"a":["break"]},{"a":["with"]},{"a":["tradition"]}]}],"parts":["It is a ",{"a":["tradition"],"suf":""}," in my family to have a big dinner together on Lunar New Year’s Eve, and nobody ever misses it. The young couple decided to break with ",{"a":["tradition"],"suf":""}," and have a small wedding on the beach."],"full":"It is a tradition in my family to have a big dinner together on Lunar New Year’s Eve, and nobody ever misses it. The young couple decided to break with tradition and have a small wedding on the beach.","tr":"除夕夜一起吃一頓豐盛的晚餐是我們家的<b>傳統<\/b>，從來沒有人缺席。這對年輕夫妻決定打破<b>傳統<\/b>，在海邊辦一場小型婚禮。"},{"id":172,"sec":"A","head":"traditional","pos":"(adj.)","def":"following ideas or ways that have existed for a long time","zh":"傳統的","forms":null,"usage":["traditional food/culture","It is traditional (for 人) to V"],"collos":[{"en":"traditional food/culture","zh":"傳統食物／文化","toks":[{"a":["traditional"]},{"a":["food","culture"]}]},{"en":"It is traditional (for 人) to V","zh":"（某人）做…是傳統","toks":[{"a":["it"]},{"a":["is"]},{"a":["traditional"]},{"g":"(for 人)"},{"a":["to"]},{"g":"V"}]}],"parts":["My grandmother still makes ",{"a":["traditional"],"suf":""}," rice dumplings by hand every Dragon Boat Festival, and they taste better than the ones in stores. It is ",{"a":["traditional"],"suf":""}," for Taiwanese people to eat mooncakes on Mid-Autumn Festival."],"full":"My grandmother still makes traditional rice dumplings by hand every Dragon Boat Festival, and they taste better than the ones in stores. It is traditional for Taiwanese people to eat mooncakes on Mid-Autumn Festival.","tr":"我奶奶每年端午節仍然親手包<b>傳統的<\/b>粽子，而且比店裡賣的好吃。臺灣人在中秋節吃月餅是<b>傳統的<\/b>習俗。"},{"id":173,"sec":"A","head":"traditionally","pos":"(adv.)","def":"in a way that people have done for a long time","zh":"傳統上","forms":null,"usage":[],"collos":[],"parts":["In Taiwan, people ",{"a":["traditionally"],"suf":""}," give children red envelopes during Lunar New Year, and the kids look forward to it."],"full":"In Taiwan, people traditionally give children red envelopes during Lunar New Year, and the kids look forward to it.","tr":"在臺灣，人們<b>傳統上<\/b>會在農曆新年給小孩紅包，孩子們都很期待。"},{"id":174,"sec":"A","head":"modern","pos":"(adj.)","def":"of the present time; using new ideas and methods","zh":"現代的；新式的","forms":null,"usage":[],"collos":[],"parts":["My grandparents live in a traditional house with a courtyard, but my uncle prefers a ",{"a":["modern"],"suf":""}," apartment in the city."],"full":"My grandparents live in a traditional house with a courtyard, but my uncle prefers a modern apartment in the city.","tr":"我的祖父母住在有庭院的傳統房子裡，但我叔叔比較喜歡市區的<b>現代<\/b>公寓。"},{"id":175,"sec":"A","head":"upset","pos":"(adj.)","def":"unhappy, worried, or a little angry","zh":"難過的；沮喪的","forms":null,"usage":["人 be upset about/over N","人 be upset that 句子","人 be upset with 人"],"collos":[{"en":"人 be upset about/over N","zh":"某人因…而難過","toks":[{"g":"人"},{"a":["be"]},{"a":["upset"]},{"a":["about","over"]},{"g":"N"}]},{"en":"人 be upset that 句子","zh":"某人因為（某件事）而難過","toks":[{"g":"人"},{"a":["be"]},{"a":["upset"]},{"a":["that"]},{"g":"句子"}]},{"en":"人 be upset with 人","zh":"某人生某人的氣","toks":[{"g":"人"},{"a":["be"]},{"a":["upset"]},{"a":["with"]},{"g":"人"}]}],"parts":["My little sister was very ",{"a":["upset"],"suf":""}," because she lost her favorite toy, and she cried all the way home. Mom was ",{"a":["upset"],"suf":""}," with me because I lied to her."],"full":"My little sister was very upset because she lost her favorite toy, and she cried all the way home. Mom was upset with me because I lied to her.","tr":"我妹妹非常<b>難過<\/b>，因為她弄丟了最喜歡的玩具，一路哭回家。媽媽<b>生<\/b>我的<b>氣<\/b>，因為我對她說謊。"},{"id":176,"sec":"A","head":"upset","pos":"(adj.)","def":"(of the stomach) feeling sick","zh":"腸胃不適的","forms":null,"usage":["have an upset stomach"],"collos":[{"en":"have an upset stomach","zh":"腸胃不適；肚子不舒服","toks":[{"a":["have"]},{"a":["an"]},{"a":["upset"]},{"a":["stomach"]}]}],"parts":["I ate too much spicy hot pot last night, so I have an ",{"a":["upset"],"suf":""}," stomach and can’t go to school today."],"full":"I ate too much spicy hot pot last night, so I have an upset stomach and can’t go to school today.","tr":"我昨晚吃了太多麻辣火鍋，所以<b>腸胃不適<\/b>，今天不能去上學。"},{"id":177,"sec":"A","head":"upset","pos":"(v.)","def":"to make someone feel unhappy or worried","zh":"使難過；使沮喪","forms":"upset – upset – upset","usage":["upset 人"],"collos":[],"parts":["I didn’t mean to ",{"a":["upset"],"suf":""}," you with my comment, and I’m really sorry if my words hurt your feelings."],"full":"I didn’t mean to upset you with my comment, and I’m really sorry if my words hurt your feelings.","tr":"我不是有意用我的評論<b>讓<\/b>你<b>難過<\/b>，如果我的話傷了你的心，我真的很抱歉。"},{"id":178,"sec":"A","head":"upset","pos":"(v.)","def":"to make a plan or situation go wrong","zh":"打亂；攪亂","forms":"upset – upset – upset","usage":["upset 人’s plans"],"collos":[{"en":"upset 人’s plans","zh":"打亂某人的計畫","toks":[{"a":["upset"]},{"g":"人’s"},{"a":["plans"]}]}],"parts":["The sudden rain ",{"a":["upset"],"suf":""}," our plans for a picnic, so we stayed home and watched a movie instead."],"full":"The sudden rain upset our plans for a picnic, so we stayed home and watched a movie instead.","tr":"突如其來的雨<b>打亂<\/b>了我們的野餐計畫，所以我們改待在家看電影。"},{"id":179,"sec":"A","head":"upsetting","pos":"(adj.)","def":"making you feel unhappy or worried","zh":"令人難過的","forms":null,"usage":["事物 be upsetting (to 人)"],"collos":[{"en":"事物 be upsetting (to 人)","zh":"某事物令（某人）難過","toks":[{"g":"事物"},{"a":["be"]},{"a":["upsetting"]},{"g":"(to 人)"}]}],"parts":["It was ",{"a":["upsetting"],"suf":""}," to hear that our favorite teacher was leaving the school, and many students cried."],"full":"It was upsetting to hear that our favorite teacher was leaving the school, and many students cried.","tr":"聽到我們最喜歡的老師要離開學校真<b>令人難過<\/b>，許多學生都哭了。"},{"id":180,"sec":"A","head":"valuable","pos":"(adj.)","def":"worth a lot of money; very useful or important","zh":"貴重的；寶貴的","forms":null,"usage":["valuable experience/lesson/advice"],"collos":[{"en":"valuable experience/lesson/advice","zh":"寶貴的經驗／教訓／建議","toks":[{"a":["valuable"]},{"a":["experience","lesson","advice"]}]}],"parts":["Please don’t leave anything ",{"a":["valuable"],"suf":""}," in your hotel room, because the hotel will not pay for lost items. I learned a ",{"a":["valuable"],"suf":""}," lesson from this failure."],"full":"Please don’t leave anything valuable in your hotel room, because the hotel will not pay for lost items. I learned a valuable lesson from this failure.","tr":"請不要把任何<b>貴重的<\/b>東西留在飯店房間，因為飯店不會賠償遺失的物品。我從這次失敗中學到<b>寶貴的<\/b>一課。"},{"id":181,"sec":"A","head":"valuables","pos":"(n.)","def":"small things that are worth a lot of money, such as jewelry","zh":"貴重物品","forms":null,"usage":[],"collos":[],"parts":["When you travel abroad, you should keep your ",{"a":["valuables"],"suf":""}," in the hotel safe and be on the lookout for pickpockets."],"full":"When you travel abroad, you should keep your valuables in the hotel safe and be on the lookout for pickpockets.","tr":"出國旅行時，你應該把<b>貴重物品<\/b>放在飯店保險箱，並提防扒手。"},{"id":182,"sec":"A","head":"invaluable","pos":"(adj.)","def":"extremely useful (it does NOT mean “not valuable”)","zh":"極寶貴的；無價的","forms":null,"usage":["be invaluable to 人"],"collos":[{"en":"be invaluable to 人","zh":"對某人來說極為寶貴","toks":[{"a":["be"]},{"a":["invaluable"]},{"a":["to"]},{"g":"人"}]}],"parts":["My teacher’s advice was ",{"a":["invaluable"],"suf":""}," to me when I was choosing a college, and I will always be grateful to her."],"full":"My teacher’s advice was invaluable to me when I was choosing a college, and I will always be grateful to her.","tr":"我在選大學時，老師的建議對我來說<b>極為寶貴<\/b>，我會永遠感激她。"},{"id":183,"sec":"A","head":"valueless","pos":"(adj.)","def":"having no value (= worthless)","zh":"沒有價值的","forms":null,"usage":[],"collos":[],"parts":["The painting looked expensive, but an expert said that it was a copy and almost ",{"a":["valueless"],"suf":""},"."],"full":"The painting looked expensive, but an expert said that it was a copy and almost valueless.","tr":"這幅畫看起來很貴，但一位專家說它是複製品，幾乎<b>毫無價值<\/b>。"},{"id":184,"sec":"A","head":"value","pos":"(n.)","def":"how much something is worth in money","zh":"價值；價格","forms":null,"usage":["the value of N","rise/fall in value"],"collos":[{"en":"the value of N","zh":"…的價值","toks":[{"a":["the"]},{"a":["value"]},{"a":["of"]},{"g":"N"}]},{"en":"rise/fall in value","zh":"升值／貶值","toks":[{"a":["rise","fall"]},{"a":["in"]},{"a":["value"]}]}],"parts":["The ",{"a":["value"],"suf":""}," of the house has doubled in ten years, because a new MRT station was built nearby."],"full":"The value of the house has doubled in ten years, because a new MRT station was built nearby.","tr":"這棟房子的<b>價值<\/b>十年內翻了一倍，因為附近蓋了新的捷運站。"},{"id":185,"sec":"A","head":"value","pos":"(n.)","def":"how useful or important something is","zh":"重要性；益處","forms":null,"usage":["be of great/little value (to 人)"],"collos":[{"en":"be of great/little value (to 人)","zh":"（對某人）很有／沒什麼價值","toks":[{"a":["be"]},{"a":["of"]},{"a":["great","little"]},{"a":["value"]},{"g":"(to 人)"}]}],"parts":["This old watch isn’t worth much money, but it is of great ",{"a":["value"],"suf":""}," to me because my grandfather gave it to me."],"full":"This old watch isn’t worth much money, but it is of great value to me because my grandfather gave it to me.","tr":"這只舊手錶不值多少錢，但它對我來說很有<b>價值<\/b>，因為是我爺爺送我的。"},{"id":186,"sec":"A","head":"values","pos":"(n.)","def":"beliefs about what is right and important in life","zh":"價值觀","forms":null,"usage":["family values"],"collos":[{"en":"family values","zh":"家庭價值觀","toks":[{"a":["family"]},{"a":["values"]}]}],"parts":["My parents and I have different ",{"a":["values"],"suf":""},", so we often disagree about how I should spend my free time."],"full":"My parents and I have different values, so we often disagree about how I should spend my free time.","tr":"我父母和我有不同的<b>價值觀<\/b>，所以我們對我該如何運用空閒時間常常意見不合。"},{"id":187,"sec":"A","head":"value","pos":"(v.)","def":"to think that something is very important","zh":"珍惜；重視","forms":null,"usage":["value N"],"collos":[],"parts":["I really ",{"a":["value"],"suf":""}," the time that I spend with my grandparents, so I visit them every weekend."],"full":"I really value the time that I spend with my grandparents, so I visit them every weekend.","tr":"我很<b>珍惜<\/b>和祖父母相處的時光，所以我每個週末都去看他們。"},{"id":188,"sec":"A","head":"value","pos":"(v.)","def":"to decide how much money something is worth","zh":"估價","forms":null,"usage":["value N","be valued at + 金額"],"collos":[{"en":"be valued at + 金額","zh":"估價為…","toks":[{"a":["be"]},{"a":["valued"]},{"a":["at"]},{"g":"+"},{"g":"金額"}]}],"parts":["An expert was invited to ",{"a":["value"],"suf":""}," the old painting, and he said that it was worth two million dollars."],"full":"An expert was invited to value the old painting, and he said that it was worth two million dollars.","tr":"一位專家受邀為這幅古畫<b>估價<\/b>，他說它價值兩百萬元。"},{"id":189,"sec":"A","head":"variety","pos":"(n.)","def":"many different kinds of something","zh":"多樣；各式各樣","forms":null,"usage":["a (wide) variety of N","variety show"],"collos":[{"en":"a (wide) variety of N","zh":"各式各樣的…","toks":[{"a":["a"]},{"g":"(wide)"},{"a":["variety"]},{"a":["of"]},{"g":"N"}]},{"en":"variety show","zh":"綜藝節目","toks":[{"a":["variety"]},{"a":["show"]}]}],"parts":["The night market offers a wide ",{"a":["variety"],"suf":""}," of snacks, so everyone can find something that they like. My family watches a ",{"a":["variety"],"suf":""}," show together every Saturday night."],"full":"The night market offers a wide variety of snacks, so everyone can find something that they like. My family watches a variety show together every Saturday night.","tr":"夜市提供<b>各式各樣<\/b>的小吃，所以每個人都能找到自己喜歡的。我們全家每週六晚上一起看<b>綜藝<\/b>節目。"},{"id":190,"sec":"A","head":"variety","pos":"(n.)","def":"a type of a plant, an animal, or a thing","zh":"品種；種類","forms":null,"usage":["a variety of + 動植物"],"collos":[{"en":"a variety of + 動植物","zh":"一種…的品種","toks":[{"a":["a"]},{"a":["variety"]},{"a":["of"]},{"g":"+"},{"g":"動植物"}]}],"parts":["Farmers in Taitung grow a special ",{"a":["variety"],"suf":""}," of rice, and it is famous for its sweet smell."],"full":"Farmers in Taitung grow a special variety of rice, and it is famous for its sweet smell.","tr":"臺東的農夫種植一種特別的稻米<b>品種<\/b>，它以香甜的氣味聞名。"},{"id":191,"sec":"A","head":"various","pos":"(adj.)","def":"of several different kinds","zh":"各式各樣的","forms":null,"usage":["various + 複數N"],"collos":[],"parts":["Students can join ",{"a":["various"],"suf":""}," clubs after school, such as the guitar club, the dance club, and the cooking club."],"full":"Students can join various clubs after school, such as the guitar club, the dance club, and the cooking club.","tr":"學生放學後可以參加<b>各式各樣的<\/b>社團，例如吉他社、熱舞社和烹飪社。"},{"id":192,"sec":"A","head":"vary","pos":"(v.)","def":"to be different from each other; to change","zh":"不同；變化","forms":null,"usage":["vary from A to B","vary in N"],"collos":[{"en":"vary from A to B","zh":"因A到B而異","toks":[{"a":["vary"]},{"a":["from"]},{"g":"A"},{"a":["to"]},{"g":"B"}]},{"en":"vary in N","zh":"在…方面不同","toks":[{"a":["vary"]},{"a":["in"]},{"g":"N"}]}],"parts":["Ticket prices ",{"a":["vary"],"suf":""}," from season to season, so you should compare them before you book your flight. The T-shirts ",{"a":["vary"],"suf":""}," in size and color."],"full":"Ticket prices vary from season to season, so you should compare them before you book your flight. The T-shirts vary in size and color.","tr":"票價隨季節而<b>不同<\/b>，所以訂機票前你應該先比較。這些T恤在尺寸和顏色上各有<b>不同<\/b>。"},{"id":193,"sec":"A","head":"varied","pos":"(adj.)","def":"including many different kinds","zh":"多樣的；豐富多變的","forms":null,"usage":[],"collos":[],"parts":["A healthy diet should be ",{"a":["varied"],"suf":""},", so you need to eat different kinds of vegetables, fruit, and meat."],"full":"A healthy diet should be varied, so you need to eat different kinds of vegetables, fruit, and meat.","tr":"健康的飲食應該要<b>多樣化<\/b>，所以你需要吃不同種類的蔬菜、水果和肉。"},{"id":194,"sec":"A","head":"variation","pos":"(n.)","def":"a change or difference in amount or level","zh":"變化；差異","forms":null,"usage":["variation in N"],"collos":[{"en":"variation in N","zh":"…的變化","toks":[{"a":["variation"]},{"a":["in"]},{"g":"N"}]}],"parts":["There is little ",{"a":["variation"],"suf":""}," in temperature on this island, so people wear T-shirts and shorts all year round."],"full":"There is little variation in temperature on this island, so people wear T-shirts and shorts all year round.","tr":"這座島上氣溫<b>變化<\/b>很小，所以人們一年到頭都穿T恤和短褲。"},{"id":195,"sec":"A","head":"variable","pos":"(adj.)","def":"likely to change often","zh":"多變的","forms":null,"usage":[],"collos":[],"parts":["The weather in the mountains is very ",{"a":["variable"],"suf":""},", so hikers should always bring a raincoat and warm clothes."],"full":"The weather in the mountains is very variable, so hikers should always bring a raincoat and warm clothes.","tr":"山上的天氣非常<b>多變<\/b>，所以登山客應該隨時帶雨衣和保暖衣物。"},{"id":196,"sec":"A","head":"wonder","pos":"(v.)","def":"to want to know something","zh":"想知道；納悶","forms":null,"usage":["wonder + wh-/if/whether 句子","wonder about N"],"collos":[{"en":"wonder about N","zh":"對…感到好奇","toks":[{"a":["wonder"]},{"a":["about"]},{"g":"N"}]}],"parts":["I often ",{"a":["wonder"],"suf":""}," what my life will be like in ten years, and I hope I will have a job that I love. I was ",{"a":["wonder"],"suf":"ing"}," if you could help me with my homework."],"full":"I often wonder what my life will be like in ten years, and I hope I will have a job that I love. I was wondering if you could help me with my homework.","tr":"我常常<b>想知道<\/b>十年後我的生活會是什麼樣子，並希望我會有一份我熱愛的工作。我<b>想知道<\/b>你是否能幫我做功課。"},{"id":197,"sec":"A","head":"wonder","pos":"(n.)","def":"a feeling of surprise and admiration","zh":"驚奇；驚嘆","forms":null,"usage":["in/with wonder"],"collos":[{"en":"in/with wonder","zh":"驚嘆地","toks":[{"a":["in","with"]},{"a":["wonder"]}]}],"parts":["The children looked up at the night sky in ",{"a":["wonder"],"suf":""}," when they saw thousands of stars for the first time."],"full":"The children looked up at the night sky in wonder when they saw thousands of stars for the first time.","tr":"孩子們第一次看到成千上萬顆星星時，<b>驚嘆<\/b>地仰望夜空。"},{"id":198,"sec":"A","head":"wonder","pos":"(n.)","def":"something that is very surprising or beautiful","zh":"奇觀；奇蹟","forms":null,"usage":["a natural wonder","the Seven Wonders of the World"],"collos":[{"en":"a natural wonder","zh":"自然奇觀","toks":[{"a":["a"]},{"a":["natural"]},{"a":["wonder"]}]},{"en":"the Seven Wonders of the World","zh":"世界七大奇觀","toks":[{"a":["the"]},{"a":["seven"]},{"a":["wonders"]},{"a":["of"]},{"a":["the"]},{"a":["world"]}]}],"parts":["Taroko Gorge is a natural ",{"a":["wonder"],"suf":""},", and it attracts millions of visitors from around the world every year."],"full":"Taroko Gorge is a natural wonder, and it attracts millions of visitors from around the world every year.","tr":"太魯閣峽谷是一處自然<b>奇觀<\/b>，每年吸引數百萬來自世界各地的遊客。"},{"id":199,"sec":"A","head":"wonder","pos":"(phr.)","def":"it is not surprising that","zh":"難怪","forms":null,"usage":["no wonder (that) 句子"],"collos":[{"en":"no wonder (that) 句子","zh":"難怪…","toks":[{"a":["no"]},{"a":["wonder"]},{"g":"(that)"},{"g":"句子"}]}],"parts":["You stayed up playing video games until three in the morning; no ",{"a":["wonder"],"suf":""}," you fell asleep in class."],"full":"You stayed up playing video games until three in the morning; no wonder you fell asleep in class.","tr":"你打電動熬夜到凌晨三點；<b>難怪<\/b>你上課睡著了。"},{"id":200,"sec":"A","head":"wonderful","pos":"(adj.)","def":"very good; great","zh":"極好的；美妙的","forms":null,"usage":[],"collos":[],"parts":["We had a ",{"a":["wonderful"],"suf":""}," time at the beach last weekend, and the kids didn’t want to go home."],"full":"We had a wonderful time at the beach last weekend, and the kids didn’t want to go home.","tr":"我們上週末在海邊玩得很<b>愉快<\/b>，孩子們都不想回家。"},{"id":201,"sec":"A","head":"yell","pos":"(v.)","def":"to shout loudly, often because you are angry or excited","zh":"大叫；大吼","forms":null,"usage":["yell at 人","yell for help"],"collos":[{"en":"yell at 人","zh":"對某人大吼","toks":[{"a":["yell"]},{"a":["at"]},{"g":"人"}]},{"en":"yell for help","zh":"大聲呼救","toks":[{"a":["yell"]},{"a":["for"]},{"a":["help"]}]}],"parts":["The coach started to ",{"a":["yell"],"suf":""}," at the players because they were not listening, and the whole gym became quiet. The boy fell into the river and ",{"a":["yell"],"suf":"ed"}," for help."],"full":"The coach started to yell at the players because they were not listening, and the whole gym became quiet. The boy fell into the river and yelled for help.","tr":"教練開始對球員<b>大吼<\/b>，因為他們不專心聽，整個體育館都安靜了下來。男孩掉進河裡並<b>大聲呼<\/b>救。"},{"id":202,"sec":"A","head":"yell","pos":"(n.)","def":"a loud shout","zh":"叫喊聲","forms":null,"usage":["let out a yell"],"collos":[{"en":"let out a yell","zh":"發出叫喊","toks":[{"a":["let"]},{"a":["out"]},{"a":["a"]},{"a":["yell"]}]}],"parts":["When the home team scored in the last second, the fans let out a ",{"a":["yell"],"suf":""}," of excitement and jumped up and down."],"full":"When the home team scored in the last second, the fans let out a yell of excitement and jumped up and down.","tr":"當主隊在最後一秒得分時，球迷發出興奮的<b>叫喊聲<\/b>，跳上跳下。"},{"id":203,"sec":"B","head":"according to","pos":"(phr.)","def":"as said by someone or shown by something","zh":"根據","forms":null,"usage":[],"collos":[],"parts":[{"a":["according"],"suf":""}," ",{"a":["to"],"suf":""}," the weather report, it will rain all weekend, so we should cancel the picnic and stay home."],"full":"According to the weather report, it will rain all weekend, so we should cancel the picnic and stay home.","tr":"<b>根據<\/b>氣象報告，整個週末都會下雨，所以我們應該取消野餐待在家。"},{"id":204,"sec":"B","head":"all the way","pos":"(phr.)","def":"the whole distance; from the beginning to the end","zh":"一路","forms":null,"usage":[],"collos":[],"parts":["The bus was full this morning, so I had to stand ",{"a":["all"],"suf":""}," ",{"a":["the"],"suf":""}," ",{"a":["way"],"suf":""}," from my home to school."],"full":"The bus was full this morning, so I had to stand all the way from my home to school.","tr":"今天早上公車客滿，所以我只好從家裡<b>一路<\/b>站到學校。"},{"id":205,"sec":"B","head":"at one time","pos":"(phr.)","def":"at the same time; at once","zh":"一次；同時","forms":null,"usage":[],"collos":[],"parts":["The elevator is very small, so only six people are allowed to use it ",{"a":["at"],"suf":""}," ",{"a":["one"],"suf":""}," ",{"a":["time"],"suf":""},"."],"full":"The elevator is very small, so only six people are allowed to use it at one time.","tr":"這部電梯很小，所以<b>一次<\/b>只允許六個人搭乘。"},{"id":206,"sec":"B","head":"at the end of","pos":"(phr.)","def":"in the last part of something","zh":"在…的結尾","forms":null,"usage":[],"collos":[],"parts":[{"a":["at"],"suf":""}," ",{"a":["the"],"suf":""}," ",{"a":["end"],"suf":""}," ",{"a":["of"],"suf":""}," the movie, the hero finally found his family, and everyone in the theater cheered."],"full":"At the end of the movie, the hero finally found his family, and everyone in the theater cheered.","tr":"<b>在<\/b>電影<b>的結尾<\/b>，主角終於找到了家人，戲院裡每個人都歡呼。"},{"id":207,"sec":"B","head":"be afraid of","pos":"(adj.phr.)","def":"to feel fear of something","zh":"害怕","forms":null,"usage":[],"collos":[],"parts":["Many children seem to ",{"a":["be"],"suf":""}," ",{"a":["afraid"],"suf":""}," ",{"a":["of"],"suf":""}," the dark, so their parents leave a small light on at night."],"full":"Many children seem to be afraid of the dark, so their parents leave a small light on at night.","tr":"許多孩子似乎<b>害怕<\/b>黑暗，所以父母晚上會留一盞小燈。"},{"id":208,"sec":"B","head":"be allowed to","pos":"(v.phr.)","def":"to have permission to do something","zh":"被允許；可以","forms":null,"usage":[],"collos":[],"parts":["In this library, visitors will ",{"a":["be"],"suf":""}," ",{"a":["allowed"],"suf":""}," ",{"a":["to"],"suf":""}," borrow up to five books at a time if they have a card."],"full":"In this library, visitors will be allowed to borrow up to five books at a time if they have a card.","tr":"在這間圖書館，訪客只要有借書證，就<b>被允許<\/b>一次借最多五本書。"},{"id":209,"sec":"B","head":"be different from","pos":"(adj.phr.)","def":"to be not the same as","zh":"與…不同","forms":null,"usage":[],"collos":[],"parts":["Life in a big city can ",{"a":["be"],"suf":""}," very ",{"a":["different"],"suf":""}," ",{"a":["from"],"suf":""}," life in a small village, so it takes time to get used to it."],"full":"Life in a big city can be very different from life in a small village, so it takes time to get used to it.","tr":"大城市的生活可能<b>和<\/b>小村莊的生活非常<b>不同<\/b>，所以需要時間適應。"},{"id":210,"sec":"B","head":"be full of","pos":"(adj.phr.)","def":"to have a lot of something inside","zh":"充滿","forms":null,"usage":[],"collos":[],"parts":["On weekends, the night market will ",{"a":["be"],"suf":""}," ",{"a":["full"],"suf":""}," ",{"a":["of"],"suf":""}," tourists, so it’s better to go on a weekday."],"full":"On weekends, the night market will be full of tourists, so it’s better to go on a weekday.","tr":"週末夜市會<b>充滿<\/b>遊客，所以平日去比較好。"},{"id":211,"sec":"B","head":"be known as","pos":"(v.phr.)","def":"to be called a certain name by many people","zh":"被稱為","forms":null,"usage":[],"collos":[],"parts":["Taipei 101 used to ",{"a":["be"],"suf":""}," ",{"a":["known"],"suf":""}," ",{"a":["as"],"suf":""}," the tallest building in the world, and it still attracts many tourists."],"full":"Taipei 101 used to be known as the tallest building in the world, and it still attracts many tourists.","tr":"台北101曾經<b>被稱為<\/b>世界最高的建築，至今仍吸引許多遊客。"},{"id":212,"sec":"B","head":"be on the lookout for","pos":"(v.phr.)","def":"to keep watching carefully for someone or something","zh":"提防；注意","forms":null,"usage":[],"collos":[],"parts":["Travelers in crowded markets should ",{"a":["be"],"suf":""}," ",{"a":["on"],"suf":""}," ",{"a":["the"],"suf":""}," ",{"a":["lookout"],"suf":""}," ",{"a":["for"],"suf":""}," pickpockets, who often work in groups."],"full":"Travelers in crowded markets should be on the lookout for pickpockets, who often work in groups.","tr":"在擁擠市場的旅客應該<b>提防<\/b>扒手，他們通常成群行動。"},{"id":213,"sec":"B","head":"be open to","pos":"(adj.phr.)","def":"to be willing to listen to or accept something","zh":"對…持開放態度","forms":null,"usage":[],"collos":[],"parts":["A good leader should ",{"a":["be"],"suf":""}," ",{"a":["open"],"suf":""}," ",{"a":["to"],"suf":""}," new ideas, even if they come from the youngest members of the team."],"full":"A good leader should be open to new ideas, even if they come from the youngest members of the team.","tr":"好的領導者應該<b>對<\/b>新想法<b>持開放態度<\/b>，即使這些想法來自團隊中最年輕的成員。"},{"id":214,"sec":"B","head":"by one’s side","pos":"(phr.)","def":"next to someone, to support them","zh":"在某人身旁","forms":null,"usage":[],"collos":[],"parts":["No matter what happens, my best friend is always ",{"a":["by"],"suf":""}," my ",{"a":["side"],"suf":""},", and I am thankful for that."],"full":"No matter what happens, my best friend is always by my side, and I am thankful for that.","tr":"無論發生什麼事，我最好的朋友總是<b>在<\/b>我<b>身旁<\/b>，我很感激。"},{"id":215,"sec":"B","head":"can’t wait to","pos":"(v.phr.)","def":"to be very excited about doing something soon","zh":"迫不及待","forms":null,"usage":[],"collos":[],"parts":["I haven’t seen my best friend for a year, so I ",{"a":["can't"],"suf":""}," ",{"a":["wait"],"suf":""}," ",{"a":["to"],"suf":""}," see her this weekend."],"full":"I haven’t seen my best friend for a year, so I can't wait to see her this weekend.","tr":"我已經一年沒見到我最好的朋友了，所以我<b>迫不及待<\/b>這個週末要見到她。"},{"id":216,"sec":"B","head":"come across","pos":"(v.phr.)","def":"to meet or find someone or something by chance","zh":"偶然遇見；偶然發現","forms":"come – came – come","usage":[],"collos":[],"parts":["While I was cleaning my room, I happened to ",{"a":["come"],"suf":""}," ",{"a":["across"],"suf":""}," some old photos from elementary school."],"full":"While I was cleaning my room, I happened to come across some old photos from elementary school.","tr":"我打掃房間時，碰巧<b>偶然發現<\/b>一些小學的舊照片。"},{"id":217,"sec":"B","head":"come to realize","pos":"(v.phr.)","def":"to slowly begin to understand something","zh":"漸漸明白","forms":"come – came – come","usage":[],"collos":[],"parts":["As people grow older, they often ",{"a":["come"],"suf":""}," ",{"a":["to"],"suf":""}," ",{"a":["realize"],"suf":""}," that health is more important than money."],"full":"As people grow older, they often come to realize that health is more important than money.","tr":"隨著年紀增長，人們往往會<b>漸漸明白<\/b>健康比金錢重要。"},{"id":218,"sec":"B","head":"dress up","pos":"(v.phr.)","def":"to wear special clothes for fun or for an important event","zh":"裝扮；盛裝","forms":null,"usage":[],"collos":[],"parts":["On Halloween, my little brother likes to ",{"a":["dress"],"suf":""}," ",{"a":["up"],"suf":""}," as a superhero and go to our neighbors’ houses for candy."],"full":"On Halloween, my little brother likes to dress up as a superhero and go to our neighbors’ houses for candy.","tr":"萬聖節時，我弟弟喜歡<b>裝扮<\/b>成超級英雄，去鄰居家要糖果。"},{"id":219,"sec":"B","head":"except for","pos":"(phr.)","def":"not including","zh":"除了…之外","forms":null,"usage":[],"col const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm = s => String(s).trim().toLowerCase().replace(/[’‘`]/g, "'").replace(/\s+/g, ' ');
const list = $('#list'), select = $('#select'), quiz = $('#quiz'), result = $('#result'), feedback = $('#feedback');

let chosen = [], idx = 0, step = 1, tries = 0;
const wrong = new Map(), done = new Set();

/* ---------- selection screen ---------- */
function renderList() {
  $('#total').textContent = Q.length;
  let html = '', sec = '';
  Q.forEach(q => {
    if (q.sec !== sec) { sec = q.sec; html += '<div class="grp">' + (sec === 'A' ? 'A. 單字＋詞類變化' : 'B. 片語／搭配詞') + '</div>'; }
    html += '<label class="pick"><input class="pickbox" type="checkbox" value="' + q.id + '" checked><span><b>第 ' + q.id + ' 題</b>｜' + esc(q.zh) +
      ' <span class="pos">' + esc(q.pos) + '</span></span>' + (q.collos.length ? '<span class="tag">＋搭配詞</span>' : '') + '</label>';
  });
  list.innerHTML = html;
  countPicked();
}
const boxes = () => Array.from(document.querySelectorAll('.pickbox'));
const byId = id => Q.find(q => q.id === Number(id));
function setPicked(fn) { boxes().forEach(b => b.checked = fn(byId(b.value))); countPicked(); }
function countPicked() { $('#picked').textContent = '已選 ' + boxes().filter(b => b.checked).length + ' 題'; }
list.addEventListener('change', countPicked);
$('#all').onclick = () => setPicked(() => true);
$('#none').onclick = () => setPicked(() => false);
$('#secA').onclick = () => setPicked(q => q.sec === 'A');
$('#secB').onclick = () => setPicked(q => q.sec === 'B');
$('#colloOnly').onclick = () => setPicked(q => q.collos.length > 0);
$('#rand20').onclick = () => { const ids = new Set(shuffled(Q).slice(0, 20).map(q => q.id)); setPicked(q => ids.has(q.id)); };
function shuffled(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

$('#start').onclick = () => {
  const ids = boxes().filter(b => b.checked).map(b => Number(b.value));
  if (!ids.length) { $('#picked').textContent = '請至少選一題。'; return; }
  begin(Q.filter(q => ids.includes(q.id)));
};
function begin(items) {
  chosen = $('#shuffle').checked ? shuffled(items) : items;
  idx = 0; wrong.clear(); done.clear();
  select.classList.add('hidden'); result.classList.add('hidden'); quiz.classList.remove('hidden');
  show();
}

/* ---------- one question ---------- */
function gap(answers, hintLen) {
  const x = document.createElement('input');
  x.className = 'gap'; x.type = 'text';
  x.autocomplete = 'off'; x.autocapitalize = 'off'; x.spellcheck = false;
  x.setAttribute('autocorrect', 'off');
  x.dataset.a = JSON.stringify(answers);
  x.style.width = Math.max(4.5, hintLen * 1.2 + 2.5) + 'ch';
  x.setAttribute('aria-label', '填空');
  return x;
}
function renderCollos(q) {
  const box = $('#collos'); box.innerHTML = '';
  q.collos.forEach(c => {
    const d = document.createElement('div'); d.className = 'collo';
    const zh = document.createElement('div'); zh.className = 'czh'; zh.textContent = c.zh; d.append(zh);
    const line = document.createElement('div'); line.className = 'line';
    c.toks.forEach(t => {
      if (t.g !== undefined) { const s = document.createElement('span'); s.className = 'given'; s.textContent = t.g; line.append(s); }
      else line.append(gap(t.a, Math.max(...t.a.map(a => a.length))));
      line.append(' ');
    });
    d.append(line); box.append(d);
  });
}
function renderSentence(q) {
  const s = $('#sent'); s.innerHTML = '';
  q.parts.forEach(p => {
    if (typeof p === 'string') s.append(document.createTextNode(p));
    else {
      s.append(gap(p.a, Math.max(...p.a.map(a => a.length))));
      if (p.suf) { const u = document.createElement('span'); u.className = 'suf'; u.textContent = p.suf; s.append(u); }
    }
  });
  $('#tr').innerHTML = q.tr;      // translation: only <b> marks, built from the source table
}
function show() {
  if (window.speechSynthesis) speechSynthesis.cancel();
  const q = chosen[idx];
  $('#meta').textContent = '第 ' + (idx + 1) + ' / ' + chosen.length + ' 題';
  $('#wrongCount').textContent = '曾答錯 ' + wrong.size + ' 題';
  $('#bar').style.width = (idx / chosen.length * 100) + '%';
  $('#zh').textContent = q.zh; $('#pos').textContent = q.pos; $('#def').textContent = q.def;
  const hasCollo = q.collos.length > 0;
  $('#step1').classList.toggle('hidden', !hasCollo);
  $('#step2title').textContent = (hasCollo ? '② ' : '') + '例句填空 Sentence';
  renderCollos(q); renderSentence(q);
  feedback.className = 'feedback hidden';
  $('#voicebox').classList.add('hidden');
  $('#check').classList.remove('hidden'); $('#next').classList.add('hidden');
  step = hasCollo ? 1 : 2; tries = 0;
  setStep();
}
function setStep() {
  const s1 = $('#step1'), s2 = $('#step2');
  s1.className = 'step' + (s1.classList.contains('hidden') ? ' hidden' : '') + (step === 1 ? ' active' : ' done');
  s2.className = 'step' + (step === 2 ? ' active' : step > 2 ? ' done' : '');
  s2.classList.toggle('hidden', step === 1);
  const first = activeGaps().find(g => !g.disabled);
  if (first) first.focus();
}
const activeGaps = () => Array.from(document.querySelectorAll((step === 1 ? '#collos' : '#sent') + ' .gap'));

function check() {
  const q = chosen[idx], gaps = activeGaps().filter(g => !g.disabled);
  const empty = gaps.filter(g => !g.value.trim());
  if (empty.length) {
    feedback.className = 'feedback info'; feedback.textContent = '還有 ' + empty.length + ' 格沒填。'; empty[0].focus(); return;
  }
  const bad = [];
  gaps.forEach(g => {
    const answers = JSON.parse(g.dataset.a);
    if (answers.includes(norm(g.value))) { g.classList.remove('bad'); g.classList.add('ok'); g.disabled = true; }
    else { g.classList.add('bad'); bad.push(g); }
  });
  if (!bad.length) {
    tries = 0;
    if (step === 1) {
      step = 2; setStep();
      feedback.className = 'feedback ok'; feedback.textContent = '✅ 搭配詞正確！接著完成例句。';
    } else finishQuestion(q);
    return;
  }
  tries++;
  if (!wrong.has(q.id)) wrong.set(q.id, { q, attempts: [] });
  wrong.get(q.id).attempts.push((step === 1 ? '搭配詞' : '例句') + '：' + bad.map(g => g.value.trim()).join(' / '));
  $('#wrongCount').textContent = '曾答錯 ' + wrong.size + ' 題';
  feedback.className = 'feedback bad';
  if (tries === 1) {
    feedback.textContent = '❌ 有 ' + bad.length + ' 格不正確。紅色格子已顯示第一個字母，請再試一次。';
    bad.forEach(g => { const a = JSON.parse(g.dataset.a)[0]; g.value = ''; g.placeholder = a[0] + ' '.repeat(Math.max(0, a.length - 1)); });
  } else {
    feedback.innerHTML = '❌ 正確答案：' + bad.map(g => '<strong>' + esc(JSON.parse(g.dataset.a).join(' / ')) + '</strong>').join('、') + '<br>請照著拼一次，全部正確才能繼續。';
    bad.forEach(g => { g.value = ''; });
  }
  bad[0].focus();
}
function finishQuestion(q) {
  step = 3; setStep(); done.add(q.id);
  $('#bar').style.width = ((idx + 1) / chosen.length * 100) + '%';
  feedback.className = 'feedback ok'; feedback.textContent = '✅ 全部正確！聽一次完整句子。';
  $('#target').textContent = q.full;
  const notes = [];
  if (q.forms) notes.push('三態：<code>' + esc(q.forms) + '</code>');
  if (q.usage.length) notes.push('用法：' + q.usage.map(u => '<code>' + esc(u) + '</code>').join(''));
  $('#usage').innerHTML = notes.join('<br>'); $('#usage').classList.toggle('hidden', !notes.length);
  $('#voicebox').classList.remove('hidden');
  $('#check').classList.add('hidden');
  const n = $('#next'); n.classList.remove('hidden'); n.textContent = idx + 1 >= chosen.length ? '看結果 →' : '下一題 →';
  setTimeout(() => n.focus(), 0);
  setTimeout(speakCurrent, 250);
}

/* ---------- speech ---------- */
function speakCurrent() {
  const q = chosen[idx];
  if (!q || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(q.full);
  u.lang = 'en-US'; u.rate = 0.88;
  const vs = speechSynthesis.getVoices();
  u.voice = vs.find(v => /^en-US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
  speechSynthesis.speak(u);
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();   // warm up the voice list
$('#speak').onclick = speakCurrent;

/* ---------- navigation ---------- */
$('#check').onclick = check;
$('#next').onclick = () => { idx++; idx >= chosen.length ? finishQuiz() : show(); };
$('#finish').onclick = finishQuiz;
quiz.addEventListener('keydown', e => {
  if (e.key !== 'Enter' || !e.target.classList.contains('gap')) return;
  e.preventDefault();
  const open = activeGaps().filter(g => !g.disabled), i = open.indexOf(e.target);
  const nextEmpty = open.slice(i + 1).find(g => !g.value.trim());
  nextEmpty ? nextEmpty.focus() : check();
});

/* ---------- results ---------- */
function answerText(q) {
  const c = q.collos.map(c => c.en + '（' + c.zh + '）').join('；');
  return { collo: c, sentence: q.full, word: q.head };
}
function finishQuiz() {
  if (window.speechSynthesis) speechSynthesis.cancel();
  quiz.classList.add('hidden'); result.classList.remove('hidden');
  $('#summary').innerHTML = '<div class="stat">選擇題數<b>' + chosen.length + '</b></div><div class="stat">完成<b>' + done.size +
    '</b></div><div class="stat">一次答對<b>' + [...done].filter(id => !wrong.has(id)).length + '</b></div><div class="stat">曾答錯<b>' + wrong.size + '</b></div>';
  $('#wrongList').innerHTML = wrong.size ? Array.from(wrong.values()).map((r, i) => {
    const a = answerText(r.q);
    return '<div class="wrong"><b>' + (i + 1) + '. 第 ' + r.q.id + ' 題｜' + esc(r.q.zh) + ' ' + esc(r.q.pos) + '</b>' +
      '<p>錯誤紀錄：' + r.attempts.map(esc).join('<br>') + '</p><p><strong>單字／片語：</strong>' + esc(a.word) + '</p>' +
      (a.collo ? '<p><strong>搭配詞：</strong>' + esc(a.collo) + '</p>' : '') + '<p><strong>完整句：</strong>' + esc(a.sentence) + '</p></div>';
  }).join('') : '<div class="feedback ok">🎉 沒有錯題紀錄。</div>';
  $('#download').classList.toggle('hidden', !wrong.size);
  $('#retryWrong').classList.toggle('hidden', !wrong.size);
}
$('#restart').onclick = () => { result.classList.add('hidden'); select.classList.remove('hidden'); };
$('#retryWrong').onclick = () => begin(Array.from(wrong.values()).map(r => r.q));

$('#download').onclick = async () => {
  if (!wrong.size) return;
  const rows = Array.from(wrong.values()), stamp = new Date().toISOString().slice(0, 10), name = '龍騰B1_U1-U3_R1_單字搭配詞_錯題_' + stamp;
  const save = (blob, ext) => { const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = name + ext; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); };
  try {
    const { Document, Packer, Paragraph, TextRun, HeadingLevel } = await import('https://esm.sh/docx@9.5.1');
    const line = (label, text) => new Paragraph({ children: [new TextRun({ text: label, bold: true }), new TextRun({ text })] });
    const children = [new Paragraph({ heading: HeadingLevel.TITLE, children: [new TextRun({ text: TITLE + ' 錯題紀錄', bold: true })] })];
    rows.forEach((r, i) => {
      const a = answerText(r.q);
      children.push(new Paragraph({ heading: HeadingLevel.HEADING_2, children: [new TextRun({ text: (i + 1) + '. 第 ' + r.q.id + ' 題 ' + r.q.zh + ' ' + r.q.pos, bold: true })] }));
      children.push(line('錯誤紀錄：', r.attempts.join(' | ')), line('單字／片語：', a.word));
      if (a.collo) children.push(line('搭配詞：', a.collo));
      children.push(line('完整句：', a.sentence), line('中譯：', r.q.tr.replace(/<\/?b>/g, '')));
    });
    save(await Packer.toBlob(new Document({ sections: [{ children }] })), '.docx');
  } catch (e) {   // offline or CDN blocked: fall back to a plain-text file
    const txt = rows.map((r, i) => { const a = answerText(r.q); return (i + 1) + '. 第 ' + r.q.id + ' 題 ' + r.q.zh + ' ' + r.q.pos + '\n錯誤紀錄：' + r.attempts.join(' | ') + '\n單字／片語：' + a.word + (a.collo ? '\n搭配詞：' + a.collo : '') + '\n完整句：' + a.sentence + '\n'; }).join('\n');
    save(new Blob([TITLE + ' 錯題紀錄\n\n' + txt], { type: 'text/plain;charset=utf-8' }), '.txt');
  }
};

renderList();
</script>
</body>
</html>
