<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="龍騰普高 B3U8 引導式翻譯互動練習"><title>龍騰普高 B3U8 引導式翻譯</title><style>:root{--blue:#2563eb;--navy:#1e3a8a;--bg:#f4f7fb;--card:#fff;--line:#dbe3ee;--ink:#172033;--muted:#64748b;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--voice:#6d28d9;--voicebg:#f5f3ff;--amber:#9a3412;--amberbg:#fff7ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}.wrap{max-width:920px;margin:auto;padding:16px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 5px 18px #0f172a0d}.hero{background:linear-gradient(135deg,#e8f1ff,#fff)}h1{margin:0 0 6px;font-size:clamp(25px,4vw,38px)}h2{margin-top:0}.note{color:var(--muted)}.hidden{display:none!important}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.btn{border:0;border-radius:10px;padding:11px 17px;font:800 16px inherit;cursor:pointer;background:#e5e7eb;color:var(--ink);text-decoration:none}.primary{background:var(--blue);color:#fff}.danger{background:#991b1b;color:#fff}.voice{background:var(--voice);color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.btn:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.pick{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin:7px 0;background:#fafcff}.pick input{margin-right:8px;width:17px;height:17px;accent-color:var(--blue)}#list{max-height:440px;overflow:auto;border:1px solid var(--line);padding:7px;border-radius:12px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:800;margin:8px 0 14px}.zh{padding:10px 13px;background:var(--amberbg);border-radius:9px;color:var(--amber);font-weight:800;margin-bottom:10px}.question{font-size:21px;font-weight:750;padding:16px;background:#f8fafc;border-radius:11px;white-space:pre-wrap}.options{display:grid;gap:9px;margin:14px 0}.option{display:flex;align-items:center;gap:11px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-size:18px;font-weight:750;cursor:pointer}.option:hover{border-color:#60a5fa;background:#eff6ff}.option:has(input:checked){border-color:var(--blue);background:#dbeafe;color:var(--navy)}.option input{width:20px;height:20px;accent-color:var(--blue)}.inputs{display:grid;gap:10px;margin:15px 0}.answer-row{display:grid;grid-template-columns:55px 1fr;gap:10px;align-items:center}.answer-row label{font-weight:900;color:var(--navy);text-align:center}.spell{width:100%;font:inherit;font-size:18px;padding:11px;border:2px solid #94a3b8;border-radius:9px}.feedback{padding:13px;border-radius:10px;font-weight:800;margin:13px 0}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.explain{font-weight:500;margin-top:7px}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:var(--voicebg);margin:13px 0}.voicebox b{display:block;font-size:19px;margin-bottom:8px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}.wrong p{margin:6px 0}.source{font-size:13px;color:var(--muted)}@media(max-width:600px){.wrap{padding:9px}.hero,.card{padding:15px}.question{font-size:18px;padding:13px}.option{font-size:17px}.answer-row{grid-template-columns:42px 1fr}.meta{display:block}}</style><link rel="stylesheet" href="longteng-vocab-required-pronunciation.css?v=20261026-4"></head><body><main class="wrap"><section class="hero"><h1>龍騰普高 B3U8 引導式翻譯</h1><p>共 44 題。可自行選題、隨機抽題；答錯後請重新作答。</p><p class="note">答對後顯示來源解析並播放完整英文句；STT 朗讀達 80% 才能進入下一題。完成後可重做錯題並下載 DOCX。</p><div class="toolbar"><a class="btn" href="dashboard.html">← 回測驗總覽</a></div></section><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn">全部選取</button><button id="none" class="btn">全部取消</button><button id="rand20" class="btn">隨機 20 題</button></div><label><input id="shuffle" type="checkbox"> 打亂出題順序</label><div id="list"></div><div class="actions"><button id="start" class="btn primary">開始作答</button><span id="picked" class="note"></span></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="voiceBox" class="voicebox hidden"><b id="voiceTarget"></b><button id="speak" class="btn voice">🔊 再聽一次</button></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="retry" class="btn primary">只重做錯題</button><button id="download" class="btn">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></main><script>const TITLE="龍騰普高 B3U8 引導式翻譯",MODE="multi",Q=[{"id":1,"zh":"應對難纏的顧客時，Sophia拿出了和她平時一樣的笑容面對。","question":"Sophia smiled the same smile that she usually wore when ①____________ ②____________ difficult customers.","answers":["dealing","with"],"explanation":"","source":"習作簿"},{"id":2,"zh":"Debra讓她的員工獨立工作；你不會發現她在監督他們。","question":"Debra lets her employees ①____________ ②____________ their work independently. You won’t find her looking over anyone’s shoulder.","answers":["go","about"],"explanation":"","source":"課本例句填空"},{"id":3,"zh":"這名經理解決顧客的問題不夠迅速，最終遭解僱。","question":"The manager didn’t ①____________ ②____________ his customers’ problems quickly enough and ended up getting fired.","answers":["deal","with"],"explanation":"","source":"課本例句填空"},{"id":4,"zh":"雖然觀光業為這個國家每年帶來數百萬美元的金錢，不幸地也導致當地生態的破壞。","question":"Though tourism brings millions of US dollars into the country every year; it unfortunately also ①l____________ ②____________ the destruction of local ecosystems.","answers":["leads","to"],"explanation":"","source":"三合一學習手冊"},{"id":5,"zh":"為了我們最近的一次旅行，我先生訂了機票，而我則處理找住宿飯店。","question":"For our most recent trip, my husband booked the plane tickets, and I ①____________ ②____________ finding a hotel.","answers":["dealt","with"],"explanation":"","source":"三合一學習手冊"},{"id":6,"zh":"這名行銷經理提出幾項增加銷量的提案，其中沒有一個可能真的可以造成銷量大增。","question":"The marketing manager put forward several proposals to increase sales, ①____________ of ②____________ might actually be able to ③____________ ④____________ a huge increase in sales.","answers":["none","which","lead","to"],"explanation":"put forward 提出；考點句構：...N, none of which + V...。本句沒有連接詞連接兩個子句，空格應用關係代名詞，先行詞為several proposals，表「其中沒有一個」用none of which","source":"龍騰自命題"},{"id":7,"zh":"這個商店老闆不知道是誰用塗鴉破壞牆面。他沒辦法只好自己收拾殘局。","question":"The store owner didn’t know who had vandalized the walls with graffiti. He had no choice but to ①d____________ ②____________ the mess on his own.","answers":["deal","with"],"explanation":"vandalize 故意破壞","source":"龍騰自命題"},{"id":8,"zh":"許多城市正努力解決過度旅遊。","question":"Many cities are struggling to ①d____________ ②____________ overtourism.","answers":["deal","with"],"explanation":"struggle 艱難地奮鬥","source":"龍騰自命題"},{"id":9,"zh":"我有些朋友非常以在健身房裡一起健身為樂。","question":"Some of my friends ①____________ great ②____________ ③____________ working out together in the gym.","answers":["take","pleasure","in"],"explanation":"","source":"三合一學習手冊"},{"id":10,"zh":"因為不確定要去哪一間公司上班，Mary正忙著尋求朋友及家人的建議。","question":"Unsure about which company to work for, Mary is ①g____________ ②____________ seeking advice from friends and family.","answers":["going","about"],"explanation":"","source":"三合一學習手冊"},{"id":11,"zh":"這些學習材料有助於那些想要增進閱讀技巧的人。此外，材料是免費提供的。","question":"These learning materials are helpful to those who want to improve their reading skills. ①____________ ②m____________, they are offered free of charge.","answers":["What’s","more"],"explanation":"","source":"三合一學習手冊"},{"id":12,"zh":"我弟弟很少在乎課業。更糟的是，他沉迷於手遊且從不停止玩。","question":"My brother seldom cares about his studies. ①____________ ②s____________, he is addicted to mobile games and never stops playing.","answers":["Worse","still"],"explanation":"","source":"三合一學習手冊"},{"id":13,"zh":"這位作家已寫了五本小說，全部都跟家庭衝突有關。","question":"The writer has already written five novels, ①____________ ②____________ ③____________ are about family conflict.","answers":["all","of","which"],"explanation":"","source":"三合一學習手冊"},{"id":14,"zh":"是時候Frank該從他們的分手復原了。已經三年了！","question":"It’s ①a____________ ②____________ ③____________ Frank got over their break-up. It’s been three years!","answers":["about","time","that"],"explanation":"","source":"三合一學習手冊"},{"id":15,"zh":"很多狗被迫用後腿走路或者做其他特技。","question":"Many dogs ①____________ ②m____________ ③____________ ④____________ on their hind legs or do other tricks.","answers":["are","made","to","walk"],"explanation":"","source":"三合一學習手冊"},{"id":16,"zh":"一旦Jerry忙於做他的事，就不可能停下來。","question":"①____________ Jerry ②g____________ ③____________ his business, it’s impossible for him to stop.","answers":["Once","goes","about"],"explanation":"","source":"三合一學習手冊"},{"id":17,"zh":"這家公司在YouTube上的廣告造成銷售量大增。","question":"The company’s advertisements on YouTube ①____________ ②____________ a huge increase in sales.","answers":["led","to"],"explanation":"","source":"課本例句填空"},{"id":18,"zh":"闖紅燈是違法的。此外，這極度危險，也可能導致嚴重的傷害，甚至是死亡。","question":"Running a red light is illegal. ①____________ ②____________, it’s extremely dangerous and could lead to serious injuries or even death.","answers":["What’s","more"],"explanation":"","source":"課本例句填空"},{"id":19,"zh":"已經證實生活中過多的壓力可能會導致健康問題。","question":"It has been proved that too much pressure in life may ①l____________ ②____________ health problems.","answers":["lead","to"],"explanation":"","source":"習作簿"},{"id":20,"zh":"現在鎮上沒電。更糟的是，飲用水已經被汙染了。","question":"There is no power in the town right now. ①____________ ②____________, the drinking water has been polluted.","answers":["Worse","still"],"explanation":"","source":"All in One"},{"id":21,"zh":"David給我一份很棒的生日禮物。此外，他還為我舉行一個驚喜派對。","question":"David gave me a wonderful birthday gift. ①____________ ②____________, he threw a surprise party for me.","answers":["What’s","more"],"explanation":"","source":"All in One"},{"id":22,"zh":"Maria以生活中的小事為樂，像看夕陽或沿著河邊走。","question":"Maria ①____________ ②____________ ③____________ the small things in life, such as watching the sunset or walking along the river.","answers":["takes","pleasure","in"],"explanation":"","source":"All in One"},{"id":23,"zh":"好好睡一個晚上對記憶力十分重要。此外，它可以幫助復原你身體的天生治癒過程。","question":"Having a good night’s sleep is essential to memory. ①____________ ②m____________, it can help you restore your body’s natural healing process.","answers":["What’s","more"],"explanation":"what’s more此外","source":"龍騰自命題"},{"id":24,"zh":"Eden不健康的飲食以及缺乏運動導致了快速體重增加。","question":"Eden’s unhealthy diet and lack of exercise ①l____________ ②____________ a rapid weight gain.","answers":["led","to"],"explanation":"因為是過去發生的事，故用過去式led to","source":"龍騰自命題"},{"id":25,"zh":"Elisa以自己做點心為樂，所以她書架上有許多本食譜。","question":"Elisa ①____________ ②p____________ ③____________ making snacks on her own, so she has many cookbooks on the bookshelf.","answers":["takes","pleasure","in"],"explanation":"take pleasure in 以……為樂；喜歡做……","source":"龍騰自命題"},{"id":26,"zh":"Lina總是告訴她的同事Robert該如何進行某件任務，但她自己什麼事也沒做。","question":"Lina always tells her colleague Robert how to ①____________ ②a____________ a certain task, but she does nothing herself.","answers":["go","about"],"explanation":"colleague 同事；go about 做……；忙碌於","source":"龍騰自命題"},{"id":27,"zh":"Hank開會遲到。更糟的是，他忘記帶他的報告。","question":"Hank was late for the meeting. ①____________ ②s____________, he forgot to bring his report.","answers":["Worse","still"],"explanation":"worse still 更糟的是","source":"龍騰自命題"},{"id":28,"zh":"使用你自己的可清洗餐具在外用餐可保護你免於染病，此外，也可幫助拯救地球。","question":"Using your own washable utensils when eating out can protect you from disease, and ①____________ ②m____________, it also helps to save the earth.","answers":["what’s","more"],"explanation":"washable utensil 可清洗餐具；protect sb. from sth. 保護某人免於某事；what’s more 此外","source":"龍騰自命題"},{"id":29,"zh":"儘管Aaron廚藝高超，他的壞脾氣導致了他新餐廳廚房團隊的失敗。","question":"Despite the fact that Aaron has superb cooking skills, his bad temper ①l____________ ②____________ the failure of his kitchen team at the new restaurant.","answers":["led","to"],"explanation":"superb 超級的；lead to 導致；造成","source":"龍騰自命題"},{"id":30,"zh":"May喜歡素描；難怪無論何時外出她總是隨身帶著小筆記本跟鉛筆。","question":"May ①____________ ②____________ ③____________ sketching; no wonder she always brings a little notebook and pencils with her whenever she goes out.","answers":["takes","pleasure","in"],"explanation":"no wonder 難怪；bring sth. with sb. 隨身攜帶；take pleasure in 以……為樂","source":"龍騰自命題"},{"id":31,"zh":"Howard正忙著做他的期末報告，所以我們大概不應該打擾他。","question":"Howard is busy ①____________ ②____________ his final project, so we probably should not disturb him.","answers":["going","about"],"explanation":"be busy + V-ing 忙於做……；disturb 打擾","source":"龍騰自命題"},{"id":32,"zh":"如果你想要有輕鬆又充滿活力的早晨，是時候該早上早點起床並吃營養食物當早餐了。","question":"If you want to have a relaxed and energetic morning, it’s high time that you ①____________ up earlier in the morning and ②____________ nutritious food for breakfast.","answers":["got","ate"],"explanation":"考點句構：It’s high time + that + S + V-ed 表「是時候該做某事」，對等連接詞and前後的時態需一致，故第二格填ate","source":"龍騰自命題"},{"id":33,"zh":"Lily誤把糖加入她的咖哩料理。更糟的是，她的咖哩鍋底燒焦了。","question":"Lily put sugar into her curry dish by mistake. ①____________ ②s____________, the bottom of her curry pot burned.","answers":["Worse","still"],"explanation":"do sth. by mistake 誤做了某事；worse still更糟的是","source":"龍騰自命題"},{"id":34,"zh":"Mike以看新漫畫書及將它們加入他的大批收藏為樂。","question":"Mike ①____________ ②____________ ③____________ ④____________ new comic books and ⑤____________ them to his huge collection.","answers":["takes","pleasure","in","reading","adding"],"explanation":"take pleasure in 以……為樂；對等連接詞and前後詞性應一致，故填入reading及adding","source":"龍騰自命題"},{"id":35,"zh":"雖然做這件運輸計畫有數種方法，研究團隊建議選擇環保的方式。","question":"Although there are several ways to ①____________ ②____________ this transportation project, the research team recommends taking an environmentally friendly approach.","answers":["go","about"],"explanation":"transportation 運輸；recommend + V-ing 建議做……","source":"龍騰自命題"},{"id":36,"zh":"現在鎮上沒電；更糟的是，飲用水被汙染了。","question":"There is no power in the town right now; ①____________ ②____________, the drinking water has been polluted.","answers":["worse","still"],"explanation":"","source":"習作簿"},{"id":37,"zh":"Elton邀請了許多國中時期的好朋友到他家，其中四位跟他一樣很喜歡下棋。","question":"Elton invited many of his close friends from junior high school to his house, four ①____________ ②____________ take as much ③____________ ④____________ chess as he does.","answers":["of","whom","pleasure","in"],"explanation":"考點句構：...N, four of whom+ V...。本句沒有連接詞連接兩個子句，空格應用關係代名詞，先行詞為介系詞片語from junior high school前的many of his close friends，故關係代名詞用whom；take as much pleasure in sth. as S + V... 跟……一樣很喜歡做某事","source":"龍騰自命題"},{"id":38,"zh":"這家餐廳很有名而且有許多常客，其中一些是當地名人。","question":"This restaurant is famous and has many regular customers, some ①____________ ②____________ ③____________ local celebrities.","answers":["of","whom","are"],"explanation":"考點句構：...N, some of whom+ V...。本句沒有連接詞連接兩個子句，空格應用關係代名詞，先行詞為many regular customers，故關係代名詞用whom，be動詞為複數","source":"龍騰自命題"},{"id":39,"zh":"為了要照顧他的家庭，Joe有幾份兼職工作，其中之一是外送食物。","question":"In order to support his family, Joe has several part-time jobs, ①____________ of ②____________ is food delivery.","answers":["one","which"],"explanation":"考點句構：...N, one of which + V...。本句沒有連接詞連接兩個子句，空格應用關係代名詞，先行詞為several part-time jobs，表「其中之一」用one of which","source":"龍騰自命題"},{"id":40,"zh":"Tracy的目標過於遠大，想在這麼短的時間內快速擴展連鎖咖啡店，導致鉅額的損失。","question":"Tracy’s overambitious goal of expanding the chain of coffee shops within such a short period of time ①l____________ ②____________ a huge economic loss.","answers":["led","to"],"explanation":"overambitious 過於遠大的；expand 擴展；本句主詞為Tracy’s overambitious goal，其後的片語of...time修飾它；因為是過去發生的事，用過去式led to","source":"龍騰自命題"},{"id":41,"zh":"在強烈的暴風雨期間，這棟建築物的電力應用被切斷。更糟的是，整個接待區都淹水了。","question":"During the violent storm, the building’s power supply was cut off. ①____________ ②____________, the entire reception area was flooded.","answers":["Worse","still"],"explanation":"","source":"課本例句填空"},{"id":42,"zh":"Bill和Jane非常喜歡聽他們的女兒唱歌，而且他們可以整晚就只聽她唱歌。","question":"Bill and Jane ①____________ great ②____________ ③____________ hearing their daughter sing, and they can simply listen to her all night.","answers":["take","pleasure","in"],"explanation":"","source":"課本例句填空"},{"id":43,"zh":"這個頑皮的男孩喜歡開老師們和同學們的玩笑。","question":"The naughty boy ①____________ ②p____________ ③____________ playing tricks on his teachers and classmates.","answers":["took||takes","pleasure","in"],"explanation":"","source":"習作簿"},{"id":44,"zh":"那是如此寒冷的一個冬天。讓我想起了一則古老的故事，一場可怕的事件降臨在一個王國。","question":"It was ①____________ ②____________ ③____________ winter. It reminded me of an ancient story where a terrible event happened to a kingdom.","answers":["such","a","cold"],"explanation":"","source":"三合一學習手冊"}];const $=s=>document.querySelector(s),list=$('#list'),select=$('#select'),quiz=$('#quiz'),result=$('#result'),question=$('#question'),answerArea=$('#answerArea'),feedback=$('#feedback'),next=$('#next');let chosen=[],idx=0,mode='first';const wrong=new Map(),correct=new Set();const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ');const shuffled=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function renderList(){list.innerHTML=Q.map(q=>'<label class="pick"><input class="pickbox" type="checkbox" value="'+q.id+'" checked><b>第 '+q.id+' 題</b> <span class="source">'+esc(q.source||'')+'</span></label>').join('');count()}function count(){$('#picked').textContent='已選 '+document.querySelectorAll('.pickbox:checked').length+' 題'}list.addEventListener('change',count);$('#all').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=true);count()};$('#none').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=false);count()};$('#rand20').onclick=()=>{let ids=new Set(shuffled(Q).slice(0,Math.min(20,Q.length)).map(q=>q.id));document.querySelectorAll('.pickbox').forEach(x=>x.checked=ids.has(+x.value));count()};$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));if($('#shuffle').checked)chosen=shuffled(chosen);idx=0;mode='first';wrong.clear();correct.clear();select.classList.add('hidden');result.classList.add('hidden');quiz.classList.remove('hidden');show()};function show(){const q=chosen[idx];speechSynthesis?.cancel();$('#meta').textContent=(mode==='retry'?'錯題重做｜':'')+'第 '+(idx+1)+' / '+chosen.length+' 題';$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';$('#bar').style.width=(idx+1)/chosen.length*100+'%';question.textContent=q.question;const zh=$('#zh');if(q.zh){zh.textContent=q.zh;zh.classList.remove('hidden')}else zh.classList.add('hidden');feedback.className='feedback hidden';$('#voiceBox').classList.add('hidden');$('#check').classList.remove('hidden');next.classList.add('hidden');if(MODE==='mcq')answerArea.innerHTML='<div class="options">'+q.options.map((o,i)=>'<label class="option"><input type="radio" name="answer" value="'+i+'"><b>'+String.fromCharCode(65+i)+'.</b> '+esc(o)+'</label>').join('')+'</div>';else answerArea.innerHTML='<div class="inputs">'+q.answers.map((_,i)=>'<div class="answer-row"><label>'+(MODE==='multi'?['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'][i]:'答案')+'</label><input class="spell" autocomplete="off" spellcheck="false" placeholder="請輸入完整答案"></div>').join('')+'</div>';setTimeout(()=>answerArea.querySelector('input')?.focus(),0)}function currentAnswers(){if(MODE==='mcq'){const x=answerArea.querySelector('input:checked');return x?[+x.value]:[]}return [...answerArea.querySelectorAll('.spell')].map(x=>x.value)}function correctText(q){return MODE==='mcq'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.answers.map(a=>a.split('||')[0]).join(' / ')}function isCorrect(q,a){return MODE==='mcq'?a[0]===q.answer:a.every((x,i)=>q.answers[i].split(/\|\||\//).some(v=>norm(x)===norm(v)))}function completedSentence(q){if(MODE==='mcq'){let s=q.question,v=q.options[q.answer],parts=(s.match(/_{3,}/g)||[]).length>1&&v.includes(';')?v.split(';').map(x=>x.trim()):[v];parts.forEach(x=>s=s.replace(/_{3,}/,x));return s}if(MODE==='spell')return q.question.replace(/[A-Za-z]?_{3,}[A-Za-z]?/,q.answers[0].split('||')[0]);let s=q.question,marks=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];q.answers.forEach((a,i)=>{let value=a.split('||')[0];let re=new RegExp(marks[i]+'\\s*[A-Za-z]?_{3,}[A-Za-z]?');if(re.test(s))s=s.replace(re,value);else s=s.replace(/_{3,}/,value)});return s.replace(/[①-⑩]/g,'')}function speak(){if(!speechSynthesis)return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance($('#voiceTarget').textContent);u.lang='en-US';u.rate=.86;speechSynthesis.speak(u)}$('#speak').onclick=speak;$('#check').onclick=()=>{const q=chosen[idx],a=currentAnswers();if((MODE==='mcq'&&!a.length)||(MODE!=='mcq'&&(a.length!==q.answers.length||a.some(x=>!x.trim()))))return alert('請完成所有答案。');if(isCorrect(q,a)){correct.add(q.id);feedback.className='feedback ok';feedback.innerHTML='✅ 全部正確！'+(q.explanation?'<div class="explain">解析：'+esc(q.explanation)+'</div>':'');$('#check').classList.add('hidden');next.classList.remove('hidden');$('#voiceTarget').textContent=completedSentence(q);$('#voiceBox').classList.remove('hidden');speak()}else{if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(MODE==='mcq'?String.fromCharCode(65+a[0]):a.join(' / '));$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';feedback.className='feedback bad';feedback.innerHTML='❌ 答案不正確。正確答案：<strong>'+esc(correctText(q))+'</strong><br>請重新作答。'+(q.explanation?'<div class="explain">解析：'+esc(q.explanation)+'</div>':'');if(MODE==='mcq')answerArea.querySelectorAll('input').forEach(x=>x.checked=false);else answerArea.querySelectorAll('.spell').forEach(x=>x.value='');answerArea.querySelector('input')?.focus()}};next.onclick=()=>{idx++;idx>=chosen.length?finish():show()};$('#finish').onclick=finish;function finish(){speechSynthesis?.cancel();quiz.classList.add('hidden');result.classList.remove('hidden');$('#summary').innerHTML='<div class="stat">本輪題數<b>'+chosen.length+'</b></div><div class="stat">完成答對<b>'+correct.size+'</b></div><div class="stat">曾答錯<b>'+wrong.size+'</b></div>';$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>'<div class="wrong"><b>'+(i+1)+'. 第 '+r.q.id+' 題</b><p>'+esc((r.q.zh?r.q.zh+'\n':'')+r.q.question)+'</p><p><strong>錯誤答案：</strong>'+r.attempts.map(esc).join('；')+'</p><p><strong>正確答案：</strong>'+esc(correctText(r.q))+'</p>'+(r.q.explanation?'<p><strong>解析：</strong>'+esc(r.q.explanation)+'</p>':'')+'</div>').join(''):'<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size);$('#retry').classList.toggle('hidden',!wrong.size)}$('#retry').onclick=()=>{chosen=[...wrong.values()].map(x=>x.q);idx=0;mode='retry';correct.clear();result.classList.add('hidden');quiz.classList.remove('hidden');show()};$('#restart').onclick=()=>location.reload();$('#download').onclick=async()=>{if(!wrong.size)return;try{if(!window.docx)await new Promise((ok,fail)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js';s.onload=ok;s.onerror=fail;document.head.append(s)});let{Document,Packer,Paragraph,TextRun,HeadingLevel}=window.docx,children=[new Paragraph({text:TITLE+' 錯題紀錄',heading:HeadingLevel.TITLE})];for(const [_,r] of wrong){children.push(new Paragraph({children:[new TextRun({text:'第 '+r.q.id+' 題',bold:true})]}));if(r.q.zh)children.push(new Paragraph(r.q.zh));children.push(new Paragraph(r.q.question),new Paragraph('錯誤答案：'+r.attempts.join('；')),new Paragraph('正確答案：'+correctText(r.q)));if(r.q.explanation)children.push(new Paragraph('解析：'+r.q.explanation));children.push(new Paragraph('重新作答：________________________________________'))}let blob=await Packer.toBlob(new Document({sections:[{children}]})),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=TITLE+'_錯題.docx';a.click();URL.revokeObjectURL(url)}catch(e){let text=[...wrong.values()].map(r=>'第 '+r.q.id+' 題\n'+(r.q.zh?r.q.zh+'\n':'')+r.q.question+'\n錯誤答案：'+r.attempts.join('；')+'\n正確答案：'+correctText(r.q)+(r.q.explanation?'\n解析：'+r.q.explanation:'')).join('\n\n');let blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=TITLE+'_錯題.txt';a.click();URL.revokeObjectURL(url)}};renderList();</script><script src="longteng-vocab-required-pronunciation.js?v=20261111-1"></script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
