<script>window.QUIZ_CONFIG={"title": "109 年國中會考英語｜單題＋克漏字", "mode": "mcq", "questions": [{"id": 1, "question": "第 1 題　Look at the picture. The man is holding one of the ______.", "options": ["bowls", "glasses", "plates", "spoons"], "answer": 1, "answerLabel": "B", "source": "109 會考｜單題｜第 1 題", "explanation": "圖中男子手裡拿的是一個高腳杯，one of the glasses（杯子之一）。", "explanationSource": "own", "section": "單題"}, {"id": 2, "question": "第 2 題　My mom puts the ______ on to keep her hands away from water when she washes the dishes.", "options": ["gloves", "jacket", "ring", "socks"], "answer": 0, "answerLabel": "A", "source": "109 會考｜單題｜第 2 題", "explanation": "洗碗時戴上「手套」讓手不碰到水：gloves。", "explanationSource": "own", "section": "單題"}, {"id": 3, "question": "第 3 題　Can you ______ your feet a little off the floor? I want to see if my keys are under the sofa.", "options": ["check", "kick", "raise", "show"], "answer": 2, "answerLabel": "C", "source": "109 會考｜單題｜第 3 題", "explanation": "要看鑰匙是否在沙發下，請對方把腳「抬高」一點：raise。", "explanationSource": "own", "section": "單題"}, {"id": 4, "question": "第 4 題　______ of my sisters are older than I am. I’m the youngest of the three children in my family.", "options": ["Both", "Few", "Most", "Some"], "answer": 0, "answerLabel": "A", "source": "109 會考｜單題｜第 4 題", "explanation": "我是三個孩子中最小的，所以「兩個」姊姊都比我大：Both。", "explanationSource": "own", "section": "單題"}, {"id": 5, "question": "第 5 題　The beach near our town is a very ______ place. Every summer at least one kid dies there in the water.", "options": ["dangerous", "exciting", "lonely", "popular"], "answer": 0, "answerLabel": "A", "source": "109 會考｜單題｜第 5 題", "explanation": "每年都有孩子在那裡溺水，所以是「危險的」地方：dangerous。", "explanationSource": "own", "section": "單題"}, {"id": 6, "question": "第 6 題　My wife enjoys going to the movies with her friends, but I like to watch TV at home by ______.", "options": ["I", "me", "myself", "mine"], "answer": 2, "answerLabel": "C", "source": "109 會考｜單題｜第 6 題", "explanation": "by oneself＝獨自；主詞是 I，用 myself。", "explanationSource": "own", "section": "單題"}, {"id": 7, "question": "第 7 題　For the past twenty years, my father ______ in a school library. But he’ll leave the job next month.", "options": ["worked", "has worked", "is working", "works"], "answer": 1, "answerLabel": "B", "source": "109 會考｜單題｜第 7 題", "explanation": "For the past twenty years（過去二十年來）一直到現在，用現在完成式 has worked。", "explanationSource": "own", "section": "單題"}, {"id": 8, "question": "第 8 題　It’s great that we can buy train tickets over the phone without going out. It ______ us a lot of time.", "options": ["lends", "prepares", "saves", "takes"], "answer": 2, "answerLabel": "C", "source": "109 會考｜單題｜第 8 題", "explanation": "不用出門就能買票，「節省」很多時間：save sb. time。", "explanationSource": "own", "section": "單題"}, {"id": 9, "question": "第 9 題　Mozart ______ his first music when he was only six years old.", "options": ["is writing", "has written", "will write", "wrote"], "answer": 3, "answerLabel": "D", "source": "109 會考｜單題｜第 9 題", "explanation": "when he was only six years old 是過去時間，用過去式 wrote。", "explanationSource": "own", "section": "單題"}, {"id": 10, "question": "第 10 題　Jill: Have you decided ______ you will celebrate your 30th birthday?\nSue: Yeah, I’m going to have a big barbecue party.", "options": ["how", "where", "what", "when"], "answer": 0, "answerLabel": "A", "source": "109 會考｜單題｜第 10 題", "explanation": "Sue 回答要辦烤肉派對，說的是慶祝的「方式」：how。", "explanationSource": "own", "section": "單題"}, {"id": 11, "question": "第 11 題　Alison doesn’t like ______ what to do. She only does things she wants to do.", "options": ["told", "to tell", "be told", "to be told"], "answer": 3, "answerLabel": "D", "source": "109 會考｜單題｜第 11 題", "explanation": "Alison 不喜歡「被告知」要做什麼：like + to be + p.p.（被動）。", "explanationSource": "own", "section": "單題"}, {"id": 12, "question": "第 12 題　Josh has planned to make a trip to New York and ______ some of his friends there.", "options": ["visit", "visits", "visiting", "visited"], "answer": 0, "answerLabel": "A", "  fat easily and often have neck or back problems. It’s easier for them to have heart problems too. __37__. Studies find that these people get angry more often, feel less happy with their lives, and do less well at work.\nNow, does that good school or that good job still sound good to you?\n（interview 面試　commute 通勤）\n\n▶ 第 35 題　請選出 __35__ 的最佳答案", "options": ["what else you can do", "how you can enjoy it more", "how it will change your life", "what is the best way of commute for you"], "answer": 2, "answerLabel": "C", "source": "109 會考｜克漏字｜第 35 題", "explanation": "後文說明長途通勤對睡眠、家人時間、健康的影響，所以要先知道「它會如何改變你的生活」。", "explanationSource": "own", "section": "克漏字"}, {"id": 36, "question": "【克漏字 第 35–37 題】\nAfter a lot of tests and interviews, you finally got into a good school or got a good job. But there’s a problem: it’s a long way from home. “Well, I can take the bus or drive,” you might think. But before you decide whether it’s OK to have such a long commute, it’s best to know __35__.\nHaving a long commute means you’ll get fewer hours of sleep, and that’ll make you feel tired easily. You’ll also have less time for friends and family, for exercise, or for a nice meal.\nA long commute not only eats up your time but also __36__. Studies show that people who have a long commute get fat easily and often have neck or back problems. It’s easier for them to have heart problems too. __37__. Studies find that these people get angry more often, feel less happy with their lives, and do less well at work.\nNow, does that good school or that good job still sound good to you?\n（interview 面試　commute 通勤）\n\n▶ 第 36 題　請選出 __36__ 的最佳答案", "options": ["costs you money", "hurts your health", "makes traffic terrible", "kills the planet slowly"], "answer": 1, "answerLabel": "B", "source": "109 會考｜克漏字｜第 36 題", "explanation": "後句舉例變胖、頸背問題、心臟問題，都是「傷害健康」。", "explanationSource": "own", "section": "克漏字"}, {"id": 37, "question": "【克漏字 第 35–37 題】\nAfter a lot of tests and interviews, you finally got into a h paid does not worry the cities that are in the race to get the 2022 Winter Olympics. __41__, they are happy that Munich said no to the Olympics—their chances of getting the Games have become higher.\n（host 舉辦　Olympics 奧運　visitor 遊客）\n\n▶ 第 38 題　請選出 __38__ 的最佳答案", "options": ["this is surely a surprise", "this sounds like a good idea", "this is perhaps a smart answer", "this is old news they have heard"], "answer": 0, "answerLabel": "A", "source": "109 會考｜克漏字｜第 38 題", "explanation": "奧運通常帶來工作、遊客和收入，大家都在搶，慕尼黑卻說不要，對其他城市來說「一定很意外」。", "explanationSource": "own", "section": "克漏字"}, {"id": 39, "question": "【克漏字 第 38–41 題】\nNOlympics in Munich　　11/11/2013\nPeople in the city of Munich have spoken their mind: they do not want to host the Winter Olympics in 2022. To the cities that fight for this chance, __38__. The Olympics usually do a lot of good to the host city. The Games bring in jobs, visitors, and, most important of all, money. So why did people in Munich say no?\nThe Olympics __39__ for people in Munich. For them, the world’s biggest sports festival could invite serious trouble. There would be a lot of building work before the Games, and during the Games, too much traffic and too many visitors. Life would become terrible and nature would be hurt. And __40__: Munich hosted the 1972 Summer Olympics, and its neighbor, the mountain town Garmisch-Partenkirchen, hosted the 1936 Winter Olympics.\nStill, the heavy price Munich paid does not worry the cities that are in the race to get the 2022 Winter Olympics. __41__, they are happy that Munich said no to the Olympics—their chances of getting the Games have become higher.\n（host 舉辦　Olympics 奧運　visitor 遊客）\n\n▶ 第 39 題　請選出 __39__ 的最佳答案", "options": ["had given hopes", "are a different story", "bring a bright future", "have been a great plan"], "answer": 1, "answerLabel": "B", "source": "109 會考｜克漏字｜第 39 題", "explanation": "後句說奧運對慕尼黑人反而可能帶來大麻煩，和一般看法相反：「是另一回事」。", "explanationSource": "own", "section": "克漏字"}, {"id": 40, "questio
