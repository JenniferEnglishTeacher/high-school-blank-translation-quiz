<script>window.QUIZ_CONFIG={"title": "國中會考文法歷屆試題｜省略句（助動詞／be動詞）", "mode": "mcq", "questions": [{"id": 1, "question": "Jane's parents are always happy to see their grandchildren, but mine ______ less so when I visit them with my kids.", "options": ["is", "are", "do", "does"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜省略句 be 動詞（mine = my parents → are）", "explanation": "【句型】S1 + be + adj., but S2 + be (+ less so). 省略句沿用前句的 be 動詞。\n【分析】前句用 Jane's parents are happy；後句 mine = my parents（複數），省略 happy，用 are（less so = less happy）。\n【其他選項】(A) is 用於單數主詞；(C)(D) do/does 代替一般動詞，但前句是 be 動詞 are。\n【例句】Tom's sisters are very tall, but mine aren't.", "explanationSource": "source"}, {"id": 2, "question": "Your dog is very friendly, but ours ______. It always barks at strangers.", "options": ["doesn't", "isn't", "aren't", "don't"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 1 題）", "explanation": "ours = our dog（單數），前句 be 動詞，用 isn't。", "explanationSource": "supplemental"}, {"id": 3, "question": "Amy's shoes are new, but mine ______. I've worn them for three years.", "options": ["don't", "isn't", "doesn't", "aren't"], "answer": 3, "answerLabel": "D", "source": "類似題 2（對應第 1 題）", "explanation": "mine = my shoes（複數），沿用 be 動詞，用 aren't。", "explanationSource": "supplemental"}, {"id": 4, "question": "My parents were angry about my grades, but Jack's ______. They just told him to study harder.", "options": ["weren't", "didn't", "wasn't", "don't"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 1 題）", "explanation": "Jack's = Jack's parents（複數），前句 were，用 weren't。", "explanationSource": "supplemental"}, {"id": 5, "question": "Our teacher Ms. Wu seldom laughs, but when she ______, everyone in the same building can hear her.", "options": ["can", "does", "has", "will"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜省略句 does 代替一般動詞 laughs", "explanation": "【句型】S + 一般動詞…, but when S + does（省略原動詞）。\n【分析】前句 laughs 為一般動詞現在式第三人稱單數；when she does = when she laughs，用 does 代替。\n【其他選項】(A) can 表能力，與前句不對應；(C) has 用於完成式；(D) will 不用在時間副詞子句中表未來，且與前句時態不合。\n【例句】My brother rarely cooks, but when he does, the food is great.", "explanationSource": "source"}, {"id": 6, "question": "Kevin doesn't often sing, but when he ______, everyone stops to listen.", "options": ["is", "does", "has", "do"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 5 題）", "explanation": "when he does = when he sings，主詞第三人稱單數用 does。", "explanationSource": "supplemental"}, {"id": 7, "question": "My parents seldom go to the movies, but when they ______, they always buy popcorn.", "options": ["are", "does", "do", "have"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 5 題）", "explanation": "when they do = when they go，主詞複數用 do。", "explanationSource": "supplemental"}, {"id": 8, "question": "Grandpa hardly ever got angry, but when he ______, all of us were scared.", "options": ["does", "was", "had", "did"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 5 題）", "explanation": "前句 got 為過去式，用 did 代替。", "explanationSource": "supplemental"}, {"id": 9, "question": "Lora likes to eat bananas that are already a little brown on the outside, and so ______ I.", "options": ["am", "do", "have", "will"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜附和句 and so + 助動詞 + 主詞（so do I）", "explanation": "【句型】…, and so + 助動詞/be 動詞 + 主詞 表「…也是」。\n【分析】前句動詞 likes 為一般動詞現在式，主詞 I 用 do：and so do I（= and I do, too）。注意 that are… 是形容詞子句，不是主要動詞。\n【其他選項】(A) am 對應 be 動詞；(C) have 對應完成式；(D) will 對應未來式，皆不合 likes。\n【例句】Ben plays the guitar, and so do I.", "explanationSource": "source"}, {"id": 10, "question": "Mary is interested in Japanese culture, and so ______ her brother.", "options": ["does", "is", "has", "do"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 9 題）", "explanation": "前句 be 動詞 is，用 so is her brother。", "explanationSource": "supplemental"}, {"id": 11, "question": "Peter went to the concert last night, and so ______ his friends.", "options": ["did", "were", "do", "have"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 9 題）", "explanation": "前句 went 為過去式一般動詞，用 so did。", "explanationSource": "supplemental"}, {"id": 12, "question": "I have finished my homework, and so ______ Jenny.", "options": ["does", "did", "is", "has"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 9 題）", "explanation": "前句 have finished 為現在完成式，主詞 Jenny 單數，用 so has。", "explanationSource": "supplemental"}, {"id": 13, "question": "Dad: Have you brushed your teeth yet?\nAnn: No, but I ______ before I go to bed.", "options": ["haven't", "have", "won't", "will"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜簡答／省略句 will 表未來", "explanation": "【句型】No, but I will (+ 原V) 表「還沒，但等一下會」。\n【分析】現在還沒刷牙（No），但 before I go to bed「睡前」會刷，用 will 表未來，省略 brush my teeth。\n【其他選項】(A) haven't 與 but 轉折矛盾；(B) have 與 No 矛盾；(C) won't 與「睡前」的語意矛盾。\n【例句】I haven't called Grandma yet, but I will tonight.", "explanationSource": "source"}, {"id": 14, "question": "Mom: Have you cleaned your room?\nTim: Not yet, but I ______ after lunch.", "options": ["will", "have", "did", "won't"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 13 題）", "explanation": "還沒做但之後會做，用 will。", "explanationSource": "supplemental"}, {"id": 15, "question": "Teacher: Did you hand in your report?\nAmy: No, I didn't. But I ______ tomorrow, I promise.", "options": ["do", "will", "did", "have"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 13 題）", "explanation": "tomorrow 表未來，用 will。", "explanationSource": "supplemental"}, {"id": 16, "question": "Lily: Are you going to the party tonight?\nSam: No, I ______. I have to study for the test.", "options": ["won't go to", "don't", "am not", "haven't"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 13 題）", "explanation": "問句 Are you going to…，簡答用 am not。", "explanationSource": "supplemental"}, {"id": 17, "question": "David: Have you seen John's sister?\nKevin: Yes, I ______. She's the most beautiful girl I've ever seen.", "options": ["have", "had", "did", "saw"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜簡答對應助動詞 Have you…? – Yes, I have", "explanation": "【句型】Have you + p.p.…? → Yes, I have. / No, I haven't.\n【分析】問句用現在完成式 Have you seen，簡答用同一助動詞 have。\n【其他選項】(B) had 為過去完成式；(C) did 對應 Did you…?；(D) saw 是一般動詞，簡答要用助動詞。\n【例句】Has Linda finished her homework? — Yes, she has.", "explanationSource": "source"}, {"id": 18, "question": "Mia: Has your brother ever been to Japan?\nLeo: Yes, he ______. He went there last summer.", "options": ["did", "is", "has", "was"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 17 題）", "explanation": "Has…? 用 has 簡答。", "explanationSource": "supplemental"}, {"id": 19, "question": "Tina: Did you watch the baseball game last night?\nJoe: Yes, I ______. It was exciting!", "options": ["did", "have", "watched", "was"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 17 題）", "explanation": "Did you…? 用 did 簡答。", "explanationSource": "supplemental"}, {"id": 20, "question": "Ken: Have you and Sue finished the science project?\nAnn: No, we ______. We need two more days.", "options": ["didn't", "don't", "aren't", "haven't"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 17 題）", "explanation": "Have you…? 否定簡答用 haven't。", "explanationSource": "supplemental"}, {"id": 21, "question": "Linda: Do you have to get up early in the morning?\nPeter: Yes, I ______. I can't be late for school.", "options": ["do", "can", "have", "am"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜簡答 Do you have to…? – Yes, I do", "explanation": "【句型】Do you have to + 原V? → Yes, I do. / No, I don't (have to).\n【分析】have to 視為一般動詞，問句助動詞為 Do，簡答用 do。\n【其他選項】(B) can 不對應 Do；(C) have 不能單獨當簡答助動詞（have to 不是 Have you…? 的完成式）；(D) am 是 be 動詞。\n【例句】Does she have to wear a uniform? — Yes, she does.", "explanationSource": "source"}, {"id": 22, "question": "Ben: Does your sister have to take the bus to school?\nAmy: No, she ______. Our dad drives her.", "options": ["doesn't", "hasn't", "isn't", "don't"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 21 題）", "explanation": "Does…have to? 否定簡答用 doesn't。", "explanationSource": "supplemental"}, {"id": 23, "question": "Mark: Did you have to work last weekend?\nNick: Yes, I ______. I was so tired.", "options": ["had", "did", "was", "have"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 21 題）", "explanation": "Did you have to…? 簡答用 did。", "explanationSource": "supplemental"}, {"id": 24, "question": "Student: Must we finish the worksheet today?\nTeacher: No, you ______. You can finish it tomorrow.", "options": ["mustn't", "can't", "don't have to", "aren't"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 21 題）", "explanation": "Must…? 否定回答「不必」用 don't have to，mustn't 是「禁止」。", "explanationSource": "supplemental"}, {"id": 25, "question": "Jane: Did you get up early this morning?\nTina: No, I didn't, but my brother ______. He gets up early every day.", "options": ["does", "is", "did", "was"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜省略句 did 代替過去式一般動詞", "explanation": "【句型】S1 + didn't, but S2 + did. 省略句依時態用助動詞。\n【分析】this morning 已過去，問句 Did you get up early…?；my brother did = my brother got up early（過去式），用 did。\n【其他選項】(A) does 為現在式，雖然後句說 every day，但這裡講的是今天早上；(B)(D) be 動詞不對應一般動詞 get up。\n【例句】I didn't finish the cake, but my sister did.", "explanationSource": "source"}, {"id": 26, "question": "Carl didn't bring an umbrella, but his sister ______. She always checks the weather.", "options": ["does", "did", "was", "has"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 25 題）", "explanation": "前句 didn't bring 為過去，後句用 did。", "explanationSource": "supplemental"}, {"id": 27, "question": "Mom: Did you feed the cat this morning?\nRay: No, I didn't, but Dad ______.", "options": ["did", "does", "was", "has"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 25 題）", "explanation": "this morning 過去，用 did 代替 fed the cat。", "explanationSource": "supplemental"}, {"id": 28, "question": "Most students didn't understand the joke, but Jason ______. He laughed out loud.", "options": ["does", "doesn't", "didn't", "did"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 25 題）", "explanation": "轉折 but 表肯定，過去式用 did。", "explanationSource": "supplemental"}, {"id": 29, "question": "Betty goes jogging every day in the park, and Allen ______, too.", "options": ["is", "does", "has", "was"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜附和句 S + does, too", "explanation": "【句型】S1 + 一般動詞(現在式), and S2 + does/do, too. 表「…也是」。\n【分析】前句 goes 為一般動詞現在式，主詞 Allen 單數，用 does 代替 goes jogging。\n【其他選項】(A)(D) is/was 為 be 動詞，不對應 goes；(C) has 對應完成式或 have 動詞。\n【例句】My mom drinks coffee every morning, and my dad does, too.", "explanationSource": "source"}, {"id": 30, "question": "Frank likes spicy food, and his parents ______, too.", "options": ["does", "are", "do", "is"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 29 題）", "explanation": "前句一般動詞現在式，主詞 his parents 複數用 do。", "explanationSource": "supplemental"}, {"id": 31, "question": "Helen was late for school yesterday, and Kevin ______, too.", "options": ["was", "did", "is", "does"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 29 題）", "explanation": "前句 be 動詞過去式 was，Kevin 單數用 was。", "explanationSource": "supplemental"}, {"id": 32, "question": "I don't like horror movies, and my sister ______, either.", "options": ["does", "isn't", "didn't", "doesn't"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 29 題）", "explanation": "否定附和用 either，現在式單數用 doesn't。", "explanationSource": "supplemental"}, {"id": 33, "question": "Frank read a comic book yesterday, but his brother ______.", "options": ["does", "doesn't", "did", "didn't"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜省略句 but S + didn't（read 過去式）", "explanation": "【句型】S1 + V(過去式), but S2 + didn't. 表「…但另一人沒有」。\n【分析】yesterday 表過去，read 在此是過去式（主詞 Frank 單數卻沒加 s）；but 表轉折，後句為否定，用 didn't。\n【其他選項】(A)(B) 現在式不合 yesterday；(C) did 為肯定，與 but 的轉折不合。\n【例句】Lisa cut her hair last week, but her sister didn't.", "explanationSource": "source"}, {"id": 34, "question": "Tom put his phone in his bag, but Ryan ______. He left it on the desk.", "options": ["doesn't", "did", "didn't", "don't"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 33 題）", "explanation": "put 主詞單數沒加 s → 過去式；but 轉折用 didn't。", "explanationSource": "supplemental"}, {"id": 35, "question": "Jenny hurt her leg in the game last week, but the other players ______.", "options": ["didn't", "don't", "weren't", "doesn't"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 33 題）", "explanation": "last week 過去式，複數主詞否定用 didn't。", "explanationSource": "supplemental"}, {"id": 36, "question": "My friends didn't go to the beach on Sunday, but I ______.", "options": ["don't", "went", "was", "did"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 33 題）", "explanation": "前否定 didn't go，but 轉折肯定用 did。", "explanationSource": "supplemental"}, {"id": 37, "question": "No one thought James would appear at Katie's party. So when he ______, everyone was surprised and could not believe their eyes.", "options": ["would", "was", "had", "did"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜省略句 did 代替 appeared", "explanation": "【句型】when + S + did（省略一般動詞過去式）。\n【分析】when he did = when he appeared；事情發生在過去（everyone was surprised），一般動詞過去式用 did 代替。\n【其他選項】(A) would 表過去的未來，when 子句中不用；(B) was 是 be 動詞，不對應 appear；(C) had 為過去完成式，不合時間順序。\n【例句】Nobody expected Ann to win, so when she did, we all cheered.", "explanationSource": "source"}, {"id": 38, "question": "We didn't think it would snow on the mountain. So when it ______, we were all excited.", "options": ["would", "did", "was", "had"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 37 題）", "explanation": "when it did = when it snowed，過去式用 did。", "explanationSource": "supplemental"}, {"id": 39, "question": "No one believed Leo could pass the test. But he ______, and he got 90 points!", "options": ["did", "could", "was", "has"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 37 題）", "explanation": "過去事實 he did = he passed，用 did。", "explanationSource": "supplemental"}, {"id": 40, "question": "Everyone thought Grace would call her mom first. But she ______. She called her best friend.", "options": ["wouldn't", "doesn't", "wasn't", "didn't"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 37 題）", "explanation": "實際上沒打給媽媽，過去式否定用 didn't。", "explanationSource": "supplemental"}, {"id": 41, "question": "Tommy uses chopsticks well, but his younger brothers ______, so they usually eat with spoons.", "options": ["don't", "doesn't", "aren't", "isn't"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜省略句 but S(複數) + don't", "explanation": "【句型】S1 + 一般動詞(現在式), but S2 + don't/doesn't.\n【分析】前句 uses 為一般動詞現在式；後句主詞 his younger brothers 為複數，省略 use chopsticks well，用 don't。\n【其他選項】(B) doesn't 用於單數主詞；(C)(D) be 動詞不對應 uses。\n【例句】Emma speaks Japanese, but her parents don't.", "explanationSource": "source"}, {"id": 42, "question": "My dad drinks coffee every day, but my mom ______. She only drinks tea.", "options": ["don't", "isn't", "doesn't", "didn't"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 41 題）", "explanation": "前句一般動詞現在式，主詞 my mom 單數用 doesn't。", "explanationSource": "supplemental"}, {"id": 43, "question": "Lucy is good at math, but her classmates ______.", "options": ["aren't", "don't", "isn't", "doesn't"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 41 題）", "explanation": "前句 be 動詞，複數主詞用 aren't。", "explanationSource": "supplemental"}, {"id": 44, "question": "I know how to swim, but my little sisters ______ yet.", "options": ["doesn't", "aren't", "didn't", "don't"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 41 題）", "explanation": "前句一般動詞 know，主詞複數用 don't。", "explanationSource": "supplemental"}, {"id": 45, "question": "Jane always does well on English tests, but her sisters ______.", "options": ["doesn't", "aren't", "don't", "didn't"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜省略句 but S(複數) + don't", "explanation": "【句型】S1 + 一般動詞(現在式), but S2 + don't/doesn't.\n【分析】前句 does well 為一般動詞現在式（always 表習慣）；後句主詞 her sisters 複數，用 don't（= don't do well）。\n【其他選項】(A) doesn't 用於單數；(B) aren't 為 be 動詞，不對應 does well；(D) didn't 為過去式，不合 always 的現在習慣。\n【例句】Leo always gets up early, but his roommates don't.", "explanationSource": "source"}, {"id": 46, "question": "Kevin often helps his mom with housework, but his brother ______.", "options": ["doesn't", "don't", "isn't", "didn't"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 45 題）", "explanation": "現在式習慣，主詞單數用 doesn't。", "explanationSource": "supplemental"}, {"id": 47, "question": "These students always bring their own cups, but some teachers ______.", "options": ["doesn't", "aren't", "don't", "didn't"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 45 題）", "explanation": "主詞 some teachers 複數，現在式用 don't。", "explanationSource": "supplemental"}, {"id": 48, "question": "My cousins are interested in history, but I ______.", "options": ["don't", "am not", "isn't", "doesn't"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 45 題）", "explanation": "前句 be 動詞 are，主詞 I 用 am not。", "explanationSource": "supplemental"}, {"id": 49, "question": "Mom: Peter, be sure to finish your school report before you go to bed.\nPeter: OK, Mom, I ______.", "options": ["am", "do", "have", "will"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜簡答 I will 承諾未來", "explanation": "【句型】回應請求或提醒時用 I will.（= I will finish it）表承諾。\n【分析】媽媽提醒「睡前務必寫完報告」，事情尚未完成，Peter 答應之後會做，用 will。\n【其他選項】(A) am 為 be 動詞，不對應 finish；(B) do 表現在習慣；(C) have 表已經完成，與「睡前要完成」矛盾。\n【例句】Teacher: Don't forget to bring your textbook tomorrow. — Student: I won't.", "explanationSource": "source"}, {"id": 50, "question": "Dad: Remember to lock the door when you leave.\nAmy: Sure, I ______.", "options": ["am", "will", "do", "did"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 49 題）", "explanation": "答應未來會做，用 I will。", "explanationSource": "supplemental"}, {"id": 51, "question": "Teacher: Don't forget to return the library books on Friday.\nBen: Don't worry. I ______.", "options": ["won't", "don't", "will", "didn't"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 49 題）", "explanation": "Don't forget… 的回應為 I won't（forget）。", "explanationSource": "supplemental"}, {"id": 52, "question": "Mom: Please call me when you get to Grandma's house.\nJoe: OK, I ______.", "options": ["am", "have", "did", "will"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 49 題）", "explanation": "承諾抵達後會打電話，用 I will。", "explanationSource": "supplemental"}, {"id": 53, "question": "Melody has a great interest in planting flowers, but her sister ______. She can't even stay in the garden for one minute.", "options": ["can't", "doesn't", "isn't", "won't"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜省略句 doesn't 代替 has（一般動詞）", "explanation": "【句型】S1 + has (一般動詞), but S2 + doesn't.\n【分析】前句 has a great interest 的 has 是一般動詞「有」（不是完成式助動詞），後句主詞 her sister 單數，用 doesn't（= doesn't have an interest）。\n【其他選項】(A) can't 不對應 has；(C) isn't 為 be 動詞；(D) won't 為未來式。\n【例句】Tom has a pet dog, but his cousin doesn't.", "explanationSource": "source"}, {"id": 54, "question": "Ann has a lot of free time on weekends, but her parents ______. They are always busy.", "options": ["haven't", "aren't", "don't", "doesn't"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 53 題）", "explanation": "has 為一般動詞，主詞複數用 don't。", "explanationSource": "supplemental"}, {"id": 55, "question": "My brother has a smartphone, but I ______. My parents think I'm too young.", "options": ["don't", "haven't", "am not", "doesn't"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 53 題）", "explanation": "have 為一般動詞，主詞 I 用 don't。", "explanationSource": "supplemental"}, {"id": 56, "question": "Kevin has finished his homework, but his sister ______. She's still working on it.", "options": ["doesn't", "hasn't", "isn't", "didn't"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 53 題）", "explanation": "has finished 為現在完成式，has 是助動詞，用 hasn't。", "explanationSource": "supplemental"}, {"id": 57, "question": "Ken's brothers like to watch tennis, but Ken ______. He is crazy about baseball.", "options": ["is", "isn't", "does", "doesn't"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜省略句 一般動詞否定 doesn't", "explanation": "【句型】S1 + V, but S2 + don't/doesn't. 後句省略相同的動詞部分，只留助動詞。\n【分析】前句 like 是一般動詞；後句主詞 Ken 為第三人稱單數，且 He is crazy about baseball 表示他不喜歡看網球 → doesn't (like to watch tennis)。\n【其他選項】(A)(B) is/isn't 是 be 動詞，無法代替一般動詞 like；(C) does 表「他也喜歡」，與後句語意矛盾。\n【例句】My parents drink coffee, but I don't.", "explanationSource": "source"}, {"id": 58, "question": "My parents enjoy hiking, but my little sister ______. She thinks it's too tiring.", "options": ["does", "doesn't", "is", "isn't"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 57 題）", "explanation": "前句 enjoy 為一般動詞，主詞 my little sister 單數且語意否定，用 doesn't。", "explanationSource": "supplemental"}, {"id": 59, "question": "Tina didn't finish her homework last night, but her brother ______. He finished it before dinner.", "options": ["did", "didn't", "was", "does"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 57 題）", "explanation": "前句是過去式一般動詞，後句語意肯定（他完成了），用 did 代替 finished his homework。", "explanationSource": "supplemental"}, {"id": 60, "question": "Most of my classmates are good at math, but Leo ______. He always needs help.", "options": ["does", "doesn't", "is", "isn't"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 57 題）", "explanation": "前句用 be 動詞 are good at，後句主詞 Leo 單數、語意否定，用 isn't。", "explanationSource": "supplemental"}, {"id": 61, "question": "My sister does not like the jacket, and I don't, ______.", "options": ["either", "so", "too", "yet"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜否定句的「也」：either", "explanation": "【句型】否定句 + and S + don't/isn't..., either. 表「…也不」。\n【分析】前後兩句都是否定（does not like / I don't），句尾表「也不」要用 either。\n【其他選項】(B) so 用於肯定倒裝 and so do I；(C) too 只用於肯定句；(D) yet 表「尚未／然而」，語意不合。\n【例句】Tom can't speak Japanese, and I can't, either.", "explanationSource": "source"}, {"id": 62, "question": "Ben can't swim, and his sister can't, ______.", "options": ["too", "either", "so", "neither"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 61 題）", "explanation": "兩句皆為否定，句尾「也不」用 either。", "explanationSource": "supplemental"}, {"id": 63, "question": "I love spicy food, and my dad does, ______.", "options": ["either", "neither", "too", "not"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 61 題）", "explanation": "兩句皆為肯定，句尾「也」用 too。", "explanationSource": "supplemental"}, {"id": 64, "question": "Amy isn't afraid of snakes, and ______ is her brother.", "options": ["so", "either", "too", "neither"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 61 題）", "explanation": "否定的倒裝句 neither + be/助動詞 + S 表「…也不」。", "explanationSource": "supplemental"}, {"id": 65, "question": "Many of my classmates have had the experience of taking an airplane, but I ______.", "options": ["don't", "wasn't", "won't", "haven't"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜省略句 現在完成式否定 haven't", "explanation": "【句型】S1 + have/has + p.p., but S2 + haven't/hasn't. 後句省略 p.p. 以後的部分。\n【分析】前句 have had the experience 是現在完成式，後句主詞 I，語意否定 → haven't (had the experience)。\n【其他選項】(A) don't 是現在簡單式；(B) wasn't 是過去式 be 動詞；(C) won't 是未來式，皆與前句時態不對應。\n【例句】Lisa has finished her report, but I haven't.", "explanationSource": "source"}, {"id": 66, "question": "Most of my friends have seen the new movie, but I ______. I'll see it this weekend.", "options": ["don't", "didn't", "haven't", "won't"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 65 題）", "explanation": "前句 have seen 為現在完成式，後句否定用 haven't。", "explanationSource": "supplemental"}, {"id": 67, "question": "My brother has never been to Japan, but I ______. I went there last summer.", "options": ["have", "haven't", "do", "am"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 65 題）", "explanation": "前句 has been 為現在完成式，後句語意肯定（我去過），用 have。", "explanationSource": "supplemental"}, {"id": 68, "question": "Jenny had lunch at school yesterday, but Kevin ______. He went home to eat.", "options": ["doesn't", "didn't", "hasn't", "wasn't"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 65 題）", "explanation": "前句 had 為過去式一般動詞，後句否定用 didn't。", "explanationSource": "supplemental"}, {"id": 69, "question": "Alice: Have you ever been to a baseball game?\nJamie: No, never. ______\nAlice: Sure. Baseball is my favorite sport.", "options": ["Do you?", "Have you?", "Don't you?", "Haven't you?"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜反問省略句 Have you?", "explanation": "【句型】反問對方「你呢？」：助動詞/be 動詞 + 主詞？（時態跟前句一致）\n【分析】Alice 用 Have you ever been 現在完成式發問，Jamie 回答後反問「你呢？去過嗎？」→ Have you (ever been to a baseball game)?\n【其他選項】(A) Do you? 是現在簡單式，與 have been 不對應；(C)(D) 否定問句帶有「難道你不…嗎」的驚訝語氣，不合單純反問的語意。\n【例句】A: Have you finished your homework? B: Not yet. Have you?", "explanationSource": "source"}, {"id": 70, "question": "Eric: I'm so excited about the school trip tomorrow. ______\nGina: Yes, I am! I've packed my bag already.", "options": ["Do you?", "Are you?", "Did you?", "Have you?"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 69 題）", "explanation": "前句用 be 動詞 I'm excited，反問用 Are you?，與 Gina 的 Yes, I am 對應。", "explanationSource": "supplemental"}, {"id": 71, "question": "Mia: I didn't see the fireworks last night. ______\nRay: Yes, I did. They were beautiful.", "options": ["Were you?", "Do you?", "Have you?", "Did you?"], "answer": 3, "answerLabel": "D", "source": "類似題 2（對應第 69 題）", "explanation": "前句為過去式一般動詞 didn't see，反問用 Did you?。", "explanationSource": "supplemental"}, {"id": 72, "question": "Nick: I've never tried stinky tofu. ______\nAnn: Yes, many times. I love it!", "options": ["Do you?", "Did you?", "Have you?", "Are you?"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 69 題）", "explanation": "前句 I've never tried 為現在完成式，反問用 Have you?。", "explanationSource": "supplemental"}, {"id": 73, "question": "Cherry ______ very fast, and her brother, Paul, does, too.", "options": ["can swim", "swims", "is swimming", "swim"], "answer": 1, "answerLabel": "B", "source": "講義錯題｜…, and S + does, too（一般動詞現在式的省略）", "explanation": "【句型】前句用一般動詞現在式，後句以 do/does 代替，S + does, too。\n【分析】後半句用 does，表示前句是一般動詞現在簡單式；主詞 Cherry 是第三人稱單數，用 swims。\n【其他選項】(A) can swim 後面應說 Paul can, too；(C) is swimming 後面應說 Paul is, too；(D) swim 與第三人稱單數主詞不一致。\n【例句】Lisa likes cats, and her sister does, too.\n備註：講義 p.56", "explanationSource": "source"}, {"id": 74, "question": "Kevin ______ to school by bike, and his best friend does, too.", "options": ["is going", "goes", "can go", "go"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 73 題）", "explanation": "後句用 does 代替一般動詞，前句主詞第三人稱單數用 goes。", "explanationSource": "supplemental"}, {"id": 75, "question": "Jenny is good at singing, and her cousin ______, too.", "options": ["does", "do", "is", "can"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 73 題）", "explanation": "前句用 be 動詞 is，後句以 is 代替。", "explanationSource": "supplemental"}, {"id": 76, "question": "My parents didn't watch TV last night, and I ______, either.", "options": ["didn't", "don't", "wasn't", "haven't"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 73 題）", "explanation": "前句是過去式一般動詞否定，後句用 didn't 代替，either 表「也不」。", "explanationSource": "supplemental"}, {"id": 77, "question": "Rick: Ted bought a pie for Cindy and she ate it. I thought she would never eat things like that.\nElle: She ______. She was just being polite. She didn't want to hurt Ted's feelings.", "options": ["doesn't", "isn't", "didn't", "wasn't"], "answer": 0, "answerLabel": "A", "source": "講義錯題｜現在簡單式表習慣＋助動詞 doesn't 代替一般動詞", "explanation": "【句型】省略句：用助動詞 do/does/did 代替前面提過的一般動詞；表習慣用現在簡單式。\n【分析】Elle 意思是「她（平常）不吃那種東西」= She doesn't (eat things like that)，是一向的習慣，用現在式；eat 是一般動詞，用 doesn't。\n【其他選項】(B)(D) isn't／wasn't 是 be 動詞，不能代替 eat；(C) didn't 表「她當時沒吃」，與 she ate it 矛盾。\n【例句】Does Tom drink coffee?—No, he doesn't. He only drinks tea.\n備註：講義 p.59", "explanationSource": "source"}, {"id": 78, "question": "Ann: Your dad cooked dinner today! I thought he never cooks.\nBob: He ______. Mom is sick, so he had to do it.", "options": ["isn't", "didn't", "doesn't", "wasn't"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 77 題）", "explanation": "「他平常不煮飯」是習慣，用一般動詞現在式否定 doesn't 代替 cook。", "explanationSource": "supplemental"}, {"id": 79, "question": "Lily: Did Sam go to the concert yesterday?\nMike: No, he ______. He had a bad cold.", "options": ["didn't", "doesn't", "wasn't", "isn't"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 77 題）", "explanation": "問句是 Did，答句用 didn't 代替 go。", "explanationSource": "supplemental"}, {"id": 80, "question": "Paul: Is your sister afraid of dogs?\nJoy: Yes, she ______. She always runs away from them.", "options": ["does", "is", "did", "was"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 77 題）", "explanation": "be afraid of 用 be 動詞，簡答用 is。", "explanationSource": "supplemental"}, {"id": 81, "question": "Wayne: I'd be surprised if you got apples from that tree.\nNita: ______ In fact, it's a peach tree.", "options": ["So would I.", "Neither would I.", "So had I.", "Neither had I."], "answer": 0, "answerLabel": "A", "source": "講義錯題｜附和句 So would I（肯定句附和）", "explanation": "【句型】肯定附和：So + 助動詞/be + 主詞；否定附和：Neither + 助動詞/be + 主詞（助動詞要與原句一致）\n【分析】I'd be surprised = I would be surprised，是肯定句，助動詞 would → So would I.（我也會很驚訝）；後句 it's a peach tree 支持「蘋果樹長不出蘋果」。\n【其他選項】(B) Neither 附和否定句，原句沒有 not；(C)(D) I'd 在 be 前是 would，不是 had。\n【例句】A: I'd like some tea. B: So would I.\n備註：講義 p.316", "explanationSource": "source"}, {"id": 82, "question": "Ben: I'd love to visit Japan someday.\nIris: ______ I've always wanted to see Mt. Fuji.", "options": ["Neither would I.", "So had I.", "So would I.", "So did I."], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 81 題）", "explanation": "I'd love = I would love，肯定句附和用 So would I。", "explanationSource": "supplemental"}, {"id": 83, "question": "Kevin: I can't swim very well.\nRita: ______ Let's take lessons together.", "options": ["Neither can I.", "So can I.", "Neither do I.", "So am I."], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 81 題）", "explanation": "原句否定且助動詞為 can，用 Neither can I。", "explanationSource": "supplemental"}, {"id": 84, "question": "Tina has finished her report, and ______.", "options": ["so did Leo", "so has Leo", "Leo hasn't, either", "neither has Leo"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 81 題）", "explanation": "肯定句、助動詞 has，附和用 so has Leo。", "explanationSource": "supplemental"}, {"id": 85, "question": "Michael seldom writes letters, and Pete doesn't, ______.", "options": ["either", "too", "neither", "so"], "answer": 0, "answerLabel": "A", "source": "講義錯題｜否定附和 either（seldom 為否定）", "explanation": "【句型】否定附和：主詞 + 否定助動詞, either ＝ neither + 助動詞 + 主詞\n【分析】seldom（很少）有否定意味，且空格前已有 doesn't → 句尾用 either。\n【其他選項】(B) too 用於肯定附和；(C) neither 本身否定，不能接在 doesn't 後（雙重否定）；(D) so 用於肯定且要倒裝放句首。\n【例句】Amy doesn't eat meat, and I don't, either.\n備註：講義 p.316", "explanationSource": "source"}, {"id": 86, "question": "Jack never goes to bed early, and his sister doesn't, ______.", "options": ["too", "either", "neither", "so"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 85 題）", "explanation": "never 為否定，後接 doesn't，句尾用 either。", "explanationSource": "supplemental"}, {"id": 87, "question": "Lily hardly eats vegetables, and ______ her brother.", "options": ["so does", "either does", "neither does", "too does"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 85 題）", "explanation": "hardly 為否定，倒裝附和用 neither does。", "explanationSource": "supplemental"}, {"id": 88, "question": "Mia likes playing basketball, and Ken does, ______.", "options": ["too", "either", "neither", "so"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 85 題）", "explanation": "肯定附和放句尾用 too。", "explanationSource": "supplemental"}]};</script><script src="longteng-b1u5-quiz.js?v=20261106-3"></script><script>document.querySelector("#description").textContent="共 88 題（會考歷屆＋講義錯題 22 題＋類似題 66 題）｜選答後顯示中文解析｜答錯可重做並下載錯題";</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
