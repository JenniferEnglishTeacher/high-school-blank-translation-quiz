<script>window.QUIZ_CONFIG={"title": "國中會考單字片語｜轉折詞 Transition Words", "mode": "mcq", "questions": [{"id": 1, "question": "To stay healthy, eat more vegetables and go to bed early. ______, exercise every day.", "options": ["Comparatively", "In the past", "On the contrary", "Above all"], "answer": 3, "answerLabel": "D", "source": "轉折詞 Transition Words", "explanation": "【答案】(D) Above all\n【用語】above all (adv.phr.)：最重要的是（強調）\n【中譯】為了保持健康，要多吃蔬菜、早點睡覺。最重要的是，要每天運動。", "explanationSource": "supplemental"}, {"id": 2, "question": "Our school has a big library. ______, it has a new swimming pool.", "options": ["On the one hand", "At that time", "Additionally", "Instead"], "answer": 2, "answerLabel": "C", "source": "轉折詞 Transition Words", "explanation": "【答案】(C) Additionally\n【用語】additionally (adv.)：此外（補充）\n【中譯】我們學校有一間大圖書館。此外，它還有一座新的游泳池。", "explanationSource": "supplemental"}, {"id": 3, "question": "Some animals can live without water for a long time. ______, a camel can walk in the desert for days without drinking.", "options": ["Otherwise", "In contrast", "Then", "As an illustration"], "answer": 3, "answerLabel": "D", "source": "轉折詞 Transition Words", "explanation": "【答案】(D) As an illustration\n【用語】as an illustration (adv.phr.)：舉例說明（舉例）（正式用語）\n【中譯】有些動物可以很長一段時間不喝水。舉例來說，駱駝可以在沙漠中走好幾天都不喝水。", "explanationSource": "supplemental"}, {"id": 4, "question": "Mike practiced basketball every day for five years. ______, he became a famous player.", "options": ["Previously", "On this occasion", "Furthermore", "Ultimately"], "answer": 3, "answerLabel": "D", "source": "轉折詞 Transition Words", "explanation": "【答案】(D) Ultimately\n【用語】ultimately (adv.)：最終；最後（總結／結果）\n【中譯】麥克五年來每天練習籃球。最後，他成為一位有名的球員。", "explanationSource": "supplemental"}, {"id": 5, "question": "Mr. Wang said the test would be hard. ______, it was the hardest test of the year.", "options": ["Indeed", "Alternatively", "Instead", "As a result"], "answer": 0, "answerLabel": "A", "source": "轉折詞 Transition Words", "explanation": "【答案】(A) Indeed\n【用語】indeed (adv.)：確實；的確（延伸證實）（正式用語）\n【中譯】王老師說這次考試會很難。的確，那是今年最難的一次考試。", "explanationSource": "supplemental"}, {"id": 6, "question": "Many people think Tim is shy. ______, he is the most talkative boy in our class.", "options": ["In fact", "Similarly", "Of course", "Before"], "answer": 0, "answerLabel": "A", "source": "轉折詞 Transition Words", "explanation": "【答案】(A) In fact\n【用語】in fact (adv.phr.)：事實上（延伸說明）\n【中譯】很多人認為提姆很害羞。事實上，他是我們班上話最多的男生。", "explanationSource": "supplemental"}, {"id": 7, "question": "The concert started with a piano solo, ______ a song by the school choir.", "options": ["such as", "notwithstanding", "followed by", "unlike"], "answer": 2, "answerLabel": "C", "source": "轉折詞 Transition Words", "explanation": "【答案】(C) followed by\n【用語】followed by + N (prep.phr.)：接著是（順序）\n【中譯】音樂會以鋼琴獨奏開場，接著是學校合唱團演唱的一首歌。", "explanationSource": "supplemental"}, {"id": 8, "question": "Amy's English has ______ improved since she moved to London.", "options": ["markedly", "in particular", "for instance", "conversely"], "answer": 0, "answerLabel": "A", "source": "轉折詞 Transition Words", "explanation": "【答案】(A) markedly\n【用語】markedly (adv.)：明顯地（說明程度）（正式用語）\n【中譯】自從艾咪搬到倫敦以後，她的英文明顯進步了。", "explanationSource": "supplemental"}, {"id": 9, "question": "Today I talked about three ways to save water. ______, let's all try to use less water every day.", "options": ["Although", "To conclude", "In the past", "On the other hand"], "answer": 1, "answerLabel": "B", "source": "轉折詞 Transition Words", "explanation": "【答案】(B) To conclude\n【用語】to conclude (adv.phr.)：總結來說；最後（結論）\n【中譯】今天我談了三種節約用水的方法。總結來說，讓我們每天都試著少用一點水。", "explanationSource": "supplemental"}, {"id": 10, "question": "Your new bike is ______ mine. They are both red and very fast.", "options": ["similar to", "differing from", "coupled with", "unlike"], "answer": 0, "answerLabel": "A", "source": "轉折詞 Transition Words", "explanation": "【答案】(A) similar to\n【用語】similar to + N (adj.phr.)：和……相似（比較）\n【中譯】你的新腳踏車和我的很像。它們都是紅色的，而且騎起來都很快。", "explanationSource": "supplemental"}, {"id": 11, "question": "It snowed heavily last night. ______, all the schools were closed today.", "options": ["For instance", "In contrast", "As a result", "In any case"], "answer": 2, "answerLabel": "C", "source": "轉折詞 Transition Words", "explanation": "【答案】(C) As a result\n【用語】as a result (adv.phr.)：結果；因此（結果）\n【中譯】昨晚下了大雪。結果，今天所有的學校都停課了。", "explanationSource": "supplemental"}, {"id": 12, "question": "My brother loves sports, ______ I enjoy reading books.", "options": ["whereas", "otherwise", "despite", "so then"], "answer": 0, "answerLabel": "A", "source": "轉折詞 Transition Words", "explanation": "【答案】(A) whereas\n【用語】whereas + 子句 (conj.)：然而；而（對比）（正式用語）\n【中譯】我哥哥喜歡運動，而我喜歡看書。", "explanationSource": "supplemental"}, {"id": 13, "question": "Lily saw a snake for the first time in her life. ______, she screamed and ran away.", "options": ["For this purpose", "Immediately", "Again", "On the whole"], "answer": 1, "answerLabel": "B", "source": "轉折詞 Transition Words", "explanation": "【答案】(B) Immediately\n【用語】immediately (adv.)：立刻；馬上（時間）\n【中譯】莉莉這輩子第一次看到蛇。她立刻尖叫著跑走了。", "explanationSource": "supplemental"}, {"id": 14, "question": "You can take the bus to the zoo. ______, you can ride a bike there.", "options": ["Initially", "Therefore", "Still", "Alternatively"], "answer": 3, "answerLabel": "D", "source": "轉折詞 Transition Words", "explanation": "【答案】(D) Alternatively\n【用語】alternatively (adv.)：或者；另一個選擇是（替代）\n【中譯】你可以搭公車去動物園。或者，你也可以騎腳踏車去那裡。", "explanationSource": "supplemental"}, {"id": 15, "question": "Grandpa got sick from smoking in 2015. ______, he never smoked again.", "options": ["Thereafter", "In particular", "For instance", "Conversely"], "answer": 0, "answerLabel": "A", "source": "轉折詞 Transition Words", "explanation": "【答案】(A) Thereafter\n【用語】thereafter (adv.)：此後；從那之後（時間）（正式用語）\n【中譯】爺爺在2015年因為抽菸而生病。從那之後，他再也沒有抽過菸。", "explanationSource": "supplemental"}, {"id": 16, "question": "The two runners crossed the finish line ______, so nobody knew who won.", "options": ["on the contrary", "simultaneously", "on the whole", "subsequently"], "answer": 1, "answerLabel": "B", "source": "轉折詞 Transition Words", "explanation": "【答案】(B) simultaneously\n【用語】simultaneously (adv.)：同時（時間）（正式用語）\n【中譯】那兩位跑者同時衝過終點線，所以沒有人知道誰贏了。", "explanationSource": "supplemental"}, {"id": 17, "question": "Jenny can speak Japanese ______ English.", "options": ["as well as", "so then", "similar", "notably"], "answer": 0, "answerLabel": "A", "source": "轉折詞 Transition Words", "explanation": "【答案】(A) as well as\n【用語】as well as + N (conj.phr.)：以及；還有（補充）\n【中譯】珍妮會說日文，也會說英文。", "explanationSource": "supplemental"}, {"id": 18, "question": "The teacher talked about the class rules for an hour. ______, she wants us to be kind and safe.", "options": ["Meanwhile", "In essence", "Before", "As a consequence"], "answer": 1, "answerLabel": "B", "source": "轉折詞 Transition Words", "explanation": "【答案】(B) In essence\n【用語】in essence (adv.phr.)：本質上；基本上（總結重點）（正式用語）\n【中譯】老師花了一個小時講班規。基本上，她希望我們友善待人並注意安全。", "explanationSource": "supplemental"}, {"id": 19, "question": "______ I finish my homework, I will play basketball with my friends.", "options": ["Recently", "After", "Briefly", "Although"], "answer": 1, "answerLabel": "B", "source": "轉折詞 Transition Words", "explanation": "【答案】(B) After\n【用語】after + N/子句 (conj.)：在……之後（時間順序）\n【中譯】在我寫完功課之後，我會和朋友去打籃球。", "explanationSource": "supplemental"}, {"id": 20, "question": "We need some fruit for the party. ______, we need two watermelons and ten apples.", "options": ["Nevertheless", "Previously", "Specifically", "On the other hand"], "answer": 2, "answerLabel": "C", "source": "轉折詞 Transition Words", "explanation": "【答案】(C) Specifically\n【用語】specifically (adv.)：具體來說（舉例說明）\n【中譯】派對需要一些水果。具體來說，我們需要兩顆西瓜和十顆蘋果。", "explanationSource": "supplemental"}, {"id": 21, "question": "Kate forgot to bring her umbrella. ______, she got wet in the rain.", "options": ["For example", "Instead", "Moreover", "Consequently"], "answer": 3, "answerLabel": "D", "source": "轉折詞 Transition Words", "explanation": "【答案】(D) Consequently\n【用語】consequently (adv.)：因此；結果（結果）（正式用語）\n【中譯】凱特忘了帶雨傘。因此，她被雨淋濕了。", "explanationSource": "supplemental"}, {"id": 22, "question": "Our school trip starts with a visit to the museum, ______ lunch at a small restaurant.", "options": ["on the contrary", "followed by", "unlike", "regardless of"], "answer": 1, "answerLabel": "B", "source": "轉折詞 Transition Words", "explanation": "【答案】(B) followed by\n【用語】followed by + N (prep.phr.)：接著是；隨後是（時間順序）\n【中譯】我們的校外教學先參觀博物館，接著在一間小餐廳吃午餐。", "explanationSource": "supplemental"}, {"id": 23, "question": "The hotel was clean, the food was good, and the workers were kind. ______, it was a great hotel.", "options": ["On the whole", "Shortly", "And yet", "For instance"], "answer": 0, "answerLabel": "A", "source": "轉折詞 Transition Words", "explanation": "【答案】(A) On the whole\n【用語】on the whole (adv.phr.)：大體上；整體來說（總結）\n【中譯】那間飯店很乾淨，食物很好吃，員工也很親切。整體來說，那是一間很棒的飯店。", "explanationSource": "supplemental"}, {"id": 24, "question": "We waited for the bus for more than an hour. ______, it came.", "options": ["In other words", "Namely", "Finally", "To be sure"], "answer": 2, "answerLabel": "C", "source": "轉折詞 Transition Words", "explanation": "【答案】(C) Finally\n【用語】finally (adv.)：最後；終於（順序／結果）\n【中譯】我們等公車等了一個多小時。終於，公車來了。", "explanationSource": "supplemental"}, {"id": 25, "question": "Peter is allergic to milk. ______, he never eats ice cream.", "options": ["Next", "To demonstrate", "However", "Therefore"], "answer": 3, "answerLabel": "D", "source": "轉折詞 Transition Words", "explanation": "【答案】(D) Therefore\n【用語】therefore (adv.)：因此（結果）\n【中譯】彼得對牛奶過敏。因此，他從來不吃冰淇淋。", "explanationSource": "supplemental"}, {"id": 26, "question": "That's all for today's class. ______, we learned three things: colors, animals, and numbers.", "options": ["Instead", "At this point", "For example", "In summary"], "answer": 3, "answerLabel": "D", "source": "轉折詞 Transition Words", "explanation": "【答案】(D) In summary\n【用語】in summary (adv.phr.)：總結來說（總結）\n【中譯】今天的課就到這裡。總結來說，我們學了三件事：顏色、動物和數字。", "explanationSource": "supplemental"}, {"id": 27, "question": "Tom's sister loves vegetables. ______ her, Tom never eats them.", "options": ["By and large", "Unlike", "In this case", "In fact"], "answer": 1, "answerLabel": "B", "source": "轉折詞 Transition Words", "explanation": "【答案】(B) Unlike\n【用語】unlike + N (prep.)：不像；與……不同（對比）\n【中譯】湯姆的姊姊很愛吃蔬菜。跟她不一樣，湯姆從來不吃蔬菜。", "explanationSource": "supplemental"}, {"id": 28, "question": "Cats like to sleep all day, ______ dogs like to go out and play.", "options": ["it could also be said that", "for this reason", "whereas", "in brief"], "answer": 2, "answerLabel": "C", "source": "轉折詞 Transition Words", "explanation": "【答案】(C) whereas\n【用語】whereas + 子句 (conj.)：然而；而（對比）（正式用語）\n【中譯】貓喜歡整天睡覺，而狗喜歡出去玩。", "explanationSource": "supplemental"}, {"id": 29, "question": "Don't be too hard on Jimmy. ______, he is only five years old.", "options": ["Instead", "In the future", "Similarly", "After all"], "answer": 3, "answerLabel": "D", "source": "轉折詞 Transition Words", "explanation": "【答案】(D) After all\n【用語】after all (adv.phr.)：畢竟（總結理由）\n【中譯】不要對吉米太嚴格。畢竟，他才五歲而已。", "explanationSource": "supplemental"}, {"id": 30, "question": "Sam lost his key. ______, he could not open the door of his house.", "options": ["Hence", "On the contrary", "Concurrently", "For instance"], "answer": 0, "answerLabel": "A", "source": "轉折詞 Transition Words", "explanation": "【答案】(A) Hence\n【用語】hence (adv.)：因此（結果）（正式用語）\n【中譯】山姆弄丟了鑰匙。因此，他打不開家裡的門。", "explanationSource": "supplemental"}, {"id": 31, "question": "This building was ______ a school, but now it is a library.", "options": ["especially", "regardless of", "formerly", "in particular"], "answer": 2, "answerLabel": "C", "source": "轉折詞 Transition Words", "explanation": "【答案】(C) formerly\n【用語】formerly (adv.)：以前；從前（時間）（正式用語）\n【中譯】這棟建築以前是一所學校，但現在是一間圖書館。", "explanationSource": "supplemental"}, {"id": 32, "question": "The bridge was broken. ______, we had to take a boat across the river.", "options": ["Likewise", "To illustrate", "Thus", "While"], "answer": 2, "answerLabel": "C", "source": "轉折詞 Transition Words", "explanation": "【答案】(C) Thus\n【用語】thus (adv.)：因此；所以（結果）（正式用語）\n【中譯】橋壞了。因此，我們必須搭船過河。", "explanationSource": "supplemental"}, {"id": 33, "question": "There are two girls in my family, ______ my sister and me.", "options": ["despite", "rather", "namely", "after"], "answer": 2, "answerLabel": "C", "source": "轉折詞 Transition Words", "explanation": "【答案】(C) namely\n【用語】namely (adv.)：也就是；即（舉例說明）（正式用語）\n【中譯】我家有兩個女孩，也就是我姊姊和我。", "explanationSource": "supplemental"}, {"id": 34, "question": "My mom can cook dinner and talk on the phone ______.", "options": ["at the same time", "on the contrary", "therefore", "that is to say"], "answer": 0, "answerLabel": "A", "source": "轉折詞 Transition Words", "explanation": "【答案】(A) at the same time\n【用語】at the same time (adv.phr.)：同時（時間）\n【中譯】我媽媽可以一邊煮晚餐一邊講電話。", "explanationSource": "supplemental"}, {"id": 35, "question": "______, people wrote letters to their friends. Now they send messages on their phones.", "options": ["Concurrently", "It seems", "Clearly", "In the past"], "answer": 3, "answerLabel": "D", "source": "轉折詞 Transition Words", "explanation": "【答案】(D) In the past\n【用語】in the past (adv.phr.)：過去；以前（時間）\n【中譯】過去，人們會寫信給朋友。現在他們用手機傳訊息。", "explanationSource": "supplemental"}, {"id": 36, "question": "My uncle is a cook now. ______, he was a bus driver.", "options": ["Afterward", "In short", "Soon", "Previously"], "answer": 3, "answerLabel": "D", "source": "轉折詞 Transition Words", "explanation": "【答案】(D) Previously\n【用語】previously (adv.)：先前；以前（順序）\n【中譯】我叔叔現在是廚師。以前，他是公車司機。", "explanationSource": "supplemental"}, {"id": 37, "question": "We visited many places ______ the summer vacation.", "options": ["however", "granted", "during", "including"], "answer": 2, "answerLabel": "C", "source": "轉折詞 Transition Words", "explanation": "【答案】(C) during\n【用語】during + N (prep.)：在……期間（時間）\n【中譯】暑假期間，我們去了很多地方。", "explanationSource": "supplemental"}, {"id": 38, "question": "I ate a piece of cake, and it was delicious. Can I have ______ piece?", "options": ["another", "nevertheless", "correspondingly", "also"], "answer": 0, "answerLabel": "A", "source": "轉折詞 Transition Words", "explanation": "【答案】(A) another\n【用語】another + N (adj.)：另一個（補充）\n【中譯】我吃了一塊蛋糕，很好吃。我可以再吃一塊嗎？", "explanationSource": "supplemental"}, {"id": 39, "question": "Students must put their books away ______ the start of the test.", "options": ["after", "such as", "unlike", "prior to"], "answer": 3, "answerLabel": "D", "source": "轉折詞 Transition Words", "explanation": "【答案】(D) prior to\n【用語】prior to + N/V-ing (prep.phr.)：在……之前（時間）（正式用語）\n【中譯】學生必須在考試開始之前把書收好。", "explanationSource": "supplemental"}, {"id": 40, "question": "The movie was too long, the story was boring, and the actors were bad. ______, it was a terrible movie.", "options": ["At the same time", "In brief", "Subsequently", "Currently"], "answer": 1, "answerLabel": "B", "source": "轉折詞 Transition Words", "explanation": "【答案】(B) In brief\n【用語】in brief (adv.phr.)：簡言之（總結）\n【中譯】那部電影太長，故事很無聊，演員也演得不好。簡言之，那是一部很糟的電影。", "explanationSource": "supplemental"}, {"id": 41, "question": "It rained all day during our trip to the zoo. ______, we had a great time.", "options": ["Nonetheless", "That is", "Presently", "In conclusion"], "answer": 0, "answerLabel": "A", "source": "轉折詞 Transition Words", "explanation": "【答案】(A) Nonetheless\n【用語】nonetheless (adv.)：儘管如此（讓步）（正式用語）\n【中譯】我們去動物園玩的那天下了一整天的雨。儘管如此，我們還是玩得很開心。", "explanationSource": "supplemental"}, {"id": 42, "question": "Tom's room is always clean. ______, his brother's room is very messy.", "options": ["Then", "In contrast", "Likewise", "To put it differently"], "answer": 1, "answerLabel": "B", "source": "轉折詞 Transition Words", "explanation": "【答案】(B) In contrast\n【用語】in contrast (adv.phr.)：相比之下；對照之下（對比）\n【中譯】湯姆的房間總是很乾淨。相比之下，他弟弟的房間非常亂。", "explanationSource": "supplemental"}, {"id": 43, "question": "This phone is light and cheap. ______, it takes great photos.", "options": ["Instead", "On the one hand", "For instance", "Moreover"], "answer": 3, "answerLabel": "D", "source": "轉折詞 Transition Words", "explanation": "【答案】(D) Moreover\n【用語】moreover (adv.)：此外；而且（比較／補充）（正式用語）\n【中譯】這支手機又輕又便宜。此外，它還能拍出很棒的照片。", "explanationSource": "supplemental"}, {"id": 44, "question": "I want to join the English speech contest. ______, my English is not perfect, but I practice every day.", "options": ["Hence", "After all", "Earlier", "Admittedly"], "answer": 3, "answerLabel": "D", "source": "轉折詞 Transition Words", "explanation": "【答案】(D) Admittedly\n【用語】admittedly (adv.)：不可否認地（讓步）\n【中譯】我想參加英文演講比賽。不可否認，我的英文並不完美，但我每天都在練習。", "explanationSource": "supplemental"}, {"id": 45, "question": "______ it was raining, Eric still went running.", "options": ["Naturally", "Finally", "Even though", "At that time"], "answer": 2, "answerLabel": "C", "source": "轉折詞 Transition Words", "explanation": "【答案】(C) Even though\n【用語】even though + 子句 (conj.phr.)：即使；雖然（讓步）\n【中譯】雖然在下雨，艾瑞克還是去跑步了。", "explanationSource": "supplemental"}, {"id": 46, "question": "Here is how to make a paper boat. ______, fold the paper in half, and then fold down the top corners.", "options": ["Finally", "In short", "First", "Albeit"], "answer": 2, "answerLabel": "C", "source": "轉折詞 Transition Words", "explanation": "【答案】(C) First\n【用語】first / second / third (adv.)：第一／第二／第三（順序）\n【中譯】這是摺紙船的方法。首先，把紙對摺，然後把上面的兩個角往下摺。", "explanationSource": "supplemental"}, {"id": 47, "question": "Our teacher told us to eat fruit, drink water, sleep early, and play sports. ______, she wants us to stay healthy.", "options": ["On the contrary", "To summarize", "Later", "Even so"], "answer": 1, "answerLabel": "B", "source": "轉折詞 Transition Words", "explanation": "【答案】(B) To summarize\n【用語】to summarize (adv.phr.)：總結（總結）\n【中譯】老師要我們吃水果、喝水、早點睡覺和運動。總結來說，她希望我們保持健康。", "explanationSource": "supplemental"}, {"id": 48, "question": "Swimming is good for your body. ______, it is a lot of fun.", "options": ["Conversely", "In addition", "Meanwhile", "Initially"], "answer": 1, "answerLabel": "B", "source": "轉折詞 Transition Words", "explanation": "【答案】(B) In addition\n【用語】in addition (adv.phr.)：此外；另外（補充）\n【中譯】游泳對身體有益。此外，它也非常好玩。", "explanationSource": "supplemental"}, {"id": 49, "question": "My dad never drives to work. ______, he takes the MRT every day.", "options": ["Initially", "Instead", "Similarly", "Besides"], "answer": 1, "answerLabel": "B", "source": "轉折詞 Transition Words", "explanation": "【答案】(B) Instead\n【用語】instead (adv.)：反而；取而代之（替代）\n【中譯】我爸爸從不開車上班。取而代之的是，他每天搭捷運。", "explanationSource": "supplemental"}, {"id": 50, "question": "Ben is a vegetarian. ______, he doesn't eat any meat.", "options": ["Next", "In other words", "Chiefly", "All things considered"], "answer": 1, "answerLabel": "B", "source": "轉折詞 Transition Words", "explanation": "【答案】(B) In other words\n【用語】in other words (adv.phr.)：換句話說（解釋／總結）\n【中譯】Ben 是素食者。換句話說，他完全不吃肉。", "explanationSource": "supplemental"}, {"id": 51, "question": "Today the park is full of trees and flowers. ______, it was an empty parking lot.", "options": ["Therefore", "To illustrate", "Previously", "In any event"], "answer": 2, "answerLabel": "C", "source": "轉折詞 Transition Words", "explanation": "【答案】(C) Previously\n【用語】previously (adv.)：先前；以前（時間）\n【中譯】現在這座公園種滿了樹和花。以前，它是一個空蕩蕩的停車場。", "explanationSource": "supplemental"}, {"id": 52, "question": "Lucy stayed up late to watch TV last night. ______, she was very sleepy in class this morning.", "options": ["For this reason", "Now", "In contrast", "As an example"], "answer": 0, "answerLabel": "A", "source": "轉折詞 Transition Words", "explanation": "【答案】(A) For this reason\n【用語】for this reason (adv.phr.)：因為這個原因；因此（原因）\n【中譯】Lucy 昨晚熬夜看電視。因為這個原因，她今天早上上課時很想睡覺。", "explanationSource": "supplemental"}, {"id": 53, "question": "There are many ways to get to school. ______, you can walk, ride a bike, or take a bus.", "options": ["However", "In the meantime", "Particularly", "For example"], "answer": 3, "answerLabel": "D", "source": "轉折詞 Transition Words", "explanation": "【答案】(D) For example\n【用語】for example (adv.phr.)：例如；舉例來說（舉例）\n【中譯】上學的方法有很多種。例如，你可以走路、騎腳踏車或搭公車。", "explanationSource": "supplemental"}, {"id": 54, "question": "Mr. Chen teaches math at our school now. ______, he worked at a bank for ten years.", "options": ["On the whole", "A different view is", "Previously", "Thus"], "answer": 2, "answerLabel": "C", "source": "轉折詞 Transition Words", "explanation": "【答案】(C) Previously\n【用語】previously (adv.)：先前；以前（時間）（正式用語）\n【中譯】陳老師現在在我們學校教數學。先前，他在銀行工作了十年。", "explanationSource": "supplemental"}, {"id": 55, "question": "This bike is too expensive for me. ______, it is too big for me to ride.", "options": ["At length", "Accordingly", "Instead", "Further"], "answer": 3, "answerLabel": "D", "source": "轉折詞 Transition Words", "explanation": "【答案】(D) Further\n【用語】further (adv.)：此外；再者（補充）（正式用語）\n【中譯】這台腳踏車對我來說太貴了。此外，它也太大，我騎不了。", "explanationSource": "supplemental"}, {"id": 56, "question": "That is all I want to say about my trip to Japan. ______, thank you all for listening.", "options": ["Likewise", "Finally", "Meanwhile", "For instance"], "answer": 1, "answerLabel": "B", "source": "轉折詞 Transition Words", "explanation": "【答案】(B) Finally\n【用語】finally (adv.)：最後（總結）\n【中譯】以上就是我想分享的日本之旅。最後，謝謝大家聆聽。", "explanationSource": "supplemental"}, {"id": 57, "question": "Plants need sunlight to grow. ______, children need good food to grow up healthy.", "options": ["Before", "Otherwise", "In the same way", "As a result"], "answer": 2, "answerLabel": "C", "source": "轉折詞 Transition Words", "explanation": "【答案】(C) In the same way\n【用語】in the same way (adv.phr.)：同樣地（比較）\n【中譯】植物需要陽光才能生長。同樣地，孩子需要好的食物才能健康長大。", "explanationSource": "supplemental"}, {"id": 58, "question": "Tom's twin brother loves basketball. ______ his brother, Tom never plays it.", "options": ["Together with", "Differing from", "Coupled with", "Illustrated by"], "answer": 1, "answerLabel": "B", "source": "轉折詞 Transition Words", "explanation": "【答案】(B) Differing from\n【用語】differing from + N (prep.phr.)：與……不同（對比）\n【中譯】Tom 的雙胞胎哥哥很愛打籃球。和他哥哥不同，Tom 從來不打籃球。", "explanationSource": "supplemental"}, {"id": 59, "question": "Our school trip had good food, fun games, and great weather. ______, it was a wonderful day.", "options": ["For instance", "To sum up", "However", "Subsequently"], "answer": 1, "answerLabel": "B", "source": "轉折詞 Transition Words", "explanation": "【答案】(B) To sum up\n【用語】to sum up (adv.phr.)：總而言之（總結）\n【中譯】我們的校外教學有好吃的食物、好玩的遊戲和很棒的天氣。總而言之，那是很美好的一天。", "explanationSource": "supplemental"}, {"id": 60, "question": "My brother is good at drawing. ______, my sister draws beautiful pictures.", "options": ["Similarly", "As well as", "Indeed", "Consequently"], "answer": 0, "answerLabel": "A", "source": "轉折詞 Transition Words", "explanation": "【答案】(A) Similarly\n【用語】similarly (adv.)：同樣地；相似地（比較）\n【中譯】我哥哥很會畫畫。同樣地，我姊姊也畫出很漂亮的圖。", "explanationSource": "supplemental"}, {"id": 61, "question": "Eating healthy food is important for your body. ______, you need to get enough sleep.", "options": ["Equally important", "At that time", "Otherwise", "Overall"], "answer": 0, "answerLabel": "A", "source": "轉折詞 Transition Words", "explanation": "【答案】(A) Equally important\n【用語】equally important (adj.phr.)：同樣重要的是（補充）\n【中譯】吃健康的食物對身體很重要。同樣重要的是，你需要有充足的睡眠。", "explanationSource": "supplemental"}, {"id": 62, "question": "Yesterday I finished my homework at seven. ______, I watched TV with my family.", "options": ["Then", "At present", "On the other hand", "In other words"], "answer": 0, "answerLabel": "A", "source": "轉折詞 Transition Words", "explanation": "【答案】(A) Then\n【用語】then (adv.)：然後（順序）\n【中譯】昨天我七點寫完功課。然後，我和家人一起看電視。", "explanationSource": "supplemental"}]};</script><script>window.LEARN_DATA=[{"g": "補充 Addition", "t": "additionally", "p": "(adv.)", "e": "used to add another point", "z": "此外（補充）", "s": "Our school library has many new storybooks this year. _____, it now has six computers that students can use after class.", "c": "我們學校圖書館今年有很多新的故事書。【此外】，現在還有六台學生下課後可以使用的電腦。", "f": "Our school library has many new storybooks this year. Additionally, it now has six computers that students can use after class."}, {"g": "補充 Addition", "t": "again", "p": "(adv.)", "e": "used to add one more point to what you said", "z": "再者；另外（補充）", "s": "Walking to school is good for your health because you move your body every day. _____, it saves your parents time and gas money.", "c": "走路上學對健康有益，因為你每天都在活動身體。【再者】，這也幫爸媽省下時間和油錢。", "f": "Walking to school is good for your health because you move your body every day. Again, it saves your parents time and gas money."}, {"g": "補充 Addition", "t": "also", "p": "(adv.)", "e": "used to add another fact or idea", "z": "也；而且（補充）", "s": "My cousin is very good at drawing pictures of animals. She _____ plays the guitar in the school band every Friday afternoon.", "c": "我表姊很會畫動物。她【也】每週五下午在學校樂團彈吉他。", "f": "My cousin is very good at drawing pictures of animals. She also plays the guitar in the school band every Friday afternoon."}, {"g": "補充 Addition", "t": "another + N", "p": "(adj.)", "e": "used to add one more thing of the same kind", "z": "另一個（補充）", "s": "One reason I like summer is the long vacation. _____ reason is that I can swim in the pool with my friends every day.", "c": "我喜歡夏天的一個原因是長假。【另一個】原因是我每天都能和朋友在泳池游泳。", "f": "One reason I like summer is the long vacation. Another reason is that I can swim in the pool with my friends every day."}, {"g": "補充 Addition", "t": "as well as + N", "p": "(conj.phr.)", "e": "used to add another thing; means 'and also'", "z": "以及；還有（補充）", "s": "Lily practices the piano every evening after dinner. She can play the violin _____ _____ _____ the piano, so she joined two music clubs.", "c": "莉莉每天晚餐後練鋼琴。她會拉小提琴【以及】彈鋼琴，所以參加了兩個音樂社團。", "f": "Lily practices the piano every evening after dinner. She can play the violin as well as the piano, so she joined two music clubs."}, {"g": "補充 Addition", "t": "besides", "p": "(adv.)", "e": "used to add another reason or point", "z": "此外；而且（補充）", "s": "I don't want to go to the night market tonight because I am too tired. _____, I still have a lot of homework to finish.", "c": "我今晚不想去夜市，因為我太累了。【而且】，我還有很多功課要寫完。", "f": "I don't want to go to the night market tonight because I am too tired. Besides, I still have a lot of homework to finish."}, {"g": "補充 Addition", "t": "coupled with + N", "p": "(prep.phr.)", "e": "used to add something that happens together with another thing", "z": "加上；連同（補充）（正式用語）", "s": "Tom stayed up late playing games every night. This, _____ _____ a bad breakfast, made him feel sleepy in class.", "c": "湯姆每晚熬夜打電動。這件事【加上】早餐吃不好，讓他上課時很想睡。", "f": "Tom stayed up late playing games every night. This, coupled with a bad breakfast, made him feel sleepy in class."}, {"g": "補充 Addition", "t": "further", "p": "(adv.)", "e": "used to add one more point, often in writing", "z": "此外；再者（補充）（正式用語）", "s": "Riding a bike to school is cheaper than taking the bus. _____, it is good for the earth because bikes do not make dirty air.", "c": "騎腳踏車上學比搭公車便宜。【再者】，這對地球也好，因為腳踏車不會製造髒空氣。", "f": "Riding a bike to school is cheaper than taking the bus. Further, it is good for the earth because bikes do not make dirty air."}, {"g": "補充 Addition", "t": "furthermore", "p": "(adv.)", "e": "used to add another important point", "z": "此外；而且（補充）（正式用語）", "s": "Our new teacher explains grammar in a clear and easy way. _____, she always gives us fun games to practice new words.", "c": "我們的新老師用清楚又簡單的方式講解文法。【此外】，她總是給我們有趣的遊戲來練習新單字。", "f": "Our new teacher explains grammar in a clear and easy way. Furthermore, she always gives us fun games to practice new words."}, {"g": "補充 Addition", "t": "equally important", "p": "(adj.phr.)", "e": "used to add a point that is just as important as the last one", "z": "同樣重要的是（補充）", "s": "Eating healthy food is important for growing students. _____ _____, you should sleep at least eight hours every night.", "c": "吃健康的食物對成長中的學生很重要。【同樣重要的是】，你每晚應該至少睡八個小時。", "f": "Eating healthy food is important for growing students. Equally important, you should sleep at least eight hours every night."}, {"g": "補充 Addition", "t": "in addition", "p": "(adv.phr.)", "e": "used to add more information", "z": "此外；另外（補充）", "s": "Our new classroom has bigger windows and brighter lights. _____ _____, it has an air conditioner and a new projector.", "c": "我們的新教室有更大的窗戶和更亮的燈。【此外】，還有冷氣和新的投影機。", "f": "Our new classroom has bigger windows and brighter lights. In addition, it has an air conditioner and a new projector."}, {"g": "補充 Addition", "t": "likewise", "p": "(adv.)", "e": "used to add a point that is the same or similar", "z": "同樣地（補充）", "s": "You should say thank you when someone helps you at school. _____, you should say sorry when you make a mistake.", "c": "在學校有人幫你時，你應該說謝謝。【同樣地】，你犯錯時應該說對不起。", "f": "You should say thank you when someone helps you at school. Likewise, you should say sorry when you make a mistake."}, {"g": "補充 Addition", "t": "moreover", "p": "(adv.)", "e": "used to add a stronger or more important point", "z": "此外；而且（補充）（正式用語）", "s": "This small cafe near our school sells cheap and tasty sandwiches. _____, the owner is very kind and always remembers our names.", "c": "學校附近這間小咖啡店賣便宜又好吃的三明治。【而且】，老闆很親切，總是記得我們的名字。", "f": "This small cafe near our school sells cheap and tasty sandwiches. Moreover, the owner is very kind and always remembers our names."}, {"g": "因果 Cause / Effect / Result", "t": "accordingly", "p": "(adv.)", "e": "used to show a result that matches the situation", "z": "因此；於是（結果）（正式用語）", "s": "The weather report said a typhoon was coming on Friday. _____, our school canceled the sports day and moved it to next week.", "c": "氣象報告說颱風週五會來。【因此】，學校取消了運動會，改到下週舉行。", "f": "The weather report said a typhoon was coming on Friday. Accordingly, our school canceled the sports day and moved it to next week."}, {"g": "因果 Cause / Effect / Result", "t": "after + N/子句", "p": "(conj.)", "e": "used to show that one thing happens first and the next thing follows", "z": "在……之後（時間順序）", "s": "Amy always feels tired when she gets home. _____ she finishes her homework, she takes a hot shower and goes to bed.", "c": "艾美回到家總是覺得很累。【在】她寫完功課【之後】，她會洗個熱水澡然後上床睡覺。", "f": "Amy always feels tired when she gets home. After she finishes her homework, she takes a hot shower and goes to bed."}, {"g": "因果 Cause / Effect / Result", "t": "as a consequence", "p": "(adv.phr.)", "e": "used to show a result, often a bad one", "z": "結果；因此（結果）（正式用語）", "s": "Jack forgot to set his alarm clock last night. _____ _____ _____, he missed the school bus and was late for class.", "c": "傑克昨晚忘了設鬧鐘。【結果】，他錯過了校車，上課遲到了。", "f": "Jack forgot to set his alarm clock last night. As a consequence, he missed the school bus and was late for class."}, {"g": "因果 Cause / Effect / Result", "t": "as a result", "p": "(adv.phr.)", "e": "used to show the result of something", "z": "結果；因此（結果）", "s": "Mary studied English for one hour every day this semester. _____ _____ _____, she got the highest score on the final exam.", "c": "瑪莉這學期每天讀一小時英文。【結果】，她期末考得到最高分。", "f": "Mary studied English for one hour every day this semester. As a result, she got the highest score on the final exam."}, {"g": "因果 Cause / Effect / Result", "t": "at that time", "p": "(adv.phr.)", "e": "used to talk about what was happening at a certain time in the past", "z": "當時；那時候（時間）", "s": "My parents moved to Taipei ten years ago. _____ _____ _____, there was no MRT station near our home, so they rode a scooter to work.", "c": "我爸媽十年前搬到台北。【當時】，我們家附近沒有捷運站，所以他們騎機車上班。", "f": "My parents moved to Taipei ten years ago. At that time, there was no MRT station near our home, so they rode a scooter to work."}, {"g": "因果 Cause / Effect / Result", "t": "before + N/子句", "p": "(conj.)", "e": "used to show that one thing happens earlier than another", "z": "在……之前（時間順序）", "s": "Mom has a rule in our house about dinner. _____ we eat dinner, we must wash our hands and set the table together.", "c": "媽媽在家裡定了一個晚餐規定。【在】吃晚餐【之前】，我們必須洗手並一起擺好餐桌。", "f": "Mom has a rule in our house about dinner. Before we eat dinner, we must wash our hands and set the table together."}, {"g": "因果 Cause / Effect / Result", "t": "concurrently", "p": "(adv.)", "e": "used to show that two things happen at the same time", "z": "同時（時間）（正式用語）", "s": "Ben was cooking noodles for the family in the kitchen. _____, his little sister was cleaning the table in the living room.", "c": "班在廚房為家人煮麵。【同時】，他妹妹在客廳擦桌子。", "f": "Ben was cooking noodles for the family in the kitchen. Concurrently, his little sister was cleaning the table in the living room."}, {"g": "因果 Cause / Effect / Result", "t": "consequently", "p": "(adv.)", "e": "used to show the result of an action", "z": "因此；結果（結果）（正式用語）", "s": "Kevin ate too much ice cream at the party last night. _____, he had a stomachache and could not come to school today.", "c": "凱文昨晚在派對上吃了太多冰淇淋。【結果】，他肚子痛，今天沒辦法來上學。", "f": "Kevin ate too much ice cream at the party last night. Consequently, he had a stomachache and could not come to school today."}, {"g": "因果 Cause / Effect / Result", "t": "finally", "p": "(adv.)", "e": "used to introduce the last step or the end result", "z": "最後；終於（順序／結果）", "s": "We waited for the bus in the rain for forty minutes. _____, it came, and we all got on quickly.", "c": "我們在雨中等公車等了四十分鐘。【終於】，公車來了，我們都很快上了車。", "f": "We waited for the bus in the rain for forty minutes. Finally, it came, and we all got on quickly."}, {"g": "因果 Cause / Effect / Result", "t": "followed by + N", "p": "(prep.phr.)", "e": "used to show what comes next in order", "z": "接著是；隨後是（時間順序）", "s": "Our school concert started with a song from the choir. It was _____ _____ a short play by the ninth graders.", "c": "我們學校的音樂會由合唱團的一首歌開場。【接著是】九年級學生的一齣短劇。", "f": "Our school concert started with a song from the choir. It was followed by a short play by the ninth graders."}, {"g": "因果 Cause / Effect / Result", "t": "for this purpose", "p": "(adv.phr.)", "e": "used to show the reason or goal for an action", "z": "為了這個目的（目的）", "s": "Our class wants to clean the beach next Saturday morning. _____ _____ _____, everyone will bring trash bags and gloves.", "c": "我們班想在下週六早上去淨灘。【為了這個目的】，每個人都會帶垃圾袋和手套。", "f": "Our class wants to clean the beach next Saturday morning. For this purpose, everyone will bring trash bags and gloves."}, {"g": "因果 Cause / Effect / Result", "t": "for this reason", "p": "(adv.phr.)", "e": "used to show the reason for the next action", "z": "因為這個原因；因此（原因）", "s": "My little brother is afraid of big dogs. _____ _____ _____, we never walk past the house with the black dog.", "c": "我弟弟很怕大狗。【因為這個原因】，我們從來不走過那間養黑狗的房子。", "f": "My little brother is afraid of big dogs. For this reason, we never walk past the house with the black dog."}, {"g": "因果 Cause / Effect / Result", "t": "hence", "p": "(adv.)", "e": "used to show a result, often in writing", "z": "因此（結果）（正式用語）", "s": "Our school is very far from the MRT station and there are few buses. _____, many students ride bikes to school.", "c": "我們學校離捷運站很遠，公車也很少。【因此】，很多學生騎腳踏車上學。", "f": "Our school is very far from the MRT station and there are few buses. Hence, many students ride bikes to school."}, {"g": "因果 Cause / Effect / Result", "t": "initially", "p": "(adv.)", "e": "used to talk about the beginning, before things changed", "z": "起初；一開始（時間順序）（正式用語）", "s": "_____, I did not like living in the new town because I had no friends. Now I love it and have many classmates to play with.", "c": "【一開始】，我不喜歡住在新的小鎮，因為我沒有朋友。現在我很喜歡，也有很多同學可以一起玩。", "f": "Initially, I did not like living in the new town because I had no friends. Now I love it and have many classmates to play with."}, {"g": "因果 Cause / Effect / Result", "t": "next", "p": "(adv.)", "e": "used to show the following step", "z": "接下來；然後（順序）", "s": "To make a cup of milk tea, first put a tea bag in hot water. _____, add some milk and a little sugar.", "c": "要做一杯奶茶，首先把茶包放進熱水裡。【接下來】，加一些牛奶和一點糖。", "f": "To make a cup of milk tea, first put a tea bag in hot water. Next, add some milk and a little sugar."}, {"g": "因果 Cause / Effect / Result", "t": "otherwise", "p": "(adv.)", "e": "used to show what will happen if you do not do something", "z": "否則；不然（結果）", "s": "You should bring an umbrella with you today. _____, you will get wet on the way home because it will rain this afternoon.", "c": "你今天應該帶把傘。【否則】，你回家路上會淋濕，因為今天下午會下雨。", "f": "You should bring an umbrella with you today. Otherwise, you will get wet on the way home because it will rain this afternoon."}, {"g": "因果 Cause / Effect / Result", "t": "previously", "p": "(adv.)", "e": "used to talk about something that happened before now", "z": "先前；以前（時間）（正式用語）", "s": "Mr. Lin teaches math at our school now. _____, he worked as an engineer at a computer company in Hsinchu.", "c": "林老師現在在我們學校教數學。【以前】，他在新竹一家電腦公司當工程師。", "f": "Mr. Lin teaches math at our school now. Previously, he worked as an engineer at a computer company in Hsinchu."}, {"g": "因果 Cause / Effect / Result", "t": "so then", "p": "(adv.phr.)", "e": "used to show what happened because of the last thing", "z": "所以接著；於是（結果）", "s": "It suddenly started to rain hard during our basketball game. _____ _____, we stopped playing and ran into the classroom.", "c": "我們打籃球時突然開始下大雨。【於是】，我們停止比賽，跑進教室。", "f": "It suddenly started to rain hard during our basketball game. So then, we stopped playing and ran into the classroom."}, {"g": "因果 Cause / Effect / Result", "t": "subsequently", "p": "(adv.)", "e": "used to show what happened later, after something else", "z": "隨後；後來（時間順序）（正式用語）", "s": "Sam hurt his leg while playing soccer last month. _____, he could not join the school race, so he cheered for his team.", "c": "山姆上個月踢足球時傷了腿。【後來】，他沒辦法參加學校的賽跑，所以他為隊友加油。", "f": "Sam hurt his leg while playing soccer last month. Subsequently, he could not join the school race, so he cheered for his team."}, {"g": "因果 Cause / Effect / Result", "t": "then", "p": "(adv.)", "e": "used to show the next thing that happens", "z": "然後；接著（順序）", "s": "On Sunday morning, my family went to the park for a walk. _____ we had beef noodles at a small shop nearby.", "c": "週日早上，我們全家去公園散步。【然後】我們在附近一家小店吃牛肉麵。", "f": "On Sunday morning, my family went to the park for a walk. Then we had beef noodles at a small shop nearby."}, {"g": "因果 Cause / Effect / Result", "t": "therefore", "p": "(adv.)", "e": "used to show a result or conclusion", "z": "因此；所以（結果）", "s": "The museum is closed on Mondays for cleaning. _____, we will visit it on Tuesday morning with our teacher instead.", "c": "博物館每週一休館打掃。【因此】，我們會改在週二早上和老師一起去參觀。", "f": "The museum is closed on Mondays for cleaning. Therefore, we will visit it on Tuesday morning with our teacher instead."}, {"g": "因果 Cause / Effect / Result", "t": "thus", "p": "(adv.)", "e": "used to show a result, often in writing", "z": "因此（結果）（正式用語）", "s": "Anna practiced speaking English with her friends every day. _____, she was not nervous at all in the speech contest.", "c": "安娜每天和朋友練習說英文。【因此】，她在演講比賽時一點也不緊張。", "f": "Anna practiced speaking English with her friends every day. Thus, she was not nervous at all in the speech contest."}, {"g": "比較 Comparison", "t": "as well as + N", "p": "(conj.phr.)", "e": "used to show that two people or things are the same in some way", "z": "和……一樣；以及（比較）", "s": "Both of my parents love sports very much. My mother, _____ _____ _____ my father, runs in the park every morning.", "c": "我爸媽都非常喜歡運動。我媽媽【和】我爸爸【一樣】，每天早上都在公園跑步。", "f": "Both of my parents love sports very much. My mother, as well as my father, runs in the park every morning."}, {"g": "比較 Comparison", "t": "comparatively", "p": "(adv.)", "e": "used to say something is more or less true when compared with others", "z": "相對地；比較起來（比較）（正式用語）", "s": "Most of my classmates live far away and take the bus to school. My home is _____ close, so I can walk there in five minutes.", "c": "我大部分同學住得很遠，要搭公車上學。我家【相對】近，所以走五分鐘就到了。", "f": "Most of my classmates live far away and take the bus to school. My home is comparatively close, so I can walk there in five minutes."}, {"g": "比較 Comparison", "t": "conversely", "p": "(adv.)", "e": "used to show the opposite side of a comparison", "z": "相反地（比較／對比）（正式用語）", "s": "Some students like to study early in the morning when it is quiet. _____, others study better late at night.", "c": "有些學生喜歡在安靜的清晨讀書。【相反地】，有些人在深夜讀書效果比較好。", "f": "Some students like to study early in the morning when it is quiet. Conversely, others study better late at night."}, {"g": "比較 Comparison", "t": "correspondingly", "p": "(adv.)", "e": "used to show that one thing changes in the same way as another", "z": "相應地；同樣地（比較）（正式用語）", "s": "The number of students at our school grew a lot this year. _____, the school hired more teachers and opened two new classrooms.", "c": "今年我們學校的學生人數增加很多。【相應地】，學校聘請了更多老師，還開了兩間新教室。", "f": "The number of students at our school grew a lot this year. Correspondingly, the school hired more teachers and opened two new classrooms."}, {"g": "比較 Comparison", "t": "coupled with + N", "p": "(prep.phr.)", "e": "used to put two similar things together", "z": "加上；連同（比較）（正式用語）", "s": "Good sleep helps students remember what they learn. Healthy food, _____ _____ exercise, also helps them do well at school.", "c": "充足的睡眠幫助學生記住所學。健康的食物【加上】運動，也能幫助他們在學校表現良好。", "f": "Good sleep helps students remember what they learn. Healthy food, coupled with exercise, also helps them do well at school."}, {"g": "比較 Comparison", "t": "in the same way", "p": "(adv.phr.)", "e": "used to show that two things are similar", "z": "同樣地（比較）", "s": "Plants need water and sunlight to grow tall and strong. _____ _____ _____ _____, children need good food and love to grow well.", "c": "植物需要水和陽光才能長得又高又壯。【同樣地】，孩子需要好的食物和愛才能好好長大。", "f": "Plants need water and sunlight to grow tall and strong. In the same way, children need good food and love to grow well."}, {"g": "比較 Comparison", "t": "likewise", "p": "(adv.)", "e": "used to show that something is the same as the thing before", "z": "同樣地（比較）", "s": "My father always reads the newspaper with his coffee in the morning. _____, my grandfather reads a book with his tea.", "c": "我爸爸早上總是邊喝咖啡邊看報紙。【同樣地】，我爺爺邊喝茶邊看書。", "f": "My father always reads the newspaper with his coffee in the morning. Likewise, my grandfather reads a book with his tea."}, {"g": "比較 Comparison", "t": "moreover", "p": "(adv.)", "e": "used to add a similar but stronger point", "z": "此外；而且（比較／補充）（正式用語）", "s": "This new phone is lighter than my old one. _____, its camera is much better, so my photos look clearer.", "c": "這支新手機比我的舊手機輕。【而且】，它的相機好很多，所以我的照片看起來更清楚。", "f": "This new phone is lighter than my old one. Moreover, its camera is much better, so my photos look clearer."}, {"g": "比較 Comparison", "t": "on the one hand", "p": "(adv.phr.)", "e": "used to give the first side of a comparison (often with 'on the other hand')", "z": "一方面（比較）", "s": "_____ _____ _____ _____, living in a big city is very convenient. On the other hand, it is often noisy and crowded.", "c": "【一方面】，住在大城市很方便。另一方面，那裡常常又吵又擁擠。", "f": "On the one hand, living in a big city is very convenient. On the other hand, it is often noisy and crowded."}, {"g": "比較 Comparison", "t": "similar", "p": "(adj.)", "e": "used to say two things are almost the same", "z": "相似的（比較）", "s": "Tom's school bag and my school bag are very _____. They are both blue and have a cartoon cat on the front.", "c": "湯姆的書包和我的書包非常【相似】。它們都是藍色的，前面都有一隻卡通貓。", "f": "Tom's school bag and my school bag are very similar. They are both blue and have a cartoon cat on the front."}, {"g": "比較 Comparison", "t": "similar to + N", "p": "(adj.phr.)", "e": "used to say one thing is almost the same as another", "z": "和……相似（比較）", "s": "My new phone is _____ _____ my old one. They are both black and small, and they have the same games.", "c": "我的新手機【和】我的舊手機【很像】。它們都是黑色的、小小的，而且有一樣的遊戲。", "f": "My new phone is similar to my old one. They are both black and small, and they have the same games."}, {"g": "比較 Comparison", "t": "similarly", "p": "(adv.)", "e": "used to show that two things are alike", "z": "同樣地；相似地（比較）", "s": "Cats like to sleep in warm and quiet places during the day. _____, dogs often look for a soft bed to take a nap.", "c": "貓白天喜歡在溫暖安靜的地方睡覺。【同樣地】，狗也常常找柔軟的床午睡。", "f": "Cats like to sleep in warm and quiet places during the day. Similarly, dogs often look for a soft bed to take a nap."}, {"g": "比較 Comparison", "t": "together with + N", "p": "(prep.phr.)", "e": "used to show people or things that are joined or the same", "z": "連同；和……一起（比較）", "s": "My best friend Kelly enjoys drawing in her free time. She, _____ _____ her twin sister, won first prize in the art contest.", "c": "我最好的朋友凱莉空閒時喜歡畫畫。她【和】她的雙胞胎妹妹【一起】在美術比賽中得到第一名。", "f": "My best friend Kelly enjoys drawing in her free time. She, together with her twin sister, won first prize in the art contest."}, {"g": "比較 Comparison", "t": "whereas + 子句", "p": "(conj.)", "e": "used to compare two different facts", "z": "然而；而（對比）（正式用語）", "s": "My brother loves to play basketball outside on weekends, _____ I prefer to stay at home and read comic books.", "c": "我哥哥週末喜歡在外面打籃球，【而】我比較喜歡待在家看漫畫。", "f": "My brother loves to play basketball outside on weekends, whereas I prefer to stay at home and read comic books."}, {"g": "比較 Comparison", "t": "while + 子句", "p": "(conj.)", "e": "used to show two things happening in a similar way at the same time", "z": "而；同時（比較）", "s": "My sister practices the piano in the living room every evening, _____ I practice the violin in my room at the same time.", "c": "我姊姊每天晚上在客廳練鋼琴，【而】我同一時間在房間裡練小提琴。", "f": "My sister practices the piano in the living room every evening, while I practice the violin in my room at the same time."}, {"g": "對比／讓步 Contrast / Concession", "t": "a different view is", "p": "(adv.phr.)", "e": "used to introduce an opposite opinion", "z": "另一種看法是（對比）", "s": "Many students think that homework helps them learn better. _____ _____ _____ _____ that too much homework makes students tired and unhappy.", "c": "很多學生認為作業能幫助他們學得更好。【另一種看法是】，太多作業會讓學生又累又不開心。", "f": "Many students think that homework helps them learn better. A different view is that too much homework makes students tired and unhappy."}, {"g": "對比／讓步 Contrast / Concession", "t": "admittedly", "p": "(adv.)", "e": "used to agree that something bad or different is true", "z": "不可否認地（讓步）", "s": "Our class trip to the zoo was a lot of fun. _____, it rained in the morning, but the sun came out after lunch.", "c": "我們班去動物園的校外教學很好玩。【不可否認地】，早上下了雨，但午餐後太陽就出來了。", "f": "Our class trip to the zoo was a lot of fun. Admittedly, it rained in the morning, but the sun came out after lunch."}, {"g": "對比／讓步 Contrast / Concession", "t": "albeit", "p": "(conj.)", "e": "used to add a small point that makes the first part less strong", "z": "雖然；儘管（讓步）（正式用語）", "s": "After many hard weeks, Tom finally finished his science report, _____ two days after the teacher's deadline.", "c": "經過好幾個辛苦的星期，Tom 終於完成了他的自然報告，【雖然】比老師規定的期限晚了兩天。", "f": "After many hard weeks, Tom finally finished his science report, albeit two days after the teacher's deadline."}, {"g": "對比／讓步 Contrast / Concession", "t": "alternatively", "p": "(adv.)", "e": "used to give another choice", "z": "或者；另一個選擇是（替代）", "s": "We can take the MRT to the museum on Saturday. _____, we can ride our bikes there if the weather is nice.", "c": "星期六我們可以搭捷運去博物館。【或者】，如果天氣好，我們也可以騎腳踏車去。", "f": "We can take the MRT to the museum on Saturday. Alternatively, we can ride our bikes there if the weather is nice."}, {"g": "對比／讓步 Contrast / Concession", "t": "although + 子句", "p": "(conj.)", "e": "used to show that the second part is surprising after the first part", "z": "雖然（讓步）", "s": "_____ Amy was very tired after school, she still finished all her homework before dinner.", "c": "【雖然】Amy 放學後非常累，她還是在晚餐前寫完了所有作業。", "f": "Although Amy was very tired after school, she still finished all her homework before dinner."}, {"g": "對比／讓步 Contrast / Concession", "t": "and yet", "p": "(conj.phr.)", "e": "used to add a surprising or opposite idea", "z": "然而；卻（對比）", "s": "Ben studied for the English test for only one hour, _____ _____ he got the highest score in the class.", "c": "Ben 只花了一個小時準備英文考試，【卻】拿到了全班最高分。", "f": "Ben studied for the English test for only one hour, and yet he got the highest score in the class."}, {"g": "對比／讓步 Contrast / Concession", "t": "conversely", "p": "(adv.)", "e": "used to show the opposite situation", "z": "相反地（對比）（正式用語）", "s": "In summer, many people in Taiwan buy cold drinks and ice cream. _____, in winter, they buy more hot soup and hot tea.", "c": "在夏天，台灣很多人買冷飲和冰淇淋。【相反地】，在冬天，他們會買比較多熱湯和熱茶。", "f": "In summer, many people in Taiwan buy cold drinks and ice cream. Conversely, in winter, they buy more hot soup and hot tea."}, {"g": "對比／讓步 Contrast / Concession", "t": "despite / in spite of + N/V-ing", "p": "(prep.) / (prep.phr.)", "e": "used to show that something happens even with a problem", "z": "儘管；雖然（讓步）", "s": "_____ the heavy rain, all the students still played soccer on the school field after class.", "c": "【儘管】下著大雨，所有學生放學後還是在學校操場踢足球。", "f": "Despite the heavy rain, all the students still played soccer on the school field after class."}, {"g": "對比／讓步 Contrast / Concession", "t": "differing from + N", "p": "(prep.phr.)", "e": "used to show how one person or thing is not the same as another", "z": "與……不同（對比）", "s": "Most students in my class take the bus to school. _____ _____ them, Lily walks to school every day because she lives near it.", "c": "我們班大部分學生搭公車上學。【與】他們【不同】，Lily 每天走路上學，因為她住得很近。", "f": "Most students in my class take the bus to school. Differing from them, Lily walks to school every day because she lives near it."}, {"g": "對比／讓步 Contrast / Concession", "t": "even so", "p": "(adv.phr.)", "e": "used to show a surprising result after a problem", "z": "即使如此（讓步）", "s": "The math test was very difficult, and many students did not finish it. _____ _____, Jack got a good score.", "c": "數學考試非常難，很多學生都沒寫完。【即使如此】，Jack 還是考得很好。", "f": "The math test was very difficult, and many students did not finish it. Even so, Jack got a good score."}, {"g": "對比／讓步 Contrast / Concession", "t": "even though + 子句", "p": "(conj.phr.)", "e": "used to show that something happens even with a problem", "z": "即使；雖然（讓步）", "s": "_____ _____ it was very cold this morning, my little brother did not want to wear his jacket to school.", "c": "【即使】今天早上很冷，我弟弟還是不想穿外套去上學。", "f": "Even though it was very cold this morning, my little brother did not want to wear his jacket to school."}, {"g": "對比／讓步 Contrast / Concession", "t": "granted", "p": "(adv.)", "e": "used to agree that a point is true before giving a different idea", "z": "誠然；就算如此（讓步）", "s": "My dad wants to buy the new phone because it has a great camera. _____, it is very expensive, but he thinks it is worth the money.", "c": "我爸爸想買那支新手機，因為它的相機很棒。【誠然】，它很貴，但他覺得很值得。", "f": "My dad wants to buy the new phone because it has a great camera. Granted, it is very expensive, but he thinks it is worth the money."}, {"g": "對比／讓步 Contrast / Concession", "t": "however", "p": "(adv.)", "e": "used to show a different or opposite idea", "z": "然而（對比）", "s": "Mia wanted to go to the night market with her friends on Friday. _____, her mom said she had to stay home and study.", "c": "Mia 星期五想和朋友去夜市。【然而】，她媽媽說她必須待在家讀書。", "f": "Mia wanted to go to the night market with her friends on Friday. However, her mom said she had to stay home and study."}, {"g": "對比／讓步 Contrast / Concession", "t": "in contrast", "p": "(adv.phr.)", "e": "used to show that two things are very different", "z": "相比之下；對照之下（對比）", "s": "My sister's room is always clean and tidy. _____ _____, my room is full of books, clothes, and toys on the floor.", "c": "我姊姊的房間總是乾淨整齊。【相比之下】，我的房間地上堆滿了書、衣服和玩具。", "f": "My sister's room is always clean and tidy. In contrast, my room is full of books, clothes, and toys on the floor."}, {"g": "對比／讓步 Contrast / Concession", "t": "instead", "p": "(adv.)", "e": "used to show what happens in place of another thing", "z": "反而；取而代之（替代）", "s": "We planned to have a picnic in the park on Sunday, but it rained all day. _____, we stayed home and watched a movie together.", "c": "我們本來計畫星期天去公園野餐，但下了一整天的雨。【取而代之】，我們待在家一起看電影。", "f": "We planned to have a picnic in the park on Sunday, but it rained all day. Instead, we stayed home and watched a movie together."}, {"g": "對比／讓步 Contrast / Concession", "t": "it could also be said that", "p": "(adv.phr.)", "e": "used to give another way to look at an idea", "z": "也可以說（對比）", "s": "Many people say that cell phones are bad for students. _____ _____ _____ _____ _____ _____ cell phones help students find information quickly.", "c": "很多人說手機對學生不好。【也可以說】，手機能幫助學生很快找到資料。", "f": "Many people say that cell phones are bad for students. It could also be said that cell phones help students find information quickly."}, {"g": "對比／讓步 Contrast / Concession", "t": "nevertheless", "p": "(adv.)", "e": "used to show that something still happens after a problem", "z": "儘管如此；然而（讓步）（正式用語）", "s": "The mountain path was long and steep. _____, all the students kept walking and reached the top before noon.", "c": "山路又長又陡。【儘管如此】，所有學生都繼續走，並在中午前到達山頂。", "f": "The mountain path was long and steep. Nevertheless, all the students kept walking and reached the top before noon."}, {"g": "對比／讓步 Contrast / Concession", "t": "notwithstanding + N", "p": "(prep.)", "e": "used to show that something happens even with a problem", "z": "儘管（讓步）（正式用語）", "s": "_____ the long bus ride, all the students enjoyed their school trip to Kenting very much.", "c": "【儘管】坐了很久的公車，所有學生都非常喜歡這次去墾丁的校外教學。", "f": "Notwithstanding the long bus ride, all the students enjoyed their school trip to Kenting very much."}, {"g": "對比／讓步 Contrast / Concession", "t": "nonetheless", "p": "(adv.)", "e": "used to show that something still happens after a problem", "z": "儘管如此（讓步）（正式用語）", "s": "Grandpa is eighty years old and has a bad leg. _____, he takes a walk in the park every morning.", "c": "爺爺八十歲了，腿也不好。【儘管如此】，他每天早上都會去公園散步。", "f": "Grandpa is eighty years old and has a bad leg. Nonetheless, he takes a walk in the park every morning."}, {"g": "對比／讓步 Contrast / Concession", "t": "on the contrary", "p": "(adv.phr.)", "e": "used to say the opposite is true", "z": "正好相反（對比）", "s": "My brother is not lazy at all. _____ _____ _____, he gets up at six every morning to clean the house and walk the dog.", "c": "我哥哥一點都不懶惰。【正好相反】，他每天早上六點起床打掃家裡和遛狗。", "f": "My brother is not lazy at all. On the contrary, he gets up at six every morning to clean the house and walk the dog."}, {"g": "對比／讓步 Contrast / Concession", "t": "on the one hand", "p": "(adv.phr.)", "e": "used to give the first side of an idea", "z": "一方面（對比）", "s": "_____ _____ _____ _____, living in a big city is convenient because there are many stores and MRT stations. On the other hand, it is often noisy and crowded.", "c": "【一方面】，住在大城市很方便，因為有很多商店和捷運站。另一方面，那裡常常又吵又擠。", "f": "On the one hand, living in a big city is convenient because there are many stores and MRT stations. On the other hand, it is often noisy and crowded."}, {"g": "對比／讓步 Contrast / Concession", "t": "on the other hand", "p": "(adv.phr.)", "e": "used to give the other side of an idea", "z": "另一方面（對比）", "s": "Living in the countryside is quiet, and the air is fresh. _____ _____ _____ _____, there are not many stores, and the buses do not come often.", "c": "住在鄉下很安靜，空氣也很新鮮。【另一方面】，那裡商店不多，公車也不常來。", "f": "Living in the countryside is quiet, and the air is fresh. On the other hand, there are not many stores, and the buses do not come often."}, {"g": "對比／讓步 Contrast / Concession", "t": "otherwise", "p": "(adv.)", "e": "used to show what will happen if you do not do something", "z": "否則；不然（條件對比）", "s": "You should bring an umbrella to school today. _____, you will get wet when it rains this afternoon.", "c": "你今天應該帶雨傘去學校。【否則】，下午下雨時你會淋濕。", "f": "You should bring an umbrella to school today. Otherwise, you will get wet when it rains this afternoon."}, {"g": "對比／讓步 Contrast / Concession", "t": "rather", "p": "(adv.)", "e": "used to give the true or opposite idea after a negative", "z": "反而；而是（對比）", "s": "Lisa did not feel sad when she lost the game. _____, she felt happy because she had tried her best.", "c": "Lisa 輸了比賽並不難過。【反而】，她很開心，因為她已經盡力了。", "f": "Lisa did not feel sad when she lost the game. Rather, she felt happy because she had tried her best."}, {"g": "對比／讓步 Contrast / Concession", "t": "regardless of + N", "p": "(prep.phr.)", "e": "used to show that something does not change a plan or action", "z": "不管；不論（讓步）", "s": "Our basketball team practices every afternoon. We practice outside _____ _____ the weather, even on very hot or rainy days.", "c": "我們籃球隊每天下午都練球。【不管】天氣如何，我們都在戶外練習，即使是很熱或下雨的日子。", "f": "Our basketball team practices every afternoon. We practice outside regardless of the weather, even on very hot or rainy days."}, {"g": "對比／讓步 Contrast / Concession", "t": "still", "p": "(adv.)", "e": "used to show that something continues after a problem", "z": "仍然；還是（讓步）", "s": "The math problem was very hard, and I asked my teacher for help twice. I _____ could not find the right answer.", "c": "這題數學很難，我問了老師兩次。我【還是】找不到正確答案。", "f": "The math problem was very hard, and I asked my teacher for help twice. I still could not find the right answer."}, {"g": "對比／讓步 Contrast / Concession", "t": "unlike + N", "p": "(prep.)", "e": "used to show that two people or things are different", "z": "不像；與……不同（對比）", "s": "_____ his older brother, who loves sports, Kevin likes to stay home and read books or draw pictures.", "c": "【不像】熱愛運動的哥哥，Kevin 喜歡待在家看書或畫畫。", "f": "Unlike his older brother, who loves sports, Kevin likes to stay home and read books or draw pictures."}, {"g": "對比／讓步 Contrast / Concession", "t": "whereas + 子句", "p": "(conj.)", "e": "used to compare two different facts", "z": "然而；而（對比）（正式用語）", "s": "My father likes to drink hot coffee every morning, _____ my mother always drinks a glass of cold milk.", "c": "我爸爸每天早上喜歡喝熱咖啡，【而】我媽媽總是喝一杯冰牛奶。", "f": "My father likes to drink hot coffee every morning, whereas my mother always drinks a glass of cold milk."}, {"g": "強調 Emphasis", "t": "above all", "p": "(adv.phr.)", "e": "used to show the most important point", "z": "最重要的是（強調）", "s": "A good student should be kind and work hard. _____ _____, he or she should always be honest with teachers and friends.", "c": "好學生應該善良又努力。【最重要的是】，他或她應該永遠對老師和朋友誠實。", "f": "A good student should be kind and work hard. Above all, he or she should always be honest with teachers and friends."}, {"g": "強調 Emphasis", "t": "especially", "p": "(adv.)", "e": "used to point out one thing more than others", "z": "尤其；特別（強調）", "s": "My family loves all kinds of fruit in summer. My little brother _____ likes watermelon, and he eats it every day.", "c": "我們家夏天喜歡吃各種水果。我弟弟【尤其】喜歡西瓜，他每天都吃。", "f": "My family loves all kinds of fruit in summer. My little brother especially likes watermelon, and he eats it every day."}, {"g": "強調 Emphasis", "t": "in fact", "p": "(adv.phr.)", "e": "used to add a stronger, true point", "z": "事實上（強調）", "s": "Jenny is not just good at math. _____ _____, she got the highest score in our whole school last month.", "c": "Jenny 不只是數學好而已。【事實上】，她上個月拿到全校最高分。", "f": "Jenny is not just good at math. In fact, she got the highest score in our whole school last month."}, {"g": "強調 Emphasis", "t": "in particular", "p": "(adv.phr.)", "e": "used to point out one special person or thing", "z": "尤其；特別是（強調）", "s": "Everyone in my class enjoyed the school trip to the zoo. Amy, _____ _____, loved watching the pandas eat bamboo for an hour.", "c": "我們班每個人都很喜歡去動物園的校外教學。【尤其是】Amy，她看貓熊吃竹子看了一個小時。", "f": "Everyone in my class enjoyed the school trip to the zoo. Amy, in particular, loved watching the pandas eat bamboo for an hour."}, {"g": "強調 Emphasis", "t": "indeed", "p": "(adv.)", "e": "used to say that something is really true", "z": "確實；的確（強調）（正式用語）", "s": "The teacher said the test would be hard. It was _____ very difficult, and many students could not finish it on time.", "c": "老師說這次考試會很難。考試【的確】非常難，很多學生沒辦法準時寫完。", "f": "The teacher said the test would be hard. It was indeed very difficult, and many students could not finish it on time."}, {"g": "強調 Emphasis", "t": "particularly", "p": "(adv.)", "e": "used to point out one thing more than others", "z": "特別；尤其（強調）", "s": "I like all of my classes this year. I am _____ interested in science because we do fun experiments every week.", "c": "我喜歡今年所有的課。我【特別】對自然課有興趣，因為我們每週都做有趣的實驗。", "f": "I like all of my classes this year. I am particularly interested in science because we do fun experiments every week."}, {"g": "舉例 Example / Illustration", "t": "as an example", "p": "(adv.phr.)", "e": "used to give an example", "z": "舉例來說（舉例）", "s": "There are many ways to save water at home. _____ _____ _____, you can turn off the tap while you brush your teeth.", "c": "在家有很多省水的方法。【舉例來說】，你可以在刷牙時把水龍頭關掉。", "f": "There are many ways to save water at home. As an example, you can turn off the tap while you brush your teeth."}, {"g": "舉例 Example / Illustration", "t": "as an illustration", "p": "(adv.phr.)", "e": "used to give an example that shows an idea", "z": "舉例說明（舉例）（正式用語）", "s": "Exercise can help you feel happier. _____ _____ _____, my father always smiles more after he goes jogging in the park.", "c": "運動可以讓你更快樂。【舉例說明】，我爸爸每次去公園慢跑後都笑得更多。", "f": "Exercise can help you feel happier. As an illustration, my father always smiles more after he goes jogging in the park."}, {"g": "舉例 Example / Illustration", "t": "chiefly", "p": "(adv.)", "e": "used to show the main example or reason", "z": "主要地（舉例／說明重點）（正式用語）", "s": "Students in our reading club read many kinds of books. They _____ read comic books and short stories, but sometimes they read science books too.", "c": "我們讀書社的學生讀很多種書。他們【主要】讀漫畫和短篇故事，但有時候也讀科學書。", "f": "Students in our reading club read many kinds of books. They chiefly read comic books and short stories, but sometimes they read science books too."}, {"g": "舉例 Example / Illustration", "t": "for example", "p": "(adv.phr.)", "e": "used to give an example", "z": "例如；舉例來說（舉例）", "s": "Taipei has many great places to visit. _____ _____, you can go to Taipei 101 or walk around the night markets.", "c": "台北有很多很棒的地方可以去。【例如】，你可以去台北101，或是逛逛夜市。", "f": "Taipei has many great places to visit. For example, you can go to Taipei 101 or walk around the night markets."}, {"g": "舉例 Example / Illustration", "t": "for instance", "p": "(adv.phr.)", "e": "used to give an example", "z": "例如（舉例）", "s": "Some animals sleep during the day. _____ _____, owls sleep in the daytime and look for food at night.", "c": "有些動物在白天睡覺。【例如】，貓頭鷹白天睡覺，晚上才出來找食物。", "f": "Some animals sleep during the day. For instance, owls sleep in the daytime and look for food at night."}, {"g": "舉例 Example / Illustration", "t": "illustrated by + N", "p": "(prep.phr.)", "e": "used to show an idea with an example", "z": "以…為例說明（舉例）（正式用語）", "s": "Kindness can change someone's day, as _____ _____ the way Tom helped a lost little girl find her mother at the station.", "c": "善意可以改變一個人的一天，【就像】Tom 在車站幫一個迷路的小女孩找到媽媽【所說明的那樣】。", "f": "Kindness can change someone's day, as illustrated by the way Tom helped a lost little girl find her mother at the station."}, {"g": "舉例 Example / Illustration", "t": "in particular", "p": "(adv.phr.)", "e": "used to give one special example", "z": "尤其是；特別是（舉例）", "s": "Many fruits are good for your health. Oranges, _____ _____, have a lot of vitamin C and can help you stay healthy.", "c": "很多水果對健康很好。【特別是】柳橙，含有很多維他命C，可以幫助你保持健康。", "f": "Many fruits are good for your health. Oranges, in particular, have a lot of vitamin C and can help you stay healthy."}, {"g": "舉例 Example / Illustration", "t": "in the/this case", "p": "(adv.phr.)", "e": "used to talk about one situation or example", "z": "在這種情況下（舉例／說明情況）", "s": "Sometimes it rains heavily during PE class. _____ _____ _____, the students play table tennis in the gym instead of running outside.", "c": "有時候體育課會下大雨。【在這種情況下】，學生們會在體育館打桌球，而不是在外面跑步。", "f": "Sometimes it rains heavily during PE class. In this case, the students play table tennis in the gym instead of running outside."}, {"g": "舉例 Example / Illustration", "t": "including + N", "p": "(prep.)", "e": "used to give examples that are part of a group", "z": "包括（舉例）", "s": "Mom bought a lot of food for the birthday party, _____ cake, fried chicken, and three big bottles of juice.", "c": "媽媽為生日派對買了很多食物，【包括】蛋糕、炸雞和三大瓶果汁。", "f": "Mom bought a lot of food for the birthday party, including cake, fried chicken, and three big bottles of juice."}, {"g": "舉例 Example / Illustration", "t": "markedly", "p": "(adv.)", "e": "used to show a big and clear change", "z": "明顯地（說明程度）（正式用語）", "s": "Lily practiced speaking English every night for three months. Her speaking became _____ better, and her teacher was very surprised.", "c": "Lily 每天晚上練習說英文，練了三個月。她的口說【明顯地】進步了，老師非常驚訝。", "f": "Lily practiced speaking English every night for three months. Her speaking became markedly better, and her teacher was very surprised."}, {"g": "舉例 Example / Illustration", "t": "namely", "p": "(adv.)", "e": "used to name the exact people or things", "z": "也就是；即（舉例說明）（正式用語）", "s": "Two students from our class won prizes in the English speech contest, _____ Kevin and Mary.", "c": "我們班有兩位同學在英語演講比賽得獎，【也就是】Kevin 和 Mary。", "f": "Two students from our class won prizes in the English speech contest, namely Kevin and Mary."}, {"g": "舉例 Example / Illustration", "t": "notably", "p": "(adv.)", "e": "used to point out an important example", "z": "尤其是；特別是（舉例）（正式用語）", "s": "Many important guests came to our school's birthday party, _____ the mayor of Taipei, who gave a short speech.", "c": "很多重要的來賓來參加我們學校的校慶，【尤其是】台北市長，他還做了簡短的致詞。", "f": "Many important guests came to our school's birthday party, notably the mayor of Taipei, who gave a short speech."}, {"g": "舉例 Example / Illustration", "t": "on this occasion", "p": "(adv.phr.)", "e": "used to talk about one special time", "z": "這一次（舉例說明特定時候）", "s": "Dad usually cooks dinner for our family on Sundays. _____ _____ _____, Mom made dinner because Dad was sick in bed.", "c": "爸爸通常在星期天幫全家煮晚餐。【這一次】，因為爸爸生病躺在床上，所以媽媽煮了晚餐。", "f": "Dad usually cooks dinner for our family on Sundays. On this occasion, Mom made dinner because Dad was sick in bed."}, {"g": "舉例 Example / Illustration", "t": "specifically", "p": "(adv.)", "e": "used to give more exact details", "z": "具體來說（舉例說明）", "s": "The teacher asked us to bring something for art class. _____, she wanted us to bring old newspapers and some glue.", "c": "老師要我們帶東西來上美術課。【具體來說】，她要我們帶舊報紙和一些膠水。", "f": "The teacher asked us to bring something for art class. Specifically, she wanted us to bring old newspapers and some glue."}, {"g": "舉例 Example / Illustration", "t": "such as + N", "p": "(prep.phr.)", "e": "used to give examples", "z": "例如；像是（舉例）", "s": "Our school has many after-school clubs, _____ _____ the dance club, the chess club, and the robot club.", "c": "我們學校有很多課後社團，【像是】舞蹈社、西洋棋社和機器人社。", "f": "Our school has many after-school clubs, such as the dance club, the chess club, and the robot club."}, {"g": "舉例 Example / Illustration", "t": "to demonstrate", "p": "(adv.phr.)", "e": "used to show how something works with an example", "z": "為了示範；為了證明（舉例說明）", "s": "Our science teacher wanted to show us that air takes up space. _____ _____, she put an empty cup upside down into a bowl of water.", "c": "我們的自然老師想讓我們知道空氣會佔空間。【為了示範】，她把一個空杯子倒過來放進一碗水裡。", "f": "Our science teacher wanted to show us that air takes up space. To demonstrate, she put an empty cup upside down into a bowl of water."}, {"g": "舉例 Example / Illustration", "t": "to illustrate", "p": "(adv.phr.)", "e": "used to give an example that explains an idea", "z": "舉例來說明（舉例）", "s": "Small actions can help protect the earth. _____ _____, if every student brings a water bottle, our school can use thousands fewer plastic cups each year.", "c": "小小的行動就能幫忙保護地球。【舉例來說明】，如果每個學生都帶水壺，我們學校每年就能少用好幾千個塑膠杯。", "f": "Small actions can help protect the earth. To illustrate, if every student brings a water bottle, our school can use thousands fewer plastic cups each year."}, {"g": "延伸說明 Extension", "t": "after all", "p": "(adv.phr.)", "e": "used to give an important reason to remember", "z": "畢竟（補充說明）", "s": "You should not be too angry with your little sister. _____ _____, she is only five years old and did not mean to break your toy.", "c": "你不應該對妹妹太生氣。【畢竟】，她才五歲，而且她不是故意弄壞你的玩具的。", "f": "You should not be too angry with your little sister. After all, she is only five years old and did not mean to break your toy."}, {"g": "延伸說明 Extension", "t": "all things considered", "p": "(adv.phr.)", "e": "used to give a final opinion after thinking about everything", "z": "整體考量下（總結）", "s": "The hotel was small and a little old. _____ _____ _____, we still had a great family trip because the beach was beautiful.", "c": "那間飯店又小又有點舊。【整體考量下】，我們全家的旅行還是很棒，因為海灘很美。", "f": "The hotel was small and a little old. All things considered, we still had a great family trip because the beach was beautiful."}, {"g": "延伸說明 Extension", "t": "at the same time", "p": "(adv.phr.)", "e": "used to add another side of an idea", "z": "同時；但另一方面（補充／延伸）", "s": "Playing video games can be fun and relaxing. _____ _____ _____ _____, playing for too long can hurt your eyes and your grades.", "c": "打電動可以很好玩又放鬆。【同時】，玩太久會傷害你的眼睛和成績。", "f": "Playing video games can be fun and relaxing. At the same time, playing for too long can hurt your eyes and your grades."}, {"g": "延伸說明 Extension", "t": "clearly", "p": "(adv.)", "e": "used to show that something is easy to see or understand", "z": "顯然（延伸推論）", "s": "Ben's face turned red, and he could not look at the teacher. _____, he had forgotten to do his homework again.", "c": "Ben 的臉變紅了，而且他不敢看老師。【顯然】，他又忘記寫功課了。", "f": "Ben's face turned red, and he could not look at the teacher. Clearly, he had forgotten to do his homework again."}, {"g": "延伸說明 Extension", "t": "in brief", "p": "(adv.phr.)", "e": "used to say something in a few words", "z": "簡言之（總結）", "s": "The movie was very long, but the story was simple. _____ _____, a brave boy saves his town from a terrible dragon.", "c": "那部電影很長，但故事很簡單。【簡言之】，一個勇敢的男孩從可怕的龍手中救了他的小鎮。", "f": "The movie was very long, but the story was simple. In brief, a brave boy saves his town from a terrible dragon."}, {"g": "延伸說明 Extension", "t": "in essence", "p": "(adv.phr.)", "e": "used to give the most basic or main idea", "z": "本質上；基本上（總結重點）（正式用語）", "s": "The teacher talked about many rules for the school trip. _____ _____, she wanted us to stay safe and stay with our group.", "c": "老師講了很多校外教學的規定。【基本上】，她希望我們注意安全，並且跟著自己的小組。", "f": "The teacher talked about many rules for the school trip. In essence, she wanted us to stay safe and stay with our group."}, {"g": "延伸說明 Extension", "t": "in fact", "p": "(adv.phr.)", "e": "used to give more true information about an idea", "z": "事實上（延伸說明）", "s": "At first, I thought the new student was shy. _____ _____, she is very friendly and has already made many friends in our class.", "c": "一開始我以為新同學很害羞。【事實上】，她非常友善，而且已經在我們班交到很多朋友了。", "f": "At first, I thought the new student was shy. In fact, she is very friendly and has already made many friends in our class."}, {"g": "延伸說明 Extension", "t": "in other words", "p": "(adv.phr.)", "e": "used to say the same idea in another way", "z": "換句話說（重新說明）", "s": "Our teacher said, \"Your homework must be on my desk before eight tomorrow morning.\" _____ _____ _____, we cannot be late with our homework.", "c": "老師說：「你們的作業明天早上八點前一定要放在我桌上。」【換句話說】，我們交作業不能遲到。", "f": "Our teacher said, \"Your homework must be on my desk before eight tomorrow morning.\" In other words, we cannot be late with our homework."}, {"g": "延伸說明 Extension", "t": "in short", "p": "(adv.phr.)", "e": "used to give a short summary", "z": "總之；簡單來說（總結）", "s": "We missed the bus, it started to rain, and I lost my umbrella. _____ _____, it was a really bad morning for me.", "c": "我們錯過了公車，又開始下雨，我還弄丟了雨傘。【總之】，那是我很糟的一個早上。", "f": "We missed the bus, it started to rain, and I lost my umbrella. In short, it was a really bad morning for me."}, {"g": "延伸說明 Extension", "t": "indeed", "p": "(adv.)", "e": "used to show that something said before is really true", "z": "確實；的確（延伸證實）（正式用語）", "s": "Grandma said the night market would be crowded on Saturday. _____, there were so many people that we could hardly walk.", "c": "奶奶說星期六夜市會很擠。【的確】，人多到我們幾乎走不動。", "f": "Grandma said the night market would be crowded on Saturday. Indeed, there were so many people that we could hardly walk."}, {"g": "延伸說明 Extension", "t": "it seems", "p": "(adv.phr.)", "e": "used to say what looks true from what we see", "z": "看來；似乎（延伸推論）", "s": "The sky is getting dark, and the wind is very strong. _____ _____ that a big storm is coming to our city tonight.", "c": "天空越來越暗，風也很大。【看來】今晚會有一場大暴風雨來到我們的城市。", "f": "The sky is getting dark, and the wind is very strong. It seems that a big storm is coming to our city tonight."}, {"g": "延伸說明 Extension", "t": "namely", "p": "(adv.)", "e": "used to explain exactly what you mean", "z": "也就是（進一步說明）（正式用語）", "s": "There is one important thing you must remember before every test, _____ to write your name on the answer sheet.", "c": "每次考試前有一件重要的事你一定要記得，【也就是】在答案卷上寫上你的名字。", "f": "There is one important thing you must remember before every test, namely to write your name on the answer sheet."}, {"g": "延伸說明 Extension", "t": "naturally", "p": "(adv.)", "e": "used to show that something is expected", "z": "自然地；理所當然（延伸結果）", "s": "Kevin stayed up late playing games the night before the test. _____, he felt very tired and could not focus in class.", "c": "Kevin 考試前一晚熬夜打電動。【理所當然】，他覺得很累，上課也無法專心。", "f": "Kevin stayed up late playing games the night before the test. Naturally, he felt very tired and could not focus in class."}, {"g": "延伸說明 Extension", "t": "of course", "p": "(adv.phr.)", "e": "used to show that something is easy to expect", "z": "當然（延伸說明）", "s": "Tim worked hard on his science project for many weeks. _____ _____, he was very happy when he won first prize.", "c": "Tim 花了好幾個星期認真做他的科展作品。【當然】，他得到第一名時非常開心。", "f": "Tim worked hard on his science project for many weeks. Of course, he was very happy when he won first prize."}, {"g": "延伸說明 Extension", "t": "on the whole", "p": "(adv.phr.)", "e": "used to give a general opinion", "z": "大體上；整體來說（總結）", "s": "There were a few small problems during our class trip. _____ _____ _____, everyone had a good time and wanted to go again.", "c": "我們的班級旅行有一些小問題。【整體來說】，大家都玩得很開心，還想再去一次。", "f": "There were a few small problems during our class trip. On the whole, everyone had a good time and wanted to go again."}, {"g": "延伸說明 Extension", "t": "that is", "p": "(adv.phr.)", "e": "used to explain something more exactly", "z": "也就是說（進一步說明）", "s": "Please finish your science report before the weekend, _____ _____, by Friday afternoon at the latest.", "c": "請在週末前完成你的自然報告，【也就是說】，最晚星期五下午要完成。", "f": "Please finish your science report before the weekend, that is, by Friday afternoon at the latest."}, {"g": "延伸說明 Extension", "t": "that is to say", "p": "(adv.phr.)", "e": "used to explain an idea in another way", "z": "也就是說（重新說明）（正式用語）", "s": "My cousin has been a vegetarian for five years. _____ _____ _____ _____, he does not eat any meat or fish at all.", "c": "我表哥吃素已經五年了。【也就是說】，他完全不吃任何肉或魚。", "f": "My cousin has been a vegetarian for five years. That is to say, he does not eat any meat or fish at all."}, {"g": "延伸說明 Extension", "t": "to be sure", "p": "(adv.phr.)", "e": "used to agree that one point is true before adding another", "z": "誠然；的確（讓步延伸）（正式用語）", "s": "Many students complain about our school lunch. _____ _____ _____, it is not always delicious, but it is healthy and cheap.", "c": "很多學生抱怨我們學校的午餐。【的確】，它不一定都好吃，但它很健康又便宜。", "f": "Many students complain about our school lunch. To be sure, it is not always delicious, but it is healthy and cheap."}, {"g": "延伸說明 Extension", "t": "to put it differently", "p": "(adv.phr.)", "e": "used to say the same idea in another way", "z": "換個說法（重新說明）", "s": "Mr. Lin said, \"Do not judge a book by its cover.\" _____ _____ _____ _____, we should not decide what people are like just by their looks.", "c": "林老師說：「不要以貌取書。」【換個說法】，我們不應該只看外表就決定一個人是怎樣的人。", "f": "Mr. Lin said, \"Do not judge a book by its cover.\" To put it differently, we should not decide what people are like just by their looks."}, {"g": "順序 Sequence", "t": "after", "p": "(conj.)", "e": "used to show that one thing happens later than another", "z": "在…之後（順序）", "s": "Mom says we can watch TV for one hour _____ we finish our homework and clean our rooms.", "c": "媽媽說我們【在】寫完功課、打掃完房間【之後】，可以看一個小時的電視。", "f": "Mom says we can watch TV for one hour after we finish our homework and clean our rooms."}, {"g": "順序 Sequence", "t": "at that time", "p": "(adv.phr.)", "e": "used to talk about a time in the past", "z": "那時候（時間順序）", "s": "My family lived in a small village in Nantou ten years ago. _____ _____ _____, there was no convenience store near our house.", "c": "十年前我們家住在南投的一個小村莊。【那時候】，我們家附近沒有便利商店。", "f": "My family lived in a small village in Nantou ten years ago. At that time, there was no convenience store near our house."}, {"g": "順序 Sequence", "t": "before", "p": "(conj.)", "e": "used to show that one thing happens earlier than another", "z": "在…之前（順序）", "s": "My little brother always brushes his teeth and reads a short story _____ he goes to bed at night.", "c": "我弟弟晚上【睡覺之前】總是會刷牙，並讀一個短篇故事。", "f": "My little brother always brushes his teeth and reads a short story before he goes to bed at night."}, {"g": "順序 Sequence", "t": "concurrently", "p": "(adv.)", "e": "used to show that two things happen at the same time", "z": "同時（時間順序）（正式用語）", "s": "Mia is taking piano lessons every Saturday morning this year. _____, she is also learning to swim at the sports center.", "c": "Mia 今年每個星期六早上都在上鋼琴課。【同時】，她也在運動中心學游泳。", "f": "Mia is taking piano lessons every Saturday morning this year. Concurrently, she is also learning to swim at the sports center."}, {"g": "順序 Sequence", "t": "finally", "p": "(adv.)", "e": "used to show the last step or event", "z": "最後（順序）", "s": "First, we cleaned the classroom, and then we put up the posters. _____, we hung colorful balloons for the Christmas party.", "c": "首先，我們打掃了教室，接著貼上海報。【最後】，我們為聖誕派對掛上彩色氣球。", "f": "First, we cleaned the classroom, and then we put up the posters. Finally, we hung colorful balloons for the Christmas party."}, {"g": "順序 Sequence", "t": "followed by + N", "p": "(prep.phr.)", "e": "used to show what comes next", "z": "接著是（順序）", "s": "Our school sports day began with a short speech by the principal, _____ _____ a relay race between all the classes.", "c": "我們學校的運動會以校長的簡短致詞開始，【接著是】各班之間的大隊接力。", "f": "Our school sports day began with a short speech by the principal, followed by a relay race between all the classes."}, {"g": "順序 Sequence", "t": "first / second / third", "p": "(adv.)", "e": "used to list steps in order", "z": "第一／第二／第三（順序）", "s": "There are three easy steps to make a cup of tea. _____, boil some water. Second, put a tea bag in a cup. Third, pour in the hot water.", "c": "泡一杯茶有三個簡單的步驟。【第一】，把水煮開。第二，把茶包放進杯子。第三，倒入熱水。", "f": "There are three easy steps to make a cup of tea. First, boil some water. Second, put a tea bag in a cup. Third, pour in the hot water."}, {"g": "順序 Sequence", "t": "initially", "p": "(adv.)", "e": "used to talk about the first step or the beginning", "z": "起初（順序）", "s": "_____, I thought our new math teacher was very strict. Later, I found out that she was really kind and funny.", "c": "【起初】我以為我們的新數學老師很嚴格。後來我發現她其實非常親切又有趣。", "f": "Initially, I thought our new math teacher was very strict. Later, I found out that she was really kind and funny."}, {"g": "順序 Sequence", "t": "next", "p": "(adv.)", "e": "used to show the following step", "z": "接著；下一步（順序）", "s": "First, wash the rice and put it in the pot. _____, add two cups of water and turn on the rice cooker.", "c": "首先，把米洗好放進鍋
