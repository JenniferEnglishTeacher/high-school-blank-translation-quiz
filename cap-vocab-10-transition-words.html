子裡。【接著】，加兩杯水，然後打開電鍋。", "f": "First, wash the rice and put it in the pot. Next, add two cups of water and turn on the rice cooker."}, {"g": "順序 Sequence", "t": "previously", "p": "(adv.)", "e": "used to talk about something that happened before", "z": "先前；以前（順序）", "s": "Mr. Lin teaches English at our school now. _____, he worked as a tour guide in Tainan for five years.", "c": "林老師現在在我們學校教英文。【先前】，他在台南當了五年的導遊。", "f": "Mr. Lin teaches English at our school now. Previously, he worked as a tour guide in Tainan for five years."}, {"g": "順序 Sequence", "t": "subsequently", "p": "(adv.)", "e": "used to show what happened after something", "z": "隨後；後來（順序）（正式用語）", "s": "Amy lost her bike near the park on Monday. _____, a kind old man found it and took it to the police station.", "c": "艾美星期一在公園附近弄丟了腳踏車。【隨後】，一位好心的老先生找到它，並把它送到警察局。", "f": "Amy lost her bike near the park on Monday. Subsequently, a kind old man found it and took it to the police station."}, {"g": "順序 Sequence", "t": "then", "p": "(adv.)", "e": "used to show the next thing that happens", "z": "然後（順序）", "s": "We finished our homework right after dinner. _____, we watched a funny movie together in the living room.", "c": "我們晚餐後馬上寫完功課。【然後】，我們一起在客廳看了一部好笑的電影。", "f": "We finished our homework right after dinner. Then, we watched a funny movie together in the living room."}, {"g": "總結 Summary / Conclusion", "t": "after all", "p": "(adv.phr.)", "e": "used to give a reason that people should remember", "z": "畢竟（總結理由）", "s": "Don't be too angry with Tom about the broken cup. _____ _____, he is only seven years old.", "c": "別因為打破杯子的事對湯姆太生氣。【畢竟】，他才七歲而已。", "f": "Don't be too angry with Tom about the broken cup. After all, he is only seven years old."}, {"g": "總結 Summary / Conclusion", "t": "as a result", "p": "(adv.phr.)", "e": "used to show a result", "z": "結果；因此（結果）", "s": "Jenny studied hard for the English test every night. _____ _____ _____, she got the highest score in her class.", "c": "珍妮每天晚上都認真準備英文考試。【結果】，她拿到了全班最高分。", "f": "Jenny studied hard for the English test every night. As a result, she got the highest score in her class."}, {"g": "總結 Summary / Conclusion", "t": "briefly", "p": "(adv.)", "e": "used to say the main idea in a few words", "z": "簡單來說（總結）", "s": "Our class trip had good food, fun games, and beautiful views. _____, it was the best day of the school year.", "c": "我們的校外教學有好吃的食物、好玩的遊戲和美麗的風景。【簡單來說】，那是這學年最棒的一天。", "f": "Our class trip had good food, fun games, and beautiful views. Briefly, it was the best day of the school year."}, {"g": "總結 Summary / Conclusion", "t": "by and large", "p": "(adv.phr.)", "e": "used to give a general idea of the whole thing", "z": "大體上；整體而言（總結）", "s": "Some students were late, and a few forgot their books. _____ _____ _____, the first week of school went well.", "c": "有些學生遲到，還有幾個人忘了帶書。【大體上】，開學第一週還算順利。", "f": "Some students were late, and a few forgot their books. By and large, the first week of school went well."}, {"g": "總結 Summary / Conclusion", "t": "consequently", "p": "(adv.)", "e": "used to show a result", "z": "因此；所以（結果）", "s": "It rained very heavily all morning. _____, the school sports day was moved to next Friday.", "c": "整個早上都下著大雨。【因此】，學校運動會延到下星期五舉行。", "f": "It rained very heavily all morning. Consequently, the school sports day was moved to next Friday."}, {"g": "總結 Summary / Conclusion", "t": "finally", "p": "(adv.)", "e": "used to give the last point or to end a talk", "z": "最後（總結）", "s": "We have talked about healthy food, enough sleep, and exercise. _____, remember that a happy mind is also important for good health.", "c": "我們已經談過健康飲食、充足睡眠和運動。【最後】，請記得快樂的心情對健康也很重要。", "f": "We have talked about healthy food, enough sleep, and exercise. Finally, remember that a happy mind is also important for good health."}, {"g": "總結 Summary / Conclusion", "t": "hence", "p": "(adv.)", "e": "used to show a result", "z": "因此（結果）（正式用語）", "s": "The school bus broke down on the way to school this morning. _____, many students were late for the first class.", "c": "今天早上校車在上學途中故障了。【因此】，很多學生第一節課都遲到了。", "f": "The school bus broke down on the way to school this morning. Hence, many students were late for the first class."}, {"g": "總結 Summary / Conclusion", "t": "in any case", "p": "(adv.phr.)", "e": "used to say that something is true no matter what happens", "z": "無論如何（總結）", "s": "I'm not sure if it will rain tomorrow afternoon. _____ _____ _____, you should bring an umbrella just to be safe.", "c": "我不確定明天下午會不會下雨。【無論如何】，你都應該帶把傘以防萬一。", "f": "I'm not sure if it will rain tomorrow afternoon. In any case, you should bring an umbrella just to be safe."}, {"g": "總結 Summary / Conclusion", "t": "in any event", "p": "(adv.phr.)", "e": "used to say that something is true no matter what happens", "z": "無論如何（總結）（正式用語）", "s": "We may go to the beach or the zoo on Sunday. _____ _____ _____, we will have a fun day together as a family.", "c": "星期天我們可能去海邊或動物園。【無論如何】，我們全家都會一起度過愉快的一天。", "f": "We may go to the beach or the zoo on Sunday. In any event, we will have a fun day together as a family."}, {"g": "總結 Summary / Conclusion", "t": "in brief", "p": "(adv.phr.)", "e": "used to say the main idea in a few words", "z": "簡言之（總結）", "s": "The movie had great music, funny actors, and an exciting story. _____ _____, it was worth the money.", "c": "那部電影有很棒的音樂、有趣的演員和刺激的故事。【簡言之】，它值回票價。", "f": "The movie had great music, funny actors, and an exciting story. In brief, it was worth the money."}, {"g": "總結 Summary / Conclusion", "t": "in conclusion", "p": "(adv.phr.)", "e": "used to start the last part or main idea", "z": "總之；總而言之（結論）", "s": "Reading helps us learn new words, relax, and understand the world. _____ _____, everyone should read for at least twenty minutes every day.", "c": "閱讀能幫助我們學新單字、放鬆心情，並了解這個世界。【總之】，每個人每天都應該至少閱讀二十分鐘。", "f": "Reading helps us learn new words, relax, and understand the world. In conclusion, everyone should read for at least twenty minutes every day."}, {"g": "總結 Summary / Conclusion", "t": "in short", "p": "(adv.phr.)", "e": "used to say the main idea in a few words", "z": "簡而言之（總結）", "s": "Tim forgot his homework, missed the bus, and lost his wallet. _____ _____, he had a really bad day.", "c": "提姆忘了帶作業、錯過公車，還弄丟了錢包。【簡而言之】，他過了很糟的一天。", "f": "Tim forgot his homework, missed the bus, and lost his wallet. In short, he had a really bad day."}, {"g": "總結 Summary / Conclusion", "t": "in other words", "p": "(adv.phr.)", "e": "used to say the same idea in another, easier way", "z": "換句話說（解釋／總結）", "s": "Our teacher said this quiz will not count toward our final grade. _____ _____ _____, we do not need to worry about it too much.", "c": "老師說這次小考不會算進期末成績。【換句話說】，我們不需要太擔心它。", "f": "Our teacher said this quiz will not count toward our final grade. In other words, we do not need to worry about it too much."}, {"g": "總結 Summary / Conclusion", "t": "in summary", "p": "(adv.phr.)", "e": "used to give a short review of the main points", "z": "總結來說（總結）", "s": "Exercise makes our bodies strong and helps us sleep better at night. _____ _____, it is good for both our bodies and our minds.", "c": "運動讓我們身體強壯，也幫助我們晚上睡得更好。【總結來說】，它對我們的身體和心靈都有好處。", "f": "Exercise makes our bodies strong and helps us sleep better at night. In summary, it is good for both our bodies and our minds."}, {"g": "總結 Summary / Conclusion", "t": "on the whole", "p": "(adv.phr.)", "e": "used to give a general opinion about everything", "z": "整體而言（總結）", "s": "The food at the night market was a little expensive. _____ _____ _____, we enjoyed our evening there very much.", "c": "夜市的食物有點貴。【整體而言】，我們在那裡度過了非常愉快的夜晚。", "f": "The food at the night market was a little expensive. On the whole, we enjoyed our evening there very much."}, {"g": "總結 Summary / Conclusion", "t": "overall", "p": "(adv.)", "e": "used to give a general opinion about everything", "z": "整體來說（總結）", "s": "The hotel room was small, but it was clean and the staff were friendly. _____, we had a pleasant stay in Hualien.", "c": "飯店房間很小，但很乾淨，員工也很友善。【整體來說】，我們在花蓮住得很愉快。", "f": "The hotel room was small, but it was clean and the staff were friendly. Overall, we had a pleasant stay in Hualien."}, {"g": "總結 Summary / Conclusion", "t": "therefore", "p": "(adv.)", "e": "used to show a result", "z": "因此（結果）", "s": "Our family wants to save money for a trip to Japan. _____, we eat at home more often instead of going to restaurants.", "c": "我們家想存錢去日本旅行。【因此】，我們比較常在家吃飯，而不是去餐廳。", "f": "Our family wants to save money for a trip to Japan. Therefore, we eat at home more often instead of going to restaurants."}, {"g": "總結 Summary / Conclusion", "t": "thus", "p": "(adv.)", "e": "used to show a result", "z": "因此；所以（結果）（正式用語）", "s": "Kevin practiced the piano for two hours every day. _____, he played beautifully at the school concert.", "c": "凱文每天練兩個小時的鋼琴。【因此】，他在學校音樂會上彈得非常好。", "f": "Kevin practiced the piano for two hours every day. Thus, he played beautifully at the school concert."}, {"g": "總結 Summary / Conclusion", "t": "to conclude", "p": "(adv.phr.)", "e": "used to start the last part or main idea", "z": "總結來說；最後（結論）", "s": "Cell phones are useful, but they can also hurt our eyes and sleep. _____ _____, we should use them carefully and not too often.", "c": "手機很有用，但也可能傷害我們的眼睛和睡眠。【總結來說】，我們應該小心使用，而且不要太常用。", "f": "Cell phones are useful, but they can also hurt our eyes and sleep. To conclude, we should use them carefully and not too often."}, {"g": "總結 Summary / Conclusion", "t": "to sum up", "p": "(adv.phr.)", "e": "used to give a short review of the main points", "z": "總而言之（總結）", "s": "We need more trash cans, more trees, and less noise in our park. _____ _____ _____, we want a cleaner and quieter park for everyone.", "c": "我們的公園需要更多垃圾桶、更多樹木和更少噪音。【總而言之】，我們希望大家有一個更乾淨、更安靜的公園。", "f": "We need more trash cans, more trees, and less noise in our park. To sum up, we want a cleaner and quieter park for everyone."}, {"g": "總結 Summary / Conclusion", "t": "to summarize", "p": "(adv.phr.)", "e": "used to give a short review of the main points", "z": "總結（總結）", "s": "Dogs are friendly, smart, and good at protecting the house. _____ _____, they make great pets for many families.", "c": "狗狗友善、聰明，又很會看家。【總結】，牠們是許多家庭很棒的寵物。", "f": "Dogs are friendly, smart, and good at protecting the house. To summarize, they make great pets for many families."}, {"g": "總結 Summary / Conclusion", "t": "ultimately", "p": "(adv.)", "e": "used to show the final result after a long time", "z": "最終；最後（總結／結果）", "s": "The students talked about many places for the class trip for a week. _____, they decided to visit the science museum in Taichung.", "c": "學生們花了一個星期討論校外教學要去哪些地方。【最終】，他們決定去參觀台中的科學博物館。", "f": "The students talked about many places for the class trip for a week. Ultimately, they decided to visit the science museum in Taichung."}, {"g": "時間 Time", "t": "after + 子句", "p": "(conj.)", "e": "used to show that one thing happens later than another", "z": "在……之後（時間）", "s": "My little brother always brushes his teeth _____ he eats breakfast. Then he puts on his school uniform and leaves home.", "c": "我弟弟總是【在】吃完早餐【之後】刷牙。然後他會穿上制服出門。", "f": "My little brother always brushes his teeth after he eats breakfast. Then he puts on his school uniform and leaves home."}, {"g": "時間 Time", "t": "afterward", "p": "(adv.)", "e": "used to show something happens later", "z": "之後；後來（時間）", "s": "We cleaned the classroom together on Friday afternoon. _____, our teacher gave everyone a small piece of cake.", "c": "星期五下午我們一起打掃教室。【之後】，老師給了每個人一小塊蛋糕。", "f": "We cleaned the classroom together on Friday afternoon. Afterward, our teacher gave everyone a small piece of cake."}, {"g": "時間 Time", "t": "at length", "p": "(adv.phr.)", "e": "used to say that something happens after a long time", "z": "終於；最後（時間）（正式用語）", "s": "We waited for the bus in the rain for almost an hour. _____ _____, it arrived, and we all got on quickly.", "c": "我們在雨中等公車等了將近一個小時。【終於】，公車來了，我們全都趕快上車。", "f": "We waited for the bus in the rain for almost an hour. At length, it arrived, and we all got on quickly."}, {"g": "時間 Time", "t": "at that/this point", "p": "(adv.phr.)", "e": "used to talk about one exact moment", "z": "就在那時／此時（時間）", "s": "The game was tied, and there was only one minute left. _____ _____ _____, Jason kicked the ball into the goal.", "c": "比賽打成平手，只剩下一分鐘。【就在那時】，傑森把球踢進了球門。", "f": "The game was tied, and there was only one minute left. At that point, Jason kicked the ball into the goal."}, {"g": "時間 Time", "t": "at that/this time", "p": "(adv.phr.)", "e": "used to talk about a time in the past or now", "z": "當時／這時（時間）", "s": "My grandparents moved to Taipei in 1980. _____ _____ _____, there was no MRT, so they took the bus everywhere.", "c": "我的祖父母在1980年搬到台北。【當時】還沒有捷運，所以他們去哪裡都搭公車。", "f": "My grandparents moved to Taipei in 1980. At that time, there was no MRT, so they took the bus everywhere."}, {"g": "時間 Time", "t": "at present", "p": "(adv.phr.)", "e": "used to talk about now", "z": "目前；現在（時間）", "s": "Our school library is closed for repairs this month. _____ _____, students can borrow books from the classroom reading corner.", "c": "我們學校的圖書館這個月整修中暫停開放。【目前】，學生可以向教室裡的閱讀角借書。", "f": "Our school library is closed for repairs this month. At present, students can borrow books from the classroom reading corner."}, {"g": "時間 Time", "t": "at the same time", "p": "(adv.phr.)", "e": "used to show two things happen together", "z": "同時（時間）", "s": "My mom was cooking dinner in the kitchen. _____ _____ _____ _____, my dad was helping my sister with her homework.", "c": "媽媽在廚房煮晚餐。【同時】，爸爸正在幫妹妹寫功課。", "f": "My mom was cooking dinner in the kitchen. At the same time, my dad was helping my sister with her homework."}, {"g": "時間 Time", "t": "before + 子句", "p": "(conj.)", "e": "used to show that one thing happens earlier than another", "z": "在……之前（時間）", "s": "Please wash your hands carefully _____ you eat lunch. There are many germs on the desks and door handles.", "c": "吃午餐【之前】請仔細洗手。桌子和門把上有很多細菌。", "f": "Please wash your hands carefully before you eat lunch. There are many germs on the desks and door handles."}, {"g": "時間 Time", "t": "currently", "p": "(adv.)", "e": "used to talk about now", "z": "目前；現在（時間）", "s": "Ms. Wang is a very busy science teacher. _____, she is teaching three classes and helping with the school science fair.", "c": "王老師是一位非常忙碌的自然老師。【目前】，她正在教三個班，還在幫忙學校的科展。", "f": "Ms. Wang is a very busy science teacher. Currently, she is teaching three classes and helping with the school science fair."}, {"g": "時間 Time", "t": "during + N", "p": "(prep.)", "e": "used to show something happens in a period of time", "z": "在……期間（時間）", "s": "Many students like to play basketball on the playground _____ the lunch break. Others prefer to read or take a nap.", "c": "很多學生喜歡【在】午休時間【期間】到操場打籃球。其他人則比較喜歡看書或午睡。", "f": "Many students like to play basketball on the playground during the lunch break. Others prefer to read or take a nap."}, {"g": "時間 Time", "t": "earlier", "p": "(adv.)", "e": "used to talk about a time before now", "z": "稍早；之前（時間）", "s": "I am not hungry for dinner right now. _____, I ate a big bowl of beef noodles with my friends after school.", "c": "我現在不餓，吃不下晚餐。【稍早】，我放學後和朋友吃了一大碗牛肉麵。", "f": "I am not hungry for dinner right now. Earlier, I ate a big bowl of beef noodles with my friends after school."}, {"g": "時間 Time", "t": "finally", "p": "(adv.)", "e": "used to say something happens after a long time", "z": "終於；最後（時間）", "s": "We walked up the mountain for three long hours. _____, we reached the top and saw the beautiful view.", "c": "我們爬了整整三個小時的山。【終於】，我們抵達山頂，看到了美麗的風景。", "f": "We walked up the mountain for three long hours. Finally, we reached the top and saw the beautiful view."}, {"g": "時間 Time", "t": "formerly", "p": "(adv.)", "e": "used to talk about how something was in the past", "z": "以前；從前（時間）（正式用語）", "s": "This coffee shop is very popular with students now. _____, it was a small bookstore owned by an old couple.", "c": "這間咖啡店現在很受學生歡迎。【以前】，它是一對老夫婦開的小書店。", "f": "This coffee shop is very popular with students now. Formerly, it was a small bookstore owned by an old couple."}, {"g": "時間 Time", "t": "immediately", "p": "(adv.)", "e": "used to say something happens right away", "z": "立刻；馬上（時間）", "s": "The fire alarm rang loudly in the middle of class. _____, all the students walked out of the building in a line.", "c": "上課到一半，火災警報大聲響起。【立刻】，所有學生排成一列走出大樓。", "f": "The fire alarm rang loudly in the middle of class. Immediately, all the students walked out of the building in a line."}, {"g": "時間 Time", "t": "in the future", "p": "(adv.phr.)", "e": "used to talk about a time after now", "z": "將來；未來（時間）", "s": "Lisa loves animals and often takes care of stray cats. _____ _____ _____, she hopes to become a vet and help sick pets.", "c": "麗莎很愛動物，常常照顧流浪貓。【將來】，她希望成為獸醫，幫助生病的寵物。", "f": "Lisa loves animals and often takes care of stray cats. In the future, she hopes to become a vet and help sick pets."}, {"g": "時間 Time", "t": "in the meantime", "p": "(adv.phr.)", "e": "used to talk about the time while you wait for something", "z": "在這期間；同時（時間）", "s": "Dinner will be ready in about twenty minutes. _____ _____ _____, you can set the table and wash your hands.", "c": "晚餐大約再二十分鐘就好了。【在這期間】，你可以擺好餐具並去洗手。", "f": "Dinner will be ready in about twenty minutes. In the meantime, you can set the table and wash your hands."}, {"g": "時間 Time", "t": "in the past", "p": "(adv.phr.)", "e": "used to talk about a time before now", "z": "過去；以前（時間）", "s": "Most people use smartphones to take photos today. _____ _____ _____, people used film cameras and waited days to see their pictures.", "c": "現在大多數人用智慧型手機拍照。【過去】，人們用底片相機，還要等好幾天才能看到照片。", "f": "Most people use smartphones to take photos today. In the past, people used film cameras and waited days to see their pictures."}, {"g": "時間 Time", "t": "initially", "p": "(adv.)", "e": "used to talk about the situation at the beginning", "z": "起初；最初（時間）", "s": "_____, only ten students joined the school English club. Now, more than forty students come to the meetings every week.", "c": "【起初】，只有十個學生參加學校的英文社。現在，每週有超過四十個學生來參加聚會。", "f": "Initially, only ten students joined the school English club. Now, more than forty students come to the meetings every week."}, {"g": "時間 Time", "t": "later", "p": "(adv.)", "e": "used to talk about a time after now or after something", "z": "之後；稍後（時間）", "s": "I can't play video games with you right now because I have homework. _____, after I finish it, we can play together.", "c": "我現在不能和你玩電動，因為我還有功課。【之後】，等我寫完，我們就可以一起玩。", "f": "I can't play video games with you right now because I have homework. Later, after I finish it, we can play together."}, {"g": "時間 Time", "t": "meanwhile", "p": "(adv.)", "e": "used to show two things happen at the same time", "z": "同時；與此同時（時間）", "s": "Dad was washing the car in front of the house. _____, my brother and I were cleaning our bedrooms upstairs.", "c": "爸爸在房子前面洗車。【同時】，我和哥哥在樓上打掃我們的房間。", "f": "Dad was washing the car in front of the house. Meanwhile, my brother and I were cleaning our bedrooms upstairs."}, {"g": "時間 Time", "t": "now", "p": "(adv.)", "e": "used to talk about the present time", "z": "現在（時間）", "s": "Ten years ago, my town had only one small convenience store. _____, there are five stores and a big supermarket.", "c": "十年前，我們鎮上只有一家小便利商店。【現在】，有五家便利商店和一間大型超市。", "f": "Ten years ago, my town had only one small convenience store. Now, there are five stores and a big supermarket."}, {"g": "時間 Time", "t": "presently", "p": "(adv.)", "e": "used to say something will happen soon", "z": "不久；很快（時間）（正式用語）", "s": "The doctor is busy with another patient right now. She will see you _____, so please take a seat and wait.", "c": "醫生現在正在看另一位病人。她【很快】就會為你看診，所以請先坐下等候。", "f": "The doctor is busy with another patient right now. She will see you presently, so please take a seat and wait."}, {"g": "時間 Time", "t": "previously", "p": "(adv.)", "e": "used to talk about a time before now", "z": "先前；以前（時間）", "s": "Our school has a new computer room this year. _____, all the classes had to share one small, old computer room.", "c": "我們學校今年有了新的電腦教室。【先前】，所有班級都得共用一間又小又舊的電腦教室。", "f": "Our school has a new computer room this year. Previously, all the classes had to share one small, old computer room."}, {"g": "時間 Time", "t": "prior to + N/V-ing", "p": "(prep.phr.)", "e": "used to mean 'before'", "z": "在……之前（時間）（正式用語）", "s": "Students must turn off their phones _____ _____ entering the exam room. Phones that ring will cause problems for everyone.", "c": "學生【在】進入考場【之前】必須關掉手機。響起的手機會影響到每個人。", "f": "Students must turn off their phones prior to entering the exam room. Phones that ring will cause problems for everyone."}, {"g": "時間 Time", "t": "recently", "p": "(adv.)", "e": "used to talk about something that happened not long ago", "z": "最近（時間）", "s": "My aunt has been very busy these days. _____, she started a small bakery and sells bread to her neighbors every morning.", "c": "我阿姨這陣子非常忙。【最近】，她開了一間小麵包店，每天早上賣麵包給鄰居。", "f": "My aunt has been very busy these days. Recently, she started a small bakery and sells bread to her neighbors every morning."}, {"g": "時間 Time", "t": "shortly", "p": "(adv.)", "e": "used to say something will happen soon", "z": "不久；很快（時間）", "s": "The train is a little late this morning. It will arrive _____, so please stand behind the yellow line.", "c": "今天早上火車有點誤點。它【很快】就會到站，所以請站在黃線後面。", "f": "The train is a little late this morning. It will arrive shortly, so please stand behind the yellow line."}, {"g": "時間 Time", "t": "simultaneously", "p": "(adv.)", "e": "used to show two things happen at exactly the same time", "z": "同時（時間）（正式用語）", "s": "The two runners ran very fast and crossed the finish line _____. The judges could not decide who won the race.", "c": "兩位跑者跑得非常快，【同時】衝過終點線。裁判無法決定誰贏了比賽。", "f": "The two runners ran very fast and crossed the finish line simultaneously. The judges could not decide who won the race."}, {"g": "時間 Time", "t": "soon", "p": "(adv.)", "e": "used to say something will happen in a short time", "z": "很快；不久（時間）", "s": "It is getting dark, and the clouds are very black. It will _____ start to rain, so let's go home now.", "c": "天色漸漸暗了，雲也很黑。【很快】就要下雨了，所以我們現在回家吧。", "f": "It is getting dark, and the clouds are very black. It will soon start to rain, so let's go home now."}, {"g": "時間 Time", "t": "subsequently", "p": "(adv.)", "e": "used to show something happened after an earlier event", "z": "後來；隨後（時間）（正式用語）", "s": "Ben hurt his leg badly during basketball practice. He _____ missed three games and had to watch from the bench.", "c": "班在籃球練習時傷了腿。他【後來】錯過了三場比賽，只能坐在板凳上觀看。", "f": "Ben hurt his leg badly during basketball practice. He subsequently missed three games and had to watch from the bench."}, {"g": "時間 Time", "t": "then", "p": "(adv.)", "e": "used to mean 'at that time in the past'", "z": "那時；當時（時間）", "s": "My family lived in a small village in Pingtung in 2015. _____, I was only five and didn't know any English at all.", "c": "2015年我們家住在屏東的一個小村莊。【那時】，我才五歲，完全不會英文。", "f": "My family lived in a small village in Pingtung in 2015. Then, I was only five and didn't know any English at all."}, {"g": "時間 Time", "t": "thereafter", "p": "(adv.)", "e": "used to mean 'after that time'", "z": "此後；從那之後（時間）（正式用語）", "s": "Grandpa stopped drinking soda when he turned sixty. _____, he felt much healthier and walked in the park every morning.", "c": "爺爺六十歲時戒掉了汽水。【從那之後】，他覺得身體健康多了，每天早上都去公園散步。", "f": "Grandpa stopped drinking soda when he turned sixty. Thereafter, he felt much healthier and walked in the park every morning."}];</script><script src="longteng-b1u5-quiz.js?v=20261027-2"></script><script src="cap-vocab-learn.js?v=20261105-1"></script><script>document.querySelector("#description").textContent="先在「教學 Learn」看完 185 筆詞彙表，再到「測驗 Quiz」做 62 題四選一｜選答後顯示答案、用語中文與整句中譯｜答錯可重做並下載錯題";</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
