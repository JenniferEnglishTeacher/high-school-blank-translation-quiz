<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>龍騰B1R1 引導式翻譯</title><style>:root{--blue:#2563eb;--navy:#1e3a8a;--bg:#f4f7fb;--card:#fff;--line:#dbe3ee;--ink:#172033;--muted:#64748b;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}.wrap{max-width:900px;margin:auto;padding:16px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 5px 18px #0f172a0d}.hero{background:linear-gradient(135deg,#e8f1ff,#fff)}h1{margin:0 0 6px;font-size:clamp(25px,4vw,38px)}h2{margin-top:0}.note{color:var(--muted)}.hidden{display:none!important}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.btn{border:0;border-radius:10px;padding:11px 17px;font-size:16px;font-weight:800;cursor:pointer;background:#e5e7eb}.primary{background:var(--blue);color:#fff}.danger{background:#991b1b;color:#fff}.pick{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin:7px 0;background:#fafcff}.pick input{margin-right:8px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:800;margin:8px 0 14px}.zh{padding:10px 13px;background:#fff7ed;border-radius:9px;color:#9a3412;font-weight:800;margin-bottom:10px}.question{font-size:21px;font-weight:750;padding:16px;background:#f8fafc;border-radius:11px;white-space:pre-wrap}.options{display:grid;gap:9px;margin:14px 0}.option{display:flex;align-items:center;gap:11px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-size:18px;font-weight:750;cursor:pointer}.option:hover{border-color:#60a5fa;background:#eff6ff}.option:has(input:checked){border-color:var(--blue);background:#dbeafe;color:var(--navy)}.option input{width:20px;height:20px;accent-color:var(--blue)}.inputs{display:grid;gap:10px;margin:15px 0}.answer-row{display:grid;grid-template-columns:55px 1fr;gap:10px;align-items:center}.answer-row label{font-weight:900;color:var(--navy);text-align:center}.spell{width:100%;font:inherit;font-size:18px;padding:11px;border:2px solid #94a3b8;border-radius:9px}.feedback{padding:13px;border-radius:10px;font-weight:800;margin:13px 0}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}.wrong p{margin:6px 0}@media(max-width:600px){.wrap{padding:9px}.hero,.card{padding:15px}.question{font-size:18px;padding:13px}.option{font-size:17px}.answer-row{grid-template-columns:42px 1fr}}</style></head><body><main class="wrap"><section class="hero"><h1>龍騰B1R1 引導式翻譯</h1><p>共 38 題。可自行選題；答錯會顯示正確答案並要求重新作答。</p><p class="note">完成後可下載包含錯誤答案與正確答案的 DOCX 錯題紀錄。</p></section><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn">全部選取</button><button id="none" class="btn">全部取消</button><button id="start" class="btn primary">開始作答</button></div><div id="list"></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="download" class="btn primary">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></main><script type="module">import{Document,Packer,Paragraph,TextRun,HeadingLevel}from'https://esm.sh/docx@9.5.1';const TITLE="龍騰B1R1 引導式翻譯",MODE="multi",Q=[{"id": 1, "zh": "Emily想要買這件洋裝，因為很便宜。另一方面，她知道她已經有太多件洋裝了。", "question": "Emily wants to buy the dress because it’s very cheap. ①____________ ②____________ ③____________ ④____________, she knows she already has too many dresses.", "answers": ["On", "the", "other", "hand"]}, {"id": 2, "zh": "這爸爸在他小女兒臉頰上親了一下，然後道別上火車。", "question": "The father ①____________ his little daughter ②____________ ③____________ ④____________ before he got on the train and said goodbye.", "answers": ["kissed", "on", "the", "cheek"]}, {"id": 3, "zh": "我把我的身分證交給警衛以證明我十八歲了。", "question": "I ①____________ my identification card ②____________ ③____________ the gatekeeper to prove that I was eighteen years old.", "answers": ["handed", "over", "to"]}, {"id": 4, "zh": "Mike很沮喪，但我不知道他發生了什麼事。", "question": "Mike was upset, but I ①____________ ②____________ ③____________ what had happened to him.", "answers": ["had", "no", "idea"]}, {"id": 5, "zh": "正是在我英國旅行的期間，我明白了英文是多麼地重要。", "question": "It was ①____________ my trip ②____________ Britain that I ③____________ ④____________ ⑤____________ how important English is.", "answers": ["during", "to", "came", "to", "realize"]}, {"id": 6, "zh": "Jack正等著他的女友下班，然後他們將會一起去吃晚餐。", "question": "Jack was waiting for his girlfriend to ①____________ ②____________ ③____________, and then they would have dinner together.", "answers": ["get", "off", "work"]}, {"id": 7, "zh": "我們一路從臺北開車到墾丁，結果發現墾丁正下著大雨。", "question": "We drove ①____________ ②____________ ③____________ from Taipei to Kenting, only to find that it was raining hard there.", "answers": ["all", "the", "way"]}, {"id": 8, "zh": "住在捷運車站附近很方便。另一方面，公寓的租金將會比較高。", "question": "It is convenient to live near an MRT station; ①____________ ②____________ ③____________ ④____________, the apartment rent will be higher.", "answers": ["on", "the", "other", "hand"]}, {"id": 9, "zh": "整體來說，除了一些文法上的小錯誤，你的作文寫得不錯。", "question": "In general, your composition is good ①____________ ②____________ some minor grammatical errors.", "answers": ["except", "for"]}, {"id": 10, "zh": "這是露營的好地方。首先，地面很平坦。它也靠近河流，取得新鮮的水不是問題。", "question": "This is a good place for camping. ①____________ ②____________ ③____________, the ground is flat; also, it is near a river, so fresh water will not be a problem.", "answers": ["For", "a", "start"]}, {"id": 11, "zh": "非常抱歉，我不知道我們不可以在這河裡游泳。", "question": "I am very sorry, for I didn’t know we ①____________ ②____________ ③____________ ④____________ swim in this river.", "answers": ["are", "not", "allowed", "to"]}, {"id": 12, "zh": "令我失望的是這結果完全跟我預期的不同。", "question": "To my disappointment, the result was completely ①____________ ②____________ what I had expected.", "answers": ["different", "from"]}, {"id": 13, "zh": "夏天到加拿大玩是一個絕佳的時機。首先，天氣溫暖。第二，白天非常長。", "question": "Summer is a wonderful time to visit Canada. ①____________ ②____________ ③____________, the weather is warm. Second, the daytime is very long.", "answers": ["For", "a", "start"]}, {"id": 14, "zh": "Diane把她的身分證交給警察，然後在他查看的時候等待著。", "question": "Diane ①____________ her ID ②____________ to the police officer and then waited while he examined it.", "answers": ["handed", "over"]}, {"id": 15, "zh": "Sally喜歡這部電影，除了最後主角身亡的時候。", "question": "Sally liked the movie, ①____________ ②____________ when the hero died at the end.", "answers": ["except", "for"]}, {"id": 16, "zh": "我們沒有要一路到墾丁，最遠只是到高雄而已。", "question": "We are not going ①____________ ②____________ ③____________ to Kenting, but only as far as Kaohsiung.", "answers": ["all", "the", "way"]}, {"id": 17, "zh": "Ellen把鑰匙交給Julia，跟她說可以用她的車。", "question": "Ellen ①____________ the keys ②____________ to Julia and told her that she could use her car.", "answers": ["handed", "over"]}, {"id": 18, "zh": "除了天氣外，我們的徒步旅行一切順利。", "question": "Everything was fine on our hiking trip ①____________ ②____________ the weather.", "answers": ["except", "for"]}, {"id": 19, "zh": "我們老師完全地略過這一章，因為他說這部分不重要。", "question": "Our teacher ①____________ the whole chapter ②____________ because this part, he said, was not important.", "answers": ["skipped", "altogether"]}, {"id": 20, "zh": "每到週末，Andy早上不會早於十點起床。", "question": "Andy gets up ①____________ ②____________ ③____________ 10 o’clock in the morning on weekends.", "answers": ["no", "earlier", "than"]}, {"id": 21, "zh": "比賽輸了後，Cindy才知道自己不夠好。", "question": "Cindy ①____________ ②____________ she was not good enough when she lost the game.", "answers": ["only", "realized"]}, {"id": 22, "zh": "Jack屏住呼吸，跳入他掉落手機的河中。", "question": "Jack ①____________ ②____________ ③____________ and dived into the river where he had dropped his cell phone.", "answers": ["held", "his", "breath"]}, {"id": 23, "zh": "政府的新政策開放討論，甚至是批評。", "question": "The government’s new policy ①____________ ②____________ ③____________ discussion and even to criticism.", "answers": ["is", "open", "to"]}, {"id": 24, "zh": "Charlie臉上微笑著走向我。", "question": "Charlie ①____________ ②____________ ③____________ me with a big smile on his face.", "answers": ["walked", "up", "to"]}, {"id": 25, "zh": "收到她的生日禮物後，小女孩親了媽媽臉頰一下。", "question": "After receiving her birthday gift, the little girl ①____________ her mother ②____________ ③____________ ④____________.", "answers": ["kissed", "on", "the", "cheek"]}, {"id": 26, "zh": "得到一份好工作與運氣無關。", "question": "①____________ a good job ②____________ not a matter of luck.", "answers": ["Getting", "is"]}, {"id": 27, "zh": "最後Sammi了解了為何Andy不說實話。", "question": "Sammi ①____________ ②____________ ③____________ in the end why Andy didn’t tell the truth.", "answers": ["came", "to", "realize"]}, {"id": 28, "zh": "Williams先生，被稱為「Teddy叔叔」，深受孩子們喜愛。", "question": "Mr. Williams, who ①____________ ②____________ ③____________ “Uncle Teddy,” is loved by the children.", "answers": ["is", "known", "as"]}, {"id": 29, "zh": "老闆將電話交給Hannah，請她跟客戶解釋這個問題。", "question": "The boss ①____________ the phone ②____________ ③____________ ④____________, asking her to explain the problem to the client.", "answers": ["handed", "over", "to", "Hannah"]}, {"id": 30, "zh": "Joseph心情非常好，以致於他一路唱歌到學校。", "question": "Joseph was in such a good mood that he sang ①____________ ②____________ ③____________ to school.", "answers": ["all", "the", "way"]}, {"id": 31, "zh": "你今晚何時下班？我們一起吃晚餐吧。", "question": "When will you ①____________ ②____________ ③____________ tonight? Let’s have dinner together.", "answers": ["get", "off", "work"]}, {"id": 32, "zh": "住新房子很舒服，但另一方面來說，我恐怕負擔不起。", "question": "Living in a new house is comfortable, but ①____________ ②____________ ③____________ ④____________, I’m afraid I can’t afford one.", "answers": ["on", "the", "other", "hand"]}, {"id": 33, "zh": "這件洋裝不適合我。首先，我討厭這顏色。再者，我穿起來很醜。", "question": "This dress is not for me. ①____________ ②____________ ③____________, I hate the color. In addition, I look ugly in it.", "answers": ["For", "a", "start"]}, {"id": 34, "zh": "除了幾個文法錯誤之外，這篇文章很完美。", "question": "The article is perfect ①____________ ②____________ a few grammatical errors.", "answers": ["except", "for"]}, {"id": 35, "zh": "當風吹打在這間舊房子的窗邊時，它聽起來很像鬼魂。", "question": "When the wind blows around the windows in this old house, it ①____________ ②_____________ ghosts.", "answers": ["sounds", "like"]}, {"id": 36, "zh": "王先生接了好幾份兼職工作以養活他的家庭。", "question": "Mr. Wang got several part-time jobs ①____________ ②_____________ ③____________ support his family.", "answers": ["in", "order", "to"]}, {"id": 37, "zh": "Tiffany提早下班為了要準時到幼兒園接她的兒子。", "question": "Tiffany left work early ①____________ ②_____________ ③____________ ④____________ ⑤____________ her kids from the kindergarten on time.", "answers": ["in", "order", "to", "pick", "up"]}, {"id": 38, "zh": "為了要讓他的女友開心，William在情人節時帶她到一家高級餐廳用餐。", "question": "①____________ ②____________ ③____________ make his girlfriend happy, William took her to dinner at a fancy restaurant on Valentine’s Day.", "answers": ["In", "order", "to"]}];const $=s=>document.querySelector(s),list=$('#list'),select=$('#select'),quiz=$('#quiz'),result=$('#result'),question=$('#question'),answerArea=$('#answerArea'),feedback=$('#feedback'),next=$('#next');let chosen=[],idx=0;const wrong=new Map(),correct=new Set();const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ');function renderList(){list.innerHTML=Q.map(q=>'<label class="pick"><input class="pickbox" type="checkbox" value="'+q.id+'" checked><b>第 '+q.id+' 題</b></label>').join('')}$('#all').onclick=()=>document.querySelectorAll('.pickbox').forEach(x=>x.checked=true);$('#none').onclick=()=>document.querySelectorAll('.pickbox').forEach(x=>x.checked=false);$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));idx=0;wrong.clear();correct.clear();select.classList.add('hidden');result.classList.add('hidden');quiz.classList.remove('hidden');show()};function show(){const q=chosen[idx];$('#meta').textContent='第 '+(idx+1)+' / '+chosen.length+' 題';$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';$('#bar').style.width=(idx+1)/chosen.length*100+'%';question.textContent=q.question;const zh=$('#zh');if(q.zh){zh.textContent=q.zh;zh.classList.remove('hidden')}else zh.classList.add('hidden');feedback.className='feedback hidden';$('#check').classList.remove('hidden');next.classList.add('hidden');if(MODE==='mcq')answerArea.innerHTML='<div class="options">'+q.options.map((o,i)=>'<label class="option"><input type="radio" name="answer" value="'+i+'"><b>'+String.fromCharCode(65+i)+'.</b> '+esc(o)+'</label>').join('')+'</div>';else answerArea.innerHTML='<div class="inputs">'+q.answers.map((_,i)=>'<div class="answer-row"><label>'+(MODE==='multi'?['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'][i]:'答案')+'</label><input class="spell" autocomplete="off" spellcheck="false" placeholder="請輸入完整答案"></div>').join('')+'</div>';setTimeout(()=>answerArea.querySelector('input')?.focus(),0)}function currentAnswers(){if(MODE==='mcq'){const x=answerArea.querySelector('input:checked');return x?[+x.value]:[]}return [...answerArea.querySelectorAll('.spell')].map(x=>x.value)}function correctText(q){return MODE==='mcq'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.answers.join(' / ')}$('#check').onclick=()=>{const q=chosen[idx],a=currentAnswers();if((MODE==='mcq'&&!a.length)||(MODE!=='mcq'&&(a.length!==q.answers.length||a.some(x=>!x.trim()))))return alert('請完成所有答案。');const ok=MODE==='mcq'?a[0]===q.answer:a.every((x,i)=>q.answers[i].split(/\|\||\//).some(v=>norm(x)===norm(v)));if(ok){correct.add(q.id);feedback.className='feedback ok';feedback.textContent='✅ 全部正確！';$('#check').classList.add('hidden');next.classList.remove('hidden')}else{if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(MODE==='mcq'?String.fromCharCode(65+a[0]):a.join(' / '));$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';feedback.className='feedback bad';feedback.innerHTML='❌ 答案不正確。正確答案：<strong>'+esc(correctText(q))+'</strong><br>請重新作答。';if(MODE==='mcq')answerArea.querySelectorAll('input').forEach(x=>x.checked=false);else answerArea.querySelectorAll('.spell').forEach(x=>x.value='');answerArea.querySelector('input')?.focus()}};next.onclick=()=>{idx++;idx>=chosen.length?finish():show()};$('#finish').onclick=finish;function finish(){quiz.classList.add('hidden');result.classList.remove('hidden');$('#summary').innerHTML='<div class="stat">選擇題數<b>'+chosen.length+'</b></div><div class="stat">完成答對<b>'+correct.size+'</b></div><div class="stat">曾答錯<b>'+wrong.size+'</b></div>';$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>'<div class="wrong"><b>'+(i+1)+'. 第 '+r.q.id+' 題</b><p>'+esc((r.q.zh?r.q.zh+'\n':'')+r.q.question)+'</p><p><strong>錯誤答案：</strong>'+r.attempts.map(esc).join('；')+'</p><p><strong>正確答案：</strong>'+esc(correctText(r.q))+'</p></div>').join(''):'<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size)}$('#restart').onclick=()=>{result.classList.add('hidden');select.classList.remove('hidden')};$('#download').onclick=async()=>{if(!wrong.size)return;const children=[new Paragraph({heading:HeadingLevel.TITLE,children:[new TextRun({text:TITLE+' 錯題紀錄',bold:true})]})];[...wrong.values()].forEach((r,i)=>{children.push(new Paragraph({heading:HeadingLevel.HEADING_2,children:[new TextRun({text:(i+1)+'. 第 '+r.q.id+' 題',bold:true})]}));if(r.q.zh)children.push(new Paragraph({children:[new TextRun({text:r.q.zh})]}));children.push(new Paragraph({children:[new TextRun({text:r.q.question})]}));children.push(new Paragraph({children:[new TextRun({text:'錯誤答案：',bold:true}),new TextRun({text:r.attempts.join('；')})]}));children.push(new Paragraph({children:[new TextRun({text:'正確答案：',bold:true}),new TextRun({text:correctText(r.q)})]}))});const doc=new Document({sections:[{children}]}),blob=await Packer.toBlob(doc),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=TITLE+'_錯題_'+new Date().toISOString().slice(0,10)+'.docx';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};renderList();</script></body></html>
