  <script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 1｜文法選擇（課本句型）","mode":"mcq","questions":[{"id":1,"question":"The new skirt looks ____________ on you. Everyone must be impressed by your style!","options":["great","greatly","greatness","to be great"],"answer":0,"source":"龍騰自命題","explanation":"look解作「看起來」，後方接形容詞。","explanationSource":"source"},{"id":2,"question":"My sister made some cookies, and they ____________ very delicious.","options":["tasted","were tasting","were tasted","were being tasted"],"answer":0,"source":"龍騰自命題","explanation":"taste解作「嚐起來」，後方接形容詞。請注意此用法的taste不作被動語態（be + p.p.），不作進行式（be + V-ing）。","explanationSource":"source"},{"id":3,"question":"This marketing idea ____________ creative. It will surely make money for our company.","options":["sounds","is sounded","is sounding","is to be sounded"],"answer":0,"source":"龍騰自命題","explanation":"sound解作「聽起來」，後方接形容詞。請注意此用法的sound不作被動語態（be + p.p.），不作進行式（be + V-ing）。","explanationSource":"source"},{"id":4,"question":"I know ____________ it is difficult to finish this project in a short time.","options":["if","whether","what","that"],"answer":3,"source":"三合一學習手冊","explanation":"正確答案為 that；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":5,"question":"What’s wrong with you? You look ____________.","options":["angrily","angry","like anger","anger"],"answer":1,"source":"三合一學習手冊","explanation":"正確答案為 angry；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":6,"question":"Having dinner at the Wangs’ ____________ a good idea. Their dishes taste ____________.","options":["sounds; well","sounds like; good","looks; good","feels like; well"],"answer":1,"source":"三合一學習手冊","explanation":"正確答案為 sounds like; good；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":7,"question":"Don’t feel ____________ if you can’t solve the math problems quickly. They are really difficult.","options":["depressing","depressed","depress","depression"],"answer":1,"source":"三合一學習手冊","explanation":"正確答案為 depressed；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":8,"question":"I am sure ____________ they will come to Jackson’s party tonight.","options":["why","if","that","what"],"answer":2,"source":"三合一學習手冊","explanation":"正確答案為 that；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":9,"question":"Leona ____________ she can see her best friend and ____________ they will have dinner together tonight.","options":["is excited that; so","is glad; that","feels happy that; ×","finds; what"],"answer":1,"source":"三合一學習手冊","explanation":"正確答案為 is glad; that；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":10,"question":"The coffee smells ____________, and interestingly, it tastes ____________ dark chocolate.","options":["good; as","well; as","good; like","well; like"],"answer":2,"source":"龍騰自命題","explanation":"smell解作「聞起來」，後方接形容詞。表示「像……」，作like + N。","explanationSource":"source"},{"id":11,"question":"Although the athlete did not win first place at the game, he did not feel ____________. He still had a smile on his face.","options":["depress","depressed","depressing","depressingly"],"answer":1,"source":"龍騰自命題","explanation":"feel解作「覺得」，後方接形容詞。depressing解作「（事物）令人憂鬱的」；depressed解作「（人）感到憂鬱的」。","explanationSource":"source"},{"id":12,"question":"The man will soon realize ____________ he cannot buy true love, even if he is rich.","options":["that","what","how","whether"],"answer":0,"source":"龍騰自命題","explanation":"that引導的名詞子句，可放在及物動詞後方當受詞，且that可省略：S + V + (that +) S + V….。","explanationSource":"source"},{"id":13,"question":"The young man was ____________ that an old two-room apartment near Central Park should sell for more than one million dollars.","options":["surprise","surprising","surprised","surprisingly"],"answer":2,"source":"龍騰自命題","explanation":"be動詞後方可接表達情緒或感受的形容詞，而後再接that引導的名詞子句，且that可省略。surprising解作「（事物）令人驚訝的」；surprised解作「（人）感到驚訝的」。此題that子句裡的助動詞should表示「竟然」。","explanationSource":"source"},{"id":14,"question":"I noticed Jasmine looking ____________ at Sam. She looked very ____________ at the party.","options":["happy; happy","happily; happily","happy; happily","happily; happy"],"answer":3,"source":"龍騰自命題","explanation":"第一格考look at表示「盯著……看」，要搭配副詞。第二格考look解作「看起來」，後方接形容詞；其中at與the party搭配，at the party表示「在這場派對」。","explanationSource":"source"},{"id":15,"question":"I have learned that working hard is the most important key to success and ____________ living a simple life will help me avoid poverty.","options":["what","which","that","×"],"answer":2,"source":"龍騰自命題","explanation":"that引導的名詞子句，可放在及物動詞後方當受詞。若接兩個that子句，第一個that可省略，第二個that不得省略：S + V + (that +) S + V… + and + that + S + V….。","explanationSource":"source"},{"id":16,"question":"The students are excited ____________ they will have a two-month summer vacation.","options":["how","what","where","that"],"answer":3,"source":"龍騰自命題","explanation":"that引導的名詞子句，可放在表達情緒或感受的形容詞後方，且that可省略：S + be + adj. + (that +) S + V….。","explanationSource":"source"}]};</script>
