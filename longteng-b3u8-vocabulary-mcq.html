<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="龍騰普高 B3U8 單字選擇互動練習"><title>龍騰普高 B3U8 單字選擇</title><style>:root{--blue:#2563eb;--navy:#1e3a8a;--bg:#f4f7fb;--card:#fff;--line:#dbe3ee;--ink:#172033;--muted:#64748b;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--voice:#6d28d9;--voicebg:#f5f3ff;--amber:#9a3412;--amberbg:#fff7ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}.wrap{max-width:920px;margin:auto;padding:16px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 5px 18px #0f172a0d}.hero{background:linear-gradient(135deg,#e8f1ff,#fff)}h1{margin:0 0 6px;font-size:clamp(25px,4vw,38px)}h2{margin-top:0}.note{color:var(--muted)}.hidden{display:none!important}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.btn{border:0;border-radius:10px;padding:11px 17px;font:800 16px inherit;cursor:pointer;background:#e5e7eb;color:var(--ink);text-decoration:none}.primary{background:var(--blue);color:#fff}.danger{background:#991b1b;color:#fff}.voice{background:var(--voice);color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.btn:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.pick{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin:7px 0;background:#fafcff}.pick input{margin-right:8px;width:17px;height:17px;accent-color:var(--blue)}#list{max-height:440px;overflow:auto;border:1px solid var(--line);padding:7px;border-radius:12px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:800;margin:8px 0 14px}.zh{padding:10px 13px;background:var(--amberbg);border-radius:9px;color:var(--amber);font-weight:800;margin-bottom:10px}.question{font-size:21px;font-weight:750;padding:16px;background:#f8fafc;border-radius:11px;white-space:pre-wrap}.options{display:grid;gap:9px;margin:14px 0}.option{display:flex;align-items:center;gap:11px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-size:18px;font-weight:750;cursor:pointer}.option:hover{border-color:#60a5fa;background:#eff6ff}.option:has(input:checked){border-color:var(--blue);background:#dbeafe;color:var(--navy)}.option input{width:20px;height:20px;accent-color:var(--blue)}.inputs{display:grid;gap:10px;margin:15px 0}.answer-row{display:grid;grid-template-columns:55px 1fr;gap:10px;align-items:center}.answer-row label{font-weight:900;color:var(--navy);text-align:center}.spell{width:100%;font:inherit;font-size:18px;padding:11px;border:2px solid #94a3b8;border-radius:9px}.feedback{padding:13px;border-radius:10px;font-weight:800;margin:13px 0}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.explain{font-weight:500;margin-top:7px}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:var(--voicebg);margin:13px 0}.voicebox b{display:block;font-size:19px;margin-bottom:8px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}.wrong p{margin:6px 0}.source{font-size:13px;color:var(--muted)}@media(max-width:600px){.wrap{padding:9px}.hero,.card{padding:15px}.question{font-size:18px;padding:13px}.option{font-size:17px}.answer-row{grid-template-columns:42px 1fr}.meta{display:block}}</style><link rel="stylesheet" href="longteng-vocab-required-pronunciation.css?v=20261026-4"></head><body><main class="wrap"><section class="hero"><h1>龍騰普高 B3U8 單字選擇</h1><p>共 30 題。可自行選題、隨機抽題；答錯後請重新作答。</p><p class="note">答對後顯示來源解析並播放完整英文句；STT 朗讀達 80% 才能進入下一題。完成後可重做錯題並下載 DOCX。</p><div class="toolbar"><a class="btn" href="dashboard.html">← 回測驗總覽</a></div></section><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn">全部選取</button><button id="none" class="btn">全部取消</button><button id="rand20" class="btn">隨機 20 題</button></div><label><input id="shuffle" type="checkbox"> 打亂出題順序</label><div id="list"></div><div class="actions"><button id="start" class="btn primary">開始作答</button><span id="picked" class="note"></span></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="voiceBox" class="voicebox hidden"><b id="voiceTarget"></b><button id="speak" class="btn voice">🔊 再聽一次</button></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="retry" class="btn primary">只重做錯題</button><button id="download" class="btn">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></main><script>const TITLE="龍騰普高 B3U8 單字選擇",MODE="mcq",Q=[{"id":1,"question":"The reading comprehension test may seem rather long, but the questions are not ___________ at all; just stay calm and answer them step by step.","options":["adequate","complex","obedient","economic"],"answer":1,"explanation":"這篇閱讀測驗可能看起來相當長，但問題一點也不複雜；只需要保持鎮定並逐步回答問題。 (A)充足的 (B)複雜的 (C)服從的 (D)經濟的","source":"龍騰自命題"},{"id":2,"question":"This famous fashion brand ___________ from headquarters in Tokyo, but its clothes can be seen all over Asia.","options":["strikes","demands","lures","operates"],"answer":3,"explanation":"這個有名的時裝品牌在東京總部營運，但其衣服可在亞洲四處看到。 (A)打；擊 (B)要求 (C)引誘 (D)營運；經營","source":"龍騰自命題"},{"id":3,"question":"On this photo calendar, you can see a ___________ of horses running in a field.","options":["lure","herd","glance","gesture"],"answer":1,"explanation":"在這個相片月曆上，你可以看到一群馬在原野裡奔跑。 (A)誘惑 (B)群 (C)匆匆一瞥 (D)手勢","source":"龍騰自命題"},{"id":4,"question":"These monkeys are certainly not ___________ animals; they are wild and may grab your food and run away.","options":["complex","tame","illegal","brutal"],"answer":1,"explanation":"這些猴子一定不是馴服的動物，牠們是野生的，而且可能會奪走你的食物並跑走。 (A)複雜的 (B)馴服的 (C)非法的 (D)殘忍的","source":"龍騰自命題"},{"id":5,"question":"People cannot take the train to work because the railway employees are on ___________ today, demanding a better welfare system.","options":["lure","grief","strike","prayer"],"answer":2,"explanation":"人們無法搭火車上班因為鐵路公司的員工今天罷工，要求一個更好的福利制度。 (A)誘惑 (B)悲傷 (C)罷工 (D)祈禱","source":"龍騰自命題"},{"id":6,"question":"Extreme sports players must wear protective helmets at all times to make sure that they are not ___________ to serious injuries that may happen during the games.","options":["vulnerable","permanent","intelligent","merciless"],"answer":0,"explanation":"極限運動玩家必須隨時戴具保護性的安全帽，以確保他們不易受到比賽期間可能發生的嚴重傷害。 (A)容易受傷的 (B)永久的 (C)聰明的 (D)無情的","source":"龍騰自命題"},{"id":7,"question":"The babysitter was found to have ___________ the baby girl and thus was put in jail.","options":["reversed","abused","committed","highlighted"],"answer":1,"explanation":"這個臨時保母被發現虐待過那名女嬰，因此被移送入監。 (A)反轉 (B)虐待 (C)做出……；承諾…… (D)強調","source":"龍騰自命題"},{"id":8,"question":"Getting a high score on this test not only is a matter of ___________ but also requires hard work and patience.","options":["intelligence","mercy","exhaustion","operation"],"answer":0,"explanation":"在這個考試得高分並不只是智力的問題，還需要努力跟耐心。 (A)智力 (B)仁慈 (C)筋疲力盡 (D)營運","source":"龍騰自命題"},{"id":9,"question":"Having a baby to take care of can ___________ parents, especially in the middle of the night.","options":["commit","exhaust","tame","strike"],"answer":1,"explanation":"有一個嬰兒要照顧可讓父母們筋疲力盡，特別是在半夜。 (A)做出……；承諾…… (B)使筋疲力盡 (C)馴服 (D)打；擊","source":"龍騰自命題"},{"id":10,"question":"If one fails to keep his or her ____________, it will be hard for him or her to earn others’ trust again.","options":["commitments","operations","herds","economies"],"answer":0,"explanation":"若一個人沒有做到自己的承諾，他或她就難以再贏得他人的信任。 (A)承諾；保證 (B)營運；業務 (C)獸群 (D)經濟","source":"龍騰自命題"},{"id":11,"question":"The athlete collapsed from ____________ while trying his best to reach the finish line.","options":["abuse","exhaustion","demand","mercy"],"answer":1,"explanation":"在盡力跑到終點的同時，那名運動員就累倒了。 (A)虐待 (B)筋疲力盡 (C)需求；要求 (D)仁慈；慈悲","source":"龍騰自命題"},{"id":12,"question":"No one but the prince managed to ____________ the wild horse, which proved once again how good he was with animals.","options":["abuse","commit","tame","highlight"],"answer":2,"explanation":"除了那位王子之外，無人能設法馴服那匹野馬，這再次證明了他有多麼擅長和動物相處。 (A)虐待 (B)做出（錯事）；犯（罪） (C)馴服 (D)強調","source":"龍騰自命題"},{"id":13,"question":"Our family is more ____________ than yours when it comes to using water. We don’t waste a drop!","options":["merciless","economical","illegal","economic"],"answer":1,"explanation":"以用水來說，我家比你家更節儉。我們絕不會浪費任何一滴水！ (A)冷酷無情的；殘忍的 (B)節約的；經濟實惠的 (C)非法的 (D)經濟上的；經濟學的","source":"龍騰自命題"},{"id":14,"question":"We need someone smart to take over the company—that is, someone ____________ enough to deal with all the obstacles in his or her way.","options":["economic","merciless","brutal","intelligent"],"answer":3,"explanation":"我們需要一個聰明的人來接管公司──也就是一個足夠聰明能夠處理他或她前進道路上所有障礙的人。 (A)經濟上的；經濟學的 (B)冷酷無情的；殘忍的 (C)殘暴的 (D)聰明的；有才智的","source":"龍騰自命題"},{"id":15,"question":"The accident left a(n) ____________ scar on Claire’s arm. It could not be removed and didn’t fade with time.","options":["economical","merciless","permanent","obedient"],"answer":2,"explanation":"那場意外在Claire的手臂上留下了永久的傷疤。不但無法移除，而且也沒有隨時間而變淡。 (A)節約的；經濟實惠的 (B)冷酷無情的；殘忍的 (C)永久的 (D)服從的；順從的","source":"龍騰自命題"},{"id":16,"question":"The strict teacher demands ____________ from each of the students, otherwise they are punished for their behavior.","options":["strike","obedience","exhaustion","intelligence"],"answer":1,"explanation":"這位嚴格的老師要求每個學生都服從，否則他們將會為他們的行為受到懲罰。 (A)罷工 (B)服從 (C)筋疲力盡 (D)智力；才智","source":"龍騰自命題"},{"id":17,"question":"Even though the factory had a new owner, the day-to-day ____________ inside it remained the same.","options":["herds","operations","highlights","commitments"],"answer":1,"explanation":"即使工廠換了新老板，裡面的日常運作還是一樣的。 (A)獸群 (B)營運；業務 (C)最精彩的部分 (D)承諾；保證","source":"龍騰自命題"},{"id":18,"question":"The girl used some old candy to try to ____________ the ants away from her lunch.","options":["lure","tame","exhaust","commit"],"answer":0,"explanation":"女孩用一些舊糖果來試圖將螞蟻從她的午餐引開。 (A)引誘 (B)馴服 (C)使筋疲力盡 (D)承諾；保證","source":"龍騰自命題"},{"id":19,"question":"The ____________ murder has shocked the whole community, and the police have sworn to find the killer.","options":["permanent","economical","brutal","obedient"],"answer":2,"explanation":"這起殘暴的謀殺震驚了整個社區，警方已立誓要找到那名兇手。 (A)永久的 (B)節約的；經濟實惠的 (C)殘暴的 (D)服從的；順從的","source":"龍騰自命題"},{"id":20,"question":"There may be ____________ transactions going in this harbor. That’s why the cops are on the way.","options":["illegal","brutal","permanent","intelligent"],"answer":0,"explanation":"在這個港口可能有非法交易正在進行。那正是為什麼警察正在趕來的路上。 (A)非法的 (B)殘暴的 (C)永久的 (D)聰明的；有才智的","source":"龍騰自命題"},{"id":21,"question":"The ____________ of the play was when the leading actor proposed to the main actress in the pouring rain.","options":["economy","herd","operation","highlight"],"answer":3,"explanation":"那齣劇最精采的部分就是男主角在雨中向女主角求婚的時候。 (A)經濟 (B)獸群 (C)營運；業務 (D)最精彩的部分","source":"龍騰自命題"},{"id":22,"question":"The poor child suffered terrible ____________ at the hands of his heartless uncle and had scars all over his body.","options":["strike","abuse","mercy","demand"],"answer":1,"explanation":"那名可憐的孩童遭受狠心叔叔的嚴重虐待，而滿身傷痕。 (A)罷工 (B)虐待 (C)仁慈；慈悲 (D)需求；要求","source":"龍騰自命題"},{"id":23,"question":"Don’t think taking something small without paying is no big deal. You’re ____________ a crime!","options":["taming","committing","exhausting","striking"],"answer":1,"explanation":"別覺得不付錢就拿走小東西沒什麼。你那樣是在犯罪！ (A)馴服 (B)做出（錯事）；犯（罪） (C)使筋疲力盡 (D)打；擊","source":"龍騰自命題"},{"id":24,"question":"The dog is only ____________ to its owner. It listens to no one else.","options":["intelligent","illegal","obedient","permanent"],"answer":2,"explanation":"那隻狗只順從於牠的主人。牠不聽其他人的指示。 (A)聰明的；有才智的 (B)非法的 (C)服從的；順從的 (D)永久的","source":"龍騰自命題"},{"id":25,"question":"The player tried to ____________ the ball with her bat but missed.","options":["strike","exhaust","commit","demonstrate"],"answer":0,"explanation":"那名選手努力想以她的球棒打中球，卻揮棒落空。 (A)打；擊 (B)使筋疲力盡 (C)做出（錯事）；犯（罪） (D)表達","source":"龍騰自命題"},{"id":26,"question":"The experts gathered to discuss trade, tourism, taxes, and other aspects of the country’s ____________.","options":["herd","economy","highlight","commitment"],"answer":1,"explanation":"專家們集合起來討論貿易、觀光、稅務以及該國經濟的其他面向。 (A)獸群 (B)經濟 (C)最精彩的部分 (D)承諾；保證","source":"龍騰自命題"},{"id":27,"question":"The company said they are unable to meet the workers’___________ for a raise in salary, which of course let a lot of people down.","options":["exhaustion","demand","intelligence","obedience"],"answer":1,"explanation":"這家公司說他們無法達到員工的加薪要求，這當然讓許多人失望。 (A)筋疲力盡 (B)要求 (C)智力 (D)服從","source":"龍騰自命題"},{"id":28,"question":"The king showed ___________ to the defeated enemy army by providing them with food and water.","options":["demand","abuse","mercy","strike"],"answer":2,"explanation":"國王對戰敗的敵軍展現仁慈，提供給他們食物與水。 (A)要求 (B)虐待 (C)仁慈 (D)罷工","source":"龍騰自命題"},{"id":29,"question":"The documentary An Inconvenient Truth ___________ the urgent need for action against global warming.","options":["highlighted","abused","exhausted","appreciated"],"answer":0,"explanation":"紀錄片《不願面對的真相》強調了採取行動對抗全球暖化的急迫需要。 (A)強調 (B)虐待 (C)使精疲力盡 (D)感激","source":"龍騰自命題"},{"id":30,"question":"A(n) ___________ amount of sunlight is critical to whether this plant fully blooms or not. So put it in a place where direct sunlight can reach it.","options":["obedient","complex","adequate","vulnerable"],"answer":2,"explanation":"足量的陽光對於這株植物是否能開花是很關鍵的。所以將它放在陽光可以直射的地方。 (A)服從的 (B)複雜的 (C)充足的；足夠的 (D)易受傷害的","source":"龍騰自命題"}];const $=s=>document.querySelector(s),list=$('#list'),select=$('#select'),quiz=$('#quiz'),result=$('#result'),question=$('#question'),answerArea=$('#answerArea'),feedback=$('#feedback'),next=$('#next');let chosen=[],idx=0,mode='first';const wrong=new Map(),correct=new Set();const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ');const shuffled=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function renderList(){list.innerHTML=Q.map(q=>'<label class="pick"><input class="pickbox" type="checkbox" value="'+q.id+'" checked><b>第 '+q.id+' 題</b> <span class="source">'+esc(q.source||'')+'</span></label>').join('');count()}function count(){$('#picked').textContent='已選 '+document.querySelectorAll('.pickbox:checked').length+' 題'}list.addEventListener('change',count);$('#all').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=true);count()};$('#none').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=false);count()};$('#rand20').onclick=()=>{let ids=new Set(shuffled(Q).slice(0,Math.min(20,Q.length)).map(q=>q.id));document.querySelectorAll('.pickbox').forEach(x=>x.checked=ids.has(+x.value));count()};$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));if($('#shuffle').checked)chosen=shuffled(chosen);idx=0;mode='first';wrong.clear();correct.clear();select.classList.add('hidden');result.classList.add('hidden');quiz.classList.remove('hidden');show()};function show(){const q=chosen[idx];speechSynthesis?.cancel();$('#meta').textContent=(mode==='retry'?'錯題重做｜':'')+'第 '+(idx+1)+' / '+chosen.length+' 題';$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';$('#bar').style.width=(idx+1)/chosen.length*100+'%';question.textContent=q.question;const zh=$('#zh');if(q.zh){zh.textContent=q.zh;zh.classList.remove('hidden')}else zh.classList.add('hidden');feedback.className='feedback hidden';$('#voiceBox').classList.add('hidden');$('#check').classList.remove('hidden');next.classList.add('hidden');if(MODE==='mcq')answerArea.innerHTML='<div class="options">'+q.options.map((o,i)=>'<label class="option"><input type="radio" name="answer" value="'+i+'"><b>'+String.fromCharCode(65+i)+'.</b> '+esc(o)+'</label>').join('')+'</div>';else answerArea.innerHTML='<div class="inputs">'+q.answers.map((_,i)=>'<div class="answer-row"><label>'+(MODE==='multi'?['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'][i]:'答案')+'</label><input class="spell" autocomplete="off" spellcheck="false" placeholder="請輸入完整答案"></div>').join('')+'</div>';setTimeout(()=>answerArea.querySelector('input')?.focus(),0)}function currentAnswers(){if(MODE==='mcq'){const x=answerArea.querySelector('input:checked');return x?[+x.value]:[]}return [...answerArea.querySelectorAll('.spell')].map(x=>x.value)}function correctText(q){return MODE==='mcq'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.answers.map(a=>a.split('||')[0]).join(' / ')}function isCorrect(q,a){return MODE==='mcq'?a[0]===q.answer:a.every((x,i)=>q.answers[i].split(/\|\||\//).some(v=>norm(x)===norm(v)))}function completedSentence(q){if(MODE==='mcq'){let s=q.question,v=q.options[q.answer],parts=(s.match(/_{3,}/g)||[]).length>1&&v.includes(';')?v.split(';').map(x=>x.trim()):[v];parts.forEach(x=>s=s.replace(/_{3,}/,x));return s}if(MODE==='spell')return q.question.replace(/[A-Za-z]?_{3,}[A-Za-z]?/,q.answers[0].split('||')[0]);let s=q.
