<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>翰林 B4U1 Reading 課文填空｜Meet the Future Meat</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#dbe2ea;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--accent:#2563eb;--accent2:#1d4ed8;--voice:#7c3aed;--voicebg:#f5f3ff}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}.wrap{max-width:980px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#eaf2ff,#fff);border:1px solid #dbeafe;border-radius:18px;padding:24px;margin-bottom:18px}.hero h1{margin:0 0 6px;font-size:clamp(25px,4vw,38px)}.hero p{margin:4px 0;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 5px 18px rgba(15,23,42,.05)}.hidden{display:none!important}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.btn{border:0;border-radius:10px;padding:11px 16px;font-size:16px;font-weight:700;cursor:pointer;background:#e5e7eb;color:#111827;text-decoration:none}.btn.primary{background:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent2)}.btn.danger{background:#991b1b;color:#fff}.btn.voice{background:var(--voice);color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.question-list{display:grid;gap:8px;margin-top:15px}.pick{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fafafa}.pick input{margin-top:5px;transform:scale(1.15)}.pick small{display:block;color:var(--muted)}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;width:0;background:var(--accent);transition:width .2s}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-weight:700;margin:8px 0 18px}.zh{font-size:22px;font-weight:800;padding:16px;border-left:5px solid var(--accent);background:#eff6ff;border-radius:8px;margin-bottom:18px}.english{font-size:20px;line-height:2.15}.blank{display:inline-block;vertical-align:middle;margin:2px 4px}.blank input,.blank select{font:inherit;min-width:92px;max-width:230px;padding:6px 8px;border:2px solid #94a3b8;border-radius:8px;background:#fff}.blank input:focus,.blank select:focus{outline:3px solid #bfdbfe;border-color:var(--accent)}.blank.correct input,.blank.correct select{border-color:var(--ok);background:var(--okbg)}.blank.wrong input,.blank.wrong select{border-color:var(--bad);background:var(--badbg)}.blank-answer{display:block;font-size:13px;line-height:1.35;color:var(--bad);font-weight:800;margin-top:2px}.feedback{margin-top:14px;padding:12px 14px;border-radius:10px;font-weight:800}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.voice-panel{margin-top:16px;padding:17px;border:2px solid #ddd6fe;border-radius:14px;background:var(--voicebg)}.voice-panel h3{margin:0 0 6px;color:#5b21b6}.voice-sentence{font-size:21px;font-weight:800;margin:8px 0 12px}.voice-result{margin-top:12px;padding:11px 13px;border-radius:9px;background:#fff;border:1px solid #ddd6fe}.voice-result.good{border-color:#86efac;background:var(--okbg);color:var(--ok)}.voice-result.retry{border-color:#fca5a5;background:var(--badbg);color:var(--bad)}.footer-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:15px 0}.stat{padding:15px;border:1px solid var(--line);border-radius:12px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong-list{display:grid;gap:12px}.wrong-card{border:1px solid #fecaca;background:#fff7f7;border-radius:12px;padding:14px}.wrong-card p{margin:5px 0}.note{font-size:14px;color:var(--muted)}@media(max-width:640px){.wrap{padding:12px}.card{padding:16px}.zh{font-size:19px}.english{font-size:18px}.voice-sentence{font-size:18px}.blank input,.blank select{min-width:76px;max-width:180px}.meta{font-size:14px}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero"><h1>翰林 B4U1 Reading 課文填空</h1><p><b>Meet the Future Meat</b></p><p>先看完整中文，再依課文完成英文挖空。答錯的空格會顯示正確答案，必須重新填對。</p><p class="note">整句答對後會自動朗讀英文，並可使用麥克風朗讀同一句。語音辨識相似度必須達到 <b>90%</b> 才算通過。</p><div class="toolbar"><a class="btn" href="index.html">← 回 B4U1 Dialogue</a></div></section>
<section id="selectScreen" class="card"><h2>1. 選擇要練習的句子</h2><div class="toolbar"><button class="btn" id="allBtn">全部選取</button><button class="btn" id="noneBtn">全部取消</button><button class="btn primary" id="startBtn">開始作答</button></div><div id="questionList" class="question-list"></div></section>
<section id="quizScreen" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="progressText"></span><span id="wrongCount"></span></div><div id="zhText" class="zh"></div><div id="enText" class="english"></div><div id="feedback" class="feedback hidden"></div><div id="voicePanel" class="voice-panel hidden"><h3>🔊 聽一聽，再自己念一次</h3><div id="voiceSentence" class="voice-sentence"></div><div class="toolbar"><button class="btn voice" id="speakBtn">🔊 再聽一次</button><button class="btn voice" id="micBtn">🎤 開始朗讀</button></div><div id="voiceResult" class="voice-result">朗讀正確性需達 90%。按「開始朗讀」後允許使用麥克風，再清楚念完整句子。</div></div><div class="footer-actions"><button class="btn primary" id="checkBtn">檢查答案</button><button class="btn primary hidden" id="nextBtn">下一題</button><button class="btn danger" id="finishBtn">結束作答</button></div></section>
<section id="resultScreen" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary-grid"></div><div id="resultMessage"></div><div id="wrongList" class="wrong-list"></div><div class="footer-actions"><button class="btn primary" id="downloadBtn">下載錯題 DOCX</button><button class="btn" id="restartBtn">重新選題</button></div></section>
</div>
<script type="module">
import { Document, Packer, Paragraph, TextRun, HeadingLevel } from "https://esm.sh/docx@9.5.1";
const B=(answer,opts={})=>({type:'blank',answer,accept:opts.accept||[answer],options:opts.options||null,width:opts.width||Math.max(82,Math.min(210,String(answer).length*15+30))});const T=text=>({type:'text',text});
const questions=[
{id:1,part:'Title',zh:'認識未來肉品',full:'Meet the Future Meat',speech:'Meet the Future Meat',segments:[B('Meet'),T(' the '),B('Future'),T(' '),B('Meat')]},
{id:2,part:'Paragraph 1',zh:'人類攝取的肉量高於以往。',full:'People eat more meat than before.',segments:[T('People eat '),B('more'),T(' '),B('meat'),T(' '),B('than'),T(' '),B('before'),T('.')]},
{id:3,part:'Paragraph 1',zh:'有些人甚至每餐都吃肉。',full:'Some even have meat for every meal.',segments:[B('Some'),T(' '),B('even'),T(' '),B('have'),T(' meat '),B('for',{options:['for','with','to']}),T(' every '),B('meal'),T('.')]},
{id:4,part:'Paragraph 1',zh:'然而，地球的人口數仍不斷攀升，所以需要養活的人口也更多。',full:'However, the number of people on earth is still growing, so there will be more mouths to feed.',segments:[B('However'),T(', the '),B('number'),T(' of people '),B('on'),T(' '),B('earth'),T(' '),B('is',{options:['is','are']}),T(' '),B('still'),T(' '),B('growing'),T(', '),B('so'),T(' '),B('there'),T(' '),B('will'),T(' '),B('be'),T(' '),B('more'),T(' '),B('mouths'),T(' '),B('to feed',{options:['feeding','to feed']}),T('.')]},
{id:5,part:'Paragraph 1',zh:'那我們要如何得到更多的肉呢？',full:'How do we get more meat then?',segments:[B('How'),T(' do we '),B('get'),T(' more meat '),B('then'),T('?')]},
{id:6,part:'Paragraph 2',zh:'馬克．波斯特博士對此有一個解決辦法。',full:'Dr. Mark Post has an answer to this.',segments:[T('Dr. Mark Post '),B('has'),T(' '),B('an'),T(' '),B('answer'),T(' '),B('to',{options:['of','to','for']}),T(' this.')]},
{id:7,part:'Paragraph 2',zh:'我們現在可以在實驗室中培養出肉。',full:'We can now grow meat in labs.',segments:[T('We can now '),B('grow'),T(' meat in '),B('labs'),T('.')]},
{id:8,part:'Paragraph 2',zh:'他和他的團隊從動物身上抽取細胞，然後培製成肉類。',full:'He and his team take cells from animals and then grow them into meat.',segments:[T('He and his '),B('team'),T(' '),B('take'),T(' '),B('cells'),T(' '),B('from'),T(' '),B('animals'),T(' and '),B('then'),T(' grow them '),B('into'),T(' meat.')]},
{id:9,part:'Paragraph 2',zh:'藉由這樣做，就不會有動物喪命。',full:'By doing so, no animals lose their lives.',segments:[B('By'),T(' '),B('doing'),T(' '),B('so'),T(', '),B('no'),T(' animals '),B('lose'),T(' '),B('their'),T(' '),B('lives'),T('.')]},
{id:10,part:'Paragraph 2',zh:'這種肉也更乾淨，因為是從實驗室中培養。',full:'This kind of meat is also cleaner because it comes from the lab.',segments:[T('This '),B('kind'),T(' of meat is '),B('also'),T(' '),B('cleaner'),T(' because it '),B('comes'),T(' '),B('from'),T(' '),B('the'),T(' '),B('lab'),T('.')]},
{id:11,part:'Paragraph 2',zh:'此外，飼養動物會製造很多溫室氣體，但培養肉不會。',full:"What's more, raising animals creates a lot of greenhouse gas, but growing lab meat doesn't.",segments:[B("What's"),T(' '),B('more'),T(', '),B('raising'),T(' animals '),B('creates'),T(' a lot of '),B('greenhouse'),T(' '),B('gas'),T(', but '),B('growing'),T(' lab meat '),B("doesn't",{options:["isn't","doesn't","won't","didn't"]}),T('.')]},
{id:12,part:'Paragraph 2',zh:'它對環境較友善，對地球也更好。',full:'It is more friendly to the environment and better for the earth.',segments:[B('It'),T(' '),B('is'),T(' '),B('more'),T(' '),B('friendly'),T(' '),B('to'),T(' '),B('the'),T(' '),B('environment'),T(' and '),B('better'),T(' '),B('for'),T(' '),B('the'),T(' '),B('earth'),T('.')]},
{id:13,part:'Paragraph 3',zh:'培養肉嚐起來如何？',full:'How does the lab meat taste?',segments:[B('How'),T(' '),B('does'),T(' the lab meat '),B('taste'),T('?')]},
{id:14,part:'Paragraph 3',zh:'許多人試過後都無法將其與真正的肉作分辨，因為它嚐起來就像真的一樣。',full:"Many people tried it and couldn't tell it from real meat because it tastes just like the real thing.",segments:[T('Many people '),B('tried'),T(' it and '),B("couldn't"),T(' '),B('tell'),T(' it '),B('from'),T(' '),B('real'),T(' meat because '),B('it'),T(' '),B('tastes'),T(' '),B('just'),T(' '),B('like'),T(' the '),B('real'),T(' '),B('thing'),T('.')]},
{id:15,part:'Paragraph 3',zh:'現在重要的問題是：',full:'Now for the big question:',segments:[T('Now '),B('for'),T(' the big '),B('question'),T(':')]},
{id:16,part:'Paragraph 3',zh:'你會想要試試嗎？',full:'Would you try it?',segments:[B('Would'),T(' you '),B('try'),T(' it?')]}
];
const state={selected:[],index:0,wrong:new Map(),attempted:new Set(),finishedCorrect:new Set()};const $=s=>document.querySelector(s),list=$('#questionList'),selectScreen=$('#selectScreen'),quizScreen=$('#quizScreen'),resultScreen=$('#resultScreen');
function norm(v){return String(v??'').trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ')}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderList(){list.innerHTML=questions.map(q=>`<label class="pick"><input type="checkbox" class="qpick" value="${q.id}" checked><span><b>第 ${q.id} 題｜${esc(q.part)}</b><small>${esc(q.zh)}</small></span></label>`).join('')}
$('#allBtn').onclick=()=>document.querySelectorAll('.qpick').forEach(x=>x.checked=true);$('#noneBtn').onclick=()=>document.querySelectorAll('.qpick').forEach(x=>x.checked=false);$('#startBtn').onclick=()=>{const ids=[...document.querySelectorAll('.qpick:checked')].map(x=>+x.value);if(!ids.length){alert('請至少選一題。');return}state.selected=questions.filter(q=>ids.includes(q.id));state.index=0;state.wrong.clear();state.attempted.clear();state.finishedCorrect.clear();selectScreen.classList.add('hidden');resultScreen.classList.add('hidden');quizScreen.classList.remove('hidden');showQuestion()};
function showQuestion(){speechSynthesis.cancel();const q=state.selected[state.index];$('#progressText').textContent=`第 ${state.index+1} / ${state.selected.length} 題｜${q.part}`;$('#wrongCount').textContent=`曾答錯 ${state.wrong.size} 題`;$('#bar').style.width=`${((state.index+1)/state.selected.length)*100}%`;$('#zhText').textContent=q.zh;const box=$('#enText');box.innerHTML='';let bi=0;q.segments.forEach(seg=>{if(seg.type==='text'){box.append(document.createTextNode(seg.text));return}const span=document.createElement('span');span.className='blank';span.dataset.bi=bi;let c;if(seg.options){c=document.createElement('select');c.innerHTML='<option value="">請選擇</option>'+seg.options.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}else{c=document.createElement('input');c.type='text';c.autocomplete='off';c.style.width=`${seg.width}px`;c.placeholder='______'}c.dataset.bi=bi;span.appendChild(c);box.appendChild(span);bi++});$('#feedback').className='feedback hidden';$('#feedback').textContent='';$('#voicePanel').classList.add('hidden');$('#checkBtn').classList.remove('hidden');$('#nextBtn').classList.add('hidden');setTimeout(()=>box.querySelector('input,select')?.focus(),0)}
function blankDefs(q){return q.segments.filter(s=>s.type==='blank')}function currentValues(){return [...$('#enText').querySelectorAll('input,select')].map(x=>x.value)}
$('#checkBtn').onclick=()=>{const q=state.selected[state.index],defs=blankDefs(q),ctrls=[...$('#enText').querySelectorAll('input,select')],vals=currentValues();if(vals.some(v=>!String(v).trim())){alert('請完成所有空格後再檢查。');return}state.attempted.add(q.id);let all=true;const wrongPieces=[];ctrls.forEach((c,i)=>{const span=c.closest('.blank'),d=defs[i],ok=d.accept.some(a=>norm(a)===norm(c.value));span.classList.remove('correct','wrong');span.querySelector('.blank-answer')?.remove();if(ok){span.classList.add('correct');c.disabled=true}else{all=false;span.classList.add('wrong');wrongPieces.push(`空格 ${i+1}: ${c.value}`);const hint=document.createElement('span');hint.className='blank-answer';hint.textContent=`正確：${d.answer}`;span.appendChild(hint);c.value='';c.disabled=false}});if(all){state.finishedCorrect.add(q.id);$('#feedback').className='feedback ok';$('#feedback').textContent='✅ 全部正確！請聽完整句子，再用麥克風朗讀。';$('#checkBtn').classList.add('hidden');$('#nextBtn').classList.remove('hidden');showVoice(q)}else{if(!state.wrong.has(q.id))state.wrong.set(q.id,{q,attempts:[]});state.wrong.get(q.id).attempts.push(wrongPieces.join('； '));$('#wrongCount').textContent=`曾答錯 ${state.wrong.size} 題`;$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 有空格錯誤。請依紅字正解重填，再按一次「檢查答案」。';$('#enText').querySelector('input:not(:disabled),select:not(:disabled)')?.focus()}};
function cleanSpeechText(q){return (q.speech||q.full).replace(/^\([^)]*\)$/,'$&').replace(/^[A-Za-z .]+:\s*/,'').trim()}
function speak(q){if(!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(cleanSpeechText(q));u.lang='en-US';u.rate=.88;speechSynthesis.cancel();speechSynthesis.speak(u)}
function canonical(s){return norm(s).replace(/\b(i'm)\b/g,'i am').replace(/\b(can't)\b/g,'cannot').replace(/\b(couldn't)\b/g,'could not').replace(/\b(doesn't)\b/g,'does not').replace(/\b(don't)\b/g,'do not').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim()}
function lev(a,b){const x=a.split(' '),y=b.split(' '),d=Array.from({length:x.length+1},()=>Array(y.length+1).fill(0));for(let i=0;i<=x.length;i++)d[i][0]=i;for(let j=0;j<=y.length;j++)d[0][j]=j;for(let i=1;i<=x.length;i++)for(let j=1;j<=y.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(x[i-1]===y[j-1]?0:1));return d[x.length][y.length]}
function similarity(a,b){const x=canonical(a),y=canonical(b);if(!x&&!y)return 1;const max=Math.max(x.split(' ').length,y.split(' ').length,1);return Math.max(0,1-lev(x,y)/max)}
function showVoice(q){$('#voicePanel').classList.remove('hidden');$('#voiceSentence').textContent=cleanSpeechText(q);$('#voiceResult').className='voice-result';$('#voiceResult').textContent='朗讀正確性需達 90%。按「開始朗讀」後，清楚念完整句子。';speak(q)}
$('#speakBtn').onclick=()=>speak(state.selected[state.index]);
$('#micBtn').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('#voiceResult').className='voice-result retry';$('#voiceResult').textContent='此瀏覽器不支援語音辨識。建議使用最新版 Chrome 或 Edge。';return}const q=state.selected[state.index],r=new SR();r.lang='en-US';r.interimResults=false;r.maxAlternatives=1;$('#micBtn').disabled=true;$('#micBtn').textContent='🎤 聆聽中…';$('#voiceResult').className='voice-result';$('#voiceResult').textContent='請開始朗讀…';r.onresult=e=>{const heard=e.results[0][0].transcript,score=Math.round(similarity(heard,cleanSpeechText(q))*100);$('#voiceResult').innerHTML=`辨識結果：<b>${esc(heard)}</b><br>相似度：<b>${score}%</b>`;if(score>=90){$('#voiceResult').className='voice-result good';$('#voiceResult').innerHTML+=`<br>✅ 朗讀通過（需達 90%）`}else{$('#voiceResult').className='voice-result retry';$('#voiceResult').innerHTML+=`<br>❌ 未達 90%，請再聽一次並重新朗讀。`}};r.onerror=e=>{$('#voiceResult').className='voice-result retry';$('#voiceResult').textContent=`語音辨識未完成：${e.error}。請再試一次。`};r.onend=()=>{$('#micBtn').disabled=false;$('#micBtn').textContent='🎤 開始朗讀'};r.start()};
$('#nextBtn').onclick=()=>{state.index++;if(state.index>=state.selected.length)finishQuiz();else showQuestion()};$('#finishBtn').onclick=()=>finishQuiz();
function finishQuiz(){speechSynthesis.cancel();quizScreen.classList.add('hidden');resultScreen.classList.remove('hidden');const selected=state.selected.length,attempted=state.attempted.size,correct=state.finishedCorrect.size,wrong=state.wrong.size;$('#summary').innerHTML=`<div class="stat">選擇題數<b>${selected}</b></div><div class="stat">已作答<b>${attempted}</b></div><div class="stat">完成答對<b>${correct}</b></div><div class="stat">曾答錯<b>${wrong}</b></div>`;if(!wrong){$('#resultMessage').innerHTML='<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>';$('#wrongList').innerHTML='';$('#downloadBtn').classList.add('hidden')}else{$('#resultMessage').innerHTML='<p>以下題目曾經答錯；即使後來已改正，仍會保留在錯題 DOCX 中。</p>';$('#wrongList').innerHTML=[...state.wrong.values()].map((r,i)=>`<div class="wrong-card"><b>${i+1}. ${esc(r.q.zh)}</b><p>錯誤紀錄：${r.attempts.map(esc).join('<br>')}</p><p><strong>正確英文：</strong>${esc(r.q.full)}</p></div>`).join('');$('#downloadBtn').classList.remove('hidden')}}$('#restartBtn').onclick=()=>{resultScreen.classList.add('hidden');selectScreen.classList.remove('hidden')};
$('#downloadBtn').onclick=async()=>{if(!state.wrong.size)return;const children=[new Paragraph({heading:HeadingLevel.TITLE,children:[new TextRun({text:'翰林 B4U1 Reading 課文填空－錯題紀錄',bold:true})]}),new Paragraph({children:[new TextRun({text:`曾答錯共 ${state.wrong.size} 題`})]})];[...state.wrong.values()].forEach((r,i)=>{children.push(new Paragraph({heading:HeadingLevel.HEADING_2,children:[new TextRun({text:`${i+1}. ${r.q.zh}`,bold:true})]}));children.push(new Paragraph({children:[new TextRun({text:'學生錯誤答案：',bold:true}),new TextRun({text:r.attempts.join(' | ')})]}));children.push(new Paragraph({children:[new TextRun({text:'正確完整英文：',bold:true}),new TextRun({text:r.q.full})]}));children.push(new Paragraph({children:[new TextRun({text:'重新練習：____________________________________________________________'})]}))});const doc=new Document({sections:[{properties:{},children}]});const blob=await Packer.toBlob(doc);const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`翰林B4U1_Reading_錯題_${new Date().toISOString().slice(0,10)}.docx`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};
renderList();
</script>
</body>
</html>
