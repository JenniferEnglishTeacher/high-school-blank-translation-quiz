<script>window.QUIZ_CONFIG={"title": "105 年國中會考英語｜單題＋克漏字", "mode": "mcq", "questions": [{"id": 1, "question": "第 1 題　Look at the picture. What is the dog doing?", "options": ["Biting the man.", "Crossing the street.", "Running after the bus.", "Sitting on the sidewalk."], "answer": 1, "answerLabel": "B", "source": "105 會考｜單題｜第 1 題", "explanation": "圖中狗正走在斑馬線上，所以是 Crossing the street（過馬路）。", "explanationSource": "own", "section": "單題"}, {"id": 2, "question": "第 2 題　Chris: Which ______ looks better on me?\nPenny: I think purple's better. You look great in purple.", "options": ["color", "grade", "shape", "size"], "answer": 0, "answerLabel": "A", "source": "105 會考｜單題｜第 2 題", "explanation": "Penny 回答紫色比較好，可見問的是「顏色」：Which color looks better on me?", "explanationSource": "own", "section": "單題"}, {"id": 3, "question": "第 3 題　My cat got excited when it saw the boy ______ the birds.", "options": ["catches", "catching", "to catch", "caught"], "answer": 1, "answerLabel": "B", "source": "105 會考｜單題｜第 3 題", "explanation": "感官動詞 see + 受詞 + V-ing／原形動詞。saw the boy catching the birds＝看見男孩正在抓鳥。", "explanationSource": "own", "section": "單題"}, {"id": 4, "question": "第 4 題　Mr. Jackson is a very ______ writer; people of all ages enjoy his stories.", "options": ["polite", "popular", "handsome", "honest"], "answer": 1, "answerLabel": "B", "source": "105 會考｜單題｜第 4 題", "explanation": "後句說各年齡層都喜歡他的故事，表示他是「受歡迎的」作家 popular。", "explanationSource": "own", "section": "單題"}, {"id": 5, "question": "第 5 題　Carol sounded happy when we talked on the phone; I could feel joy in her ______.", "options": ["eyes", "mail", "smile", "voice"], "answer": 3, "answerLabel": "D", "source": "105 會考｜單題｜第 5 題", "explanation": "講電話時只聽得到聲音，所以是從她的 voice（聲音）感受到喜悅。", "explanationSource": "own", "section": "單題"}, {"id": 6, "question": "第 6 題　Mark studies very hard and never ______ classes. He goes to school even when he is sick.", "options": ["loses", "misses", "changes", "forgets"], "answer": 1, "answerLabel": "B", "source": "105 會考｜單題｜第 6 題", "explanation": "生病還去上學，表示他從不「缺課」：miss classes。", "explanationSource": "own", "section": "單題"}, {"id": 7, "question": "第 7 題　Have you got anything for Joe ______? He'd be happy to get your gift on his birthday.", "options": ["almost", "either", "soon", "yet"], "answer": 3, "answerLabel": "D", "source": "105 會考｜單題｜第 7 題", "explanation": "Have you got...? 是現在完成式問句，句尾用 yet「已經…了嗎」。", "explanationSource": "own", "section": "單題"}, {"id": 8, "question": "第 8 題　Susan bought ______ bread in the supermarket, but she did not buy anything to drink.", "options": ["many", "some", "any", "one"], "answer": 1, "answerLabel": "B", "source": "105 會考｜單題｜第 8 題", "explanation": "bread 是不可數名詞；肯定句表示「一些」用 some。many 接可數，any 多用於否定或疑問句。", "explanationSource": "own", "section": "單題"}, {"id": 9, "question": "第 9 題　Playing sports at least three times a week ______ good for your health.", "options": ["is", "are", "has", "have"], "answer": 0, "answerLabel": "A", "source": "105 會考｜單題｜第 9 題", "explanation": "動名詞片語 Playing sports... 當主詞視為單數，用 is。", "explanationSource": "own", "section": "單題"}, {"id": 10, "question": "第 10 題　My parents have different hobbies. One enjoys baking; ______ enjoys taking pictures.", "options": ["another", "the next", "the other", "the second"], "answer": 2, "answerLabel": "C", "source": "105 會考｜單題｜第 10 題", "explanation": "父母只有兩個人：one…, the other…（一個…，另一個…）。another 用於三者以上。", "explanationSource": "own", "section": "單題"}, {"id": 11, "question": "第 11 題　My mom told me to take care of ______ in England. She worried that I couldn't eat or sleep well there.", "options": ["me", "myself", "her", "herself"], "answer": 1, "answerLabel": "B", "source": "105 會考｜單題｜第 11 題", "explanation": "主詞（我）和受詞是同一人，take care of myself（照顧自己）。", "explanationSource": "own", "section": "單題"}, {"id": 12, "question": "第 12 題　The paint on the wall is not as ______ as it was ten years ago. It has changed from white to gray.", "options": ["bright", "heavy", "sure", "young"], "answer": 0, "answerLabel": "A", "source": "105 會考｜單題｜第 12 題", "explanation": "從白色變成灰色，表示牆上的油漆不像十年前那麼「明亮」bright。", "explanationSource": "own", "section": "單題"}, {"id": 13, "question": "第 13 題　I told you this road went the wrong way, but you just wouldn't listen. Now we have to ______ and take another road.", "options": ["go ahead", "move away", "pass by", "turn back"], "answer": 3, "answerLabel": "D", "source": "105 會考｜單題｜第 13 題", "explanation": "走錯路要「掉頭」改走另一條路：turn back。", "explanationSource": "own", "section": "單題"}, {"id": 14, "question": "第 14 題　The last five years have not been ______ to Jennie. Her face is covered with lines and she looks much older than she is.", "options": ["kind", "special", "real", "enough"], "answer": 0, "answerLabel": "A", "source": "105 會考｜單題｜第 14 題", "explanation": "滿臉皺紋、看起來比實際年齡老很多，表示這五年對她「不仁慈」：be kind to sb.", "explanationSource": "own", "section": "單題"}, {"id": 15, "question": "第 15 題　My dog Jimmy loves ______ with a comb. Every time I comb his hair, he will close his eyes and fall asleep.", "options": ["to brush", "brushing", "to be brushing", "being brushed"], "answer": 3, "answerLabel": "D", "source": "105 會考｜單題｜第 15 題", "explanation": "狗是「被」梳毛，love 後接動名詞的被動 being brushed。", "explanationSource": "own", "section": "單題"}, {"id": 35, "question": "【克漏字 第 35–38 題】\nIt was 11 p.m. and Molly walked out of her bakery. She turned and looked at her store one last time. She wanted to remember what it __35__ at the moment. A few hours later, people would come and clean out everything in the store. A young man had bought it. He __36__ it into a flower shop.\nBefore it was a bakery, this place __37__ a small coffee shop. Molly worked in the shop as a waitress. But taking orders was never Molly’s dream; baking was. When she knew her boss planned to sell the shop, she borrowed money and bought it.\nHer bakery had been open for thirty years. Thirty very wonderful years. However, it would all come to an end tonight. Molly __38__ the bakery to be a family business. But her daughter was never interested in baking. Molly did not want her business in a stranger’s hands, so after some serious thinking, she decided to close it.\n“Goodbye, my dear old friend,” Molly looked at the store, whispering.\n\n▶ 第 35 題　請選出 __35__ 的最佳答案", "options": ["had looked like", "looked like", "would look like", "has looked like"], "answer": 1, "answerLabel": "B", "source": "105 會考｜克漏字｜第 35 題", "explanation": "故事用過去式敘述，她想記住店「在那一刻」看起來的樣子：looked like。", "explanationSource": "own", "section": "克漏字"}, {"id": 36, "question": "【克漏字 第 35–38 題】\nIt was 11 p.m. and Molly walked out of her bakery. She turned and looked at her store one last time. She wanted to remember what it __35__ at the moment. A few hours later, people would come and clean out everything in the store. A young man had bought it. He __36__ it into a flower shop.\nBefore it was a bakery, this place __37__ a small coffee shop. Molly worked in the shop as a waitress. But taking orders was never Molly’s dream; baking was. When she knew her boss planned to sell the shop, she borrowed money and bought it.\nHer bakery had been open for thirty years. Thirty very wonderful years. However, it would all come to an end tonight. Molly __38__ the bakery to be a family business. But her daughter was never interested in baking. Molly did not want her business in a stranger’s hands, so after some serious thinking, she decided to close it.\n“Goodbye, my dear old friend,” Molly looked at the store, whispering.\n\n▶ 第 36 題　請選出 __36__ 的最佳答案", "options": ["had changed", "changed", "was going to change", "has changed"], "answer": 2, "answerLabel": "C", "source": "105 會考｜克漏字｜第 36 題", "explanation": "新店主買下後「打算」把它改成花店，是過去時間點之後才要發生的事：was going to change。", "explanationSource": "own", "section": "克漏字"}, {"id": 37, "question": "【克漏字 第 35–38 題】\nIt was 11 p.m. and Molly walked out of her bakery. She turned and looked at her store one last time. She wanted to remember what it __35__ at the moment. A few hours later, people would come and clean out everything in the store. A young man had bought it. He __36__ it into a flower shop.\nBefore it was a bakery, this place __37__ a small coffee shop. Molly worked in the shop as a waitress. But taking orders was never Molly’s dream; baking was. When she knew her boss planned to sell the shop, she borrowed money and bought it.\nHer bakery had been open for thirty years. Thirty very wonderful years. However, it would all come to an end tonight. Molly __38__ the bakery to be a family business. But her daughter was never interested in baking. Molly did not want her business in a stranger’s hands, so after some serious thinking, she decided to close it.\n“Goodbye, my dear old friend,” Molly looked at the store, whispering.\n\n▶ 第 37 題　請選出 __37__ 的最佳答案", "options": ["used to be", "would be", "has been", "is"], "answer": 0, "answerLabel": "A", "source": "105 會考｜克漏字｜第 37 題", "explanation": "開烘焙坊之前，這裡「以前是」一家咖啡店：used to be。", "explanationSource": "own", "section": "克漏字"}, {"id": 38, "question": "【克漏字 第 35–38 題】\nIt was 11 p.m. and Molly walked out of her bakery. She turned and looked at her store one last time. She wanted to remember what it __35__ at the moment. A few hours later, people would come and clean out everything in the store. A young man had bought it. He __36__ it into a flower shop.\nBefore it was a bakery, this place __37__ a small coffee shop. Molly worked in the shop as a waitress. But taking orders was never Molly’s dream; baking was. When she knew her boss planned to sell the shop, she borrowed money and bought it.\nHer bakery had been open for thirty years. Thirty very wonderful years. However, it would all come to an end tonight. Molly __38__ the bakery to be a family business. But her daughter was never interested in baking. Molly did not want her business in a stranger’s hands, so after some serious thinking, she decided to close it.\n“Goodbye, my dear old friend,” Molly looked at the store, whispering.\n\n▶ 第 38 題　請選出 __38__ 的最佳答案", "options": ["had wanted", "has wanted", "would want", "will want"], "answer": 0, "answerLabel": "A", "source": "105 會考｜克漏字｜第 38 題", "explanation": "在決定關店之前，她「原本一直希望」烘焙坊成為家族事業，用過去完成式 had wanted。", "explanationSource": "own", "section": "克漏字"}, {"id": 39, "question": "【克漏字 第 39–41 題】\nWhat does the word family mean to you? An American study in 2006 showed that people today __39__. Over 99% of the people who were interviewed agree that a husband, a wife, and a child are a family. At the same time, 94% see a parent with a child as a family, 91% say a husband and a wife, without children, are a family, and 81% think a man and a woman, with a child, but not married, are a family too.\nThe study also found that __40__ is very important in the modern thinking on family. Though 81% think a man and a woman, not married, with a child, are a family, the percentage (%) drops to 40% if the couple doesn’t have a child. This is also true with same-sex couples. About 60% see two men, or two women, with a child, as a family, but only 32% think so when the couple doesn’t have a child.\nIn the study, those who see two men or two women that live together as a family often find it OK for same-sex couples to get married. __41__. However, not everyone opens their arms to same-sex couples: the study said 30% have no problem seeing pets as part of one’s family, but they do not think a same-sex couple is a family.\n\n▶ 第 39 題　請選出 __39__ 的最佳答案", "options": ["think differently about when to start a family", "do not find family as important as their parents did", "want many different things when they start a family", "have several different ideas about what makes a family"], "answer": 3, "answerLabel": "D", "source": "105 會考｜克漏字｜第 39 題", "explanation": "後面列出各種被視為「家庭」的組合與比例，表示人們對「什麼構成家庭」有多種看法。", "explanationSource": "own", "section": "克漏字"}, {"id": 40, "question": "【克漏字 第 39–41 題】\nWhat does the word family mean to you? An American study in 2006 showed that people today __39__. Over 99% of the people who were interviewed agree that a husband, a wife, and a child are a family. At the same time, 94% see a parent with a child as a family, 91% say a husband and a wife, without children, are a family, and 81% think a man and a woman, with a child, but not married, are a family too.\nThe study also found that __40__ is very important in the modern thinking on family. Though 81% think a man and a woman, not married, with a child, are a family, the percentage (%) drops to 40% if the couple doesn’t have a child. This is also true with same-sex couples. About 60% see two men, or two women, with a child, as a family, but only 32% think so when the couple doesn’t have a child.\nIn the study, those who see two men or two women that live together as a family often find it OK for same-sex couples to get married. __41__. However, not everyone opens their arms to same-sex couples: the study said 30% have no problem seeing pets as part of one’s family, but they do not think a same-sex couple is a family.\n\n▶ 第 40 題　請選出 __40__ 的最佳答案", "options": ["whether people are married or not", "whether people have a child or not", "whether people live together or not", "whether people love each other or not"], "answer": 1, "answerLabel": "B", "source": "105 會考｜克漏字｜第 40 題", "explanation": "後文比較「有小孩／沒小孩」時比例大幅下降（81%→40%、60%→32%），關鍵是有沒有孩子。", "explanationSource": "own", "section": "克漏字"}, {"id": 41, "question": "【克漏字 第 39–41 題】\nWhat does the word family mean to you? An American study in 2006 showed that people today __39__. Over 99% of the people who were interviewed agree that a husband, a wife, and a child are a family. At the same time, 94% see a parent with a child as a family, 91% say a husband and a wife, without children, are a family, and 81% think a man and a woman, with a child, but not married, are a family too.\nThe study also found that __40__ is very important in the modern thinking on family. Though 81% think a man and a woman, not married, with a child, are a family, the percentage (%) drops to 40% if the couple doesn’t have a child. This is also true with same-sex couples. About 60% see two men, or two women, with a child, as a family, but only 32% think so when the couple doesn’t have a child.\nIn the study, those who see two men or two women that live together as a family often find it OK for same-sex couples to get married. __41__. However, not everyone opens their arms to same-sex couples: the study said 30% have no problem seeing pets as part of one’s family, but they do not think a same-sex couple is a family.\n\n▶ 第 41 題　請選出 __41__ 的最佳答案", "options": ["This is not surprising", "This is not possible everywhere", "It is no good news for everyone", "It cannot be this way for very long"], "answer": 0, "answerLabel": "A", "source": "105 會考｜克漏字｜第 41 題", "explanation": "把同性伴侶視為家庭的人也贊成同性婚姻，這「不令人意外」；後面再用 However 轉折。", "explanationSource": "own", "section": "克漏字"}]};window.CAP_IMG={"第 1 題　Look at the picture. What is the dog doing?": "assets/cap-past-exams/cap105-q1.png?v=20261119-1"};</script><script src="longteng-b1u5-quiz.js?v=20261106-3"></script><script>(function(){var M=window.CAP_IMG||{};var qn=document.getElementById('question');if(!qn)return;function put(){var old=document.getElementById('capImg');var t=qn.textContent;var src=M[t];if(old&&old.dataset.src===src)return;if(old)old.remove();if(!src)return;var im=document.createElement('img');im.id='capImg';im.dataset.src=src;im.src=src;im.alt='題目圖片';im.style.cssText='display:block;max-width:100%;max-height:420px;margin:10px auto;border:1px solid #dbe3ee;border-radius:10px;background:#fff';qn.insertAdjacentElement('afterend',im)}new MutationObserver(put).observe(qn,{childList:true,characterData:true,subtree:true});})();</script><script>document.querySelector("#description").textContent="105 年會考英語閱讀：單題 15 題＋克漏字 7 題｜四選一｜附中文解析｜可隨機 20 題、隨時結束並下載 DOCX 錯題";</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
