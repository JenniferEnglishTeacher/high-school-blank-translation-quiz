<body>
<div class="wrap">
<section class="hero"><h1>翰林 B4U2 Dialogue 課文填空</h1><p>先看完整中文，再依課文完成英文挖空。答錯會顯示正確答案，必須重新填對。</p><p class="note">整句填對後會自動朗讀英文；學生再用麥克風朗讀，語音辨識相似度需達 <b>90%</b> 才算通過。建議使用最新版 Chrome 或 Edge。</p></section>
<section id="selectScreen" class="card"><h2>1. 選擇要練習的句子</h2><div class="toolbar"><button class="btn" id="allBtn">全部選取</button><button class="btn" id="noneBtn">全部取消</button><button class="btn primary" id="startBtn">開始作答</button></div><div id="questionList" class="question-list"></div></section>

<section id="resultScreen" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary-grid"></div><div id="resultMessage"></div><div id="wrongList" class="wrong-list"></div><div class="footer-actions"><button class="btn primary" id="downloadBtn">下載錯題 DOCX</button><button class="btn" id="restartBtn">重新選題</button></div></section>

Q(10,'這些螞蟻會咬你。','The ants will bite you.',[T('The ants '),B('will'),T(' '),B('bite'),T(' you.')]),
Q(11,'用熱水將牠們殺死是最簡單且最快速的方式。','Killing them with hot water is the easiest and fastest way.',[B('Killing',{options:['Kill','To kill','Killing']}),T(' '),B('them',{options:['they','them']}),T(' '),B('with'),T(' hot water is '),B('the'),T(' '),B('easiest'),T(' and '),B('fastest'),T(' '),B('way'),T('.')]),

Q(17,'艾拉：小心石頭。石頭下可能會有蛇。','Ela: Watch out for the rock. There might be a snake under it.',[T('Ela: '),B('Watch'),T(' '),B('out'),T(' '),B('for'),T(' the rock. '),B('There'),T(' '),B('might'),T(' '),B('be'),T(' a snake '),B('under'),T(' '),B('it',{options:['it','one']}),T('.')]),
Q(18,'蛇喜歡躲在陰暗且潮濕的地方。','Snakes like to hide in dark wet places.',[T('Snakes like '),B('to hide',{options:['hide','to hide','hiding']}),T(' '),B('in'),T(' '),B('dark'),T(' '),B('wet'),T(' '),B('places'),T('.')]),
Q(19,'寇弟：謝謝你告訴我。','Cody: Thanks for telling me.',[T('Cody: '),B('Thanks',{options:['Thank','Thanks']}),T(' '),B('for'),T(' '),B('telling'),T(' me.')]),
Q(20,'對我來說，蛇是最可怕的動物。','Snakes are the scariest animals to me.',[B('Snakes'),T(' '),B('are'),T(' '),B('the'),T(' '),B('scariest'),T(' '),B('animals'),T(' '),B('to'),T(' '),B('me'),T('.')]),
Q(21,'柴克：嘿，我們何不去河裡玩？','Zac: Hey, why don\'t we go play in the river?',[T('Zac: Hey, '),B('why'),T(' '),B("don't"),T(' '),B('we'),T(' '),B('go',{options:['going','go']}),T(' '),B('play',{options:['playing','play','to play']}),T(' '),B('in'),T(' '),B('the'),T(' '),B('river'),T('?')]),
Q(22,'這看起來很有趣的樣子。','It looks like fun.',[B('It'),T(' '),B('looks'),T(' '),B('like'),T(' '),B('fun'),T('.')]),
Q(23,'由紀：那不是個好主意。這水很深。',"Yuki: That's not a good idea. The water is deep.",[T('Yuki: '),B("That's"),T(' not '),B('a'),T(' '),B('good'),T(' '),B('idea'),T('. The water is '),B('deep'),T('.')]),
Q(24,'艾拉：戶外安全很重要。','Ela: Outdoor safety is important.',[T('Ela: '),B('Outdoor'),T(' '),B('safety'),T(' '),B('is'),T(' '),B('important'),T('.')]),
Q(25,'安全勝過遺憾。',"It's better to be safe than sorry.",[B("It's"),T(' '),B('better'),T(' '),B('to'),T(' '),B('be'),T(' '),B('safe'),T(' '),B('than'),T(' '),B('sorry'),T('.')]),

];
const state={selected:[],index:0,wrong:new Map(),attempted:new Set(),finishedCorrect:new Set(),speechPassed:new Set()};
const $=s=>document.querySelector(s);const list=$('#questionList'),selectScreen=$('#selectScreen'),quizScreen=$('#quizScreen'),resultScreen=$('#resultScreen');
function norm(v){return String(v??'').trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ')}
function speechNorm(v){return norm(v).replace(/\b(i'm)\b/g,'i am').replace(/\b(don't)\b/g,'do not').replace(/\b(that's)\b/g,'that is').replace(/\b(they're)\b/g,'they are').replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ').trim()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function spokenText(full){return full.replace(/^[A-Za-z]+:\s*/, '').replace(/^\(|\)$/g,'').trim()}
function renderList(){list.innerHTML=questions.map(q=>`<label class="pick"><input type="checkbox" class="qpick" value="${q.id}" checked><span><b>第 ${q.id} 題｜${esc(q.part)}</b><small>${esc(q.zh)}</small></span></label>`).join('')}
$('#allBtn').onclick=()=>document.querySelectorAll('.qpick').forEach(x=>x.checked=true);$('#noneBtn').onclick=()=>document.querySelectorAll('.qpick').forEach(x=>x.checked=false);
$('#startBtn').onclick=()=>{const ids=[...document.querySelectorAll('.qpick:checked')].map(x=>+x.value);if(!ids.length){alert('請至少選一題。');return}state.selected=questions.filter(q=>ids.includes(q.id));state.index=0;state.wrong.clear();state.attempted.clear();state.finishedCorrect.clear();state.speechPassed.clear();selectScreen.classList.add('hidden');resultScreen.classList.add('hidden');quizScreen.classList.remove('hidden');showQuestion()};
function showQuestion(){const q=state.selected[state.index];$('#progressText').textContent=`第 ${state.index+1} / ${state.selected.length} 題｜${q.part}`;$('#wrongCount').textContent=`曾答錯 ${state.wrong.size} 題`;$('#bar').style.width=`${((state.index+1)/state.selected.length)*100}%`;$('#zhText').textContent=q.zh;const box=$('#enText');box.innerHTML='';let bi=0;q.segments.forEach(seg=>{if(seg.type==='text'){box.append(document.createTextNode(seg.text));return}const span=document.createElement('span');span.className='blank';span.dataset.bi=bi;let c;if(seg.options){c=document.createElement('select');c.innerHTML='<option value="">請選擇</option>'+seg.options.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}else{c=document.createElement('input');c.type='text';c.autocomplete='off';c.style.width=`${seg.width}px`;c.placeholder='______'}c.dataset.bi=bi;span.appendChild(c);box.appendChild(span);bi++});$('#feedback').className='feedback hidden';$('#voicePanel').classList.add('hidden');$('#checkBtn').classList.remove('hidden');$('#nextBtn').classList.add('hidden');$('#nextBtn').disabled=true;setTimeout(()=>box.querySelector('input,select')?.focus(),0)}
function blankDefs(q){return q.segments.filter(s=>s.type==='blank')}
function currentValues(){return [...$('#enText').querySelectorAll('input,select')].map(x=>x.value)}
$('#checkBtn').onclick=()=>{const q=state.selected[state.index],defs=blankDefs(q),ctrls=[...$('#enText').querySelectorAll('input,select')],vals=currentValues();if(vals.some(v=>!String(v).trim())){alert('請完成所有空格後再檢查。');return}state.attempted.add(q.id);let all=true;const wrongPieces=[];ctrls.forEach((c,i)=>{const span=c.closest('.blank'),d=defs[i],ok=d.accept.some(a=>norm(a)===norm(c.value));span.classList.remove('correct','wrong');span.querySelector('.blank-answer')?.remove();if(ok){span.classList.add('correct');c.disabled=true}else{all=false;span.classList.add('wrong');wrongPieces.push(`空格 ${i+1}: ${c.value}`);const hint=document.createElement('span');hint.className='blank-answer';hint.textContent=`正確：${d.answer}`;span.appendChild(hint);c.value='';c.disabled=false}});if(all){state.finishedCorrect.add(q.id);$('#feedback').className='feedback ok';$('#feedback').textContent='✅ 填空全部正確！接著朗讀完整句子，需達 90% 才能進入下一題。';$('#checkBtn').classList.add('hidden');$('#nextBtn').classList.remove('hidden');setupVoice(q)}else{if(!state.wrong.has(q.id))state.wrong.set(q.id,{q,attempts:[]});state.wrong.get(q.id).attempts.push(wrongPieces.join('； '));$('#wrongCount').textContent=`曾答錯 ${state.wrong.size} 題`;$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 有空格錯誤。請依紅色提示重填錯誤空格，再按一次「檢查答案」。';$('#enText').querySelector('input:not(:disabled),select:not(:disabled)')?.focus()}};
function setupVoice(q){const target=spokenText(q.full);$('#voiceSentence').textContent=target;$('#voicePanel').classList.remove('hidden');$('#voiceResult').className='voice-result';$('#voiceResult').textContent='朗讀辨識需達 90% 才能進入下一題。';speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(target);u.lang='en-US';u.rate=.9;speechSynthesis.speak(u);const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('#voiceResult').className='voice-result retry';$('#voiceResult').textContent='此瀏覽器不支援語音辨識。建議改用 Chrome / Edge。為避免卡住，仍可進入下一題。';$('#nextBtn').disabled=false;return}$('#nextBtn').disabled=!state.speechPassed.has(q.id)}
$('#speakBtn').onclick=()=>{const q=state.selected[state.index],u=new SpeechSynthesisUtterance(spokenText(q.full));u.lang='en-US';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)};
function similarity(a,b){const A=speechNorm(a).split(' ').filter(Boolean),B=speechNorm(b).split(' ').filter(Boolean);const dp=Array(B.length+1).fill(0);for(const x of A){let prev=0;for(let j=1;j<=B.length;j++){const t=dp[j];dp[j]=x===B[j-1]?prev+1:Math.max(dp[j],dp[j-1]);prev=t}}return B.length?dp[B.length]/B.length:0}
$('#micBtn').onclick=()=>{const q=state.selected[state.index],SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;const r=new SR();r.lang='en-US';r.interimResults=false;r.maxAlternatives=1;$('#micBtn').disabled=true;$('#micBtn').textContent='🎙️ 聆聽中...';$('#voiceResult').className='voice-result';$('#voiceResult').textContent='請清楚朗讀完整句子。';r.onresult=e=>{const heard=e.results[0][0].transcript,target=spokenText(q.full),score=Math.round(similarity(heard,target)*100);$('#voiceResult').innerHTML=`辨識結果：<b>${esc(heard)}</b><br>相似度：<b>${score}%</b>`;if(score>=90){state.speechPassed.add(q.id);$('#voiceResult').className='voice-result good';$('#voiceResult').innerHTML+= '<br>✅ 朗讀通過！';$('#nextBtn').disabled=false}else{$('#voiceResult').className='voice-result retry';$('#voiceResult').innerHTML+= '<br>❌ 未達 90%，請再朗讀一次。';$('#nextBtn').disabled=true}};r.onerror=e=>{$('#voiceResult').className='voice-result retry';$('#voiceResult').textContent=`語音辨識失敗：${e.error}。請再試一次。`};r.onend=()=>{$('#micBtn').disabled=false;$('#micBtn').textContent='🎤 開始朗讀'};try{r.start()}catch(e){$('#micBtn').disabled=false;$('#micBtn').textContent='🎤 開始朗讀'}};
$('#nextBtn').onclick=()=>{if($('#nextBtn').disabled)return;state.index++;if(state.index>=state.selected.length)finishQuiz();else showQuestion()};$('#finishBtn').onclick=()=>finishQuiz();
function finishQuiz(){speechSynthesis.cancel();quizScreen.classList.add('hidden');resultScreen.classList.remove('hidden');const selected=state.selected.length,attempted=state.attempted.size,correct=state.finishedCorrect.size,wrong=state.wrong.size,speech=state.speechPassed.size;$('#summary').innerHTML=`<div class="stat">選擇題數<b>${selected}</b></div><div class="stat">已作答<b>${attempted}</b></div><div class="stat">填空完成<b>${correct}</b></div><div class="stat">朗讀通過<b>${speech}</b></div><div class="stat">曾答錯<b>${wrong}</b></div>`;if(!wrong){$('#resultMessage').innerHTML='<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>';$('#wrongList').innerHTML='';$('#downloadBtn').classList.add('hidden')}else{$('#resultMessage').innerHTML='<p>以下題目曾經答錯；即使後來已改正，仍會保留在錯題 DOCX 中。</p>';$('#wrongList').innerHTML=[...state.wrong.values()].map((r,i)=>`<div class="wrong-card"><b>${i+1}. ${esc(r.q.zh)}</b><p>錯誤紀錄：${r.attempts.map(esc).join('<br>')}</p><p><strong>正確英文：</strong>${esc(r.q.full)}</p></div>`).join('');$('#downloadBtn').classList.remove('hidden')}}
$('#restartBtn').onclick=()=>{resultScreen.classList.add('hidden');selectScreen.classList.remove('hidden')};
$('#downloadBtn').onclick=async()=>{if(!state.wrong.size)return;const children=[new Paragraph({heading:HeadingLevel.TITLE,children:[new TextRun({text:'翰林 B4U2 Dialogue 課文填空－錯題紀錄',bold:true})]}),new Paragraph({children:[new TextRun({text:`曾答錯共 ${state.wrong.size} 題`})]})];[...state.wrong.values()].forEach((r,i)=>{children.push(new Paragraph({heading:HeadingLevel.HEADING_2,children:[new TextRun({text:`${i+1}. ${r.q.zh}`,bold:true})]}));children.push(new Paragraph({children:[new TextRun({text:'學生錯誤答案：',bold:true}),new TextRun({text:r.attempts.join(' | ')})]}));children.push(new Paragraph({children:[new TextRun({text:'正確完整英文：',bold:true}),new TextRun({text:r.q.full})]}));children.push(new Paragraph({children:[new TextRun({text:'重新練習：____________________________________________________________'})]}))});const doc=new Document({sections:[{properties:{},children}]});const blob=await Packer.toBlob(doc);const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`翰林B4U2_Dialogue_錯題_${new Date().toISOString().slice(0,10)}.docx`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};
renderList();
</script>
