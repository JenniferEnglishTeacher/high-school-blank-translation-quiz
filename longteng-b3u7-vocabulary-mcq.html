rder-radius:9px;color:var(--amber);font-weight:800;margin-bottom:10px}.question{font-size:21px;font-weight:750;padding:16px;background:#f8fafc;border-radius:11px;white-space:pre-wrap}.options{display:grid;gap:9px;margin:14px 0}.option{display:flex;align-items:center;gap:11px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-size:18px;font-weight:750;cursor:pointer}.option:hover{border-color:#60a5fa;background:#eff6ff}.option:has(input:checked){border-color:var(--blue);background:#dbeafe;color:var(--navy)}.option input{width:20px;height:20px;accent-color:var(--blue)}.inputs{display:grid;gap:10px;margin:15px 0}.answer-row{display:grid;grid-template-columns:55px 1fr;gap:10px;align-items:center}.answer-row label{font-weight:900;color:var(--navy);text-align:center}.spell{width:100%;font:inherit;font-size:18px;padding:11px;border:2px solid #94a3b8;border-radius:9px}.feedback{padding:13px;border-radius:10px;font-weight:800;margin:13px 0}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.explain{font-weight:500;margin-top:7px}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:var(--voicebg);margin:13px 0}.voicebox b{display:block;font-size:19px;margin-bottom:8px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}.wrong p{margin:6px 0}.source{font-size:13px;color:var(--muted)}@media(max-width:600px){.wrap{padding:9px}.hero,.card{padding:15px}.question{font-size:18px;padding:13px}.option{font-size:17px}.answer-row{grid-template-columns:42px 1fr}.meta{display:block}}</style><link rel="stylesheet" href="longteng-vocab-required-pronunciation.css?v=20261026-4"></head><body><main class="wrap"><section class="hero"><h1>龍騰普高 B3U7 單字選擇</h1><p>共 30 題。可自行選題、隨機抽題；答錯後請重新作答。</p><p class="note">答對後顯示來源解析並播放完整英文句；STT 朗讀達 80% 才能進入下一題。完成後可重做錯題並下載 DOCX。</p><div class="toolbar"><a class="btn" href="dashboard.html">← 回測驗總覽</a></div></section><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn">全部選取</button><button id="none" class="btn">全部取消</button><button id="rand20" class="btn">隨機 20 題</button></div><label><input id="shuffle" type="checkbox"> 打亂出題順序</label><div id="list"></div><div class="actions"><button id="start" class="btn primary">開始作答</button><span id="picked" class="note"></span></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="voiceBox" class="voicebox hidden"><b id="voiceTarget"></b><button id="speak" class="btn voice">🔊 再聽一次</button></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="retry" class="btn primary">只重做錯題</button><button id="download" class="btn">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></main><script>const TITLE="龍騰普高 B3U7 單字選擇",MODE="mcq",Q=[{"id":1,"question":"I know the wound on your forearm is very itchy, but don’t ____________, or it may leave a scar.","options":["exhibit","scratch","observe","interpret"],"answer":1,"explanation":"我知道你前手臂的傷口很癢，但不要抓，否則會留疤痕在上面。 (A)展現 (B)抓 (C)觀察 (D)詮釋","source":"龍騰自命題"},{"id":2,"question":"Peggy does not like the location of the house, which is far from her work. ____________, the price of houses in that area is very high.","options":["Initially","Automatically","Moreover","However"],"answer":2,"explanation":"Peggy不喜歡這房子的地點，離她的工作很遠。再者，那地區房子的價格很高。 (A)起初 (B)自動地 (C)再者 (D)然而","source":"龍騰自命題"},{"id":3,"question":"During the field trip, the teacher made a ____________ at the students to be quiet.","options":["gesture","affection","reverse","scratch"],"answer":0,"explanation":"在戶外教學期間，老師用手勢示意學生安靜。 (A)手勢 (B)喜愛 (C)相反的情況或事物 (D)刮痕；抓傷","source":"龍騰自命題"},{"id":4,"question":"Jill thinks it is ____________ to give money to this charity, which uses the money collected to build schools and hospitals across Africa.","options":["automatic","meaningful","theoretical","conscious"],"answer":1,"explanation":"Jill認為把錢給這個慈善機構有意義，這家機構用募集的錢在非洲各地建造學校與醫院。 (A)自動的 (B)有意義的 (C)理論上的 (D)有意識的","source":"龍騰自命題"},{"id":5,"question":"The effects of this medication can’t be ____________, so once you’ve taken it, there’s no turning back.","options":["tracked","adored","demonstrated","reversed"],"answer":3,"explanation":"這種藥物的效應無法反轉，所以一旦你服用了它，便無法反悔了。 (A)追蹤 (B)愛慕 (C)表達 (D)反轉","source":"龍騰自命題"},{"id":6,"question":"The movie’s open ending allowed everyone to form his or her own ____________ of what message the director was trying to convey and what might actually happen to the characters.","options":["interaction","circumstance","interpretation","gesture"],"answer":2,"explanation":"這部電影的開放式結局讓每個人得以形成自己對導演試圖傳達的訊息以及角色可能發生的實際情況做詮釋。 (A)互動 (B)條件；狀況 (C)解釋；詮釋 (D)手勢；姿勢","source":"龍騰自命題"},{"id":7,"question":"My biology teacher used illustrations to make the complex scientific ____________ easier to understand.","options":["theory","gesture","latter","toll"],"answer":0,"explanation":"我的生物老師運用圖解讓複雜的科學理論較容易理解。 (A)理論 (B)手勢；姿勢 (C)後者 (D)傷亡人數","source":"龍騰自命題"},{"id":8,"question":"We need ____________ evidence to back up our new theory, or people may not think it’s possible in practice.","options":["fellow","automatic","initial","significant"],"answer":3,"explanation":"我們需要顯著的證據來支持我們的新理論，否則人們可能不會認為這是可實踐的。 (A)同伴的；同事的 (B)自動的 (C)最初的 (D)重要的；顯著的","source":"龍騰自命題"},{"id":9,"question":"The ____________ between the twins always impresses their friends. They can often guess what the other person is thinking or going to do next.","options":["circumstances","interactions","glances","fellows"],"answer":1,"explanation":"那對雙胞胎之間的互動總是讓他們的朋友印象深刻。他們常常可以猜到對方在想什麼或接下來打算做什麼。 (A)條件；狀況 (B)互動 (C)匆匆一瞥 (D)同事；同輩","source":"龍騰自命題"},{"id":10,"question":"The research didn’t show any good results during its ____________ stages, but later down the line the new vaccine proved more and more useful.","options":["theoretical","initial","fellow","stiff"],"answer":1,"explanation":"研究在最初階段並未顯示出任何好結果，但是日後證實了這個新的疫苗愈來愈有效。 (A)理論上的 (B)最初的 (C)同伴的；同事的 (D)僵硬的","source":"龍騰自命題"},{"id":11,"question":"Kate is having a great time getting to know her new ____________ workers at the theme park.","options":["fellow","stiff","psychological","theoretical"],"answer":0,"explanation":"Kate正和新同事們愉快的在遊樂園相處認識彼此。 (A)同伴的；同事的 (B)僵硬的 (C)心理上的 (D)理論上的","source":"龍騰自命題"},{"id":12,"question":"Linda ____________ such enthusiasm for physics that most of her friends believed she would become a physicist someday.","options":["adored","tracked","demonstrated","reversed"],"answer":2,"explanation":"Linda對物理學展現如此高程度的熱忱，以致於她的朋友大多都認為她有朝一日會成為一位物理學家。 (A)愛慕 (B)追蹤 (C)表達 (D)反轉","source":"龍騰自命題"},{"id":13,"question":"After standing on her feet all day long, the teacher went home with sore and ____________ legs.","options":["stiff","conscious","reverse","significant"],"answer":0,"explanation":"在站了一整天後，那名教師回家時雙腿痠痛且僵硬。 (A)僵硬的 (B)有意識的 (C)相反的 (D)重要的","source":"龍騰自命題"},{"id":14,"question":"Jonathan’s father gave him an angry ____________ when he saw Jonathan covered in dirt.","options":["theory","fellow","glance","psychology"],"answer":2,"explanation":"當看到Jonathan全身都是泥巴時，Jonathan的父親憤怒地瞥了他一眼。 (A)理論 (B)同輩 (C)匆匆一瞥 (D)心理學","source":"龍騰自命題"},{"id":15,"question":"The items on display in this ____________ are mostly artworks from the Yuan dynasty (元朝).","options":["gesture","exhibition","theory","glance"],"answer":1,"explanation":"在這場展覽中展示的物品大多數都是來自元朝的藝術品。 (A)手勢 (B)展覽 (C)理論 (D)匆匆一瞥","source":"龍騰自命題"},{"id":16,"question":"With these special devices, scientists can effortlessly ____________ the locations where these brown bears spend their winter in the forest.","options":["gesture","track","exhibit","scratch"],"answer":1,"explanation":"有了這些特殊的裝置，科學家們可以不費力地追蹤這些棕熊在森林過冬的位置。 (A)用動作示意 (B)追蹤 (C)展現 (D)搔抓","source":"龍騰自命題"},{"id":17,"question":"In this video, you can find that scientists are ____________ how the two monkeys work together to get the fruit from the little box.","options":["gesturing","reversing","observing","glancing"],"answer":2,"explanation":"在這個影片，你可以發現科學家們正在觀察這兩隻猴子如何合作從小盒子中拿出水果。 (A)用動作示意 (B)反轉 (C)觀察 (D)匆匆一瞥","source":"龍騰自命題"},{"id":18,"question":"Under no ____________ should people leave a child under the age of seven at home alone. In fact, it is against the law to do so in many parts of the U.S.","options":["significance","interpretations","observations","circumstances"],"answer":3,"explanation":"人們在任何情況絕不應該留小於七歲的小孩獨自一人在家。事實上，這樣在美國許多地方是違法的。 (A)重要性 (B)解釋 (C)觀察 (D)情況","source":"龍騰自命題"},{"id":19,"question":"Jasmine broke out in a cold sweat when she became ____________ of someone following her along the road.","options":["reverse","conscious","initial","fellow"],"answer":1,"explanation":"當她意識到有人一路上跟著她，Jasmine冒出冷汗。 (A)相反的 (B)意識到 (C)起初的 (D)同伴的","source":"龍騰自命題"},{"id":20,"question":"There is a sensor on the light, so if anyone goes near it, it will ____________ turn on.","options":["automatically","initially","consciously","significantly"],"answer":0,"explanation":"這盞燈有感應器，所以只要有人接近它，它會自動地開燈。 (A)自動地 (B)起初 (C)有意識地 (D)重要地；顯著地","source":"龍騰自命題"},{"id":21,"question":"The movie leaves the audience confused; many people find it difficult to ____________ what the director is trying to express in the film.","options":["observe","interpret","adore","reverse"],"answer":1,"explanation":"這部電影讓觀眾感到困惑；許多人發覺很難去解釋導演想在電影傳達的概念。 (A)觀察 (B)解釋 (C)愛慕 (D)反轉","source":"龍騰自命題"},{"id":22,"question":"India’s most famous landmark, the Taj Mahal, is not only an architectural jewel but also a perfect ____________ of an emperor’s love for his empress.","options":["interaction","demonstration","observation","circumstance"],"answer":1,"explanation":"印度最有名的地標──泰姬瑪哈陵──不僅是建築上的瑰寶也是一個皇帝對他的皇后愛的完美展現。 (A)互動 (B)展現 (C)觀察 (D)條件","source":"龍騰自命題"},{"id":23,"question":"Paula is not the kind of girl that ____________ emotion easily. You never know what she really feels from her outward appearance.","options":["interprets","exhibits","observes","reverses"],"answer":1,"explanation":"Paula並不是那種會容易展現情感的女生。你無法從她的外觀得知她真正的感受。 (A)理解 (B)展示 (C)觀察 (D)反轉","source":"龍騰自命題"},{"id":24,"question":"The ____________ of the competition lies not in the final result, but in the process. Each participant can gain something valuable out of this interesting activity.","options":["significance","affection","observation","consciousness"],"answer":0,"explanation":"這場比賽的意義並不在於最後的結果，而是在過程。每個參與者都能從這有趣的活動中獲得某樣寶貴的東西。 (A)意義 (B)喜愛 (C)觀察 (D)意識","source":"龍騰自命題"},{"id":25,"question":"Fanny is willing to pay an unreasonably high price for a concert ticket, as she absolutely ____________ the band.","options":["exhibits","adores","reverses","observes"],"answer":1,"explanation":"Fanny願意為一張演唱會門票付超級高價格的錢，因為她確實熱愛這個樂團。 (A)展現 (B)熱愛 (C)反轉 (D)觀察","source":"龍騰自命題"},{"id":26,"question":"The little boy didn’t know how to ____________ with his new classmates, so he just sat on his seat playing by himself.","options":["exhibit","gesture","glance","interact"],"answer":3,"explanation":"那名小男孩不知道如何和新同學互動，所以只是坐在自己的位子上自己玩耍。 (A)展現 (B)用動作示意 (C)匆匆一瞥 (D)互動","source":"龍騰自命題"},{"id":27,"question":"The mother has such deep ____________ for her children that her world practically revolves around them.","options":["interpretation","affection","exhibition","psychology"],"answer":1,"explanation":"那位母親對她孩子們的喜愛如此之甚，以致於她的世界幾乎都繞著他們轉。 (A)詮釋 (B)喜愛 (C)展覽 (D)心理學","source":"龍騰自命題"},{"id":28,"question":"After being hit on the head, Lance lost ____________ for a few minutes but regained awareness shortly after.","options":["interpretation","psychology","theory","consciousness"],"answer":3,"explanation":"在頭部受到撞擊後，Lance有數分鐘失去意識但不久後就恢復知覺了。 (A)詮釋 (B)心理學 (C)理論 (D)意識","source":"龍騰自命題"},{"id":29,"question":"Courses in the department of ____________ interest Jessica because she wants to learn about how people actually think.","options":["psychology","significance","consciousness","observation"],"answer":0,"explanation":"心理系的課程讓Jessica感興趣，因為她想知道人們實際如何思考。 (A)心理學 (B)意義 (C)意識 (D)觀察","source":"龍騰自命題"},{"id":30,"question":"The victim of the serious car accident had to undergo emergency surgery and was placed under close ____________ for several days afterwards.","options":["observation","exhibition","interpretation","psychology"],"answer":0,"explanation":"那場嚴重車禍的受害者必須經歷緊急手術，並隨後被安排了接連好幾天的仔細觀察。 (A)觀察 (B)展覽 (C)詮釋 (D)心理學","source":"龍騰自命題"}];const $=s=>document.querySelector(s),list=$('#list'),select=$('#select'),quiz=$('#quiz'),result=$('#result'),question=$('#question'),answerArea=$('#answerArea'),feedback=$('#feedback'),next=$('#next');let chosen=[],idx=0,mode='first';const wrong=new Map(),correct=new Set();const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ');const shuffled=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function renderList(){list.innerHTML=Q.map(q=>'<label class="pick"><input class="pickbox" type="checkbox" value="'+q.id+'" checked><b>第 '+q.id+' 題</b> <span class="source">'+esc(q.source||'')+'</span></label>').join('');count()}function count(){$('#picked').textContent='已選 '+document.querySelectorAll('.pickbox:checked').length+' 題'}list.addEventListener('change',count);$('#all').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=true);count()};$('#none').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=false);count()};$('#rand20').onclick=()=>{let ids=new Set(shuffled(Q).slice(0,Math.min(20,Q.length)).map(q=>q.id));document.querySelectorAll('.pickbox').forEach(x=>x.checked=ids.has(+x.value));count()};$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));if($('#shuffle').checked)chosen=shuffled(chosen);idx=0;mode='first';wrong.clear();correct.clear();select.classList.add('hidden');result.classList.add('hidden');quiz.classList.remove('hidden');show()};function show(){const q=chosen[idx];speechSynthesis?.cancel();$('#meta').textContent=(mode==='retry'?'錯題重做｜':'')+'第 '+(idx+1)+' / '+chosen.length+' 題';$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';$('#bar').style.width=(idx+1)/chosen.length*100+'%';question.textContent=q.question;const zh=$('#zh');if(q.zh){zh.textContent=q.zh;zh.classList.remove('hidden')}else zh.classList.add('hidden');feedback.className='feedback hidden';$('#voiceBox').classList.add('hidden');$('#check').classList.remove('hidden');next.classList.add('hidden');if(MODE==='mcq')answerArea.innerHTML='<div class="options">'+q.options.map((o,i)=>'<label class="option"><input type="radio" name="answer" value="'+i+'"><b>'+String.fromCharCode(65+i)+'.</b> '+esc(o)+'</label>').join('')+'</div>';else answerArea.innerHTML='<div class="inputs">'+q.answers.map((_,i)=>'<div class="answer-row"><label>'+(MODE==='multi'?['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'][i]:'答案')+'</label><input class="spell" autocomplete="off" spellcheck="false" placeholder="請輸入完整答案"></div>').join('')+'</div>';setTimeout(()=>answerArea.querySelector('input')?.focus(),0)}function currentAnswers(){if(MODE==='mcq'){const x=answerArea.querySelector('input:checked');return x?[+x.value]:[]}return [...answerArea.querySelectorAll('.spell')].map(x=>x.value)}function corr
