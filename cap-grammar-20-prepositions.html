<script>window.QUIZ_CONFIG={"title": "國中會考文法歷屆試題｜介係詞", "mode": "mcq", "questions": [{"id": 1, "question": "The temple sits alone in the mountains at a height of 3,000m ______ sea level.", "options": ["above", "at", "below", "in"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜above sea level 海拔以上", "explanation": "【句型】above sea level = 海平面以上（海拔）。\n【分析】in the mountains（在山上）+ 3,000m → 高於海平面三千公尺，用 above。\n【其他選項】(B) at sea level 在海平面高度，與 3,000m 矛盾；(C) below 在…之下，山上的廟不會在海平面下；(D) in sea level 無此用法。\n【例句】Yushan is about 3,952 meters above sea level.", "explanationSource": "source"}, {"id": 2, "question": "The plane is flying high ______ the clouds.", "options": ["under", "above", "between", "into"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 1 題）", "explanation": "飛得很高 → 在雲層之上 above。", "explanationSource": "supplemental"}, {"id": 3, "question": "Some fish live deep ______ the sea where there is no light.", "options": ["above", "over", "below", "on"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 1 題）", "explanation": "深海沒有光 → 在海面之下 below。", "explanationSource": "supplemental"}, {"id": 4, "question": "Hehuanshan is more than 3,000 meters ______ sea level, so it often snows there in winter.", "options": ["above", "below", "in", "at"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 1 題）", "explanation": "高山海拔 3,000 公尺以上 → above sea level。", "explanationSource": "supplemental"}, {"id": 5, "question": "Beverly eats lots of snacks ______ meals. That's why she is often too full to eat anything at mealtimes.", "options": ["after", "between", "during", "from"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜between meals 兩餐之間", "explanation": "【句型】between meals = 兩餐之間（正餐以外的時間）。\n【分析】因為她在「兩餐之間」吃很多零食，所以到吃飯時間 at mealtimes 吃不下。\n【其他選項】(A) after meals 飯後吃零食，不會造成正餐時吃不下；(C) during meals 用餐時吃零食，與 at mealtimes 吃不下矛盾；(D) from meals 無此用法。\n【例句】Try not to drink soda between meals.", "explanationSource": "source"}, {"id": 6, "question": "Don't eat cookies ______ lunch and dinner, or you won't be hungry at dinnertime.", "options": ["between", "during", "after", "among"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 5 題）", "explanation": "午餐和晚餐兩者之間 → between。", "explanationSource": "supplemental"}, {"id": 7, "question": "Please turn off your phone ______ the movie.", "options": ["between", "from", "during", "since"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 5 題）", "explanation": "在電影進行期間 → during。", "explanationSource": "supplemental"}, {"id": 8, "question": "Remember to take this medicine three times a day ______ meals.", "options": ["between", "after", "among", "into"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 5 題）", "explanation": "藥通常飯後吃 → after meals；吃三次 between 只有兩個間隔，不合。", "explanationSource": "supplemental"}, {"id": 9, "question": "Mr. Yang has worked in this factory ______ 1968.", "options": ["before", "for", "in", "since"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜since + 過去時間點（現在完成式）", "explanation": "【句型】現在完成式 have/has + p.p. + since + 過去時間點 = 自從…（到現在）。\n【分析】has worked（現在完成式）+ 1968（時間點）→ 自從 1968 年至今，用 since。\n【其他選項】(A) before 1968 表 1968 年以前，與現在完成式持續到現在不合；(B) for 接一段時間（如 for 50 years）；(C) in 1968 表過去某時，應配過去式 worked。\n【例句】Lily has lived in Tainan since 2015.", "explanationSource": "source"}, {"id": 10, "question": "We have known each other ______ we were in elementary school.", "options": ["for", "since", "in", "until"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 9 題）", "explanation": "since + 子句（過去時間點）配現在完成式。", "explanationSource": "supplemental"}, {"id": 11, "question": "Mr. Huang has taught English ______ twenty years.", "options": ["since", "in", "for", "at"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 9 題）", "explanation": "twenty years 是一段時間 → for。", "explanationSource": "supplemental"}, {"id": 12, "question": "My aunt moved to Kaohsiung ______ 2019.", "options": ["in", "since", "for", "during"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 9 題）", "explanation": "moved 過去式 + 年份 → in 2019。", "explanationSource": "supplemental"}, {"id": 13, "question": "Lucy and her boyfriend, Daniel, came to Taiwan ______ July 10, 1999.", "options": ["at", "in", "with", "on"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜on + 特定日期", "explanation": "【句型】on + 特定某一天（日期、星期、節日當天）；in + 月/年/季節；at + 時刻。\n【分析】July 10, 1999 有「日」→ 是特定的一天，用 on。\n【其他選項】(A) at 用於時刻（at 7:00）；(B) in 用於只有月或年（in July / in 1999）；(C) with 和…一起，不表時間。\n【例句】My birthday party is on May 5.", "explanationSource": "source"}, {"id": 14, "question": "The school sports day will be held ______ October 24.", "options": ["in", "on", "at", "for"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 13 題）", "explanation": "October 24 是特定日期 → on。", "explanationSource": "supplemental"}, {"id": 15, "question": "Ivy's family moved to Taichung ______ 2018.", "options": ["in", "on", "at", "by"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 13 題）", "explanation": "只有年份 → in。", "explanationSource": "supplemental"}, {"id": 16, "question": "The movie starts ______ 7:30 tonight.", "options": ["on", "in", "at", "since"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 13 題）", "explanation": "時刻 → at。", "explanationSource": "supplemental"}, {"id": 17, "question": "I write down everything about work in my pink notebook; ______ it, I'd forget the things I should do.", "options": ["before", "except", "outside", "without"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜without 沒有（若沒有…）", "explanation": "【句型】without + N = 沒有…（的話），常接 would + V 表假設結果。\n【分析】it = my pink notebook；I'd forget（我會忘記）→ 「沒有這本筆記本的話」我會忘記，用 without。\n【其他選項】(A) before it 在它之前，語意不通；(B) except it 除了它，不合；(C) outside it 在它外面，不合。\n【例句】Without your help, I couldn't finish the work.", "explanationSource": "source"}, {"id": 18, "question": "I can't see the words on the board ______ my glasses.", "options": ["with", "without", "except", "beside"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 17 題）", "explanation": "沒戴眼鏡看不清楚 → without。", "explanationSource": "supplemental"}, {"id": 19, "question": "______ water, plants can't grow.", "options": ["Without", "With", "Before", "Except"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 17 題）", "explanation": "沒有水植物無法生長 → Without。", "explanationSource": "supplemental"}, {"id": 20, "question": "Nina always goes to school ______ her umbrella in the rainy season.", "options": ["without", "except", "with", "from"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 17 題）", "explanation": "雨季帶著傘 → with；without 不合常理。", "explanationSource": "supplemental"}, {"id": 21, "question": "I love sports and enjoy playing baseball with friends ______ the school team.", "options": ["about", "at", "on", "to"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜on the team 在隊上", "explanation": "【句型】be on a team = 是某隊的成員；friends on the school team = 校隊上的朋友。\n【分析】空格修飾 friends，表示「校隊裡的朋友」，隊伍的成員用介系詞 on。\n【其他選項】(A) about 關於；(B) at 表地點或時間點，不表隊伍成員；(D) to 表方向，均不與 team 搭配。\n【例句】My brother is on the basketball team.", "explanationSource": "source"}, {"id": 22, "question": "Is your sister ______ the school volleyball team?", "options": ["at", "on", "to", "about"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 21 題）", "explanation": "身為隊員 be on the team。", "explanationSource": "supplemental"}, {"id": 23, "question": "There are fifteen players ______ our baseball team.", "options": ["on", "at", "to", "of"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 21 題）", "explanation": "隊伍裡的球員 players on the team。", "explanationSource": "supplemental"}, {"id": 24, "question": "Leo practices every day because he wants to play ______ the school soccer team next year.", "options": ["at", "to", "about", "on"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 21 題）", "explanation": "在校隊上踢球 play on the team。", "explanationSource": "supplemental"}, {"id": 25, "question": "Everyone in the class enjoys playing chess ______ Bill; he thinks the game is boring.", "options": ["except", "for", "like", "of"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜except 除了…之外（排除）", "explanation": "【句型】everyone / nobody / all + except + 人 = 除了某人以外（排除在外）。\n【分析】後句 he thinks the game is boring（Bill 覺得無聊）→ Bill 被排除在「大家都喜歡」之外，用 except。\n【其他選項】(B) for 為了；(C) like 像，Bill 不喜歡下棋所以不像大家；(D) of 的，均不表排除。\n【例句】All my friends came to the party except Sam.", "explanationSource": "source"}, {"id": 26, "question": "All the students passed the test ______ Mark. He has to take it again.", "options": ["with", "except", "like", "for"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 25 題）", "explanation": "Mark 要重考 → 他被排除 except。", "explanationSource": "supplemental"}, {"id": 27, "question": "The store is open every day ______ Monday.", "options": ["except", "on", "with", "of"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 25 題）", "explanation": "除了星期一以外每天營業 → except。", "explanationSource": "supplemental"}, {"id": 28, "question": "Nobody ______ Grace knew the answer, so the teacher praised her.", "options": ["with", "of", "except", "like"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 25 題）", "explanation": "只有 Grace 知道答案 → nobody except Grace。", "explanationSource": "supplemental"}, {"id": 29, "question": "Look at the picture. The dog is sitting ______.\n[圖：女子開敞篷車，狗坐在她旁邊的座位，包包放在後方]", "options": ["on the bag", "next to the woman", "inside the bag", "between the woman and the bag"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜next to 在…旁邊（看圖）", "explanation": "【句型】位置介系詞：next to 在旁邊；between A and B 在 A 與 B 之間；on 在上面；inside 在裡面。\n【分析】圖中女子在開車，狗坐在她身旁的座位上，包包在後座 → 狗在女子旁邊 next to the woman。\n【其他選項】(A) 狗沒坐在包包上；(C) 狗不在包包裡；(D) 包包在女子後方，狗並不在女子和包包中間。\n【例句】My cat likes to sleep next to the window.", "explanationSource": "source"}, {"id": 30, "question": "In the classroom, Tim sits ______ Amy and Ben. Amy is on his left, and Ben is on his right.", "options": ["next to", "between", "behind", "across"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 29 題）", "explanation": "左右各一人 → 在兩者之間 between。", "explanationSource": "supplemental"}, {"id": 31, "question": "The bank is ______ the post office. They are side by side.", "options": ["next to", "under", "inside", "above"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 29 題）", "explanation": "side by side 並排 → next to。", "explanationSource": "supplemental"}, {"id": 32, "question": "I can't find my keys. Oh, they're ______ my bag, under my books.", "options": ["on", "between", "inside", "next to"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 29 題）", "explanation": "在包包裡、書下面 → inside。", "explanationSource": "supplemental"}, {"id": 33, "question": "I enjoy drinking a cup of black coffee ______ Friday nights.", "options": ["at", "by", "in", "on"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜on + 星期（Friday nights）", "explanation": "【句型】on + 星期幾／特定某天的早上、晚上（on Friday nights, on Sunday morning）。\n【分析】Friday nights 是特定星期的晚上 → 用 on。\n【其他選項】(A) at night 可以，但有 Friday 時要用 on；(B) by 在…之前；(C) in the evening 可以，但加上星期時改用 on。\n【例句】We usually watch movies on Saturday evenings.", "explanationSource": "source"}, {"id": 34, "question": "My family goes hiking ______ Sunday mornings.", "options": ["in", "at", "on", "by"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 33 題）", "explanation": "星期 + 早上 → on。", "explanationSource": "supplemental"}, {"id": 35, "question": "I always read a book ______ night before I sleep.", "options": ["at", "on", "in", "for"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 33 題）", "explanation": "at night 固定用法。", "explanationSource": "supplemental"}, {"id": 36, "question": "Ms. Lee takes a walk ______ the evening after dinner.", "options": ["on", "in", "at", "by"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 33 題）", "explanation": "in the evening；沒有指定星期時用 in。", "explanationSource": "supplemental"}, {"id": 37, "question": "Bob: When is Mr. Wang going to Japan?\nTim: On ______.", "options": ["June", "June fourth", "the year 2010", "June, 2010"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜On + 日期（on June fourth）", "explanation": "【句型】on 只接特定某一天；只有月份或年份要用 in。\n【分析】Tim 用 On 開頭 → 後面必須是具體日期，只有 June fourth 符合。\n【其他選項】(A) June 只有月份，應說 In June；(C) the year 2010 是年份，應用 in；(D) June, 2010 仍無「日」，應用 in。\n【例句】The concert is on March 3.", "explanationSource": "source"}, {"id": 38, "question": "Amy: When were you born?\nTom: In ______.", "options": ["May 2", "Monday", "2011", "the morning of May 2"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 37 題）", "explanation": "In + 年份 → 2011；有日期或星期要用 on。", "explanationSource": "supplemental"}, {"id": 39, "question": "Kim: When is the school trip?\nJoe: It's on ______.", "options": ["November", "the twelfth of November", "2026", "winter"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 37 題）", "explanation": "on + 特定日期 the twelfth of November。", "explanationSource": "supplemental"}, {"id": 40, "question": "We will have the English contest ______ December.", "options": ["in", "on", "at", "for"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 37 題）", "explanation": "只有月份 → in December。", "explanationSource": "supplemental"}, {"id": 41, "question": "Judy moved to France and has lived there ______ two years. I miss her very much.", "options": ["before", "for", "in", "since"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜for + 一段時間（現在完成式）", "explanation": "【句型】現在完成式 + for + 一段時間（for two years）；since + 時間點。\n【分析】has lived（現在完成式）+ two years（一段時間）→ 住了兩年，用 for。\n【其他選項】(A) before 之前，before two years 不合文法；(C) in two years 表「兩年後」，用於未來；(D) since 接時間點，不接一段時間。\n【例句】I have studied English for six years.", "explanationSource": "source"}, {"id": 42, "question": "Andy has played the guitar ______ he was ten.", "options": ["for", "since", "in", "during"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 41 題）", "explanation": "since + 過去時間點子句。", "explanationSource": "supplemental"}, {"id": 43, "question": "The Lins have lived in Hsinchu ______ more than ten years.", "options": ["since", "in", "for", "on"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 41 題）", "explanation": "more than ten years 是一段時間 → for。", "explanationSource": "supplemental"}, {"id": 44, "question": "I'll finish the report ______ two days. Please wait.", "options": ["in", "for", "since", "before"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 41 題）", "explanation": "in + 一段時間 表「…之後」（未來）。", "explanationSource": "supplemental"}, {"id": 45, "question": "______ going shopping, Dad asked me if Mom would eat at home tonight. He wanted to know what he should buy for the dinner.", "options": ["Without", "Until", "By", "Before"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜Before + Ving（在…之前）", "explanation": "【句型】Before + Ving = 在做…之前（介系詞 + 動名詞）。\n【分析】後句 He wanted to know what he should buy（想知道要買什麼）→ 是「去購物之前」先問，用 Before。\n【其他選項】(A) Without going shopping 沒去購物，但問題是為了買菜；(B) Until 直到，句子語意不通；(C) By + Ving 表「藉由…方式」，不合。\n【例句】Before eating, wash your hands.", "explanationSource": "source"}, {"id": 46, "question": "______ leaving the classroom, please turn off the lights.", "options": ["Before", "Without", "Since", "During"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 45 題）", "explanation": "離開教室前關燈 → Before。", "explanationSource": "supplemental"}, {"id": 47, "question": "You can improve your English ______ reading English books every day.", "options": ["before", "by", "until", "without"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 45 題）", "explanation": "by + Ving 藉由…方式。", "explanationSource": "supplemental"}, {"id": 48, "question": "Ruby went to school ______ eating breakfast, so she was hungry all morning.", "options": ["before", "by", "without", "after"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 45 題）", "explanation": "整個早上都餓 → 沒吃早餐 without eating。", "explanationSource": "supplemental"}, {"id": 49, "question": "I live ______ my office, so I walk to work every morning.", "options": ["along", "between", "near", "out of"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜near 在…附近", "explanation": "【句型】near + 地點 = 在…附近。\n【分析】so I walk to work（所以走路上班）→ 住在辦公室附近，用 near。\n【其他選項】(A) along 沿著，接路、河；(B) between 需要兩個對象 A and B；(D) out of 從…出來，不合。\n【例句】There is a park near my school.", "explanationSource": "source"}, {"id": 50, "question": "Mia lives far ______ school, so she takes the MRT every day.", "options": ["from", "near", "along", "with"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 49 題）", "explanation": "far from 離…遠，所以搭捷運。", "explanationSource": "supplemental"}, {"id": 51, "question": "Is there a convenience store ______ here? I need to buy some water.", "options": ["along", "near", "between", "out of"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 49 題）", "explanation": "near here 這附近。", "explanationSource": "supplemental"}, {"id": 52, "question": "We rode our bikes ______ the river and enjoyed the view.", "options": ["near", "between", "along", "out of"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 49 題）", "explanation": "沿著河騎車 → along。", "explanationSource": "supplemental"}, {"id": 53, "question": "Allan: Want to try Uncle Joe's pumpkin pie? I heard it's quite good.\nJamie: No, thank you. I think nobody ______ my mom can make good pies.", "options": ["with", "than", "for", "except"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜nobody except 除了…沒有人", "explanation": "【句型】nobody / no one + except + 人 = 除了某人以外沒有人。\n【分析】Jamie 拒絕吃 Joe 叔叔的派，因為他認為「除了我媽以外沒人做得出好派」→ except。\n【其他選項】(A) with 和…一起，語意不合；(B) than 用於比較級（better than），本句無比較級；(C) for 為了，不合。\n【例句】No one except Kevin got full marks.", "explanationSource": "source"}, {"id": 54, "question": "Nobody ______ Linda remembered to bring an umbrella, so we all got wet.", "options": ["except", "with", "for", "than"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 53 題）", "explanation": "只有 Linda 帶傘 → nobody except Linda。", "explanationSource": "supplemental"}, {"id": 55, "question": "My grandma cooks better ______ anyone else in our family.", "options": ["except", "than", "with", "of"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 53 題）", "explanation": "比較級 better than。", "explanationSource": "supplemental"}, {"id": 56, "question": "I like all kinds of fruit ______ bananas. I never eat them.", "options": ["with", "for", "except", "about"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 53 題）", "explanation": "從不吃香蕉 → 除了香蕉 except。", "explanationSource": "supplemental"}, {"id": 57, "question": "March is the third month of the year. It comes ______ February and April.", "options": ["about", "before", "during", "between"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜between A and B", "explanation": "【句型】between A and B = 在 A 和 B 之間。\n【分析】三月在二月和四月中間，且空格後有 February and April 兩個對象 → between。\n【其他選項】(A) about 關於；(B) before 在…之前，三月不在四月和二月「之前」；(C) during 在…期間，接一段期間而非兩個月份。\n【例句】Wednesday comes between Tuesday and Thursday.", "explanationSource": "source"}, {"id": 58, "question": "The letter C comes ______ B and D.", "options": ["between", "before", "after", "among"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 57 題）", "explanation": "兩者之間 between B and D。", "explanationSource": "supplemental"}, {"id": 59, "question": "Sunday comes ______ Monday. It's the day before Monday.", "options": ["after", "before", "between", "during"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 57 題）", "explanation": "the day before Monday → before。", "explanationSource": "supplemental"}, {"id": 60, "question": "Our school is ______ the library and the hospital.", "options": ["among", "near to", "between", "during"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 57 題）", "explanation": "兩個地點之間 between A and B。", "explanationSource": "supplemental"}, {"id": 61, "question": "My dog, Lucy, was lying on the sofa ______ the fan on the wall. So when the fan fell, she was hit right on the head.", "options": ["under", "off", "from", "down"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜under 在…正下方", "explanation": "【句型】under + N = 在…的正下方。\n【分析】電扇掉下來正好打到她的頭 → 狗躺在電扇的正下方，用 under。\n【其他選項】(B) off 離開（某表面）；(C) from 從…；(D) down 向下（副詞/介系詞，down the stairs），都無法表示「在電扇下方」的位置。\n【例句】The cat is sleeping under the table.", "explanationSource": "source"}, {"id": 62, "question": "Don't stand ______ the tree when it's raining with thunder. It's dangerous.", "options": ["above", "under", "off", "from"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 61 題）", "explanation": "雷雨時別站在樹下 → under。", "explanationSource": "supplemental"}, {"id": 63, "question": "The picture is hanging on the wall ______ the clock.", "options": ["below", "down", "off", "from"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 61 題）", "explanation": "掛在時鐘下方 → below（在下方，牆面上）。", "explanationSource": "supplemental"}, {"id": 64, "question": "Please take your feet ______ the desk. It's not polite.", "options": ["under", "down", "off", "below"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 61 題）", "explanation": "把腳從桌上移開 → take ... off。", "explanationSource": "supplemental"}, {"id": 65, "question": "Linda: Jenny, will you still be here this afternoon?\nJenny: Yeah, I think I'll stay ______ five. Then I'll leave for dinner.", "options": ["at", "for", "since", "until"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜until 直到…（持續動作）", "explanation": "【句型】持續性動詞（stay, wait, sleep）+ until + 時間點 = 一直…直到某時。\n【分析】stay（待著）是持續動作，Then I'll leave（然後離開）→ 待到五點，用 until。\n【其他選項】(A) at five 表在五點這一刻，與「待著」持續動作不合；(B) for 接一段時間（for two hours）；(C) since 用於現在完成式，表自從。\n【例句】Please wait here until I come back.", "explanationSource": "source"}, {"id": 66, "question": "Last night I studied ______ midnight, so I'm very tired now.", "options": ["since", "until", "for", "at"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 65 題）", "explanation": "持續讀書直到午夜 → until。", "explanationSource": "supplemental"}, {"id": 67, "question": "The shop is open ______ 9 p.m. Let's go after dinner.", "options": ["until", "since", "for", "during"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 65 題）", "explanation": "營業到晚上九點 → until。", "explanationSource": "supplemental"}, {"id": 68, "question": "We waited for the bus ______ thirty minutes, but it didn't come.", "options": ["until", "since", "for", "at"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 65 題）", "explanation": "thirty minutes 一段時間 → for。", "explanationSource": "supplemental"}, {"id": 69, "question": "Tina is getting married to a man she has known only ______ a month.", "options": ["for", "in", "on", "since"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜for + 一段時間（has known for）", "explanation": "【句型】現在完成式 + for + 一段時間。\n【分析】has known（現在完成式）+ a month（一段時間）→ 才認識一個月，用 for。\n【其他選項】(B) in a month 表一個月後（未來）；(C) on 接日期；(D) since 接時間點（since last month）。\n【例句】I have had this bike for three years.", "explanationSource": "source"}, {"id": 70, "question": "Sam has known Peter ______ they were in kindergarten.", "options": ["for", "since", "in", "on"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 69 題）", "explanation": "since + 過去時間點子句。", "explanationSource": "supplemental"}, {"id": 71, "question": "Mrs. Wu has worked at this hospital ______ ten years.", "options": ["for", "since", "in", "at"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 69 題）", "explanation": "ten years 一段時間 → for。", "explanationSource": "supplemental"}, {"id": 72, "question": "The new MRT line will open ______ two months.", "options": ["for", "since", "in", "on"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 69 題）", "explanation": "in + 時間 表「…之後」（未來）。", "explanationSource": "supplemental"}, {"id": 73, "question": "There's something wrong ______ Gina and Greg. They haven't talked to each other for over one month.", "options": ["beside", "between", "during", "under"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜between 兩人之間", "explanation": "【句型】between A and B = 在 A 與 B（兩者）之間；something wrong between A and B 兩人之間有問題。\n【分析】Gina and Greg 兩人一個多月沒說話 → 兩人「之間」出了問題，用 between。\n【其他選項】(A) beside 在旁邊，表位置；(C) during 在…期間，接一段時間；(D) under 在…下面，均不合。\n【例句】There is a secret between Ann and me.", "explanationSource": "source"}, {"id": 74, "question": "The match ______ Taiwan and Japan was very exciting.", "options": ["among", "between", "during", "beside"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 73 題）", "explanation": "兩隊之間的比賽 between A and B。", "explanationSource": "supplemental"}, {"id": 75, "question": "The teacher divided the cake ______ the five students.", "options": ["between", "during", "with", "among"], "answer": 3, "answerLabel": "D", "source": "類似題 2（對應第 73 題）", "explanation": "三者以上之間 → among。", "explanationSource": "supplemental"}, {"id": 76, "question": "Kate and Ella are good friends. There are no secrets ______ them.", "options": ["between", "beside", "under", "during"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 73 題）", "explanation": "兩人之間沒有秘密 between them。", "explanationSource": "supplemental"}, {"id": 77, "question": "Little Eric chose the doll ______ big brown eyes because it was the cutest in the store.", "options": ["at", "in", "on", "with"], "answer": 3, "answerLabel": "D", "source": "115會考｜介係詞 with 表「帶有（特徵）」", "explanation": "【句型】名詞 + with + 特徵：帶有……的（人／物）。\n【分析】the doll ______ big brown eyes：大棕眼是娃娃的特徵，用 with 修飾 the doll，表示「有著大棕眼的娃娃」，故選 with。\n【其他選項】(A) at 在（某點）、(B) in 在……裡面、(C) on 在……上面：都表位置，不能表示「具有某特徵」。\n【例句】The girl with long hair is my sister.\n※注意：描述人穿著時也可用 in，如 the man in a black coat，但「身體特徵」要用 with。", "explanationSource": "source"}, {"id": 78, "question": "Do you see the boy ______ curly hair? He is the new student.", "options": ["in", "with", "at", "of"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 77 題）", "explanation": "表示身體特徵「有著捲髮」用 with。", "explanationSource": "supplemental"}, {"id": 79, "question": "I want to buy the bag ______ two big pockets on the front.", "options": ["with", "at", "by", "for"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 77 題）", "explanation": "「有兩個大口袋」的包包，with 表具有。", "explanationSource": "supplemental"}, {"id": 80, "question": "The woman ______ a red dress is our new English teacher.", "options": ["with", "on", "in", "at"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 77 題）", "explanation": "表示穿著衣服用 in：穿紅洋裝的女士。", "explanationSource": "supplemental"}]};</script><script src="longteng-b1u5-quiz.js?v=20261027-2"></script><script>document.querySelector("#description").textContent="共 80 題（會考歷屆 20 題＋類似題 60 題）｜選答後顯示中文解析｜答錯可重做並下載錯題";</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
