<script>window.QUIZ_CONFIG={"title": "國中會考英文錯題整理｜複習講義錯題", "mode": "mcq", "questions": [{"id": 1, "question": "第 4 題 Jerry is someone very ______ to me. No one else in my life is more important than he is.", "options": ["kind", "interesting", "special", "young"], "answer": 2, "answerLabel": "C", "source": "p.21｜字彙｜素養試界A++ 單題（家庭/人際字彙）", "explanation": "後句說「我生命中沒有人比他更重要」，表示他對我來說很「特別」，special to me 最符合。kind 是「親切的」，與「重要」的語意不連貫。", "explanationSource": "source", "section": "單題"}, {"id": 2, "question": "第 1 題 There ______ more than twenty clubs in our school. Which one would you like to join?", "options": ["has", "have", "is", "are"], "answer": 3, "answerLabel": "D", "source": "p.41｜文法｜文法大解密：引介句 there is / are", "explanation": "表示「某地有…」要用引介句 There is / are，不能用 have/has。名詞 more than twenty clubs 是複數，所以用 are。", "explanationSource": "source", "section": "單題"}, {"id": 3, "question": "第 4 題 This test won't be easy, so I'll give a prize to the student with ______ marks.", "options": ["correct", "full", "poor", "special"], "answer": 1, "answerLabel": "B", "source": "p.42｜字彙｜素養試界A++ 單題（字彙/介系詞）", "explanation": "full marks 是固定說法，意為「滿分」。考試很難，所以得滿分的學生才有獎品。special marks 不是慣用說法。", "explanationSource": "source", "section": "單題"}, {"id": 4, "question": "第 9 題 Mr. Robb: When will Alice arrive in Taiwan? I'll pick her up at the airport.\nHoward: ______ the morning of May 12th.", "options": ["In", "On", "At", "Of"], "answer": 1, "answerLabel": "B", "source": "p.42｜字彙｜素養試界A++ 單題（字彙/介系詞）", "explanation": "一般說 in the morning，但「特定某一天的早上」（the morning of May 12th）要用 on。at 用於時刻，如 at 7:00。", "explanationSource": "source", "section": "單題"}, {"id": 5, "question": "第 10 題 The bus stop is right there ______ the restaurant. We're on the wrong side of the street.", "options": ["across from", "through", "next to", "over"], "answer": 0, "answerLabel": "A", "source": "p.42｜字彙｜素養試界A++ 單題（字彙/介系詞）", "explanation": "後句說「我們在街道錯的那一邊」，表示公車站在餐廳的「對面」，across from = 在…對面。through 是「穿過」，不能表示位置。", "explanationSource": "source", "section": "單題"}, {"id": 6, "question": "第 12 題 Santa Claus in New Zealand wears a red T-shirt and red shorts during Christmas because it is hot there in ______.", "options": ["July", "October", "December", "May"], "answer": 2, "answerLabel": "C", "source": "p.43｜字彙｜素養試界A++ 單題（字彙）", "explanation": "聖誕節在 12 月。紐西蘭在南半球，12 月是夏天，所以聖誕老人穿 T 恤短褲，選 December。", "explanationSource": "source", "section": "單題"}, {"id": 7, "question": "第 15 題 If we believe tomorrow will be better, we can ______ the difficult things today without losing heart.", "options": ["point", "bear", "laugh", "shout"], "answer": 1, "answerLabel": "B", "source": "p.43｜字彙｜素養試界A++ 單題（字彙）", "explanation": "bear 當動詞是「忍受、承受」。相信明天會更好，就能承受今天的困難而不灰心（lose heart）。laugh 要用 laugh at，且語意不合。", "explanationSource": "source", "section": "單題"}, {"id": 8, "question": "第 1 題 Nick: ______ you finish the work before five o'clock?\nKate: I don't think so. It'll take more than an hour. It's already four thirty now.", "options": ["Are", "Do", "Can", "Be"], "answer": 2, "answerLabel": "C", "source": "p.56｜文法｜會考隨堂做（現在簡單式 vs. 現在進行式 / 助動詞）", "explanation": "問的是「你五點前『能』完成嗎？」，回答說還要一個多小時、現在已四點半，所以是問能力/可能性，用 Can。Do you finish 是問習慣，不合語境。", "explanationSource": "source", "section": "單題"}, {"id": 9, "question": "第 2 題 Cherry ______ very fast, and her brother, Paul, does, too.", "options": ["can swim", "swims", "is swimming", "swim"], "answer": 1, "answerLabel": "B", "source": "p.56｜文法｜會考隨堂做（現在簡單式 vs. 現在進行式 / 助動詞）", "explanation": "後半句用 does 代替前面的動詞，表示前句是一般動詞現在簡單式，主詞 Cherry 第三人稱單數，用 swims。若選 can swim，後面應說 Paul can, too。", "explanationSource": "source", "section": "單題"}, {"id": 10, "question": "第 3 題 Rick: Ted bought a pie for Cindy and she ate it. I thought she would never eat things like that.\nElle: She ______. She was just being polite. She didn't want to hurt Ted's feelings.", "options": ["doesn't", "isn't", "didn't", "wasn't"], "answer": 0, "answerLabel": "A", "source": "p.59｜文法｜素養試界A++ 單題（情境時態題）", "explanation": "Elle 的意思是「她（平常）不吃那種東西」，表達習慣要用現在簡單式，eat 是一般動詞，所以用 doesn't（= doesn't eat things like that）。isn't 是 be 動詞，不能代替 eat。", "explanationSource": "source", "section": "單題"}, {"id": 11, "question": "第 7 題 Kelly: Who ______ the housework in your family?\nLucie: Everyone shares some.", "options": ["does", "is doing", "can do", "did"], "answer": 0, "answerLabel": "A", "source": "p.60｜文法｜素養試界A++ 單題 4–18", "explanation": "問家裡平常誰做家事，是「習慣」，用現在簡單式。Who 當主詞視為第三人稱單數，所以用 does。is doing 表示「現在正在做」，不合語意。", "explanationSource": "source", "section": "單題"}, {"id": 12, "question": "第 10 題 Alex fell down in the race and hurt his leg. When he got up and ran to the finish line, everybody ______.", "options": ["gave him a hand", "gave him a big hand", "put themselves in his shoes", "had it both ways"], "answer": 1, "answerLabel": "B", "source": "p.60｜文法｜素養試界A++ 單題 4–18", "explanation": "give sb. a big hand = 為某人熱烈鼓掌；give sb. a hand = 幫某人忙。Alex 受傷仍跑到終點，大家為他鼓掌加油，選 (B)。", "explanationSource": "source", "section": "單題"}, {"id": 13, "question": "第 14 題 Helen: How often do I need to water this plant? Do I need to do it every day?\nWendy: No. Watering it ______ will be quite enough. About three or four times a week.", "options": ["once in a while", "every other day", "twice a day", "every three days"], "answer": 1, "answerLabel": "B", "source": "p.60｜文法｜素養試界A++ 單題 4–18", "explanation": "一週三到四次，就是「每隔一天」= every other day。every three days 是每三天一次，一週只有兩次多，不合。", "explanationSource": "source", "section": "單題"}, {"id": 14, "question": "第 16 題 The math homework today is to do all the ______ on pages 11 to 13.", "options": ["answers", "exercises", "numbers", "subjects"], "answer": 1, "answerLabel": "B", "source": "p.60｜文法｜素養試界A++ 單題 4–18", "explanation": "exercise 當可數名詞時可指「練習題、習題」，數學作業是做第 11 到 13 頁的所有習題。numbers 是「數字」，不能說「做數字」。", "explanationSource": "source", "section": "單題"}, {"id": 15, "question": "第 2 題 I ______ swimming for several years before I went to this high school. I gave it up because of heavy schoolwork.", "options": ["have practiced", "am practicing", "practiced", "would practice"], "answer": 2, "answerLabel": "C", "source": "p.94｜文法｜文法大解密 動詞過去式", "explanation": "由 before I went to this high school 和 I gave it up 可知練游泳是過去的事，而且現在已經放棄了，所以用過去簡單式 practiced。(A) 現在完成式表示持續到現在，與「已經放棄」矛盾。", "explanationSource": "source", "section": "單題"}, {"id": 16, "question": "第 3 題 Mom: Linda, you've been playing computer games all evening! Have you finished your report?\nLinda: Well, ______ most of it this afternoon, and I'll finish it by Friday.", "options": ["I would do", "I did", "I was doing", "I'll do"], "answer": 1, "answerLabel": "B", "source": "p.94｜文法｜文法大解密 動詞過去式", "explanation": "（此題無紅筆批改，但學生答案與正解不同。）媽媽說已經玩了一整晚，可知 this afternoon 是已經過去的今天下午，表示過去完成的動作要用過去簡單式 I did。過去進行式 was doing 用來描述過去某時刻正在進行的動作，不適合這裡。", "explanationSource": "source", "section": "單題"}, {"id": 17, "question": "第 4 題 I always ______ my wife with the housework for two hours every weekend when we lived in London.", "options": ["helped", "helps", "am helping", "was going to help"], "answer": 0, "answerLabel": "A", "source": "p.94｜文法｜素養試界 A++ 單題", "explanation": "（此題無紅筆批改，但學生答案與正解不同。）when we lived in London 表示過去的時間，always 表示過去的習慣，所以用過去式 helped。(B) helps 是現在式，且主詞 I 也不能接 helps。", "explanationSource": "source", "section": "單題"}, {"id": 18, "question": "第 6 題 When I ______ the door, I ______ nobody but some white roses on the ground.", "options": ["opened; saw", "was opening; saw", "was opening; will see", "opened; see"], "answer": 0, "answerLabel": "A", "source": "p.121｜文法｜會考隨堂做（從屬連接詞 when / before / after）", "explanation": "when 連接的前後兩個子句時態要一致：開門和看見都是過去發生的短暫動作，所以都用過去簡單式 opened; saw。(D) 的 see 是現在式，前後時態不一致（老師在旁訂正為 saw）。", "explanationSource": "source", "section": "單題"}, {"id": 19, "question": "第 10 題 No one loses ______ in playing with the gift toy through the party.", "options": ["to interest", "interests", "interested", "interesting"], "answer": 1, "answerLabel": "B", "source": "p.258｜文法｜觀念澄清題（情緒形容詞／interest 的用法）", "explanation": "lose 是及物動詞，後面要接名詞當受詞：lose interest in + 事物（對…失去興趣）。interest 當名詞可數、不可數皆可，所以 (B) interests 正確。(A) to interest 是不定詞，不能當 lose 的受詞。", "explanationSource": "source", "section": "單題"}, {"id": 20, "question": "第 13 題 Jessie saw the movie years ago. It touched her heart so much that she can remember ______ clearly even now. The story is so touching and too sad for her to forget ______. Jessie is usually very busy. Happily, she can finally have free time to watch ______ again this evening.", "options": ["×；×；×", "it；it；×", "it；×；it", "it；×；×"], "answer": 2, "answerLabel": "C", "source": "p.259｜文法｜觀念澄清題（so...that / too...to 受詞省略）", "explanation": "第一格：so...that 後面的 that 子句要完整，remember 的受詞 it 不能省。第二格：too...to 句型中，受詞就是主詞 The story，已出現過，要省略。第三格：watch 的受詞（電影）在這個句子的主要子句中沒有出現，所以 it 不能省。答案是 it；×；it。學生在空格寫對了，但選項選成 (B)。", "explanationSource": "source", "section": "單題"}, {"id": 21, "question": "第 1 題 Look at the picture. The girl is ______. [圖：戴派對帽的女孩雙手合十、閉眼，面前有插著蠟燭的生日蛋糕]", "options": ["making a wish", "blowing out the candles", "putting on a hat", "eating a cake"], "answer": 0, "answerLabel": "A", "source": "p.260｜文法｜素養試界 A++ 單題", "explanation": "（此題無個別紅筆標記，但學生答案與圖意不符。）圖中女孩雙手合十、閉著眼睛，是在許願 making a wish；她並沒有在吹蠟燭，蠟燭仍點著。", "explanationSource": "source", "section": "單題"}, {"id": 22, "question": "第 4 題 That Steven lost his job makes his wife really ______.", "options": ["surprise", "surprises", "surprising", "surprised"], "answer": 3, "answerLabel": "D", "source": "p.260｜文法｜素養試界 A++ 單題", "explanation": "（此題無個別紅筆標記，學生答案字跡似 B。）make + 受詞 + 形容詞（受詞補語）；修飾「人」的感受要用過去分詞 surprised（感到驚訝的）。surprises 是動詞，不能放在 make 的受詞後當補語。", "explanationSource": "source", "section": "單題"}, {"id": 23, "question": "第 10 題 Daisy: Have you found the information you need?\nTyler: I ______ the Net for an hour last night but still couldn't find any.", "options": ["surfed", "have surfed", "would surf", "have been surfing"], "answer": 0, "answerLabel": "A", "source": "p.261｜文法｜素養試界 單題（第五冊 單元12 第1~2課）", "explanation": "句中有明確的過去時間 last night，要用過去簡單式 surfed。現在完成（進行）式 have (been) surf(ing) 不能和 last night 這種明確過去時間連用，所以 (D) 錯。", "explanationSource": "source", "section": "單題"}, {"id": 24, "question": "第 20 題 A ______ number of people lose their jobs. Many of them are not ready to face what has happened in their life.", "options": ["surprise", "surprised", "surprising", "surprisingly"], "answer": 2, "answerLabel": "C", "source": "p.261｜文法｜素養試界 單題（第五冊 單元12 第1~2課）", "explanation": "空格修飾名詞 number，要用形容詞；「數字令人驚訝」是事物帶給人的感覺，用 -ing 形容詞 surprising。surprisingly 是副詞，不能修飾名詞；surprised 用來形容人感到驚訝。", "explanationSource": "source", "section": "單題"}, {"id": 25, "question": "第 歷屆1 題 Jill: Have you decided ______ you will celebrate your 30th birthday?\nSue: Yeah, I'm going to have a big barbecue party.", "options": ["how", "where", "what", "when"], "answer": 0, "answerLabel": "A", "source": "p.275｜文法｜歷屆經典試題（wh-名詞子句）", "explanation": "Sue 回答「要辦一場大型烤肉派對」，說的是慶祝的「方式」，所以用 how。回答中沒有提到時間，所以 when 不對；what 在子句中缺受詞才用，這裡 celebrate 的受詞 birthday 已經有了。", "explanationSource": "source", "section": "單題"}, {"id": 26, "question": "第 7 題 Drew: Do you know ______ as the team leader? Wendy: It may be Jane.", "options": ["who will our teacher pick", "our teacher will pick", "who will be picked", "who is picking our teacher"], "answer": 2, "answerLabel": "C", "source": "p.276｜文法｜素養試界 單題（名詞子句／whether）", "explanation": "間接問句要用直述句語序：疑問詞＋主詞＋動詞。who 當主詞，「誰會被選為隊長」用被動 who will be picked。(A) 語序倒裝錯誤；(B) 缺疑問詞；(D) 意思變成「誰在挑老師」，不合理。", "explanationSource": "source", "section": "單題"}, {"id": 27, "question": "第 8 題 I wasn't able to decide ______ and ended up buying both of them.", "options": ["to buy which of the two skirts", "which of the two skirts should I buy", "which of the two skirts to buy", "I should buy which of the two skirts"], "answer": 2, "answerLabel": "C", "source": "p.276｜文法｜素養試界 單題（名詞子句／whether）", "explanation": "decide 後面可接「疑問詞＋to V」：which of the two skirts to buy（要買兩件裙子中的哪一件）。(B) 間接問句不可倒裝（should I buy 錯）；(A)(D) 疑問詞位置錯誤。", "explanationSource": "source", "section": "單題"}, {"id": 28, "question": "第 9 題 I'll do it whether you ______ me or not. But with your help, I can do it better and faster.", "options": ["help", "will help", "have helped", "helped"], "answer": 0, "answerLabel": "A", "source": "p.276｜文法｜素養試界 單題（名詞子句／whether）", "explanation": "whether...or not 引導的是副詞子句（不論…與否），和 if、when 一樣「主要子句用未來式，副詞子句用現在式代替未來」，所以用 help。不能用 will help。老師筆記例句：If I don't have my phone, I will go biking.", "explanationSource": "source", "section": "單題"}, {"id": 29, "question": "第 2 題 My parents always tell me that some people aren't as good as they ______ to be and that I shouldn't believe them too easily before knowing them better.", "options": ["appear", "shine", "belong", "hope"], "answer": 0, "answerLabel": "A", "source": "p.286｜字彙｜單元14 會考隨堂做（單字）", "explanation": "（此頁無紅筆批改，依題意判斷。）appear to be 表「看起來像是…」，句意：有些人並不像他們「看起來」那麼好，所以認識前別太相信。D hope to be「希望成為」與後半句「不要太輕易相信他們」語意不合。", "explanationSource": "source", "section": "單題"}, {"id": 30, "question": "第 1 題 Flora: Do you know that cute-looking boy over there? Teresa: There are three of them. Which one? Flora: The one ______ a white T-shirt and blue jeans.", "options": ["at", "on", "with", "in"], "answer": 3, "answerLabel": "D", "source": "p.287｜文法｜焦點B 文法句型：介系詞片語後位修飾 會考隨堂做", "explanation": "「in＋衣物、顏色」表示穿著某衣服，in a white T-shirt and blue jeans = 穿著白T恤和藍色牛仔褲，介系詞片語放在名詞 one 後面修飾。with 用於配件或身體特徵（with glasses, with brown eyes），不用於穿衣服。", "explanationSource": "source", "section": "單題"}, {"id": 31, "question": "第 6 題 The Great Wall of China ______ is said to be the only man-made building able to be seen from space, is visited by hundreds of thousands of people from around the world.", "options": ["that", "×", ", which", ", what"], "answer": 2, "answerLabel": "C", "source": "p.289｜文法｜關係代名詞 會考隨堂做（非限定用法）", "explanation": "長城只有一個，是專有名詞，補充說明要用「非限定用法」：逗號＋which，且後面 space 後也有逗號與之呼應。B 不填則句中出現兩個動詞(is said / is visited)而無連接詞；非限定用法不能用 that；what 不能接在先行詞後面。", "explanationSource": "source", "section": "單題"}, {"id": 32, "question": "第 11 題 Vivian is trying to save the cat ______ leg is broken.", "options": ["who", "that", "which", "whose"], "answer": 3, "answerLabel": "D", "source": "p.291｜文法｜會考隨堂做 + 觀念澄清題（關係子句／關係副詞）", "explanation": "空格後直接接名詞 leg，表示「貓的腿」，是所有關係，要用關係代名詞所有格 whose。which 後面要接缺主詞或受詞的子句，不能直接接名詞當所有格。", "explanationSource": "source", "section": "單題"}, {"id": 33, "question": "第 12 題 Of the three parks, ______ do you think is the best for us to camp?", "options": ["that", "what", "which", "where"], "answer": 2, "answerLabel": "C", "source": "p.291｜文法｜會考隨堂做 + 觀念澄清題（關係子句／關係副詞）", "explanation": "題目是「三座公園中」做選擇，有限範圍內選一個要用疑問詞 which（哪一個）；do you think 是插入語，which 當 is the best 的主詞。what 用於範圍不限定的「什麼」。", "explanationSource": "source", "section": "單題"}, {"id": 34, "question": "第 13 題 Jerry, name a park ______ we can camp safely and comfortably.", "options": ["that", "what", "which", "where"], "answer": 3, "answerLabel": "D", "source": "p.291｜文法｜會考隨堂做 + 觀念澄清題（關係子句／關係副詞）", "explanation": "關係子句 we can camp safely and comfortably 是完整句子（不缺主詞或受詞），缺的是地點副詞 at/in the park，所以用關係副詞 where（= in which）。that/which 只能代替缺少的名詞。", "explanationSource": "source", "section": "單題"}, {"id": 35, "question": "第 14 題 I think the park ______ lies across from the police station is the best.", "options": ["whose", "what", "which", "where"], "answer": 2, "answerLabel": "C", "source": "p.291｜文法｜會考隨堂做 + 觀念澄清題（關係子句／關係副詞）", "explanation": "關係子句 ___ lies across from the police station 缺少主詞，先行詞 the park 是事物，要用關係代名詞 which（或 that）當主詞。where 是關係副詞，後面要接完整句子，不能當主詞。", "explanationSource": "source", "section": "單題"}, {"id": 36, "question": "第 2 題 Grace: Do you really mean it when saying you'll never turn your back on me? Ray: Yes. From the ______ of my heart.", "options": ["bottom", "copy", "sound", "pin"], "answer": 0, "answerLabel": "A", "source": "p.292｜字彙｜素養試界 A++ 單題", "explanation": "from the bottom of my heart 是固定片語，意思是「發自內心深處、真心誠意地」。sound（聲音）、copy（複本）、pin（別針）都不能構成此片語。", "explanationSource": "source", "section": "單題"}, {"id": 37, "question": "第 7 題 This is the sofa on ______ Grandpa used to sit while watching TV.", "options": ["who", "that", "which", "what"], "answer": 2, "answerLabel": "C", "source": "p.292｜文法｜素養試界 A++ 單題（關係子句：介系詞＋關代）", "explanation": "介系詞 on 後面的關係代名詞只能用 which（事物）或 whom（人），不能用 that。先行詞 the sofa 是物，所以用 on which（= where）。（學生原答案被紅筆塗掉，無法辨識，但老師已訂正為 C。）", "explanationSource": "source", "section": "單題"}, {"id": 38, "question": "第 11 題 The man and his pet ______ were interviewed by many reporters are famous in this country.", "options": ["which", "that", "who", "whose"], "answer": 1, "answerLabel": "B", "source": "p.293｜文法｜素養試界 A++ 單題（關係子句）", "explanation": "先行詞同時有「人＋動物」（the man and his pet）時，關係代名詞只能用 that。空格後缺主詞（___ were interviewed），所以不用所有格 whose；who 只限人、which 只限物。", "explanationSource": "source", "section": "單題"}, {"id": 39, "question": "第 13 題 A good ruler will never turn a ______ eye to people's needs and will always try to help them.", "options": ["blind", "strange", "low", "rich"], "answer": 0, "answerLabel": "A", "source": "p.293｜字彙｜素養試界 A++ 單題", "explanation": "turn a blind eye to... 是固定片語，意思是「對……視而不見、故意忽視」。好的統治者不會對人民的需要視而不見，所以選 blind。（學生原答案被擦掉，老師紅筆訂正為 A。）", "explanationSource": "source", "section": "單題"}, {"id": 40, "question": "第 16 題 After I actually started to do the work, I found it not as easy as it ______ at first. It turned out to be a lot harder.", "options": ["appeared", "guessed", "expected", "explained"], "answer": 0, "answerLabel": "A", "source": "p.293｜字彙｜素養試界 A++ 單題", "explanation": "主詞是 it（這份工作），「它一開始看起來」要用 appear（看起來；= seem）。expect（預期）的主詞必須是人，要說 as I expected 才對，工作本身不會「預期」。", "explanationSource": "source", "section": "單題"}, {"id": 41, "question": "第 21 題 Hundreds of people got together at the town ______ to watch the band show this evening.", "options": ["couch", "ground", "planet", "square"], "answer": 3, "answerLabel": "D", "source": "p.293｜字彙｜素養試界 A++ 單題", "explanation": "town square 是「城鎮廣場」，是大家聚集看表演的地方。ground 是「地面；場地」，不會說 town ground；couch（沙發）、planet（行星）語意不合。", "explanationSource": "source", "section": "單題"}, {"id": 42, "question": "第 3 題 The ______ has gone off since the strong typhoon hit this island yesterday.", "options": ["business", "blanket", "deal", "power"], "answer": 3, "answerLabel": "D", "source": "p.314｜字彙｜會考隨堂做 (字彙)", "explanation": "power 在此指「電力」，The power has gone off＝停電了，颱風來襲後停電最合理。blanket 是「毯子」，毯子不會 go off（熄滅、中斷）。關鍵字是 has gone off 和 typhoon。", "explanationSource": "source", "section": "單題"}, {"id": 43, "question": "第 2 題 Wayne: I'd be surprised if you got apples from that tree.\nNita: ______ In fact, it's a peach tree.", "options": ["So would I.", "Neither would I.", "So had I.", "Neither had I."], "answer": 0, "answerLabel": "A", "source": "p.316｜文法｜會考隨堂做 (附和句)", "explanation": "I'd = I would，是肯定句，附和用「So + would + 主詞」→ So would I.（我也會很驚訝）。Neither 用於附和否定句，原句沒有 not，所以 (B) 錯。", "explanationSource": "source", "section": "單題"}, {"id": 44, "question": "第 4 題 Michael seldom writes letters, and Pete doesn't, ______.", "options": ["either", "too", "neither", "so"], "answer": 0, "answerLabel": "A", "source": "p.316｜文法｜會考隨堂做 (附和句)", "explanation": "seldom 是否定意味的副詞，附和否定句用「主詞 + 否定助動詞, either」→ Pete doesn't, either. neither 本身已有否定，不能接在 doesn't 後面（雙重否定），要用就得寫成 neither does Pete。（此題老師未批改，依文法判斷學生答錯。）", "explanationSource": "source", "section": "單題"}, {"id": 45, "question": "第 6 題 ______ you ______ your brother can go out before you finish tidying your bedrooms. So, you'd better do it right now.", "options": ["Both; and", "Either; or", "Neither; nor", "No only; but also"], "answer": 2, "answerLabel": "C", "source": "p.317｜文法｜會考隨堂做 (對等連接詞)", "explanation": "後句說「你最好現在就做」，表示整理完房間前兩個人「都不能」出去，要用 Neither A nor B（兩者皆不）。Both A and B 表示兩人都可以出去，與後句語意矛盾。", "explanationSource": "source", "section": "單題"}, {"id": 46, "question": "第 7 題 We couldn't find bus stops on ______ side of this road, so we decided to go to the next street.", "options": ["both", "neither", "any", "either"], "answer": 3, "answerLabel": "D", "source": "p.317｜文法｜會考隨堂做 (對等連接詞)", "explanation": "either side 表示「(兩邊中)任一邊」，後接單數 side，couldn't ... either side＝兩邊都找不到。句中已有否定 couldn't，再用 neither 會變雙重否定；both 後面要接複數 sides。", "explanationSource": "source", "section": "單題"}, {"id": 47, "question": "第 8 題 When I was walking past the store, I saw that beautiful dress in the window and couldn't help stopping to ______ it.", "options": ["put on", "try on", "pick up", "look at"], "answer": 3, "answerLabel": "D", "source": "p.319｜文法｜會考隨堂做 (片語 / used to)", "explanation": "經過商店、看到櫥窗裡的洋裝，忍不住停下來「看」它 → look at it。try on、put on、pick up 是可分片語動詞，受詞是代名詞 it 時必須放中間（try it on），不能寫成 try on it；而且在店外也不能試穿。學生原答 B，後改為 D。", "explanationSource": "source", "section": "單題"}, {"id": 48, "question": "第 9 題 We are feeling down. Let's go shopping to ______ ourselves ______!", "options": ["look; up", "give; up", "pick; up", "cheer; up"], "answer": 3, "answerLabel": "D", "source": "p.319｜文法｜會考隨堂做 (片語 / used to)", "explanation": "feeling down＝心情低落，所以要去購物「讓自己振作起來」→ cheer ourselves up。pick up 是「撿起、接人」，意思不合。學生原答 C，後改為 D。", "explanationSource": "source", "section": "單題"}, {"id": 49, "question": "第 10 題 We know you ______ work for big shopping centers. Would you tell us why you choose such a small shoe store like us now?", "options": ["are used to", "get used to", "used to", "will be used to"], "answer": 2, "answerLabel": "C", "source": "p.319｜文法｜會考隨堂做 (片語 / used to)", "explanation": "後句有 now，表示「以前」在大型購物中心工作、現在不是了 → used to + 原形動詞（過去常常）。be used to 後面要接 V-ing/名詞，表示「習慣於」，此處接原形 work 且語意不合。學生原答 A，後改為 C。", "explanationSource": "source", "section": "單題"}, {"id": 50, "question": "第 11 題 Look at the rainbow! ______ wonderful work of nature!", "options": ["So", "How", "Too", "What a"], "answer": 3, "answerLabel": "D", "source": "p.320｜文法｜會考隨堂做 (感嘆句)", "explanation": "感嘆句：What + a/an + 形容詞 + 單數名詞！ work 在此是可數名詞「作品」，所以用 What a wonderful work of nature! How 後面只能直接接形容詞或副詞（How wonderful!），不能再接名詞。", "explanationSource": "source", "section": "單題"}, {"id": 51, "question": "第 16 題 Nick: I am sorry that I let you down.\nJane: ______ I can see you tried to make it right.", "options": ["Business is business.", "Rome wasn't built in a day.", "No change.", "Not quite."], "answer": 1, "answerLabel": "B", "source": "p.321｜綜合｜素養試界 單題", "explanation": "Nick 為讓對方失望道歉，Jane 說「我看得出你努力想做好」，是在安慰他：Rome wasn't built in a day（羅馬不是一天造成的，事情需要時間慢慢來）。Not quite 意思是「不完全是」，無法回應道歉，語意不通。", "explanationSource": "source", "section": "單題"}, {"id": 52, "question": "第 8 題 Zack got to the gym too late and could only get the seat in the back ______ of the gym.", "options": ["circle", "level", "middle", "row"], "answer": 3, "answerLabel": "D", "source": "p.334｜字彙｜單元16 綜合練習（字彙）", "explanation": "座位的「一排」用 row，in the back row 指最後一排。level 是「程度；樓層、水平高度」，不能表示座位的排。", "explanationSource": "source", "section": "單題"}, {"id": 53, "question": "第 13 題 ______ everybody dies is a fact, so live at the moment.", "options": ["It", "That", "Why", "What"], "answer": 1, "answerLabel": "B", "source": "p.334｜文法｜單元16 綜合練習（名詞子句）", "explanation": "「That + 完整句子」可當主詞（名詞子句），表示「…這件事」。everybody dies 已是完整句子（有主詞、動詞），所以用 That，不需另外的代名詞。What 本身要在子句中當主詞或受詞，用在完整句前就錯了。", "explanationSource": "source", "section": "單題"}, {"id": 54, "question": "第 21 題 Jenny: Ivan told me that Alice ______ around about you. Is there anything I should know?\nDrew: No way! You must be kidding.", "options": ["has asked", "used to ask", "was asking", "will ask"], "answer": 0, "answerLabel": "A", "source": "p.335｜文法｜單元16 綜合練習（情境時態題）", "explanation": "老師紅筆訂正為 (A)，並註「lately 最近」。表示 Alice 最近一直在打聽你、對現在有影響，用現在完成式 has asked。used to 指過去習慣、現在已不做，不合語意。（註：依時態一致 was asking 亦常見，但本題以老師答案 A 為準。）", "explanationSource": "source", "section": "單題"}, {"id": 55, "question": "第 23 題 Hank: When will you come again? Soon?\nLucy: Perhaps not, but if I ______, I'll call you. You have my word.", "options": ["am", "did", "do", "will"], "answer": 2, "answerLabel": "C", "source": "p.335｜文法｜單元16 綜合練習（情境時態題）", "explanation": "條件句 if 子句要用「現在式代替未來式」，所以不能用 will。if I do = if I come，do 代替前面的動詞 come。", "explanationSource": "source", "section": "單題"}, {"id": 56, "question": "第 24 題 If you don't want to be wet, just get out of the rain. Though the bad experience may be like ______ hanging over your head, believe there is always bright light ahead.", "options": ["a bright sun", "a dark cloud", "a rainy day", "a light wind"], "answer": 1, "answerLabel": "B", "source": "p.335｜文法｜單元16 綜合練習（情境時態題）", "explanation": "「掛在頭上」的壞經驗用「一朵烏雲」a dark cloud 比喻壞事（bad things）。rainy day 是「下雨天」，不能「掛在頭上」，而且後面 bright light ahead 和「烏雲」形成對比。", "explanationSource": "source", "section": "單題"}, {"id": 57, "question": "第 38 題 Our boss can't stand stupid mistakes at all. Even if you make just one, there ______. So, be very careful!", "options": ["you go", "it is", "goes your job", "it comes"], "answer": 2, "answerLabel": "C", "source": "p.336｜字彙｜單元16 綜合練習（慣用語）", "explanation": "There goes your job. 是倒裝慣用語，意思是「你的工作就沒了」（會被開除 be fired）。老闆不能忍受錯誤，所以犯一個錯工作就不保。there it is 是「就在那裡」，語意不合。", "explanationSource": "source", "section": "單題"}, {"id": 58, "question": "第 45 題 He said we ______ up at the school gate after school. I waited for half an hour, but he never showed up.", "options": ["met", "have met", "will meet", "would meet"], "answer": 3, "answerLabel": "D", "source": "p.337｜文法｜單元16 綜合練習（時態／子句）", "explanation": "主要動詞 said 是過去式，間接引述中的「未來」要改成 will 的過去式 would（過去未來式），表示「原本會」。will meet 時態沒有跟著 said 往前推，所以錯。", "explanationSource": "source", "section": "單題"}, {"id": 59, "question": "第 48 題 There ______ something wrong with the coffee machine since yesterday. Be sure to get someone to fix it today, please.", "options": ["was", "is", "will be", "has been"], "answer": 3, "answerLabel": "D", "source": "p.337｜文法｜單元16 綜合練習（時態／子句）", "explanation": "since yesterday（從昨天到現在）是現在完成式的標誌，所以用 has been。was 只表示過去，不能接 since 表示持續到現在。", "explanationSource": "source", "section": "單題"}, {"id": 60, "question": "第 50 題 Each of the items on the menu looked so delicious that I had a hard time deciding ______.", "options": ["which one should I order", "that one I should order", "which one to order", "which one I have ordered"], "answer": 2, "answerLabel": "C", "source": "p.337｜文法｜單元16 綜合練習（時態／子句）", "explanation": "decide 後接「疑問詞 + to V」：which one to order。若用間接問句要用直述句語序 which one I should order，(A) 把 should 放在主詞前是疑問句語序，錯誤。", "explanationSource": "source", "section": "單題"}, {"id": 61, "question": "第 52 題 We make sure both the pets and their owners ______ come to stay at our hotel will be taken the best care of.", "options": ["who", "which", "that", "they"], "answer": 2, "answerLabel": "C", "source": "p.337｜文法｜單元16 綜合練習（時態／子句）", "explanation": "先行詞同時有「動物 pets」和「人 owners」時，關係代名詞要用 that。who 只能指人，which 只能指物，they 不是關係代名詞不能連接子句。", "explanationSource": "source", "section": "單題"}, {"id": 62, "question": "第 55 題 Could you give me some ideas about ______ so that I know what to expect?", "options": ["you will carry out the plan", "will you carry out the plan", "how will you carry out the plan", "how you will carry out the plan"], "answer": 3, "answerLabel": "D", "source": "p.338｜文法｜單元16 綜合練習（間接問句）", "explanation": "介系詞 about 後面接名詞子句（間接問句），語序要用「疑問詞 + 主詞 + 動詞」：how you will carry out the plan。(C) how will you 是直接問句語序，不能放在句中。", "explanationSource": "source", "section": "單題"}, {"id": 63, "question": "第 56 題 When Vincent decided to give up his high-pay job as a doctor in a famous hospital to go back to his hometown in the countryside to take over the family business which was about to close down, some people said that he must be crazy while others thought of him to be brave. Either way, it was a quantum leap that he was taking.\nWhat does a quantum leap mean in the reading above?", "options": ["An excellent idea.", "A very big change.", "A dangerous mistake.", "A new way of making money."], "answer": 1, "answerLabel": "B", "source": "p.338｜閱讀測驗｜單元16 綜合練習（情境單題）", "explanation": "從名醫變成回鄉接手快倒閉的家族事業，是人生的「巨大轉變」，quantum leap 就是 a very big change。文中有人說他瘋了、有人說他勇敢（Either way），作者並沒有說這是好主意，所以不選 (A)。", "explanationSource": "source", "section": "單題"}, {"id": 64, "question": "第 57 題 A square has four right angles. Now draw a square. Next, from each angle inside of the square draw a straight line to the other one across. Now how many right angles in total are there in the drawing?\nThis is one of the questions in Tommy's math test at school today. Which of the following is the correct answer?\n[圖：正方形畫上兩條對角線，四個角與中心交點標出直角記號]", "options": ["Four.", "Six.", "Eight.", "Ten."], "answer": 2, "answerLabel": "C", "source": "p.338｜閱讀測驗｜單元16 綜合練習（情境單題）", "explanation": "從每個角畫線到對角，就是畫出兩條對角線。正方形本身 4 個直角，加上兩條對角線在中心交叉形成的 4 個直角，共 8 個。只算到正方形原本的 4 個角是漏算了中心的直角。（老師未寫紅色答案，依題意判斷）", "explanationSource": "source", "section": "單題"}, {"id": 65, "question": "第 1 題 Look at the picture. Where is the library? [圖：由左到右依序為郵局（門口有紅、綠郵筒）、消防局（119，有兩台消防車）、圖書館（招牌是一本打開的書）]", "options": ["It's behind the fire station.", "It's across from the post office.", "It's next to the fire station.", "It's between the post office and the fire station."], "answer": 2, "answerLabel": "C", "source": "p.343｜綜合｜會考模擬試題 第一部分：閱讀測驗 單題（看圖）", "explanation": "圖中三棟建築由左至右是郵局、消防局、圖書館，圖書館在最右邊，緊鄰消防局，所以是 next to the fire station。位於郵局和消防局「中間」的是消防局本身，不是圖書館，故 (D) 錯。", "explanationSource": "source", "section": "單題"}, {"id": 66, "question": "第 19 題 While reading the news report, David saw the word \"troll\" and didn't know what it meant.\n\"Five minutes later, I will present my report in class. I can't even sit well, but I believe I can make it. To get enough useful ideas about my topic, I have trolled the Internet for people with the experience of going on working holidays in Australia. They really shared a lot! OK! It's time for me to go on the stage. Good luck to me!\" (stage 講臺)\nHe found several meanings of it in a dictionary. Which one should David choose?", "options": ["To sing in a loud voice on the stage.", "To pull a fishing line through the water from the boat.", "To look for information or people you want on the Internet.", "To attack or hurt someone by writing something bad online."], "answer": 2, "answerLabel": "C", "source": "p.344｜字彙｜會考模擬試題 單題（HOT 情境單題）", "explanation": "文中 I have trolled the Internet for people with the experience of going on working holidays... They really shared a lot!，意思是在網路上「搜尋」有打工度假經驗的人，而且他們分享很多，所以是 (C) 在網路上找資訊或人。(D)「在網路上酸人、攻擊人」是 troll 常見的意思，但與上下文「為了找報告的點子」不符。", "explanationSource": "source", "section": "單題"}, {"id": 67, "question": "【Red Fire Ants（紅火蟻）】\nLook at the picture below. It is a red fire ant.\n[圖：一隻紅火蟻]\nIf you happen to see the insects, do stay away from them because they sting. Their stings can feel like you are on fire. Because red fire ants __22__, several might sting you at the same time. In this case, you may feel hurt, and you might even have to go to a doctor.\nRed fire ants make colonies, and hundreds of thousands of them live together. When they do so, they might __23__. In September, 2022, a great number of red fire ants started to make colonies in many corners of a small village. In a short time, there were red fire ants in trees, roots, sand, and mud walls of houses. Because of this, three out of the 26 families in the village had to move away.\nRed fire ants mostly feed on young plants and seeds. __24__, they sometimes attack and kill little animals. When they get the chance, they may enjoy a big meal of small birds, spiders, and other insects.\nTo know more about red fire ants, go to https://en.wikipedia.org/wiki/Fire_ant.\n\nsting 叮　colony 群落　village 村落\n\n第 23 題", "options": ["be bad for parks", "take a lot of time", "live in a place for some time", "be a trouble to houses or buildings"], "answer": 3, "answerLabel": "D", "source": "p.44｜克漏字｜題組 22–24（跨自然領域：克漏字）", "explanation": "空格後舉例：紅火蟻在房屋的泥牆裡築巢，導致 26 戶中有 3 戶搬走，可見牠們會「對房屋或建築造成麻煩」。(C) 只說住一段時間，無法接後面搬家的結果。", "explanationSource": "source", "section": "克漏字"}, {"id": 68, "question": "【(Greta and climate change, Word Count: 201)】\nAs a student and teenager, you should go to school if you are not sick or on vacation. Greta, a schoolgirl in Sweden, skipped school because of her worries about climate change. She was sad that she thought she was the only one who cared about climate change. \"She stopped talking... she stopped going to school,\" her father said. She __22__ through these for about three years until she could really do something for climate change. Her parents were the first ones __23__ stood up for her and tried to go green. They did so not to save the climate but __24__, or they could have lost her.\nAfter that, Greta went on sitting in front of the government office. She held a sign, reading \"Fridays for Future.\" Her action led many students in Europe to join her. They all want the government to take action to fight climate change. They will not stop until they __25__ their voices heard.\nThough Greta and the students do help to keep climate change from getting worse, __26__. However, \"If she needs me there, I'll try to do it,\" her father said. \"But I think she really needs to go back to school.\"\n(skip 避免；掠過　climate 氣候　government 政府)\n\n第 23 題 __23__", "options": ["which", "that", "whose", "what"], "answer": 1, "answerLabel": "B", "source": "p.294｜克漏字｜題組 22–26 克漏字", "explanation": "先行詞 the first ones（第一批人）有 the first 修飾，關係代名詞要用 that；空格後 stood up for her 缺主詞，不能用所有格 whose。原句：Her parents were the first ones that stood up for her。", "explanationSource": "source", "section": "克漏字"}, {"id": 69, "question": "【(Greta and climate change, Word Count: 201)】\nAs a student and teenager, you should go to school if you are not sick or on vacation. Greta, a schoolgirl in Sweden, skipped school because of her worries about climate change. She was sad that she thought she was the only one who cared about climate change. \"She stopped talking... she stopped going to school,\" her father said. She __22__ through these for about three years until she could really do something for climate change. Her parents were the first ones __23__ stood up for her and tried to go green. They did so not to save the climate but __24__, or they could have lost her.\nAfter that, Greta went on sitting in front of the government office. She held a sign, reading \"Fridays for Future.\" Her action led many students in Europe to join her. They all want the government to take action to fight climate change. They will not stop until they __25__ their voices heard.\nThough Greta and the students do help to keep climate change from getting worse, __26__. However, \"If she needs me there, I'll try to do it,\" her father said. \"But I think she really needs to go back to school.\"\n(skip 避免；掠過　climate 氣候　government 政府)\n\n第 25 題 __25__", "options": ["had", "will have", "have", "are having"], "answer": 2, "answerLabel": "C", "source": "p.294｜克漏字｜題組 22–26 克漏字", "explanation": "until 引導時間副詞子句，主要子句是未來式（will not stop），副詞子句要用現在式代替未來式，所以用 have。have their voices heard 表示「讓他們的聲音被聽見」。had 是過去式，時態不對。", "explanationSource": "source", "section": "克漏字"}, {"id": 70, "question": "【Working Hours in Spain】\nThere is something special about Spain: __65__. Spaniards, Spanish people, often start working around 9 a.m., take a long lunch break between 2 p.m. and 4 p.m. and finish work around 8 p.m. Most people do not have dinner until 8:30 p.m.\n\nIn Spain, it is common to take a break in the middle of the day, usually for two hours after lunch. This is mainly because it is very hot in summer. Spaniards __66__ a nap during this time. However, this practice has changed over time. In modern Spain, only a few people do it. The others may spend time and have fun with family and friends. __67__, in big cities and other busy places, many shops and restaurants stay open all afternoon for tourists.\n\nBecause of the long schedule of the day, Spaniards work late, have dinner late, watch TV, and then go to bed much later than they should. Then they start working at nine the next morning. Studies show that Spaniards __68__ than most other countries in northern Europe.\n\nAlthough some Spaniards would like to change the long working hours, it is difficult. After all, it has been around for more than 70 years.\n\n[字彙：nap 午睡　tourist 觀光客　schedule 時間表]\n[圖：一個人趴睡在鬧鐘旁]\n\n第 66 題 Spaniards __66__ a nap during this time.", "options": ["are taking", "will take", "used to take", "have taken"], "answer": 2, "answerLabel": "C", "source": "p.341｜克漏字｜素養搶鮮試（健體領域 × 多元文化）Working Hours in Spain", "explanation": "下一句說 However, this practice has changed over time. In modern Spain, only a few people do it.，表示「以前」西班牙人會午睡，現在已經很少人這樣做，所以要用 used to + V（過去常常）。(B) will take 表示未來，與「習慣已改變」的上下文矛盾。", "explanationSource": "source", "section": "克漏字"}, {"id": 71, "question": "【What Should You Do If You Come Across a Kitten on the Roadside?】\nClass: Science  Date: 2025/10/27\nWhat Should You Do If You Come Across a Kitten on the Roadside?\n\nIf the kitten is NOT HURT:\n○ If a mother is NOT around:\n▶ You CAN keep it warm and safe.\n→ Give it some food and water.\n→ Get a small box with a towel inside.\n▶ You CAN'T take it home right away.\n→ You have to look around to see if its mother is near.\n→ Your smell will make the mother give up on the kitten.\n○ If a mother is around:\n▶ Leave it there! (And its mother may come to it soon.)\n\nIf the kitten is HURT:\n▶ Don't touch or move it.\n→ If you touch it, it may bite you.\n▶ Call the animal center for help. (080-123-9876)\n\n[便條] People often think it is good to feed kittens cow's milk. ↓ WRONG! Cow's milk will upset its stomach.\n\nkitten 小貓　roadside 路邊　upset 使不適\n\n第 25 題 What might happen to the kittens if you feed them cow's milk?", "options": ["They may get angry with their keepers very often.", "They may have many butterflies in their stomachs.", "They may feel there is something wrong with their stomachs.", "They may keep crying until you give them their mothers' milk."], "answer": 2, "answerLabel": "C", "source": "p.23｜閱讀測驗｜題組 24–25（跨自然領域）", "explanation": "文中便條寫 \"Cow's milk will upset its stomach.\"（牛奶會讓牠的胃不舒服），即胃出了問題，選 (C)。文中沒提到小貓會一直哭到喝母奶，(D) 無根據。", "explanationSource": "source", "section": "閱讀測驗"}, {"id": 72, "question": "【Class Meeting: Lunch Outside School】\nNancy and her students are holding their class meeting right now.\n[表格]\nNancy: Many students want to have more lunch choices outside school, so I want to know your ideas. For me, I don't think it a good idea to allow you students to buy lunch outside school, as it will lead to more problems, like paper packaging and traffic problems.\nNick: I don't want to spend too much time thinking about everyday lunch. It is convenient for me to see lunch on the desk when the clock hits twelve.\nDan: I think we should not order food outside school. Eating school lunch can keep students away from food safety problems.\nAnna: I am okay with school lunch. But sometimes I really want to have more lunch choices. This can make me study harder when I know I can eat something else. So, we can meet each other halfway. Why not let students order food outside school two days a week?\nEmma: I like the idea. I think my stomach doesn't like school food, so I can't eat up my lunch and always have leftovers. If we can choose our lunch, I think there won't be so many food waste problems.\nJohn: I don't want to order food outside school. If school agrees to this idea, I will still eat school lunch because I don't have much pocket money.\n\nsafety 安全　halfway 中途　leftover 廚餘　waste 浪費\n\n第 29 題 About the idea of outside school lunch, which do the students NOT talk about?", "options": ["Spending time for their lunch.", "The problem of food leftovers.", "The problem of more paper waste.", "Spending more money on outside school food."], "answer": 0, "answerLabel": "A", "source": "p.46｜閱讀測驗｜題組 29–31（跨社會領域）", "explanation": "Emma 談到廚餘（B），Nancy 談到紙類包裝（C），John 談到零用錢不多（D）。Nick 只說不想花時間「想」午餐要吃什麼，沒有談到吃午餐要花的時間，所以選 (A)。（老師紅筆寫 A。）", "explanationSource": "source", "section": "閱讀測驗"}, {"id": 73, "question": "【Class Meeting: Lunch Outside School】\nNancy and her students are holding their class meeting right now.\n[表格]\nNancy: Many students want to have more lunch choices outside school, so I want to know your ideas. For me, I don't think it a good idea to allow you students to buy lunch outside school, as it will lead to more problems, like paper packaging and traffic problems.\nNick: I don't want to spend too much time thinking about everyday lunch. It is convenient for me to see lunch on the desk when the clock hits twelve.\nDan: I think we should not order food outside school. Eating school lunch can keep students away from food safety problems.\nAnna: I am okay with school lunch. But sometimes I really want to have more lunch choices. This can make me study harder when I know I can eat something else. So, we can meet each other halfway. Why not let students order food outside school two days a week?\nEmma: I like the idea. I think my stomach doesn't like school food, so I can't eat up my lunch and always have leftovers. If we can choose our lunch, I think there won't be so many food waste problems.\nJohn: I don't want to order food outside school. If school agrees to this idea, I will still eat school lunch because I don't have much pocket money.\n\nsafety 安全　halfway 中途　leftover 廚餘　waste 浪費\n\n第 31 題 From the reading, which of the following is NOT true?", "options": ["The boys don't want to order food outside school.", "Of the six people, more than half say no to this idea.", "Both the girls think this idea can make students study harder.", "Of the five students, Anna stands in between the two ends of this idea."], "answer": 2, "answerLabel": "C", "source": "p.46｜閱讀測驗｜題組 29–31（跨社會領域）", "explanation": "只有 Anna 說多點選擇能讓她更用功；Emma 談的是廚餘問題，沒說會更用功，所以 (C) 不正確。Anna 說 we can meet each other halfway（各退一步），立場在中間，(D) 正確。", "explanationSource": "source", "section": "閱讀測驗"}, {"id": 74, "question": "【British Isles】\nBritish Isles (Word Count: 108)\n[圖：英國與愛爾蘭地圖，標示 Scotland（9% of the population）、England（86% of the population）、Wales（5% of the population）、North Ireland、The Republic of Ireland；各地人物標示 British、Irish、British / English；藍線圈出 Great Britain，紅虛線圈出 the UK]\n\nWhen English men talk about Ireland, they mean the Republic of Ireland. It is also the name of the island.\n\nGreat Britain: England, Scotland, and Wales. It is not a country, but a name of the land.\n\nThe UK: England, Scotland, Wales and North Ireland. Each stands for independent sovereign countries. People choose their leader to rule each part of the place, but still, see the king or queen of England as the head of the country.\n\n✦ population 人口\n\n第 30 題 What is the full name of \"the UK?\"", "options": ["The United Kingdom of Great Britain.", "The United Kingdom of England and Ireland.", "The United Kingdom of England, Scotland, and Ireland.", "The United Kingdom of Great Britain and North Ireland."], "answer": 3, "answerLabel": "D", "source": "p.64｜閱讀測驗｜題組 30–32 British Isles", "explanation": "文中說 The UK 包含 England, Scotland, Wales and North Ireland；其中前三者合稱 Great Britain，所以全名是「大不列顛及北愛爾蘭聯合王國」。(C) 漏了 Wales，且 Ireland 指的是愛爾蘭共和國，不屬於英國。", "explanationSource": "source", "section": "閱讀測驗"}, {"id": 75, "question": "【British Isles】\nBritish Isles (Word Count: 108)\n[圖：英國與愛爾蘭地圖，標示 Scotland（9% of the population）、England（86% of the population）、Wales（5% of the population）、North Ireland、The Republic of Ireland；各地人物標示 British、Irish、British / English；藍線圈出 Great Britain，紅虛線圈出 the UK]\n\nWhen English men talk about Ireland, they mean the Republic of Ireland. It is also the name of the island.\n\nGreat Britain: England, Scotland, and Wales. It is not a country, but a name of the land.\n\nThe UK: England, Scotland, Wales and North Ireland. Each stands for independent sovereign countries. People choose their leader to rule each part of the place, but still, see the king or queen of England as the head of the country.\n\n✦ population 人口\n\n第 31 題 Daisy needs to finish her report on Great Britain and the UK. Which of the following words can she put in \"Both\"? [圖：文氏圖，左圈 Great Britain，右圈 the UK，交集處標示 Both]", "options": ["Called British.", "On Great Britain.", "Belonging to the British Isles.", "With England, Scotland, Wales, and Ireland."], "answer": 2, "answerLabel": "C", "source": "p.64｜閱讀測驗｜題組 30–32 British Isles", "explanation": "「Both」要填兩者共同的特點。Great Britain 和 the UK 都在地圖上的 British Isles（不列顛群島）範圍內，所以選 (C)。(B) 錯在 the UK 還包含北愛爾蘭，北愛爾蘭不在 Great Britain 這座島上。", "explanationSource": "source", "section": "閱讀測驗"}, {"id": 76, "question": "【After the Typhoon】\nAfter the Typhoon (119 words)\n\nNER\nDear Traveler,\n    The Purple Bridge was blown away during the strong typhoon this week. The White River City-Star Town line will be closed between July 12 and 26, 2024. If you wish to travel to Star Town, you will need to use the Green Town-Star Town line.\n    During this time, there will be free buses for travelers to take the Green Town-Star Town line. Please check below. Please also visit http://www.ner.gov/ for more information.\n    Sorry for the trouble.\n                                        Helen Petersons\n                                        National Railway\n\nBus Line ❶ runs every twenty minutes. Bus Line ❷ runs every half an hour.\n[圖：路線圖。上排鐵路站：White River City — Yellow Town — Purple Bridge — Brown Hill Town；下排鐵路站：Green Town — Rain Town — (Rainbow Bridge) — Gray Village — Star Town。Bus Line 1（紅虛線）連接 White River City、Yellow Town 與 Green Town；Bus Line 2（藍虛線）連接 Gray Village 與 Brown Hill Town。]\n\n✦ traveler 旅客\n\n第 39 題 What does National Railway NOT say in the notice?", "options": ["What happened to the Purple Bridge.", "Why the White River City-Star Town line will be closed.", "How much it costs to travel from Green Town to Star Town.", "How long the White River City-Star Town line will be closed."], "answer": 2, "answerLabel": "C", "source": "p.101｜閱讀測驗｜素養搶鮮試 After the Typhoon（社會領域×資訊教育×SDG11）", "explanation": "通知第一句就說 The Purple Bridge was blown away（紫橋被颱風吹走），所以 (A) 有提到；這也是路線關閉的原因 (B)；關閉期間 July 12 and 26 (D) 也有寫。只有從 Green Town 到 Star Town 的火車票價沒有提到（只說接駁公車免費），故選 (C)。", "explanationSource": "source", "section": "閱讀測驗"}, {"id": 77, "question": "【After the Typhoon】\nAfter the Typhoon (119 words)\n\nNER\nDear Traveler,\n    The Purple Bridge was blown away during the strong typhoon this week. The White River City-Star Town line will be closed between July 12 and 26, 2024. If you wish to travel to Star Town, you will need to use the Green Town-Star Town line.\n    During this time, there will be free buses for travelers to take the Green Town-Star Town line. Please check below. Please also visit http://www.ner.gov/ for more information.\n    Sorry for the trouble.\n                                        Helen Petersons\n                                        National Railway\n\nBus Line ❶ runs every twenty minutes. Bus Line ❷ runs every half an hour.\n[圖：路線圖。上排鐵路站：White River City — Yellow Town — Purple Bridge — Brown Hill Town；下排鐵路站：Green Town — Rain Town — (Rainbow Bridge) — Gray Village — Star Town。Bus Line 1（紅虛線）連接 White River City、Yellow Town 與 Green Town；Bus Line 2（藍虛線）連接 Gray Village 與 Brown Hill Town。]\n\n✦ traveler 旅客\n\n第 40 題 What is true about the bus lines?", "options": ["Bus Line ❶ doesn't stop at Rain Town.", "Bus Line ❷ crosses the Rainbow Bridge.", "Bus Line ❷ goes farther than Bus Line ❶.", "Bus Line ❶ runs less often than Bus Line ❷."], "answer": 0, "answerLabel": "A", "source": "p.101｜閱讀測驗｜素養搶鮮試 After the Typhoon（社會領域×資訊教育×SDG11）", "explanation": "看路線圖：Bus Line 1 從 White River City 經 Yellow Town 到 Green Town，沒有經過 Rain Town，所以 (A) 正確。Bus Line 2 只連接 Gray Village 和 Brown Hill Town，沒有經過 Rainbow Bridge，(B) 錯；Bus Line 2 路線較短 (C) 錯；Line 1 每20分鐘一班，比 Line 2 每半小時一班更頻繁 (D) 錯。", "explanationSource": "source", "section": "閱讀測驗"}, {"id": 78, "question": "【Religions in South Asia】\nReligions in South Asia\n[圖：南亞地圖，標示 Afghanistan, Pakistan, India, Nepal, Bhutan, Bangladesh, Sri Lanka, Maldives，五個說明框以箭頭指向各國]\n① People who believe in Islam are called Muslims. Most people in Pakistan and Bangladesh are Muslims.\n② Buddhism was introduced to Bhutan in the 7th century AD. Now, three-fourths of people living in Bhutan believe in Buddhism. Others are mostly followers of Hinduism.\n③ Hinduism is the largest religion in India (79.8% of the population), while Islam is the second largest (14.2% of the population). The rest of religions are Christianity (2.30%), Sikhism (1.72%), Buddhism (0.70%), Jainism (0.36%) and others (0.9%).\n④ Followers of Jainism don't eat meat but vegetables or fruits. What's more, they don't eat vegetables that are grown underground because they are afraid to hurt the roots and make them die.\n⑤ Sikhism came from Islam, so they have something in common. For example, both Sikhism and Islam are monotheistic religions. Followers believe in only one god. Most followers of Sikhism can be seen in Punjab, a place in northwest India.\n✦ religion 宗教　introduce 引進　century 世紀　population 人口\n\n第 30 題 Which is an example of monotheistic religion?", "options": ["[圖：信眾在廟裡拜一尊神像]", "[圖：民眾圍著一位穿紅衣的名人歡呼]", "[圖：觀眾在台下看樂團（吉他手、鼓手）表演]", "[圖：信眾在廟裡拜三尊神像]"], "answer": 0, "answerLabel": "A", "source": "p.264｜閱讀測驗｜題組 28–30 閱讀（Religions in South Asia）", "explanation": "文中⑤說 monotheistic religions 的信徒「believe in only one god（只信一位神）」。(A) 只拜一尊神，符合一神教；(D) 拜三尊神是多神。(B) 是追星、不是宗教，所以錯。", "explanationSource": "source", "section": "閱讀測驗"}, {"id": 79, "question": "【Japanese Student Absence from School】\n[圖表判讀題] Word Count: 140\nThe problem of Japanese student absence from school is getting more serious. A study in 2018 shows that the number of elementary and junior high school students who missed school for 30 days or more already hit 144,031 in 2017. Worryingly, the total is a 6.1% increase from that of 2016.\n[長條圖：Elementary and Junior High School Students in Japan Who Missed School for 30 Days or More in 2017（單位：thousand）— Elementary School Students 35,032；Junior High School Students 108,999]\n[圓餅圖：Elementary School Students in Japan — Students Who Missed School for 30 Days or More in 2017：1%]\n[圓餅圖：Junior High School Students in Japan — Students Who Missed School for 30 Days or More in 2017：4.1%]\nThe study also shows that most elementary school students who missed school were in the sixth grade, at 9,783, and 39,580 of the 108,999 junior high school students were in their third year.\nWhy is the number of elementary school and junior high school students who miss school on the rise? It is mostly because of their family problems and partly because of their problems with friends at school.\nBoth schools and families in Japan will have to think hard and take action to work out this absence problem.\n(absence 缺席　increase 增加)\n\n第 23 題 Which is true about the school absence problem in Japan?", "options": ["More elementary school students missed school than junior high school students did in 2017.", "More than 1% elementary school students missed school in 2017.", "Fewer than 5% junior high school students in Japan had an absence problem in 2017.", "The absence problem in 2016 is worse than that in 2017."], "answer": 2, "answerLabel": "C", "source": "p.278｜閱讀測驗｜閱讀 題組（圖表判讀題）", "explanation": "（此頁無紅筆批改，依圖表判斷。）圓餅圖顯示國中生缺席比例為4.1%，少於5%，所以C正確。小學生的比例只有1%，並沒有「超過」1%，故B錯；A國中缺席人數(108,999)比小學(35,032)多；D文中說2017比2016增加6.1%，2017更嚴重。", "explanationSource": "source", "section": "閱讀測驗"}, {"id": 80, "question": "【Phobias】\nWord Count: 235\nWe all have the things we are afraid of. Some people are afraid of insects, others are afraid of animals, and still others feel terrible when they hear loud noises. The following are the special terms for different phobias. Come take a look!\nDoraphobia: It means feeling afraid of fur. People who have doraphobia might not be able to keep a pet. They feel afraid when they see animals with fur. If they really want to do it, they'd better pick a turtle or a snake.\nAcrophobia: People who have acrophobia cannot stay at high places. You may have seen some people always close their eyes on the top of a mountain. Now you understand why.\nChionophobia: Being afraid of snow. People who have chionophobia should pick a warm place to live. There they would never see snow.\nClaustrophobia: People who have claustrophobia cannot take the metro or the plane. Any place that is closed makes them feel afraid. If any of your friends has claustrophobia, make sure to keep the windows and the doors open when you guys meet.\n[圖：一名男子在飛機上緊張地咬著手指]\nThanatophobia: Feeling afraid of death. People who have thanatophobia always think there might not be tomorrow, which makes them worried all the time. In fact, no matter how much we worry about tomorrow, it won't change anything and we will die one day. Why don't we spend each minute wisely when we're still living?\n(term 專有名詞　phobia 恐懼症　fur 毛)\n\n第 26 題 What does it mean?（指 Doraphobia 段落中 \"If they really want to do it\" 的 it）", "options": ["Keeping a pet.", "Cleaning the fur.", "Climbing the mountains.", "Seeing animals with fur."], "answer": 0, "answerLabel": "A", "source": "p.279｜閱讀測驗｜閱讀 題組 26–27", "explanation": "代名詞 it 指前一句提到的動作：might not be able to keep a pet。後面說「最好養烏龜或蛇」，可知 it = 養寵物，選A。D「看到有毛的動物」是他們害怕的事，不是他們「真的想做」的事。", "explanationSource": "source", "section": "閱讀測驗"}, {"id": 81, "question": "【Phobias】\nWord Count: 235\nWe all have the things we are afraid of. Some people are afraid of insects, others are afraid of animals, and still others feel terrible when they hear loud noises. The following are the special terms for different phobias. Come take a look!\nDoraphobia: It means feeling afraid of fur. People who have doraphobia might not be able to keep a pet. They feel afraid when they see animals with fur. If they really want to do it, they'd better pick a turtle or a snake.\nAcrophobia: People who have acrophobia cannot stay at high places. You may have seen some people always close their eyes on the top of a mountain. Now you understand why.\nChionophobia: Being afraid of snow. People who have chionophobia should pick a warm place to live. There they would never see snow.\nClaustrophobia: People who have claustrophobia cannot take the metro or the plane. Any place that is closed makes them feel afraid. If any of your friends has claustrophobia, make sure to keep the windows and the doors open when you guys meet.\n[圖：一名男子在飛機上緊張地咬著手指]\nThanatophobia: Feeling afraid of death. People who have thanatophobia always think there might not be tomorrow, which makes them worried all the time. In fact, no matter how much we worry about tomorrow, it won't change anything and we will die one day. Why don't we spend each minute wisely when we're still living?\n(term 專有名詞　phobia 恐懼症　fur 毛)\n\n第 27 題 Which of the following is true?", "options": ["Frankie thinks he will be dead anytime. He may have doraphobia.", "Angela can't open her eyes at high places. She might have thanatophobia.", "Ben never visits Japan in winter and hates snowy days. He has acrophobia.", "Joyce never closes the windows even on rainy days. She has claustrophobia."], "answer": 3, "answerLabel": "D", "source": "p.279｜閱讀測驗｜閱讀 題組 26–27", "explanation": "幽閉恐懼症(claustrophobia)的人怕封閉空間，要保持門窗打開，所以D正確。B在高處閉眼是懼高症(acrophobia)，不是死亡恐懼症(thanatophobia)；A怕死是thanatophobia；C怕雪是chionophobia。", "explanationSource": "source", "section": "閱讀測驗"}, {"id": 82, "question": "【(Lisa is reporting from Québec, Canada.)】\nLisa is reporting from Québec, Canada.\nLisa: This is Lisa Hill from TTC NEWS. Look at these beautiful bottles. In them is maple syrup. Canada is famous for this sweet thing, which mostly comes from Québec. Look at the chart. It shows where the world's maple syrup comes from.\n[圓餅圖：Québec 72%、United States 20%、The Other Places in Canada 8%]\nLisa: Maple syrup is made from the sap and it is collected from maple trees. Maple syrup is expensive, about $32 a gallon. It is because it takes over 40 gallons of maple tree sap to make a gallon of syrup. Look at the chart below.\n[流程圖：a maple tree（楓樹圖）→ Its age, its health, and the weather decide how much sap it produces each season. → It produces 5 to 15 gallons of sap each season.]\nLisa: Each year, in March and April, maple syrup festivals are celebrated in some parts of Canada, like Québec. They are good chances to learn about maple syrup and how to make it from tree sap. Perhaps the most interesting thing to do is tasting delicious syrup and maple candy. Come and enjoy the festivals to the fullest this spring.\nLisa: Have a nice day! This is Lisa from Québec.\n（字彙：maple 楓樹；syrup 糖漿；sap 樹液；gallon 加侖；produce 產生）\n\n第 21 題 What is the percentage (%) of Canada's maple syrup from Québec?", "options": ["72 %.", "80 %.", "90 %.", "92 %."], "answer": 2, "answerLabel": "C", "source": "p.322｜閱讀測驗｜題組 21–23", "explanation": "問的是「加拿大的」楓糖漿中魁北克占多少，不是全世界。加拿大＝魁北克 72% + 其他地區 8% = 80%，魁北克占 72 ÷ 80 = 90%。72% 是占全世界的比例，92% 沒有根據。（此題無紅筆批改，學生字跡似為 D。）", "explanationSource": "source", "section": "閱讀測驗"}, {"id": 83, "question": "【Take the Bus with Dogs】\nTake the Bus with Dogs\nMore and more families in Beach Town have at least one dog at home. Beach Town Bus Company plans to have two more bus lines for large dogs to ride on the bus with their owners. What do you think?\n[圖：一隻哈士奇坐在公車地板上]\nMary: The thought of riding a bus with large dogs scares me. A dog once attacked me when I was little, so I always stay away from dogs. Pets that can't be kept in small carriers should not be allowed on the bus. This way, it can be safer for us to take a bus.\nSusan: Although there are only a few large-dog-friendly bus lines in our town, it's a good start. My dog loves the bus ride, too. If the bus can stop off at dog-friendly restaurants and dog parks, it will be even better. I hope there will be more large-dog-friendly bus lines in the future.\nBill: I have three children aged under 8. I don't think it's proper to allow large dogs to sit on the foot space or on the floor of the bus. Taking up a seat is even worse. Dogs that are not well-trained can be dangerous to kids.\nTony: I don't have a four-legged friend, but I think taking dog-friendly buses is a good chance to show our kindness. It is a good try. I totally agree with it.\n（字彙：kindness 仁慈）\n\n第 29 題 Jim said, \"For owners of large dogs, it's fun to take a bus with their pets. But your dog may not be nice to strangers. I'm also worried about what will happen when the bus driver comes to a sudden stop.\" Who is Jim talking about?", "options": ["Mary.", "Susan.", "Billy.", "Tony."], "answer": 1, "answerLabel": "B", "source": "p.324｜閱讀測驗｜題組 27–29", "explanation": "Jim 說「your dog」，表示對方有養狗，而且覺得帶狗搭公車很有趣——這是 Susan（My dog loves the bus ride, too.）。Mary 怕狗、沒有養狗，Tony 也說自己沒有狗。（此題無紅筆批改，依文意判斷學生答錯。）", "explanationSource": "source", "section": "閱讀測驗"}, {"id": 84, "question": "【An Interview with an Astronaut】\nAn Interview with an Astronaut\nKen is interviewing Dr. Ben Smith, who was once an astronaut.\nKen: Hi! Thank you so much for being here today, Dr. Smith. You had a lot of experience being an astronaut and working in space before. What does it take to be one?\nDr. Smith: No problem at all. There are three keys to being one. First of all, you must have good eyesight and good health. Second, you must be good at science or math to work on a spaceship. You know, there are a lot of problems to deal with and you need to know how. Last, you must be a good teamwork player. When on a mission, it means living and working closely with other people for months. That's when teamwork counts.\nKen: Wow! There's a lot to learn before a mission.\nDr. Smith: You can say that again.\nKen: What about flying experience?\nDr. Smith: It's not a must, but if you have it, it's good.\nKen: I see. You are no longer an astronaut. What do you do now?\nDr. Smith: I teach about space and I often talk about being an astronaut.\nKen: You really have a passion for space.\nDr. Smith: Yes, that's what I want to have and share in my lifetime.\nKen: Great!\n(astronaut 太空人 / eyesight 視力 / spaceship 太空船 / mission 任務 / teamwork 團隊合作)\n\n第 36 題 In the dialogue, which is WRONG?", "options": ["Ben Smith used to be an astronaut.", "Astronauts use science or math on a mission.", "Astronauts need to be able to see things clearly.", "You have to be able to fly a plane to be an astronaut."], "answer": 3, "answerLabel": "D", "source": "p.327｜閱讀測驗｜素養搶鮮試（自然領域×生涯規劃）文意理解", "explanation": "題目問「哪一項錯誤」。Dr. Smith 說飛行經驗 \"It's not a must\"（不是必要的），所以 (D)「一定要會開飛機」是錯的。(C) 對應 \"you must have good eyesight\"（視力好＝看得清楚），是正確敘述，不能選。", "explanationSource": "source", "section": "閱讀測驗"}, {"id": 85, "question": "【A Trip by Train】\nA Trip by Train\nDo you like to take a trip by train? If so, don't miss Japan's Takachiho Amaterasu Railway. The 30-minute train ride, which crosses the highest railway bridge in Japan, will give you a new and exciting experience that you will never forget.\nWhat makes this railway ride more special is the small open-air train with a glass floor, allowing visitors to fully enjoy the beautiful views of the mountains and the river from the 105-meter high railway bridge. To make the ride more exciting, the train workers move a box that makes bubbles along the way. You can see them floating in the air, which kids really love. You can also play with the bubbles or take photos of them.\nThere is another special thing about the train. It runs on fuel that is quite different from what other trains use. It uses fuel made from vegetable oil or animal fat. Because of the green fuel, the train ride is cleaner and better for nature.\nTo take the train, you need to go to Takachiho Amaterasu Railway Station. Tickets can be bought at the station or on the Internet. The train runs ten times a day, so you can choose a time that works best for you.\nEnjoy the ride!\n[圖：一列粉紅白色的小火車行駛在樹林旁]\n(railway 鐵路 / view 景觀 / bubble 氣泡 / float 飄 / fuel 燃料)\n\n第 40 題 From the reading, what can a visitor NOT do when taking the Takachiho Amaterasu Railway?", "options": ["Blow the bubbles.", "Sit or stand in an open-air car.", "Enjoy a cleaner ride because of green fuel.", "Enjoy the sight of the river from the car floor."], "answer": 0, "answerLabel": "A", "source": "p.328｜閱讀測驗｜素養搶鮮試（科技領域×能源教育）文意理解", "explanation": "本頁老師未用紅筆批改，依文意判斷。文中說泡泡是 \"the train workers move a box that makes bubbles\"，是工作人員用機器製造，旅客只能 \"play with the bubbles or take photos\"，不是自己吹泡泡，所以答 (A)。火車本身是 open-air train，(B) 可以做到。", "explanationSource": "source", "section": "閱讀測驗"}, {"id": 86, "question": "【（新品種蘭花 / new species of orchid）】\nFor nature lovers, flowers are beautiful and full of surprises. They come in different colors, shapes, and sizes. Each type of flower is one-of-the-kind. Of all the flowers in nature, orchids have won the hearts of many people.\n\nThere are 28,000 orchid species in the world. Now a new species of orchid is found in Japan, which is quite exciting. There is something interesting about the new orchid. First, it belongs to the Spiranthes family. There are about 50 different kinds of Spiranthes in the world, which are the most common kind of orchid in Japan. Second, the new species is very beautiful. It has very small bell-shaped flowers. Its petals are only about 0.1 to 0.2 inches long, and they look like they are made of glass. Third, the orchid was found in a park, which is thought of as a common place.\n\nNext time when visiting a park or working in your garden, open your eyes and look. Who knows if you will find a new species of plants?\n\n[字彙：orchid 蘭花　species 物種　petal 花瓣]\n[圖：一株開著粉紅色小花的綬草蘭花]\n\n第 25 題 Which is NOT said about the new orchid in the reading?", "options": ["Who found it.", "How it looks.", "Where it was found.", "What family it belongs to."], "answer": 0, "answerLabel": "A", "source": "p.346｜閱讀測驗｜會考模擬試題 題組 24–26（跨自然領域）", "explanation": "文中有提到它的外觀（very small bell-shaped flowers... look like they are made of glass）、發現地點（in a park）、所屬家族（belongs to the Spiranthes family），但完全沒有說是「誰」發現的，所以答案是 (A)。注意題目問 NOT。", "explanationSource": "source", "section": "閱讀測驗"}, {"id": 87, "question": "【（新品種蘭花 / new species of orchid）】\nFor nature lovers, flowers are beautiful and full of surprises. They come in different colors, shapes, and sizes. Each type of flower is one-of-the-kind. Of all the flowers in nature, orchids have won the hearts of many people.\n\nThere are 28,000 orchid species in the world. Now a new species of orchid is found in Japan, which is quite exciting. There is something interesting about the new orchid. First, it belongs to the Spiranthes family. There are about 50 different kinds of Spiranthes in the world, which are the most common kind of orchid in Japan. Second, the new species is very beautiful. It has very small bell-shaped flowers. Its petals are only about 0.1 to 0.2 inches long, and they look like they are made of glass. Third, the orchid was found in a park, which is thought of as a common place.\n\nNext time when visiting a park or working in your garden, open your eyes and look. Who knows if you will find a new species of plants?\n\n[字彙：orchid 蘭花　species 物種　petal 花瓣]\n[圖：一株開著粉紅色小花的綬草蘭花]\n\n第 26 題 Who would be least interested in this reading?", "options": ["Mark, who is a lover of plants.", "Ken, who has studied orchids for years.", "Judy, who enjoys visiting zoos in Japan.", "Sally, who grows some orchids in her garden."], "answer": 2, "answerLabel": "C", "source": "p.346｜閱讀測驗｜會考模擬試題 題組 24–26（跨自然領域）", "explanation": "本文介紹日本新發現的蘭花品種，喜歡植物、研究蘭花、在花園種蘭花的人都會有興趣。Judy 喜歡的是「動物園」，跟植物無關，雖然有 Japan 這個字，但是陷阱，所以她最不會感興趣。least＝最不。", "explanationSource": "source", "section": "閱讀測驗"}]};</script><script src="longteng-b1u5-quiz.js?v=20261106-3"></script><script>document.querySelector("#description").textContent="共 87 題錯題｜分三區：單題 66／克漏字 4／閱讀測驗 17｜閱讀題附完整文章｜選答後顯示中文解析｜可下載錯題";</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
