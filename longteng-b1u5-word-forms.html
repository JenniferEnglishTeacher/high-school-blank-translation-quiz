  <main class="wrap">

    </section>

    <section id="quiz" class="card hidden">

    <section id="result" class="card hidden">

  </main>
  <script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 5｜詞類變化","mode":"spell","questions":[{"id":1,"question":"The Lins will move into a country house which blends in with its natural ____________ (surround).","answers":["surroundings"],"source":"龍騰自命題","explanation":"林姓一家人將遷入一棟融入自然環境的鄉間屋宅。考點句構：adj. + N。","explanationSource":"source"},{"id":2,"question":"The ____________ (produce) of workers will increase when they are happy in the workplace.","answers":["productivity"],"source":"龍騰自命題","explanation":"當員工在職場感到開心時，他們的生產效率就會提升。考點句構：the + N（此名詞指抽象的「生產力」）。","explanationSource":"source"},{"id":3,"question":"As more and more ____________ (environment) problems pop up, people are beginning to better understand the importance of going green.","answers":["environmental"],"source":"龍騰自命題","explanation":"隨著愈來愈多的環境問題浮現，人們開始比較了解環保的重要。考點句構：adj. + N。","explanationSource":"source"},{"id":4,"question":"Recent studies show that food safety in restaurants is an increasing concern among ____________ (consume).","answers":["consumers"],"source":"龍騰自命題","explanation":"最近研究顯示消費者對餐廳食品安全的擔憂日益增加。考點句構：介系詞among後面接複數名詞。","explanationSource":"source"},{"id":5,"question":"The evil queen wanted to ____________ (poisonous) Snow White by giving her a poisoned apple.","answers":["poison"],"source":"龍騰自命題","explanation":"邪惡的皇后給白雪公主有毒的蘋果，想要毒害她。考點句構：want to + VR。","explanationSource":"source"},{"id":6,"question":"The honey sold at the store is said to be ____________ (product) by wild bees. That’s why it is sold at such a high price.","answers":["produced"],"source":"龍騰自命題","explanation":"據說這家店販售的蜂蜜是由野生蜜蜂所產出。這就是為何它售價高昂的原因。考點句構：被動語態（be + p.p.）。","explanationSource":"source"},{"id":7,"question":"We should avoid drugs like cocaine because they are very ____________ (harm) to our health.","answers":["harmful"],"source":"龍騰自命題","explanation":"我們必須避開像古柯鹼這類的毒品，因為它們對我們的健康造成嚴重傷害。考點句構：be動詞 + 形容詞。","explanationSource":"source"},{"id":8,"question":"The containers used by the store are made of ____________ (recycle) paper.","answers":["recycled"],"source":"龍騰自命題","explanation":"這家店所使用的容器是用回收紙做成的。","explanationSource":"source"},{"id":9,"question":"There are ____________ (crowded) of people in the park, enjoying the spring cherry blossoms.","answers":["crowds"],"source":"龍騰自命題","explanation":"公園裡有一群群的人們正在欣賞春天的櫻花盛開。考點句構：There are + 複數名詞。","explanationSource":"source"},{"id":10,"question":"Jeans are ____________ (properly) when you hang out with friends after work.","answers":["proper"],"source":"龍騰自命題","explanation":"你下班後與朋友出去時，牛仔褲是適當的。考點句構：be + adj.。","explanationSource":"source"},{"id":11,"question":"Joseph couldn’t even look at you when he told you what had happened. It was ____________ (obviously) that he was lying.","answers":["obvious"],"source":"習作簿","explanation":"補充解析：obvious 是形容詞，接在 be 動詞後。Joseph 說明事情經過時甚至不敢看你，顯然他在說謊。","explanationSource":"supplement"},{"id":12,"question":"To reduce pollution, people should take their old computers and cell phones to ____________ (recycle) plants.","answers":["recycling"],"source":"習作簿","explanation":"補充解析：recycling 作形容詞用，recycling plants 指「回收廠」。為減少污染，人們應把舊電腦和手機送到回收廠。","explanationSource":"supplement"},{"id":13,"question":"Regular exercise and a ____________ (properly) diet will be good for your health. You won’t get sick so often.","answers":["proper"],"source":"習作簿","explanation":"補充解析：proper 是形容詞，修飾 diet。規律運動與適當飲食有益健康，能降低生病頻率。","explanationSource":"supplement"},{"id":14,"question":"This factory can ____________ (product) 100 cars per hour. That’s really amazing.","answers":["produce"],"source":"習作簿","explanation":"補充解析：can 後接原形動詞 produce「生產」。這家工廠每小時能生產一百輛汽車，十分驚人。","explanationSource":"supplement"},{"id":15,"question":"When you live in a foreign country, you have to spend a lot of time getting used to your new ____________ (surround).","answers":["surroundings"],"source":"All in One","explanation":"補充解析：surroundings 是複數名詞，表示「周遭環境」。住在國外時，需要花很多時間適應新環境。","explanationSource":"supplement"},{"id":16,"question":"This river contains a high level of ____________ (harm) chemicals. You’ll get sick if you drink the water.","answers":["harmful"],"source":"All in One","explanation":"補充解析：harmful 是形容詞，修飾 chemicals。這條河含有高濃度有害化學物質，喝下河水會生病。","explanationSource":"supplement"},{"id":17,"question":"After the job interview, Joe was ____________ (eagerly) to know if he would be hired as an engineer.","answers":["eager"],"source":"All in One","explanation":"補充解析：eager 是形容詞，be eager to 表示「渴望……」。面試後 Joe 急著知道自己是否獲聘為工程師。","explanationSource":"supplement"},{"id":18,"question":"Steve wondered whether it would be ____________ (properly) to knock at Ann’s door late at night.","answers":["proper"],"source":"All in One","explanation":"補充解析：proper 是形容詞。Steve 想知道深夜敲 Ann 的門是否合宜。","explanationSource":"supplement"},{"id":19,"question":"Fewer trees will be cut down if we ____________ (recycling) more paper.","answers":["recycle"],"source":"All in One","explanation":"補充解析：if 子句需要動詞 recycle「回收」。如果回收更多紙張，被砍伐的樹木就會減少。","explanationSource":"supplement"}]};</script>
