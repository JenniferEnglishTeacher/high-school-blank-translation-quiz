owers refreshed her mind.", "options": ["instance", "dominance", "appliance", "fragrance"], "answer": 3, "answerLabel": "D", "source": "97 學測｜詞彙｜第 6 題", "explanation": "花的「香氣」使她精神一振：fragrance 芳香。instance 例子、dominance 支配、appliance 家電。", "explanationSource": "own", "section": "詞彙"}, {"id": 7, "question": "第 7 題　The profits of Prince Charles’s organic farm go to ______ to help the poor and the sick.", "options": ["charities", "bulletins", "harvests", "rebels"], "answer": 0, "answerLabel": "A", "source": "97 學測｜詞彙｜第 7 題", "explanation": "有機農場的利潤捐給「慈善機構」幫助窮人和病人：charities。bulletin 公告、harvest 收成、rebel 反叛者。", "explanationSource": "own", "section": "詞彙"}, {"id": 8, "question": "第 8 題　Jack was given the rare ______ of using the president’s office, which made others quite jealous.", "options": ["mischief", "privilege", "involvement", "occupation"], "answer": 1, "answerLabel": "B", "source": "97 學測｜詞彙｜第 8 題", "explanation": "能使用總裁辦公室是罕見的「特權」，令人嫉妒：privilege。mischief 惡作劇、involvement 參與、occupation 職業。", "explanationSource": "own", "section": "詞彙"}, {"id": 9, "question": "第 9 題　This new computer is obviously ______ to the old one because it has many new functions.", "options": ["technical", "suitable", "superior", "typical"], "answer": 2, "answerLabel": "C", "source": "97 學測｜詞彙｜第 9 題", "explanation": "新電腦功能多，明顯「優於」舊電腦：be superior to 優於（固定搭配 to）。technical 技術的、suitable 適合的、typical 典型的。", "explanationSource": "own", "section": "詞彙"}, {"id": 10, "question": "第 10 題　Simon loves his work. To him, work always comes first, and family and friends are ______.", "options": ["secondary", "temporary", "sociable", "capable"], "answer": 0, "answerLabel": "A", "source": "97 學測｜詞彙｜第 10 題", "explanation": "工作永遠第一，家人朋友就是「次要的」：secondary。temporary 暫時的、sociable 善於社交的、capable 有能力的。", "explanationSource": "own", "section": "詞彙"}, {"id": 11, "question": "第 11 題　Although your plans look good, you have to be ______ and consider what you can actually do.", "options": ["dramatic", "realistic", "stressful", "ma
