<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>康軒B1U2 文意字彙</title><style>:root{--blue:#2563eb;--navy:#1e3a8a;--bg:#f4f7fb;--card:#fff;--line:#dbe3ee;--ink:#172033;--muted:#64748b;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}.wrap{max-width:900px;margin:auto;padding:16px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 5px 18px #0f172a0d}.hero{background:linear-gradient(135deg,#e8f1ff,#fff)}h1{margin:0 0 6px;font-size:clamp(25px,4vw,38px)}h2{margin-top:0}.note{color:var(--muted)}.hidden{display:none!important}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.btn{border:0;border-radius:10px;padding:11px 17px;font-size:16px;font-weight:800;cursor:pointer;background:#e5e7eb;font-family:inherit}.primary{background:var(--blue);color:#fff}.danger{background:#991b1b;color:#fff}.pick{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin:7px 0;background:#fafcff}.pick input{margin-right:8px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:800;margin:8px 0 14px}.zh{padding:10px 13px;background:#fff7ed;border-radius:9px;color:#9a3412;font-weight:800;margin-bottom:10px}.question{font-size:21px;font-weight:750;padding:16px;background:#f8fafc;border-radius:11px;white-space:pre-wrap}.question u{text-decoration-thickness:3px;text-underline-offset:4px;text-decoration-color:var(--blue)}.question img{display:block;max-width:240px;width:100%;height:auto;margin:10px 0 0;border:1px solid var(--line);border-radius:10px;background:#fff}.options{display:grid;gap:9px;margin:14px 0}.option{display:flex;align-items:center;gap:11px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-size:18px;font-weight:750;cursor:pointer}.option:hover{border-color:#60a5fa;background:#eff6ff}.option:has(input:checked){border-color:var(--blue);background:#dbeafe;color:var(--navy)}.option input{width:20px;height:20px;accent-color:var(--blue)}.inputs{display:grid;gap:10px;margin:15px 0}.answer-row{display:grid;grid-template-columns:55px 1fr;gap:10px;align-items:center}.answer-row label{font-weight:900;color:var(--navy);text-align:center}.spell{width:100%;font:inherit;font-size:18px;padding:11px;border:2px solid #94a3b8;border-radius:9px}.feedback{padding:13px;border-radius:10px;font-weight:800;margin:13px 0}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.explain{padding:12px 14px;border-radius:10px;background:#eff6ff;border:1px solid #bfdbfe;color:var(--navy);margin:13px 0}.explain b{margin-right:4px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}.wrong p{margin:6px 0;white-space:pre-wrap}@media(max-width:600px){.wrap{padding:9px}.hero,.card{padding:15px}.question{font-size:18px;padding:13px}.option{font-size:17px}.answer-row{grid-template-columns:42px 1fr}}</style></head>
<body><main class="wrap"><section class="hero"><h1>康軒B1U2 文意字彙</h1><p>共 30 題。可自行選題；答錯會顯示正確答案並要求重新作答。</p><p class="note">依句意與字首、字尾提示，拼出完整單字。完成後可下載 DOCX 錯題紀錄。</p></section><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn">全部選取</button><button id="none" class="btn">全部取消</button><button id="start" class="btn primary">開始作答</button></div><div id="list"></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden" role="status" aria-live="polite"></div><div id="explain" class="explain hidden"></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="download" class="btn primary">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></main>
<script>
// MODE: "input" = spell one word, "mcq" = four options, "sentence" = type a whole sentence (several accepted answers)
const TITLE = "康軒B1U2 文意字彙", MODE = "input", IMG = {}, Q = [{"id": 1, "question": "A f____x is an animal in the dog family. It has a pointed（尖的）face（臉）and ears.", "answers": ["fox"]}, {"id": 2, "question": "Ann：What’s your animal s____n?\nBen：I’m a rooster. What about you?\nAnn：I’m a rooster, too.", "answers": ["sign"]}, {"id": 3, "question": "Meg：What’s the m____e about?\nFred：It’s about a boy and his animal friends.", "answers": ["movie"]}, {"id": 4, "question": "Emma：These shoes are too small for me.\nDavid：What’s your shoe s____e?\nEmma：20.", "answers": ["size"]}, {"id": 5, "question": "Andy：Are those p____e teachers?\nKate：No, they are doctors.", "answers": ["people"]}, {"id": 6, "question": "The s____e is long. It is swallowing（吞食）an egg.", "answers": ["snake"]}, {"id": 7, "question": "That is a polar（北極的）b____r. It’s big and white.", "answers": ["bear"]}, {"id": 8, "question": "S____p are farm（農場）animals. They eat grass（草）.", "answers": ["Sheep"]}, {"id": 9, "question": "The four-year-old girl is s____t. She can（會）read, draw, and dance.", "answers": ["smart"]}, {"id": 10, "question": "E____ts are big animals. Their trunks（象鼻）are long.", "answers": ["Elephants"]}, {"id": 11, "question": "Liz：Who are those people in this p____e? They look young.\nLeo：They’re my students.", "answers": ["picture"]}, {"id": 12, "question": "Z____as run fast（快速地）. They look like（看起來像）horses.", "answers": ["Zebras"]}, {"id": 13, "question": "Oh, no! A dead（死的）m____e is in the kitchen（廚房）. No wonder it’s smelly（臭的）.", "answers": ["mouse"]}, {"id": 14, "question": "Tom：Can（會）cats catch（抓）r____ts?\nIvy：Yes, they can.", "answers": ["rats"]}, {"id": 15, "question": "My pet is a r____t. It’s small and white.", "answers": ["rabbit"]}, {"id": 16, "question": "Gina：Mom, d____ns are imaginary（虛構的）animals. Is that true?\nMom：That’s right. They’re not real（真實的）.", "answers": ["dragons"]}, {"id": 17, "question": "Cindy is beautiful and smart, but she isn’t a people p____n in her class.", "answers": ["person"]}, {"id": 18, "question": "A t____r has yellow and black stripes（條紋）on its body（身體）. It’s an animal in the cat family.", "answers": ["tiger"]}, {"id": 19, "question": "On C____e New Year’s Eve（前夕）, families get together（團聚）for a big dinner（晚餐）.", "answers": ["Chinese"]}, {"id": 20, "question": "A：Mom, look at that small h____e. It’s short and cute.\nB：Yes, it’s a pony（小馬）. It’s playing around（圍繞）its mom.", "answers": ["horse"]}, {"id": 21, "question": "Nancy：Hey! Is that a r____r?\nKenny：No, it’s a hen（母雞）. See? It’s laying eggs（下蛋）.", "answers": ["rooster"]}, {"id": 22, "question": "G____t’s milk is good for children. My son drinks it every（每一）morning.", "answers": ["Goat"]}, {"id": 23, "question": "There are a lot of（有許多的）a____ls in the zoo, and I like tigers the best（最）.", "answers": ["animals"]}, {"id": 24, "question": "Jack’s parents are good swimmers（游泳者）. No w____r he is a good swimmer, too.", "answers": ["wonder"]}, {"id": 25, "question": "Pete：Tony’s pet rabbit is dead（死的）.\nTina：No w____r he’s sad.", "answers": ["wonder"]}, {"id": 26, "question": "Ken：What about going to that new movie t____r to see Spider-Man?\nJoe：OK. Its screen（銀幕）is big.", "answers": ["theater"]}, {"id": 27, "question": "The students are drawing p____es. They like art（美術）classes.", "answers": ["pictures"]}, {"id": 28, "question": "Your music（音樂）teacher is a singer（歌手）. Is that t____e?", "answers": ["true"]}, {"id": 29, "question": "My grandparents are 76 years old, but they are still（仍然）e____c.", "answers": ["energetic"]}, {"id": 30, "question": "L____ns look scary（可怕的）. Like leopards（像是豹）, they are from the cat family.", "answers": ["Lions"]}];

const $ = s => document.querySelector(s), list = $('#list'), select = $('#select'), quiz = $('#quiz'), result = $('#result'),
  question = $('#question'), answerArea = $('#answerArea'), feedback = $('#feedback'), explain = $('#explain'), next = $('#next');
let chosen = [], idx = 0;
const wrong = new Map(), correct = new Set();
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm = s => String(s).trim().toLowerCase().replace(/[’‘`]/g, "'").replace(/\s+/g, ' ');
const plain = s => String(s).replace(/<\/?u>/g, '');

/* sentence answers: contractions count as the full form; case and punctuation are checked separately */
const CONTRACTIONS = [[/\b(is|are|was|were|do|does|did|has|have|had)n't\b/gi, '$1 not'], [/\bcan't\b/gi, 'cannot'],
  [/\b(he|she|it|that|what|who|where|how|there|here)'s\b/gi, '$1 is'], [/\bi'm\b/gi, 'I am'], [/\b(you|we|they)'re\b/gi, '$1 are']];
function expand(s) { s = String(s).replace(/[’‘`]/g, "'").replace(/\s+/g, ' ').replace(/\s+([.,?!])/g, '$1').trim(); CONTRACTIONS.forEach(([r, t]) => s = s.replace(r, t)); return s; }
const loose = s => expand(s).toLowerCase().replace(/[.,?!;:]/g, '').replace(/\s+/g, ' ').trim();
function judgeSentence(q, value) {
  const strict = expand(value);
  if (q.answers.some(a => expand(a) === strict)) return 'ok';
  if (q.answers.some(a => loose(a) === loose(value))) return 'form';
  return 'bad';
}

function renderList() { list.innerHTML = Q.map(q => '<label class="pick"><input class="pickbox" type="checkbox" value="' + q.id + '" checked><b>第 ' + q.id + ' 題</b></label>').join(''); }
$('#all').onclick = () => document.querySelectorAll('.pickbox').forEach(x => x.checked = true);
$('#none').onclick = () => document.querySelectorAll('.pickbox').forEach(x => x.checked = false);
$('#start').onclick = () => {
  const ids = [...document.querySelectorAll('.pickbox:checked')].map(x => +x.value);
  if (!ids.length) return alert('請至少選一題。');
  chosen = Q.filter(q => ids.includes(q.id)); idx = 0; wrong.clear(); correct.clear();
  select.classList.add('hidden'); result.classList.add('hidden'); quiz.classList.remove('hidden'); show();
};
function show() {
  const q = chosen[idx];
  $('#meta').textContent = '第 ' + (idx + 1) + ' / ' + chosen.length + ' 題';
  $('#wrongCount').textContent = '曾答錯 ' + wrong.size + ' 題';
  $('#bar').style.width = (idx + 1) / chosen.length * 100 + '%';
  // question text is escaped; only <u> (underlined part of the prompt) is let through
  question.innerHTML = esc(q.question).replace(/&lt;u&gt;/g, '<u>').replace(/&lt;\/u&gt;/g, '</u>') + (q.img ? '<img alt="題目圖片" src="' + IMG[q.img] + '">' : '');
  const zh = $('#zh'); if (q.zh) { zh.textContent = q.zh; zh.classList.remove('hidden'); } else zh.classList.add('hidden');
  feedback.className = 'feedback hidden'; explain.classList.add('hidden');
  $('#check').classList.remove('hidden'); next.classList.add('hidden');
  if (MODE === 'mcq') answerArea.innerHTML = '<div class="options">' + q.options.map((o, i) => '<label class="option"><input type="radio" name="answer" value="' + i + '"><b>' + String.fromCharCode(65 + i) + '.</b> ' + esc(o) + '</label>').join('') + '</div>';
  else answerArea.innerHTML = '<div class="inputs"><div class="answer-row"><label>答案</label><input class="spell" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="' + (MODE === 'sentence' ? '請輸入完整句子（注意大小寫與標點）' : '請輸入完整單字') + '"></div></div>';
  setTimeout(() => answerArea.querySelector('input')?.focus(), 0);
}
function correctText(q) { return MODE === 'mcq' ? String.fromCharCode(65 + q.answer) + '. ' + q.options[q.answer] : MODE === 'sentence' ? q.show : q.answers.join(' / '); }
function showExplain(q) { if (!q.exp) return; explain.innerHTML = '<b>詳解</b>' + esc(q.exp); explain.classList.remove('hidden'); }
function check() {
  const q = chosen[idx];
  let given, ok, formNote = false;
  if (MODE === 'mcq') {
    const x = answerArea.querySelector('input:checked'); if (!x) return alert('請完成所有答案。');
    given = String.fromCharCode(65 + (+x.value)); ok = +x.value === q.answer;
  } else {
    given = answerArea.querySelector('.spell').value; if (!given.trim()) return alert('請完成所有答案。');
    if (MODE === 'sentence') { const j = judgeSentence(q, given); ok = j !== 'bad'; formNote = j === 'form'; }
    else ok = q.answers.some(a => norm(a) === norm(given));
  }
  if (ok) {
    correct.add(q.id); feedback.className = 'feedback ok';
    if (formNote) feedback.innerHTML = '✅ 句子正確！但請注意<strong>大小寫與標點</strong>，標準寫法：<strong>' + esc(q.show) + '</strong>';
    else feedback.textContent = '✅ 全部正確！';
    showExplain(q);
    $('#check').classList.add('hidden'); next.classList.remove('hidden'); next.focus();
  } else {
    if (!wrong.has(q.id)) wrong.set(q.id, { q, attempts: [] });
    wrong.get(q.id).attempts.push(given);
    $('#wrongCount').textContent = '曾答錯 ' + wrong.size + ' 題';
    feedback.className = 'feedback bad';
    feedback.innerHTML = '❌ 答案不正確。正確答案：<strong>' + esc(correctText(q)) + '</strong><br>請重新作答。';
    showExplain(q);
    if (MODE === 'mcq') answerArea.querySelectorAll('input').forEach(x => x.checked = false); else answerArea.querySelector('.spell').value = '';
    answerArea.querySelector('input')?.focus();
  }
}
$('#check').onclick = check;
answerArea.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList.contains('spell')) { e.preventDefault(); check(); } });
next.onclick = () => { idx++; idx >= chosen.length ? finish() : show(); };
$('#finish').onclick = finish;
function finish() {
  quiz.classList.add('hidden'); result.classList.remove('hidden');
  $('#summary').innerHTML = '<div class="stat">選擇題數<b>' + chosen.length + '</b></div><div class="stat">完成答對<b>' + correct.size + '</b></div><div class="stat">曾答錯<b>' + wrong.size + '</b></div>';
  $('#wrongList').innerHTML = wrong.size ? [...wrong.values()].map((r, i) => '<div class="wrong"><b>' + (i + 1) + '. 第 ' + r.q.id + ' 題</b><p>' + esc(plain(r.q.question)) + '</p><p><strong>錯誤答案：</strong>' + r.attempts.map(esc).join('；') + '</p><p><strong>正確答案：</strong>' + esc(correctText(r.q)) + '</p>' + (r.q.exp ? '<p><strong>詳解：</strong>' + esc(r.q.exp) + '</p>' : '') + '</div>').join('') : '<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>';
  $('#download').classList.toggle('hidden', !wrong.size);
}
$('#restart').onclick = () => { result.classList.add('hidden'); select.classList.remove('hidden'); };
$('#download').onclick = async () => {
  if (!wrong.size) return;
  const rows = [...wrong.values()], name = TITLE + '_錯題_' + new Date().toISOString().slice(0, 10);
  const save = (blob, ext) => { const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = name + ext; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); };
  try {
    const { Document, Packer, Paragraph, TextRun, HeadingLevel } = await import('https://esm.sh/docx@9.5.1');
    const line = (label, text) => new Paragraph({ children: [new TextRun({ text: label, bold: true }), new TextRun({ text })] });
    const children = [new Paragraph({ heading: HeadingLevel.TITLE, children: [new TextRun({ text: TITLE + ' 錯題紀錄', bold: true })] })];
    rows.forEach((r, i) => {
      children.push(new Paragraph({ heading: HeadingLevel.HEADING_2, children: [new TextRun({ text: (i + 1) + '. 第 ' + r.q.id + ' 題', bold: true })] }));
      plain(r.q.question).split('\n').forEach(t => children.push(new Paragraph({ children: [new TextRun({ text: t })] })));
      if (MODE === 'mcq') children.push(new Paragraph({ children: [new TextRun({ text: r.q.options.map((o, k) => '(' + String.fromCharCode(65 + k) + ') ' + o).join('　') })] }));
      children.push(line('錯誤答案：', r.attempts.join('；')), line('正確答案：', correctText(r.q)));
      if (r.q.exp) children.push(line('詳解：', r.q.exp));
    });
    save(await Packer.toBlob(new Document({ sections: [{ children }] })), '.docx');
  } catch (e) {   // offline or CDN blocked
    const txt = rows.map((r, i) => (i + 1) + '. 第 ' + r.q.id + ' 題\n' + plain(r.q.question) + '\n錯誤答案：' + r.attempts.join('；') + '\n正確答案：' + correctText(r.q) + (r.q.exp ? '\n詳解：' + r.q.exp : '') + '\n').join('\n');
    save(new Blob([TITLE + ' 錯題紀錄\n\n' + txt], { type: 'text/plain;charset=utf-8' }), '.txt');
  }
};
renderList();
</script></body></html>
