<script>window.QUIZ_CONFIG={"title": "110 年國中會考英語｜單題＋克漏字", "mode": "mcq", "questions": [{"id": 1, "question": "第 1 題　In the picture, the boy is ______ the old man.", "options": ["smiling at", "dancing with", "cheering for", "bowing to"], "answer": 3, "answerLabel": "D", "source": "110 會考｜單題｜第 1 題", "explanation": "圖中男孩正對老人彎腰，是在「鞠躬」：bowing to。", "explanationSource": "own", "section": "單題"}, {"id": 2, "question": "第 2 題　Listen! The baby ______ in the bedroom. Why don’t you go in and take a look?", "options": ["cried", "cries", "is crying", "will cry"], "answer": 2, "answerLabel": "C", "source": "110 會考｜單題｜第 2 題", "explanation": "Listen! 表示「此刻正在」發生：嬰兒正在哭 is crying。", "explanationSource": "own", "section": "單題"}, {"id": 3, "question": "第 3 題　Jill is ______ that the city park is closed for the music festival because now she can’t jog there.", "options": ["excited", "proud", "scared", "unhappy"], "answer": 3, "answerLabel": "D", "source": "110 會考｜單題｜第 3 題", "explanation": "公園關閉讓她不能去慢跑，所以她「不高興」：unhappy。", "explanationSource": "own", "section": "單題"}, {"id": 4, "question": "第 4 題　Steven wants to be a ______, because he loves to watch people enjoy the food he prepares.", "options": ["cook", "doctor", "driver", "farmer"], "answer": 0, "answerLabel": "A", "source": "110 會考｜單題｜第 4 題", "explanation": "喜歡看人們享用他做的食物，想當「廚師」：cook。", "explanationSource": "own", "section": "單題"}, {"id": 5, "question": "第 5 題　Paul misses his parents a lot. He ______ them since he came to work in Taiwan a year ago.", "options": ["didn’t see", "doesn’t see", "hasn’t seen", "won’t see"], "answer": 2, "answerLabel": "C", "source": "110 會考｜單題｜第 5 題", "explanation": "since + 過去時間點，用現在完成式：hasn’t seen（一直沒見到）。", "explanationSource": "own", "section": "單題"}, {"id": 6, "question": "第 6 題　Our teacher Ms. Wu seldom laughs, but when she ______, everyone in the same building can hear her.", "options": ["can", "does", "has", "will"], "answer": 1, "answerLabel": "B", "source": "110 會考｜單題｜第 6 題", "explanation": "does 代替前面的一般動詞 laughs：when she does (laugh)。", "explanationSource": "own", "section": "單題"}, {"id": 7, "question": "第 7 題　My sister is coming to my home today. She ______ with me for a week.", "options": ["stays", "stayed", "has stayed", "will stay"], "answer": 3, "answerLabel": "D", "source": "110 會考｜單題｜第 7 題", "explanation": "姊姊今天來，「將會」跟我住一週：未來式 will stay。", "explanationSource": "own", "section": "單題"}, {"id": 8, "question": "第 8 題　Edward had worked as a computer engineer for ten years. This ______ helped him a lot when he started his own computer shop.", "options": ["chance", "experience", "hobby", "knowledge"], "answer": 1, "answerLabel": "B", "source": "110 會考｜單題｜第 8 題", "explanation": "當了十年電腦工程師的「經驗」幫助他開店：experience。", "explanationSource": "own", "section": "單題"}, {"id": 9, "question": "第 9 題　If you’re interested in our business plan, ______ this number and ask for Ms. Lee. She’ll answer your questions.", "options": ["calling", "call", "and call", "to call"], "answer": 1, "answerLabel": "B", "source": "110 會考｜單題｜第 9 題", "explanation": "if 子句後接祈使句：call this number（打這支電話）。", "explanationSource": "own", "section": "單題"}, {"id": 10, "question": "第 10 題　Jimmy would not get up for breakfast, ______ his dad had already tried to pull him from his bed several times.", "options": ["although", "because", "if", "until"], "answer": 0, "answerLabel": "A", "source": "110 會考｜單題｜第 10 題", "explanation": "爸爸已經拉了好幾次他還是不起床，前後語意相反：although（雖然）。", "explanationSource": "own", "section": "單題"}, {"id": 11, "question": "第 11 題　Duncan spent all his money trying to ______ the bookstore his mom left him. Sadly, the business never got better, and he had to close it in the end.", "options": ["build", "buy", "save", "start"], "answer": 2, "answerLabel": "C", "source": "110 會考｜單題｜第 11 題", "explanation": "想「挽救」媽媽留下的書店，但生意沒好轉最後還是關了：save。", "explanationSource": "own", "section": "單題"}, {"id": 12, "question": "第 12 題　Fiona loves listening to her children sing songs ______ at school.", "options": ["are le
