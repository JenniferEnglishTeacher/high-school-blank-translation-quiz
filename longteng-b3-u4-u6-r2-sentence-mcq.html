<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="龍騰普高 B3 U4–U6 + R2 例句選擇題 互動選擇題">
<title>龍騰普高 B3 U4–U6 + R2 例句選擇題</title>
<style>
:root{--blue:#2563eb;--navy:#1e3a8a;--bg:#f4f7fb;--card:#fff;--line:#dbe3ee;--ink:#172033;--muted:#64748b;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--voice:#6d28d9;--voicebg:#f5f3ff;--amber:#9a3412;--amberbg:#fff7ed;--teal:#0f766e;--tealbg:#ccfbf1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}
.wrap{max-width:920px;margin:auto;padding:16px}
.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 5px 18px #0f172a0d}
.hero{background:linear-gradient(135deg,#e8f1ff,#fff)}
h1{margin:0 0 6px;font-size:clamp(24px,4vw,36px);line-height:1.3}
h2{margin-top:0}
.note{color:var(--muted)}
.hidden{display:none!important}
.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.btn{border:0;border-radius:10px;padding:11px 17px;font:800 16px Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;cursor:pointer;background:#e5e7eb;color:var(--ink);text-decoration:none}
.btn.small{padding:7px 12px;font-size:14px}
.primary{background:var(--blue);color:#fff}.danger{background:#991b1b;color:#fff}.voice{background:var(--voice);color:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,.option:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}
#list{max-height:440px;overflow:auto;border:1px solid var(--line);padding:7px 9px;border-radius:12px;background:#fcfdff}
.grp{font-weight:900;color:#1d4ed8;margin:12px 4px 4px}
.pick{display:flex;align-items:center;gap:8px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;margin:6px 0;background:#fafcff;cursor:pointer}
.pick input{width:17px;height:17px;flex:none;accent-color:var(--blue)}
.pick .sub{color:var(--muted);font-size:14px}
.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}
.bar{height:100%;background:var(--blue);transition:width .2s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:800;margin:8px 0 14px}
.tag{display:inline-block;font-size:13px;font-weight:900;color:#5b21b6;background:var(--voicebg);border:1px solid #ddd6fe;border-radius:999px;padding:1px 10px;margin-bottom:8px}
.clue{padding:10px 13px;background:var(--amberbg);border-radius:9px;color:var(--amber);font-weight:800;margin-bottom:10px;font-size:18px}
.question{font-size:21px;font-weight:750;padding:16px;background:#f8fafc;border-radius:11px;line-height:1.9}
.blank{display:inline-block;min-width:92px;border-bottom:3px solid #94a3b8;color:var(--blue);text-align:center;margin:0 1px 0 4px}
.blank.filled{color:var(--ok);border-bottom-color:var(--ok);background:var(--okbg);border-radius:6px 6px 0 0;padding:0 5px}
.tr{margin:10px 2px 0;color:#334155;font-size:16px}
.tr b{color:var(--teal);background:var(--tealbg);border-radius:4px;padding:0 3px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:14px 0}
.option{display:flex;align-items:center;gap:10px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-size:18px;font-weight:750;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink)}
.option .key{flex:none;width:28px;height:28px;border-radius:50%;background:#e2e8f0;display:grid;place-items:center;font-size:15px}
.option:hover:not(:disabled){border-color:#60a5fa;background:#eff6ff}
.option.right{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.option.wrongpick{border-color:var(--bad);background:var(--badbg);color:var(--bad);text-decoration:line-through}
.option:disabled{cursor:default}
.feedback{padding:13px;border-radius:10px;font-weight:800;margin:13px 0}
.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}
.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:var(--voicebg);margin:13px 0}
.voicebox .target{display:block;font-size:19px;font-weight:800;margin-bottom:6px}
.voicebox .info{color:#4c1d95;margin:4px 0 10px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}
.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}
.stat b{display:block;font-size:28px}
.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}.wrong p{margin:5px 0}
@media(max-width:640px){.wrap{padding:9px}.hero,.card{padding:15px}.question{font-size:18px;padding:13px}.options{grid-template-columns:1fr}.option{font-size:17px}.meta{display:block}}
</style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <h1>龍騰普高 B3 Units 4–6 + Review 2<br>例句選擇題（單字・片語・句型）</h1>
    <p>共 <b>211</b> 題，取自總表 6 欄例句：A 單字 154 題＋B 片語 42 題＋C 句型 15 題。讀英文例句和中譯，選出最適合填入空格的答案。</p>
    <p class="note">選錯會標紅，請再選一次；答對後自動播放完整英文，可按 🔊 再聽。完成後可只重做錯題，並下載錯題 DOCX。</p>
    <div class="toolbar"><a class="btn" href="dashboard.html#senior-longteng">← 回測驗總覽</a></div>
  </section>

  <section id="select" class="card">
    <h2>選擇題目</h2>
    <div class="toolbar" id="groupBtns">
      <button id="all" class="btn">全部選取</button>
      <button id="none" class="btn">全部取消</button>
      <button id="rand20" class="btn">隨機 20 題</button>
    </div>
    <label class="pick" style="display:inline-flex"><input id="shuffle" type="checkbox" checked> 打亂出題順序</label>
    <div id="list"></div>
    <div class="actions"><button id="start" class="btn primary">開始作答</button><span id="picked" class="note"></span></div>
  </section>

  <section id="quiz" class="card hidden">
    <div class="progress"><div id="bar" class="bar"></div></div>
    <div class="meta"><span id="meta"></span><span id="wrongCount"></span></div>
    <span id="tag" class="tag"></span>
    <div id="clue" class="clue hidden"></div>
    <div id="question" class="question"></div>
    <p id="tr" class="tr hidden"></p>
    <div id="options" class="options"></div>
    <div id="feedback" class="feedback hidden"></div>
    <div id="voiceBox" class="voicebox hidden">
      <span id="target" class="target"></span>
      <div id="info" class="info"></div>
      <button id="speak" class="btn voice small">🔊 再聽一次</button>
    </div>
    <div class="actions">
      <button id="next" class="btn primary hidden">下一題 →</button>
      <button id="finish" class="btn danger">結束作答</button>
    </div>
  </section>

  <section id="result" class="card hidden">
    <h2>作答結果</h2>
    <div id="summary" class="summary"></div>
    <div id="wrongList"></div>
    <div class="actions">
      <button id="retryWrong" class="btn primary">再做一次錯題</button>
      <button id="download" class="btn">下載錯題 DOCX</button>
      <button id="restart" class="btn">重新選題</button>
    </div>
  </section>
</main>
<script>
const TITLE = "龍騰普高 B3 U4–U6 + R2 例句選擇題", MODE = "sentence", GROUPS = [{"key": "A", "label": "A 單字"}, {"key": "B", "label": "B 片語"}, {"key": "C", "label": "C 句型"}], FILE = "龍騰B3_U4-U6_R2_例句選擇題";
const Q = [{"id":1,"sec":"A","head":"accompany","pos":"v.","zh":"陪伴；伴隨","stem":"My mother ________ my little sister to the dentist because she was too scared to go alone. The heavy rain was ________ by strong winds.","tr":"媽媽<b>陪<\/b>妹妹去看牙醫，因為她太害怕不敢自己去。這場大雨<b>伴隨著<\/b>強風。","opts":["supply","reproduce","contact","accompany"],"ans":"accompany","full":"My mother accompanied my little sister to the dentist because she was too scared to go alone. The heavy rain was accompanied by strong winds."},{"id":2,"sec":"A","head":"company","pos":"n.","zh":"陪伴；作伴","stem":"Grandpa lives alone in the countryside, so we visit him every weekend to keep him ________ and cook dinner together.","tr":"爺爺獨自住在鄉下，所以我們每個週末都去看他、<b>陪伴<\/b>他，一起煮晚餐。","opts":["distinction","confrontation","reception","company"],"ans":"company","full":"Grandpa lives alone in the countryside, so we visit him every weekend to keep him company and cook dinner together."},{"id":3,"sec":"A","head":"adapt","pos":"v.","zh":"適應；改編","stem":"It took the new student a few weeks to ________ to the weather and the food in Taipei. The popular novel was ________ed for a TV drama last year.","tr":"這位新同學花了幾週才<b>適應<\/b>臺北的天氣和食物。這本暢銷小說去年被<b>改編<\/b>成電視劇。","opts":["participate","contribute","anticipate","adapt"],"ans":"adapt","full":"It took the new student a few weeks to adapt to the weather and the food in Taipei. The popular novel was adapted for a TV drama last year."},{"id":4,"sec":"A","head":"adaptation","pos":"n.","zh":"適應；改編（作品）","stem":"The movie is an ________ of a famous Japanese comic, but the story has a different ending from the original one.","tr":"這部電影是一部知名日本漫畫的<b>改編作品<\/b>，但故事的結局和原作不同。","opts":["opposition","appearance","outsider","adaptation"],"ans":"adaptation","full":"The movie is an adaptation of a famous Japanese comic, but the story has a different ending from the original one."},{"id":5,"sec":"A","head":"annual","pos":"adj.","zh":"每年的；一年一度的","stem":"Our school holds an ________ sports day every November, and every class practices for weeks before it.","tr":"我們學校每年十一月舉辦<b>一年一度的<\/b>運動會，每一班都會在之前練習好幾週。","opts":["intimate","inevitable","elegant","annual"],"ans":"annual","full":"Our school holds an annual sports day every November, and every class practices for weeks before it."},{"id":6,"sec":"A","head":"annually","pos":"adv.","zh":"每年地；一年一次地","stem":"The music festival takes place ________ in Kenting, and thousands of young people go there every spring.","tr":"這個音樂節<b>每年<\/b>在墾丁舉行，每年春天都有數千名年輕人前往。","opts":["previously","deliberately","skillfully","annually"],"ans":"annually","full":"The music festival takes place annually in Kenting, and thousands of young people go there every spring."},{"id":7,"sec":"A","head":"anticipate","pos":"v.","zh":"預期；期待","stem":"The weather report ________s heavy traffic on the highway during the Lunar New Year holiday, so we will leave early.","tr":"氣象報告<b>預期<\/b>農曆新年假期間高速公路會大塞車，所以我們會提早出發。","opts":["gaze","navigate","reproduce","anticipate"],"ans":"anticipate","full":"The weather report anticipates heavy traffic on the highway during the Lunar New Year holiday, so we will leave early."},{"id":8,"sec":"A","head":"anticipation","pos":"n.","zh":"期待；預期","stem":"The children waited in excited ________ for Santa Claus to arrive at the Christmas party. Many people bought bottled water in ________ of the coming typhoon.","tr":"孩子們滿懷興奮地<b>期待<\/b>聖誕老人來到聖誕派對。許多人<b>預期<\/b>颱風要來，買了瓶裝水。","opts":["participant","blossom","capital","anticipation"],"ans":"anticipation","full":"The children waited in excited anticipation for Santa Claus to arrive at the Christmas party. Many people bought bottled water in anticipation of the coming typhoon."},{"id":9,"sec":"A","head":"appear","pos":"v.","zh":"出現；似乎","stem":"A rainbow suddenly ________ed in the sky after the heavy rain, and everyone took out their phones to take pictures.","tr":"大雨過後天空突然<b>出現<\/b>一道彩虹，大家都拿出手機拍照。","opts":["feast","arrive","rely","appear"],"ans":"appear","full":"A rainbow suddenly appeared in the sky after the heavy rain, and everyone took out their phones to take pictures."},{"id":10,"sec":"A","head":"appearance","pos":"n.","zh":"外表；出現","stem":"Don't judge people by their ________; a person who looks cold may be very kind. The famous singer made a short ________ at the opening of the new mall.","tr":"不要以<b>外表<\/b>評斷人；一個看起來冷淡的人可能非常親切。那位知名歌手在新商場開幕時短暫<b>露面<\/b>。","opts":["historian","escape","supply","appearance"],"ans":"appearance","full":"Don't judge people by their appearance; a person who looks cold may be very kind. The famous singer made a short appearance at the opening of the new mall."},{"id":11,"sec":"A","head":"arrive","pos":"v.","zh":"到達；抵達","stem":"Our train ________d in Kaohsiung ten minutes late because of the heavy rain in the south.","tr":"由於南部下大雨，我們的火車晚了十分鐘<b>抵達<\/b>高雄。","opts":["thrive","bruise","twinkle","arrive"],"ans":"arrive","full":"Our train arrived in Kaohsiung ten minutes late because of the heavy rain in the south."},{"id":12,"sec":"A","head":"arrival","pos":"n.","zh":"到達；抵達","stem":"Please call me as soon as you land; I want to know about your safe ________ in Tokyo.","tr":"你一降落就請打電話給我，我想知道你平安<b>抵達<\/b>東京。","opts":["participant","resemblance","reduction","arrival"],"ans":"arrival","full":"Please call me as soon as you land; I want to know about your safe arrival in Tokyo."},{"id":13,"sec":"A","head":"artificial","pos":"adj.","zh":"人造的；人工的","stem":"When there are not enough bees, some farmers have to use ________ ways to pollinate their fruit trees by hand.","tr":"當蜜蜂不夠時，有些農夫必須用<b>人工<\/b>方式以手為果樹授粉。","opts":["stunning","opposed","previous","artificial"],"ans":"artificial","full":"When there are not enough bees, some farmers have to use artificial ways to pollinate their fruit trees by hand."},{"id":14,"sec":"A","head":"await","pos":"v.","zh":"等待；等候","stem":"Hundreds of fans stood outside the airport, ________ing the arrival of their favorite K-pop group.","tr":"數百名粉絲站在機場外，<b>等待<\/b>他們最喜愛的韓團抵達。","opts":["pity","appear","shrink","await"],"ans":"await","full":"Hundreds of fans stood outside the airport, awaiting the arrival of their favorite K-pop group."},{"id":15,"sec":"A","head":"awe","pos":"n.","zh":"敬畏；驚嘆","stem":"We stood in ________ at the top of Yushan, looking at the sea of clouds below us.","tr":"我們站在玉山頂上，<b>驚嘆地<\/b>望著腳下的雲海。","opts":["landscape","skill","participant","awe"],"ans":"awe","full":"We stood in awe at the top of Yushan, looking at the sea of clouds below us."},{"id":16,"sec":"A","head":"awesome","pos":"adj.","zh":"令人驚嘆的；很棒的","stem":"The fireworks show over Taipei 101 on New Year's Eve was ________, and the crowd cheered loudly.","tr":"跨年夜臺北101上空的煙火秀<b>令人驚嘆<\/b>，群眾大聲歡呼。","opts":["opposed","historical","inevitable","awesome"],"ans":"awesome","full":"The fireworks show over Taipei 101 on New Year's Eve was awesome, and the crowd cheered loudly."},{"id":17,"sec":"A","head":"balance","pos":"n.","zh":"平衡","stem":"If bees disappear, the ________ of nature will be broken, and many plants will not be able to produce fruit.","tr":"如果蜜蜂消失，自然的<b>平衡<\/b>將會被破壞，許多植物將無法結果。","opts":["occasion","cycle","capital","balance"],"ans":"balance","full":"If bees disappear, the balance of nature will be broken, and many plants will not be able to produce fruit."},{"id":18,"sec":"A","head":"blossom","pos":"n.","zh":"（樹上的）花","stem":"Every spring, people travel to Alishan to see the cherry ________s, which are pink and white.","tr":"每年春天，人們前往阿里山欣賞粉白相間的櫻<b>花<\/b>。","opts":["participation","recognition","transformation","blossom"],"ans":"blossom","full":"Every spring, people travel to Alishan to see the cherry blossoms, which are pink and white."},{"id":19,"sec":"A","head":"blossom","pos":"v.","zh":"開花；成長茁壯","stem":"The plum trees ________ in the cold winter, so they are a symbol of strength in Chinese culture.","tr":"梅樹在寒冬中<b>開花<\/b>，因此在中華文化中象徵堅毅。","opts":["deserve","feast","accompany","blossom"],"ans":"blossom","full":"The plum trees blossom in the cold winter, so they are a symbol of strength in Chinese culture."},{"id":20,"sec":"A","head":"boast","pos":"v.","zh":"自誇；吹噓","stem":"Mark always ________s about his test scores, so his classmates don't like to talk to him.","tr":"Mark總是<b>吹噓<\/b>自己的考試分數，所以同學們不喜歡跟他說話。","opts":["prefer","reduce","twinkle","boast"],"ans":"boast","full":"Mark always boasts about his test scores, so his classmates don't like to talk to him."},{"id":21,"sec":"A","head":"boast","pos":"v.","zh":"擁有（值得自豪的事物）","stem":"Hualien ________s beautiful mountains and the clear blue sea, so it attracts many tourists every year.","tr":"花蓮<b>擁有<\/b>美麗的山脈和清澈湛藍的大海，因此每年吸引許多遊客。","opts":["reunite","stun","mock","boast"],"ans":"boast","full":"Hualien boasts beautiful mountains and the clear blue sea, so it attracts many tourists every year."},{"id":22,"sec":"A","head":"breathtaking","pos":"adj.","zh":"令人屏息的；壯觀的","stem":"The view from the top of the mountain was so ________ that we all stopped talking and just looked.","tr":"山頂的景色<b>壯觀到令人屏息<\/b>，我們都停止說話，只是靜靜看著。","opts":["stunned","essential","evident","breathtaking"],"ans":"breathtaking","full":"The view from the top of the mountain was so breathtaking that we all stopped talking and just looked."},{"id":23,"sec":"A","head":"bruise","pos":"n.","zh":"瘀青；瘀傷","stem":"After falling off his bike, Tom had a big purple ________ on his knee for a week.","tr":"從腳踏車上摔下來後，Tom膝蓋上有一大塊紫色<b>瘀青<\/b>，持續了一週。","opts":["superiority","smoothness","dilemma","bruise"],"ans":"bruise","full":"After falling off his bike, Tom had a big purple bruise on his knee for a week."},{"id":24,"sec":"A","head":"bruise","pos":"v.","zh":"使瘀青；碰傷","stem":"Be careful with the peaches; they ________ easily if you drop them into the bag.","tr":"小心那些桃子；如果你把它們丟進袋子裡，很容易就會<b>碰傷<\/b>。","opts":["pollinate","anticipate","cling","bruise"],"ans":"bruise","full":"Be careful with the peaches; they bruise easily if you drop them into the bag."},{"id":25,"sec":"A","head":"bruised","pos":"adj.","zh":"瘀青的；碰傷的","stem":"The soccer player kept playing with a ________ leg until the end of the game.","tr":"那位足球員帶著<b>瘀青的<\/b>腿一直踢到比賽結束。","opts":["joyous","stunning","distinct","bruised"],"ans":"bruised","full":"The soccer player kept playing with a bruised leg until the end of the game."},{"id":26,"sec":"A","head":"capital","pos":"n.","zh":"首都","stem":"Seoul is the ________ of South Korea, and it is also the biggest city in the country.","tr":"首爾是南韓的<b>首都<\/b>，也是該國最大的城市。","opts":["reunion","historian","path","capital"],"ans":"capital","full":"Seoul is the capital of South Korea, and it is also the biggest city in the country."},{"id":27,"sec":"A","head":"cling – clung – clung","pos":"v.","zh":"緊抓；堅持（信念）","stem":"The frightened child ________ to his mother's arm during the thunderstorm. Even after failing twice, Amy still ________ to her dream of becoming a doctor.","tr":"雷雨時，受驚的孩子<b>緊抓<\/b>著媽媽的手臂。即使失敗兩次，Amy仍<b>堅持<\/b>成為醫生的夢想。","opts":["contact","twinkle","flee","cling"],"ans":"cling","full":"The frightened child clung to his mother's arm during the thunderstorm. Even after failing twice, Amy still clings to her dream of becoming a doctor."},{"id":28,"sec":"A","head":"colony","pos":"n.","zh":"（動物的）群落；殖民地","stem":"A bee ________ can have more than 50,000 bees, and each bee has its own job. Scientists are still studying the causes of ________ collapse disorder.","tr":"一個蜂<b>群<\/b>可能有超過五萬隻蜜蜂，每隻蜜蜂都有自己的工作。科學家仍在研究<b>蜂群崩壞症候群<\/b>的成因。","opts":["landmark","participation","reduction","colony"],"ans":"colony","full":"A bee colony can have more than 50,000 bees, and each bee has its own job. Scientists are still studying the causes of colony collapse disorder."},{"id":29,"sec":"A","head":"concept","pos":"n.","zh":"概念；觀念","stem":"Young children don't have a clear ________ of money, so they may spend all their red envelope money in one day.","tr":"年幼的孩子對錢沒有清楚的<b>概念<\/b>，所以可能一天就花光所有紅包錢。","opts":["elegance","skill","opposition","concept"],"ans":"concept","full":"Young children don't have a clear concept of money, so they may spend all their red envelope money in one day."},{"id":30,"sec":"A","head":"confront","pos":"v.","zh":"面對；正視；與…對質","stem":"Instead of running away, you should ________ your problems and try to solve them. Many young people are ________ed with high housing prices.","tr":"與其逃避，你應該<b>正視<\/b>你的問題並試著解決。許多年輕人<b>面臨<\/b>高房價。","opts":["decorate","tumble","adapt","confront"],"ans":"confront","full":"Instead of running away, you should confront your problems and try to solve them. Many young people are confronted with high housing prices."},{"id":31,"sec":"A","head":"confrontation","pos":"n.","zh":"對峙；衝突","stem":"The teacher stepped in quickly to stop a ________ between the two boys in the hallway.","tr":"老師迅速介入，阻止走廊上兩個男孩之間的<b>衝突<\/b>。","opts":["literature","delicacy","bruise","confrontation"],"ans":"confrontation","full":"The teacher stepped in quickly to stop a confrontation between the two boys in the hallway."},{"id":32,"sec":"A","head":"contact","pos":"n.","zh":"接觸；聯絡","stem":"Wash your hands often, because germs spread when people come into ________ with each other.","tr":"要常洗手，因為人們互相<b>接觸<\/b>時細菌會傳播。","opts":["sorrow","reunion","landmark","contact"],"ans":"contact","full":"Wash your hands often, because germs spread when people come into contact with each other."},{"id":33,"sec":"A","head":"contact","pos":"v.","zh":"聯絡","stem":"If you have any questions about the summer camp, please ________ Ms. Wang by email.","tr":"如果你對夏令營有任何問題，請用電子郵件<b>聯絡<\/b>王老師。","opts":["arrive","envision","blossom","contact"],"ans":"contact","full":"If you have any questions about the summer camp, please contact Ms. Wang by email."},{"id":34,"sec":"A","head":"contribute","pos":"v.","zh":"貢獻；促成；捐助","stem":"Using too many pesticides may ________ to the loss of bees around the world. Everyone in our class ________d some money to help the flood victims.","tr":"使用太多殺蟲劑可能<b>導致<\/b>全球蜜蜂減少。我們班每個人都<b>捐<\/b>了一些錢幫助水災災民。","opts":["appear","navigate","adapt","contribute"],"ans":"contribute","full":"Using too many pesticides may contribute to the loss ______ products, and they are rich in calcium.","tr":"起司、優格和奶油都是<b>乳製<\/b>品，而且富含鈣質。","opts":["evident","navigation","resource","dairy"],"ans":"dairy","full":"Cheese, yogurt and butter are dairy products, and they are rich in calcium."},{"id":41,"sec":"A","head":"dawn","pos":"n.","zh":"黎明；破曉","stem":"We got up at ________ to watch the sunrise at Alishan. The farmers work from ________ to dusk during the harvest season.","tr":"我們在<b>黎明時<\/b>起床去看阿里山日出。收成季節時農夫們<b>從早到晚<\/b>工作。","opts":["delicacy","pity","reception","dawn"],"ans":"dawn","full":"We got up at dawn to watch the sunrise at Alishan. The farmers work from dawn to dusk during the harvest season."},{"id":42,"sec":"A","head":"decorate","pos":"v.","zh":"裝飾","stem":"The students ________d the classroom with balloons and paper flowers for their teacher's birthday.","tr":"學生們用氣球和紙花<b>裝飾<\/b>教室，為老師慶生。","opts":["thrive","supply","anticipate","decorate"],"ans":"decorate","full":"The students decorated the classroom with balloons and paper flowers for their teacher's birthday."},{"id":43,"sec":"A","head":"decoration","pos":"n.","zh":"裝飾（品）","stem":"We put up red ________s on the front door to welcome the Lunar New Year.","tr":"我們在大門上貼上紅色<b>裝飾<\/b>來迎接農曆新年。","opts":["confrontation","resemblance","company","decoration"],"ans":"decoration","full":"We put up red decorations on the front door to welcome the Lunar New Year."},{"id":44,"sec":"A","head":"deliberate","pos":"adj.","zh":"故意的；從容不迫的","stem":"It was not an accident; it was a ________ attempt to break the window.","tr":"這不是意外，而是一次<b>故意的<\/b>破窗企圖。","opts":["mournful","harsh","distinctive","deliberate"],"ans":"deliberate","full":"It was not an accident; it was a deliberate attempt to break the window."},{"id":45,"sec":"A","head":"deliberately","pos":"adv.","zh":"故意地","stem":"Kevin ________ left his homework at home because he didn't want the teacher to see his mistakes.","tr":"Kevin<b>故意<\/b>把作業留在家，因為他不想讓老師看到他的錯誤。","opts":["intimately","inevitably","skillfully","deliberately"],"ans":"deliberately","full":"Kevin deliberately left his homework at home because he didn't want the teacher to see his mistakes."},{"id":46,"sec":"A","head":"delicate","pos":"adj.","zh":"易碎的；嬌弱的；細緻的","stem":"These glass cups are very ________, so please wash them gently by hand.","tr":"這些玻璃杯非常<b>易碎<\/b>，所以請用手輕輕清洗。","opts":["peculiar","skillful","reliable","delicate"],"ans":"delicate","full":"These glass cups are very delicate, so please wash them gently by hand."},{"id":47,"sec":"A","head":"delicacy","pos":"n.","zh":"美味佳餚；精緻食物","stem":"Stinky tofu is a local ________ in Taiwan, but some foreign visitors are afraid of its smell.","tr":"臭豆腐是臺灣的在地<b>美食<\/b>，但有些外國遊客害怕它的味道。","opts":["resource","outsider","concept","delicacy"],"ans":"delicacy","full":"Stinky tofu is a local delicacy in Taiwan, but some foreign visitors are afraid of its smell."},{"id":48,"sec":"A","head":"deserve","pos":"v.","zh":"應得；值得","stem":"After studying hard for a whole year, Lucy ________s a long vacation. Farmers ________ to get a fair price for their work.","tr":"認真讀了一整年書後，Lucy<b>應得<\/b>一個長假。農夫的辛勞<b>值得<\/b>得到合理的價格。","opts":["escape","adapt","credit","deserve"],"ans":"deserve","full":"After studying hard for a whole year, Lucy deserves a long vacation. Farmers deserve to get a fair price for their work."},{"id":49,"sec":"A","head":"destination","pos":"n.","zh":"目的地","stem":"Jiufen has become a popular tourist ________ because of its old streets and beautiful night view.","tr":"九份因為老街和美麗夜景，已經成為熱門的觀光<b>勝地<\/b>。","opts":["mystery","bruise","concept","destination"],"ans":"destination","full":"Jiufen has become a popular tourist destination because of its old streets and beautiful night view."},{"id":50,"sec":"A","head":"dilemma","pos":"n.","zh":"兩難；困境","stem":"Jack was in a ________: he could either go to his best friend's party or stay home and study for the exam.","tr":"Jack<b>陷入兩難<\/b>：他可以去參加好友的派對，或是待在家準備考試。","opts":["distinction","dawn","navigation","dilemma"],"ans":"dilemma","full":"Jack was in a dilemma: he could either go to his best friend's party or stay home and study for the exam."},{"id":51,"sec":"A","head":"distinct","pos":"adj.","zh":"截然不同的；明顯的","stem":"Taiwanese Mandarin is ________ from the Mandarin spoken in Beijing in some words and sounds.","tr":"臺灣華語在某些用字和發音上與北京話<b>截然不同<\/b>。","opts":["superior","elegant","previous","distinct"],"ans":"distinct","full":"Taiwanese Mandarin is distinct from the Mandarin spoken in Beijing in some words and sounds."},{"id":52,"sec":"A","head":"distinction","pos":"n.","zh":"區別；差別","stem":"Young children can't always make a ________ between what is real and what is not on the Internet.","tr":"年幼的孩子不一定能<b>區分<\/b>網路上的真假內容。","opts":["navigation","reunion","dawn","distinction"],"ans":"distinction","full":"Young children can't always make a distinction between what is real and what is not on the Internet."},{"id":53,"sec":"A","head":"distinctive","pos":"adj.","zh":"有特色的；與眾不同的","stem":"The temple is famous for its ________ red roof, which you can see from far away.","tr":"這座廟以<b>獨特的<\/b>紅色屋頂聞名，從遠處就能看見。","opts":["skillful","leisurely","annual","distinctive"],"ans":"distinctive","full":"The temple is famous for its distinctive red roof, which you can see from far away."},{"id":54,"sec":"A","head":"elegant","pos":"adj.","zh":"優雅的；高雅的","stem":"The bride looked very ________ in her long white dress as she walked slowly down the aisle.","tr":"新娘穿著白色長禮服，緩緩走過紅毯，看起來非常<b>優雅<\/b>。","opts":["superior","inevitable","mournful","elegant"],"ans":"elegant","full":"The bride looked very elegant in her long white dress as she walked slowly down the aisle."},{"id":55,"sec":"A","head":"elegance","pos":"n.","zh":"優雅；高雅","stem":"The old hotel is famous for the ________ of its design, with crystal lights and marble floors.","tr":"這間老飯店以設計的<b>高雅<\/b>聞名，有水晶燈和大理石地板。","opts":["navigation","occasion","capital","elegance"],"ans":"elegance","full":"The old hotel is famous for the elegance of its design, with crystal lights and marble floors."},{ he people in the building fled down the stairs to safety."},{"id":67,"sec":"A","head":"gaze","pos":"v.","zh":"凝視；注視","stem":"The little girl ________d at the stars in the night sky, wondering how far away they were.","tr":"小女孩<b>凝視著<\/b>夜空中的星星，想知道它們有多遠。","opts":["blossom","contribute","shrink","gaze"],"ans":"gaze","full":"The little girl gazed at the stars in the night sky, wondering how far away they were."},{"id":68,"sec":"A","head":"gaze","pos":"n.","zh":"凝視；注視","stem":"The singer met the fans' ________ with a warm smile and waved to them.","tr":"歌手以溫暖的微笑迎接粉絲們的<b>注視<\/b>，並向他們揮手。","opts":["evidence","smoothness","pity","gaze"],"ans":"gaze","full":"The singer met the fans' gaze with a warm smile and waved to them."},{"id":69,"sec":"A","head":"harsh","pos":"adj.","zh":"嚴酷的；嚴厲的","stem":"Only a few kinds of plants can live in the ________ weather of the desert. The coach's ________ words made the young player cry.","tr":"只有少數幾種植物能在沙漠<b>嚴酷的<\/b>氣候中生存。教練<b>嚴厲的<\/b>話讓年輕球員哭了。","opts":["deliberate","breathtaking","precious","harsh"],"ans":"harsh","full":"Only a few kinds of plants can live in the harsh weather of the desert. The coach's harsh words made the young player cry."},{"id":70,"sec":"A","head":"historic","pos":"adj.","zh":"有歷史意義的；歷史上著名的","stem":"Tainan has many ________ temples and old streets, so it is a great place to learn about Taiwan's past.","tr":"臺南有許多<b>歷史悠久的<\/b>廟宇和老街，是認識臺灣過去的好地方。","opts":["smooth","annual","opposed","historic"],"ans":"historic","full":"Tainan has many historic temples and old streets, so it is a great place to learn about Taiwan's past."},{"id":71,"sec":"A","head":"historical","pos":"adj.","zh":"歷史的；與歷史有關的","stem":"I enjoy watching ________ dramas because they help me learn what life was like hundreds of years ago.","tr":"我喜歡看<b>歷史<\/b>劇，因為它們幫助我了解幾百年前的生活樣貌。","opts":["stunning","elegant","sorrowful","historical"],"ans":"historical","full":"I enjoy watching historical dramas because they help me learn what life was like hundreds of years a  ugly frog."},{"id":196,"sec":"B","head":"worst of all","pos":"phr.","zh":"最糟的是","stem":"I got stuck in traffic and my phone died; ________ ________ ________, I missed my job interview.","tr":"我被困在車陣中，手機又沒電；<b>最糟的是<\/b>，我錯過了工作面試。","opts":["die out","fall in love with","prefer A to B","worst of all"],"ans":"worst of all","full":"I got stuck in traffic and my phone died; worst of all, I missed my job interview."},{"id":197,"sec":"C","head":"S + be + thought / said / believed + to VR…","pos":"句型","zh":"據認為／據說／據信…（同時）","stem":"This old temple ________ ________ ________ ________ the oldest building in our town.","tr":"這座老廟<b>據說是<\/b>我們鎮上最古老的建築。","opts":["is / said / to / being","says / that / to / be","is / saying / to / be","is / said / to / be"],"ans":"is / said / to / be","full":"This old temple is said to be the oldest building in our town."},{"id":198,"sec":"C","head":"S + be + thought / said / believed + to have + p.p.…","pos":"句型","zh":"據認為／據說／據信…（先發生）","stem":"The famous writer ________ ________ ________ ________ ________ as a flight attendant in her twenties.","tr":"這位知名作家<b>據說曾經<\/b>在二十多歲時<b>當過<\/b>空服員。","opts":["is / said / to / has / worked","is / said / to / be / worked","was / said / to / have / work","is / said / to / have / worked"],"ans":"is / said / to / have / worked","full":"The famous writer is said to have worked as a flight attendant in her twenties."},{"id":199,"sec":"C","head":"S + would rather + VR + than + VR…","pos":"句型","zh":"寧願…也不願…","stem":"Many students ________ ________ ________ in the library ________ ________ at home, because there are fewer distractions there.","tr":"許多學生<b>寧願<\/b>在圖書館讀書，<b>也不願<\/b>待在家，因為那裡比較少讓人分心的事物。","opts":["would / rather / studying / than / staying","would / rather / to study / than / to stay","had / better / study / than / stay","would / rather / study / than / stay"],"ans":"would / rather / study / than / stay","full":"Many students would rather study in the library than stay at home, because there are fewer distractions there."},{"id":200,"sec":"C","head":"S + would + VR + rather than + VR…","pos":"句型","zh":"寧願…而不願…","stem":"I ________ ________ home ________ ________ go camping in such terrible weather.","tr":"天氣這麼糟，我<b>寧願<\/b>待在家<b>而不願<\/b>去露營。","opts":["would / staying / rather / than","would / stay / better / than","will / stay / rather / then","would / stay / rather / than"],"ans":"would / stay / rather / than","full":"I would stay home rather than go camping in such terrible weather."},{"id":201,"sec":"C","head":"S + be seen / heard + V-ing…","pos":"句型","zh":"被看到／聽到正在…","stem":"Ellen ________ often ________ ________ the stray dogs near the school gate after class.","tr":"Ellen常<b>被看到<\/b>放學後在校門附近<b>餵<\/b>流浪狗。","opts":["is / seen / feed","is / saw / feeding","sees / to / feed","is / seen / feeding"],"ans":"is / seen / feeding","full":"Ellen is often seen feeding the stray dogs near the school gate after class."},{"id":202,"sec":"C","head":"S + be seen / heard + to VR…","pos":"句型","zh":"被看到／聽到（做了）…","stem":"The thief ________ ________ ________ ________ through the back window by a neighbor.","tr":"那名小偷<b>被<\/b>鄰居<b>看到從<\/b>後窗<b>進入<\/b>。","opts":["was / seen / to / entering","was / seen / for / enter","saw / him / to / enter","was / seen / to / enter"],"ans":"was / seen / to / enter","full":"The thief was seen to enter through the back window by a neighbor."},{"id":203,"sec":"C","head":"S + never / not + V… + without + V-ing / N","pos":"句型","zh":"每次…就一定…；沒有…就不…","stem":"Diane ________ goes to the department store ________ ________ some new clothes.","tr":"Diane每次去百貨公司<b>一定<\/b>會<b>買<\/b>些新衣服。","opts":["never / without / buy","always / without / buying","never / with / buying","never / without / buying"],"ans":"never / without / buying","full":"Diane never goes to the department store without buying some new clothes."},{"id":204,"sec":"C","head":"No + N + is complete without + N / V-ing","pos":"句型","zh":"沒有…就不算完整","stem":"________ trip to Tainan ________ ________ ________ trying its famous beef soup.","tr":"到臺南旅行<b>沒有<\/b>嚐嚐它有名的牛肉湯<b>就不算完整<\/b>。","opts":["No / is / complete / with","Any / is / complete / without","No / is / completed / without","No / is / complete / without"],"ans":"No / is / complete / without","full":"No trip to Tainan is complete without trying its famous beef soup."},{"id":205,"sec":"C","head":"It is / was not until + 時間／子句 + that + S + V…","pos":"句型","zh":"直到…才…","stem":"________ ________ ________ ________ Julian won the award ________ people began to notice his talent for acting.","tr":"<b>直到<\/b>Julian得獎，人們<b>才<\/b>開始注意到他的演戲天分。","opts":["It / was / not / until / when","It / was / not / before / that","There / was / not / until / that","It / was / not / until / that"],"ans":"It / was / not / until / that","full":"It was not until Julian won the award that people began to notice his talent for acting."},{"id":206,"sec":"C","head":"either A or B","pos":"句型","zh":"不是A就是B；A或B","stem":"________ you ________ Judy ________ going to wash the dishes tonight.","tr":"今晚<b>不是<\/b>你<b>就是<\/b>Judy要洗碗。","opts":["Either / or / are","Neither / or / is","Either / nor / is","Either / or / is"],"ans":"Either / or / is","full":"Either you or Judy is going to wash the dishes tonight."},{"id":207,"sec":"C","head":"neither A nor B","pos":"句型","zh":"既不…也不…","stem":"________ my dad ________ my mom ________ going to pick me up today, so I will take the bus.","tr":"今天我爸爸<b>和<\/b>我媽媽<b>都不<\/b>會來接我，所以我會搭公車。","opts":["Neither / nor / are","Neither / or / is","Either / nor / is","Neither / nor / is"],"ans":"Neither / nor / is","full":"Neither my dad nor my mom is going to pick me up today, so I will take the bus."},{"id":208,"sec":"C","head":"The + 比較級…, the + 比較級…","pos":"句型","zh":"越…就越…","stem":"________ ________ you practice, ________ ________ you will become.","tr":"你練習得<b>越多<\/b>，就會變得<b>越<\/b>厲害。","opts":["The / most / the / best","The / much / the / good","The / more / the / best","The / more / the / better"],"ans":"The / more / the / better","full":"The more you practice, the better you will become."},{"id":209,"sec":"C","head":"The + adj. (= 一群人) + 複數V…","pos":"句型","zh":"…的人（泛指一群人）","stem":"________ ________ always ________ new knowledge, so they never stop asking questions.","tr":"<b>好奇的人<\/b>總是在追求新知，所以他們從不停止發問。","opts":["The / curious / seeks","A / curious / seek","The / curiosity / seek","The / curious / seek"],"ans":"The / curious / seek","full":"The curious always seek new knowledge, so they never stop asking questions."},{"id":210,"sec":"C","head":"There + be + N + V-ing / p.p.…","pos":"句型","zh":"有…正在…／有…被…","stem":"________ ________ several children ________ hide-and-seek in the park when we arrived.","tr":"我們到達時，公園裡<b>有<\/b>好幾個孩子<b>正在玩<\/b>捉迷藏。","opts":["There / were / played","There / was / playing","It / were / playing","There / were / playing"],"ans":"There / were / playing","full":"There were several children playing hide-and-seek in the park when we arrived."},{"id":211,"sec":"C","head":"S + V…, V-ing… (分詞構句)","pos":"句型","zh":"分詞構句（表伴隨動作）","stem":"Jason looked at his empty wallet, ________ ________ what to do next.","tr":"Jason看著他空空的錢包，<b>不知道<\/b>接下來該怎麼辦。","opts":["not / known","didn't / know","not / to know","not / knowing"],"ans":"not / knowing","full":"Jason looked at his empty wallet, not knowing what to do next."}];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const select = $('#select'), quiz = $('#quiz'), result = $('#result'), feedback = $('#feedback');
let chosen = [], idx = 0, wrong = new Map(), firstTry = new Set(), answered = new Set(), missedThis = false;

/* ---------- selection ---------- */
function renderList() {
  const list = $('#list'); list.innerHTML = '';
  GROUPS.forEach(g => {
    const qs = Q.filter(q => q.sec === g.key); if (!qs.length) return;
    const h = document.createElement('div'); h.className = 'grp'; h.textContent = g.label + '（' + qs.length + ' 題）'; list.append(h);
    qs.forEach(q => {
      const l = document.createElement('label'); l.className = 'pick';
      l.innerHTML = '<input type="checkbox" value="' + q.id + '" data-sec="' + esc(q.sec) + '" checked><span>' + q.id + '. <b>' + esc(q.head) + '</b> <span class="sub">' + esc(q.pos) + (MODE === 'coll' ? '｜' + esc(q.zh) : '') + '</span></span>';
      list.append(l);
    });
    const b = document.createElement('button'); b.className = 'btn small'; b.textContent = '只選 ' + g.label;
    b.onclick = () => document.querySelectorAll('#list input').forEach(i => i.checked = i.dataset.sec === g.key) || count();
    $('#groupBtns').append(b);
  });
  count();
}
function count() { $('#picked').textContent = '已選 ' + document.querySelectorAll('#list input:checked').length + ' / ' + Q.length + ' 題'; }
$('#list').addEventListener('change', count);
$('#all').onclick = () => { document.querySelectorAll('#list input').forEach(i => i.checked = true); count(); };
$('#none').onclick = () => { document.querySelectorAll('#list input').forEach(i => i.checked = false); count(); };
$('#rand20').onclick = () => {
  const ids = new Set(shuffle(Q.map(q => q.id)).slice(0, 20));
  document.querySelectorAll('#list input').forEach(i => i.checked = ids.has(+i.value)); count();
};
$('#start').onclick = () => {
  const ids = new Set([...document.querySelectorAll('#list input:checked')].map(i => +i.value));
  const qs = Q.filter(q => ids.has(q.id));
  if (!qs.length) { $('#picked').textContent = '請至少選一題。'; return; }
  begin(qs);
};
function begin(qs) {
  chosen = $('#shuffle').checked ? shuffle(qs) : qs.slice();
  idx = 0; wrong = new Map(); firstTry = new Set(); answered = new Set();
  select.classList.add('hidden'); result.classList.add('hidden'); quiz.classList.remove('hidden');
  show();
}

/* ---------- question ---------- */
function stemHTML(q, fillWith) {
  let n = 0;
  return esc(q.stem).replace(/_{8}([A-Za-z]*)/g, (m, suf) => {
    const k = n++;
    if (fillWith) return '<span class="blank filled">' + esc(fillWith[k] ?? '') + '</span>';
    return '<span class="blank">&nbsp;</span>' + suf;
  });
}
function show() {
  if (window.speechSynthesis) speechSynthesis.cancel();
  const q = chosen[idx]; missedThis = false;
  $('#meta').textContent = '第 ' + (idx + 1) + ' / ' + chosen.length + ' 題（題號 ' + q.id + '）';
  $('#wrongCount').textContent = '曾答錯 ' + wrong.size + ' 題';
  $('#bar').style.width = (idx / chosen.length * 100) + '%';
  $('#tag').textContent = (GROUPS.find(g => g.key === q.sec) || {}).label || q.sec;
  const clue = $('#clue');
  if (MODE === 'coll') { clue.textContent = '中文：' + q.zh; clue.classList.remove('hidden'); } else clue.classList.add('hidden');
  $('#question').innerHTML = stemHTML(q);
  const tr = $('#tr');
  if (q.tr) { tr.innerHTML = '中譯：' + q.tr.replace(/<\/?b>/g, ''); tr.classList.remove('hidden'); } else tr.classList.add('hidden');
  const box = $('#options'); box.innerHTML = '';
  shuffle(q.opts).forEach((o, i) => {
    const b = document.createElement('button'); b.className = 'option'; b.type = 'button';
    b.innerHTML = '<span class="key">' + 'ABCD'[i] + '</span><span>' + esc(o) + '</span>';
    b.dataset.v = o; b.onclick = () => choose(b); box.append(b);
  });
  feedback.className = 'feedback hidden';
  $('#voiceBox').classList.add('hidden'); $('#next').classList.add('hidden');
}
function choose(btn) {
  const q = chosen[idx];
  if (btn.dataset.v === q.ans) {
    answered.add(q.id); if (!missedThis) firstTry.add(q.id);
    document.querySelectorAll('#options .option').forEach(b => b.disabled = true);
    btn.classList.add('right');
    $('#question').innerHTML = MODE === 'coll' ? esc(q.full) : esc(q.full);
    if (q.tr) $('#tr').innerHTML = '中譯：' + q.tr;
    feedback.className = 'feedback ok'; feedback.textContent = missedThis ? '✅ 答對了！' : '✅ 一次就答對！';
    $('#target').textContent = q.full;
    $('#info').innerHTML = '<b>' + esc(q.head) + '</b> ' + esc(q.pos) + '　' + esc(q.wz || q.zh);
    $('#voiceBox').classList.remove('hidden');
    $('#bar').style.width = ((idx + 1) / chosen.length * 100) + '%';
    const n = $('#next'); n.classList.remove('hidden'); n.textContent = idx + 1 >= chosen.length ? '看結果 →' : '下一題 →';
    setTimeout(() => n.focus(), 0);
    setTimeout(speakCurrent, 250);
  } else {
    missedThis = true; btn.disabled = true; btn.classList.add('wrongpick');
    if (!wrong.has(q.id)) wrong.set(q.id, { q, picks: [] });
    wrong.get(q.id).picks.push(btn.dataset.v);
    $('#wrongCount').textContent = '曾答錯 ' + wrong.size + ' 題';
    feedback.className = 'feedback bad'; feedback.textContent = '❌ 不是「' + btn.dataset.v + '」，請再選一次。';
  }
}
function speakCurrent() {
  const q = chosen[idx];
  if (!q || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(q.full.replace(/\bsb\.?/g, 'somebody').replace(/\bsth\.?/g, 'something'));
  u.lang = 'en-US'; u.rate = 0.88;
  const vs = speechSynthesis.getVoices();
  u.voice = vs.find(v => /^en-US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
  speechSynthesis.speak(u);
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
$('#speak').onclick = speakCurrent;
$('#next').onclick = () => { idx++; idx >= chosen.length ? finishQuiz() : show(); };
$('#finish').onclick = finishQuiz;
document.addEventListener('keydown', e => {
  if (quiz.classList.contains('hidden')) return;
  const k = e.key.toUpperCase(), i = 'ABCD'.indexOf(k);
  const opts = [...document.querySelectorAll('#options .option')];
  if (i >= 0 && opts[i] && !opts[i].disabled) { e.preventDefault(); opts[i].click(); }
  else if (e.key === 'Enter' && !$('#next').classList.contains('hidden') && document.activeElement !== $('#next')) { e.preventDefault(); $('#next').click(); }
});

/* ---------- results ---------- */
function finishQuiz() {
  if (window.speechSynthesis) speechSynthesis.cancel();
  quiz.classList.add('hidden'); result.classList.remove('hidden');
  const total = answered.size;
  $('#summary').innerHTML = '<div class="stat">選擇題數<b>' + chosen.length + '</b></div><div class="stat">已作答<b>' + total +
    '</b></div><div class="stat">一次答對<b>' + firstTry.size + '</b></div><div class="stat">曾答錯<b>' + wrong.size + '</b></div>';
  $('#wrongList').innerHTML = wrong.size ? [...wrong.values()].map((r, i) =>
    '<div class="wrong"><b>' + (i + 1) + '. 第 ' + r.q.id + ' 題｜' + esc(r.q.head) + ' ' + esc(r.q.pos) + '</b>' +
    (MODE === 'coll' ? '<p>中文：' + esc(r.q.zh) + '</p>' : '') +
    '<p>選錯：' + r.picks.map(esc).join('、') + '</p><p><strong>正確答案：</strong>' + esc(r.q.ans) + '</p>' +
    '<p><strong>完整句：</strong>' + esc(r.q.full) + '</p>' + (r.q.tr ? '<p>中譯：' + r.q.tr + '</p>' : '') + '</div>').join('')
    : '<div class="feedback ok">🎉 沒有錯題紀錄。</div>';
  $('#download').classList.toggle('hidden', !wrong.size);
  $('#retryWrong').classList.toggle('hidden', !wrong.size);
  if (total) document.dispatchEvent(new CustomEvent('quiz-result-ready', { detail: {
    total, wrong: [...wrong.keys()].filter(id => answered.has(id)).length,
    mistakeQuestionNumbers: [...wrong.keys()].join(', ') } }));
}
$('#restart').onclick = () => { result.classList.add('hidden'); select.classList.remove('hidden'); };
$('#retryWrong').onclick = () => begin([...wrong.values()].map(r => r.q));
$('#download').onclick = async () => {
  if (!wrong.size) return;
  const rows = [...wrong.values()], stamp = new Date().toISOString().slice(0, 10), name = FILE + '_錯題_' + stamp;
  const plain = s => String(s).replace(/<\/?b>/g, '');
  const save = (blob, ext) => { const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = name + ext; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); };
  try {
    const { Document, Packer, Paragraph, TextRun, HeadingLevel } = await import('https://esm.sh/docx@9.5.1');
    const line = (label, text) => new Paragraph({ children: [new TextRun({ text: label, bold: true }), new TextRun({ text })] });
    const children = [new Paragraph({ heading: HeadingLevel.TITLE, children: [new TextRun({ text: TITLE + ' 錯題紀錄', bold: true })] })];
    rows.forEach((r, i) => {
      children.push(new Paragraph({ heading: HeadingLevel.HEADING_2, children: [new TextRun({ text: (i + 1) + '. 第 ' + r.q.id + ' 題 ' + r.q.head + ' ' + r.q.pos, bold: true })] }));
      if (MODE === 'coll') children.push(line('中文：', r.q.zh));
      children.push(line('題目：', r.q.stem), line('選錯：', r.picks.join('、')), line('正確答案：', r.q.ans), line('完整句：', r.q.full));
      if (r.q.tr) children.push(line('中譯：', plain(r.q.tr)));
    });
    save(await Packer.toBlob(new Document({ sections: [{ children }] })), '.docx');
  } catch (e) {
    const txt = rows.map((r, i) => (i + 1) + '. 第 ' + r.q.id + ' 題 ' + r.q.head + '\n題目：' + r.q.stem + '\n選錯：' + r.picks.join('、') + '\n正確答案：' + r.q.ans + '\n完整句：' + r.q.full + (r.q.tr ? '\n中譯：' + plain(r.q.tr) : '') + '\n').join('\n');
    save(new Blob([TITLE + ' 錯題紀錄\n\n' + txt], { type: 'text/plain;charset=utf-8' }), '.txt');
  }
};
renderList();
</script>
<script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script>
