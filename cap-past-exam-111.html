": "own", "section": "單題"}, {"id": 7, "question": "第 7 題　It was ______ for us to answer the math question because we’ve done the same kind of questions many times.", "options": ["common", "easy", "safe", "special"], "answer": 1, "answerLabel": "B", "source": "111 會考｜單題｜第 7 題", "explanation": "同類型題目做過很多次，所以回答很「容易」：easy。", "explanationSource": "own", "section": "單題"}, {"id": 8, "question": "第 8 題　Although it took me lots of time ______ a big meal for ten people, I was happy that everyone enjoyed it.", "options": ["prepare", "to prepare", "preparing", "prepared"], "answer": 1, "answerLabel": "B", "source": "111 會考｜單題｜第 8 題", "explanation": "It takes + 人 + 時間 + to V：花了很多時間「去準備」：to prepare。", "explanationSource": "own", "section": "單題"}, {"id": 9, "question": "第 9 題　Don’t let the children swim in the river. We don’t know how ______ it is. It could be dangerous.", "options": ["deep", "far", "long", "thick"], "answer": 0, "answerLabel": "A", "source": "111 會考｜單題｜第 9 題", "explanation": "不知道河水有多「深」，可能很危險：how deep。", "explanationSource": "own", "section": "單題"}, {"id": 10, "question": "第 10 題　Bob is ______ of the boys in the family. He never does any housework. His brothers at least take out the garbage sometimes.", "options": ["lazier", "the lazy", "the lazier", "the laziest"], "answer": 3, "answerLabel": "D", "source": "111 會考｜單題｜第 10 題", "explanation": "他從不做家事，兄弟至少偶爾倒垃圾，所以他是家中「最懶」的：the laziest。", "explanationSource": "own", "section": "單題"}, {"id": 11, "question": "第 11 題　Aunt Gina has lived in this town for more than sixty years, so she ______ it very well.", "options": ["will know", "knew", "knows", "was going to know"], "answer": 2, "answerLabel": "C", "source": "111 會考｜單題｜第 11 題", "explanation": "已經住了六十多年，現在對這個城鎮很「熟悉」，陳述現在事實用現在式 knows。", "explanationSource": "own", "section": "單題"}, {"id": 12, "question": "第 12 題　We won’t see the sun even after the typhoon leaves, because the news said that heavier rain will soon ______.", "options": ["catch", "follow", "move", "stop"], "answer": 1, "answerLabel": "B", "source": "111 會考｜單題｜第 12 題", "explanation": "颱風走後還看不到太陽，因為更大的雨會「接著來」：follow。", "explanationSource": "own", "section": "單題"}, {"id": 13, "question": "第 13 題　Yesterday when I got home from work, my brother ______ for dinner, so he invited me to join him.", "options": ["goes out", "went out", "has gone out", "was going out"], "answer": 3, "answerLabel": "D", "source": "111 會考｜單題｜第 13 題", "explanation": "我回到家的「當時」，弟弟正要出門吃飯：過去進行式 was going out。", "explanationSource": "own", "section": "單題"}, {"id": 14, "question": "第 14 題　You were ______ not to lend Amy money. She never gives back what she borrows.", "options": ["crazy", "helpful", "wise", "wrong"], "answer": 2, "answerLabel": "C", "source": "111 會考｜單題｜第 14 題", "explanation": "Amy 借錢從不還，所以你不借她是「明智的」：wise。", "explanationSource": "own", "section": "單題"}, {"id": 15, "question": "第 15 題　Have you found a summer job yet? Mr. Firth ______ someone to take care of his kids during the vacation. Maybe you can talk to him.", "options": ["has looked for", "is looking for", "looks for", "was looking for"], "answer": 1, "answerLabel": "B", "source": "111 會考｜單題｜第 15 題", "explanation": "暑假需要保母，Firth 先生「現在正在」找人：is looking for。", "explanationSource": "own", "section": "單題"}, {"id": 16, "question": "第 16 題　David looked out of the balcony window and saw a woman get in his car ______ away.", "options": ["drive", "drove", "and drive", "and drove"], "answer": 2, "answerLabel": "C", "source": "111 會考｜單題｜第 16 題", "explanation": "感官動詞 see + 受詞 + 原形：saw a woman get in his car and drive away，兩個原形動詞用 and 連接。", "explanationSource": "own", "section": "單題"}, {"id": 17, "question": "第 17 題　The police haven’t found the little girl who ______ at a supermarket. They’ll keep doing all they can to find her.", "options": ["took away", "taken away", "has taken away", "was taken away"], "answer": 3, "answerLabel": "D", "source": "111 會考｜單題｜第 17 題", "explanation": "小女孩是「被帶走」的：關係子句用過去式被動 was taken away。", "explanationSource": "o
