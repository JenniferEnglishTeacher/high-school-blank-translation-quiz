day she invite me to her party. I accept her invitation. After I go to there, I am too exciting and I break all her mug. She don't get angry at me. She just say it's OK and smile","mistakes":10,"alternatives":[]},{"id":2,"word":"adapt","answer":"My cousin Amy is from Taiwan, but now she lives in Canada. Last year, she moved there with her parents. At first, she could not adapt to the cold weather. Now she is adapting quickly to her new school, and she has many friends there. Every morning, she wears two jackets.","original":"My cousin Amy (is/are) from Taiwan, but now she live in Canada. Last year, she move there with her parent. At first, she cannot adapt to the cold weather. Now she is adapt quickly to her new school and she have many friend there. Every morning, she wear two jacket","mistakes":10,"alternatives":[]},{"id":3,"word":"comfort","answer":"Look! The little girl is crying in the park because she lost her teddy bear. Her brothers are trying to comfort her with kind words. Yesterday, her mom comforted her with a big hug too. These shoes are made for comfort, so she always wears them to the park.","original":"Look! The little girl is cry in the park because she lost her teddy bear. Her brothers (is/are) trying to comfort her with kind word. Yesterday, her mom comfort her with a big hug too. These shoes is made for comfort, so she always wear them to the park","mistakes":6,"alternatives":[]},{"id":4,"word":"command","answer":"Max is a smart dog. Every day, he follows his owner's commands. Right now, the trainer is giving a command to Max. Last week, the trainer commanded Max to sit, and he sat down right away. My two puppies don't obey any commands.","original":"Max (is/are) a smart dog. Every day, he follow his owner's command. Right now, the trainer is give a command to Max. Last week, the trainer command Max to sit, and he sit down right away. My two puppy don't obey any commands","mistakes":7,"alternatives":[]},{"id":5,"word":"deny","answer":"Ben is in trouble now. Last night, he ate three cookies before dinner. Then he denied eating them. Now his mom is looking at the crumbs on his shirt. Ben's sisters never deny the truth.","original":"Ben (is/are) in trouble now. Last night, he eat three cookie before dinner. Then he deny eating them. Now his mom is look at the crumbs 碎屑 on his shirt. Ben's sisters never denies the truth","mistakes":6,"alternatives":[]},{"id":6,"word":"enhance","answer":"The chef is cooking soup in the kitchen now. He always adds fresh herbs to enhance the flavor. Yesterday, he used lemon juice to enhance the taste of the fish. The colorful dishes enhance the beauty of the table. Many customers love his food.","original":"The chef (is/are) cooking soup in the kitchen now. He always add fresh herb 香草 to enhance the flavor. Yesterday, he use lemon juice to enhance the taste of the fish. The colorful dishes enhances the beauty of the table. Many customer 顧客 love his food","mistakes":6,"alternatives":[]},{"id":7,"word":"familiar","answer":"Mia is a new student at our school. Last Monday, she saw a familiar face in her class. It was her old neighbor! Now she is becoming familiar with the classroom. She already knows the names of all the teachers.","original":"Mia (is/are) a new student at our school. Last Monday, she see a familiar face in her class. It was her old neighbor! Now she is become familiar with the classroom. She already know the names of all the teacher","mistakes":4,"alternatives":[]},{"id":8,"word":"obstacle","answer":"Kevin is very shy. Shyness is a big obstacle to making friends. Last month, he faced a big obstacle at the speech contest. Now he is practicing his speech every night. His parents always help him overcome obstacles.","original":"Kevin (is/are) very shy. Shyness is a big obstacle to making friend. Last month, he face a big obstacle at the speech contest 比賽. Now he is practice his speech every night. His parents always helps him overcome obstacle","mistakes":5,"alternatives":[]},{"id":9,"word":"relish","answer":"Grandpa and Grandma are back from Japan. Yesterday, Grandpa ate his favorite beef noodle soup with relish. He relishes every chance to eat Taiwanese food. Now they are planning another trip. They relish the thought of traveling again.","original":"Grandpa and Grandma (is/are) back from Japan. Yesterday, Grandpa eat his favorite beef noodle soup with relish. He relish every chance to eat Taiwanese food. Now they are plan another trip. They relishes the thought of traveling again","mistakes":5,"alternatives":[]},{"id":10,"word":"savor","answer":"Our basketball team is the champion this year. Last Friday, we won the final game. After the game, we sat on the court and savored the moment. Now the players are eating pizza and savoring every bite. Every player has a gold medal.","original":"Our basketball team (is/are) the champion 冠軍 this year. Last Friday, we win the final game. After the game, we sit on the court and savor the moment. Now the players is eating pizza and savoring every bite. Every player have a gold medal","mistakes":6,"alternatives":[]}],"vocabularyMcq":[{"id":1,"question":"The famous singer __________ the rumor on social media and told her fans that she was not going to quit music at all.","options":["illuminated","comforted","denied","savored"],"answer":2},{"id":2,"question":"These running shoes are not very fashionable, but they are designed for __________, so your feet will not hurt even after a long walk.","options":["comfort","defiance","disdain","heritage"],"answer":0},{"id":3,"question":"The well-trained police dog always follows its owner's __________ and sits down quietly as soon as it hears the word \"Sit.\"","options":["obstacle","resolution","hoard","command"],"answer":3},{"id":4,"question":"Since Jack has lived in this small town all his life, he is __________ with every street, shop, and park in the neighborhood.","options":["transparent","familiar","sumptuous","luminous"],"answer":1},{"id":5,"question":"Penguins have thick feathers and a layer of fat under their skin, so they can easily __________ to the freezing weather of Antarctica.","options":["adapt","savor","enhance","deny"],"answer":0},{"id":6,"question":"Peter said sorry many times for breaking Jennifer's favorite mug, so in the end she smiled and __________ his apology.","options":["descended","consumed","accepted","illuminated"],"answer":2},{"id":7,"question":"After a long and cold winter, the children __________ the thought of swimming in the warm sea during their summer vacation.","options":["denied","illuminated","descended","relished"],"answer":3},{"id":8,"question":"The hikers faced a big __________ when a huge fallen tree blocked the narrow mountain path in front of them.","options":["resolution","obstacle","heritage","command"],"answer":1},{"id":9,"question":"Grandma's neighbor brought her a big basket of fresh oranges, but Grandma felt shy and said she could not __________ such a large gift.","options":["illuminate","reflect","descend","accept"],"answer":3},{"id":10,"question":"Mom found cookie crumbs all over Ben's shirt, but he still __________ eating the cookies before dinner.","options":["denied","adapted","illuminated","descended"],"answer":0},{"id":11,"question":"After winning the final game, the players sat quietly on the field to __________ the moment before they went back to the locker room.","options":["deny","savor","oblige","adapt"],"answer":1},{"id":12,"question":"At the teacher's __________, all the students put their phones away and took out their notebooks for the surprise quiz.","options":["comfort","disdain","heritage","command"],"answer":3},{"id":13,"question":"For many students, not having enough time to practice is the biggest __________ to learning a musical instrument well.","options":["trickle","heritage","obstacle","hoard"],"answer":2},{"id":14,"question":"On the first day at her new school, Mia felt nervous until she saw a __________ face — her old neighbor was sitting in the same classroom!","options":["mighty","familiar","transparent","sumptuous"],"answer":1},{"id":15,"question":"The student __________ that he had copied his classmate's homework, but the two pages of answers were exactly the same.","options":["denied","enhanced","savored","adapted"],"answer":0},{"id":16,"question":"Lily was so excited when Tom invited her to his birthday party that she __________ the invitation at once and started planning a gift for him.","options":["reflected","judged","descended","accepted"],"answer":3},{"id":17,"question":"After working hard for forty years, my grandparents now live in __________ in a big house by the sea with a beautiful flower garden.","options":["disdain","comfort","defiance","doubt"],"answer":1},{"id":18,"question":"That man at the bus stop looks __________ to me; I think he was my P.E. teacher when I was in first grade.","options":["familiar","luminous","transparent","sumptuous"],"answer":0},{"id":19,"question":"Please don't eat the chocolate cake too quickly; take small bites and __________ the rich taste of the dark chocolate.","options":["descend","deny","savor","adapt"],"answer":2},{"id":20,"question":"Although Amy missed her family a lot while studying abroad, she took __________ in their warm video calls every Sunday night.","options":["defiance","comfort","heritage","disdain"],"answer":1},{"id":21,"question":"When Kevin moved to a new school in the middle of the year, it took him a few weeks to __________ to the new teachers and classmates.","options":["savor","consume","adapt","oblige"],"answer":2},{"id":22,"question":"The chef added some fresh herbs and a little lemon juice to __________ the flavor of the fish soup before serving it.","options":["enhance","deny","oblige","descend"],"answer":0},{"id":23,"question":"After Ben failed his math test, his best friend __________ him with kind words and promised to study with him every day after school.","options":["denied","consumed","proclaimed","comforted"],"answer":3},{"id":24,"question":"The colorful lights on the bridge __________ the beauty of the river at night, so many tourists come to take photos there.","options":["enhance","deny","adapt","comfort"],"answer":0},{"id":25,"question":"After three long interviews, my aunt finally got a great job offer from a big company in Taipei, and she happily __________ it right away.","options":["descended","denied","accepted","proclaimed"],"answer":2},{"id":26,"question":"Reading English storybooks every night is a great way to __________ your reading skills and learn many new words at the same time.","options":["enhance","deny","comfort","savor"],"answer":0},{"id":27,"question":"Grandpa ate the beef noodle soup slowly because he wanted to __________ every bite of his favorite food after a long trip abroad.","options":["deny","adapt","command","savor"],"answer":3},{"id":28,"question":"Kevin is very shy, but he overcame this __________ by practicing his speech in front of his family every night for two weeks.","options":["trickle","obstacle","hoard","heritage"],"answer":1},{"id":29,"question":"Mom __________ the spicy curry recipe for my little brother by using less pepper and adding more carrots and potatoes.","options":["adapted","denied","descended","illuminated"],"answer":0},{"id":30,"question":"The captain gave a loud __________, and all the soldiers stood up straight and marched forward at exactly the same time.","options":["heritage","doubt","command","trickle"],"answer":2},{"id":31,"question":"The security guard __________ the man access to the building because he did not have his ID card with him.","options":["comforted","denied","savored","relished"],"answer":1},{"id":32,"question":"Jenny has lived in the United States for ten years, so she has a good __________ of English and speaks it like a native speaker.","options":["hoard","trickle","command","obstacle"],"answer":2},{"id":33,"question":"On Sports Day, the children raced through the __________ course, climbing over walls, crawling under nets, and jumping over old tires.","options":["heritage","obstacle","command","resolution"],"answer":1},{"id":34,"question":"The basketball team __________ their victory by having a big pizza party with their coach and families after the championship game.","options":["savored","denied","descended","adapted"],"answer":0},{"id":35,"question":"The hungry boy smiled widely and ate the whole plate of fried chicken with __________, licking his fingers after every single bite.","options":["disdain","relish","doubt","defiance"],"answer":1},{"id":36,"question":"Children usually __________ more quickly than adults when their families move to a new country with a different language and culture.","options":["consume","illuminate","adapt","proclaim"],"answer":2},{"id":37,"question":"The principal __________ our request for a longer lunch break because all the classes would have to end later in the afternoon.","options":["relished","comforted","savored","denied"],"answer":3},{"id":38,"question":"It took Sam a long time to __________ the fact that his best friend was moving to another country and they could not meet every day.","options":["descend","accept","consume","savor"],"answer":1},{"id":39,"question":"When the little girl fell off her bike and started to cry, her father gently hugged her and sang a song to __________ her.","options":["consume","descend","deny","comfort"],"answer":3},{"id":40,"question":"Our soccer team played hard but still lost 0 to 3, and the coach told us to __________ the defeat and practice harder next time.","options":["accept","enhance","illuminate","descend"],"answer":0},{"id":41,"question":"Tina loves animals very much, so she __________ the chance to feed the baby pandas during the school trip to the zoo.","options":["descended","denied","obliged","relished"],"answer":3},{"id":42,"question":"The popular cartoon movie was __________ from a famous children's book, so many fans had already read the story before they went to the cinema.","options":["comforted","adapted","consumed","descended"],"answer":1},{"id":43,"question":"The song on the radio sounded __________ to Dad because he used to sing it with his friends when he was in high school.","options":["sumptuous","clumsy","familiar","transparent"],"answer":2},{"id":44,"question":"The king __________ his guards to close the castle gates quickly because the enemy army was getting closer and closer.","options":["relished","comforted","savored","commanded"],"answer":3},{"id":45,"question":"After using the new tablets in class for a whole week, the students became __________ with all of their buttons and functions.","options":["familiar","majestic","sumptuous","transparent"],"answer":0},{"id":46,"question":"The toy factory bought new machines to __________ the quality of its toys, so fewer toys break after children play with them.","options":["deny","comfort","enhance","savor"],"answer":2}],"matching":[{"id":47,"word":"accept","options":["to eat or drink something slowly in order to enjoy it.","to say that something is not true.","to change yourself to fit a new place or situation.","something that blocks your way or makes it hard to do something.","to say yes to an offer or invitation.","to make something better, stronger, or more beautiful."],"answer":4},{"id":48,"word":"adapt","options":["to eat or drink something slowly in order to enjoy it.","to say that something is not true.","to change yourself to fit a new place or situation.","something that blocks your way or makes it hard to do something.","to say yes to an offer or invitation.","to make something better, stronger, or more beautiful."],"answer":2},{"id":49,"word":"enhance","options":["to eat or drink something slowly in order to enjoy it.","to say that something is not true.","to change yourself to fit a new place or situation.","something that blocks your way or makes it hard to do something.","to say yes to an offer or invitation.","to make something better, stronger, or more beautiful."],"answer":5},{"id":50,"word":"savor","options":["to eat or drink something slowly in order to enjoy it.","to say that something is not true.","to change yourself to fit a new place or situation.","something that blocks your way or makes it hard to do something.","to say yes to an offer or invitation.","to make something better, stronger, or more beautiful."],"answer":0},{"id":51,"word":"obstacle","options":["to eat or drink something slowly in order to enjoy it.","to say that something is not true.","to change yourself to fit a new place or situation.","something that blocks your way or makes it hard to do something.","to say yes to an offer or invitation.","to make something better, stronger, or more beautiful."],"answer":3}],"wordbank":["comfort","relish","familiar","deny","command"],"wordbankQuestions":[{"id":52,"question":"“I didn't take your cookies!” said Ben. But Mom found cookie crumbs all over his shirt, so it was hard for him to __________ it.","answer":"deny"},{"id":53,"question":"“This puppy is very smart,” said the trainer. “Every time I give a __________, it sits or lies down right away.”","answer":"command"},{"id":54,"question":"“That man looks __________,” said Grandma. “I think he was one of my students at the elementary school forty years ago.”","answer":"familiar"},{"id":55,"question":"“I'm so hungry!” said Dad after the long hike. Then he ate his beef noodles with __________ and finished every drop of the soup.","answer":"relish"}],"openQuestions":[{"id":56,"question":"What is something that you would relish the chance to do? Why?","sample":"I would relish the chance to visit Japan because I love Japanese food and anime."},{"id":57,"question":"What is one obstacle you faced at school, and how did you overcome it?","sample":"One obstacle I faced was speaking English in class, and I overcame it by practicing with my friends every day."}],"reading":[{"title":"The New Girl from Brazil","paragraphs":["When Lucia moved from Brazil to Taipei last September, everything felt strange. The street signs were in Chinese, the food smelled different, and she could not understand most of what her classmates said. The language was her biggest obstacle.","On her first day, Lucia sat alone at lunch. She missed her friends in São Paulo and wanted to go home. Then a girl named Annie sat down next to her. “Don't worry,” Annie said slowly in English, trying to comfort her. “I felt the same way when I moved here from Kaohsiung.”","Annie invited Lucia to join the school's dance club, and Lucia happily accepted the invitation. Dancing did not need many words, so Lucia could have fun without worrying about her Chinese. Soon, she knew everyone in the club.","Little by little, Lucia began to adapt. She learned to use chopsticks, practiced Chinese with Annie every day, and even tried stinky tofu. She did not like it at first, but now she eats it with relish. Her favorite thing, however, is bubble tea. She always drinks it slowly to savor every sip.","Now, when a new student joins the class, Lucia is always the first person to say hello. She knows how it feels to be the new kid."],"questions":[{"id":58,"type":"mcq","question":"What is the story mainly about? (Main Idea)","options":["how to make bubble tea at home","the rules of the school dance club","a girl who slowly adapts to life in a new country with help from a friend","why stinky tofu is popular in Taiwan"],"answer":2},{"id":59,"type":"mcq","question":"Why is Lucia always the first person to say hello to new students now? (Inference)","options":["She remembers how lonely she felt when she was new.","The teacher told her to do it.","She wants to practice her Portuguese.","She is the leader of the dance club."],"answer":0},{"id":60,"type":"mcq","question":"Which of the following is NOT true according to the story? (Detail)","options":["Annie once moved to Taipei from Kaohsiung.","Language was Lucia's biggest obstacle.","The dance club helped Lucia make friends.","Lucia liked stinky tofu the first time she tried it."],"answer":3},{"id":61,"type":"open","question":"What helped Lucia adapt to her new life in Taipei? Give ONE example from the story to support your answer. (2 pts)","sample":"Annie's friendship helped Lucia adapt — Annie comforted her at lunch and invited her to the dance club, where she made friends (paras. 2–3). (Also acceptable: practicing Chinese with Annie every day, para. 4.)"}]},{"title":"Staying Warm in the Arctic","paragraphs":["The Arctic is one of the coldest places on Earth. In winter, the temperature can drop to minus 40 degrees Celsius, and the sun may not rise for weeks. Still, many animals live there. How do they survive? They have adapted to the cold in amazing ways.","Polar bears have two layers of fur and a thick layer of fat under their skin. Their skin is black, which helps them take in heat from the sun. Their fur looks white, but each hair is actually clear and hollow, like a tiny straw.","Arctic foxes adapt in a different way. In winter, their fur is thick and white, so they can hide in the snow. In summer, the fur changes to brown or gray so that it matches the rocks and plants. Their small ears and short legs also help them lose less heat.","Some animals do not stay for the cold winter at all. Many birds, like the Arctic tern, fly thousands of kilometers south to warmer places. Other animals, like the Arctic ground squirrel, hibernate, or sleep through the winter in holes under the ground.","Every animal in the Arctic faces the same obstacle — the freezing cold — but each one has found its own way to survive."],"questions":[{"id":62,"type":"mcq","question":"What is the main idea of the passage? (Main Idea)","options":["Arctic animals have different ways to survive the cold.","Polar bears are the biggest animals in the Arctic.","The Arctic is the coldest place on Earth.","All birds fly south in the winter."],"answer":0},{"id":63,"type":"mcq","question":"How are Arctic foxes DIFFERENT from polar bears? (Compare & Contrast)","options":["Arctic foxes have black skin to take in heat.","Arctic foxes sleep through the whole winter.","Arctic foxes fly south to warmer places.","Arctic foxes change the color of their fur with the seasons."],"answer":3},{"id":64,"type":"mcq","question":"Which of the following is NOT true according to the passage? (Detail)","options":["Each polar bear hair is clear and hollow.","Arctic foxes have big ears to keep them warm.","Arctic ground squirrels hibernate in winter.","The Arctic tern flies south to warmer places."],"answer":1},{"id":65,"type":"open","question":"How do polar bears stay warm in the Arctic? Use TWO details from the text to support your answer. (2 pts)","sample":"Polar bears stay warm because they have two layers of fur and a thick layer of fat, and their black skin takes in heat from the sun (para. 2)."}]}]};

const SECTION_INFO={corrections:['改錯題｜局部修正','correction'],vocabularyMcq:['單字選擇','mcq'],matching:['定義配對','mcq'],wordbankQuestions:['選詞填空','fill'],openQuestions:['完整句子作答','open'],reading:['閱讀理解','reading']};

function norm(s){return String(s).trim().toLowerCase().replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/\b(didn't)\b/g,'did not').replace(/\b(don't)\b/g,'do not').replace(/\b(doesn't)\b/g,'does not').replace(/\b(can't)\b/g,'cannot').replace(/\b(isn't)\b/g,'is not').replace(/\b(aren't)\b/g,'are not').replace(/\b(wasn't)\b/g,'was not').replace(/\b(weren't)\b/g,'were not').replace(/\s+([,.!?;:])/g,'$1').replace(/([,.!?;:])(?!\s|$)/g,'$1 ').replace(/\s+/g,' ').trim()}
function normPart(s){return norm(s).replace(/[,.!?;:]/g,'')}
function correctionTarget(item){return item.alternatives?.[0]||item.answer}
function correctionTokens(s){return (String(s).replace(/[\u3400-\u9fff]+/gu,' ').replace(/\s+([,.!?;:])/g,'$1').match(/\([^)]*\)[,.!?;:]?|[A-Za-z]+(?:['’][A-Za-z]+)?[,.!?;:]?|\d+[,.!?;:]?/g)||[])}
function correctionParts(item){const original=correctionTokens(item.original),target=correctionTokens(correctionTarget(item)),n=original.length,m=target.length,dp=Array.from({length:n+1},()=>Array(m+1).fill(0));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=norm(original[i])===norm(target[j])?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);const parts=[];let i=0,j=0,equal=[];const flushEqual=()=>{if(equal.length){parts.push({same:equal.join(' ')});equal=[]}};while(i<n||j<m){if(i<n&&j<m&&norm(original[i])===norm(target[j])){equal.push(original[i]);i++;j++;continue}flushEqual();const wrong=[],right=[];while((i<n||j<m)&&!(i<n&&j<m&&norm(original[i])===norm(target[j]))){if(i<n&&(j>=m||dp[i+1][j]>=dp[i][j+1]))wrong.push(original[i++]);else if(j<m)right.push(target[j++])}if(right.length)parts.push({wrong:wrong.join(' ')||'（缺字）',answer:right.join(' ')});else if(wrong.length)parts.push({wrong:wrong.join(' '),answer:''})}flushEqual();return parts}
function correctionHtml(item){return '<div class="correction-flow">'+correctionParts(item).map((p,i)=>p.same?`<span>${esc(p.same)}</span>`:p.answer?`<span class="correction-edit"><del>${esc(p.wrong)}</del><input class="correction-input" data-answer="${esc(p.answer)}" aria-label="第 ${i+1} 個錯誤的正確字詞" size="${Math.min(18,Math.max(7,p.answer.length))}" placeholder="改成？"></span>`:`<span class="correction-edit"><del>${esc(p.wrong)}</del></span>`).join('')+'</div>'}
function sectionCount(key){if(key==='reading')return DATA.reading.reduce((n,p)=>n+p.questions.length,0);return DATA[key].length}
function renderSections(){const labels={corrections:'錯誤字詞標紅，只需逐格改正',vocabularyMcq:'四選一即時批改',matching:'依定義選出正確配對',wordbankQuestions:'從單字庫輸入正確答案',openQuestions:'完整句作答並對照範例',reading:'文章、選擇題與文字作答'};$('#sectionGrid').innerHTML=Object.keys(SECTION_INFO).map(key=>`<button class="section-btn" data-section="${key}"><b>${SECTION_INFO[key][0]}</b><span>${sectionCount(key)} 題｜${labels[key]}</span></button>`).join('');document.querySelectorAll('.section-btn').forEach(btn=>btn.onclick=()=>start(btn.dataset.section))}
function start(key){section=key;items=key==='reading'?DATA.reading.flatMap(p=>p.questions.map(q=>({...q,passage:p}))):DATA[key];index=0;wrong=new Map();correct=new Set();$('#select').classList.add('hidden');$('#result').classList.add('hidden');$('#quiz').classList.remove('hidden');show()}
function show(){speechSynthesis?.cancel();attempts=0;const item=items[index];$('#meta').textContent=`${SECTION_INFO[section][0]}｜第 ${index+1} / ${items.length} 題`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=(index+1)/items.length*100+'%';$('#passage').classList.add('hidden');$('#reference').classList.add('hidden');$('#voiceBox').classList.add('hidden');$('#feedback').className='feedback hidden';$('#showAnswer').classList.add('hidden');$('#check').classList.remove('hidden');$('#next').classList.add('hidden');const q=$('#question'),a=$('#answerArea'),ins=$('#instructions');ins.classList.add('hidden');if(section==='corrections'){ins.textContent='紅色刪除線是錯誤字詞；請只在旁邊的格子輸入正確字詞。';ins.classList.remove('hidden');q.className='question wrong-sentence';q.innerHTML=correctionHtml(item);a.innerHTML=''}else if(section==='vocabularyMcq'||section==='matching'){q.className='question';q.textContent=section==='matching'?`${item.id}. ${item.word}`:`${item.id}. ${item.question}`;a.innerHTML='<div class="options">'+item.options.map((o,i)=>`<label class="option"><input type="radio" name="choice" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')+'</div>'}else if(section==='wordbankQuestions'){q.className='question';q.textContent=`${item.id}. ${item.question}`;a.innerHTML='<div class="wordbank">'+DATA.wordbank.map(w=>`<span class="word">${esc(w)}</span>`).join('')+'</div><input class="answer" autocomplete="off" spellcheck="false" placeholder="輸入單字">'}else if(section==='openQuestions'){q.className='question';q.textContent=`${item.id}. ${item.question}`;a.innerHTML='<textarea class="answer" rows="5" placeholder="請用完整英文句子作答"></textarea>';$('#check').textContent='查看參考答案'}else{const p=item.passage;$('#passage').innerHTML=`<h3>${esc(p.title)}</h3>`+p.paragraphs.map(x=>`<p>${esc(x)}</p>`).join('');$('#passage').classList.remove('hidden');q.className='question';q.textContent=`${item.id}. ${item.question}`;if(item.type==='mcq')a.innerHTML='<div class="options">'+item.options.map((o,i)=>`<label class="option"><input type="radio" name="choice" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')+'</div>';else{a.innerHTML='<textarea class="answer" rows="5" placeholder="請用文章證據完整作答"></textarea>';$('#check').textContent='查看參考答案'}}if(section!=='openQuestions'&&!(section==='reading'&&item.type==='open'))$('#check').textContent='檢查答案';setTimeout(()=>a.querySelector('input,textarea')?.focus(),0)}
function recordWrong(item,value){const key=section+'-'+item.id;if(!wrong.has(key))wrong.set(key,{item,section,attempts:[]});wrong.get(key).attempts.push(value);$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
function completedText(item){if(section==='corrections')return correctionTarget(item);if(section==='vocabularyMcq')return item.question.replace(/_{3,}/,item.options[item.answer]);if(section==='matching')return `${item.word}: ${item.options[item.answer]}`;if(section==='wordbankQuestions')return item.question.replace(/_{3,}/,item.answer);return item.sample||''}
function speak(text=completedText(items[index])){if(!speechSynthesis||!text)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.86;speechSynthesis.speak(u)}
$('#speak').onclick=()=>speak();
$('#check').onclick=()=>{const item=items[index],open=section==='openQuestions'||(section==='reading'&&item.type==='open');if(open){const value=$('#answerArea .answer').value.trim();if(!value)return alert('請先輸入完整答案。');$('#reference').textContent='參考答案：\n'+item.sample;$('#reference').classList.remove('hidden');$('#check').classList.add('hidden');$('#next').classList.remove('hidden');$('#voiceTarget').textContent=item.sample;$('#voiceBox').classList.remove('hidden');speak(item.sample);correct.add(section+'-'+item.id);return}let value,ok=false,answerText='';if(section==='corrections'){const fields=[...document.querySelectorAll('.correction-input')];if(fields.some(x=>!x.value.trim()))return alert('請先完成所有紅色錯誤旁的格子。');fields.forEach(x=>{const good=normPart(x.value)===normPart(x.dataset.answer);x.classList.toggle('correct',good);x.classList.toggle('incorrect',!good)});value=fields.map(x=>x.dataset.answer+'→'+x.value.trim()).join('；');ok=fields.every(x=>normPart(x.value)===normPart(x.dataset.answer));answerText=correctionTarget(item)}else if(section==='vocabularyMcq'||section==='matching'||(section==='reading'&&item.type==='mcq')){const selected=document.querySelector('input[name="choice"]:checked');if(!selected)return alert('請先選擇答案。');value=String.fromCharCode(65+(+selected.value));ok=+selected.value===item.answer;answerText=String.fromCharCode(65+item.answer)+'. '+item.options[item.answer]}else{value=$('#answerArea .answer').value.trim();if(!value)return alert('請先輸入答案。');ok=norm(value)===norm(item.answer);answerText=item.answer}if(ok){correct.add(section+'-'+item.id);$('#feedback').className='feedback ok';$('#feedback').textContent='✅ 正確！';$('#check').classList.add('hidden');$('#showAnswer').classList.add('hidden');$('#next').classList.remove('hidden');$('#voiceTarget').textContent=completedText(item);$('#voiceBox').classList.remove('hidden');speak()}else{attempts++;recordWrong(item,value);$('#feedback').className='feedback bad';if(section==='corrections'){$('#feedback').textContent='❌ 紅框中的修改仍不正確，請只重填這些格子。';$('#showAnswer').classList.remove('hidden')}else{$('#feedback').textContent='❌ 不正確。正確答案：'+answerText+'\n請重新作答。';document.querySelectorAll('input[name="choice"]').forEach(x=>x.checked=false);$('#answerArea .answer')?.select()}}};
$('#showAnswer').onclick=()=>{const item=items[index];$('#reference').textContent='完整正確段落：\n'+correctionTarget(item);$('#reference').classList.remove('hidden')};
$('#next').onclick=()=>{index++;index>=items.length?finish():show()};$('#finish').onclick=finish;
function finish(){speechSynthesis?.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');$('#summary').innerHTML=`<div class="stat">本輪題數<b>${items.length}</b></div><div class="stat">完成題數<b>${correct.size}</b></div><div class="stat">曾答錯<b>${wrong.size}</b></div>`;$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>`<div class="wrong-card"><b>${i+1}. 第 ${r.item.id} 題</b><p>${esc(r.item.original||r.item.question||r.item.word)}</p><p><strong>錯誤答案：</strong>${r.attempts.map(esc).join('；')}</p><p><strong>正確答案：</strong>${esc(r.item.answer||r.item.options?.[r.item.answer]||'請參考範例')}</p></div>`).join(''):'<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size)}
