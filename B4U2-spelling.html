<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>翰林 B4U2 第六大題 單字拼字</title><style>:root{--bg:#f5f7fb;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#dbe2ea;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--accent:#2563eb}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}.wrap{max-width:980px;margin:auto;padding:18px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 5px 18px rgba(15,23,42,.05)}.hero{background:linear-gradient(135deg,#eaf2ff,#fff)}h1{margin:0 0 8px;font-size:clamp(25px,4vw,38px)}.note{color:var(--muted)}.hidden{display:none!important}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}.btn{border:0;border-radius:10px;padding:11px 16px;font-size:16px;font-weight:700;cursor:pointer;background:#e5e7eb}.btn.primary{background:var(--accent);color:white}.btn.danger{background:#991b1b;color:white}.pick{display:block;padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;background:#fafafa}.pick input{margin-right:9px}.pick small{display:block;color:var(--muted);margin-left:25px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--accent)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:700;margin:8px 0 18px}.stem{font-size:21px;font-weight:700;margin:16px 0}.options{display:grid;gap:10px}.option{display:flex;gap:10px;padding:12px;border:2px solid var(--line);border-radius:10px;cursor:pointer}.option:has(input:checked){border-color:var(--accent);background:#eff6ff}.spell-input{font-size:20px;padding:10px;border:2px solid #94a3b8;border-radius:9px;width:min(260px,100%);margin:6px}.clue{font-weight:800;color:#5b21b6}.feedback{margin-top:14px;padding:13px;border-radius:10px;font-weight:700}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}@media(max-width:640px){.wrap{padding:10px}.hero,.card{padding:15px}.stem{font-size:18px}}</style></head><body><main class="wrap"><section class="hero"><h1>翰林 B4U2 第六大題 單字拼字</h1><p>共 20 題。請根據句意與字首、字尾提示，拼出完整單字。</p><p class="note">本測驗不使用錄音或麥克風。答錯會顯示正確答案並要求重新作答；結束後可下載 DOCX 錯題紀錄。</p></section><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn">全部選取</button><button id="none" class="btn">全部取消</button><button id="start" class="btn primary">開始作答</button></div><div id="list"></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="stem" class="stem"></div><div id="area" class=""></div><div id="feedback" class="feedback hidden"></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="download" class="btn primary">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></main><script type="module">import{Document,Packer,Paragraph,TextRun,HeadingLevel}from'https://esm.sh/docx@9.5.1';const Q=[[1,"I don’t know the truth ______ my mom told me about it.",["until"],["u_____l"]],[2,"I tried the dish from your restaurant, and I couldn’t ______ it ______ the one from that famous hotel restaurant. It tasted like that one.",["tell","from"],["t__l","f__m"]],[3,"A: How much do you weigh? B: I weigh 60 ______.",["kilograms"],["k______ms"]],[4,"Mary and I read the ______. She ordered the steak, and I had a ham sandwich.",["menu"],["m__u"]],[5,"The ground is still ______. Please put on a pair of slippers.",["wet"],["w_t"]],[6,"Red fire ants are very dangerous. They can even ______ a person.",["kill"],["k__l"]],[7,"Watch out! ______ might hide under the rocks.",["Snakes"],["S____es"]],[8,"His dad’s ______ made him sad for a long time. He could not see him again.",["death"],["d___h"]],[9,"The dog is very terrible. ______ away from it, or it will bite you.",["Stay"],["S__y"]],[10,"The trash in the kitchen ______ bad. Why didn’t you take it out last night?",["smells"],["s____ls"]],[11,"I told you everything. There is ______ else to tell you.",["nothing"],["n_____g"]],[12,"I don’t eat ______ because it has milk. I feel bad when I have milk.",["cheese"],["c____e"]],[13,"Stay away from strangers. They may be ______ people.",["dangerous"],["d_______s"]],[14,"Beef dishes here are so ______. They taste great!",["delicious"],["d______s"]],[15,"Our burgers look the same. I can’t ______ his from mine.",["tell"],["t__l"]],[16,"Mom and I have different ______ for food. She doesn’t like the restaurants I go to, and I don’t like the restaurants she likes.",["tastes"],["t___es"]],[17,"The chicken rice ______ so good. It’s so yummy!",["tastes"],["t___es"]],[18,"Mr. Lee has pigs on the farm, and he sells ______ at the market.",["pork"],["p__k"]],[19,"I ______ fell asleep during the exam because I was tired.",["almost"],["a____t"]],[20,"I ______ to prepare for the exam. I did poorly on it.",["forgot"],["f____t"]]];const $=s=>document.querySelector(s),list=$('#list'),select=$('#select'),quiz=$('#quiz'),result=$('#result'),bar=$('#bar'),meta=$('#meta'),wrongCount=$('#wrongCount'),stem=$('#stem'),area=$('#area'),feedback=$('#feedback'),check=$('#check'),next=$('#next');let chosen=[],idx=0;const wrong=new Map(),attempted=new Set(),correct=new Set();const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s).trim().toLowerCase().replace(/\s+/g,' ');function renderList(){list.innerHTML=Q.map(q=>'<label class="pick"><input class="pickbox" type="checkbox" value="'+q[0]+'" checked><b>第 '+q[0]+' 題</b><small>'+esc(q[1])+'</small></label>').join('')}$('#all').onclick=()=>document.querySelectorAll('.pickbox').forEach(x=>x.checked=true);$('#none').onclick=()=>document.querySelectorAll('.pickbox').forEach(x=>x.checked=false);$('#start').onclick=function(){const ids=Array.from(document.querySelectorAll('.pickbox:checked')).map(x=>Number(x.value));if(!ids.length){alert('請至少選一題。');return}chosen=Q.filter(q=>ids.includes(q[0]));idx=0;wrong.clear();attempted.clear();correct.clear();select.classList.add('hidden');result.classList.add('hidden');quiz.classList.remove('hidden');show()};
function show(){var q=chosen[idx];meta.textContent='第 '+(idx+1)+' / '+chosen.length+' 題';bar.style.width=((idx+1)/chosen.length*100)+'%';stem.textContent=q[1];area.innerHTML=q[2].map(function(a,i){return '<div><span class="clue">'+esc(q[3][i])+'</span><br><input class="spell-input" data-i="'+i+'" autocomplete="off" autocapitalize="off" placeholder="請拼出完整單字"></div>'}).join('');feedback.className='feedback hidden';check.classList.remove('hidden');next.classList.add('hidden');setTimeout(function(){var x=document.querySelector(".spell-input");if(x)x.focus()},0)}
check.onclick=function(){var q=chosen[idx],ins=Array.from(document.querySelectorAll(".spell-input"));if(ins.some(function(x){return !x.value.trim()})){alert("請完成所有拼字空格。");return}attempted.add(q[0]);var bad=[];ins.forEach(function(x,i){if(norm(x.value)!==norm(q[2][i]))bad.push("空格 "+(i+1)+"："+x.value)});if(!bad.length){correct.add(q[0]);feedback.className="feedback ok";feedback.textContent="✅ 拼字全部正確！";check.classList.add("hidden");next.classList.remove("hidden");ins.forEach(function(x){x.disabled=true})}else{if(!wrong.has(q[0]))wrong.set(q[0],{q:q,attempts:[]});wrong.get(q[0]).attempts.push(bad.join("；"));feedback.className="feedback bad";feedback.innerHTML="❌ 拼字錯誤。正確答案：<strong>"+q[2].map(esc).join("；")+"</strong><br>請清空後重新拼寫。";ins.forEach(function(x){x.value="";x.disabled=false});ins[0].focus()}};
next.onclick=function(){idx++;if(idx>=chosen.length)finishQuiz();else show()};$('#finish').onclick=finishQuiz;function finishQuiz(){quiz.classList.add('hidden');result.classList.remove('hidden');$('#summary').innerHTML='<div class="stat">選擇題數<b>'+chosen.length+'</b></div><div class="stat">已作答<b>'+attempted.size+'</b></div><div class="stat">完成答對<b>'+correct.size+'</b></div><div class="stat">曾答錯<b>'+wrong.size+'</b></div>';$('#wrongList').innerHTML=wrong.size?Array.from(wrong.values()).map(function(r,i){return '<div class="wrong"><b>'+(i+1)+'. '+esc(r.q[1])+'</b><p>錯誤紀錄：'+r.attempts.map(esc).join('<br>')+'</p><p><strong>正確答案：</strong>'+r.q[2].map(esc).join('；')+'</p></div>'}).join(''):'<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size)}$('#restart').onclick=function(){result.classList.add('hidden');select.classList.remove('hidden')};$('#download').onclick=async function(){if(!wrong.size)return;const children=[new Paragraph({heading:HeadingLevel.TITLE,children:[new TextRun({text:'翰林 B4U2 第六大題 單字拼字－錯題紀錄',bold:true})]})];Array.from(wrong.values()).forEach(function(r,i){children.push(new Paragraph({heading:HeadingLevel.HEADING_2,children:[new TextRun({text:(i+1)+'. '+r.q[1],bold:true})]}));children.push(new Paragraph({children:[new TextRun({text:'學生錯誤答案：',bold:true}),new TextRun({text:r.attempts.join(' | ')})]}));children.push(new Paragraph({children:[new TextRun({text:'正確答案：',bold:true}),new TextRun({text:r.q[2].join('；')})]}))});const doc=new Document({sections:[{children}]});const blob=await Packer.toBlob(doc),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='翰林B4U2_第六大題單字拼字_錯題_'+new Date().toISOString().slice(0,10)+'.docx';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};renderList();</script></body></html>
