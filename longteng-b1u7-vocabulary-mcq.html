ection></main><script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 7｜單字選擇","mode":"mcq","questions":[{"id":1,"question":"It is said that the famous poet often takes a walk along this stream in ____________ of inspiration.","options":["potential","pursuit","faith","triumph"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"據說那位知名詩人經常沿著這條小溪散步以尋求靈感。　(A)潛力　(B)追求　(C)信心；信任　(D)勝利；成就"},{"id":2,"question":"Sarah has made up her mind to ____________ her father from smoking and drinking too much so as to help him become healthier.","options":["discourage","receive","dazzle","pursue"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"Sarah已經下定決心勸阻她爸爸抽太多菸與喝太多酒，以幫助他變得較健康。　(A)阻止；勸阻　(B)收到；獲得　(C)使讚嘆；使傾倒　(D)追求；從事"},{"id":3,"question":"All the medical ____________ in this room are very expensive, so be careful when you are using them.","options":["concerts","applications","triumphs","instruments"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"在這個房間裡所有的醫學儀器都很貴，所以當你使用它們時務必要小心。　(A)音樂會　(B)申請；申請書　(C)勝利；成就　(D)儀器；器具"},{"id":4,"question":"In order to buy a new car, Byron has decided to send in a(n) ____________ for a loan from a local bank.","options":["triumph","concert","application","instrument"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"為了買一輛新車，Byron已經決定向一間當地銀行提出貸款申請。　(A)勝利；成就　(B)音樂會　(C)申請；申請書　(D)樂器"},{"id":5,"question":"After defeating the mighty enemy, the general and his army returned to the country in ____________.","options":["potential","triumph","pursuit","faith"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"在擊敗強大的敵軍之後，那位將軍與他的軍隊凱旋歸國。　(A)潛力　(B)（因勝利而產生的）喜悅；得意　(C)追求　(D)信心；信任"},{"id":6,"question":"At the wedding, Roger swore to keep his word and remain ____________ to his wife for the rest of his life.","options":["faithful","dizzy","invaluable","potential"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"在婚禮上，Roger發誓他會遵守諾言，並且終生都對他太太忠誠。　(A)忠誠的；忠實的　(B)頭暈目眩的　(C)非常寶貴的　(D)潛在的；可能的"},{"id":7,"question":"As the head of her department, Wendy is going to interview some ____________ for this position tomorrow.","options":["concerts","instruments","screams","applicants"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"身為部門主管，Wendy明天將要面試這個職位的幾位申請人。　(A)音樂會　(B)樂器　(C)尖叫　(D)申請人"},{"id":8,"question":"The new CEO is eager to make the company bigger by selling more products to ____________ markets.","options":["dizzy","invaluable","overseas","faithful"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"這位新的執行長迫切想要在海外市場多銷售一些產品來擴大公司的規模。　(A)頭暈目眩的　(B)非常寶貴的　(C)海外的　(D)忠誠的；忠實的"},{"id":9,"question":"It was brave of the young man to fight off the gangsters with his ____________ hands.","options":["overseas","bare","potential","faithful"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"這位年輕人赤手空拳擊退了歹徒，真是勇敢。　(A)海外的　(B)赤裸的　(C)潛在的；可能的　(D)忠誠的；忠實的"},{"id":10,"question":"With the ____________ and support of his family, Charles finally achieved his goal of becoming an artist.","options":["encouragement","pursuit","potential","triumph"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"因為有家人的鼓勵與支持，Charles最終實現成為藝術家的目標。　(A)鼓勵　(B)追求　(C)潛力　(D)勝利；成就"},{"id":11,"question":"The company’s new advertisement is very creative and has attracted many ____________ customers.","options":["bare","dizzy","delicious","potential"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"這間公司的新廣告很有創意，已經吸引到許多潛在的顧客。　(A)赤裸的　(B)頭暈目眩的　(C)美味的　(D)潛在的；可能的"},{"id":12,"question":"Alice has a talent for music and is able to play several musical ____________ very well.","options":["applications","concerts","instruments","screams"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"Alice有音樂天賦，能夠非常精湛地演奏好幾種樂器。　(A)申請；申請書　(B)音樂會　(C)樂器　(D)尖叫"},{"id":13,"question":"The tickets to the Korean boy band ____________ were sold out in just a few minutes.","options":["applications","concerts","screams","instruments"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"那個韓國男團演唱會的門票幾分鐘之內就售完了。　(A)申請；申請書　(B)音樂會　(C)尖叫　(D)樂器"},{"id":14,"question":"The police didn’t stop ____________ the criminal until he was finally caught.","options":["encouraging","dazzling","pursuing","receiving"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"警方鍥而不捨追捕那個犯人，直到他終於落網。　(A)鼓勵　(B)使讚嘆；使傾倒　(C)追逐；追捕　(D)收到；獲得"},{"id":15,"question":"When Julia saw the snake on the tree in front of her path, she couldn’t help but ____________.","options":["receive","dazzle","apply","scream"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"當Julia看見她前方樹上的那條蛇，就忍不住尖叫。　(A)收到；獲得　(B)使讚嘆；使傾倒　(C)申請；報名　(D)尖叫"},{"id":16,"question":"In the game, the basketball player ____________ the spectators with his amazing skills.","options":["received","pursued","dazzled","discouraged"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"在比賽中，那名籃球員以令人驚嘆的技術使得觀眾讚嘆不已。　(A)收到；獲得　(B)追求；從事　(C)使讚嘆；使傾倒　(D)阻止；勸阻"},{"id":17,"question":"Winning the important match is an unexpected ____________ for the young badminton player.","options":["applicant","triumph","instrument","concert"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"贏得這場重要的比賽，對於這個年輕的羽球選手來說是出乎意料的勝利。　(A)申請人　(B)勝利；成就　(C)樂器　(D)音樂會"},{"id":18,"question":"We were surprised to hear that Eric ____________ managed to finish that difficult task in time.","options":["somehow","potentially","overseas","dizzily"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"我們驚訝地得知Eric以某種方式及時完成那個困難的任務。　(A)以某種方式　(B)潛在地；可能地　(C)在海外；到海外　(D)頭暈目眩地"},{"id":19,"question":"For those who want to learn more about the history of Japan, this website provides ____________ information.","options":["faithful","dizzy","bare","invaluable"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"對於那些想要更了解日本歷史的人，這個網站提供非常寶貴的資訊。　(A)忠誠的；忠實的　(B)頭暈目眩的　(C)赤裸的　(D)非常寶貴的"},{"id":20,"question":"Jane showed great ____________ by studying every night to improve her grades in math class.","options":["pursuit","application","determination","encouragement"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"Jane藉由每晚念書讓數學成績進步展現了強大的決心。　(A)追求　(B)申請　(C)決心　(D)鼓勵；鼓舞"},{"id":21,"question":"After winning first place in the 100-meter race, Kevin felt quite ____________ with excitement.","options":["faithful","dizzy","potential","bare"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"在100公尺賽跑中贏得第一名後，Kevin因為興奮而感覺非常暈眩。　(A)忠誠的；忠實的　(B)頭暈目眩的　(C)潛在的；可能的　(D)赤裸的"},{"id":22,"question":"The boss has great ____________ in Christine’s ability to deal with customers’ complaints.","options":["faith","pursuit","potential","triumph"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"老闆對於Christine處理客訴的能力很有信心。　(A)信心；信任　(B)追求　(C)潛力；可能性　(D)勝利；成就"},{"id":23,"question":"Richard often ____________ his children to step out of their comfort zone by trying new things.","options":["pursues","receives","dazzles","encourages"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"Richard常常鼓勵他的孩子們藉由嘗試新事物來跨出舒適圈。　(A)追求；從事　(B)收到；獲得　(C)使讚嘆；使傾倒　(D)鼓勵"},{"id":24,"question":"More and more people have moved to the quiet village to ____________ inner peace.","options":["pursue","apply","encourage","dazzle"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"愈來愈多人已經搬到這個安靜的村莊去追求內心的平靜。　(A)追求；從事　(B)申請　(C)鼓勵　(D)使讚嘆；使傾倒"},{"id":25,"question":"As a teacher, Rita always tries her best to help her students achieve their full ____________.","options":["application","potential","pursuit","faith"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"身為教師，Rita總是盡全力幫助她的學生們充分發揮潛力。　(A)申請；申請書　(B)潛力　(C)追求　(D)信心；信任"},{"id":26,"question":"Frank has decided to study ____________ after he leaves work this year.","options":["overseas","barely","somehow","potentially"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"Frank已經決定今年離職後到海外讀書。　(A)在海外；到海外　(B)幾乎不　(C)以某種方式　(D)潛在地"},{"id":27,"question":"Penny let out a loud ____________ on seeing a large spider in the garden.","options":["concert","applicant","triumph","scream"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"Penny在花園裡一看到一隻大蜘蛛，就發出大聲的尖叫。　(A)音樂會　(B)申請人　(C)勝利；成就　(D)尖叫"},{"id":28,"question":"Since graduating from college, Jason has ____________ for several jobs.","options":["encouraged","dazzled","applied","screamed"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"自從大學畢業後，Jason已經申請了好幾份工作。　(A)鼓勵　(B)使讚嘆；使傾倒　(C)申請　(D)尖叫"},{"id":29,"question":"Daniel is so tired today that he can ____________ stay awake in class.","options":["somehow","barely","overseas","faithfully"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"Daniel今天很累，以致於在課堂上幾乎無法保持清醒。　(A)以某種方式　(B)幾乎不　(C)在海外；到海外　(D)忠誠地；忠實地"},{"id":30,"question":"Tina ____________ lots of gifts and cards from her friends and family on her birthday.","options":["received","dazzled","encouraged","pursued"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"Tina在生日時收到許多來自她的朋友和家人的禮物與卡片。　(A)收到；獲得　(B)使讚嘆；使傾倒　(C)鼓勵　(D)追求；從事"}]};</script><script src="longteng-b1u5-quiz.js?v=20261026-3"></script><script src="longteng-vocab-required-pronunciation.js?v=20261026-4"></script></body></html>
