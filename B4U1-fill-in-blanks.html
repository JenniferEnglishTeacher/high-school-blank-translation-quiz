].map((x,i)=>({id:i+1,no:x[0],full:x[1],seg:x[2]}));let selected=[],idx=0,wrong=new Map(),rec=null;const $=id=>document.getElementById(id),norm=s=>String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();function renderList(){$('list').innerHTML=Q.map(q=>`<label class="pick"><input type="checkbox" value="${q.id}" checked><span><b>${q.no}.</b> ${q.full}</span></label>`).join('')}function render(){let q=selected[idx];$('meta').textContent=`第 ${idx+1} / ${selected.length} 題｜原題 ${q.no}`;$('bar').style.width=`${(idx+1)/selected.length*100}%`;$('q').innerHTML='';q.seg.forEach(s=>{if(typeof s==='string')$('q').append(document.createTextNode(s));else{let w=document.createElement('span');w.className='blank';let el=document.createElement('input');el.autocomplete='off';el.spellcheck=false;el.style.width=Math.max(95,Math.min(240,s.a.length*15+35))+'px';el.dataset.answer=s.a;el.dataset.accept=JSON.stringify(s.accept);w.append(el);$('q').append(w)}});$('fb').className='feedback hidden';$('vp').classList.add('hidden');$('next').classList.add('hidden');$('next').disabled=true;$('check').classList.remove('hidden');$('vr').textContent='請朗讀完整句子，達 90% 才通過。'}function check(){let q=selected[idx],bad=[];document.querySelectorAll('#q .blank').forEach(w=>{let el=w.querySelector('input'),a=el.dataset.answer,acc=JSON.parse(el.dataset.accept),v=el.value;w.classList.remove('wrong','correct');w.querySelector('.ans')?.remove();if(acc.some(x=>norm(v)===norm(x))){w.classList.add('correct');el.disabled=true}else{bad.push(`${v||'(空白)'} → ${a}`);w.classList.add('wrong');let d=document.createElement('span');d.className='ans';d.textContent='正確：'+(acc.length>1?acc.join(' / '):a);w.append(d);el.value=''}});if(bad.length){if(!wrong.has(q.id))wrong.set(q.id,[]);wrong.get(q.id).push(bad.join('；'));$('fb').className='feedback bad';$('fb').textContent='❌ 有錯誤。請依正確答案重新填寫。'}else{$('fb').className='feedback ok';$('fb').textContent='✅ 填空全部正確！現在必須朗讀完整句子，達 90% 才能進下一題。';$('ch
