<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="龍騰普高 B3U6 文法選擇（其他考點）互動練習"><title>龍騰普高 B3U6 文法選擇（其他考點）</title><style>:root{--blue:#2563eb;--navy:#1e3a8a;--bg:#f4f7fb;--card:#fff;--line:#dbe3ee;--ink:#172033;--muted:#64748b;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--voice:#6d28d9;--voicebg:#f5f3ff;--amber:#9a3412;--amberbg:#fff7ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}.wrap{max-width:920px;margin:auto;padding:16px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 5px 18px #0f172a0d}.hero{background:linear-gradient(135deg,#e8f1ff,#fff)}h1{margin:0 0 6px;font-size:clamp(25px,4vw,38px)}h2{margin-top:0}.note{color:var(--muted)}.hidden{display:none!important}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.btn{border:0;border-radius:10px;padding:11px 17px;font:800 16px inherit;cursor:pointer;background:#e5e7eb;color:var(--ink);text-decoration:none}.primary{background:var(--blue);color:#fff}.danger{background:#991b1b;color:#fff}.voice{background:var(--voice);color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.btn:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.pick{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin:7px 0;background:#fafcff}.pick input{margin-right:8px;width:17px;height:17px;accent-color:var(--blue)}#list{max-height:440px;overflow:auto;border:1px solid var(--line);padding:7px;border-radius:12px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:800;margin:8px 0 14px}.zh{padding:10px 13px;background:var(--amberbg);border-radius:9px;color:var(--amber);font-weight:800;margin-bottom:10px}.question{font-size:21px;font-weight:750;padding:16px;background:#f8fafc;border-radius:11px;white-space:pre-wrap}.options{display:grid;gap:9px;margin:14px 0}.option{display:flex;align-items:center;gap:11px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-size:18px;font-weight:750;cursor:pointer}.option:hover{border-color:#60a5fa;background:#eff6ff}.option:has(input:checked){border-color:var(--blue);background:#dbeafe;color:var(--navy)}.option input{width:20px;height:20px;accent-color:var(--blue)}.inputs{display:grid;gap:10px;margin:15px 0}.answer-row{display:grid;grid-template-columns:55px 1fr;gap:10px;align-items:center}.answer-row label{font-weight:900;color:var(--navy);text-align:center}.spell{width:100%;font:inherit;font-size:18px;padding:11px;border:2px solid #94a3b8;border-radius:9px}.feedback{padding:13px;border-radius:10px;font-weight:800;margin:13px 0}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.explain{font-weight:500;margin-top:7px}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:var(--voicebg);margin:13px 0}.voicebox b{display:block;font-size:19px;margin-bottom:8px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}.wrong p{margin:6px 0}.source{font-size:13px;color:var(--muted)}@media(max-width:600px){.wrap{padding:9px}.hero,.card{padding:15px}.question{font-size:18px;padding:13px}.option{font-size:17px}.answer-row{grid-template-columns:42px 1fr}.meta{display:block}}</style><link rel="stylesheet" href="longteng-vocab-required-pronunciation.css?v=20261026-4"></head><body><main class="wrap"><section class="hero"><h1>龍騰普高 B3U6 文法選擇（其他考點）</h1><p>共 27 題。可自行選題、隨機抽題；答錯後請重新作答。</p><p class="note">答對後顯示來源解析並播放完整英文句；STT 朗讀達 80% 才能進入下一題。完成後可重做錯題並下載 DOCX。</p><div class="toolbar"><a class="btn" href="dashboard.html">← 回測驗總覽</a></div></section><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn">全部選取</button><button id="none" class="btn">全部取消</button><button id="rand20" class="btn">隨機 20 題</button></div><label><input id="shuffle" type="checkbox"> 打亂出題順序</label><div id="list"></div><div class="actions"><button id="start" class="btn primary">開始作答</button><span id="picked" class="note"></span></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="voiceBox" class="voicebox hidden"><b id="voiceTarget"></b><button id="speak" class="btn voice">🔊 再聽一次</button></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="retry" class="btn primary">只重做錯題</button><button id="download" class="btn">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></main><script>const TITLE="龍騰普高 B3U6 文法選擇（其他考點）",MODE="mcq",Q=[{"id":1,"question":"Rose opened the window and looked outside, ____________ the sun setting over the mountains.","options":["seeing","sees","saw","had seen"],"answer":0,"explanation":"簡化連接詞and對等子句而來的分詞構句，原句為Rose opened…, and saw the sun setting….","source":"龍騰自命題"},{"id":2,"question":"Karl tried to meet different people ____________ taking part in activities after work.","options":["for","by","with","on"],"answer":1,"explanation":"by + V-ing 藉由……","source":"龍騰自命題"},{"id":3,"question":"We are making every possible effort, so I believe it won’t ____________ long before we can make our dream come true.","options":["spend","take","cost","reach"],"answer":1,"explanation":"It won’t take long…. 不會花費很長的時間","source":"龍騰自命題"},{"id":4,"question":"______ the bad weather, the outdoor event was held as planned and still attracted a lot of people.","options":["Despite","Though","As","Due to"],"answer":0,"explanation":"Despite N, S + V....表示「儘管；雖然」，Despite後面接名詞；As、Though為連接詞，後方接子句；Due to後方接名詞，但在此處語意不符","source":"龍騰自命題"},{"id":5,"question":"Max decided to stop ____________ after his doctor warned him of the harmful effects on his lungs.","options":["smoke","to smoke","smoking","smoked"],"answer":2,"explanation":"stop + V-ing 停止做某事","source":"龍騰自命題"},{"id":6,"question":"_______ that he had made a mistake, William apologized to his girlfriend right away.","options":["To be realized","To realize","After realized","After realizing"],"answer":3,"explanation":"簡化副詞子句為分詞構句，原句為“After William realized that…, he apologized to his….”，因主詞相同，省略主詞後，動詞改成現在分詞，連接詞可保留使語意更為清楚","source":"龍騰自命題"},{"id":7,"question":"_______ is necessary for students to strike a balance between study and play so that they can perform well in school and feel rested.","options":["What","It","That","This"],"answer":1,"explanation":"此處為It is + Adj. + for sb. to V…用法，It是虛主詞，真主詞為後面的不定詞片語","source":"龍騰自命題"},{"id":8,"question":"The hotel has no right to make its staff members ____________ overtime without paying them additional money, as it would be illegal.","options":["worked","to work","working","work"],"answer":3,"explanation":"make + O + VR 使役動詞後要用原形動詞","source":"龍騰自命題"},{"id":9,"question":"The night markets in Taiwan have long been viewed ____________ a significant symbol of our local culture.","options":["with","to","for","as"],"answer":3,"explanation":"view sb./sth. as…表示「視某人或某物為……」，此處使用被動式be viewed as…","source":"龍騰自命題"},{"id":10,"question":"We ____________ by how much the city has changed over the years, with an increasing number of new buildings and shopping malls.","options":["have amazed","are amazing","are amazed","were amazing"],"answer":2,"explanation":"S + be amazed by 對……感到驚奇","source":"龍騰自命題"},{"id":11,"question":"The former politician ____________ previously served as a senior advisor to the U.S. president, still plays an important role in the government.","options":[", that","that","who",", who"],"answer":3,"explanation":"此處為, who非限定的關係子句，that前方不可使用逗點","source":"龍騰自命題"},{"id":12,"question":"It is true that the more careful you are, ____________ you will make.","options":["the little mistakes","the less mistakes","the fewer mistakes","the few mistakes"],"answer":2,"explanation":"the + 比較級 (+N) …, the + 比較級 + (N) …表示「愈……，就愈……」，因為mistakes是可數名詞，故比較級使用fewer，而非less","source":"龍騰自命題"},{"id":13,"question":"My personal trainer shared some effective techniques ____________ building muscle without the need for lifting heavy weights.","options":["to","for","by","with"],"answer":1,"explanation":"介系詞需用for表示用來達成某個目標或目的的技巧","source":"龍騰自命題"},{"id":14,"question":"To Kate’s disappointment, only six of her students passed the test; ____________ students did not meet the standard required.","options":["the other","the others","other","others"],"answer":0,"explanation":"範圍限定Kate的學生，以the other + N表示範圍內的「其他的」","source":"龍騰自命題"},{"id":15,"question":"The actress couldn’t believe ____________ she was hearing when they announced that she had won the award.","options":["which","that","what","it"],"answer":2,"explanation":"what引導名詞子句作為動詞believe的受詞","source":"龍騰自命題"},{"id":16,"question":"The app ____________ track of my daily expenses really helped me stick to my budget and avoid unnecessary spending.","options":["which is kept","which keeping","kept","keeping"],"answer":3,"explanation":"簡化形容詞子句而來的分詞片語，原句為“The app which kept track… really helped me….”，省略which，動詞kept改為表主動的keeping","source":"龍騰自命題"},{"id":17,"question":"____________, Eric decided to leave the party after he heard two of his friends speaking ill of him behind his back.","options":["To be upset and annoyed","Upset and annoyed","Upset and annoying","Be upset and annoyed"],"answer":1,"explanation":"形容詞片語放在句首，原句應為“As Eric was upset and annoyed, Eric decided to….”，省略連接詞及相同主詞後，動詞was後改成being也省略，故應選Upset and annoyed","source":"龍騰自命題"},{"id":18,"question":"Some scientists believe that the dinosaurs were wiped out when the Earth ____________ a series of volcanic eruptions millions of years ago, leading to significant changes on the planet.","options":["have experienced","had experienced","was experiencing","is experiencing"],"answer":2,"explanation":"when描述過去某一個動作正在進行中，有另一個動作發生，故應填入過去進行式","source":"龍騰自命題"},{"id":19,"question":"The unexpected situation ____________ the whole team to the test, but we managed to solve the issue and complete the project on time.","options":["made","got","put","took"],"answer":2,"explanation":"put sb. to + N 使某人處於某狀態，此處指「使某人經受考驗」","source":"龍騰自命題"},{"id":20,"question":"____________ for training professional athletes, the new gym is equipped with state-of-the-art equipment designed for different needs.","options":["To be built","Built","To build","Building"],"answer":1,"explanation":"省略Because所引導的副詞子句，簡化而來的分詞構句，原句為“Because the new gym is built for…, the new gym is equipped with….”","source":"龍騰自命題"},{"id":21,"question":"____________ in the comic book, Sally didn’t hear the phone ring.","options":["Lose","Losing","Lost","To lose"],"answer":2,"explanation":"","source":"習作簿"},{"id":22,"question":"It took the police a long time ____________ out who had entered Liu’s house and killed her one year previously.","options":["and found","that found","finding","to find"],"answer":3,"explanation":"","source":"習作簿"},{"id":23,"question":"Yesterday, when I got home from work, my brother ____________ out for dinner, so he invited me to join him.","options":["goes","has gone","had gone","was going"],"answer":3,"explanation":"","source":"習作簿"},{"id":24,"question":"____________ more shelters and social support.","options":["Homeless needs","The homeless needs","Homeless need","The homeless need"],"answer":3,"explanation":"","source":"三合一學習手冊"},{"id":25,"question":"____________ you wait, ____________ it will be to make a decision.","options":["Longer; more difficult","As long as; as difficult as","The longer; the more difficult","The longest; the most difficult"],"answer":2,"explanation":"","source":"三合一學習手冊"},{"id":26,"question":"____________ in our community often ____________ in the park to exercise, chat, and enjoy the fresh air together.","options":["The elderly; gather","The elderly; gathers","Elderly; gather","Elderly; gathers"],"answer":0,"explanation":"","source":"三合一學習手冊"},{"id":27,"question":"____________ time we spend together, ____________ we become.","options":["More; closer","As much; as close as","Much; close","The more; the closer"],"answer":3,"explanation":"","source":"三合一學習手冊"}];const $=s=>document.querySelector(s),list=$('#list'),select=$('#select'),quiz=$('#quiz'),result=$('#result'),question=$('#question'),answerArea=$('#answerArea'),feedback=$('#feedback'),next=$('#next');let chosen=[],idx=0,mode='first';const wrong=new Map(),correct=new Set();const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ');const shuffled=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function renderList(){list.innerHTML=Q.map(q=>'<label class="pick"><input class="pickbox" type="checkbox" value="'+q.id+'" checked><b>第 '+q.id+' 題</b> <span class="source">'+esc(q.source||'')+'</span></label>').join('');count()}function count(){$('#picked').textContent='已選 '+document.querySelectorAll('.pickbox:checked').length+' 題'}list.addEventListener('change',count);$('#all').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=true);count()};$('#none').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=false);count()};$('#rand20').onclick=()=>{let ids=new Set(shuffled(Q).slice(0,Math.min(20,Q.length)).map(q=>q.id));document.querySelectorAll('.pickbox').forEach(x=>x.checked=ids.has(+x.value));count()};$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));if($('#shuffle').checked)chosen=shuffled(chosen);idx=0;mode='first';wrong.clear();correct.clear();select.classList.add('hidden');result.classList.add('hidden');quiz.classList.remove('hidden');show()};function show(){const q=chosen[idx];speechSynthesis?.cancel();$('#meta').textContent=(mode==='retry'?'錯題重做｜':'')+'第 '+(idx+1)+' / '+chosen.length+' 題';$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';$('#bar').style.width=(idx+1)/chosen.length*100+'%';question.textContent=q.question;const zh=$('#zh');if(q.zh){zh.textContent=q.zh;zh.classList.remove('hidden')}else zh.classList.add('hidden');feedback.className='feedback hidden';$('#voiceBox').classList.add('hidden');$('#check').classList.remove('hidden');next.classList.add('hidden');if(MODE==='mcq')answerArea.innerHTML='<div class="options">'+q.options.map((o,i)=>'<label class="option"><input type="radio" name="answer" value="'+i+'"><b>'+String.fromCharCode(65+i)+'.</b> '+esc(o)+'</label>').join('')+'</div>';else answerArea.innerHTML='<div class="inputs">'+q.answers.map((_,i)=>'<div class="answer-row"><label>'+(MODE==='multi'?['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'][i]:'答案')+'</label><input class="spell" autocomplete="off" spellcheck="false" placeholder="請輸入完整答案"></div>').join('')+'</div>';setTimeout(()=>answerArea.querySelector('input')?.focus(),0)}function currentAnswers(){if(MODE==='mcq'){const x=answerArea.querySelector('input:checked');return x?[+x.value]:[]}return [...answerArea.querySelectorAll('.spell')].map(x=>x.value)}function correctText(q){return MODE==='mcq'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.answers.map(a=>a.split('||')[0]).join(' / ')}function isCorrect(q,a){return MODE==='mcq'?a[0]===q.answer:a.every((x,i)=>q.answers[i].split(/\|\||\//).some(v=>norm(x)===norm(v)))}function completedSentence(q){if(MODE==='mcq'){let s=q.question,v=q.options[q.answer],parts=(s.match(/_{3,}/g)||[]).length>1&&v.includes(';')?v.split(';').map(x=>x.trim()):[v];parts.forEach(x=>s=s.replace(/_{3,}/,x));return s}if(MODE==='spell')return q.question.replace(/[A-Za-z]?_{3,}[A-Za-z]?/,q.answers[0].split('||')[0]);let s=q.question,marks=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];q.answers.forEach((a,i)=>{let value=a.split('||')[0];let re=new RegExp(marks[i]+'\\s*[A-Za-z]?_{3,}[A-Za-z]?');if(re.test(s))s=s.replace(re,value);else s=s.replace(/_{3,}/,value)});return s.replace(/[①-⑩]/g,'')}function speak(){if(!speechSynthesis)return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance($('#voiceTarget').textContent);u.lang='en-US';u.rate=.86;speechSynthesis.speak(u)}$('#speak').onclick=speak;$('#check').onclick=()=>{const q=chosen[idx],a=currentAnswers();if((MODE==='mcq'&&!a.length)||(MODE!=='mcq'&&(a.length!==q.answers.length||a.some(x=>!x.trim()))))return alert('請完成所有答案。');if(isCorrect(q,a)){correct.add(q.id);feedback.className='feedback ok';feedback.innerHTML='✅ 全部正確！'+(q.explanation?'<div class="explain">解析：'+esc(q.explanation)+'</div>':'');$('#check').classList.add('hidden');next.classList.remove('hidden');$('#voiceTarget').textContent=completedSentence(q);$('#voiceBox').classList.remove('hidden');speak()}else{if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(MODE==='mcq'?String.fromCharCode(65+a[0]):a.join(' / '));$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';feedback.className='feedback bad';feedback.innerHTML='❌ 答案不正確。正確答案：<strong>'+esc(correctText(q))+'</strong><br>請重新作答。'+(q.explanation?'<div class="explain">解析：'+esc(q.explanation)+'</div>':'');if(MODE==='mcq')answerArea.querySelectorAll('input').forEach(x=>x.checked=false);else answerArea.querySelectorAll('.spell').forEach(x=>x.value='');answerArea.querySelector('input')?.focus()}};next.onclick=()=>{idx++;idx>=chosen.length?finish():show()};$('#finish').onclick=finish;function finish(){speechSynthesis?.cancel();quiz.classList.add('hidden');result.classList.remove('hidden');$('#summary').innerHTML='<div class="stat">本輪題數<b>'+chosen.length+'</b></div><div class="stat">完成答對<b>'+correct.size+'</b></div><div class="stat">曾答錯<b>'+wrong.size+'</b></div>';$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>'<div class="wrong"><b>'+(i+1)+'. 第 '+r.q.id+' 題</b><p>'+esc((r.q.zh?r.q.zh+'\n':'')+r.q.question)+'</p><p><strong>錯誤答案：</strong>'+r.attempts.map(esc).join('；')+'</p><p><strong>正確答案：</strong>'+esc(correctText(r.q))+'</p>'+(r.q.explanation?'<p><strong>解析：</strong>'+esc(r.q.explanation)+'</p>':'')+'</div>').join(''):'<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size);$('#retry').classList.toggle('hidden',!wrong.size)}$('#retry').onclick=()=>{chosen=[...wrong.values()].map(x=>x.q);idx=0;mode='retry';correct.clear();result.classList.add('hidden');quiz.classList.remove('hidden');show()};$('#restart').onclick=()=>location.reload();$('#download').onclick=async()=>{if(!wrong.size)return;try{if(!window.docx)await new Promise((ok,fail)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js';s.onload=ok;s.onerror=fail;document.head.append(s)});let{Document,Packer,Paragraph,TextRun,HeadingLevel}=window.docx,children=[new Paragraph({text:TITLE+' 錯題紀錄',heading:HeadingLevel.TITLE})];for(const [_,r] of wrong){children.push(new Paragraph({children:[new TextRun({text:'第 '+r.q.id+' 題',bold:true})]}));if(r.q.zh)children.push(new Paragraph(r.q.zh));children.push(new Paragraph(r.q.question),new Paragraph('錯誤答案：'+r.attempts.join('；')),new Paragraph('正確答案：'+correctText(r.q)));if(r.q.explanation)children.push(new Paragraph('解析：'+r.q.explanation));children.push(new Paragraph('重新作答：________________________________________'))}let blob=await Packer.toBlob(new Document({sections:[{children}]})),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=TITLE+'_錯題.docx';a.click();URL.revokeObjectURL(url)}catch(e){let text=[...wrong.values()].map(r=>'第 '+r.q.id+' 題\n'+(r.q.zh?r.q.zh+'\n':'')+r.q.question+'\n錯誤答案：'+r.attempts.join('；')+'\n正確答案：'+correctText(r.q)+(r.q.explanation?'\n解析：'+r.q.explanation:'')).join('\n\n');let blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=TITLE+'_錯題.txt';a.click();URL.revokeObjectURL(url)}};renderList();</script><script src="longteng-vocab-required-pronunciation.js?v=20261111-1"></script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
