but after many lessons I can now swim across the pool."}, {"g": "", "t": "in the circle", "p": "(adv.phr.)", "e": "inside a round shape or group", "z": "在圈內；在圓圈中", "s": "The PE teacher asked all of us to stand _____ _____ _____ and pass the ball to the person on our left.", "c": "體育老師要我們全部站【在圓圈中】，把球傳給左邊的人。", "f": "The PE teacher asked all of us to stand in the circle and pass the ball to the person on our left."}, {"g": "", "t": "in the corner", "p": "(adv.phr.)", "e": "in the place inside where two walls meet", "z": "在（室內）角落", "s": "Our teacher put a big plant _____ _____ _____ of the classroom, and it makes the room look fresh and green.", "c": "老師在教室的【角落】放了一盆大植物，讓教室看起來清新又綠意盎然。", "f": "Our teacher put a big plant in the corner of the classroom, and it makes the room look fresh and green."}, {"g": "", "t": "in the dark", "p": "(adv.phr.)", "e": "where there is no light", "z": "在黑暗中；暗處", "s": "My little brother is afraid of staying _____ _____ _____, so he always sleeps with a small light on.", "c": "我弟弟害怕待【在黑暗中】，所以他睡覺時總是開著一盞小燈。", "f": "My little brother is afraid of staying in the dark, so he always sleeps with a small light on."}, {"g": "", "t": "in the end", "p": "(adv.phr.)", "e": "finally, after a long time or many changes", "z": "最後；結果", "s": "We talked for an hour about where to go for the class trip, and _____ _____ _____, everyone agreed to visit Kenting.", "c": "我們討論了一個小時要去哪裡校外教學，【最後】大家都同意去墾丁。", "f": "We talked for an hour about where to go for the class trip, and in the end, everyone agreed to visit Kenting."}, {"g": "", "t": "in the field", "p": "(adv.phr.)", "e": "in an open area of farm land", "z": "在田野間", "s": "The farmers were working _____ _____ _____ under the hot sun, so we brought them some cold water and fruit.", "c": "農夫們頂著大太陽【在田野間】工作，所以我們帶了一些冷水和水果給他們。", "f": "The farmers were working in the field under the hot sun, so we brought them some cold water and fruit."}, {"g": "", "t": "in the first place", "p": "(adv.phr.)", "e": "at the beginning; first", "z": "首先、原本", "s": "If you didn't want to join the trip, why did you say yes _____ _____ _____ _____ when your friends asked you last week?", "c": "如果你不想參加這趟旅行，上週朋友問你時，你【一開始】為什麼要答應呢？", "f": "If you didn't want to join the trip, why did you say yes in the first place when your friends asked you last week?"}, {"g": "", "t": "in the future", "p": "(adv.phr.)", "e": "in the time that will come", "z": "在未來", "s": "_____ _____ _____, Hsiao-wen wants to be a doctor because she hopes to help sick people in poor countries.", "c": "【在未來】，曉雯想當醫生，因為她希望幫助貧窮國家的病人。", "f": "In the future, Hsiao-wen wants to be a doctor because she hopes to help sick people in poor countries."}, {"g": "", "t": "in the living room", "p": "(adv.phr.)", "e": "in the main room for relaxing at home", "z": "在客廳", "s": "After dinner, our whole family likes to sit _____ _____ _____ _____ and watch a funny TV show together.", "c": "晚餐後，我們全家喜歡坐【在客廳】一起看好笑的電視節目。", "f": "After dinner, our whole family likes to sit in the living room and watch a funny TV show together."}, {"g": "", "t": "in the long run", "p": "(adv.phr.)", "e": "after a long time; in the end", "z": "長期下來、終究", "s": "Eating fast food every day may seem easy, but _____ _____ _____ _____, it can cause serious health problems for you.", "c": "每天吃速食看起來或許很方便，但【長期下來】，它會帶給你嚴重的健康問題。", "f": "Eating fast food every day may seem easy, but in the long run, it can cause serious health problems for you."}, {"g": "", "t": "in the mountains", "p": "(adv.phr.)", "e": "in an area with many high hills", "z": "在山上", "s": "My grandparents live _____ _____ _____, so the air there is fresh and the nights are cool even in summer.", "c": "我的祖父母住【在山上】，所以那裡空氣清新，即使夏天晚上也很涼爽。", "f": "My grandparents live in the mountains, so the air there is fresh and the nights are cool even in summer."}, {"g": "", "t": "in the newspaper", "p": "(adv.phr.)", "e": "printed in a daily paper", "z": "在報紙上", "s": "My father read a story _____ _____ _____ this morning about a dog that saved a little boy from a fire.", "c": "爸爸今天早上【在報紙上】讀到一篇報導，內容是一隻狗從火災中救出一個小男孩。", "f": "My father read a story in the newspaper this morning about a dog that saved a little boy from a fire."}, {"g": "", "t": "in the ocean", "p": "(adv.phr.)", "e": "in the very large sea", "z": "在海洋裡", "s": "Whales and sharks live _____ _____ _____, so we should not throw plastic bags into the water when we visit the beach.", "c": "鯨魚和鯊魚生活【在海洋裡】，所以我們去海邊時不應該把塑膠袋丟進水裡。", "f": "Whales and sharks live in the ocean, so we should not throw plastic bags into the water when we visit the beach."}, {"g": "", "t": "in the opposite way", "p": "(adv.phr.)", "e": "in a way that is totally different", "z": "以相反的方式；相反地", "s": "My cousin and I both love dogs, but we think _____ _____ _____ _____ about cats, because I love them and she hates them.", "c": "我表妹和我都喜歡狗，但我們對貓的想法【完全相反】，因為我很愛貓，她卻很討厭。", "f": "My cousin and I both love dogs, but we think in the opposite way about cats, because I love them and she hates them."}, {"g": "", "t": "in the past", "p": "(adv.phr.)", "e": "in the time before now", "z": "在過去", "s": "_____ _____ _____, people wrote letters to their friends, but now most of them send messages on their phones.", "c": "【在過去】，人們會寫信給朋友，但現在大多數人都用手機傳訊息。", "f": "In the past, people wrote letters to their friends, but now most of them send messages on their phones."}, {"g": "", "t": "in the pasture", "p": "(adv.phr.)", "e": "in a grass field for animals", "z": "在牧場中", "s": "The sheep were eating grass quietly _____ _____ _____ when a big black dog suddenly ran toward them.", "c": "羊群正【在牧場中】安靜地吃草，這時一隻大黑狗突然朝牠們跑過去。", "f": "The sheep were eating grass quietly in the pasture when a big black dog suddenly ran toward them."}, {"g": "", "t": "in the pond", "p": "(adv.phr.)", "e": "in a small area of still water", "z": "在池塘裡", "s": "There are many frogs and fish _____ _____ _____ behind our school, and we watch them during the lunch break.", "c": "我們學校後面的【池塘裡】有很多青蛙和魚，我們午休時會去看牠們。", "f": "There are many frogs and fish in the pond behind our school, and we watch them during the lunch break."}, {"g": "", "t": "in the present", "p": "(adv.phr.)", "e": "now, at this time", "z": "在現在、當下", "s": "My teacher says we should not worry too much about tomorrow but enjoy every day and live _____ _____ _____.", "c": "老師說我們不該太擔心明天，而是要享受每一天，活【在當下】。", "f": "My teacher says we should not worry too much about tomorrow but enjoy every day and live in the present."}, {"g": "", "t": "in the river", "p": "(adv.phr.)", "e": "inside the water of a river", "z": "在河裡", "s": "The water is clean, so you can see many small fish swimming _____ _____ _____ when you stand on the old bridge.", "c": "水很清澈，所以你站在老橋上時，可以看到很多小魚【在河裡】游來游去。", "f": "The water is clean, so you can see many small fish swimming in the river when you stand on the old bridge."}, {"g": "", "t": "in the same way", "p": "(adv.phr.)", "e": "like another person or thing does", "z": "以同樣的方式", "s": "Twins Andy and Eddie always laugh _____ _____ _____ _____, so their friends can't tell who is laughing.", "c": "雙胞胎安迪和艾迪總是【以同樣的方式】笑，所以朋友們分不出是誰在笑。", "f": "Twins Andy and Eddie always laugh in the same way, so their friends can't tell who is laughing."}, {"g": "", "t": "in the sea", "p": "(adv.phr.)", "e": "in the salt water near land", "z": "在大海中", "s": "The water was warm and clear, so the children swam _____ _____ _____ for two hours before they went back to the hotel.", "c": "海水溫暖又清澈，所以孩子們【在大海中】游了兩個小時才回飯店。", "f": "The water was warm and clear, so the children swam in the sea for two hours before they went back to the hotel."}, {"g": "", "t": "in the sky", "p": "(adv.phr.)", "e": "up above the earth, in the air", "z": "在空中", "s": "When Yi-ting looked up at night, she saw many bright stars _____ _____ _____ because there were no clouds at all.", "c": "怡婷晚上抬頭看時，看到許多明亮的星星【在空中】，因為一點雲都沒有。", "f": "When Yi-ting looked up at night, she saw many bright stars in the sky because there were no clouds at all."}, {"g": "", "t": "in the snow", "p": "(adv.phr.)", "e": "where snow is falling or lying", "z": "在雪中", "s": "We visited Hokkaido last winter, and the kids played _____ _____ _____ all afternoon before they drank hot chocolate.", "c": "我們去年冬天去北海道，孩子們整個下午都【在雪中】玩耍，然後才喝熱巧克力。", "f": "We visited Hokkaido last winter, and the kids played in the snow all afternoon before they drank hot chocolate."}, {"g": "", "t": "in the storm", "p": "(adv.phr.)", "e": "during very bad wind and rain", "z": "在暴風雨中", "s": "Many trees fell down _____ _____ _____ last night, and the students could not go to school this morning.", "c": "昨晚許多樹【在暴風雨中】倒下，學生今天早上無法上學。", "f": "Many trees fell down in the storm last night, and the students could not go to school this morning."}, {"g": "", "t": "in the sun", "p": "(adv.phr.)", "e": "where the sun shines on you", "z": "在陽光底下", "s": "Don't leave the chocolate _____ _____ _____ for too long, or it will melt and make a mess in the car.", "c": "不要把巧克力放【在陽光底下】太久，否則它會融化，把車子弄得一團亂。", "f": "Don't leave the chocolate in the sun for too long, or it will melt and make a mess in the car."}, {"g": "", "t": "in the tree", "p": "(adv.phr.)", "e": "among the branches of a tree", "z": "在樹上（不屬於樹的東西，如鳥、貓）", "s": "Our cat climbed up very high, and now it is sitting _____ _____ _____ and crying because it is afraid to come down.", "c": "我們的貓爬得很高，現在正坐【在樹上】哭叫，因為牠不敢下來。", "f": "Our cat climbed up very high, and now it is sitting in the tree and crying because it is afraid to come down."}, {"g": "", "t": "in the water", "p": "(adv.phr.)", "e": "inside water, swimming or floating", "z": "在水裡", "s": "The swimming coach told us to relax our bodies when we are _____ _____ _____, or we will get tired very quickly.", "c": "游泳教練告訴我們【在水裡】時要放鬆身體，否則很快就會累。", "f": "The swimming coach told us to relax our bodies when we are in the water, or we will get tired very quickly."}, {"g": "", "t": "in the wild", "p": "(adv.phr.)", "e": "in nature, not in a zoo or home", "z": "在野外", "s": "Tigers in the zoo look calm and lazy, but _____ _____ _____ they must hunt for their own food every day.", "c": "動物園裡的老虎看起來平靜又懶散，但【在野外】牠們每天都得自己獵食。", "f": "Tigers in the zoo look calm and lazy, but in the wild they must hunt for their own food every day."}, {"g": "", "t": "in the world", "p": "(adv.phr.)", "e": "on the earth; anywhere", "z": "在世界上", "s": "Mount Everest is the highest mountain _____ _____ _____, and many climbers dream of standing on its top one day.", "c": "聖母峰是【世界上】最高的山，許多登山者夢想有一天能站上峰頂。", "f": "Mount Everest is the highest mountain in the world, and many climbers dream of standing on its top one day."}, {"g": "", "t": "in the world", "p": "(adv.phr.)", "e": "used to make a question stronger", "z": "（加強語氣）到底", "s": "What _____ _____ _____ happened to your shoes? They are so dirty, and you only bought them yesterday!", "c": "你的鞋子【到底】發生了什麼事？它們好髒，而且你昨天才買的！", "f": "What in the world happened to your shoes? They are so dirty, and you only bought them yesterday!"}, {"g": "", "t": "in this way", "p": "(adv.phr.)", "e": "by doing it like this", "z": "以這種方式", "s": "Grandma puts the vegetables in cold water before she cooks them, and _____ _____ _____ they stay fresh and green.", "c": "奶奶在煮蔬菜前先把它們泡在冷水裡，【以這種方式】讓它們保持新鮮翠綠。", "f": "Grandma puts the vegetables in cold water before she cooks them, and in this way they stay fresh and green."}, {"g": "", "t": "in time", "p": "(adv.phr.)", "e": "early enough to do something", "z": "及時", "s": "Peter ran all the way to the station and got there just _____ _____ to catch the last train home.", "c": "彼得一路跑到車站，【及時】趕上了回家的最後一班火車。", "f": "Peter ran all the way to the station and got there just in time to catch the last train home."}, {"g": "", "t": "in total", "p": "(adv.phr.)", "e": "when everything is added together", "z": "總共；一共", "s": "We bought three T-shirts and two hats at the market, and we paid one thousand dollars _____ _____.", "c": "我們在市場買了三件T恤和兩頂帽子，【總共】付了一千元。", "f": "We bought three T-shirts and two hats at the market, and we paid one thousand dollars in total."}, {"g": "", "t": "in turn", "p": "(adv.phr.)", "e": "one after another", "z": "依次地、輪流地", "s": "During the speaking test, the students went to the teacher's desk _____ _____ and answered three questions about their hobbies.", "c": "口說測驗時，學生們【依次地】走到老師桌前，回答三個關於嗜好的問題。", "f": "During the speaking test, the students went to the teacher's desk in turn and answered three questions about their hobbies."}, {"g": "", "t": "in turn", "p": "(adv.phr.)", "e": "as a result; next", "z": "接著、轉而", "s": "Kids learn good habits from their parents, and they _____ _____ teach those habits to their own children when they become adults.", "c": "孩子從父母身上學到好習慣，長大成人後再【轉而】把這些習慣教給自己的孩子。", "f": "Kids learn good habits from their parents, and they in turn teach those habits to their own children when they become adults."}, {"g": "", "t": "in uniform", "p": "(adv.phr.)", "e": "wearing the special clothes of a school or job", "z": "穿制服", "s": "All the students at Mei-ling's school must come to class _____ _____ on Mondays, but they can wear their own clothes on Fridays.", "c": "美玲學校的所有學生週一都必須【穿制服】來上課，但週五可以穿自己的衣服。", "f": "All the students at Mei-ling's school must come to class in uniform on Mondays, but they can wear their own clothes on Fridays."}, {"g": "", "t": "just in case", "p": "(adv.phr.)", "e": "to be safe if something happens", "z": "以防萬一", "s": "The sky looked dark this morning, so Kevin put an umbrella in his backpack _____ _____ _____.", "c": "今天早上天空看起來很暗，所以Kevin在背包裡放了一把傘【以防萬一】。", "f": "The sky looked dark this morning, so Kevin put an umbrella in his backpack just in case."}, {"g": "", "t": "last night", "p": "(adv.phr.)", "e": "the evening or night before today", "z": "昨晚", "s": "I stayed up late _____ _____ to finish my science report, so I feel very sleepy in class today.", "c": "我【昨晚】熬夜完成自然報告，所以今天上課覺得很想睡。", "f": "I stayed up late last night to finish my science report, so I feel very sleepy in class today."}, {"g": "", "t": "last time", "p": "(adv.phr.)", "e": "on the most recent time before now", "z": "上一次", "s": "I forgot my umbrella _____ _____ and got very wet, so this time I brought two in my backpack.", "c": "我【上一次】忘了帶傘，淋得全身濕透，所以這次我在背包裡帶了兩把。", "f": "I forgot my umbrella last time and got very wet, so this time I brought two in my backpack."}, {"g": "", "t": "last time we met", "p": "(adv.phr.)", "e": "at the time when we saw each other before", "z": "上一次我們見面時", "s": "_____ _____ _____ _____, you were still in elementary school, but now you are taller than your older brother.", "c": "【上一次我們見面時】，你還在讀國小，但現在你已經比你哥哥還高了。", "f": "Last time we met, you were still in elementary school, but now you are taller than your older brother."}, {"g": "", "t": "last year", "p": "(adv.phr.)", "e": "the year before this year", "z": "去年", "s": "My family went to Japan _____ _____, and we saw beautiful cherry blossoms in a big park in Tokyo.", "c": "我們家【去年】去了日本，在東京的一座大公園看到了美麗的櫻花。", "f": "My family went to Japan last year, and we saw beautiful cherry blossoms in a big park in Tokyo."}, {"g": "", "t": "little by little", "p": "(adv.phr.)", "e": "slowly, a small amount at a time", "z": "逐漸地、一點一點地", "s": "At first Wei-ting couldn't swim at all, but _____ _____ _____ she got better, and now she can swim fifty meters.", "c": "一開始，薇婷完全不會游泳，但她【一點一點地】進步，現在她能游五十公尺了。", "f": "At first Wei-ting couldn't swim at all, but little by little she got better, and now she can swim fifty meters."}, {"g": "", "t": "more often than not", "p": "(adv.phr.)", "e": "usually; most of the time", "z": "大多數時候", "s": "_____ _____ _____ _____, my dad comes home late on Fridays because he has meetings, so we usually eat dinner without him.", "c": "【大多數時候】，我爸爸星期五都很晚回家，因為他要開會，所以我們通常沒等他就先吃晚餐。", "f": "More often than not, my dad comes home late on Fridays because he has meetings, so we usually eat dinner without him."}, {"g": "", "t": "more or less", "p": "(adv.phr.)", "e": "almost; about", "z": "或多或少、差不多", "s": "The new science project is _____ _____ _____ finished, but we still need to add some pictures before we give it to the teacher.", "c": "新的自然科專題【差不多】完成了，但在交給老師之前我們還需要加一些圖片。", "f": "The new science project is more or less finished, but we still need to add some pictures before we give it to the teacher."}, {"g": "", "t": "most important of all", "p": "(adv.phr.)", "e": "the most important thing is", "z": "最重要的是", "s": "To learn English well, read every day, practice speaking, and _____ _____ _____ _____, never be afraid of mistakes.", "c": "要學好英文，就要每天閱讀、練習說，而且【最重要的是】，永遠不要害怕犯錯。", "f": "To learn English well, read every day, practice speaking, and most important of all, never be afraid of mistakes."}, {"g": "", "t": "most importantly", "p": "(adv.phr.)", "e": "the most important thing is", "z": "最重要的是", "s": "Before a long hike, bring water and snacks, and _____ _____, tell your family where you are going.", "c": "長途健行前要帶水和點心，而且【最重要的是】，要告訴家人你要去哪裡。", "f": "Before a long hike, bring water and snacks, and most importantly, tell your family where you are going."}, {"g": "", "t": "never ever", "p": "(adv.phr.)", "e": "never, not at any time (strong)", "z": "絕對不；從未", "s": "I will _____ _____ swim in the sea alone again, because a big wave almost took me away last summer.", "c": "我【絕對不會】再一個人在海裡游泳，因為去年夏天一個大浪差點把我捲走。", "f": "I will never ever swim in the sea alone again, because a big wave almost took me away last summer."}, {"g": "", "t": "no longer", "p": "(adv.phr.)", "e": "not anymore", "z": "不再", "s": "Since the new MRT station opened near our home, my brother _____ _____ needs to ride his scooter to work in the rain.", "c": "自從我們家附近的新捷運站開通後，我哥哥【不再】需要在雨中騎機車上班了。", "f": "Since the new MRT station opened near our home, my brother no longer needs to ride his scooter to work in the rain."}, {"g": "", "t": "no more than + N", "p": "(adv.phr.)", "e": "not more than; only", "z": "不超過、只是", "s": "Each student can borrow _____ _____ _____ five books from the school library at one time, so choose carefully.", "c": "每個學生一次可以從學校圖書館借【不超過】五本書，所以要仔細挑選。", "f": "Each student can borrow no more than five books from the school library at one time, so choose carefully."}, {"g": "", "t": "not even", "p": "(adv.phr.)", "e": "used to show something is surprising or extreme", "z": "甚至不；連……都不", "s": "Jack was so tired after the long hike that he did _____ _____ eat dinner before he fell asleep on the sofa.", "c": "傑克在長途健行後累到【連】晚餐【都沒】吃就在沙發上睡著了。", "f": "Jack was so tired after the long hike that he did not even eat dinner before he fell asleep on the sofa."}, {"g": "", "t": "nothing but + N", "p": "(adv.phr.)", "e": "only; just this thing", "z": "只有；僅僅是", "s": "My little brother was so tired after soccer practice that he wanted _____ _____ a hot bath and his soft bed.", "c": "我弟弟足球練習後累到【只】想要泡個熱水澡和他柔軟的床。", "f": "My little brother was so tired after soccer practice that he wanted nothing but a hot bath and his soft bed."}, {"g": "", "t": "now and then", "p": "(adv.phr.)", "e": "sometimes, but not often", "z": "偶爾、有時候", "s": "Tina usually walks to school, but _____ _____ _____ her father drives her there when it rains very hard.", "c": "Tina通常走路上學，但【偶爾】雨下得很大時，她爸爸會開車載她去。", "f": "Tina usually walks to school, but now and then her father drives her there when it rains very hard."}, {"g": "", "t": "of course", "p": "(adv.phr.)", "e": "yes, surely", "z": "當然；沒問題", "s": "When my little sister asked if she could play with my new puzzle, I said, \"_____ _____, but please don't lose any pieces.\"", "c": "我妹妹問她能不能玩我的新拼圖時，我說：「【當然】可以，但請不要弄丟任何一片。」", "f": "When my little sister asked if she could play with my new puzzle, I said, \"Of course, but please don't lose any pieces.\""}, {"g": "", "t": "off the record", "p": "(adv.phr.)", "e": "not to be shared with the public", "z": "非公開的、不列入紀錄的", "s": "The mayor told the student reporters something _____ _____ _____, so they agreed not to put it in the school newspaper.", "c": "市長告訴學生記者一些【不列入紀錄的】事情，所以他們同意不把它寫進校刊裡。", "f": "The mayor told the student reporters something off the record, so they agreed not to put it in the school newspaper."}, {"g": "", "t": "on a + adj. + basis", "p": "(adv.phr.)", "e": "in a regular way, like daily or weekly", "z": "以……為基礎、基於", "s": "Our class cleans the park near the school _____ _____ monthly _____, and we always find lots of plastic bottles there.", "c": "我們班【以每月一次為基礎】定期清掃學校附近的公園，而且我們總是在那裡發現很多塑膠瓶。", "f": "Our class cleans the park near the school on a monthly basis, and we always find lots of plastic bottles there."}, {"g": "", "t": "on a team", "p": "(adv.phr.)", "e": "being a member of a group of players", "z": "在某個隊伍中", "s": "Jason has been _____ _____ _____ since he was nine, and he practices soccer with his friends every Saturday morning.", "c": "傑森從九歲起就一直【在球隊裡】，他每週六早上都和朋友練足球。", "f": "Jason has been on a team since he was nine, and he practices soccer with his friends every Saturday morning."}, {"g": "", "t": "on average", "p": "(adv.phr.)", "e": "usually; as a normal amount", "z": "平均而言", "s": "_____ _____, students in our class spend about two hours on homework every night, but some spend much more time.", "c": "【平均而言】，我們班的學生每晚花大約兩小時寫作業，但有些人花的時間多很多。", "f": "On average, students in our class spend about two hours on homework every night, but some spend much more time."}, {"g": "", "t": "on business", "p": "(adv.phr.)", "e": "traveling for work", "z": "因公出差", "s": "Ms. Huang often flies to Singapore _____ _____, but this time she took her children with her for a short trip.", "c": "黃小姐常常【因公出差】飛到新加坡，但這次她帶孩子一起去短暫旅行。", "f": "Ms. Huang often flies to Singapore on business, but this time she took her children with her for a short trip."}, {"g": "", "t": "on earth", "p": "(adv.phr.)", "e": "used to make a question stronger", "z": "到底、究竟", "s": "What _____ _____ happened to your shoes? They're covered in mud, and you only went out to buy milk!", "c": "你的鞋子【到底】怎麼了？上面全是泥巴，而你只是出去買個牛奶而已！", "f": "What on earth happened to your shoes? They're covered in mud, and you only went out to buy milk!"}, {"g": "", "t": "on earth", "p": "(adv.phr.)", "e": "in the world", "z": "在世界上", "s": "Water is very important to every living thing _____ _____, so we should not waste it when we brush our teeth.", "c": "水對【世界上】每一種生物都很重要，所以我們刷牙時不應該浪費水。", "f": "Water is very important to every living thing on earth, so we should not waste it when we brush our teeth."}, {"g": "", "t": "on foot", "p": "(adv.phr.)", "e": "by walking", "z": "步行、走路", "s": "The museum is only ten minutes from our hotel, so we decided to go there _____ _____ instead of taking a taxi.", "c": "博物館離我們飯店只有十分鐘，所以我們決定【步行】過去，而不搭計程車。", "f": "The museum is only ten minutes from our hotel, so we decided to go there on foot instead of taking a taxi."}, {"g": "", "t": "on Mondays", "p": "(adv.phr.)", "e": "every Monday", "z": "每週一（= every Monday）", "s": "_____ _____, our class has P.E. in the morning, so we always wear our sports clothes to school.", "c": "【每週一】我們班早上有體育課，所以我們總是穿運動服上學。", "f": "On Mondays, our class has P.E. in the morning, so we always wear our sports clothes to school."}, {"g": "", "t": "on one's back", "p": "(adv.phr.)", "e": "carried on the back of a person", "z": "在某人的背上", "s": "The hikers carried heavy bags _____ their _____ when they climbed Yangmingshan, but they still smiled all the way up.", "c": "健行的人爬陽明山時【背上】背著很重的包包，但他們一路上還是面帶微笑。", "f": "The hikers carried heavy bags on their backs when they climbed Yangmingshan, but they still smiled all the way up."}, {"g": "", "t": "on one's head", "p": "(adv.phr.)", "e": "on top of a person's head", "z": "在某人的頭上", "s": "My little sister walked into the kitchen with a paper crown _____ her _____ because she wanted to be a princess today.", "c": "我妹妹【頭上】戴著紙皇冠走進廚房，因為她今天想當公主。", "f": "My little sister walked into the kitchen with a paper crown on her head because she wanted to be a princess today."}, {"g": "", "t": "on one's own", "p": "(adv.phr.)", "e": "alone; without help", "z": "獨自地、靠自己", "s": "Eric is only fourteen, but he traveled to Kaohsiung _____ his _____ by train, and his parents were very proud of him.", "c": "艾瑞克才十四歲，但他【獨自】搭火車去了高雄，他的父母非常以他為傲。", "f": "Eric is only fourteen, but he traveled to Kaohsiung on his own by train, and his parents were very proud of him."}, {"g": "", "t": "on one's right/left", "p": "(adv.phr.)", "e": "on the right or left side of someone", "z": "在某人右邊／左邊", "s": "When you walk out of the MRT station, you will see the post office _____ your _____, right next to a small coffee shop.", "c": "你走出捷運站時，會看到郵局【在你的右邊】，就在一家小咖啡店旁邊。", "f": "When you walk out of the MRT station, you will see the post office on your right, right next to a small coffee shop."}, {"g": "", "t": "on purpose", "p": "(adv.phr.)", "e": "not by accident; meaning to do it", "z": "故意地", "s": "I'm sorry I stepped on your foot, but I didn't do it _____ _____ because the bus suddenly stopped.", "c": "對不起我踩到你的腳，但我不是【故意的】，是因為公車突然停下來。", "f": "I'm sorry I stepped on your foot, but I didn't do it on purpose because the bus suddenly stopped."}, {"g": "", "t": "on the bed", "p": "(adv.phr.)", "e": "on top of a bed", "z": "在床上", "s": "Don't leave your wet towel _____ _____ _____, or your sheets will get wet and smell bad tonight.", "c": "不要把濕毛巾放【在床上】，否則你的床單會濕掉，今晚會有臭味。", "f": "Don't leave your wet towel on the bed, or your sheets will get wet and smell bad tonight."}, {"g": "", "t": "on the CD player", "p": "(adv.phr.)", "e": "played by a machine for CDs", "z": "在CD播放機中", "s": "Dad put his favorite old song _____ _____ _____ _____, and we all sang along while we cleaned the house.", "c": "爸爸把他最愛的老歌放進【CD播放機中】播放，我們一邊打掃房子一邊跟著唱。", "f": "Dad put his favorite old song on the CD player, and we all sang along while we cleaned the house."}, {"g": "", "t": "on the cell phone", "p": "(adv.phr.)", "e": "using a mobile phone", "z": "在手機中、在手機上", "s": "Students should not play games _____ _____ _____ _____ in class, or the teacher will take the phones away until the end of the day.", "c": "學生上課時不應該【在手機上】玩遊戲，否則老師會把手機收走直到放學。", "f": "Students should not play games on the cell phone in class, or the teacher will take the phones away until the end of the day."}, {"g": "", "t": "on the computer", "p": "(adv.phr.)", "e": "using a computer", "z": "在電腦上", "s": "My sister spends two hours _____ _____ _____ every night because she has to do her homework and send emails.", "c": "我姊姊每晚花兩個小時【在電腦上】，因為她要寫作業和寄電子郵件。", "f": "My sister spends two hours on the computer every night because she has to do her homework and send emails."}, {"g": "", "t": "on the contrary", "p": "(adv.phr.)", "e": "the opposite is true", "z": "相反地", "s": "Many people think this math teacher is very strict. _____ _____ _____, she is kind and always helps students after class.", "c": "很多人認為這位數學老師很嚴格。【相反地】，她很親切，下課後總是會幫助學生。", "f": "Many people think this math teacher is very strict. On the contrary, she is kind and always helps students after class."}, {"g": "", "t": "on the corner", "p": "(adv.phr.)", "e": "at the place outside where two streets meet", "z": "在（建築物、街道）轉角", "s": "There is a convenience store _____ _____ _____ of my street, so I often buy breakfast there before I go to school.", "c": "我家那條街的【轉角】有一家便利商店，所以我上學前常在那裡買早餐。", "f": "There is a convenience store on the corner of my street, so I often buy breakfast there before I go to school."}, {"g": "", "t": "on the farm", "p": "(adv.phr.)", "e": "at a place where food is grown", "z": "在田裡、在農場裡", "s": "Uncle Wang grows rice and vegetables _____ _____ _____, and he gets up very early every morning to feed the chickens.", "c": "王叔叔【在農場裡】種稻米和蔬菜，而且他每天一大早就起床餵雞。", "f": "Uncle Wang grows rice and vegetables on the farm, and he gets up very early every morning to feed the chickens."}, {"g": "", "t": "on the floor", "p": "(adv.phr.)", "e": "lying or sitting down on the ground inside", "z": "在地板上", "s": "My little brother left his toy cars _____ _____ _____, and Dad almost fell when he walked into the room.", "c": "我弟弟把他的玩具車留【在地板上】，爸爸走進房間時差點跌倒。", "f": "My little brother left his toy cars on the floor, and Dad almost fell when he walked into the room."}, {"g": "", "t": "on the grass", "p": "(adv.phr.)", "e": "on the ground covered with grass", "z": "在草地上", "s": "On sunny weekends, many families sit _____ _____ _____ in Daan Park and enjoy a picnic with sandwiches and fruit.", "c": "天氣晴朗的週末，很多家庭會在大安公園坐【在草地上】，享受有三明治和水果的野餐。", "f": "On sunny weekends, many families sit on the grass in Daan Park and enjoy a picnic with sandwiches and fruit."}, {"g": "", "t": "on the Internet", "p": "(adv.phr.)", "e": "online, using the Internet", "z": "在網路上", "s": "If you don't know the meaning of a word, you can look it up _____ _____ _____ or ask your teacher.", "c": "如果你不知道一個字的意思，可以【在網路上】查，或問你的老師。", "f": "If you don't know the meaning of a word, you can look it up on the Internet or ask your teacher."}, {"g": "", "t": "on the line", "p": "(adv.phr.)", "e": "talking or waiting on the phone", "z": "在電話線上（通話中）", "s": "Please hurry and come to the phone, Ben, because Grandma is _____ _____ _____ and she wants to talk to you.", "c": "班，請快點來接電話，因為奶奶正【在電話線上】，她想跟你說話。", "f": "Please hurry and come to the phone, Ben, because Grandma is on the line and she wants to talk to you."}, {"g": "", "t": "on the market", "p": "(adv.phr.)", "e": "available for people to buy", "z": "上市；在市面上販售", "s": "The new phone will be _____ _____ _____ next month, and my brother is saving money to buy one.", "c": "新手機下個月就會【上市】，我哥哥正在存錢想買一支。", "f": "The new phone will be on the market next month, and my brother is saving money to buy one."}, {"g": "", "t": "on the moon", "p": "(adv.phr.)", "e": "on the surface of the moon", "z": "在月球上", "s": "Our science teacher told us that there is no air _____ _____ _____, so people need special suits when they walk there.", "c": "自然老師告訴我們【月球上】沒有空氣，所以人們在那裡行走時需要穿特殊的太空衣。", "f": "Our science teacher told us that there is no air on the moon, so people need special suits when they walk there."}, {"g": "", "t": "on the mountainside", "p": "(adv.phr.)", "e": "on the side of a mountain", "z": "在山坡、山腰上", "s": "There are many tea farms _____ _____ _____ near Alishan, and the workers pick tea leaves there early in the morning.", "c": "阿里山附近的【山坡上】有很多茶園，工人們一大早就在那裡採茶葉。", "f": "There are many tea farms on the mountainside near Alishan, and the workers pick tea leaves there early in the morning."}, {"g": "", "t": "on the one hand", "p": "(adv.phr.)", "e": "used to give the first side of an idea", "z": "一方面", "s": "_____ _____ _____ _____, living near school saves Amy a lot of time, but on the other hand, the rent there is very high.", "c": "【一方面】，住在學校附近幫艾咪省下很多時間，但另一方面，那裡的房租非常貴。", "f": "On the one hand, living near school saves Amy a lot of time, but on the other hand, the rent there is very high."}, {"g": "", "t": "on the other hand", "p": "(adv.phr.)", "e": "used to give a different idea", "z": "另一方面", "s": "Living in the countryside is quiet and peaceful. _____ _____ _____ _____, it is not easy to find a good job there.", "c": "住在鄉下安靜又平和。【另一方面】，在那裡要找到好工作並不容易。", "f": "Living in the countryside is quiet and peaceful. On the other hand, it is not easy to find a good job there."}, {"g": "", "t": "on the phone", "p": "(adv.phr.)", "e": "talking to someone by phone", "z": "在電話中", "s": "Please be quiet, everyone, because your father is _____ _____ _____ with his boss and it is an important call.", "c": "大家請安靜，因為爸爸正在跟他老闆【通電話】，那是一通很重要的電話。", "f": "Please be quiet, everyone, because your father is on the phone with his boss and it is an important call."}, {"g": "", "t": "on the radio", "p": "(adv.phr.)", "e": "heard through a radio", "z": "在收音機裡", "s": "When Grandpa drives to the market, he always listens to the news _____ _____ _____ because he wants to know the weather.", "c": "爺爺開車去市場時，總是聽【收音機裡】的新聞，因為他想知道天氣。", "f": "When Grandpa drives to the market, he always listens to the news on the radio because he wants to know the weather."}, {"g": "", "t": "on the ranch", "p": "(adv.phr.)", "e": "at a large farm for cows or horses", "z": "在牧場上", "s": "Cowboys work _____ _____ _____ all day, and they ride horses to take care of hundreds of cows.", "c": "牛仔們整天【在牧場上】工作，他們騎馬照顧好幾百頭牛。", "f": "Cowboys work on the ranch all day, and they ride horses to take care of hundreds of cows."}, {"g": "", "t": "on the river", "p": "(adv.phr.)", "e": "on top of the water of a river", "z": "在河面上", "s": "In June, many people come to watch the dragon boat races _____ _____ _____, and they cheer loudly for their favorite teams.", "c": "六月時，很多人來看【河面上】的龍舟比賽，並大聲為喜愛的隊伍加油。", "f": "In June, many people come to watch the dragon boat races on the river, and they cheer loudly for their favorite teams."}, {"g": "", "t": "on the school team", "p": "(adv.phr.)", "e": "as a player for your school", "z": "在校隊中", "s": "Kai-wen plays _____ _____ _____ _____, so he has to practice basketball every afternoon after his classes finish.", "c": "凱文【在校隊中】打球，所以每天下午下課後都要練習籃球。", "f": "Kai-wen plays on the school team, so he has to practice basketball every afternoon after his classes finish."}, {"g": "", "t": "on the screen", "p": "(adv.phr.)", "e": "shown on a TV or computer screen", "z": "在螢光幕上", "s": "The words _____ _____ _____ were too small, so the students in the back of the classroom couldn't read them.", "c": "【螢幕上】的字太小了，所以教室後面的學生看不清楚。", "f": "The words on the screen were too small, so the students in the back of the classroom couldn't read them."}, {"g": "", "t": "on the shelf", "p": "(adv.phr.)", "e": "placed on a shelf", "z": "在架子上", "s": "Please put the dictionary back _____ _____ _____ after you use it, so other students can find it easily.", "c": "字典用完後請把它放回【架子上】，這樣其他同學才能輕鬆找到。", "f": "Please put the dictionary back on the shelf after you use it, so other students can find it easily."}, {"g": "", "t": "on the shelf", "p": "(adv.phr.)", "e": "put aside and not used or done for now", "z": "被擱置", "s": "Our class trip plan has been _____ _____ _____ for months because the school doesn't have enough money for the bus.", "c": "我們班的旅行計畫已經【被擱置】好幾個月了，因為學校沒有足夠的錢租遊覽車。", "f": "Our class trip plan has been on the shelf for months because the school doesn't have enough money for the bus."}, {"g": "", "t": "on the sidewalk", "p": "(adv.phr.)", "e": "on the path for walking beside a road", "z": "在人行道上", "s": "Please walk _____ _____ _____ and not on the road, because cars and scooters drive very fast on this busy street.", "c": "請走【在人行道上】，不要走在馬路上，因為這條繁忙的街上汽機車都開得很快。", "f": "Please walk on the sidewalk and not on the road, because cars and scooters drive very fast on this busy street."}, {"g": "", "t": "on the spot", "p": "(adv.phr.)", "e": "right away, at that place", "z": "當場", "s": "When the boy found a lost wallet on the street, he gave it to the police _____ _____ _____, and the owner thanked him later.", "c": "那個男孩在街上撿到一個遺失的錢包時，他【當場】就把它交給了警察，失主後來向他道謝。", "f": "When the boy found a lost wallet on the street, he gave it to the police on the spot, and the owner thanked him later."}, {"g": "", "t": "on the top of the mountain", "p": "(adv.phr.)", "e": "at the highest part of a mountain", "z": "在山頂（= on the mountaintop）", "s": "We got up at four o'clock, and when we stood _____ _____ _____ _____ _____ _____, we watched the beautiful sunrise together.", "c": "我們四點起床，當我們站【在山頂】時，一起看了美麗的日出。", "f": "We got up at four o'clock, and when we stood on the top of the mountain, we watched the beautiful sunrise together."}, {"g": "", "t": "on the tree", "p": "(adv.phr.)", "e": "growing on a tree, like leaves or fruit", "z": "在樹上（屬於樹上的東西，如樹葉、果實）", "s": "There are lots of red apples _____ _____ _____ in Grandpa's garden, so we will pick some and bake a pie this weekend.", "c": "爺爺花園裡的【樹上】長了很多紅蘋果，所以這週末我們要摘一些來烤派。", "f": "There are lots of red apples on the tree in Grandpa's garden, so we will pick some and bake a pie this weekend."}, {"g": "", "t": "on the TV", "p": "(adv.phr.)", "e": "on top of the TV set", "z": "在電視機上", "s": "Mom put a small vase of flowers _____ _____ _____, but the cat jumped up and knocked it onto the floor.", "c": "媽媽在【電視機上】放了一個小花瓶，但貓跳上去把它撞到地上。", "f": "Mom put a small vase of flowers on the TV, but the cat jumped up and knocked it onto the floor."}, {"g": "", "t": "on the weekend", "p": "(adv.phr.)", "e": "on Saturday or Sunday", "z": "在週末", "s": "_____ _____ _____, we usually go hiking in Yangmingshan, and then we have hot pot together for dinner.", "c": "【在週末】，我們通常去陽明山健行，然後一起吃火鍋當晚餐。", "f": "On the weekend, we usually go hiking in Yangmingshan, and then we have hot pot together for dinner."}, {"g": "", "t": "on the whole", "p": "(adv.phr.)", "e": "in general; mostly", "z": "大體上、大致說來", "s": "There were a few problems with the hotel room, but _____ _____ _____ we had a wonderful time during our trip to Kenting.", "c": "飯店房間有一些小問題，但【大體上】我們在墾丁旅行時玩得很愉快。", "f": "There were a few problems with the hotel room, but on the whole we had a wonderful time during our trip to Kenting."}, {"g": "", "t": "on time", "p": "(adv.phr.)", "e": "at the right time, not late", "z": "準時", "s": "Our English teacher is very strict, so we always try to hand in our homework _____ _____ every Monday morning.", "c": "我們的英文老師很嚴格，所以我們每週一早上總是努力【準時】交作業。", "f": "Our English teacher is very strict, so we always try to hand in our homework on time every Monday morning."}, {"g": "", "t": "on TV", "p": "(adv.phr.)", "e": "shown as a TV program", "z": "在電視節目中", "s": "My family likes to watch baseball games _____ _____ on Sunday nights, and we always cheer loudly for our favorite team.", "c": "我們家喜歡在週日晚上看【電視上】的棒球比賽，而且我們總是為最喜歡的隊伍大聲加油。", "f": "My family likes to watch baseball games on TV on Sunday nights, and we always cheer loudly for our favorite team."}, {"g": "", "t": "on vacation / on holiday", "p": "(adv.phr.)", "e": "taking time away from school or work", "z": "休假中、渡假中", "s": "Our family will be _____ _____ in Japan next week, so our neighbor will feed our cat while we are away.", "c": "我們家下週要去日本【度假】，所以我們不在時，鄰居會幫我們餵貓。", "f": "Our family will be on vacation in Japan next week, so our neighbor will feed our cat while we are away."}, {"g": "", "t": "on weekdays", "p": "(adv.phr.)", "e": "from Monday to Friday", "z": "在工作日、平日", "s": "Students have to get up early _____ _____, but on Saturdays they can sleep late and relax at home.", "c": "學生【在平日】必須早起，但週六可以睡晚一點，在家放鬆。", "f": "Students have to get up early on weekdays, but on Saturdays they can sleep late and relax at home."}, {"g": "", "t": "once in a while", "p": "(adv.phr.)", "e": "sometimes, but not often", "z": "偶爾；不時", "s": "My family usually eats at home, but _____ _____ _____ _____, we go out for hot pot when Dad gets paid.", "c": "我們家通常在家吃飯，但【偶爾】爸爸領薪水時，我們會出去吃火鍋。", "f": "My family usually eats at home, but once in a while, we go out for hot pot when Dad gets paid."}, {"g": "", "t": "one by one", "p": "(adv.phr.)", "e": "one person or thing after another", "z": "一個接一個地", "s": "The students walked into the music room _____ _____ _____ and quietly sat down because the test was about to start.", "c": "學生們【一個接一個地】走進音樂教室並安靜地坐下，因為考試就要開始了。", "f": "The students walked into the music room one by one and quietly sat down because the test was about to start."}, {"g": "", "t": "out of the blue", "p": "(adv.phr.)", "e": "suddenly, when you do not expect it", "z": "出乎意料地、突如其來地", "s": "My cousin in America called me _____ _____ _____ _____ last night, and we talked for an hour because we hadn't spoken in years.", "c": "我在美國的表哥昨晚【出乎意料地】打電話給我，我們聊了一個小時，因為我們已經好幾年沒說話了。", "f": "My cousin in America called me out of the blue last night, and we talked for an hour because we hadn't spoken in years."}, {"g": "", "t": "over and over (again)", "p": "(adv.phr.)", "e": "many times, again and again", "z": "一次又一次", "s": "The baby wanted to hear the same song _____ _____ _____ _____, so her mother sang it ten times before she fell asleep.", "c": "寶寶想要【一次又一次】聽同一首歌，所以媽媽唱了十遍她才睡著。", "f": "The baby wanted to hear the same song over and over again, so her mother sang it ten times before she fell asleep."}, {"g": "", "t": "rain or shine", "p": "(adv.phr.)", "e": "in any weather; no matter what", "z": "不論晴雨；無論如何", "s": "My father goes jogging by the river every morning, _____ _____ _____, because he says exercise keeps him happy.", "c": "我爸爸每天早上都去河邊慢跑，【不論晴雨】，因為他說運動讓他快樂。", "f": "My father goes jogging by the river every morning, rain or shine, because he says exercise keeps him happy."}, {"g": "", "t": "right away", "p": "(adv.phr.)", "e": "at once; immediately", "z": "立即", "s": "When Mom saw that my fever was very high, she took me to the doctor _____ _____ and didn't even finish her coffee.", "c": "媽媽發現我發高燒時，【立刻】帶我去看醫生，連咖啡都沒喝完。", "f": "When Mom saw that my fever was very high, she took me to the doctor right away and didn't even finish her coffee."}, {"g": "", "t": "since then", "p": "(adv.phr.)", "e": "from that time until now", "z": "自那時起；從那以後", "s": "Grace moved to Kaohsiung last summer, and I haven't seen her _____ _____, but we often chat online.", "c": "葛蕾絲去年夏天搬到高雄，【從那以後】我就沒見過她了，不過我們常在網路上聊天。", "f": "Grace moved to Kaohsiung last summer, and I haven't seen her since then, but we often chat online."}, {"g": "", "t": "so far", "p": "(adv.phr.)", "e": "until now", "z": "到目前為止", "s": "I have read four books _____ _____ this summer, and I plan to finish two more before school starts again.", "c": "這個暑假【到目前為止】我已經讀了四本書，而且我打算在開學前再讀完兩本。", "f": "I have read four books so far this summer, and I plan to finish two more before school starts again."}, {"g": "", "t": "some day", "p": "(adv.phr.)", "e": "at a time in the future", "z": "將來有一天", "s": "Kelly loves animals very much, and she hopes that _____ _____ she can become a doctor who takes care of sick dogs.", "c": "凱莉非常喜歡動物，她希望【將來有一天】能成為照顧生病狗狗的醫生。", "f": "Kelly loves animals very much, and she hopes that some day she can become a doctor who takes care of sick dogs."}, {"g": "", "t": "soon after", "p": "(adv.phr.)", "e": "a short time later", "z": "不久之後", "s": "Our school bus left the parking lot at eight, and _____ _____, it started to rain heavily, so we were glad to be inside.", "c": "我們的校車八點離開停車場，【不久之後】就開始下大雨，所以我們很慶幸自己在車裡。", "f": "Our school bus left the parking lot at eight, and soon after, it started to rain heavily, so we were glad to be inside."}, {"g": "", "t": "sooner or later", "p": "(adv.phr.)", "e": "at some time in the future", "z": "遲早", "s": "If you keep practicing the guitar every day, you will play your favorite song well _____ _____ _____.", "c": "如果你每天持續練吉他，你【遲早】能把你最喜歡的歌彈好。", "f": "If you keep practicing the guitar every day, you will play your favorite song well sooner or later."}, {"g": "", "t": "than ever before", "p": "(adv.phr.)", "e": "more than at any time in the past", "z": "比以往任何時候", "s": "After practicing every day this summer, Annie can swim faster _____ _____ _____, so she will join the race.", "c": "這個暑假每天練習之後，安妮游得【比以往任何時候】都快，所以她要參加比賽。", "f": "After practicing every day this summer, Annie can swim faster than ever before, so she will join the race."}, {"g": "", "t": "than usual", "p": "(adv.phr.)", "e": "compared with what normally happens", "z": "比平常", "s": "Ryan woke up later _____ _____ this morning, so he missed breakfast and ran all the way to school.", "c": "萊恩今天早上起得【比平常】晚，所以他沒吃早餐，一路跑到學校。", "f": "Ryan woke up later than usual this morning, so he missed breakfast and ran all the way to school."}, {"g": "", "t": "that is (to say)", "p": "(adv.phr.)", "e": "used to explain something more clearly", "z": "也就是說", "s": "The museum is closed on the first Monday of every month; _____ _____, you cannot visit it on December 7 this year.", "c": "博物館每個月的第一個星期一休館；【也就是說】，你今年12月7日不能去參觀。", "f": "The museum is closed on the first Monday of every month; that is, you cannot visit it on December 7 this year."}, {"g": "", "t": "the day after tomorrow", "p": "(adv.phr.)", "e": "two days from today", "z": "後天", "s": "Today is Wednesday, so _____ _____ _____ _____ will be Friday, and we are going to have our sports day then.", "c": "今天是星期三，所以【後天】就是星期五，那天我們要舉辦運動會。", "f": "Today is Wednesday, so the day after tomorrow will be Friday, and we are going to have our sports day then."}, {"g": "", "t": "the day before yesterday", "p": "(adv.phr.)", "e": "two days before today", "z": "前天", "s": "I bought this umbrella _____ _____ _____ _____, but I already left it on the bus this morning when I was sleepy.", "c": "我【前天】才買了這把雨傘，但今天早上想睡覺時就把它忘在公車上了。", "f": "I bought this umbrella the day before yesterday, but I already left it on the bus this morning when I was sleepy."}, {"g": "", "t": "the other way around", "p": "(adv.phr.)", "e": "the opposite of what was said", "z": "反過來；相反地", "s": "I thought Tina was helping Eric with math, but it was _____ _____ _____ _____, because Eric was helping her.", "c": "我以為是蒂娜在教艾瑞克數學，但其實【正好相反】，是艾瑞克在教她。", "f": "I thought Tina was helping Eric with math, but it was the other way around, because Eric was helping her."}, {"g": "", "t": "throughout the world", "p": "(adv.phr.)", "e": "in every part of the world", "z": "遍及全世界", "s": "Soccer is played _____ _____ _____, and millions of fans watch the World Cup on TV every four years.", "c": "足球【遍及全世界】，每四年都有數百萬球迷在電視上看世界盃。", "f": "Soccer is played throughout the world, and millions of fans watch the World Cup on TV every four years."}, {"g": "", "t": "to and fro", "p": "(adv.phr.)", "e": "moving one way and then back again", "z": "來回地、往返地", "s": "Our dog was so excited about the walk that he ran _____ _____ _____ in front of the door while I put on my shoes.", "c": "我們的狗對散步太興奮了，在我穿鞋時，牠在門前【來回】跑個不停。", "f": "Our dog was so excited about the walk that he ran to and fro in front of the door while I put on my shoes."}, {"g": "", "t": "to begin with", "p": "(adv.phr.)", "e": "used to give the first reason", "z": "首先", "s": "We can't go camping this weekend; _____ _____ _____, it's going to rain, and also my dad has to work on Saturday.", "c": "我們這週末不能去露營；【首先】，會下雨，而且我爸爸星期六還要上班。", "f": "We can't go camping this weekend; to begin with, it's going to rain, and also my dad has to work on Saturday."}, {"g": "", "t": "to date", "p": "(adv.phr.)", "e": "up to now", "z": "到目前為止", "s": "Our class has collected over five hundred bottle caps _____ _____, and we hope to reach one thousand by summer vacation.", "c": "【到目前為止】，我們班已經收集了五百多個瓶蓋，我們希望在暑假前達到一千個。", "f": "Our class has collected over five hundred bottle caps to date, and we hope to reach one thousand by summer vacation."}, {"g": "", "t": "to make matters worse", "p": "(adv.phr.)", "e": "and something even worse happened", "z": "更糟的是", "s": "I missed the bus this morning, and _____ _____ _____ _____, it started to rain heavily on my way to school.", "c": "我今天早上沒趕上公車，而且【更糟的是】，在上學途中開始下起大雨。", "f": "I missed the bus this morning, and to make matters worse, it started to rain heavily on my way to school."}, {"g": "", "t": "to one's surprise", "p": "(adv.phr.)", "e": "in a way that surprises someone", "z": "令某人驚訝的是", "s": "_____ my _____, the shy new student sang beautifully at the talent show, and everyone in the hall clapped for her.", "c": "【令我驚訝的是】，那位害羞的新同學在才藝表演上唱得很好聽，禮堂裡的每個人都為她鼓掌。", "f": "To my surprise, the shy new student sang beautifully at the talent show, and everyone in the hall clapped for her."}, {"g": "", "t": "To this end, + 句子", "p": "(adv.phr.)", "e": "for this goal", "z": "為了這個目的", "s": "Our class wants to keep the park near our school clean. _____ _____ _____, we pick up trash there every Friday.", "c": "我們班想讓學校附近的公園保持乾淨。【為了這個目的】，我們每週五都去那裡撿垃圾。", "f": "Our class wants to keep the park near our school clean. To this end, we pick up trash there every Friday."}, {"g": "", "t": "twice a week", "p": "(adv.phr.)", "e": "two times every week", "z": "一週兩次", "s": "Sarah takes piano lessons _____ _____ _____, on Tuesdays and Fridays, because she wants to play in the school concert.", "c": "莎拉【一週】上【兩次】鋼琴課，在星期二和星期五，因為她想在學校音樂會上演奏。", "f": "Sarah takes piano lessons twice a week, on Tuesdays and Fridays, because she wants to play in the school concert."}, {"g": "", "t": "way too + adj.", "p": "(adv.phr.)", "e": "much too; far more than is good", "z": "太……了；過於……", "s": "This bubble tea is _____ _____ sweet for me, so next time I will ask for half sugar and less ice.", "c": "這杯珍珠奶茶對我來說【太】甜【了】，所以下次我要點半糖少冰。", "f": "This bubble tea is way too sweet for me, so next time I will ask for half sugar and less ice."}, {"g": "", "t": "What's more,", "p": "(adv.phr.)", "e": "also, and this is important too", "z": "而且；更重要的是", "s": "This backpack is light and strong. _____ _____, it is on sale today, so I'm going to buy it for school.", "c": "這個背包又輕又堅固。【而且】它今天特價，所以我要買來上學用。", "f": "This backpack is light and strong. What's more, it is on sale today, so I'm going to buy it for school."}, {"g": "", "t": "What's worse,", "p": "(adv.phr.)", "e": "and a worse thing is", "z": "更糟的是", "s": "I left my homework at home today. _____ _____, I also forgot my lunch box, so I was hungry all day.", "c": "我今天把作業忘在家裡。【更糟的是】，我也忘了帶便當，所以我餓了一整天。", "f": "I left my homework at home today. What's worse, I also forgot my lunch box, so I was hungry all day."}, {"g": "", "t": "with a check", "p": "(adv.phr.)", "e": "using a check to pay", "z": "用支票（付款）", "s": "The school asked parents to pay for the class trip _____ _____ _____ or in cash before the end of this month.", "c": "學校請家長在這個月底前【用支票】或現金繳交校外教學的費用。", "f": "The school asked parents to pay for the class trip with a check or in cash before the end of this month."}, {"g": "", "t": "with a credit card", "p": "(adv.phr.)", "e": "paying by credit card, not cash", "z": "用信用卡（= by credit card）", "s": "The shoes cost three thousand dollars, and Dad didn't have enough cash, so he paid _____ _____ _____ _____.", "c": "那雙鞋要三千元，爸爸身上現金不夠，所以他【用信用卡】付款。", "f": "The shoes cost three thousand dollars, and Dad didn't have enough cash, so he paid with a credit card."}, {"g": "", "t": "with care", "p": "(adv.phr.)", "e": "carefully", "z": "小心地（= carefully）", "s": "These glasses are very old and easy to break, so please carry them _____ _____ when you move them to the kitchen.", "c": "這些玻璃杯很舊又容易破，所以你把它們搬到廚房時請【小心地】拿。", "f": "These glasses are very old and easy to break, so please carry them with care when you move them to the kitchen."}, {"g": "", "t": "without a break", "p": "(adv.phr.)", "e": "without stopping to rest", "z": "不休息地；不停地", "s": "The workers built the bridge for ten hours _____ _____ _____, so they were very tired and hungry at night.", "c": "工人們【不休息地】蓋了十個小時的橋，所以晚上他們又累又餓。", "f": "The workers built the bridge for ten hours without a break, so they were very tired and hungry at night."}, {"g": "", "t": "without (a) doubt", "p": "(adv.phr.)", "e": "certainly; surely", "z": "毫無疑問地", "s": "_____ _____ _____, Jenny is the best singer in our class, so we chose her for the school singing contest.", "c": "【毫無疑問地】，Jenny是我們班最會唱歌的人，所以我們選她參加學校的歌唱比賽。", "f": "Without a doubt, Jenny is the best singer in our class, so we chose her for the school singing contest."}, {"g": "", "t": "without fail", "p": "(adv.phr.)", "e": "always, every time", "z": "毫無例外、一定", "s": "My grandmother goes to the park to exercise at six every morning _____ _____, even when it is cold or rainy.", "c": "我奶奶每天早上六點【一定】會去公園運動，即使天氣冷或下雨也一樣。", "f": "My grandmother goes to the park to exercise at six every morning without fail, even when it is cold or rainy."}, {"g": "", "t": "worst of all", "p": "(adv.phr.)", "e": "the most terrible part is", "z": "最糟的是", "s": "I missed the bus and forgot my lunch, and _____ _____ _____, I left my homework at home on the day it was due.", "c": "我錯過了公車又忘了帶午餐，而【最糟的是】，我在作業要交的那天把它忘在家裡了。", "f": "I missed the bus and forgot my lunch, and worst of all, I left my homework at home on the day it was due."}];</script><script src="longteng-b1u5-quiz.js?v=20261106-3"></script><script src="cap-vocab-learn.js?v=20261105-1"></script><script>document.querySelector("#description").textContent="先在「教學 Learn」看完 259 筆詞彙表，再到「測驗 Quiz」做 87 題四選一｜選答後顯示答案、用語中文與整句中譯｜答錯可重做並下載錯題";</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
