<script>window.QUIZ_CONFIG={"title": "國中會考單字片語｜副詞片語 Adverb Phrases", "mode": "mcq", "questions": [{"id": 1, "question": "The doctors worked ______ to save the sick boy.", "options": ["for fun", "from head to toe", "around the clock", "in the long run"], "answer": 2, "answerLabel": "C", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(C) around the clock\n【用語】around the clock (adv.phr.)：不眠不休地、日以繼夜地\n【中譯】醫生們不眠不休地工作，為了救那個生病的男孩。", "explanationSource": "supplemental"}, {"id": 2, "question": "You don't need to pay. You can get the ice cream ______ today.", "options": ["for nothing", "to begin with", "at hand", "at a high price"], "answer": 0, "answerLabel": "A", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(A) for nothing\n【用語】for nothing (adv.phr.)：免費；沒有報酬；白白地\n【中譯】你不用付錢。今天你可以免費拿到冰淇淋。", "explanationSource": "supplemental"}, {"id": 3, "question": "Look! Some ducks are swimming ______ behind our school.", "options": ["all over the world", "in the pond", "by birth", "on the grass"], "answer": 1, "answerLabel": "B", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(B) in the pond\n【用語】in the pond (adv.phr.)：在池塘裡\n【中譯】你看！有些鴨子在我們學校後面的池塘裡游泳。", "explanationSource": "supplemental"}, {"id": 4, "question": "______, I didn't like dogs, but now I love them.", "options": ["At a low price", "In the world", "At first", "By hand"], "answer": 2, "answerLabel": "C", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(C) At first\n【用語】at first (adv.phr.)：起初、一開始\n【中譯】起初，我不喜歡狗，但現在我很愛牠們。", "explanationSource": "supplemental"}, {"id": 5, "question": "Mr. Lin sleeps only three hours a night to make money. He works ______, and now he is sick.", "options": ["at a high price", "by air", "in public", "at the cost of his health"], "answer": 3, "answerLabel": "D", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(D) at the cost of his health\n【用語】at the cost of health (adv.phr.)：以健康為代價\n【中譯】林先生為了賺錢每晚只睡三個小時。他以健康為代價工作，現在他生病了。", "explanationSource": "supplemental"}, {"id": 6, "question": "Amy moved to Taipei in 2020, and she has lived there ______.", "options": ["last year", "in a good way", "sooner or later", "ever since"], "answer": 3, "answerLabel": "D", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(D) ever since\n【用語】ever since (adv.phr.)：從那時起一直\n【中譯】Amy在2020年搬到台北，從那時起她就一直住在那裡。", "explanationSource": "supplemental"}, {"id": 7, "question": "In one minute, Ben ran ______ between the sofa and the door five times.", "options": ["to and fro", "for a long time", "than ever before", "on the moon"], "answer": 0, "answerLabel": "A", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(A) to and fro\n【用語】to and fro (adv.phr.)：來回地、往返地\n【中譯】一分鐘內，Ben在沙發和門之間來回跑了五次。", "explanationSource": "supplemental"}, {"id": 8, "question": "______, living in a big city is fun. On the other hand, it is very noisy.", "options": ["As a result", "By accident", "To make matters worse", "On the one hand"], "answer": 3, "answerLabel": "D", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(D) On the one hand\n【用語】on the one hand (adv.phr.)：一方面\n【中譯】一方面，住在大城市很有趣。另一方面，大城市很吵。", "explanationSource": "supplemental"}, {"id": 9, "question": "There are many people at the bus stop, so we have to wait ______.", "options": ["on the computer", "from the bottom of my heart", "in line", "in the sea"], "answer": 2, "answerLabel": "C", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(C) in line\n【用語】in line (adv.phr.)：排隊\n【中譯】公車站有很多人，所以我們必須排隊等候。", "explanationSource": "supplemental"}, {"id": 10, "question": "Tom has two dogs and three cats. He has five pets ______.", "options": ["by the same token", "on the river", "in total", "in a hurry"], "answer": 2, "answerLabel": "C", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(C) in total\n【用語】in total (adv.phr.)：總共；一共\n【中譯】Tom有兩隻狗和三隻貓。他總共有五隻寵物。", "explanationSource": "supplemental"}, {"id": 11, "question": "The teacher drew a big circle on the ground and told us to put the ball ______.", "options": ["in uniform", "by check", "before it's too late", "in the circle"], "answer": 3, "answerLabel": "D", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(D) in the circle\n【用語】in the circle (adv.phr.)：在圈內；在圓圈中\n【中譯】老師在地上畫了一個大圓圈，並叫我們把球放在圓圈裡。", "explanationSource": "supplemental"}, {"id": 12, "question": "At night, we can see the moon and stars ______.", "options": ["as I expected", "at lunchtime", "anything but", "in the sky"], "answer": 3, "answerLabel": "D", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(D) in the sky\n【用語】in the sky (adv.phr.)：在空中\n【中譯】晚上，我們可以看到天空中的月亮和星星。", "explanationSource": "supplemental"}, {"id": 13, "question": "Jack didn't understand the new word, so the teacher said it ______ until he remembered it.", "options": ["at a low price", "over and over again", "in the mountains", "before long"], "answer": 1, "answerLabel": "B", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(B) over and over again\n【用語】over and over (again) (adv.phr.)：一次又一次\n【中譯】Jack不懂這個新單字，所以老師一次又一次地唸，直到他記住為止。", "explanationSource": "supplemental"}, {"id": 14, "question": "I have never been to Japan, but I hope to go there ______.", "options": ["at that time", "at the corner", "last year", "some day"], "answer": 3, "answerLabel": "D", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(D) some day\n【用語】some day (adv.phr.)：將來有一天\n【中譯】我從來沒去過日本，但我希望將來有一天能去那裡。", "explanationSource": "supplemental"}, {"id": 15, "question": "Harry Potter books are popular ______. People in many countries read them.", "options": ["at the scene", "behind schedule", "on the moon", "all around the world"], "answer": 3, "answerLabel": "D", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(D) all around the world\n【用語】all around the world (adv.phr.)：全世界各地\n【中譯】哈利波特的書在全世界各地都很受歡迎。很多國家的人都讀這些書。", "explanationSource": "supplemental"}, {"id": 16, "question": "A: I'm going to the store now. ______, have you seen my red umbrella?\nB: It's behind the door.", "options": ["In the storm", "Nothing but", "By the way", "In short"], "answer": 2, "answerLabel": "C", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(C) By the way\n【用語】by the way (adv.phr.)：順便一提\n【中譯】A：我現在要去商店。順便問一下，你有看到我的紅色雨傘嗎？B：它在門後面。", "explanationSource": "supplemental"}, {"id": 17, "question": "Grandpa walks to the park every morning, ______. Even heavy rain can't stop him.", "options": ["rain or shine", "on the phone", "after all", "once in a while"], "answer": 0, "answerLabel": "A", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(A) rain or shine\n【用語】rain or shine (adv.phr.)：不論晴雨；無論如何\n【中譯】爺爺每天早上不論晴雨都走路去公園。連大雨也無法阻止他。", "explanationSource": "supplemental"}, {"id": 18, "question": "We waited for the bus for an hour. ______, it came.", "options": ["In advance", "For a while", "More often than not", "At last"], "answer": 3, "answerLabel": "D", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(D) At last\n【用語】at last (adv.phr.)：終於（帶有鬆一口氣的語氣）\n【中譯】我們等公車等了一個小時。終於，公車來了。", "explanationSource": "supplemental"}, {"id": 19, "question": "I want to be a doctor ______.", "options": ["on the market", "in the future", "in the past", "last year"], "answer": 1, "answerLabel": "B", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(B) in the future\n【用語】in the future (adv.phr.)：在未來\n【中譯】我將來想當一名醫生。", "explanationSource": "supplemental"}, {"id": 20, "question": "Mr. Wang moved to Kaohsiung, so he ______ lives next to us.", "options": ["as usual", "first of all", "no longer", "on the contrary"], "answer": 2, "answerLabel": "C", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(C) no longer\n【用語】no longer (adv.phr.)：不再\n【中譯】王先生搬到高雄了，所以他不再住在我們隔壁。", "explanationSource": "supplemental"}, {"id": 21, "question": "The new phone was too hard to use, so Grandma went ______ and used her old phone again.", "options": ["the day after tomorrow", "back to the old way", "by check", "one by one"], "answer": 1, "answerLabel": "B", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(B) back to the old way\n【用語】back to the old way (adv.phr.)：回到舊方式\n【中譯】新手機太難用了，所以奶奶回到舊方式，又用回她的舊手機。", "explanationSource": "supplemental"}, {"id": 22, "question": "We don't have school ______, so I often sleep late on Saturday.", "options": ["on the weekend", "at a high cost", "on weekdays", "in the water"], "answer": 0, "answerLabel": "A", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(A) on the weekend\n【用語】on the weekend (adv.phr.)：在週末\n【中譯】我們週末不用上學，所以我星期六常常睡到很晚。", "explanationSource": "supplemental"}, {"id": 23, "question": "Kevin gets up early ______ catch the first bus.", "options": ["so far", "in order to", "as usual", "in short"], "answer": 1, "answerLabel": "B", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(B) in order to\n【用語】in order to + VR (adv.phr.)：為了\n【中譯】Kevin早起是為了趕上第一班公車。", "explanationSource": "supplemental"}, {"id": 24, "question": "To stay healthy, you should eat vegetables and sleep well. ______, you must exercise every day. That is the key.", "options": ["No more than", "On the contrary", "Most importantly", "On the sidewalk"], "answer": 2, "answerLabel": "C", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(C) Most importantly\n【用語】most importantly (adv.phr.)：最重要的是\n【中譯】為了保持健康，你應該吃蔬菜並睡飽。最重要的是，你必須每天運動。那才是關鍵。", "explanationSource": "supplemental"}, {"id": 25, "question": "There is a bird's nest ______ near my window.", "options": ["on the cell phone", "last time we met", "in the ocean", "in the tree"], "answer": 3, "answerLabel": "D", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(D) in the tree\n【用語】in the tree (adv.phr.)：在樹上（不屬於樹的東西，如鳥、貓）\n【中譯】我窗戶附近的樹上有一個鳥巢。", "explanationSource": "supplemental"}, {"id": 26, "question": "A: How do you go to school?\nB: I go ______. The bus stop is in front of my house, and the ride takes only ten minutes.", "options": ["without fail", "on foot", "between meals", "by bus"], "answer": 3, "answerLabel": "D", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(D) by bus\n【用語】by train/bus/plane/taxi/ship (adv.phr.)：搭乘火車／公車／飛機／計程車／船\n【中譯】A：你怎麼去上學？B：我搭公車去。公車站就在我家前面，車程只要十分鐘。", "explanationSource": "supplemental"}, {"id": 27, "question": "Our class eats lunch together in the classroom ______ every school day.", "options": ["at lunchtime", "by air", "in the sea", "once in a while"], "answer": 0, "answerLabel": "A", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(A) at lunchtime\n【用語】at lunchtime (adv.phr.)：在午餐時間\n【中譯】我們班每個上學日的午餐時間都一起在教室吃午餐。", "explanationSource": "supplemental"}, {"id": 28, "question": "Dr. Chen is seventy, but he is still ______. He sees sick people every day.", "options": ["on vacation", "in general", "in practice", "all over the world"], "answer": 2, "answerLabel": "C", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(C) in practice\n【用語】in practice (adv.phr.)：在執業中\n【中譯】陳醫師七十歲了，但他仍在執業。他每天都看病人。", "explanationSource": "supplemental"}, {"id": 29, "question": "Kevin always does his homework ______, just before the teacher asks for it.", "options": ["that is", "at the last minute", "in advance", "all the way"], "answer": 1, "answerLabel": "B", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(B) at the last minute\n【用語】at the last minute (adv.phr.)：在最後一刻\n【中譯】Kevin總是在最後一刻才寫作業，就在老師要收作業之前。", "explanationSource": "supplemental"}, {"id": 30, "question": "It's six o'clock. Let's go home ______. It will be night soon.", "options": ["for sale", "before dark", "on a daily basis", "in no way"], "answer": 1, "answerLabel": "B", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(B) before dark\n【用語】before dark (adv.phr.)：天黑前\n【中譯】六點了。我們天黑前回家吧。很快就要入夜了。", "explanationSource": "supplemental"}, {"id": 31, "question": "Please stop smoking ______. Your family wants you to be healthy.", "options": ["in the world", "for example", "for your family's sake", "in the snow"], "answer": 2, "answerLabel": "C", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(C) for your family's sake\n【用語】for someone's/something's sake (adv.phr.)：為了……的緣故\n【中譯】為了你家人著想，請戒菸。你的家人希望你健康。", "explanationSource": "supplemental"}, {"id": 32, "question": "We had no money, so our plan to build a new park is ______ now.", "options": ["on the shelf", "at once", "in the sun", "so far"], "answer": 0, "answerLabel": "A", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(A) on the shelf\n【用語】on the shelf (adv.phr.)：被擱置\n【中譯】我們沒有錢，所以蓋新公園的計畫現在被擱置了。", "explanationSource": "supplemental"}, {"id": 33, "question": "It is warm in Kenting ______, so you can swim there even in winter.", "options": ["than usual", "on the tree", "all year round", "last night"], "answer": 2, "answerLabel": "C", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(C) all year round\n【用語】all year round (adv.phr.)：一年到頭\n【中譯】墾丁一年到頭都很溫暖，所以即使在冬天你也能在那裡游泳。", "explanationSource": "supplemental"}, {"id": 34, "question": "The new library was going to open in May, but it opened in March, two months ______.", "options": ["in person", "in the snow", "ahead of schedule", "behind schedule"], "answer": 2, "answerLabel": "C", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(C) ahead of schedule\n【用語】ahead of schedule (adv.phr.)：超前進度；比預定提早\n【中譯】新圖書館原本要在五月開幕，但它在三月就開了，比預定提早兩個月。", "explanationSource": "supplemental"}, {"id": 35, "question": "I went to bed at 11:00 ______, so I am tired this morning.", "options": ["the day after tomorrow", "in other words", "never ever", "last night"], "answer": 3, "answerLabel": "D", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(D) last night\n【用語】last night (adv.phr.)：昨晚\n【中譯】我昨晚十一點才睡，所以今天早上很累。", "explanationSource": "supplemental"}, {"id": 36, "question": "I read about the fire ______ this morning. It was on page 3.", "options": ["on the radio", "in the sun", "for good", "in the newspaper"], "answer": 3, "answerLabel": "D", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(D) in the newspaper\n【用語】in the newspaper (adv.phr.)：在報紙上\n【中譯】我今天早上在報紙上讀到那場火災的消息。它在第三版。", "explanationSource": "supplemental"}, {"id": 37, "question": "Ms. Lee didn't want other students to hear, so she talked to Tom ______.", "options": ["in public", "in private", "on business", "on average"], "answer": 1, "answerLabel": "B", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(B) in private\n【用語】in private (adv.phr.)：私下地；私底下\n【中譯】李老師不想讓其他學生聽到，所以她私下和Tom談話。", "explanationSource": "supplemental"}, {"id": 38, "question": "The package was sent from Japan to Taiwan ______, so it arrived in only two days.", "options": ["in a way", "by air", "on the CD player", "from door to door"], "answer": 1, "answerLabel": "B", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(B) by air\n【用語】by air (adv.phr.)：搭飛機；藉由空運\n【中譯】這個包裹是從日本空運寄到台灣的，所以只花兩天就到了。", "explanationSource": "supplemental"}, {"id": 39, "question": "A: Why did you push me?\nB: I'm sorry. I didn't do it ______. Someone pushed me first.", "options": ["in the sky", "on purpose", "at dinner", "in cash"], "answer": 1, "answerLabel": "B", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(B) on purpose\n【用語】on purpose (adv.phr.)：故意地\n【中譯】A：你為什麼推我？B：對不起。我不是故意的。是有人先推我的。", "explanationSource": "supplemental"}, {"id": 40, "question": "My favorite singer was ______ last night, so I watched the show at home.", "options": ["as well", "in my free time", "on TV", "with a check"], "answer": 2, "answerLabel": "C", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(C) on TV\n【用語】on TV (adv.phr.)：在電視節目中\n【中譯】我最喜歡的歌手昨晚上了電視節目，所以我在家看了那個節目。", "explanationSource": "supplemental"}, {"id": 41, "question": "The kids are sitting ______ in the living room, because there are no chairs.", "options": ["on the floor", "in bed", "of course", "for sure"], "answer": 0, "answerLabel": "A", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(A) on the floor\n【用語】on the floor (adv.phr.)：在地板上\n【中譯】孩子們坐在客廳的地板上，因為那裡沒有椅子。", "explanationSource": "supplemental"}, {"id": 42, "question": "I often play basketball with my classmates ______. We play for ten minutes before the next class starts.", "options": ["on the moon", "after class", "at a low price", "in the sea"], "answer": 1, "answerLabel": "B", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(B) after class\n【用語】after class (adv.phr.)：下課後\n【中譯】我常在下課後和同學打籃球。我們在下一堂課開始前打十分鐘。", "explanationSource": "supplemental"}, {"id": 43, "question": "My uncle grows rice and keeps chickens ______ in the country.", "options": ["in the ocean", "on the farm", "the day before yesterday", "behind schedule"], "answer": 1, "answerLabel": "B", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(B) on the farm\n【用語】on the farm (adv.phr.)：在田裡、在農場裡\n【中譯】我叔叔在鄉下的農場裡種稻、養雞。", "explanationSource": "supplemental"}, {"id": 44, "question": "Jason is ______, and he plays baseball with his teammates every Saturday.", "options": ["in a strange way", "on the whole", "on a team", "little by little"], "answer": 2, "answerLabel": "C", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(C) on a team\n【用語】on a team (adv.phr.)：在某個隊伍中\n【中譯】Jason 是一支球隊的隊員，他每週六和隊友們一起打棒球。", "explanationSource": "supplemental"}, {"id": 45, "question": "Mom, look! Your photo is ______ of the computer.", "options": ["on the screen", "for better or worse", "in the water", "best of all"], "answer": 0, "answerLabel": "A", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(A) on the screen\n【用語】on the screen (adv.phr.)：在螢光幕上\n【中譯】媽，你看！你的照片在電腦螢幕上。", "explanationSource": "supplemental"}, {"id": 46, "question": "Ben's home is very close to school, so he doesn't take the bus; he goes to school ______.", "options": ["on foot", "in the sky", "in the sea", "either way"], "answer": 0, "answerLabel": "A", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(A) on foot\n【用語】on foot (adv.phr.)：步行、走路\n【中譯】Ben 的家離學校很近，所以他不搭公車；他走路去上學。", "explanationSource": "supplemental"}, {"id": 47, "question": "Grandpa doesn't have a TV, so he listens to the news ______ every morning.", "options": ["on the radio", "in the newspaper", "in fact", "at all times"], "answer": 0, "answerLabel": "A", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(A) on the radio\n【用語】on the radio (adv.phr.)：在收音機裡\n【中譯】爺爺沒有電視，所以他每天早上收聽收音機裡的新聞。", "explanationSource": "supplemental"}, {"id": 48, "question": "The farmer is working ______ under the hot sun, planting rice.", "options": ["in the field", "in the ocean", "just in case", "in his bedroom"], "answer": 0, "answerLabel": "A", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(A) in the field\n【用語】in the field (adv.phr.)：在田野間\n【中譯】那位農夫正在炎熱的太陽下在田野間工作，種著稻子。", "explanationSource": "supplemental"}, {"id": 49, "question": "Kevin didn't study for the test. ______, he got a bad grade.", "options": ["As a result", "For example", "On his head", "From top to bottom"], "answer": 0, "answerLabel": "A", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(A) As a result\n【用語】as a result (adv.phr.)：因此\n【中譯】Kevin 沒有準備考試。因此，他考得很差。", "explanationSource": "supplemental"}, {"id": 50, "question": "A: It's going to rain this afternoon.\nB: ______, we should take an umbrella with us.", "options": ["In the living room", "In the past", "From bad to worse", "In that case"], "answer": 3, "answerLabel": "D", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(D) In that case\n【用語】in that case (adv.phr.)：如果那樣；在那種情況下\n【中譯】A：今天下午會下雨。\nB：如果那樣的話，我們應該帶把傘。", "explanationSource": "supplemental"}, {"id": 51, "question": "The cookies are ______ in the kitchen, but I can't reach them because I'm too short.", "options": ["on the top of the mountain", "as soon as possible", "in the pond", "on the shelf"], "answer": 3, "answerLabel": "D", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(D) on the shelf\n【用語】on the shelf (adv.phr.)：在架子上\n【中譯】餅乾在廚房的架子上，但我太矮了拿不到。", "explanationSource": "supplemental"}, {"id": 52, "question": "My aunt is a nurse ______, but she wants to be a doctor in the future.", "options": ["last year", "in the end", "at present", "from time to time"], "answer": 2, "answerLabel": "C", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(C) at present\n【用語】at present (adv.phr.)：目前\n【中譯】我阿姨目前是護理師，但她將來想當醫生。", "explanationSource": "supplemental"}, {"id": 53, "question": "Grandma made this sweater ______, not with a machine.", "options": ["by hand", "from then on", "at the same time", "at work"], "answer": 0, "answerLabel": "A", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(A) by hand\n【用語】by hand (adv.phr.)：用手工\n【中譯】奶奶是用手工織這件毛衣的，不是用機器。", "explanationSource": "supplemental"}, {"id": 54, "question": "Living in a big city is very convenient. ______, it is often noisy and crowded.", "options": ["In the beginning", "For example", "On the other hand", "After meals"], "answer": 2, "answerLabel": "C", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(C) On the other hand\n【用語】on the other hand (adv.phr.)：另一方面\n【中譯】住在大城市非常方便。另一方面，那裡常常又吵又擁擠。", "explanationSource": "supplemental"}, {"id": 55, "question": "We ran all the way to the station and got there ______ to catch the last train.", "options": ["in the past", "by accident", "in time", "on the line"], "answer": 2, "answerLabel": "C", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(C) in time\n【用語】in time (adv.phr.)：及時\n【中譯】我們一路跑到車站，及時趕上了最後一班火車。", "explanationSource": "supplemental"}, {"id": 56, "question": "Tom studied for five hours ______; he didn't even stop to eat or drink.", "options": ["throughout the world", "without a break", "in turn", "between meals"], "answer": 1, "answerLabel": "B", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(B) without a break\n【用語】without a break (adv.phr.)：不休息地；不停地\n【中譯】Tom 不休息地讀了五個小時的書；他甚至沒有停下來吃東西或喝水。", "explanationSource": "supplemental"}, {"id": 57, "question": "I usually play basketball with my friends ______, and then I go home for dinner.", "options": ["after school", "on the moon", "last time", "on the TV"], "answer": 0, "answerLabel": "A", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(A) after school\n【用語】after school (adv.phr.)：放學後\n【中譯】我通常放學後和朋友打籃球，然後回家吃晚餐。", "explanationSource": "supplemental"}, {"id": 58, "question": "This glass bowl breaks easily, so please carry it ______.", "options": ["with care", "above all", "in the pasture", "in a hurry"], "answer": 0, "answerLabel": "A", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(A) with care\n【用語】with care (adv.phr.)：小心地（= carefully）\n【中譯】這個玻璃碗很容易破，所以請小心地拿。", "explanationSource": "supplemental"}, {"id": 59, "question": "When astronauts are ______, they can look down and see the whole Earth.", "options": ["twice a week", "in space", "on the farm", "most important of all"], "answer": 1, "answerLabel": "B", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(B) in space\n【用語】in space (adv.phr.)：在太空中\n【中譯】當太空人在太空中時，他們可以往下看到整個地球。", "explanationSource": "supplemental"}, {"id": 60, "question": "Amy doesn't play the piano for money; she plays it just ______.", "options": ["on the bed", "a great deal", "for sale", "for fun"], "answer": 3, "answerLabel": "D", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(D) for fun\n【用語】for fun (adv.phr.)：為了樂趣；好玩\n【中譯】Amy 彈鋼琴不是為了賺錢；她只是為了好玩而彈。", "explanationSource": "supplemental"}, {"id": 61, "question": "These lions live in the zoo now, but they used to live ______ in Africa.", "options": ["on the spot", "in return", "on the sidewalk", "in the wild"], "answer": 3, "answerLabel": "D", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(D) in the wild\n【用語】in the wild (adv.phr.)：在野外\n【中譯】這些獅子現在住在動物園裡，但牠們以前住在非洲的野外。", "explanationSource": "supplemental"}, {"id": 62, "question": "Our team played two games ______ on Saturday, with no rest between them.", "options": ["back to back", "right away", "in the circle", "far from"], "answer": 0, "answerLabel": "A", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(A) back to back\n【用語】back to back (adv.phr.)：連續地\n【中譯】我們的隊伍星期六連續打了兩場比賽，中間沒有休息。", "explanationSource": "supplemental"}, {"id": 63, "question": "At the night market, you can buy food, clothes, toys, ______.", "options": ["from place to place", "and so on", "on weekdays", "at once"], "answer": 1, "answerLabel": "B", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(B) and so on\n【用語】and so on (adv.phr.)：等、諸如此類\n【中譯】在夜市，你可以買到食物、衣服、玩具等等。", "explanationSource": "supplemental"}, {"id": 64, "question": "Many people have helped us, and ______ we have collected 5,000 books for the poor children.", "options": ["by ourselves", "off the record", "to date", "the day after tomorrow"], "answer": 2, "answerLabel": "C", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(C) to date\n【用語】to date (adv.phr.)：到目前為止\n【中譯】很多人幫助了我們，到目前為止我們已經為貧困的孩子們收集了五千本書。", "explanationSource": "supplemental"}, {"id": 65, "question": "I got up late this morning. ______, it started to rain on my way to school.", "options": ["Best of all", "In the first place", "In cash", "To make matters worse"], "answer": 3, "answerLabel": "D", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(D) To make matters worse\n【用語】to make matters worse (adv.phr.)：更糟的是\n【中譯】我今天早上起晚了。更糟的是，在上學途中開始下雨了。", "explanationSource": "supplemental"}, {"id": 66, "question": "I met my old classmate ______ at the supermarket yesterday; we didn't plan it at all.", "options": ["by chance", "on my right", "in this way", "on purpose"], "answer": 0, "answerLabel": "A", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(A) by chance\n【用語】by chance (adv.phr.)：偶然地；碰巧\n【中譯】我昨天在超市碰巧遇到我的老同學；我們完全沒有事先約好。", "explanationSource": "supplemental"}, {"id": 67, "question": "My little sister is only six, but she can tie her shoes ______ without anyone's help.", "options": ["not even", "for good", "on her own", "on time"], "answer": 2, "answerLabel": "C", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(C) on her own\n【用語】on one's own (adv.phr.)：獨自地、靠自己\n【中譯】我妹妹才六歲，但她可以不靠任何人幫忙，自己綁鞋帶。", "explanationSource": "supplemental"}, {"id": 68, "question": "This hotel has a big swimming pool. ______, it has a free gym for its guests.", "options": ["Around the corner", "On the contrary", "In other words", "In addition"], "answer": 3, "answerLabel": "D", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(D) In addition\n【用語】in addition (adv.phr.)：此外\n【中譯】這家飯店有一座大游泳池。此外，它還有一間供房客免費使用的健身房。", "explanationSource": "supplemental"}, {"id": 69, "question": "In this game, you can change the color of your car ______; just click the button whenever you want.", "options": ["at will", "in the river", "behind schedule", "to your surprise"], "answer": 0, "answerLabel": "A", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(A) at will\n【用語】at will (adv.phr.)：任意、隨心所欲地\n【中譯】在這個遊戲裡，你可以隨心所欲地改變車子的顏色；想改的時候按下按鈕就好。", "explanationSource": "supplemental"}, {"id": 70, "question": "The school bought these computers ______, not for playing games.", "options": ["now and then", "for learning purposes", "by no means", "with a check"], "answer": 1, "answerLabel": "B", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(B) for learning purposes\n【用語】for + N + purposes (adv.phr.)：為了…目的\n【中譯】學校買這些電腦是為了學習的目的，不是為了玩遊戲。", "explanationSource": "supplemental"}, {"id": 71, "question": "The movie started at seven, and Tim arrived ______, so he missed only the first few minutes.", "options": ["soon after", "in the present", "some day", "on the mountainside"], "answer": 0, "answerLabel": "A", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(A) soon after\n【用語】soon after (adv.phr.)：不久之後\n【中譯】電影七點開始，Tim 不久之後就到了，所以他只錯過了開頭幾分鐘。", "explanationSource": "supplemental"}, {"id": 72, "question": "This plan sounds easy, but ______ it is very hard to do.", "options": ["at a low price", "in the opposite way", "in practice", "as follows"], "answer": 2, "answerLabel": "C", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(C) in practice\n【用語】in practice (adv.phr.)：實際上\n【中譯】這個計畫聽起來很簡單，但實際上很難做到。", "explanationSource": "supplemental"}, {"id": 73, "question": "I was late for school three times this week, so ______ I will get up earlier.", "options": ["from now on", "last night", "in the corner", "all day long"], "answer": 0, "answerLabel": "A", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(A) from now on\n【用語】from now on (adv.phr.)：從現在起\n【中譯】我這週上學遲到了三次，所以從現在起我會早點起床。", "explanationSource": "supplemental"}, {"id": 74, "question": "We have lived in this house for ten years, but we are moving tomorrow, so tonight we will sleep here ______.", "options": ["for the last time", "the day before yesterday", "for the first time", "since then"], "answer": 0, "answerLabel": "A", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(A) for the last time\n【用語】for the last time (adv.phr.)：最後一次\n【中譯】我們在這間房子住了十年，但我們明天就要搬家了，所以今晚是我們最後一次睡在這裡。", "explanationSource": "supplemental"}, {"id": 75, "question": "This elevator can take ten people ______, so we can't all get in together.", "options": ["at least", "at most", "in the same way", "in the ocean"], "answer": 1, "answerLabel": "B", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(B) at most\n【用語】at most (adv.phr.)：最多；至多\n【中譯】這台電梯最多只能載十個人，所以我們沒辦法全部一起進去。", "explanationSource": "supplemental"}, {"id": 76, "question": "The food in this restaurant is delicious. ______ the prices are very low.", "options": ["On the corner,", "What's more,", "For sale,", "On the contrary,"], "answer": 1, "answerLabel": "B", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(B) What's more,\n【用語】What's more, (adv.phr.)：而且；更重要的是\n【中譯】這家餐廳的食物很好吃。而且，價格很便宜。", "explanationSource": "supplemental"}, {"id": 77, "question": "The children are ______ in the park; they are flying kites and having fun.", "options": ["in a hurry", "in bed", "at play", "on the school team"], "answer": 2, "answerLabel": "C", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(C) at play\n【用語】at play (adv.phr.)：正在玩耍\n【中譯】孩子們正在公園裡玩耍；他們在放風箏，玩得很開心。", "explanationSource": "supplemental"}, {"id": 78, "question": "Kevin has changed ______ since he moved to Japan; he looks very different now.", "options": ["at times", "on his back", "for nothing", "a lot"], "answer": 3, "answerLabel": "D", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(D) a lot\n【用語】a lot (adv.phr.)：很多（放在動詞後）\n【中譯】Kevin 搬到日本後改變了很多；他現在看起來很不一樣。", "explanationSource": "supplemental"}, {"id": 79, "question": "Doctors say children should sleep ______ nine hours every night, not less.", "options": ["on vacation", "at least", "in alphabetical order", "after meals"], "answer": 1, "answerLabel": "B", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(B) at least\n【用語】at least (adv.phr.)：至少\n【中譯】醫生說孩子們每晚應該至少睡九個小時，不能更少。", "explanationSource": "supplemental"}, {"id": 80, "question": "The blue whale is the biggest animal ______.", "options": ["at the cost of the environment", "on earth", "way too big", "in the sky"], "answer": 1, "answerLabel": "B", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(B) on earth\n【用語】on earth (adv.phr.)：在世界上\n【中譯】藍鯨是世界上最大的動物。", "explanationSource": "supplemental"}, {"id": 81, "question": "It takes ______ an hour to get to the zoo by bus; it's about 55 to 65 minutes.", "options": ["on the ranch", "never ever", "in the dark", "more or less"], "answer": 3, "answerLabel": "D", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(D) more or less\n【用語】more or less (adv.phr.)：或多或少、差不多\n【中譯】搭公車到動物園差不多要一個小時；大約五十五到六十五分鐘。", "explanationSource": "supplemental"}, {"id": 82, "question": "Taipei 101 is ______ one of the most famous buildings in Taiwan.", "options": ["in turn", "without a doubt", "at the scene", "on Mondays"], "answer": 1, "answerLabel": "B", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(B) without a doubt\n【用語】without (a) doubt (adv.phr.)：毫無疑問地\n【中譯】台北101毫無疑問是台灣最有名的建築之一。", "explanationSource": "supplemental"}, {"id": 83, "question": "The picture on the wall is hanging ______, so please make it straight.", "options": ["on the floor", "worst of all", "at an angle", "better yet"], "answer": 2, "answerLabel": "C", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(C) at an angle\n【用語】at an angle (adv.phr.)：傾斜地；成一個角度\n【中譯】牆上的畫掛歪了，所以請把它弄正。", "explanationSource": "supplemental"}, {"id": 84, "question": "I couldn't find this book in any store, so I bought it ______.", "options": ["as soon as you can", "on the Internet", "the other way around", "on the moon"], "answer": 1, "answerLabel": "B", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(B) on the Internet\n【用語】on the Internet (adv.phr.)：在網路上\n【中譯】我在任何一家店都找不到這本書，所以我在網路上買了它。", "explanationSource": "supplemental"}, {"id": 85, "question": "I lost my wallet on the bus. ______ my phone was in it, too.", "options": ["By check,", "Out of the blue,", "What's worse,", "Best of all,"], "answer": 2, "answerLabel": "C", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(C) What's worse,\n【用語】What's worse, (adv.phr.)：更糟的是\n【中譯】我在公車上弄丟了錢包。更糟的是，我的手機也在裡面。", "explanationSource": "supplemental"}, {"id": 86, "question": "This restaurant is very popular, so you need to call and book a table ______.", "options": ["in advance", "in public", "at the last minute", "to this end"], "answer": 0, "answerLabel": "A", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(A) in advance\n【用語】in advance (adv.phr.)：事先\n【中譯】這家餐廳很受歡迎，所以你需要事先打電話訂位。", "explanationSource": "supplemental"}, {"id": 87, "question": "What ______ happened to your room? It's a big mess!", "options": ["to and fro", "in the tree", "with a credit card", "on earth"], "answer": 3, "answerLabel": "D", "source": "副詞片語 Adverb Phrases", "explanation": "【答案】(D) on earth\n【用語】on earth (adv.phr.)：到底、究竟\n【中譯】你的房間到底發生了什麼事？簡直一團亂！", "explanationSource": "supplemental"}]};</script><script>window.LEARN_DATA=[{"g": "", "t": "a great/good deal", "p": "(adv.phr.)", "e": "very much; a lot", "z": "很、許多", "s": "Lin Mei-ling studied _____ _____ _____ for the English test last month, so she was very happy when she got a high score.", "c": "林美玲上個月為了英文考試讀了【很多】書，所以她拿到高分時非常開心。", "f": "Lin Mei-ling studied a great deal for the English test last month, so she was very happy when she got a high score."}, {"g": "", "t": "a lot", "p": "(adv.phr.)", "e": "very much (after a verb)", "z": "很多（放在動詞後）", "s": "Ben has grown _____ _____ this year, so his mom needs to buy him new school uniforms and bigger shoes.", "c": "班今年長高【很多】，所以他媽媽需要幫他買新的制服和更大的鞋子。", "f": "Ben has grown a lot this year, so his mom needs to buy him new school uniforms and bigger shoes."}, {"g": "", "t": "above all", "p": "(adv.phr.)", "e": "most importantly", "z": "最重要的是", "s": "When you ride a bike to school, you should wear a helmet and watch the traffic, but _____ _____, never use your phone.", "c": "你騎腳踏車上學時，應該戴安全帽並注意交通，但【最重要的是】，絕對不要使用手機。", "f": "When you ride a bike to school, you should wear a helmet and watch the traffic, but above all, never use your phone."}, {"g": "", "t": "after all", "p": "(adv.phr.)", "e": "remember that; in the end", "z": "終究、畢竟", "s": "Don't be too angry with your little brother for breaking the cup; _____ _____, he is only four years old.", "c": "別因為你弟弟打破杯子就太生氣，【畢竟】他才四歲。", "f": "Don't be too angry with your little brother for breaking the cup; after all, he is only four years old."}, {"g": "", "t": "after class", "p": "(adv.phr.)", "e": "when a class finishes", "z": "下課後", "s": "If you have any questions about the homework, you can come and talk to me _____ _____ in the teachers' office.", "c": "如果你對作業有任何問題，可以【下課後】到教師辦公室來找我談。", "f": "If you have any questions about the homework, you can come and talk to me after class in the teachers' office."}, {"g": "", "t": "after meals", "p": "(adv.phr.)", "e": "when you have finished eating", "z": "飯後", "s": "The doctor told Grandma to take this medicine three times a day _____ _____, so she keeps it on the dining table.", "c": "醫生要奶奶每天三次【飯後】吃這個藥，所以她把藥放在餐桌上。", "f": "The doctor told Grandma to take this medicine three times a day after meals, so she keeps it on the dining table."}, {"g": "", "t": "after school", "p": "(adv.phr.)", "e": "when school finishes for the day", "z": "放學後", "s": "My friends and I often play basketball _____ _____, but today we have to go home early because of the typhoon.", "c": "我和朋友們常常【放學後】打籃球，但今天因為颱風，我們必須早點回家。", "f": "My friends and I often play basketball after school, but today we have to go home early because of the typhoon."}, {"g": "", "t": "ahead of schedule", "p": "(adv.phr.)", "e": "earlier than planned", "z": "超前進度；比預定提早", "s": "Thanks to good weather, the workers finished the new library _____ _____ _____, so it opened a month early.", "c": "多虧好天氣，工人們【超前進度】蓋好了新圖書館，所以它提早一個月開放。", "f": "Thanks to good weather, the workers finished the new library ahead of schedule, so it opened a month early."}, {"g": "", "t": "all around the world", "p": "(adv.phr.)", "e": "in many places on earth", "z": "全世界各地", "s": "My uncle is a pilot, so he flies _____ _____ _____ _____ and sends us postcards from many countries.", "c": "我叔叔是機師，所以他飛遍【全世界各地】，還從很多國家寄明信片給我們。", "f": "My uncle is a pilot, so he flies all around the world and sends us postcards from many countries."}, {"g": "", "t": "all day long", "p": "(adv.phr.)", "e": "for the whole day", "z": "一整天", "s": "It rained _____ _____ _____ on Saturday, so the children stayed at home and played board games with their parents.", "c": "星期六雨下了【一整天】，所以孩子們待在家裡和爸媽玩桌遊。", "f": "It rained all day long on Saturday, so the children stayed at home and played board games with their parents."}, {"g": "", "t": "all over the world", "p": "(adv.phr.)", "e": "in every part of the world", "z": "全世界各地", "s": "People _____ _____ _____ _____ love Taiwanese bubble tea, and you can even buy it in London and New York.", "c": "【全世界各地】的人都喜歡台灣珍珠奶茶，你甚至在倫敦和紐約都買得到。", "f": "People all over the world love Taiwanese bubble tea, and you can even buy it in London and New York."}, {"g": "", "t": "all over/around the world", "p": "(adv.phr.)", "e": "in every part of the world", "z": "世界各地、全世界", "s": "People _____ _____ _____ _____ love Taiwanese bubble tea, and you can find shops selling it in many big cities.", "c": "【世界各地】的人都喜歡台灣珍珠奶茶，在許多大城市都能找到賣它的店。", "f": "People all over the world love Taiwanese bubble tea, and you can find shops selling it in many big cities."}, {"g": "", "t": "all the way", "p": "(adv.phr.)", "e": "for the whole trip or distance", "z": "一路上；全程", "s": "My little sister slept _____ _____ _____ from Taipei to Kaohsiung on the high-speed rail, so she missed the view.", "c": "我妹妹搭高鐵從台北到高雄【一路上】都在睡覺，所以錯過了沿途風景。", "f": "My little sister slept all the way from Taipei to Kaohsiung on the high-speed rail, so she missed the view."}, {"g": "", "t": "all year round", "p": "(adv.phr.)", "e": "during the whole year", "z": "一年到頭", "s": "Kenting is warm _____ _____ _____, so many tourists go swimming there even in December and January.", "c": "墾丁【一年到頭】都很溫暖，所以即使在十二月和一月，也有很多遊客去那裡游泳。", "f": "Kenting is warm all year round, so many tourists go swimming there even in December and January."}, {"g": "", "t": "and so on", "p": "(adv.phr.)", "e": "and other similar things", "z": "等、諸如此類", "s": "In our school club, we play many board games, like chess, Monopoly, UNO, _____ _____ _____, and everyone has a great time.", "c": "在我們的學校社團裡，我們玩很多桌遊，像是西洋棋、大富翁、UNO【等等】，每個人都玩得很開心。", "f": "In our school club, we play many board games, like chess, Monopoly, UNO, and so on, and everyone has a great time."}, {"g": "", "t": "anything but + adj./N", "p": "(adv.phr.)", "e": "not at all", "z": "根本不、絕不", "s": "The movie was _____ _____ interesting, so my sister and I fell asleep before it ended and missed the last part.", "c": "那部電影【根本不】有趣，所以我姊姊和我在電影結束前就睡著了，錯過了最後一段。", "f": "The movie was anything but interesting, so my sister and I fell asleep before it ended and missed the last part."}, {"g": "", "t": "around the clock", "p": "(adv.phr.)", "e": "all day and all night", "z": "不眠不休地、日以繼夜地", "s": "The nurses at the hospital worked _____ _____ _____ during the typhoon because many people were hurt and needed help.", "c": "颱風期間，醫院的護理師【日以繼夜地】工作，因為很多人受傷需要幫助。", "f": "The nurses at the hospital worked around the clock during the typhoon because many people were hurt and needed help."}, {"g": "", "t": "around the corner", "p": "(adv.phr.)", "e": "coming very soon", "z": "即將來臨", "s": "Chinese New Year is just _____ _____ _____, so Mom is busy cleaning the house and buying food for the big family dinner.", "c": "農曆新年【即將來臨】，所以媽媽忙著打掃房子，並為家族團圓飯採買食物。", "f": "Chinese New Year is just around the corner, so Mom is busy cleaning the house and buying food for the big family dinner."}, {"g": "", "t": "as a result", "p": "(adv.phr.)", "e": "because of this", "z": "因此", "s": "Tina stayed up late playing games every night; _____ _____ _____, she often fell asleep in class and got poor grades.", "c": "蒂娜每晚熬夜打電動，【因此】她常在課堂上睡著，成績也很差。", "f": "Tina stayed up late playing games every night; as a result, she often fell asleep in class and got poor grades."}, {"g": "", "t": "as follows", "p": "(adv.phr.)", "e": "like what comes next", "z": "如下", "s": "The teacher said that the rules for the class picnic are _____ _____: bring your own water, stay with your group, and clean up after lunch.", "c": "老師說班級野餐的規則【如下】：自己帶水、跟著小組行動、午餐後要清理乾淨。", "f": "The teacher said that the rules for the class picnic are as follows: bring your own water, stay with your group, and clean up after lunch."}, {"g": "", "t": "as I expected", "p": "(adv.phr.)", "e": "in the way I thought it would be", "z": "如我所料", "s": "_____ _____ _____, the math test was very difficult, so many students in my class didn't finish it on time.", "c": "【如我所料】，數學考試非常難，所以我們班很多同學沒在時間內寫完。", "f": "As I expected, the math test was very difficult, so many students in my class didn't finish it on time."}, {"g": "", "t": "as soon as possible", "p": "(adv.phr.)", "e": "very quickly; as fast as you can", "z": "盡快", "s": "Please return the library books _____ _____ _____ _____ because many other students are waiting to borrow them.", "c": "請【盡快】歸還圖書館的書，因為還有很多同學在等著借。", "f": "Please return the library books as soon as possible because many other students are waiting to borrow them."}, {"g": "", "t": "as soon as you can", "p": "(adv.phr.)", "e": "as quickly as you are able", "z": "你能多快就多快；盡快", "s": "Grandma is sick in the hospital, so please come home _____ _____ _____ _____ _____ after school today.", "c": "奶奶生病住院了，所以今天放學後請你【盡快】回家。", "f": "Grandma is sick in the hospital, so please come home as soon as you can after school today."}, {"g": "", "t": "as usual", "p": "(adv.phr.)", "e": "in the same way as always", "z": "照例、像往常一樣", "s": "_____ _____, Grandma got up at five o'clock and went to the park to do tai chi with her friends before breakfast.", "c": "【像往常一樣】，奶奶五點起床，在早餐前去公園和朋友打太極拳。", "f": "As usual, Grandma got up at five o'clock and went to the park to do tai chi with her friends before breakfast."}, {"g": "", "t": "as well", "p": "(adv.phr.)", "e": "too; also", "z": "也", "s": "Ben ordered a big bowl of beef noodles, and he ordered some dumplings _____ _____ because he was really hungry after soccer practice.", "c": "班點了一大碗牛肉麵，他【也】點了一些水餃，因為足球練習後他真的很餓。", "f": "Ben ordered a big bowl of beef noodles, and he ordered some dumplings as well because he was really hungry after soccer practice."}, {"g": "", "t": "at a high cost", "p": "(adv.phr.)", "e": "by paying or losing a lot", "z": "付出高昂代價", "s": "Our team won the final game, but _____ _____ _____ _____, because two of our best players got hurt.", "c": "我們隊贏了決賽，但【付出了高昂代價】，因為兩名最好的球員受傷了。", "f": "Our team won the final game, but at a high cost, because two of our best players got hurt."}, {"g": "", "t": "at a high price", "p": "(adv.phr.)", "e": "for a lot of money", "z": "以高價", "s": "That old baseball card was sold _____ _____ _____ _____ because a famous player wrote his name on it many years ago.", "c": "那張舊棒球卡【以高價】賣出，因為很多年前一位知名球員在上面簽了名。", "f": "That old baseball card was sold at a high price because a famous player wrote his name on it many years ago."}, {"g": "", "t": "at a low price", "p": "(adv.phr.)", "e": "for little money", "z": "以低價", "s": "If you go to the market just before it closes, you can often buy fresh vegetables _____ _____ _____ _____.", "c": "如果你在市場快打烊前去，常常可以【以低價】買到新鮮蔬菜。", "f": "If you go to the market just before it closes, you can often buy fresh vegetables at a low price."}, {"g": "", "t": "at all times", "p": "(adv.phr.)", "e": "always", "z": "總是、一直", "s": "Swimmers must stay near the lifeguard _____ _____ _____ because the waves at this beach can be very strong in summer.", "c": "游泳的人必須【一直】待在救生員附近，因為這個海灘夏天的浪可能很大。", "f": "Swimmers must stay near the lifeguard at all times because the waves at this beach can be very strong in summer."}, {"g": "", "t": "at an angle", "p": "(adv.phr.)", "e": "not straight; leaning to one side", "z": "傾斜地；成一個角度", "s": "The picture on the wall was hanging _____ _____ _____, so Mom asked me to make it straight before the guests arrived.", "c": "牆上的畫掛得【歪歪斜斜的】，所以媽媽叫我在客人到之前把它掛正。", "f": "The picture on the wall was hanging at an angle, so Mom asked me to make it straight before the guests arrived."}, {"g": "", "t": "at dinner", "p": "(adv.phr.)", "e": "eating dinner", "z": "正在吃晚餐", "s": "When the phone rang last night, our whole family was _____ _____, so nobody wanted to get up and answer it.", "c": "昨晚電話響的時候，我們全家【正在吃晚餐】，所以沒有人想起身去接。", "f": "When the phone rang last night, our whole family was at dinner, so nobody wanted to get up and answer it."}, {"g": "", "t": "at first", "p": "(adv.phr.)", "e": "in the beginning", "z": "起初、一開始", "s": "_____ _____, I was afraid of the big dog next door, but now we are good friends and I walk him every evening.", "c": "【起初】我很怕隔壁的大狗，但現在我們是好朋友，我每天傍晚都會帶牠去散步。", "f": "At first, I was afraid of the big dog next door, but now we are good friends and I walk him every evening."}, {"g": "", "t": "at hand", "p": "(adv.phr.)", "e": "close by and easy to reach", "z": "在手邊", "s": "Always keep a flashlight and some water _____ _____ during typhoon season, because the power may go out at night.", "c": "颱風季節時，一定要把手電筒和一些水放在【手邊】，因為晚上可能會停電。", "f": "Always keep a flashlight and some water at hand during typhoon season, because the power may go out at night."}, {"g": "", "t": "at last", "p": "(adv.phr.)", "e": "finally, after waiting a long time", "z": "終於（帶有鬆一口氣的語氣）", "s": "We waited at the airport for almost three hours because of the storm, and _____ _____ Grandpa's plane landed safely.", "c": "因為暴風雨，我們在機場等了將近三個小時，【終於】爺爺的飛機平安降落了。", "f": "We waited at the airport for almost three hours because of the storm, and at last Grandpa's plane landed safely."}, {"g": "", "t": "at least", "p": "(adv.phr.)", "e": "not less than", "z": "至少", "s": "The doctor told my dad to walk _____ _____ thirty minutes every day because exercise is good for his heart.", "c": "醫生叫我爸爸每天【至少】走路三十分鐘，因為運動對他的心臟有好處。", "f": "The doctor told my dad to walk at least thirty minutes every day because exercise is good for his heart."}, {"g": "", "t": "at lunchtime", "p": "(adv.phr.)", "e": "during the time for lunch", "z": "在午餐時間", "s": "Many students go to the school library _____ _____ because it is quiet and cool, and they can read comics there.", "c": "很多學生【在午餐時間】去學校圖書館，因為那裡安靜又涼爽，而且可以看漫畫。", "f": "Many students go to the school library at lunchtime because it is quiet and cool, and they can read comics there."}, {"g": "", "t": "at most", "p": "(adv.phr.)", "e": "not more than a number", "z": "最多；至多", "s": "The trip to the night market will cost us three hundred dollars _____ _____, so please don't bring too much money with you.", "c": "去夜市的這趟【最多】只會花我們三百元，所以請不要帶太多錢在身上。", "f": "The trip to the night market will cost us three hundred dollars at most, so please don't bring too much money with you."}, {"g": "", "t": "at once", "p": "(adv.phr.)", "e": "right now; immediately", "z": "立刻", "s": "When Mom saw smoke coming from the kitchen, she turned off the stove _____ _____ and opened all the windows.", "c": "媽媽看到廚房冒煙時，【立刻】關掉爐火，並打開所有窗戶。", "f": "When Mom saw smoke coming from the kitchen, she turned off the stove at once and opened all the windows."}, {"g": "", "t": "at play", "p": "(adv.phr.)", "e": "playing", "z": "正在玩耍", "s": "The children were happily _____ _____ in the park when the rain started, so they ran under a big tree to stay dry.", "c": "孩子們正在公園裡開心地【玩耍】時開始下雨了，所以他們跑到一棵大樹下躲雨。", "f": "The children were happily at play in the park when the rain started, so they ran under a big tree to stay dry."}, {"g": "", "t": "at present", "p": "(adv.phr.)", "e": "now; at this time", "z": "目前", "s": "My uncle used to work in a bank, but _____ _____ he runs a small breakfast shop near the train station.", "c": "我叔叔以前在銀行工作，但他【目前】在火車站附近經營一家小早餐店。", "f": "My uncle used to work in a bank, but at present he runs a small breakfast shop near the train station."}, {"g": "", "t": "at that time", "p": "(adv.phr.)", "e": "then; at a time in the past", "z": "當時", "s": "I lived in Tainan when I was eight, and _____ _____ _____ I walked to school with my best friend every morning.", "c": "我八歲時住在台南，【當時】我每天早上都和最好的朋友一起走路上學。", "f": "I lived in Tainan when I was eight, and at that time I walked to school with my best friend every morning."}, {"g": "", "t": "at the corner", "p": "(adv.phr.)", "e": "in the place where two streets meet", "z": "在轉角處附近（強調位置）", "s": "Turn left after the bank, and you will see a small bookstore _____ _____ _____ next to the bus stop.", "c": "過了銀行後左轉，你就會看到公車站旁邊【轉角處】有一間小書店。", "f": "Turn left after the bank, and you will see a small bookstore at the corner next to the bus stop."}, {"g": "", "t": "at the cost of health", "p": "(adv.phr.)", "e": "while hurting your health", "z": "以健康為代價", "s": "Some students study until three in the morning, but getting good grades _____ _____ _____ _____ _____ is not a smart choice.", "c": "有些學生讀書讀到凌晨三點，但【以健康為代價】換取好成績並不是明智的選擇。", "f": "Some students study until three in the morning, but getting good grades at the cost of health is not a smart choice."}, {"g": "", "t": "at the cost of the environment", "p": "(adv.phr.)", "e": "while hurting nature", "z": "以環境為代價", "s": "The factory made a lot of money, but it grew _____ _____ _____ _____ _____ _____ because it polluted the river.", "c": "那間工廠賺了很多錢，但它的成長是【以環境為代價】，因為它污染了河川。", "f": "The factory made a lot of money, but it grew at the cost of the environment because it polluted the river."}, {"g": "", "t": "at the last minute", "p": "(adv.phr.)", "e": "at the latest possible time", "z": "在最後一刻", "s": "David always studies for tests _____ _____ _____ _____, so he often stays up very late and feels tired in class.", "c": "大衛總是在【最後一刻】才準備考試，所以他常常熬夜到很晚，上課時覺得很累。", "f": "David always studies for tests at the last minute, so he often stays up very late and feels tired in class."}, {"g": "", "t": "at the same time", "p": "(adv.phr.)", "e": "together, at one moment", "z": "同時", "s": "Many teenagers like to listen to music and do their homework _____ _____ _____ _____, but it can be hard to focus.", "c": "很多青少年喜歡【同時】聽音樂和寫作業，但這樣可能很難專心。", "f": "Many teenagers like to listen to music and do their homework at the same time, but it can be hard to focus."}, {"g": "", "t": "at the scene", "p": "(adv.phr.)", "e": "at the place where something happened", "z": "當場；在現場", "s": "A car hit a scooter near our school, and the police arrived _____ _____ _____ just five minutes after someone called them.", "c": "一輛車在我們學校附近撞到機車，有人報警後才五分鐘，警察就抵達【現場】。", "f": "A car hit a scooter near our school, and the police arrived at the scene just five minutes after someone called them."}, {"g": "", "t": "at times", "p": "(adv.phr.)", "e": "sometimes", "z": "有時候", "s": "Living in a big city is exciting, but _____ _____ I miss the quiet life and fresh air in my grandparents' village.", "c": "住在大城市很刺激，但我【有時候】會想念祖父母村子裡安靜的生活和新鮮的空氣。", "f": "Living in a big city is exciting, but at times I miss the quiet life and fresh air in my grandparents' village."}, {"g": "", "t": "at will", "p": "(adv.phr.)", "e": "whenever or however you want", "z": "任意、隨心所欲地", "s": "In this summer camp, the kids cannot leave the camp _____ _____; they must tell a teacher before they go anywhere.", "c": "在這個夏令營裡，孩子們不能【任意】離開營地；他們去任何地方之前都必須告訴老師。", "f": "In this summer camp, the kids cannot leave the camp at will; they must tell a teacher before they go anywhere."}, {"g": "", "t": "at work", "p": "(adv.phr.)", "e": "at the place where you work; working", "z": "在工作中；在上班", "s": "My dad is still _____ _____ right now, so please call him again after seven when he comes home for dinner.", "c": "我爸爸現在還【在上班】，所以請在七點他回家吃晚餐後再打給他。", "f": "My dad is still at work right now, so please call him again after seven when he comes home for dinner."}, {"g": "", "t": "back to back", "p": "(adv.phr.)", "e": "one right after another", "z": "連續地", "s": "Our team played two games _____ _____ _____ on Saturday, so we were very tired and hungry when we got home.", "c": "我們隊星期六【連續】打了兩場比賽，所以回到家時又累又餓。", "f": "Our team played two games back to back on Saturday, so we were very tired and hungry when we got home."}, {"g": "", "t": "back to the old way", "p": "(adv.phr.)", "e": "returning to the way things were before", "z": "回到舊方式", "s": "The new online system was too slow, so the school went _____ _____ _____ _____ _____ and used paper forms again.", "c": "新的線上系統太慢了，所以學校又【回到舊方式】，重新使用紙本表格。", "f": "The new online system was too slow, so the school went back to the old way and used paper forms again."}, {"g": "", "t": "before dark", "p": "(adv.phr.)", "e": "before night comes", "z": "天黑前", "s": "Mom told us to come home _____ _____ because the mountain road is dangerous when there are no lights.", "c": "媽媽叫我們要在【天黑前】回家，因為沒有路燈時山路很危險。", "f": "Mom told us to come home before dark because the mountain road is dangerous when there are no lights."}, {"g": "", "t": "before it's too late", "p": "(adv.phr.)", "e": "while there is still time to do it", "z": "在一切來不及之前", "s": "You should tell your mom the truth about the broken vase _____ _____ _____ _____, or she will be even angrier later.", "c": "你應該【趁還來得及】把花瓶打破的事老實告訴媽媽，不然她之後會更生氣。", "f": "You should tell your mom the truth about the broken vase before it's too late, or she will be even angrier later."}, {"g": "", "t": "before long", "p": "(adv.phr.)", "e": "soon; after a short time", "z": "很快、不久", "s": "Jenny started to learn the guitar last month, and _____ _____ she was able to play a simple song for her parents at dinner.", "c": "珍妮上個月開始學吉他，【不久】她就能在晚餐時為爸媽彈一首簡單的歌。", "f": "Jenny started to learn the guitar last month, and before long she was able to play a simple song for her parents at dinner."}, {"g": "", "t": "behind schedule", "p": "(adv.phr.)", "e": "later than planned", "z": "落後進度", "s": "Our group is _____ _____ on the class poster because two members were sick, so we must work this weekend.", "c": "因為兩位組員生病，我們這組的班級海報【進度落後】，所以這個週末必須趕工。", "f": "Our group is behind schedule on the class poster because two members were sick, so we must work this weekend."}, {"g": "", "t": "best of all", "p": "(adv.phr.)", "e": "the best thing is", "z": "最棒的是", "s": "The hotel had a big pool and free breakfast, and _____ _____ _____, it was only five minutes from the beach.", "c": "那間飯店有大泳池和免費早餐，而且【最棒的是】，它離海灘只有五分鐘。", "f": "The hotel had a big pool and free breakfast, and best of all, it was only five minutes from the beach."}, {"g": "", "t": "better yet", "p": "(adv.phr.)", "e": "an even better idea is", "z": "更好的是", "s": "We can take the bus to the zoo, or _____ _____, Dad can drive us there so we can save time.", "c": "我們可以搭公車去動物園，或者【更好的是】，爸爸可以開車載我們去，這樣能省時間。", "f": "We can take the bus to the zoo, or better yet, Dad can drive us there so we can save time."}, {"g": "", "t": "between meals", "p": "(adv.phr.)", "e": "in the time after one meal and before the next", "z": "在正餐之間", "s": "If you eat too many snacks _____ _____, you will not feel hungry when your mom serves dinner at seven.", "c": "如果你【在正餐之間】吃太多零食，媽媽七點上晚餐時你就不會餓。", "f": "If you eat too many snacks between meals, you will not feel hungry when your mom serves dinner at seven."}, {"g": "", "t": "by accident", "p": "(adv.phr.)", "e": "not on purpose", "z": "意外地；不小心", "s": "Ben dropped his mother's favorite cup _____ _____ while he was washing the dishes, and he felt really sorry.", "c": "班洗碗時【不小心】摔破了媽媽最喜歡的杯子，他覺得非常抱歉。", "f": "Ben dropped his mother's favorite cup by accident while he was washing the dishes, and he felt really sorry."}, {"g": "", "t": "by air", "p": "(adv.phr.)", "e": "by plane", "z": "搭飛機；藉由空運", "s": "Sending the box to my uncle in Canada _____ _____ is very fast, but it costs much more than sending it by ship.", "c": "把箱子【用空運】寄給在加拿大的叔叔非常快，但比海運貴得多。", "f": "Sending the box to my uncle in Canada by air is very fast, but it costs much more than sending it by ship."}, {"g": "", "t": "by birth", "p": "(adv.phr.)", "e": "because of the family you were born into", "z": "在血統上、出生時", "s": "Ken is Japanese _____ _____, but he has lived in Taiwan since he was three, so he speaks Chinese very well.", "c": "阿健【在血統上】是日本人，但他從三歲起就住在台灣，所以他的中文說得非常好。", "f": "Ken is Japanese by birth, but he has lived in Taiwan since he was three, so he speaks Chinese very well."}, {"g": "", "t": "by chance", "p": "(adv.phr.)", "e": "without planning", "z": "偶然地；碰巧", "s": "I met my old classmate _____ _____ at the bookstore yesterday, and we talked about our elementary school teachers for an hour.", "c": "我昨天在書店【偶然】遇到老同學，我們聊了一個小時小學老師的事。", "f": "I met my old classmate by chance at the bookstore yesterday, and we talked about our elementary school teachers for an hour."}, {"g": "", "t": "by check", "p": "(adv.phr.)", "e": "using a check to pay", "z": "用支票（付款）", "s": "My dad doesn't carry much cash, so he paid for the new sofa _____ _____ when it arrived at our house.", "c": "我爸爸身上不太帶現金，所以新沙發送到我們家時，他【用支票】付了款。", "f": "My dad doesn't carry much cash, so he paid for the new sofa by check when it arrived at our house."}, {"g": "", "t": "by hand", "p": "(adv.phr.)", "e": "made with your hands, not by a machine", "z": "用手工", "s": "Grandma made this warm scarf for me _____ _____, so it took her almost two weeks to finish it.", "c": "奶奶【用手工】為我織了這條溫暖的圍巾，所以她花了將近兩個星期才完成。", "f": "Grandma made this warm scarf for me by hand, so it took her almost two weeks to finish it."}, {"g": "", "t": "by no means", "p": "(adv.phr.)", "e": "not at all", "z": "絕不", "s": "This math test was _____ _____ _____ easy, and many students needed the whole class time to finish all the questions.", "c": "這次數學考試【絕不】簡單，許多學生需要整節課的時間才能寫完所有題目。", "f": "This math test was by no means easy, and many students needed the whole class time to finish all the questions."}, {"g": "", "t": "by oneself", "p": "(adv.phr.)", "e": "alone; without help", "z": "獨自；靠自己", "s": "My little sister is only six, but she can already tie her shoes _____ herself and pack her own school bag.", "c": "我妹妹才六歲，但她已經能【自己】綁鞋帶，還會自己整理書包。", "f": "My little sister is only six, but she can already tie her shoes by herself and pack her own school bag."}, {"g": "", "t": "by the same token", "p": "(adv.phr.)", "e": "in the same way; for the same reason", "z": "同樣地", "s": "Eating too much fast food is bad for your body; _____ _____ _____ _____, sleeping too late is not good for your health either.", "c": "吃太多速食對身體不好；【同樣地】，太晚睡對健康也不好。", "f": "Eating too much fast food is bad for your body; by the same token, sleeping too late is not good for your health either."}, {"g": "", "t": "by the way", "p": "(adv.phr.)", "e": "used to add something or change the topic", "z": "順便一提", "s": "I really enjoyed the movie we watched last night, and _____ _____ _____, do you still want to go to the beach with us on Sunday?", "c": "我真的很喜歡我們昨晚看的電影，【順便一提】，你星期天還想跟我們一起去海邊嗎？", "f": "I really enjoyed the movie we watched last night, and by the way, do you still want to go to the beach with us on Sunday?"}, {"g": "", "t": "by train/bus/plane/taxi/ship", "p": "(adv.phr.)", "e": "using a kind of transportation", "z": "搭乘火車／公車／飛機／計程車／船", "s": "My family usually goes to Hualien _____ _____ because the view of the sea from the window is really beautiful.", "c": "我們家通常【搭火車】去花蓮，因為從窗戶看出去的海景真的很美。", "f": "My family usually goes to Hualien by train because the view of the sea from the window is really beautiful."}, {"g": "", "t": "either way", "p": "(adv.phr.)", "e": "in both cases; it doesn't matter which", "z": "不管哪種方式；無論如何", "s": "We can take the bus or the MRT to the museum. _____ _____, it will take about thirty minutes.", "c": "我們可以搭公車或捷運去博物館。【不管哪種方式】，都大約要花三十分鐘。", "f": "We can take the bus or the MRT to the museum. Either way, it will take about thirty minutes."}, {"g": "", "t": "ever since", "p": "(adv.phr.)", "e": "from that time until now", "z": "從那時起一直", "s": "Ben fell off his bike and broke his leg two years ago, and he has been afraid of riding it _____ _____.", "c": "班兩年前從腳踏車上摔下來摔斷了腿，【從那時起】他就一直很怕騎車。", "f": "Ben fell off his bike and broke his leg two years ago, and he has been afraid of riding it ever since."}, {"g": "", "t": "far from + adj./N/V-ing", "p": "(adv.phr.)", "e": "not at all", "z": "完全不、根本不", "s": "The new restaurant looked nice, but the food was _____ _____ delicious, so my family will never go back there again.", "c": "那家新餐廳看起來不錯，但食物【根本不】好吃，所以我們家再也不會去了。", "f": "The new restaurant looked nice, but the food was far from delicious, so my family will never go back there again."}, {"g": "", "t": "first of all", "p": "(adv.phr.)", "e": "before anything else", "z": "首先；第一", "s": "_____ _____ _____, wash your hands carefully, and then you can help me cut the vegetables for dinner tonight.", "c": "【首先】，把手仔細洗乾淨，然後你可以幫我切今晚晚餐要用的蔬菜。", "f": "First of all, wash your hands carefully, and then you can help me cut the vegetables for dinner tonight."}, {"g": "", "t": "for + N + purposes", "p": "(adv.phr.)", "e": "for the reason of doing something", "z": "為了…目的", "s": "Students may use the school computers only _____ study _____, so they cannot play online games on them during lunch.", "c": "學生只能【為了學習的目的】使用學校電腦，所以午餐時間不能用它們玩線上遊戲。", "f": "Students may use the school computers only for study purposes, so they cannot play online games on them during lunch."}, {"g": "", "t": "for a long time", "p": "(adv.phr.)", "e": "for many hours, days, or years", "z": "很長一段時間", "s": "Kelly and I have been good friends _____ _____ _____ _____ because we met in kindergarten and still live on the same street.", "c": "凱莉和我當好朋友【很長一段時間】了，因為我們在幼稚園就認識，現在仍住在同一條街上。", "f": "Kelly and I have been good friends for a long time because we met in kindergarten and still live on the same street."}, {"g": "", "t": "for a while", "p": "(adv.phr.)", "e": "for a short time", "z": "一下子；一會兒", "s": "I felt a little tired after the long hike, so I sat on the bench and rested _____ _____ _____ before walking home.", "c": "長途健行後我覺得有點累，所以我坐在長椅上休息了【一會兒】才走路回家。", "f": "I felt a little tired after the long hike, so I sat on the bench and rested for a while before walking home."}, {"g": "", "t": "for better or worse", "p": "(adv.phr.)", "e": "whether the result is good or bad", "z": "無論好壞；不論結果如何", "s": "_____ _____ _____ _____, smartphones are now a big part of our lives, so we must learn to use them wisely.", "c": "【無論好壞】，智慧型手機現在都是我們生活中很重要的一部分，所以我們必須學會聰明地使用它們。", "f": "For better or worse, smartphones are now a big part of our lives, so we must learn to use them wisely."}, {"g": "", "t": "for example", "p": "(adv.phr.)", "e": "used to give one thing that shows what you mean", "z": "例如；舉例來說", "s": "There are many ways to stay healthy when you are busy with school. _____ _____, you can walk to school instead of taking the bus.", "c": "課業忙碌時還是有很多保持健康的方法。【例如】，你可以走路上學，而不是搭公車。", "f": "There are many ways to stay healthy when you are busy with school. For example, you can walk to school instead of taking the bus."}, {"g": "", "t": "for fun", "p": "(adv.phr.)", "e": "because you enjoy it", "z": "為了樂趣；好玩", "s": "My cousin doesn't want to be a famous singer, but she sings at the park every Sunday just _____ _____.", "c": "我表姊並不想成為有名的歌手，但她每個星期天都在公園唱歌，只是【為了好玩】。", "f": "My cousin doesn't want to be a famous singer, but she sings at the park every Sunday just for fun."}, {"g": "", "t": "for good", "p": "(adv.phr.)", "e": "forever; never coming back", "z": "永遠", "s": "My best friend Wendy is moving to Canada _____ _____, so I feel sad and will miss her very much.", "c": "我最好的朋友溫蒂要【永遠】搬去加拿大了，所以我很難過，會非常想念她。", "f": "My best friend Wendy is moving to Canada for good, so I feel sad and will miss her very much."}, {"g": "", "t": "for nothing", "p": "(adv.phr.)", "e": "free; without paying, or with no result", "z": "免費；沒有報酬；白白地", "s": "The shop owner gave us a bottle of water _____ _____ because it was so hot and we had walked a long way.", "c": "因為天氣很熱，我們又走了很遠的路，店老闆【免費】給了我們一瓶水。", "f": "The shop owner gave us a bottle of water for nothing because it was so hot and we had walked a long way."}, {"g": "", "t": "for sale", "p": "(adv.phr.)", "e": "available to buy", "z": "出售中；待售", "s": "The small house next to our school is _____ _____ now, and my parents are thinking about buying it.", "c": "我們學校旁邊那間小房子現在【待售中】，我爸媽正在考慮要買下它。", "f": "The small house next to our school is for sale now, and my parents are thinking about buying it."}, {"g": "", "t": "for someone's/something's sake", "p": "(adv.phr.)", "e": "to help or be good for someone", "z": "為了……的緣故", "s": "Dad stopped smoking _____ his family's _____ because he wanted to stay healthy and see his children grow up.", "c": "爸爸【為了家人的緣故】戒了菸，因為他想保持健康，看著孩子們長大。", "f": "Dad stopped smoking for his family's sake because he wanted to stay healthy and see his children grow up."}, {"g": "", "t": "for sure", "p": "(adv.phr.)", "e": "certainly; without any doubt", "z": "確定地；肯定地", "s": "I don't know _____ _____ if the bus will come soon, so let's take a taxi because we can't be late for the show.", "c": "我不【確定】公車會不會馬上來，所以我們搭計程車吧，因為表演不能遲到。", "f": "I don't know for sure if the bus will come soon, so let's take a taxi because we can't be late for the show."}, {"g": "", "t": "for the first time", "p": "(adv.phr.)", "e": "never before this time", "z": "第一次", "s": "Last summer, I went to Japan with my family and saw snow _____ _____ _____ _____ in my life.", "c": "去年夏天，我和家人去日本，這是我人生中【第一次】看到雪。", "f": "Last summer, I went to Japan with my family and saw snow for the first time in my life."}, {"g": "", "t": "for the last time", "p": "(adv.phr.)", "e": "one final time", "z": "最後一次", "s": "Before we moved to Kaohsiung, I visited my old school _____ _____ _____ _____ and said goodbye to my teachers.", "c": "搬去高雄之前，我【最後一次】回到舊學校，向老師們道別。", "f": "Before we moved to Kaohsiung, I visited my old school for the last time and said goodbye to my teachers."}, {"g": "", "t": "from bad to worse", "p": "(adv.phr.)", "e": "becoming even worse than before", "z": "每況愈下、越來越糟", "s": "First Leo lost his wallet, and then it started to rain, so his day went _____ _____ _____ _____.", "c": "Leo先是弄丟錢包，接著又開始下雨，所以他的一天【越來越糟】。", "f": "First Leo lost his wallet, and then it started to rain, so his day went from bad to worse."}, {"g": "", "t": "from door to door", "p": "(adv.phr.)", "e": "going to each house, one by one", "z": "挨家挨戶", "s": "The students went _____ _____ _____ _____ and asked people for old books, because the village school needed more books.", "c": "學生們【挨家挨戶】向人們要舊書，因為村裡的學校需要更多書。", "f": "The students went from door to door and asked people for old books, because the village school needed more books."}, {"g": "", "t": "from head to toe", "p": "(adv.phr.)", "e": "all over the body", "z": "全身、從頭到腳", "s": "Tim played soccer in the rain and came home covered in mud _____ _____ _____ _____, so Mom made him take a shower.", "c": "提姆在雨中踢足球，回家時【從頭到腳】都是泥巴，所以媽媽叫他去洗澡。", "f": "Tim played soccer in the rain and came home covered in mud from head to toe, so Mom made him take a shower."}, {"g": "", "t": "from now on", "p": "(adv.phr.)", "e": "starting now and continuing in the future", "z": "從現在起", "s": "I was late for school three times this week, so _____ _____ _____ I will turn off the lights before ten.", "c": "我這週上學遲到三次了，所以【從現在起】我會在十點前關燈睡覺。", "f": "I was late for school three times this week, so from now on I will turn off the lights before ten."}, {"g": "", "t": "from place to place", "p": "(adv.phr.)", "e": "moving to many different places", "z": "從一處到另一處、到處", "s": "During summer vacation, my family traveled _____ _____ _____ _____ around Taiwan and tried many local snacks.", "c": "暑假期間，我們全家在台灣各地【到處】旅行，吃了很多在地小吃。", "f": "During summer vacation, my family traveled from place to place around Taiwan and tried many local snacks."}, {"g": "", "t": "from the bottom of one's heart", "p": "(adv.phr.)", "e": "very sincerely; with all your feelings", "z": "打從心裡", "s": "I want to thank you _____ _____ _____ _____ my _____ because you helped me so much when I was sick last month.", "c": "我【打從心裡】感謝你，因為上個月我生病時你幫了我很多。", "f": "I want to thank you from the bottom of my heart because you helped me so much when I was sick last month."}, {"g": "", "t": "from then on", "p": "(adv.phr.)", "e": "starting at that time and continuing", "z": "從那時起", "s": "Jack got a stomachache after eating five ice creams, and _____ _____ _____ he only ate one a day.", "c": "傑克吃了五支冰淇淋後肚子痛，【從那時起】他一天只吃一支。", "f": "Jack got a stomachache after eating five ice creams, and from then on he only ate one a day."}, {"g": "", "t": "from time to time", "p": "(adv.phr.)", "e": "sometimes, but not often", "z": "偶爾、有時候", "s": "My aunt lives in Kaohsiung, but she visits us _____ _____ _____ _____ and always brings delicious pineapple cakes for everyone.", "c": "我阿姨住在高雄，但她【偶爾】會來看我們，而且總是帶好吃的鳳梨酥給大家。", "f": "My aunt lives in Kaohsiung, but she visits us from time to time and always brings delicious pineapple cakes for everyone."}, {"g": "", "t": "from top to bottom", "p": "(adv.phr.)", "e": "completely; every part", "z": "徹底地", "s": "We cleaned the whole house _____ _____ _____ _____ before Chinese New Year, so it looked bright and new for the holiday.", "c": "我們在過年前把整間房子【徹底地】打掃了一遍，所以它在假期看起來明亮又嶄新。", "f": "We cleaned the whole house from top to bottom before Chinese New Year, so it looked bright and new for the holiday."}, {"g": "", "t": "in a + adj. + way", "p": "(adv.phr.)", "e": "in a certain manner", "z": "以……的方式", "s": "Ms. Lin explains grammar _____ _____ fun _____, so even students who don't like English enjoy her classes.", "c": "林老師【以】有趣的【方式】講解文法，所以就連不喜歡英文的學生也很喜歡她的課。", "f": "Ms. Lin explains grammar in a fun way, so even students who don't like English enjoy her classes."}, {"g": "", "t": "in a good way", "p": "(adv.phr.)", "e": "in a positive or nice manner", "z": "用好的方式；以好的方面來說", "s": "The new teacher surprised us _____ _____ _____ _____, because she brought snacks and played games with us on the first day.", "c": "新老師讓我們很驚喜，【是好的那種】，因為她第一天就帶點心來還跟我們玩遊戲。", "f": "The new teacher surprised us in a good way, because she brought snacks and played games with us on the first day."}, {"g": "", "t": "in a hurry", "p": "(adv.phr.)", "e": "doing things very quickly", "z": "匆忙", "s": "Jason was _____ _____ _____ this morning because he got up late, so he forgot to bring his math homework.", "c": "Jason今天早上很【匆忙】，因為他起晚了，所以忘了帶數學作業。", "f": "Jason was in a hurry this morning because he got up late, so he forgot to bring his math homework."}, {"g": "", "t": "in a way", "p": "(adv.phr.)", "e": "partly; when you think about it in one way", "z": "在某種程度上", "s": "Losing the game was sad, but _____ _____ _____ it was good for us because we learned what we needed to practice.", "c": "輸了比賽很難過，但【在某種程度上】這對我們是好事，因為我們知道了需要練習什麼。", "f": "Losing the game was sad, but in a way it was good for us because we learned what we needed to practice."}, {"g": "", "t": "in addition", "p": "(adv.phr.)", "e": "also; and another thing", "z": "此外", "s": "This hotel has a big swimming pool and a gym; _____ _____, breakfast is free for every guest, so it is very popular.", "c": "這間飯店有大游泳池和健身房；【此外】，每位房客都享有免費早餐，所以非常受歡迎。", "f": "This hotel has a big swimming pool and a gym; in addition, breakfast is free for every guest, so it is very popular."}, {"g": "", "t": "in advance", "p": "(adv.phr.)", "e": "before something happens", "z": "事先", "s": "The concert tickets sell out very quickly, so you should buy them online _____ _____ if you really want to see the show.", "c": "演唱會的票賣得非常快，所以如果你真的想看表演，應該【事先】上網買票。", "f": "The concert tickets sell out very quickly, so you should buy them online in advance if you really want to see the show."}, {"g": "", "t": "in alphabetical order", "p": "(adv.phr.)", "e": "arranged from A to Z", "z": "按字母順序", "s": "The teacher wrote all our English names on the board _____ _____ _____, so Amy was first and Zoe was last.", "c": "老師把我們所有人的英文名字【按字母順序】寫在黑板上，所以艾咪排第一，柔伊排最後。", "f": "The teacher wrote all our English names on the board in alphabetical order, so Amy was first and Zoe was last."}, {"g": "", "t": "in bed", "p": "(adv.phr.)", "e": "lying in bed to sleep or rest", "z": "在床上（指睡覺）", "s": "It was already ten o'clock at night, but my little brother was not _____ _____ because he was still playing video games.", "c": "已經晚上十點了，但我弟弟還沒【上床睡覺】，因為他還在打電動。", "f": "It was already ten o'clock at night, but my little brother was not in bed because he was still playing video games."}, {"g": "", "t": "in cash", "p": "(adv.phr.)", "e": "using paper money and coins", "z": "以現金（付帳）", "s": "The small night market stand does not take credit cards, so you have to pay _____ _____ for your fried chicken.", "c": "那個夜市小攤不收信用卡，所以你買炸雞必須【用現金】付款。", "f": "The small night market stand does not take credit cards, so you have to pay in cash for your fried chicken."}, {"g": "", "t": "in fact", "p": "(adv.phr.)", "e": "really; what is true is", "z": "事實上", "s": "Everyone thought the new student was shy, but _____ _____, he was very funny and talked a lot after a few days.", "c": "大家都以為新同學很害羞，但【事實上】，幾天後他就變得很風趣又很健談。", "f": "Everyone thought the new student was shy, but in fact, he was very funny and talked a lot after a few days."}, {"g": "", "t": "in general", "p": "(adv.phr.)", "e": "usually; in most cases", "z": "一般地、大致上", "s": "_____ _____, people in Taiwan eat rice or noodles every day, but many young people also enjoy bread for breakfast.", "c": "【大致上】，台灣人每天都會吃飯或麵，但很多年輕人早餐也喜歡吃麵包。", "f": "In general, people in Taiwan eat rice or noodles every day, but many young people also enjoy bread for breakfast."}, {"g": "", "t": "in line", "p": "(adv.phr.)", "e": "waiting one after another", "z": "排隊", "s": "There were many people at the new ice cream shop, so we waited _____ _____ for thirty minutes before we got our cones.", "c": "新開的冰淇淋店人很多，所以我們【排隊】等了三十分鐘才拿到甜筒。", "f": "There were many people at the new ice cream shop, so we waited in line for thirty minutes before we got our cones."}, {"g": "", "t": "in no way", "p": "(adv.phr.)", "e": "not at all", "z": "絕不；一點也不", "s": "This small mistake is _____ _____ _____ your fault, so please don't feel bad about it anymore, Kevin.", "c": "凱文，這個小錯誤【一點也不】是你的錯，所以請不要再難過了。", "f": "This small mistake is in no way your fault, so please don't feel bad about it anymore, Kevin."}, {"g": "", "t": "in one's bedroom", "p": "(adv.phr.)", "e": "inside the room where a person sleeps", "z": "在某人的臥室中", "s": "Mia spent the whole Sunday afternoon _____ her _____ because she had to finish a long English report for Monday.", "c": "米亞整個星期天下午都待【在她的臥室裡】，因為她得完成一份星期一要交的長篇英文報告。", "f": "Mia spent the whole Sunday afternoon in her bedroom because she had to finish a long English report for Monday."}, {"g": "", "t": "in one's free time", "p": "(adv.phr.)", "e": "when you are not busy", "z": "在某人有空時", "s": "_____ my _____ _____, I like to draw comic books and play basketball with my cousins in the park.", "c": "【在我有空時】，我喜歡畫漫畫，也喜歡和表兄弟在公園打籃球。", "f": "In my free time, I like to draw comic books and play basketball with my cousins in the park."}, {"g": "", "t": "in order to + VR", "p": "(adv.phr.)", "e": "so that you can", "z": "為了", "s": "Peter gets up at six o'clock every morning _____ _____ _____ catch the early bus and arrive at school before seven.", "c": "Peter每天早上六點起床，【為了】趕上早班公車並在七點前到校。", "f": "Peter gets up at six o'clock every morning in order to catch the early bus and arrive at school before seven."}, {"g": "", "t": "in other words", "p": "(adv.phr.)", "e": "used to say something again in an easier way", "z": "換句話說", "s": "Kevin spent all his pocket money on games last week. _____ _____ _____, he has no money left for his lunch today.", "c": "凱文上週把所有零用錢都花在遊戲上。【換句話說】，他今天沒有錢買午餐了。", "f": "Kevin spent all his pocket money on games last week. In other words, he has no money left for his lunch today."}, {"g": "", "t": "in person", "p": "(adv.phr.)", "e": "yourself, by being really there", "z": "親自；本人", "s": "My favorite singer came to Taipei last month, and I finally saw her _____ _____ at a concert with my best friend.", "c": "我最喜歡的歌手上個月來台北，我終於和好朋友在演唱會上見到她【本人】。", "f": "My favorite singer came to Taipei last month, and I finally saw her in person at a concert with my best friend."}, {"g": "", "t": "in practice", "p": "(adv.phr.)", "e": "in real life, not just in ideas", "z": "實際上", "s": "The new rule sounds easy, but _____ _____ it is hard for students to put their phones away all day.", "c": "新規定聽起來很簡單，但【實際上】學生要整天把手機收起來很難。", "f": "The new rule sounds easy, but in practice it is hard for students to put their phones away all day."}, {"g": "", "t": "in practice", "p": "(adv.phr.)", "e": "working as a doctor or lawyer", "z": "在執業中", "s": "Dr. Lin has been _____ _____ in our town for thirty years, and many families still visit his small clinic.", "c": "林醫生在我們鎮上【執業】三十年了，很多家庭仍然去他的小診所看病。", "f": "Dr. Lin has been in practice in our town for thirty years, and many families still visit his small clinic."}, {"g": "", "t": "in private", "p": "(adv.phr.)", "e": "where other people cannot see or hear", "z": "私下地；私底下", "s": "The teacher did not want to embarrass Henry in front of the class, so she talked to him _____ _____ after school.", "c": "老師不想在全班面前讓 Henry 難堪，所以她放學後【私下】跟他談。", "f": "The teacher did not want to embarrass Henry in front of the class, so she talked to him in private after school."}, {"g": "", "t": "in public", "p": "(adv.phr.)", "e": "where other people can see", "z": "公開、當眾", "s": "My little brother gets shy when he has to sing _____ _____, but at home he sings loudly all day.", "c": "我弟弟要【當眾】唱歌時會害羞，但在家裡他整天都大聲唱歌。", "f": "My little brother gets shy when he has to sing in public, but at home he sings loudly all day."}, {"g": "", "t": "in return", "p": "(adv.phr.)", "e": "as a way of thanking someone", "z": "報答、回報", "s": "Ming helped his neighbor carry heavy boxes upstairs, and _____ _____, she gave him a bag of fresh oranges from her farm.", "c": "阿明幫鄰居把重箱子搬上樓，而她送了他一袋自家農場的新鮮柳丁做為【回報】。", "f": "Ming helped his neighbor carry heavy boxes upstairs, and in return, she gave him a bag of fresh oranges from her farm."}, {"g": "", "t": "in short", "p": "(adv.phr.)", "e": "in a few words", "z": "總而言之、簡言之", "s": "The food was cold, the waiter was rude, and the prices were high; _____ _____, we will never eat at that restaurant again.", "c": "食物是冷的、服務生很無禮、價格又高；【總而言之】，我們再也不會去那家餐廳吃飯了。", "f": "The food was cold, the waiter was rude, and the prices were high; in short, we will never eat at that restaurant again."}, {"g": "", "t": "in space", "p": "(adv.phr.)", "e": "outside the earth, among the stars", "z": "在太空中", "s": "Astronauts live _____ _____ for months, and they have to exercise every day because their bodies get weak there.", "c": "太空人【在太空中】生活好幾個月，他們每天都必須運動，因為身體在那裡會變虛弱。", "f": "Astronauts live in space for months, and they have to exercise every day because their bodies get weak there."}, {"g": "", "t": "in that case", "p": "(adv.phr.)", "e": "if that is true or happens", "z": "如果那樣；在那種情況下", "s": "A: Sorry, the bus to the zoo is not coming for another forty minutes. B: _____ _____ _____, let's just take a taxi there.", "c": "A：抱歉，去動物園的公車還要四十分鐘才會來。B：【如果那樣】，我們就搭計程車去吧。", "f": "A: Sorry, the bus to the zoo is not coming for another forty minutes. B: In that case, let's just take a taxi there."}, {"g": "", "t": "in the beginning", "p": "(adv.phr.)", "e": "at first; at the start", "z": "一開始", "s": "_____ _____ _____, I couldn't swim at all, but after many lessons I can now swim across the pool.", "c": "【一開始】我完全不會游泳，但上了很多堂課之後，我現在能游完整個泳池了。", "f": "In the beginning, I couldn't swim at all,
