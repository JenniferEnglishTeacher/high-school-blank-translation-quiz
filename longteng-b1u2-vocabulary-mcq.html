<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>龍騰B1U2 單字選擇</title><style>:root{--blue:#2563eb;--navy:#1e3a8a;--bg:#f4f7fb;--card:#fff;--line:#dbe3ee;--ink:#172033;--muted:#64748b;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}.wrap{max-width:900px;margin:auto;padding:16px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 5px 18px #0f172a0d}.hero{background:linear-gradient(135deg,#e8f1ff,#fff)}h1{margin:0 0 6px;font-size:clamp(25px,4vw,38px)}h2{margin-top:0}.note{color:var(--muted)}.hidden{display:none!important}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.btn{border:0;border-radius:10px;padding:11px 17px;font-size:16px;font-weight:800;cursor:pointer;background:#e5e7eb}.primary{background:var(--blue);color:#fff}.danger{background:#991b1b;color:#fff}.pick{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin:7px 0;background:#fafcff}.pick input{margin-right:8px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:800;margin:8px 0 14px}.zh{padding:10px 13px;background:#fff7ed;border-radius:9px;color:#9a3412;font-weight:800;margin-bottom:10px}.question{font-size:21px;font-weight:750;padding:16px;background:#f8fafc;border-radius:11px;white-space:pre-wrap}.options{display:grid;gap:9px;margin:14px 0}.option{display:flex;align-items:center;gap:11px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-size:18px;font-weight:750;cursor:pointer}.option:hover{border-color:#60a5fa;background:#eff6ff}.option:has(input:checked){border-color:var(--blue);background:#dbeafe;color:var(--navy)}.option input{width:20px;height:20px;accent-color:var(--blue)}.inputs{display:grid;gap:10px;margin:15px 0}.answer-row{display:grid;grid-template-columns:55px 1fr;gap:10px;align-items:center}.answer-row label{font-weight:900;color:var(--navy);text-align:center}.spell{width:100%;font:inherit;font-size:18px;padding:11px;border:2px solid #94a3b8;border-radius:9px}.feedback{padding:13px;border-radius:10px;font-weight:800;margin:13px 0}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}.wrong p{margin:6px 0}@media(max-width:600px){.wrap{padding:9px}.hero,.card{padding:15px}.question{font-size:18px;padding:13px}.option{font-size:17px}.answer-row{grid-template-columns:42px 1fr}}</style></head><body><main class="wrap"><section class="hero"><h1>龍騰B1U2 單字選擇</h1><p>共 30 題。可自行選題；答錯會顯示正確答案並要求重新作答。</p><p class="note">完成後可下載包含錯誤答案與正確答案的 DOCX 錯題紀錄。</p></section><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn">全部選取</button><button id="none" class="btn">全部取消</button><button id="start" class="btn primary">開始作答</button></div><div id="list"></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="download" class="btn primary">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></main><script type="module">import{Document,Packer,Paragraph,TextRun,HeadingLevel}from'https://esm.sh/docx@9.5.1';const TITLE="龍騰B1U2 單字選擇",MODE="mcq",Q=[{"id": 1, "question": "After Eason learned that he hadn’t won first place in the game, he felt a little ____________.", "options": ["satisfying", "romantic", "disappointed", "personal"], "answer": 2}, {"id": 2, "question": "In ____________ to public pressure, the government has announced that it plans to make much stricter laws to prevent drunk driving.", "options": ["romance", "response", "attention", "inspiration"], "answer": 1}, {"id": 3, "question": "Jenny has no idea how to ____________ to the love letter that one of her classmates just gave her.", "options": ["respond", "connect", "inspire", "satisfy"], "answer": 0}, {"id": 4, "question": "Though Simon keeps ____________ cheating on the exam, none of his classmates believes him.", "options": ["relating", "ignoring", "satisfying", "denying"], "answer": 3}, {"id": 5, "question": "The reason why Daniel made such a big mistake is that he totally ____________ his parents’ advice.", "options": ["inspired", "connected", "ignored", "refreshed"], "answer": 2}, {"id": 6, "question": "After Cindy watched the ____________ movie, she was so touched that she cried.", "options": ["personal", "romantic", "disappointed", "satisfied"], "answer": 1}, {"id": 7, "question": "Frank likes ____________ himself with a cold shower in the morning before he goes to work.", "options": ["refreshing", "communicating", "responding", "connecting"], "answer": 0}, {"id": 8, "question": "William often ____________ the screen of his smartphone for fear that he might miss something interesting.", "options": ["introduces", "connects", "ignores", "refreshes"], "answer": 3}, {"id": 9, "question": "Rita sent a number of text ____________ to her brother this morning, but he hasn’t replied.", "options": ["connections", "romances", "messages", "introductions"], "answer": 2}, {"id": 10, "question": "Since Charlie ____________ Brittany to classical music several months ago, she has been listening to it every day.", "options": ["refreshed", "introduced", "satisfied", "communicated"], "answer": 1}, {"id": 11, "question": "Many parents complain that they often have a hard time ____________ with their teenage children.", "options": ["communicating", "disappointing", "refreshing", "introducing"], "answer": 0}, {"id": 12, "question": "Tina soon ____________ with Jessica because both of them are very interested in dancing.", "options": ["focused", "disappointed", "ignored", "connected"], "answer": 3}, {"id": 13, "question": "According to the author, the ____________ for his new novel came from a strange dream he had last winter.", "options": ["connection", "relationship", "inspiration", "introduction"], "answer": 2}, {"id": 14, "question": "Jeremy ____________ his poor grades on recent exams to his lack of sleep.", "options": ["satisfies", "relates", "refreshes", "denies"], "answer": 1}, {"id": 15, "question": "Mary and Andy have been in a(n) ____________ for many years, and now they are going to get married.", "options": ["relationship", "introduction", "message", "focus"], "answer": 0}, {"id": 16, "question": "Taiwan is well-known ____________ the world for the beauty of its natural scenery.", "options": ["throughout", "outside", "from", "inside"], "answer": 0}, {"id": 17, "question": "The teacher set a good example and ____________ his students to put in a lot of effort.", "options": ["communicated", "focused", "respond", "inspired"], "answer": 3}, {"id": 18, "question": "It can be very ____________ to have a great dinner in a fancy restaurant.", "options": ["disappointing", "frustrating", "disgusting", "satisfying"], "answer": 3}, {"id": 19, "question": "He had a very close ____________ with his mother. He told her everything that happened in his daily life.", "options": ["satisfaction", "relationship", "attention", "ignorance"], "answer": 1}, {"id": 20, "question": "Taipei City and New Taipei City are ____________ by the MRT and bus services.", "options": ["related", "satisfied", "inspired", "connected"], "answer": 3}, {"id": 21, "question": "I didn’t do well on the first monthly exam. Mom asked me to ____________ more on my studies.", "options": ["inspire", "connect", "focus", "ignore"], "answer": 2}, {"id": 22, "question": "Although my sister is studying abroad, we still ____________ online every day.", "options": ["inspire", "chat", "satisfy", "refresh"], "answer": 1}, {"id": 23, "question": "The history teacher ____________ the culture of ancient Egypt to her students.", "options": ["introduced", "ignored", "refreshed", "denied"], "answer": 0}, {"id": 24, "question": "I particularly enjoy reading ____________ novels, such as Me Before You, and Happy Ever After.", "options": ["relationship", "message", "attention", "romance"], "answer": 3}, {"id": 25, "question": "He made a terrible mistake out of ____________.", "options": ["introduction", "relationship", "ignorance", "satisfaction"], "answer": 2}, {"id": 26, "question": "The coach blew his whistle to draw every player’s ____________.", "options": ["attention", "ignorance", "appearance", "disappointment"], "answer": 0}, {"id": 27, "question": "To his great ____________, he didn’t do well on the college entrance exam and failed to get into his dream university.", "options": ["ignorance", "response", "romance", "disappointment"], "answer": 3}, {"id": 28, "question": "Don’t take it ____________. I am simply offering some advice about what we can do in the future.", "options": ["terribly", "probably", "personally", "totally"], "answer": 2}, {"id": 29, "question": "The English teacher used different activities to develop students’ ____________ skills so that they could express their ideas clearly.", "options": ["ignorance", "communication", "introduction", "message"], "answer": 1}, {"id": 30, "question": "Some light ____________ are offered during the break period. You can take a rest and have some drinks and snacks.", "options": ["reflections", "refreshments", "introductions", "messages"], "answer": 1}];const $=s=>document.querySelector(s),list=$('#list'),select=$('#select'),quiz=$('#quiz'),result=$('#result'),question=$('#question'),answerArea=$('#answerArea'),feedback=$('#feedback'),next=$('#next');let chosen=[],idx=0;const wrong=new Map(),correct=new Set();const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ');function renderList(){list.innerHTML=Q.map(q=>'<label class="pick"><input class="pickbox" type="checkbox" value="'+q.id+'" checked><b>第 '+q.id+' 題</b></label>').join('')}$('#all').onclick=()=>document.querySelectorAll('.pickbox').forEach(x=>x.checked=true);$('#none').onclick=()=>document.querySelectorAll('.pickbox').forEach(x=>x.checked=false);$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));idx=0;wrong.clear();correct.clear();select.classList.add('hidden');result.classList.add('hidden');quiz.classList.remove('hidden');show()};function show(){const q=chosen[idx];$('#meta').textContent='第 '+(idx+1)+' / '+chosen.length+' 題';$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';$('#bar').style.width=(idx+1)/chosen.length*100+'%';question.textContent=q.question;const zh=$('#zh');if(q.zh){zh.textContent=q.zh;zh.classList.remove('hidden')}else zh.classList.add('hidden');feedback.className='feedback hidden';$('#check').classList.remove('hidden');next.classList.add('hidden');if(MODE==='mcq')answerArea.innerHTML='<div class="options">'+q.options.map((o,i)=>'<label class="option"><input type="radio" name="answer" value="'+i+'"><b>'+String.fromCharCode(65+i)+'.</b> '+esc(o)+'</label>').join('')+'</div>';else answerArea.innerHTML='<div class="inputs">'+q.answers.map((_,i)=>'<div class="answer-row"><label>'+(MODE==='multi'?['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'][i]:'答案')+'</label><input class="spell" autocomplete="off" spellcheck="false" placeholder="請輸入完整答案"></div>').join('')+'</div>';setTimeout(()=>answerArea.querySelector('input')?.focus(),0)}function currentAnswers(){if(MODE==='mcq'){const x=answerArea.querySelector('input:checked');return x?[+x.value]:[]}return [...answerArea.querySelectorAll('.spell')].map(x=>x.value)}function correctText(q){return MODE==='mcq'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.answers.join(' / ')}$('#check').onclick=()=>{const q=chosen[idx],a=currentAnswers();if((MODE==='mcq'&&!a.length)||(MODE!=='mcq'&&(a.length!==q.answers.length||a.some(x=>!x.trim()))))return alert('請完成所有答案。');const ok=MODE==='mcq'?a[0]===q.answer:a.every((x,i)=>q.answers[i].split(/\|\||\//).some(v=>norm(x)===norm(v)));if(ok){correct.add(q.id);feedback.className='feedback ok';feedback.textContent='✅ 全部正確！';$('#check').classList.add('hidden');next.classList.remove('hidden')}else{if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(MODE==='mcq'?String.fromCharCode(65+a[0]):a.join(' / '));$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';feedback.className='feedback bad';feedback.innerHTML='❌ 答案不正確。正確答案：<strong>'+esc(correctText(q))+'</strong><br>請重新作答。';if(MODE==='mcq')answerArea.querySelectorAll('input').forEach(x=>x.checked=false);else answerArea.querySelectorAll('.spell').forEach(x=>x.value='');answerArea.querySelector('input')?.focus()}};next.onclick=()=>{idx++;idx>=chosen.length?finish():show()};$('#finish').onclick=finish;function finish(){quiz.classList.add('hidden');result.classList.remove('hidden');$('#summary').innerHTML='<div class="stat">選擇題數<b>'+chosen.length+'</b></div><div class="stat">完成答對<b>'+correct.size+'</b></div><div class="stat">曾答錯<b>'+wrong.size+'</b></div>';$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>'<div class="wrong"><b>'+(i+1)+'. 第 '+r.q.id+' 題</b><p>'+esc((r.q.zh?r.q.zh+'\n':'')+r.q.question)+'</p><p><strong>錯誤答案：</strong>'+r.attempts.map(esc).join('；')+'</p><p><strong>正確答案：</strong>'+esc(correctText(r.q))+'</p></div>').join(''):'<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size)}$('#restart').onclick=()=>{result.classList.add('hidden');select.classList.remove('hidden')};$('#download').onclick=async()=>{if(!wrong.size)return;const children=[new Paragraph({heading:HeadingLevel.TITLE,children:[new TextRun({text:TITLE+' 錯題紀錄',bold:true})]})];[...wrong.values()].forEach((r,i)=>{children.push(new Paragraph({heading:HeadingLevel.HEADING_2,children:[new TextRun({text:(i+1)+'. 第 '+r.q.id+' 題',bold:true})]}));if(r.q.zh)children.push(new Paragraph({children:[new TextRun({text:r.q.zh})]}));children.push(new Paragraph({children:[new TextRun({text:r.q.question})]}));children.push(new Paragraph({children:[new TextRun({text:'錯誤答案：',bold:true}),new TextRun({text:r.attempts.join('；')})]}));children.push(new Paragraph({children:[new TextRun({text:'正確答案：',bold:true}),new TextRun({text:correctText(r.q)})]}))});const doc=new Document({sections:[{children}]}),blob=await Packer.toBlob(doc),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=TITLE+'_錯題_'+new Date().toISOString().slice(0,10)+'.docx';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};renderList();</script></body></html>
