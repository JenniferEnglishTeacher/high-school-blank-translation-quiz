  <script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 2｜單字選擇","mode":"mcq","questions":[{"id":1,"question":"After Eason learned that he hadn’t won first place in the game, he felt a little ____________.","options":["satisfying","romantic","disappointed","personal"],"answer":2,"source":"龍騰自命題","explanation":"在Eason得知他並未在比賽中獲得第一名之後，他覺得有一點失望。　(A)令人滿意的　(B)浪漫的；愛情的　(C)感到失望的　(D)個人的","explanationSource":"source"},{"id":2,"question":"In ____________ to public pressure, the government has announced that it plans to make much stricter laws to prevent drunk driving.","options":["romance","response","attention","inspiration"],"answer":1,"source":"龍騰自命題","explanation":"為了回應輿論壓力，政府已經宣布計畫要制定更加嚴格的法律來防止酒駕。　(A)浪漫愛情故事　(B)回應　(C)注意力　(D)靈感","explanationSource":"source"},{"id":3,"question":"Jenny has no idea how to ____________ to the love letter that one of her classmates just gave her.","options":["respond","connect","inspire","satisfy"],"answer":0,"source":"龍騰自命題","explanation":"Jenny不知道該如何回應她的一位同學剛剛給她的那封情書。　(A)回應　(B)連接　(C)激勵　(D)使……滿意","explanationSource":"source"},{"id":4,"question":"Though Simon keeps ____________ cheating on the exam, none of his classmates believes him.","options":["relating","ignoring","satisfying","denying"],"answer":3,"source":"龍騰自命題","explanation":"雖然Simon一直否認考試作弊，但是沒有任何同學相信他的話。　(A)使兩者有聯繫　(B)忽略　(C)使……滿意　(D)否認","explanationSource":"source"},{"id":5,"question":"The reason why Daniel made such a big mistake is that he totally ____________ his parents’ advice.","options":["inspired","connected","ignored","refreshed"],"answer":2,"source":"龍騰自命題","explanation":"Daniel犯下如此大錯的原因，是因為他完全忽略了他父母的忠告。　(A)激勵　(B)與他人建立良好關係　(C)忽略　(D)刷新","explanationSource":"source"},{"id":6,"question":"After Cindy watched the ____________ movie, she was so touched that she cried.","options":["personal","romantic","disappointed","satisfied"],"answer":1,"source":"龍騰自命題","explanation":"Cindy看了那部浪漫的電影後，她如此感動以致於哭了。　(A)個人的　(B)浪漫的；愛情的　(C)感到失望的　(D)滿意的","explanationSource":"source"},{"id":7,"question":"Frank likes ____________ himself with a cold shower in the morning before he goes to work.","options":["refreshing","communicating","responding","connecting"],"answer":0,"source":"龍騰自命題","explanation":"Frank喜歡每天早上去上班前沖冷水澡來使自己恢復精神。　(A)使某人恢復精神　(B)溝通　(C)回應　(D)連接","explanationSource":"source"},{"id":8,"question":"William often ____________ the screen of his smartphone for fear that he might miss something interesting.","options":["introduces","connects","ignores","refreshes"],"answer":3,"source":"龍騰自命題","explanation":"William經常刷新他智慧手機的螢幕以免他可能錯過某件有趣的事物。　(A)介紹　(B)連接　(C)忽略　(D)刷新","explanationSource":"source"},{"id":9,"question":"Rita sent a number of text ____________ to her brother this morning, but he hasn’t replied.","options":["connections","romances","messages","introductions"],"answer":2,"source":"龍騰自命題","explanation":"Rita今天早上傳了一些簡訊給她的弟弟，但是他還沒回覆。　(A)關聯；關係　(B)浪漫愛情故事　(C)（電郵或手機等的）訊息　(D)介紹","explanationSource":"source"},{"id":10,"question":"Since Charlie ____________ Brittany to classical music several months ago, she has been listening to it every day.","options":["refreshed","introduced","satisfied","communicated"],"answer":1,"source":"龍騰自命題","explanation":"自從幾個月前Charlie使Brittany初次體驗古典樂後，她就一直每天聽。　(A)刷新　(B)使某人初次體驗　(C)使……滿意　(D)溝通","explanationSource":"source"},{"id":11,"question":"Many parents complain that they often have a hard time ____________ with their teenage children.","options":["communicating","disappointing","refreshing","introducing"],"answer":0,"source":"龍騰自命題","explanation":"許多父母抱怨他們時常難以和他們青少年時期的孩子溝通。　(A)溝通　(B)使……失望　(C)刷新　(D)介紹","explanationSource":"source"},{"id":12,"question":"Tina soon ____________ with Jessica because both of them are very interested in dancing.","options":["focused","disappointed","ignored","connected"],"answer":3,"source":"龍騰自命題","explanation":"Tina很快地與Jessica建立了良好關係，因為她們兩人都對跳舞很有興趣。　(A)專注；專心　(B)使……失望　(C)忽略　(D)與他人建立良好關係","explanationSource":"source"},{"id":13,"question":"According to the author, the ____________ for his new novel came from a strange dream he had last winter.","options":["connection","relationship","inspiration","introduction"],"answer":2,"source":"龍騰自命題","explanation":"根據這位作者的說法，他這本新小說的靈感來自於他在去年冬天所做的一個怪夢。　(A)關聯；關係　(B)戀愛關係　(C)靈感　(D)介紹","explanationSource":"source"},{"id":14,"question":"Jeremy ____________ his poor grades on recent exams to his lack of sleep.","options":["satisfies","relates","refreshes","denies"],"answer":1,"source":"龍騰自命題","explanation":"Jeremy認為他最近幾次考試考不好和他缺乏睡眠有關。　(A)使……滿意　(B)使兩者有聯繫　(C)刷新　(D)否認","explanationSource":"source"},{"id":15,"question":"Mary and Andy have been in a(n) ____________ for many years, and now they are going to get married.","options":["relationship","introduction","message","focus"],"answer":0,"source":"龍騰自命題","explanation":"Mary和Andy已經談戀愛許多年，現在他們即將要結婚。　(A)戀愛關係　(B)介紹　(C)訊息　(D)關注的人或事物","explanationSource":"source"},{"id":16,"question":"Taiwan is well-known ____________ the world for the beauty of its natural scenery.","options":["throughout","outside","from","inside"],"answer":0,"source":"龍騰自命題","explanation":"臺灣因為自然風景之美而舉世聞名。　(A)在各處　(B)在……之外　(C)從……　(D)在……之內","explanationSource":"source"},{"id":17,"question":"The teacher set a good example and ____________ his students to put in a lot of effort.","options":["communicated","focused","respond","inspired"],"answer":3,"source":"龍騰自命題","explanation":"這位老師樹立良好典範，並且激勵學生努力。　(A)溝通　(B)專注　(C)回應　(D)激勵","explanationSource":"source"},{"id":18,"question":"It can be very ____________ to have a great dinner in a fancy restaurant.","options":["disappointing","frustrating","disgusting","satisfying"],"answer":3,"source":"龍騰自命題","explanation":"能在高級餐廳享用大餐是令人滿意的。　(A)令人失望的　(B)沮喪的　(C)噁心的　(D)滿意的","explanationSource":"source"},{"id":19,"question":"He had a very close ____________ with his mother. He told her everything that happened in his daily life.","options":["satisfaction","relationship","attention","ignorance"],"answer":1,"source":"龍騰自命題","explanation":"他和媽媽關係很好。他告訴她日常生活中發生的所有事。　(A)滿意　(B)關係　(C)注意力　(D)無知","explanationSource":"source"},{"id":20,"question":"Taipei City and New Taipei City are ____________ by the MRT and bus services.","options":["related","satisfied","inspired","connected"],"answer":3,"source":"龍騰自命題","explanation":"台北市和新北市由捷運和公車服務系統連結。　(A)使有聯繫　(B)使滿意　(C)啟發　(D)連結","explanationSource":"source"},{"id":21,"question":"I didn’t do well on the first monthly exam. Mom asked me to ____________ more on my studies.","options":["inspire","connect","focus","ignore"],"answer":2,"source":"龍騰自命題","explanation":"我第一次段考沒考好。媽媽要求我要更專注在課業上。　(A)激勵　(B)連結　(C)專注　(D)忽略","explanationSource":"source"},{"id":22,"question":"Although my sister is studying abroad, we still ____________ online every day.","options":["inspire","chat","satisfy","refresh"],"answer":1,"source":"龍騰自命題","explanation":"雖然我妹妹正在國外讀書，我們仍然每天在線上聊天。　(A)啟發　(B)聊天　(C)滿意　(D)刷新","explanationSource":"source"},{"id":23,"question":"The history teacher ____________ the culture of ancient Egypt to her students.","options":["introduced","ignored","refreshed","denied"],"answer":0,"source":"龍騰自命題","explanation":"歷史老師介紹古埃及文化給學生。　(A)介紹　(B)忽略　(C)刷新　(D)否認","explanationSource":"source"},{"id":24,"question":"I particularly enjoy reading ____________ novels, such as Me Before You, and Happy Ever After.","options":["relationship","message","attention","romance"],"answer":3,"source":"龍騰自命題","explanation":"我尤其喜歡閱讀浪漫愛情小說，像是《我就要你好好的》和《美夢成真》。　(A)戀愛關係　(B)訊息　(C)注意力　(D)浪漫愛情故事","explanationSource":"source"},{"id":25,"question":"He made a terrible mistake out of ____________.","options":["introduction","relationship","ignorance","satisfaction"],"answer":2,"source":"龍騰自命題","explanation":"由於無知，他犯了可怕的錯誤。　(A)介紹　(B)戀愛關係　(C)無知　(D)滿意","explanationSource":"source"},{"id":26,"question":"The coach blew his whistle to draw every player’s ____________.","options":["attention","ignorance","appearance","disappointment"],"answer":0,"source":"龍騰自命題","explanation":"教練吹哨吸引球員注意。　(A)注意　(B)無知　(C)外表　(D)失望","explanationSource":"source"},{"id":27,"question":"To his great ____________, he didn’t do well on the college entrance exam and failed to get into his dream university.","options":["ignorance","response","romance","disappointment"],"answer":3,"source":"龍騰自命題","explanation":"讓他感到失望的是他大學入學考試考得不好，無法進入夢想中的大學就讀。　(A)無知　(B)回應　(C)羅曼史　(D)失望","explanationSource":"source"},{"id":28,"question":"Don’t take it ____________. I am simply offering some advice about what we can do in the future.","options":["terribly","probably","personally","totally"],"answer":2,"source":"龍騰自命題","explanation":"不是針對你。我只是針對未來我們可以做的事情提供建議。　(A)非常地　(B)可能地　(C)個人地　(D)完全地","explanationSource":"source"},{"id":29,"question":"The English teacher used different activities to develop students’ ____________ skills so that they could express their ideas clearly.","options":["ignorance","communication","introduction","message"],"answer":1,"source":"龍騰自命題","explanation":"英文老師利用不同的活動幫助學生發展溝通技巧，如此一來他們才能清楚地表達想法。　(A)無知　(B)溝通　(C)介紹　(D)訊息","explanationSource":"source"},{"id":30,"question":"Some light ____________ are offered during the break period. You can take a rest and have some drinks and snacks.","options":["reflections","refreshments","introductions","messages"],"answer":1,"source":"龍騰自命題","explanation":"休息時間會提供茶點。你可以休息一下，喝點飲料和吃點點心。　(A)反映　(B)茶點　(C)介紹　(D)訊息","explanationSource":"source"}]};</script>
