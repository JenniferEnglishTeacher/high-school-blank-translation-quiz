<script>window.QUIZ_CONFIG={"title": "國中會考英語歷屆試題｜105–115 年單題＋克漏字", "mode": "mcq", "questions": [{"id": 1, "question": "第 1 題　Look at the picture. What is the dog doing?", "options": ["Biting the man.", "Crossing the street.", "Running after the bus.", "Sitting on the sidewalk."], "answer": 1, "answerLabel": "B", "source": "105 會考｜單題｜第 1 題", "explanation": "圖中狗正走在斑馬線上，所以是 Crossing the street（過馬路）。", "explanationSource": "own", "section": "105年"}, {"id": 2, "question": "第 2 題　Chris: Which ______ looks better on me?\nPenny: I think purple's better. You look great in purple.", "options": ["color", "grade", "shape", "size"], "answer": 0, "answerLabel": "A", "source": "105 會考｜單題｜第 2 題", "explanation": "Penny 回答紫色比較好，可見問的是「顏色」：Which color looks better on me?", "explanationSource": "own", "section": "105年"}, {"id": 3, "question": "第 3 題　My cat got excited when it saw the boy ______ the birds.", "options": ["catches", "catching", "to catch", "caught"], "answer": 1, "answerLabel": "B", "source": "105 會考｜單題｜第 3 題", "explanation": "感官動詞 see + 受詞 + V-ing／原形動詞。saw the boy catching the birds＝看見男孩正在抓鳥。", "explanationSource": "own", "section": "105年"}, {"id": 4, "question": "第 4 題　Mr. Jackson is a very ______ writer; people of all ages enjoy his stories.", "options": ["polite", "popular", "handsome", "honest"], "answer": 1, "answerLabel": "B", "source": "105 會考｜單題｜第 4 題", "explanation": "後句說各年齡層都喜歡他的故事，表示他是「受歡迎的」作家 popular。", "explanationSource": "own", "section": "105年"}, {"id": 5, "question": "第 5 題　Carol sounded happy when we talked on the phone; I could feel joy in her ______.", "options": ["eyes", "mail", "smile", "voice"], "answer": 3, "answerLabel": "D", "source": "105 會考｜單題｜第 5 題", "explanation": "講電話時只聽得到聲音，所以是從她的 voice（聲音）感受到喜悅。", "explanationSource": "own", "section": "105年"}, {"id": 6, "question": "第 6 題　Mark studies very hard and never ______ classes. He goes to school even when he is sick.", "options": ["loses", "misses", "changes", "forgets"], "answer": 1, "answerLabel": "B", "source": "105 會考｜單題｜第 6 題", "explanation": "生病還去上學，表示他從不「缺課」：miss classes。", "explanationSource": "own", "section": "105年"}, {"id": 7, "question": "第 7 題　Have you got anything for Joe ______? He'd be happy to get your gift on his birthday.", "options": ["almost", "either", "soon", "yet"], "answer": 3, "answerLabel": "D", "source": "105 會考｜單題｜第 7 題", "explanation": "Have you got...? 是現在完成式問句，句尾用 yet「已經…了嗎」。", "explanationSource": "own", "section": "105年"}, {"id": 8, "question": "第 8 題　Susan bought ______ bread in the supermarket, but she did not buy anything to drink.", "options": ["many", "some", "any", "one"], "answer": 1, "answerLabel": "B", "source": "105 會考｜單題｜第 8 題", "explanation": "bread 是不可數名詞；肯定句表示「一些」用 some。many 接可數，any 多用於否定或疑問句。", "explanationSource": "own", "section": "105年"}, {"id": 9, "question": "第 9 題　Playing sports at least three times a week ______ good for your health.", "options": ["is", "are", "has", "have"], "answer": 0, "answerLabel": "A", "source": "105 會考｜單題｜第 9 題", "explanation": "動名詞片語 Playing sports... 當主詞視為單數，用 is。", "explanationSource": "own", "section": "105年"}, {"id": 10, "question": "第 10 題　My parents have different hobbies. One enjoys baking; ______ enjoys taking pictures.", "options": ["another", "the next", "the other", "the second"], "answer": 2, "answerLabel": "C", "source": "105 會考｜單題｜第 10 題", "explanation": "父母只有兩個人：one…, the other…（一個…，另一個…）。another 用於三者以上。", "explanationSource": "own", "section": "105年"}, {"id": 11, "question": "第 11 題　My mom told me to take care of ______ in England. She worried that I couldn't eat or sleep well there.", "options": ["me", "myself", "her", "herself"], "answer": 1, "answerLabel": "B", "source": "105 會考｜單題｜第 11 題", "explanation": "主詞（我）和受詞是同一人，take care of myself（照顧自己）。", "explanationSource": "own", "section": "105年"}, {"id": 12, "question": "第 12 題　The paint on the wall is not as ______ as it was ten years ago. It has changed from white to gray.", "options": ["bright", "heavy", "sure", "young"], "answer": 0, "answerLabel": "A", "source": "105 會考｜單題｜第 12 題", "explanation": "從白色變成灰色，表示牆上的油漆不像十年前那麼「明亮」bright。", "explanationSource": "own", "section": "105年"}, {"id": 13, "question": "第 13 題　I told you this road went the wrong way, but you just wouldn't listen. Now we have to ______ and take another road.", "options": ["go ahead", "move away", "pass by", "turn back"], "answer": 3, "answerLabel": "D", "source": "105 會考｜單題｜第 13 題", "explanation": "走錯路要「掉頭」改走另一條路：turn back。", "explanationSource": "own", "section": "105年"}, {"id": 14, "question": "第 14 題　The last five years have not been ______ to Jennie. Her face is covered with lines and she looks much older than she is.", "options": ["kind", "special", "real", "enough"], "answer": 0, "answerLabel": "A", "source": "105 會考｜單題｜第 14 題", "explanation": "滿臉皺紋、看起來比實際年齡老很多，表示這五年對她「不仁慈」：be kind to sb.", "explanationSource": "own", "section": "105年"}, {"id": 15, "question": "第 15 題　My dog Jimmy loves ______ with a comb. Every time I comb his hair, he will close his eyes and fall asleep.", "options": ["to brush", "brushing", "to be brushing", "being brushed"], "answer": 3, "answerLabel": "D", "source": "105 會考｜單題｜第 15 題", "explanation": "狗是「被」梳毛，love 後接動名詞的被動 being brushed。", "explanationSource": "own", "section": "105年"}, {"id": 16, "question": "【克漏字 第 35–38 題】\nIt was 11 p.m. and Molly walked out of her bakery. She turned and looked at her store one last time. She wanted to remember what it __35__ at the moment. A few hours later, people would come and clean out everything in the store. A young man had bought it. He __36__ it into a flower shop.\nBefore it was a bakery, this place __37__ a small coffee shop. Molly worked in the shop as a waitress. But taking orders was never Molly’s dream; baking was. When she knew her boss planned to sell the shop, she borrowed money and bought it.\nHer bakery had been open for thirty years. Thirty very wonderful years. However, it would all come to an end tonight. Molly __38__ the bakery to be a family business. But her daughter was never interested in baking. Molly did not want her business in a stranger’s hands, so after some serious thinking, she decided to close it.\n“Goodbye, my dear old friend,” Molly looked at the store, whispering.\n\n▶ 第 35 題　請選出 __35__ 的最佳答案", "options": ["had looked like", "looked like", "would look like", "has looked like"], "answer": 1, "answerLabel": "B", "source": "105 會考｜克漏字｜第 35 題", "explanation": "故事用過去式敘述，她想記住店「在那一刻」看起來的樣子：looked like。", "explanationSource": "own", "section": "105年"}, {"id": 17, "question": "【克漏字 第 35–38 題】\nIt was 11 p.m. and Molly walked out of her bakery. She turned and looked at her store one last time. She wanted to remember what it __35__ at the moment. A few hours later, people would come and clean out everything in the store. A young man had bought it. He __36__ it into a flower shop.\nBefore it was a bakery, this place __37__ a small coffee shop. Molly worked in the shop as a waitress. But taking orders was never Molly’s dream; baking was. When she knew her boss planned to sell the shop, she borrowed money and bought it.\nHer bakery had been open for thirty years. Thirty very wonderful years. However, it would all come to an end tonight. Molly __38__ the bakery to be a family business. But her daughter was never interested in baking. Molly did not want her business in a stranger’s hands, so after some serious thinking, she decided to close it.\n“Goodbye, my dear old friend,” Molly looked at the store, whispering.\n\n▶ 第 36 題　請選出 __36__ 的最佳答案", "options": ["had changed", "changed", "was going to change", "has changed"], "answer": 2, "answerLabel": "C", "source": "105 會考｜克漏字｜第 36 題", "explanation": "新店主買下後「打算」把它改成花店，是過去時間點之後才要發生的事：was going to change。", "explanationSource": "own", "section": "105年"}, {"id": 18, "question": "【克漏字 第 35–38 題】\nIt was 11 p.m. and Molly walked out of her bakery. She turned and looked at her store one last time. She wanted to remember what it __35__ at the moment. A few hours later, people would come and clean out everything in the store. A young man had bought it. He __36__ it into a flower shop.\nBefore it was a bakery, this place __37__ a small coffee shop. Molly worked in the shop as a waitress. But taking orders was never Molly’s dream; baking was. When she knew her boss planned to sell the shop, she borrowed money and bought it.\nHer bakery had been open for thirty years. Thirty very wonderful years. However, it would all come to an end tonight. Molly __38__ the bakery to be a family business. But her daughter was never interested in baking. Molly did not want her business in a stranger’s hands, so after some serious thinking, she decided to close it.\n“Goodbye, my dear old friend,” Molly looked at the store, whispering.\n\n▶ 第 37 題　請選出 __37__ 的最佳答案", "options": ["used to be", "would be", "has been", "is"], "answer": 0, "answerLabel": "A", "source": "105 會考｜克漏字｜第 37 題", "explanation": "開烘焙坊之前，這裡「以前是」一家咖啡店：used to be。", "explanationSource": "own", "section": "105年"}, {"id": 19, "question": "【克漏字 第 35–38 題】\nIt was 11 p.m. and Molly walked out of her bakery. She turned and looked at her store one last time. She wanted to remember what it __35__ at the moment. A few hours later, people would come and clean out everything in the store. A young man had bought it. He __36__ it into a flower shop.\nBefore it was a bakery, this place __37__ a small coffee shop. Molly worked in the shop as a waitress. But taking orders was never Molly’s dream; baking was. When she knew her boss planned to sell the shop, she borrowed money and bought it.\nHer bakery had been open for thirty years. Thirty very wonderful years. However, it would all come to an end tonight. Molly __38__ the bakery to be a family business. But her daughter was never interested in baking. Molly did not want her business in a stranger’s hands, so after some serious thinking, she decided to close it.\n“Goodbye, my dear old friend,” Molly looked at the store, whispering.\n\n▶ 第 38 題　請選出 __38__ 的最佳答案", "options": ["had wanted", "has wanted", "would want", "will want"], "answer": 0, "answerLabel": "A", "source": "105 會考｜克漏字｜第 38 題", "explanation": "在決定關店之前，她「原本一直希望」烘焙坊成為家族事業，用過去完成式 had wanted。", "explanationSource": "own", "section": "105年"}, {"id": 20, "question": "【克漏字 第 39–41 題】\nWhat does the word family mean to you? An American study in 2006 showed that people today __39__. Over 99% of the people who were interviewed agree that a husband, a wife, and a child are a family. At the same time, 94% see a parent with a child as a family, 91% say a husband and a wife, without children, are a family, and 81% think a man and a woman, with a child, but not married, are a family too.\nThe study also found that __40__ is very important in the modern thinking on family. Though 81% think a man and a woman, not married, with a child, are a family, the percentage (%) drops to 40% if the couple doesn’t have a child. This is also true with same-sex couples. About 60% see two men, or two women, with a child, as a family, but only 32% think so when the couple doesn’t have a child.\nIn the study, those who see two men or two women that live together as a family often find it OK for same-sex couples to get married. __41__. However, not everyone opens their arms to same-sex couples: the study said 30% have no problem seeing pets as part of one’s family, but they do not think a same-sex couple is a family.\n\n▶ 第 39 題　請選出 __39__ 的最佳答案", "options": ["think differently about when to start a family", "do not find family as important as their parents did", "want many different things when they start a family", "have several different ideas about what makes a family"], "answer": 3, "answerLabel": "D", "source": "105 會考｜克漏字｜第 39 題", "explanation": "後面列出各種被視為「家庭」的組合與比例，表示人們對「什麼構成家庭」有多種看法。", "explanationSource": "own", "section": "105年"}, {"id": 21, "question": "【克漏字 第 39–41 題】\nWhat does the word family mean to you? An American study in 2006 showed that people today __39__. Over 99% of the people who were interviewed agree that a husband, a wife, and a child are a family. At the same time, 94% see a parent with a child as a family, 91% say a husband and a wife, without children, are a family, and 81% think a man and a woman, with a child, but not married, are a family too.\nThe study also found that __40__ is very important in the modern thinking on family. Though 81% think a man and a woman, not married, with a child, are a family, the percentage (%) drops to 40% if the couple doesn’t have a child. This is also true with same-sex couples. About 60% see two men, or two women, with a child, as a family, but only 32% think so when the couple doesn’t have a child.\nIn the study, those who see two men or two women that live together as a family often find it OK for same-sex couples to get married. __41__. However, not everyone opens their arms to same-sex couples: the study said 30% have no problem seeing pets as part of one’s family, but they do not think a same-sex couple is a family.\n\n▶ 第 40 題　請選出 __40__ 的最佳答案", "options": ["whether people are married or not", "whether people have a child or not", "whether people live together or not", "whether people love each other or not"], "answer": 1, "answerLabel": "B", "source": "105 會考｜克漏字｜第 40 題", "explanation": "後文比較「有小孩／沒小孩」時比例大幅下降（81%→40%、60%→32%），關鍵是有沒有孩子。", "explanationSource": "own", "section": "105年"}, {"id": 22, "question": "【克漏字 第 39–41 題】\nWhat does the word family mean to you? An American study in 2006 showed that people today __39__. Over 99% of the people who were interviewed agree that a husband, a wife, and a child are a family. At the same time, 94% see a parent with a child as a family, 91% say a husband and a wife, without children, are a family, and 81% think a man and a woman, with a child, but not married, are a family too.\nThe study also found that __40__ is very important in the modern thinking on family. Though 81% think a man and a woman, not married, with a child, are a family, the percentage (%) drops to 40% if the couple doesn’t have a child. This is also true with same-sex couples. About 60% see two men, or two women, with a child, as a family, but only 32% think so when the couple doesn’t have a child.\nIn the study, those who see two men or two women that live together as a family often find it OK for same-sex couples to get married. __41__. However, not everyone opens their arms to same-sex couples: the study said 30% have no problem seeing pets as part of one’s family, but they do not think a same-sex couple is a family.\n\n▶ 第 41 題　請選出 __41__ 的最佳答案", "options": ["This is not surprising", "This is not possible everywhere", "It is no good news for everyone", "It cannot be this way for very long"], "answer": 0, "answerLabel": "A", "source": "105 會考｜克漏字｜第 41 題", "explanation": "把同性伴侶視為家庭的人也贊成同性婚姻，這「不令人意外」；後面再用 However 轉折。", "explanationSource": "own", "section": "105年"}, {"id": 23, "question": "第 1 題　Look at the picture. The dog is sitting ______.", "options": ["on the bag", "next to the woman", "inside the bag", "between the woman and the bag"], "answer": 1, "answerLabel": "B", "source": "106 會考｜單題｜第 1 題", "explanation": "圖中狗坐在車上、女人的旁邊：next to the woman。", "explanationSource": "own", "section": "106年"}, {"id": 24, "question": "第 2 題　My sister wants to buy a car ______ she doesn’t have enough money.", "options": ["because", "but", "if", "or"], "answer": 1, "answerLabel": "B", "source": "106 會考｜單題｜第 2 題", "explanation": "想買車卻沒錢，前後語意相反，用 but。", "explanationSource": "own", "section": "106年"}, {"id": 25, "question": "第 3 題　Jim always forgets my birthday. He has asked me many times and still can’t ______ it.", "options": ["answer", "celebrate", "remember", "understand"], "answer": 2, "answerLabel": "C", "source": "106 會考｜單題｜第 3 題", "explanation": "他一直忘記我的生日，問了很多次還是「記不住」：can’t remember it。", "explanationSource": "own", "section": "106年"}, {"id": 26, "question": "第 4 題　The little girl was ______ by a truck on her way home and was badly hurt.", "options": ["hit", "led", "lost", "paid"], "answer": 0, "answerLabel": "A", "source": "106 會考｜單題｜第 4 題", "explanation": "be hit by a truck＝被卡車撞到，後句說傷得很重。", "explanationSource": "own", "section": "106年"}, {"id": 27, "question": "第 5 題　Excuse me. I really need to go now. My kids ______ for me at school.", "options": ["are waiting", "were waiting", "wait", "waited"], "answer": 0, "answerLabel": "A", "source": "106 會考｜單題｜第 5 題", "explanation": "I need to go now 表示孩子「現在正在」學校等我：現在進行式 are waiting。", "explanationSource": "own", "section": "106年"}, {"id": 28, "question": "第 6 題　Amy’s father is very sick. The doctors can do nothing for him, so Amy went to the temple to ______ for him.", "options": ["care", "count", "look", "pray"], "answer": 3, "answerLabel": "D", "source": "106 會考｜單題｜第 6 題", "explanation": "醫生已無能為力，所以去廟裡「祈禱」：pray for him。", "explanationSource": "own", "section": "106年"}, {"id": 29, "question": "第 7 題　I’m glad that my school has students wear ______. I don’t have to worry about what clothes to wear to school.", "options": ["belts", "caps", "gloves", "uniforms"], "answer": 3, "answerLabel": "D", "source": "106 會考｜單題｜第 7 題", "explanation": "不用煩惱穿什麼衣服上學，因為學校規定穿「制服」uniforms。", "explanationSource": "own", "section": "106年"}, {"id": 30, "question": "第 8 題　We are surprised that Sally and Ray decided to get married. No one knows ______. They often fight with each other and are unhappy together.", "options": ["why", "where", "when", "how"], "answer": 0, "answerLabel": "A", "source": "106 會考｜單題｜第 8 題", "explanation": "他們常吵架、在一起不快樂，大家不懂「為什麼」要結婚：why。", "explanationSource": "own", "section": "106年"}, {"id": 31, "question": "第 9 題　I don’t think Katie will read any one of the books you’ve picked out for her: ______ look(s) very boring.", "options": ["it", "one", "some", "they"], "answer": 3, "answerLabel": "D", "source": "106 會考｜單題｜第 9 題", "explanation": "指前面提到的 the books（複數），代名詞用 they（look 不加 s）。", "explanationSource": "own", Label": "C", "source": "107 會考｜單題｜第 11 題", "explanation": "歌手「被看見」常在這裡出現，用被動語態：are often seen。", "explanationSource": "own", "section": "107年"}, {"id": 57, "question": "第 12 題　The factory has been throwing trash into the river for years. Now ______ must be taken to stop this.", "options": ["action", "chances", "exercise", "notes"], "answer": 0, "answerLabel": "A", "source": "107 會考｜單題｜第 12 題", "explanation": "要阻止工廠往河裡丟垃圾，必須「採取行動」：take action。", "explanationSource": "own", "section": "107年"}, {"id": 58, "question": "第 13 題　The beach party tonight ______ the end of our summer vacation. Tomorrow we are all going back home and getting ready for school.", "options": ["changes", "marks", "passes", "saves"], "answer": 1, "answerLabel": "B", "source": "107 會考｜單題｜第 13 題", "explanation": "今晚的海灘派對「標誌著」暑假結束：mark（標示、象徵）。", "explanationSource": "own", "section": "107年"}, {"id": 59, "question": "第 14 題　Anyone who reads Loren’s business plan will quickly see some serious problems in it, or ______ feel something is not right.", "options": ["at least", "even", "in fact", "still"], "answer": 0, "answerLabel": "A", "source": "107 會考｜單題｜第 14 題", "explanation": "大家很快會看出問題，「至少」也會覺得不對勁：at least。", "explanationSource": "own", "section": "107年"}, {"id": 60, "question": "第 15 題　I’ve wanted to read The Diary of a Young Girl for months, ______ today I finally borrowed the book from the library.", "options": ["and", "since", "so", "until"], "answer": 0, "answerLabel": "A", "source": "107 會考｜單題｜第 15 題", "explanation": "想讀這本書好幾個月，「而」今天終於借到了；表示順接用 and。", "explanationSource": "own", "section": "107年"}, {"id": 61, "question": "【克漏字 第 16–18 題】\nRobert likes to take a walk in the park after work. One day when he was walking in the park, he heard a woman calling his name. He stopped to look around, but didn’t see anything __16__. Shortly after Robert saw it, it was gone.\nThough Robert felt a little strange, he did not think about it too much and sat down for a rest on a bench in the park. Then he noticed the snake he had just seen __17__. Robert was too afraid to move away from the bench. Right at this moment, a woman behind him shouted, “Come here, Robert. You can’t stay on the bench like that. __18__.”\nIn surprise, Robert turned around and said to the woman, “Excuse me, but that’s not a very nice thing to say, and in fact some people say I’m handsome.”\n“I’m not talking to you,” said the woman. “I’m telling Robert, my pet snake, to get down from the bench, not you.”\n\n▶ 第 16 題　請選出 __16__ 的最佳答案", "options": ["like a snake", "that could move", "except a little snake", "that could make noise"], "answer": 2, "answerLabel": "C", "source": "107 會考｜克漏字｜第 16 題", "explanation": "後句說 Shortly after Robert saw it, it was gone，且下段提到 the snake he had just seen，所以他「除了一條小蛇」什麼都沒看到。", "explanationSource": "own", "section": "107年"}, {"id": 62, "question": "【克漏字 第 16–18 題】\nRobert likes to take a walk in the park after work. One day when he was walking in the park, he heard a woman calling his name. He stopped to look around, but didn’t see anything __16__. Shortly after Robert saw it, it was gone.\nThough Robert felt a little strange, he did not think about it too much and sat down for a rest on a bench in the park. Then he noticed the snake he had just seen __17__. Robert was too afraid to move away from the bench. Right at this moment, a woman behind him shouted, “Come here, Robert. You can’t stay on the bench like that. __18__.”\nIn surprise, Robert turned around and said to the woman, “Excuse me, but that’s not a very nice thing to say, and in fact some people say I’m handsome.”\n“I’m not talking to you,” said the woman. “I’m telling Robert, my pet snake, to get down from the bench, not you.”\n\n▶ 第 17 題　請選出 __17__ 的最佳答案", "options": ["climbing up the bench", "running after a woman", "stopping beside his feet", "falling down from a tree"], "answer": 0, "answerLabel": "A", "source": "107 會考｜克漏字｜第 17 題", "explanation": "他嚇得不敢離開長椅，最後女子叫蛇「從長椅上下來」，可知蛇正「爬上長椅」。", "explanationSource": "own", "section": "107年"}, {"id": 63, "question": "【克漏字 第 16–18 題】\nRobert likes to take a walk in the park after work. One day when he was walking in the park, he heard a woman calling his name. He stopped to look around, but didn’t see anything __16__. Shortly after Robert saw it, it was gone.\nThough Robert felt a little strange, he did not think about it too much and sat down for a rest on a bench in the park. Then he noticed the snake he had just seen __17__. Robert was too afraid to move away from the bench. Right at this moment, a woman behind him shouted, “Come here, Robert. You can’t stay on the bench like that. __18__.”\nIn surprise, Robert turned around and said to the woman, “Excuse me, but that’s not a very nice thing to say, and in fact some people say I’m handsome.”\n“I’m not talking to you,” said the woman. “I’m telling Robert, my pet snake, to get down from the bench, not you.”\n\n▶ 第 18 題　請選出 __18__ 的最佳答案", "options": ["The bench is broken", "The seat has been taken", "People will be scared by you", "The paint of the bench is still wet"], "answer": 2, "answerLabel": "C", "source": "107 會考｜克漏字｜第 18 題", "explanation": "Robert 回答「這話不太好聽，有人說我很帥」，表示他以為女子說「別人會被你嚇到」。", "explanationSource": "own", "section": "107年"}, {"id": 64, "question": "【克漏字 第 19–21 題】\nIf you cannot live without your car, Zurich might be the last city you would like to visit. In Zurich, people are welcome, but cars are not! Over the past 20 years, this city has used smart ways __19__. One is to keep the same total number of parking spaces. For example, if 50 new parking spaces are built in one part of the city, then 50 old spaces in other parts are taken away for other uses. So the total number does not change. Some are unhappy that there are never enough spaces. That is just what the city has in mind: If people find parking more difficult, they will drive less.\n__20__, the total number of cars in the city is counted. Over 3,500 little computers are put under Zurich roads to check the number of cars that enter the city. If the number is higher than the city can deal with, the traffic lights on the roads that enter the city will be kept red. So drivers who are traveling into Zurich have to stop and wait until there are fewer cars in the city. Now, you may wonder __21__. The answer is simple: The city wants to make more space for its people.\n\n▶ 第 19 題　請選出 __19__ 的最佳答案", "options": ["to make traffic lighter", "to invite people to visit", "to make itself a famous city", "to build more parking spaces"], "answer": 0, "answerLabel": "A", "source": "107 會考｜克漏字｜第 19 題", "explanation": "後面介紹限制停車位、控管進城車輛等方法，目的是「減輕交通量」。", "explanationSource": "own", "section": "107年"}, {"id": 65, "question": "【克漏字 第 19–21 題】\nIf you cannot live without your car, Zurich might be the last city you would like to visit. In Zurich, people are welcome, but cars are not! Over the past 20 years, this city has used smart ways __19__. One is to keep the same total number of parking spaces. For example, if 50 new parking spaces are built in one part of the city, then 50 old spaces in other parts are taken away for other uses. So the total number does not change. Some are unhappy that there are never enough spaces. That is just what the city has in mind: If people find parking more difficult, they will drive less.\n__20__, the total number of cars in the city is counted. Over 3,500 little computers are put under Zurich roads to check the number of cars that enter the city. If the number is higher than the city can deal with, the traffic lights on the roads that enter the city will be kept red. So drivers who are traveling into Zurich have to stop and wait until there are fewer cars in the city. Now, you may wonder __21__. The answer is simple: The city wants to make more space for its people.\n\n▶ 第 20 題　請選出 __20__ 的最佳答案", "options": ["This way", "However", "For example", "Also"], "answer": 3, "answerLabel": "D", "source": "107 會考｜克漏字｜第 20 題", "explanation": "前段是第一個方法（One is...），這裡介紹「另一個」方法，用 Also（此外）。", "explanationSource": "own", "section": "107年"}, {"id": 66, "question": "【克漏字 第 19–21 題】\nIf you cannot live without your car, Zurich might be the last city you would like to visit. In Zurich, people are welcome, but cars are not! Over the past 20 years, this city has used smart ways __19__. One is to keep the same total number of parking spaces. For example, if 50 new parking spaces are built in one part of the city, then 50 old spaces in other parts are taken away for other uses. So the total number does not change. Some are unhappy that there are never enough spaces. That is just what the city has in mind: If people find parking more difficult, they will drive less.\n__20__, the total number of cars in the city is counted. Over 3,500 little computers are put under Zurich roads to check the number of cars that enter the city. If the number is higher than the city can deal with, the traffic lights on the roads that enter the city will be kept red. So drivers who are traveling into Zurich have to stop and wait until there are fewer cars in the city. Now, you may wonder __21__. The answer is simple: The city wants to make more space for its people.\n\n▶ 第 21 題　請選出 __21__ 的最佳答案", "options": ["why Zurich is doing this", "what all this has cost Zurich", "if Zurich should try other ways", "if Zurich can deal with angry drivers"], "answer": 0, "answerLabel": "A", "source": "107 會考｜克漏字｜第 21 題", "explanation": "後句 The answer is simple: 要為市民多留空間，回答的是「為什麼這樣做」。", "explanationSource": "own", "section": "107年"}, {"id": 67, "question": "第 1 題　Look at the picture. The mother duck is ______ the baby ducks across the street.", "options": ["carrying", "leading", "pushing", "watching"], "answer": 1, "answerLabel": "B", "source": "108 會考｜單題｜第 1 題", "explanation": "圖中母鴨走在前面，小鴨跟著過馬路，是在「帶領」：leading。", "explanationSource": "own", "section": "108年"}, {"id": 68, "question": "第 2 題　Ms. Liu usually gives us a lot of homework, ______ she didn’t give us any today.", "options": ["but", "if", "or", "so"], "answer": 0, "answerLabel": "A", "source": "108 會考｜單題｜第 2 題", "explanation": "老師通常出很多功課，「但」今天沒出，語意轉折用 but。", "explanationSource": "own", "section": "108年"}, {"id": 69, "question": "第 3 題　Playing games on the cellphone ______ popular with high school students.", "options": ["is", "are", "being", "to be"], "answer": 0, "answerLabel": "A", "source": "108 會考｜單題｜第 3 題", "explanation": "動名詞片語 Playing games... 當主詞視為單數，用 is。", "explanationSource": "own", "section": "108年"}, {"id": 70, "question": "第 4 題　There ______ more than twenty clubs in our school. Which one would you like to join?", "options": ["has", "have", "is", "are"], "answer": 3, "answerLabel": "D", "source": "108 會考｜單題｜第 4 題", "explanation": "表示「某地有…」用 There is/are；more than twenty clubs 是複數，用 are。", "explanationSource": "own", "section": "108年"}, {"id": 71, "question": "第 5 題　Diane had a bad cold last week. She is still too ______ to go mountain climbing with you.", "options": ["busy", "short", "weak", "young"], "answer": 2, "answerLabel": "C", "source": "108 會考｜單題｜第 5 題", "explanation": "上週重感冒，現在身體還太「虛弱」不能去爬山：too weak to...", "explanationSource": "own", "section": "108年"}, {"id": 72, "question": "第 6 題　The book under Mary’s desk is ______, but I don’t know why it is there.", "options": ["us", "me", "my", "mine"], "answer": 3, "answerLabel": "D", "source": "108 會考｜單題｜第 6 題", "explanation": "空格要代替 Mary’s book，用所有格代名詞 mine（我的書）。", "explanationSource": "own", "section": "108年"}, {"id": 73, "question": "第 7 題　Last night a garbage truck hit a tree and turned over. Now the street is ______ with lots of garbage.", "options": ["dark", "dirty", "heavy", "poor"], "answer": 1, "answerLabel": "B", "source": "108 會考｜單題｜第 7 題", "explanation": "垃圾車翻覆、滿街垃圾，街道很「髒」：dirty with garbage。", "explanationSource": "own", "section": "108年"}, {"id": 74, "question": "第 8 題　It almost killed Kevin to take care of his baby sister for one afternoon. He wondered how his mom could do ______ every day.", "options": ["her", "it", "one", "them"], "answer": 1, "answerLabel": "B", "source": "108 會考｜單題｜第 8 題", "explanation": "it 指前面整件事「照顧妹妹」；他不懂媽媽怎麼能每天做這件事。", "explanationSource": "own", "section": "108年"}, {"id": 75, "question": "第 9 題　Joyce tells her brother everything. She never ______ anything from him.", "options": ["covers", "believes", "hides", "takes"], "answer": 2, "answerLabel": "C", "source": "108 會考｜單題｜第 9 題", "explanation": "什麼都跟哥哥說，表示從不「隱瞞」任何事：hide sth. from sb.", "explanationSource": "own", "section": "108年"}, {"id": 76, "question": "第 10 題　Ben always uses his birthday as a(n) ______ to ask Dad to buy him something expensive.", "options": ["action", "excuse", "prize", "rule"], "answer": 1, "answerLabel": "B", "source": "108 會考｜單題｜第 10 題", "explanation": "拿生日當作「藉口」要爸爸買貴的東西：excuse。", "explanationSource": "own", "section": "108年"}, {"id": 77, "question": "第 11 題　______ that last piece of pie? If not, can I have it? I didn’t eat much this morning.", "options": ["Had you eaten", "Were you eating", "Do you eat", "Are you going to eat"], "answer": 3, "answerLabel": "D", "source": "108 會考｜單題｜第 11 題", "explanation": "問對方「是否打算吃」最後一塊派，如果不吃我可以吃嗎？表示未來打算：Are you going to eat...?", "explanationSource": "own", "section": "108年"}, {"id": 78, "question": "第 12 題　Everyone in the class enjoys playing chess ______ Bill; he thinks the game is boring.", "options": ["except", "for", "like", "of"], "answer": 0, "answerLabel": "A", "source": "108 會考｜單題｜第 12 題", "explanation": "全班都喜歡下棋，「除了」Bill，他覺得很無聊：except。", "explanationSource": "own", "section": "108年"}, {"id": 79, "question": "第 13 題　In my school days, I ______ to English radio programs every day. That was how I learned English at that time.", "options": ["listen", "have listened", "used to listen", "was listening"], "answer": 2, "answerLabel": "C", "source": "108 會考｜單題｜第 13 題", "explanation": "In my school days 是過去的習慣，用 used to listen（過去常常聽）。", "explanationSource": "own", "section": "108年"}, {"id": 80, "question": "第 14 題　Tom’s voic n", "section": "111年"}, {"id": 137, "question": "第 7 題　It was ______ for us to answer the math question because we’ve done the same kind of questions many times.", "options": ["common", "easy", "safe", "special"], "answer": 1, "answerLabel": "B", "source": "111 會考｜單題｜第 7 題", "explanation": "同類型題目做過很多次，所以回答很「容易」：easy。", "explanationSource": "own", "section": "111年"}, {"id": 138, "question": "第 8 題　Although it took me lots of time ______ a big meal for ten people, I was happy that everyone enjoyed it.", "options": ["prepare", "to prepare", "preparing", "prepared"], "answer": 1, "answerLabel": "B", "source": "111 會考｜單題｜第 8 題", "explanation": "It takes + 人 + 時間 + to V：花了很多時間「去準備」：to prepare。", "explanationSource": "own", "section": "111年"}, {"id": 139, "question": "第 9 題　Don’t let the children swim in the river. We don’t know how ______ it is. It could be dangerous.", "options": ["deep", "far", "long", "thick"], "answer": 0, "answerLabel": "A", "source": "111 會考｜單題｜第 9 題", "explanation": "不知道河水有多「深」，可能很危險：how deep。", "explanationSource": "own", "section": "111年"}, {"id": 140, "question": "第 10 題　Bob is ______ of the boys in the family. He never does any housework. His brothers at least take out the garbage sometimes.", "options": ["lazier", "the lazy", "the lazier", "the laziest"], "answer": 3, "answerLabel": "D", "source": "111 會考｜單題｜第 10 題", "explanation": "他從不做家事，兄弟至少偶爾倒垃圾，所以他是家中「最懶」的：the laziest。", "explanationSource": "own", "section": "111年"}, {"id": 141, "question": "第 11 題　Aunt Gina has lived in this town for more than sixty years, so she ______ it very well.", "options": ["will know", "knew", "knows", "was going to know"], "answer": 2, "answerLabel": "C", "source": "111 會考｜單題｜第 11 題", "explanation": "已經住了六十多年，現在對這個城鎮很「熟悉」，陳述現在事實用現在式 knows。", "explanationSource": "own", "section": "111年"}, {"id": 142, "question": "第 12 題　We won’t see the sun even after the typhoon leaves, because the news said that heavier rain will soon ______.", "options": ["catch", "follow",  or “vans.” Maybe Katz can study this difference for his next book.\n（website 網站）\n\n▶ 第 42 題　請選出 __42__ 的最佳答案", "options": ["what things are called", "how sports are played", "why different languages are spoken", "what words are often spelled differently"], "answer": 0, "answerLabel": "A", "source": "112 會考｜克漏字｜第 42 題", "explanation": "書中調查人們用什麼字稱呼某樣東西（如運動鞋的不同說法），主題是「東西被怎麼稱呼」。", "explanationSource": "own", "section": "112年"}, {"id": 179, "question": "【克漏字 第 42–43 題】\nNiceReads\nSpeaking American is a great book!\nLucia Leisure ★★★★★\nI just love Josh Katz’s new book! It’s about __42__ in different parts of the US. The information in the book was collected from the quiz that Katz built on the website in 2013. The quiz asked what words people use for something, and their answers showed interesting facts. For example, there are different names for sports shoes. In most parts of the US, people say “tennis shoes.” In the northeast of the country, people wear “sneakers.” In some towns, “tennis shoes” and “sneakers” become “gym shoes.”\nThe use of words tells us where people are from, like Katz’s book says. But in my experience, it also shows __43__. My family has lived in New York since my grandparents. It’s not surprising that I say “sneakers.” But my grandfather says “plimsolls,” and my daughter says “kicks” or “vans.” Maybe Katz can study this difference for his next book.\n（website 網站）\n\n▶ 第 43 題　請選出 __43__ 的最佳答案", "options": ["how old they are", "who they speak to", "where they grew up", "whether they are men or women"], "answer": 0, "answerLabel": "A", "source": "112 會考｜克漏字｜第 43 題", "explanation": "作者一家都住紐約，但祖父、自己、女兒對運動鞋說法不同，差別在「年紀」。", "explanationSource": "own", "section": "112年"}, {"id": 180, "question": "第 1 題　Look at the picture. There is ______ under the door.", "options": ["an envelope", "a plant", "a sign", "an umbrella"], "answer": 0, "answerLabel": "A", "source": "113 會考｜單題｜第 1 題", "explanation": "圖中門下放著一個「信封」：an envelope。", "explanationSource": "own", "section": "113年"}, {"id": 181, "question": "第 2 題　My ______ hurts so much that I cannot even turn my head.", "options": ["arm", "knee", "neck", "stomach"], "answer": 2, "answerLabel": "C", "source": "113 會考｜單題｜第 2 題", "explanation": "痛到連頭都轉不了，是「脖子」痛：neck。", "explanationSource": "own", "section": "113年"}, {"id": 182, "question": "第 3 題　Our school basketball team won the national game last night. We are so ______ them.", "options": ["popular with", "proud of", "sorry for", "worried about"], "answer": 1, "answerLabel": "B", "source": "113 會考｜單題｜第 3 題", "explanation": "球隊得到全國冠軍，我們以他們為「榮」：be proud of。", "explanationSource": "own", "section": "113年"}, {"id": 183, "question": "第 4 題　Tomorrow is Sam’s last day in the office. Nobody knows why he decided to ______.", "options": ["hide", "leave", "pack", "walk"], "answer": 1, "answerLabel": "B", "source": "113 會考｜單題｜第 4 題", "explanation": "明天是最後一天上班，沒人知道他為什麼決定「離職」：leave。", "explanationSource": "own", "section": "113年"}, {"id": 184, "question": "第 5 題　It’s not a good idea to go mountain climbing in this bad ______. We should wait until the typhoon goes away.", "options": ["chance", "dream", "habit", "weather"], "answer": 3, "answerLabel": "D", "source": "113 會考｜單題｜第 5 題", "explanation": "等颱風走了再去，表示現在「天氣」不好：bad weather。", "explanationSource": "own", "section": "113年"}, {"id": 185, "question": "第 6 題　Chris loves walking with Anna on snowy days, but Anna hates ______ very much.", "options": ["them", "so", "one", "it"], "answer": 3, "answerLabel": "D", "source": "113 會考｜單題｜第 6 題", "explanation": "it 代替前面提到的「在雪天散步」這件事。", "explanationSource": "own", "section": "113年"}, {"id": 186, "question": "第 7 題　Lora likes to eat bananas that are already a little brown on the outside, and so ______ I.", "options": ["am", "do", "have", "will"], "answer": 1, "answerLabel": "B", "source": "113 會考｜單題｜第 7 題", "explanation": "附和句：前句 likes 是現在式一般動詞，so do I（我也是）。", "explanationSource": "own", "section": "113年"}, {"id": 187, "question": "第 8 題　Your refrige
