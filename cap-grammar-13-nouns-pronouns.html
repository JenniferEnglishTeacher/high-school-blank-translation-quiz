<script>window.QUIZ_CONFIG={"title": "國中會考文法歷屆試題｜名詞、冠詞、代名詞、數量詞", "mode": "mcq", "questions": [{"id": 1, "question": "Mr. and Mrs. Wu have three daughters. Two are in high school, and ______ is in elementary school.", "options": ["each", "the other", "the one", "the next"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜two…, the other（三者中剩下的一個）", "explanation": "【句型】三者中：two…, the other…（兩個…，剩下的那一個…）；兩者中：one…, the other…。\n【分析】三個女兒，兩個念高中，剩下最後一個念小學，用 the other（= the other daughter）。\n【其他選項】(A) each 每一個，語意不合；(C) the one 「那一個」需有修飾語指明是哪一個；(D) the next 下一個，有順序意，不合。\n【例句】I have three pets. Two are cats, and the other is a dog.", "explanationSource": "source"}, {"id": 2, "question": "Ben has two brothers. One lives in Taichung, and ______ lives in Taipei.", "options": ["another", "other", "the other", "others"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 1 題）", "explanation": "兩者中 one…, the other…。", "explanationSource": "supplemental"}, {"id": 3, "question": "There are four students in the room. Three are reading, and ______ is sleeping.", "options": ["the other", "another", "others", "the others"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 1 題）", "explanation": "四人中三個…，剩下唯一的一個用 the other。", "explanationSource": "supplemental"}, {"id": 4, "question": "I don't like this shirt. Can you show me ______ one?", "options": ["the others", "another", "other", "others"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 1 題）", "explanation": "another one 另一件（不特定）。", "explanationSource": "supplemental"}, {"id": 5, "question": "I want to find another dentist because ______ pulled out a good tooth last time I went to him.", "options": ["I", "me", "mine", "myself"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜所有格代名詞 mine（= my dentist）", "explanation": "【句型】所有格代名詞 mine = my + 名詞，可當主詞。\n【分析】拔牙的是牙醫，不是「我」；後面 last time I went to him 的 him 也指牙醫。所以空格是 mine = my dentist：「我想換牙醫，因為我的牙醫上次拔掉我一顆好牙」。\n【其他選項】(A) I 雖是主格，但「我拔掉一顆好牙」不合理，也與 to him 不呼應；(B) me 受格不能當主詞；(D) myself 反身代名詞不能當主詞。\n【例句】Your bike is new, but mine is very old.\n備註：參考答案 bf15af99.txt 給 A (I)。但「我」拔牙不合理，且 him 指牙醫，正解應為 C mine（= my dentist）；此題已依語意改為 C，請老師確認。", "explanationSource": "source"}, {"id": 6, "question": "Tina's computer is fast, but ______ is very slow. I need a new one.", "options": ["my", "me", "mine", "myself"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 5 題）", "explanation": "mine = my computer，當主詞。", "explanationSource": "supplemental"}, {"id": 7, "question": "I forgot my umbrella, so Kevin shared ______ with me.", "options": ["his", "him", "he", "himself"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 5 題）", "explanation": "his = his umbrella，所有格代名詞當受詞。", "explanationSource": "supplemental"}, {"id": 8, "question": "Our classroom is on the second floor. Where is ______?", "options": ["you", "your", "yourself", "yours"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 5 題）", "explanation": "yours = your classroom，所有格代名詞當主詞。", "explanationSource": "supplemental"}, {"id": 9, "question": "I guess the rainwater has come in from the kitchen. See? ______ of the windows are closed except the one in the kitchen.", "options": ["All", "Both", "Most", "Some"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜All of … except …", "explanation": "【句型】All of the + 複數名詞 + except…（除了…之外全部都…）。\n【分析】雨水從廚房進來，因為「除了廚房那扇窗之外，所有窗戶都關著」；except the one in the kitchen 只排除一扇，其餘全部，選 All。\n【其他選項】(B) Both 只用於兩者，題中窗戶不只兩扇；(C) Most、(D) Some 表示「大部分／一些」，與 except 只排除一扇的語意不合，也無法推論雨水只從廚房進來。\n【例句】All of the students passed the test except Tom.", "explanationSource": "source"}, {"id": 10, "question": "______ of my classmates came to the party except Ivy. She was sick.", "options": ["Both", "All", "Few", "Some"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 9 題）", "explanation": "except Ivy 只排除一人，表示其餘全部都來，用 All。", "explanationSource": "supplemental"}, {"id": 11, "question": "I have two cousins. ______ of them live in Kaohsiung.", "options": ["Both", "All", "Each", "Most"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 9 題）", "explanation": "兩者都用 Both，接複數動詞 live。", "explanationSource": "supplemental"}, {"id": 12, "question": "There are thirty students in my class, and ______ of them wear glasses. Only five don't.", "options": ["all", "both", "most", "none"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 9 題）", "explanation": "三十人中只有五人不戴，即「大部分」，用 most。", "explanationSource": "supplemental"}, {"id": 13, "question": "Nora: Can I check your drawer for some tools we can use?\nMatt: Sure. Take a look. See if you can find ______ in there.", "options": ["any", "it", "others", "those"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜any（條件／疑問句中的「任何」）", "explanation": "【句型】any 用於疑問、否定、if 條件句，表「任何（一些）」，可當代名詞。\n【分析】See if you can find any (tools)「看看你能不能在裡面找到任何（可用的）工具」，選 any。\n【其他選項】(B) it 指特定單數，但 tools 為複數且未特定；(C) others「其他的」，前面沒提到已有的工具，語意不合；(D) those 指特定的那些，Matt 不知道有哪些工具。\n【例句】I need some stamps. Do you have any?", "explanationSource": "source"}, {"id": 14, "question": "Amy: I need some glue for my project.\nBen: Sorry, I don't have ______.", "options": ["one", "it", "any", "some"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 13 題）", "explanation": "否定句中用 any 表示「任何（一些）」。", "explanationSource": "supplemental"}, {"id": 15, "question": "These cookies are delicious. Would you like ______?", "options": ["some", "any", "it", "other"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 13 題）", "explanation": "表示邀請、提供東西的疑問句用 some。", "explanationSource": "supplemental"}, {"id": 16, "question": "I lost my eraser. Do you have ______ I can borrow?", "options": ["it", "one", "them", "those"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 13 題）", "explanation": "one 代替「一個不特定的」橡皮擦（單數可數名詞）。", "explanationSource": "supplemental"}, {"id": 17, "question": "______ of my sisters are older than I am. I'm the youngest of the three children in my family.", "options": ["Both", "Few", "Most", "Some"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜Both of（兩者都）", "explanation": "【句型】Both of + 複數名詞 + 複數動詞（兩者都…）。\n【分析】家中三個小孩、我最小，所以我有兩個姊姊，而且「兩個都比我大」，選 Both。\n【其他選項】(B) Few 很少，語意不合；(C) Most、(D) Some 用於三者以上的一部分，只有兩個姊姊時不適用。\n【例句】Both of my parents are teachers.", "explanationSource": "source"}, {"id": 18, "question": "I have two dogs. ______ of them like to sleep on my bed.", "options": ["All", "Both", "Each", "Neither"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 17 題）", "explanation": "兩隻狗都喜歡，用 Both，接複數動詞 like。", "explanationSource": "supplemental"}, {"id": 19, "question": "Jay has two sisters, but ______ of them can swim.", "options": ["neither", "both", "all", "none"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 17 題）", "explanation": "兩者都不用 neither；but 表示轉折。", "explanationSource": "supplemental"}, {"id": 20, "question": "I'm the oldest of the four children in my family. ______ of my brothers are younger than I am.", "options": ["Both", "Some", "All", "Few"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 17 題）", "explanation": "四個小孩我最大，另外三個（三者以上）全部比我小，用 All。", "explanationSource": "supplemental"}, {"id": 21, "question": "Beatrice loves to draw apples. You can see ______ in her notebooks, on her letters, and even on her school bag!", "options": ["one", "others", "them", "which"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜them 代替前面特定的複數名詞", "explanation": "【句型】代名詞 them 代替前面提過的「特定」複數名詞。\n【分析】空格指的是 Beatrice 畫的那些 apples（複數、特定），當 see 的受詞，用受格 them。\n【其他選項】(A) one 代替單數且不特定的名詞；(B) others「其他的」，前面沒有對比的東西；(D) which 是疑問詞／關係代名詞，不能單獨當受詞。\n【例句】I bought some cookies and gave them to my friends.", "explanationSource": "source"}, {"id": 22, "question": "Leo collects stamps from different countries. He keeps ______ in a big album.", "options": ["it", "them", "one", "others"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 21 題）", "explanation": "them 代替前面特定的複數名詞 stamps。", "explanationSource": "supplemental"}, {"id": 23, "question": "I lost my pencil case. Have you seen ______?", "options": ["it", "one", "them", "another"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 21 題）", "explanation": "it 代替前面特定的單數名詞 my pencil case。", "explanationSource": "supplemental"}, {"id": 24, "question": "I need a ruler. Do you have ______?", "options": ["it", "them", "one", "those"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 21 題）", "explanation": "one 代替不特定的單數名詞 a ruler。", "explanationSource": "supplemental"}, {"id": 25, "question": "My wife enjoys going to the movies with her friends, but I like to watch TV at home by ______.", "options": ["I", "me", "myself", "mine"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜by + 反身代名詞（獨自）", "explanation": "【句型】by + 反身代名詞 ＝ alone（獨自）。\n【分析】主詞是 I，與「太太和朋友去看電影」對比，「我喜歡自己一個人在家看電視」，用 by myself。\n【其他選項】(A) I 主格；(B) me 受格；(D) mine 所有格代名詞；三者都不能用於「by + 反身代名詞」表「獨自」。\n【例句】Mia went to Japan by herself last summer.", "explanationSource": "source"}, {"id": 26, "question": "Steve is only six, but he can take the bus to school by ______.", "options": ["himself", "him", "his", "he"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 25 題）", "explanation": "by himself 獨自，主詞為 he。", "explanationSource": "supplemental"}, {"id": 27, "question": "The twins cooked dinner by ______ for the first time.", "options": ["them", "themselves", "theirs", "their"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 25 題）", "explanation": "主詞 The twins 為複數，用 by themselves。", "explanationSource": "supplemental"}, {"id": 28, "question": "Lily, did you finish this painting by ______? It looks great!", "options": ["you", "your", "yours", "yourself"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 25 題）", "explanation": "對 Lily 說話，用 by yourself 表「你自己一個人」。", "explanationSource": "supplemental"}, {"id": 29, "question": "Ms. Johnson has been taking phone calls since she entered the office this morning. Just when she thought she could finally leave work, ______ call came in.", "options": ["another", "each", "the next", "the other"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜another + 單數名詞（又一個）", "explanation": "【句型】another + 單數名詞（再一個、又一個，不特定）。\n【分析】她整天一直接電話，正以為可以下班時，「又一通」電話打進來，選 another call。\n【其他選項】(B) each call 每一通，與 came in（一通進來）語意不合；(C) the next call 指順序上的下一通，無法表達「又來一通」的無奈；(D) the other 用於兩者中的另一個，電話不只兩通。\n【例句】I've already eaten two pieces of cake, but I want another one.", "explanationSource": "source"}, {"id": 30, "question": "Ken finished his hamburger quickly and ordered ______ one.", "options": ["other", "another", "the other", "others"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 29 題）", "explanation": "another + 單數名詞，表示再一個。", "explanationSource": "supplemental"}, {"id": 31, "question": "We have already visited three museums today. Let's not go to ______ museum.", "options": ["another", "other", "the others", "each"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 29 題）", "explanation": "已去了三間，不要再去「又一間」，用 another museum。", "explanationSource": "supplemental"}, {"id": 32, "question": "Lucy has two pens. One is red, and ______ is blue.", "options": ["another", "other", "the other", "others"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 29 題）", "explanation": "兩者中 one…, the other…。", "explanationSource": "supplemental"}, {"id": 33, "question": "I don't like any one of these three watches. Can you show me ______ one?", "options": ["the others", "other", "either", "another"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜another one（另一個，不特定）", "explanation": "【句型】another + 單數名詞／one（另一個，不特定）。\n【分析】這三支錶都不喜歡，請店員拿「另一支」（店裡其他任一支）來看，用 another one。\n【其他選項】(A) the others 指剩下的全部（複數），不能接 one；(B) other 後接複數名詞，不接單數 one；(C) either 用於兩者之一，這裡有三支錶。\n【例句】This cup is dirty. Please give me another one.", "explanationSource": "source"}, {"id": 34, "question": "This T-shirt is too small for me. Do you have ______ one in a bigger size?", "options": ["the other", "another", "others", "other"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 33 題）", "explanation": "不特定的另一件，用 another one。", "explanationSource": "supplemental"}, {"id": 35, "question": "There are two roads to the station. You can take ______ one.", "options": ["either", "another", "other", "others"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 33 題）", "explanation": "兩者之一用 either。", "explanationSource": "supplemental"}, {"id": 36, "question": "Some students like math, and ______ students like English.", "options": ["another", "the other", "other", "either"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 33 題）", "explanation": "other + 複數名詞，表示「其他的」。", "explanationSource": "supplemental"}, {"id": 37, "question": "My parents have different hobbies. One enjoys baking; ______ enjoys taking pictures.", "options": ["another", "the next", "the other", "the second"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜one…, the other…（兩者）", "explanation": "【句型】兩者中：one…, the other…（一個…，另一個…）。\n【分析】parents 只有兩人，一個喜歡烘焙，另一個（剩下的那位）喜歡拍照，用 the other。\n【其他選項】(A) another 用於三者以上中不特定的另一個；(B) the next 下一個，有順序意；(D) the second 第二個，不用於兩者對比的句型。\n【例句】I have two hands. One is holding a cup, and the other is holding a book.", "explanationSource": "source"}, {"id": 38, "question": "Ann has two cats. One is white, and ______ is black.", "options": ["the other", "another", "other", "others"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 37 題）", "explanation": "兩者中 one…, the other…。", "explanationSource": "supplemental"}, {"id": 39, "question": "There are five boys on the team. One is from Japan, and ______ are from Taiwan.", "options": ["the other", "others", "another", "the others"], "answer": 3, "answerLabel": "D", "source": "類似題 2（對應第 37 題）", "explanation": "五人中一人之外，「剩下的全部」用 the others。", "explanationSource": "supplemental"}, {"id": 40, "question": "Some people like coffee; ______ like tea.", "options": ["the other", "another", "others", "other"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 37 題）", "explanation": "Some…, others…（有些…，有些…），不特定的其他人。", "explanationSource": "supplemental"}, {"id": 41, "question": "The book under Mary's desk is ______, but I don't know why it is there.", "options": ["us", "me", "my", "mine"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜所有格代名詞 mine（= my book）", "explanation": "【句型】S + be + 所有格代名詞（mine / yours / his / hers / ours / theirs）。\n【分析】「Mary 桌下那本書是我的，但我不知道它為什麼在那裡」，空格當補語，用 mine（= my book）。\n【其他選項】(A) us、(B) me 為受格，不能表示「…的」；(C) my 為所有格形容詞，後面必須接名詞。\n【例句】That red umbrella is hers.", "explanationSource": "source"}, {"id": 42, "question": "Excuse me, is this blue jacket ______? I found it in the gym.", "options": ["your", "yours", "you", "yourself"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 41 題）", "explanation": "yours = your jacket，當補語。", "explanationSource": "supplemental"}, {"id": 43, "question": "These aren't our seats. ______ are in the next row.", "options": ["Ours", "Our", "Us", "We"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 41 題）", "explanation": "Ours = Our seats，當主詞。", "explanationSource": "supplemental"}, {"id": 44, "question": "The idea was not Tom's; it was ______. She thought of it first.", "options": ["her", "she", "hers", "herself"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 41 題）", "explanation": "hers = her idea，所有格代名詞當補語。", "explanationSource": "supplemental"}, {"id": 45, "question": "The poor family have only ______ bread for today. Nothing is left for them to eat tomorrow.", "options": ["enough", "few", "much", "other"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜enough + 不可數名詞", "explanation": "【句型】enough + 名詞（足夠的…）；only enough… for today 只夠今天。\n【分析】後句「明天就沒東西可吃了」，所以麵包「只夠今天吃」，選 enough。\n【其他選項】(B) few 修飾可數複數名詞，bread 不可數；(C) only much bread 不是正確用法，且「很多」與「明天沒得吃」矛盾；(D) other bread 其他的麵包，語意不合。\n【例句】We don't have enough time to finish the test.", "explanationSource": "source"}, {"id": 46, "question": "Hurry up! We only have ______ time to catch the last bus.", "options": ["few", "many", "enough", "other"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 45 題）", "explanation": "enough time 剛好足夠的時間；time 不可數不用 few / many。", "explanationSource": "supplemental"}, {"id": 47, "question": "There is ______ milk in the bottle. Let's buy some more.", "options": ["a little", "little", "a few", "few"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 45 題）", "explanation": "milk 不可數，little 表「幾乎沒有」，所以要再買。", "explanationSource": "supplemental"}, {"id": 48, "question": "Sorry, I can't buy the bag. I don't have ______ money with me.", "options": ["enough", "many", "few", "another"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 45 題）", "explanation": "not enough money 錢不夠；money 不可數。", "explanationSource": "supplemental"}, {"id": 49, "question": "My mom told me to take care of ______ in England. She worried that I couldn't eat or sleep well there.", "options": ["me", "myself", "her", "herself"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜take care of + 反身代名詞", "explanation": "【句型】動作者與受詞為同一人時用反身代名詞：take care of oneself（照顧自己）。\n【分析】told me to take care of…，照顧的人（我）和被照顧的人（我）是同一人，用 myself：「媽媽叫我在英國要照顧好自己」。\n【其他選項】(A) me 受格，同一人時須用反身代名詞；(C) her、(D) herself 指媽媽，但媽媽擔心的是「我」吃睡不好，語意不合。\n【例句】Please take care of yourself when you travel.", "explanationSource": "source"}, {"id": 50, "question": "Grandpa is ninety, but he can still take care of ______.", "options": ["him", "his", "himself", "he"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 49 題）", "explanation": "主詞與受詞同一人（Grandpa），用 himself。", "explanationSource": "supplemental"}, {"id": 51, "question": "Be careful with the knife, or you'll hurt ______.", "options": ["yourself", "you", "your", "yours"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 49 題）", "explanation": "you 自己傷到自己，用反身代名詞 yourself。", "explanationSource": "supplemental"}, {"id": 52, "question": "The teacher told us to enjoy ______ at the school party.", "options": ["us", "our", "ours", "ourselves"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 49 題）", "explanation": "enjoy oneself 玩得愉快；動作者 we 與受詞同一人。", "explanationSource": "supplemental"}, {"id": 53, "question": "My grandfather spends ______ of his free time reading newspapers.", "options": ["one", "both", "most", "many"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜most of + 不可數名詞", "explanation": "【句型】most of + the/所有格 + 不可數名詞／複數名詞「大部分的…」\n【分析】free time 是不可數名詞，most 可修飾不可數名詞 → most of his free time「他大部分的空閒時間」。\n【其他選項】(A) one of 後須接複數可數名詞；(B) both 指「兩者」，free time 不是兩個；(D) many of 只能接複數可數名詞，free time 不可數。\n【例句】Linda spends most of her money on books.", "explanationSource": "source"}, {"id": 54, "question": "Kevin spends ______ of his weekend playing basketball with his friends.", "options": ["most", "many", "both", "one"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 53 題）", "explanation": "weekend 時間不可數概念，most of his weekend「他大部分的週末」。", "explanationSource": "supplemental"}, {"id": 55, "question": "______ of the water in this bottle is gone. Who drank it?", "options": ["Many", "Few", "Most", "Both"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 53 題）", "explanation": "water 不可數，只能用 most of the water，動詞 is 單數。", "explanationSource": "supplemental"}, {"id": 56, "question": "My sister wastes ______ of her time on her phone, so her grades are going down.", "options": ["many", "one", "both", "most"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 53 題）", "explanation": "time 不可數，most of her time「她大部分的時間」；many/one/both 需接可數名詞。", "explanationSource": "supplemental"}, {"id": 57, "question": "It almost killed Kevin to take care of his baby sister for one afternoon. He wondered how his mom could do ______ every day.", "options": ["her", "it", "one", "them"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜it 代替前面提到的整件事", "explanation": "【句型】it 可代替前文提到的「整件事／整個動作」：do it「做這件事」\n【分析】do ______ every day 指的是前面「照顧小妹妹一整個下午」這件事 → 用單數 it 代替整件事，how his mom could do it every day。\n【其他選項】(A) her 指人（妹妹），do her 語意不通；(C) one 代替「不特定的同類名詞」，不能代替一件特定的事；(D) them 指複數，前文只有一件事。\n【例句】Cleaning the whole house is hard work, but my dad does it every weekend.", "explanationSource": "source"}, {"id": 58, "question": "Writing a diary in English is not easy, but Amy has done ______ for three years.", "options": ["one", "it", "them", "that one"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 57 題）", "explanation": "it 代替前面「用英文寫日記」這件事。", "explanationSource": "supplemental"}, {"id": 59, "question": "Ben: Climbing Jade Mountain was so tiring!\nTina: Really? I'd still like to try ______ someday.", "options": ["them", "one", "it", "this one"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 57 題）", "explanation": "it 指前面提到的「爬玉山」這件事。", "explanationSource": "supplemental"}, {"id": 60, "question": "Getting up at five every morning sounds terrible. I can't imagine doing ______ every day.", "options": ["it", "them", "one", "its"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 57 題）", "explanation": "doing it 代替「每天五點起床」這件事。", "explanationSource": "supplemental"}, {"id": 61, "question": "______ other waiters in the restaurant have worked here longer than Clark; only Lois and Lana started working here before him.", "options": ["All", "Most", "Some", "Few"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜few + 複數名詞（很少，幾乎沒有）", "explanation": "【句型】few + 複數可數名詞「很少、幾乎沒有」（表否定語氣）\n【分析】後句說「只有 Lois 和 Lana 比他早來」→ 比 Clark 資歷久的服務生只有兩位，非常少 → Few other waiters have worked here longer than Clark「很少其他服務生在這裡做得比他久」。\n【其他選項】(A) All 表示全部都比他久，與「只有兩位」矛盾；(B) Most 表示大部分都比他久，也與「只有兩位」矛盾；(C) Some 沒有「只有少數」的限制語氣，無法呼應 only。\n【例句】Few students in my class can speak Japanese; only Ken and Mei can.\n備註：教師原解答（bf15af99.txt）為 (B) Most，但與後句「only Lois and Lana started working here before him」矛盾：比 Clark 資歷深的只有兩人，應為「很少」→ 正解 (D) Few（亦為會考官方答案）。此處採 D。", "explanationSource": "source"}, {"id": 62, "question": "______ people came to the concert because of the heavy rain. The hall was almost empty.", "options": ["Many", "Few", "Most", "All"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 61 題）", "explanation": "演奏廳幾乎是空的 → 很少人來，用 Few。", "explanationSource": "supplemental"}, {"id": 63, "question": "This question is very hard. ______ students got it right; only Tom did.", "options": ["Few", "Most", "Some", "All"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 61 題）", "explanation": "只有 Tom 答對 → 很少學生答對，用 Few。", "explanationSource": "supplemental"}, {"id": 64, "question": "Eric is new in town, so he has ______ friends here. He often feels lonely.", "options": ["many", "a lot of", "few", "most"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 61 題）", "explanation": "他常覺得孤單 → 朋友很少，用 few。", "explanationSource": "supplemental"}, {"id": 65, "question": "I don't think Katie will read any one of the books you've picked out for her: ______ look(s) very boring.", "options": ["it", "one", "some", "they"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜they 代替特定複數名詞", "explanation": "【句型】they / them 代替前面提過的「特定複數名詞」\n【分析】冒號後是在說明原因：前面「你為她挑的那些書」是特定的複數名詞 → 用 they 代替，they look very boring「它們看起來都很無聊」。\n【其他選項】(A) it 代替特定單數名詞，但書是複數；(B) one 代替不特定的單數，且只說一本無法解釋她一本都不讀；(C) some 指「其中一些」，但 Katie 是任何一本都不讀，表示全部都無聊。\n【例句】I bought these cookies yesterday. They taste great.", "explanationSource": "source"}, {"id": 66, "question": "Mom bought three new plates last week, but ______ were broken by my little brother today.", "options": ["it", "they", "one", "some one"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 65 題）", "explanation": "they 指前面特定的 three new plates。", "explanationSource": "supplemental"}, {"id": 67, "question": "Have you seen my glasses? I can't find ______ anywhere.", "options": ["it", "one", "them", "ones"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 65 題）", "explanation": "glasses 為複數名詞，且是「我的」特定那副 → 用受格 them。", "explanationSource": "supplemental"}, {"id": 68, "question": "Jason showed me the photos from his trip. ______ were really beautiful.", "options": ["They", "It", "One", "Them"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 65 題）", "explanation": "主詞位置代替特定複數 the photos → They。", "explanationSource": "supplemental"}, {"id": 69, "question": "I cannot understand why Steven bought so many watches but never wears ______ of them.", "options": ["any", "both", "every", "others"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜否定句 any of them", "explanation": "【句型】否定句中用 any of + 複數受格「任何一個」；not/never ... any = 一個也不\n【分析】never wears any of them「從來不戴其中任何一支」，them 指前面 so many watches，否定句用 any。\n【其他選項】(B) both 只用於兩個，而他買了很多支；(C) every 不能直接接 of；(D) others 是代名詞，後面不能再接 of them。\n【例句】I have many old toys, but I don't play with any of them now.", "explanationSource": "source"}, {"id": 70, "question": "Lily has a lot of skirts, but she hasn't worn ______ of them this year.", "options": ["every", "any", "both", "others"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 69 題）", "explanation": "否定句 hasn't worn any of them「一件也沒穿過」。", "explanationSource": "supplemental"}, {"id": 71, "question": "There are ten questions on the test, and Mark didn't answer ______ of them correctly.", "options": ["any", "each", "every", "another"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 69 題）", "explanation": "否定句 didn't answer any of them「一題都沒答對」；every 不能接 of。", "explanationSource": "supplemental"}, {"id": 72, "question": "I asked my classmates for help, but ______ of them had time to help me.", "options": ["any", "every", "none", "each one"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 69 題）", "explanation": "肯定句形式卻表「沒有人」→ none of them；any 不能單獨當肯定句主詞表否定。", "explanationSource": "supplemental"}, {"id": 73, "question": "______ of the books on the desk is about the famous writers of our country.", "options": ["A lot", "A few", "Both", "One"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜one of + the + 複數名詞 + 單數動詞", "explanation": "【句型】One of + the + 複數名詞 + 單數動詞（is/was/has）「…之中的一個」\n【分析】動詞是單數 is → 主詞須為單數 → One of the books is ...「桌上的書之中有一本是關於…」。\n【其他選項】(A) A lot of the books 為複數，動詞應用 are；(B) A few of the books 為複數，動詞應用 are；(C) Both of the books 為複數，動詞應用 are。\n【例句】One of my friends lives in Tainan.", "explanationSource": "source"}, {"id": 74, "question": "______ of the students in my class has a pet snake.", "options": ["Both", "One", "Many", "A few"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 73 題）", "explanation": "動詞 has 單數 → One of the students。", "explanationSource": "supplemental"}, {"id": 75, "question": "______ of my cousins are studying in Japan now.", "options": ["One", "Each", "Two", "Every"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 73 題）", "explanation": "動詞 are 複數 → Two of my cousins；One/Each 須用單數動詞，every 不能接 of。", "explanationSource": "supplemental"}, {"id": 76, "question": "One of the boys in the park ______ my brother.", "options": ["are", "were", "have", "is"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 73 題）", "explanation": "主詞是 One（單數）→ 動詞用 is。", "explanationSource": "supplemental"}, {"id": 77, "question": "Mary got two dolls from her grandfather on her birthday, and she liked ______ very much.", "options": ["her", "it", "ones", "them"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜them 代替特定複數名詞（受格）", "explanation": "【句型】they / them 代替前文特定的複數名詞；動詞後用受格 them\n【分析】liked 後要接受格，代替前面特定的 two dolls（複數）→ she liked them very much。\n【其他選項】(A) her 指女性的人，不是指娃娃；(B) it 代替單數，娃娃有兩個；(C) ones 代替「不特定」的同類名詞，但這裡是指那兩個特定的娃娃。\n【例句】Dad gave me two comic books, and I read them in one night.", "explanationSource": "source"}, {"id": 78, "question": "Grandma made some dumplings for us, and we ate ______ all.", "options": ["it", "them", "ones", "they"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 77 題）", "explanation": "代替特定的 dumplings（複數），作受詞用 them。", "explanationSource": "supplemental"}, {"id": 79, "question": "I found three kittens in the park and took ______ home.", "options": ["them", "they", "it", "ones"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 77 題）", "explanation": "take 後接受格，代替特定的 three kittens → them。", "explanationSource": "supplemental"}, {"id": 80, "question": "These shoes are too small for me. Can I try on bigger ______?", "options": ["them", "it", "ones", "one"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 77 題）", "explanation": "要試「不特定的、較大的鞋子」（複數）→ ones。", "explanationSource": "supplemental"}, {"id": 81, "question": "______ of the gift boxes are already put under the Christmas tree.", "options": ["One", "Any", "All", "Much"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜all of + the + 複數名詞 + 複數動詞", "explanation": "【句型】All of + the + 複數名詞 + 複數動詞「全部的…都…」\n【分析】動詞是複數 are，gift boxes 是可數複數 → All of the gift boxes are ...「所有的禮物盒都已經放在聖誕樹下了」。\n【其他選項】(A) One of ... 須接單數動詞 is；(B) Any 多用於否定句、疑問句，肯定句當主詞語意不合；(D) Much 修飾不可數名詞，gift boxes 可數。\n【例句】All of the students are in the classroom now.", "explanationSource": "source"}, {"id": 82, "question": "______ of the cookies on the plate were eaten by my brother.", "options": ["Much", "All", "One", "Every"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 81 題）", "explanation": "cookies 可數複數，動詞 were 複數 → All of the cookies。", "explanationSource": "supplemental"}, {"id": 83, "question": "______ of the milk in the fridge has gone bad.", "options": ["Many", "All", "Few", "Both"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 81 題）", "explanation": "milk 不可數，all 可接不可數名詞，動詞 has 單數。", "explanationSource": "supplemental"}, {"id": 84, "question": "All of my classmates ______ excited about the school trip next week.", "options": ["is", "was", "has", "are"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 81 題）", "explanation": "All of + 複數名詞 → 動詞用複數 are。", "explanationSource": "supplemental"}, {"id": 85, "question": "Paula: Is that big toy store Mr. and Mrs. Chen's?\nKelly: Yes, it's ______. My daughter loves going there.", "options": ["his", "hers", "ours", "theirs"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜所有格代名詞 theirs", "explanation": "【句型】所有格代名詞＝所有格＋名詞：mine, yours, his, hers, ours, theirs\n【分析】問句問的是 Mr. and Mrs. Chen's（陳先生和陳太太兩個人的）→ 複數「他們的」→ theirs = their toy store。\n【其他選項】(A) his 只指陳先生一人；(B) hers 只指陳太太一人；(C) ours 是「我們的」，與問句不符。\n【例句】These seats aren't ours. They're theirs.", "explanationSource": "source"}, {"id": 86, "question": "Ann: Are those bikes Tom and Jerry's?\nBob: Yes, they're ______. They ride them to school every day.", "options": ["his", "theirs", "ours", "yours"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 85 題）", "explanation": "Tom and Jerry 兩人 → theirs。", "explanationSource": "supplemental"}, {"id": 87, "question": "Ms. Lin: Is this umbrella your sister's?\nKen: Yes, it's ______.", "options": ["hers", "his", "theirs", "her"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 85 題）", "explanation": "sister 為女性單數 → hers = her umbrella；her 後須接名詞。", "explanationSource": "supplemental"}, {"id": 88, "question": "Jim: Whose house is this? Is it yours and your brother's?\nAlan: Yes, it's ______. We just moved in.", "options": ["theirs", "yours", "his", "ours"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 85 題）", "explanation": "我和哥哥的 → 我們的 ours。", "explanationSource": "supplemental"}, {"id": 89, "question": "Yesterday was my daughter's birthday. We took ______ to a restaurant and had a big dinner.", "options": ["me", "him", "her", "you"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜受格代名詞 her", "explanation": "【句型】人稱代名詞：動詞後用受格（me, you, him, her, us, them）\n【分析】took 後須接受格，代替前句的 my daughter（女兒，女性單數）→ her。\n【其他選項】(A) me 主詞是 We，「我們帶我」語意不通；(B) him 指男性，與 daughter 不符；(D) you 指對話中的對方，與前句無關。\n【例句】My grandpa is sick, so we visit him every Sunday.", "explanationSource": "source"}, {"id": 90, "question": "My son's school is far from our home, so I drive ______ there every morning.", "options": ["her", "him", "them", "it"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 89 題）", "explanation": "son 為男性 → 受格 him。", "explanationSource": "supplemental"}, {"id": 91, "question": "Our teacher was very kind to us, so we bought ______ a card on Teachers' Day.", "options": ["him", "his", "he", "her's"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 89 題）", "explanation": "買卡片給老師，動詞後用受格 him；his 是所有格，he 是主格。", "explanationSource": "supplemental"}, {"id": 92, "question": "My parents work very hard. I want to take ______ on a trip to Japan.", "options": ["they", "their", "them", "theirs"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 89 題）", "explanation": "代替 my parents（複數），動詞後用受格 them。", "explanationSource": "supplemental"}, {"id": 93, "question": "Susan bought ______ bread in the supermarket, but she did not buy anything to drink.", "options": ["many", "some", "any", "one"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜肯定句 some + 不可數名詞", "explanation": "【句型】some + 複數名詞／不可數名詞（多用於肯定句）；any 多用於否定句、疑問句\n【分析】前半句是肯定句，bread 是不可數名詞 → some bread「一些麵包」。\n【其他選項】(A) many 修飾可數複數名詞，bread 不可數；(C) any 一般用於否定句或疑問句；(D) one 修飾單數可數名詞，bread 不可數（要說 a loaf of bread）。\n【例句】I'd like some juice, please.", "explanationSource": "source"}, {"id": 94, "question": "Mom put ______ sugar in the tea, so it tastes sweet.", "options": ["many", "a", "some", "any"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 93 題）", "explanation": "肯定句、sugar 不可數 → some sugar。", "explanationSource": "supplemental"}, {"id": 95, "question": "We don't have ______ milk at home. Can you buy some?", "options": ["any", "some", "many", "a"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 93 題）", "explanation": "否定句用 any milk。", "explanationSource": "supplemental"}, {"id": 96, "question": "Peter ate ______ apples after school because he was hungry.", "options": ["much", "a", "any", "some"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 93 題）", "explanation": "肯定句、apples 可數複數 → some apples；much 修飾不可數。", "explanationSource": "supplemental"}, {"id": 97, "question": "There are two supermarkets near my house. The one on the corner sells bread, but ______ doesn't.", "options": ["another", "that", "the next", "the other"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜兩者：one ... the other ...", "explanation": "【句型】兩者之中：one ... the other ...（一個…，另一個…）\n【分析】two supermarkets 只有兩家，前面已提 The one on the corner，剩下的唯一一家用 the other。\n【其他選項】(A) another 用於三者以上的「另一個」；(B) that 無法明確指「剩下的那一家」；(C) the next「下一個」，用於順序，不符語意。\n【例句】I have two cats. One is white, and the other is black.", "explanationSource": "source"}, {"id": 98, "question": "Amy has two brothers. One is a doctor, and ______ is a teacher.", "options": ["another", "the other", "other", "the others"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 97 題）", "explanation": "兩兄弟中的另一個 → the other。", "explanationSource": "supplemental"}, {"id": 99, "question": "I lost one of my gloves, so I can only wear ______ now.", "options": ["the other", "another", "others", "the others"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 97 題）", "explanation": "手套一雙兩隻，剩下那一隻 → the other。", "explanationSource": "supplemental"}, {"id": 100, "question": "There are two bus stops near the school. One is in front of the gate, and ______ is behind the gym.", "options": ["another", "others", "the other", "other"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 97 題）", "explanation": "兩個公車站，剩下的那一個 → the other。", "explanationSource": "supplemental"}, {"id": 101, "question": "I was told to interview three guys at different times today. The first was on time. The second was late, and ______ never came.", "options": ["the last", "the only one", "some", "another"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜三者順序：the first / the second / the last", "explanation": "【句型】依順序列舉：the first ... the second ... the last／the third（最後一個）\n【分析】一共三個人，前面已說 The first、The second，剩下的就是第三個（最後一個）→ the last。\n【其他選項】(B) the only one「唯一一個」，但共有三人；(C) some 表「一些」，指不特定多數；(D) another 指「還有另一個（不是最後）」，不能表示剩下的最後一位。\n【例句】We read three books this term. The first was funny, the second was sad, and the last was scary.", "explanationSource": "source"}, {"id": 102, "question": "Jenny ran three races yesterday. She won the first, lost the second, and won ______ again.", "options": ["the last", "another", "others", "the other one"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 101 題）", "explanation": "共三場，剩下的最後一場 → the last。", "explanationSource": "supplemental"}, {"id": 103, "question": "There are three rooms upstairs. The first is mine, the second is my sister's, and ______ is my parents'.", "options": ["another", "the third", "other", "the others"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 101 題）", "explanation": "三個房間依序排列，第三間 → the third。", "explanationSource": "supplemental"}, {"id": 104, "question": "I have three pets. One is a dog, another is a cat, and ______ is a rabbit.", "options": ["another", "others", "the other", "other"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 101 題）", "explanation": "三者：one ... another ... the other（剩下最後一個）。", "explanationSource": "supplemental"}, {"id": 105, "question": "Jogging is the only exercise I enjoy. I find ______ other kinds of exercise boring.", "options": ["all", "few", "many", "some"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜all + other + 複數名詞", "explanation": "【句型】all + other + 複數名詞「所有其他的…」；the only ... 與 all other ... 呼應\n【分析】「慢跑是我唯一喜歡的運動」→ 其他所有的運動我都覺得無聊 → all other kinds of exercise。\n【其他選項】(B) few「很少」→ 很少覺得無聊，與 the only 矛盾；(C) many、(D) some 只表示「許多／一些」，暗示還有其他喜歡的運動，與「唯一」矛盾。\n【例句】Math is the only subject I'm good at. All other subjects are hard for me.", "explanationSource": "source"}, {"id": 106, "question": "Kelly only eats apples. She doesn't like ______ other fruits at all.", "options": ["some", "any", "many", "few"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 105 題）", "explanation": "否定句 not ... any other fruits「其他任何水果都不喜歡」。", "explanationSource": "supplemental"}, {"id": 107, "question": "Tom is the tallest boy in our class. He is taller than ______ other boys in the class.", "options": ["all", "some", "few", "many"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 105 題）", "explanation": "最高 = 比班上所有其他男生高 → all other boys。", "explanationSource": "supplemental"}, {"id": 108, "question": "This is the only shop that sells fresh bread in town. ______ other shops sell only cookies.", "options": ["Few", "Some", "Many", "All"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 105 題）", "explanation": "唯一賣新鮮麵包的店 → 其他所有店都只賣餅乾 → All。", "explanationSource": "supplemental"}, {"id": 109, "question": "Stella: Is this Simon's book? I found it under the chair.\nJoyce: No, it's ______. Thank you. I've been looking for it.", "options": ["I", "me", "my", "mine"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜所有格代名詞 mine", "explanation": "【句型】所有格代名詞＝所有格＋名詞：mine = my book\n【分析】Joyce 說不是 Simon 的，又說「謝謝，我一直在找它」→ 是「我的」書；空格後沒有名詞 → 用所有格代名詞 mine。\n【其他選項】(A) I 主格；(B) me 受格，都不表「所有」；(C) my 是所有格，後面必須接名詞（my book）。\n【例句】This pencil case isn't yours. It's mine.", "explanationSource": "source"}, {"id": 110, "question": "Ted: Whose cap is this?\nRay: Oh, it's ______. I left it here this morning.", "options": ["me", "mine", "my", "I"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 109 題）", "explanation": "空格後無名詞，表「我的」→ mine。", "explanationSource": "supplemental"}, {"id": 111, "question": "Your bag is red, and ______ is blue.", "options": ["my", "me", "mine", "I"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 109 題）", "explanation": "mine = my bag，作主詞。", "explanationSource": "supplemental"}, {"id": 112, "question": "Teacher: Is this your homework, Nick?\nNick: Yes, it's ______. Sorry I forgot to write my name.", "options": ["mine", "my", "me", "myself"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 109 題）", "explanation": "所有格代名詞 mine = my homework。", "explanationSource": "supplemental"}, {"id": 113, "question": "We know ______ about the new boss except that she just came back from the US. We hope to know her better.", "options": ["everything", "nothing", "other things", "something"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜nothing ... except ...", "explanation": "【句型】know nothing about ... except ...「除了…之外對…一無所知」\n【分析】except「除了…之外」，加上後句「希望更了解她」→ 我們對新老闆所知甚少，只知道她剛從美國回來 → know nothing about her except ...。\n【其他選項】(A) everything「什麼都知道」與「希望更了解她」矛盾；(C) other things「其他事情」語意不通；(D) something 無法與 except 形成「只知道這件事」的限定語氣。\n【例句】I ate nothing for breakfast except a banana.", "explanationSource": "source"}, {"id": 114, "question": "Ivy was so sick that she ate ______ all day except some soup.", "options": ["something", "nothing", "everything", "anything"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 113 題）", "explanation": "病得很重 → 除了湯什麼都沒吃 → nothing ... except。", "explanationSource": "supplemental"}, {"id": 115, "question": "It's a quiet night. I can hear ______ except the sound of the rain.", "options": ["nothing", "everything", "something", "anything"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 113 題）", "explanation": "安靜的夜晚，除了雨聲什麼都聽不到 → nothing。", "explanationSource": "supplemental"}, {"id": 116, "question": "The room is empty. There's ______ in it except an old chair.", "options": ["everything", "something", "anything", "nothing"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 113 題）", "explanation": "房間空的 → 除了舊椅子沒有任何東西 → nothing。", "explanationSource": "supplemental"}, {"id": 117, "question": "I haven't been to the movies these days. Are there any good ______ this week?", "options": ["ones", "others", "them", "those"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜ones 代替不特定的複數同類名詞", "explanation": "【句型】one / ones 代替「不特定」的同類名詞；形容詞 + one(s)\n【分析】空格前有形容詞 good，指的是「不特定的好電影」（複數）→ any good ones = any good movies。\n【其他選項】(B) others 前不能加形容詞 good；(C) them 指特定的複數，且不能放在形容詞後；(D) those 前不能加形容詞。\n【例句】These apples are too small. Do you have bigger ones?", "explanationSource": "source"}, {"id": 118, "question": "My shoes are too old. I need to buy new ______.", "options": ["one", "ones", "them", "it"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 117 題）", "explanation": "不特定的新鞋子（複數）→ new ones。", "explanationSource": "supplemental"}, {"id": 119, "question": "This T-shirt is too small for me. Do you have a bigger ______?", "options": ["one", "ones", "it", "them"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 117 題）", "explanation": "a bigger + 單數不特定 → one。", "explanationSource": "supplemental"}, {"id": 120, "question": "I don't like the red cups. I prefer the blue ______.", "options": ["it", "them", "those", "ones"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 117 題）", "explanation": "the + 形容詞 + ones 代替複數同類名詞 cups。", "explanationSource": "supplemental"}, {"id": 121, "question": "Mrs. Wang has two sons. ______ of them go to junior high school.", "options": ["One", "Both", "Some", "Many"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜both of them（兩者都）", "explanation": "【句型】both of + 複數受格／the + 複數名詞 + 複數動詞「兩者都」\n【分析】two sons 剛好兩個，動詞 go 為複數 → Both of them go to ...「兩個都讀國中」。\n【其他選項】(A) One of them 須接單數動詞 goes；(C) Some、(D) Many 用於三個以上，不用於兩者。\n【例句】I have two sisters. Both of them like music.", "explanationSource": "source"}, {"id": 122, "question": "Tim has two dogs, and ______ of them are very friendly.", "options": ["all", "both", "each", "one"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 121 題）", "explanation": "兩隻狗、動詞 are 複數 → both of them。", "explanationSource": "supplemental"}, {"id": 123, "question": "There are two windows in the room. ______ of them is broken.", "options": ["Both", "Two", "One", "All"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 121 題）", "explanation": "動詞 is 單數 → One of them。", "explanationSource": "supplemental"}, {"id": 124, "question": "My parents are teachers. ______ of them teach at the same school.", "options": ["Both", "All", "One", "Each"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 121 題）", "explanation": "父母兩人、動詞 teach 複數 → Both。", "explanationSource": "supplemental"}, {"id": 125, "question": "Michelle Walden, ______ of the best basketball players in our school history, was called \"Flying Walden\" because she could jump very high.", "options": ["any", "each", "one", "who"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜one of + the + 最高級 + 複數名詞（同位語）", "explanation": "【句型】one of the + 最高級 + 複數名詞「最…的…之一」；此處作主詞的同位語\n【分析】逗號中間是補充說明 Michelle Walden 的同位語：one of the best basketball players「最優秀的籃球員之一」。\n【其他選項】(A) any of 用於否定或疑問，語意不通；(B) each of the best players「每一位」，不能說明一個人；(D) who 引導關係子句需有動詞（who was one of ...），此處沒有動詞。\n【例句】Mr. Lee, one of the most popular teachers in our school, teaches math.", "explanationSource": "source"}, {"id": 126, "question": "Taipei 101 is ______ of the tallest buildings in the world.", "options": ["one", "each", "any", "all"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 125 題）", "explanation": "one of the + 最高級 + 複數名詞 → 最高的建築之一。", "explanationSource": "supplemental"}, {"id": 127, "question": "Jeremy Lin, one of the most famous basketball ______ in Taiwan, visited our school.", "options": ["player", "players", "player's", "playing"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 125 題）", "explanation": "one of the + 複數名詞 → players。", "explanationSource": "supplemental"}, {"id": 128, "question": "Kenting, ______ of the most beautiful places in Taiwan, has many visitors every summer.", "options": ["who", "any", "one", "each"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 125 題）", "explanation": "逗號中間為同位語 one of the most beautiful places；who 需要動詞。", "explanationSource": "supplemental"}, {"id": 129, "question": "Mrs. Luo: Who put these socks in the refrigerator?\nMr. Luo: I don't know. They're not ______. Ask your son.", "options": ["me", "mine", "my", "myself"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜所有格代名詞 mine", "explanation": "【句型】所有格代名詞＝所有格＋名詞：mine = my socks\n【分析】Mr. Luo 說不知道，「它們不是我的，去問你兒子」→ 空格後沒有名詞 → mine = my socks。\n【其他選項】(A) me 受格，「它們不是我」語意不通；(C) my 是所有格，後面要接名詞；(D) myself 反身代名詞，語意不通。\n【例句】Those comic books aren't mine. They're my brother's.", "explanationSource": "source"}, {"id": 130, "question": "Lisa: Are these your keys?\nMike: No, they aren't ______. Maybe they're Jason's.", "options": ["my", "me", "mine", "myself"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 129 題）", "explanation": "空格後無名詞 → mine = my keys。", "explanationSource": "supplemental"}, {"id": 131, "question": "That's not your seat. ______ is next to the window.", "options": ["Your", "Yours", "You", "Yourself"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 129 題）", "explanation": "作主詞，yours = your seat。", "explanationSource": "supplemental"}, {"id": 132, "question": "Ben: Is this your sister's jacket?\nJoe: No, it's not ______. She never wears pink.", "options": ["hers", "her", "she", "herself"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 129 題）", "explanation": "空格後無名詞 → hers = her jacket。", "explanationSource": "supplemental"}, {"id": 133, "question": "Elsa: Do you know anyone from Class A?\nJeff: No, I don't know any of ______.", "options": ["they", "their", "theirs", "them"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜介系詞 of 後接受格 them", "explanation": "【句型】介系詞（of）後接受格：any / some / all / none of + them\n【分析】of 是介系詞，後面須接受格；指的是 Class A 的人（複數）→ any of them。\n【其他選項】(A) they 是主格，不能放在介系詞後；(B) their 所有格，後面須接名詞；(C) theirs 所有格代名詞＝their + N，語意不通。\n【例句】I have many cousins, but I don't see any of them often.", "explanationSource": "source"}, {"id": 134, "question": "There are five new students in our class. I've talked to all of ______.", "options": ["they", "them", "their", "theirs"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 133 題）", "explanation": "介系詞 of 後接受格 them。", "explanationSource": "supplemental"}, {"id": 135, "question": "Dad bought some donuts, and I ate two of ______.", "options": ["them", "they", "it", "their"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 133 題）", "explanation": "of 後接受格，指 donuts（複數）→ them。", "explanationSource": "supplemental"}, {"id": 136, "question": "Kate: Have you met Mr. Lin and his wife?\nLeo: Yes, I had dinner with ______ last week.", "options": ["they", "their", "them", "theirs"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 133 題）", "explanation": "介系詞 with 後接受格 them。", "explanationSource": "supplemental"}, {"id": 137, "question": "Noah: I've had too many cookies. My throat is so dry.\nQuinn: What would you like to drink then?\nNoah: ______ you can get. Just get it now!", "options": ["Something", "Nothing", "Everything", "Anything"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜anything（任何東西都可以）", "explanation": "【句型】anything + (that) 子句「任何…的東西（都可以）」\n【分析】Noah 口很乾，急著要喝東西，不挑 → Anything you can get「你能拿到的任何東西都好」，後句 get it now 的 it 為單數。\n【其他選項】(A) Something「某樣東西」，沒有「什麼都可以」的意思；(B) Nothing「什麼都不要」與口渴矛盾；(C) Everything「所有東西」，不合理，且後句用 it 指一樣東西。\n【例句】I'm so hungry that I can eat anything.", "explanationSource": "source"}, {"id": 138, "question": "Waiter: What would you like to drink?\nJack: ______ is fine. I'm not picky.", "options": ["Nothing", "Anything", "Everything", "Something"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 137 題）", "explanation": "不挑剔 → 什麼都可以 → Anything。", "explanationSource": "supplemental"}, {"id": 139, "question": "I'm so bored. I'll read ______ you give me.", "options": ["anything", "nothing", "something", "everyone"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 137 題）", "explanation": "無聊到給什麼都看 → anything。", "explanationSource": "supplemental"}, {"id": 140, "question": "Mom: What do you want for dinner?\nKim: I don't care. I'll eat ______.", "options": ["something", "nothing", "everything", "anything"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 137 題）", "explanation": "不在乎 → 什麼都吃 → anything。", "explanationSource": "supplemental"}, {"id": 141, "question": "After a big party, it took me ______ time to clean the apartment. I'm tired now.", "options": ["enough", "every", "little", "some"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜some + 不可數名詞（肯定句）", "explanation": "【句型】It takes + 人 + 時間 + to V；some + 不可數名詞（肯定句）「一些、相當的」\n【分析】time 為不可數名詞；派對後整理公寓、現在很累 → 花了我一些（不少）時間 → some time。\n【其他選項】(A) enough time「足夠的時間」，與「累」無因果關係，語意不自然；(B) every 須接單數可數名詞；(C) little time「幾乎沒時間」，與「很累」矛盾。\n【例句】It took Mike some time to finish the puzzle.", "explanationSource": "source"}, {"id": 142, "question": "The math problem was really hard. It took me ______ time to solve it.", "options": ["some", "little", "every", "few"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 141 題）", "explanation": "題目很難 → 花了一些時間；time 不可數，不用 few。", "explanationSource": "supplemental"}, {"id": 143, "question": "The test was so easy that it took Amy ______ time to finish it.", "options": ["much", "little", "many", "few"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 141 題）", "explanation": "很簡單 → 幾乎不花時間 → little time。", "explanationSource": "supplemental"}, {"id": 144, "question": "I need ______ time to think about your idea. Can I tell you tomorrow?", "options": ["many", "few", "some", "every"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 141 題）", "explanation": "肯定句、time 不可數 → some time。", "explanationSource": "supplemental"}, {"id": 145, "question": "Philip: Is that red car Miss Brown's?\nWalter: Yes, it's ______. Beautiful, isn't it?", "options": ["hers", "his", "ours", "theirs"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜所有格代名詞 hers", "explanation": "【句型】所有格代名詞＝所有格＋名詞：hers = her car\n【分析】問句問 Miss Brown's（布朗小姐，女性單數）→ 回答「是她的」→ hers = her car。\n【其他選項】(B) his 指男性；(C) ours「我們的」與問句不符；(D) theirs 指多人，Miss Brown 只有一人。\n【例句】This purple pen isn't mine. It's hers.", "explanationSource": "source"}, {"id": 146, "question": "Ray: Is that blue bike Mr. Chen's?\nSam: Yes, it's ______.", "options": ["hers", "his", "theirs", "its"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 145 題）", "explanation": "Mr. Chen 男性 → his = his bike。", "explanationSource": "supplemental"}, {"id": 147, "question": "Gina: Is this your mom's cell phone?\nPaul: Yes, it's ______. She left it on the sofa.", "options": ["hers", "her", "his", "she"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 145 題）", "explanation": "mom 女性，後無名詞 → hers。", "explanationSource": "supplemental"}, {"id": 148, "question": "Those seats are Tina and Leo's, not ______. Ours are in Row 5.", "options": ["theirs", "his", "ours", "yours"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 145 題）", "explanation": "後句 Ours are in Row 5 → 前面說「不是我們的」→ ours。", "explanationSource": "supplemental"}, {"id": 149, "question": "Gary is the best teacher I've ever known. No one ______ teaches so well.", "options": ["all", "another", "else", "other"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜no one else（沒有其他人）", "explanation": "【句型】不定代名詞／疑問詞 + else「其他的」：no one else, someone else, anything else, what else\n【分析】Gary 是最好的老師 → 沒有其他人教得這麼好 → No one else；else 放在 no one 後面修飾它。\n【其他選項】(A) all 不能放在 no one 後；(B) another 是形容詞／代名詞，不能放在 no one 後面；(D) other 須放在名詞前（no other teacher），不能放在 no one 後。\n【例句】Is there anything else you want to buy?", "explanationSource": "source"}, {"id": 150, "question": "Sally knows the answer, but nobody ______ in the class does.", "options": ["other", "else", "another", "others"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 149 題）", "explanation": "nobody else「沒有其他人」。", "explanationSource": "supplemental"}, {"id": 151, "question": "I don't want this one. Do you have anything ______?", "options": ["else", "other", "another", "others"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 149 題）", "explanation": "anything else「其他任何東西」。", "explanationSource": "supplemental"}, {"id": 152, "question": "What ______ did you do in Tainan besides eating snacks?", "options": ["other", "another", "else", "others"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 149 題）", "explanation": "疑問詞 + else → What else「還有什麼」。", "explanationSource": "supplemental"}, {"id": 153, "question": "Elise: I need a dress for tomorrow's party, but I don't have one.\nFiona: Why don't you try on my red one? I bought ______ last week.", "options": ["it", "one", "ones", "them"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜it 代替前面提到的特定單數名詞", "explanation": "【句型】it 代替「前面提過的那個特定單數名詞」；one 代替「不特定」的同類名詞\n【分析】I bought ______ last week 指的就是前面提到的那件特定的「我的紅洋裝（my red one）」→ 用 it。\n【其他選項】(B) one 指不特定的一件，但 Fiona 買的就是那件紅洋裝；(C) ones、(D) them 都是複數，與單數 dress 不符。\n【例句】I lost my umbrella yesterday, but I found it this morning.", "explanationSource": "source"}, {"id": 154, "question": "Rick: Where's my phone?\nAmy: I saw ______ on the kitchen table.", "options": ["one", "it", "them", "ones"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 153 題）", "explanation": "指特定的「Rick 的手機」→ it。", "explanationSource": "supplemental"}, {"id": 155, "question": "I don't have an eraser. Can you lend me ______?", "options": ["one", "it", "them", "ones"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 153 題）", "explanation": "借「一個（不特定的）橡皮擦」→ one。", "explanationSource": "supplemental"}, {"id": 156, "question": "Jack: Do you like my new watch?\nLily: Yes! Where did you buy ______?", "options": ["one", "them", "ones", "it"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 153 題）", "explanation": "指 Jack 那支特定的新錶 → it。", "explanationSource": "supplemental"}, {"id": 157, "question": "All the dresses are pretty, but I think ______ black one is the best for the party tomorrow.", "options": ["any", "each", "some", "the"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜定冠詞 the + 形容詞 + one（特定的那一個）", "explanation": "【句型】the + 形容詞 + one 指「特定的那一個」\n【分析】在所有洋裝中挑出「那件黑色的」，是特定的一件 → the black one。\n【其他選項】(A) any black one「任何一件黑色的」，肯定句中語意不通，且不特定；(B) each 表「每一件」，與 the best（唯一最好的）矛盾；(C) some 後接複數或不可數名詞，不接單數 one。\n【例句】I like both bags, but the brown one is cheaper.", "explanationSource": "source"}, {"id": 158, "question": "There are three cakes on the table. I'll take ______ chocolate one.", "options": ["any", "the", "some", "each"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 157 題）", "explanation": "指特定的那個巧克力蛋糕 → the chocolate one。", "explanationSource": "supplemental"}, {"id": 159, "question": "These caps all look nice, but ______ blue one fits me best.", "options": ["the", "a", "some", "any"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 157 題）", "explanation": "從中特別指出那頂藍色的 → the blue one。", "explanationSource": "supplemental"}, {"id": 160, "question": "Kevin: Which notebook is yours?\nAnna: ______ one with a cat on it.", "options": ["A", "Some", "Any", "The"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 157 題）", "explanation": "特定的「有貓圖案的那本」→ The one with ...。", "explanationSource": "supplemental"}, {"id": 161, "question": "Alice: This cake is so delicious! Where did you buy it?\nOscar: I didn't buy it. I made it ______!", "options": ["for me", "to me", "mine", "myself"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜反身代名詞 myself（強調親自）", "explanation": "【句型】反身代名詞放句尾可強調「親自、自己」：I made it myself.\n【分析】Oscar 說不是買的，是「我自己做的」→ 用反身代名詞 myself 強調是本人親手做的。\n【其他選項】(A) for me「為我做的」，主詞是 I，應為 for myself；(B) to me 語意不通；(C) mine 所有格代名詞，「我做了它我的」不通。\n【例句】Did you paint this picture yourself?", "explanationSource": "source"}, {"id": 162, "question": "Nobody helped Jenny with her homework. She did it all by ______.", "options": ["her", "hers", "herself", "she"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 161 題）", "explanation": "by oneself「靠自己、獨自」→ by herself。", "explanationSource": "supplemental"}, {"id": 163, "question": "Ted: Who cut your hair?\nIan: I cut it ______. Does it look OK?", "options": ["me", "myself", "mine", "my"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 161 題）", "explanation": "強調「我自己剪的」→ myself。", "explanationSource": "supplemental"}, {"id": 164, "question": "Kids, please help ______ to the fruit on the table.", "options": ["yourselves", "yourself", "you", "your"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 161 題）", "explanation": "對多個小孩說 help yourselves to「自行取用」。", "explanationSource": "supplemental"}, {"id": 165, "question": "Mike: I heard there are many monkeys in this mountain. But I didn't see any of them last time when I was here.\nCarl: Hope we can see ______ today.", "options": ["another", "others", "some", "themselves"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜some 用於肯定、期望的語氣", "explanation": "【句型】some 用於肯定句或表期望的句子：Hope we can see some (monkeys).\n【分析】Carl 希望今天能看到「一些」猴子 → 期望語氣的肯定句用 some，some = some monkeys。\n【其他選項】(A) another 指「另一隻」，前面一隻都沒看到；(B) others 指「其他的」，前面沒有提到已看到的猴子；(D) themselves 反身代名詞，主詞是 we，不能用 themselves。\n【例句】I'm making cookies. Would you like some?", "explanationSource": "source"}, {"id": 166, "question": "We have no eggs at home. Let's buy ______ on the way home.", "options": ["some", "any", "another", "others"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 165 題）", "explanation": "肯定句、要買一些蛋 → some。", "explanationSource": "supplemental"}, {"id": 167, "question": "I heard there are many fireflies here, but I didn't see ______ last night.", "options": ["some", "any", "others", "another"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 165 題）", "explanation": "否定句 didn't see any。", "explanationSource": "supplemental"}, {"id": 168, "question": "There are lots of fish in the river. I hope we can catch ______ today.", "options": ["any", "another", "some", "others"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 165 題）", "explanation": "肯定的期望語氣 → some。", "explanationSource": "supplemental"}, {"id": 169, "question": "There are many trees in the park. ______ of them are over fifty years old.", "options": ["Both", "Most", "Much", "One"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜most of them + 複數動詞", "explanation": "【句型】most of + 複數受格／the + 複數名詞 + 複數動詞「其中大部分」\n【分析】many trees（很多棵），動詞 are 複數 → Most of them are ...「其中大部分都超過五十年」。\n【其他選項】(A) Both 只用於兩者，但樹有很多棵；(C) Much 修飾不可數名詞；(D) One of them 須接單數動詞 is。\n【例句】There are thirty students in my class. Most of them live near the school.", "explanationSource": "source"}, {"id": 170, "question": "I have a lot of comic books. ______ of them are from Japan.", "options": ["Both", "Much", "Most", "One"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 169 題）", "explanation": "很多本、動詞 are → Most of them。", "explanationSource": "supplemental"}, {"id": 171, "question": "There are twenty houses on this street. ______ of them is for sale.", "options": ["Most", "One", "Both", "All"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 169 題）", "explanation": "動詞 is 單數 → One of them。", "explanationSource": "supplemental"}, {"id": 172, "question": "Most of the students in our school ______ uniforms on Mondays.", "options": ["wears", "is wearing", "has worn", "wear"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 169 題）", "explanation": "Most of + 複數名詞 → 複數動詞 wear。", "explanationSource": "supplemental"}, {"id": 173, "question": "Gary: I can't find my pen.\nNina: Is the one on Jack's desk ______?\nGary: Yes. Thank you.", "options": ["mine", "ours", "theirs", "yours"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜所有格代名詞 yours", "explanation": "【句型】所有格代名詞＝所有格＋名詞：yours = your pen\n【分析】Gary 找不到他的筆，Nina 問「Jack 桌上那支是你的嗎？」→ 對 Gary 說「你的」→ yours = your pen。\n【其他選項】(A) mine 指 Nina 自己的，與 Gary 找筆不符；(B) ours「我們的」不符；(C) theirs「他們的」不符。\n【例句】Is this umbrella yours? It's been here all day.", "explanationSource": "source"}, {"id": 174, "question": "Sue: I lost my notebook.\nTom: Is the one on the floor ______?\nSue: Yes, it is!", "options": ["mine", "yours", "his", "theirs"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 173 題）", "explanation": "Tom 問 Sue「地上那本是你的嗎」→ yours。", "explanationSource": "supplemental"}, {"id": 175, "question": "Teacher: Whose jacket is this, Ben? Is it ______?\nBen: No, it's Andy's.", "options": ["yours", "your", "you", "yourself"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 173 題）", "explanation": "後無名詞，問「是你的嗎」→ yours。", "explanationSource": "supplemental"}, {"id": 176, "question": "Mom: These are your toys. Put ______ away, please.", "options": ["yours", "they", "its", "them"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 173 題）", "explanation": "put ... away 中間接受格 them，代替 your toys。", "explanationSource": "supplemental"}, {"id": 177, "question": "Nana and Fred are good friends, and ______ are baseball fans.", "options": ["all of them", "both of them", "some of them", "one of them"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜both of them（兩人都）", "explanation": "【句型】both of them + 複數動詞「兩者都」\n【分析】Nana and Fred 恰好兩個人，動詞 are 複數 → both of them are baseball fans「兩人都是棒球迷」。\n【其他選項】(A) all of them 用於三者以上；(C) some of them 用於三者以上的部分；(D) one of them 須接單數動詞 is。\n【例句】Ken and Ray are twins, and both of them like dancing.", "explanationSource": "source"}, {"id": 178, "question": "Lisa and Mia are classmates, and ______ love singing.", "options": ["all of them", "each of them", "both of them", "one of them"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 177 題）", "explanation": "兩人、動詞 love 複數 → both of them。", "explanationSource": "supplemental"}, {"id": 179, "question": "My uncle has two cars, and ______ is red.", "options": ["one of them", "both of them", "all of them", "some of them"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 177 題）", "explanation": "動詞 is 單數 → one of them。", "explanationSource": "supplemental"}, {"id": 180, "question": "Our team has ten players, and ______ come to practice every day.", "options": ["both of them", "each them", "one of them", "all of them"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 177 題）", "explanation": "十個人（三者以上）、動詞 come 複數 → all of them。", "explanationSource": "supplemental"}, {"id": 181, "question": "On the way to work, Natasha was surprised to find she was wearing a white earring on one ear and a gray earring on ______.", "options": ["another", "the next", "the other", "the second"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜兩者：one ... the other", "explanation": "【句型】兩者之中：one ... the other ...\n【分析】人只有兩隻耳朵，前面已說 on one ear，剩下那一隻就是 the other（ear）。\n【其他選項】(A) another 用於三者以上的「另一個」；(B) the next「下一個」表示順序，不適用；(D) the second「第二個」，兩隻耳朵沒有先後順序之分。\n【例句】I hold a pen in one hand and a book in the other.", "explanationSource": "source"}, {"id": 182, "question": "Mr. Ho has two daughters. One lives in Taipei, and ______ lives in Kaohsiung.", "options": ["another", "the other", "others", "the others"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 181 題）", "explanation": "兩個女兒，剩下那一個 → the other。", "explanationSource": "supplemental"}, {"id": 183, "question": "The street has shops on one side and a park on ______.", "options": ["the other", "another", "others", "the next"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 181 題）", "explanation": "街道只有兩側 → the other。", "explanationSource": "supplemental"}, {"id": 184, "question": "I have three friends from Japan. One is from Tokyo, ______ is from Osaka, and the other is from Kyoto.", "options": ["the other", "others", "another", "the others"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 181 題）", "explanation": "三者：one ... another ... the other。", "explanationSource": "supplemental"}, {"id": 185, "question": "Cell phones are convenient; every person in my family has ______.", "options": ["it", "one", "them", "those"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜one 代替不特定的同類單數名詞", "explanation": "【句型】one = a/an + 同類單數名詞（不特定）\n【分析】每個家人各自擁有「一支（不特定的）手機」→ has one = has a cell phone。\n【其他選項】(A) it 指特定的那一支，但不是所有人共用同一支；(C) them、(D) those 是複數，every person has 每人一支，且非特定。\n【例句】I don't have a dictionary. Can I borrow one?", "explanationSource": "source"}, {"id": 186, "question": "Many students in my class have bikes, but I don't have ______.", "options": ["it", "them", "one", "ones"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 185 題）", "explanation": "不特定的「一輛腳踏車」→ one。", "explanationSource": "supplemental"}, {"id": 187, "question": "Kelly: Is there a bank near here?\nLeo: Yes, there's ______ next to the post office.", "options": ["one", "it", "them", "ones"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 185 題）", "explanation": "不特定的一家銀行 → one。", "explanationSource": "supplemental"}, {"id": 188, "question": "I like your new bag. Where did you buy ______?", "options": ["one", "them", "ones", "it"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 185 題）", "explanation": "指對方那個特定的新包包 → it。", "explanationSource": "supplemental"}, {"id": 189, "question": "When Sean came to Taiwan several years ago, ______ people knew about him. But now he is a famous cook in Taiwan.", "options": ["any", "few", "little", "most"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜few + 可數複數（幾乎沒有）", "explanation": "【句型】few + 可數複數名詞 = 幾乎沒有（否定意味）；little + 不可數名詞 = 幾乎沒有。\n【分析】people 為可數複數；後句 But now he is a famous cook 表對比 → 以前「幾乎沒有人」認識他 → few people。\n【其他選項】(A) any 用於否定/疑問句，肯定句此處不合；(C) little 接不可數名詞；(D) most 意為「大部分人」，與 But 的對比矛盾。\n【例句】Few students came to the meeting because it was raining hard.", "explanationSource": "source"}, {"id": 190, "question": "The new shop is in a small lane, so ______ people know about it.", "options": ["little", "much", "few", "a little"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 189 題）", "explanation": "people 可數複數，且語意為「幾乎沒有人知道」→ few。", "explanationSource": "supplemental"}, {"id": 191, "question": "There is ______ milk in the bottle. Let's buy some more.", "options": ["little", "few", "many", "a few"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 189 題）", "explanation": "milk 不可數，且需再買 → 幾乎沒有 → little。", "explanationSource": "supplemental"}, {"id": 192, "question": "Kevin is shy, so he has ______ friends at his new school. He often eats lunch alone.", "options": ["many", "few", "a lot", "little"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 189 題）", "explanation": "friends 可數複數，常獨自吃午餐 → 幾乎沒有朋友 → few。", "explanationSource": "supplemental"}, {"id": 193, "question": "Sue: Your hat looks so comfortable!\nAnn: It's more than comfortable. If you wear a hat like ______, you won't feel cold on a windy day.", "options": ["I", "myself", "one", "this"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜代名詞 one（同類不定的一個）", "explanation": "【句型】one = a/an + 單數名詞，代替前面提過、同類但不特定的東西；it 則指同一個東西。\n【分析】a hat like ______ 中填 one = a hat，意思是「像這樣的一頂帽子」，泛指同類帽子 → one。\n【其他選項】(A) I 是主格，不能放在介系詞 like 後；(B) myself 為反身代名詞，「像我自己的帽子」語意不通；(D) this 為指示代名詞，本題考點是以 one 代替前面的 hat，選 one 最佳。\n【例句】I lost my umbrella, so I need to buy a new one.", "explanationSource": "source"}, {"id": 194, "question": "My pencil is broken. Can you lend me ______?", "options": ["it", "one", "this", "them"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 193 題）", "explanation": "向人借「一枝」不特定的鉛筆 → one。", "explanationSource": "supplemental"}, {"id": 195, "question": "I like your bag. Where did you buy ______?", "options": ["one", "ones", "it", "that one's"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 193 題）", "explanation": "問的是對方那一個特定的包包 → it。", "explanationSource": "supplemental"}, {"id": 196, "question": "These shoes are too small. Do you have bigger ______?", "options": ["one", "it", "them", "ones"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 193 題）", "explanation": "代替複數 shoes 的不特定同類 → ones。", "explanationSource": "supplemental"}, {"id": 197, "question": "______ of the students in my school do not have the experience of going to a foreign country. Only a few do.", "options": ["Any", "Both", "Most", "One"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜Most of the + 複數名詞", "explanation": "【句型】Most of the + 複數名詞 + 複數動詞 =「大部分的……」。\n【分析】Only a few do（只有少數人去過）→ 大部分人沒去過 → Most；且動詞 do not have 為複數。\n【其他選項】(A) Any of… 很少放肯定/否定陳述句句首當主詞；(B) Both 只用於兩者，學校學生不只兩人；(D) One of the students 需接單數動詞 does not。\n【例句】Most of my classmates go to cram school after class.", "explanationSource": "source"}, {"id": 198, "question": "______ of my friends like basketball. Only two of them prefer baseball.", "options": ["Most", "Both", "Either", "Each"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 197 題）", "explanation": "只有兩人喜歡棒球 → 大部分喜歡籃球，動詞 like 為複數 → Most。", "explanationSource": "supplemental"}, {"id": 199, "question": "I have two sisters. ______ of them are teachers.", "options": ["All", "Both", "Most", "Every"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 197 題）", "explanation": "只有兩個姊妹，兩者都 → Both。", "explanationSource": "supplemental"}, {"id": 200, "question": "______ of the boys in my class has a cell phone. Only Tim doesn't.", "options": ["Most", "All", "Each", "Both"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 197 題）", "explanation": "動詞 has 為單數 → Each of the + 複數名詞 + 單數動詞。", "explanationSource": "supplemental"}, {"id": 201, "question": "Tony: Will you go to Cindy's party tonight?\nJane: No, I have to do my homework. Don't you have ______?\nTony: Well, I already finished it at school.", "options": ["you", "your", "yours", "you're"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜所有格代名詞 yours = your homework", "explanation": "【句型】所有格代名詞 mine / yours / his / hers / ours / theirs = 所有格 + 名詞，後面不再接名詞。\n【分析】Jane 前句說 my homework，問 Tony「你沒有你的（作業）嗎？」→ yours = your homework。\n【其他選項】(A) you 為受格，「你沒有你」不通；(B) your 為所有格，後面必須接名詞；(D) you're = you are，文法錯誤。\n【例句】This is my seat. Yours is next to the window.", "explanationSource": "source"}, {"id": 202, "question": "Mia: Is this pencil case ______, Ben?\nBen: No, mine is blue.", "options": ["your", "yours", "you", "yourself"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 201 題）", "explanation": "後面無名詞 → yours = your pencil case。", "explanationSource": "supplemental"}, {"id": 203, "question": "Our classroom is on the second floor, and ______ is on the third floor.", "options": ["their", "them", "theirs", "they"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 201 題）", "explanation": "theirs = their classroom，後面無名詞。", "explanationSource": "supplemental"}, {"id": 204, "question": "Amy forgot her umbrella, so I lent her ______.", "options": ["my", "mine", "me", "I"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 201 題）", "explanation": "lent her ______ 需名詞 → mine = my umbrella。", "explanationSource": "supplemental"}, {"id": 205, "question": "Spring is a wonderful season because ______ is usually warm and sunny.", "options": ["which", "this", "one", "it"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜代名詞 it 指前面提到的特定單數名詞", "explanation": "【句型】it 代替前面提過的「同一個」單數名詞。\n【分析】because 子句的主詞要指前面的 Spring（春天這個季節本身）→ it。\n【其他選項】(A) which 為關係代名詞，不能在 because 後當新子句主詞；(B) this 指「這個」，通常指眼前事物，代替前面主詞不自然；(C) one 代替同類但不特定的東西，不是指 Spring 本身。\n【例句】I love my new bike because it is light and fast.", "explanationSource": "source"}, {"id": 206, "question": "Taipei 101 is famous because ______ was once the tallest building in the world.", "options": ["one", "it", "that one", "which"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 205 題）", "explanation": "指前面同一棟 Taipei 101 → it。", "explanationSource": "supplemental"}, {"id": 207, "question": "My bike was stolen yesterday, so I have to buy a new ______.", "options": ["it", "one", "them", "ones"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 205 題）", "explanation": "買一輛新的（同類不特定）→ one。", "explanationSource": "supplemental"}, {"id": 208, "question": "I bought a storybook last week, but I haven't read ______ yet.", "options": ["one", "them", "it", "its"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 205 題）", "explanation": "指上週買的那一本 → it。", "explanationSource": "supplemental"}, {"id": 209, "question": "You can't push that door open with only one hand. It's too heavy. You have to use ______!", "options": ["all", "another", "both", "one"], "answer": 2, "answerLabel": "C", "source": "115會考｜不定代名詞 both（兩者都）vs. another／one／all", "explanation": "【句型】both 用於「兩者」都；all 用於三者以上；another 再一個（另一個）；one 一個。\n【分析】線索 with only one hand、too heavy：單手推不開，人只有兩隻手，所以要用「兩隻手」→ both。\n【其他選項】(A) all：用於三者以上，手只有兩隻；(B) another：另一隻手，仍是單手；(D) one：一隻手，正是推不開的原因。\n【例句】I have two brothers, and both of them live in Taichung.", "explanationSource": "source"}, {"id": 210, "question": "Kelly has two pens. ______ of them are blue.", "options": ["Both", "All", "Each", "Either"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 209 題）", "explanation": "兩者都用 Both，接複數動詞 are。", "explanationSource": "supplemental"}, {"id": 211, "question": "This cookie is really good. Can I have ______ one?", "options": ["other", "another", "the others", "others"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 209 題）", "explanation": "再要「另一個」用 another + 單數名詞。", "explanationSource": "supplemental"}, {"id": 212, "question": "There are thirty students in my class, and ______ of them passed the test.", "options": ["both", "either", "all", "neither"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 209 題）", "explanation": "三十人（三者以上）都通過用 all。", "explanationSource": "supplemental"}, {"id": 213, "question": "Ken is going abroad with a woman he met online, though he doesn't know ______ well.", "options": ["her", "each other", "any", "another"], "answer": 0, "answerLabel": "A", "source": "115會考｜人稱代名詞受格 her", "explanation": "【句型】及物動詞 + 受格代名詞（him / her / them…）。\n【分析】know 後要接受詞，指的是前面提到的 a woman（單數女性）→ 受格 her。\n【其他選項】(B) each other 彼此：主詞須為兩人以上（如 they），本句主詞是 he；(C) any 任何：不能指特定的那位女子；(D) another 另一個：指的是別人，語意不合。\n【例句】I met a new classmate yesterday, but I don't remember her name.", "explanationSource": "source"}, {"id": 214, "question": "My uncle bought a new car, and he washes ______ every Sunday.", "options": ["it", "them", "him", "its"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 213 題）", "explanation": "代替單數物品 a new car，受格用 it。", "explanationSource": "supplemental"}, {"id": 215, "question": "Amy and Joy have been friends for ten years. They know ______ very well.", "options": ["themselves", "each other", "another", "them"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 213 題）", "explanation": "兩人「彼此」了解，主詞為複數 They。", "explanationSource": "supplemental"}, {"id": 216, "question": "These cookies are for my grandparents. I made ______ myself.", "options": ["it", "they", "them", "their"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 213 題）", "explanation": "代替複數 these cookies，受格用 them。", "explanationSource": "supplemental"}, {"id": 217, "question": "Our dog Lassie hides under the bed every time the moon comes out. She has been ______ for years, but we don't know why.", "options": ["it", "like this", "like us", "that"], "answer": 1, "answerLabel": "B", "source": "115會考｜like this（像這樣）指代前述整件事", "explanation": "【句型】be like this：像這樣（指前面描述的情況、行為）。\n【分析】線索 hides under the bed every time the moon comes out：狗每次月亮出來就躲床下，這種「行為狀態」已經好幾年了 → She has been like this for years。\n【其他選項】(A) it：She has been it 不合文法，it 不能當補語代替整段行為；(C) like us：「像我們一樣」，與躲床下的語意不合；(D) that：She has been that 句意不完整（需說 like that）。\n【例句】My little brother cries when it thunders. He has been like this since he was a baby.", "explanationSource": "source"}, {"id": 218, "question": "Ray always forgets his homework. He has been ______ since last semester.", "options": ["like this", "it", "this one", "that one"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 217 題）", "explanation": "指前述「總是忘記作業」的情況，用 like this。", "explanationSource": "supplemental"}, {"id": 219, "question": "Lucy smiles at everyone she meets. Her mom was ______ when she was young, too.", "options": ["it", "like that", "them", "like her mom"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 217 題）", "explanation": "「像那樣」指前述愛笑的特點，用 like that。", "explanationSource": "supplemental"}, {"id": 220, "question": "Look! You should hold the chopsticks ______, not like that.", "options": ["this", "it", "like this", "them"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 217 題）", "explanation": "示範「像這樣」拿筷子，用 like this。", "explanationSource": "supplemental"}]};</script><script src="longteng-b1u5-quiz.js?v=20261027-2"></script><script>document.querySelector("#description").textContent="共 220 題（會考歷屆 55 題＋類似題 165 題）｜選答後顯示中文解析｜答錯可重做並下載錯題";</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
