<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="龍騰普高 B3U9 單字選擇互動練習"><title>龍騰普高 B3U9 單字選擇</title><style>:root{--blue:#2563eb;--navy:#1e3a8a;--bg:#f4f7fb;--card:#fff;--line:#dbe3ee;--ink:#172033;--muted:#64748b;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--voice:#6d28d9;--voicebg:#f5f3ff;--amber:#9a3412;--amberbg:#fff7ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}.wrap{max-width:920px;margin:auto;padding:16px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 5px 18px #0f172a0d}.hero{background:linear-gradient(135deg,#e8f1ff,#fff)}h1{margin:0 0 6px;font-size:clamp(25px,4vw,38px)}h2{margin-top:0}.note{color:var(--muted)}.hidden{display:none!important}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.btn{border:0;border-radius:10px;padding:11px 17px;font:800 16px inherit;cursor:pointer;background:#e5e7eb;color:var(--ink);text-decoration:none}.primary{background:var(--blue);color:#fff}.danger{background:#991b1b;color:#fff}.voice{background:var(--voice);color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.btn:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.pick{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin:7px 0;background:#fafcff}.pick input{margin-right:8px;width:17px;height:17px;accent-color:var(--blue)}#list{max-height:440px;overflow:auto;border:1px solid var(--line);padding:7px;border-radius:12px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:800;margin:8px 0 14px}.zh{padding:10px 13px;background:var(--amberbg);border-radius:9px;color:var(--amber);font-weight:800;margin-bottom:10px}.question{font-size:21px;font-weight:750;padding:16px;background:#f8fafc;border-radius:11px;white-space:pre-wrap}.options{display:grid;gap:9px;margin:14px 0}.option{display:flex;align-items:center;gap:11px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-size:18px;font-weight:750;cursor:pointer}.option:hover{border-color:#60a5fa;background:#eff6ff}.option:has(input:checked){border-color:var(--blue);background:#dbeafe;color:var(--navy)}.option input{width:20px;height:20px;accent-color:var(--blue)}.inputs{display:grid;gap:10px;margin:15px 0}.answer-row{display:grid;grid-template-columns:55px 1fr;gap:10px;align-items:center}.answer-row label{font-weight:900;color:var(--navy);text-align:center}.spell{width:100%;font:inherit;font-size:18px;padding:11px;border:2px solid #94a3b8;border-radius:9px}.feedback{padding:13px;border-radius:10px;font-weight:800;margin:13px 0}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.explain{font-weight:500;margin-top:7px}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:var(--voicebg);margin:13px 0}.voicebox b{display:block;font-size:19px;margin-bottom:8px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}.wrong p{margin:6px 0}.source{font-size:13px;color:var(--muted)}@media(max-width:600px){.wrap{padding:9px}.hero,.card{padding:15px}.question{font-size:18px;padding:13px}.option{font-size:17px}.answer-row{grid-template-columns:42px 1fr}.meta{display:block}}</style><link rel="stylesheet" href="longteng-vocab-required-pronunciation.css?v=20261026-4"></head><body><main class="wrap"><section class="hero"><h1>龍騰普高 B3U9 單字選擇</h1><p>共 30 題。可自行選題、隨機抽題；答錯後請重新作答。</p><p class="note">答對後顯示來源解析並播放完整英文句；STT 朗讀達 80% 才能進入下一題。完成後可重做錯題並下載 DOCX。</p><div class="toolbar"><a class="btn" href="dashboard.html">← 回測驗總覽</a></div></section><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn">全部選取</button><button id="none" class="btn">全部取消</button><button id="rand20" class="btn">隨機 20 題</button></div><label><input id="shuffle" type="checkbox"> 打亂出題順序</label><div id="list"></div><div class="actions"><button id="start" class="btn primary">開始作答</button><span id="picked" class="note"></span></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="voiceBox" class="voicebox hidden"><b id="voiceTarget"></b><button id="speak" class="btn voice">🔊 再聽一次</button></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="retry" class="btn primary">只重做錯題</button><button id="download" class="btn">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></main><script>const TITLE="龍騰普高 B3U9 單字選擇",MODE="mcq",Q=[{"id":1,"question":"When the famous singer arrived at the awards ceremony and ____________ from her car, her fans shouted and cheered like crazy.","options":["emerged","pierced","knelt","gathered"],"answer":0,"explanation":"當那位知名歌手抵達頒獎典禮，從車中步出時，粉絲們瘋狂地尖叫、歡呼。 (A)出現 (B)刺穿 (C)跪 (D)聚集","source":"龍騰自命題"},{"id":2,"question":"The ____________ of my host family makes me feel at home and very secure, even though I am in a foreign country.","options":["festivity","facility","authority","hospitality"],"answer":3,"explanation":"我住宿家庭的好客，讓我即使身處異國也覺得自在、有安全感。 (A)慶典 (B)場所 (C)權力 (D)好客","source":"龍騰自命題"},{"id":3,"question":"The president ____________ a talented young woman as his personal interpreter. He trusted her to translate his words flawlessly.","options":["unified","pierced","designated","accommodated"],"answer":2,"explanation":"總統指派一位有才華的年輕女性當他的個人口譯員。他信任她會精準無誤地翻譯他所說的話。 (A)使……成為一體；凝聚 (B)（光線、聲音等）穿過 (C)指定；認定 (D)容納","source":"龍騰自命題"},{"id":4,"question":"Lü Buwei (呂不韋), who was a Qin dynasty merchant and grand chancellor, was so ____________ that he housed many people under his roof.","options":["hospitable","exact","explosive","religious"],"answer":0,"explanation":"呂不韋（一位秦朝的商人與宰相）非常好客，因而收攏了許多門客居住在他房舍中。 (A)好客的 (B)精確的 (C)震耳欲聾的 (D)宗教的","source":"龍騰自命題"},{"id":5,"question":"Christianity is the world’s most common ____________, so you’ll find people all around the globe who practice it.","options":["explosion","throng","religion","pilgrimage"],"answer":2,"explanation":"基督教是全世界最普及的宗教，所以你會發現全世界有許多人信奉它。 (A)爆炸；爆裂 (B)聚集的人群；一大群人 (C)宗教 (D)朝聖之旅","source":"龍騰自命題"},{"id":6,"question":"The villa is large enough to ____________ twelve people. Both our families could easily fit in there.","options":["accommodate","designate","unify","explode"],"answer":0,"explanation":"這間別墅夠大，足以容納十二個人。我們兩家人都能輕易地安頓在裡面。 (A)容納 (B)指定；認定 (C)使……成為一體；凝聚 (D)爆炸；引爆","source":"龍騰自命題"},{"id":7,"question":"I can’t get myself to work up any ____________ for this project. It just isn’t appealing to me.","options":["hospitality","enthusiasm","exaggeration","pavement"],"answer":1,"explanation":"我沒辦法讓自己對這個計畫產生任何熱忱。它一點都不吸引我。 (A)好客 (B)熱情；熱忱 (C)誇張；誇大 (D)（鋪過的）路面","source":"龍騰自命題"},{"id":8,"question":"There was a loud ____________ in the neighborhood last night, so many people feared they had been bombed again.","options":["pilgrim","cast","throng","explosion"],"answer":3,"explanation":"昨晚在附近發生了一場響亮的爆炸，許多人相當害怕他們又遭受到轟炸了。 (A)朝聖者；香客 (B)擲；拋 (C)聚集的人群；一大群人 (D)爆炸；爆裂","source":"龍騰自命題"},{"id":9,"question":"When Hank said Fiona always cheats on exams, he was ____________. As far as I know, she has only cheated once.","options":["fading","exaggerating","exploding","piercing"],"answer":1,"explanation":"當Hank說Fiona考試總是會作弊時，他只是在誇大。據我所知，她只作弊過一次。 (A)逐漸消失 (B)誇張；誇大 (C)爆炸；引爆 (D)（光線、聲音等）穿過","source":"龍騰自命題"},{"id":10,"question":"Mike claims to have hundreds of toy cars, but this is definitely a(n) ____________. He only has about fifty or sixty.","options":["enthusiasm","hospitality","exaggeration","pavement"],"answer":2,"explanation":"Mike宣稱擁有數百輛玩具車，但這絕對是誇大其詞。他只有大約五十或六十輛。 (A)熱情；熱忱 (B)好客 (C)誇張 (D)（鋪過的）路面","source":"龍騰自命題"},{"id":11,"question":"“May the gods ____________ us all,” said Grandma as she toasted the new year.","options":["designate","pierce","bless","explode"],"answer":2,"explanation":"祖母舉杯敬賀新年到來時說道：「願眾神保佑我們大家。」 (A)指定；認定 (B)（光線、聲音等）穿過 (C)祝福 (D)爆炸；引爆","source":"龍騰自命題"},{"id":12,"question":"I don’t remember the ____________ price of this dress, but it was around a thousand dollars.","options":["religious","enthusiastic","hospitable","exact"],"answer":3,"explanation":"我不記得這件洋裝精確的價錢，但是大約是一千元。 (A)宗教的 (B)熱情的 (C)好客的 (D)精確的","source":"龍騰自命題"},{"id":13,"question":"The spell that the witch ____________ on the princess makes the princess sleep for a hundred years.","options":["blessed","cast","pierced","exploded"],"answer":1,"explanation":"女巫在公主身上所施的咒語，讓公主沉睡一百年。 (A)祝福 (B)擲；拋 (C)穿過 (D)爆炸","source":"龍騰自命題"},{"id":14,"question":"Every year millions of Muslims from around the world make a ____________ to Mecca, the most important city in their religion.","options":["blessing","pilgrimage","heritage","custom"],"answer":1,"explanation":"每年來自世界各地的數百萬穆斯林到麥加朝聖，它是他們宗教裡最重要的城市。 (A)祝福 (B)朝聖 (C)遺產 (D)習俗","source":"龍騰自命題"},{"id":15,"question":"The ____________ in the airplane cabin are designed to make passengers feel comfortable during a long flight.","options":["facilities","religions","authorities","explosions"],"answer":0,"explanation":"機艙裡的設施是為了使乘客們在長途飛行中感到舒適所設計。 (A)設施 (B)宗教 (C)當局 (D)爆炸","source":"龍騰自命題"},{"id":16,"question":"As a traveler, I would like to explore as many towns and cities as possible to learn more about the cultural ____________ of this country.","options":["accommodation","enthusiasm","heritage","humanity"],"answer":2,"explanation":"身為旅行者，我想要盡量多探索一些鄉鎮與城市，才能多了解這個國家的文化遺產。 (A)住宿 (B)熱忱 (C)遺產 (D)人道","source":"龍騰自命題"},{"id":17,"question":"You should revise this article so that it can be more clearly ____________ around a main idea.","options":["surrounded","exaggerated","designated","unified"],"answer":3,"explanation":"你應該改寫這篇文章，這樣子它才能更清楚地跟主旨整合。 (A)被圍繞 (B)被誇大 (C)被指定 (D)被凝聚","source":"龍騰自命題"},{"id":18,"question":"Janet’s husband is ____________ a control freak, who always wants to decide everything for both of them.","options":["religiously","undoubtedly","enthusiastically","explosively"],"answer":1,"explanation":"Janet的先生無疑是個控制狂，總是想要為他們兩個人決定每件事。 (A)宗教方面 (B)無疑地 (C)熱情地 (D)震耳欲聾地","source":"龍騰自命題"},{"id":19,"question":"The pedestrian underwent emergency surgery after a bullet came out of nowhere and ____________ his lung.","options":["unified","designated","pierced","blessed"],"answer":2,"explanation":"那個行人在一顆子彈不知從哪射出並射穿其肺部後，進行了緊急手術。 (A)凝聚 (B)指定 (C)射穿 (D)祝福","source":"龍騰自命題"},{"id":20,"question":"After the dancer’s brilliant performance, there came a(n) ____________ round of applause from the audience.","options":["blessed","explosive","hospitable","religious"],"answer":1,"explanation":"該舞者亮麗的表演之後，從觀眾傳來一陣如雷的掌聲。 (A)被賜福的 (B)震耳欲聾的 (C)好客的 (D)宗教的","source":"龍騰自命題"},{"id":21,"question":"The audience ____________ applauded the guest professor’s inspiring speech for two entire minutes.","options":["hospitably","enthusiastically","essentially","undoubtedly"],"answer":1,"explanation":"聽眾們為客座教授鼓勵人心的演講熱烈鼓掌喝采整整二分鐘。 (A)好客地 (B)熱情地 (C)基本上 (D)無疑地","source":"龍騰自命題"},{"id":22,"question":"After the A-Mei concert, I got stuck inside ____________ of people and missed the last bus home.","options":["prides","throngs","swarms","schools"],"answer":1,"explanation":"在阿妹的演唱會後，我困在人群中，錯過了回家的最後一班公車。 (A)（獅）群 (B)（人）群 (C)（昆蟲）群 (D)（魚）群","source":"龍騰自命題"},{"id":23,"question":"Dr. Jane Goodall ____________ her life to protecting and studying animals; she spent decades in the wild trying to understand their behavior.","options":["unified","blessed","cast","devoted"],"answer":3,"explanation":"珍．古德博士致力於保護及研究動物；她在野外花了數十年試著了解牠們的行為。 (A)凝聚 (B)祝福 (C)擲；拋 (D)致力","source":"龍騰自命題"},{"id":24,"question":"The witch doctor was requested to perform a ____________ to rid the tribe of evil spirits.","options":["facility","pilgrim","ritual","cast"],"answer":2,"explanation":"那位巫醫被請求施行一種儀式，替部落驅除惡靈。 (A)場所 (B)朝聖者 (C)儀式 (D)全體演員","source":"龍騰自命題"},{"id":25,"question":"It is a(n) ____________ to have my homeroom teacher guiding me along through all my difficulties.","options":["exaggeration","pavement","devotion","blessing"],"answer":3,"explanation":"有我的導師一路指導我克服所有的困難，真是一大幸事。 (A)誇張；誇大 (B)（鋪過的）路面 (C)虔誠 (D)祝福；福賜","source":"龍騰自命題"},{"id":26,"question":"The ____________ concerned should take immediate action to prevent this highly contagious disease from spreading.","options":["authorities","pilgrims","rituals","explosions"],"answer":0,"explanation":"有關當局應採取立即行動，以阻止此具高度傳染性的疾病擴散。 (A)當局 (B)朝聖者 (C)儀式 (D)爆炸","source":"龍騰自命題"},{"id":27,"question":"If you add this substance to the bottle, it may burst or even ____________ after a few seconds, so be sure to stand well back.","options":["explode","kneel","pierce","exaggerate"],"answer":0,"explanation":"如果你把這個物質加入瓶中，它就可能會爆裂開或甚至爆炸，所以務必要站遠一些。 (A)爆炸 (B)跪 (C)（光線、聲音等）穿過 (D)誇張；誇大","source":"龍騰自命題"},{"id":28,"question":"Mother Teresa’s lifelong ____________ to helping the poor and sick earned her worldwide respect.","options":["devotion","authority","pavement","hospitality"],"answer":0,"explanation":"泰瑞莎修女畢生致力救助貧病者，讓她贏得全世界的尊敬。 (A)致力 (B)權力 (C)（鋪過的）路面 (D)好客","source":"龍騰自命題"},{"id":29,"question":"The general showed great ____________ when he ordered the hostages to be released rather than be killed.","options":["devotion","humanity","enthusiasm","pavement"],"answer":1,"explanation":"那位將軍下令將那些人質釋放而非殺害時，展現出相當的人道之情。 (A)致力 (B)人道；仁慈 (C)熱情；熱忱 (D)（鋪過的）路面","source":"龍騰自命題"},{"id":30,"question":"The ancient city of Mecca is often packed with ____________. A great number of them travel from far and wide to visit this sacred place.","options":["pilgrims","rituals","facilities","explosions"],"answer":0,"explanation":"古老的城市麥加總是擠滿了朝聖者。大量的朝聖者從世界各地來參訪這個神聖的地方。 (A)朝聖者；香客 (B)儀式 (C)設施 (D)爆炸","source":"龍騰自命題"}];const $=s=>document.querySelector(s),list=$('#list'),select=$('#select'),quiz=$('#quiz'),result=$('#result'),question=$('#question'),answerArea=$('#answerArea'),feedback=$('#feedback'),next=$('#next');let chosen=[],idx=0,mode='first';const wrong=new Map(),correct=new Set();const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ');const shuffled=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function renderList(){list.innerHTML=Q.map(q=>'<label class="pick"><input class="pickbox" type="checkbox" value="'+q.id+'" checked><b>第 '+q.id+' 題</b> <span class="source">'+esc(q.source||'')+'</span></label>').join('');count()}function count(){$('#picked').textContent='已選 '+document.querySelectorAll('.pickbox:checked').length+' 題'}list.addEventListener('change',count);$('#all').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=true);count()};$('#none').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=false);count()};$('#rand20').onclick=()=>{let ids=new Set(shuffled(Q).slice(0,Math.min(20,Q.length)).map(q=>q.id));document.querySelectorAll('.pickbox').forEach(x=>x.checked=ids.has(+x.value));count()};$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')]
