<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="龍騰普高 B3U5 整句式翻譯互動練習"><title>龍騰普高 B3U5 整句式翻譯</title><style>:root{--blue:#2563eb;--navy:#1e3a8a;--bg:#f4f7fb;--card:#fff;--line:#dbe3ee;--ink:#172033;--muted:#64748b;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--voice:#6d28d9;--voicebg:#f5f3ff;--amber:#9a3412;--amberbg:#fff7ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}.wrap{max-width:920px;margin:auto;padding:16px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 5px 18px #0f172a0d}.hero{background:linear-gradient(135deg,#e8f1ff,#fff)}h1{margin:0 0 6px;font-size:clamp(25px,4vw,38px)}h2{margin-top:0}.note{color:var(--muted)}.hidden{display:none!important}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.btn{border:0;border-radius:10px;padding:11px 17px;font:800 16px inherit;cursor:pointer;background:#e5e7eb;color:var(--ink);text-decoration:none}.primary{background:var(--blue);color:#fff}.danger{background:#991b1b;color:#fff}.voice{background:var(--voice);color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.btn:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.pick{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin:7px 0;background:#fafcff}.pick input{margin-right:8px;width:17px;height:17px;accent-color:var(--blue)}#list{max-height:440px;overflow:auto;border:1px solid var(--line);padding:7px;border-radius:12px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:800;margin:8px 0 14px}.zh{padding:10px 13px;background:var(--amberbg);border-radius:9px;color:var(--amber);font-weight:800;margin-bottom:10px}.question{font-size:21px;font-weight:750;padding:16px;background:#f8fafc;border-radius:11px;white-space:pre-wrap}.options{display:grid;gap:9px;margin:14px 0}.option{display:flex;align-items:center;gap:11px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-size:18px;font-weight:750;cursor:pointer}.option:hover{border-color:#60a5fa;background:#eff6ff}.option:has(input:checked){border-color:var(--blue);background:#dbeafe;color:var(--navy)}.option input{width:20px;height:20px;accent-color:var(--blue)}.inputs{display:grid;gap:10px;margin:15px 0}.answer-row{display:grid;grid-template-columns:55px 1fr;gap:10px;align-items:center}.answer-row label{font-weight:900;color:var(--navy);text-align:center}.spell{width:100%;font:inherit;font-size:18px;padding:11px;border:2px solid #94a3b8;border-radius:9px}.feedback{padding:13px;border-radius:10px;font-weight:800;margin:13px 0}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.explain{font-weight:500;margin-top:7px}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:var(--voicebg);margin:13px 0}.voicebox b{display:block;font-size:19px;margin-bottom:8px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}.wrong p{margin:6px 0}.source{font-size:13px;color:var(--muted)}@media(max-width:600px){.wrap{padding:9px}.hero,.card{padding:15px}.question{font-size:18px;padding:13px}.option{font-size:17px}.answer-row{grid-template-columns:42px 1fr}.meta{display:block}}</style><link rel="stylesheet" href="longteng-vocab-required-pronunciation.css?v=20261026-4"></head><body><main class="wrap"><section class="hero"><h1>龍騰普高 B3U5 整句式翻譯</h1><p>共 22 題。輸入完整英文句；系統會以關鍵語意、句型與文法結構彈性判定，答錯後請重新作答。</p><p class="note">答對後顯示解析卷參考答案並播放完整英文句；STT 朗讀達 80% 才能進入下一題。完成後可重做錯題並下載 DOCX。</p><div class="toolbar"><a class="btn" href="dashboard.html">← 回測驗總覽</a></div></section><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn">全部選取</button><button id="none" class="btn">全部取消</button><button id="rand20" class="btn">隨機 20 題</button></div><label><input id="shuffle" type="checkbox"> 打亂出題順序</label><div id="list"></div><div class="actions"><button id="start" class="btn primary">開始作答</button><span id="picked" class="note"></span></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="voiceBox" class="voicebox hidden"><b id="voiceTarget"></b><button id="speak" class="btn voice">🔊 再聽一次</button></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="retry" class="btn primary">只重做錯題</button><button id="download" class="btn">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></main><script>const TITLE="龍騰普高 B3U5 整句式翻譯",MODE="spell",Q=[{"id":1,"zh":"Tiffany過去被看到每晚沿著河邊遛狗。","question":"________________________________________","answers":["Tiffany was seen to walk her dog along the river every night."],"accepted":["Tiffany was seen to walk her dog along the river every night."],"reference":"Tiffany was seen to walk her dog along the river every night.","explanation":"","source":"All in One"},{"id":2,"zh":"Peter上班前一定先吃早餐。","question":"________________________________________","answers":["Peter never goes to work without eating breakfast first."],"accepted":["Peter never goes to work without eating breakfast first.","Peter doesn't go to work without eating breakfast first."],"reference":"Peter never goes/doesn’t go to work without eating breakfast first.","explanation":"","source":"三合一學習手冊"},{"id":3,"zh":"這名五十歲的男人有一隻只有兩條腿的狗。","question":"________________________________________","answers":["This fifty-year-old man has a two-legged dog."],"accepted":["This fifty-year-old man has a two-legged dog."],"reference":"This fifty-year-old man has a two-legged dog.","explanation":"","source":"三合一學習手冊"},{"id":4,"zh":"Jack與Jill被看到上課時在打瞌睡（doze off）。","question":"________________________________________","answers":["Jack and Jill were seen dozing off in class."],"accepted":["Jack and Jill were seen dozing off in class."],"reference":"Jack and Jill were seen dozing off in class.","explanation":"","source":"三合一學習手冊"},{"id":5,"zh":"Julie的寵物狗被看見正追在Johnson的小貓咪後面。","question":"________________________________________","answers":["Julie's pet dog was seen running after Johnson's kitten."],"accepted":["Julie's pet dog was seen running after Johnson's kitten."],"reference":"Julie’s pet dog was seen running after Johnson’s kitten.","explanation":"be seen V-ing/to VR為感官動詞被動句型，後面的動詞應為V-ing或to VR；kitten n.小貓咪。","source":"龍騰自命題"},{"id":6,"zh":"Brian第一眼（at first sight）就愛上了Judy並決定要追求她。","question":"________________________________________","answers":["Brian fell in love with Judy at first sight and decided to pursue her."],"accepted":["Brian fell in love with Judy at first sight and decided to pursue her."],"reference":"Brian fell in love with Judy at first sight and decided to pursue her.","explanation":"A fall in love with B愛上；pursue vt. 追求。","source":"龍騰自命題"},{"id":7,"zh":"這座金黃色的神社在一片綠色的樹海中很顯眼。（...against...）","question":"________________________________________","answers":["The golden shrine stands out against the sea of green trees."],"accepted":["The golden shrine stands out against the sea of green trees."],"reference":"The golden shrine stands out against the sea of green trees.","explanation":"stand out 顯眼；against... prep. 以……為背景。","source":"龍騰自命題"},{"id":8,"zh":"我覺得榮幸受邀到這次的時尚秀（fashion show），在此我盡情欣賞了許多設計師的傑作。","question":"________________________________________","answers":["I felt honored to be invited to the fashion show, where I feasted my eyes on the masterpieces of many designers."],"accepted":["I felt honored to be invited to the fashion show, where I feasted my eyes on the masterpieces of many designers."],"reference":"I felt honored to be invited to the fashion show, where I feasted my eyes on the masterpieces of many designers.","explanation":"feast one’s eyes on盡情欣賞；honored adj. 榮幸的。","source":"龍騰自命題"},{"id":9,"zh":"最新發表的智慧型手機非常吸睛，因為它結合了受歡迎的外觀和升級的功能。","question":"________________________________________","answers":["The lately-released smartphone is very eye-catching because it combines a popular look with updated functions."],"accepted":["The lately-released smartphone is very eye-catching because it combines a popular look with updated functions."],"reference":"The lately-released smartphone is very eye-catching because it combines a popular look with updated functions.","explanation":"combine A with B 將A與B結合；release vt. 發表；updated adj. 升級的。","source":"龍騰自命題"},{"id":10,"zh":"Charlie沒有自己的枕頭就睡不好；那就是為何他每次（whenever）去旅行總是會把它打包在行李（luggage）裡。","question":"________________________________________","answers":["Charlie can't sleep well without his own pillow; that's why he always packs it in his luggage whenever he goes on a trip."],"accepted":["Charlie can't sleep well without his own pillow; that's why he always packs it in his luggage whenever he goes on a trip."],"reference":"Charlie can’t sleep well without his own pillow; that’s why he always packs it in his luggage whenever he goes on a trip.","explanation":"not...without N/V-ing為雙重否定，本題的雙重否定有「強調」的意味，強調某名詞或某行為的必要性；pillow n. 枕頭；luggage n. 行李。","source":"龍騰自命題"},{"id":11,"zh":"除了自然美景之外，京都也具有豐富的文化歷史。伴隨這兩個因素吸引著參訪者，它每年都接待很多的觀光客。","question":"________________________________________","answers":["Apart from its natural beauty, Kyoto also has a rich cultural history. With both these factors attracting visitors, it receives many tourists every year."],"accepted":["Apart from its natural beauty, Kyoto also has a rich cultural history. With both these factors attracting visitors, it receives many tourists every year."],"reference":"Apart from its natural beauty, Kyoto also has a rich cultural history. With both these factors attracting visitors, it receives many tourists every year.","explanation":"apart from A, B.... 除了A還有B；with + O + OC 伴隨著……。","source":"龍騰自命題"},{"id":12,"zh":"Selena上週末待在一棟美麗沙灘上的三層樓房子。","question":"________________________________________","answers":["Selena stayed at a three-story house on a beautiful beach last weekend."],"accepted":["Selena stayed at a three-story house on a beautiful beach last weekend."],"reference":"Selena stayed at a three-story house on a beautiful beach last weekend.","explanation":"","source":"三合一學習手冊"},{"id":13,"zh":"Wilson慢跑時都會聽音樂。（...否定字詞...without....）","question":"________________________________________","answers":["Wilson never goes jogging without listening to music."],"accepted":["Wilson never goes jogging without listening to music.","Wilson doesn't go jogging without listening to music."],"reference":"Wilson never goes/doesn’t go jogging without listening to music.","explanation":"","source":"三合一學習手冊"},{"id":14,"zh":"Robert愛上攝影後，他沒有一天不拍照。","question":"________________________________________","answers":["After Robert fell in love with photography, he didn't go one day without taking pictures."],"accepted":["After Robert fell in love with photography, he didn't go one day without taking pictures."],"reference":"After Robert fell in love with photography, he didn’t go one day without taking pictures.","explanation":"","source":"All in One"},{"id":15,"zh":"Kenny是如此不感恩（ungrateful）的人以致於他從未被聽過對那些幫助過他的人說謝謝。","question":"________________________________________","answers":["Kenny is such an ungrateful man that he has never been heard saying \"thanks\" to those who have helped him."],"accepted":["Kenny is such an ungrateful man that he has never been heard saying \"thanks\" to those who have helped him.","Kenny is such an ungrateful man that he has never been heard to say \"thanks\" to those who have helped him."],"reference":"Kenny is such an ungrateful man that he has never been heard saying/to say “thanks” to those who have helped him.","explanation":"S has never been heard V-ing/to VR感官動詞作被動時，後面的動詞應為Ving或to VR；those who +V... 那些……的人；ungrateful adj. 不感恩的。","source":"龍騰自命題"},{"id":16,"zh":"Peter出席（attend）派對都會帶著他美麗的太太。（never...without）","question":"________________________________________","answers":["Peter never attends a party without bringing his beautiful wife."],"accepted":["Peter never attends a party without bringing his beautiful wife."],"reference":"Peter never attends a party without bringing his beautiful wife.","explanation":"never...without N/V-ing為雙重否定，本題的雙重否定有「強調」的意味，強調某名詞或某行為的必要性；attend vt. 出席。","source":"龍騰自命題"},{"id":17,"zh":"這家餐廳以服務優質聞名。它的男女服務生總是被看見帶著友善的笑容。","question":"________________________________________","answers":["This restaurant is famous for good service. Its waiters and waitresses are always seen wearing friendly smiles."],"accepted":["This restaurant is famous for good service. Its waiters and waitresses are always seen wearing friendly smiles."],"reference":"This restaurant is famous for good service. Its waiters and waitresses are always seen wearing friendly smiles.","explanation":"be seen V-ing/to VR為感官動詞被動句型，後面的動詞應為V-ing或to VR。","source":"龍騰自命題"},{"id":18,"zh":"許多人認為沒有和藝妓面對面的話，到京都的旅行就不算完整。","question":"________________________________________","answers":["Many people think that a trip to Kyoto won't be complete without coming face to face with geishas."],"accepted":["Many people think that a trip to Kyoto won't be complete without coming face to face with geishas."],"reference":"Many people think that a trip to Kyoto won’t be complete without coming face to face with geishas.","explanation":"not...without N/V-ing為雙重否定，本題的雙重否定有「強調」的意味，強調某名詞或某行為的必要性；A come face to face with B表「A與B面對面」。","source":"龍騰自命題"},{"id":19,"zh":"走在一路往上通往廟宇的小路上，我覺得很放鬆，伴隨著內心充滿平靜。（V-ing..., S + V....）","question":"________________________________________","answers":["Walking along the path leading up to the temple, I felt relaxed with my heart filled with peace."],"accepted":["Walking along the path leading up to the temple, I felt relaxed with my heart filled with peace."],"reference":"Walking along the path leading up to the temple, I felt relaxed with my heart filled with peace.","explanation":"V-ing..., S + V....分詞構句；lead up to + 地點 一路往上通往……；with + O + OC 伴隨著……；relaxed adj. 放鬆的；peace n. 平靜。","source":"龍騰自命題"},{"id":20,"zh":"數週內，這隻看起來醜陋的毛毛蟲（caterpillar）就會轉變成一隻美麗的蝴蝶。","question":"________________________________________","answers":["Within weeks, the ugly-looking caterpillar will turn into a beautiful butterfly."],"accepted":["Within weeks, the ugly-looking caterpillar will turn into a beautiful butterfly."],"reference":"Within weeks, the ugly-looking caterpillar will turn into a beautiful butterfly.","explanation":"A turn into B = A become B 變成；caterpillar n. 毛毛蟲。","source":"龍騰自命題"},{"id":21,"zh":"身為一個意志力堅強的人，Daniel總是不顧前方的困難，勇敢追求目標。（...regardless of...）","question":"________________________________________","answers":["As a person of strong will, Daniel always pursues his goals bravely regardless of the difficulties ahead."],"accepted":["As a person of strong will, Daniel always pursues his goals bravely regardless of the difficulties ahead."],"reference":"As a person of strong will, Daniel always pursues his goals bravely regardless of the difficulties ahead.","explanation":"regardless of + N 無論；不顧","source":"龍騰自命題"},{"id":22,"zh":"雖然這支籃球隊的每一位成員都很傑出，但正是團隊精神及合作促成此團隊的成功。","question":"________________________________________","answers":["Though each member of the basketball team is excellent, it is its teamwork and cooperation that lead the team to success."],"accepted":["Though each member of the basketball team is excellent, it is its teamwork and cooperation that lead the team to success."],"reference":"Though each member of the basketball team is excellent, it is its teamwork and cooperation that lead the team to success.","explanation":"it is...that....為分裂句，分裂句為強調句型，意為「正是……；就是……」；cooperation n. 合作。","source":"龍騰自命題"}];const $=s=>document.querySelector(s),list=$('#list'),select=$('#select'),quiz=$('#quiz'),result=$('#result'),question=$('#question'),answerArea=$('#answerArea'),feedback=$('#feedback'),next=$('#next');let chosen=[],idx=0,mode='first';const wrong=new Map(),correct=new Set();const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ');const shuffled=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function renderList(){list.innerHTML=Q.map(q=>'<label class="pick"><input class="pickbox" type="checkbox" value="'+q.id+'" checked><b>第 '+q.id+' 題</b> <span class="source">'+esc(q.source||'')+'</span></label>').join('');count()}function count(){$('#picked').textContent='已選 '+document.querySelectorAll('.pickbox:checked').length+' 題'}list.addEventListener('change',count);$('#all').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=true);count()};$('#none').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=false);count()};$('#rand20').onclick=()=>{let ids=new Set(shuffled(Q).slice(0,Math.min(20,Q.length)).map(q=>q.id));document.querySelectorAll('.pickbox').forEach(x=>x.checked=ids.has(+x.value));count()};$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));if($('#shuffle').checked)chosen=shuffled(chosen);idx=0;mode='first';wrong.clear();correct.clear();select.classList.add('hidden');result.classList.add('hidden');quiz.classList.remove('hidden');show()};function show(){const q=chosen[idx];speechSynthesis?.cancel();$('#meta').textContent=(mode==='retry'?'錯題重做｜':'')+'第 '+(idx+1)+' / '+chosen.length+' 題';$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';$('#bar').style.width=(idx+1)/chosen.length*100+'%';question.textContent=q.question;const zh=$('#zh');if(q.zh){zh.textContent=q.zh;zh.classList.remove('hidden')}else zh.classList.add('hidden');feedback.className='feedback hidden';$('#voiceBox').classList.add('hidden');$('#check').classList.remove('hidden');next.classList.add('hidden');if(MODE==='mcq')answerArea.innerHTML='<div class="options">'+q.options.map((o,i)=>'<label class="option"><input type="radio" name="answer" value="'+i+'"><b>'+String.fromCharCode(65+i)+'.</b> '+esc(o)+'</label>').join('')+'</div>';else answerArea.innerHTML='<div class="inputs">'+q.answers.map((_,i)=>'<div class="answer-row"><label>'+(MODE==='multi'?['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'][i]:'答案')+'</label><input class="spell" autocomplete="off" spellcheck="false" placeholder="請輸入完整答案"></div>').join('')+'</div>';setTimeout(()=>answerArea.querySelector('input')?.focus(),0)}function currentAnswers(){if(MODE==='mcq'){const x=answerArea.querySelector('input:checked');return x?[+x.value]:[]}return [...answerArea.querySelectorAll('.spell')].map(x=>x.value)}function correctText(q){return q.reference||q.answers[0]}function words(s){return norm(s).replace(/\b(can't|cannot)\b/g,'can not').replace(/\b(won't)\b/g,'will not').replace(/n't\b/g,' not').replace(/'m\b/g,' am').replace(/'re\b/g,' are').replace(/'s\b/g,' is').replace(/'ve\b/g,' have').replace(/'d\b/g,' would').replace(/[^a-z0-
