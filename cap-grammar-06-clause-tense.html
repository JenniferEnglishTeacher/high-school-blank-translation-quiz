<script>window.QUIZ_CONFIG={"title": "國中會考文法歷屆試題｜副詞子句與名詞子句的時態", "mode": "mcq", "questions": [{"id": 1, "question": "John will stay with his sister until he ______ an apartment.", "options": ["will find", "would find", "finds", "found"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜until 副詞子句用現在式代替未來", "explanation": "【句型】S + will + V + until + S + V（現在簡單式）。時間副詞子句用現在式表示未來。\n【分析】主句 will stay 是未來，until 引導的時間副詞子句不可用 will，要用現在式；主詞 he 單數 → finds。\n【其他選項】(A) 副詞子句不可用 will；(B) would 用於過去的未來或假設；(D) found 過去式與主句未來不合。\n【例句】I'll wait here until you come back.", "explanationSource": "source"}, {"id": 2, "question": "We'll wait here until the rain ______.", "options": ["stops", "will stop", "stopped", "is stopped"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 1 題）", "explanation": "until 引導時間副詞子句，用現在式 stops 代替未來。", "explanationSource": "supplemental"}, {"id": 3, "question": "As soon as Amy ______ home, she will call you.", "options": ["will get", "got", "gets", "is getting"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 1 題）", "explanation": "as soon as 時間副詞子句用現在式表未來，主詞單數用 gets。", "explanationSource": "supplemental"}, {"id": 4, "question": "Don't leave the classroom until the bell ______.", "options": ["will ring", "rang", "is ringing", "rings"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 1 題）", "explanation": "until 副詞子句用現在簡單式 rings 表未來。", "explanationSource": "supplemental"}, {"id": 5, "question": "Before she ______ about it, you should tell Daphne you broke her favorite cup.", "options": ["asks", "asked", "was asking", "will ask"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜before 副詞子句用現在式代替未來", "explanation": "【句型】Before + S + V（現在簡單式）, S + should/will + V。時間副詞子句以現在式表未來。\n【分析】主句 you should tell 是對未來的建議，「在她問起之前」是未來的事，before 子句用現在式 → asks。\n【其他選項】(B)(C) 過去式／過去進行式與主句的建議不合；(D) 時間副詞子句不可用 will。\n【例句】Please wash your hands before you eat.", "explanationSource": "source"}, {"id": 6, "question": "After Sam ______ his homework, his mom will let him play games.", "options": ["will finish", "finishes", "finished", "finishing"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 5 題）", "explanation": "after 時間副詞子句用現在式 finishes 表未來。", "explanationSource": "supplemental"}, {"id": 7, "question": "Please turn off the lights before you ______ the room.", "options": ["leave", "left", "will leave", "leaving"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 5 題）", "explanation": "before 副詞子句用現在式 leave 表未來。", "explanationSource": "supplemental"}, {"id": 8, "question": "When my cousin ______ to Taipei next month, I'll show her around.", "options": ["came", "will come", "comes", "coming"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 5 題）", "explanation": "when 引導時間副詞子句，即使有 next month 仍用現在式 comes。", "explanationSource": "supplemental"}, {"id": 9, "question": "I'm not sure if Kevin ______ this morning, but if he does, I'll tell him that you called.", "options": ["will come in", "comes in", "has come in", "came in"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜if（是否）名詞子句保留未來式", "explanation": "【句型】if/whether（是否）引導名詞子句時，該用未來式就用未來式；if（如果）引導條件副詞子句時才用現在式代替未來。\n【分析】if Kevin ___ 是 I'm not sure 的受詞（名詞子句），意思是「他是否會進來」，要用 will come in。後面的 if he does 是條件副詞子句，才用現在式。\n【其他選項】(B) comes in 是副詞子句的用法，此處 if 是「是否」；(C) 現在完成式表已來，與 this morning 尚未發生的不確定語意不合；(D) 過去式，則後句 if he does 不合。\n【例句】I don't know if Amy will come to the party tomorrow.", "explanationSource": "source"}, {"id": 10, "question": "Nobody knows if it ______ tomorrow, so bring your umbrella just in case.", "options": ["rains", "will rain", "rained", "has rained"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 9 題）", "explanation": "if 表「是否」，引導 knows 的受詞（名詞子句），未來的事用 will rain。", "explanationSource": "supplemental"}, {"id": 11, "question": "If it ______ tomorrow, the sports day will be canceled.", "options": ["will rain", "rained", "rains", "has rained"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 9 題）", "explanation": "if 表「如果」，為條件副詞子句，用現在式 rains 表未來。", "explanationSource": "supplemental"}, {"id": 12, "question": "I wonder whether Jack ______ to my birthday party next Saturday.", "options": ["comes", "came", "has come", "will come"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 9 題）", "explanation": "whether 引導名詞子句（wonder 的受詞），未來的事用 will come。", "explanationSource": "supplemental"}, {"id": 13, "question": "Tonight I'll stay at the office until I ______ the work.", "options": ["finish", "am finishing", "finished", "will finish"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜until 副詞子句用現在式代替未來", "explanation": "【句型】S + will + V + until + S + V（現在簡單式）。\n【分析】主句 I'll stay 為未來，until 引導的時間副詞子句用現在簡單式 finish 代替未來。\n【其他選項】(B) 進行式不合「做完為止」的語意；(C) 過去式與 Tonight、I'll 不合；(D) 時間副詞子句不可用 will。\n【例句】We won't start the meeting until Mr. Lee arrives.", "explanationSource": "source"}, {"id": 14, "question": "I'll keep practicing the piano until I ______ the song perfectly.", "options": ["will play", "play", "played", "am played"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 13 題）", "explanation": "until 副詞子句用現在式 play 表未來。", "explanationSource": "supplemental"}, {"id": 15, "question": "Mom won't go to bed until Dad ______ home tonight.", "options": ["gets", "will get", "got", "getting"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 13 題）", "explanation": "not...until 副詞子句仍用現在式，主詞 Dad 單數用 gets。", "explanationSource": "supplemental"}, {"id": 16, "question": "We'll stay in the classroom until the teacher ______ us to leave.", "options": ["will tell", "told", "tells", "telling"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 13 題）", "explanation": "until 副詞子句用現在式 tells 表未來。", "explanationSource": "supplemental"}, {"id": 17, "question": "If the weather is fine this weekend, my family ______ to the beach for two days.", "options": ["go", "went", "have gone", "will go"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜if 條件句：主句用未來式", "explanation": "【句型】If + S + V（現在式）, S + will + V。條件子句用現在式，主要子句用未來式。\n【分析】If 子句 is fine 用現在式表未來條件，主句是 this weekend 將發生的事 → will go。\n【其他選項】(A) 現在式不能表示「到時候會去」；(B) 過去式不合 this weekend；(C) 現在完成式表已完成，不合。\n【例句】If you hurry, you will catch the bus.", "explanationSource": "source"}, {"id": 18, "question": "If you ______ hard, you will pass the test.", "options": ["study", "will study", "studied", "studying"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 17 題）", "explanation": "if 條件子句用現在式 study 代替未來。", "explanationSource": "supplemental"}, {"id": 19, "question": "If Tim gets up late again, he ______ the school bus.", "options": ["misses", "missed", "has missed", "will miss"], "answer": 3, "answerLabel": "D", "source": "類似題 2（對應第 17 題）", "explanation": "if 子句用現在式，主要子句用未來式 will miss。", "explanationSource": "supplemental"}, {"id": 20, "question": "If my parents ______ me a new bike, I'll ride it to school every day.", "options": ["will buy", "bought", "buy", "buying"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 17 題）", "explanation": "if 條件子句用現在式 buy 表未來，主詞複數不加 s。", "explanationSource": "supplemental"}, {"id": 21, "question": "If Frank ______ to the office tonight, give this package to him.", "options": ["came", "comes", "has come", "will come"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜if 條件子句＋祈使句", "explanation": "【句型】If + S + V（現在式）, 祈使句（原形動詞開頭）。\n【分析】主句 give this package to him 是祈使句，If 條件子句用現在式表未來（tonight）；Frank 第三人稱單數 → comes。\n【其他選項】(A) 過去式不合 tonight；(C) 現在完成式不合；(D) 條件副詞子句不可用 will。\n【例句】If you see Amy, tell her to call me.", "explanationSource": "source"}, {"id": 22, "question": "If anyone ______ for me while I'm out, please take a message.", "options": ["calls", "will call", "called", "calling"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 21 題）", "explanation": "if 條件子句用現在式；anyone 視為單數，用 calls。", "explanationSource": "supplemental"}, {"id": 23, "question": "If you ______ any questions after class, come to my office.", "options": ["had", "will have", "have", "having"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 21 題）", "explanation": "主句為祈使句，if 子句用現在式 have。", "explanationSource": "supplemental"}, {"id": 24, "question": "If Grandpa ______ tired during the walk, let him sit down for a while.", "options": ["will feel", "felt", "feeling", "feels"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 21 題）", "explanation": "if 條件子句用現在式，主詞 Grandpa 單數用 feels。", "explanationSource": "supplemental"}, {"id": 25, "question": "Mr. Olson went to the doctor when he found he ______ his hair. He hoped he would be able to keep his thick hair.", "options": ["was losing", "is losing", "will lose", "has lost"], "answer": 0, "answerLabel": "A", "source": "115會考｜過去進行式 was losing（主要子句為過去式）", "explanation": "【句型】過去進行式 was/were + Ving：過去某時正在進行（逐漸發生）的事；主要子句是過去式時，名詞子句也用過去時態。\n【分析】線索 went、found、hoped 都是過去式；掉頭髮是一個逐漸進行的過程，他發現當時「正在掉髮」，且還希望保住濃密頭髮（表示還沒掉光）→ was losing。\n【其他選項】(B) is losing：現在進行式，與過去式 found 時態不一致；(C) will lose：未來式，不符過去時間；(D) has lost：現在完成式，時態不合，且表示已掉光，與「希望保住濃密頭髮」矛盾。\n【例句】When I got home, I found my brother was cooking dinner.", "explanationSource": "source"}, {"id": 26, "question": "When Mom came into my room, she found I ______ a comic book, not my textbook.", "options": ["read", "am reading", "was reading", "have read"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 25 題）", "explanation": "過去某時正在進行的動作用過去進行式 was reading。", "explanationSource": "supplemental"}, {"id": 27, "question": "Lily noticed her cat ______ weight, so she gave it less food.", "options": ["was gaining", "is gaining", "will gain", "gains"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 25 題）", "explanation": "主要子句 noticed 為過去式，體重「正在增加」用 was gaining。", "explanationSource": "supplemental"}, {"id": 28, "question": "I didn't answer the phone last night because I ______ a shower.", "options": ["take", "was taking", "am taking", "have taken"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 25 題）", "explanation": "昨晚電話來時「正在洗澡」，用過去進行式。", "explanationSource": "supplemental"}]};</script><script src="longteng-b1u5-quiz.js?v=20261027-2"></script><script>document.querySelector("#description").textContent="共 28 題（會考歷屆 7 題＋類似題 21 題）｜選答後顯示中文解析｜答錯可重做並下載錯題";</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
