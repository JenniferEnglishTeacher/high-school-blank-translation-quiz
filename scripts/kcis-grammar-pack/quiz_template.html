<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__</title><style>
:root{--accent:#2563eb;--bg:#f4f7fb;--ink:#172033;--muted:#65748b;--line:#d9e2ef;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--voice:#6d28d9;--cue:#1e3a8a;--cuebg:#eef4ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.65}
.wrap{max-width:1020px;margin:auto;padding:15px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:15px 0;box-shadow:0 6px 22px #0f172a0c}.hero{background:linear-gradient(135deg,#eef5ff,#fff)}
h1{margin:0;font-size:clamp(23px,4vw,34px)}h2,h3{margin-top:0}.muted{color:var(--muted)}.hidden{display:none!important}
.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.btn{border:0;border-radius:10px;padding:11px 16px;font:800 16px inherit;font-family:inherit;cursor:pointer;background:#e5e7eb;color:var(--ink);text-decoration:none}.primary{background:var(--accent);color:#fff}.voice{background:var(--voice);color:#fff}.danger{background:#991b1b;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.group-btn{padding:16px;text-align:left;border:2px solid var(--line);border-radius:13px;background:#fff;cursor:pointer;font-family:inherit}.group-btn:hover{border-color:var(--accent);background:#f8fbff}.group-btn b{display:block;font-size:17px}.group-btn span{color:var(--muted)}
.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--accent);transition:width .3s}.meta{display:flex;justify-content:space-between;gap:4px 14px;flex-wrap:wrap;color:var(--muted);font-weight:800;margin:8px 0 14px}
.question{font-size:19px;font-weight:700;padding:18px;background:#f8fafc;border-radius:12px;line-height:2.4}
.blank{font:inherit;font-size:17px;font-weight:700;padding:3px 8px;border:2px solid #94a3b8;border-radius:8px;background:#fff;color:var(--ink);min-width:120px;vertical-align:middle}
input.blank{width:150px}select.blank{cursor:pointer}.blank.right{border-color:var(--ok);background:var(--okbg)}.blank.wrong{border-color:var(--bad);background:var(--badbg)}
.cue{margin:12px 0 0;padding:10px 14px;border-radius:10px;background:var(--cuebg);color:var(--cue);font-weight:800}
.feedback,.reference{padding:13px;border-radius:10px;font-weight:700;margin:12px 0;white-space:pre-wrap}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.reference{border:2px solid #bbf7d0;background:#f0fdf4}.reference .zh{color:#334155;font-weight:600}.reference .tip{color:#6d28d9}
.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:#f5f3ff;margin:12px 0}.voicebox .note{color:var(--muted);margin:6px 0 10px}.voice-result{margin-top:10px;padding:11px;border-radius:9px;background:#fff;border:1px solid #ddd6fe}.voice-result.good{background:var(--okbg);color:var(--ok);border-color:#86efac}.voice-result.retry{background:var(--badbg);color:var(--bad);border-color:#fecaca}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat,.wrong-card{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong-card{margin:10px 0;background:#fff7f7;border-color:#fecaca}
@media(max-width:620px){.wrap{padding:8px}.hero,.card{padding:15px}.question{font-size:17px;padding:12px}input.blank{width:120px}}
</style></head><body><main class="wrap">
<section class="hero"><h1>__TITLE__</h1><p>__SUBTITLE__</p><p class="muted">共 __COUNT__ 題｜第一格寫主要動詞（注意時態與主詞），其餘從選單選出正確形式｜逐題批改｜答錯可重填｜答對後顯示中文、文法提示與朗讀</p><div class="toolbar"><a class="btn" href="dashboard.html">← 回測驗總覽</a></div></section>
<section id="select" class="card"><h2>選擇練習範圍</h2><div id="groups" class="grid"></div></section>
<section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div>
<div id="question" class="question"></div><div id="cue" class="cue"></div>
<div id="feedback" class="feedback hidden"></div><div id="reference" class="reference hidden"></div>
<div id="voiceBox" class="voicebox hidden"><h3>🎙️ Pronunciation Check（選做）</h3><p class="note">先聽完整句子，再按麥克風朗讀；朗讀評分不影響進入下一題。</p><p><b id="voiceTarget"></b></p><div class="toolbar"><button id="speak" class="btn voice">🔊 再聽一次</button><button id="mic" class="btn primary">🎤 開始朗讀評分</button></div><div id="voiceResult" class="voice-result">尚未進行朗讀評分。</div></div>
<div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束本輪</button></div></section>
<section id="result" class="card hidden"><h2>練習結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="back" class="btn">選擇其他範圍</button><button id="restart" class="btn">重新開始</button></div></section>
</main><script>
const DATA=__DATA__;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let items=[],index=0,currentTitle='',wrong=new Map(),correct=new Set(),firstTry=new Set(),tried=false,recognition=null;
function norm(s){return String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ').replace(/\bdon't\b/g,'do not').replace(/\bdoesn't\b/g,'does not').replace(/\bdidn't\b/g,'did not').replace(/\bcan't\b/g,'cannot').replace(/\bcouldn't\b/g,'could not').replace(/\bcan not\b/g,'cannot').replace(/[.!?]$/,'')}
function renderGroups(){const all=DATA.items.length;$('#groups').innerHTML=`<button class="group-btn" data-all="1"><b>全部練習</b><span>${all} 題｜依原題順序</span></button>`+DATA.sections.map(s=>{const n=DATA.items.filter(i=>i.sec===s.id).length;return `<button class="group-btn" data-sec="${s.id}"><b>${esc(s.title)}</b><span>${esc(s.zh)}｜${n} 題</span></button>`}).join('');document.querySelectorAll('.group-btn').forEach(b=>b.onclick=()=>b.dataset.all?start(DATA.items,'全部練習'):start(DATA.items.filter(i=>i.sec===b.dataset.sec),DATA.sections.find(s=>s.id===b.dataset.sec).title))}
function start(chosen,title){items=chosen;currentTitle=title;index=0;wrong=new Map();correct=new Set();firstTry=new Set();$('#select').classList.add('hidden');$('#result').classList.add('hidden');$('#quiz').classList.remove('hidden');show()}
function show(){try{recognition?.abort()}catch(e){}window.speechSynthesis?.cancel();tried=false;const it=items[index];$('#meta').textContent=`${it.group}｜第 ${index+1} / ${items.length} 題`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=(index+1)/items.length*100+'%';['#feedback','#reference','#voiceBox'].forEach(s=>$(s).classList.add('hidden'));$('#voiceResult').className='voice-result';$('#voiceResult').textContent='尚未進行朗讀評分。';$('#check').classList.remove('hidden');$('#next').classList.add('hidden');
let k=0;const qh=esc(it.p).replace(/\{(\d+)\}/g,(m,d)=>{const b=it.blanks[+d-1];const i=+d-1;if(b.options)return `<select class="blank" data-i="${i}" aria-label="blank ${d}"><option value="">選擇 ▾</option>${b.options.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;return `<input class="blank" data-i="${i}" spellcheck="false" autocomplete="off" aria-label="blank ${d}" placeholder="${b.role==='main'&&i===0&&/^\{1\}/.test(it.p)?'Aux.':'(  )'}">`});
$('#question').innerHTML=`${it.n}. `+qh;$('#cue').textContent=it.cue;setTimeout(()=>$('#question .blank')?.focus(),0);
$('#question').querySelectorAll('input.blank').forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter')$('#check').click()}))}
function answerShow(b){return b.key||b.answers[0]}
function recordWrong(it,value){if(!wrong.has(it.id))wrong.set(it.id,{item:it,attempts:[]});wrong.get(it.id).attempts.push(value);$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
function speak(text=items[index].sentence){if(!window.speechSynthesis||!text)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.86;speechSynthesis.speak(u)}
$('#check').onclick=()=>{const it=items[index],els=[...$('#question').querySelectorAll('.blank')];const vals=els.map(e=>e.value.trim());if(vals.some(v=>!v))return alert('請完成所有空格。');let ok=true;els.forEach((el,i)=>{const b=it.blanks[i];const good=b.options?b.answers.includes(el.value):b.answers.some(a=>norm(a)===norm(el.value));el.classList.toggle('right',good);el.classList.toggle('wrong',!good);if(!good)ok=false});
if(ok){correct.add(it.id);if(!tried)firstTry.add(it.id);$('#feedback').className='feedback ok';$('#feedback').textContent='✅ 正確！';showRef(it);$('#check').classList.add('hidden');$('#next').classList.remove('hidden');$('#voiceTarget').textContent=it.sentence;$('#voiceBox').classList.remove('hidden');speak()}
else{tried=true;recordWrong(it,vals.join(' / '));$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 紅框的空格不正確，請修改後再試。';showRef(it)}};
function showRef(it){$('#reference').innerHTML=`<b>參考答案：</b>${esc(it.blanks.map(answerShow).join(' ／ '))}\n${esc(it.sentence)}\n<span class="zh">${esc(it.zh)}</span>\n<span class="tip">💡 ${esc(it.tip)}</span>`;$('#reference').classList.remove('hidden')}
$('#next').onclick=()=>{index++;index>=items.length?finish():show()};$('#finish').onclick=finish;$('#speak').onclick=()=>speak();
function speechNorm(s){return String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim()}
function similarity(a,b){a=speechNorm(a).split(' ').filter(Boolean);b=speechNorm(b).split(' ').filter(Boolean);const d=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)d[i][0]=i;for(let j=0;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return 1-d[a.length][b.length]/Math.max(a.length,b.length,1)}
async function listen(){const box=$('#voiceResult'),mic=$('#mic'),SR=window.SpeechRecognition||window.webkitSpeechRecognition,reset=()=>{mic.disabled=false;mic.textContent='🎤 開始朗讀評分'};window.speechSynthesis?.cancel();if(!window.isSecureContext){box.className='voice-result retry';box.textContent='請使用 HTTPS 網址開啟測驗，才能使用麥克風。';return}if(!SR){box.className='voice-result retry';box.textContent='此瀏覽器不支援語音辨識；可直接進入下一題。建議使用最新版 Chrome 或 Edge。';return}mic.disabled=true;mic.textContent='🎤 正在開啟麥克風…';try{const st=await navigator.mediaDevices.getUserMedia({audio:true});st.getTracks().forEach(t=>t.stop())}catch(e){reset();box.className='voice-result retry';box.textContent='麥克風權限未開啟。請在瀏覽器網站權限中允許麥克風後再試。';return}try{recognition?.abort()}catch(e){}recognition=new SR();recognition.lang='en-US';recognition.interimResults=false;recognition.maxAlternatives=5;box.className='voice-result';box.textContent='🎤 正在聆聽，請朗讀完整句子…';mic.textContent='🎤 聆聽中…';recognition.onresult=e=>{const target=items[index].sentence,best=[...e.results[0]].map(x=>({t:x.transcript,s:similarity(x.transcript,target)})).sort((a,b)=>b.s-a.s)[0],pct=Math.round(best.s*100);box.className='voice-result '+(pct>=80?'good':'retry');box.innerHTML=`<strong>辨識結果：</strong>${esc(best.t)}<br><strong>準確率：</strong>${pct}%<br>${pct>=80?'✅ 朗讀內容與目標句相符。':'🔁 建議再聽一次後重新朗讀。'}`};recognition.onerror=()=>{box.className='voice-result retry';box.textContent='沒有聽清楚，請再試一次。'};recognition.onend=reset;recognition.start()}
$('#mic').onclick=listen;
function finish(){try{recognition?.abort()}catch(e){}window.speechSynthesis?.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');$('#summary').innerHTML=`<div class="stat">本輪題數<b>${items.length}</b></div><div class="stat">完成題數<b>${correct.size}</b></div><div class="stat">一次答對<b>${firstTry.size}</b></div><div class="stat">曾答錯<b>${wrong.size}</b></div>`;$('#wrongList').innerHTML=wrong.size?'<h3>錯題紀錄</h3>'+[...wrong.values()].map(r=>`<div class="wrong-card"><b>${esc(r.item.id)}</b>　${esc(r.item.p.replace(/\{\d+\}/g,'____'))}<br><strong>作答：</strong>${r.attempts.map(esc).join('；')}<br><strong>答案：</strong>${esc(r.item.blanks.map(answerShow).join(' ／ '))}<br><span class="muted">${esc(r.item.tip)}</span></div>`).join(''):'<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>'}
$('#back').onclick=()=>{window.speechSynthesis?.cancel();$('#quiz').classList.add('hidden');$('#result').classList.add('hidden');$('#select').classList.remove('hidden')};$('#restart').onclick=()=>location.reload();
renderGroups();
</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
