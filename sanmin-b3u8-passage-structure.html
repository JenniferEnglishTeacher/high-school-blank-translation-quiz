:root{--blue:#2563eb;--deep:#172554;--bg:#f4f7fb;--line:#d9e2ef;--ok:#15803d;--bad:#b91c1c;--violet:#6d28d9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font-family:Arial,"Microsoft JhengHei",sans-serif;line-height:1.7}main{max-width:1060px;margin:auto;padding:14px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 7px 24px #0f172a0c}.hero{background:linear-gradient(135deg,#eff6ff,#fff)}h1{margin:0;font-size:clamp(25px,4vw,38px)}h2,h3{margin:0 0 10px}.muted{color:#64748b}.hidden{display:none!important}.btn{border:0;border-radius:10px;padding:10px 15px;font:800 16px inherit;cursor:pointer;background:#e5e7eb;color:#172033;text-decoration:none}.primary{background:var(--blue);color:#fff}.voice{background:var(--violet);color:#fff}.danger{background:#991b1b;color:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;font-weight:800;color:#64748b;margin:9px 0}.prompt,.passage{font-size:18px;background:#f8fafc;border-radius:12px;padding:16px;white-space:pre-wrap}.passage{max-height:48vh;overflow:auto}.blank-now{background:#fef3c7;color:#92400e;padding:2px 7px;border-radius:6px;font-weight:900}.options{display:grid;gap:9px;margin:14px 0}.option{border:2px solid #cbd5e1;background:#fff;border-radius:11px;padding:12px 14px;text-align:left;font:700 16px inherit;cursor:pointer}.option:hover{border-color:var(--blue)}.option.wrong{border-color:#fecaca;background:#fff1f2}.option.correct{border-color:#86efac;background:#f0fdf4}.feedback,.reference{padding:13px;border-radius:10px;margin:12px 0;font-weight:800;white-space:pre-wrap}.feedback.ok{background:#ecfdf3;color:var(--ok)}.feedback.bad{background:#fff1f2;color:var(--bad)}.reference{border:2px solid #bbf7d0;background:#f0fdf4}.translation{white-space:pre-wrap;backgr </style></head><body><main><section class="hero"><h1>三民普高 B3U8｜篇章結構</h1><p class="muted">原題互動練習｜20 題｜即時批改｜錯誤重填｜答對後整句播放＋選做 STT｜錯題 DOCX｜成績登錄</p><div class="actions"><a class="btn" href="dashboard.html">← 回 Dashboard</a></div></section><section id="quiz" class="card"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="reference" class="reference hidden"></div><div id="voiceBox" class="voicebox hidden"><h3>🎙️ Pronunciation Check（選做）</h3><p><b id="voiceTarget"></b></p><div class="actions"><button id="speak" class="btn voice">🔊 再聽一次</button><button id="mic" class="btn primary">🎤 開始朗讀評分</button></div><div id="voiceResult" class="voice-result">尚未進行朗讀評分。</div></div><div class="actions"><button id="check" class="btn primary hidden">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束本輪</button></div></section><section id="result" class="card hidden"><h2>練習結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="download" class="btn primary">下載錯題 DOCX</button><button id="restart" class="btn">重新練習</button></div></section></main><script>
const QUIZ={"unit":"B3U8","kind":"bank","title":"篇章結構","count":20,"data":[{"set":1,"passage":"The British royal family has had a history of giving the poor help. Princess Diana, who was married to Prince Charles of Wales in 1981, continued this tradition during her short term as princess.\nPrincess Diana became known as the “English rose” because of her compassion for others. __1__ She was even named the “people’s princess” by British Prime Minister Tony Blair because of her efforts to help the sick and the poor. She encouraged people around the world to give their time and money to help those who are less fortunate.\n__2__ The same year, the Diana, Princess of Wales Memorial Fund was started in Great Britain and since 1998, it has supplied a great amount of money to charitable groups or organizations around the world, mainly in the United Kingdom, Africa, and Asia. __3__ The organization seeks to improve end-of-life support for people in Africa and raise awareness of refugee problems around the world. __4__\nDiana’s work brought more humanity to the royal family in Great Britain and inspired many people to continue her legacy of giving.","options":{"A":"After Princess Diana’s death in 1997, many people around the world wished to see her humanitarian work continue.","B":"The mission of this organization is to make improvements in the lives of the world’s most disadvantaged people.","C":"She visited homeless people, AIDS patients, sick children, and victims of land mines in countries all over the world.","D":"In addition, it strives to improve prison conditions, mental health care, remove land mines, and provide care for those hurt by land mines.","E":"She often invited political leaders to join her during her visits to hospitals and disaster areas."},"answers":["C","A","B","D"],"sentences":["She visited homeless people, AIDS patients, sick children, and victims of land mines in countries all over the world.","After Princess Diana’s death in 1997, many people around the world wished to see her humanitarian work continue.","The mission of this organization is to make improvements in the lives of the world’s most disadvantaged people.","In addition, it strives to improve prison conditions, mental health care, remove land mines, and provide care for those hurt by land mines."],"blankNums":[1,2,3,4],"structure":true},{"set":2,"passage":"Each night, about a billion people go to bed hungry. Fortunately the World Food Program (WFP) is working hard to ease this suffering. __1__ It works with other sister organizations within the UN, operates in close to 80 countries, and provides food assistance to 100 million people a year.\nIn Cambodia, 15-20% of the population lives in extreme poverty. Natural disasters and other problems make it difficult for people to get enough to eat. Malnutrition is common, especially in the countryside. __2__\nRecently, a food project that provides breakfast for young Cambodian students was suspended due to high food prices. However, the WFP managed to secure new funds to resume the program. __3__ The cost is about $20 per child. Thanks to donors, the WFP expects to be able to maintain the program throughout the school year.\nBreakfast for the children is designed to be as nutritional as possible. __4__ The breakfast includes rice, sardines, and yellow split peas, as well as vegetable oil and salt. The children, of course, are delighted. They look forward to bringing their plates and spoons to class.","options":{"A":"This will allow 450,000 schoolchildren in 1,344 rural schools to have a meal before school each day.","B":"Teachers have said that it has already made the children healthier, and has enhanced their ability to learn.","C":"The WFP is, in total, assisting over one million people in Cambodia.","D":"The largest humanitarian organization in the world, the WFP is the main United Nations agency addressing the worldwide food crisis.","E":"Some critics argue that food aid programs should also teach long-term skills like farming, rather than only giving meals."},"answers":["D","C","A","B"],"sentences":["The largest humanitarian organization in the world, the WFP is the main United Nations agency addressing the worldwide food crisis.","The WFP is, in total, assisting over one million people in Cambodia.","This will allow 450,000 schoolchildren in 1,344 rural schools to have a meal before school each day.","Teachers have said that it has already made the children healthier, and has enhanced their ability to learn."],"blankNums":[1,2,3,4],"structure":true},{"set":3,"passage":"Forced to leave their homes under dangerous circumstances, refugees often escape with little food and just the clothes on their backs. They may spend days, weeks, and even months traveling by foot. Many stay in camps where there is very little food and water, living conditions are rough, and the weather may be extreme. __1__\nMost refugees do not even have the most basic necessities for the challenging situations they face, but the organization Choose Love hopes to change that. __2__ Since its beginning just five years ago, the Choose Love store has so far reached over one million refugees and is present in 18 different countries.\nChoose Love’s success has come from thinking outside of the box: they are the first store to sell products for refugees. When visitors enter a Choose Love store, they find shelves filled with warm blankets, winter jackets, toothbrushes, and bottles of shampoo. __3__ The items that are bought will be delivered to the people most in need. Just a small amount of money can go a long way. For example, £3.00 supplies someone with a hot shower, and £15 will feed a family for three days. £20.00 provides blankets, sleeping bags, or even a small heater for those forced to spend the winter months in freezing refugee camps. __4__ They are the tools that not only bring dignity and hope to refugees, but help them rebuild lives.","options":{"A":"The Choose Love store has been criticized for not providing enough emergency medical supplies to refugees.","B":"Most suffer physical and mental pain during these times—and long afterward as well.","C":"These items are simple but desperately needed.","D":"The Choose Love store provides refugees with everything from hot meals and tents to rescue boats and legal assistance.","E":"Customers then pick out items for refugees, rather than for themselves."},"answers":["B","D","E","C"],"sentences":["Most suffer physical and mental pain during these times—and long afterward as well.","The Choose Love store provides refugees with everything from hot meals and tents to rescue boats and legal assistance.","Customers then pick out items for refugees, rather than for themselves.","These items are simple but desperately needed."],"blankNums":[1,2,3,4],"structure":true},{"set":4,"passage":"Forced to run for their lives and exiled from their homes, thousands of people from war-torn countries such as Somalia, Iraq, Cuba, Haiti and Palestine pour into USA every year to look for humanitarian assistance and protection. __1__ Though the number has been severely cut since then, due to security concerns, the country still admits a considerable number of people unto its folds every year.\nThe US federal government provides ample humanitarian assistance to newly arrived refugees. __2__ The Bureau of Population, Refugees and Migration (PRM) deals with the problems of refugees, both within the US and worldwide. PRM provides humanitarian assistance on many levels, such as community services, helping the refugees build tolerance to a different cultures and protection for the refugees. __3__\nSeveral nonprofit organizations (NPOs) come to the rescue of the refugees. Agencies such as International Rescue Committee (IRC) and Refugees International (RI) contract with the Department of State to provide food, housing, employment, medical care, counseling and other services for refugees. __4__ They provide most of the basic things the refugees need to restart their lives and help them overcome cultural problems so that their resettlement in the new land is easier.","options":{"A":"An emergency fund known as Emergency Refugee and Migration Account (ERMA) is made available by the State government to meet refugee emergencies.","B":"Before the tragedy that struck on September 11 2001, more than 90,000 refugees were admitted into USA every year.","C":"Humanitarian assistance can be broken down into many categories including relief and rehabilitation, food assistance and other refugee programs.","D":"Volunteers from various non-governmental organizations (NGOs) help refugees find housing, learn about customs in America, secure jobs, and become citizens.","E":"Many refugees have relatives already living in the U.S., but bringing families back together is not always a priority in immigration decisions."},"answers":["B","C","A","D"],"sentences":["Before the tragedy that struck on September 11 2001, more than 90,000 refugees were admitted into USA every year.","Humanitarian assistance can be broken down into many categories including relief and rehabilitation, food assistance and other refugee programs.","An emergency fund known as Emergency Refugee and Migration Account (ERMA) is made available by the State government to meet refugee emergencies.","Volunteers from various non-governmental organizations (NGOs) help refugees find housing, learn about customs in America, secure jobs, and become citizens."],"blankNums":[1,2,3,4],"structure":true},{"set":5,"passage":"Forced to leave their homes under dangerous circumstances, refugees often escape with little food and just the clothes on their backs. They may spend days, weeks, and even months traveling by foot. Many stay in camps where there is very little food and water, living conditions are rough, and the weather may be extreme. __1__\nMost refugees do not even have the most basic necessities for the challenging situations they face, but the organization Choose Love hopes to change that. __2__ Since its beginning just five years ago, the Choose Love store has so far reached over one million refugees and is present in 18 different countries.\nChoose Love’s success has come from thinking outside of the box: they are the first store to sell products for refugees. When visitors enter a Choose Love store, they find shelves filled with warm blankets, winter jackets, toothbrushes, and bottles of shampoo. __3__ The items that are bought will be delivered to the people most in need. Just a small amount of money can go a long way. For example, £3.00 supplies someone with a hot shower, and £15 will feed a family for three days. £20.00 provides blankets, sleeping bags, or even a small heater for those forced to spend the winter months in freezing refugee camps. __4__ They are the tools that not only bring dignity and hope to refugees, but help them rebuild lives.","options":{"A":"Customers then pick out items for refugees, rather than for themselves.","B":"Most suffer physical and mental pain during these times—and long afterward as well.","C":"These items are simple but desperately needed.","D":"The Choose Love store provides refugees with everything from hot meals and tents to rescue boats and legal assistance."},"answers":["B","D","A","C"],"sentences":["Most suffer physical and mental pain during these times—and long afterward as well.","The Choose Love store provides refugees with everything from hot meals and tents to rescue boats and legal assistance.","Customers then pick out items for refugees, rather than for themselves.","These items are simple but desperately needed."],"blankNums":[1,2,3,4],"structure":true}]};const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let flat=[],index=0,wrong=new Map(),attempted=new Set(),firstTry=new Set(),recognition=null;
function flatten(){if(QUIZ.kind==='mcq')return QUIZ.data.map(x=>({...x,id:String(x.number)}));if(QUIZ.kind==='translation')return QUIZ.data.map(x=>({...x,id:String(x.number)}));return QUIZ.data.flatMap(set=>set.answers.map((answer,i)=>({id:`${set.set}-${i+1}`,set:set.set,passage:set.passage,options:set.options,answer,blank:i+1,sentence:set.sentences[i],structure:set.structure})))}
function fillPassage(text,answers,options){let out=text;answers.forEach((a,i)=>{const word=options[a];const n=i+1;const pats=[new RegExp(`__\\(?${n}\\)?__`),new RegExp(`__${n}__`),new RegExp(`　${n}　`),new RegExp(`\\(${n}\\)`)];for(const p of pats){if(p.test(out)){out=out.replace(p,word);break}}});return out.replace(/\n+/g,' ').replace(/\s+/g,' ').trim()}
function markBlank(text,n){const tag=`<span class="blank-now">Blank ${n}</span>`;let out=esc(text),done=false;for(const p of [new RegExp(`__\\(?${n}\\)?__`),new RegExp(`__${n}__`),new RegExp(`　${n}　`),new RegExp(`\\(${n}\\)`)]){if(!done&&p.test(out)){out=out.replace(p,tag);done=true}}return out}
function norm(s){return String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ')}function speak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}
function show(){try{recognition?.abort()}catch(e){}speechSynthesis?.cancel();const q=flat[index];$('#meta').textContent=`第 ${index+1} / ${flat.length} 題`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=((index+1)/flat.length*100)+'%';$('#feedback').className='feedback hidden';$('#reference').classList.add('hidden');$('#voiceBox').classList.add('hidden');$('#next').classList.add('hidden');$('#check').classList.toggle('hidden',QUIZ.kind!=='translation');$('#answerArea').innerHTML='';if(QUIZ.kind==='mcq')renderChoice(q.prompt,q.options);else if(QUIZ.kind==='translation')renderTranslation(q);else{$('#question').innerHTML=`<div class="passage">${markBlank(q.passage,q.blank)}</div>`;renderChoice(`第 ${q.blank} 格`,q.options)}}
function renderChoice(prompt,options){$('#question').innerHTML=QUIZ.kind==='mcq'?`<div class="prompt">${esc(prompt)}</div>`:$('#question').innerHTML;$('#answerArea').innerHTML='<div class="options">'+Object.entries(options).map(([k,v])=>`<button class="option" data-key="${k}"><b>${k}.</b> ${esc(v)}</button>`).join('')+'</div>';document.querySelectorAll('.option').forEach(b=>b.onclick=()=>checkChoice(b.dataset.key,b))}
function renderTranslation(q){let i=0;const rendered=esc(q.prompt).replace(/_{3,}/g,()=>`<input class="inline-input" data-i="${i++}" aria-label="第 ${i} 格答案">`);$('#question').innerHTML=`<div class="translation">${rendered}</div>`;setTimeout(()=>document.querySelector('.inline-input')?.focus(),0)}
function recordWrong(q,value){if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(value);$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
function checkChoice(key,button){const q=flat[index];attempted.add(q.id);if(key!==q.answer){recordWrong(q,key);button.classList.add('wrong');$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 不正確，請再試一次。';return}if(!wrong.has(q.id))firstTry.add(q.id);document.querySelectorAll('.option').forEach(b=>b.disabled=true);button.classList.add('correct');pass(q)}
function checkTranslation(){const q=flat[index],values=[...document.querySelectorAll('.inline-input')].map(x=>x.value);attempted.add(q.id);const ok=values.length===q.answers.length&&values.every((v,i)=>norm(v)===norm(q.answers[i]));if(!ok){recordWrong(q,values.join(' / '));$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 尚有空格不正確，請修正後再檢查。';return}if(!wrong.has(q.id))firstTry.add(q.id);document.querySelectorAll('.inline-input').forEach(x=>x.disabled=true);pass(q)}
function pass(q){$('#feedback').className='feedback ok';$('#feedback').textContent='✅ 正確！';$('#reference').classList.remove('hidden');$('#reference').textContent='完整句：'+q.sentence;$('#check').classList.add('hidden');$('#next').classList.remove('hidden');$('#voiceBox').classList.remove('hidden');$('#voiceTarget').textContent=q.sentence;$('#voiceResult').className='voice-result';$('#voiceResult').textContent='尚未進行朗讀評分。';speak(q.sentence)}
function similarity(a,b){a=norm(a).replace(/[^a-z0-9' ]/g,'').split(' ').filter(Boolean);b=norm(b).replace(/[^a-z0-9' ]/g,'').split(' ').filter(Boolean);const used=new Set;let hit=0;for(const w of a){const j=b.findIndex((x,i)=>x===w&&!used.has(i));if(j>=0){hit++;used.add(j)}}return Math.round(100*hit/Math.max(a.length,b.length,1))}
function startMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('#voiceResult').textContent='此瀏覽器不支援語音辨識，建議使用 Chrome。';return}recognition=new SR;recognition.lang='en-US';recognition.interimResults=false;$('#voiceResult').textContent='正在聆聽，請朗讀完整句子…';recognition.onresult=e=>{const said=e.results[0][0].transcript,target=flat[index].sentence,score=similarity(target,said);$('#voiceResult').className='voice-result '+(score>=80?'good':'retry');$('#voiceResult').textContent=`辨識：${said}\n正確率：${score}%`};recognition.onerror=e=>$('#voiceResult').textContent='語音辨識未完成：'+e.error;recognition.start()}
function finish(){try{recognition?.abort()}catch(e){}speechSynthesis?.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');const rows=[...wrong.values()];$('#summary').innerHTML=`<div class="stat">實際作答<b>${attempted.size}</b></div><div class="stat">一次答對<b>${firstTry.size}</b></div><div class="stat">曾答錯<b>${rows.length}</b></div>`;$('#wrongList').innerHTML=rows.length?rows.map((r,i)=>`<div class="wrong-card"><b>${i+1}. 第 ${esc(r.q.id)} 題</b><p>${esc(r.q.prompt||`第 ${r.q.blank} 格`)}</p><p>作答：${r.attempts.map(esc).join('；')}</p><p>答案：${esc(r.q.answer||r.q.answers.join(' / '))}</p></div>`).join(''):(attempted.size?'<div class="feedback ok">🎉 本輪全部一次答對！</div>':'<p class="muted">本輪尚未作答，因此不登錄成績。</p>');$('#download').classList.toggle('hidden',!rows.length);if(attempted.size)document.dispatchEvent(new CustomEvent('quiz-result-ready',{detail:{total:attempted.size,correct:firstTry.size,wrong:rows.length,mistakeQuestionNumbers:rows.map(r=>r.q.id).join(', ')}}))}
$('#check').onclick=checkTranslation;$('#next').onclick=()=>{if(++index>=flat.length)finish();else show()};$('#finish').onclick=finish;$('#restart').onclick=()=>location.reload();$('#speak').onclick=()=>speak(flat[index].sentence);$('#mic').onclick=startMic;$('#download').onclick=async()=>{const rows=[...wrong.values()];if(!rows.length)return;try{if(!window.docx)await new Promise((ok,fail)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js';s.onload=ok;s.onerror=fail;document.head.append(s)});const{Document,Packer,Paragraph,HeadingLevel}=window.docx,children=[new Paragraph({text:`三民普高 ${QUIZ.unit} ${QUIZ.title} 錯題紀錄`,heading:HeadingLevel.TITLE})];rows.forEach(r=>children.push(new Paragraph({text:`第 ${r.q.id} 題`,heading:HeadingLevel.HEADING_2}),new Paragraph(r.q.prompt||r.q.passage||''),new Paragraph('作答：'+r.attempts.join('；')),new Paragraph('答案：'+(r.q.answer||r.q.answers.join(' / ')))));const blob=await Packer.toBlob(new Document({sections:[{children}]})),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Sanmin_${QUIZ.unit}_${QUIZ.kind}_錯題.docx`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){alert('目前無法產生 DOCX，請稍後再試。')}};flat=flatten();show();
</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
