rument 工具、appearance 外表。", "explanationSource": "own", "section": "詞彙"}, {"id": 6, "question": "第 6 題　This information came from a very ______ source, so you don’t have to worry about being cheated.", "options": ["reliable", "flexible", "clumsy", "brutal"], "answer": 0, "answerLabel": "A", "source": "98 學測｜詞彙｜第 6 題", "explanation": "不必擔心被騙，表示消息來源「可靠」：reliable。flexible 有彈性的、clumsy 笨拙的、brutal 殘暴的。", "explanationSource": "own", "section": "詞彙"}, {"id": 7, "question": "第 7 題　We hope that there will be no war in the world and that all people live in peace and ______ with each other.", "options": ["complaint", "harmony", "mission", "texture"], "answer": 1, "answerLabel": "B", "source": "98 學測｜詞彙｜第 7 題", "explanation": "live in peace and harmony 和平和諧地共處：harmony 和諧。complaint 抱怨、mission 任務、texture 質地。", "explanationSource": "own", "section": "詞彙"}, {"id": 8, "question": "第 8 題　To have a full discussion of the issue, the committee spent a whole hour ______ their ideas at the meeting.", "options": ["depositing", "exchanging", "governing", "interrupting"], "answer": 1, "answerLabel": "B", "source": "98 學測｜詞彙｜第 8 題", "explanation": "為了充分討論，花一小時「交換」意見：exchanging ideas。deposit 存放、govern 統治、interrupt 打斷。", "explanationSource": "own", "section": "詞彙"}, {"id": 9, "question": "第 9 題　While adapting to western ways of living, many Asian immigrants in the US still try hard to ______ their own cultures and traditions.", "options": ["volunteer", "scatter", "preserve", "motivate"], "answer": 2, "answerLabel": "C", "source": "98 學測｜詞彙｜第 9 題", "explanation": "適應西方生活的同時仍努力「保存」自己的文化：preserve。volunteer 自願、scatter 散播、motivate 激勵。", "explanationSource": "own", "section": "詞彙"}, {"id": 10, "question": "第 10 題　With the worsening of global economic conditions, it seems wiser and more ______ to keep cash in the bank rather than to invest in the stock market.", "options": ["sensible", "portable", "explicit", "anxious"], "answer": 0, "answerLabel": "A", "source": "98 學測｜詞彙｜第 10 題", "explanation": "經濟惡化時
