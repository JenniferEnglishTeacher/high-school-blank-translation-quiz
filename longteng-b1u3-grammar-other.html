  <script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 3｜文法選擇（其他考點）","mode":"mcq","questions":[{"id":1,"question":"Amy came across one of her friends while she ____________ at one department store last Sunday.","options":["has shopped","was shopping","will shop","shops"],"answer":1,"source":"龍騰自命題","explanation":"副詞子句的連接詞是while，而while通常要與進行式連用，表示「在某段時間內持續進行的動作」，故答案要選擇was shopping；come across sb. 遇見某人","explanationSource":"source"},{"id":2,"question":"Stephanie ____________ Paris many times, so she is quite familiar with the city.","options":["has been to","is going to","will go to","had been to"],"answer":0,"source":"龍騰自命題","explanation":"由主要子句後面的many times可知本句語境為「表達經驗」，而且後面的副詞子句為現在式，因此可推知是表達「到目前為止的經驗」，故要使用現在完成式，故答案要選擇has been to","explanationSource":"source"},{"id":3,"question":"____________ Paul caught a bad cold, he decided to take a sick leave.","options":["Due to","With","Because of","Since"],"answer":3,"source":"龍騰自命題","explanation":"前後子句之間有因果關係，而且空格後面是一個完整的子句，故必須選擇連接詞，不能使用介系詞，故答案要選擇Since","explanationSource":"source"},{"id":4,"question":"Janet has two brothers. ____________ is a doctor, and ____________ is a teacher.","options":["One; still another","The other; still another","One; the other","Another; one"],"answer":2,"source":"龍騰自命題","explanation":"當總數只有兩個時，提到第一個要用one，提到另外一個要用the other，故答案要選擇One; the other","explanationSource":"source"},{"id":5,"question":"Nathan believes that as long as he keeps ____________ hard, he will make his dreams come true one day.","options":["works","working","worked","to work"],"answer":1,"source":"龍騰自命題","explanation":"此處考點為keep + V-ing，表「持續做某事」，故答案要選擇working","explanationSource":"source"},{"id":6,"question":"I am surprised to hear that Daniel’s new smartphone is ____________ more expensive than mine.","options":["much","very","so","too"],"answer":0,"source":"龍騰自命題","explanation":"由於空格後面是比較級，因此必須選擇much來修飾","explanationSource":"source"},{"id":7,"question":"Students in the class know Tina often gets perfect scores on exams and ____________ she is also good at dancing.","options":["×","what","whom","that"],"answer":3,"source":"龍騰自命題","explanation":"在S + V (+ that)...and that + S + V....的句型中，第二個引導名詞子句的that不可省略，故本題答案要選擇that","explanationSource":"source"},{"id":8,"question":"As this museum is quite large, more than 1,000 people can enter it ____________ one time.","options":["by","in","at","for"],"answer":2,"source":"龍騰自命題","explanation":"此處考點為at one time，表「一次」，故介系詞要選擇at","explanationSource":"source"},{"id":9,"question":"____________ most teenagers, Alex doesn’t love playing mobile games. Instead, he enjoys reading.","options":["To like","Unlike","Liking","Likes"],"answer":1,"source":"龍騰自命題","explanation":"由於空格後面是名詞片語，故可推知應該是介系詞，因此答案必須選擇Unlike，表示「不像；和……不同」","explanationSource":"source"},{"id":10,"question":"Fiona wants to finish the task without ____________ anyone else for help.","options":["asking","to ask","asks","asked"],"answer":0,"source":"龍騰自命題","explanation":"此處考點為without + V-ing，表「不用、沒有……」，因此答案要選擇動名詞asking","explanationSource":"source"},{"id":11,"question":"If you want to get better at anything, you must ____________ a lot.","options":["practice","be practicing","to practice","have practiced"],"answer":0,"source":"龍騰自命題","explanation":"must + VR 必須","explanationSource":"source"},{"id":12,"question":"No living creatures can live ____________ air and water.","options":["without","with","for","in"],"answer":0,"source":"龍騰自命題","explanation":"without prep. 無；沒有","explanationSource":"source"},{"id":13,"question":"I can’t concentrate if you keep ____________ to me.","options":["talked","talk","talks","talking"],"answer":3,"source":"龍騰自命題","explanation":"keep + V-ing 持續……","explanationSource":"source"},{"id":14,"question":"Susan looks ____________ than age. She barely has any wrinkles.","options":["more young","much younger","as young as","any younger"],"answer":1,"source":"龍騰自命題","explanation":"程度副詞如much, far, a lot等可來修飾形容詞比較級","explanationSource":"source"},{"id":15,"question":"It was strange that ____________ didn’t show up at school that day.","options":["half the class of","class in half","half the class","the class half"],"answer":2,"source":"龍騰自命題","explanation":"half (of) N 一半的……","explanationSource":"source"},{"id":16,"question":"Feeling the ground suddenly begin to shake, the teacher stayed ____________ and asked all the students to get under their desks.","options":["calmness","calmly","calming","calm"],"answer":3,"source":"龍騰自命題","explanation":"stay為連綴動詞，其後要接形容詞","explanationSource":"source"},{"id":17,"question":"Dad ____________ his hand on my shoulder to encourage me and show his support.","options":["lied","lain","laid","lay"],"answer":2,"source":"龍騰自命題","explanation":"lay（放置）的三態變化為lay, laid, laid","explanationSource":"source"},{"id":18,"question":"____________ today is my birthday, you should pay for dinner and drinks.","options":["Yet","Since","When","So"],"answer":1,"source":"龍騰自命題","explanation":"since 表因為","explanationSource":"source"},{"id":19,"question":"Laura helped her mother ____________ a chocolate cake for her father’s birthday.","options":["bake","baking","baked","to baking"],"answer":0,"source":"龍騰自命題","explanation":"help + sb. + VR 幫助某人做某事","explanationSource":"source"},{"id":20,"question":"My little brother ____________ Hong Kong to visit our grandmother. He will come back next month.","options":["could have gone to","goes to","would go to","has gone to"],"answer":3,"source":"龍騰自命題","explanation":"由上下文可判斷說話者的弟弟已經前往香港探親，下個月才會回來，因此空格應選用現在完成式","explanationSource":"source"},{"id":21,"question":"We should stay ____________ in the library. Many people are reading or studying there.","options":["quiet","noise","quietness","noisily"],"answer":0,"source":"三合一學習手冊","explanation":"正確答案為 quiet；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":22,"question":"Winter in England is _____ than winter in Taiwan.","options":["very colder","much colder","even cold","very cold"],"answer":1,"source":"三合一學習手冊","explanation":"正確答案為 much colder；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":23,"question":"You seem ____________ after meeting Mike. Tell me more about him.","options":["happy","happily","like happy","happiness"],"answer":0,"source":"三合一學習手冊","explanation":"正確答案為 happy；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":24,"question":"Our new house is ____________ than our old one. I can’t wait to move in.","options":["very bigger","a lot small","too big","far bigger"],"answer":3,"source":"三合一學習手冊","explanation":"正確答案為 far bigger；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":25,"question":"Exercising at least three times a week can help people stay ____________.","options":["healthy","health","healthily","healthiness"],"answer":0,"source":"三合一學習手冊","explanation":"正確答案為 healthy；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"}]};</script>
