<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="龍騰普高 B3U4 單字選擇互動練習"><title>龍騰普高 B3U4 單字選擇</title><style>:root{--blue:#2563eb;--navy:#1e3a8a;--bg:#f4f7fb;--card:#fff;--line:#dbe3ee;--ink:#172033;--muted:#64748b;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--voice:#6d28d9;--voicebg:#f5f3ff;--amber:#9a3412;--amberbg:#fff7ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}.wrap{max-width:920px;margin:auto;padding:16px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 5px 18px #0f172a0d}.hero{background:linear-gradient(135deg,#e8f1ff,#fff)}h1{margin:0 0 6px;font-size:clamp(25px,4vw,38px)}h2{margin-top:0}.note{color:var(--muted)}.hidden{display:none!important}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.btn{border:0;border-radius:10px;padding:11px 17px;font:800 16px inherit;cursor:pointer;background:#e5e7eb;color:var(--ink);text-decoration:none}.primary{background:var(--blue);color:#fff}.danger{background:#991b1b;color:#fff}.voice{background:var(--voice);color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.btn:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.pick{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin:7px 0;background:#fafcff}.pick input{margin-right:8px;width:17px;height:17px;accent-color:var(--blue)}#list{max-height:440px;overflow:auto;border:1px solid var(--line);padding:7px;border-radius:12px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:800;margin:8px 0 14px}.zh{padding:10px 13px;background:var(--amberbg);border-radius:9px;color:var(--amber);font-weight:800;margin-bottom:10px}.question{font-size:21px;font-weight:750;padding:16px;background:#f8fafc;border-radius:11px;white-space:pre-wrap}.options{display:grid;gap:9px;margin:14px 0}.option{display:flex;align-items:center;gap:11px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-size:18px;font-weight:750;cursor:pointer}.option:hover{border-color:#60a5fa;background:#eff6ff}.option:has(input:checked){border-color:var(--blue);background:#dbeafe;color:var(--navy)}.option input{width:20px;height:20px;accent-color:var(--blue)}.inputs{display:grid;gap:10px;margin:15px 0}.answer-row{display:grid;grid-template-columns:55px 1fr;gap:10px;align-items:center}.answer-row label{font-weight:900;color:var(--navy);text-align:center}.spell{width:100%;font:inherit;font-size:18px;padding:11px;border:2px solid #94a3b8;border-radius:9px}.feedback{padding:13px;border-radius:10px;font-weight:800;margin:13px 0}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.explain{font-weight:500;margin-top:7px}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:var(--voicebg);margin:13px 0}.voicebox b{display:block;font-size:19px;margin-bottom:8px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}.wrong p{margin:6px 0}.source{font-size:13px;color:var(--muted)}@media(max-width:600px){.wrap{padding:9px}.hero,.card{padding:15px}.question{font-size:18px;padding:13px}.option{font-size:17px}.answer-row{grid-template-columns:42px 1fr}.meta{display:block}}</style></head><body><main class="wrap"><section class="hero"><h1>龍騰普高 B3U4 單字選擇</h1><p>共 30 題。可自行選題、隨機抽題；答錯會顯示正確答案並要求重新作答。</p><p class="note">答對後會朗讀完整英文句子；完成後可重做錯題並下載 DOCX 錯題紀錄。</p><div class="toolbar"><a class="btn" href="dashboard.html">← 回測驗總覽</a></div></section><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn">全部選取</button><button id="none" class="btn">全部取消</button><button id="rand20" class="btn">隨機 20 題</button></div><label><input id="shuffle" type="checkbox"> 打亂出題順序</label><div id="list"></div><div class="actions"><button id="start" class="btn primary">開始作答</button><span id="picked" class="note"></span></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="voiceBox" class="voicebox hidden"><b id="voiceTarget"></b><button id="speak" class="btn voice">🔊 再聽一次</button></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="retry" class="btn primary">只重做錯題</button><button id="download" class="btn">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></main><script>const TITLE="龍騰普高 B3U4 單字選擇",MODE="mcq",Q=[{"id":1,"question":"NBA superstar Kobe Bryant is in the Hall of Fame in ____________ of his achievements in basketball.","options":["recognition","transformation","occasion","reception"],"answer":0,"explanation":"NBA巨星Kobe Bryant列入名人堂以認可他在籃球上的成就。 (A)認可 (B)轉變 (C)場合 (D)歡迎","source":"龍騰自命題"},{"id":2,"question":"Being a busy career woman with two young kids, Carol now cherishes the ____________ opportunity to be alone.","options":["inevitable","mournful","occasional","innovative"],"answer":2,"explanation":"身為有兩個年幼小孩的忙碌職業婦女，Carol現在珍惜偶爾能獨處的機會。 (A)不可避免的 (B)悲痛的 (C)偶爾的 (D)創新的","source":"龍騰自命題"},{"id":3,"question":"It was rumored that the prisoner had successfully made a(n) ____________ with the help of an insider.","options":["arrival","escape","reunion","concept"],"answer":1,"explanation":"謠傳這名囚犯有內應的幫助而成功逃脫。 (A)抵達 (B)逃脫 (C)團聚 (D)概念","source":"龍騰自命題"},{"id":4,"question":"The naughty boy was punished for ____________ the poor girl and imitating her way of speaking in public.","options":["mocking","awaiting","escaping","mourning"],"answer":0,"explanation":"這頑皮的男孩因為譏笑這可憐的女孩並公開模仿她說話的方式而被處罰。 (A)譏笑 (B)等待 (C)逃脫 (D)哀悼","source":"龍騰自命題"},{"id":5,"question":"The outbreak of COVID-19 has led to a dramatic ____________ of our daily lives, changing the way our society works and leaving lasting effects.","options":["participation","resemblance","construction","transformation"],"answer":3,"explanation":"新冠肺炎的爆發已經導致我們日常生活劇烈的轉變，改變了我們社會運作的方式並且有持續性的影響。 (A)參與 (B)相似 (C)建造 (D)轉變","source":"龍騰自命題"},{"id":6,"question":"Depending on your personal ____________ and budget, you can choose your favorite restaurant from the list.","options":["resemblance","recognition","reception","preference"],"answer":3,"explanation":"視你個人的偏好和預算而定，你可以從這份名單中選擇你最愛的餐廳。 (A)相似 (B)承認 (C)歡迎 (D)偏愛","source":"龍騰自命題"},{"id":7,"question":"Everyone attending the 20th class ____________ felt excited and chatted happily about funny memories from high school.","options":["occasion","arrival","reunion","reception"],"answer":2,"explanation":"每個參加第二十屆同學會的人都很興奮並且快樂地聊著中學時的有趣回憶。 (A)場合 (B)抵達 (C)團聚 (D)歡迎","source":"龍騰自命題"},{"id":8,"question":"New Year’s Eve is an important ____________ in China, as people living and working far away return home to reunite with their families.","options":["preference","anticipation","occasion","recognition"],"answer":2,"explanation":"在中國，除夕是個重要場合，因為在遠方生活與工作的人會回家與家人團聚。 (A)偏愛 (B)期待 (C)場合 (D)承認","source":"龍騰自命題"},{"id":9,"question":"Emma’s heart has been filled with ____________ and sadness ever since her husband died in the accident.","options":["sorrow","reunion","concept","arrival"],"answer":0,"explanation":"自從Emma的先生在意外事故中過世之後，她內心一直充滿著悲傷和難過。 (A)悲傷 (B)團聚 (C)概念 (D)抵達","source":"龍騰自命題"},{"id":10,"question":"It was reported that the man had hit the old lady and then ____________ without taking her to hospital.","options":["feasted","escaped","awaited","mocked"],"answer":1,"explanation":"據報導這個男子撞了老婦人之後就逃跑，沒有載她去醫院。 (A)盡情享用 (B)逃跑 (C)等待 (D)譏笑","source":"龍騰自命題"},{"id":11,"question":"The life ____________ of a butterfly contains four stages and usually lasts between two weeks and one month.","options":["escape","feast","arrival","cycle"],"answer":3,"explanation":"蝴蝶的生命週期包括四個階段，通常持續兩週到一個月。 (A)逃脫 (B)宴會 (C)抵達 (D)循環","source":"龍騰自命題"},{"id":12,"question":"Every guest at the wedding ____________ was impressed with the bride’s shining diamond ring.","options":["sorrow","cycle","dawn","feast"],"answer":3,"explanation":"婚宴上每位賓客都對新娘的閃亮鑽戒印象深刻。 (A)悲傷 (B)循環 (C)黎明 (D)宴會","source":"龍騰自命題"},{"id":13,"question":"Christmas used to be a ____________ event for my family, but it hasn’t been since the death of my mother.","options":["mournful","furious","joyous","reliable"],"answer":2,"explanation":"聖誕節以前對我家來說是件歡樂的事，但是自從我媽媽過世之後就再也不是了。 (A)悲痛的 (B)憤怒的 (C)歡樂的 (D)可信賴的","source":"龍騰自命題"},{"id":14,"question":"We had better go to bed early because we have to get up at ____________ tomorrow to set off for the airport.","options":["occasion","anticipation","company","dawn"],"answer":3,"explanation":"我們最好早點就寢，因為明天天一亮我們就得起床出發去機場。 (A)場合 (B)預料 (C)陪伴 (D)黎明","source":"龍騰自命題"},{"id":15,"question":"Jenny ____________ on steak and wine in a fancy restaurant to celebrate her birthday.","options":["feasted","mourned","escaped","participated"],"answer":0,"explanation":"Jenny在一家豪華餐廳盡情享用牛排與葡萄酒來慶祝她的生日。 (A)盡情享用 (B)哀悼 (C)逃跑 (D)參加","source":"龍騰自命題"},{"id":16,"question":"You can learn some basic ____________ of physics in this course.","options":["concepts","reunions","occasions","feasts"],"answer":0,"explanation":"你可以在這門課學到一些物理的基本概念。 (A)概念 (B)團聚 (C)場合 (D)宴會","source":"龍騰自命題"},{"id":17,"question":"Water, food, and air are ____________ to the survival of all living things.","options":["mournful","essential","occasional","sorrowful"],"answer":1,"explanation":"水、食物和空氣對所有生物存活而言必不可少。 (A)悲痛的 (B)必要的 (C)偶然的 (D)悲傷的","source":"龍騰自命題"},{"id":18,"question":"The students are busy decorating the hall to give the visitors from their sister school a warm ____________.","options":["reception","preference","reunion","occasion"],"answer":0,"explanation":"學生們正忙著布置禮堂，要給來自姊妹校的訪客熱烈的歡迎。 (A)歡迎 (B)偏愛 (C)團聚 (D)場合","source":"龍騰自命題"},{"id":19,"question":"Given his many achievements in the film industry, Ang Lee has been ____________ as one of the greatest directors ever.","options":["recognized","transformed","accompanied","reunited"],"answer":0,"explanation":"因著在電影業中的許多成就，李安已被認為是史上最偉大的導演之一。 (A)承認 (B)轉變 (C)陪同 (D)重逢","source":"龍騰自命題"},{"id":20,"question":"The presidential candidates are always ____________ by bodyguards whenever they make public appearances.","options":["reunited","accompanied","mourned","anticipated"],"answer":1,"explanation":"每當有公開露面時，總統候選人們總有護衛人員陪同。 (A)重逢 (B)陪同 (C)哀悼 (D)期盼","source":"龍騰自命題"},{"id":21,"question":"With Christmas around the corner, I can’t help but get excited as I ____________ a skiing vacation with my family.","options":["recognize","accompany","participate","anticipate"],"answer":3,"explanation":"耶誕節即將到來，我忍不住期盼與家人一同去滑雪。 (A)承認 (B)陪伴 (C)參加 (D)期盼","source":"龍騰自命題"},{"id":22,"question":"Don’t just act as an outsider as if the case were none of your business; you are directly involved and should ____________ more in the discussion.","options":["escape","recognize","participate","mourn"],"answer":2,"explanation":"別只當個局外人，好像這件事不關你的事一樣；你直接與這件事相關並應該參與討論。 (A)逃跑 (B)承認 (C)參與 (D)哀悼","source":"龍騰自命題"},{"id":23,"question":"Fans of the singer crowded into the lobby of the hotel, waiting for her ____________.","options":["cycle","arrival","reunion","concept"],"answer":1,"explanation":"這位歌手的粉絲把旅館大廳擠得水洩不通，等待她抵達。 (A)循環 (B)抵達 (C)重逢 (D)概念","source":"龍騰自命題"},{"id":24,"question":"Life is not always smooth sailing; difficulties and failures are ____________ parts of it.","options":["joyous","mournful","inevitable","mock"],"answer":2,"explanation":"人生不會總是一帆風順；困難與失敗是人生不可避免的部分。 (A)令人愉快的 (B)悲慟的 (C)不可避免的 (D)虛假的","source":"龍騰自命題"},{"id":25,"question":"Repeated failures and misfortunes didn’t defeat Johnson but instead ____________ him into a man of strong will.","options":["resembled","mocked","transformed","decorated"],"answer":2,"explanation":"一再發生的失敗和不幸並沒有擊垮Johnson，反而是把他變成一位意志堅強的男人。 (A)看起來像 (B)嘲弄 (C)轉變 (D)裝飾","source":"龍騰自命題"},{"id":26,"question":"The couple ____________ their new apartment with modern furniture, cozy rugs, and framed photos to create warmth.","options":["resembled","transformed","mocked","decorated"],"answer":3,"explanation":"這對夫婦用現代家具、舒適的地毯和相框裝飾了他們的新公寓，營造出溫馨的氛圍。 (A)看起來像 (B)轉變 (C)嘲弄 (D)裝飾","source":"龍騰自命題"},{"id":27,"question":"Fans and close friends gathered to ____________ the death of the famous dancer who had passed away following a severe heart attack.","options":["mock","mourn","decorate","escape"],"answer":1,"explanation":"粉絲與親密好友前來悼念這位因嚴重心臟病發作而逝世的知名舞者。 (A)嘲弄 (B)哀悼 (C)裝飾 (D)逃跑","source":"龍騰自命題"},{"id":28,"question":"Unlike his twin brother, Mark ____________ outdoor activities like going hiking and camping on weekends.","options":["prefers","feasts","decorates","mourns"],"answer":0,"explanation":"不像他雙胞胎哥哥，Mark偏愛戶外活動，像是週末去健行和露營。 (A)偏愛 (B)盡情享用 (C)裝飾 (D)哀悼","source":"龍騰自命題"},{"id":29,"question":"The school organizes a(n) ____________ science fair where students present their innovative projects and creative experiments.","options":["mournful","inevitable","annual","sorrowful"],"answer":2,"explanation":"學校每年舉辦一次科學博覽會，學生在會議上展示他們的創新專案和創意實驗。 (A)悲慟的 (B)不可避免的 (C)每年的 (D)悲傷的","source":"龍騰自命題"},{"id":30,"question":"Fortunately, the teenage girl has been found and ____________ with her family after a two-week disappearance.","options":["decorated","reunited","escaped","preferred"],"answer":1,"explanation":"幸運地，在失蹤兩週後，這名青少女已經被找到並且和她的家人團聚。 (A)裝飾 (B)團聚 (C)逃跑 (D)偏愛","source":"龍騰自命題"}];const $=s=>document.querySelector(s),list=$('#list'),select=$('#select'),quiz=$('#quiz'),result=$('#result'),question=$('#question'),answerArea=$('#answerArea'),feedback=$('#feedback'),next=$('#next');let chosen=[],idx=0,mode='first';const wrong=new Map(),correct=new Set();const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ');const shuffled=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function renderList(){list.innerHTML=Q.map(q=>'<label class="pick"><input class="pickbox" type="checkbox" value="'+q.id+'" checked><b>第 '+q.id+' 題</b> <span class="source">'+esc(q.source||'')+'</span></label>').join('');count()}function count(){$('#picked').textContent='已選 '+document.querySelectorAll('.pickbox:checked').length+' 題'}list.addEventListener('change',count);$('#all').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=true);count()};$('#none').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=false);count()};$('#rand20').onclick=()=>{let ids=new Set(shuffled(Q).slice(0,Math.min(20,Q.length)).map(q=>q.id));document.querySelectorAll('.pickbox').forEach(x=>x.checked=ids.has(+x.value));count()};$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));if($('#shuffle').checked)chosen=shuffled(chosen);idx=0;mode='first';wrong.clear();correct.clear();select.classList.add('hidden');result.classList.add('hidden');quiz.classList.remove('hidden');show()};function show(){const q=chosen[idx];speechSynthesis?.cancel();$('#meta').textContent=(mode==='retry'?'錯題重做｜':'')+'第 '+(idx+1)+' / '+chosen.length+' 題';$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';$('#bar').style.width=(idx+1)/chosen.length*100+'%';question.textContent=q.question;const zh=$('#zh');if(q.zh){zh.textContent=q.zh;zh.classList.remove('hidden')}else zh.classList.add('hidden');feedback.className='feedback hidden';$('#voiceBox').classList.add('hidden');$('#check').classList.remove('hidden');next.classList.add('hidden');if(MODE==='mcq')answerArea.innerHTML='<div class="options">'+q.options.map((o,i)=>'<label class="option"><input type="radio" name="answer" value="'+i+'"><b>'+String.fromCharCode(65+i)+'.</b> '+esc(o)+'</label>').join('')+'</div>';else answerArea.innerHTML='<div class="inputs">'+q.answers.map((_,i)=>'<div class="answer-row"><label>'+(MODE==='multi'?['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'][i]:'答案')+'</label><input class="spell" autocomplete="off" spellcheck="false" placeholder="請輸入完整答案"></div>').join('')+'</div>';setTimeout(()=>answerArea.querySelector('input')?.focus(),0)}function currentAnswers(){if(MODE==='mcq'){const x=answerArea.querySelector('input:checked');return x?[+x.value]:[]}return [...answerArea.querySelectorAll('.spell')].map(x=>x.value)}function correctText(q){return MODE==='mcq'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.answers.map(a=>a.split('||')[0]).join(' / ')}function isCorrect(q,a){return MODE==='mcq'?a[0]===q.answer:a.every((x,i)=>q.answers[i].split(/\|\||\//).some(v=>norm(x)===norm(v)))}function completedSentence(q){if(MODE==='mcq')return q.question.replace(/_{3,}/,q.options[q.answer]);if(MODE==='spell')return q.question.replace(/[A-Za-z]?_{3,}[A-Za-z]?/,q.answers[0].split('||')[0]);let s=q.question,marks=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];q.answers.forEach((a,i)=>{let value=a.split('||')[0];let re=new RegExp(marks[i]+'[A-Za-z]?_{3,}[A-Za-z]?');if(re.test(s))s=s.replace(re,value);else s=s.replace(/_{3,}/,value)});return s.replace(/[①-⑩]/g,'')}function speak(){if(!speechSynthesis)return
