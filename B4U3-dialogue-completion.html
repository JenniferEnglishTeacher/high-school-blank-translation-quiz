const TITLE="翰林 Book 4 Unit 3 第三大題 對話與完成句子",KIND="mcq",Q=[{"id":1,"stem":"(   ) Liz: My eyes are getting weaker. 　　　  Dad: You need to see an eye doctor.  Maybe he’ll ask you to wear a new pair.  Liz: Oh no!  Not again.  I need to do something to protect my eyes.","options":["I need to fight for them.","Can you help me to improve my poor eyes?","I can’t see everything clearly.","Can you let me watch TV for two more hours?"],"answer":2,"explanation":"Liz　覺得眼睛漸漸變得更衰弱了。「無法清楚地看見每樣東西了。」爸爸表示需要去看眼科醫生然後配戴一副新眼鏡了。"},{"id":2,"stem":"(   ) Dad: Why are you still watching TV in the living room?  Isn’t it time for you to study?  Mia:","options":["Can’t time go slower?  I can do something fun with you.","Can’t time go faster?  I can go to bed earlier tonight.","Mom just let me do my favorite thing for one hour because I did very well in school today.","You treat me better than Mom does, right?"],"answer":2,"explanation":"爸爸看到　Mia　沒去讀書還在看電視，原來「今天　Mia　在學校表現很好，她媽媽剛剛讓她可做喜愛的事一小時。」(Ａ)(Ｂ)「時間不會走得更慢或者更快。」"},{"id":3,"stem":"(   ) Sara: All these grapes taste sweet.  Did you buy them at the market?  Lisa:：","options":["No, I had my husband check them for me.","No, I picked them on Happy Farm.","Yes, I enjoyed growing vegetables on my own.","Yes, let’s get some more from the farm."],"answer":1,"explanation":"Lisa　不是在市場購買那些甜葡萄。「她是在　Happy　農場採摘它們的。」"},{"id":4,"stem":"(   ) Amy: I hate summer.  　　　  Meg: But the rain stops in a short time, and then it won’t be that hot in the evening.","options":["It usually rains heavily in the afternoon.","It seldom keeps raining cats and dogs.","There’s less rain in summer than in winter.","Summer has the least rain of the year."],"answer":0,"explanation":"Amy　討厭「夏天的午後通常會下大雨」，但　Meg　則認為「雨很快就停，然後晚上天氣就不會那麼炎熱了。」"},{"id":5,"stem":"(   ) Roy: Who swims faster than you?  Bob:","options":["Sean.  He’s poor at swimming.","Andy.  He swims the fastest of all.","Pete.  He swims less slowly than you.","Josh.  He swims as fast as me."],"answer":1,"explanation":"Andy　游泳比　Bob　更快，「他是所有人中游泳游得最快。」"},{"id":6,"stem":"(   ) Gina: Luke, come take a look at my hens.  Luck: Your hens?  Gina: Yes.  Fun Farm provides the service of raising the hens for you.  Luke: Wow.","options":["What a special service from the farm!","Ducks or geese swim much better than hens.","I never have a chance to get eggs from your hens.","You can’t do anything without paying money."],"answer":0,"explanation":"Fun　農場提供幫人飼養母雞的服務，Luke　頗感驚嘆，直誇「真是農場的特別服務啊！」"},{"id":7,"stem":"(   ) The Lin family’s house is small and dirty, and 　　　.","options":["they hate to live happily in a large clean house","they live a hard life","luckily, they won’t make any change","they don’t have a chance to live in it"],"answer":1,"explanation":"Lin　家的房子又小又髒，而「他們過著辛苦的生活」。"},{"id":8,"stem":"(   ) Jim: How come everyone in the office likes your boss, Mr. Lu, so much?  Leo:","options":["He never shares anything good with us.","He treats us well, like his family.","He can live better without us.","He usually makes us work over fifteen hours a day."],"answer":1,"explanation":"Lu　老闆受辦公室每個員工的愛戴，因為「他善待他們，如同家人一般。」"},{"id":9,"stem":"(   ) Ken: Do you help do any housework?（家事）  Meg: Sure.","options":["My mom has me water the plants every three days.","My mom gets me to get up earlier than she does.","My dad helps me to get everything ready before I go to school.","My dad lets me go to bed later on weekends."],"answer":0,"explanation":"Meg　當然幫忙做家事，故選「她媽媽叫她每三天把植物澆水一下。」"},{"id":10,"stem":"(   ) Roger: What does your mom have you do after dinner?  David: 　　　  Can’t she just give me a break?","options":["She has me study, study, and study all night.","She has me help take out the trash.","That’s not like her.  I just stay away from her.","She has me do nothing but get heavier and heavier."],"answer":0,"explanation":"晚餐後「David　的媽媽叫他整晚讀書、讀書、再讀書。」David　才會希望「她不能饒了他嗎？」"},{"id":11,"stem":"(   ) Let’s just eat dinner at home because 　　　.","options":["it’s heavily raining all night","I cook the worst of all","I eat the slowest in the family","I enjoy cooking on my own the least"],"answer":0,"explanation":"讓我們就在家裡吃晚餐因為「整晚一直在下大雨」。"},{"id":12,"stem":"(   ) We can work better without our boss.","options":["Let’s take him down.","Let’s not tell him.","Let’s share everything with him.","Let’s go pick him up at the train station."],"answer":0,"explanation":"沒有老闆我們能工作得更好。「我們使他垮臺吧。」"},{"id":13,"stem":"(   ) Drive less often, and 　　　.  It’ll help our earth.","options":["every day can’t be Earth Day","sell your car quickly","ride your bike more often","try to go to any place by taxi"],"answer":2,"explanation":"少開車，「要更常騎腳踏車」。"},{"id":14,"stem":"(   ) Jeff wants to eat the cake very much.","options":["He has a worse appetite than any other boy in his family.","He’s hungrily looking at the cake.","He can’t eat it because he’s full.","He’s an early bird, and he never eats anything sweet."],"answer":1,"explanation":"Jeff　很想吃那蛋糕。「他正飢餓似地看著蛋糕。」"},{"id":15,"stem":"(   ) 　　　 on your way to school, Jack.","options":["Ride your bike carefully","Eating your breakfast slowly","To keep running fast","Getting nervous about it"],"answer":0,"explanation":"上學途中「要小心騎單車」。要以原形動詞為首的祈使句句型作答。"},{"id":16,"stem":"(   ) Grandma is an early bird; 　　　.","options":["she never gets up early","she gets up at about 5:30 a.m. every day","she enjoys getting up the latest in the family","she gets up late Monday through Friday"],"answer":1,"explanation":"奶奶是個早起的人；「她每天大約早上　5：30　起床」。"},{"id":17,"stem":"(   ) The students do not make any sound when they study at the library.","options":["They don’t study hard.","They study quietly.","They can’t study without any music.","When they have any questions, they can talk loudly about them together."],"answer":1,"explanation":"在圖書館讀書時沒發出任何聲音。即「他們靜靜地讀書。」"},{"id":18,"stem":"(   ) Jim: I like my mom to pick me up after school.  Dan: 　　　  Jim: That’s true.","options":["She drives most carefully in your family, right?","She drives less carefully than my dad.","She’s a slower driver than you and me.","She likes picking up her kids the least."],"answer":0,"explanation":"Jim　喜歡他媽媽放學後接載他。「她是他家中開車最小心。」"},{"id":19,"stem":"(   ) Leo: Why are you crying?  Meg: I want to go out with Jay, but 　　　.  Leo: You’re really too young.  You need to listen to Mom.","options":["Mom won’t let me","Mom won’t call him up","Mom can’t take me there","Mom can’t help me"],"answer":0,"explanation":"Meg　想和　Jay　出去約會，但「媽媽將不讓她（出去約會）」。Leo　安慰她「妳年紀真的還小。必須聽媽媽的話。」"},{"id":20,"stem":"(   ) Emily is poor at singing; 　　　.","options":["she has a wonderful voice","singing is her life","she sings terribly","she is always the number one in singing contests"],"answer":2,"explanation":"Emily　不太會唱歌；「她唱得很糟」。"},{"id":21,"stem":"(   ) Mr. Wang is a good pet owner.","options":["He treats his pet dog well.","He seldom takes his pet dog for a walk.","He tries his best to live his life happily without his pet dog.","He provides bad services for his pet dog."],"answer":0,"explanation":"Wang　先生是個不錯的寵物主人。「他好好地對待他的寵物狗。」"},{"id":22,"stem":"(   ) Mrs. Lee: How does your son swim?  Mrs. Lin:","options":["Yes, he swims fast.","No, he swims slowly.","He swims poorly.  He still needs a lot more practice.","Isn’t he the best swimmer in your family?"],"answer":2,"explanation":"Lin　太太的兒子游泳游得很差，仍然需要更多的練習。"},{"id":23,"stem":"(   ) Anna: Why don’t you like Jay’s music?  Pete:","options":["He needs to sing as often as he can.","His voice is too sweet.","He sings terribly.  You can’t find anyone with a worse voice.","He’s so good at singing."],"answer":2,"explanation":"Pete　不喜歡　Jay　的音樂，因為「他唱得很糟。找不到任何比他聲音更差的人了。」"},{"id":24,"stem":"(   ) Let’s not shout so loudly at the restaurant.","options":["Don’t you have something to drink?","All the other people are looking at us.","We need to talk as loudly as we can.","We need to practice singing often."],"answer":1,"explanation":"我們不要在餐廳大聲喊叫。「所有其他的人都在看著我們呢。」"},{"id":25,"stem":"(   ) Ben: Too bad!  Our team is running more slowly than the others.  We are far behind.  Meg: Now it’s Leo’s turn.  　　　  Maybe he’ll make a difference（不同）.","options":["He runs fastest at our school.","He’s good at the long jump.","He’ll never do a better job than everyone else.","Let’s wait for him at the coffee shop."],"answer":0,"explanation":"Ben　與　Meg　的隊跑得比其他隊更慢，遙遙落後。Meg　認為現在輪到　Leo　了。「他在我們學校跑最快。」也許他會有所改觀。(Ｂ)　the long jump：跳遠。"},{"id":26,"stem":"(   ) Jill: Who works most quickly of all the workers?  Lisa:","options":["Jason is.  He’s the quickest worker of all.","Peter does.  He works more quickly than all the other workers.","Who else?  I work the slowest of all the workers.","David does, so he needs to work longer than any other worker to finish his work."],"answer":1,"explanation":"問句一般動詞現在式，簡答句須利用助動詞現在式，(Ｄ)　David　工作最快，他完成工作應該不致於比任何其他工人工時更長。"},{"id":27,"stem":"(   ) Amy: I’ll ask my dad to drive less often.  Bob: Why?  Amy:","options":["This way, he saves more water.","Everyone needs to do something to help our earth.","He can try to take a plane or a ship.","He can teach me to ride a bike better."],"answer":1,"explanation":"Amy　將要求她爸爸少開車「因為每個人都必須做點事來幫助我們的地球。」"},{"id":28,"stem":"(   ) Our teacher, Ms. Chen, 　　　.","options":["let us play basketball in PE class this morning","make us read English to her","helped me to stand at the back of the classroom","never tell stories to us"],"answer":0,"explanation":"主詞是第三人稱單數，若是「現在簡單式」須接單數動詞。(Ｃ)不合乎常情，應把　helped　改成　asked　或　told　等動詞。"},{"id":29,"stem":"(   ) It’s a wise thing to do 　　　.","options":["to treat your friends badly","to take a break day and night","to save as much water as we can","to work over eighteen hours a day"],"answer":2,"explanation":"「盡我們所能多省水」是明智之舉。"},{"id":30,"stem":"(   ) Our team is running 　　　.  We are far behind.","options":["much faster than any others","the fastest of all","a lot slower than all the others","to the finish line（終點線）earlier than the others"],"answer":2,"explanation":"我們的隊跑得「比所有其他隊慢很多」。我們遙遙落後呢。"},{"id":31,"stem":"(   ) Lucy: Who did the best in the high jump in our class today?  Beth:","options":["Didn’t you jump the least high today?","Cathy jumped the farthest of all.","No one else in our class jumped higher than Susan.","Sorry, I jumped the least high in our class today."],"answer":2,"explanation":"「Beth　和　Lucy　班上沒有其他人跳高跳得比　Susan　高。」即「今天　Susan　是她們班上跳高表現最好的。」"},{"id":32,"stem":"(   ) Everyone in my family needs to help with some housework（家事）, so my mom 　　　.","options":["lets me fix the problem for her","has me do the dishes after dinner","makes me take a bath before dinner","helps me clean up my bedroom once a week"],"answer":1,"explanation":"我家中每個人都需要幫忙家事，所以我媽媽「叫我晚餐後洗碗盤」。"},{"id":33,"stem":"(   ) Max: Dad, where’s Mom?  I did not see her for at least two days. 　　　  Dad: I know.  I know.  Let’s try our best to ask her to come back home.  I’m the one to say sorry to her.","options":["We can’t live a better life without her.","She works the least hard in our family.","You make her work six hours a day, Monday through Friday.","She works more slowly and carefully than you do."],"answer":0,"explanation":"Max　告訴他爸爸「沒有媽媽他們無法過更好的日子。」爸爸承認並表示會去向他媽媽說抱歉求她回家來。"},{"id":34,"stem":"(   ) To win（贏）the race（賽跑）, 　　　.","options":["I’m feeling a lot worse","so everyone is practicing hard","we need to practice harder","you need to shout loudly"],"answer":2,"explanation":"To V... 表「目的」，其後須接「主詞＋動詞…」且符合語意的選項。"},{"id":35,"stem":"(   ) Roy: Who treats you better at home, your dad or your mom?  Zoe:","options":["My sister treats me best in the family.","Everyone in my family treats each other well.","My brother treats me the worst of all.","My mom treats me well, but my dad treats me even better."],"answer":3,"explanation":"Zoe　以「她媽媽對待她不錯，但是她爸爸對待她甚至還要更好。」回應　Roy　的問句。"},{"id":36,"stem":"(   ) The mean boss made his workers 　　　.","options":["check his web page for fun","provide slow services","work late about three to five days a week","stop to work eight hours a day"],"answer":2,"explanation":"刻薄的老闆叫他的員工「一星期三到五天工作到很晚」。"},{"id":37,"stem":"(   ) Ted likes to play alone.","options":["He can’t play better without his friends.","His mom is going to take him down.","He fights for his rights in a different way.","He loves to share his toys with others the least."],"answer":3,"explanation":"Ted　喜歡獨自一人玩。「他最不喜歡和別人分享他的玩具。」"},{"id":38,"stem":"(   ) Tina dances more poorly than her two sisters.","options":["Tina dances the least beautifully of the three.","Tina has the least money to use for the dancing lessons of the three.","Tina is the last one to dance terribly of the three.","Tina can’t dance well, but she sings better than her two sisters."],"answer":0,"explanation":"Tina　跳舞跳得比她兩個姐姐差。「她是三人中跳舞跳得最不美妙。」"},{"id":39,"stem":"(   ) Some people choose to drink coffee; 　　　.","options":["they hate the smell of coffee","the other people might drink tea","the others won’t drink tea or coffee","others may like to have tea"],"answer":3,"explanation":"Some people...; others (＝other people) ..., 即「一些人…；其餘的人…」。"},{"id":40,"stem":"(   ) Mia: Jay, be more friendly to your little brother. 　　　 Jay: All right.  I’ll be a good brother.","options":["Why not take him down?","Can’t you keep being mean to him?","Stop to treat him as badly as you can.","Why don’t you share your toys with him?"],"answer":3,"explanation":"Jay　當好哥哥的話，就是「願和他的弟弟分享玩具。」"},{"id":41,"stem":"(   ) Ted: Our mean boss, Mr. Chen, treats us badly.  What can we do?  Ben: Taking him down is one way, but why don’t we report him to the Labor Department? 　　　  Ted: Great!  Let’s try Ben’s idea for now.","options":["Let’s fight for our rights on our own.","They won’t provide free services.","We’ll need some money for that.","They’ll have him make a change and improve our lives."],"answer":3,"explanation":"要把惡老闆報到勞工局，「他們會叫他做個改變並改善我們的生活。」"}];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=s=>String(s??'').trim().toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:()“”"]/g,'').replace(/\s+/g,' ');
let chosen=[],idx=0;const wrong=new Map(),attempted=new Set(),correct=new Set();
function preview(q){return KIND==='mcq'?q.stem:q.prompt}
function renderList(){$('#list').innerHTML=Q.map(q=>`<label class="pick"><input class="pickbox" type="checkbox" value="${q.id}" checked><span><b>第 ${q.id} 題</b><small>${esc(preview(q))}</small></span></label>`).join('')}
function setAll(v){document.querySelectorAll('.pickbox').forEach(x=>x.checked=v)}
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
$('#all').onclick=()=>setAll(true);$('#none').onclick=()=>setAll(false);$('#random').onclick=()=>{setAll(false);const ids=new Set(shuffled(Q).slice(0,20).map(q=>q.id));document.querySelectorAll('.pickbox').forEach(x=>x.checked=ids.has(+x.value))};
$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));idx=0;wrong.clear();attempted.clear();correct.clear();$('#select').classList.add('hidden');$('#result').classList.add('hidden');$('#quiz').classList.remove('hidden');show()};
function show(){if(window.speechSynthesis)speechSynthesis.cancel();const q=chosen[idx];$('#meta').textContent=`第 ${idx+1} / ${chosen.length} 題｜原題 ${q.id}`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=`${idx/chosen.length*100}%`;$('#stem').textContent=KIND==='mcq'?q.stem:q.prompt;const pic=$('#picture');if(q.image){pic.src=q.image;pic.classList.remove('hidden')}else{pic.classList.add('hidden');pic.removeAttribute('src')};if(KIND==='mcq'){$('#area').className='options';$('#area').innerHTML=q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b><span>${esc(o)}</span></label>`).join('')}else{$('#area').className='answer-grid';$('#area').innerHTML=q.answers.map((a,i)=>`<div class="answer-row"><label>空格 ${i+1}</label><input class="answer-input" data-i="${i}" autocomplete="off" spellcheck="false" placeholder="請輸入答案"></div>`).join('')};$('#feedback').className='feedback hidden';$('#voicebox').classList.add('hidden');$('#check').classList.remove('hidden');$('#next').classList.add('hidden')}
function remember(q,value){if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(value);$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
function spoken(q){if(KIND==='mcq')return q.stem+' '+q.options[q.answer];return q.answers.map(a=>a.accepted[0]).join(' ')}
function speak(){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(spoken(chosen[idx]));u.lang='en-US';u.rate=.88;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/^en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;speechSynthesis.speak(u)}
function success(q){correct.add(q.id);$('#bar').style.width=`${(idx+1)/chosen.length*100}%`;$('#feedback').className='feedback ok';$('#feedback').innerHTML='✅ 全部正確！<br>'+esc(q.explanation||'');$('#target').textContent=spoken(q);$('#voicebox').classList.remove('hidden');$('#check').classList.add('hidden');$('#next').classList.remove('hidden');speak()}
$('#check').onclick=()=>{const q=chosen[idx];attempted.add(q.id);if(KIND==='mcq'){const sel=document.querySelector('input[name=answer]:checked');if(!sel)return alert('請先選擇答案。');const n=+sel.value;if(n===q.answer)return success(q);remember(q,String.fromCharCode(65+n)+'. '+q.options[n]);$('#feedback').className='feedback bad';$('#feedback').innerHTML=`❌ 答錯了。正確答案：<strong>${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</strong><br>${esc(q.explanation||'')}<br>請重新選擇正確答案。`;return}const ins=[...document.querySelectorAll('.answer-input')];if(ins.some(x=>!x.value.trim()))return alert('請完成所有答案。');const bad=[];ins.forEach((input,i)=>{const a=q.answers[i];input.classList.remove('ok','bad');if(a.accepted.some(x=>norm(x)===norm(input.value))){input.classList.add('ok');input.disabled=true}else{input.classList.add('bad');bad.push(`${i+1}. ${input.value} → ${a.display}`);input.value=''}});if(!bad.length)return success(q);remember(q,bad.join('；'));$('#feedback').className='feedback bad';$('#feedback').innerHTML=`❌ 有 ${bad.length} 格不正確。<br>正確答案：${q.answers.map((a,i)=>`${i+1}. <strong>${esc(a.display)}</strong>`).join('；')}<br>${esc(q.explanation||'')}<br>請依提示重新填寫。`;ins.find(x=>!x.disabled)?.focus()};
$('#speak').onclick=speak;$('#next').onclick=()=>{idx++;idx>=chosen.length?finish():show()};$('#finish').onclick=finish;
function answerText(q){return KIND==='mcq'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.answerRaw}
function finish(){if(window.speechSynthesis)speechSynthesis.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');$('#summary').innerHTML=`<div class="stat">選擇題數<b>${chosen.length}</b></div><div class="stat">已作答<b>${attempted.size}</b></div><div class="stat">完成答對<b>${correct.size}</b></div><div class="stat">曾答錯<b>${wrong.size}</b></div>`;$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>`<div class="wrong"><b>${i+1}. 原題 ${r.q.id}｜${esc(preview(r.q))}</b><p>錯誤紀錄：${r.attempts.map(esc).join('<br>')}</p><p><strong>正確答案：</strong>${esc(answerText(r.q))}</p><p>${esc(r.q.explanation||'')}</p></div>`).join(''):'<div class="feedback ok">🎉 沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size)}
$('#restart').onclick=()=>location.reload();$('#download').onclick=async()=>{if(!wrong.size)return;const rows=[...wrong.values()],stamp=new Date().toISOString().slice(0,10),name=TITLE.replace(/\s+/g,'_')+'_錯題_'+stamp;const save=(blob,ext)=>{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name+ext;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};try{const{Document,Packer,Paragraph,TextRun,HeadingLevel}=await import('https://esm.sh/docx@9.5.1');const children=[new Paragraph({heading:HeadingLevel.TITLE,children:[new TextRun({text:TITLE+' 錯題紀錄',bold:true})]})];rows.forEach((r,i)=>{children.push(new Paragraph({heading:HeadingLevel.HEADING_2,children:[new TextRun({text:`${i+1}. 原題 ${r.q.id}`,bold:true})]}),new Paragraph({text:preview(r.q)}),new Paragraph({children:[new TextRun({text:'錯誤紀錄：',bold:true}),new TextRun({text:r.attempts.join(' | ')})]}),new Paragraph({children:[new TextRun({text:'正確答案：',bold:true}),new TextRun({text:answerText(r.q)})]}),new Paragraph({children:[new TextRun({text:'解析：',bold:true}),new TextRun({text:r.q.explanation||''})]}))});save(await Packer.toBlob(new Document({sections:[{children}]})),'.docx')}catch(e){save(new Blob([TITLE+' 錯題紀錄\n\n'+rows.map(r=>preview(r.q)+'\n正確答案：'+answerText(r.q)+'\n').join('\n')],{type:'text/plain;charset=utf-8'}),'.txt')}};
renderList();
</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
