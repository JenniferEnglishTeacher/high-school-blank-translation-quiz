<script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 9｜單字選擇","mode":"mcq","questions":[{"id":1,"question":"It’s said that the chemicals released from the factory are ____________ this river and killing the creatures living in it.","options":["expressing","polluting","contrasting","horrifying"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"據說這家工廠排放出來的化學物質正在汙染這條河流並且殺死生活在河裡的生物。　(A)表達　(B)汙染　(C)對比；對照　(D)使人恐懼；驚嚇","explanationSource":"source"},{"id":2,"question":"Rita can’t remember all the ____________ of the accident because it happened about twenty years ago.","options":["crimes","opinions","details","efforts"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"Rita無法記得那場意外的所有細節，因為它發生在大約二十年前。　(A)犯罪行為　(B)想法；意見　(C)細節　(D)努力；嘗試","explanationSource":"source"},{"id":3,"question":"The wind blew hard and ____________ up the girl’s hair. She might need a comb.","options":["messed","polluted","horrified","tagged"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"風吹得很大，把女孩的頭髮都吹亂了。她可能需要梳子。　(A)弄亂　(B)汙染　(C)使人恐懼　(D)貼標籤","explanationSource":"source"},{"id":4,"question":"When Helen was on her way home, to her ____________, she saw a dead dog lying beside the road.","options":["detail","mess","opinion","horror"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"Helen回家途中，令她恐懼的是路旁她看到一隻死狗躺在那裡。　(A)細節　(B)凌亂　(C)想法　(D)恐懼","explanationSource":"source"},{"id":5,"question":"The police wanted to have a talk with the woman who had been seen running away from the scene of the ____________.","options":["detail","crime","effort","opinion"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"警方想跟那個被看到從犯罪現場逃走的婦人聊一下。　(A)細節　(B)犯罪　(C)努力　(D)意見","explanationSource":"source"},{"id":6,"question":"When the US dropped two atomic bombs on Japan in 1945, people around the world saw the ____________ power of such bombs for the first time.","options":["innocent","destructive","visual","messy"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"當美國於1945年在日本投下兩顆原子彈時，全世界的人們第一次看到此種炸彈的毀滅性力量。　(A)無辜的；純真的　(B)破壞性的；毀滅性的　(C)視覺的　(D)凌亂的；髒亂的","explanationSource":"source"},{"id":7,"question":"Those young men were arrested by the police for having been involved in a number of serious ____________ activities.","options":["criminal","innocent","messy","detailed"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"那些年輕男子因為涉及一些嚴重的犯罪活動被警方逮捕了。　(A)犯罪的　(B)無辜的；純真的　(C)凌亂的；髒亂的　(D)詳細的；細緻的","explanationSource":"source"},{"id":8,"question":"Those who have watched this movie are impressed by the childlike ____________ of the leading character, who is played by a pretty teenage actress.","options":["pollution","destruction","innocence","permission"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"那些已經看過這部電影的人都會對主角那孩子般的純真感到印象深刻，而這個角色是由一個漂亮的少女演員扮演的。　(A)汙染　(B)破壞；毀滅　(C)無辜；純真　(D)許可；准許","explanationSource":"source"},{"id":9,"question":"It ____________ us to see so many people killed or injured when a bomb suddenly exploded at the busy train station.","options":["contrasted","horrified","expressed","associated"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"看到炸彈突然在那忙碌的火車站爆炸時這麼多人喪命或受傷，令我們恐懼。　(A)對比；對照　(B)使人恐懼；驚嚇　(C)表達　(D)聯想","explanationSource":"source"},{"id":10,"question":"In Chinese culture, the color red tends to have a strong ____________ with good luck or wealth.","options":["opinion","community","contrast","association"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"在中國文化裡，紅色這個顏色往往會強烈地和好運或財富聯想在一起。　(A)想法；意見　(B)社區　(C)對比；對照　(D)聯想","explanationSource":"source"},{"id":11,"question":"Roger’s parents ____________ him to play video games or watch TV only when he has finished all of his homework.","options":["destroy","associate","permit","horrify"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"只有當Roger已經完成所有的作業時，他的父母才准許他打電動或看電視。　(A)破壞；毀滅　(B)聯想　(C)許可；准許　(D)使人恐懼；驚嚇","explanationSource":"source"},{"id":12,"question":"Stephanie ____________ the artist’s early paintings with his later paintings to see the change in his style.","options":["associated","horrified","destroyed","contrasted"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"Stephanie對比這個藝術家的早期畫作和後期畫作，以了解他風格的變化。　(A)聯想　(B)使人恐懼；驚嚇　(C)破壞；毀滅　(D)對比；對照","explanationSource":"source"},{"id":13,"question":"Hannah always encourages her students to take part in discussions and ____________ their own ideas clearly.","options":["pollute","permit","express","horrify"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"Hannah總是鼓勵她的學生參與討論並且清楚地表達自己的想法。　(A)汙染　(B)許可；准許　(C)表達　(D)使人恐懼；驚嚇","explanationSource":"source"},{"id":14,"question":"On seeing how ____________ her son’s room was, Maria got very angry and asked him to clean it up at once.","options":["detailed","messy","innocent","violent"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"一看到她兒子的房間有多麼凌亂，Maria非常生氣，並且要求他馬上清理乾淨。　(A)詳細的；細緻的　(B)凌亂的；髒亂的　(C)無辜的；純真的　(D)暴力的","explanationSource":"source"},{"id":15,"question":"A long, cruel war finally led to the total ____________ of this ancient city.","options":["association","expression","destruction","permission"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"一場長期、殘酷的戰爭最終造成這座古代城市的完全毀滅。　(A)聯想　(B)表達　(C)破壞；毀滅　(D)許可；准許","explanationSource":"source"},{"id":16,"question":"Due to air ____________ in this city, many people have to wear masks when going outside.","options":["pollution","contrast","expression","violence"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"由於這個城市的空氣汙染，許多人外出時必須戴上口罩。　(A)汙染　(B)對比；對照　(C)表達　(D)暴力","explanationSource":"source"},{"id":17,"question":"It seems that the amount of domestic ____________ against women and children is on the rise in some places.","options":["innocence","pollution","destruction","violence"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"在某些地方，對於女性和兒童的家暴數量似乎在增加當中。　(A)無辜；純真　(B)汙染　(C)破壞；毀滅　(D)暴力","explanationSource":"source"},{"id":18,"question":"Wars are ____________, so we should try our best to prevent them.","options":["horrible","detailed","innocent","visual"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"戰爭是可怕的，因此我們應該盡全力防止戰爭。　(A)可怕的；令人害怕的　(B)詳細的；細緻的　(C)無辜的；純真的　(D)視覺的","explanationSource":"source"},{"id":19,"question":"This store makes a great ____________ to satisfy every customer’s wishes.","options":["contrast","innocence","effort","horror"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"這家商店耗九牛二虎之力來滿足每一位顧客的願望。　(A)對比　(B)天真；無辜　(C)努力　(D)可怕","explanationSource":"source"},{"id":20,"question":"As an artist, he is good at turning his ideas into ____________ images.","options":["messy","horrible","detailed","visual"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"身為藝術家，他擅長於將想法化為視覺的影像。　(A)混亂的　(B)可怕的　(C)詳細的　(D)視覺的","explanationSource":"source"},{"id":21,"question":"The twin sisters do not look identical. It is easy to tell them apart. The ____________ between their faces is very obvious.","options":["effort","crime","contrast","square"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"這對雙胞胎姊妹看起來並不像。要分辨她們很簡單。她們臉對比起來很明顯。　(A)努力　(B)犯罪　(C)對比　(D)正方形","explanationSource":"source"},{"id":22,"question":"Who, in your ____________, is the greatest NBA basketball player?","options":["opinion","horror","sketch","detail"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"依你所見，誰是最厲害的NBA籃球選手？　(A)意見　(B)恐懼　(C)素描　(D)細節","explanationSource":"source"},{"id":23,"question":"Stop being so rude. For example, “shut up” is not a polite ____________.","options":["opinion","expression","pollution","vision"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"不要用不雅的話。例如，「閉嘴」就不是一個有禮貌的用語。　(A)意見　(B)措辭　(C)污染　(D)視覺","explanationSource":"source"},{"id":24,"question":"The book provides a ____________ description of daily life in ancient China.","options":["detailed","destructive","messy","horrible"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"這本書針對古代中國的日常生活做了詳細描述。　(A)詳細的　(B)破壞的　(C)凌亂的　(D)令人害怕的","explanationSource":"source"},{"id":25,"question":"The Eiffel Tower is the symbol of Paris, so people always ____ it with that city.","options":["destroy","associate","express","calculate"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"艾菲爾鐵塔是巴黎的象徵，所以人們總是把它跟巴黎聯想在一起。　(A)破壞　(B)聯想　(C)表達　(D)計算","explanationSource":"source"},{"id":26,"question":"People in our neighborhood usually meet at the ____________ center for sporting activities, classes on different topics, or social occasions.","options":["expression","scribble","outline","community"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"在我們社區的人們通常會因體育活動、不同主題的課程，或社交場合在這個社區活動中心碰面。　(A)表達　(B)塗鴉　(C)大綱　(D)社區","explanationSource":"source"},{"id":27,"question":"Someone was playing with matches and started a fire that ____________ the building.","options":["permitted","destroyed","associated","contrasted"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"幾年前有人玩火柴，這棟大樓因而毀於大火。　(A)准許　(B)毀壞　(C)聯想　(D)對比","explanationSource":"source"},{"id":28,"question":"No page of this book may be copied without the ____________ of the author.","options":["association","expression","permission","pollution"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"沒有作者允許，這本書任何頁面都不得複製影印。　(A)聯想　(B)表達　(C)允許　(D)汙染","explanationSource":"source"},{"id":29,"question":"The woman swore that she was ____________, saying she had not done anything wrong, but no one believed her.","options":["detailed","innocent","violent","destructive"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"這女人發誓她是清白的，說自己沒做錯任何事，但是沒人相信她。　(A)詳細的　(B)無辜的　(C)暴力的　(D)毀滅性的","explanationSource":"source"},{"id":30,"question":"The more ____________ scenes in the movie had been cut when it was shown on TV.","options":["violent","detailed","innocent","proper"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"當這部影片在電視播放時，裡頭比較暴力的場景已被剪了。　(A)暴力的　(B)詳細的　(C)天真的　(D)適當的","explanationSource":"source"}]};</script><script src="longteng-b1u5-quiz.js?v=20261027-2"></script><script src="longteng-vocab-required-pronunciation.js?v=20261027-2"></script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
