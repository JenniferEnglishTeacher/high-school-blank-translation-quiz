g soccer even in the rain.","options":["dirty","mean","loud","clear"],"answer":0,"explanation":"Rick　甚至在雨中踢了整個下午的足球，現在衣服又溼又「髒」。"},{"id":11,"stem":"(   ) Sea 　　　 move faster than land tortoises（陸龜）.","options":["turtles","mice","goats","geese"],"answer":0,"explanation":"海「龜」比陸龜移動得更快些。"},{"id":12,"stem":"(   ) The 　　　 just laid（生蛋）an egg.  How big it is!","options":["goat","sheep","hen","web"],"answer":2,"explanation":"那「母雞」剛生了一顆蛋。好大顆哦！"},{"id":13,"stem":"(   ) My husband eats more meat but fewer 　　　.  He really needs to make a change for his health.","options":["vegetables","hens","geese","mice"],"answer":0,"explanation":"吃更多的肉類但是更少的「蔬菜」。需要為健康著想做個改變。"},{"id":14,"stem":"(   ) I need to do my homework 　　　, or（否則）my mom won’t let me play computer games for one hour every night.","options":["slowly","terribly","loudly","quickly"],"answer":3,"explanation":"我必須「快快地」做我的功課，否則每晚我媽媽將不讓我玩一小時的電腦遊戲。"},{"id":15,"stem":"(   ) Our boss, Mr. Wu, is mean to us, and he never tries to improve our lives.  Who can help us 　　　 him 　　　?","options":["put; on","take; down","kick; down","take; off"],"answer":1,"explanation":"如何使對待我們很刻薄的　Wu　老闆「垮臺」呢？"},{"id":16,"stem":"(   ) Dad, can you drive us to Uncle Greg’s farm this weekend?  Let’s go 　　　 tomatoes and strawberries.","options":["pick","treat","produce","improve"],"answer":0,"explanation":"要去　Greg　叔叔的農場「採摘」番茄和草莓。"},{"id":17,"stem":"(   ) Amy still feels 　　　 after taking one day off yesterday, so she just decided not to go to work again today.","options":["mean","wise","dirty","weak"],"answer":3,"explanation":"昨天休息一天後，Amy　仍然覺得很「虛弱」，所以她剛剛決定今天又不去上班了。"},{"id":18,"stem":"(   ) What?!  You only drank a bottle of 　　　 juice for breakfast?  Aren’t you as hungry as a bear now?  For your health, don’t just drink fruit juice for breakfast.","options":["grape","vegetable","goose","goat"],"answer":0,"explanation":"「葡萄汁」才是果汁。"},{"id":19,"stem":"(   ) Tina: Can you drive me to the department store near the park later?  Andy: Of course.  No 　　　.","options":["question","appetite","answer","problem"],"answer":3,"explanation":"Andy　以　No problem.（沒問題。）答應開車載　Tina　去公園附近的百貨公司。"},{"id":20,"stem":"(   ) Grace needs to put on her glasses to see everything 　　　.","options":["weakly","loudly","wisely","clearly"],"answer":3,"explanation":"Grace　需要戴上眼鏡以便「清楚地」看見每樣事物。"},{"id":21,"stem":"(   ) Mom: Why don’t you 　　　 the pink phone?  You love everything pink, right?  Sue: But it’s the most expensive of all.","options":["choose","share","agree","bite"],"answer":0,"explanation":"媽媽詢問　Sue　為何不「選擇」粉紅色電話？她不是喜愛每樣粉紅色的東西嗎？"},{"id":22,"stem":"(   ) My dad just spent 　　　 of NT dollars on a house near the museum.  It really cost him an arm and a leg.","options":["millions","thousands","hundreds","tens"],"answer":0,"explanation":"花費新臺幣「數百萬」元買房子，所費不貲。"},{"id":23,"stem":"(   ) Dana is a kind girl.  She likes to 　　　 her toys with her friends.","options":["make","share","treat","pick"],"answer":1,"explanation":"Dana　是一位好心的女孩。她喜歡和她朋友「分享」她的玩具。"},{"id":24,"stem":"(   ) Jill walked 　　　 because she had a bag of eggs in her hand.","options":["fast","quickly","slowly","heavily"],"answer":2,"explanation":"Jill　走得「慢」因為她手中有一袋雞蛋。"},{"id":25,"stem":"(   ) Ted left for his office 　　　 an umbrella, so he got wet when it suddenly rained.","options":["without","over","below","far from"],"answer":0,"explanation":"Ted「沒有」帶傘就前往他的辦公室，所以突然下雨時他溼掉了。"},{"id":26,"stem":"(   ) My good friend, John Smith, is a(n)　　　.  He enjoys eating Taiwanese snacks at the night market so much.","options":["American","guava","goat","sheep"],"answer":0,"explanation":"我的好友　John Smith　是「美國人」。他非常喜愛吃夜市的臺灣點心。"},{"id":27,"stem":"(   ) Please speak 　　　 to those children with hearing problems so that（為了）they can read your lips more easily and understand（瞭解）better.〔99.基測Ⅱ〕","options":["honestly","politely","quietly","slowly"],"answer":3,"explanation":"請「慢慢地」對那些有聽障問題的孩童說話，以便他們能更容易地讀唇語並且暸解得更好些。(Ａ)誠實地(Ｂ)有禮貌地。"},{"id":28,"stem":"(   ) The little girl can’t tell apples from 　　　.  They both are good for visiting someone in hospital.","options":["turtles","pears","mice","geese"],"answer":1,"explanation":"蘋果和「梨子」對於探視住院的人很不錯。"},{"id":29,"stem":"(   ) The cake with 　　　 on it is my daughter’s favorite.  She always eats the red small fruit first before eating the cake.","options":["watermelons","peaches","guavas","strawberries"],"answer":3,"explanation":"上頭有「草莓」的蛋糕是我女兒的最愛。吃蛋糕前她總是先吃那小小紅紅的水果。"},{"id":30,"stem":"(   ) A 　　　 is a round red fruit with a lot of seeds（種子）in it.  People can cook it as a vegetable or just eat it as a kind of fruit.","options":["tomato","grape","peach","pear"],"answer":0,"explanation":"「番茄」是裡面有很多種子的圓圓紅色水果。可當蔬菜煮或者把它當成一種水果來吃。"},{"id":31,"stem":"(   ) Joe: What?!  You spent 　　　 thirty thousand NT dollars on this pink dress.  Isn’t it too expensive?  Liz: That’s right.  I paid thirty thousand five hundred NT dollars for it.  Don’t be mad, please.","options":["below","without","over","less than"],"answer":2,"explanation":"新臺幣　30,500　元，即「超過」新臺幣　30,000　元。"},{"id":32,"stem":"(   ) Jenny, stop singing so 　　　.  How can I listen to you sing and study math well?","options":["carefully","heavily","easily","loudly"],"answer":3,"explanation":"不要這麼「大聲地」唱歌。"},{"id":33,"stem":"(   ) Please send postcards to me when you are on your trip so I can 　　　 the fun with you.〔111.會考補考〕","options":["bring","miss","share","show"],"answer":2,"explanation":"你去旅行時寄明信片給我，這樣我能和你「分享」旅遊的樂趣，故選(Ｃ)。(Ａ)帶來(Ｂ)想念(Ｄ)展示。"},{"id":34,"stem":"(   ) I won’t go to the new restaurant on the corner again because its 　　　 is really too slow.","options":["web page","mouse","service","chance"],"answer":2,"explanation":"我將不再去轉角的那家新餐廳因為它的「服務」真的太慢了。"},{"id":35,"stem":"(   ) 　　　 milk is yummy to drink.  It’s my favorite fruit juice.","options":["Goat","Sheep","Papaya","Bean"],"answer":2,"explanation":"「木瓜」牛奶很好喝。是我最喜愛的果汁。"},{"id":36,"stem":"(   ) Bob: I like the dish very much.  Leo: I see.  You like the chicken with green 　　　.  Bob: Yes, that kind of vegetable is good for health.","options":["pears","beans","grapes","hens"],"answer":1,"explanation":"只有「豆（子）」才是蔬菜。"},{"id":37,"stem":"(   ) The poor kids work for long hours a day, and they don’t even have a 　　　 to go to school.","options":["cent","chance","pound","page"],"answer":1,"explanation":"那些貧窮的孩童一天工作好幾小時，而且他們甚至連上學的「機會」都沒有。"},{"id":38,"stem":"(   ) By doing some exercise every day, Jenny lost about five 　　　 last month.","options":["problems","ducks","pages","pounds"],"answer":3,"explanation":"藉由每天做些運動，上個月　Jenny　減掉大約五「磅」（差不多　2　公斤）。"},{"id":39,"stem":"(   ) Ben wants to work in New York.  What words may he type（輸入） on the computer?","options":["Valentine’s Day in New York","Top 10 American Restaurants in New York","Bus Information in New York","Labor’s Right in New York"],"answer":3,"explanation":"Ben　想在紐約工作，可推知他可能輸入「紐約的勞工權利」，選(Ｄ)。(Ａ)紐約的情人節(Ｂ)紐約十大美式餐廳(Ｃ)紐約公車資訊。"},{"id":40,"stem":"(   ) Jill hates English very much because she never does 　　　 in the subject.","options":["far","high","well","hard"],"answer":2,"explanation":"Jill　非常討厭英文因為她這科目從未表現「好」過。"},{"id":41,"stem":"(   ) What?!  You got a 　　　 egg in math again?  I won’t let you do anything fun for two months.  Go study math well from now on.","options":["goose","bird","hen","chocolate"],"answer":0,"explanation":"get a goose egg：考零分。"},{"id":42,"stem":"(   ) Isn’t it 　　　 to think carefully before you decide to buy the expensive house?","options":["wise","weak","quick","slow"],"answer":0,"explanation":"在你決定要買那棟昂貴的屋子之前仔細思考不是「明智的」嗎？"},{"id":43,"stem":"(   ) No one in our office wants to work for our boss, Mr. Lin.  He is 　　　 and treats his workers badly.","options":["dirty","mean","bitter","wise"],"answer":1,"explanation":"我們辦公室裡沒有人想要為　Lin　老闆工作。他很「刻薄」並且很差地對待員工。"},{"id":44,"stem":"(   ) The Fun Farm helps me raise hens; I can check my hens on their 　　　.","options":["web page","mouse","nest","greenhouse"],"answer":0,"explanation":"在「網頁」上可查看　Fun　農場替我飼養母雞的情況。"},{"id":45,"stem":"(   ) I think the road ends here; it won’t go any 　　　.  Shouldn’t（不應該）we turn back?〔103.會考〕","options":["closer","farther","faster","longer"],"answer":1,"explanation":"我認為這條路只到這裡；它不會再通向「更遠」。我們不應該折返嗎？"},{"id":46,"stem":"(   ) You were 　　　 not to lend Amy money.  She never gives back what she borrows.〔111.會考〕","options":["crazy","helpful","wise","wrong"],"answer":2,"explanation":"句中提到　Amy　不會歸還任何所借的東西，所以不借她錢是「聰明的」，故答案選(Ｃ)。(Ａ)瘋狂的(Ｂ)有幫助的(Ｃ)明智的(Ｄ)錯誤的。"},{"id":47,"stem":"(   ) Sabine walks so 　　　 in the apartment（公寓）that sometimes you don’t even know she’s just passed by（走過）.  You wonder（想知道）if（是否）her feet ever touch（觸碰）the floor.〔106.會考〕","options":["freely","lightly","shyly","slowly"],"answer":1,"explanation":"Sabine　這麼「輕巧地」在公寓裡走路以致於有時候你甚至不自覺她剛走過。你會很想知道她的腳是否碰觸地板。(Ｃ)害羞地。"},{"id":48,"stem":"(   ) It’s time for a break.  Let’s talk 　　　 about the history of Christmas in ten minutes.","options":["fewer","less","farther","further"],"answer":3,"explanation":"是休息時間了。十分鐘後我們「（程度上）更進一步」談論聖誕節的歷史了。(Ｃ)是「（實質上）距離更遠」。"},{"id":49,"stem":"(   ) Mohammad Ali boxed（打拳擊）his way into our hearts（心）and will forever be known as（被視為）　　　, Greatest Of All Time.","options":["DUCK","GOAT","BEAR","LION"],"answer":1,"explanation":"GOAT　是　Greatest Of All Time　的縮寫式，即「史上最佳；史上最偉大」之意。"},{"id":50,"stem":"(   ) Lisa: It’s a long way to go to Taipei by car.  Beth: That’s true.  How about 　　　 the driving?  Lisa: Sounds like a good idea.","options":["treating","sharing","picking","choosing"],"answer":1,"explanation":"share　是「分享」之意，即　Lisa　和　Beth　要「輪流開車」去臺北。"}];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

let chosen=[],idx=0;const wrong=new Map(),attempted=new Set(),correct=new Set();
function preview(q){return KIND==='mcq'?q.stem:q.prompt}
function renderList(){$('#list').innerHTML=Q.map(q=>`<label class="pick"><input class="pickbox" type="checkbox" value="${q.id}" checked><span><b>第 ${q.id} 題</b><small>${esc(preview(q))}</small></span></label>`).join('')}
function setAll(v){document.querySelectorAll('.pickbox').forEach(x=>x.checked=v)}
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
$('#all').onclick=()=>setAll(true);$('#none').onclick=()=>setAll(false);$('#random').onclick=()=>{setAll(false);const ids=new Set(shuffled(Q).slice(0,20).map(q=>q.id));document.querySelectorAll('.pickbox').forEach(x=>x.checked=ids.has(+x.value))};
$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));idx=0;wrong.clear();attempted.clear();correct.clear();$('#select').classList.add('hidden');$('#result').classList.add('hidden');$('#quiz').classList.remove('hidden');show()};
function show(){if(window.speechSynthesis)speechSynthesis.cancel();const q=chosen[idx];$('#meta').textContent=`第 ${idx+1} / ${chosen.length} 題｜原題 ${q.id}`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=`${idx/chosen.length*100}%`;$('#stem').textContent=KIND==='mcq'?q.stem:q.prompt;const pic=$('#picture');if(q.image){pic.src=q.image;pic.classList.remove('hidden')}else{pic.classList.add('hidden');pic.removeAttribute('src')};if(KIND==='mcq'){$('#area').className='options';$('#area').innerHTML=q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b><span>${esc(o)}</span></label>`).join('')}else{$('#area').className='answer-grid';$('#area').innerHTML=q.answers.map((a,i)=>`<div class="answer-row"><label>空格 ${i+1}</label><input class="answer-input" data-i="${i}" autocomplete="off" spellcheck="false" placeholder="請輸入答案"></div>`).join('')};$('#feedback').className='feedback hidden';$('#voicebox').classList.add('hidden');$('#check').classList.remove('hidden');$('#next').classList.add('hidden')}
function remember(q,value){if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(value);$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
function spoken(q){if(KIND==='mcq')return q.stem+' '+q.options[q.answer];return q.answers.map(a=>a.accepted[0]).join(' ')}
function speak(){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(spoken(chosen[idx]));u.lang='en-US';u.rate=.88;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/^en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;speechSynthesis.speak(u)}
function success(q){correct.add(q.id);$('#bar').style.width=`${(idx+1)/chosen.length*100}%`;$('#feedback').className='feedback ok';$('#feedback').innerHTML='✅ 全部正確！<br>'+esc(q.explanation||'');$('#target').textContent=spoken(q);$('#voicebox').classList.remove('hidden');$('#check').classList.add('hidden');$('#next').classList.remove('hidden');speak()}
$('#check').onclick=()=>{const q=chosen[idx];attempted.add(q.id);if(KIND==='mcq'){const sel=document.querySelector('input[name=answer]:checked');if(!sel)return alert('請先選擇答案。');const n=+sel.value;if(n===q.answer)return success(q);remember(q,String.fromCharCode(65+n)+'. '+q.options[n]);$('#feedback').className='feedback bad';$('#feedback').innerHTML=`❌ 答錯了。正確答案：<strong>${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</strong><br>${esc(q.explanation||'')}<br>請重新選擇正確答案。`;return}const ins=[...document.querySelectorAll('.answer-input')];if(ins.some(x=>!x.value.trim()))return alert('請完成所有答案。');const bad=[];ins.forEach((input,i)=>{const a=q.answers[i];input.classList.remove('ok','bad');if(a.accepted.some(x=>norm(x)===norm(input.value))){input.classList.add('ok');input.disabled=true}else{input.classList.add('bad');bad.push(`${i+1}. ${input.value} → ${a.display}`);input.value=''}});if(!bad.length)return success(q);remember(q,bad.join('；'));$('#feedback').className='feedback bad';$('#feedback').innerHTML=`❌ 有 ${bad.length} 格不正確。<br>正確答案：${q.answers.map((a,i)=>`${i+1}. <strong>${esc(a.display)}</strong>`).join('；')}<br>${esc(q.explanation||'')}<br>請依提示重新填寫。`;ins.find(x=>!x.disabled)?.focus()};
$('#speak').onclick=speak;$('#next').onclick=()=>{idx++;idx>=chosen.length?finish():show()};$('#finish').onclick=finish;
function answerText(q){return KIND==='mcq'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.answerRaw}
function finish(){if(window.speechSynthesis)speechSynthesis.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');$('#summary').innerHTML=`<div class="stat">選擇題數<b>${chosen.length}</b></div><div class="stat">已作答<b>${attempted.size}</b></div><div class="stat">完成答對<b>${correct.size}</b></div><div class="stat">曾答錯<b>${wrong.size}</b></div>`;$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>`<div class="wrong"><b>${i+1}. 原題 ${r.q.id}｜${esc(preview(r.q))}</b><p>錯誤紀錄：${r.attempts.map(esc).join('<br>')}</p><p><strong>正確答案：</strong>${esc(answerText(r.q))}</p><p>${esc(r.q.explanation||'')}</p></div>`).join(''):'<div class="feedback ok">🎉 沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size)}
$('#restart').onclick=()=>location.reload();$('#download').onclick=async()=>{if(!wrong.size)return;const rows=[...wrong.values()],stamp=new Date().toISOString().slice(0,10),name=TITLE.replace(/\s+/g,'_')+'_錯題_'+stamp;const save=(blob,ext)=>{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name+ext;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};try{const{Document,Packer,Paragraph,TextRun,HeadingLevel}=await import('https://esm.sh/docx@9.5.1');const children=[new Paragraph({heading:HeadingLevel.TITLE,children:[new TextRun({text:TITLE+' 錯題紀錄',bold:true})]})];rows.forEach((r,i)=>{children.push(new Paragraph({heading:HeadingLevel.HEADING_2,children:[new TextRun({text:`${i+1}. 原題 ${r.q.id}`,bold:true})]}),new Paragraph({text:preview(r.q)}),new Paragraph({children:[new TextRun({text:'錯誤紀錄：',bold:true}),new TextRun({text:r.attempts.join(' | ')})]}),new Paragraph({children:[new TextRun({text:'正確答案：',bold:true}),new TextRun({text:answerText(r.q)})]}),new Paragraph({children:[new TextRun({text:'解析：',bold:true}),new TextRun({text:r.q.explanation||''})]}))});save(await Packer.toBlob(new Document({sections:[{children}]})),'.docx')}catch(e){save(new Blob([TITLE+' 錯題紀錄\n\n'+rows.map(r=>preview(r.q)+'\n正確答案：'+answerText(r.q)+'\n').join('\n')],{type:'text/plain;charset=utf-8'}),'.txt')}};
renderList();
</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
