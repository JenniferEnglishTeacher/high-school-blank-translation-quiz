const QUIZ={"unit":"B3U8","kind":"mcq","title":"文法選擇","count":60,"data":[{"number":1,"prompt":"Out of love, the zookeepers make an effort _____ care of the animals in the zoo.","options":{"A":"take","B":"taking","C":"to taking","D":"to take"},"answer":"D","sentence":"Out of love, the zookeepers make an effort to take care of the animals in the zoo."},{"number":2,"prompt":"Over the years, the charitable foundation _____ the refugees and they hope that more volunteers can join them.","options":{"A":"has been helping","B":"will help","C":"is being helped","D":"had been helping"},"answer":"A","sentence":"Over the years, the charitable foundation has been helping the refugees and they hope that more volunteers can join them."},{"number":3,"prompt":"Ken has been excited to experience _____ Sydney is since he read about it on a magazine.","options":{"A":"which","B":"what","C":"how","D":"when"},"answer":"C","sentence":"Ken has been excited to experience how Sydney is since he read about it on a magazine."},{"number":4,"prompt":"My mom taught me _____ a delicious cake.","options":{"A":"how to bake","B":"how do I bake","C":"how could I bake","D":"could I bake how"},"answer":"A","sentence":"My mom taught me how to bake a delicious cake."},{"number":5,"prompt":"The mail carrier looks tired because he _______ mail since this morning, and there are still a lot of packages left.","options":{"A":"is delivering","B":"has delivered","C":"has been delivering","D":"delivers"},"answer":"C","sentence":"The mail carrier looks tired because he has been delivering mail since this morning, and there are still a lot of packages left."},{"number":6,"prompt":"Mr. Lee teaches his son _____ drive a car.","options":{"A":"what to","B":"how to","C":"which to","D":"who to"},"answer":"B","sentence":"Mr. Lee teaches his son how to drive a car."},{"number":7,"prompt":"It was not easy to find a seat in the bus _____ there were many passengers.","options":{"A":"so","B":"although","C":"that","D":"as"},"answer":"D","sentence":"It was not easy to find a seat in the bus as there were many passengers."},{"number":8,"prompt":"The road is still wet. It must _____ last night.","options":{"A":"rain","B":"be raining","C":"have rained","D":"be to rain"},"answer":"C","sentence":"The road is still wet. It must have rained last night."},{"number":9,"prompt":"The mail carrier looks tired because he _______ mail since this morning, and there are still a lot of packages left.","options":{"A":"is delivering","B":"has delivered","C":"has been delivering","D":"delivers"},"answer":"C","sentence":"The mail carrier looks tired because he has been delivering mail since this morning, and there are still a lot of packages left."},{"number":10,"prompt":"_____ the advance flood warning, people living in lowlying areas could get out in time before their homes were flooded.","options":{"A":"Instead of","B":"Thanks to","C":"Aside from","D":"In spite of"},"answer":"B","sentence":"Thanks to the advance flood warning, people living in lowlying areas could get out in time before their homes were flooded."},{"number":11,"prompt":"Ellie gave a perfect speech yesterday. She _______ it for a long time.","options":{"A":"practice","B":"must practice","C":"practicing","D":"must have practiced"},"answer":"D","sentence":"Ellie gave a perfect speech yesterday. She must have practiced it for a long time."},{"number":12,"prompt":"The sound effects _____ in the movie have amazed the audiences in the movie theater.","options":{"A":"features","B":"featured","C":"featuring","D":"to feature"},"answer":"B","sentence":"The sound effects featured in the movie have amazed the audiences in the movie theater."},{"number":13,"prompt":"The issue of refugees should not be ignored because the number of refugees _______ still on the increase.","options":{"A":"is","B":"are","C":"was","D":"were"},"answer":"A","sentence":"The issue of refugees should not be ignored because the number of refugees is still on the increase."},{"number":14,"prompt":"I do not know _____.","options":{"A":"how do I answer his question","B":"how important is it for me to answer his question","C":"how it is important for me to answer his question","D":"how to answer his question"},"answer":"D","sentence":"I do not know how to answer his question."},{"number":15,"prompt":"Kelly has received so many e-mails from my teacher, but she didn’t know _____ to reply them with the mailing system.","options":{"A":"when","B":"how","C":"what","D":"where"},"answer":"B","sentence":"Kelly has received so many e-mails from my teacher, but she didn’t know how to reply them with the mailing system."},{"number":16,"prompt":"_____ Chris did not prepare for the exam, he failed it.","options":{"A":"Unless","B":"Though","C":"As","D":"If"},"answer":"C","sentence":"As Chris did not prepare for the exam, he failed it."},{"number":17,"prompt":"So far, our company _____ a profit of over one million dollars, and we are looking forward to doubling it by the end of the year.","options":{"A":"is making","B":"had been making","C":"has made","D":"will make"},"answer":"C","sentence":"So far, our company has made a profit of over one million dollars, and we are looking forward to doubling it by the end of the year."},{"number":18,"prompt":"You _____ to check the weather report, otherwise you would have brought an umbrella with you.","options":{"A":"must have forgot","B":"could forget","C":"might have been forgot","D":"must forget"},"answer":"A","sentence":"You must have forgot to check the weather report, otherwise you would have brought an umbrella with you."},{"number":19,"prompt":"Judging from what we have found at the crime scene, the dead victim _____.","options":{"A":"might kill himself","B":"must try to call 119","C":"might have been murdered","D":"must be alive"},"answer":"C","sentence":"Judging from what we have found at the crime scene, the dead victim might have been murdered."},{"number":20,"prompt":"_____ on the bench, completely confused, the tourist tried to locate his position on the map.","options":{"A":"Sat","B":"Sitting","C":"To sit","D":"To be sitting"},"answer":"B","sentence":"Sitting on the bench, completely confused, the tourist tried to locate his position on the map."},{"number":21,"prompt":"Judging from the old picture, we can assume that most people in that era _______ in poverty.","options":{"A":"live","B":"may live","C":"had lived","D":"may have lived"},"answer":"D","sentence":"Judging from the old picture, we can assume that most people in that era may have lived in poverty."},{"number":22,"prompt":"Since Joseph graduated, he _____ with us.","options":{"A":"stays","B":"stayed","C":"is staying","D":"has been staying"},"answer":"D","sentence":"Since Joseph graduated, he has been staying with us."},{"number":23,"prompt":"Ellie gave a perfect speech yesterday. She _______ it for a long time.","options":{"A":"practice","B":"must practice","C":"practicing","D":"must have practiced"},"answer":"D","sentence":"Ellie gave a perfect speech yesterday. She must have practiced it for a long time."},{"number":24,"prompt":"The value of Taiwan's culture and history should be _____ from generation to generation.","options":{"A":"passed on","B":"catered to","C":"forced to","D":"adapted to"},"answer":"A","sentence":"The value of Taiwan's culture and history should be passed on from generation to generation."},{"number":25,"prompt":"I couldn’t reach Sam last night. His smartphone _____ off.","options":{"A":"might have been turned","B":"might be turned","C":"must have turned","D":"must be turned"},"answer":"A","sentence":"I couldn’t reach Sam last night. His smartphone might have been turned off."},{"number":26,"prompt":"Most Taiwanese people _____ about Chien-Ming Wang, whose signature sinker pitch (伸卡球) got him to the MLB.","options":{"A":"should hear","B":"might have heard","C":"must have been heard","D":"may hear"},"answer":"B","sentence":"Most Taiwanese people might have heard about Chien-Ming Wang, whose signature sinker pitch (伸卡球) got him to the MLB."},{"number":27,"prompt":"Students preparing for their exams _____ in the library every day since March.","options":{"A":"were studying","B":"studied","C":"study","D":"have been studying"},"answer":"D","sentence":"Students preparing for their exams have been studying in the library every day since March."},{"number":28,"prompt":"The worrying mother _____ from the police about her missing daughter so far. What she can do is pray for her safety.","options":{"A":"was not hearing","B":"would not hear","C":"hadn’t been heard","D":"hasn’t heard"},"answer":"D","sentence":"The worrying mother hasn’t heard from the police about her missing daughter so far. What she can do is pray for her safety."},{"number":29,"prompt":"Ben looks so tan and content after the vacation; he _____ a good time staying in Green Island.","options":{"A":"can have","B":"must have had","C":"should have had","D":"might have"},"answer":"B","sentence":"Ben looks so tan and content after the vacation; he must have had a good time staying in Green Island."},{"number":30,"prompt":"Jane didn't come to school this morning. She _____ overslept.","options":{"A":"must be","B":"had to","C":"must have","D":"must have been"},"answer":"C","sentence":"Jane didn't come to school this morning. She must have overslept."},{"number":31,"prompt":"_____ by its owner, the old dog still stayed where its owner left him, shaking helplessly.","options":{"A":"To abandon","B":"Abandoned","C":"Abandoning","D":"It was abandoned"},"answer":"B","sentence":"Abandoned by its owner, the old dog still stayed where its owner left him, shaking helplessly."},{"number":32,"prompt":"People can help the children _____ purchase of their handmade cookies.","options":{"A":"to make","B":"in the make","C":"through the make","D":"by making"},"answer":"D","sentence":"People can help the children by making purchase of their handmade cookies."},{"number":33,"prompt":"_____ the price of oil is still rising, people start taking public transportation to save money.","options":{"A":"With","B":"For","C":"As","D":"Although"},"answer":"C","sentence":"As the price of oil is still rising, people start taking public transportation to save money."},{"number":34,"prompt":"I can’t find my smartphone. _____","options":{"A":"It must disappear.","B":"It might be stolen.","C":"I could leave it at home.","D":"I must have put it somewhere."},"answer":"D","sentence":"I can’t find my smartphone. I must have put it somewhere."},{"number":35,"prompt":"Louis cannot find my book. He _____ it.","options":{"A":"must lose","B":"must have lost","C":"must be lost","D":"must be losing"},"answer":"B","sentence":"Louis cannot find my book. He must have lost it."},{"number":36,"prompt":"The college professor has been designing a _____ teaching course. He said that he would start this new course next semester.","options":{"A":"tablet-base","B":"tablet-basing","C":"tablet-based","D":"tablet-to-base"},"answer":"C","sentence":"The college professor has been designing a tablet-based teaching course. He said that he would start this new course next semester."},{"number":37,"prompt":"_____ the latest medical equipment, the hospital is expected to offer better medical care.","options":{"A":"To feature","B":"Featured","C":"Featuring","D":"It features"},"answer":"C","sentence":"Featuring the latest medical equipment, the hospital is expected to offer better medical care."},{"number":38,"prompt":"The issue of refugees should not be ignored because the number of refugees _______ still on the increase.","options":{"A":"is","B":"are","C":"was","D":"were"},"answer":"A","sentence":"The issue of refugees should not be ignored because the number of refugees is still on the increase."},{"number":39,"prompt":"The signature dish _______ on the January recipe cards is really popular. It must be reserved in advance.","options":{"A":"feature","B":"featured","C":"featuring","D":"which features"},"answer":"B","sentence":"The signature dish featured on the January recipe cards is really popular. It must be reserved in advance."},{"number":40,"prompt":"Thinking of what life with her puppy _____ makes Jenny burst into tears.","options":{"A":"was","B":"×","C":"like","D":"was like"},"answer":"D","sentence":"Thinking of what life with her puppy was like makes Jenny burst into tears."},{"number":41,"prompt":"A movie theater offers a temporary escape _____ students to help them relieve their stress from studying.","options":{"A":"in","B":"of","C":"to","D":"with"},"answer":"C","sentence":"A movie theater offers a temporary escape to students to help them relieve their stress from studying."},{"number":42,"prompt":"The boy _____ to his mother because he is now daring not to look at her and is sweating a lot.","options":{"A":"must lie","B":"might lie","C":"might have been lied","D":"must have lied"},"answer":"D","sentence":"The boy must have lied to his mother because he is now daring not to look at her and is sweating a lot."},{"number":43,"prompt":"I want to buy Amy a birthday present, but I’m not sure _____.","options":{"A":"she likes what","B":"what she likes","C":"what does she like","D":"how she likes"},"answer":"B","sentence":"I want to buy Amy a birthday present, but I’m not sure what she likes."},{"number":44,"prompt":"With support and subsidies from the government, the birth rate is _____ the increase in the country.","options":{"A":"on","B":"in","C":"of","D":"with"},"answer":"A","sentence":"With support and subsidies from the government, the birth rate is on the increase in the country."},{"number":45,"prompt":"Sammy noticed dark circles under her manager’s eyes this morning. He _____ up late to prepare for the presentation.","options":{"A":"should have stayed","B":"could stay","C":"must stay","D":"might stay"},"answer":"D","sentence":"Sammy noticed dark circles under her manager’s eyes this morning. He might stay up late to prepare for the presentation."},{"number":46,"prompt":"_____ by “Help Refugees” charity, the Choose Love store in UK encourages buyers to get real gifts for the underprivileged refugees.","options":{"A":"Run","B":"To run","C":"Running","D":"It is run"},"answer":"A","sentence":"Run by “Help Refugees” charity, the Choose Love store in UK encourages buyers to get real gifts for the underprivileged refugees."},{"number":47,"prompt":"The members of the school football team all looked upset and down. They _____ the game.","options":{"A":"should lose","B":"might lose","C":"must have lost","D":"should have lost"},"answer":"C","sentence":"The members of the school football team all looked upset and down. They must have lost the game."},{"number":48,"prompt":"Judging from the old picture, we can assume that most people in that era _______ in poverty.","options":{"A":"live","B":"may live","C":"had lived","D":"may have lived"},"answer":"D","sentence":"Judging from the old picture, we can assume that most people in that era may have lived in poverty."},{"number":49,"prompt":"We _____ to reach Eason for hours, but he didn’t answer any of our calls.","options":{"A":"have been tried","B":"have been trying","C":"was tried","D":"will be trying"},"answer":"B","sentence":"We have been trying to reach Eason for hours, but he didn’t answer any of our calls."},{"number":50,"prompt":"Sean always avoids eating peanut products _____ he does not like them.","options":{"A":"although","B":"as","C":"whereas","D":"while"},"answer":"B","sentence":"Sean always avoids eating peanut products as he does not like them."},{"number":51,"prompt":"_____ since the beginning of the eighteenth century _____ the sandwich has been with us.","options":{"A":"It is; that","B":"That is; that","C":"This is; then","D":"What is; that"},"answer":"A","sentence":"It is since the beginning of the eighteenth century that the sandwich has been with us."},{"number":52,"prompt":"Where are you? I _____ for over an hour at the restaurant.","options":{"A":"was waiting","B":"am waited","C":"have been waiting","D":"had been waited"},"answer":"C","sentence":"Where are you? I have been waiting for over an hour at the restaurant."},{"number":53,"prompt":"My stomach hurts quite badly. I _____ something rotten for dinner.","options":{"A":"should eat","B":"might eat","C":"should have eaten","D":"might have eaten"},"answer":"D","sentence":"My stomach hurts quite badly. I might have eaten something rotten for dinner."},{"number":54,"prompt":"It _____ difficult for David to grow up without his parents, who were killed in a car crash. However, he is now a very great man with his own family.","options":{"A":"must be","B":"might be","C":"must have been","D":"have been"},"answer":"C","sentence":"It must have been difficult for David to grow up without his parents, who were killed in a car crash. However, he is now a very great man with his own family."},{"number":55,"prompt":"The goal of education _____ students learn and think independently.","options":{"A":"is to encourage","B":"will encourage","C":"has encouraged","D":"was encouraged"},"answer":"A","sentence":"The goal of education is to encourage students learn and think independently."},{"number":56,"prompt":"Just imagining _____ a ghost is like makes Rio scared.","options":{"A":"how","B":"what","C":"which","D":"when"},"answer":"B","sentence":"Just imagining what a ghost is like makes Rio scared."},{"number":57,"prompt":"Mary scored very high on all the subjects in this mid-term; she _____ really hard.","options":{"A":"should have studied","B":"must have studied","C":"might be studying","D":"should be studying"},"answer":"B","sentence":"Mary scored very high on all the subjects in this mid-term; she must have studied really hard."},{"number":58,"prompt":"The signature dish _______ on the January recipe cards is really popular. It must be reserved in advance.","options":{"A":"feature","B":"featured","C":"featuring","D":"which features"},"answer":"B","sentence":"The signature dish featured on the January recipe cards is really popular. It must be reserved in advance."},{"number":59,"prompt":"Jack's phone _____ constantly since this morning. Maybe there is something important.","options":{"A":"has been ringing","B":"rang","C":"being ringing","D":"rings"},"answer":"A","sentence":"Jack's phone has been ringing constantly since this morning. Maybe there is something important."},{"number":60,"prompt":"The policy urges employers _____ male and female employees fairly in the workplace.","options":{"A":"treat","B":"treating","C":"to treat","D":"to treating"},"answer":"C","sentence":"The policy urges employers to treat male and female employees fairly in the workplace."}]};const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let flat=[],index=0,wrong=new Map(),attempted=new Set(),firstTry=new Set(),recognition=null;
function flatten(){if(QUIZ.kind==='mcq')return QUIZ.data.map(x=>({...x,id:String(x.number)}));if(QUIZ.kind==='translation')return QUIZ.data.map(x=>({...x,id:String(x.number)}));return QUIZ.data.flatMap(set=>set.answers.map((answer,i)=>({id:`${set.set}-${i+1}`,set:set.set,passage:set.passage,options:set.options,answer,blank:i+1,sentence:set.sentences[i],structure:set.structure})))}
function fillPassage(text,answers,options){let out=text;answers.forEach((a,i)=>{const word=options[a];const n=i+1;const pats=[new RegExp(`__\\(?${n}\\)?__`),new RegExp(`__${n}__`),new RegExp(`　${n}　`),new RegExp(`\\(${n}\\)`)];for(const p of pats){if(p.test(out)){out=out.replace(p,word);break}}});return out.replace(/\n+/g,' ').replace(/\s+/g,' ').trim()}
function markBlank(text,n){const tag=`<span class="blank-now">Blank ${n}</span>`;let out=esc(text),done=false;for(const p of [new RegExp(`__\\(?${n}\\)?__`),new RegExp(`__${n}__`),new RegExp(`　${n}　`),new RegExp(`\\(${n}\\)`)]){if(!done&&p.test(out)){out=out.replace(p,tag);done=true}}return out}
function norm(s){return String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ')}function speak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}
function show(){try{recognition?.abort()}catch(e){}speechSynthesis?.cancel();const q=flat[index];$('#meta').textContent=`第 ${index+1} / ${flat.length} 題`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=((index+1)/flat.length*100)+'%';$('#feedback').className='feedback hidden';$('#reference').classList.add('hidden');$('#voiceBox').classList.add('hidden');$('#next').classList.add('hidden');$('#check').classList.toggle('hidden',QUIZ.kind!=='translation');$('#answerArea').innerHTML='';if(QUIZ.kind==='mcq')renderChoice(q.prompt,q.options);else if(QUIZ.kind==='translation')renderTranslation(q);else{$('#question').innerHTML=`<div class="passage">${markBlank(q.passage,q.blank)}</div>`;renderChoice(`第 ${q.blank} 格`,q.options)}}
function renderChoice(prompt,options){$('#question').innerHTML=QUIZ.kind==='mcq'?`<div class="prompt">${esc(prompt)}</div>`:$('#question').innerHTML;$('#answerArea').innerHTML='<div class="options">'+Object.entries(options).map(([k,v])=>`<button class="option" data-key="${k}"><b>${k}.</b> ${esc(v)}</button>`).join('')+'</div>';document.querySelectorAll('.option').forEach(b=>b.onclick=()=>checkChoice(b.dataset.key,b))}
function renderTranslation(q){let i=0;const rendered=esc(q.prompt).replace(/_{3,}/g,()=>`<input class="inline-input" data-i="${i++}" aria-label="第 ${i} 格答案">`);$('#question').innerHTML=`<div class="translation">${rendered}</div>`;setTimeout(()=>document.querySelector('.inline-input')?.focus(),0)}
function recordWrong(q,value){if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(value);$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
function checkChoice(key,button){const q=flat[index];attempted.add(q.id);if(key!==q.answer){recordWrong(q,key);button.classList.add('wrong');$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 不正確，請再試一次。';return}if(!wrong.has(q.id))firstTry.add(q.id);document.querySelectorAll('.option').forEach(b=>b.disabled=true);button.classList.add('correct');pass(q)}
function checkTranslation(){const q=flat[index],values=[...document.querySelectorAll('.inline-input')].map(x=>x.value);attempted.add(q.id);const ok=values.length===q.answers.length&&values.every((v,i)=>norm(v)===norm(q.answers[i]));if(!ok){recordWrong(q,values.join(' / '));$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 尚有空格不正確，請修正後再檢查。';return}if(!wrong.has(q.id))firstTry.add(q.id);document.querySelectorAll('.inline-input').forEach(x=>x.disabled=true);pass(q)}
function pass(q){$('#feedback').className='feedback ok';$('#feedback').textContent='✅ 正確！';$('#reference').classList.remove('hidden');$('#reference').textContent='完整句：'+q.sentence;$('#check').classList.add('hidden');$('#next').classList.remove('hidden');$('#voiceBox').classList.remove('hidden');$('#voiceTarget').textContent=q.sentence;$('#voiceResult').className='voice-result';$('#voiceResult').textContent='尚未進行朗讀評分。';speak(q.sentence)}
function similarity(a,b){a=norm(a).replace(/[^a-z0-9' ]/g,'').split(' ').filter(Boolean);b=norm(b).replace(/[^a-z0-9' ]/g,'').split(' ').filter(Boolean);const used=new Set;let hit=0;for(const w of a){const j=b.findIndex((x,i)=>x===w&&!used.has(i));if(j>=0){hit++;used.add(j)}}return Math.round(100*hit/Math.max(a.length,b.length,1))}
function startMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('#voiceResult').textContent='此瀏覽器不支援語音辨識，建議使用 Chrome。';return}recognition=new SR;recognition.lang='en-US';recognition.interimResults=false;$('#voiceResult').textContent='正在聆聽，請朗讀完整句子…';recognition.onresult=e=>{const said=e.results[0][0].transcript,target=flat[index].sentence,score=similarity(target,said);$('#voiceResult').className='voice-result '+(score>=80?'good':'retry');$('#voiceResult').textContent=`辨識：${said}\n正確率：${score}%`};recognition.onerror=e=>$('#voiceResult').textContent='語音辨識未完成：'+e.error;recognition.start()}
function finish(){try{recognition?.abort()}catch(e){}speechSynthesis?.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');const rows=[...wrong.values()];$('#summary').innerHTML=`<div class="stat">實際作答<b>${attempted.size}</b></div><div class="stat">一次答對<b>${firstTry.size}</b></div><div class="stat">曾答錯<b>${rows.length}</b></div>`;$('#wrongList').innerHTML=rows.length?rows.map((r,i)=>`<div class="wrong-card"><b>${i+1}. 第 ${esc(r.q.id)} 題</b><p>${esc(r.q.prompt||`第 ${r.q.blank} 格`)}</p><p>作答：${r.attempts.map(esc).join('；')}</p><p>答案：${esc(r.q.answer||r.q.answers.join(' / '))}</p></div>`).join(''):(attempted.size?'<div class="feedback ok">🎉 本輪全部一次答對！</div>':'<p class="muted">本輪尚未作答，因此不登錄成績。</p>');$('#download').classList.toggle('hidden',!rows.length);if(attempted.size)document.dispatchEvent(new CustomEvent('quiz-result-ready',{detail:{total:attempted.size,correct:firstTry.size,wrong:rows.length,mistakeQuestionNumbers:rows.map(r=>r.q.id).join(', ')}}))}
$('#check').onclick=checkTranslation;$('#next').onclick=()=>{if(++index>=flat.length)finish();else show()};$('#finish').onclick=finish;$('#restart').onclick=()=>location.reload();$('#speak').onclick=()=>speak(flat[index].sentence);$('#mic').onclick=startMic;$('#download').onclick=async()=>{const rows=[...wrong.values()];if(!rows.length)return;try{if(!window.docx)await new Promise((ok,fail)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js';s.onload=ok;s.onerror=fail;document.head.append(s)});const{Document,Packer,Paragraph,HeadingLevel}=window.docx,children=[new Paragraph({text:`三民普高 ${QUIZ.unit} ${QUIZ.title} 錯題紀錄`,heading:HeadingLevel.TITLE})];rows.forEach(r=>children.push(new Paragraph({text:`第 ${r.q.id} 題`,heading:HeadingLevel.HEADING_2}),new Paragraph(r.q.prompt||r.q.passage||''),new Paragraph('作答：'+r.attempts.join('；')),new Paragraph('答案：'+(r.q.answer||r.q.answers.join(' / ')))));const blob=await Packer.toBlob(new Document({sections:[{children}]})),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Sanmin_${QUIZ.unit}_${QUIZ.kind}_錯題.docx`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){alert('目前無法產生 DOCX，請稍後再試。')}};flat=flatten();show();
