r-row label{font-weight:800;min-width:58px}.answer-input{font:inherit;font-size:18px;padding:9px 10px;border:2px solid #94a3b8;border-radius:9px;flex:1;min-width:0}.answer-input.ok{border-color:var(--ok);background:var(--okbg)}.answer-input.bad{border-color:var(--bad);background:var(--badbg)}.picture{display:block;max-width:100%;max-height:330px;object-fit:contain;margin:12px auto;border:1px solid var(--line);border-radius:12px;background:#fff}.feedback,.voicebox{padding:13px;margin-top:14px;border-radius:10px}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.voicebox{background:var(--voicebg);border:2px solid #ddd6fe}.target{font-size:19px;font-weight:800;margin:6px 0 10px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}@media(max-width:640px){.wrap{padding:10px}.hero,.card{padding:15px}.stem{font-size:18px}}

const TITLE="翰林 Book 4 Unit 4 第二大題 文法選擇",KIND="mcq",Q=[{"id":1,"stem":"(   ) There ______ a fan in the room. It’s very hot there.","options":["can have","must have","are going to be","should be"],"answer":3,"explanation":"There　只能與　be　動詞合用，選項(Ｃ)　are　至少須改成　is。句意為「這房間應該有個風扇。那裡很熱。」。","full":"There should be a fan in the room. It’s very hot there."},{"id":2,"stem":"(   ) You have to ______ some vegetables before you go home, or Mom can’t cook dinner for us.","options":["buying","buys","buy","bought"],"answer":2,"explanation":"have to＋原形動詞。","full":"You have to buy some vegetables before you go home, or Mom can’t cook dinner for us."},{"id":3,"stem":"(   ) All Jacky’s fans listened to him ______ songs at the concert.","options":["sang","singing","to sing","sings"],"answer":1,"explanation":"S＋感官動詞＋O＋原形動詞／現在分詞　V-ing。","full":"All Jacky’s fans listened to him singing songs at the concert."},{"id":4,"stem":"(   ) Let’s ______ Grandpa ______ a long story.","options":["listen to; tell","hear; telling","feel; to tell","watch; told"],"answer":0,"explanation":"「刻意去聽」須用　listen to，其後的動作可用原形　V...／現在分詞　V-ing...。","full":"Let’s listen to Grandpa tell a long story."},{"id":5,"stem":"(   ) If Mike ______ free time, he will play the violin in the garden.","options":["has","had","will have","is having"],"answer":0,"explanation":"主要句子是未來式時，if　的條件句須用「現在簡單式」代替「未來式」。","full":"If Mike has free time, he will play the violin in the garden."},{"id":6,"stem":"(   ) We’ll keep practicing soccer if it ______ tomorrow.","options":["won’t rain","keeps raining","doesn’t rain","will stop raining"],"answer":2,"explanation":"如果明天「不下雨」，可用　doesn’t rain　　stops raining　作答。if　引導的副詞子句須用「現在簡單式」代替「未來式」。","full":"We’ll keep practicing soccer if it doesn’t rain tomorrow."},{"id":7,"stem":"(   ) If Alice ______ to England next Sunday, she will send me a postcard.","options":["will get","got","gets","is getting"],"answer":2,"explanation":"主要句子是未來式時，if　的條件句須用「現在簡單式」代替「未來式」。","full":"If Alice gets to England next Sunday, she will send me a postcard."},{"id":8,"stem":"(   ) Little Betty can’t sleep ______. She needs her mom to sleep with her.","options":["herself","of her own","hers","her"],"answer":0,"explanation":"不能「自己」睡覺，用反身代名詞　herself。(Ｂ)應改為　on her own。","full":"Little Betty can’t sleep herself. She needs her mom to sleep with her."},{"id":9,"stem":"(   ) My mom told me to take care of（照顧 ） ______ in England. She worried that I couldn’t eat or sleep well there.〔 105.會考〕","options":["me","myself","her","herself"],"answer":1,"explanation":"媽媽要我在英國好好照顧「自己」，用反身代名詞。","full":"My mom told me to take care of（照顧 ） myself in England. She worried that I couldn’t eat or sleep well there.〔 105.會考〕"},{"id":10,"stem":"(   ) Everybody, it’s time to have fun. Please enjoy ______.","options":["himself","herself","yourselves","______ 3 themselves"],"answer":2,"explanation":"是對著「大家；每個人」說話，故用「你們自己」。","full":"Everybody, it’s time to have fun. Please enjoy yourselves."},{"id":11,"stem":"(   ) Tom: Must I give you a hand during the test（考試）? Sue: No, you ______, or Ms. Love will not be happy about it.","options":["don’t","mustn’t","doesn’t have to","aren’t"],"answer":1,"explanation":"Sue　以「考試中絕不可以幫忙，否則　Love　老師會生氣。」回應。(Ｃ)　doesn’t　至少須改成　don’t。","full":"Tom: Must I give you a hand during the test（考試）? Sue: No, you mustn’t, or Ms. Love will not be happy about it."},{"id":12,"stem":"(   ) Everyone ______ be quiet in the library. They ______ talk with each other.","options":["don’t have to; shouldn’t","doesn’t need; can’t","need to; won’t","has to; mustn’t"],"answer":3,"explanation":"在圖書館大家「必須」安靜，主詞是單數，故接單數動詞，而他們「絕不可以」彼此交談。","full":"Everyone has to be quiet in the library. They mustn’t talk with each other."},{"id":13,"stem":"(   ) Don’t you smell someone ______ something in the kitchen? It smells ______.","options":["cooking; great","cooked; well","to cook; yummy","cooks; delicious"],"answer":0,"explanation":"感官動詞　smell　之後的動作通常用「現在分詞」，而連綴動詞　smell　之後要接「形容詞」，形容詞　well（好的）只能修飾「人」。","full":"Don’t you smell someone cooking something in the kitchen? It smells great."},{"id":14,"stem":"(   ) Everybody, it’s party time. Please help ______ to the food, and let’s enjoy ______ tonight.","options":["himself; yourselves","herself; themselves","herself; yourself","yourselves; ourselves"],"answer":3,"explanation":"要每個人、大家「你們自己」自行取用食物，而且讓「我們」今晚玩得愉快吧，反身代名詞用「我們自己」。","full":"Everybody, it’s party time. Please help yourselves to the food, and let’s enjoy ourselves tonight."},{"id":15,"stem":"(   ) I saw Jimmy ______ with a dog on my way home.","options":["playing","would play","plays","to play"],"answer":0,"explanation":"S＋感官動詞＋O＋原形動詞／現在分詞　V-ing。","full":"I saw Jimmy playing with a dog on my way home."},{"id":16,"stem":"(   ) Be good in class, ______ Mrs. Wang will not be happy.","options":["or","and","however","if"],"answer":0,"explanation":"or（否則）＋不好的結果。","full":"Be good in class, or Mrs. Wang will not be happy."},{"id":17,"stem":"(   ) Ben did the homework ______. No one helped him.","options":["myself","himself","herself","yourself"],"answer":1,"explanation":"Ben「他自己」寫功課。","full":"Ben did the homework himself. No one helped him."},{"id":18,"stem":"(   ) ______ I don’t get there on time, you can leave first.","options":["If","Because","Or","Before"],"answer":0,"explanation":"「如果」我沒有準時到達那裡，你可以先離開。","full":"If I don’t get there on time, you can leave first."},{"id":19,"stem":"(   ) It’s great ______ the sun come up and go down in a day.","options":["to watch","listening to","looks at","finding"],"answer":0,"explanation":"「觀看」太陽升起和落下，感官動詞用　watch。","full":"It’s great to watch the sun come up and go down in a day."},{"id":20,"stem":"(   ) Can we feel the cool wind ______ all the way?","options":["blew","blows","blowing","to blow"],"answer":2,"explanation":"感官動詞　feel＋受詞＋原形　V...／現在分詞　V-ing...。","full":"Can we feel the cool wind blowing all the way?"},{"id":21,"stem":"(   ) You ______ be sick（生病的）. You ______ go see a doctor right away.","options":["can; should","have to; must","must; should","can; need"],"answer":2,"explanation":"你「一定」是生病了。你「應該」立刻去看醫生。must　可作「一定」解。","full":"You must be sick（生病的）. You should go see a doctor right away."},{"id":22,"stem":"(   ) They will practice playing baseball if it ______ next weekend.","options":["will stop raining","won’t rain","keeps raining","is sunny"],"answer":3,"explanation":"if　引導的副詞子句，須用「現在簡單式」代替未來式。(Ａ)(Ｃ)須改成　stops raining(Ｂ)須改成　doesn’t rain。","full":"They will practice playing baseball if it is sunny next weekend."},{"id":23,"stem":"(   ) What’s wrong with Lisa? I heard her ______ sadly in the room just now.","options":["cried","cries","to cry","crying"],"answer":3,"explanation":"S＋感官動詞＋O＋原形動詞／現在分詞　V-ing。","full":"What’s wrong with Lisa? I heard her crying sadly in the room just now."},{"id":24,"stem":"(   ) Should there ______ a clock in our classroom?","options":["have","to have","being","be"],"answer":3,"explanation":"助動詞　should　之後須接原形動詞，而　there　須與　be　動詞合用。","full":"Should there be a clock in our classroom?"},{"id":25,"stem":"(   ) We’ll go hiking if the weather ______ tomorrow.","options":["will be fine","will stop raining","is fine","stops raining"],"answer":2,"explanation":"if（如果）引導的副詞子句，未來式須用「現在簡單式」代替。(Ｄ)主詞只能是　it，不可以是　the weather。","full":"We’ll go hiking if the weather is fine tomorrow."},{"id":26,"stem":"(   ) George and Mary, make ______ at home, and Mary, help ______ to the cookies on the table. They are your favorite snacks, right?","options":["yourself; yourself","yourselves; yourselves","yourself; yourselves","yourselves; yourself"],"answer":3,"explanation":"第一格，是對　George　和　Mary　說話，故用「你們自己」；第二空格只對　Mary　說話，故用「妳自己」。","full":"George and Mary, make yourselves at home, and Mary, help yourself to the cookies on the table. They are your favorite snacks, right?"},{"id":27,"stem":"(   ) If you ______ to bed now, you’ll be late for school again tomorrow.","options":["aren’t going","don’t go","won’t go","wasn’t going"],"answer":1,"explanation":"主要句子是未來式時，if　的條件句須用「現在簡單式」代替「未來式」。","full":"If you don’t go to bed now, you’ll be late for school again tomorrow."},{"id":28,"stem":"(   ) Anita cooked dinner ______ because her parents were not home.","options":["herself","himself","yourself","themselves"],"answer":0,"explanation":"Anita「她自己」煮晚餐。","full":"Anita cooked dinner herself because her parents were not home."},{"id":29,"stem":"(   ) Let’s ______ Grandma ______ an old song.","options":["hear; tell","look at; to  ______ 4 sing","listen to; sing","watch; telling"],"answer":2,"explanation":"「聽」奶奶「唱」老歌，前者用　listen to，後者可用　sing　或　singing　作答。","full":"Let’s listen to Grandma sing an old song."},{"id":30,"stem":"(   ) You always buy your wife her favorite things. You must ______ her a lot. How lucky she is!","options":["loves","to love","loved","love"],"answer":3,"explanation":"must　為助動詞，後面須接原形動詞。","full":"You always buy your wife her favorite things. You must love her a lot. How lucky she is!"},{"id":31,"stem":"(   ) My mom ______ me play computer games if I don’t finish my homework.","options":["doesn’t let","didn’t let","won’t let","couldn’t let"],"answer":2,"explanation":"if　的條件句以「現在簡單式」代替「未來式」，主要句子用「未來式」。","full":"My mom won’t let me play computer games if I don’t finish my homework."},{"id":32,"stem":"(   ) Boys, help ______ to the fruit on the table.","options":["himself","herself","yourself","yourselves"],"answer":3,"explanation":"說話的對象是「男孩們」，因此反身代名詞用「你們自己」。","full":"Boys, help yourselves to the fruit on the table."},{"id":33,"stem":"(   ) Amy: The dress is so beautiful. Where did you buy it? Rita: I didn’t buy it. My mom made it ______.","options":["hers","herself","for my brother","of her own"],"answer":1,"explanation":"洋裝是　Rita　的媽媽「她自己」做的。(Ｄ)須改成　on her own。","full":"Amy: The dress is so beautiful. Where did you buy it? Rita: I didn’t buy it. My mom made it herself."},{"id":34,"stem":"(   ) People ______ eat or drink on the metro in Taiwan.","options":["should","doesn’t","mustn’t","has to"],"answer":2,"explanation":"在臺灣，人們「絕不可以」在捷運上吃喝東西。","full":"People mustn’t eat or drink on the metro in Taiwan."},{"id":35,"stem":"(   ) We can watch birds ______ in the sky in the mountains.","options":["flies","flying","to fly","flew"],"answer":1,"explanation":"感官動詞　watch＋受詞＋原形　V...／現在分詞　V-ing...。","full":"We can watch birds flying in the sky in the mountains."},{"id":36,"stem":"(   ) We were watching him ______ the guitar at that time.","options":["were playing","played","to play","playing"],"answer":3,"explanation":"S＋感官動詞＋O＋原形動詞／現在分詞　V-ing。","full":"We were watching him playing the guitar at that time."},{"id":37,"stem":"(   ) Why don’t we look at that old man a picture of ______?","options":["to paint; ourselves","painting; himself","paints; herself","paint; themselves"],"answer":1,"explanation":"感官動詞　look at / smell / find　之後的動作通常用現在分詞　V-ing...，而第二空格老先生畫「他自己」的照片，用　himself。","full":"Why don’t we look at that old man a picture of painting?"},{"id":38,"stem":"(   ) Tanya felt happy when she heard the band ______ her favorite song.","options":["to play","is playing","play","plays"],"answer":2,"explanation":"S＋感官動詞＋O＋原形動詞／現在分詞　V-ing。","full":"Tanya felt happy when she heard the band play her favorite song."},{"id":39,"stem":"(   ) Please ______ the fan. I feel so hot.","options":["open","turn on","close","turn off"],"answer":1,"explanation":"「打開」電器產品，用雙字片語動詞　turn on。","full":"Please turn on the fan. I feel so hot."},{"id":40,"stem":"(   ) Joe’s mom will be happier if he ______ the bowls again.","options":["doesn’t break","won’t break","wasn’t breaking","couldn’t break"],"answer":0,"explanation":"主要句子是未來式時，if　的條件句須用「現在簡單式」代替「未來式」。","full":"Joe’s mom will be happier if he doesn’t break the bowls again."},{"id":41,"stem":"(   ) We won’t take a trip to Green Island if it ______ tomorrow morning.","options":["rained","rains","will rain","is raining"],"answer":1,"explanation":"主要句子是未來式時，if　的條件句須用「現在簡單式」代替「未來式」。","full":"We won’t take a trip to Green Island if it rains tomorrow morning."},{"id":42,"stem":"(   ) My wife enjoys going to the movies with her friends, but I like to watch TV at home by ______.〔109.會考〕","options":["I","me","myself","mine"],"answer":2,"explanation":"喜歡「自己」在家看電視，用反身代名詞。","full":"My wife enjoys going to the movies with her friends, but I like to watch TV at home by myself.〔109.會考〕"}];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=s=>String(s??'').trim().toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:()“”"]/g,'').replace(/\s+/g,' ');
let chosen=[],idx=0;const wrong=new Map(),attempted=new Set(),correct=new Set();
function preview(q){return KIND==='mcq'?q.stem:q.prompt}
function renderList(){$('#list').innerHTML=Q.map(q=>`<label class="pick"><input class="pickbox" type="checkbox" value="${q.id}" checked><span><b>第 ${q.id} 題</b><small>${esc(preview(q))}</small></span></label>`).join('')}
function setAll(v){document.querySelectorAll('.pickbox').forEach(x=>x.checked=v)}
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
$('#all').onclick=()=>setAll(true);$('#none').onclick=()=>setAll(false);$('#random').onclick=()=>{setAll(false);const ids=new Set(shuffled(Q).slice(0,20).map(q=>q.id));document.querySelectorAll('.pickbox').forEach(x=>x.checked=ids.has(+x.value))};
$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));idx=0;wrong.clear();attempted.clear();correct.clear();$('#select').classList.add('hidden');$('#result').classList.add('hidden');$('#quiz').classList.remove('hidden');show()};
function show(){if(window.speechSynthesis)speechSynthesis.cancel();const q=chosen[idx];$('#meta').textContent=`第 ${idx+1} / ${chosen.length} 題｜原題 ${q.id}`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=`${idx/chosen.length*100}%`;$('#stem').textContent=KIND==='mcq'?q.stem:q.prompt;const pic=$('#picture');if(q.image){pic.src=q.image;pic.classList.remove('hidden')}else{pic.classList.add('hidden');pic.removeAttribute('src')};if(KIND==='mcq'){$('#area').className='options';$('#area').innerHTML=q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b><span>${esc(o)}</span></label>`).join('')}else{$('#area').className='answer-grid';$('#area').innerHTML=q.answers.map((a,i)=>`<div class="answer-row"><label>空格 ${i+1}</label><input class="answer-input" data-i="${i}" autocomplete="off" spellcheck="false" placeholder="請輸入答案"></div>`).join('')};$('#feedback').className='feedback hidden';$('#voicebox').classList.add('hidden');$('#check').classList.remove('hidden');$('#next').classList.add('hidden')}
function remember(q,value){if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(value);$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
function spoken(q){return q.full||((KIND==='mcq')?q.stem.replace(/^\(\s*\)\s*/,'').replace(/_{3,}/,q.options[q.answer]):q.answers.map(a=>a.accepted[0]).join(' '))}
function speak(){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(spoken(chosen[idx]));u.lang='en-US';u.rate=.88;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/^en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;speechSynthesis.speak(u)}
function success(q){correct.add(q.id);$('#bar').style.width=`${(idx+1)/chosen.length*100}%`;$('#feedback').className='feedback ok';$('#feedback').innerHTML='✅ 全部正確！<br>'+esc(q.explanation||'');$('#target').textContent=spoken(q);$('#voicebox').classList.remove('hidden');$('#check').classList.add('hidden');$('#next').classList.remove('hidden');speak()}
$('#check').onclick=()=>{const q=chosen[idx];attempted.add(q.id);if(KIND==='mcq'){const sel=document.querySelector('input[name=answer]:checked');if(!sel)return alert('請先選擇答案。');const n=+sel.value;if(n===q.answer)return success(q);remember(q,String.fromCharCode(65+n)+'. '+q.options[n]);$('#feedback').className='feedback bad';$('#feedback').innerHTML=`❌ 答錯了。正確答案：<strong>${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</strong><br>${esc(q.explanation||'')}<br>請重新選擇正確答案。`;return}const ins=[...document.querySelectorAll('.answer-input')];if(ins.some(x=>!x.value.trim()))return alert('請完成所有答案。');const bad=[];ins.forEach((input,i)=>{const a=q.answers[i];input.classList.remove('ok','bad');if(a.accepted.some(x=>norm(x)===norm(input.value))){input.classList.add('ok');input.disabled=true}else{input.classList.add('bad');bad.push(`${i+1}. ${input.value} → ${a.display}`);input.value=''}});if(!bad.length)return success(q);remember(q,bad.join('；'));$('#feedback').className='feedback bad';$('#feedback').innerHTML=`❌ 有 ${bad.length} 格不正確。<br>正確答案：${q.answers.map((a,i)=>`${i+1}. <strong>${esc(a.display)}</strong>`).join('；')}<br>${esc(q.explanation||'')}<br>請依提示重新填寫。`;ins.find(x=>!x.disabled)?.focus()};
$('#speak').onclick=speak;$('#next').onclick=()=>{idx++;idx>=chosen.length?finish():show()};$('#finish').onclick=finish;
function answerText(q){return KIND==='mcq'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.answerRaw}
function finish(){if(window.speechSynthesis)speechSynthesis.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');$('#summary').innerHTML=`<div class="stat">選擇題數<b>${chosen.length}</b></div><div class="stat">已作答<b>${attempted.size}</b></div><div class="stat">完成答對<b>${correct.size}</b></div><div class="stat">曾答錯<b>${wrong.size}</b></div>`;$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>`<div class="wrong"><b>${i+1}. 原題 ${r.q.id}｜${esc(preview(r.q))}</b><p>錯誤紀錄：${r.attempts.map(esc).join('<br>')}</p><p><strong>正確答案：</strong>${esc(answerText(r.q))}</p><p>${esc(r.q.explanation||'')}</p></div>`).join(''):'<div class="feedback ok">🎉 沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size)}
$('#restart').onclick=()=>location.reload();$('#download').onclick=async()=>{if(!wrong.size)return;const rows=[...wrong.values()],stamp=new Date().toISOString().slice(0,10),name=TITLE.replace(/\s+/g,'_')+'_錯題_'+stamp;const save=(blob,ext)=>{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name+ext;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};try{const{Document,Packer,Paragraph,TextRun,HeadingLevel}=await import('https://esm.sh/docx@9.5.1');const children=[new Paragraph({heading:HeadingLevel.TITLE,children:[new TextRun({text:TITLE+' 錯題紀錄',bold:true})]})];rows.forEach((r,i)=>{children.push(new Paragraph({heading:HeadingLevel.HEADING_2,children:[new TextRun({text:`${i+1}. 原題 ${r.q.id}`,bold:true})]}),new Paragraph({text:preview(r.q)}),new Paragraph({children:[new TextRun({text:'錯誤紀錄：',bold:true}),new TextRun({text:r.attempts.join(' | ')})]}),new Paragraph({children:[new TextRun({text:'正確答案：',bold:true}),new TextRun({text:answerText(r.q)})]}),new Paragraph({children:[new TextRun({text:'解析：',bold:true}),new TextRun({text:r.q.explanation||''})]}))});save(await Packer.toBlob(new Document({sections:[{children}]})),'.docx')}catch(e){save(new Blob([TITLE+' 錯題紀錄\n\n'+rows.map(r=>preview(r.q)+'\n正確答案：'+answerText(r.q)+'\n').join('\n')],{type:'text/plain;charset=utf-8'}),'.txt')}};
renderList();
</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
