<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#1f2937;--muted:#64748b;--line:#dbe2ea;--blue:#2563eb;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--voice:#7c3aed;--voicebg:#f5f3ff}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}.wrap{max-width:980px;margin:auto;padding:18px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 5px 18px #0f172a0d}.hero{background:linear-gradient(135deg,#eaf2ff,#fff)}h1{margin:0 0 8px;font-size:clamp(24px,4vw,36px)}.note,.meta{color:var(--muted)}.home{color:var(--blue);font-weight:800;text-decoration:none}.hidden{display:none!important}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}.btn{border:0;border-radius:10px;padding:11px 16px;font:700 16px inherit;cursor:pointer;background:#e5e7eb;color:var(--ink)}.primary{background:var(--blue);color:white}.danger{background:#991b1b;color:white}.voice{background:var(--voice);color:white}.pick{display:flex;gap:10px;padding:10px;border:1px solid var(--line);border-radius:9px;margin:7px 0;background:#fafafa}.pick input{margin-top:5px;accent-color:var(--blue)}.pick span{min-width:0}.pick small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#list{max-height:440px;overflow:auto}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;font-weight:700;margin:8px 0 15px}.stem{font-size:21px;font-weight:700;white-space:pre-line;margin:15px 0}.options{display:grid;gap:10px}.option{display:flex;gap:10px;padding:12px;border:2px solid var(--line);border-radius:10px;cursor:pointer}.option:has(input:checked){border-color:var(--blue);background:#eff6ff}.answer-grid{display:grid;gap:10px;margin-top:12px}.answer-row{display:flex;align-items:center;gap:10px}.answer-row label{font-weight:800;min-width:58px}.answer-input{font:inherit;font-size:18px;padding:9px 10px;border:2px solid #94a3b8;border-radius:9px;flex:1;min-width:0}.answer-input.ok{border-color:var(--ok);background:var(--okbg)}.answer-input.bad{border-color:var(--bad);background:var(--badbg)}.picture{display:block;max-width:100%;max-height:330px;object-fit:contain;margin:12px auto;border:1px solid var(--line);border-radius:12px;background:#fff}.feedback,.voicebox{padding:13px;margin-top:14px;border-radius:10px}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.voicebox{background:var(--voicebg);border:2px solid #ddd6fe}.target{font-size:19px;font-weight:800;margin:6px 0 10px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}@media(max-width:640px){.wrap{padding:10px}.hero,.card{padding:15px}.stem{font-size:18px}}
</style></head><body><main class="wrap">
<section class="hero"><h1>翰林 Book 4 Unit 4 第七大題 填充題</h1><p>請依題目空格順序輸入完整答案；多格題會逐格批改。</p><p class="note">答錯會顯示正確答案並要求重填；答對後會朗讀英文。結束時可下載 DOCX 錯題紀錄。</p><a class="home" href="dashboard.html">← 回測驗 Dashboard</a></section>
<section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn">全部選取</button><button id="none" class="btn">全部取消</button><button id="random" class="btn">隨機 20 題</button><button id="start" class="btn primary">開始作答</button></div><div id="list"></div></section>
<section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="stem" class="stem"></div><img id="picture" class="picture hidden" alt="題目圖片"><div id="area"></div><div id="feedback" class="feedback hidden"></div><div id="voicebox" class="voicebox hidden"><b>🔊 完整英文</b><div id="target" class="target"></div><button id="speak" class="btn voice">🔊 再聽一次</button></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題</button><button id="finish" class="btn danger">結束作答</button></div></section>
<section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="download" class="btn primary">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section>
</main><script>
const TITLE="翰林 Book 4 Unit 4 第七大題 填充題",KIND="fill",Q=[{"id":1,"prompt":"Sam: Should I use the money? Mia: No, you ______. It’s not yours.","answers":[{"display":"shouldn’t","accepted":["shouldn’t"]}],"answerRaw":"shouldn’t","explanation":"回答　Should　為首的否定簡答句，仍用　should　即可，再與　not　形成縮寫式。","full":"Sam: Should I use the money? Mia: No, you shouldn’t. It’s not yours."},{"id":2,"prompt":"You don’t look good. You ______ be sick（生病的）.","answers":[{"display":"must","accepted":["must"]}],"answerRaw":"must","explanation":"你看起來不是很好。你「一定」生病了。","full":"You don’t look good. must sick（生病的）."},{"id":3,"prompt":"填入適當的從屬連接詞及正確的動詞時式 。 (１) If my sister ______ (be) free tomorrow, she ______ (go) shopping. (２) We’ll visit the zoo if it ______ (not rain) this weekend. (３) If I ______ (have) enough time and money, I ______ (take) a trip to Japan. (４) If our daughter ______ (go) over the important points（重點）one more time, I think she ______ (do) better on the English quiz（測驗）.","answers":[{"display":"is","accepted":["is"]},{"display":"will go","accepted":["will go"]},{"display":"does not rain","accepted":["does not rain"]},{"display":"have","accepted":["have"]},{"display":"will take","accepted":["will take"]},{"display":"goes","accepted":["goes"]},{"display":"will do","accepted":["will do"]}],"answerRaw":"(１)　is；will go；(２)　does not rain；(３)　have；will take；(４)　goes；will do","explanation":"(１)(２)(３)(４)　If...或　if...引導的副詞子句，須用「現在簡單式」代替未來式，而與其合用的主要句子則用「未來式」。","full":"(１) If my sister is (be) free tomorrow, she will go (go) shopping. (２) We’ll visit the zoo if it does not rain (not rain) this weekend. (３) If I have (have) enough time and money, I will take (take) a trip to Japan. (４) If our daughter goes (go) over the important points（重點）one more time, I think she will do (do) better on the English quiz（測驗）."},{"id":4,"prompt":"Let’s go (w) ______ the sun down at the beach today.","answers":[{"display":"watch","accepted":["watch"]},{"display":"go / going","accepted":["go","going"]}],"answerRaw":"watch；go(或)going","explanation":"go　之後可接原形　V...，可「觀賞」太陽「落下」，感官動詞用　watch，「下降」則可用　go / going　作答。","full":"Let’s go go watch the sun down at the beach today."},{"id":5,"prompt":"Don’t worry. We can go to the beach ourselves.","answers":[{"display":"by","accepted":["by"]}],"answerRaw":"by","explanation":"by ourselves：我們自己。","full":"Don’t worry. We can go to the beach by ourselves."},{"id":6,"prompt":"Hank, please turn ______ the fan. Let’s watch the stars ______ (shine) in the sky.","answers":[{"display":"on","accepted":["on"]},{"display":"shine / shining","accepted":["shine","shining"]}],"answerRaw":"on；shine(或)shining","explanation":"turn on the fan：打開電扇；感官動詞　watch　+原形動詞或　V-ing。","full":"Hank, please on fan. Let’s watch the stars shine (shine) in the sky."},{"id":7,"prompt":"I saw him ______ at the desk and his homework just now.","answers":[{"display":"sitting","accepted":["sitting"]},{"display":"doing","accepted":["doing"]}],"answerRaw":"sitting；doing","explanation":"感官動詞　saw＋受詞＋現在分詞1...＋and＋現在分詞2...。","full":"I saw him sitting at the desk and doing his homework just now."},{"id":8,"prompt":"There should ______ a clock on the wall in the classroom.","answers":[{"display":"be","accepted":["be"]}],"answerRaw":"be","explanation":"助動詞　should（應該）之後須接原形　V...，而　There　只能與　be　動詞合用。","full":"There be clock on the wall in the classroom."},{"id":9,"prompt":"Jeff and Ben, look at ______. How did your clothes get so dirty?","answers":[{"display":"yourselves","accepted":["yourselves"]}],"answerRaw":"yourselves","explanation":"Jeff　和　Ben，看看「你們自己」。你們的衣服怎會變得這麼髒呢？","full":"Jeff and Ben, look at yourselves. How did your clothes get so dirty?"},{"id":10,"prompt":"Everyone, it’s party time. Please help to the snacks.","answers":[{"display":"yourselves","accepted":["yourselves"]}],"answerRaw":"yourselves","explanation":"說話的對象是「大家；每個人」，因此「反身代名詞」用「你們自己」。","full":"Everyone, it’s party time. Please help yourselves to the snacks."},{"id":11,"prompt":"We won’t go out if it (k) ______ raining tomorrow.","answers":[{"display":"keeps","accepted":["keeps"]}],"answerRaw":"keeps","explanation":"如果明天「持續」下雨，我們將不出去。if　引導的副詞子句須用「現在簡單式」代替「未來式」。","full":"We won’t go out if it (k) keeps raining tomorrow."},{"id":12,"prompt":"填入正確的動詞形式或反身代名詞。 (１) She saw a giant rock ______ (roll) down and the people in a car hurting (oneself). (２) At the beach, let’s watch the sun (go) down and enjoy ______ (oneself). (３) From his house, he can hear ambulances（ 救護車） ______ (come) and (go) day and night. (４) On that night, she felt the wind (blow) hard and heard the rain  ______ 2 (fall) heavily. She could not sleep well at all. (５) George and Mary, make (oneself) at home, and Vivian, help (oneself) to the fruit on the table. (６) Jill: Don’t you smell someone (make) buns in the kitchen? Liz: Of course. Mom is busy making buns there by ______ (oneself). Let’s go give her a hand.","answers":[{"display":"rolling","accepted":["rolling"]},{"display":"themselves","accepted":["themselves"]},{"display":"go / going","accepted":["go","going"]},{"display":"ourselves","accepted":["ourselves"]},{"display":"come","accepted":["come"]},{"display":"go","accepted":["go"]},{"display":"blow / blowing","accepted":["blow","blowing"]},{"display":"fall / falling","accepted":["fall","falling"]},{"display":"yourselves","accepted":["yourselves"]},{"display":"yourself","accepted":["yourself"]},{"display":"making","accepted":["making"]},{"display":"herself","accepted":["herself"]}],"answerRaw":"(１)　rolling；themselves；(２)　go(或)going；ourselves；(３)　come；go；(４)　blow(或)blowing；fall(或)falling；(５)　yourselves；yourself；(６)　making；herself","explanation":"(１)感官動詞　saw＋受詞1＋V1-ing...＋and＋受詞2＋V2-ing...，而　the people in the car　的「反身代名詞」用　themselves。","full":"She saw a giant rock rolling down and the people in a car hurting themselves. At the beach, let’s watch the sun go down and enjoy ourselves. From his house, he can hear ambulances come and go day and night. On that night, she felt the wind blowing hard and heard the rain falling heavily. George and Mary, make yourselves at home, and Vivian, help yourself to the fruit on the table. Jill: Don’t you smell someone making buns in the kitchen? Liz: Of course. Mom is busy making buns there by herself."},{"id":13,"prompt":"We must ______ (make) it a habit（習慣 ）to study English every day.","answers":[{"display":"make","accepted":["make"]}],"answerRaw":"make","explanation":"must　為助動詞，後接原形動詞。","full":"We must make (make) it a habit（習慣 ）to study English every day."},{"id":14,"prompt":"May: Must I tell Mom about it? Sue: No, you ______. She is still too weak now.","answers":[{"display":"mustn’t","accepted":["mustn’t"]}],"answerRaw":"mustn’t","explanation":"Sue　要　May「絕不可以」告訴媽媽。現在她仍然太虛弱了。","full":"May: Must I tell Mom about it? Sue: No, you mustn’t. She is still too weak now."},{"id":15,"prompt":"Emi: My mom always sits by my side all night when I am sick（生病的）. Roy: Oh, she (m) ______ love you very much.","answers":[{"display":"must","accepted":["must"]}],"answerRaw":"must","explanation":"Emi　生病時，媽媽總是整晚陪伴在她身邊。Roy　認為「她一定很愛　Emi。」。","full":"Emi: My mom always sits by my side all night when I am sick（生病的）. Roy: Oh, she (m) must love you very much."},{"id":16,"prompt":"填入正確的動詞形式。 (１) He should ______ (study) hard to get good grades（成績）. (２) Must everyone ______ (do) something to save Mother Earth? (３) After school, Allen has to (walk) home because his mom is busy. (４) Jane’s birthday is coming. We need to (prepare) some food and drink for the party.","answers":[{"display":"study","accepted":["study"]},{"display":"do","accepted":["do"]},{"display":"walk","accepted":["walk"]},{"display":"prepare","accepted":["prepare"]}],"answerRaw":"(１)　study；(２)　do；(３)　walk；(４)　prepare","explanation":"(１)助動詞　should＋原形　V...。","full":"(１) He should study (study) hard to get good grades（成績）. (２) Must everyone do (do) something to save Mother Earth? (３) After school, Allen has to (walk) home because his mom is busy. (４) Jane’s birthday is coming. We need to (prepare) some food and drink for the party."},{"id":17,"prompt":"My mom ______ (visit) my aunt if she goes to Taipei next week.","answers":[{"display":"will visit","accepted":["will visit"]}],"answerRaw":"will visit","explanation":"假設語氣　if　的主要句子，要用未來式表示。","full":"My mom will visit (visit) my aunt if she goes to Taipei next week."},{"id":18,"prompt":"Stand in front of the door, and it’ll open by.","answers":[{"display":"itself","accepted":["itself"]}],"answerRaw":"itself","explanation":"站在門的前面，而「它」將會「自己」打開。","full":"Stand in front of the door, and it’ll open by itself."},{"id":19,"prompt":"My dad ______ be at home if you (v) him at 8:00 this evening.","answers":[{"display":"will","accepted":["will"]},{"display":"visit","accepted":["visit"]}],"answerRaw":"will；visit","explanation":"如果你今晚　8：00「拜訪」我爸爸，他「將」會在家的。第一空格用「未來式」，第二空格用「現在簡單式」代替未來式。","full":"My will at home if you visit him at 8:00 this evening."},{"id":20,"prompt":"Leo: Must I give you a ride? Ann: No, you ______ have to. I can take the metro ______.","answers":[{"display":"don’t","accepted":["don’t"]},{"display":"myself","accepted":["myself"]}],"answerRaw":"don’t；myself","explanation":"Ann　回答的語氣，不是「強烈禁止」，而是「你不必了。，我可以自己搭捷運。」。","full":"Leo: Must I give you a ride? Ann: No, you don’t have to. I can take the metro myself."},{"id":21,"prompt":"My sister does not like others to take pictures for her. She enjoys taking pictures by (h).","answers":[{"display":"herself","accepted":["herself"]}],"answerRaw":"herself","explanation":"我姐姐不喜歡別人為她拍照。她喜愛「她自己」拍攝照片。","full":"My sister does not like others to take pictures for her. She enjoys taking pictures by herself."}];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=s=>String(s??'').trim().toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:()“”"]/g,'').replace(/\s+/g,' ');
let chosen=[],idx=0;const wrong=new Map(),attempted=new Set(),correct=new Set();
function preview(q){return KIND==='mcq'?q.stem:q.prompt}
function renderList(){$('#list').innerHTML=Q.map(q=>`<label class="pick"><input class="pickbox" type="checkbox" value="${q.id}" checked><span><b>第 ${q.id} 題</b><small>${esc(preview(q))}</small></span></label>`).join('')}
function setAll(v){document.querySelectorAll('.pickbox').forEach(x=>x.checked=v)}
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
$('#all').onclick=()=>setAll(true);$('#none').onclick=()=>setAll(false);$('#random').onclick=()=>{setAll(false);const ids=new Set(shuffled(Q).slice(0,20).map(q=>q.id));document.querySelectorAll('.pickbox').forEach(x=>x.checked=ids.has(+x.value))};
$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));idx=0;wrong.clear();attempted.clear();correct.clear();$('#select').classList.add('hidden');$('#result').classList.add('hidden');$('#quiz').classList.remove('hidden');show()};
function show(){if(window.speechSynthesis)speechSynthesis.cancel();const q=chosen[idx];$('#meta').textContent=`第 ${idx+1} / ${chosen.length} 題｜原題 ${q.id}`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=`${idx/chosen.length*100}%`;$('#stem').textContent=KIND==='mcq'?q.stem:q.prompt;const pic=$('#picture');if(q.image){pic.src=q.image;pic.classList.remove('hidden')}else{pic.classList.add('hidden');pic.removeAttribute('src')};if(KIND==='mcq'){$('#area').className='options';$('#area').innerHTML=q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b><span>${esc(o)}</span></label>`).join('')}else{$('#area').className='answer-grid';$('#area').innerHTML=q.answers.map((a,i)=>`<div class="answer-row"><label>空格 ${i+1}</label><input class="answer-input" data-i="${i}" autocomplete="off" spellcheck="false" placeholder="請輸入答案"></div>`).join('')};$('#feedback').className='feedback hidden';$('#voicebox').classList.add('hidden');$('#check').classList.remove('hidden');$('#next').classList.add('hidden')}
function remember(q,value){if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(value);$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
function spoken(q){return q.full||((KIND==='mcq')?q.stem.replace(/^\(\s*\)\s*/,'').replace(/_{3,}/,q.options[q.answer]):q.answers.map(a=>a.accepted[0]).join(' '))}
function speak(){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(spoken(chosen[idx]));u.lang='en-US';u.rate=.88;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/^en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;speechSynthesis.speak(u)}
function success(q){correct.add(q.id);$('#bar').style.width=`${(idx+1)/chosen.length*100}%`;$('#feedback').className='feedback ok';$('#feedback').innerHTML='✅ 全部正確！<br>'+esc(q.explanation||'');$('#target').textContent=spoken(q);$('#voicebox').classList.remove('hidden');$('#check').classList.add('hidden');$('#next').classList.remove('hidden');speak()}
$('#check').onclick=()=>{const q=chosen[idx];attempted.add(q.id);if(KIND==='mcq'){const sel=document.querySelector('input[name=answer]:checked');if(!sel)return alert('請先選擇答案。');const n=+sel.value;if(n===q.answer)return success(q);remember(q,String.fromCharCode(65+n)+'. '+q.options[n]);$('#feedback').className='feedback bad';$('#feedback').innerHTML=`❌ 答錯了。正確答案：<strong>${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</strong><br>${esc(q.explanation||'')}<br>請重新選擇正確答案。`;return}const ins=[...document.querySelectorAll('.answer-input')];if(ins.some(x=>!x.value.trim()))return alert('請完成所有答案。');const bad=[];ins.forEach((input,i)=>{const a=q.answers[i];input.classList.remove('ok','bad');if(a.accepted.some(x=>norm(x)===norm(input.value))){input.classList.add('ok');input.disabled=true}else{input.classList.add('bad');bad.push(`${i+1}. ${input.value} → ${a.display}`);input.value=''}});if(!bad.length)return success(q);remember(q,bad.join('；'));$('#feedback').className='feedback bad';$('#feedback').innerHTML=`❌ 有 ${bad.length} 格不正確。<br>正確答案：${q.answers.map((a,i)=>`${i+1}. <strong>${esc(a.display)}</strong>`).join('；')}<br>${esc(q.explanation||'')}<br>請依提示重新填寫。`;ins.find(x=>!x.disabled)?.focus()};
$('#speak').onclick=speak;$('#next').onclick=()=>{idx++;idx>=chosen.length?finish():show()};$('#finish').onclick=finish;
function answerText(q){return KIND==='mcq'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.answerRaw}
function finish(){if(window.speechSynthesis)speechSynthesis.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');$('#summary').innerHTML=`<div class="stat">選擇題數<b>${chosen.length}</b></div><div class="stat">已作答<b>${attempted.size}</b></div><div class="stat">完成答對<b>${correct.size}</b></div><div class="stat">曾答錯<b>${wrong.size}</b></div>`;$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>`<div class="wrong"><b>${i+1}. 原題 ${r.q.id}｜${esc(preview(r.q))}</b><p>錯誤紀錄：${r.attempts.map(esc).join('<br>')}</p><p><strong>正確答案：</strong>${esc(answerText(r.q))}</p><p>${esc(r.q.explanation||'')}</p></div>`).join(''):'<div class="feedback ok">🎉 沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size)}
$('#restart').onclick=()=>location.reload();$('#download').onclick=async()=>{if(!wrong.size)return;const rows=[...wrong.values()],stamp=new Date().toISOString().slice(0,10),name=TITLE.replace(/\s+/g,'_')+'_錯題_'+stamp;const save=(blob,ext)=>{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name+ext;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};try{const{Document,Packer,Paragraph,TextRun,HeadingLevel}=await import('https://esm.sh/docx@9.5.1');const children=[new Paragraph({heading:HeadingLevel.TITLE,children:[new TextRun({text:TITLE+' 錯題紀錄',bold:true})]})];rows.forEach((r,i)=>{children.push(new Paragraph({heading:HeadingLevel.HEADING_2,children:[new TextRun({text:`${i+1}. 原題 ${r.q.id}`,bold:true})]}),new Paragraph({text:preview(r.q)}),new Paragraph({children:[new TextRun({text:'錯誤紀錄：',bold:true}),new TextRun({text:r.attempts.join(' | ')})]}),new Paragraph({children:[new TextRun({text:'正確答案：',bold:true}),new TextRun({text:answerText(r.q)})]}),new Paragraph({children:[new TextRun({text:'解析：',bold:true}),new TextRun({text:r.q.explanation||''})]}))});save(await Packer.toBlob(new Document({sections:[{children}]})),'.docx')}catch(e){save(new Blob([TITLE+' 錯題紀錄\n\n'+rows.map(r=>preview(r.q)+'\n正確答案：'+answerText(r.q)+'\n').join('\n')],{type:'text/plain;charset=utf-8'}),'.txt')}};
renderList();
</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
