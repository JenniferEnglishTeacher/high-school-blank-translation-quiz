<script>window.QUIZ_CONFIG={"title": "國中會考文法歷屆試題｜too…to／enough／so…that", "mode": "mcq", "questions": [{"id": 1, "question": "I don't have ______ workers to finish painting the office in two days. Can you find some more to do the job?", "options": ["enough", "few", "most", "total"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜enough + 複數名詞 + to V", "explanation": "【句型】enough + 名詞 + to V「足夠的…去做…」\n【分析】後句「你能再找一些人來做嗎？」→ 表示工人不夠 → I don't have enough workers to finish ...「我沒有足夠的工人來完成…」。\n【其他選項】(B) don't have few workers 雙重否定，語意不通；(C) most workers 後不接 to V 表目的，且語意不符；(D) total 是形容詞「全部的、總的」，用法與語意都不符。\n【例句】We don't have enough chairs for everyone.", "explanationSource": "source"}, {"id": 2, "question": "Sorry, I don't have ______ money to buy this jacket.", "options": ["enough", "few", "many", "most"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 1 題）", "explanation": "enough money to V「足夠的錢去買…」。", "explanationSource": "supplemental"}, {"id": 3, "question": "There aren't ______ seats in the classroom. Five students have to stand.", "options": ["few", "enough", "most", "little"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 1 題）", "explanation": "五個學生得站著 → 座位不夠 → enough seats。", "explanationSource": "supplemental"}, {"id": 4, "question": "Joe is old ______ to drive a car now.", "options": ["enough", "so", "too", "very"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 1 題）", "explanation": "形容詞 + enough + to V「夠…可以…」。", "explanationSource": "supplemental"}, {"id": 5, "question": "Diane had a bad cold last week. She is still too ______ to go mountain climbing with you.", "options": ["busy", "short", "weak", "young"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜too ＋ adj. ＋ to V", "explanation": "【句型】too ＋ adj. ＋ to V：太…而不能…\n【分析】上週重感冒（a bad cold），所以身體仍「太虛弱」而不能去爬山，用 weak。\n【其他選項】(A) busy 忙碌、(B) short 矮、(D) young 年輕，都與「感冒」沒有因果關係。\n【例句】Grandpa is too old to ride a bike now.", "explanationSource": "source"}, {"id": 6, "question": "The box is too ______ for Amy to lift. Let's help her.", "options": ["light", "heavy", "small", "cheap"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 5 題）", "explanation": "too＋adj.＋for sb＋to V，箱子「太重」抬不動。", "explanationSource": "supplemental"}, {"id": 7, "question": "It's too ______ to swim in the river today. The water is like ice.", "options": ["cold", "hot", "warm", "sunny"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 5 題）", "explanation": "水像冰一樣，「太冷」不能游泳。", "explanationSource": "supplemental"}, {"id": 8, "question": "Ken was ______ to stay awake during the long movie.", "options": ["enough sleepy", "so sleepy", "too sleepy", "very sleepy"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 5 題）", "explanation": "too＋adj.＋to V 表「太…而不能」；so 需搭配 that 子句。", "explanationSource": "supplemental"}, {"id": 9, "question": "Sabine walks so ______ in the apartment that sometimes you don't even know she's just passed by. You wonder if her feet ever touch the floor.", "options": ["freely", "lightly", "shyly", "slowly"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜so ＋ adv. ＋ that（lightly 輕輕地）", "explanation": "【句型】so ＋ adj./adv. ＋ that 子句：如此…以致於…\n【分析】that 子句說你甚至不知道她走過，懷疑她的腳有沒有碰到地，表示她走路「很輕」，用 lightly。\n【其他選項】(A) freely 自由地；(C) shyly 害羞地；(D) slowly 慢慢地，都無法解釋「腳像沒碰到地」。\n【例句】The boy spoke so quietly that nobody heard him.", "explanationSource": "source"}, {"id": 10, "question": "Ray ran so ______ that he won the race easily.", "options": ["slowly", "fast", "lazily", "quietly"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 9 題）", "explanation": "so＋adv.＋that，跑得「很快」所以輕鬆獲勝。", "explanationSource": "supplemental"}, {"id": 11, "question": "Nina sang so ______ that people at the back of the hall couldn't hear her.", "options": ["softly", "loudly", "clearly", "well"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 9 題）", "explanation": "後面的人聽不到，表示唱得「很小聲」，softly。", "explanationSource": "supplemental"}, {"id": 12, "question": "The teacher explained the rule so ______ that everyone understood it at once.", "options": ["badly", "quickly", "clearly", "strangely"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 9 題）", "explanation": "大家立刻懂了，表示解釋得「很清楚」，clearly。", "explanationSource": "supplemental"}, {"id": 13, "question": "More and more cows on this farm are getting sick. The problem is so ______ that the farm will be closed from tomorrow on.", "options": ["heavy", "popular", "serious", "strong"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜so ＋ adj. ＋ that（serious 嚴重的）", "explanation": "【句型】so ＋ adj. ＋ that 子句：如此…以致於…\n【分析】越來越多牛生病，問題「如此嚴重」以致農場要關閉，problem 搭配 serious。\n【其他選項】(A) heavy 重的；(B) popular 受歡迎的；(D) strong 強壯的，皆不能形容 problem 的嚴重程度。\n【例句】The traffic jam was so serious that we were two hours late.", "explanationSource": "source"}, {"id": 14, "question": "The math test was so ______ that almost everyone got 100.", "options": ["easy", "hard", "serious", "boring"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 13 題）", "explanation": "幾乎人人滿分，考試「很簡單」。", "explanationSource": "supplemental"}, {"id": 15, "question": "Andy was so ______ that he ate three bowls of rice.", "options": ["full", "hungry", "sick", "sleepy"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 13 題）", "explanation": "吃了三碗飯，表示「很餓」。", "explanationSource": "supplemental"}, {"id": 16, "question": "The ______ was so serious that many people lost their homes.", "options": ["party", "game", "earthquake", "holiday"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 13 題）", "explanation": "許多人失去家園，是嚴重的「地震」。", "explanationSource": "supplemental"}, {"id": 17, "question": "Yesterday I went to the beach with my brother. The sun was so ______ that it hurt my eyes!", "options": ["big", "bright", "sunny", "warm"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜so ＋ adj. ＋ that（bright 明亮刺眼）", "explanation": "【句型】so ＋ adj. ＋ that 子句：如此…以致於…\n【分析】that 子句說「眼睛很痛」，可知陽光「太亮、刺眼」，用 bright。\n【其他選項】(A) big 大的；(C) sunny 晴朗的（形容天氣，不形容 the sun）；(D) warm 溫暖的，不會造成眼睛痛。\n【例句】The light was so bright that I couldn't open my eyes.", "explanationSource": "source"}, {"id": 18, "question": "The room was so ______ that I couldn't find the light switch.", "options": ["bright", "dark", "clean", "big"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 17 題）", "explanation": "找不到電燈開關，表示房間「很暗」。", "explanationSource": "supplemental"}, {"id": 19, "question": "The music was so ______ that our neighbors complained.", "options": ["loud", "soft", "quiet", "nice"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 17 題）", "explanation": "鄰居抱怨，表示音樂「太大聲」。", "explanationSource": "supplemental"}, {"id": 20, "question": "The soup was so ______ that I burned my tongue.", "options": ["cold", "salty", "hot", "sweet"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 17 題）", "explanation": "燙到舌頭，表示湯「很燙」。", "explanationSource": "supplemental"}, {"id": 21, "question": "Little Jenny was not sure if the strange old man was still following her, but she was just ______.", "options": ["too angry to talk", "too difficult to be with", "too tired to follow", "too scared to look back"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜too ＋ adj. ＋ to V（too scared to）", "explanation": "【句型】too ＋ adj. ＋ to V：太…而不能…\n【分析】她「不確定」怪老人是否還跟著她，原因是她「太害怕而不敢回頭看」，but 前後語意連貫，選 too scared to look back。\n【其他選項】(A) 太生氣而不能說話；(B) 太難相處；(C) 太累而不能跟隨，都無法解釋她為何「不確定是否仍被跟蹤」。\n【例句】The kitten was too scared to come out from under the bed.", "explanationSource": "source"}, {"id": 22, "question": "Ben didn't finish his dinner because he was ______.", "options": ["too hungry to stop", "too full to eat more", "too young to cook", "too fast to wait"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 21 題）", "explanation": "沒吃完晚餐，因為「太飽吃不下」。", "explanationSource": "supplemental"}, {"id": 23, "question": "The question was ______, so even the teacher needed time to think.", "options": ["too hard to answer quickly", "too easy to answer", "too short to read", "too boring to forget"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 21 題）", "explanation": "連老師都要想，表示「太難而無法馬上回答」。", "explanationSource": "supplemental"}, {"id": 24, "question": "Tony wanted to watch the fireworks, but he was ______ and fell asleep at 9 p.m.", "options": ["too excited to sleep", "too happy to cry", "too sleepy to stay up", "too busy to rest"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 21 題）", "explanation": "九點就睡著，表示「太睏而無法熬夜」。", "explanationSource": "supplemental"}, {"id": 25, "question": "My son has grown bigger and become too ______ for me to carry on my back.", "options": ["long", "heavy", "handsome", "serious"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜too ＋ adj. ＋ for sb ＋ to V", "explanation": "【句型】too ＋ adj. ＋ for ＋ 人 ＋ to V：太…以致某人不能…\n【分析】兒子長大了，變得「太重」而我背不動（carry on my back），用 heavy。\n【其他選項】(A) long 長的；(C) handsome 英俊的；(D) serious 嚴肅的，都不會造成「背不動」。\n【例句】This bag is too heavy for my grandma to carry.", "explanationSource": "source"}, {"id": 26, "question": "The shelf is too ______ for little Tim to reach.", "options": ["low", "high", "short", "near"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 25 題）", "explanation": "太「高」所以小提姆拿不到。", "explanationSource": "supplemental"}, {"id": 27, "question": "This English novel is too ______ for first graders to read.", "options": ["difficult", "easy", "cheap", "thin"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 25 題）", "explanation": "一年級生讀不懂，因為太「難」。", "explanationSource": "supplemental"}, {"id": 28, "question": "The coffee is ______ for me to drink. Let me wait a few minutes.", "options": ["enough hot", "so hot", "too hot", "very hot"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 25 題）", "explanation": "too＋adj.＋for sb＋to V「太燙而無法喝」。", "explanationSource": "supplemental"}, {"id": 29, "question": "Jessie saw the movie years ago. It touched her heart so much that she can remember ______ clearly even now. The story is so touching and too sad for her to forget ______. Jessie is usually very busy. Happily, she can finally have free time to watch ______ again this evening.", "options": ["×；×；×", "it；it；×", "it；×；it", "it；×；×"], "answer": 2, "answerLabel": "C", "source": "講義錯題｜so…that 子句受詞不可省；too…to 句中與主詞相同的受詞要省略", "explanation": "【句型】so…that + 完整子句（受詞不可省）；S + be + too + adj. + to V，若 to V 的受詞就是主詞，受詞要省略。\n【分析】第一格：that 子句要完整，remember 的受詞 it 要寫；第二格：too sad for her to forget，forget 的受詞就是主詞 The story，要省略；第三格：have free time to watch it，watch 的受詞（電影）不是主詞 she，不能省，要寫 it。\n【其他選項】(A)(D) 第一格或第三格省略受詞，句子不完整；(B) 第二格的 it 與主詞重複，錯誤。\n【例句】The box is too heavy for me to carry. / The box is so heavy that I can't carry it.\n備註：講義 p.259", "explanationSource": "source"}, {"id": 30, "question": "This math problem is too difficult for me to ______.", "options": ["solve it", "solve", "solving it", "solved"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 29 題）", "explanation": "too…to 句中受詞就是主詞 problem，要省略。", "explanationSource": "supplemental"}, {"id": 31, "question": "The soup was so hot that I couldn't ______ right away.", "options": ["drink it", "drink", "to drink", "drinking"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 29 題）", "explanation": "so…that 後面是完整子句，drink 的受詞 it 不可省。", "explanationSource": "supplemental"}, {"id": 32, "question": "The shoes are ______ for Tim to wear. He needs a smaller pair.", "options": ["so big", "enough big", "too big", "very big that"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 29 題）", "explanation": "too + adj. + for sb. + to V 表「太…而無法」。", "explanationSource": "supplemental"}]};</script><script src="longteng-b1u5-quiz.js?v=20261106-3"></script><script>document.querySelector("#description").textContent="共 32 題（會考歷屆＋講義錯題 8 題＋類似題 24 題）｜選答後顯示中文解析｜答錯可重做並下載錯題";</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
