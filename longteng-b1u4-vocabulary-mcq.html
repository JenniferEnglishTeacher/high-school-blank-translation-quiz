<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="龍騰普高 B1U4 單字選擇互動練習"><title>龍騰普高 B1U4 單字選擇</title><style>:root{--blue:#2563eb;--navy:#1e3a8a;--bg:#f4f7fb;--card:#fff;--line:#dbe3ee;--ink:#172033;--muted:#64748b;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--voice:#6d28d9;--voicebg:#f5f3ff;--amber:#9a3412;--amberbg:#fff7ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}.wrap{max-width:920px;margin:auto;padding:16px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 5px 18px #0f172a0d}.hero{background:linear-gradient(135deg,#e8f1ff,#fff)}h1{margin:0 0 6px;font-size:clamp(25px,4vw,38px)}h2{margin-top:0}.note{color:var(--muted)}.hidden{display:none!important}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.btn{border:0;border-radius:10px;padding:11px 17px;font:800 16px inherit;cursor:pointer;background:#e5e7eb;color:var(--ink);text-decoration:none}.primary{background:var(--blue);color:#fff}.danger{background:#991b1b;color:#fff}.voice{background:var(--voice);color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.btn:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.pick{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin:7px 0;background:#fafcff}.pick input{margin-right:8px;width:17px;height:17px;accent-color:var(--blue)}#list{max-height:440px;overflow:auto;border:1px solid var(--line);padding:7px;border-radius:12px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:800;margin:8px 0 14px}.zh{padding:10px 13px;background:var(--amberbg);border-radius:9px;color:var(--amber);font-weight:800;margin-bottom:10px}.question{font-size:21px;font-weight:750;padding:16px;background:#f8fafc;border-radius:11px;white-space:pre-wrap}.options{display:grid;gap:9px;margin:14px 0}.option{display:flex;align-items:center;gap:11px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-size:18px;font-weight:750;cursor:pointer}.option:hover{border-color:#60a5fa;background:#eff6ff}.option:has(input:checked){border-color:var(--blue);background:#dbeafe;color:var(--navy)}.option input{width:20px;height:20px;accent-color:var(--blue)}.inputs{display:grid;gap:10px;margin:15px 0}.answer-row{display:grid;grid-template-columns:55px 1fr;gap:10px;align-items:center}.answer-row label{font-weight:900;color:var(--navy);text-align:center}.spell{width:100%;font:inherit;font-size:18px;padding:11px;border:2px solid #94a3b8;border-radius:9px}.feedback{padding:13px;border-radius:10px;font-weight:800;margin:13px 0}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.explain{font-weight:500;margin-top:7px}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:var(--voicebg);margin:13px 0}.voicebox b{display:block;font-size:19px;margin-bottom:8px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}.wrong p{margin:6px 0}.source{font-size:13px;color:var(--muted)}@media(max-width:600px){.wrap{padding:9px}.hero,.card{padding:15px}.question{font-size:18px;padding:13px}.option{font-size:17px}.answer-row{grid-template-columns:42px 1fr}.meta{display:block}}</style><link rel="stylesheet" href="longteng-vocab-required-pronunciation.css?v=20261025-2"></head><body><main class="wrap"><section class="hero"><h1>龍騰普高 B1U4 單字選擇</h1><p>共 30 題。可自行選題、隨機抽題；答錯會顯示正確答案並要求重新作答。</p><p class="note">答對後會朗讀完整英文句子；STT 達 80% 才能進入下一題。完成後可重做錯題並下載 DOCX 錯題紀錄。</p><div class="toolbar"><a class="btn" href="dashboard.html">← 回測驗總覽</a></div></section><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn">全部選取</button><button id="none" class="btn">全部取消</button><button id="rand20" class="btn">隨機 20 題</button></div><label><input id="shuffle" type="checkbox"> 打亂出題順序</label><div id="list"></div><div class="actions"><button id="start" class="btn primary">開始作答</button><span id="picked" class="note"></span></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="voiceBox" class="voicebox hidden"><b id="voiceTarget"></b><button id="speak" class="btn voice">🔊 再聽一次</button></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="retry" class="btn primary">只重做錯題</button><button id="download" class="btn">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></main><script>const TITLE="龍騰普高 B1U4 單字選擇",MODE="mcq",Q=[{"id":1,"question":"After the training is ____________, the trainees are expected to be able to work independently.","options":["alert","specific","complete","creative"],"answer":2,"explanation":"訓練完成之後，受訓者被期待可以獨立作業。 (A)警覺的 (B)特定的 (C)已完成的；已結束的 (D)有創意的","source":"龍騰自命題"},{"id":2,"question":"Gina is curious about Jack’s strange ____________ recently and wants to find out what is wrong with him.","options":["location","behavior","reward","creation"],"answer":1,"explanation":"Gina對於近來Jack的怪異行為感到好奇，並且想要查明他怎麼了。 (A)地點 (B)行為 (C)獎勵；報酬 (D)創造；創建","source":"龍騰自命題"},{"id":3,"question":"This Friday evening’s ____________ is scheduled to start at eight o’clock, so please don’t be late.","options":["performance","exposure","creativity","behavior"],"answer":0,"explanation":"這個週五晚上的表演預定在八點開始，所以請不要遲到。 (A)表演 (B)暴露 (C)創意 (D)行為","source":"龍騰自命題"},{"id":4,"question":"The manager praised Monica for always ____________ her duties well and never being late for work.","options":["exposing","predicting","locating","performing"],"answer":3,"explanation":"經理稱讚Monica總是好好履行她的職責，而且上班從未遲到。 (A)使接觸；使體驗 (B)預測 (C)找到……（的位置） (D)做某事；做某種行為","source":"龍騰自命題"},{"id":5,"question":"Too much ____________ to the violence in video games will have a negative influence on children’s mental development.","options":["behavior","creativity","exposure","ability"],"answer":2,"explanation":"過度暴露於電玩遊戲中的暴力，將會對兒童的心智發展造成負面影響。 (A)行為 (B)創意 (C)暴露 (D)能力","source":"龍騰自命題"},{"id":6,"question":"Recently, Thomas has been busy with the ____________ of a new department in his company.","options":["reward","creation","behavior","exposure"],"answer":1,"explanation":"最近Thomas一直忙著在公司裡創建一個新部門的事。 (A)獎勵；報酬 (B)創造；創建 (C)行為 (D)暴露","source":"龍騰自命題"},{"id":7,"question":"Sophia has ____________ to raise three children on her own since her husband died in a car accident.","options":["managed","created","predicted","assigned"],"answer":0,"explanation":"自從她丈夫死於一場車禍，Sophia已經設法成功靠自己撫養三個孩子。 (A)設法成功做到 (B)創造；產生出 (C)預測 (D)指派","source":"龍騰自命題"},{"id":8,"question":"We believe that Edward has the ____________ to learn a new language easily.","options":["creation","reward","disease","ability"],"answer":3,"explanation":"我們相信Edward有輕易學會一個新語言的能力。 (A)創造；創建 (B)獎勵；報酬 (C)疾病 (D)能力","source":"龍騰自命題"},{"id":9,"question":"The teacher will ____________ those who answer the difficult question correctly with a lollipop.","options":["infect","detect","reward","predict"],"answer":2,"explanation":"老師將會獎勵一支棒棒糖給那些正確回答這個困難問題的人。 (A)感染 (B)偵測到 (C)獎賞；提供報酬 (D)預測","source":"龍騰自命題"},{"id":10,"question":"When deciding whether to buy a house, most people take both the ____________ and price into consideration.","options":["behavior","location","exposure","disease"],"answer":1,"explanation":"當決定是否要買下一間房子時，大多數的人會考量地點和價格。 (A)行為 (B)地點 (C)暴露 (D)疾病","source":"龍騰自命題"},{"id":11,"question":"The nurse carefully cleaned Michael’s wound in order to prevent ____________.","options":["infection","location","ability","creation"],"answer":0,"explanation":"這位護理師仔細地清理Michael的傷口以預防感染。 (A)感染 (B)地點 (C)能力 (D)創造；創建","source":"龍騰自命題"},{"id":12,"question":"Lots of children have been ____________ with this strange illness, and their parents are worried.","options":["rewarded","predicted","created","infected"],"answer":3,"explanation":"許多孩童已經感染了這種奇怪的疾病，而他們的家長都感到擔憂。 (A)獎賞；提供報酬 (B)預測 (C)創造；產生出 (D)感染","source":"龍騰自命題"},{"id":13,"question":"Many people agree that the first landing on the Moon is indeed one of human beings’ greatest ____________ in history.","options":["assignments","locations","accomplishments","infections"],"answer":2,"explanation":"許多人同意，第一次登陸月球的確是史上人類最偉大的成就之一。 (A)（分派的）作業；工作 (B)地點 (C)成就 (D)感染","source":"龍騰自命題"},{"id":14,"question":"The clerk just told me that all the ____________ on this shelf are on sale today.","options":["rewards","items","diseases","infections"],"answer":1,"explanation":"這位店員剛剛告訴我，這個架子上所有的物品今天都特價。 (A)獎勵；報酬 (B)物品 (C)疾病 (D)感染","source":"龍騰自命題"},{"id":15,"question":"Sandy has really ____________ eyesight and often can notice the small differences between things.","options":["keen","infected","complete","specific"],"answer":0,"explanation":"Sandy有很敏銳的視力，時常能留意到事物之間的微小差異。 (A)敏銳的 (B)遭感染的 (C)完整的 (D)特定的","source":"龍騰自命題"},{"id":16,"question":"The government issues a red travel ____________ for New York because of a recent shooting incident.","options":["reward","item","alert","location"],"answer":2,"explanation":"因為最近一場槍擊事件，政府給予紐約紅色旅遊警告。 (A)獎勵；報酬 (B)一項物品 (C)警示 (D)地點","source":"龍騰自命題"},{"id":17,"question":"The scientist will ____________ some experiments on rats and later present the results in a journal.","options":["perform","behave","expose","predict"],"answer":0,"explanation":"這位科學家將在老鼠身上進行一些實驗並會在期刊上發表結果。 (A)做某事；做某種行為 (B)表現 (C)使暴露於；使遭受（危險或不快） (D)預測","source":"龍騰自命題"},{"id":18,"question":"With enough rest, the tennis player is finally back to his best. I ____________ that he will win the match today.","options":["predict","expose","manage","assign"],"answer":0,"explanation":"有了充分的休息，這位網球運動員回到他的最佳狀態。我預測今天他會贏得比賽。 (A)預測 (B)使暴露於；使遭受（危險或不快） (C)設法做到 (D)指派","source":"龍騰自命題"},{"id":19,"question":"The student who gives the best speech will get a(n) ____________ of $1,000.","options":["ability","item","disease","reward"],"answer":3,"explanation":"演講得最好的學生將會得到一千元作為獎勵。 (A)能力 (B)一項物品 (C)疾病 (D)獎勵；報酬","source":"龍騰自命題"},{"id":20,"question":"Dengue fever is spread through the bite of a mosquito that has drawn the blood of a(n) ____________ person.","options":["assigned","performed","located","infected"],"answer":3,"explanation":"登革熱是透過一隻已經吸過染病的人的血液的蚊子叮咬，進而傳播開來。 (A)指派 (B)做某事；做某種行為 (C)找到 (D)感染","source":"龍騰自命題"},{"id":21,"question":"Those who ____________ great things have clear goals, dare to take risks, and never give up.","options":["predict","accomplish","reward","detect"],"answer":1,"explanation":"那些成就大事的人，都有明確目標、勇於冒險並且絕不放棄。 (A)預測 (B)達成 (C)獎賞；提供報酬 (D)偵測到","source":"龍騰自命題"},{"id":22,"question":"Sniffer dogs in airports are able to ____________ items such as weapons or drugs.","options":["manage","detect","perform","assign"],"answer":1,"explanation":"在機場的嗅探犬能夠偵測到像是武器或毒品等物品。 (A)設法做到 (B)偵測到 (C)做某事；做某種行為 (D)指派","source":"龍騰自命題"},{"id":23,"question":"Teenagers are very ____________ to their self-images; they care a lot about how people think of them.","options":["infected","sensitive","exposed","specific"],"answer":1,"explanation":"青少年對自我形象十分敏感；他們非常在意別人對他們的觀感。 (A)被感染的 (B)敏感的 (C)暴露的 (D)特定的","source":"龍騰自命題"},{"id":24,"question":"All the team members did their best during the game. They all were ____________ to win.","options":["alert","keen","specific","infected"],"answer":1,"explanation":"所有的隊員們在比賽中都竭盡所能。他們全都一心求勝。 (A)警覺的 (B)渴望的；熱衷的 (C)特定的 (D)被感染的","source":"龍騰自命題"},{"id":25,"question":"People who eat oily foods but don’t get much exercise have a greater chance of suffering from heart ____________.","options":["ability","reward","disease","behavior"],"answer":2,"explanation":"那些吃油膩食物但不運動的人，得到心臟疾病的風險較高。 (A)能力 (B)獎勵；報酬 (C)疾病 (D)行為","source":"龍騰自命題"},{"id":26,"question":"Dr. Spielberg was ____________ as the leader of the scientific project due to his wide knowledge and experience in the field.","options":["managed","performed","created","assigned"],"answer":3,"explanation":"因為他在這個領域有廣泛的知識和經驗，Spielberg博士被指派當這個科學計畫的領導人。 (A)設法做到 (B)做某事；做某種行為 (C)創造；產生出 (D)指派","source":"龍騰自命題"},{"id":27,"question":"Some people believe all living and non-living things on Earth are ____________ by God, while others don’t.","options":["behaved","infected","created","exposed"],"answer":2,"explanation":"有些人相信地球上所有的生物和非生物都是由上帝創造出來的，但有些人不信。 (A)表現 (B)感染 (C)創造 (D)使暴露於；使遭受（危險或不快）","source":"龍騰自命題"},{"id":28,"question":"The famous actress stays low-key, not wanting her private life to be ____________ to the public.","options":["infected","specific","assigned","exposed"],"answer":3,"explanation":"這位著名的女演員非常低調，不想讓她的私生活公諸於世。 (A)感染 (B)特定的 (C)指派 (D)使暴露於；使遭受（危險或不快）","source":"龍騰自命題"},{"id":29,"question":"The flat beds, 5-star meals, and good wines are ____________ luxuries only to those who fly first class.","options":["alert","specific","sensitive","creative"],"answer":1,"explanation":"可以平躺的床、五星級的餐點和美酒，這些是專屬於搭乘航空公司頭等艙旅客的奢侈品。 (A)警覺的 (B)特定的；專屬的 (C)敏銳的 (D)有創意的","source":"龍騰自命題"},{"id":30,"question":"By using GPS cell phone tracking, the police ____________ the missing man.","options":["located","created","exposed","predicted"],"answer":0,"explanation":"藉由使用衛星定位手機追蹤，警方找到這個失蹤男子。 (A)找到 (B)創造；產生出 (C)使暴露於；使遭受（危險或不快） (D)預測","source":"龍騰自命題"}];const $=s=>document.querySelector(s),list=$('#list'),select=$('#select'),quiz=$('#quiz'),result=$('#result'),question=$('#question'),answerArea=$('#answerArea'),feedback=$('#feedback'),next=$('#next');let chosen=[],idx=0,mode='first';const wrong=new Map(),correct=new Set();const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ');const shuffled=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function renderList(){list.innerHTML=Q.map(q=>'<label class="pick"><input class="pickbox" type="checkbox" value="'+q.id+'" checked><b>第 '+q.id+' 題</b> <span class="source">'+esc(q.source||'')+'</span></label>').join('');count()}function count(){$('#picked').textContent='已選 '+document.querySelectorAll('.pickbox:checked').length+' 題'}list.addEventListener('change',count);$('#all').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=true);count()};$('#none').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=false);count()};$('#rand20').onclick=()=>{let ids=new Set(shuffled(Q).slice(0,Math.min(20,Q.length)).map(q=>q.id));document.querySelectorAll('.pickbox').forEach(x=>x.checked=ids.has(+x.value));count()};$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));if($('#shuffle').checked)chosen=shuffled(chosen);idx=0;mode='first';wrong.clear();correct.clear();select.classList.add('hidden');result.classList.add('hidden');quiz.classList.remove('hidden');show()};function show(){const q=chosen[idx];speechSynthesis?.cancel();$('#meta').textContent=(mode==='retry'?'錯題重做｜':'')+'第 '+(idx+1)+' / '+chosen.length+' 題';$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';$('#bar').style.width=(idx+1)/chosen.length*100+'%';question.textContent=q.question;const zh=$('#zh');if(q.zh){zh.textContent=q.zh;zh.classList.remove('hidden')}else zh.classList.add('hidden');feedback.className='feedback hidden';$('#voiceBox').classList.add('hidden');$('#check').classList.remove('hidden');next.classList.add('hidden');if(MODE==='mcq')answerArea.innerHTML='<div class="options">'+q.options.map((o,i)=>'<label class="option"><input type="radio" name="answer" value="'+i+'"><b>'+String.fromCharCode(65+i)+'.</b> '+esc(o)+'</label>').join('')+'</div>';else answerArea.innerHTML='<div class="inputs">'+q.answers.map((_,i)=>'<div class="answer-row"><label>'+(MODE==='multi'?['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'][i]:'答案')+'</label><input class="spell" autocomplete="off" spellcheck="false" placeholder="請輸入完整答案"></div>').join('')+'</div>';setTimeout(()=>answerArea.querySelector('input')?.focus(),0)}function currentAnswers(){if(MODE==='mcq'){const x=answerArea.querySelector('input:checked');return x?[+x.value]:[]}return [...answerArea.querySelectorAll('.spell')].map(x=>x.value)}function correctText(q){return MODE==='mcq'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.answers.map(a=>a.split('||')[0]).join(' / ')}function isCorrect(q,a){return MODE==='mcq'?a[0]===q.answer:a.every((x,i)=>q.answers[i].split(/\|\||\//).some(v=>norm(x)===norm(v)))}function completedSentence(q){if(MODE==='mcq')return q.question.replace(/_{3,}/,q.options[q.answer]);if(MODE==='spell')return q.question.replace(/[A-Za-z]?_{3,}[A-Za-z]?/,q.answers[0].split('||')[0]);let s=q.question,marks=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];q.answers.forEach((a,i)=>{let value=a.split('||')[0];let re=new RegExp(marks[i]+'[A-Za-z]?_{3,}[A-Za-z]?');if(re.test(s))s=s.replace(re,value);else s=s.replace(/_{3,}/,value)});return s.replace(/[①-⑩]/g,'')}function speak(){if(!speechSynthesis)return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance($('#voiceTarget').textContent);u.lang='en-US';u.rate=.86;s
