<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="國中小基礎1200單字，依37個主題分類的A1例句填空練習。">
<title>國中小基礎1200單字｜主題分類例句填空</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dbe3ee;--blue:#1d4ed8;--blue2:#eff6ff;--teal:#0f766e;--teal2:#ecfdf5;--violet:#6d28d9;--amber:#a16207;--bad:#b91c1c;--bad2:#fff1f2}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.62}.wrap{max-width:1080px;margin:auto;padding:18px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 6px 20px #0f172a0e}.hero{background:linear-gradient(135deg,#dbeafe,#f5f3ff 58%,#ecfdf5)}h1{font-size:clamp(27px,5vw,40px);line-height:1.2;margin:0 0 8px}h2{font-size:23px;margin:0 0 8px}.eyebrow{font-weight:900;color:#4338ca;letter-spacing:.05em}.note{color:var(--muted);margin:5px 0}.hidden{display:none!important}.toolbar,.actions,.themes{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0}.btn{appearance:none;border:0;border-radius:11px;padding:10px 15px;font:700 16px inherit;cursor:pointer;background:#e5e7eb;color:var(--ink);text-decoration:none}.btn.primary{background:var(--blue);color:#fff}.btn.voice{background:var(--violet);color:#fff}.btn.danger{background:#991b1b;color:#fff}.btn.active{background:#1e40af;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.theme{flex:1 1 185px;text-align:left;border:1px solid var(--line);background:#fff}.theme.active{border-color:#1d4ed8;background:#dbeafe;color:#1e3a8a}.theme small{display:block;font-size:12px;color:inherit;opacity:.78}.btn:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.opt{display:flex;align-items:center;gap:8px;font-weight:800}.opt input{width:18px;height:18px;accent-color:var(--blue)}#list{max-height:390px;overflow:auto;border:1px solid var(--line);border-radius:13px;background:#fcfdff;padding:10px}.group{margin:7px 0 13px}.group h3{position:sticky;top:0;margin:0 0 6px;padding:7px 10px;border-radius:8px;background:#eaf2ff;color:#1e40af}.word-list{display:flex;flex-wrap:wrap;gap:6px}.word-chip{border:1px solid var(--line);border-radius:999px;padding:4px 9px;background:#fff;color:#334155}.progress{height:10px;border-radius:999px;background:#e5e7eb;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--blue),var(--violet));transition:width .25s}.meta{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-weight:800;margin:8px 0 14px}.prompt{padding:18px;border:2px solid #bfdbfe;border-radius:15px;background:var(--blue2)}.meaning{font-size:25px;font-weight:900;color:var(--amber)}.badge{display:inline-block;border-radius:999px;background:#fff;padding:3px 9px;margin-right:6px;color:#475569;font-size:13px;font-weight:900}.sentence{margin-top:16px;padding:18px;border:2px solid var(--line);border-radius:13px;background:#f8fafc}.example{font-size:20px;font-weight:750;line-height:2}.blank{display:inline-block;min-width:5ch;border-bottom:3px solid #94a3b8;color:#1d4ed8;text-align:center}.answer{width:100%;max-width:650px;border:2px solid #94a3b8;border-radius:10px;padding:11px 13px;font:700 18px inherit;background:#fff}.answer.ok{color:var(--teal);border-color:var(--teal);background:var(--teal2)}.answer.bad{color:var(--bad);border-color:var(--bad);background:var(--bad2)}.feedback{margin-top:10px;padding:10px 12px;border-radius:9px;font-weight:800}.feedback.good{color:var(--teal);background:var(--teal2)}.feedback.bad{color:var(--bad);background:var(--bad2)}.zh{color:#475569;margin-top:8px}.listen-box{margin-top:16px;padding:15px;border:2px solid #ddd6fe;border-radius:13px;background:#f5f3ff}.listen-box.locked{opacity:.65}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fafafa}.stat b{display:block;font-size:28px}.review{border:1px solid #fecaca;background:#fff7f7;border-radius:12px;padding:13px;margin:10px 0}.review b{font-size:19px;color:#1d4ed8}.footer{text-align:center;color:var(--muted);padding:10px 0 24px;font-size:14px}@media(max-width:650px){.wrap{padding:10px}.hero,.card{padding:15px}.meta{display:block}.example{font-size:18px}.btn{flex:1 1 auto}.theme{flex:1 1 145px}}
</style>
</head>
<body><main class="wrap">
<section class="hero"><div class="eyebrow">國中小英文單字</div><h1>國中小基礎1200單字</h1><p><b>37 個主題、1,331 筆 A1 例句</b>。依教材主題選題，根據中文、詞性與英文例句輸入單字或詞條。</p><p class="note">「1200單字」為教材名稱；附件總表另含補充字，共有1,331筆。若例句有多個空格，輸入本題核心單字或附件所列詞條即可。</p><div class="toolbar"><a class="btn" href="dashboard.html">← 回測驗總覽</a></div></section>

<section id="select" class="card"><h2>選擇練習主題</h2><div id="themes" class="themes"></div><div class="toolbar"><button id="all" class="btn">全部主題</button><button id="none" class="btn">全部取消</button><button id="random20" class="btn">隨機 20 題</button><button id="weakOnly" class="btn">只練待加強</button></div><label class="opt"><input id="shuffle" type="checkbox" checked> 打亂出題順序</label><p id="picked" class="note"></p><div id="list"></div><div class="actions"><button id="start" class="btn primary">開始練習</button></div></section>

<section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="themeMeta"></span></div><div class="prompt"><div><span id="themeBadge" class="badge"></span><span id="pos" class="badge"></span></div><div id="meaning" class="meaning"></div></div><div class="sentence"><h2 style="font-size:19px">完成例句</h2><div id="example" class="example"></div><div id="translation" class="zh"></div><p class="note">請輸入本題核心單字或附件所列詞條。</p><input id="answer" class="answer" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="toolbar"><button id="check" class="btn primary">檢查答案</button></div><div id="feedback" class="feedback hidden"></div></div><div id="listenBox" class="listen-box locked"><b>🔊 英文朗讀</b><p id="listenStatus" class="note">答對後自動播放；單一空格朗讀完整句子，多個空格朗讀本題詞條。</p><button id="speak" class="btn voice" disabled>再聽一次</button></div><div class="actions"><button id="next" class="btn primary" disabled>下一題 →</button><button id="weak" class="btn" disabled>待加強，下一題 →</button><button id="finish" class="btn danger">結束練習</button></div></section>

<section id="result" class="card hidden"><h2>練習結果</h2><div id="summary" class="summary"></div><div id="reviewList"></div><div class="actions"><button id="retry" class="btn primary">重練本輪錯題</button><button id="download" class="btn">下載待加強 DOCX</button><button id="restart" class="btn">重新選擇主題</button></div></section>
<p class="footer">主題、詞條、詞性、中文、A1例句及翻譯依附件「國中1200單字_主題分類_A1例句」呈現。</p>
</main>
<script src="basic-1200-data.js"></script>
<script>
const Q=window.BASIC_1200||[],THEMES=window.BASIC_1200_THEMES||[],STORE='basic-1200-themes-v1',$=id=>document.getElementById(id);
let saved={weak:[]};try{saved=Object.assign(saved,JSON.parse(localStorage.getItem(STORE)||'{}'))}catch(e){}saved.weak=Array.isArray(saved.weak)?saved.weak:[];
let selected=new Set([1]),randomIds=null,pool=[],idx=0,wrongThisRound=new Set(),attemptedWrong=new Set(),currentAudio='',sentencePassed=false,audioRun=0,audioTimer=null;
const save=()=>localStorage.setItem(STORE,JSON.stringify(saved)),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=s=>String(s).toLowerCase().replace(/[’‘`]/g,"'").replace(/[^a-z0-9' -]/g,' ').replace(/\s+/g,' ').trim();
const shuffle=a=>{for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function renderThemes(){$('themes').innerHTML=THEMES.map(t=>'<button class="btn theme '+(selected.has(t.id)?'active':'')+'" data-theme="'+t.id+'"><b>'+String(t.id).padStart(2,'0')+' '+esc(t.zh)+'</b><small>'+esc(t.en)+'｜'+t.count+' 題</small></button>').join('')}
function chosen(){if(randomIds)return Q.filter(q=>randomIds.includes(q.id));return Q.filter(q=>selected.has(q.themeId))}
function renderList(){let arr=chosen(),groups={};for(const q of arr)(groups[q.themeId]??=[]).push(q);$('picked').textContent=randomIds?'已選隨機 '+arr.length+' 題':'已選 '+selected.size+' 個主題，共 '+arr.length+' 題';$('start').disabled=!arr.length;$('list').innerHTML=arr.length?Object.entries(groups).map(([id,items])=>{let t=THEMES.find(x=>x.id==id);return '<div class="group"><h3>'+String(t.id).padStart(2,'0')+' '+esc(t.zh)+'｜'+esc(t.en)+'｜'+items.length+' 題</h3><div class="word-list">'+items.map(q=>'<span class="word-chip">'+esc(q.word)+'</span>').join('')+'</div></div>'}).join(''):'<p class="note">請至少選擇一個主題。</p>'}
$('themes').onclick=e=>{let b=e.target.closest('[data-theme]');if(!b)return;randomIds=null;let id=+b.dataset.theme;selected.has(id)?selected.delete(id):selected.add(id);renderThemes();renderList()};
$('all').onclick=()=>{randomIds=null;selected=new Set(THEMES.map(t=>t.id));renderThemes();renderList()};$('none').onclick=()=>{randomIds=null;selected.clear();renderThemes();renderList()};
$('random20').onclick=()=>{selected.clear();randomIds=shuffle(Q.map(q=>q.id)).slice(0,20);renderThemes();renderList()};
$('weakOnly').onclick=()=>{let ids=new Set(saved.weak);randomIds=Q.filter(q=>ids.has(q.id)).map(q=>q.id);selected.clear();renderThemes();renderList();if(!randomIds.length)alert('目前沒有待加強單字。')};
function showExample(q,filled=false){let text=esc(q.example);if(filled&&q.blanks===1)text=text.replace(/_{3,}/g,'<b class="blank">'+esc(q.fill)+'</b>');else text=text.replace(/_{3,}/g,'<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>');$('example').innerHTML=text}
function renderQuestion(){audioRun++;clearTimeout(audioTimer);if(window.speechSynthesis)speechSynthesis.cancel();let q=pool[idx];sentencePassed=false;currentAudio='';$('bar').style.width=(idx/pool.length*100)+'%';$('meta').textContent='第 '+(idx+1)+' / '+pool.length+' 題｜教材第 '+q.id+' 筆';$('themeMeta').textContent=String(q.themeId).padStart(2,'0')+' '+q.themeZh;$('themeBadge').textContent=q.themeEn;$('pos').textContent=q.pos;$('meaning').textContent=q.meaning;$('translation').textContent=q.translation;showExample(q,false);$('answer').value='';$('answer').disabled=false;$('answer').className='answer';$('feedback').className='feedback hidden';$('check').disabled=false;$('next').disabled=$('weak').disabled=true;$('listenBox').classList.add('locked');$('speak').disabled=true;$('listenStatus').textContent='答對後自動播放；單一空格朗讀完整句子，多個空格朗讀本題詞條。';$('answer').focus()}
function markWrong(q){attemptedWrong.add(q.id);wrongThisRound.add(q.id);if(!saved.weak.includes(q.id))saved.weak.push(q.id);save()}
function check(){let q=pool[idx],value=norm($('answer').value),ok=q.answers.some(answer=>norm(answer)===value);$('answer').className='answer '+(ok?'ok':'bad');if(!ok){markWrong(q);$('feedback').className='feedback bad';$('feedback').textContent='❌ 不正確，請依中文、詞性與例句重新填寫。';$('answer').focus();return}sentencePassed=true;$('answer').disabled=true;$('check').disabled=true;showExample(q,true);let label=q.term||q.word;currentAudio=q.blanks===1?q.example.replace(/_{3,}/g,q.fill):q.fill;$('feedback').className='feedback good';$('feedback').innerHTML='✅ 正確：<b>'+esc(q.word)+'</b>'+(q.term?'｜例句詞條：<b>'+esc(q.term)+'</b>':'')+'。';$('listenBox').classList.remove('locked');$('speak').disabled=false;playAudio(true)}
$('check').onclick=check;$('answer').addEventListener('keydown',e=>{if(e.key==='Enter')check()});
function unlockAudio(token){if(token!==audioRun)return;clearTimeout(audioTimer);$('next').disabled=$('weak').disabled=false;$('speak').disabled=false;$('listenStatus').textContent='✅ 已播放完成，可以進入下一題。'}
function playAudio(auto=false){if(!sentencePassed)return;let token=++audioRun;clearTimeout(audioTimer);$('next').disabled=$('weak').disabled=true;$('speak').disabled=true;$('listenStatus').textContent=auto?'正在自動播放…':'正在再次播放…';if(!window.speechSynthesis){$('listenStatus').textContent='此瀏覽器無法播放語音，已開放下一題。';unlockAudio(token);return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(currentAudio),wordCount=currentAudio.trim().split(/\s+/).length,ms=Math.max(4000,Math.min(24000,Math.round((wordCount/2+2.2)*1000)));u.lang='en-US';u.rate=.84;u.onend=()=>unlockAudio(token);u.onerror=()=>{$('listenStatus').textContent='語音未回報完成；系統稍後會自動開放下一題。'};audioTimer=setTimeout(()=>unlockAudio(token),ms);speechSynthesis.speak(u)}$('speak').onclick=()=>playAudio(false);
function advance(forceWeak=false){let q=pool[idx];if(forceWeak){wrongThisRound.add(q.id);if(!saved.weak.includes(q.id))saved.weak.push(q.id);save()}idx++;idx<pool.length?renderQuestion():finish()}$('next').onclick=()=>advance(false);$('weak').onclick=()=>advance(true);
function finish(){audioRun++;clearTimeout(audioTimer);if(window.speechSynthesis)speechSynthesis.cancel();$('quiz').classList.add('hidden');$('result').classList.remove('hidden');let wrong=pool.filter(q=>wrongThisRound.has(q.id));$('summary').innerHTML='<div class="stat"><span>本輪題數</span><b>'+pool.length+'</b></div><div class="stat"><span>一次答對</span><b>'+(pool.length-attemptedWrong.size)+'</b></div><div class="stat"><span>本輪待加強</span><b>'+wrong.length+'</b></div><div class="stat"><span>累積待加強</span><b>'+saved.weak.length+'</b></div>';$('reviewList').innerHTML=wrong.length?'<h2>本輪待加強</h2>'+wrong.map(q=>'<div class="review"><b>'+esc(q.word)+' <small>'+esc(q.pos)+'</small></b><div>'+esc(q.themeZh)+'｜'+esc(q.meaning)+'</div><div>'+esc(q.example)+'</div><div class="zh">'+esc(q.translation)+'</div></div>').join(''):'<p class="feedback good">本輪全部一次答對！</p>';$('retry').disabled=!wrong.length}
$('finish').onclick=finish;$('start').onclick=()=>{pool=[...chosen()];if(!pool.length)return alert('請至少選擇一個主題。');if($('shuffle').checked)shuffle(pool);idx=0;wrongThisRound.clear();attemptedWrong.clear();$('select').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');renderQuestion()};
$('retry').onclick=()=>{pool=pool.filter(q=>wrongThisRound.has(q.id));idx=0;wrongThisRound.clear();attemptedWrong.clear();$('result').classList.add('hidden');$('quiz').classList.remove('hidden');renderQuestion()};$('restart').onclick=()=>{$('result').classList.add('hidden');$('quiz').classList.add('hidden');$('select').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})};
async function download(){let ids=new Set(saved.weak),arr=Q.filter(q=>ids.has(q.id));if(!arr.length)return alert('目前沒有待加強題目。');try{if(!window.docx){await new Promise((ok,fail)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js';s.onload=ok;s.onerror=fail;document.head.append(s)})}let {Document,Packer,Paragraph,TextRun,HeadingLevel}=window.docx,ch=[new Paragraph({text:'國中小基礎1200單字｜待加強詞條',heading:HeadingLevel.TITLE})];for(const q of arr)ch.push(new Paragraph({children:[new TextRun({text:q.word+' '+q.pos,bold:true})]}),new Paragraph(q.themeZh+'｜'+q.meaning),new Paragraph('例句：'+q.example),new Paragraph('中文：'+q.translation),q.term?new Paragraph('例句詞條：'+q.term):new Paragraph(''));let blob=await Packer.toBlob(new Document({sections:[{children:ch}]})),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='國中小基礎1200單字_待加強.docx';a.click();URL.revokeObjectURL(u)}catch(e){let text=arr.map(q=>q.word+' '+q.pos+'\n'+q.themeZh+'｜'+q.meaning+'\n'+q.example+'\n'+q.translation).join('\n\n'),blob=new Blob([text],{type:'text/plain;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='國中小基礎1200單字_待加強.txt';a.click();URL.revokeObjectURL(u)}}$('download').onclick=download;
renderThemes();renderList();
</script>
</body></html>
