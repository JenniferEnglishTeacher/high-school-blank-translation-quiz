  <script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 1｜文法選擇（其他考點）","mode":"mcq","questions":[{"id":1,"question":"I enjoy ____________ new languages and ____________ them with native speakers.","options":["to learn; practicing","learning; practice","learning; practicing","learn; practicing"],"answer":2,"source":"三合一學習手冊","explanation":"正確答案為 learning; practicing；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":2,"question":"Wendy enjoys ____________ historical novels in her spare time.","options":["reading","to read","in reading","read"],"answer":0,"source":"三合一學習手冊","explanation":"正確答案為 reading；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":3,"question":"My mother bought ____________ daily necessities, such as eggs and salt, on her way home from work yesterday.","options":["much","little","a little","a few"],"answer":3,"source":"龍騰自命題","explanation":"由於空格後面是複數可數名詞，因此可以推知答案要選擇a few，其他選項都只能接不可數名詞","explanationSource":"source"},{"id":4,"question":"When the time came ____________ Cindy to ____________ a speech in public, she was so nervous that she couldn’t help trembling.","options":["for; gave","of; given","for; give","of; giving"],"answer":2,"source":"龍騰自命題","explanation":"When the time comes for sb. to VR 當某人做某事的時候到來，故答案要選擇for; give","explanationSource":"source"},{"id":5,"question":"Shawn is a great fan of basketball, so he always feels ____________ when he watches ____________ NBA games.","options":["exciting; excited","excited; exciting","excitement; excited","excites; excitement"],"answer":1,"source":"龍騰自命題","explanation":"在本題中，第一個空格裡的答案要修飾的是「人的內心感受」，要用excited，而第二個空格裡要修飾的對象是「事物」，要用exciting。因此答案要選擇excited; exciting","explanationSource":"source"},{"id":6,"question":"Whenever Uncle Peter pays a visit to us, he always comes ____________ gifts for everyone. That’s why we love him so much!","options":["with","from","for","into"],"answer":0,"source":"龍騰自命題","explanation":"此處的with是指「帶著」的附帶狀況","explanationSource":"source"},{"id":7,"question":"Lisa felt ____________ after she got a very low score in math, and her friends tried to comfort her.","options":["depressing","depresses","depress","depressed"],"answer":3,"source":"龍騰自命題","explanation":"由於空格內的答案要修飾的對象是Lisa的內心感受，故要用過去分詞來表達情緒，答案要選擇depressed","explanationSource":"source"},{"id":8,"question":"Amy often shares her personal feelings and thoughts ____________ her best friend, Betty.","options":["from","into","with","of"],"answer":2,"source":"龍騰自命題","explanation":"share A with B是指「與B分享A」","explanationSource":"source"},{"id":9,"question":"____________ you have any questions, ____________ free to ask the clerks in our stores.","options":["That; feeling","If; feel","What; feels","How; felt"],"answer":1,"source":"龍騰自命題","explanation":"此處考點為if引導條件句，而後面的主要子句無主詞，可推知為祈使句，故用原形動詞","explanationSource":"source"},{"id":10,"question":"During Kathy’s first trip ____________ Japan, she visited many places and took a great number of photos.","options":["to","on","by","at"],"answer":0,"source":"龍騰自命題","explanation":"此處要選擇介系詞to，以表示「前往」之意","explanationSource":"source"},{"id":11,"question":"____________ the end of the game, Patrick got the most points and became the winner.","options":["On","Of","To","At"],"answer":3,"source":"龍騰自命題","explanation":"at the end of... 是指「在……結尾時」","explanationSource":"source"},{"id":12,"question":"Penny can’t wait to ____________ a date with her boyfriend again because she hasn’t seen him for a month.","options":["having","has","have","had"],"answer":2,"source":"龍騰自命題","explanation":"can’t wait to VR 表示「迫不及待做某事」，故答案要選擇have","explanationSource":"source"},{"id":13,"question":"Sophia took a deep breath before she stepped ____________ the stage to sing a pop song.","options":["into","onto","from","with"],"answer":1,"source":"龍騰自命題","explanation":"step onto the stage表示「走上舞臺」","explanationSource":"source"},{"id":14,"question":"David was amazed at Cindy’s beauty when he saw her ____________ the first time.","options":["for","with","by","during"],"answer":0,"source":"龍騰自命題","explanation":"be amazed at + N為……感到驚奇；for the first time表示「第一次」","explanationSource":"source"},{"id":15,"question":"You had better take an umbrella with you ____________ it looks as if it’s going to rain soon.","options":["due to","owing to","because of","since"],"answer":3,"source":"龍騰自命題","explanation":"前後兩子句有因果關係，而且空格後面是完整的子句，所以要選擇since這個連接詞，其他選項都是介系詞片語，因此不能使用","explanationSource":"source"},{"id":16,"question":"When Beatrice showed up ____________ a pretty pink dress, she caught everyone’s attention.","options":["by","at","in","on"],"answer":2,"source":"龍騰自命題","explanation":"由於空格後面是「衣服」，因此答案要選擇in，因為介系詞in表「穿著」","explanationSource":"source"},{"id":17,"question":"When Jerry has free time, he enjoys ____________ a walk in a small park near his apartment.","options":["to take","taking","takes","taken"],"answer":1,"source":"龍騰自命題","explanation":"enjoy後面只能接V-ing，不能接to VR，因此答案要選擇taking","explanationSource":"source"},{"id":18,"question":"Most children’s books are full ____________ colorful pictures to attract children.","options":["of","in","with","to"],"answer":0,"source":"龍騰自命題","explanation":"A be full of B是指「A中充滿B」","explanationSource":"source"},{"id":19,"question":"Tim feels happy now because he is going to take a trip ____________ Korea next week.","options":["by","in","on","to"],"answer":3,"source":"龍騰自命題","explanation":"此處要選擇介系詞to，以表示「前往」之意","explanationSource":"source"},{"id":20,"question":"Tracy is good at several subjects, ____________ English, Chinese, and math.","options":["for","and","like","from"],"answer":2,"source":"龍騰自命題","explanation":"此處要選擇介系詞like，以表達「像是；例如」的概念","explanationSource":"source"},{"id":21,"question":"Hank doesn’t want to read the novel because he thinks it’s quite ____________.","options":["bored","boring","bores","bore"],"answer":1,"source":"龍騰自命題","explanation":"由於空格內的答案要修飾「事物」，因此要選擇boring，表示「令人感覺無聊的」","explanationSource":"source"},{"id":22,"question":"____________ up earlier tomorrow morning, so you won’t be late for school again.","options":["Get","To get","Getting","Gotten"],"answer":0,"source":"龍騰自命題","explanation":"本句為祈使句，要用原形動詞開頭，故要選擇Get","explanationSource":"source"},{"id":23,"question":"Henry looked ____________ when Nina was telling him how to solve the math problem.","options":["confuse","confused","confusing","confusedly"],"answer":1,"source":"三合一學習手冊","explanation":"正確答案為 confused；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"}]};</script>
