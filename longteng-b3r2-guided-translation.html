border-radius:9px;color:var(--amber);font-weight:800;margin-bottom:10px}.question{font-size:21px;font-weight:750;padding:16px;background:#f8fafc;border-radius:11px;white-space:pre-wrap}.options{display:grid;gap:9px;margin:14px 0}.option{display:flex;align-items:center;gap:11px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-size:18px;font-weight:750;cursor:pointer}.option:hover{border-color:#60a5fa;background:#eff6ff}.option:has(input:checked){border-color:var(--blue);background:#dbeafe;color:var(--navy)}.option input{width:20px;height:20px;accent-color:var(--blue)}.inputs{display:grid;gap:10px;margin:15px 0}.answer-row{display:grid;grid-template-columns:55px 1fr;gap:10px;align-items:center}.answer-row label{font-weight:900;color:var(--navy);text-align:center}.spell{width:100%;font:inherit;font-size:18px;padding:11px;border:2px solid #94a3b8;border-radius:9px}.feedback{padding:13px;border-radius:10px;font-weight:800;margin:13px 0}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.explain{font-weight:500;margin-top:7px}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:var(--voicebg);margin:13px 0}.voicebox b{display:block;font-size:19px;margin-bottom:8px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}.wrong p{margin:6px 0}.source{font-size:13px;color:var(--muted)}@media(max-width:600px){.wrap{padding:9px}.hero,.card{padding:15px}.question{font-size:18px;padding:13px}.option{font-size:17px}.answer-row{grid-template-columns:42px 1fr}.meta{display:block}}</style><link rel="stylesheet" href="longteng-vocab-required-pronunciation.css?v=20261026-4"></head><body><main class="wrap"><section class="hero"><h1>龍騰普高 B3R2 引導式翻譯</h1><p>共 41 題。可自行選題、隨機抽題；答錯後請重新作答。</p><p class="note">答對後顯示來源解析並播放完整英文句；STT 朗讀達 80% 才能進入下一題。完成後可重做錯題並下載 DOCX。</p><div class="toolbar"><a class="btn" href="dashboard.html">← 回測驗總覽</a></div></section><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn">全部選取</button><button id="none" class="btn">全部取消</button><button id="rand20" class="btn">隨機 20 題</button></div><label><input id="shuffle" type="checkbox"> 打亂出題順序</label><div id="list"></div><div class="actions"><button id="start" class="btn primary">開始作答</button><span id="picked" class="note"></span></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="voiceBox" class="voicebox hidden"><b id="voiceTarget"></b><button id="speak" class="btn voice">🔊 再聽一次</button></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="retry" class="btn primary">只重做錯題</button><button id="download" class="btn">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></main><script>const TITLE="龍騰普高 B3R2 引導式翻譯",MODE="multi",Q=[{"id":1,"zh":"我們的新政策一開始可能會讓我們流失一些客戶，但相信我，從長遠來看一定會有收穫。","question":"Our new policy may cost us some customers at first but, trust me, it will all pay off ①____________ ②____________ ③____________ ④____________.","answers":["in","the","long","run"],"explanation":"","source":"三合一學習手冊"},{"id":2,"zh":"Joel四處找鑰匙，但是到處都找不到。","question":"Joel was looking everywhere for his keys, but they were ①____________ ②____________ ③____________ ④____________.","answers":["nowhere","to","be","found"],"explanation":"","source":"三合一學習手冊"},{"id":3,"zh":"失敗時常起因於過度自信，或是缺乏準備與計劃。","question":"Failure often ①____________ ②____________ overconfidence or ③____________ a lack of preparation and planning.","answers":["results","from","from"],"explanation":"","source":"三合一學習手冊"},{"id":4,"zh":"如果你夠努力，很快你將會看到你的夢想實現。","question":"If you work hard enough, you will see your dreams realized ①____________ ②____________ ③____________.","answers":["in","no","time"],"explanation":"","source":"三合一學習手冊"},{"id":5,"zh":"據信，隔壁的男人已捐給慈善機構數百萬元。","question":"The man next door ①____________ ②____________ ③____________ ④____________ ⑤c____________ millions of dollars to charity.","answers":["is","believed","to","have","contributed"],"explanation":"","source":"三合一學習手冊"},{"id":6,"zh":"這個國家可以受教育的女孩子數目一年少於一千。是不是很嚇人？","question":"In this country, ①____________ ②____________ ③____________ ④____________ who are allowed to receive an education is less than 1,000 a year. Isn’t that shocking?","answers":["the","number","of","girls"],"explanation":"","source":"三合一學習手冊"},{"id":7,"zh":"別承擔你力所不及的事。（別咬下超過你可以咀嚼的東西。）","question":"Don’t bite off ①____________ ②____________ you can chew.","answers":["more","than"],"explanation":"","source":"三合一學習手冊"},{"id":8,"zh":"孩子們和老師找遍了所有抽屜裡和書桌下方，但是到處都找不到Tom的習作本。","question":"The children and the teacher searched in all the drawers and under all the desks, but Tom’s workbook was ①____________ ②____________ ③____________ ④____________.","answers":["nowhere","to","be","found"],"explanation":"","source":"課本例句填空"},{"id":9,"zh":"當他們抛下他們的家鄉，孩子們透過他們父母的車窗，回頭看了他們老家最後一眼。","question":"As they ①____________ their hometown ②____________, the children took one last look back at their old house through the window of their parents’ car.","answers":["left","behind"],"explanation":"","source":"課本例句填空"},{"id":10,"zh":"氣候變遷主要起因於這樣的人類活動，如燃燒化石燃料與破壞森林。","question":"Climate change mainly ①____________ ②____________ such human activities as burning fossil fuels and destroying forests.","answers":["results","from"],"explanation":"","source":"課本例句填空"},{"id":11,"zh":"原本預期會大排長龍，最後我們很快地通過機場安檢。","question":"Having expected that there would be a long line of people, in the end, we got through airport security ①____________ ②____________ ③____________.","answers":["in","no","time"],"explanation":"","source":"課本例句填空"},{"id":12,"zh":"除了打包之外，在出國度假之前我們也需要換錢。","question":"①____________ ②____________ ③____________ packing, we also need to exchange money before going on holiday abroad.","answers":["On","top","of"],"explanation":"","source":"課本例句填空"},{"id":13,"zh":"雖然Fiona的貓死去讓她很難過，但是從長遠來看，這讓她更堅強。","question":"Although the death of Fiona’s cat had been upsetting for her, it made her stronger ①____________ ②____________ ③____________ ④____________.","answers":["in","the","long","run"],"explanation":"","source":"課本例句填空"},{"id":14,"zh":"最近幾個月的高失業率必然是起因於低迷的經濟。","question":"The high unemployment rate in recent months must have ①____________ ②____________ the poor economy.","answers":["resulted","from"],"explanation":"","source":"習作簿"},{"id":15,"zh":"如果你有吃止痛藥的習慣，從長遠來看可能對你有害。","question":"If you are in the habit of taking painkillers, it will likely be bad for you ①____________ ②____________ ③____________ ④____________.","answers":["in","the","long","run"],"explanation":"","source":"習作簿"},{"id":16,"zh":"我們錯過了火車；此外，我們必須再等兩個小時才會有下一班車。","question":"We missed the train, and ①____________ ②____________ ③____________ that, we had to wait for another two hours for the next one.","answers":["on","top","of"],"explanation":"","source":"習作簿"},{"id":17,"zh":"那位機車騎士一看到車禍，就馬上停車並打電話叫救護車。","question":"Seeing the accident, the motorcyclist stopped and called for an ambulance ①____________ ②____________ ③____________.","answers":["in","no","time"],"explanation":"","source":"All in One"},{"id":18,"zh":"Leo遺失了錢包；到處都找不到。","question":"Leo lost his wallet; it was ①____________ ②____________ ③____________ ④____________.","answers":["nowhere","to","be","found"],"explanation":"","source":"All in One"},{"id":19,"zh":"許多車禍起因於酒後駕駛。我覺得政府應該對酒駕者施以重罰。","question":"Many car accidents ①____________ ②____________ drunk driving. I think the government should impose severe punishments on drunk drivers.","answers":["result","from"],"explanation":"","source":"All in One"},{"id":20,"zh":"將過去抛下且重新開始並不總是容易的，但有時候你就是必須放手。","question":"It’s not always easy to ①____________ the past ②____________ and make a fresh start, but sometimes you just have to let it go.","answers":["leave","behind"],"explanation":"","source":"三合一學習手冊"},{"id":21,"zh":"又餓又渴，Tammy一到家就直接衝往冰箱。","question":"①____________ and ②____________, Tammy went straight to the refrigerator as soon as she got home.","answers":["Hungry","thirsty"],"explanation":"分詞構句省略be動詞，將形容詞放句首。","source":"龍騰自命題"},{"id":22,"zh":"這家餐廳的小籠包據說是臺北最好吃的。","question":"The xiaolongbao of this restaurant ①____________ ②____________ ③____________ ④____________ the most delicious in Taipei.","answers":["is","said","to","be"],"explanation":"S + be + said + to....表「據說……」，此句描述現在的事實，所以to後面接原形動詞。","source":"龍騰自命題"},{"id":23,"zh":"小男孩對於盒內是什麼非常好奇，等不及要打開它。","question":"①____________ ②____________ what was inside the box, the little boy couldn’t wait to open it.","answers":["Curious","about"],"explanation":"分詞構句省略be動詞，將形容詞放句首。","source":"龍騰自命題"},{"id":24,"zh":"萬聖夜時，孩童挨家挨戶玩不給糖就搗蛋的遊戲。","question":"On Halloween, children go trick-or-treating ①____________ ②h____________ ③____________ ④h____________.","answers":["from","house","to","house"],"explanation":"「from + 單數名詞 + to + 單數名詞」表「從……到……」。","source":"龍騰自命題"},{"id":25,"zh":"由於低出生率，許多國家勞動人口的數量連年下降。","question":"With the low birth rate, ①____________ ②n____________ of people in the workforce in many countries ③____________ been declining for years.","answers":["the","number","has"],"explanation":"「the number of + 複數名詞」表「……的數量」，搭配單數動詞。","source":"龍騰自命題"},{"id":26,"zh":"高達四分之三的地球表面為水所覆蓋。","question":"①____________ ②____________ ③____________ three-fourths of the surface of the earth is covered with water.","answers":["As","much","as"],"explanation":"as much as 高達","source":"龍騰自命題"},{"id":27,"zh":"表面上緩慢漸進，從長遠來看，全球暖化其實對地球將有很大的影響。","question":"Seemingly slow and gradual, global warming actually will have a tremendous impact on the earth ①____________ ②____________ ③____________ ④____________.","answers":["in","the","long","run"],"explanation":"in the long run 從長遠來看","source":"龍騰自命題"},{"id":28,"zh":"營養不良以及免疫系統弱的小孩，一旦接觸病毒後較容易生病。","question":"Children with poor nutrition and weak immune systems are more likely to get sick when they ①____________ ②____________ ③____________ ④____________ viruses.","answers":["come","into","contact","with"],"explanation":"come into contact with 接觸","source":"龍騰自命題"},{"id":29,"zh":"劇烈的氣候變遷據信曾經發生在這個地區。因此，無法適應的動物滅絕了。","question":"A drastic change to the climate is ①____________ to ②____________ ③____________ in the region. ④____________ a ⑤____________, animals which had difficulty adapting died out.","answers":["believed","have","happened","As","result"],"explanation":"S + be + believed + to....表「據信……」，此句描述過去已經發生過的事情，所以to後面接have + p.p.；as a result 因此。","source":"龍騰自命題"},{"id":30,"zh":"我對海鮮過敏，所以我不能吃螃蟹也不能吃蝦子。","question":"I’m allergic to seafood, so I can eat ①____________ crab ②____________ shrimp.","answers":["neither","nor"],"explanation":"neither...nor... 既不……也不……","source":"龍騰自命題"},{"id":31,"zh":"你的餐點馬上就好。抱歉讓你久等了。","question":"Your meal will be ready ①____________ ②____________ ③____________. Sorry to have kept you waiting.","answers":["in","no","time"],"explanation":"in no time 很快；馬上","source":"龍騰自命題"},{"id":32,"zh":"我們錯過最後一班公車，此外，天又開始下雨。","question":"We missed the last bus, and ①o____________ ②t____________ ③o____________ that, it started to rain.","answers":["on","top","of"],"explanation":"on top of 除……之外","source":"龍騰自命題"},{"id":33,"zh":"不是Pamela就是我將代表學校參加全市游泳比賽。","question":"①____________ Pamela ②____________ I will represent our school in the city swimming competition.","answers":["Either","or"],"explanation":"either...or... 不是……就是……","source":"龍騰自命題"},{"id":34,"zh":"似乎事情不像我們想像的簡單。","question":"①____________ ②a____________ ③____________ things are not as simple as we imagined.","answers":["It","appears","that"],"explanation":"It appears that + S + V 似乎……","source":"龍騰自命題"},{"id":35,"zh":"我已經找我的狗好幾天了，但是到處都找不到。","question":"I’ve been looking for my dog for days, but it’s ①n____________ ②t____________ ③____________ ④____________.","answers":["nowhere","to","be","found"],"explanation":"nowhere to be found 到處都找不到","source":"龍騰自命題"},{"id":36,"zh":"為了在貿易公司找份工作，Mandy認為精通英文是重要的。","question":"To land a job at a trading company, Mandy ①c____________ ②____________ ③e____________ to master English.","answers":["considers","it","essential"],"explanation":"S + consider + it + adj. + to VR 認為……是……的","source":"龍騰自命題"},{"id":37,"zh":"我們想不出為什麼這個母親會在如此狂風暴雨的夜晚遺棄新生寶寶。","question":"We could not figure out why the mother would have ①____________ her newborn baby ②b____________ on such a stormy night.","answers":["left","behind"],"explanation":"leave...behind 丟下；拋下","source":"龍騰自命題"},{"id":38,"zh":"科學家指出極端天氣起因於全球暖化。","question":"Scientists point out that extreme weather ①____________ ②____________ global warming.","answers":["results","from"],"explanation":"result from 起因於","source":"龍騰自命題"},{"id":39,"zh":"紐約市常被稱為「大蘋果」。","question":"New York City is often ①____________ ②____________ ③____________ “the Big Apple.”","answers":["referred","to","as"],"explanation":"refer to...as 將……稱為","source":"龍騰自命題"},{"id":40,"zh":"Angela覺得遺棄毛小孩是一件冷血的行為。","question":"Angela ①____________ ②____________ an act of heartlessness ③____________ ④____________ one’s fur babies ⑤b____________.","answers":["feels","it","to","leave","behind"],"explanation":"S + feel + it + N + to VR 覺得……是……；leave...behind 丟下；拋下","source":"龍騰自命題"},{"id":41,"zh":"James的車子沒油了，除此之外，他是在一個鳥不生蛋的地方。","question":"James’s car ran out of gas. On ①____________ ②____________ ③____________, he was in the middle of nowhere.","answers":["top","of","that"],"explanation":"","source":"三合一學習手冊"}];const $=s=>document.querySelector(s),list=$('#list'),select=$('#select'),quiz=$('#quiz'),result=$('#result'),question=$('#question'),answerArea=$('#answerArea'),feedback=$('#feedback'),next=$('#next');let chosen=[],idx=0,mode='first';const wrong=new Map(),correct=new Set();const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ');const shuffled=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function renderList(){list.innerHTML=Q.map(q=>'<label class="pick"><input class="pickbox" type="checkbox" value="'+q.id+'" checked><b>第 '+q.id+' 題</b> <span class="source">'+esc(q.source||'')+'</span></label>').join('');count()}function count(){$('#picked').textContent='已選 '+document.querySelectorAll('.pickbox:checked').length+' 題'}list.addEventListener('change',count);$('#all').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=true);count()};$('#none').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=false);count()};$('#rand20').onclick=()=>{let ids=new Set(shuffled(Q).slice(0,Math.min(20,Q.length)).map(q=>q.id));document.querySelectorAll('.pickbox').forEach(x=>x.checked=ids.has(+x.value));count()};$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));if($('#shuffle').checked)chosen=shuffled(chosen);idx=0;mode='first';wrong.clear();correct.clear();select.classList.add('hidden');result.classList.add('hidden');quiz.classList.remove('hidden');show()};function show(){const q=chosen[idx];speechSynthesis?.cancel();$('#meta').textContent=(mode==='retry'?'錯題重做｜':'')+'第 '+(idx+1)+' / '+chosen.length+' 題';$('#
