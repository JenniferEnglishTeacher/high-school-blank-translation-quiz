<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三民普高 B3R3｜詞彙選擇</title><style>
:root{--blue:#2563eb;--deep:#172554;--bg:#f4f7fb;--line:#d9e2ef;--ok:#15803d;--bad:#b91c1c;--violet:#6d28d9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font-family:Arial,"Microsoft JhengHei",sans-serif;line-height:1.7}main{max-width:1060px;margin:auto;padding:14px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 7px 24px #0f172a0c}.hero{background:linear-gradient(135deg,#eff6ff,#fff)}h1{margin:0;font-size:clamp(25px,4vw,38px)}h2,h3{margin:0 0 10px}.muted{color:#64748b}.hidden{display:none!important}.btn{border:0;border-radius:10px;padding:10px 15px;font:800 16px inherit;cursor:pointer;background:#e5e7eb;color:#172033;text-decoration:none}.primary{background:var(--blue);color:#fff}.voice{background:var(--violet);color:#fff}.danger{background:#991b1b;color:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;font-weight:800;color:#64748b;margin:9px 0}.prompt,.passage{font-size:18px;background:#f8fafc;border-radius:12px;padding:16px;white-space:pre-wrap}.passage{max-height:48vh;overflow:auto}.blank-now{background:#fef3c7;color:#92400e;padding:2px 7px;border-radius:6px;font-weight:900}.options{display:grid;gap:9px;margin:14px 0}.option{border:2px solid #cbd5e1;background:#fff;border-radius:11px;padding:12px 14px;text-align:left;font:700 16px inherit;cursor:pointer}.option:hover{border-color:var(--blue)}.option.wrong{border-color:#fecaca;background:#fff1f2}.option.correct{border-color:#86efac;background:#f0fdf4}.feedback,.reference{padding:13px;border-radius:10px;margin:12px 0;font-weight:800;white-space:pre-wrap}.feedback.ok{background:#ecfdf3;color:var(--ok)}.feedback.bad{background:#fff1f2;color:var(--bad)}.reference{border:2px solid #bbf7d0;background:#f0fdf4}.translation{white-space:pre-wrap;background:#f8fafc;padding:16px;border-radius:12px;font-size:18px}.inline-input{width:150px;max-width:100%;font:inherit;padding:7px 9px;border:2px solid #94a3b8;border-radius:8px;margin:3px}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:#f5f3ff;margin:12px 0}.voice-result{background:#fff;border:1px solid #ddd6fe;padding:10px;border-radius:9px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat,.wrong-card{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong-card{margin:10px 0;background:#fff7f7;border-color:#fecaca}@media(max-width:620px){main{padding:8px}.hero,.card{padding:15px}.meta{display:block}.prompt,.passage,.translation{font-size:16px}}
</style></head><body><main><section class="hero"><h1>三民普高 B3R3｜詞彙選擇</h1><p class="muted">原題互動練習｜36 題｜四選一｜即時批改｜錯誤重填｜答對後完整句播放＋選做 STT｜錯題 DOCX｜成績登錄</p><div class="actions"><a class="btn" href="dashboard.html">← 回 Dashboard</a></div></section><section id="quiz" class="card"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="reference" class="reference hidden"></div><div id="voiceBox" class="voicebox hidden"><h3>🎙️ Pronunciation Check（選做）</h3><p><b id="voiceTarget"></b></p><div class="actions"><button id="speak" class="btn voice">🔊 再聽一次</button><button id="mic" class="btn primary">🎤 開始朗讀評分</button></div><div id="voiceResult" class="voice-result">尚未進行朗讀評分。</div></div><div class="actions"><button id="check" class="btn primary hidden">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束本輪</button></div></section><section id="result" class="card hidden"><h2>練習結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="download" class="btn primary">下載錯題 DOCX</button><button id="restart" class="btn">重新練習</button></div></section></main><script>
const QUIZ={"unit":"B3R3","kind":"mcq","title":"詞彙選擇","count":36,"data":[{"number":1,"prompt":"The _______ government decided to build a new hospital to help care for the sick from the nearby towns.","options":{"A":"genuine","B":"local","C":"persuasive","D":"single"},"answer":"B","sentence":"The local government decided to build a new hospital to help care for the sick from the nearby towns."},{"number":2,"prompt":"Read through the nutrition labels on the packages to avoid taking in _____ that are possibly harmful to your health.","options":{"A":"quarrels","B":"channels","C":"locals","D":"ingredients"},"answer":"D","sentence":"Read through the nutrition labels on the packages to avoid taking in ingredients that are possibly harmful to your health."},{"number":3,"prompt":"The kidnapper ______ the girl and surrendered to the police after his old mother begged him not to keep doing wrong things.","options":{"A":"released","B":"retained","C":"captured","D":"defeated"},"answer":"A","sentence":"The kidnapper released the girl and surrendered to the police after his old mother begged him not to keep doing wrong things."},{"number":4,"prompt":"One main ______ of Prague is that there are many towers. That is why Prague is called the “City of a Hundred Spires.”","options":{"A":"feature","B":"ingredient","C":"frame","D":"approach"},"answer":"A","sentence":"One main feature of Prague is that there are many towers. That is why Prague is called the “City of a Hundred Spires.”"},{"number":5,"prompt":"No one dares to disobey the ______ of this new general who is not only powerful but also strict.","options":{"A":"gestures","B":"crises","C":"approaches","D":"commands"},"answer":"D","sentence":"No one dares to disobey the commands of this new general who is not only powerful but also strict."},{"number":6,"prompt":"Kelly cleaned her room and took the things she didn’t want to the ______.","options":{"A":"dump","B":"crisis","C":"poison","D":"quarrel"},"answer":"A","sentence":"Kelly cleaned her room and took the things she didn’t want to the dump."},{"number":7,"prompt":"I do not mean to be ______, but the dish you prepared tasted too salty.","options":{"A":"nervous","B":"genuine","C":"practical","D":"offensive"},"answer":"D","sentence":"I do not mean to be offensive, but the dish you prepared tasted too salty."},{"number":8,"prompt":"Millions of refugees fleeing from Ukraine are in desperate need of food, water, and _______.","options":{"A":"equipment","B":"amusement","C":"shelter","D":"frame"},"answer":"C","sentence":"Millions of refugees fleeing from Ukraine are in desperate need of food, water, and shelter."},{"number":9,"prompt":"The old man says the secret to a long life is to live a(n) ______ life so that your biological rhythms can be steady.","options":{"A":"regular","B":"local","C":"rural","D":"economic"},"answer":"A","sentence":"The old man says the secret to a long life is to live a(n) regular life so that your biological rhythms can be steady."},{"number":10,"prompt":"The efficient manager decided to ______ the problem because it was not urgent at all.","options":{"A":"put aside","B":"cater to","C":"set off","D":"turn to"},"answer":"A","sentence":"The efficient manager decided to put aside the problem because it was not urgent at all."},{"number":11,"prompt":"The government has been trying hard to revive the ______ market with different economic policies.","options":{"A":"amusing","B":"surrounding","C":"domestic","D":"hollow"},"answer":"C","sentence":"The government has been trying hard to revive the domestic market with different economic policies."},{"number":12,"prompt":"It is reported that _______ meals can cause weight gain, so you had better not skip a meal again.","options":{"A":"offensive","B":"poisonous","C":"irregular","D":"nearby"},"answer":"C","sentence":"It is reported that irregular meals can cause weight gain, so you had better not skip a meal again."},{"number":13,"prompt":"Some doctors are ______ about the statistics of this new medical report. They advise that more studies be conducted.","options":{"A":"ambitious","B":"practical","C":"doubtful","D":"meaningful"},"answer":"C","sentence":"Some doctors are doubtful about the statistics of this new medical report. They advise that more studies be conducted."},{"number":14,"prompt":"Jean is too shy to say that she loves her husband out loud. She prefers to send a card or text to _____ her love.","options":{"A":"convey","B":"seek","C":"release","D":"spoil"},"answer":"A","sentence":"Jean is too shy to say that she loves her husband out loud. She prefers to send a card or text to convey her love."},{"number":15,"prompt":"Confucian moral values, such as benevolence and justice, have ______ in Chinese communities.","options":{"A":"broken out","B":"taken over","C":"taken part","D":"taken root"},"answer":"D","sentence":"Confucian moral values, such as benevolence and justice, have taken root in Chinese communities."},{"number":16,"prompt":"The soldier promised that he would protect his country and never ______ any of his fellows in the war field.","options":{"A":"sweep","B":"abandon","C":"release","D":"capture"},"answer":"B","sentence":"The soldier promised that he would protect his country and never abandon any of his fellows in the war field."},{"number":17,"prompt":"The new car is ______ with the best engine that is made in Germany.","options":{"A":"awaited","B":"devoted","C":"deserved","D":"equipped"},"answer":"D","sentence":"The new car is equipped with the best engine that is made in Germany."},{"number":18,"prompt":"Many people in this country are suffering from hunger because of the food shortage and economic _______.","options":{"A":"crisis","B":"slogan","C":"bunch","D":"switch"},"answer":"A","sentence":"Many people in this country are suffering from hunger because of the food shortage and economic crisis."},{"number":19,"prompt":"With the advance of technology, we should not _____ the danger of revealing personal information on the Internet.","options":{"A":"deserve","B":"overlook","C":"feature","D":"retain"},"answer":"B","sentence":"With the advance of technology, we should not overlook the danger of revealing personal information on the Internet."},{"number":20,"prompt":"The fire ______ the historically meaningful church. It must take a long time to repair it.","options":{"A":"chilled","B":"overlooked","C":"traced","D":"ruined"},"answer":"D","sentence":"The fire ruined the historically meaningful church. It must take a long time to repair it."},{"number":21,"prompt":"The baseball game was _____ because of the heavy rain. It will be postponed until this Saturday.","options":{"A":"called off","B":"turned to","C":"passed on","D":"sowed the seeds of"},"answer":"A","sentence":"The baseball game was called off because of the heavy rain. It will be postponed until this Saturday."},{"number":22,"prompt":"An imbalanced diet and irregular exercise can both _____ to a person’s poor health.","options":{"A":"pretend","B":"offer","C":"contribute","D":"giggle"},"answer":"C","sentence":"An imbalanced diet and irregular exercise can both contribute to a person’s poor health."},{"number":23,"prompt":"When speaking of Nike, the catchy _____ of “Just Do It.” always crosses people’s mind.","options":{"A":"border","B":"slogan","C":"trace","D":"claim"},"answer":"B","sentence":"When speaking of Nike, the catchy slogan of “Just Do It.” always crosses people’s mind."},{"number":24,"prompt":"It is a friendly _______ to invite your classmates to your birthday party.","options":{"A":"ingredient","B":"quotation","C":"declaration","D":"gesture"},"answer":"D","sentence":"It is a friendly gesture to invite your classmates to your birthday party."},{"number":25,"prompt":"The suspect arrested in the murder case _______ on her innocence. She kept saying that she didn’t kill the victim.","options":{"A":"insisted","B":"assured","C":"captured","D":"retained"},"answer":"A","sentence":"The suspect arrested in the murder case insisted on her innocence. She kept saying that she didn’t kill the victim."},{"number":26,"prompt":"The saying “A friend in need is a friend indeed.” means that a _____ friend will provide help when someone needs it.","options":{"A":"genuine","B":"meaningful","C":"rural","D":"practical"},"answer":"A","sentence":"The saying “A friend in need is a friend indeed.” means that a genuine friend will provide help when someone needs it."},{"number":27,"prompt":"The number of Taiwanese college students who go abroad for further studies is on the increase ______.","options":{"A":"on the way","B":"at home","C":"year after year","D":"in the dead of night"},"answer":"C","sentence":"The number of Taiwanese college students who go abroad for further studies is on the increase year after year."},{"number":28,"prompt":"The interviewer ______ at my certificate and said I would be employed.","options":{"A":"glimpsed","B":"sheltered","C":"contributed","D":"disputed"},"answer":"A","sentence":"The interviewer glimpsed at my certificate and said I would be employed."},{"number":29,"prompt":"Feel free to ______ me if you are in need because you are my friend.","options":{"A":"look after","B":"think through","C":"help out","D":"turn to"},"answer":"D","sentence":"Feel free to turn to me if you are in need because you are my friend."},{"number":30,"prompt":"Gina had her _____ fixed because the engine was broken.","options":{"A":"vehicle","B":"economy","C":"firework","D":"conflict"},"answer":"A","sentence":"Gina had her vehicle fixed because the engine was broken."},{"number":31,"prompt":"Thousands of ______ flock into the amusement park every day, making it one of the most famous attractions in Tokyo.","options":{"A":"channels","B":"slogans","C":"tourists","D":"conflicts"},"answer":"C","sentence":"Thousands of tourists flock into the amusement park every day, making it one of the most famous attractions in Tokyo."},{"number":32,"prompt":"The number of fish in the ocean suddenly _____ due to overfishing and climate change.","options":{"A":"chilled","B":"decreased","C":"approached","D":"pretended"},"answer":"B","sentence":"The number of fish in the ocean suddenly decreased due to overfishing and climate change."},{"number":33,"prompt":"The government donated over 1 billion NT dollars in emergency _____ to countries suffering from the horrible tsunami.","options":{"A":"shelter","B":"equipment","C":"aid","D":"anxiety"},"answer":"C","sentence":"The government donated over 1 billion NT dollars in emergency aid to countries suffering from the horrible tsunami."},{"number":34,"prompt":"The _______ for the factory workers’ strike was their low salary and long working hours.","options":{"A":"border","B":"curtain","C":"channel","D":"spark"},"answer":"D","sentence":"The spark for the factory workers’ strike was their low salary and long working hours."},{"number":35,"prompt":"In Greek mythology, Zeus is the king of all gods. It is believed that he can _____ the lives of all gods and mortals with his mighty power.","options":{"A":"insist","B":"switch","C":"offend","D":"dominate"},"answer":"D","sentence":"In Greek mythology, Zeus is the king of all gods. It is believed that he can dominate the lives of all gods and mortals with his mighty power."},{"number":36,"prompt":"I have been ______ the new project for several months, and I hope that it will be successful and bring in much money for my company.","options":{"A":"burning down","B":"working on","C":"running off","D":"setting off"},"answer":"B","sentence":"I have been working on the new project for several months, and I hope that it will be successful and bring in much money for my company."}]};const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let flat=[],index=0,wrong=new Map(),attempted=new Set(),firstTry=new Set(),recognition=null;
function flatten(){if(QUIZ.kind==='mcq')return QUIZ.data.map(x=>({...x,id:String(x.number)}));if(QUIZ.kind==='translation')return QUIZ.data.map(x=>({...x,id:String(x.number)}));return QUIZ.data.flatMap(set=>set.answers.map((answer,i)=>({id:`${set.set}-${i+1}`,set:set.set,passage:set.passage,options:set.options,answer,blank:i+1,sentence:set.sentences[i],structure:set.structure})))}
function fillPassage(text,answers,options){let out=text;answers.forEach((a,i)=>{const word=options[a];const n=i+1;const pats=[new RegExp(`__\\(?${n}\\)?__`),new RegExp(`__${n}__`),new RegExp(`　${n}　`),new RegExp(`\\(${n}\\)`)];for(const p of pats){if(p.test(out)){out=out.replace(p,word);break}}});return out.replace(/\n+/g,' ').replace(/\s+/g,' ').trim()}
function markBlank(text,n){const tag=`<span class="blank-now">Blank ${n}</span>`;let out=esc(text),done=false;for(const p of [new RegExp(`__\\(?${n}\\)?__`),new RegExp(`__${n}__`),new RegExp(`　${n}　`),new RegExp(`\\(${n}\\)`)]){if(!done&&p.test(out)){out=out.replace(p,tag);done=true}}return out}
function norm(s){return String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ')}function speak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}
function show(){try{recognition?.abort()}catch(e){}speechSynthesis?.cancel();const q=flat[index];$('#meta').textContent=`第 ${index+1} / ${flat.length} 題`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=((index+1)/flat.length*100)+'%';$('#feedback').className='feedback hidden';$('#reference').classList.add('hidden');$('#voiceBox').classList.add('hidden');$('#next').classList.add('hidden');$('#check').classList.toggle('hidden',QUIZ.kind!=='translation');$('#answerArea').innerHTML='';if(QUIZ.kind==='mcq')renderChoice(q.prompt,q.options);else if(QUIZ.kind==='translation')renderTranslation(q);else{$('#question').innerHTML=`<div class="passage">${markBlank(q.passage,q.blank)}</div>`;renderChoice(`第 ${q.blank} 格`,q.options)}}
function renderChoice(prompt,options){$('#question').innerHTML=QUIZ.kind==='mcq'?`<div class="prompt">${esc(prompt)}</div>`:$('#question').innerHTML;$('#answerArea').innerHTML='<div class="options">'+Object.entries(options).map(([k,v])=>`<button class="option" data-key="${k}"><b>${k}.</b> ${esc(v)}</button>`).join('')+'</div>';document.querySelectorAll('.option').forEach(b=>b.onclick=()=>checkChoice(b.dataset.key,b))}
function renderTranslation(q){let i=0;const rendered=esc(q.prompt).replace(/_{3,}/g,()=>`<input class="inline-input" data-i="${i++}" aria-label="第 ${i} 格答案">`);$('#question').innerHTML=`<div class="translation">${rendered}</div>`;setTimeout(()=>document.querySelector('.inline-input')?.focus(),0)}
function recordWrong(q,value){if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(value);$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
function checkChoice(key,button){const q=flat[index];attempted.add(q.id);if(key!==q.answer){recordWrong(q,key);button.classList.add('wrong');$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 不正確，請再試一次。';return}if(!wrong.has(q.id))firstTry.add(q.id);document.querySelectorAll('.option').forEach(b=>b.disabled=true);button.classList.add('correct');pass(q)}
function checkTranslation(){const q=flat[index],values=[...document.querySelectorAll('.inline-input')].map(x=>x.value);attempted.add(q.id);const ok=values.length===q.answers.length&&values.every((v,i)=>norm(v)===norm(q.answers[i]));if(!ok){recordWrong(q,values.join(' / '));$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 尚有空格不正確，請修正後再檢查。';return}if(!wrong.has(q.id))firstTry.add(q.id);document.querySelectorAll('.inline-input').forEach(x=>x.disabled=true);pass(q)}
function pass(q){$('#feedback').className='feedback ok';$('#feedback').textContent='✅ 正確！';$('#reference').classList.remove('hidden');$('#reference').textContent='完整句：'+q.sentence;$('#check').classList.add('hidden');$('#next').classList.remove('hidden');$('#voiceBox').classList.remove('hidden');$('#voiceTarget').textContent=q.sentence;$('#voiceResult').className='voice-result';$('#voiceResult').textContent='尚未進行朗讀評分。';speak(q.sentence)}
function similarity(a,b){a=norm(a).replace(/[^a-z0-9' ]/g,'').split(' ').filter(Boolean);b=norm(b).replace(/[^a-z0-9' ]/g,'').split(' ').filter(Boolean);const used=new Set;let hit=0;for(const w of a){const j=b.findIndex((x,i)=>x===w&&!used.has(i));if(j>=0){hit++;used.add(j)}}return Math.round(100*hit/Math.max(a.length,b.length,1))}
function startMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('#voiceResult').textContent='此瀏覽器不支援語音辨識，建議使用 Chrome。';return}recognition=new SR;recognition.lang='en-US';recognition.interimResults=false;$('#voiceResult').textContent='正在聆聽，請朗讀完整句子…';recognition.onresult=e=>{const said=e.results[0][0].transcript,target=flat[index].sentence,score=similarity(target,said);$('#voiceResult').className='voice-result '+(score>=80?'good':'retry');$('#voiceResult').textContent=`辨識：${said}\n正確率：${score}%`};recognition.onerror=e=>$('#voiceResult').textContent='語音辨識未完成：'+e.error;recognition.start()}
function finish(){try{recognition?.abort()}catch(e){}speechSynthesis?.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');const rows=[...wrong.values()];$('#summary').innerHTML=`<div class="stat">實際作答<b>${attempted.size}</b></div><div class="stat">一次答對<b>${firstTry.size}</b></div><div class="stat">曾答錯<b>${rows.length}</b></div>`;$('#wrongList').innerHTML=rows.length?rows.map((r,i)=>`<div class="wrong-card"><b>${i+1}. 第 ${esc(r.q.id)} 題</b><p>${esc(r.q.prompt||`第 ${r.q.blank} 格`)}</p><p>作答：${r.attempts.map(esc).join('；')}</p><p>答案：${esc(r.q.answer||r.q.answers.join(' / '))}</p></div>`).join(''):(attempted.size?'<div class="feedback ok">🎉 本輪全部一次答對！</div>':'<p class="muted">本輪尚未作答，因此不登錄成績。</p>');$('#download').classList.toggle('hidden',!rows.length);if(attempted.size)document.dispatchEvent(new CustomEvent('quiz-result-ready',{detail:{total:attempted.size,correct:firstTry.size,wrong:rows.length,mistakeQuestionNumbers:rows.map(r=>r.q.id).join(', ')}}))}
$('#check').onclick=checkTranslation;$('#next').onclick=()=>{if(++index>=flat.length)finish();else show()};$('#finish').onclick=finish;$('#restart').onclick=()=>location.reload();$('#speak').onclick=()=>speak(flat[index].sentence);$('#mic').onclick=startMic;$('#download').onclick=async()=>{const rows=[...wrong.values()];if(!rows.length)return;try{if(!window.docx)await new Promise((ok,fail)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js';s.onload=ok;s.onerror=fail;document.head.append(s)});const{Document,Packer,Paragraph,HeadingLevel}=window.docx,children=[new Paragraph({text:`三民普高 ${QUIZ.unit} ${QUIZ.title} 錯題紀錄`,heading:HeadingLevel.TITLE})];rows.forEach(r=>children.push(new Paragraph({text:`第 ${r.q.id} 題`,heading:HeadingLevel.HEADING_2}),new Paragraph(r.q.prompt||r.q.passage||''),new Paragraph('作答：'+r.attempts.join('；')),new Paragraph('答案：'+(r.q.answer||r.q.answers.join(' / ')))));const blob=await Packer.toBlob(new Document({sections:[{children}]})),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Sanmin_${QUIZ.unit}_${QUIZ.kind}_錯題.docx`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){alert('目前無法產生 DOCX，請稍後再試。')}};flat=flatten();show();
</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
