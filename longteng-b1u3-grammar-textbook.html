  <script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 3｜文法選擇（課本句型）","mode":"mcq","questions":[{"id":1,"question":"I am not sure ____________ for our next vacation. We haven’t decided yet.","options":["how should we go","what can we do","which city are we going to","where we will go"],"answer":3,"source":"三合一學習手冊","explanation":"正確答案為 where we will go；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":2,"question":"Nobody told me ____________, so I went online and looked for the information I needed.","options":["where was the train station","how I could get to the train station","which bus can I take to the train station","what do I need to do to get to the train station"],"answer":1,"source":"三合一學習手冊","explanation":"正確答案為 how I could get to the train station；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":3,"question":"I plan to visit the aquarium by bus, but I don’t know ____________.","options":["what the bus is","what I can take the bus","where is the bus","where the nearest bus stop is"],"answer":3,"source":"龍騰自命題","explanation":"本題考S + V + 名詞子句(wh- + S + V)的句型。此句型中的名詞子句要用直述句","explanationSource":"source"},{"id":4,"question":"Could you please tell me ____________ I can do to help the poor lady?","options":["how","that","what","when"],"answer":2,"source":"龍騰自命題","explanation":"若是要選擇how，句子要改成Could you please tell me how to help the poor lady?","explanationSource":"source"},{"id":5,"question":"Do you know ____________?","options":["when is the singer going to release her album","where is the singer holding the concert","when the singer’s album will be released","where the singer’s concert be held"],"answer":2,"source":"龍騰自命題","explanation":"本題考S + V + 名詞子句(wh- + S + V)的句型。此句型中的名詞子句要用直述句。where the singer’s concert be held應改成where the singer’s concert will be held才對","explanationSource":"source"},{"id":6,"question":"Can you recall ____________?","options":["what happened to your little sister","how did the event happen","when did your mother cook the dinner","where you go this morning"],"answer":0,"source":"龍騰自命題","explanation":"本題考S + V + 名詞子句(wh- + S + V)的句型。此句型中的名詞子句要用直述句。where you go this morning時態有誤，要改成where you went this morning才對","explanationSource":"source"},{"id":7,"question":"I kept wondering ____________.","options":["why couldn’t he love me as I loved him","how Mary solved the difficult problem","what could I do to make things better","when should I apply for the job"],"answer":1,"source":"龍騰自命題","explanation":"本題考S + V + 名詞子句(wh- + S + V)的句型。此句型中的名詞子句要用直述句","explanationSource":"source"},{"id":8,"question":"This letter ____________ in French. I can’t understand it.","options":["writes","is writing","wrote","was written"],"answer":3,"source":"三合一學習手冊","explanation":"正確答案為 was written；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":9,"question":"This location ____________ by the photographer to provide a beautiful background for the picture.","options":["selected","selecting","was selected","was selecting"],"answer":2,"source":"三合一學習手冊","explanation":"正確答案為 was selected；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":10,"question":"My sister and I were being chased ____________ a big dog on our way home today.","options":["with","for","to","by"],"answer":3,"source":"龍騰自命題","explanation":"被動式句型S + be + p.p. (+ by + O)....","explanationSource":"source"},{"id":11,"question":"The fire was ____________ by the firefighters, and fortunately, no one was injured.","options":["put out","putting out","had put out","to put out"],"answer":0,"source":"龍騰自命題","explanation":"被動式句型S + be + p.p. (+ by + O)....","explanationSource":"source"},{"id":12,"question":"The old mansion was ____________ by the wealthy businessman. He was the only person that could afford it.","options":["buy","buying","bought","to buy"],"answer":2,"source":"龍騰自命題","explanation":"被動式句型S + be + p.p. (+ by + O)....","explanationSource":"source"},{"id":13,"question":"The car was already ____________ with gas, so we were ready to begin our road trip across the country.","options":["filled","filling","being filled","being filling"],"answer":0,"source":"龍騰自命題","explanation":"被動式句型S + be + p.p. (+ by + O)....","explanationSource":"source"},{"id":14,"question":"My room always looks tidy because it ____________ by me almost every day.","options":["is cleaning","cleans","is cleaned","is to clean"],"answer":2,"source":"龍騰自命題","explanation":"被動式句型S + be + p.p. (+ by + O)....","explanationSource":"source"}]};</script>
