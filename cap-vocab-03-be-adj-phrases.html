<script>window.QUIZ_CONFIG={"title": "國中會考單字片語｜be動詞+形容詞片語 be + Adjective Phrases", "mode": "mcq", "questions": [{"id": 1, "question": "We ______ the news that our favorite shop closed so suddenly.", "options": ["were surprised at", "were rich in", "were in the shape of", "were proud of"], "answer": 0, "answerLabel": "A", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(A) were surprised at\n【用語】be surprised at + N (adj.phr.)：對……感到驚訝\n【中譯】我們對我們最喜歡的店突然關門的消息感到驚訝。", "explanationSource": "supplemental"}, {"id": 2, "question": "Mike was very tired, but he ______ help me carry the heavy boxes because he is a kind boy.", "options": ["was willing to", "was supposed to", "was used to", "was about to"], "answer": 0, "answerLabel": "A", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(A) was willing to\n【用語】be willing to + VR (adj.phr.)：願意\n【中譯】Mike很累，但因為他是個善良的男孩，他願意幫我搬重箱子。", "explanationSource": "supplemental"}, {"id": 3, "question": "We didn't have a map, so we ______ in the big city.", "options": ["were wild", "got better", "got lost", "were in good order"], "answer": 2, "answerLabel": "C", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(C) got lost\n【用語】get lost (adj.phr.)：迷路\n【中譯】我們沒有地圖，所以我們在大城市裡迷路了。", "explanationSource": "supplemental"}, {"id": 4, "question": "This big knife ______ cutting bread, not meat.", "options": ["is bored with", "is used for", "gets excited about", "is scared of"], "answer": 1, "answerLabel": "B", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(B) is used for\n【用語】物 + be used for + N/V-ing (adj.phr.)：某物被用來做…\n【中譯】這把大刀是用來切麵包的，不是用來切肉的。", "explanationSource": "supplemental"}, {"id": 5, "question": "We ______ when the magician pulled a rabbit out of his empty hat.", "options": ["were under pressure", "were amazed", "were broke", "were grounded"], "answer": 1, "answerLabel": "B", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(B) were amazed\n【用語】be amazed (adj.phr.)：感到驚奇、驚訝\n【中譯】當魔術師從他的空帽子裡拉出一隻兔子時，我們感到很驚奇。", "explanationSource": "supplemental"}, {"id": 6, "question": "You are still in your pajamas, so hurry up and ______ for school.", "options": ["get dressed", "get worse", "get hurt", "get better"], "answer": 0, "answerLabel": "A", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(A) get dressed\n【用語】get dressed (adj.phr.)：穿好衣服\n【中譯】你還穿著睡衣，所以快點穿好衣服準備上學。", "explanationSource": "supplemental"}, {"id": 7, "question": "My brother ______ space, so he reads books about stars and planets every night.", "options": ["is full of", "is frightened of", "is interested in", "is different from"], "answer": 2, "answerLabel": "C", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(C) is interested in\n【用語】be interested in + N/V-ing (adj.phr.)：對……感興趣\n【中譯】我哥哥對太空很感興趣，所以他每天晚上都讀有關星星和行星的書。", "explanationSource": "supplemental"}, {"id": 8, "question": "The students ______ the good news that there is no homework this weekend.", "options": ["were happy about", "were absent from", "were used to", "were made of"], "answer": 0, "answerLabel": "A", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(A) were happy about\n【用語】be happy/glad about + N (adj.phr.)：為…高興\n【中譯】學生們為這個週末沒有作業的好消息感到高興。", "explanationSource": "supplemental"}, {"id": 9, "question": "Grandpa ______ gardening, so he works in his garden every day.", "options": ["is fond of", "is absent from", "is short of", "is called"], "answer": 0, "answerLabel": "A", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(A) is fond of\n【用語】be fond of + N/V-ing (adj.phr.)：喜愛、喜歡\n【中譯】爺爺很喜愛園藝，所以他每天都在花園裡工作。", "explanationSource": "supplemental"}, {"id": 10, "question": "Lisa ______ school activities; she joins the music club, the art club, and the basketball team.", "options": ["is junior to", "is made in", "is active in", "is free of"], "answer": 2, "answerLabel": "C", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(C) is active in\n【用語】be active in + N/V-ing (adj.phr.)：在…很積極主動\n【中譯】Lisa在學校活動中很積極主動；她參加了音樂社、美術社和籃球隊。", "explanationSource": "supplemental"}, {"id": 11, "question": "My twin sister and I look alike, but her hobbies ______ mine.", "options": ["are made from", "are sorry about", "are popular with", "are different from"], "answer": 3, "answerLabel": "D", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(D) are different from\n【用語】be different from + N (adj.phr.)：和……不同\n【中譯】我和我的雙胞胎姊姊長得很像，但她的嗜好和我的不同。", "explanationSource": "supplemental"}, {"id": 12, "question": "Many people cried because they ______ the sad story of the old dog.", "options": ["were moved by", "were made in", "were serious about", "were seen as"], "answer": 0, "answerLabel": "A", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(A) were moved by\n【用語】be moved by + N (adj.phr.)：被……感動\n【中譯】許多人哭了，因為他們被那隻老狗的悲傷故事感動了。", "explanationSource": "supplemental"}, {"id": 13, "question": "Our school ______ the MRT station, so we can walk there in two minutes.", "options": ["is angry with", "is proud of", "is sure of", "is close to"], "answer": 3, "answerLabel": "D", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(D) is close to\n【用語】be close to + N (adj.phr.)：接近…\n【中譯】我們學校很接近捷運站，所以我們走兩分鐘就能到那裡。", "explanationSource": "supplemental"}, {"id": 14, "question": "The singer's voice was so beautiful that everyone in the hall ______.", "options": ["was embarrassed", "was in danger", "was blown away", "was on a diet"], "answer": 2, "answerLabel": "C", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(C) was blown away\n【用語】be blown away (adj.phr.)：驚訝不已；大為震撼\n【中譯】那位歌手的歌聲如此美妙，以至於大廳裡的每個人都大為震撼。", "explanationSource": "supplemental"}, {"id": 15, "question": "The heavy rain ______ the car accident on the highway this morning.", "options": ["was fond of", "was aware of", "was satisfied with", "was responsible for"], "answer": 3, "answerLabel": "D", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(D) was responsible for\n【用語】be responsible for + N (adj.phr.)：造成……的原因\n【中譯】大雨是今天早上高速公路上那場車禍的原因。", "explanationSource": "supplemental"}, {"id": 16, "question": "Little Tommy ______ everything around him, so he always asks, \"Why?\"", "options": ["is made of", "is late for", "is popular with", "is curious about"], "answer": 3, "answerLabel": "D", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(D) is curious about\n【用語】be curious about + N (adj.phr.)：對……感到好奇\n【中譯】小Tommy對他周圍的一切都感到好奇，所以他總是問：「為什麼？」", "explanationSource": "supplemental"}, {"id": 17, "question": "I have eaten noodles every day for a month, and I ______ them now.", "options": ["am tired of", "am famous for", "am nervous about", "am junior to"], "answer": 0, "answerLabel": "A", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(A) am tired of\n【用語】be tired of + N/V-ing (adj.phr.)：對……感到厭倦\n【中譯】我已經連續一個月每天吃麵，現在我對麵感到厭倦了。", "explanationSource": "supplemental"}, {"id": 18, "question": "I ______ my teacher for her help with my English.", "options": ["am similar to", "am junior to", "am thankful to", "am late for"], "answer": 2, "answerLabel": "C", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(C) am thankful to\n【用語】be thankful to + 人 + for + N (adj.phr.)：為了某事感謝某人\n【中譯】我為了老師在英文上給我的幫助而感謝她。", "explanationSource": "supplemental"}, {"id": 19, "question": "Kevin played the same video game every day for months, and finally he ______ it and stopped playing.", "options": ["got married to", "got tired of", "was covered with", "was rich in"], "answer": 1, "answerLabel": "B", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(B) got tired of\n【用語】get tired of + N/V-ing (adj.phr.)：對…感到厭倦\n【中譯】Kevin好幾個月每天都玩同一款電玩，最後他對它感到厭倦，不再玩了。", "explanationSource": "supplemental"}, {"id": 20, "question": "Ms. Wang ______ a doctor, and they have two children.", "options": ["is superior to", "is new to", "is tired from", "is married to"], "answer": 3, "answerLabel": "D", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(D) is married to\n【用語】be married to + 人 (adj.phr.)：嫁給…、和…結婚\n【中譯】王小姐嫁給了一位醫生，他們有兩個孩子。", "explanationSource": "supplemental"}, {"id": 21, "question": "Ben had a bad cold, so he ______ school yesterday.", "options": ["was dressed in", "was absent from", "was known to", "was aware of"], "answer": 1, "answerLabel": "B", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(B) was absent from\n【用語】be absent from + N (adj.phr.)：缺席\n【中譯】Ben得了重感冒，所以他昨天沒去上學（缺席）。", "explanationSource": "supplemental"}, {"id": 22, "question": "My new backpack ______ yours, so I put my name on it to tell them apart.", "options": ["is busy with", "is the same as", "is angry with", "is afraid of"], "answer": 1, "answerLabel": "B", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(B) is the same as\n【用語】be the same as + N (adj.phr.)：和……一樣\n【中譯】我的新背包和你的一樣，所以我在上面寫了名字來區分它們。", "explanationSource": "supplemental"}, {"id": 23, "question": "The waiter asked us, \"Are you ______ order now, or do you need more time?\"", "options": ["sure to", "ready to", "likely to", "used to"], "answer": 1, "answerLabel": "B", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(B) ready to\n【用語】be ready to + VR (adj.phr.)：準備好做某事\n【中譯】服務生問我們：「你們準備好要點餐了嗎，還是需要多一點時間？」", "explanationSource": "supplemental"}, {"id": 24, "question": "Jack just moved here last week, so he ______ this town and often asks for directions.", "options": ["is covered with", "is good at", "is new to", "is junior to"], "answer": 2, "answerLabel": "C", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(C) is new to\n【用語】be new to + N (adj.phr.)：對…不熟、沒經驗\n【中譯】Jack上週才搬來這裡，所以他對這個城鎮不熟，常常問路。", "explanationSource": "supplemental"}, {"id": 25, "question": "The judges ______ Amy's beautiful singing and gave her first prize.", "options": ["were free of", "were impressed by", "were short of", "were rich in"], "answer": 1, "answerLabel": "B", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(B) were impressed by\n【用語】be impressed by + N (adj.phr.)：對……印象深刻\n【中譯】評審們對Amy美妙的歌聲印象深刻，給了她第一名。", "explanationSource": "supplemental"}, {"id": 26, "question": "Mr. Chen has worked at this school for twenty years, so he ______ most of the other teachers.", "options": ["is late for", "is busy with", "is senior to", "is junior to"], "answer": 2, "answerLabel": "C", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(C) is senior to\n【用語】be senior to + 人 (adj.phr.)：比…年長、資深\n【中譯】陳老師在這所學校工作了二十年，所以他比大部分其他老師資深。", "explanationSource": "supplemental"}, {"id": 27, "question": "I have studied every night this week, so I ______ tomorrow's math test.", "options": ["am popular with", "am made from", "am ready for", "am similar to"], "answer": 2, "answerLabel": "C", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(C) am ready for\n【用語】be ready for + N (adj.phr.)：為…準備好了\n【中譯】我這週每天晚上都在讀書，所以我已經為明天的數學考試準備好了。", "explanationSource": "supplemental"}, {"id": 28, "question": "This bike ______ Taiwan, and it is sold all over the world.", "options": ["was made of", "was made from", "was made in", "was known as"], "answer": 2, "answerLabel": "C", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(C) was made in\n【用語】be made in + 地方 (adj.phr.)：在…地方製造\n【中譯】這輛腳踏車是在台灣製造的，而且銷售到全世界。", "explanationSource": "supplemental"}, {"id": 29, "question": "Hot pot ______ my American friend, so I showed him how to cook the meat.", "options": ["is senior to", "is careful about", "is foreign to", "is free of"], "answer": 2, "answerLabel": "C", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(C) is foreign to\n【用語】be foreign to + 人 (adj.phr.)：對……陌生的\n【中譯】火鍋對我的美國朋友來說很陌生，所以我教他怎麼煮肉。", "explanationSource": "supplemental"}, {"id": 30, "question": "Taiwan ______ its bubble tea, and many tourists want to try it.", "opti phr.)：穿某種顏色的衣服\n【中譯】在派對上，麗莎穿著紅色的衣服。她看起來像一朵美麗的花。", "explanationSource": "supplemental"}, {"id": 50, "question": "The weather ______ in the afternoon. It started to rain hard, and the wind was very strong.", "options": ["got hurt", "got worse", "got better", "got lost"], "answer": 1, "answerLabel": "B", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(B) got worse\n【用語】get worse (adj.phr.)：變糟\n【中譯】下午天氣變糟了。開始下起大雨，而且風非常強。", "explanationSource": "supplemental"}, {"id": 51, "question": "Dinosaurs ______ millions of years ago, but today we can only see their bones in museums.", "options": ["were embarrassed", "were around", "were broke", "were sold out"], "answer": 1, "answerLabel": "B", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(B) were around\n【用語】be around (adj.phr.)：存在\n【中譯】恐龍存在於數百萬年前，但今天我們只能在博物館裡看到牠們的骨頭。", "explanationSource": "supplemental"}, {"id": 52, "question": "The movie ______ a true story about a little boy and his dog.", "options": ["is afraid of", "is based on", "is good for", "is used to"], "answer": 1, "answerLabel": "B", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(B) is based on\n【用語】be based on + N (adj.phr.)：以……為基礎、依據\n【中譯】這部電影是根據一個關於小男孩和他的狗的真實故事改編的。", "explanationSource": "supplemental"}, {"id": 53, "question": "I ______ eating instant noodles every day. I want some real food!", "options": ["am sick and tired of", "am proud of", "am curious about", "am serious about"], "answer": 0, "answerLabel": "A", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(A) am sick and tired of\n【用語】be sick and tired of + N/V-ing (adj.phr.)：厭倦某事\n【中譯】我厭倦每天吃泡麵了。我想吃一些真正的食物！", "explanationSource": "supplemental"}, {"id": 54, "question": "Mr. Chen parked his car in the wrong place, so he ______. He had to pay 1,200 dollars.", "options": ["was fined", "was amazed", "was through", "was on a diet"], "answer": 0, "answerLabel": "A", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(A) was fined\n【用語】be fined (adj.phr.)：被罰款\n【中譯】陳先生把車停在錯誤的地方，所以他被罰款了。他必須付一千二百元。", "explanationSource": "supplemental"}, {"id": 55, "question": "Please ______ crossing the street here. The cars on this road go very fast.", "options": ["be careful about", "be sick of", "be busy", "be disgusted with"], "answer": 0, "answerLabel": "A", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(A) be careful about\n【用語】be careful about + N/V-ing (adj.phr.)：對……小心\n【中譯】在這裡過馬路請小心。這條路上的車開得很快。", "explanationSource": "supplemental"}, {"id": 56, "question": "I ______ my math test score. I studied very hard, but I only got 60.", "options": ["was satisfied with", "was disappointed with", "got involved in", "was famous for"], "answer": 1, "answerLabel": "B", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(B) was disappointed with\n【用語】be disappointed with/at + N (adj.phr.)：對……感到失望\n【中譯】我對我的數學考試成績感到失望。我很努力讀書，但只考了六十分。", "explanationSource": "supplemental"}, {"id": 57, "question": "My parents ______ this weekend, so I am staying at Grandma's house.", "options": ["are in danger", "are embarrassed", "are on a diet", "are away from home"], "answer": 3, "answerLabel": "D", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(D) are away from home\n【用語】be away from home (adj.phr.)：不在家\n【中譯】我爸媽這個週末不在家，所以我住在奶奶家。", "explanationSource": "supplemental"}, {"id": 58, "question": "After the heavy snow last night, our car ______ snow. Dad had to clean it before he drove to work.", "options": ["was made of", "was like", "was sorry for", "was covered with"], "answer": 3, "answerLabel": "D", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(D) was covered with\n【用語】be covered with + N (adj.phr.)：被……覆蓋\n【中譯】昨晚下了大雪之後，我們的車被雪覆蓋了。爸爸開車去上班前必須把它清乾淨。", "explanationSource": "supplemental"}, {"id": 59, "question": "Everyone ______ the news. The old bridge fell down in the storm last night.", "options": ["was shocked at", "was famous as", "was similar to", "was good at"], "answer": 0, "answerLabel": "A", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(A) was shocked at\n【用語】be shocked at + N (adj.phr.)：對……感到震驚\n【中譯】每個人都對這個消息感到震驚。那座老橋昨晚在暴風雨中倒塌了。", "explanationSource": "supplemental"}, {"id": 60, "question": "My aunt ______ a doctor last month. They had a big wedding in Taichung.", "options": ["was superior to", "was close to", "got mad at", "got married to"], "answer": 3, "answerLabel": "D", "source": "be動詞+形容詞片語 be + Adjective Phrases", "explanation": "【答案】(D) got married to\n【用語】get married to + 人 (adj.phr.)：和…結婚\n【中譯】我阿姨上個月和一位醫生結婚了。他們在台中舉辦了一場盛大的婚禮。", "explanationSource": "supplemental"}]};</script><script>window.LEARN_DATA=[{"g": "", "t": "be able to + VR", "p": "(adj.phr.)", "e": "can do something", "z": "能、能夠", "s": "After practicing every day for three months, my little brother _____ _____ _____ ride his bike without any help.", "c": "每天練習了三個月後，我弟弟終於【能夠】不靠任何幫助自己騎腳踏車了。", "f": "After practicing every day for three months, my little brother was able to ride his bike without any help."}, {"g": "", "t": "be about to + VR", "p": "(adj.phr.)", "e": "going to do something very soon", "z": "即將、正要", "s": "We _____ _____ _____ leave for the beach when it suddenly started to rain, so we stayed home and played cards instead.", "c": "我們【正要】出發去海邊時，突然開始下雨，所以我們改成待在家裡玩撲克牌。", "f": "We were about to leave for the beach when it suddenly started to rain, so we stayed home and played cards instead."}, {"g": "", "t": "be absent from + N", "p": "(adj.phr.)", "e": "not be at a place like school", "z": "缺席", "s": "Kevin _____ _____ _____ class yesterday because he had a high fever, so his friend brought him the homework.", "c": "凱文昨天上課【缺席】，因為他發高燒，所以他的朋友把作業帶給他。", "f": "Kevin was absent from class yesterday because he had a high fever, so his friend brought him the homework."}, {"g": "", "t": "be active in + N/V-ing", "p": "(adj.phr.)", "e": "take part in something with lots of energy", "z": "在…很積極主動", "s": "Irene _____ very _____ _____ school clubs, and she joins the dance club and the English club every week.", "c": "艾琳【很積極參與】學校社團，她每週都參加舞蹈社和英文社。", "f": "Irene is very active in school clubs, and she joins the dance club and the English club every week."}, {"g": "", "t": "be afraid of + N/V-ing", "p": "(adj.phr.)", "e": "to feel fear about something", "z": "害怕……", "s": "My little brother _____ _____ _____ big dogs, so he always holds my hand tightly when we walk past our neighbor's house.", "c": "我弟弟【害怕】大狗，所以每次我們經過鄰居家時，他總是緊緊牽著我的手。", "f": "My little brother is afraid of big dogs, so he always holds my hand tightly when we walk past our neighbor's house."}, {"g": "", "t": "be amazed", "p": "(adj.phr.)", "e": "to feel very surprised in a good way", "z": "感到驚奇、驚訝", "s": "When we got to the top of Yushan, we _____ _____ because the sunrise over the clouds was so beautiful.", "c": "當我們登上玉山山頂時，我們【感到非常驚奇】，因為雲海上的日出實在太美了。", "f": "When we got to the top of Yushan, we were amazed because the sunrise over the clouds was so beautiful."}, {"g": "", "t": "be angry at + 事", "p": "(adj.phr.)", "e": "feel mad because of something", "z": "為某事生氣", "s": "Mr. Lin _____ _____ _____ the noise in the hallway, so he closed the classroom door and asked us to stop talking.", "c": "林老師因為走廊上的噪音【很生氣】，所以他關上教室門，要我們停止講話。", "f": "Mr. Lin was angry at the noise in the hallway, so he closed the classroom door and asked us to stop talking."}, {"g": "", "t": "be angry with + 人", "p": "(adj.phr.)", "e": "to feel mad at someone", "z": "生…的氣", "s": "Mom _____ _____ _____ my little brother because he broke her favorite cup and didn't tell her the truth.", "c": "媽媽【生】我弟弟【的氣】，因為他打破了她最喜歡的杯子，而且沒跟她說實話。", "f": "Mom was angry with my little brother because he broke her favorite cup and didn't tell her the truth."}, {"g": "", "t": "be around", "p": "(adj.phr.)", "e": "to exist; to be alive or there", "z": "存在", "s": "Dinosaurs _____ _____ millions of years ago, but now we can only see their bones in museums like the one in Taichung.", "c": "恐龍在幾百萬年前就【存在】了，但現在我們只能在像台中那樣的博物館看到牠們的骨頭。", "f": "Dinosaurs were around millions of years ago, but now we can only see their bones in museums like the one in Taichung."}, {"g": "", "t": "be aware of + N/V-ing", "p": "(adj.phr.)", "e": "know or notice something", "z": "意識到……", "s": "Many people _____ not _____ _____ how much sugar is in bubble tea, so they drink it every day without worrying.", "c": "很多人沒有【意識到】珍珠奶茶裡有多少糖，所以他們每天喝也不擔心。", "f": "Many people are not aware of how much sugar is in bubble tea, so they drink it every day without worrying."}, {"g": "", "t": "be away", "p": "(adj.phr.)", "e": "not at home or not here for some time", "z": "離開；不在的", "s": "My parents _____ _____ on a business trip this week, so my aunt is cooking dinner for us.", "c": "我爸媽這週出差【不在家】，所以阿姨在幫我們煮晚餐。", "f": "My parents are away on a business trip this week, so my aunt is cooking dinner for us."}, {"g": "", "t": "be away from home", "p": "(adj.phr.)", "e": "to not be at your house for some time", "z": "不在家", "s": "My dad will _____ _____ _____ _____ for two weeks on a business trip, so we will call him every night.", "c": "爸爸要出差兩週【不在家】，所以我們每晚都會打電話給他。", "f": "My dad will be away from home for two weeks on a business trip, so we will call him every night."}, {"g": "", "t": "be based on + N", "p": "(adj.phr.)", "e": "use something as a starting point", "z": "以……為基礎、依據", "s": "The new cartoon movie _____ _____ _____ a famous Japanese story, so my friends and I went to see it on its first day.", "c": "這部新的卡通電影是【根據】一個有名的日本故事改編的，所以我和朋友在首映日就去看了。", "f": "The new cartoon movie is based on a famous Japanese story, so my friends and I went to see it on its first day."}, {"g": "", "t": "be blown away", "p": "(adj.phr.)", "e": "to be very surprised and impressed", "z": "驚訝不已；大為震撼", "s": "The first time I saw the Taipei 101 fireworks on New Year's Eve, I _____ _____ _____ because they were so beautiful.", "c": "我第一次在跨年夜看到台北101的煙火時，因為實在太美了，我【大為震撼】。", "f": "The first time I saw the Taipei 101 fireworks on New Year's Eve, I was blown away because they were so beautiful."}, {"g": "", "t": "be bored with + N", "p": "(adj.phr.)", "e": "to lose interest because something is not fun", "z": "對……感到無聊、厭煩", "s": "After two hours at home, the kids _____ _____ _____ their video games, so they went to the park to play basketball.", "c": "在家待了兩個小時後，孩子們【對電動遊戲感到厭煩】，所以他們去公園打籃球。", "f": "After two hours at home, the kids were bored with their video games, so they went to the park to play basketball."}, {"g": "", "t": "be broke", "p": "(adj.phr.)", "e": "having no money at all", "z": "身無分文的；破產的", "s": "I _____ _____ this week because I spent all my pocket money on games, so I can't go to the movies.", "c": "我這週【身無分文】，因為我把零用錢全花在遊戲上了，所以不能去看電影。", "f": "I am broke this week because I spent all my pocket money on games, so I can't go to the movies."}, {"g": "", "t": "be busy + V-ing", "p": "(adj.phr.)", "e": "spending all your time doing something", "z": "忙於做某事", "s": "The students _____ _____ cleaning the classroom when the principal came in, so nobody noticed him at first.", "c": "校長進來的時候，學生們正【忙著】打掃教室，所以一開始沒有人注意到他。", "f": "The students were busy cleaning the classroom when the principal came in, so nobody noticed him at first."}, {"g": "", "t": "be busy with + N", "p": "(adj.phr.)", "e": "having a lot to do with something", "z": "忙於……（名詞）", "s": "Dad _____ _____ _____ his work this week, so Mom drove us to school every morning and cooked dinner alone.", "c": "爸爸這個星期【忙於】工作，所以媽媽每天早上載我們上學，還自己一個人煮晚餐。", "f": "Dad was busy with his work this week, so Mom drove us to school every morning and cooked dinner alone."}, {"g": "", "t": "be called + 名字", "p": "(adj.phr.)", "e": "have a certain name", "z": "被叫做；名叫", "s": "Our new classmate from Canada _____ _____ Ethan, and he can already speak a little Chinese.", "c": "我們從加拿大來的新同學【名叫】Ethan，而且他已經會說一點中文。", "f": "Our new classmate from Canada is called Ethan, and he can already speak a little Chinese."}, {"g": "", "t": "be careful about + N/V-ing", "p": "(adj.phr.)", "e": "pay attention to avoid problems", "z": "對……小心", "s": "You should _____ _____ _____ what you eat at the night market in summer, because some food goes bad quickly in hot weather.", "c": "夏天在夜市，你應該【小心】自己吃的東西，因為有些食物在炎熱的天氣裡很快就會壞掉。", "f": "You should be careful about what you eat at the night market in summer, because some food goes bad quickly in hot weather."}, {"g": "", "t": "be close to + N", "p": "(adj.phr.)", "e": "to be near something", "z": "接近…", "s": "Our new apartment _____ _____ _____ the MRT station, so it only takes me five minutes to walk there every morning.", "c": "我們的新公寓很【接近】捷運站，所以我每天早上走過去只要五分鐘。", "f": "Our new apartment is close to the MRT station, so it only takes me five minutes to walk there every morning."}, {"g": "", "t": "be covered with + N", "p": "(adj.phr.)", "e": "have something all over the top", "z": "被……覆蓋", "s": "After the big snowstorm, the mountains _____ _____ _____ white snow, and many tourists came to take pictures.", "c": "大雪過後，山上【覆蓋著】白雪，許多遊客前來拍照。", "f": "After the big snowstorm, the mountains were covered with white snow, and many tourists came to take pictures."}, {"g": "", "t": "be crazy about + N/V-ing", "p": "(adj.phr.)", "e": "like someone or something very, very much", "z": "超級喜愛；為……著迷瘋狂", "s": "My cousin Hao-yu _____ _____ _____ baseball, so he watches every Brothers game on TV with his dad.", "c": "我表哥浩宇【超級熱愛】棒球，所以他每場兄弟隊的比賽都和爸爸一起看電視轉播。", "f": "My cousin Hao-yu is crazy about baseball, so he watches every Brothers game on TV with his dad."}, {"g": "", "t": "be curious about + N", "p": "(adj.phr.)", "e": "wanting to know more about something", "z": "對……感到好奇", "s": "Tim _____ _____ _____ how airplanes fly, so his father took him to an air show at the airport last weekend.", "c": "提姆【對】飛機如何飛行【感到好奇】，所以他爸爸上週末帶他去機場看航空展。", "f": "Tim was curious about how airplanes fly, so his father took him to an air show at the airport last weekend."}, {"g": "", "t": "be delighted to + VR", "p": "(adj.phr.)", "e": "to be very happy to do something", "z": "很高興（做）……", "s": "Grandma _____ _____ _____ see all of us at the Lunar New Year dinner, and she cooked many delicious dishes.", "c": "奶奶【很高興】在除夕晚餐見到我們大家，她還煮了好多美味的菜。", "f": "Grandma was delighted to see all of us at the Lunar New Year dinner, and she cooked many delicious dishes."}, {"g": "", "t": "be different from + N", "p": "(adj.phr.)", "e": "not like someone or something else", "z": "和……不同", "s": "Although Lisa and her twin sister look alike, Lisa's hobbies _____ _____ _____ her sister's because she loves sports and her sister loves art.", "c": "雖然麗莎和她的雙胞胎妹妹長得很像，但麗莎的嗜好【和】妹妹的【不同】，因為她喜歡運動，而妹妹喜歡藝術。", "f": "Although Lisa and her twin sister look alike, Lisa's hobbies are different from her sister's because she loves sports and her sister loves art."}, {"g": "", "t": "be disappointed with/at + N", "p": "(adj.phr.)", "e": "to feel sad because something was not as hoped", "z": "對……感到失望", "s": "Mr. Chen _____ _____ _____ his test score because he studied hard for weeks, but he still did not pass.", "c": "陳先生【對他的考試成績感到失望】，因為他努力讀了好幾個星期，卻還是沒有及格。", "f": "Mr. Chen was disappointed with his test score because he studied hard for weeks, but he still did not pass."}, {"g": "", "t": "be disgusted with + N", "p": "(adj.phr.)", "e": "to feel very unhappy about something bad", "z": "厭惡", "s": "The visitors _____ _____ _____ the trash on the beach, so they picked it up and put it into bags before they left.", "c": "遊客們很【厭惡】海灘上的垃圾，所以他們在離開前把垃圾撿起來裝進袋子。", "f": "The visitors were disgusted with the trash on the beach, so they picked it up and put it into bags before they left."}, {"g": "", "t": "be dressed in + 顏色", "p": "(adj.phr.)", "e": "wear clothes of a certain color", "z": "穿某種顏色的衣服", "s": "On sports day, all students from Class 8 _____ _____ _____ red, so we could easily find them.", "c": "運動會上，八班所有學生都【穿著】紅色衣服，所以很容易找到他們。", "f": "On sports day, all students from Class 8 were dressed in red, so we could easily find them."}, {"g": "", "t": "be embarrassed", "p": "(adj.phr.)", "e": "to feel shy or silly in front of others", "z": "感到尷尬、難為情", "s": "Wei-jie _____ _____ when he fell down on the stage, but his classmates clapped and cheered for him.", "c": "偉傑在舞台上跌倒時【感到很尷尬】，但同學們都為他鼓掌加油。", "f": "Wei-jie was embarrassed when he fell down on the stage, but his classmates clapped and cheered for him."}, {"g": "", "t": "be excited about + N/V-ing", "p": "(adj.phr.)", "e": "to feel very happy about something coming", "z": "對……感到興奮", "s": "The students _____ _____ _____ the school trip to Kenting because they will swim in the sea and see the stars.", "c": "學生們【對去墾丁的校外教學感到很興奮】，因為他們可以在海裡游泳、看星星。", "f": "The students are excited about the school trip to Kenting because they will swim in the sea and see the stars."}, {"g": "", "t": "be familiar with + N", "p": "(adj.phr.)", "e": "know something well", "z": "熟悉", "s": "Grace _____ _____ _____ this neighborhood because she has lived here for ten years, so she showed us the best noodle shop.", "c": "葛蕾絲很【熟悉】這一帶，因為她在這裡住了十年，所以她帶我們去最好吃的麵店。", "f": "Grace is familiar with this neighborhood because she has lived here for ten years, so she showed us the best noodle shop."}, {"g": "", "t": "be famous as + N", "p": "(adj.phr.)", "e": "well known as a certain kind of person", "z": "以……身分而有名", "s": "Mr. Lin, our neighbor, _____ _____ _____ a great cook in our town, so many people come to his small restaurant on weekends.", "c": "我們的鄰居林先生在鎮上【以】大廚的身分【出名】，所以週末很多人會來他的小餐廳。", "f": "Mr. Lin, our neighbor, is famous as a great cook in our town, so many people come to his small restaurant on weekends."}, {"g": "", "t": "be famous for + N", "p": "(adj.phr.)", "e": "well known because of something", "z": "因……聞名", "s": "Tainan _____ _____ _____ its delicious traditional snacks, so many visitors go there just to eat during their holidays.", "c": "台南【因】美味的傳統小吃【而聞名】，所以很多遊客放假時專程去那裡吃東西。", "f": "Tainan is famous for its delicious traditional snacks, so many visitors go there just to eat during their holidays."}, {"g": "", "t": "be filled with + N", "p": "(adj.phr.)", "e": "have a lot of something inside", "z": "充滿", "s": "The classroom _____ _____ _____ balloons and flowers because the students were planning a surprise party for their teacher's birthday.", "c": "教室裡【充滿】了氣球和花，因為學生們正在為老師的生日籌劃一個驚喜派對。", "f": "The classroom was filled with balloons and flowers because the students were planning a surprise party for their teacher's birthday."}, {"g": "", "t": "be fined", "p": "(adj.phr.)", "e": "to be made to pay money as punishment", "z": "被罰款", "s": "In Taipei, people may _____ _____ if they throw trash on the street, so most people carry their garbage until they find a trash can.", "c": "在台北，如果在街上亂丟垃圾，可能會【被罰款】，所以大部分的人會一直拿著垃圾，直到找到垃圾桶為止。", "f": "In Taipei, people may be fined if they throw trash on the street, so most people carry their garbage until they find a trash can."}, {"g": "", "t": "be fond of + N/V-ing", "p": "(adj.phr.)", "e": "like something very much", "z": "喜愛、喜歡", "s": "My grandfather _____ _____ _____ growing vegetables, so he spends every morning working in the small garden behind our house.", "c": "我爺爺很【喜愛】種菜，所以他每天早上都在我們家後面的小菜園裡忙。", "f": "My grandfather is fond of growing vegetables, so he spends every morning working in the small garden behind our house."}, {"g": "", "t": "be foreign to + 人", "p": "(adj.phr.)", "e": "new and strange to someone", "z": "對……陌生的", "s": "Snow _____ _____ _____ most children in southern Taiwan, so they got very excited when they saw it in Japan last winter.", "c": "雪【對】大多數南台灣的孩子來說很【陌生】，所以去年冬天他們在日本看到雪時非常興奮。", "f": "Snow is foreign to most children in southern Taiwan, so they got very excited when they saw it in Japan last winter."}, {"g": "", "t": "be free of/from + N", "p": "(adj.phr.)", "e": "not having something bad", "z": "沒有、免於", "s": "The air in the mountains _____ _____ _____ pollution, so my family likes to go camping there and breathe the fresh air.", "c": "山上的空氣【沒有】污染，所以我們家喜歡去那裡露營，呼吸新鮮空氣。", "f": "The air in the mountains is free of pollution, so my family likes to go camping there and breathe the fresh air."}, {"g": "", "t": "be frightened of + N/V-ing", "p": "(adj.phr.)", "e": "to feel afraid of something", "z": "害怕……", "s": "Although Emma _____ _____ _____ big dogs, she tried to stay calm when one ran toward her in the park.", "c": "雖然艾瑪【害怕】大狗，但當一隻狗在公園裡朝她跑過來時，她還是試著保持冷靜。", "f": "Although Emma is frightened of big dogs, she tried to stay calm when one ran toward her in the park."}, {"g": "", "t": "be full of + N", "p": "(adj.phr.)", "e": "have a lot of something", "z": "充滿", "s": "The MRT station _____ _____ _____ people on Monday morning, so I had to wait for three trains before I could get on.", "c": "星期一早上捷運站【擠滿】了人，所以我等了三班車才擠上去。", "f": "The MRT station was full of people on Monday morning, so I had to wait for three trains before I could get on."}, {"g": "", "t": "be good at + N/V-ing", "p": "(adj.phr.)", "e": "able to do something well", "z": "擅長", "s": "Wu Jia-hao _____ _____ _____ drawing cartoons, so his classmates always ask him to design the posters for school events.", "c": "吳家豪很【擅長】畫漫畫，所以同學們總是請他設計學校活動的海報。", "f": "Wu Jia-hao is good at drawing cartoons, so his classmates always ask him to design the posters for school events."}, {"g": "", "t": "be good for + N", "p": "(adj.phr.)", "e": "helpful or healthy for someone", "z": "對……有益的", "s": "Eating fruit and vegetables every day _____ _____ _____ your health, and it also helps you stay strong when you play sports.", "c": "每天吃蔬菜水果【有益於】你的健康，也能幫助你在運動時保持強壯。", "f": "Eating fruit and vegetables every day is good for your health, and it also helps you stay strong when you play sports."}, {"g": "", "t": "be grounded", "p": "(adj.phr.)", "e": "to not be allowed to go out as a punishment", "z": "被禁足（通常指小孩受罰）", "s": "Peter came home three hours late without calling his parents, so he _____ _____ for the whole weekend and couldn't see his friends.", "c": "彼得晚了三個小時才回家，也沒打電話給爸媽，所以整個週末都【被禁足】，不能和朋友見面。", "f": "Peter came home three hours late without calling his parents, so he was grounded for the whole weekend and couldn't see his friends."}, {"g": "", "t": "be happy/glad about + N", "p": "(adj.phr.)", "e": "feel pleased because of something", "z": "為…高興", "s": "Grandpa _____ very _____ _____ the good news that my sister passed her driving test on her first try.", "c": "爺爺非常【高興】聽到我姊姊第一次就通過駕照考試的好消息。", "f": "Grandpa was very happy about the good news that my sister passed her driving test on her first try."}, {"g": "", "t": "be impressed by + N", "p": "(adj.phr.)", "e": "to think someone or something is very good", "z": "對……印象深刻", "s": "The judges _____ _____ _____ Yu-ting's piano performance, so they gave her first prize in the music contest.", "c": "評審們【對雨婷的鋼琴演奏印象深刻】，所以在音樂比賽中給了她第一名。", "f": "The judges were impressed by Yu-ting's piano performance, so they gave her first prize in the music contest."}, {"g": "", "t": "be in danger", "p": "(adj.phr.)", "e": "to be in a place where you may get hurt", "z": "在危險中", "s": "The little cat _____ _____ _____ because it was stuck on a high tree, so Dad called the fire department for help.", "c": "那隻小貓【處在危險中】，因為牠被困在一棵高樹上，所以爸爸打電話請消防隊幫忙。", "f": "The little cat was in danger because it was stuck on a high tree, so Dad called the fire department for help."}, {"g": "", "t": "be in good order", "p": "(adj.phr.)", "e": "to be neat and in the right place", "z": "井然有序、整齊", "s": "Before the guests arrived, Mom made sure everything in the living room _____ _____ _____ _____, and then she made tea.", "c": "客人到之前，媽媽確認客廳裡的一切都【井然有序】，然後才去泡茶。", "f": "Before the guests arrived, Mom made sure everything in the living room was in good order, and then she made tea."}, {"g": "", "t": "be in search of + N", "p": "(adj.phr.)", "e": "to be looking for something", "z": "尋找", "s": "The lost tourists _____ _____ _____ _____ a cheap hotel near the night market, so they asked a friendly shop owner for directions.", "c": "迷路的觀光客正在【尋找】夜市附近便宜的旅館，所以他們向一位友善的店老闆問路。", "f": "The lost touris ul place for nature lovers, so many tourists visit it to see the mountains and the sea."}, {"g": "", "t": "be known for + N", "p": "(adj.phr.)", "e": "famous because of something", "z": "因……而聞名", "s": "Chiayi _____ _____ _____ its turkey rice, so my family always eats two bowls each when we travel there in summer.", "c": "嘉義【因】火雞肉飯【而聞名】，所以我們家夏天去那裡旅行時，每個人總是吃兩碗。", "f": "Chiayi is known for its turkey rice, so my family always eats two bowls each when we travel there in summer."}, {"g": "", "t": "be known to + 人", "p": "(adj.phr.)", "e": "famous among some people", "z": "為…所熟知", "s": "The night market in Shilin _____ _____ _____ many tourists, and it is always crowded on weekends.", "c": "士林夜市【為許多觀光客所熟知】，週末總是擠滿了人。", "f": "The night market in Shilin is known to many tourists, and it is always crowded on weekends."}, {"g": "", "t": "be late for + N", "p": "(adj.phr.)", "e": "arrive after the right time for something", "z": "……遲到", "s": "Amy got up at eight o'clock this morning, so she _____ _____ _____ school and her teacher was not happy.", "c": "Amy 今天早上八點才起床，所以她上學【遲到】了，老師很不高興。", "f": "Amy got up at eight o'clock this morning, so she was late for school and her teacher was not happy."}, {"g": "", "t": "be like + N", "p": "(adj.phr.)", "e": "to be similar to someone or something", "z": "像…", "s": "My twin sister and I look the same, but she _____ _____ my dad because she is quiet and loves reading books.", "c": "我和雙胞胎妹妹長得一樣，但她的個性【像】爸爸，因為她很安靜又愛看書。", "f": "My twin sister and I look the same, but she is like my dad because she is quiet and loves reading books."}, {"g": "", "t": "be likely to + VR", "p": "(adj.phr.)", "e": "will probably happen", "z": "可能", "s": "The sky is dark and the wind is strong, so it _____ _____ _____ rain soon; let's go home before we get wet.", "c": "天空很暗，風也很強，所以很【可能】快要下雨了；我們趁還沒淋濕前回家吧。", "f": "The sky is dark and the wind is strong, so it is likely to rain soon; let's go home before we get wet."}, {"g": "", "t": "be made from + N", "p": "(adj.phr. visit the night market this weekend, be sure to bring an umbrella because it will rain on Saturday evening."}, {"g": "", "t": "be sure to + VR", "p": "(adj.phr.)", "e": "remember to do something without fail", "z": "確定去做某事、務必", "s": "_____ _____ _____ bring an umbrella tomorrow, because the weather report says it will rain all afternoon.", "c": "明天【務必】帶傘，因為氣象報告說整個下午都會下雨。", "f": "Be sure to bring an umbrella tomorrow, because the weather report says it will rain all afternoon."}, {"g": "", "t": "be surprised at + N", "p": "(adj.phr.)", "e": "to feel something is unexpected", "z": "對……感到驚訝", "s": "When Mia opened the box, she _____ _____ _____ the cute puppy inside, and she started to laugh happily.", "c": "當米亞打開盒子時，她【對裡面那隻可愛的小狗感到很驚訝】，接著開心地笑了起來。", "f": "When Mia opened the box, she was surprised at the cute puppy inside, and she started to laugh happily."}, {"g": "", "t": "be thankful to + 人 + for + N", "p": "(adj.phr.)", "e": "feel grateful to someone because of something", "z": "為了某事感謝某人", "s": "The students _____ _____ _____ their teacher _____ all her help, so they made her a big card on Teachers' Day.", "c": "學生們很【感謝】老師的所有幫助，所以他們在教師節為她做了一張大卡片。", "f": "The students were thankful to their teacher for all her help, so they made her a big card on Teachers' Day."}, {"g": "", "t": "be the same as + N", "p": "(adj.phr.)", "e": "not different from something else", "z": "和……一樣", "s": "My new backpack _____ _____ _____ _____ Peter's, so we wrote our names on them because we did not want to mix them up.", "c": "我的新背包【和】彼得的【一樣】，所以我們在背包上寫了名字，因為我們不想拿錯。", "f": "My new backpack is the same as Peter's, so we wrote our names on them because we did not want to mix them up."}, {"g": "", "t": "be through", "p": "(adj.phr.)", "e": "to be finished or past", "z": "結束；熬過去", "s": "The final exams _____ _____ at last, so Kevin and his friends are going to the night market to celebrate tonight.", "c": "期末考終於【結束】了，所以Kevin和他的朋友們今晚要去夜市慶祝。", "f": "The final exams are through at last, so Kevin and his friends are going to the night market to celebrate tonight."}, {"g": "", "t": "be tired from + N/V-ing", "p": "(adj.phr.)", "e": "feel very tired because of an activity", "z": "因…疲憊", "s": "Everyone _____ _____ _____ the long hike up the mountain, so we sat down and ate our lunch quietly.", "c": "爬了很長一段山路後，大家都【很疲憊】，所以我們坐下來安靜地吃午餐。", "f": "Everyone was tired from the long hike up the mountain, so we sat down and ate our lunch quietly."}, {"g": "", "t": "be tired of + N/V-ing", "p": "(adj.phr.)", "e": "to not want any more of something", "z": "對……感到厭倦", "s": "Jason _____ _____ _____ eating fried rice for lunch every day, so he asked his mom to make noodles instead.", "c": "傑森【厭倦了】每天午餐都吃炒飯，所以他請媽媽改煮麵。", "f": "Jason is tired of eating fried rice for lunch every day, so he asked his mom to make noodles instead."}, {"g": "", "t": "be touched by + N", "p": "(adj.phr.)", "e": "to feel strong, warm feelings because of something", "z": "被……感動", "s": "Everyone in the class _____ _____ _____ the teacher's story about her poor childhood, and some students even cried.", "c": "全班同學都【被】老師講的她貧困童年的故事【感動】，有些學生甚至哭了。", "f": "Everyone in the class was touched by the teacher's story about her poor childhood, and some students even cried."}, {"g": "", "t": "be under pressure", "p": "(adj.phr.)", "e": "feel worried because you have to do a lot", "z": "處於壓力之下；有壓力", "s": "Many ninth graders _____ _____ _____ before the big exam, so they should get enough sleep and exercise.", "c": "許多九年級學生在大考前都【承受壓力】，所以他們應該要有充足的睡眠和運動。", "f": "Many ninth graders are under pressure before the big exam, so they should get enough sleep and exercise."}, {"g": "", "t": "物 + be used for + N/V-ing", "p": "(adj.phr.)", "e": "have this job or purpose", "z": "某物被用來做…", "s": "This small knife _____ _____ _____ cutting fruit, so please don't open boxes with it.", "c": "這把小刀是【用來】切水果的，所以請不要拿它開箱子。", "f": "This small knife is used for cutting fruit, so please don't open boxes with it."}, {"g": "", "t": "be used to + N/V-ing", "p": "(adj.phr.)", "e": "to know something well because you often do it", "z": "習慣於（做）某事", "s": "Kelly _____ _____ _____ getting up early because she takes the bus at six thirty every morning to get to school.", "c": "凱莉【習慣】早起，因為她每天早上六點半就要搭公車上學。", "f": "Kelly is used to getting up early because she takes the bus at six thirty every morning to get to school."}, {"g": "", "t": "物 + be used to + VR", "p": "(adj.phr.)", "e": "(of a thing) to be used for doing something", "z": "（物）被用來做……", "s": "This big box _____ _____ _____ keep old toys, and my mom puts it under the bed so the room looks clean.", "c": "這個大箱子【被用來】裝舊玩具，我媽媽把它放在床底下，讓房間看起來很整潔。", "f": "This big box is used to keep old toys, and my mom puts it under the bed so the room looks clean."}, {"g": "", "t": "人 + be wild", "p": "(adj.phr.)", "e": "act freely and not follow any rules", "z": "做事不受約束；行為狂野", "s": "My cousin Leo _____ really _____ when he was young because he often climbed trees and ran out without telling anyone.", "c": "我表哥 Leo 小時候真的【做事很不受約束】，因為他常常爬樹，沒跟任何人說就跑出去。", "f": "My cousin Leo was really wild when he was young because he often climbed trees and ran out without telling anyone."}, {"g": "", "t": "be willing to + VR", "p": "(adj.phr.)", "e": "happy and ready to do something", "z": "願意", "s": "Although Daniel was very busy with his own exams, he _____ _____ _____ help his little sister with her English homework every night.", "c": "雖然丹尼爾自己忙著準備考試，他還是【願意】每天晚上幫妹妹寫英文作業。", "f": "Although Daniel was very busy with his own exams, he was willing to help his little sister with her English homework every night."}, {"g": "", "t": "be worried about + N/V-ing", "p": "(adj.phr.)", "e": "feel afraid something bad may happen", "z": "擔憂", "s": "Mrs. Chen _____ _____ _____ her son because he went hiking in the mountains and has not called home since this morning.", "c": "陳太太很【擔心】她的兒子，因為他去山上健行，從今天早上到現在都還沒打電話回家。", "f": "Mrs. Chen is worried about her son because he went hiking in the mountains and has not called home since this morning."}, {"g": "", "t": "be/get used to + N/V-ing", "p": "(adj.phr.)", "e": "become comfortable with something new", "z": "習慣", "s": "When Lisa moved from Canada to Taipei, it took her a few months to _____ _____ _____ the hot and wet summer weather.", "c": "當麗莎從加拿大搬到台北時，她花了好幾個月才【習慣】炎熱又潮濕的夏天天氣。", "f": "When Lisa moved from Canada to Taipei, it took her a few months to get used to the hot and wet summer weather."}, {"g": "", "t": "get better", "p": "(adj.phr.)", "e": "become better than before", "z": "變好", "s": "My English was poor last year, but it _____ _____ after I started reading short stories every night.", "c": "我去年英文不好，但我開始每晚讀短篇故事後，英文就【變好】了。", "f": "My English was poor last year, but it got better after I started reading short stories every night."}, {"g": "", "t": "get better", "p": "(adj.phr.)", "e": "become healthy again after being sick", "z": "康復", "s": "Grandma caught a bad cold last week, but she drank lots of warm water and is _____ _____ now.", "c": "奶奶上週得了重感冒，但她喝了很多溫開水，現在正在【康復】中。", "f": "Grandma caught a bad cold last week, but she drank lots of warm water and is getting better now."}, {"g": "", "t": "get bored with + N/V-ing", "p": "(adj.phr.)", "e": "lose interest in something because it is dull", "z": "對…感到無聊", "s": "Lisa usually _____ _____ _____ long movies quickly, but she watched this one twice because the story was so funny.", "c": "莉莎通常很快就會對長片【感到無聊】，但她把這部看了兩次，因為故事太好笑了。", "f": "Lisa usually gets bored with long movies quickly, but she watched this one twice because the story was so funny."}, {"g": "", "t": "get dressed", "p": "(adj.phr.)", "e": "put on your clothes", "z": "穿好衣服", "s": "Hurry up and _____ _____, or we will miss the school bus and be late for the class trip today.", "c": "快點【穿好衣服】，不然我們會錯過校車，今天的校外教學就要遲到了。", "f": "Hurry up and get dressed, or we will miss the school bus and be late for the class trip today."}, {"g": "", "t": "get excited about + N/V-ing", "p": "(adj.phr.)", "e": "feel very happy and eager about something", "z": "對…感到興奮", "s": "The kids _____ _____ _____ the school trip to the zoo, so they could not sleep well the night before.", "c": "孩子們想到去動物園的校外教學就【很興奮】，所以前一晚都睡不好。", "f": "The kids got excited about the school trip to the zoo, so they could not sleep well the night before."}, {"g": "", "t": "get hurt", "p": "(adj.phr.)", "e": "to be hurt in an accident", "z": "受傷", "s": "Wear your helmet when you ride your bike, because you could _____ _____ badly if you fall on the busy road.", "c": "騎腳踏車時要戴安全帽，因為如果你在繁忙的路上跌倒，可能會嚴重【受傷】。", "f": "Wear your helmet when you ride your bike, because you could get hurt badly if you fall on the busy road."}, {"g": "", "t": "get involved in + N/V-ing", "p": "(adj.phr.)", "e": "to take part in an activity", "z": "參與", "s": "Henry wants to _____ _____ _____ more school activities this year, so he joined the music club and the science fair.", "c": "亨利今年想【參與】更多學校活動，所以他參加了音樂社和科展。", "f": "Henry wants to get involved in more school activities this year, so he joined the music club and the science fair."}, {"g": "", "t": "get lost", "p": "(adj.phr.)", "e": "to not know where you are or how to go", "z": "迷路", "s": "It was our first time in Tainan, and the streets were small and dark, so we _____ _____ on the way to the night market.", "c": "那是我們第一次去台南，街道又小又暗，所以我們在去夜市的路上【迷路】了。", "f": "It was our first time in Tainan, and the streets were small and dark, so we got lost on the way to the night market."}, {"g": "", "t": "get mad at + 人", "p": "(adj.phr.)", "e": "become angry with someone", "z": "對…生氣", "s": "My sister _____ _____ _____ me because I wore her new jacket to school without asking her first.", "c": "我姊姊【生我的氣】，因為我沒先問她就穿她的新外套去學校。", "f": "My sister got mad at me because I wore her new jacket to school without asking her first."}, {"g": "", "t": "get married to + 人", "p": "(adj.phr.)", "e": "become someone's husband or wife", "z": "和…結婚", "s": "My aunt will _____ _____ _____ a doctor next spring, and our whole family will attend her wedding in Tainan.", "c": "我阿姨明年春天要【嫁給】一位醫生，我們全家都會去台南參加她的婚禮。", "f": "My aunt will get married to a doctor next spring, and our whole family will attend her wedding in Tainan."}, {"g": "", "t": "get ready for + N / to + VR", "p": "(adj.phr.)", "e": "to prepare for something", "z": "準備好", "s": "Hurry up and _____ _____ for school, or you will miss the bus and be late for the first class.", "c": "快點【準備好】去上學，不然你會錯過公車，第一堂課就遲到了。", "f": "Hurry up and get ready for school, or you will miss the bus and be late for the first class."}, {"g": "", "t": "get tired of + N/V-ing", "p": "(adj.phr.)", "e": "stop liking something because it happens too much", "z": "對…感到厭倦", "s": "Ben _____ _____ _____ eating instant noodles every night, so he asked his mom to teach him how to cook.", "c": "班每天晚上吃泡麵吃到【厭倦了】，所以他請媽媽教他煮飯。", "f": "Ben got tired of eating instant noodles every night, so he asked his mom to teach him how to cook."}, {"g": "", "t": "get worse", "p": "(adj.phr.)", "e": "become worse than before", "z": "變糟", "s": "The rain _____ _____ in the afternoon, so the coach cancelled the baseball game and sent everyone home.", "c": "下午雨勢【變得更糟】，所以教練取消了棒球比賽，讓大家回家。", "f": "The rain got worse in the afternoon, so the coach cancelled the baseball game and sent everyone home."}];</script><script src="longteng-b1u5-quiz.js?v=20261106-3"></script><script src="cap-vocab-learn.js?v=20261105-1"></script><script>document.querySelector("#description").textContent="先在「教學 Learn」看完 124 筆詞彙表，再到「測驗 Quiz」做 60 題四選一｜選答後顯示答案、用語中文與整句中譯｜答錯可重做並下載錯題";</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
