const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let items=[],index=0,currentTitle='',wrong=new Map(),correct=new Set();
function norm(s){return String(s).trim().toLowerCase().replace(/[“”]/g,'"').replace(/[‘’]/g,"'").replace(/\b(didn't)\b/g,'did not').replace(/\b(don't)\b/g,'do not').replace(/\b(doesn't)\b/g,'does not').replace(/\b(can't)\b/g,'cannot').replace(/\b(isn't)\b/g,'is not').replace(/\b(aren't)\b/g,'are not').replace(/\b(wasn't)\b/g,'was not').replace(/\b(weren't)\b/g,'were not').replace(/\s+([,.!?;:])/g,'$1').replace(/\s+/g,' ').trim()}
function renderGroups(){const total=DATA.groups.flatMap(g=>g.items).length;$('#groups').innerHTML=`<button class="group-btn" data-all="1"><b>全部練習</b><span>${total} 題｜依原題順序</span></button>`+DATA.groups.map((g,i)=>`<button class="group-btn" data-i="${i}"><b>${esc(g.title)}</b><span>${g.items.length} 題</span></button>`).join('');document.querySelectorAll('.group-btn').forEach(b=>b.onclick=()=>b.dataset.all?start(DATA.groups.flatMap(g=>g.items.map(x=>({...x,group:g.title}))),'全部練習'):start(DATA.groups[+b.dataset.i].items.map(x=>({...x,group:DATA.groups[+b.dataset.i].title})),DATA.groups[+b.dataset.i].title))}

function show(){speechSynthesis?.cancel();const item=items[index];$('#meta').textContent=`${item.group||currentTitle}｜第 ${index+1} / ${items.length} 題`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=(index+1)/items.length*100+'%';$('#feedback').className='feedback hidden';$('#reference').classList.add('hidden');$('#voiceBox').classList.add('hidden');$('#check').classList.remove('hidden');$('#next').classList.add('hidden');renderPassage(item);const q=$('#question'),a=$('#answerArea');if(item.type==='edit'){q.innerHTML=`${esc(item.prompt)}<br><span class="edit-target">${esc(item.wrong)}</span>`;a.innerHTML='<input class="answer" spellcheck="false" placeholder="輸入正確片語">'}else{q.textContent=item.prompt;if(item.type==='choice'){a.innerHTML='<div class="options">'+item.options.map((o,i)=>`<label class="option"><input type="radio" name="choice" value="${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(o)}</label>`).join('')+'</div>'}else if(item.type==='qa'){a.innerHTML='<label>Question<input class="answer q-answer" spellcheck="false" placeholder="依畫線部分寫問句"></label><label>Answer<input class="answer r-answer" spellcheck="false" placeholder="依 Fact File 完整回答"></label>'}else if(item.type==='tf'){a.innerHTML='<div class="options"><label class="option"><input type="radio" name="truth" value="true">That\'s right.</label><label class="option"><input type="radio" name="truth" value="false">That\'s wrong.</label></div>'+(!item.truth?'<input class="answer correction-answer" spellcheck="false" placeholder="若錯誤，請寫出正確句子">':'')}else{a.innerHTML=(item.wordbank?.length?'<div class="wordbank">'+item.wordbank.map(w=>`<span class="word">${esc(w)}</span>`).join('')+'</div>':'')+'<input class="answer" spellcheck="false" placeholder="輸入正確動詞形式">'}}setTimeout(()=>a.querySelector('input')?.focus(),0)}
function answerText(item){if(item.type==='qa')return `Q: ${item.questionAnswer}\nA: ${item.responseAnswer}`;if(item.type==='tf')return item.truth?"That's right.":`That's wrong. ${item.answer}`;return item.answer||item.options?.[item.correct]||''}

function finish(){speechSynthesis?.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');$('#summary').innerHTML=`<div class="stat">本輪題數<b>${items.length}</b></div><div class="stat">完成題數<b>${correct.size}</b></div><div class="stat">曾答錯<b>${wrong.size}</b></div>`;$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>`<div class="wrong-card"><b>${i+1}. ${esc(r.item.id)}</b><p>${esc(r.item.prompt||r.item.wrong)}</p><p><strong>作答：</strong>${r.attempts.map(esc).join('；')}</p><p><strong>答案：</strong>${esc(answerText(r.item))}</p></div>`).join(''):'<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size)}
