  <script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 2｜引導式翻譯","mode":"multi","questions":[{"id":1,"zh":"把三分之二的錢放進你的口袋，以防萬一行李掉了。","question":"Put two-thirds of the money in your pocket ①____________ ②____________ your luggage gets lost.","answers":["in","case"],"source":"All in One","explanation":"句意：把三分之二的錢放進你的口袋，以防萬一行李掉了。 本題依序填入：in、case。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":2,"zh":"Olivia 正在徹底讀過她所有的美食雜誌，試著找出她之前看過的一道食譜。","question":"Olivia is ①____________ ②____________ all her food magazines, trying to find a recipe that she saw before.","answers":["going","through"],"source":"All in One","explanation":"句意：Olivia 正在徹底讀過她所有的美食雜誌，試著找出她之前看過的一道食譜。 本題依序填入：going、through。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":3,"zh":"別認為她說的話是在針對你。她並不知道發生了什麼事。","question":"Don’t ①____________ what she said ②____________. She didn’t know what had happened.","answers":["take","personally"],"source":"三合一學習手冊","explanation":"句意：別認為她說的話是在針對你。她並不知道發生了什麼事。 本題依序填入：take、personally。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":4,"zh":"人們通常轉向手機的陪伴，而不是周遭的人。","question":"People often ①____________ ②____________ their cell phones for companionship instead of the people around them.","answers":["turn","to"],"source":"龍騰自命題","explanation":"companionship 陪伴　instead of 而不是","explanationSource":"source"},{"id":5,"zh":"自從Rose開始在花店工作之後，她的過敏就愈來愈嚴重。","question":"①____________ Rose started to work at the flower shop, her allergies ②____________ ③____________ worse.","answers":["Since","have","gotten||become"],"source":"龍騰自命題","explanation":"allergy過敏","explanationSource":"source"},{"id":6,"zh":"Ryder年紀快四十了，但看起來相當年輕。事實上，他每天騎腳踏車來維持健康。","question":"Ryder is almost 40, but looks quite young. ①____________ ②f____________, every day he goes cycling to stay healthy.","answers":["In","fact"],"source":"龍騰自命題","explanation":"go cycling 騎腳踏車","explanationSource":"source"},{"id":7,"zh":"Albert跟他家人已經住在臺北市10年了。","question":"Albert ①____________ ②____________ in Taipei City with his family for 10 years.","answers":["has","lived"],"source":"龍騰自命題","explanation":"for + 一段時間","explanationSource":"source"},{"id":8,"zh":"John和我2017年就認識了。事實上，他是我前男友。","question":"John and I met each other in 2017. ①____________ ②f____________, he is my ex-boyfriend.","answers":["In","fact"],"source":"龍騰自命題","explanation":"ex-boyfriend 前男友","explanationSource":"source"},{"id":9,"zh":"我沒有針對你，不過我不太喜歡你穿的襯衫。你穿深色比較好看。","question":"Please don’t ①____________ this ②____________, but I don’t like your shirt. You look better in darker colors.","answers":["take","personally"],"source":"課本例句填空","explanation":"句意：我沒有針對你，不過我不太喜歡你穿的襯衫。你穿深色比較好看。 本題依序填入：take、personally。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":10,"zh":"Tracy跟朋友們中的其中一位相處有問題時，總是向她的姐姐Ivy求助。","question":"Tracy always ①____________ ②____________ her older sister Ivy when she has a problem with one of her friends.","answers":["turns","to"],"source":"課本例句填空","explanation":"句意：Tracy跟朋友們中的其中一位相處有問題時，總是向她的姐姐Ivy求助。 本題依序填入：turns、to。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":11,"zh":"請記得帶點心來參加派對。此外，你該帶份禮物送給壽星男孩。","question":"Please remember to bring a snack to the party. ①____________ ②____________, you should bring a gift for the birthday boy.","answers":["In","addition"],"source":"課本例句填空","explanation":"句意：請記得帶點心來參加派對。此外，你該帶份禮物送給壽星男孩。 本題依序填入：In、addition。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":12,"zh":"每個健行者都帶了傘和雨衣，以防下雨。","question":"Each of the hikers brought an umbrella and a raincoat ①____________ ②____________ it rained.","answers":["in","case"],"source":"課本例句填空","explanation":"句意：每個健行者都帶了傘和雨衣，以防下雨。 本題依序填入：in、case。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":13,"zh":"Bill正瀏覽得獎者的名單來查看他是否是其中一位。","question":"Bill is ①____________ ②____________ the list of winners to see if he is one of them.","answers":["going","through"],"source":"課本例句填空","explanation":"句意：Bill正瀏覽得獎者的名單來查看他是否是其中一位。 本題依序填入：going、through。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":14,"zh":"澳洲的十二月不冷；其實，那時澳洲正值仲夏。","question":"December is not cold in Australia. ①____________ ②____________, it’s the middle of summer.","answers":["In","fact"],"source":"課本例句填空","explanation":"句意：澳洲的十二月不冷；其實，那時澳洲正值仲夏。 本題依序填入：In、fact。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":15,"zh":"Judy匆匆地拿了雨傘，以免等一下下雨。","question":"Judy grabbed her umbrella ①____________ ②____________ it rained later.","answers":["in","case"],"source":"龍騰自命題","explanation":"grab 抓取","explanationSource":"source"},{"id":16,"zh":"王先生並不窮。事實上，他是鎮上最有錢的人。","question":"Mr. Wang isn’t poor. ①____________ ②____________, he is the richest person in town.","answers":["In","fact"],"source":"All in One","explanation":"句意：王先生並不窮。事實上，他是鎮上最有錢的人。 本題依序填入：In、fact。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":17,"zh":"對我而言，在旅行時遇到來自世界各地的人是很有趣的。","question":"It is ①____________ ②____________ me ③____________ ④____________ people from all over the world when I travel.","answers":["interesting","for","to","meet"],"source":"三合一學習手冊","explanation":"句意：對我而言，在旅行時遇到來自世界各地的人是很有趣的。 本題依序填入：interesting、for、to、meet。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":18,"zh":"有很棒的餐廳、上百家商店和一個電影院，這家購物中心是和朋友閒逛的好地方。","question":"With fine restaurants, hundreds of shops, and a movie theater, this shopping mall is a fantastic place to ①____________ ②____________ with friends.","answers":["hang","out"],"source":"三合一學習手冊","explanation":"句意：有很棒的餐廳、上百家商店和一個電影院，這家購物中心是和朋友閒逛的好地方。 本題依序填入：hang、out。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":19,"zh":"我隨身帶著我的智慧型手機，以免我待會還要回家裡拿。","question":"I took my smartphone with myself ①____________ ②____________ I needed to get back into the house later.","answers":["in","case"],"source":"龍騰自命題","explanation":"in case 以免","explanationSource":"source"},{"id":20,"zh":"Albert這個周末已經花了大部分的時間在山中健行。他這周末沒有待在家。","question":"Albert ①____________ ②____________ all weekend hiking in the mountain. He was not home at all this weekend.","answers":["has","spent"],"source":"龍騰自命題","explanation":"spend + 時間 + V-ing","explanationSource":"source"},{"id":21,"zh":"在這麼晚的夜裡讓年輕女性走在路上是危險的。","question":"①____________ is  ②____________ ③____________ a young lady ④____________ walk on the street so late at night.","answers":["It","dangerous","for","to"],"source":"龍騰自命題","explanation":"本題運用It is adj. (+ for sb.) + to VR的句構。","explanationSource":"source"},{"id":22,"zh":"John的母親決定幫他轉學，因為他總是和他的同學在網咖廝混。","question":"John’s mom decided to transfer him to another school, because he always ①____________ ②____________ with his classmates in the Internet café.","answers":["hung","out"],"source":"龍騰自命題","explanation":"transfer sb. to another school幫某人轉學","explanationSource":"source"},{"id":23,"zh":"我大學主修地球科學；此外，我還在臺北天文館當過志工。","question":"I majored in Earth Science in college. ①____________ ②____________, I was a volunteer at the Taipei Astronomical Museum.","answers":["In","addition"],"source":"龍騰自命題","explanation":"major in 主修  volunteer 志工","explanationSource":"source"},{"id":24,"zh":"請不要覺得是針對個人，但是我確實覺得和長者說話時你應該更有禮貌。","question":"Please don’t ①____________ it ②____________, but I do think that you should be more polite while speaking to older people.","answers":["take","personally"],"source":"龍騰自命題","explanation":"take…personally認為……是針對個人","explanationSource":"source"},{"id":25,"zh":"老師停下來，問了學生們一個問題。","question":"The teacher ①____________ ②____________ ③____________ the students a question.","answers":["stopped","to","ask"],"source":"三合一學習手冊","explanation":"句意：老師停下來，問了學生們一個問題。 本題依序填入：stopped、to、ask。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":26,"zh":"為了保護環境，很多人已經停止使用塑膠袋，而是帶著自己的袋子去購物。","question":"To protect the environment, many people have stopped ____________ (use) plastic bags. Instead, they take their own bags when they go shopping.","answers":["using"],"source":"三合一學習手冊","explanation":"句意：為了保護環境，很多人已經停止使用塑膠袋，而是帶著自己的袋子去購物。 本題依序填入：using。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":27,"zh":"我現在不能跟你講話。我正在忙著準備晚餐。","question":"I can’t talk to you right now. I ①____________ ②____________ ③____________ dinner.","answers":["am","busy","preparing"],"source":"三合一學習手冊","explanation":"句意：我現在不能跟你講話。我正在忙著準備晚餐。 本題依序填入：am、busy、preparing。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":28,"zh":"別害怕告訴家人你的決定，而且我覺得他們會支持你。","question":"①____________ ②____________ ③____________ ④____________ ⑤____________ your family your decision, and I think they’ll support you.","answers":["Don’t","be","afraid","to","tell"],"source":"三合一學習手冊","explanation":"句意：別害怕告訴家人你的決定，而且我覺得他們會支持你。 本題依序填入：Don’t、be、afraid、to、tell。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":29,"zh":"這本書我已經讀超過十次了，所以我能記得書裡面的每個細節。","question":"I ①____________ ②____________ the book more than ③____________ ④____________, so I can remember every detail in it.","answers":["have","read","ten","times"],"source":"三合一學習手冊","explanation":"句意：這本書我已經讀超過十次了，所以我能記得書裡面的每個細節。 本題依序填入：have、read、ten、times。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":30,"zh":"Tina不是故意要上課打瞌睡。事實上，她得了重感冒。","question":"Tina didn’t mean to doze off in class. ①____________ ②____________, she had a bad cold.","answers":["In","fact"],"source":"三合一學習手冊","explanation":"句意：Tina不是故意要上課打瞌睡。事實上，她得了重感冒。 本題依序填入：In、fact。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":31,"zh":"別對那孩子失望。他只是需要一個人來告訴他該怎麼做。","question":"Don’t ①____________ ②____________ ③____________ that kid. He just needs someone to tell him what to do.","answers":["be","disappointed","with/in"],"source":"三合一學習手冊","explanation":"句意：別對那孩子失望。他只是需要一個人來告訴他該怎麼做。 本題依序填入：be、disappointed、with/in。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":32,"zh":"Leanne選擇這間大學因為它提供最好的資訊課程。此外，它的學費她負擔得起。","question":"Leanne chose this university because it offers the best courses in computer science. ①____________ ②____________, it is affordable.","answers":["In","addition"],"source":"三合一學習手冊","explanation":"句意：Leanne選擇這間大學因為它提供最好的資訊課程。此外，它的學費她負擔得起。 本題依序填入：In、addition。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":33,"zh":"如果你仔細閱讀這本小說到最後，你會知道誰是兇手。","question":"If you ①____________ ②____________ this novel to the end, you will know who the killer is.","answers":["go","through"],"source":"三合一學習手冊","explanation":"句意：如果你仔細閱讀這本小說到最後，你會知道誰是兇手。 本題依序填入：go、through。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":34,"zh":"你應該帶地圖以防你在陌生的地方迷路。","question":"You should carry a map ①____________ ②____________ you get lost in a strange place.","answers":["in","case"],"source":"三合一學習手冊","explanation":"句意：你應該帶地圖以防你在陌生的地方迷路。 本題依序填入：in、case。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":35,"zh":"Ryan不只是個朋友。他是我遇到麻煩時可以求助的對象。","question":"Ryan’s not just a friend. He is someone I can ①____________ ②____________ when I am in trouble.","answers":["turn","to"],"source":"三合一學習手冊","explanation":"句意：Ryan不只是個朋友。他是我遇到麻煩時可以求助的對象。 本題依序填入：turn、to。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":36,"zh":"請別認為這些評論是針對你個人。他只是個會批評每個人的傲慢老人。","question":"Please don’t ①____________ the comments ②____________. He is just an ignorant old man who criticizes everyone.","answers":["take","personally"],"source":"龍騰自命題","explanation":"comment 評論  ignorant 傲慢的　criticize 批評","explanationSource":"source"},{"id":37,"zh":"當George有經濟困難時，他總是求助於我。","question":"When George has money trouble, he always ①____________ ②____________ me.","answers":["turns","to"],"source":"龍騰自命題","explanation":"money trouble經濟困難","explanationSource":"source"},{"id":38,"zh":"雖然Ryder讀過了使用說明書，但他還是無法將這張茶几組裝好。","question":"Ryder ①____________ ②____________ the instruction manual, but he still couldn’t assemble the coffee table.","answers":["went","through"],"source":"龍騰自命題","explanation":"instruction manual 使用說明書  assemble 組裝  coffee table 茶几","explanationSource":"source"},{"id":39,"zh":"最近，我常想起在大學時我們一起廝混，做蠢事的那個年代。","question":"Recently, I often recall the times when we  ①____________ ②____________ and did silly things together in college.","answers":["hung","out"],"source":"龍騰自命題","explanation":"recall 回想  times 時光","explanationSource":"source"},{"id":40,"zh":"你人真好到那偏遠地區做慈善工作。","question":"It ①____________ ②____________ of you ③____________ do charity work in that remote area.","answers":["is","nice","to"],"source":"龍騰自命題","explanation":"charity work 慈善工作  remote area 偏遠地區","explanationSource":"source"},{"id":41,"zh":"這群孩子每天放學後在大賣場瞎晃。","question":"The kids ①____________ ②____________ in the mall every day after school.","answers":["hang","out"],"source":"龍騰自命題","explanation":"mall 大賣場","explanationSource":"source"},{"id":42,"zh":"每當覺得沮喪時，Teresa 常常尋求母親的建議與幫忙。","question":"Whenever she is depressed, Teresa often ①____________ ②____________ her mother for advice and help.","answers":["turns","to"],"source":"龍騰自命題","explanation":"depressed 沮喪的","explanationSource":"source"},{"id":43,"zh":"我詳閱清單以確保我已經打包好我需要的東西。","question":"I ①____________ ②____________ the checklist to make sure that I had packed everything I needed.","answers":["went","through"],"source":"龍騰自命題","explanation":"checklist 清單","explanationSource":"source"},{"id":44,"zh":"Alice和她的朋友總是在週五放學後聚在咖啡廳。","question":"Alice and her friends always ①____________ ②____________ in a café after school on Fridays.","answers":["hang","out"],"source":"課本例句填空","explanation":"句意：Alice和她的朋友總是在週五放學後聚在咖啡廳。 本題依序填入：hang、out。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"}]};</script>
