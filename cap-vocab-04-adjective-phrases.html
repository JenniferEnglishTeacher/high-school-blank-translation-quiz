<script>window.QUIZ_CONFIG={"title": "國中會考單字片語｜形容詞片語 Adjective Phrases", "mode": "mcq", "questions": [{"id": 1, "question": "Watermelons are ______ in winter, so they are very expensive now.", "options": ["to the point", "in use", "out of season", "on duty"], "answer": 2, "answerLabel": "C", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(C) out of season\n【用語】out of season (adj.phr.)：非盛產季節\n【中譯】西瓜在冬天不是盛產季節，所以現在很貴。", "explanationSource": "supplemental"}, {"id": 2, "question": "Grandpa was very sick last week, but the doctor says he is ______ now.", "options": ["in place", "out of danger", "on sale", "out of date"], "answer": 1, "answerLabel": "B", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(B) out of danger\n【用語】out of danger (adj.phr.)：脫離險境\n【中譯】爺爺上週病得很重，但醫生說他現在已經脫離險境了。", "explanationSource": "supplemental"}, {"id": 3, "question": "Mangoes are ______ in summer, so they are cheap and sweet.", "options": ["on leave", "in vain", "in season", "in trouble"], "answer": 2, "answerLabel": "C", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(C) in season\n【用語】in season (adj.phr.)：在盛產季節、在旺季\n【中譯】芒果在夏天正值盛產季節，所以又便宜又甜。", "explanationSource": "supplemental"}, {"id": 4, "question": "Mr. Lin's beef noodles are ______. Everyone says they are the best in town.", "options": ["at risk", "in pain", "second to none", "out of date"], "answer": 2, "answerLabel": "C", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(C) second to none\n【用語】second to none (adj.phr.)：不亞於任何人；最好的\n【中譯】林先生的牛肉麵是最棒的。大家都說那是鎮上最好吃的。", "explanationSource": "supplemental"}, {"id": 5, "question": "The car was ______ on the wet road and hit a tree.", "options": ["in season", "on display", "on a diet", "out of control"], "answer": 3, "answerLabel": "D", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(D) out of control\n【用語】out of control (adj.phr.)：失控\n【中譯】那輛車在濕滑的路上失控，撞上了一棵樹。", "explanationSource": "supplemental"}, {"id": 6, "question": "This map is ______. It doesn't show the new MRT station.", "options": ["safe and sound", "in sight", "out of date", "on board"], "answer": 2, "answerLabel": "C", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(C) out of date\n【用語】out of date (adj.phr.)：過時的\n【中譯】這張地圖過時了。它沒有標出新的捷運站。", "explanationSource": "supplemental"}, {"id": 7, "question": "The elevator is ______, so we have to take the stairs.", "options": ["second to none", "in good health", "out of order", "at ease"], "answer": 2, "answerLabel": "C", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(C) out of order\n【用語】out of order (adj.phr.)：（機器或設備）故障\n【中譯】電梯故障了，所以我們必須走樓梯。", "explanationSource": "supplemental"}, {"id": 8, "question": "My brother's hobby is ______ mine. He likes sports, but I like reading.", "options": ["the same as", "close to", "similar to", "different from"], "answer": 3, "answerLabel": "D", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(D) different from\n【用語】different from + N (adj.phr.)：與……不同\n【中譯】我哥哥的嗜好和我的不同。他喜歡運動，但我喜歡閱讀。", "explanationSource": "supplemental"}, {"id": 9, "question": "If you don't wear a helmet on a scooter, your life is ______.", "options": ["on sale", "at risk", "to the point", "in season"], "answer": 1, "answerLabel": "B", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(B) at risk\n【用語】at risk (adj.phr.)：有危險、冒風險\n【中譯】如果你騎機車不戴安全帽，你的生命就會有危險。", "explanationSource": "supplemental"}, {"id": 10, "question": "Help! The little boy is ______. He fell into the river!", "options": ["on duty", "in danger", "at ease", "out of danger"], "answer": 1, "answerLabel": "B", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(B) in danger\n【用語】in danger (adj.phr.)：處於危險之中\n【中譯】救命！那個小男孩有危險。他掉進河裡了！", "explanationSource": "supplemental"}, {"id": 11, "question": "The teacher's test questions are ______ the lessons in our textbook, so read the book carefully.", "options": ["based on", "far less than", "different from", "far from"], "answer": 0, "answerLabel": "A", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(A) based on\n【用語】based on + N (adj.phr.)：以……為基礎；根據\n【中譯】老師的考題是根據我們課本裡的課文出的，所以要仔細讀課本。", "explanationSource": "supplemental"}, {"id": 12, "question": "December is ______ month of the year, and January is the first.", "options": ["the same as", "the latest", "the last", "far less than"], "answer": 2, "answerLabel": "C", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(C) the last\n【用語】the last + N (adj.phr.)：最後的\n【中譯】十二月是一年中的最後一個月，而一月是第一個月。", "explanationSource": "supplemental"}, {"id": 13, "question": "Your speech was short and ______. Everyone understood your main idea.", "options": ["out of season", "in vain", "on leave", "to the point"], "answer": 3, "answerLabel": "D", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(D) to the point\n【用語】to the point (adj.phr.)：切題；掌握要點\n【中譯】你的演講簡短又切中要點。每個人都懂你的主旨。", "explanationSource": "supplemental"}, {"id": 14, "question": "Tom looked for his lost key all day, but his search was ______. He never found it.", "options": ["in place", "in use", "in vain", "good enough"], "answer": 2, "answerLabel": "C", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(C) in vain\n【用語】in vain (adj.phr.)：徒勞無功\n【中譯】湯姆整天都在找他遺失的鑰匙，但他的尋找都是白費力氣。他始終沒找到。", "explanationSource": "supplemental"}, {"id": 15, "question": "Ben broke the classroom window. Now he is ______ with the teacher.", "options": ["in season", "on the increase", "sunny side up", "in trouble"], "answer": 3, "answerLabel": "D", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(D) in trouble\n【用語】in trouble (adj.phr.)：處在麻煩中\n【中譯】班打破了教室的窗戶。現在他在老師那裡惹上麻煩了。", "explanationSource": "supplemental"}, {"id": 16, "question": "My school is ______ my home, so I have to take the bus every day.", "options": ["far from", "the same as", "based on", "similar to"], "answer": 0, "answerLabel": "A", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(A) far from\n【用語】far from + N (adj.phr.)：遠離\n【中譯】我的學校離我家很遠，所以我每天都必須搭公車。", "explanationSource": "supplemental"}, {"id": 17, "question": "These shoes are ______ today. They are 50% off!", "options": ["on sale", "on board", "on leave", "on duty"], "answer": 0, "answerLabel": "A", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(A) on sale\n【用語】on sale (adj.phr.)：在拍賣中、特價中\n【中譯】這些鞋子今天特價。打五折！", "explanationSource": "supplemental"}, {"id": 18, "question": "Your English is ______ for the test. Don't worry.", "options": ["out of date", "in pain", "at hand", "good enough"], "answer": 3, "answerLabel": "D", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(D) good enough\n【用語】good enough (adj.phr.)：夠好；足夠好的\n【中譯】你的英文程度應付這次考試已經夠好了。別擔心。", "explanationSource": "supplemental"}, {"id": 19, "question": "Amy felt ______ at her new school because her classmates were very friendly.", "options": ["on display", "in season", "at ease", "on sale"], "answer": 2, "answerLabel": "C", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(C) at ease\n【用語】at ease (adj.phr.)：自在\n【中譯】艾咪在新學校感到很自在，因為她的同學都很友善。", "explanationSource": "supplemental"}, {"id": 20, "question": "After the big typhoon, we were happy that all our family members were ______.", "options": ["out of season", "on the increase", "sunny side up", "safe and sound"], "answer": 3, "answerLabel": "D", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(D) safe and sound\n【用語】safe and sound (adj.phr.)：安然無恙\n【中譯】大颱風過後，我們很高興全家人都安然無恙。", "explanationSource": "supplemental"}, {"id": 21, "question": "Your answer is ______ mine. We both wrote 25.", "options": ["far from", "far less than", "the same as", "different from"], "answer": 2, "answerLabel": "C", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(C) the same as\n【用語】the same as + N (adj.phr.)：和……相同\n【中譯】你的答案和我的一樣。我們都寫了25。", "explanationSource": "supplemental"}, {"id": 22, "question": "We give our old clothes to people ______.", "options": ["on display", "in need", "in sight", "in place"], "answer": 1, "answerLabel": "B", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(B) in need\n【用語】in need (adj.phr.)：在窮困中的、有需要的\n【中譯】我們把舊衣服捐給有需要的人。", "explanationSource": "supplemental"}, {"id": 23, "question": "Our art works are ______ in the school hall this week. Come and see them!", "options": ["in pain", "on a diet", "out of control", "on display"], "answer": 3, "answerLabel": "D", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(D) on display\n【用語】on display (adj.phr.)：展出、展示\n【中譯】我們的美術作品這週在學校大廳展出。來看看吧！", "explanationSource": "supplemental"}, {"id": 24, "question": "Mr. Wang is ______ tonight, so he can't go home until 10 p.m.", "options": ["on sale", "second to none", "in season", "on duty"], "answer": 3, "answerLabel": "D", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(D) on duty\n【用語】on duty (adj.phr.)：值班、上班\n【中譯】王先生今晚值班，所以他要到晚上十點才能回家。", "explanationSource": "supplemental"}, {"id": 25, "question": "The number of people with pet dogs is ______ in Taiwan. There are more and more dogs every year.", "options": ["in vain", "at ease", "on sale", "on the increase"], "answer": 3, "answerLabel": "D", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(D) on the increase\n【用語】on the increase (adj.phr.)：在增加中\n【中譯】在台灣養寵物狗的人數正在增加。每年狗都越來越多。", "explanationSource": "supplemental"}, {"id": 26, "question": "The price of this phone is ______ the price of that one. This one is only NT$3,000, but that one is NT$30,000.", "options": ["close to", "far less than", "similar to", "the same as"], "answer": 1, "answerLabel": "B", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(B) far less than\n【用語】far less than + N (adj.phr.)：遠低於…（如：遠低於費用）\n【中譯】這支手機的價格遠低於那支的價格。這支只要三千元，但那支要三萬元。", "explanationSource": "supplemental"}, {"id": 27, "question": "Ken always wants ______ phone. He buys a new one as soon as it comes out.", "options": ["far less than", "the latest", "the same as", "the last"], "answer": 1, "answerLabel": "B", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(B) the latest\n【用語】the latest + N (adj.phr.)：最新的\n【中譯】肯總是想要最新的手機。新手機一推出他就買。", "explanationSource": "supplemental"}, {"id": 28, "question": "My grandma is 90 years old, but she is still ______. She walks in the park every morning.", "options": ["in good health", "at hand", "out of season", "on display"], "answer": 0, "answerLabel": "A", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(A) in good health\n【用語】in good health (adj.phr.)：健康狀況良好\n【中譯】我奶奶九十歲了，但她身體仍然很健康。她每天早上都在公園散步。", "explanationSource": "supplemental"}, {"id": 29, "question": "Your new bike looks ______ mine. Both are red, but yours is a little bigger.", "options": ["based on", "far from", "the same as", "similar to"], "answer": 3, "answerLabel": "D", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(D) similar to\n【用語】similar to + N (adj.phr.)：與……相似\n【中譯】你的新腳踏車看起來和我的很像。兩台都是紅色的，但你的稍微大一點。", "explanationSource": "supplemental"}, {"id": 30, "question": "Everything is ______ for the party. The food, drinks, and music are all ready.", "options": ["out of control", "in vain", "in place", "in trouble"], "answer": 2, "answerLabel": "C", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(C) in place\n【用語】in place (adj.phr.)：在適當的地方、就緒\n【中譯】派對的一切都已就緒。食物、飲料和音樂都準備好了。", "explanationSource": "supplemental"}, {"id": 31, "question": "Ms. Lee is ______ this week. She went to Japan with her family, so we have a new teacher.", "options": ["on the increase", "in use", "sunny side up", "on leave"], "answer": 3, "answerLabel": "D", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(D) on leave\n【用語】on leave (adj.phr.)：在休假中\n【中譯】李老師這週休假。她和家人去了日本，所以我們有一位代課老師。", "explanationSource": "supplemental"}, {"id": 32, "question": "The fire was big, but the firemen soon got it ______.", "options": ["under control", "on display", "out of control", "in season"], "answer": 0, "answerLabel": "A", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(A) under control\n【用語】under control (adj.phr.)：處於控制之下、在掌握之中\n【中譯】火勢很大，但消防員很快就控制住了。", "explanationSource": "supplemental"}, {"id": 33, "question": "The hotel is ______ the beach. We can walk there in two minutes.", "options": ["based on", "close to", "far from", "different from"], "answer": 1, "answerLabel": "B", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(B) close to\n【用語】close to + N (adj.phr.)：靠近……；接近……\n【中譯】那間飯店離海灘很近。我們走兩分鐘就到了。", "explanationSource": "supplemental"}, {"id": 34, "question": "We walked for an hour, and finally the mountain house was ______.", "options": ["in sight", "in need", "in good health", "on a diet"], "answer": 0, "answerLabel": "A", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(A) in sight\n【用語】in sight (adj.phr.)：看得見；在視線內\n【中譯】我們走了一個小時，終於看得到山屋了。", "explanationSource": "supplemental"}, {"id": 35, "question": "Mom is ______, so she eats only salad for dinner and no dessert.", "options": ["in use", "in sight", "on a diet", "second to none"], "answer": 2, "answerLabel": "C", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(C) on a diet\n【用語】on a diet (adj.phr.)：節食中\n【中譯】媽媽正在節食，所以晚餐她只吃沙拉，不吃甜點。", "explanationSource": "supplemental"}, {"id": 36, "question": "The books on the shelf are ______. Please put them back from Book 1 to Book 10.", "options": ["on the increase", "in vain", "out of order", "in place"], "answer": 2, "answerLabel": "C", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(C) out of order\n【用語】out of order (adj.phr.)：混亂、沒有照順序\n【中譯】書架上的書順序亂了。請把它們從第一冊到第十冊依序放回去。", "explanationSource": "supplemental"}, {"id": 37, "question": "Mary doesn't want to share a room with her sister. She wants a room ______.", "options": ["in sight", "in use", "on sale", "of her own"], "answer": 3, "answerLabel": "D", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(D) of her own\n【用語】of one's own (adj.phr.)：屬於自己的\n【中譯】瑪莉不想和她妹妹共用房間。她想要一間屬於自己的房間。", "explanationSource": "supplemental"}, {"id": 38, "question": "Please move your bike. It's ______, and I can't get out of the door.", "options": ["in my way", "under control", "on display", "in season"], "answer": 0, "answerLabel": "A", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(A) in my way\n【用語】in one's way (adj.phr.)：擋到（某人）的路\n【中譯】請移開你的腳踏車。它擋到我的路，我沒辦法出門。", "explanationSource": "supplemental"}, {"id": 39, "question": "Sorry, you can't use this computer now. It is ______.", "options": ["at ease", "in good health", "in season", "in use"], "answer": 3, "answerLabel": "D", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(D) in use\n【用語】in use (adj.phr.)：在使用中\n【中譯】抱歉，你現在不能用這台電腦。它正在使用中。", "explanationSource": "supplemental"}, {"id": 40, "question": "I'd like my eggs ______, with the yellow part on top.", "options": ["sunny side up", "in vain", "on board", "out of season"], "answer": 0, "answerLabel": "A", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(A) sunny side up\n【用語】sunny side up (adj.phr.)：單面煎蛋的\n【中譯】我的蛋要單面煎的，蛋黃朝上。", "explanationSource": "supplemental"}, {"id": 41, "question": "Jack hurt his leg in the game, and he was ______ all night.", "options": ["in place", "on the increase", "on sale", "in pain"], "answer": 3, "answerLabel": "D", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(D) in pain\n【用語】in pain (adj.phr.)：痛苦；疼痛中\n【中譯】傑克在比賽中弄傷了腿，整晚都很痛。", "explanationSource": "supplemental"}, {"id": 42, "question": "All the passengers are ______ now, so the train can leave.", "options": ["in vain", "on board", "on leave", "out of season"], "answer": 1, "answerLabel": "B", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(B) on board\n【用語】on board (adj.phr.)：在船、火車、飛機上\n【中譯】所有乘客現在都上車了，所以火車可以出發了。", "explanationSource": "supplemental"}, {"id": 43, "question": "The final exam is ______. It's next Monday, so let's study hard.", "options": ["out of season", "at hand", "at ease", "sunny side up"], "answer": 1, "answerLabel": "B", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(B) at hand\n【用語】at hand (adj.phr.)：即將發生、就在眼前\n【中譯】期末考就快到了。就在下週一，所以我們用功讀書吧。", "explanationSource": "supplemental"}, {"id": 44, "question": "I can't find any fresh strawberries at the market. They are ______ in August.", "options": ["in pain", "out of season", "under control", "on display"], "answer": 1, "answerLabel": "B", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(B) out of season\n【用語】out of season (adj.phr.)：非盛產季節\n【中譯】我在市場找不到新鮮草莓。八月不是草莓的盛產季節。", "explanationSource": "supplemental"}, {"id": 45, "question": "The boat was in a big storm, but now it is back at the port and everyone is ______.", "options": ["in season", "out of danger", "out of date", "on sale"], "answer": 1, "answerLabel": "B", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(B) out of danger\n【用語】out of danger (adj.phr.)：脫離險境\n【中譯】那艘船遇上了大暴風雨，但現在它已回到港口，大家都脫離險境了。", "explanationSource": "supplemental"}, {"id": 46, "question": "It's July now. Lychees are ______, so you can see them in every fruit shop.", "options": ["out of season", "in pain", "out of order", "in season"], "answer": 3, "answerLabel": "D", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(D) in season\n【用語】in season (adj.phr.)：在盛產季節、在旺季\n【中譯】現在是七月。荔枝正值盛產季節，所以每家水果店都看得到。", "explanationSource": "supplemental"}, {"id": 47, "question": "Everyone loves the beef noodles at this shop. They are ______ in our town.", "options": ["second to none", "out of date", "on a diet", "in danger"], "answer": 0, "answerLabel": "A", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(A) second to none\n【用語】second to none (adj.phr.)：不亞於任何人；最好的\n【中譯】大家都愛這家店的牛肉麵。它們在我們鎮上是最好的。", "explanationSource": "supplemental"}, {"id": 48, "question": "The car was ______ and hit a tree on the rainy road.", "options": ["out of control", "in season", "safe and sound", "on display"], "answer": 0, "answerLabel": "A", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(A) out of control\n【用語】out of control (adj.phr.)：失控\n【中譯】那輛車在下雨的路上失控，撞上了一棵樹。", "explanationSource": "supplemental"}, {"id": 49, "question": "Don't use this old dictionary. It's ______, and many new words are not in it.", "options": ["in season", "out of date", "on board", "second to none"], "answer": 1, "answerLabel": "B", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(B) out of date\n【用語】out of date (adj.phr.)：過時的\n【中譯】別用這本舊字典。它過時了，很多新字都沒有收在裡面。", "explanationSource": "supplemental"}, {"id": 50, "question": "The vending machine is ______. It took my money but gave me nothing.", "options": ["out of order", "in good health", "on sale", "to the point"], "answer": 0, "answerLabel": "A", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(A) out of order\n【用語】out of order (adj.phr.)：（機器或設備）故障\n【中譯】這台販賣機故障了。它吃了我的錢，卻什麼都沒給我。", "explanationSource": "supplemental"}, {"id": 51, "question": "Jenny looks like her twin sister, but her hobbies are ______ her sister's. Jenny loves sports, but her sister loves music.", "options": ["different from", "the same as", "similar to", "close to"], "answer": 0, "answerLabel": "A", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(A) different from\n【用語】different from + N (adj.phr.)：與……不同\n【中譯】珍妮長得像她的雙胞胎姊妹，但她的嗜好和她姊妹的不同。珍妮熱愛運動，而她的姊妹熱愛音樂。", "explanationSource": "supplemental"}, {"id": 52, "question": "If you ride a bike without a helmet, your life is ______.", "options": ["at risk", "second to none", "on sale", "on display"], "answer": 0, "answerLabel": "A", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(A) at risk\n【用語】at risk (adj.phr.)：有危險、冒風險\n【中譯】如果你騎腳踏車不戴安全帽，你的生命就會有危險。", "explanationSource": "supplemental"}, {"id": 53, "question": "Help! The little boy fell into the river. He is ______!", "options": ["out of date", "on a diet", "in danger", "on duty"], "answer": 2, "answerLabel": "C", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(C) in danger\n【用語】in danger (adj.phr.)：處於危險之中\n【中譯】救命啊！那個小男孩掉進河裡了。他有危險！", "explanationSource": "supplemental"}, {"id": 54, "question": "This movie is ______ a true story. It really happened in 1999.", "options": ["based on", "far from", "different from", "far less than"], "answer": 0, "answerLabel": "A", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(A) based on\n【用語】based on + N (adj.phr.)：以……為基礎；根據\n【中譯】這部電影是根據真實故事改編的。這件事真的在1999年發生過。", "explanationSource": "supplemental"}, {"id": 55, "question": "Z is ______ letter of the English alphabet.", "options": ["the last", "similar to", "the same as", "the latest"], "answer": 0, "answerLabel": "A", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(A) the last\n【用語】the last + N (adj.phr.)：最後的\n【中譯】Z是英文字母的最後一個字母。", "explanationSource": "supplemental"}, {"id": 56, "question": "Your speech is too long. Please keep it short and ______.", "options": ["in sight", "on board", "to the point", "in vain"], "answer": 2, "answerLabel": "C", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(C) to the point\n【用語】to the point (adj.phr.)：切題；掌握要點\n【中譯】你的演講太長了。請保持簡短並切中要點。", "explanationSource": "supplemental"}, {"id": 57, "question": "Tom looked for his lost dog all day, but his hard work was ______. He never found it.", "options": ["in good health", "in vain", "on display", "to the point"], "answer": 1, "answerLabel": "B", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(B) in vain\n【用語】in vain (adj.phr.)：徒勞無功\n【中譯】湯姆找他走失的狗找了一整天，但他的努力都白費了。他始終沒有找到牠。", "explanationSource": "supplemental"}, {"id": 58, "question": "Ben broke his mom's favorite cup. Now he is ______.", "options": ["in season", "in trouble", "at ease", "on display"], "answer": 1, "answerLabel": "B", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(B) in trouble\n【用語】in trouble (adj.phr.)：處在麻煩中\n【中譯】班打破了他媽媽最愛的杯子。現在他麻煩大了。", "explanationSource": "supplemental"}, {"id": 59, "question": "Lisa's home is ______ her school, so she has to get up at six and take a bus for an hour.", "options": ["the same as", "similar to", "far from", "close to"], "answer": 2, "answerLabel": "C", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(C) far from\n【用語】far from + N (adj.phr.)：遠離\n【中譯】莉莎家離學校很遠，所以她必須六點起床，搭一個小時的公車。", "explanationSource": "supplemental"}, {"id": 60, "question": "Everything in this store is ______ this week. You can buy two T-shirts for the price of one!", "options": ["on duty", "on sale", "in pain", "out of danger"], "answer": 1, "answerLabel": "B", "source": "形容詞片語 Adjective Phrases", "explanation": "【答案】(B) on sale\n【用語】on sale (adj.phr.)：在拍賣中、特價中\n【中譯】這家店的所有商品這週都在特價。你可以用一件的價格買兩件T恤！", "explanationSource": "supplemental"}]};</script><script>window.LEARN_DATA=[{"g": "", "t": "at ease", "p": "(adj.phr.)", "e": "relaxed and comfortable", "z": "自在", "s": "The new student felt nervous on her first day, but our friendly teacher soon made her feel _____ _____ in the classroom.", "c": "新同學第一天覺得很緊張，但我們親切的老師很快就讓她在教室裡感到【自在】。", "f": "The new student felt nervous on her first day, but our friendly teacher soon made her feel at ease in the classroom."}, {"g": "", "t": "at hand", "p": "(adj.phr.)", "e": "going to happen very soon", "z": "即將發生、就在眼前", "s": "The final exam is _____ _____, so Jessica stopped watching TV and started reviewing her notes every night.", "c": "期末考【就在眼前】，所以潔西卡不再看電視，開始每晚複習筆記。", "f": "The final exam is at hand, so Jessica stopped watching TV and started reviewing her notes every night."}, {"g": "", "t": "at risk", "p": "(adj.phr.)", "e": "in danger", "z": "有危險、冒風險", "s": "Children who play near the river after heavy rain are _____ _____, so parents should keep them away from the water.", "c": "大雨過後在河邊玩耍的孩子【有危險】，所以父母應該讓他們遠離水邊。", "f": "Children who play near the river after heavy rain are at risk, so parents should keep them away from the water."}, {"g": "", "t": "based on + N", "p": "(adj.phr.)", "e": "using something as the main idea or source", "z": "以……為基礎；根據", "s": "The movie we watched in class yesterday was _____ _____ a true story, so many students wanted to read the book after school.", "c": "我們昨天在課堂上看的電影是【根據】一個真實故事改編的，所以很多學生放學後都想讀那本書。", "f": "The movie we watched in class yesterday was based on a true story, so many students wanted to read the book after school."}, {"g": "", "t": "close to + N", "p": "(adj.phr.)", "e": "near something or someone", "z": "靠近……；接近……", "s": "Our new apartment is very _____ _____ the MRT station, so my mom can get to her office in only ten minutes.", "c": "我們的新公寓非常【靠近】捷運站，所以我媽媽只要十分鐘就能到辦公室。", "f": "Our new apartment is very close to the MRT station, so my mom can get to her office in only ten minutes."}, {"g": "", "t": "different from + N", "p": "(adj.phr.)", "e": "not the same as something else", "z": "與……不同", "s": "Life in the countryside is very _____ _____ life in Taipei because there are fewer cars and the streets are much quieter.", "c": "鄉下的生活和台北的生活很【不同】，因為車子比較少，街道也安靜得多。", "f": "Life in the countryside is very different from life in Taipei because there are fewer cars and the streets are much quieter."}, {"g": "", "t": "far from + N", "p": "(adj.phr.)", "e": "a long way away from a place", "z": "遠離", "s": "Grandma's farm is _____ _____ the city, so we have to drive for three hours when we visit her.", "c": "奶奶的農場【遠離】城市，所以我們去看她時得開三個小時的車。", "f": "Grandma's farm is far from the city, so we have to drive for three hours when we visit her."}, {"g": "", "t": "far less than + N", "p": "(adj.phr.)", "e": "much smaller in amount than", "z": "遠低於…（如：遠低於費用）", "s": "The used bike that Kevin bought online cost _____ _____ _____ a new one, so he had enough money left for a helmet.", "c": "凱文在網路上買的二手腳踏車價錢【遠低於】新車，所以他還剩下足夠的錢買安全帽。", "f": "The used bike that Kevin bought online cost far less than a new one, so he had enough money left for a helmet."}, {"g": "", "t": "good enough", "p": "(adj.phr.)", "e": "as good as needed", "z": "夠好；足夠好的", "s": "My English is not _____ _____ to read Harry Potter yet, but I read easier storybooks every night before bed.", "c": "我的英文還沒【好到足以】讀《哈利波特》，但我每晚睡前都會讀比較簡單的故事書。", "f": "My English is not good enough to read Harry Potter yet, but I read easier storybooks every night before bed."}, {"g": "", "t": "in danger", "p": "(adj.phr.)", "e": "likely to be hurt or killed", "z": "處於危險之中", "s": "Many sea turtles are _____ _____ because people throw plastic bags into the ocean, and the turtles eat them by mistake.", "c": "許多海龜正【處於危險之中】，因為人們把塑膠袋丟進海裡，海龜會誤食它們。", "f": "Many sea turtles are in danger because people throw plastic bags into the ocean, and the turtles eat them by mistake."}, {"g": "", "t": "in good health", "p": "(adj.phr.)", "e": "healthy and strong", "z": "健康狀況良好", "s": "My grandfather is eighty years old, but he is still _____ _____ _____ because he walks in the park every morning.", "c": "我爺爺八十歲了，但他仍然【健康狀況良好】，因為他每天早上都去公園散步。", "f": "My grandfather is eighty years old, but he is still in good health because he walks in the park every morning."}, {"g": "", "t": "in need", "p": "(adj.phr.)", "e": "poor or needing help", "z": "在窮困中的、有需要的", "s": "Every winter our school collects warm clothes and blankets, and we give them to families _____ _____ in the mountains.", "c": "每年冬天我們學校都會收集保暖衣物和毯子，送給山區【有需要的】家庭。", "f": "Every winter our school collects warm clothes and blankets, and we give them to families in need in the mountains."}, {"g": "", "t": "in one's way", "p": "(adj.phr.)", "e": "blocking someone so they cannot move or pass", "z": "擋到（某人）的路", "s": "Could you move your bike a little, Jason? It is _____ my _____, and I can't get my scooter out of the garage.", "c": "傑森，你可以把腳踏車移開一點嗎？它【擋到我】了，我沒辦法把機車牽出車庫。", "f": "Could you move your bike a little, Jason? It is in my way, and I can't get my scooter out of the garage."}, {"g": "", "t": "in pain", "p": "(adj.phr.)", "e": "feeling hurt", "z": "痛苦；疼痛中", "s": "Leo fell off his bike on the way to school, and he was _____ _____ for hours, so his teacher called his parents.", "c": "李歐上學途中從腳踏車上摔下來，好幾個小時都【處於疼痛中】，所以老師打電話給他的父母。", "f": "Leo fell off his bike on the way to school, and he was in pain for hours, so his teacher called his parents."}, {"g": "", "t": "in place", "p": "(adj.phr.)", "e": "in the right position; ready", "z": "在適當的地方、就緒", "s": "Before the guests arrived for Mom's birthday party, we made sure all the plates, cups, and the cake were _____ _____.", "c": "客人來參加媽媽的生日派對前，我們確認所有的盤子、杯子和蛋糕都已經【就緒】。", "f": "Before the guests arrived for Mom's birthday party, we made sure all the plates, cups, and the cake were in place."}, {"g": "", "t": "in season", "p": "(adj.phr.)", "e": "(of fruit) easy to find and cheap now", "z": "在盛產季節、在旺季", "s": "Mangoes are _____ _____ in summer, so they are cheap and sweet, and my family eats them almost every day.", "c": "芒果在夏天【正值盛產季節】，所以又便宜又甜，我們家幾乎每天都吃。", "f": "Mangoes are in season in summer, so they are cheap and sweet, and my family eats them almost every day."}, {"g": "", "t": "in sight", "p": "(adj.phr.)", "e": "able to be seen", "z": "看得見；在視線內", "s": "We walked for two hours in the mountains, but there was still no house _____ _____, so we started to feel worried.", "c": "我們在山裡走了兩個小時，但仍然沒有任何房子【在視線內】，所以我們開始擔心了。", "f": "We walked for two hours in the mountains, but there was still no house in sight, so we started to feel worried."}, {"g": "", "t": "in trouble", "p": "(adj.phr.)", "e": "having a problem or about to be punished", "z": "處在麻煩中", "s": "Tim forgot to do his homework again, and he knew he was _____ _____ when the teacher asked him to stand up.", "c": "提姆又忘了寫作業，當老師叫他站起來時，他知道自己【有麻煩了】。", "f": "Tim forgot to do his homework again, and he knew he was in trouble when the teacher asked him to stand up."}, {"g": "", "t": "in use", "p": "(adj.phr.)", "e": "being used now", "z": "在使用中", "s": "Sorry, you can't take that computer right now because it is _____ _____, but the one next to the window is free.", "c": "抱歉，你現在不能用那台電腦，因為它【在使用中】，但窗邊那台是空的。", "f": "Sorry, you can't take that computer right now because it is in use, but the one next to the window is free."}, {"g": "", "t": "in vain", "p": "(adj.phr.)", "e": "without success", "z": "徒勞無功", "s": "The firemen tried to save the old wooden temple, but all their hard work was _____ _____ because the fire spread too fast.", "c": "消防員試著搶救那座老木造廟宇，但因為火勢蔓延太快，他們所有的努力都【徒勞無功】。", "f": "The firemen tried to save the old wooden temple, but all their hard work was in vain because the fire spread too fast."}, {"g": "", "t": "of one's own", "p": "(adj.phr.)", "e": "belonging only to that person", "z": "屬於自己的", "s": "My sister finally has a bedroom _____ her _____, so she doesn't have to share with me anymore.", "c": "我姊姊終於有了【屬於自己的】房間，所以她不用再跟我一起住了。", "f": "My sister finally has a bedroom of her own, so she doesn't have to share with me anymore."}, {"g": "", "t": "on a diet", "p": "(adj.phr.)", "e": "eating less to lose weight", "z": "節食中", "s": "My uncle is _____ _____ _____ because the doctor told him to lose weight, so he doesn't eat fried chicken anymore.", "c": "我叔叔正在【節食】，因為醫生叫他減重，所以他不再吃炸雞了。", "f": "My uncle is on a diet because the doctor told him to lose weight, so he doesn't eat fried chicken anymore."}, {"g": "", "t": "on board", "p": "(adj.phr.)", "e": "on a ship, train, or plane", "z": "在船、火車、飛機上", "s": "When all the passengers were _____ _____, the captain told us to fasten our seat belts because the plane was ready to take off.", "c": "所有乘客都【在飛機上】坐好後，機長要我們繫好安全帶，因為飛機準備起飛了。", "f": "When all the passengers were on board, the captain told us to fasten our seat belts because the plane was ready to take off."}, {"g": "", "t": "on display", "p": "(adj.phr.)", "e": "put out for people to see", "z": "展出、展示", "s": "The students' paintings about Taiwan's beautiful mountains are _____ _____ in the school hall, and parents can visit them this week.", "c": "學生們畫台灣美麗山景的畫作正在學校大廳【展出】，家長們這週可以去參觀。", "f": "The students' paintings about Taiwan's beautiful mountains are on display in the school hall, and parents can visit them this week."}, {"g": "", "t": "on duty", "p": "(adj.phr.)", "e": "working at a certain time", "z": "值班、上班", "s": "The nurse who was _____ _____ that night stayed awake until morning because many patients needed help after the accident.", "c": "那晚【值班】的護理師一直醒著到早上，因為意外發生後有很多病人需要幫忙。", "f": "The nurse who was on duty that night stayed awake until morning because many patients needed help after the accident."}, {"g": "", "t": "on leave", "p": "(adj.phr.)", "e": "away from work for a time", "z": "在休假中", "s": "Our English teacher is _____ _____ this month because she just had a baby, so a new teacher is teaching our class.", "c": "我們英文老師這個月【在休假中】，因為她剛生了寶寶，所以由一位新老師來教我們班。", "f": "Our English teacher is on leave this month because she just had a baby, so a new teacher is teaching our class."}, {"g": "", "t": "on sale", "p": "(adj.phr.)", "e": "sold at a lower price than usual", "z": "在拍賣中、特價中", "s": "All the winter jackets in this store are _____ _____ this week, so Mom bought one for me and one for my brother.", "c": "這家店所有的冬季外套這週都在【特價中】，所以媽媽幫我和弟弟各買了一件。", "f": "All the winter jackets in this store are on sale this week, so Mom bought one for me and one for my brother."}, {"g": "", "t": "on the increase", "p": "(adj.phr.)", "e": "getting bigger in number", "z": "在增加中", "s": "The number of people riding bikes to work in Taipei is _____ _____ _____ because it is cheap, healthy, and good for the environment.", "c": "在台北騎腳踏車上班的人數【在增加中】，因為這樣既便宜、健康，又對環境好。", "f": "The number of people riding bikes to work in Taipei is on the increase because it is cheap, healthy, and good for the environment."}, {"g": "", "t": "out of control", "p": "(adj.phr.)", "e": "cannot be stopped or managed", "z": "失控", "s": "The fire in the old building was _____ _____ _____, so the firefighters asked everyone on the street to move away.", "c": "那棟老建築的火勢已經【失控】，所以消防員要求街上的每個人都離開。", "f": "The fire in the old building was out of control, so the firefighters asked everyone on the street to move away."}, {"g": "", "t": "out of danger", "p": "(adj.phr.)", "e": "safe now, not going to be hurt", "z": "脫離險境", "s": "The boy fell into the river, but a brave man jumped in to save him, and now he is _____ _____ _____.", "c": "那男孩掉進河裡，但一位勇敢的男子跳下去救他，現在他已經【脫離險境】了。", "f":
