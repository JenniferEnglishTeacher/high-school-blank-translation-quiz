<style>

r-row label{font-weight:800;min-width:58px}.answer-input{font:inherit;font-size:18px;padding:9px 10px;border:2px solid #94a3b8;border-radius:9px;flex:1;min-width:0}.answer-input.ok{border-color:var(--ok);background:var(--okbg)}.answer-input.bad{border-color:var(--bad);background:var(--badbg)}.picture{display:block;max-width:100%;max-height:330px;object-fit:contain;margin:12px auto;border:1px solid var(--line);border-radius:12px;background:#fff}.feedback,.voicebox{padding:13px;margin-top:14px;border-radius:10px}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.voicebox{background:var(--voicebg);border:2px solid #ddd6fe}.target{font-size:19px;font-weight:800;margin:6px 0 10px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}@media(max-width:640px){.wrap{padding:10px}.hero,.card{padding:15px}.stem{font-size:18px}}

<section class="hero"><h1>翰林 Book 6 Unit 3 字彙選擇</h1><p>請選出最適合的答案。</p><p class="note">答錯會顯示正確答案並要求重填；答對後會朗讀英文。結束時可下載 DOCX 錯題紀錄。</p><a class="home" href="dashboard.html">← 回測驗 Dashboard</a></section>

const TITLE="翰林 Book 6 Unit 3 字彙選擇",KIND="mcq",Q=[{"id": 1, "stem": "(   ) Megan ______ that somebody took her luggage（行李）by mistake.", "options": ["acted on", "pointed out", "changed into", "laughed at"], "answer": 1, "explanation": "Megan「指出」有人誤拿了她的行李。", "full": "Megan pointed out that somebody took her luggage by mistake.", "src": 1}, {"id": 2, "stem": "(   ) This ______ was made by my uncle to pick mangoes（芒果）.", "options": ["brain", "date", "tool", "sight"], "answer": 2, "explanation": "「工具」是用來摘芒果的，故選(Ｃ)。", "full": "This tool was made by my uncle to pick mangoes.", "src": 3}, {"id": 3, "stem": "(   ) Last Friday, an education ______ came to our school and shared his difficult learning experience with us.", "options": ["language", "appetite", "costume", "expert"], "answer": 3, "explanation": "教育「專家」到學校分享個人艱困的學習經驗。", "full": "Last Friday, an education expert came to our school and shared his difficult learning experience with us.", "src": 4}, {"id": 4, "stem": "(   ) Ted ______ how crazy it may be to hold a costume party at school.", "options": ["picked up", "stood out", "woke up", "pointed out"], "answer": 3, "explanation": "Ted「指出」在學校舉辦化妝派對可能有多瘋狂。(Ａ)撿起(Ｂ)突出(Ｃ)醒來。", "full": "Ted pointed out how crazy it may be to hold a costume party at school.", "src": 5}, {"id": 5, "stem": "(   ) When you operate（操作）the machine ______ , you will find that it helps you a lot.", "options": ["quickly", "finally", "simply", "wisely"], "answer": 3, "explanation": "「明智地」操作機器，會發現它的助益很大。", "full": "When you operate the machine wisely, you will find that it helps you a lot.", "src": 6}, {"id": 6, "stem": "(   ) Kent’s mom was ______ with his grade on the math test.", "options": ["national", "pleased", "correct", "possible"], "answer": 1, "explanation": "be pleased with：對…感到滿意。", "full": "Kent’s mom was pleased with his grade on the math test.", "src": 7}, {"id": 7, "stem": "(   ) We can’t talk to others in class. ______ , we have to listen to teachers carefully.", "options": ["Little by little", "What’s more", "Once upon a time", "All year round"], "answer": 1, "explanation": "上課中不能與人交談。「還有」，要仔細聽老師說了什麼。", "full": "We can’t talk to others in class. What’s more, we have to listen to teachers carefully.", "src": 8}, {"id": 8, "stem": "(   ) Sophia: Mia, why do you look so sad?\nMia: I stayed up all night to prepare for the test. But my grade was so poor.\nSophia: It was too difficult to get a good grade this time.\nMia: No. Shelly still got the highest grade in class. She got eighty-five.\nSophia: Come on! She gets used to studying English every day! You studied it for only one night! According to this conversation（對話）, which one is correct?", "options": ["The test was so difficult that nobody’s grade was higher than eighty.", "Mia didn’t care about her grade on the test.", "We can’t know Sophia’s grade from this conversation.", "Not only Shelly but also Sophia gets used to studying English every day."], "answer": 2, "explanation": "對話中未提到 Sophia 的成績，故選(Ｃ)。(Ａ) Shelly 成績有超過 80 分(Ｂ)Mia 因為成績差而傷心(Ｄ)對話只提到 Shelly 每天都在讀英文。", "full": "We can’t know Sophia’s grade from this conversation.", "src": 9}, {"id": 9, "stem": "(   ) It is raining so heavily that we can’t play basketball outside. Let’s watch TV at home ______ .", "options": ["instead", "suddenly", "probably", "already"], "answer": 0, "explanation": "外面雨太大無法打籃球，「改為」在家看電視，以 instead 表達取代之意，故選(Ａ)。", "full": "It is raining so heavily that we can’t play basketball outside. Let’s watch TV at home instead.", "src": 10}, {"id": 10, "stem": "(   ) Dad, thanks for ______ all the mistakes in my math homework. I’ll correct them before going to bed.", "options": ["taking down", "depending on", "pointing out", "giving out"], "answer": 2, "explanation": "謝謝爸爸「指出」我數學功課所有的錯誤。", "full": "Dad, thanks for pointing out all the mistakes in my math homework. I’ll correct them before going to bed.", "src": 11}, {"id": 11, "stem": "(   ) The restaurant tried to ______ its customers（顧客） by giving them free snacks and drinks.", "options": ["miss", "store", "please", "collect"], "answer": 2, "explanation": "正確答案：please", "full": "The restaurant tried to please its customers by giving them free snacks and drinks.", "src": 12}, {"id": 12, "stem": "(   ) I like Ms. Hu’s class because she can ______ difficult ideas in simple words for me to understand.", "options": ["point", "dream", "explain", "build"], "answer": 2, "explanation": "以簡單的話「解釋」艱深的概念。", "full": "I like Ms. Hu’s class because she can explain difficult ideas in simple words for me to understand.", "src": 13}, {"id": 13, "stem": "(   ) It ______ Lisa a lot to finally find her lost keys under the refrigerator. She kept looking for them for days.", "options": ["pleased", "repeated", "headed", "corrected"], "answer": 0, "explanation": "Lisa 終於找到她尋找多天遺失的鑰匙，感到很「滿意；喜悅」。", "full": "It pleased Lisa a lot to finally find her lost keys under the refrigerator. She kept looking for them for days.", "src": 14}, {"id": 14, "stem": "(   ) It’s raining right now, so I don’t see the ______ of hanging our clothes outside.", "options": ["point", "topic", "power", "problem"], "answer": 0, "explanation": "正確答案：point", "full": "It’s raining right now, so I don’t see the point of hanging our clothes outside.", "src": 15}, {"id": 15, "stem": "(   ) Look! The YouTuber says it’s easy to keep the kitchen clean, and she will teach how to clean the kitchen ______ .", "options": ["suddenly", "wisely", "luckily", "clearly"], "answer": 1, "explanation": "YouTuber 要教導如何「明智地」打掃廚房。", "full": "Look! The YouTuber says it’s easy to keep the kitchen clean, and she will teach how to clean the kitchen wisely.", "src": 16}, {"id": 16, "stem": "(   ) Mr. Yamamoto said we did a good job because our show ______ him.", "options": ["pleased", "pointed", "created", "covered"], "answer": 0, "explanation": "Yamamoto 先生因為我們的表演令他滿意而誇獎我們，用 please（使滿意）。", "full": "Mr. Yamamoto said we did a good job because our show pleased him.", "src": 17}, {"id": 17, "stem": "(   ) I don’t think he is a(n) ______ . Most of what he says is not right.", "options": ["expert", "memory", "country", "brain"], "answer": 0, "explanation": "不認為某人是「專家」，因為此人說的話大多不正確。", "full": "I don’t think he is a(n) expert. Most of what he says is not right.", "src": 18}, {"id": 18, "stem": "(   ) Laura’s cousin is a coffee ______ . If you want to know more about coffee, you can ask him.", "options": ["store", "apartment", "course", "expert"], "answer": 3, "explanation": "Laura 的表哥是咖啡「專家」，咖啡的事可請教他。", "full": "Laura’s cousin is a coffee expert. If you want to know more about coffee, you can ask him.", "src": 19}, {"id": 19, "stem": "(   ) Don’t count on people support（支持） you forever. You can’t ______ everyone.", "options": ["knock", "cheat", "head", "please"], "answer": 3, "explanation": "從題幹 “Don’t count on...（別指望）”，所以不可能「取悅…」比較合理。", "full": "Don’t count on people support you forever. You can’t please everyone.", "src": 20}, {"id": 20, "stem": "(   ) What did the waitress do to ______ the picky（挑剔的）woman? She wasn’t angry with us today.", "options": ["leave", "please", "focus", "miss"], "answer": 1, "explanation": "女服務生「取悅」了挑剔的女人，使她不生氣。", "full": "What did the waitress do to please the picky woman? She wasn’t angry with us today.", "src": 21}, {"id": 21, "stem": "(   ) My younger sister had a sore throat, so she didn’t eat any rice or dishes for lunch. ______ , she had some ice cream.", "options": ["Slowly", "Instead", "Lately", "Often"], "answer": 1, "explanation": "妹妹因喉嚨痛未吃飯菜，「而是」改吃冰淇淋，以 instead 表達。", "full": "My younger sister had a sore throat, so she didn’t eat any rice or dishes for lunch. Instead, she had some ice cream.", "src": 22}, {"id": 22, "stem": "(   ) Today, people can order something with a cellphone. However, it was not “smart” ______ in the past.", "options": ["neither", "enough", "yet", "quite"], "answer": 1, "explanation": "從題幹中 “in the past” 與 “ However” 可知，過去的手機不夠聰明。故選(Ｂ)足夠地。", "full": "Today, people can order something with a cellphone. However, it was not “smart” enough in the past.", "src": 23}, {"id": 23, "stem": "(   ) Kelly is ______ articles about AI for her science report.", "options": ["counting on", "blowing up", "looking for", "dreaming of"], "answer": 2, "explanation": "Kelly 在「尋找」關於 AI 的文章。", "full": "Kelly is looking for articles about AI for her science report.", "src": 24}, {"id": 24, "stem": "(   ) Jack seems（似乎）to think he can do as he ______ in school. He doesn’t care about the school rules at all.", "options": ["pleases", "explains", "defines", "reaches"], "answer": 0, "explanation": "Jack 似乎認為他可以在學校「為所欲為」。他完全不在乎學校規則。(Ｂ)解釋(Ｃ)定義(Ｄ)達到。", "full": "Jack seems to think he can do as he pleases in school. He doesn’t care about the school rules at all.", "src": 25}, {"id": 25, "stem": "(   ) The ______ is that you should tell your parents where you will go, or they will worry about you.", "options": ["point", "deal", "leader", "course"], "answer": 0, "explanation": "「重點」是你要告訴父母你要去哪裡。", "full": "The point is that you should tell your parents where you will go, or they will worry about you.", "src": 26}, {"id": 26, "stem": "(   ) Your ______ of the new lesson is different from ours.", "options": ["waiter", "ticket", "thousand", "point"], "answer": 3, "explanation": "point：觀點；看法。", "full": "Your point of the new lesson is different from ours.", "src": 27}, {"id": 27, "stem": "(   ) The police officer found a similar（相似的） ______ from the files, so he thought the murderer（兇手）might be the same person.", "options": ["law", "case", "tool", "yard"], "answer": 1, "explanation": "警察從檔案中找到相似的「案例」而認為兇手為同一人。", "full": "The police officer found a similar case from the files, so he thought the murderer might be the same person.", "src": 28}, {"id": 28, "stem": "(   ) Jay, I’m too busy to pick up our son later. Could you help drive him home ______ ?", "options": ["critically", "instead", "simply", "part-time"], "answer": 1, "explanation": "Jay 的太太要求 Jay「代替」她去接載兒子回家。", "full": "Jay, I’m too busy to pick up our son later. Could you help drive him home instead?", "src": 29}];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=s=>String(s??'').trim().toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:()“”"]/g,'').replace(/\s+/g,' ');
let chosen=[],idx=0;const wrong=new Map(),attempted=new Set(),correct=new Set();
function preview(q){return KIND==='mcq'?q.stem:q.prompt}
function renderList(){$('#list').innerHTML=Q.map(q=>`<label class="pick"><input class="pickbox" type="checkbox" value="${q.id}" checked><span><b>第 ${q.id} 題</b><small>${esc(preview(q))}</small></span></label>`).join('')}
function setAll(v){document.querySelectorAll('.pickbox').forEach(x=>x.checked=v)}
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
$('#all').onclick=()=>setAll(true);$('#none').onclick=()=>setAll(false);$('#random').onclick=()=>{setAll(false);const ids=new Set(shuffled(Q).slice(0,20).map(q=>q.id));document.querySelectorAll('.pickbox').forEach(x=>x.checked=ids.has(+x.value))};
$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));idx=0;wrong.clear();attempted.clear();correct.clear();$('#select').classList.add('hidden');$('#result').classList.add('hidden');$('#quiz').classList.remove('hidden');show()};
function show(){if(window.speechSynthesis)speechSynthesis.cancel();const q=chosen[idx];$('#meta').textContent=`第 ${idx+1} / ${chosen.length} 題｜原題 ${q.id}`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=`${idx/chosen.length*100}%`;$('#stem').textContent=KIND==='mcq'?q.stem:q.prompt;const pic=$('#picture');if(q.image){pic.src=q.image;pic.classList.remove('hidden')}else{pic.classList.add('hidden');pic.removeAttribute('src')};if(KIND==='mcq'){$('#area').className='options';$('#area').innerHTML=q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b><span>${esc(o)}</span></label>`).join('')}else{$('#area').className='answer-grid';$('#area').innerHTML=q.answers.map((a,i)=>`<div class="answer-row"><label>空格 ${i+1}</label><input class="answer-input" data-i="${i}" autocomplete="off" spellcheck="false" placeholder="請輸入答案"></div>`).join('')};$('#feedback').className='feedback hidden';$('#voicebox').classList.add('hidden');$('#check').classList.remove('hidden');$('#next').classList.add('hidden')}
function remember(q,value){if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(value);$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
function spoken(q){return q.full||((KIND==='mcq')?q.stem.replace(/^\(\s*\)\s*/,'').replace(/_{3,}/,q.options[q.answer]):q.answers.map(a=>a.accepted[0]).join(' '))}
function speak(){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(spoken(chosen[idx]));u.lang='en-US';u.rate=.88;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/^en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;speechSynthesis.speak(u)}
function success(q){correct.add(q.id);$('#bar').style.width=`${(idx+1)/chosen.length*100}%`;$('#feedback').className='feedback ok';$('#feedback').innerHTML='✅ 全部正確！<br>'+esc(q.explanation||'');$('#target').textContent=spoken(q);$('#voicebox').classList.remove('hidden');$('#check').classList.add('hidden');$('#next').classList.remove('hidden');speak()}
$('#check').onclick=()=>{const q=chosen[idx];attempted.add(q.id);if(KIND==='mcq'){const sel=document.querySelector('input[name=answer]:checked');if(!sel)return alert('請先選擇答案。');const n=+sel.value;if(n===q.answer)return success(q);remember(q,String.fromCharCode(65+n)+'. '+q.options[n]);$('#feedback').className='feedback bad';$('#feedback').innerHTML=`❌ 答錯了。正確答案：<strong>${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</strong><br>${esc(q.explanation||'')}<br>請重新選擇正確答案。`;return}const ins=[...document.querySelectorAll('.answer-input')];if(ins.some(x=>!x.value.trim()))return alert('請完成所有答案。');const bad=[];ins.forEach((input,i)=>{const a=q.answers[i];input.classList.remove('ok','bad');if(a.accepted.some(x=>norm(x)===norm(input.value))){input.classList.add('ok');input.disabled=true}else{input.classList.add('bad');bad.push(`${i+1}. ${input.value} → ${a.display}`);input.value=''}});if(!bad.length)return success(q);remember(q,bad.join('；'));$('#feedback').className='feedback bad';$('#feedback').innerHTML=`❌ 有 ${bad.length} 格不正確。<br>正確答案：${q.answers.map((a,i)=>`${i+1}. <strong>${esc(a.display)}</strong>`).join('；')}<br>${esc(q.explanation||'')}<br>請依提示重新填寫。`;ins.find(x=>!x.disabled)?.focus()};
$('#speak').onclick=speak;$('#next').onclick=()=>{idx++;idx>=chosen.length?finish():show()};$('#finish').onclick=finish;
function answerText(q){return KIND==='mcq'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.answerRaw}
function finish(){if(window.speechSynthesis)speechSynthesis.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');$('#summary').innerHTML=`<div class="stat">選擇題數<b>${chosen.length}</b></div><div class="stat">已作答<b>${attempted.size}</b></div><div class="stat">完成答對<b>${correct.size}</b></div><div class="stat">曾答錯<b>${wrong.size}</b></div>`;$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>`<div class="wrong"><b>${i+1}. 原題 ${r.q.id}｜${esc(preview(r.q))}</b><p>錯誤紀錄：${r.attempts.map(esc).join('<br>')}</p><p><strong>正確答案：</strong>${esc(answerText(r.q))}</p><p>${esc(r.q.explanation||'')}</p></div>`).join(''):'<div class="feedback ok">🎉 沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size)}
$('#restart').onclick=()=>location.reload();$('#download').onclick=async()=>{if(!wrong.size)return;const rows=[...wrong.values()],stamp=new Date().toISOString().slice(0,10),name=TITLE.replace(/\s+/g,'_')+'_錯題_'+stamp;const save=(blob,ext)=>{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name+ext;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};try{const{Document,Packer,Paragraph,TextRun,HeadingLevel}=await import('https://esm.sh/docx@9.5.1');const children=[new Paragraph({heading:HeadingLevel.TITLE,children:[new TextRun({text:TITLE+' 錯題紀錄',bold:true})]})];rows.forEach((r,i)=>{children.push(new Paragraph({heading:HeadingLevel.HEADING_2,children:[new TextRun({text:`${i+1}. 原題 ${r.q.id}`,bold:true})]}),new Paragraph({text:preview(r.q)}),new Paragraph({children:[new TextRun({text:'錯誤紀錄：',bold:true}),new TextRun({text:r.attempts.join(' | ')})]}),new Paragraph({children:[new TextRun({text:'正確答案：',bold:true}),new TextRun({text:answerText(r.q)})]}),new Paragraph({children:[new TextRun({text:'解析：',bold:true}),new TextRun({text:r.q.explanation||''})]}))});save(await Packer.toBlob(new Document({sections:[{children}]})),'.docx')}catch(e){save(new Blob([TITLE+' 錯題紀錄\n\n'+rows.map(r=>preview(r.q)+'\n正確答案：'+answerText(r.q)+'\n').join('\n')],{type:'text/plain;charset=utf-8'}),'.txt')}};
renderList();
</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
