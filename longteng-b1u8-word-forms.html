<script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 8｜詞類變化","mode":"fill","questions":[{"id":1,"question":"Over 2,000 valuable Chinese artifacts are on ____________ (display) in the museum right now.","answers":["display"],"source":"All in One","explanation":"正確字詞為 display；請將答案補入後朗讀完整例句。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":2,"question":"After trying three different ways, James finally ____________ (trap) that clever mouse.","answers":["trapped"],"source":"龍騰自命題","explanation":"在試過三種不同方式後，James終於捕捉到那隻聰明的老鼠。考點句構：本句為分詞構句，原句為 “After he tried three different ways, James finally trapped that clever mouse.” 主要句中缺少了動詞，故以trapped作為答案。","explanationSource":"source"},{"id":3,"question":"Members of the organization are working hard to raise ____________ (aware) of environmental issues.","answers":["awareness"],"source":"習作簿","explanation":"正確字詞為 awareness；請將答案補入後朗讀完整例句。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":4,"question":"Many travelers were ____________ (trap) at the airport when the typhoon hit Japan.","answers":["trapped"],"source":"習作簿","explanation":"正確字詞為 trapped；請將答案補入後朗讀完整例句。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":5,"question":"The hotel ____________ (offer) every guest a comfortable and relaxing environment.","answers":["offers"],"source":"龍騰自命題","explanation":"這間飯店提供每位來賓一個舒適及放鬆的環境。考點句構：vt. + N，主詞為hotel，且為說明一般事實，故要用第三人稱單數。","explanationSource":"source"},{"id":6,"question":"This film is ____________ (aim) at audiences that are crazy about superheroes and adventures.","answers":["aimed"],"source":"龍騰自命題","explanation":"這部影片針對的是熱愛超級英雄及冒險的觀眾。考點句構：被動語態（be + p.p.）。","explanationSource":"source"},{"id":7,"question":"Adam’s teacher was ____________ (urge) him to hand over his homework because it was already three days late.","answers":["urging"],"source":"龍騰自命題","explanation":"Adam的老師正催促他交他的家庭作業因為他已經遲交三天了。考點句構：be + V-ing。","explanationSource":"source"},{"id":8,"question":"Ted’s pride made it difficult for him to listen to others’ ideas, which unfortunately led to his ____________ (eventually) failure as a manager.","answers":["eventual"],"source":"龍騰自命題","explanation":"Ted的驕傲讓他難以聽進別人的想法，這很不幸地導致了最終他當經理的失敗。考點句構：adj. + N。","explanationSource":"source"},{"id":9,"question":"Drinking too much coffee will make it hard for a person to sleep at night. ____________ (Similar), doing too much exercise right before sleep may also affect a person’s ability to fall asleep.","answers":["Similarly"],"source":"龍騰自命題","explanation":"喝太多咖啡會讓人晚上無法入睡。相同地，睡前做大量運動也可能會影響人入睡的能力。考點句構：Similarly為副詞，修飾整個句子。","explanationSource":"source"},{"id":10,"question":"Not many people knew that selling hot dogs beside a movie theater could be such a ____________ (profit) business.","answers":["profitable"],"source":"龍騰自命題","explanation":"並不是很多人知道在電影院旁賣熱狗可以是個有利可圖的生意。考點句構：adj. + N。","explanationSource":"source"},{"id":11,"question":"There are many ____________ (similarly) between these two movies. I think they were made by the same director.","answers":["similarities"],"source":"習作簿","explanation":"正確字詞為 similarities；請將答案補入後朗讀完整例句。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":12,"question":"With this new app, you can always get a discount when you make a ____________ (purchase).","answers":["purchase"],"source":"習作簿","explanation":"正確字詞為 purchase；請將答案補入後朗讀完整例句。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":13,"question":"Mike is happy to see his company’s ____________ (profitable) rising every year.","answers":["profits"],"source":"All in One","explanation":"正確字詞為 profits；請將答案補入後朗讀完整例句。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":14,"question":"An advantage of using a credit card is that you can charge most ____________ (purchase) without paying for them right away.","answers":["purchases"],"source":"All in One","explanation":"正確字詞為 purchases；請將答案補入後朗讀完整例句。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":15,"question":"Hundreds of people were ____________ (trap) in the fallen building during the earthquake.","answers":["trapped"],"source":"All in One","explanation":"正確字詞為 trapped；請將答案補入後朗讀完整例句。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":16,"question":"The ____________ (similarly) between Tom and his elder brother James is very striking.","answers":["similarity"],"source":"All in One","explanation":"正確字詞為 similarity；請將答案補入後朗讀完整例句。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":17,"question":"Chen Uen was the first comic book author whose works were ____________ (display) in the National Palace Museum.","answers":["displayed"],"source":"龍騰自命題","explanation":"鄭問是首位進入國立故宮博物院展覽作品的漫畫家作者。考點句構：被動語態（be + p.p.）。","explanationSource":"source"},{"id":18,"question":"Sandy usually compares the prices of the products online before she ____________ (purchase) something.","answers":["purchases"],"source":"龍騰自命題","explanation":"Sandy在購物前通常會在網上比較商品的價格。考點句構：vt. + N，主詞為she，故要用第三人稱單數。","explanationSource":"source"},{"id":19,"question":"A few children were not ____________ (awareness) of the danger of swimming in the lake. Fortunately, their parents called them out before anyone was hurt.","answers":["aware"],"source":"龍騰自命題","explanation":"有一些小孩並沒有意識到在湖中游泳的危險。幸好他們的父母在任何人受傷之前就叫他們出來了。考點句構：be aware of sth.。","explanationSource":"source"}]};</script><script src="longteng-b1u5-quiz.js?v=20261027-1"></script><script src="longteng-vocab-required-pronunciation.js?v=20261027-1"></script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
