:root{--blue:#2563eb;--deep:#172554;--bg:#f4f7fb;--line:#d9e2ef;--ok:#15803d;--bad:#b91c1c;--violet:#6d28d9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font-family:Arial,"Microsoft JhengHei",sans-serif;line-height:1.7}main{max-width:1060px;margin:auto;padding:14px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 7px 24px #0f172a0c}.hero{background:linear-gradient(135deg,#eff6ff,#fff)}h1{margin:0;font-size:clamp(25px,4vw,38px)}h2,h3{margin:0 0 10px}.muted{color:#64748b}.hidden{display:none!important}.btn{border:0;border-radius:10px;padding:10px 15px;font:800 16px inherit;cursor:pointer;background:#e5e7eb;color:#172033;text-decoration:none}.primary{background:var(--blue);color:#fff}.voice{background:var(--violet);color:#fff}.danger{background:#991b1b;color:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;font-weight:800;color:#64748b;margin:9px 0}.prompt,.passage{font-size:18px;background:#f8fafc;border-radius:12px;padding:16px;white-space:pre-wrap}.passage{max-height:48vh;overflow:auto}.blank-now{background:#fef3c7;color:#92400e;padding:2px 7px;border-radius:6px;font-weight:900}.options{display:grid;gap:9px;margin:14px 0}.option{border:2px solid #cbd5e1;background:#fff;border-radius:11px;padding:12px 14px;text-align:left;font:700 16px inherit;cursor:pointer}.option:hover{border-color:var(--blue)}.option.wrong{border-color:#fecaca;background:#fff1f2}.option.correct{border-color:#86efac;background:#f0fdf4}.feedback,.reference{padding:13px;border-radius:10px;margin:12px 0;font-weight:800;white-space:pre-wrap}.feedback.ok{background:#ecfdf3;color:var(--ok)}.feedback.bad{background:#fff1f2;color:var(--bad)}.reference{border:2px solid #bbf7d0;background:#f0fdf4}.translation{white-space:pre-wrap;background:#f8fafc;padding:16px;border-radius:12px;font-size:18px}.inline-input{width:150px;max-width:100%;font:inherit;padding:7px 9px;border:2px solid #94a3b8;border-radius:8px;margin:3px}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:#f5f3ff;margin:12px 0}.voice-result{background:#fff;border:1px solid #ddd6fe;padding:10px;border-radius:9px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat,.wrong-card{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong-card{margin:10px 0;background:#fff7f7;border-color:#fecaca}@media(max-width:620px){main{padding:8px}.hero,.card{padding:15px}.meta{display:block}.prompt,.passage,.translation{font-size:16px}}
</style></head><body><main><section class="hero"><h1>三民普高 B3U7｜篇章結構</h1><p class="muted">原題互動練習｜21 題｜即時批改｜錯誤重填｜答對後整句播放＋選做 STT｜錯題 DOCX｜成績登錄</p><div class="actions"><a class="btn" href="dashboard.html">← 回 Dashboard</a></div></section><section id="quiz" class="card"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="reference" class="reference hidden"></div><div id="voiceBox" class="voicebox hidden"><h3>🎙️ Pronunciation Check（選做）</h3><p><b id="voiceTarget"></b></p><div class="actions"><button id="speak" class="btn voice">🔊 再聽一次</button><button id="mic" class="btn primary">🎤 開始朗讀評分</button></div><div id="voiceResult" class="voice-result">尚未進行朗讀評分。</div></div><div class="actions"><button id="check" class="btn primary hidden">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束本輪</button></div></section><section id="result" class="card hidden"><h2>練習結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="download" class="btn primary">下載錯題 DOCX</button><button id="restart" class="btn">重新練習</button></div></section></main><script>
const QUIZ={"unit":"B3U7","kind":"bank","title":"篇章結構","count":21,"data":[{"set":1,"passage":"Niki de Saint Phalle, one of the most famous artists of the 20th century, was a French-American born in 1930. She was brought up in a very conservative family, and yet, she rejected the staid, conservative values of her family to pursue a career in painting.   (1)  Fortunately, painting offered her an effective therapy and a way to develop as an artist. Her famous “Nana” series gained universal praise. It is a testimony to the glory of women.   (2)   Some of these sculptures are very big, “so that men would look small next to them.” Saint Phalle used vivid colors in these works and her female subjects dance cheerfully and merrily.   (3)  \n    Saint Phalle’s sculptural park, “The Tarot Garden,” inspired by Tarot cards, is situated in the Italian province of Tuscany.   (4)   The park contains sculptures of the symbols found on Tarot cards. The brightly colored combinations of buildings and sculptures reflect the metaphysical qualities represented by the 22 main tarot cards. The sculptures, however, have nothing to do with fortune telling.   (5)  \n    Saint Phalle passed away on May 21, 2002, in San Diego, California, at the age of 71. Her death meant the loss of a woman of diverse creative talents.","options":{"A":"The series is mostly composed of life-size dolls of women in various roles such as brides and new mothers.","B":"Work on the garden began in 1979, and it was officially opened to the public in May 1998.","C":"Many modern women artists create sculptures that have become iconic pieces of feminist movement.","D":"Through these joyful and powerful images of Nana, the artist sends a positive message to all women.","E":"Her rebelliousness created a series of conflicts with her family, which led to a nervous breakdown at age 23.","F":"Instead, the works focus on the elements of life experience, personality, and self-knowledge that the cards refer to"},"answers":["E","A","B","D","F"],"sentences":["Her rebelliousness created a series of conflicts with her family, which led to a nervous breakdown at age 23.","The series is mostly composed of life-size dolls of women in various roles such as brides and new mothers.","Work on the garden began in 1979, and it was officially opened to the public in May 1998.","Through these joyful and powerful images of Nana, the artist sends a positive message to all women.","Instead, the works focus on the elements of life experience, personality, and self-knowledge that the cards refer to"],"blankNums":[1,2,3,4,5],"structure":true},{"set":2,"passage":"The Equal Rights Amendment has been a part of the American Constitution for over 85 years. Though there were many reasons for it to be put in place, one of its purposes was to balance the role of men and women in the workplace, and to give women the chance to take part in the same roles that were reserved only for men in the past.\nDespite the presence of Equal Rights, there are still some differences in how men and women are treated in the workplace. __1__ There are also some jobs that do not allow, or allow only a very small number of women to obtain, including most professional sports, construction, and military careers.\nTo demonstrate these large differences, studies have shown that the average salary for women is about 23.5% lower than that for men, though that only measures earnings and not benefits. For some of America’s top companies, women only make up 16% of highest positions. __2__\nThere could be a number of reasons for this. Because men traditionally hold positions of power in the workplace, it may be a part of their natural behavior to be more aggressive and to take action to accomplish their goals. __3__ Many people believe that they do not have the strength or ability for some of the more dangerous work.\nBecause of how society has viewed gender roles for so many generations, it may be difficult to overcome this mindset. __4__ Someday, women will be able to accomplish the very things that the Equal Rights Amendment was created for.","options":{"A":"People must accept that anyone can have the skills to get important jobs and responsibilities.","B":"Only around 9 women, or less than 2% hold the highest position of chief executive officer.","C":"For example, it is challenging for a woman to get a high-level or high-paying job position.","D":"Women, on the other hand, traditionally hold positions of support.","E":"Some argue that changes in workplace policy can improve fairness without changing social attitudes."},"answers":["C","B","D","A"],"sentences":["For example, it is challenging for a woman to get a high-level or high-paying job position.","Only around 9 women, or less than 2% hold the highest position of chief executive officer.","Women, on the other hand, traditionally hold positions of support.","People must accept that anyone can have the skills to get important jobs and responsibilities."],"blankNums":[1,2,3,4],"structure":true},{"set":3,"passage":"Historically, it was usually the men who marched off to war, while the women waited at home for them to come back. Over the course of centuries, this gradually changed. However, modern women can now choose to pursue military careers in many countries. __1__ As it stands, female soldiers now make up about 14% of the U.S. army’s total fighting strength.\nUntil now, women in the U.S. army had been limited to serving in support roles, working in areas like strategic planning, transportation, medicine and communications. Although females could do most jobs that male soldiers could do, the law did not allow them to take part in “direct ground combat.”\nAs of January 2013, this is all set to change. America’s lawmakers and top military officers have decided to change the law and allow women to serve right alongside men on the front lines. __2__ A woman might command a tank or lead a company of soldiers on foot patrol in an area where enemies are known to be active.\nOf course, this change means that more female soldiers will be placed directly in harm’s way. For example, some still question whether women are suitable for hand-to-hand combat and worry that women won’t perform as well as men under fire. __3__ More than 150 female U.S. military personnel have been killed while on duty in Iraq and Afghanistan. Thousands more have been injured. Regardless of the gender, anyone who is in uniform understands and accepts the risks. They know well that danger does not differ in a war zone.\nHuman rights observers cheer this change as a step forward in women’s fight for equality. __4__ America’s enemies, for their part, have new reason to fear.","options":{"A":"Actually, women already serve in combat roles in the armies of many countries, including Israel and Canada.","B":"The United States is no exception in this regard, and women have actually been serving in armed forces since the late 1700’s.","C":"Military uniforms for female soldiers have also been redesigned to make it easier for them to move around.","D":"The recognition of the value of women’s service can be viewed as change signals.","E":"In other words, women will finally be allowed into military occupations that involve actual ground combat duty.(1) _______ (2) _______ (3) _______ (4) _______"},"answers":["B","E","A","D"],"sentences":["The United States is no exception in this regard, and women have actually been serving in armed forces since the late 1700’s.","In other words, women will finally be allowed into military occupations that involve actual ground combat duty.","Actually, women already serve in combat roles in the armies of many countries, including Israel and Canada.","The recognition of the value of women’s service can be viewed as change signals."],"blankNums":[1,2,3,4],"structure":true},{"set":4,"passage":"In the dictionary, family is defined as a basic unit of social structure. However, its meanings vary greatly from time to time and from culture to culture. __1__ Still, it has always been regarded as reproductive, economic, social, and educational. Nowadays, we see family as a small social cluster consisting of husband, wife and children, but it has not always been like this.\n__2__ Later, men learned to domesticate (馴服) animals and refused to let it pass down the female line, starting to impose restrictions on women. This is when the patriarchal (父權) era began. Father became the supreme authority in the family, the entire household, and sometimes a little village. This period lasted for thousands of years.\nNot until the 19th century do women have equal rights with men. __3__ Young people started their families much later and focused more on their careers. Families become smaller and more mobile. __4__ However, in many other cultures, especially in Asia, family still has a sacred meaning and blood binds are as important as ever before.","options":{"A":"During the times of hunting and gathering plants for food, families were centered around older females.","B":"The concept of family evolves, adapting to the new surrounding conditions.","C":"Traditional family ties began to loosen.","D":"The structure of the family, therefore, underwent a basic change.","E":"Some scientists believe that early family groups may have developed around shared food preparation or protection rather than blood ties."},"answers":["B","A","D","C"],"sentences":["The concept of family evolves, adapting to the new surrounding conditions.","During the times of hunting and gathering plants for food, families were centered around older females.","The structure of the family, therefore, underwent a basic change.","Traditional family ties began to loosen."],"blankNums":[1,2,3,4],"structure":true},{"set":5,"passage":"Women have been fighting for equal status for a long time. While much progress has been made, gender stereotypes still exist in today’s society. __1__ For example, a common gender stereotype is that only women can be nurses, and only men can be doctors. This point of view may lead to unfair treatment in the workplace.\nGender stereotypes begin to influence girls at a young age. If girls don’t think that they are good at math or science, they may not think they can be engineers or scientists when they grow up. __2__ Believe it or not, gender stereotypes are very serious in certain professions. __3__\nTo balance such a situation, teachers play a key role in reducing gender stereotypes in the classroom. They should give successful examples of women in every field to encourage girls not to be limited to certain professions. __4__ Over time, this will help get rid of the stereotype that certain positions should be occupied by men, and hopefully the unfair treatment in workplace will be changed.","options":{"A":"This idea puts limits on young girls, and thus society can’t benefit from their efforts and contributions in many fields.","B":"In fact, only 3% of airline pilots today are women.","C":"Airlines should try to hire more qualified women for all kinds of positions.","D":"Basically, a gender stereotype is the view that one gender should possess certain characteristics or play certain roles."},"answers":["D","A","B","C"],"sentences":["Basically, a gender stereotype is the view that one gender should possess certain characteristics or play certain roles.","This idea puts limits on young girls, and thus society can’t benefit from their efforts and contributions in many fields.","In fact, only 3% of airline pilots today are women.","Airlines should try to hire more qualified women for all kinds of positions."],"blankNums":[1,2,3,4],"structure":true}]};const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let flat=[],index=0,wrong=new Map(),attempted=new Set(),firstTry=new Set(),recognition=null;
function flatten(){if(QUIZ.kind==='mcq')return QUIZ.data.map(x=>({...x,id:String(x.number)}));if(QUIZ.kind==='translation')return QUIZ.data.map(x=>({...x,id:String(x.number)}));return QUIZ.data.flatMap(set=>set.answers.map((answer,i)=>({id:`${set.set}-${i+1}`,set:set.set,passage:set.passage,options:set.options,answer,blank:i+1,sentence:set.sentences[i],structure:set.structure})))}
function fillPassage(text,answers,options){let out=text;answers.forEach((a,i)=>{const word=options[a];const n=i+1;const pats=[new RegExp(`__\\(?${n}\\)?__`),new RegExp(`__${n}__`),new RegExp(`　${n}　`),new RegExp(`\\(${n}\\)`)];for(const p of pats){if(p.test(out)){out=out.replace(p,word);break}}});return out.replace(/\n+/g,' ').replace(/\s+/g,' ').trim()}
function markBlank(text,n){const tag=`<span class="blank-now">Blank ${n}</span>`;let out=esc(text),done=false;for(const p of [new RegExp(`__\\(?${n}\\)?__`),new RegExp(`__${n}__`),new RegExp(`　${n}　`),new RegExp(`\\(${n}\\)`)]){if(!done&&p.test(out)){out=out.replace(p,tag);done=true}}return out}
function norm(s){return String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ')}function speak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}
function show(){try{recognition?.abort()}catch(e){}speechSynthesis?.cancel();const q=flat[index];$('#meta').textContent=`第 ${index+1} / ${flat.length} 題`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=((index+1)/flat.length*100)+'%';$('#feedback').className='feedback hidden';$('#reference').classList.add('hidden');$('#voiceBox').classList.add('hidden');$('#next').classList.add('hidden');$('#check').classList.toggle('hidden',QUIZ.kind!=='translation');$('#answerArea').innerHTML='';if(QUIZ.kind==='mcq')renderChoice(q.prompt,q.options);else if(QUIZ.kind==='translation')renderTranslation(q);else{$('#question').innerHTML=`<div class="passage">${markBlank(q.passage,q.blank)}</div>`;renderChoice(`第 ${q.blank} 格`,q.options)}}
function renderChoice(prompt,options){$('#question').innerHTML=QUIZ.kind==='mcq'?`<div class="prompt">${esc(prompt)}</div>`:$('#question').innerHTML;$('#answerArea').innerHTML='<div class="options">'+Object.entries(options).map(([k,v])=>`<button class="option" data-key="${k}"><b>${k}.</b> ${esc(v)}</button>`).join('')+'</div>';document.querySelectorAll('.option').forEach(b=>b.onclick=()=>checkChoice(b.dataset.key,b))}
function renderTranslation(q){let i=0;const rendered=esc(q.prompt).replace(/_{3,}/g,()=>`<input class="inline-input" data-i="${i++}" aria-label="第 ${i} 格答案">`);$('#question').innerHTML=`<div class="translation">${rendered}</div>`;setTimeout(()=>document.querySelector('.inline-input')?.focus(),0)}
function recordWrong(q,value){if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(value);$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
function checkChoice(key,button){const q=flat[index];attempted.add(q.id);if(key!==q.answer){recordWrong(q,key);button.classList.add('wrong');$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 不正確，請再試一次。';return}if(!wrong.has(q.id))firstTry.add(q.id);document.querySelectorAll('.option').forEach(b=>b.disabled=true);button.classList.add('correct');pass(q)}
function checkTranslation(){const q=flat[index],values=[...document.querySelectorAll('.inline-input')].map(x=>x.value);attempted.add(q.id);const ok=values.length===q.answers.length&&values.every((v,i)=>norm(v)===norm(q.answers[i]));if(!ok){recordWrong(q,values.join(' / '));$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 尚有空格不正確，請修正後再檢查。';return}if(!wrong.has(q.id))firstTry.add(q.id);document.querySelectorAll('.inline-input').forEach(x=>x.disabled=true);pass(q)}
function pass(q){$('#feedback').className='feedback ok';$('#feedback').textContent='✅ 正確！';$('#reference').classList.remove('hidden');$('#reference').textContent='完整句：'+q.sentence;$('#check').classList.add('hidden');$('#next').classList.remove('hidden');$('#voiceBox').classList.remove('hidden');$('#voiceTarget').textContent=q.sentence;$('#voiceResult').className='voice-result';$('#voiceResult').textContent='尚未進行朗讀評分。';speak(q.sentence)}
function similarity(a,b){a=norm(a).replace(/[^a-z0-9' ]/g,'').split(' ').filter(Boolean);b=norm(b).replace(/[^a-z0-9' ]/g,'').split(' ').filter(Boolean);const used=new Set;let hit=0;for(const w of a){const j=b.findIndex((x,i)=>x===w&&!used.has(i));if(j>=0){hit++;used.add(j)}}return Math.round(100*hit/Math.max(a.length,b.length,1))}
function startMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('#voiceResult').textContent='此瀏覽器不支援語音辨識，建議使用 Chrome。';return}recognition=new SR;recognition.lang='en-US';recognition.interimResults=false;$('#voiceResult').textContent='正在聆聽，請朗讀完整句子…';recognition.onresult=e=>{const said=e.results[0][0].transcript,target=flat[index].sentence,score=similarity(target,said);$('#voiceResult').className='voice-result '+(score>=80?'good':'retry');$('#voiceResult').textContent=`辨識：${said}\n正確率：${score}%`};recognition.onerror=e=>$('#voiceResult').textContent='語音辨識未完成：'+e.error;recognition.start()}
function finish(){try{recognition?.abort()}catch(e){}speechSynthesis?.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');const rows=[...wrong.values()];$('#summary').innerHTML=`<div class="stat">實際作答<b>${attempted.size}</b></div><div class="stat">一次答對<b>${firstTry.size}</b></div><div class="stat">曾答錯<b>${rows.length}</b></div>`;$('#wrongList').innerHTML=rows.length?rows.map((r,i)=>`<div class="wrong-card"><b>${i+1}. 第 ${esc(r.q.id)} 題</b><p>${esc(r.q.prompt||`第 ${r.q.blank} 格`)}</p><p>作答：${r.attempts.map(esc).join('；')}</p><p>答案：${esc(r.q.answer||r.q.answers.join(' / '))}</p></div>`).join(''):(attempted.size?'<div class="feedback ok">🎉 本輪全部一次答對！</div>':'<p class="muted">本輪尚未作答，因此不登錄成績。</p>');$('#download').classList.toggle('hidden',!rows.length);if(attempted.size)document.dispatchEvent(new CustomEvent('quiz-result-ready',{detail:{total:attempted.size,correct:firstTry.size,wrong:rows.length,mistakeQuestionNumbers:rows.map(r=>r.q.id).join(', ')}}))}
$('#check').onclick=checkTranslation;$('#next').onclick=()=>{if(++index>=flat.length)finish();else show()};$('#finish').onclick=finish;$('#restart').onclick=()=>location.reload();$('#speak').onclick=()=>speak(flat[index].sentence);$('#mic').onclick=startMic;$('#download').onclick=async()=>{const rows=[...wrong.values()];if(!rows.length)return;try{if(!window.docx)await new Promise((ok,fail)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js';s.onload=ok;s.onerror=fail;document.head.append(s)});const{Document,Packer,Paragraph,HeadingLevel}=window.docx,children=[new Paragraph({text:`三民普高 ${QUIZ.unit} ${QUIZ.title} 錯題紀錄`,heading:HeadingLevel.TITLE})];rows.forEach(r=>children.push(new Paragraph({text:`第 ${r.q.id} 題`,heading:HeadingLevel.HEADING_2}),new Paragraph(r.q.prompt||r.q.passage||''),new Paragraph('作答：'+r.attempts.join('；')),new Paragraph('答案：'+(r.q.answer||r.q.answers.join(' / ')))));const blob=await Packer.toBlob(new Document({sections:[{children}]})),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Sanmin_${QUIZ.unit}_${QUIZ.kind}_錯題.docx`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){alert('目前無法產生 DOCX，請稍後再試。')}};flat=flatten();show();
</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
