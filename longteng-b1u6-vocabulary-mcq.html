ection></main><script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 6｜單字選擇","mode":"mcq","questions":[{"id":1,"question":"The Eiffel Tower and the Louvre are two of the most famous ____________ in Paris.","options":["tourists","landmarks","slaves","treatments"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"艾菲爾鐵塔和羅浮宮是巴黎最知名地標的其中兩個。　(A)遊客　(B)地標　(C)奴隸　(D)對待；待遇"},{"id":2,"question":"Sun Moon Lake is widely regarded as one of Taiwan’s most famous tourist ____________.","options":["statues","monuments","celebrations","attractions"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"日月潭被廣泛認為是臺灣最知名的觀光景點之一。　(A)雕像　(B)紀念碑　(C)慶祝活動　(D)有吸引力的事物或地點"},{"id":3,"question":"The director tends to use red roses to ____________ love in his movies.","options":["attract","symbolize","poison","remove"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"這位導演往往在他的電影裡用紅玫瑰來代表愛情。　(A)招引；吸引　(B)象徵；代表　(C)毒害　(D)移除"},{"id":4,"question":"The negotiators ____________ held their ground, seeking the best deal possible.","options":["unfairly","eagerly","personally","firmly"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"這些談判者堅守他們的立場，尋求可能的最佳協議。　(A)不公正地　(B)渴望地　(C)針對某人地　(D)堅定地"},{"id":5,"question":"Joey’s attitude on the issue was ____________, showing no signs of wavering.","options":["ancient","independent","firm","symbolic"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"Joey對這個問題的態度很堅定，顯示出沒有任何動搖的跡象。　(A)古老的　(B)獨立的　(C)堅定的　(D)作為象徵性的"},{"id":6,"question":"The boy was crying loudly to ____________ his mother’s attention.","options":["symbolize","attract","remove","poison"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"這個男孩哭得很大聲，以便吸引他媽媽的注意。　(A)象徵　(B)吸引　(C)移除　(D)毒害"},{"id":7,"question":"The child held onto her mother’s hand ____________ while crossing the street.","options":["unfairly","eagerly","personally","firmly"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"這個孩子在過馬路時緊緊地抓住媽媽的手。　(A)不公正地　(B)渴望地　(C)針對某人地　(D)牢固地"},{"id":8,"question":"One of the famous ____________ in London is Big Ben, which is used to mean both the clock and the clock tower.","options":["tourists","celebrations","monuments","slaves"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"倫敦著名的紀念碑之一，大笨鐘，可擴大指鐘的本身以及鐘樓。　(A)遊客　(B)慶祝　(C)紀念碑　(D)奴隸"},{"id":9,"question":"____________ on that island is developing fast, with couples choosing to have their honeymoon there.","options":["Globe","Tourism","Attraction","Freedom"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"那座島的觀光業正迅速發展，許多新人選擇去那裡度蜜月。　(A)地球　(B)觀光業　(C)有吸引力的事物或地點　(D)自由"},{"id":10,"question":"The team is ____________ their fifth win in a row.","options":["symbolizing","removing","celebrating","attracting"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"這支隊伍正在慶祝他們的五連霸。　(A)象徵　(B)移除　(C)慶祝　(D)招引；吸引"},{"id":11,"question":"I picked a few apples from the tree in my backyard. They were ____________, juicy, and ideal for making a pie.","options":["ancient","firm","unfair","independent"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"我從後院的樹上摘了幾顆蘋果。它們又脆又多汁，且非常適合做成派。　(A)古老的　(B)堅硬的；結實的　(C)不公正的　(D)獨立的"},{"id":12,"question":"According to experts, climate change will certainly influence everyone around the ____________.","options":["tourism","slavery","globe","freedom"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"根據專家的說法，氣候變遷一定會影響到全世界的每一個人。　(A)旅遊業；觀光業　(B)蓄奴制；奴隸身分　(C)地球；世界　(D)自由"},{"id":13,"question":"Christine is considered to be the most ____________ girl in our school; no wonder so many boys have fallen in love with her.","options":["attractive","ancient","unfair","symbolic"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"Christine被認為是我們學校最吸引人的女孩；難怪這麼多男孩已經愛上她了。　(A)吸引人的　(B)古代的；古老的　(C)不公正的；不公平的　(D)作為象徵的；象徵性的"},{"id":14,"question":"Many foreign ____________ enjoy visiting famous night markets in Taiwan.","options":["statues","symbols","tourists","landmarks"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"許多外國遊客喜歡逛臺灣的知名夜市。　(A)雕像　(B)象徵　(C)遊客　(D)地標"},{"id":15,"question":"More and more people are asking for equal ____________ for both men and women in society.","options":["slavery","treatment","landmark","tourism"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"愈來愈多人要求在社會上男女兩性的平等待遇。　(A)蓄奴制；奴隸身分　(B)對待；待遇　(C)地標　(D)旅遊業；觀光業"},{"id":16,"question":"Sophia thinks it’s ____________ for her parents to give her younger brother more candy.","options":["unfair","independent","ancient","global"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"Sophia認為她父母給她弟弟更多糖果是不公平的。　(A)不公正的；不公平的　(B)獨立的　(C)古代的；古老的　(D)全球的；全世界的"},{"id":17,"question":"This movie is about a young boy who was sold into ____________ and lived a difficult life.","options":["independence","freedom","globe","slavery"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"這部電影是關於一位被賣去當奴隸並且過著艱苦生活的年輕男孩。　(A)獨立　(B)自由　(C)地球；世界　(D)蓄奴制；奴隸身分"},{"id":18,"question":"In this poet’s works, green leaves are often used as a ____________ of a new life, a new journey, or a new hope.","options":["statue","monument","symbol","slave"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"在這位詩人的作品裡，綠葉經常被用來當作是新生命、新旅程，或是新希望的象徵。　(A)雕像　(B)紀念碑　(C)象徵　(D)奴隸"},{"id":19,"question":"Our geography teacher told us that Singapore gained ____________ from Malaysia in 1965.","options":["independence","representation","treatment","celebration"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"我們地理老師告訴我們，新加坡於1965年脫離馬來西亞而獲得獨立。　(A)獨立　(B)表現（形式）；塑像　(C)對待；待遇　(D)慶祝"},{"id":20,"question":"The basketball team held a party in ____________ of their recent victory.","options":["treatment","celebration","monument","freedom"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"那支籃球隊舉辦了一個派對來慶祝他們最近的勝利。　(A)對待；待遇　(B)慶祝　(C)紀念碑　(D)自由"},{"id":21,"question":"In some countries, people don’t have much ____________ to do whatever they want to do.","options":["freedom","treatment","tourism","globe"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"在某些國家裡，人們沒有太多自由去做任何他們想做的事。　(A)自由　(B)對待；待遇　(C)旅遊業；觀光業　(D)地球；世界"},{"id":22,"question":"The books were so worn and torn that they were ____________ from the library.","options":["attracted","removed","celebrated","included"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"這些書磨損很嚴重，所以從圖書館移除掉了。　(A)吸引　(B)移除　(C)慶祝　(D)包括"},{"id":23,"question":"The wedding rings of the couple are ____________ of their love.","options":["symbolic","independent","ancient","attractive"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"這對新人的婚戒象徵他們的愛情。　(A)象徵的　(B)獨立的　(C)古代的　(D)吸引人的"},{"id":24,"question":"People in ____________ China believed that there were ten suns in the sky.","options":["global","unfair","attractive","ancient"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"古代中國的人相信天上有十個太陽。　(A)全球的　(B)不公平的　(C)吸引人的　(D)古代的"},{"id":25,"question":"The university planned to set up a ____________ in front of the school gate in memory of the scientist.","options":["statue","slave","crowd","product"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"這大學計劃在校門前設立一座雕像來紀念這位科學家。　(A)雕像　(B)奴隸　(C)人群　(D)產品"},{"id":26,"question":"The worker was tired of being treated like a ____________.","options":["slave","globe","symbol","freedom"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"這名員工厭倦被當作奴隸一樣看待。　(A)奴隸　(B)地球　(C)象徵　(D)自由"},{"id":27,"question":"Parents should be ____________ to their children, regardless of their gender.","options":["ancient","global","fair","eager"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"父母應該對孩子們公平，無論他們是什麼性別。　(A)古代的　(B)全球的　(C)公平的　(D)渴望的"},{"id":28,"question":"The teacher turned the ____________ around with his hand and pointed at Taiwan.","options":["tourist","statue","slave","globe"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"老師用手轉動地球儀，指著臺灣。　(A)遊客　(B)雕像　(C)奴隸　(D)地球儀"},{"id":29,"question":"The old man living alone is very ____________ and does all his own shopping and cooking.","options":["symbolic","harmful","ancient","independent"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"這位獨居老人非常獨立，買東西煮飯都自己來。　(A)象徵的　(B)有害的　(C)古代的　(D)獨立的"},{"id":30,"question":"The festival is a harvest ____________ and gives thanks for good fortune throughout the year.","options":["monument","slave","celebration","landmark"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"這個節慶是一個收成慶典活動並對整年來的好運表達感謝。　(A)紀念碑　(B)奴隸　(C)慶祝活動　(D)地標"}]};</script><script src="longteng-b1u5-quiz.js?v=20261026-2"></script><script src="longteng-vocab-required-pronunciation.js?v=20261026-4"></script></body></html>
