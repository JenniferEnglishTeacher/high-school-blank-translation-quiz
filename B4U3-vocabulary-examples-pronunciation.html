    <p class="note">辨識分數達 75% 為通過；系統會保留每題最高分與待加強清單。建議使用最新版 Chrome 或 Edge。</p>

age":1,"head":"make 人 + 原V","pos":"(v.) phr.","meaning":"要某人做某 事","example":"Mom __________ me sweep the floor before going out.","translation":"媽媽要我掃地才能出門。","speak":"make someone do something"},{"id":12,"page":1,"head":"make O + adj","pos":"(v.) phr.","meaning":"使⋯變得⋯","example":"The funny joke __________ everyone happy and relaxed.","translation":"那個笑話讓大家都開心又放 鬆。","speak":"make something adjective"},{"id":13,"page":1,"head":"ask 人 to V","pos":"(v.) phr.","meaning":"要求某人做 ⋯","example":"He __________ me ____ help him carry the heavy bag.","translation":"他請我幫他搬那個很重的袋 子。","speak":"ask someone do something"},{"id":14,"page":1,"head":"ask 人 not to V","pos":"(v. phr.)","meaning":"請某人不要 做⋯","example":"My mom __________ me _____ _____ watch too much TV.","translation":"我媽媽叫我不要看太多電視 。","speak":"ask someone not do something"},{"id":15,"page":1,"head":"get 人 to V","pos":"(v.) phr.","meaning":"使某人去做 ⋯","example":"She finally __________ her brother ____ clean the dishes.","translation":"她終於讓她弟弟去洗碗了。","speak":"get someone do something"},{"id":16,"page":1,"head":"tell 人 to V","pos":"(v.) phr.","meaning":"告訴某人去 做⋯","example":"The doctor __________ him ____ take the medicine twice a day.","translation":"醫生告訴他一天吃兩次藥。","speak":"tell someone do something"},{"id":17,"page":1,"head":"tell 人 not to V","pos":"(v. phr.)","meaning":"告訴某人不 要做⋯","example":"The teacher __________ us ______ ______ talk during the test.","translation":"老師叫我們考試時不要講話 。","speak":"tell someone not do something"},{"id":18,"page":1,"head":"make a choice","pos":"(v. phr.)","meaning":"做出選擇","example":"You have to __________ a __________ between the red dress and the blue one.","translation":"你必須在紅色洋裝和藍色洋 裝之間做選擇。","speak":"make a choice"},{"id":19,"page":1,"head":"make a decision","pos":"(v. phr.)","meaning":"做決定","example":"It's time to __________ a __________ about where we want to go for vacation.","translation":"我們該決定要去哪裡度假了 。","speak":"make a decision"},{"id":20,"page":1,"head":"make a promise","pos":"(v. phr.)","meaning":"做承諾；答 應","example":"I __________ a __________ to my mom to clean my room today.","translation":"我答應媽媽今天要打掃我的 房間。","speak":"make a promise"},{"id":21,"page":1,"head":"make a plan","pos":"(v. phr.)","meaning":"制定計畫","example":"Let’s __________ a __________ for the weekend trip.","translation":"我們來為週末旅行訂個計畫 吧。","speak":"make a plan"},{"id":22,"page":1,"head":"make a mistake","pos":"(v. phr.)","meaning":"犯錯","example":"It’s okay to __________ a __________—everyone does sometimes.","translation":"犯錯沒關係，每個人都會的 。","speak":"make a mistake"},{"id":23,"page":1,"head":"make friends with 人","pos":"(v. phr.)","meaning":"交朋友","example":"I __________ __________ ________ a girl from another school during the camp.","translation":"我在營隊中和一位來自別的 學校的女生交了朋友。","speak":"make friends with someone"},{"id":24,"page":1,"head":"make a phone call","pos":"(v. phr.)","meaning":"打電話","example":"I need to __________ a __________ __________ before we leave.","translation":"我們出門前我要打一通電話 。","speak":"make a phone call"},{"id":25,"page":1,"head":"make money","pos":"(v. phr.)","meaning":"賺錢","example":"My sister wants to __________ __________ by selling handmade cards.","translation":"我姐姐想賣手工卡片來賺錢 。","speak":"make money"},{"id":26,"page":2,"head":"make a sound","pos":"(v. phr.)","meaning":"發出聲音","example":"Please don’t __________ a __________ while the teacher is speaking.","translation":"老師在說話時請不要發出聲 音。","speak":"make a sound"},{"id":27,"page":2,"head":"make noise","pos":"(v. phr.)","meaning":"製造噪音","example":"Don’t __________ too much __________ in the library.","translation":"在圖書館不要製造太多噪音 。","speak":"make noise"},{"id":28,"page":2,"head":"make some noise for 人 =cheer for 人","pos":"(v. phr.)","meaning":"為⋯⋯歡呼； 鼓掌歡呼","example":"Let’s __________ __________ __________ __________ our school band!","translation":"讓我們為學校的樂隊歡呼吧 ！","speak":"make some noise for someone"},{"id":29,"page":2,"head":"make meals","pos":"(v. phr.)","meaning":"做餐點","example":"Dad usually __________ __________ for us on Sundays.","translation":"爸爸通常在星期天幫我們做 三餐。","speak":"make meals"},{"id":30,"page":2,"head":"make a dream come true","pos":"(v. phr.)","meaning":"實現夢想","example":"If you work hard and make time for your dream, you can ________ your ________ _______ _________.","translation":"如果你努力工作並挪出時間 給自己的夢想的話，你會讓 美夢成真。","speak":"make a dream come true"},{"id":31,"page":2,"head":"make yourself at home","pos":"(v. phr.)","meaning":"當自己家一 樣自在","example":"Please come in and __________ __________ __________ __________.","translation":"請進，當自己家一樣不用客 氣。","speak":"make yourself at home"},{"id":32,"page":2,"head":"make fun of 人 =play a joke on人","pos":"(v. phr.)","meaning":"取笑某人","example":"It’s rude to __________ __________ __________ someone’s accent.","translation":"取笑別人的口音很沒禮貌。","speak":"make fun of someone"},{"id":33,"page":2,"head":"make 人 a fool","pos":"(v. phr.)","meaning":"讓某人出糗 ／像傻子","example":"Don’t try to __________ me __________ __________ in front of everyone.","translation":"別想在大家面前讓我出糗。","speak":"make someone a fool"},{"id":34,"page":2,"head":"make a fool of 人","pos":"(v. phr.)","meaning":"愚弄某人； 讓某人丟臉","example":"He __________ ____ _________ _______ her by telling a silly joke about her.","translation":"他講了一個關於她的愚蠢笑 話，讓她丟了臉。","speak":"make a fool of someone"},{"id":35,"page":2,"head":"make a list of","pos":"(v. phr.)","meaning":"列清單","example":"Let’s __________ ___ _________ _____ what to bring for the trip.","translation":"我們來列個旅遊要帶東西的 清單。","speak":"make a list of"},{"id":36,"page":2,"head":"make a difference","pos":"(v. phr.)","meaning":"產生影響； 有所改變","example":"Helping one person can __________ _____ _______________.","translation":"幫助一個人也能產生影響。","speak":"make a difference"},{"id":37,"page":2,"head":"make a change","pos":"(v. phr.)","meaning":"做出改變","example":"If you want to be healthier, you need to __________ __________ __________.","translation":"如果你想變健康，就必須做 出改變。","speak":"make a change"},{"id":38,"page":2,"head":"make a wish","pos":"(v. phr.)","meaning":"許願","example":"Close
