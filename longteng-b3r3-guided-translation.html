<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="龍騰普高 B3R3 引導式翻譯互動練習"><title>龍騰普高 B3R3 引導式翻譯</title><style>:root{--blue:#2563eb;--navy:#1e3a8a;--bg:#f4f7fb;--card:#fff;--line:#dbe3ee;--ink:#172033;--muted:#64748b;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--voice:#6d28d9;--voicebg:#f5f3ff;--amber:#9a3412;--amberbg:#fff7ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}.wrap{max-width:920px;margin:auto;padding:16px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 5px 18px #0f172a0d}.hero{background:linear-gradient(135deg,#e8f1ff,#fff)}h1{margin:0 0 6px;font-size:clamp(25px,4vw,38px)}h2{margin-top:0}.note{color:var(--muted)}.hidden{display:none!important}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.btn{border:0;border-radius:10px;padding:11px 17px;font:800 16px inherit;cursor:pointer;background:#e5e7eb;color:var(--ink);text-decoration:none}.primary{background:var(--blue);color:#fff}.danger{background:#991b1b;color:#fff}.voice{background:var(--voice);color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.btn:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.pick{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin:7px 0;background:#fafcff}.pick input{margin-right:8px;width:17px;height:17px;accent-color:var(--blue)}#list{max-height:440px;overflow:auto;border:1px solid var(--line);padding:7px;border-radius:12px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:800;margin:8px 0 14px}.zh{padding:10px 13px;background:var(--amberbg);border-radius:9px;color:var(--amber);font-weight:800;margin-bottom:10px}.question{font-size:21px;font-weight:750;padding:16px;background:#f8fafc;border-radius:11px;white-space:pre-wrap}.options{display:grid;gap:9px;margin:14px 0}.option{display:flex;align-items:center;gap:11px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-size:18px;font-weight:750;cursor:pointer}.option:hover{border-color:#60a5fa;background:#eff6ff}.option:has(input:checked){border-color:var(--blue);background:#dbeafe;color:var(--navy)}.option input{width:20px;height:20px;accent-color:var(--blue)}.inputs{display:grid;gap:10px;margin:15px 0}.answer-row{display:grid;grid-template-columns:55px 1fr;gap:10px;align-items:center}.answer-row label{font-weight:900;color:var(--navy);text-align:center}.spell{width:100%;font:inherit;font-size:18px;padding:11px;border:2px solid #94a3b8;border-radius:9px}.feedback{padding:13px;border-radius:10px;font-weight:800;margin:13px 0}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.explain{font-weight:500;margin-top:7px}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:var(--voicebg);margin:13px 0}.voicebox b{display:block;font-size:19px;margin-bottom:8px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}.wrong p{margin:6px 0}.source{font-size:13px;color:var(--muted)}@media(max-width:600px){.wrap{padding:9px}.hero,.card{padding:15px}.question{font-size:18px;padding:13px}.option{font-size:17px}.answer-row{grid-template-columns:42px 1fr}.meta{display:block}}</style><link rel="stylesheet" href="longteng-vocab-required-pronunciation.css?v=20261026-4"></head><body><main class="wrap"><section class="hero"><h1>龍騰普高 B3R3 引導式翻譯</h1><p>共 38 題。可自行選題、隨機抽題；答錯後請重新作答。</p><p class="note">答對後顯示來源解析並播放完整英文句；STT 朗讀達 80% 才能進入下一題。完成後可重做錯題並下載 DOCX。</p><div class="toolbar"><a class="btn" href="dashboard.html">← 回測驗總覽</a></div></section><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn">全部選取</button><button id="none" class="btn">全部取消</button><button id="rand20" class="btn">隨機 20 題</button></div><label><input id="shuffle" type="checkbox"> 打亂出題順序</label><div id="list"></div><div class="actions"><button id="start" class="btn primary">開始作答</button><span id="picked" class="note"></span></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="voiceBox" class="voicebox hidden"><b id="voiceTarget"></b><button id="speak" class="btn voice">🔊 再聽一次</button></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="retry" class="btn primary">只重做錯題</button><button id="download" class="btn">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></main><script>const TITLE="龍騰普高 B3R3 引導式翻譯",MODE="multi",Q=[{"id":1,"zh":"這個疾病已經對全球經濟造成了很大的影響。臺灣的國家生產總值預估會因為這場流行病下降2%。","question":"The disease has ①____________ a great ②i____________ ③____________ the global economy. Taiwan’s GDP is predicted to drop by two percent because of the epidemic.","answers":["had","impact","on"],"explanation":"表示「對……造成（很大的）影響」用have a (great) impact on sth.。表示「因為」可用片語due to。","source":"龍騰自命題"},{"id":2,"zh":"住在這裡的人都必須盡自己的一份責任維持其社區的安全與整潔。","question":"Those who live here have to ①____________ ②____________ ③____________ to keep their own community safe and clean.","answers":["do","their","part"],"explanation":"","source":"三合一學習手冊"},{"id":3,"zh":"如果我有錢，我會馬上環遊世界！","question":"If I had the money, I would travel around the world ①____________ the ②____________ ③____________ a ④____________!","answers":["at","drop","of","hat"],"explanation":"","source":"三合一學習手冊"},{"id":4,"zh":"當代的角色扮演根源於日本，首度於1990年代傳至臺灣。","question":"Contemporary cosplay ①____________ ②____________ ③____________ ④____________ Japan and first ⑤____________ ⑥____________ ⑦____________ ⑧____________ Taiwan in the 1990s.","answers":["has","its","roots","in","made","its","way","to"],"explanation":"","source":"三合一學習手冊"},{"id":5,"zh":"日蝕出現的那一天恰好是我的生日。","question":"The day ①____________ ②____________ the solar eclipse occurred just happened to be my birthday.","answers":["on","which"],"explanation":"","source":"三合一學習手冊"},{"id":6,"zh":"身為幼兒園老師，Lillian盡可能地設法有耐心。","question":"As a kindergarten teacher, Lillian tries to be ①____________ ②____________ ③____________ ④____________.","answers":["as","patient","as","possible"],"explanation":"","source":"三合一學習手冊"},{"id":7,"zh":"Sarah被認為對員工太過嚴格。","question":"Sarah ①____________ ②____________ ③____________ be too strict with her employees.","answers":["is","thought","to"],"explanation":"本題測驗S + be + thought/said/believed to VR句型。","source":"龍騰自命題"},{"id":8,"zh":"我們的高中班上有四十位學生，其中兩位決定主修時尚研究。","question":"There were forty students in my high school class, ①____________ ②____________ ③____________ decided to major in fashion studies.","answers":["two","of","whom"],"explanation":"本題測驗...N, all/most/some of which/whom...句型。當先行詞的數量或比例需要特別說明或凸顯時，可在關係代名詞前面加上量詞，形成「量詞 + of + whom/which」。","source":"龍騰自命題"},{"id":9,"zh":"當我們覺得有壓力時，我們容易受到酒精濫用甚至上癮的影響。","question":"When we feel stressed, we ①____________ ②____________ ③____________ alcohol abuse and even addiction.","answers":["are","vulnerable","to"],"explanation":"be vulnerable to表示「易受到……影響」。","source":"龍騰自命題"},{"id":10,"zh":"隨著近年人們對環保變得更有意識，自備瓶子去買飲料已經變成一種時尚。","question":"As people become more ①____________ ②____________ environmental protection in recent years, bringing your own bottle to buy drinks has come into fashion.","answers":["conscious","of"],"explanation":"表示「對……有意識」用be/become conscious of + N。","source":"龍騰自命題"},{"id":11,"zh":"Sarah以一個嚴格、無情的老闆聞名，她毫不猶豫地開除不符合她的期待的員工。","question":"Known as a strict, ruthless boss, Sarah fired employees who didn’t meet her expectations ①____________ ②____________ ③____________ ④____________ ⑤____________ ⑥____________.","answers":["at","the","drop","of","a","hat"],"explanation":"表示「毫不猶豫地」用片語at the drop of a hat。","source":"龍騰自命題"},{"id":12,"zh":"這項計畫的預算有限，因此我們必須盡可能地節省過程中的經費。","question":"The budget of the plan is limited, so we have to make the process ①____________ economical ②____________ ③____________.","answers":["as","as","possible"],"explanation":"表示「盡可能的……」用as... as possible。","source":"龍騰自命題"},{"id":13,"zh":"在這堂課學生被期待可以對課堂討論有貢獻並積極參與課堂，而不是只有坐在教室聆聽。","question":"①____________ ②____________ just sitting in the classroom listening, students are expected to ③____________ ④____________ class discussions and actively participate in the class.","answers":["Instead","of","contribute","to"],"explanation":"表示「而不是……」用instead of。表示「對……有貢獻」用contribute to + N。","source":"龍騰自命題"},{"id":14,"zh":"武漢，因散播至全世界的新病毒出現的地方而知名，可能難以擺脫這個汙名。","question":"Wuhan, known as the place ①____________ ②____________ the new virus that has spread around the world emerged, might have a hard time living down this notorious reputation.","answers":["in","which"],"explanation":"本題測驗關係子句用法，當關係代名詞為形容詞子句的受格時，若形容詞子句中的動詞片語有介系詞，常將介系詞移至關係代名詞 which 或 whom 之前，此時關代不能用that。","source":"龍騰自命題"},{"id":15,"zh":"那位過去曾受囤積症之苦的老婦人幾乎很少丟掉擁有的東西。令人驚訝的是，在心理治療後，她決定清空她的房子。","question":"The old lady ①____________ ②____________ suffer from compulsive hoarding disorder and ③b____________ ④d____________ anything. Surprisingly, after psychotherapy, she decided to clean out her house.","answers":["used","to","barely","discarded"],"explanation":"表示「過去常常……」可用used to + VR。","source":"龍騰自命題"},{"id":16,"zh":"演唱會結束後，歌迷們哼著他們最喜愛的歌前往出口。","question":"After the concert, the fans ①____________ ②____________ ③____________ ④____________ the exits humming their favorite songs.","answers":["made","their","way","to"],"explanation":"","source":"課本例句填空"},{"id":17,"zh":"Charles站起來，為了讓這位老婦人坐他在捷運車廂的座位。","question":"Charles stood up ①____________ ②____________ ③____________ let the elderly woman take his seat on the MRT.","answers":["so","as","to"],"explanation":"","source":"課本例句填空"},{"id":18,"zh":"不用太擔心。Kim能自己前往沙灘。","question":"Don’t worry too much. Kim can ①____________ ②____________ ③____________ to the beach by herself.","answers":["make","her","way"],"explanation":"","source":"習作簿"},{"id":19,"zh":"Dora對狗的懼怕根源於她童年時一次不愉快的經驗。","question":"Dora’s fear of dogs ①____________ ②____________ ③____________ in an unpleasant experience from her childhood.","answers":["has","its","roots"],"explanation":"","source":"習作簿"},{"id":20,"zh":"Jane從提款機提一些錢以便支付電費。","question":"Jane withdrew some money from the ATM ①____________ ②____________ ③____________ pay the electricity bill.","answers":["so","as","to"],"explanation":"","source":"習作簿"},{"id":21,"zh":"人們相信一切真知源於親身經驗。","question":"It is believed that all genuine knowledge ①____________ its ②____________ ③____________ direct experience.","answers":["has","roots","in"],"explanation":"","source":"All in One"},{"id":22,"zh":"雖然那些鯨魚一度游得太靠近岸邊，牠們最後終於回到了大海。","question":"Although the whales once swam too close to the shore, they finally ①____________ ②____________ ③____________ back to the ocean.","answers":["made","their","way"],"explanation":"","source":"All in One"},{"id":23,"zh":"澳洲真的很棒。如果我有足夠的錢，就會毫不猶豫地去那裡。","question":"Australia is really wonderful. If I have enough money, I’ll go there at the ①____________ ②____________ a ③____________.","answers":["drop","of","hat"],"explanation":"","source":"All in One"},{"id":24,"zh":"我們把手機收起來為了專注於老師所說的話。","question":"We put our smartphones away ①s____________ ②____________ ③____________ focus on what the teacher was saying.","answers":["so","as","to"],"explanation":"","source":"三合一學習手冊"},{"id":25,"zh":"為了努力蒐集足夠的證據以起訴那名嫌犯，所有負責那個案件的警察那天都加班工作。","question":"①____________ ②____________ ③____________ ④____________ collect adequate evidence to prosecute the suspect, all the police officers ⑤____________ ⑥____________ the case worked overtime that day.","answers":["In","an","effort","to","responsible","for"],"explanation":"in an effort to表示「為了努力……」，responsible for表示「負責……的」。","source":"龍騰自命題"},{"id":26,"zh":"因為和諧的雇主和員工關係，這間公司的營運長久以來一直很順利。","question":"The operations of the company ①____________ ②____________ ③____________ running smoothly ④d____________ ⑤____________ the harmonious relationship between the ⑥e____________ and ⑦e____________.","answers":["have","long","been","due","to","employers","employees"],"explanation":"表示「長久以來一直是……」用has/have long been...。表示「因為……」用due to + N。","source":"龍騰自命題"},{"id":27,"zh":"Carol非常喜愛唱歌，以致於一有機會她就會毫不猶豫地引吭高歌。","question":"Carol loves singing so much that she will burst into song ①____________ ②____________ ③____________ ④____________ ⑤____________ ⑥____________ when she is given the chance.","answers":["at","the","drop","of","a","hat"],"explanation":"","source":"課本例句填空"},{"id":28,"zh":"現代奧運起源於古希臘的一項傳統。","question":"The modern Olympic Games ①____________ ②____________ ③____________ ④____________ a tradition from ancient Greece.","answers":["have","their","roots","in"],"explanation":"","source":"課本例句填空"},{"id":29,"zh":"早該對酒駕制訂更嚴格的法律了。","question":"①____________ ②____________ ③____________ ④____________ we made stricter laws against drunk driving.","answers":["It’s","high","time","that"],"explanation":"表示「早該做……」用句型it’s high time that + 過去式子句。","source":"龍騰自命題"},{"id":30,"zh":"無疑地，壓力是造成她的健康問題的主要因素之一。","question":"①____________, stress is ②____________ of the main ③f____________ that lead to her health problems.","answers":["Undoubtedly","one","factors"],"explanation":"表示「無疑地」用undoubtedly。表示「……之一」用one of...+複數名詞。","source":"龍騰自命題"},{"id":31,"zh":"這所學校必須採取行動來處理校園霸凌的問題。","question":"The school must ①____________ ②____________ to deal with the problems of school bullying.","answers":["take","action"],"explanation":"表示「採取行動」用片語take action。","source":"龍騰自命題"},{"id":32,"zh":"我們早該藉由向一次性塑膠說不，更永續地過生活了。","question":"It’s ①____________ ②____________ that we ③____________ more ④____________ by saying no to single-use plastic.","answers":["high","time","lived","sustainably"],"explanation":"本題測驗It is high time (that) S + Ved...，子句內的動詞應使用過去式動詞。","source":"龍騰自命題"},{"id":33,"zh":"據說Orlando為了成為一位模特兒已經去動了整形手術。","question":"Orlando ①____________ ②____________ ③____________ ④____________ had plastic surgery ⑤i____________ ⑥____________ ⑦____________ become a model.","answers":["is","said","to","have","in","order","to"],"explanation":"本題測驗S + be + thought/said/believed to VR句型。表示「為了……」用 in order to + VR。","source":"龍騰自命題"},{"id":34,"zh":"我們在流行病期間應該避免出國旅遊，以極小化被感染的風險。","question":"We should avoid traveling abroad during the epidemic ①s____________ ②____________ ③____________ minimize the risk of infection.","answers":["so","as","to"],"explanation":"表示「為了……」用so as to + VR。","source":"龍騰自命題"},{"id":35,"zh":"Kevin希望藉由舉辦淨灘活動能為世界做一點改變。","question":"Kevin hoped to ①____________ ②____________ ③____________ for the world by holding beach cleanup events.","answers":["make","a","difference"],"explanation":"表示「做一點改變」用片語make a difference。","source":"龍騰自命題"},{"id":36,"zh":"有些青少年的情緒問題根源在於和他們父母的關係，其中有些太過苛求。","question":"Some teenagers’ emotional problems ①____________ ②____________ ③____________ ④____________ their relationships with their parents, ⑤____________ ⑥____________ ⑦____________ are too demanding.","answers":["have","their","roots","in","some","of","whom"],"explanation":"表示「根源在於……」用have one’s roots in...。本題測驗...N, all/most/some of which/whom...句型。當先行詞的數量或比例需要特別說明或凸顯時，可在關係代名詞前面加上量詞，形成「量詞 + of + whom/which」。","source":"龍騰自命題"},{"id":37,"zh":"藉著騎腳踏車上班而不是開車上班，我們正在盡自己的一份責任來保護環境。","question":"By riding bicycles to work instead of driving cars, we are ①____________ ②____________ ③____________ to protect the environment.","answers":["doing","our","part"],"explanation":"","source":"課本例句填空"},{"id":38,"zh":"你去哪了？我等了好幾個小時。好吧，我有點誇張了，但感覺就像等了好幾個小時一樣。","question":"Where have you been? I waited for hours. All right, I’m exaggerating, but it ①____________ ②____________ hours.","answers":["seemed","like"],"explanation":"","source":"三合一學習手冊"}];const $=s=>document.querySelector(s),list=$('#list'),select=$('#select'),quiz=$('#quiz'),result=$('#result'),question=$('#question'),answerArea=$('#answerArea'),feedback=$('#feedback'),next=$('#next');let chosen=[],idx=0,mode='first';const wrong=new Map(),correct=new Set();const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ');const shuffled=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function renderList(){list.innerHTML=Q.map(q=>'<label class="pick"><input class="pickbox" type="checkbox" value="'+q.id+'" checked><b>第 '+q.id+' 題</b> <span class="source">'+esc(q.source||'')+'</span></label>').join('');count()}function count(){$('#picked').textContent='已選 '+document.querySelectorAll('.pickbox:checked').length+' 題'}list.addEventListener('change',count);$('#all').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=true);count()};$('#none').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=false);count()};$('#rand20').onclick=()=>{let ids=new Set(shuffled(Q).slice(0,Math.min(20,Q.length)).map(q=>q.id));document.querySelectorAll('.pickbox').forEach(x=>x.checked=ids.has(+x.value));count()};$('#start').onclick=()=>{const ids=[...document.querySelectorAll(
