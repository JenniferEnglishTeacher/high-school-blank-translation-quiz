border-radius:9px;color:var(--amber);font-weight:800;margin-bottom:10px}.question{font-size:21px;font-weight:750;padding:16px;background:#f8fafc;border-radius:11px;white-space:pre-wrap}.options{display:grid;gap:9px;margin:14px 0}.option{display:flex;align-items:center;gap:11px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-size:18px;font-weight:750;cursor:pointer}.option:hover{border-color:#60a5fa;background:#eff6ff}.option:has(input:checked){border-color:var(--blue);background:#dbeafe;color:var(--navy)}.option input{width:20px;height:20px;accent-color:var(--blue)}.inputs{display:grid;gap:10px;margin:15px 0}.answer-row{display:grid;grid-template-columns:55px 1fr;gap:10px;align-items:center}.answer-row label{font-weight:900;color:var(--navy);text-align:center}.spell{width:100%;font:inherit;font-size:18px;padding:11px;border:2px solid #94a3b8;border-radius:9px}.feedback{padding:13px;border-radius:10px;font-weight:800;margin:13px 0}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.explain{font-weight:500;margin-top:7px}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:var(--voicebg);margin:13px 0}.voicebox b{display:block;font-size:19px;margin-bottom:8px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}.wrong p{margin:6px 0}.source{font-size:13px;color:var(--muted)}@media(max-width:600px){.wrap{padding:9px}.hero,.card{padding:15px}.question{font-size:18px;padding:13px}.option{font-size:17px}.answer-row{grid-template-columns:42px 1fr}.meta{display:block}}</style><link rel="stylesheet" href="longteng-vocab-required-pronunciation.css?v=20261026-4"></head><body><main class="wrap"><section class="hero"><h1>龍騰普高 B3U6 引導式翻譯</h1><p>共 47 題。可自行選題、隨機抽題；答錯後請重新作答。</p><p class="note">答對後顯示來源解析並播放完整英文句；STT 朗讀達 80% 才能進入下一題。完成後可重做錯題並下載 DOCX。</p><div class="toolbar"><a class="btn" href="dashboard.html">← 回測驗總覽</a></div></section><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn">全部選取</button><button id="none" class="btn">全部取消</button><button id="rand20" class="btn">隨機 20 題</button></div><label><input id="shuffle" type="checkbox"> 打亂出題順序</label><div id="list"></div><div class="actions"><button id="start" class="btn primary">開始作答</button><span id="picked" class="note"></span></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="voiceBox" class="voicebox hidden"><b id="voiceTarget"></b><button id="speak" class="btn voice">🔊 再聽一次</button></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="retry" class="btn primary">只重做錯題</button><button id="download" class="btn">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></main><script>const TITLE="龍騰普高 B3U6 引導式翻譯",MODE="multi",Q=[{"id":1,"zh":"他們決定一大早出發以避免公路上的繁忙交通。","question":"They decided to ①____________ ②____________ early in the morning to avoid heavy traffic on the highway.","answers":["set","off"],"explanation":"set off 出發；啓程；heavy traffic 交通繁忙","source":"龍騰自命題"},{"id":2,"zh":"當Sally正走過公園時，她偶然發現一群在草地上練習瑜珈的人。","question":"While Sally was walking through the park, she ①____________ ②____________ a group of people practicing yoga on the grass.","answers":["came","upon"],"explanation":"come upon 偶然發現；yoga 瑜珈","source":"龍騰自命題"},{"id":3,"zh":"這電影無聊而且特效又差；最糟的是，故事完全說不通。","question":"The movie was boring and had terrible special effects; ①____________ ②____________ ③____________, the story didn’t make any sense.","answers":["worst","of","all"],"explanation":"special effects 特效；worst of all 最糟的是；make sense 合乎邏輯","source":"龍騰自命題"},{"id":4,"zh":"Cindy的工作是去照顧養老院的長者並幫助他們處理日常事務。","question":"Cindy’s job is to ①____________ ②____________ the elderly in the nursing home and help them deal with daily tasks.","answers":["care","for"],"explanation":"care for 照顧；the elderly 年長者；daily tasks 日常事務","source":"龍騰自命題"},{"id":5,"zh":"當Jenny去遠方度假時我照顧她的狗，而作為回報，她買了一個很棒的禮物給我。","question":"I took care of her dog while Jenny was away for vacation, and ①____________ ②____________, she bought me a nice gift.","answers":["in","return"],"explanation":"in return 作為回報","source":"龍騰自命題"},{"id":6,"zh":"看完牙醫後，我被告知接下來兩個小時不要吃也不要喝任何東西。","question":"After seeing the dentist, I was told to ①____________ eat ②____________ drink anything for the next two hours.","answers":["neither","nor"],"explanation":"neither…nor…. 既非……也非……；不要……也不要……","source":"龍騰自命題"},{"id":7,"zh":"當這對夫妻第一次看到這房子時，他們知道它就是他們開始新生活的完美地點。","question":"When the couple first ①____________ ②____________ ③____________ the house, they knew it was the perfect place for them to start their new life.","answers":["laid","eyes","on"],"explanation":"lay eyes on表示「看到」，從knew可得知時態為過去式，故動詞填入laid","source":"龍騰自命題"},{"id":8,"zh":"Rick總是抱持著事情會好轉的希望，儘管有時候情況似乎無望。","question":"Rick always ①____________ ②____________ the hope that things would improve even though the situation seemed hopeless at times.","answers":["clung","to"],"explanation":"cling to表示「堅信」，應填入過去式clung；at times 有時候","source":"龍騰自命題"},{"id":9,"zh":"我們正沿著一條不熟悉的小路行走，突然間，我們偶然發現一個被樹環繞的美麗湖泊。","question":"We were walking down an unfamiliar path when suddenly we ①____________ ②____________ a beautiful lake surrounded by trees.","answers":["came","upon"],"explanation":"come upon表示「偶然發現」，從were walking down可得知應填入過去式came upon；surrounded by 被……圍繞","source":"龍騰自命題"},{"id":10,"zh":"我卡在車陣中好幾個小時而且我的手機沒電了；最糟的是，我錯過了面試。","question":"I got stuck in traffic for hours and my phone died; ①____________ ②____________ ③____________, I missed my interview.","answers":["worst","of","all"],"explanation":"get stuck in 困在……；worst of all 最糟的是","source":"龍騰自命題"},{"id":11,"zh":"Henry幫助Lily搬進她的新公寓，所以她承諾烤他最愛的蛋糕作為回報。","question":"Henry assisted Lily in moving into her new apartment, and ①____________ ②____________, she promised to bake him his favorite cake.","answers":["in","return"],"explanation":"in return 作為回報","source":"龍騰自命題"},{"id":12,"zh":"經過數日的準備之後，這對夫妻出發前往海岸之旅，渴望在海邊度過週末。","question":"After days of preparation, the couple ①____________ ②____________ on their journey to the coast, eager to spend the weekend by the beach.","answers":["set","off"],"explanation":"set off 出發；啟程","source":"龍騰自命題"},{"id":13,"zh":"Sara幫我計劃我的婚禮，而我在典禮期間公開感謝她的支持作為回報。","question":"Sara helped me plan my wedding and ①____________ ②____________ ③____________ her support, I thanked her publicly during the ceremony.","answers":["in","return","for"],"explanation":"in return for 作為（對……的）回報","source":"龍騰自命題"},{"id":14,"zh":"為了他妻子的緣故，Steve學著煮她最喜愛的餐點，希望能表達出他有多關心她。","question":"Steve learned to cook his wife’s favorite meals ①____________ her ②____________, hoping to show how much he cared for her.","answers":["for","sake"],"explanation":"for one’s sake 為了某人","source":"龍騰自命題"},{"id":15,"zh":"直到Julian獲獎，人們才開始認可他在演戲方面的天分。","question":"①____________ was ②____________ ③____________ Julian won the award ④____________ people began to recognize his talent in acting.","answers":["It","not","until","that"],"explanation":"It was not until...that…. 直到……才……；acting 演戲","source":"龍騰自命題"},{"id":16,"zh":"今晚我們可以從Foodpanda或是Uber Eats訂餐，取決於哪家餐廳有比較好的折扣。","question":"We can ①____________ order from Foodpanda ②____________ Uber Eats tonight, depending on which restaurant has the better discounts.","answers":["either","or"],"explanation":"either…or…. 不是……就是……；depending on 視……而定；取決於","source":"龍騰自命題"},{"id":17,"zh":"儘管發生在她周圍的所有改變，Julia仍堅持她的舊常規並拒絕擁抱新的生活方式。","question":"Despite all the changes happening around her, Julia ①____________ ②____________ her old routine and refused to embrace the new way of life.","answers":["clung","to"],"explanation":"cling to 堅持；堅信；routine 常規；embrace 擁抱","source":"龍騰自命題"},{"id":18,"zh":"Tina花很多時間照顧她的植物，確保它們都接受到適量的陽光和水。","question":"Tina spends a lot of time ① ____________ ②____________ her plants, making sure they all receive the right amount of sunlight and water.","answers":["caring","for"],"explanation":"care for 表示「照顧」，因spend後方動詞須用V-ing，故填入caring","source":"龍騰自命題"},{"id":19,"zh":"我一看見我剛出生的女兒，一股強烈的愛意湧上心頭，我以前從未感受過。","question":"The moment I ①____________ ②____________ ③____________ my newborn daughter, a strong wave of love rose within me, unlike anything I had ever felt before.","answers":["laid","eyes","on"],"explanation":"lay eyes on表示「看到」，須用過去式，故動詞填入laid","source":"龍騰自命題"},{"id":20,"zh":"為了他父母的緣故，Roger承諾會到場，因為他完全知道家庭晚餐對他們有多重要。","question":"Roger promised to be there ①____________ his ②____________ ③____________ , as he was fully aware of how much family dinners meant to them.","answers":["for","parents’","sake"],"explanation":"for one’s sake 為了某人；be aware of 意識到","source":"龍騰自命題"},{"id":21,"zh":"儘管時間還很早，旅客們還是啟程前往機場，以趕上班機。","question":"Despite the early hour, the travelers ①____________ ②____________ for the airport to catch their flight.","answers":["set","off"],"explanation":"","source":"課本例句填空"},{"id":22,"zh":"我在市場偶然遇到一位老朋友，我們花了好幾個小時了解彼此的近況。","question":"I ①____________ ②____________ an old friend at the market, and we spent hours catching up on each other’s lives.","answers":["came","upon"],"explanation":"","source":"課本例句填空"},{"id":23,"zh":"手術後，Cindy雇用了一位護理師來照顧她的父親，幫助他康復。","question":"After the surgery, Cindy hired a nurse to ①____________ ②____________ her father and help with his recovery.","answers":["care","for"],"explanation":"","source":"課本例句填空"},{"id":24,"zh":"儘管情況困難，Ken仍然堅信事情很快會好轉。","question":"Despite the difficult situation, Ken ①____________ ②____________ the hope that things would get better soon.","answers":["clung","to"],"explanation":"","source":"課本例句填空"},{"id":25,"zh":"林先生一看到那幅美麗的畫作，就知道自己一定要買下它。","question":"As soon as Mr. Lin ①____________ ②____________ ③____________ the beautiful painting, he knew he had to buy it.","answers":["laid","eyes","on"],"explanation":"","source":"課本例句填空"},{"id":26,"zh":"我們的車在前往機場的途中拋錨了，而最糟的是，我們錯過了班機。","question":"The car broke down on the way to the airport, and ①____________ ②____________ ③____________, we missed our flight.","answers":["worst","of","all"],"explanation":"","source":"課本例句填空"},{"id":27,"zh":"Jane幫助Lucas處理他的專案，作為回報，他提議請她吃午餐。","question":"Jane helped Lucas with his project, and ①____________ ②____________, he offered to buy her lunch.","answers":["in","return"],"explanation":"","source":"課本例句填空"},{"id":28,"zh":"Kevin為了家人加班工作，希望能給他們更好的生活。","question":"Kevin worked extra hours ①____________ ②____________ ③____________ ④____________ his family, hoping to give them a better life.","answers":["for","the","sake","of"],"explanation":"","source":"課本例句填空"},{"id":29,"zh":"為了健康著想，Jack不再吃速食，開始在家自己煮新鮮的餐點。","question":"①____________ ②____________ ③____________ ④____________ his health, Jack stopped eating fast food and started cooking fresh meals at home.","answers":["For","the","sake","of"],"explanation":"","source":"課本例句填空"},{"id":30,"zh":"我真的很感激你為我所做的事。我能請你吃午餐當作回報嗎？","question":"I’m really grateful for what you have done for me. Can I buy you lunch ①____________ ②____________ ③____________ your help?","answers":["in","return","for"],"explanation":"","source":"習作簿"},{"id":31,"zh":"Eric的女兒剛出生，因此他決定為了她戒菸。","question":"Eric’s daughter had just been born, so he decided to quit smoking ①____________ ②____________ ③____________.","answers":["for","her","sake"],"explanation":"","source":"習作簿"},{"id":32,"zh":"Gina一看到Robert，就知道他會是最適合那工作的人。","question":"As soon as Gina ①____________ ②____________ ③____________ Robert, she knew that he would be the perfect man for the job.","answers":["laid","eyes","on"],"explanation":"","source":"習作簿"},{"id":33,"zh":"即使經歷多年的挫折，Emma仍然堅持她成為職業歌手的夢想。","question":"Even after years of setbacks, Emma is still ①____________ ②____________ her dream of becoming a professional singer.","answers":["clinging","to"],"explanation":"","source":"三合一學習手冊"},{"id":34,"zh":"我們在森林裡迷了路，食物也吃完了。最糟的是，一隻熊還來追我們。","question":"We got lost in the forest and ran out of food. ①____________ ②____________ ③____________, a bear chased us.","answers":["Worst","of","all"],"explanation":"","source":"三合一學習手冊"},{"id":35,"zh":"一大早，登山客們就啟程向山頂出發，希望能在中午前登頂。","question":"Early in the morning, the hikers ①____________ ②____________ for the mountain summit, eager to reach the peak before noon.","answers":["set","off"],"explanation":"","source":"三合一學習手冊"},{"id":36,"zh":"這位年長女士獨居，因此她的鄰居是唯一能夠方便地照顧她的人。","question":"The elderly woman lives alone, so her neighbors are the only people who could conveniently ①____________ ②____________ her.","answers":["care","for"],"explanation":"","source":"三合一學習手冊"},{"id":37,"zh":"這位當地農夫提供了新鮮蔬菜，作為幫忙採收的回報。","question":"The local farmer provided fresh vegetables ①____________ ②____________ ③____________ help with the harvest.","answers":["in","return","for"],"explanation":"","source":"三合一學習手冊"},{"id":38,"zh":"那是我第一次親眼看到真正的貓熊，我忍不住一直盯著看。","question":"It was the first time I had ①____________ ②____________ ③____________ a real panda, and I couldn’t stop staring at it.","answers":["laid","eyes","on"],"explanation":"","source":"三合一學習手冊"},{"id":39,"zh":"Lisa為了朋友答應了這次的長途旅行，儘管她並不喜歡旅遊。","question":"Lisa agreed to the long road trip ①____________ ②____________ ③____________ ④____________, even though she didn’t enjoy traveling.","answers":["for","her","friend’s||friends’","sake"],"explanation":"","source":"三合一學習手冊"},{"id":40,"zh":"在公園散步時，我偶然遇到了一隻流浪貓，就把牠帶回家了。","question":"While walking in the park, I ①____________ ②____________ a stray cat and took it home.","answers":["came","upon"],"explanation":"","source":"三合一學習手冊"},{"id":41,"zh":"Nancy直到上週五才得知她錄取大學。","question":"①____________ ②____________ ③____________ last Friday ④____________ Nancy knew she had been accepted by the university.","answers":["It","wasn’t","until","that"],"explanation":"","source":"三合一學習手冊"},{"id":42,"zh":"我們可以繼續做實驗或者暫停先回宿舍去。","question":"We can ①____________ keep doing the experiment ②____________ stop and go back to the dormitory.","answers":["either","or"],"explanation":"","source":"三合一學習手冊"},{"id":43,"zh":"好奇的人總是在追求新知。","question":"①____________ ②____________always ③____________ new knowledge.","answers":["The","curious","seek"],"explanation":"","source":"三合一學習手冊"},{"id":44,"zh":"你練習得愈多，就會變得愈厲害。","question":"①____________ ②____________ you practice, ③____________ ④____________ you will get.","answers":["The","more","the","better"],"explanation":"","source":"三合一學習手冊"},{"id":45,"zh":"當我第一次看到那勤勞的年輕人時，我對他印象很好。","question":"When I first ①____________ ②____________ ③____________ the hard-working young man, I had a good impression of him.","answers":["laid","eyes","on"],"explanation":"","source":"All in One"},{"id":46,"zh":"在失業後，Nick覺得害怕、對未來不確定。最糟的是，他覺得自己像個失敗者。","question":"After losing his job, Nick felt scared and unsure of his future. ①____________ ②____________ ③____________, he felt like a failure.","answers":["Worst","of","all"],"explanation":"","source":"All in One"},{"id":47,"zh":"在你出發去露營前，最好檢查是否已經打包手電筒和一些保暖的衣服。","question":"Before you ①____________ ②____________ on your camping trip, you had better check that you’ve packed a flashlight and some warm clothes.","answers":["set","off"],"explanation":"","source":"All in One"}];const $=s=>document.querySelector(s),list=$('#list'),select=$('#select'),quiz=$('#quiz'),result=$('#result'),question=$('#question'),answerArea=$('#answerArea'),feedback=$('#feedback'),next=$('#next');let chosen=[],idx=0,mode='first';const wrong=new Map(),correct=new Set();const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ');const shuffled=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function renderList(){list.innerHTML=Q.map(q=>'<label class="pick"><input class="pickbox" type="checkbox" value="'+q.id+'" checked><b>第 '+q.id+' 題</b> <span class="source">'+esc(q.source||'')+'</span></label>').join('');count()}function count(){$('#picked').textContent='已選 '+document.querySelectorAll('.pickbox:checked').length+' 題'}list.addEventListener('change',count);$('#all').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=true);count()};$('#none').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=false);count()};$('#rand20').onclick=()=>{let ids=new Set(shuffled(Q).slice(0,Math.min(20,Q.length)).map(q=>q.id));document.querySelectorAll('.pickbox').forEach(x=>x.checked=ids.has(+x.value));count()};$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));if($('#shuffle').checked)chosen=shuffled(chosen);idx=0;mode='first';wrong.clear();correct.clear();select.classList.add('hidden');result.classList.add('hidden');quiz.classList.remove('hidden');show()};function show(){const q=chosen[idx];speechSynthesis?.cancel();$('#meta').textContent=(mode==='retry'?'錯題重做｜':'')+'第 '+(idx+1)+' / '+chosen.length+' 題';$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';$('#bar').style.width=(idx+1)/chosen.length*100+'%';question.textContent=q.question;const zh=$('#zh');if(q.zh){zh.textContent=q.zh;zh.classList.remove('hidden')}else zh.classList.add('hidden');feedback.className='feedback hidden';$('#voiceBox').classList.add('hidden');$('#check').classList.remove('hidden');next.classList.add('hidden');if(MODE==='mcq')answerArea.innerHTML='<div class="options">'+q.options.map((o,i)=>'<label class="option"><input type="radio" name="answer" value="'+i+'"><b>'+String.fromCharCode(65+i)+'.</b> '+esc(o)+'</label>').join('')+'</div>';else answerArea.innerHTML='<div class="inputs">'+q.answers.map((_,i)=>'<div class="answer-row"><label>'+(MODE==='multi'?['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'][i]:'答案')+'</label><input class="spell" autocomplete="off" spellcheck="false" placeholder="請輸入完整答案"></div>').join('')+'</div>';setTimeout(()=>answerArea.querySelector('input')?.focus(),0)}function currentAnswers(){if(MODE==='mcq'){const x=answerArea.querySelector('input:checked');return x?[+x.value]:[]}return [...answerArea.querySelectorAll('.spell')].map(x=>x.value)}function correctText(q){return MODE==='mcq'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.answers.map(a=>a.split('||')[0]).join(' / ')}function isCorrect(q,a){return MODE==='mcq'?a[0]===q.answer:a.every((x,i)=>q.answers[i].split(/\|\||\//).some(v=>norm(x)===norm(v)))}function completedSentence(q){if(MODE==='mcq'){let s=q.question,v=q.options[q.answer],parts=(s.match(/_{3,}/g)||[]).length>1&&v.includes(';')?v.split(';').map(x=>x.trim()):[v];parts.forEach(x=>s=s.replace(/_{3,}/,x));return s}if(MODE==='spell')return q.question.replace(/[A-Za-z]?_{3,}[A-Za-z]?/,q.answers[0].split('||')[0]);let s=q.question,marks=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];q.answers.forEach((a,i)=>{let value=a.split('||')[0];let re=new RegExp(marks[i]+'\\s*[A-Za-z]?_{3,}[A-Za-z]?');if(re.test(s))s=s.replace(re,value);else s=s.replace(/_{3,}/,value)});return s.replace(/[①-⑩]/g,'')}function speak(){if(!speechSynthesis)return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance($('#voiceTarget').textContent);u.lang='en-US';u.rate=.86;speechSynthesis.speak(u)}$('#speak').onclick=speak;$('#check').onclick=()=>{const q=chosen[idx],a=currentAnswers();if((MODE==='mcq'&&!a.length)||(MODE!=='mcq'&&(a.length!==q.answers.length||a.some(x=>!x.trim()))))return alert('請完成所有答案。');if(isCorrect(q,a)){correct.add(q.id);feedback.className='feedback ok';feedback.innerHTML='✅ 全部正確！'+(q.explanation?'<div class="explain">解析：'+esc(q.explanation)+'</div>':'');$('#check').classList.add('hidden');next.classList.remove('hidden');$('#voiceTarget').textContent=completedSentence(q);$('#voiceBox').classList.remove('hidden');speak()}else{if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(MODE==='mcq'?String.fromCharCode(65+a[0]):a.join(' / '));$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';feedback.className='feedback bad';feedback.innerHTML='❌ 答案不正確。正確答案：<strong>'+esc(correctText(q))+'</strong><br>請重新作答。'+(q.explanation?'<div class="explain">解析：'+esc(q.explanation)+'</div>':'');if(MODE==='mcq')answerArea.querySelectorAll('input').forEach(x=>x.checked=false);else answerArea.querySelectorAll('.spell').forEach(x=>x.value='');answerArea.querySelector('input')?.focus()}};next.onclick=()=>{idx++;idx>=chosen.length?finish():show()};$('#finish').onclick=finish;function finish(){speechSynthesis?.cancel();quiz.classList.add('hidden');result.classList.remove('hidden');$('#summary').innerHTML='<div class="stat">本輪題數<b>'+chosen.length+'</b></div><div class="stat">完成答對<b>'+correct.size+'</b></div><div class="stat">曾答錯<b>'+wrong.size+'</b></div>';$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>'<div class="wrong"><b>'+(i+1)+'. 第 '+r.q.id+' 題</b><p>'+esc((r.q.zh?r.q.zh+'\n':'')+r.q.question)+'</p><p><strong>錯誤答案：</strong>'+r.attempts.map(esc).join('；')+'</p><p><strong>正確答案：</strong>'+esc(correctText(r.q))+'</p>'+(r.q.explanation?'<p><strong>解析：</strong>'+esc(r.q.explanation)+'</p>':'')+'</div>').join(''):'<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size);$('#retry').classList.toggle('hidden',!wrong.size)}$('#retry').onclick=()=>{chosen=[...wrong.values()].map(x=>x.q);idx=0;mode='retry';correct.clear();result.classList.add('hidden');quiz.classList.remove('hidden');show()};$('#restart').onclick=()=>location.reload();$('#download').onclick=async()=>{if(!wrong.size)return;try{if(!window.docx)await new Promise((ok,fail)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js';s.onload=ok;s.onerror=fail;document.head.append(s)});let{Document,Packer,Paragraph,TextRun,HeadingLevel}=window.docx,children=[new Paragraph({text:TITLE+' 錯題紀錄',heading:HeadingLevel.TITLE})];for(const [_,r] of wrong){children.push(new Paragraph({children:[new TextRun({text:'第 '+r.q.id+' 題',bold:true})]}));if(r.q.zh)children.push(new Paragraph(r.q.zh));children.push(new Paragraph(r.q.question),new Paragraph('錯誤答案：'+r.attempts.join('；')),new Paragraph('正確答案：'+correctText(r.q)));if(r.q.explanation)children.push(new Paragraph('解析：'+r.q.explanation));children.push(new Paragraph('重新作答：________________________________________'))}let blob=await Packer.toBlob(new Document({sections:[{children}]})),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=TITLE+'_錯題.docx';a.click();URL.revokeObjectURL(url)}catch(e){let text=[...wrong.values()].map(r=>'第 '+r.q.id+' 題\n'+(r.q.zh?r.q.zh+'\n':'')+r.q.question+'\n錯誤答案：'+r.attempts.join('；')+'\n正確答案：'+correctText(r.q)+(r.q.explanation?'\n解析：'+r.q.explanation:'')).join('\n\n');let blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=TITLE+'_錯題.txt';a.click();URL.revokeObjectURL(url)}};renderList();</script><script src="longteng-vocab-required-pronunciation.js?v=20261026-4"></script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
