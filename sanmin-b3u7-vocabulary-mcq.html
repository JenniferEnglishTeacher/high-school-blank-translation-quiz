<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三民普高 B3U7｜詞彙選擇</title><style>
:root{--blue:#2563eb;--deep:#172554;--bg:#f4f7fb;--line:#d9e2ef;--ok:#15803d;--bad:#b91c1c;--violet:#6d28d9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font-family:Arial,"Microsoft JhengHei",sans-serif;line-height:1.7}main{max-width:1060px;margin:auto;padding:14px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 7px 24px #0f172a0c}.hero{background:linear-gradient(135deg,#eff6ff,#fff)}h1{margin:0;font-size:clamp(25px,4vw,38px)}h2,h3{margin:0 0 10px}.muted{color:#64748b}.hidden{display:none!important}.btn{border:0;border-radius:10px;padding:10px 15px;font:800 16px inherit;cursor:pointer;background:#e5e7eb;color:#172033;text-decoration:none}.primary{background:var(--blue);color:#fff}.voice{background:var(--violet);color:#fff}.danger{background:#991b1b;color:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;font-weight:800;color:#64748b;margin:9px 0}.prompt,.passage{font-size:18px;background:#f8fafc;border-radius:12px;padding:16px;white-space:pre-wrap}.passage{max-height:48vh;overflow:auto}.blank-now{background:#fef3c7;color:#92400e;padding:2px 7px;border-radius:6px;font-weight:900}.options{display:grid;gap:9px;margin:14px 0}.option{border:2px solid #cbd5e1;background:#fff;border-radius:11px;padding:12px 14px;text-align:left;font:700 16px inherit;cursor:pointer}.option:hover{border-color:var(--blue)}.option.wrong{border-color:#fecaca;background:#fff1f2}.option.correct{border-color:#86efac;background:#f0fdf4}.feedback,.reference{padding:13px;border-radius:10px;margin:12px 0;font-weight:800;white-space:pre-wrap}.feedback.ok{background:#ecfdf3;color:var(--ok)}.feedback.bad{background:#fff1f2;color:var(--bad)}.reference{border:2px solid #bbf7d0;background:#f0fdf4}.translation{white-space:pre-wrap;background:#f8fafc;padding:16px;border-radius:12px;font-size:18px}.inline-input{width:150px;max-width:100%;font:inherit;padding:7px 9px;border:2px solid #94a3b8;border-radius:8px;margin:3px}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:#f5f3ff;margin:12px 0}.voice-result{background:#fff;border:1px solid #ddd6fe;padding:10px;border-radius:9px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat,.wrong-card{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong-card{margin:10px 0;background:#fff7f7;border-color:#fecaca}@media(max-width:620px){main{padding:8px}.hero,.card{padding:15px}.meta{display:block}.prompt,.passage,.translation{font-size:16px}}
</style></head><body><main><section class="hero"><h1>三民普高 B3U7｜詞彙選擇</h1><p class="muted">原題互動練習｜46 題｜即時批改｜錯誤重填｜答對後整句播放＋選做 STT｜錯題 DOCX｜成績登錄</p><div class="actions"><a class="btn" href="dashboard.html">← 回 Dashboard</a></div></section><section id="quiz" class="card"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="reference" class="reference hidden"></div><div id="voiceBox" class="voicebox hidden"><h3>🎙️ Pronunciation Check（選做）</h3><p><b id="voiceTarget"></b></p><div class="actions"><button id="speak" class="btn voice">🔊 再聽一次</button><button id="mic" class="btn primary">🎤 開始朗讀評分</button></div><div id="voiceResult" class="voice-result">尚未進行朗讀評分。</div></div><div class="actions"><button id="check" class="btn primary hidden">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束本輪</button></div></section><section id="result" class="card hidden"><h2>練習結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="download" class="btn primary">下載錯題 DOCX</button><button id="restart" class="btn">重新練習</button></div></section></main><script>
const QUIZ={"unit":"B3U7","kind":"mcq","title":"詞彙選擇","count":46,"data":[{"number":1,"prompt":"The tribe leader asked that everyone ______ their personal interest and fight against their common enemy.","options":{"A":"bring about","B":"put aside","C":"care for","D":"look after"},"answer":"B","sentence":"The tribe leader asked that everyone put aside their personal interest and fight against their common enemy."},{"number":2,"prompt":"I'm watching an important game now. Please don't ______ the channel.","options":{"A":"switch","B":"ignore","C":"twist","D":"chop"},"answer":"A","sentence":"I'm watching an important game now. Please don't switch the channel."},{"number":3,"prompt":"Hendrick _____ on buying me a birthday gift. I have no choice but to accept it.","options":{"A":"fetches","B":"glimpses","C":"insists","D":"devotes"},"answer":"C","sentence":"Hendrick insists on buying me a birthday gift. I have no choice but to accept it."},{"number":4,"prompt":"Many students chose to _____ in school clubs to take up new hobbies and meet new friends.","options":{"A":"take part","B":"take place","C":"take care","D":"take control"},"answer":"A","sentence":"Many students chose to take part in school clubs to take up new hobbies and meet new friends."},{"number":5,"prompt":"While the couple were looking _____ for their missing children, the kids were actually having fun in the woods nearby.","options":{"A":"anxiously","B":"precisely","C":"evidently","D":"distinctly"},"answer":"A","sentence":"While the couple were looking anxiously for their missing children, the kids were actually having fun in the woods nearby."},{"number":6,"prompt":"Russia is a(n) _____ country which is known for its cold winter.","options":{"A":"northern","B":"absolute","C":"amusing","D":"domestic"},"answer":"A","sentence":"Russia is a(n) northern country which is known for its cold winter."},{"number":7,"prompt":"We were awaiting the results of the school’s annual English drama contest. Our class won the first place last year, and we certainly wanted to win again this year.","options":{"A":"consciously","B":"anxiously","C":"fortunately","D":"competently"},"answer":"B","sentence":"We were anxiously awaiting the results of the school’s annual English drama contest. Our class won the first place last year, and we certainly wanted to win again this year."},{"number":8,"prompt":"We can watch more than 100 _____ on cable TV, but few of them are educational.","options":{"A":"praises","B":"curtains","C":"channels","D":"ambitions"},"answer":"C","sentence":"We can watch more than 100 channels on cable TV, but few of them are educational."},{"number":9,"prompt":"On the _____ of Danny’s poor academic performance, his mother thinks he seldom studies.","options":{"A":"anxiety","B":"channel","C":"ambition","D":"basis"},"answer":"D","sentence":"On the basis of Danny’s poor academic performance, his mother thinks he seldom studies."},{"number":10,"prompt":"Mike _____ channels to watch his favorite TV series with a remote control.","options":{"A":"amuses","B":"switches","C":"insists","D":"awaits"},"answer":"B","sentence":"Mike switches channels to watch his favorite TV series with a remote control."},{"number":11,"prompt":"We should _____ our differences and deal with the problems together.","options":{"A":"put on","B":"put off","C":"put out","D":"put aside"},"answer":"D","sentence":"We should put aside our differences and deal with the problems together."},{"number":12,"prompt":"The teenage boy received much ______ after he discovered a new planet.","options":{"A":"praise","B":"harmony","C":"lecture","D":"bruise"},"answer":"A","sentence":"The teenage boy received much praise after he discovered a new planet."},{"number":13,"prompt":"Jessica doesn’t have any hobby _____ you can call sleeping a hobby.","options":{"A":"unless","B":"if","C":"so","D":"but"},"answer":"A","sentence":"Jessica doesn’t have any hobby unless you can call sleeping a hobby."},{"number":14,"prompt":"Before I checked out, I ______ the hotel room to see if there was anything left.","options":{"A":"collapsed","B":"glimpsed","C":"polished","D":"detected"},"answer":"B","sentence":"Before I checked out, I glimpsed the hotel room to see if there was anything left."},{"number":15,"prompt":"Children should be thankful that their parents always _____ their health and diet and take care of them very well.","options":{"A":"look for","B":"look forward to","C":"look up","D":"look after"},"answer":"D","sentence":"Children should be thankful that their parents always look after their health and diet and take care of them very well."},{"number":16,"prompt":"The toxic waste shouldn’t be _____ into the sea. It should be properly recycled.","options":{"A":"claimed","B":"dumped","C":"insisted","D":"amused"},"answer":"D","sentence":"The toxic waste shouldn’t be amused into the sea. It should be properly recycled."},{"number":17,"prompt":"After hearing the joke, the girl can’t stop _____.","options":{"A":"praising","B":"amusing","C":"folding","D":"giggling"},"answer":"D","sentence":"After hearing the joke, the girl can’t stop giggling."},{"number":18,"prompt":"Anne dreaded giving a speech before three hundred people; even thinking about it made her .","options":{"A":"passionate","B":"anxious","C":"ambitious","D":"optimistic"},"answer":"B","sentence":"Anne dreaded giving a speech before three hundred people; even thinking about it made her anxious ."},{"number":19,"prompt":"As the speaker spoke, her eyes _____ over her son, trying to find out his secrets.","options":{"A":"switched","B":"dumped","C":"folded","D":"swept"},"answer":"D","sentence":"As the speaker spoke, her eyes swept over her son, trying to find out his secrets."},{"number":20,"prompt":"The flight will be arriving at the terminal. _____, the captain asks passengers to remain seated.","options":{"A":"Anxiously","B":"Fortunately","C":"Meanwhile","D":"Instead"},"answer":"C","sentence":"The flight will be arriving at the terminal. Meanwhile, the captain asks passengers to remain seated."},{"number":21,"prompt":"You looked______ gorgeous in that dress. Most men just couldn't take their eyes off you.","options":{"A":"frequently","B":"absolutely","C":"logically","D":"consistently"},"answer":"B","sentence":"You lookedabsolutely gorgeous in that dress. Most men just couldn't take their eyes off you."},{"number":22,"prompt":"Being the only boy of the team, Ted feels nervous around members of the _____ sex.","options":{"A":"single","B":"opposite","C":"ambitious","D":"absolute"},"answer":"B","sentence":"Being the only boy of the team, Ted feels nervous around members of the opposite sex."},{"number":23,"prompt":"There was thunderous applause after the _____ came down at the end of the play.","options":{"A":"ambition","B":"switch","C":"curtain","D":"channel"},"answer":"C","sentence":"There was thunderous applause after the curtain came down at the end of the play."},{"number":24,"prompt":"“I will definitely win the game.” Candice said with _____ confidence.","options":{"A":"absolute","B":"anxious","C":"domestic","D":"single"},"answer":"A","sentence":"“I will definitely win the game.” Candice said with absolute confidence."},{"number":25,"prompt":"When I feel worried about my health, I always share my _____ with my doctor.","options":{"A":"anxiety","B":"channel","C":"basis","D":"giggle"},"answer":"A","sentence":"When I feel worried about my health, I always share my anxiety with my doctor."},{"number":26,"prompt":"Some people are _____ about the invention of A.I. because they will probably lose their jobs because of it.","options":{"A":"ambitious","B":"nervous","C":"amused","D":"devoted"},"answer":"B","sentence":"Some people are nervous about the invention of A.I. because they will probably lose their jobs because of it."},{"number":27,"prompt":"Those prisoners are threatening the management to _____ the prison in the riot(暴動).","options":{"A":"take off","B":"take down","C":"take over","D":"take up"},"answer":"C","sentence":"Those prisoners are threatening the management to take over the prison in the riot(暴動)."},{"number":28,"prompt":"The handsome actor is 45 years old and remains _____, but rumor has it that he is secretly dating a young actress.","options":{"A":"single","B":"nervous","C":"domestic","D":"absolute"},"answer":"A","sentence":"The handsome actor is 45 years old and remains single, but rumor has it that he is secretly dating a young actress."},{"number":29,"prompt":"The manager has been working _____ the project for months. He puts so much effort in it.","options":{"A":"on","B":"out","C":"up","D":"into"},"answer":"A","sentence":"The manager has been working on the project for months. He puts so much effort in it."},{"number":30,"prompt":"When Sam decided to buy the house, his dad said that he could _____ him out with a loan.","options":{"A":"watch","B":"help","C":"turn","D":"carry"},"answer":"B","sentence":"When Sam decided to buy the house, his dad said that he could help him out with a loan."},{"number":31,"prompt":"Although Johnson _____ that he had studied for months, he still can’t get a good grade.","options":{"A":"switched","B":"folded","C":"devoted","D":"claimed"},"answer":"D","sentence":"Although Johnson claimed that he had studied for months, he still can’t get a good grade."},{"number":32,"prompt":"The reporter ______ that he did not make up the news about food safety.","options":{"A":"fetched","B":"glimpsed","C":"praised","D":"claimed"},"answer":"D","sentence":"The reporter claimed that he did not make up the news about food safety."},{"number":33,"prompt":"The thief ______ changed his clothes and blended into the crowd.","options":{"A":"relatively","B":"tenderly","C":"nervously","D":"definitely"},"answer":"C","sentence":"The thief nervously changed his clothes and blended into the crowd."},{"number":34,"prompt":"You can travel from Taipei to Kaohsiung in one hour by taking a(n) _____ flight.","options":{"A":"devoted","B":"anxious","C":"domestic","D":"absolute"},"answer":"C","sentence":"You can travel from Taipei to Kaohsiung in one hour by taking a(n) domestic flight."},{"number":35,"prompt":"Since the art museum will be closed in 30 minutes, we only have a quick _____ of the famous painting.","options":{"A":"amusement","B":"basis","C":"anxiety","D":"glimpse"},"answer":"D","sentence":"Since the art museum will be closed in 30 minutes, we only have a quick glimpse of the famous painting."},{"number":36,"prompt":"It is warm that someone _____ you and prepares a feast for you.","options":{"A":"dumps","B":"giggles","C":"fetches","D":"awaits"},"answer":"D","sentence":"It is warm that someone awaits you and prepares a feast for you."},{"number":37,"prompt":"In Taiwan, some cable TV companies have up to 70 or 80 .","options":{"A":"channels","B":"events","C":"items","D":"patterns"},"answer":"A","sentence":"In Taiwan, some cable TV companies have up to 70 or 80 channels ."},{"number":38,"prompt":"The boy’s brave behavior to save the drowning man deserves _____ from the public.","options":{"A":"ambition","B":"praise","C":"amusement","D":"glimpse"},"answer":"B","sentence":"The boy’s brave behavior to save the drowning man deserves praise from the public."},{"number":39,"prompt":"Chris decided to ______ the TV game show since the prize money was so tempting.","options":{"A":"take part in","B":"get out of","C":"come up with","D":"take the place of"},"answer":"A","sentence":"Chris decided to take part in the TV game show since the prize money was so tempting."},{"number":40,"prompt":"The boy _____ the map up and put it into his backpack.","options":{"A":"switched","B":"devoted","C":"folded","D":"dominated"},"answer":"C","sentence":"The boy folded the map up and put it into his backpack."},{"number":41,"prompt":"Morty can often _____ the conversation by talking about things he is familiar with.","options":{"A":"dominate","B":"amuse","C":"insist","D":"devote"},"answer":"A","sentence":"Morty can often dominate the conversation by talking about things he is familiar with."},{"number":42,"prompt":"If you fly from Taipei to Tokyo, you’ll be taking an international, rather than a _____ flight.","options":{"A":"liberal","B":"domestic","C":"connected","D":"universal"},"answer":"B","sentence":"If you fly from Taipei to Tokyo, you’ll be taking an international, rather than a domestic flight."},{"number":43,"prompt":"On the ______ of certain scientific facts, we can conclude that there is a close connection between obesity and diabetes.","options":{"A":"curtain","B":"anxiety","C":"switch","D":"basis"},"answer":"D","sentence":"On the basis of certain scientific facts, we can conclude that there is a close connection between obesity and diabetes."},{"number":44,"prompt":"The little girl found the whole story _____. She can’t help but keep smiling.","options":{"A":"ambitious","B":"domestic","C":"single","D":"amusing"},"answer":"D","sentence":"The little girl found the whole story amusing. She can’t help but keep smiling."},{"number":45,"prompt":"The old man forgot his coat in the restaurant, so he went back to _____ it.","options":{"A":"fetch","B":"insist","C":"await","D":"giggle"},"answer":"A","sentence":"The old man forgot his coat in the restaurant, so he went back to fetch it."},{"number":46,"prompt":"The new engineer will ______ the unfinished project of his predecessor.","options":{"A":"run through","B":"turn out","C":"make up","D":"take over"},"answer":"D","sentence":"The new engineer will take over the unfinished project of his predecessor."}]};const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let flat=[],index=0,wrong=new Map(),attempted=new Set(),firstTry=new Set(),recognition=null;
function flatten(){if(QUIZ.kind==='mcq')return QUIZ.data.map(x=>({...x,id:String(x.number)}));if(QUIZ.kind==='translation')return QUIZ.data.map(x=>({...x,id:String(x.number)}));return QUIZ.data.flatMap(set=>set.answers.map((answer,i)=>({id:`${set.set}-${i+1}`,set:set.set,passage:set.passage,options:set.options,answer,blank:i+1,sentence:set.sentences[i],structure:set.structure})))}
function fillPassage(text,answers,options){let out=text;answers.forEach((a,i)=>{const word=options[a];const n=i+1;const pats=[new RegExp(`__\\(?${n}\\)?__`),new RegExp(`__${n}__`),new RegExp(`　${n}　`),new RegExp(`\\(${n}\\)`)];for(const p of pats){if(p.test(out)){out=out.replace(p,word);break}}});return out.replace(/\n+/g,' ').replace(/\s+/g,' ').trim()}
function markBlank(text,n){const tag=`<span class="blank-now">Blank ${n}</span>`;let out=esc(text),done=false;for(const p of [new RegExp(`__\\(?${n}\\)?__`),new RegExp(`__${n}__`),new RegExp(`　${n}　`),new RegExp(`\\(${n}\\)`)]){if(!done&&p.test(out)){out=out.replace(p,tag);done=true}}return out}
function norm(s){return String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ')}function speak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}
function show(){try{recognition?.abort()}catch(e){}speechSynthesis?.cancel();const q=flat[index];$('#meta').textContent=`第 ${index+1} / ${flat.length} 題`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=((index+1)/flat.length*100)+'%';$('#feedback').className='feedback hidden';$('#reference').classList.add('hidden');$('#voiceBox').classList.add('hidden');$('#next').classList.add('hidden');$('#check').classList.toggle('hidden',QUIZ.kind!=='translation');$('#answerArea').innerHTML='';if(QUIZ.kind==='mcq')renderChoice(q.prompt,q.options);else if(QUIZ.kind==='translation')renderTranslation(q);else{$('#question').innerHTML=`<div class="passage">${markBlank(q.passage,q.blank)}</div>`;renderChoice(`第 ${q.blank} 格`,q.options)}}
function renderChoice(prompt,options){$('#question').innerHTML=QUIZ.kind==='mcq'?`<div class="prompt">${esc(prompt)}</div>`:$('#question').innerHTML;$('#answerArea').innerHTML='<div class="options">'+Object.entries(options).map(([k,v])=>`<button class="option" data-key="${k}"><b>${k}.</b> ${esc(v)}</button>`).join('')+'</div>';document.querySelectorAll('.option').forEach(b=>b.onclick=()=>checkChoice(b.dataset.key,b))}
function renderTranslation(q){let i=0;const rendered=esc(q.prompt).replace(/_{3,}/g,()=>`<input class="inline-input" data-i="${i++}" aria-label="第 ${i} 格答案">`);$('#question').innerHTML=`<div class="translation">${rendered}</div>`;setTimeout(()=>document.querySelector('.inline-input')?.focus(),0)}
function recordWrong(q,value){if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(value);$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
function checkChoice(key,button){const q=flat[index];attempted.add(q.id);if(key!==q.answer){recordWrong(q,key);button.classList.add('wrong');$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 不正確，請再試一次。';return}if(!wrong.has(q.id))firstTry.add(q.id);document.querySelectorAll('.option').forEach(b=>b.disabled=true);button.classList.add('correct');pass(q)}
function checkTranslation(){const q=flat[index],values=[...document.querySelectorAll('.inline-input')].map(x=>x.value);attempted.add(q.id);const ok=values.length===q.answers.length&&values.every((v,i)=>norm(v)===norm(q.answers[i]));if(!ok){recordWrong(q,values.join(' / '));$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 尚有空格不正確，請修正後再檢查。';return}if(!wrong.has(q.id))firstTry.add(q.id);document.querySelectorAll('.inline-input').forEach(x=>x.disabled=true);pass(q)}
function pass(q){$('#feedback').className='feedback ok';$('#feedback').textContent='✅ 正確！';$('#reference').classList.remove('hidden');$('#reference').textContent='完整句：'+q.sentence;$('#check').classList.add('hidden');$('#next').classList.remove('hidden');$('#voiceBox').classList.remove('hidden');$('#voiceTarget').textContent=q.sentence;$('#voiceResult').className='voice-result';$('#voiceResult').textContent='尚未進行朗讀評分。';speak(q.sentence)}
function similarity(a,b){a=norm(a).replace(/[^a-z0-9' ]/g,'').split(' ').filter(Boolean);b=norm(b).replace(/[^a-z0-9' ]/g,'').split(' ').filter(Boolean);const used=new Set;let hit=0;for(const w of a){const j=b.findIndex((x,i)=>x===w&&!used.has(i));if(j>=0){hit++;used.add(j)}}return Math.round(100*hit/Math.max(a.length,b.length,1))}
function startMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('#voiceResult').textContent='此瀏覽器不支援語音辨識，建議使用 Chrome。';return}recognition=new SR;recognition.lang='en-US';recognition.interimResults=false;$('#voiceResult').textContent='正在聆聽，請朗讀完整句子…';recognition.onresult=e=>{const said=e.results[0][0].transcript,target=flat[index].sentence,score=similarity(target,said);$('#voiceResult').className='voice-result '+(score>=80?'good':'retry');$('#voiceResult').textContent=`辨識：${said}\n正確率：${score}%`};recognition.onerror=e=>$('#voiceResult').textContent='語音辨識未完成：'+e.error;recognition.start()}
function finish(){try{recognition?.abort()}catch(e){}speechSynthesis?.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');const rows=[...wrong.values()];$('#summary').innerHTML=`<div class="stat">實際作答<b>${attempted.size}</b></div><div class="stat">一次答對<b>${firstTry.size}</b></div><div class="stat">曾答錯<b>${rows.length}</b></div>`;$('#wrongList').innerHTML=rows.length?rows.map((r,i)=>`<div class="wrong-card"><b>${i+1}. 第 ${esc(r.q.id)} 題</b><p>${esc(r.q.prompt||`第 ${r.q.blank} 格`)}</p><p>作答：${r.attempts.map(esc).join('；')}</p><p>答案：${esc(r.q.answer||r.q.answers.join(' / '))}</p></div>`).join(''):(attempted.size?'<div class="feedback ok">🎉 本輪全部一次答對！</div>':'<p class="muted">本輪尚未作答，因此不登錄成績。</p>');$('#download').classList.toggle('hidden',!rows.length);if(attempted.size)document.dispatchEvent(new CustomEvent('quiz-result-ready',{detail:{total:attempted.size,correct:firstTry.size,wrong:rows.length,mistakeQuestionNumbers:rows.map(r=>r.q.id).join(', ')}}))}
$('#check').onclick=checkTranslation;$('#next').onclick=()=>{if(++index>=flat.length)finish();else show()};$('#finish').onclick=finish;$('#restart').onclick=()=>location.reload();$('#speak').onclick=()=>speak(flat[index].sentence);$('#mic').onclick=startMic;$('#download').onclick=async()=>{const rows=[...wrong.values()];if(!rows.length)return;try{if(!window.docx)await new Promise((ok,fail)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js';s.onload=ok;s.onerror=fail;document.head.append(s)});const{Document,Packer,Paragraph,HeadingLevel}=window.docx,children=[new Paragraph({text:`三民普高 ${QUIZ.unit} ${QUIZ.title} 錯題紀錄`,heading:HeadingLevel.TITLE})];rows.forEach(r=>children.push(new Paragraph({text:`第 ${r.q.id} 題`,heading:HeadingLevel.HEADING_2}),new Paragraph(r.q.prompt||r.q.passage||''),new Paragraph('作答：'+r.attempts.join('；')),new Paragraph('答案：'+(r.q.answer||r.q.answers.join(' / ')))));const blob=await Packer.toBlob(new Document({sections:[{children}]})),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Sanmin_${QUIZ.unit}_${QUIZ.kind}_錯題.docx`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){alert('目前無法產生 DOCX，請稍後再試。')}};flat=flatten();show();
</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
