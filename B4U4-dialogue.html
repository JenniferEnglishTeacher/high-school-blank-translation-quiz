const $=s=>document.querySelector(s),state={selected:[],i:0,wrong:new Map(),attempted:new Set(),correct:new Set()};

function spoken(q){return q.full.replace(/^[^:]+:\s*/,'').replace(/^\(|\)$/g,'').trim()}
function speak(q){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(spoken(q));u.lang='en-US';u.rate=.88;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>/^en-US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang))||null;speechSynthesis.speak(u)}

function check(){const q=state.selected[state.i],defs=q.s.filter(x=>x.type==='blank'),fields=[...enText.querySelectorAll('input,select')];if(fields.some(f=>!f.value.trim())){alert('請完成所有空格後再檢查。');return}state.attempted.add(q.id);let all=true;const wrong=[];fields.forEach((f,i)=>{const span=f.closest('.blank'),d=defs[i],value=f.value;span.classList.remove('correct','wrong');span.querySelector('.answer')?.remove();if(d.accept.some(a=>norm(a)===norm(value))){span.classList.add('correct');f.disabled=true}else{all=false;wrong.push(`空格 ${i+1}: ${value}`);span.classList.add('wrong');const a=document.createElement('span');a.className='answer';a.textContent=`正確：${d.answer}`;span.append(a);f.value='';f.disabled=false}});if(!all){if(!state.wrong.has(q.id))state.wrong.set(q.id,{q,attempts:[]});state.wrong.get(q.id).attempts.push(wrong.join('； '));wrongCount.textContent=`曾答錯 ${state.wrong.size} 題`;feedback.className='feedback bad';feedback.textContent='❌ 有空格錯誤。請依紅色提示重填，再按一次「檢查答案」。';enText.querySelector('input:not(:disabled),select:not(:disabled)')?.focus();return}state.correct.add(q.id);feedback.className='feedback ok';feedback.textContent='✅ 全部正確！已自動朗讀完整英文。';voiceSentence.textContent=q.full;voiceBox.classList.remove('hidden');checkBtn.classList.add('hidden');nextBtn.classList.remove('hidden');speak(q)}
