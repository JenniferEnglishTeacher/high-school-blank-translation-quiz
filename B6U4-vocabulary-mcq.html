const TITLE="翰林 Book 6 Unit 4 字彙選擇",KIND="mcq",Q=[{"id": 1, "stem": "(   ) During class, students should ______ their hands before speaking.", "options": ["count", "put", "raise", "help"], "answer": 2, "explanation": "在課堂中，學生們需要在說話前「舉」手。", "full": "During class, students should raise their hands before speaking.", "src": 1}, {"id": 2, "stem": "(   ) People should go to the airport to ______ two hours before the flight（航班）.", "options": ["check out", "check in", "leave for", "agree with"], "answer": 1, "explanation": "人們應該要在航班前兩小時到機場「報到」。", "full": "People should go to the airport to check in two hours before the flight.", "src": 2}, {"id": 3, "stem": "(   ) Miss Lin is good at ______ students’ problems. Many students like her so much.", "options": ["voting for", "checking in", "dealing with", "putting into"], "answer": 2, "explanation": "林老師擅長「處理」學生們的問題。很多學生們都很喜歡她。", "full": "Miss Lin is good at dealing with students’ problems. Many students like her so much.", "src": 3}, {"id": 4, "stem": "(   ) The animals are ______ differently depending on the place where they live.", "options": ["raised", "harvest", "pray", "blow up"], "answer": 0, "explanation": "從題幹後面「…不同」決定於「居住地方」，再加上「動物」應該與飼養比較相關，故選(Ａ)飼養。選項(Ｂ)豐收，用於農作物較合適。", "full": "The animals are raised differently depending on the place where they live.", "src": 4}, {"id": 5, "stem": "(   ) Before going to the beach, ______ the weather is good enough for swimming.", "options": ["vote for", "agree with", "leave for", "make sure"], "answer": 3, "explanation": "去海灘前，先「確認」天氣足夠適合游泳。", "full": "Before going to the beach, make sure the weather is good enough for swimming.", "src": 5}, {"id": 6, "stem": "(   ) There were several ______ running for the mayor（市長）in the election.", "options": ["services", "candidates", "yards", "awards"], "answer": 1, "explanation": "這次選舉中有幾位「候選人」競選市長。", "full": "There were several candidates running for the mayor in the election.", "src": 6}, {"id": 7, "stem": "(   ) In my family, my dad is the only person that can ______ problems big and small. Without him, how can life keep going on?", "options": ["deal with", "vote for", "check in", "leave for"], "answer": 0, "explanation": "「處理」家裡大、小事。", "full": "In my family, my dad is the only person that can deal with problems big and small. Without him, how can life keep going on?", "src": 7}, {"id": 8, "stem": "(   ) Before cooking, we should know the cooking ______ . Or we could burn the kitchen.", "options": ["stamps", "booths", "steps", "votes"], "answer": 2, "explanation": "在煮飯前，我們應該要先知道煮飯的「步驟」。否則可能會燒掉廚房。", "full": "Before cooking, we should know the cooking steps. Or we could burn the kitchen.", "src": 8}, {"id": 9, "stem": "(   ) My sisters ______ me with my homework because the math questions were too hard for me.", "options": ["asked", "helped", "raised", "learned"], "answer": 1, "explanation": "我的姐姐「幫助」我做功課，因為這些數學問題對我來說太難了。", "full": "My sisters helped me with my homework because the math questions were too hard for me.", "src": 9}, {"id": 10, "stem": "(   ) Jean is only 17 years old. She is not old enough to vote in the ______ .", "options": ["language", "newspaper", "postcard", "election"], "answer": 3, "explanation": "Jean 只有 17 歲。她還不夠大，不能在「選舉」中投票。(Ａ)語言(Ｂ)報紙(Ｃ)明信片。", "full": "Jean is only 17 years old. She is not old enough to vote in the election.", "src": 10}, {"id": 11, "stem": "(   ) Kevin is a smart 4-year-old boy. He knows how to ______ numbers from 1 to 100.", "options": ["count", "turn off", "damage", "raise"], "answer": 0, "explanation": "Kevin 是一個聰明的 4 歲小孩。他知道怎麼從 1「數」到 100。", "full": "Kevin is a smart 4-year-old boy. He knows how to count numbers from 1 to 100.", "src": 11}, {"id": 12, "stem": "(   ) Emily is fifteen. She isn’t old enough to ______ in the election.", "options": ["date", "vote", "park", "count"], "answer": 1, "explanation": "正確答案：vote", "full": "Emily is fifteen. She isn’t old enough to vote in the election.", "src": 12}, {"id": 13, "stem": "(   ) During the time of Covid-19, people are asked to show their ______ to enter the building.", "options": ["ballot", "ID card", "election", "step"], "answer": 1, "explanation": "在新冠肺炎期間，人們將被要求出示「身分證」才能進入大樓。", "full": "During the time of Covid-19, people are asked to show their ID card to enter the building.", "src": 13}, {"id": 14, "stem": "(   ) Mom always ______ the items on the list after shopping. She doesn’t want to lose anything.", "options": ["votes", "rules", "raises", "checks"], "answer": 3, "explanation": "媽媽購物後總是「檢查」清單上的物品。她不想錯失任何東西。", "full": "Mom always checks the items on the list after shopping. She doesn’t want to lose anything.", "src": 14}, {"id": 15, "stem": "(   ) There is going to be a(n) ______ for our city. Who will be our new leader?", "options": ["idea", "election", "ID card", "step"], "answer": 1, "explanation": "我們的城市即將有一場「選舉」。誰會是我們的新領導者？", "full": "There is going to be a(n) election for our city. Who will be our new leader?", "src": 15}, {"id": 16, "stem": "(   ) Pay ______ to the teacher, or you won’t understand how to do the report.", "options": ["attention", "pleasure", "power", "experience"], "answer": 0, "explanation": "注意：pay attention to。", "full": "Pay attention to the teacher, or you won’t understand how to do the report.", "src": 16}, {"id": 17, "stem": "(   ) The first ______ in making a sandwich is to choose your bread. Then put the fillings between your bread.", "options": ["stamp", "slide", "step", "pleasure"], "answer": 2, "explanation": "做三明治的第一個「步驟」就是選擇麵包。接著將餡料放入麵包中。", "full": "The first step in making a sandwich is to choose your bread. Then put the fillings between your bread.", "src": 17}, {"id": 18, "stem": "(   ) When we ______ , the hotel asked for our ID card.", "options": ["checked in", "left for", "got to", "took on"], "answer": 0, "explanation": "當我們「報到」時，飯店櫃臺要求我們出示身分證。", "full": "When we checked in, the hotel asked for our ID card.", "src": 18}, {"id": 19, "stem": "(   ) There are 5 ______ for this election. They are two men and three women.", "options": ["candidates", "items", "baskets", "rules"], "answer": 0, "explanation": "這次的選舉有 5 位「候選人」。兩位男士以及三位女士。", "full": "There are 5 candidates for this election. They are two men and three women.", "src": 19}, {"id": 20, "stem": "(   ) During the summer vacation, I plan to ______ the Forest Park for a week.", "options": ["turn off", "put into", "leave for", "deal with"], "answer": 2, "explanation": "在暑假期間，我計畫「前往」森林公園一週。", "full": "During the summer vacation, I plan to leave for the Forest Park for a week.", "src": 20}, {"id": 21, "stem": "(   ) James: Hi, I’m here for Jay’s Talk Show. Where should I go? Chloe: Hello, sir. Please ______ here, and then go to Room 312.", "options": ["stay up", "check in", "grow up", "cheer up"], "answer": 1, "explanation": "正確答案：check in", "full": "James: Hi, I’m here for Jay’s Talk Show. Where should I go? Chloe: Hello, sir. Please check in here, and then go to Room 312.", "src": 21}, {"id": 22, "stem": "(   ) They’ve been good friends since they are young. Even though now they are in different ______ . They are still good friends.", "options": ["stamps", "votes", "countries", "ballots"], "answer": 2, "explanation": "他們從年輕到現在都是好友。即使現在在不同「國家」。他們還是好友。", "full": "They’ve been good friends since they are young. Even though now they are in different countries. They are still good friends.", "src": 22}, {"id": 23, "stem": "(   ) Leo is 17 years old now. He is too young to ______ in the election.", "options": ["knowledge", "hand", "agree", "vote"], "answer": 3, "explanation": "Leo 現在 17 歲。他太年輕無法在這場選舉中「投票」。", "full": "Leo is 17 years old now. He is too young to vote in the election.", "src": 23}, {"id": 24, "stem": "(   ) Please make your choice with the voting ______ in the booth and put the ballot into the box.", "options": ["stamp", "accident", "safety", "design"], "answer": 0, "explanation": "請憑投票所內的投票「印章」做出選擇，並將選票投入箱內。", "full": "Please make your choice with the voting stamp in the booth and put the ballot into the box.", "src": 24}, {"id": 25, "stem": "(   ) There will be an ______ next week. Thousands of people are going to vote.", "options": ["election", "step", "ballot", "hand"], "answer": 0, "explanation": "下週將舉行「選舉」。幾千名民眾將參與投票。", "full": "There will be an election next week. Thousands of people are going to vote.", "src": 25}, {"id": 26, "stem": "(   ) In an ______ , candidates share their ideas.", "options": ["stamp", "election", "step", "ID card"], "answer": 1, "explanation": "在「選舉」中，候選人們分享他們的想法。", "full": "In an election, candidates share their ideas.", "src": 27}, {"id": 27, "stem": "(   ) The mailman asked Mr. Wang to show his ______ to get the letter.", "options": ["step", "ID card", "ballot", "vote"], "answer": 1, "explanation": "郵差要求王先生出示「身分證」來領取信件。", "full": "The mailman asked Mr. Wang to show his ID card to get the letter.", "src": 28}, {"id": 28, "stem": "(   ) The girl was short, so she jumped up and ______ her hand to try to get her favorite singer’s attention.", "options": ["felt", "held", "raised", "touched"], "answer": 2, "explanation": "正確答案：raised", "full": "The girl was short, so she jumped up and raised her hand to try to get her favorite singer’s attention.", "src": 29}, {"id": 29, "stem": "(   ) At meetings or in class, ______ your hands if you’d like to share your opinions（意見）. Let others know you’d like to say something before you do so.", "options": ["raise", "shape", "walk", "offer"], "answer": 0, "explanation": "在會議中或課堂上，如果想要分享你的意見請「舉手」。在你說話之前，讓其他人知道你想要說話。", "full": "At meetings or in class, raise your hands if you’d like to share your opinions. Let others know you’d like to say something before you do so.", "src": 30}, {"id": 30, "stem": "(   ) Miss Lin asked who could help her move the box. But no one raised their ______ to do the job.", "options": ["thousand", "hand", "step", "place"], "answer": 1, "explanation": "no one raised their hand to do the job. 沒人舉「手」幫忙。", "full": "Miss Lin asked who could help her move the box. But no one raised their hand to do the job.", "src": 31}, {"id": 31, "stem": "(   ) I need to study in a quiet ______ . Maybe I’ll go to the library.", "options": ["way", "place", "face", "step"], "answer": 1, "explanation": "我需要在一個安靜的「地方」讀書。也許我會去圖書館。", "full": "I need to study in a quiet place. Maybe I’ll go to the library.", "src": 32}, {"id": 32, "stem": "(   ) The boy ______ his plate to show his mother that he finished all the food. His mother worried that it might drop and wanted him to put it down.", "options": ["voted", "pleased", "helped", "raised"], "answer": 3, "explanation": "男孩「舉起」他的盤子讓媽媽看他吃完了所有的食物。媽媽擔心盤子可能會掉落，要他把盤子放下來。", "full": "The boy raised his plate to show his mother that he finished all the food. His mother worried that it might drop and wanted him to put it down.", "src": 33}, {"id": 33, "stem": "(   ) Students learn how to vote in a school election. Each student is given a(n) ______ to vote for their candidates.", "options": ["check", "attention", "ballot", "choice"], "answer": 2, "explanation": "學生們在校園選舉中學習如何投票。他們每位都會拿到一張「選票」投給候選人。", "full": "Students learn how to vote in a school election. Each student is given a(n) ballot to vote for their candidates.", "src": 35}, {"id": 34, "stem": "(   ) Peter will ______ Tokyo this afternoon because he has an important meeting tomorrow.", "options": ["leave for", "leave to", "check in", "deal with"], "answer": 0, "explanation": "Peter 今天下午將會「前往」東京，因為他明天有一場重要的會議。", "full": "Peter will leave for Tokyo this afternoon because he has an important meeting tomorrow.", "src": 36}, {"id": 35, "stem": "(   ) I believe that he didn’t join us for the ______ reasons. He was too busy and tired.", "options": ["ballot", "step", "candidate", "following"], "answer": 3, "explanation": "我想信他沒有加入我們有「以下的」原因。他之前太忙也太累了。", "full": "I believe that he didn’t join us for the following reasons. He was too busy and tired.", "src": 37}, {"id": 36, "stem": "(   ) There are five ______ in the mayor（市長）election.", "options": ["relatives", "strings", "candidates", "visitors"], "answer": 2, "explanation": "市長選舉中有五位「候選人」。(Ａ)親戚(Ｂ)線(Ｄ)訪客。", "full": "There are five candidates in the mayor election.", "src": 38}, {"id": 37, "stem": "(   ) To keep my feet from hurting, I was asked to ______ them a little higher than my knees a few times a day.", "options": ["leave", "vote", "rise", "raise"], "answer": 3, "explanation": "被要求把雙腳「抬高」比膝蓋高一點。", "full": "To keep my feet from hurting, I was asked to raise them a little higher than my knees a few times a day.", "src": 39}];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=s=>String(s??'').trim().toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:()“”"]/g,'').replace(/\s+/g,' ');
let chosen=[],idx=0;const wrong=new Map(),attempted=new Set(),correct=new Set();
function preview(q){return KIND==='mcq'?q.stem:q.prompt}
function renderList(){$('#list').innerHTML=Q.map(q=>`<label class="pick"><input class="pickbox" type="checkbox" value="${q.id}" checked><span><b>第 ${q.id} 題</b><small>${esc(preview(q))}</small></span></label>`).join('')}
function setAll(v){document.querySelectorAll('.pickbox').forEach(x=>x.checked=v)}
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
$('#all').onclick=()=>setAll(true);$('#none').onclick=()=>setAll(false);$('#random').onclick=()=>{setAll(false);const ids=new Set(shuffled(Q).slice(0,20).map(q=>q.id));document.querySelectorAll('.pickbox').forEach(x=>x.checked=ids.has(+x.value))};
$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));idx=0;wrong.clear();attempted.clear();correct.clear();$('#select').classList.add('hidden');$('#result').classList.add('hidden');$('#quiz').classList.remove('hidden');show()};
function show(){if(window.speechSynthesis)speechSynthesis.cancel();const q=chosen[idx];$('#meta').textContent=`第 ${idx+1} / ${chosen.length} 題｜原題 ${q.id}`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=`${idx/chosen.length*100}%`;$('#stem').textContent=KIND==='mcq'?q.stem:q.prompt;const pic=$('#picture');if(q.image){pic.src=q.image;pic.classList.remove('hidden')}else{pic.classList.add('hidden');pic.removeAttribute('src')};if(KIND==='mcq'){$('#area').className='options';$('#area').innerHTML=q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b><span>${esc(o)}</span></label>`).join('')}else{$('#area').className='answer-grid';$('#area').innerHTML=q.answers.map((a,i)=>`<div class="answer-row"><label>空格 ${i+1}</label><input class="answer-input" data-i="${i}" autocomplete="off" spellcheck="false" placeholder="請輸入答案"></div>`).join('')};$('#feedback').className='feedback hidden';$('#voicebox').classList.add('hidden');$('#check').classList.remove('hidden');$('#next').classList.add('hidden')}
function remember(q,value){if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(value);$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
function spoken(q){return q.full||((KIND==='mcq')?q.stem.replace(/^\(\s*\)\s*/,'').replace(/_{3,}/,q.options[q.answer]):q.answers.map(a=>a.accepted[0]).join(' '))}
function speak(){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(spoken(chosen[idx]));u.lang='en-US';u.rate=.88;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/^en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;speechSynthesis.speak(u)}
function success(q){correct.add(q.id);$('#bar').style.width=`${(idx+1)/chosen.length*100}%`;$('#feedback').className='feedback ok';$('#feedback').innerHTML='✅ 全部正確！<br>'+esc(q.explanation||'');$('#target').textContent=spoken(q);$('#voicebox').classList.remove('hidden');$('#check').classList.add('hidden');$('#next').classList.remove('hidden');speak()}
$('#check').onclick=()=>{const q=chosen[idx];attempted.add(q.id);if(KIND==='mcq'){const sel=document.querySelector('input[name=answer]:checked');if(!sel)return alert('請先選擇答案。');const n=+sel.value;if(n===q.answer)return success(q);remember(q,String.fromCharCode(65+n)+'. '+q.options[n]);$('#feedback').className='feedback bad';$('#feedback').innerHTML=`❌ 答錯了。正確答案：<strong>${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</strong><br>${esc(q.explanation||'')}<br>請重新選擇正確答案。`;return}const ins=[...document.querySelectorAll('.answer-input')];if(ins.some(x=>!x.value.trim()))return alert('請完成所有答案。');const bad=[];ins.forEach((input,i)=>{const a=q.answers[i];input.classList.remove('ok','bad');if(a.accepted.some(x=>norm(x)===norm(input.value))){input.classList.add('ok');input.disabled=true}else{input.classList.add('bad');bad.push(`${i+1}. ${input.value} → ${a.display}`);input.value=''}});if(!bad.length)return success(q);remember(q,bad.join('；'));$('#feedback').className='feedback bad';$('#feedback').innerHTML=`❌ 有 ${bad.length} 格不正確。<br>正確答案：${q.answers.map((a,i)=>`${i+1}. <strong>${esc(a.display)}</strong>`).join('；')}<br>${esc(q.explanation||'')}<br>請依提示重新填寫。`;ins.find(x=>!x.disabled)?.focus()};
$('#speak').onclick=speak;$('#next').onclick=()=>{idx++;idx>=chosen.length?finish():show()};$('#finish').onclick=finish;
function answerText(q){return KIND==='mcq'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.answerRaw}
function finish(){if(window.speechSynthesis)speechSynthesis.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');$('#summary').innerHTML=`<div class="stat">選擇題數<b>${chosen.length}</b></div><div class="stat">已作答<b>${attempted.size}</b></div><div class="stat">完成答對<b>${correct.size}</b></div><div class="stat">曾答錯<b>${wrong.size}</b></div>`;$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>`<div class="wrong"><b>${i+1}. 原題 ${r.q.id}｜${esc(preview(r.q))}</b><p>錯誤紀錄：${r.attempts.map(esc).join('<br>')}</p><p><strong>正確答案：</strong>${esc(answerText(r.q))}</p><p>${esc(r.q.explanation||'')}</p></div>`).join(''):'<div class="feedback ok">🎉 沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size)}
$('#restart').onclick=()=>location.reload();$('#download').onclick=async()=>{if(!wrong.size)return;const rows=[...wrong.values()],stamp=new Date().toISOString().slice(0,10),name=TITLE.replace(/\s+/g,'_')+'_錯題_'+stamp;const save=(blob,ext)=>{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name+ext;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};try{const{Document,Packer,Paragraph,TextRun,HeadingLevel}=await import('https://esm.sh/docx@9.5.1');const children=[new Paragraph({heading:HeadingLevel.TITLE,children:[new TextRun({text:TITLE+' 錯題紀錄',bold:true})]})];rows.forEach((r,i)=>{children.push(new Paragraph({heading:HeadingLevel.HEADING_2,children:[new TextRun({text:`${i+1}. 原題 ${r.q.id}`,bold:true})]}),new Paragraph({text:preview(r.q)}),new Paragraph({children:[new TextRun({text:'錯誤紀錄：',bold:true}),new TextRun({text:r.attempts.join(' | ')})]}),new Paragraph({children:[new TextRun({text:'正確答案：',bold:true}),new TextRun({text:answerText(r.q)})]}),new Paragraph({children:[new TextRun({text:'解析：',bold:true}),new TextRun({text:r.q.explanation||''})]}))});save(await Packer.toBlob(new Document({sections:[{children}]})),'.docx')}catch(e){save(new Blob([TITLE+' 錯題紀錄\n\n'+rows.map(r=>preview(r.q)+'\n正確答案：'+answerText(r.q)+'\n').join('\n')],{type:'text/plain;charset=utf-8'}),'.txt')}};
renderList();
</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
