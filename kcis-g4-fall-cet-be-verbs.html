function norm(s){return String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+([,.!?;:])/g,'$1').replace(/[.?!]$/,'').replace(/\s+/g,' ')}function renderGroups(){const total=DATA.groups.reduce((n,g)=>n+g.items.length,0);$('#groups').innerHTML=`<button class="group-btn" data-all="1"><b>全部文法綜合</b><span>${total} 題｜15 個小節</span></button>`+DATA.groups.map(g=>`<button class="group-btn" data-slug="${g.slug}"><b>${esc(g.title)}</b><span>${esc(g.zh)}｜${g.items.length} 題</span></button>`).join('');document.querySelectorAll('.group-btn').forEach(b=>b.onclick=()=>b.dataset.all?start(DATA.groups.flatMap(g=>g.items.map(x=>({...x,groupTitle:g.title}))),{slug:'all',title:'全部文法綜合'}):startGroup(b.dataset.slug))}function startGroup(slug){const g=DATA.groups.find(x=>x.slug===slug);if(g)start(g.items.map(x=>({...x,groupTitle:g.title})),g)}function start(chosen,g){items=chosen;current=g;index=0;wrong=new Map();attempted=new Set();firstTry=new Set();$('#select').classList.add('hidden');$('#result').classList.add('hidden');$('#quiz').classList.remove('hidden');show()}

function finish(){try{recognition?.abort()}catch(e){}speechSynthesis?.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');const records=[...wrong.values()];$('#summary').innerHTML=`<div class="stat">實際作答<b>${attempted.size}</b></div><div class="stat">一次答對<b>${firstTry.size}</b></div><div class="stat">曾答錯<b>${records.length}</b></div>`;$('#wrongList').innerHTML=records.length?records.map((r,i)=>`<div class="wrong-card"><b>${i+1}. ${esc(r.item.id)}</b><p>${esc(r.item.prompt||r.item.context)}</p><p><strong>作答：</strong>${r.attempts.map(esc).join('；')}</p><p><strong>答案：</strong>${esc(r.item.answer)}</p></div>`).join(''):(attempted.size?'<div class="feedback ok">🎉 本輪全部一次答對！</div>':'<p class="muted">本輪尚未作答，因此不登錄成績。</p>');$('#download').classList.toggle('hidden',!records.length);if(attempted.size)document.dispatchEvent(new CustomEvent('quiz-result-ready',{detail:{total:attempted.size,correct:firstTry.size,wrong:records.length,mistakeQuestionNumbers:records.map(r=>r.item.id).join(', ')}}))}$('#back').onclick=()=>location.reload();$('#restart').onclick=()=>start(items,current);$('#download').onclick=async()=>{const records=[...wrong.values()];if(!records.length)return;try{if(!window.docx)await new Promise((ok,fail)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js';s.onload=ok;s.onerror=fail;document.head.append(s)});const{Document,Packer,Paragraph,HeadingLevel}=window.docx,children=[new Paragraph({text:DATA.title+' 錯題紀錄',heading:HeadingLevel.TITLE})];for(const r of records)children.push(new Paragraph({text:r.item.id,heading:HeadingLevel.HEADING_2}),new Paragraph(r.item.prompt||r.item.context),new Paragraph('作答：'+r.attempts.join('；')),new Paragraph('答案：'+r.item.answer));const blob=await Packer.toBlob(new Document({sections:[{children}]})),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='KCIS_G4_Fall_CET_Grammar_錯題.docx';a.click();setTimeout(()=>URL.revo
