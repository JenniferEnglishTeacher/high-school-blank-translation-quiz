<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="龍騰普高 B1R2 引導式翻譯互動練習"><title>龍騰普高 B1R2 引導式翻譯</title><style>:root{--blue:#2563eb;--navy:#1e3a8a;--bg:#f4f7fb;--card:#fff;--line:#dbe3ee;--ink:#172033;--muted:#64748b;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--voice:#6d28d9;--voicebg:#f5f3ff;--amber:#9a3412;--amberbg:#fff7ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}.wrap{max-width:920px;margin:auto;padding:16px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 5px 18px #0f172a0d}.hero{background:linear-gradient(135deg,#e8f1ff,#fff)}h1{margin:0 0 6px;font-size:clamp(25px,4vw,38px)}h2{margin-top:0}.note{color:var(--muted)}.hidden{display:none!important}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.btn{border:0;border-radius:10px;padding:11px 17px;font:800 16px inherit;cursor:pointer;background:#e5e7eb;color:var(--ink);text-decoration:none}.primary{background:var(--blue);color:#fff}.danger{background:#991b1b;color:#fff}.voice{background:var(--voice);color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.btn:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.pick{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin:7px 0;background:#fafcff}.pick input{margin-right:8px;width:17px;height:17px;accent-color:var(--blue)}#list{max-height:440px;overflow:auto;border:1px solid var(--line);padding:7px;border-radius:12px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:800;margin:8px 0 14px}.zh{padding:10px 13px;background:var(--amberbg);border-radius:9px;color:var(--amber);font-weight:800;margin-bottom:10px}.question{font-size:21px;font-weight:750;padding:16px;background:#f8fafc;border-radius:11px;white-space:pre-wrap}.options{display:grid;gap:9px;margin:14px 0}.option{display:flex;align-items:center;gap:11px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-size:18px;font-weight:750;cursor:pointer}.option:hover{border-color:#60a5fa;background:#eff6ff}.option:has(input:checked){border-color:var(--blue);background:#dbeafe;color:var(--navy)}.option input{width:20px;height:20px;accent-color:var(--blue)}.inputs{display:grid;gap:10px;margin:15px 0}.answer-row{display:grid;grid-template-columns:55px 1fr;gap:10px;align-items:center}.answer-row label{font-weight:900;color:var(--navy);text-align:center}.spell{width:100%;font:inherit;font-size:18px;padding:11px;border:2px solid #94a3b8;border-radius:9px}.feedback{padding:13px;border-radius:10px;font-weight:800;margin:13px 0}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.explain{font-weight:500;margin-top:7px}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:var(--voicebg);margin:13px 0}.voicebox b{display:block;font-size:19px;margin-bottom:8px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}.wrong p{margin:6px 0}.source{font-size:13px;color:var(--muted)}@media(max-width:600px){.wrap{padding:9px}.hero,.card{padding:15px}.question{font-size:18px;padding:13px}.option{font-size:17px}.answer-row{grid-template-columns:42px 1fr}.meta{display:block}}</style><link rel="stylesheet" href="longteng-vocab-required-pronunciation.css?v=20261026-4"></head><body><main class="wrap"><section class="hero"><h1>龍騰普高 B1R2 引導式翻譯</h1><p>共 40 題。可自行選題、隨機抽題；答錯後請重新作答。</p><p class="note">答對後顯示來源解析並播放完整英文句；可選做 STT 朗讀評分（不需錄音也能直接按「下一題」）。完成後可重做錯題並下載 DOCX。</p><div class="toolbar"><a class="btn" href="dashboard.html">← 回測驗總覽</a></div></section><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn">全部選取</button><button id="none" class="btn">全部取消</button><button id="rand20" class="btn">隨機 20 題</button></div><label><input id="shuffle" type="checkbox"> 打亂出題順序</label><div id="list"></div><div class="actions"><button id="start" class="btn primary">開始作答</button><span id="picked" class="note"></span></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="voiceBox" class="voicebox hidden"><b id="voiceTarget"></b><button id="speak" class="btn voice">🔊 再聽一次</button></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="retry" class="btn primary">只重做錯題</button><button id="download" class="btn">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></main><script>const TITLE="龍騰普高 B1R2 引導式翻譯",MODE="multi",Q=[{"id": 1, "zh": "調查顯示在網路店鋪而非實體店面購物的人數已經增加了百分之四十。", "question": "An investigation shows that the number of people ①____________ shop at online stores ②____________ ③____________ physical ones ④____________ gone up ⑤____________ 40%.", "answers": ["who||that", "instead", "of", "has", "by"], "explanation": "the number of + 複數名詞 + 單數動詞；who/that引導關係子句修飾先行詞people。A instead of/rather than B 是A而不是B；by + 百分比 增加或減少百分之……。", "source": "龍騰 B1R2"}, {"id": 2, "zh": "幸虧有他父親的鼓勵，Patrick才能改善他的籃球技巧並進入校隊。", "question": "①____________ ②____________ his father’s encouragement, Patrick improved his basketball skills and became a member of the school team.", "answers": ["Thanks", "to"], "explanation": "", "source": "龍騰 B1R2"}, {"id": 3, "zh": "那國家樹立紀念碑以紀念那些死於戰爭的人。", "question": "The country ①____________ ②____________ a monument in honor of those ③____________ had died in the war.", "answers": ["put", "up", "who"], "explanation": "", "source": "龍騰 B1R2"}, {"id": 4, "zh": "自從Ken接管公司後，事情已有好轉。", "question": "Since Ken took over the company, things have changed ①____________ ②____________ ③____________.", "answers": ["for", "the", "better"], "explanation": "", "source": "龍騰 B1R2"}, {"id": 5, "zh": "如果我們不採取行動保護野生動物，更多動物有一天會絕種的。", "question": "If we don’t ①____________ ②____________ to protect wild animals, more of them will become extinct someday.", "answers": ["take", "action"], "explanation": "", "source": "龍騰 B1R2"}, {"id": 6, "zh": "正是藉著兼了三份差事，Henry才得以支付學費，完成大學學業。", "question": "It was ①____________ taking three part-time jobs ②____________ Henry was able to pay his way through college.", "answers": ["by", "that"], "explanation": "by + V-ing 藉著；It is/was…that…. 強調句句型。", "source": "龍騰 B1R2"}, {"id": 7, "zh": "有個警告標誌設立在河邊，警告民眾不可在河裡游泳或釣魚。", "question": "A warning sign was ①____________ ②____________ by the river to warn people not to swim or fish in it.", "answers": ["put", "up"], "explanation": "put up 設置；設立。", "source": "龍騰 B1R2"}, {"id": 8, "zh": "當絕望的人群從熊熊燃燒的大樓中逃出時，許多摔倒在地上的人被踩過。", "question": "Lots of people who fell to the floor ①____________ ②____________ ③____________ ④____________ when the desperate crowd rushed out from the burning building.", "answers": ["were", "being", "stepped", "on"], "explanation": "was/were being p.p. 過去進行被動式；step on 踩在……上。", "source": "龍騰 B1R2"}, {"id": 9, "zh": "我超想看《瞞天過海2：長驅直入》，這部電影將在這個週末公開上映。", "question": "I am ①____________ ②____________ see the movie Ocean’s Twelve, ③____________ will be released to the public this coming week.", "answers": ["eager", "to", "which"], "explanation": "be eager to + VR 渴望；which引導補述用法的關係代名詞子句。", "source": "龍騰 B1R2"}, {"id": 10, "zh": "藉著增加一點點變化性到你例行的工作，累人的任務可能變得更容易做了。", "question": "①____________ adding a little variety ②____________ your daily routines, a tiresome task may become easier to do.", "answers": ["By", "to"], "explanation": "by + V-ing 藉著；add sth. to sth. 把……加入……。", "source": "龍騰 B1R2"}, {"id": 11, "zh": "沒有什麼特定的舞步。你只要放輕鬆，感受節奏，然後隨著音樂起舞。", "question": "There’s no specific dance ①____________; just relax, feel the rhythm, and dance ②____________ ③____________ ④____________.", "answers": ["move", "to", "the", "music"], "explanation": "dance move 舞步；dance to the music 隨音樂起舞。", "source": "龍騰 B1R2"}, {"id": 12, "zh": "令人失望的是我們的努力竟轉變成全然的失敗。", "question": "It was disappointing that our efforts ①____________ ②____________ ③____________ ④____________ a total failure.", "answers": ["turned", "out", "to", "be"], "explanation": "that引導名詞子句當作主詞補語。turn out to be 結果變成……。", "source": "龍騰 B1R2"}, {"id": 13, "zh": "為了避免對她每天的例行公事感到厭煩，Chloe試著用許多有創意的方式完成她的日常事務。", "question": "To ①____________ getting bored by her daily ②____________, Chloe tries to finish her chores ③____________ many creative ④____________.", "answers": ["avoid", "routines", "in", "ways"], "explanation": "avoid + V-ing 避免；daily routine 每天例行公事；in…way(s) 以……方式。", "source": "龍騰 B1R2"}, {"id": 14, "zh": "為了使他父母歡心，George存了一大筆錢，打算在年底買一棟房子。", "question": "①____________ ②____________ ③____________ ④____________ pleasing his parents, George saved a large amount of money and planned to buy a house at the end of the year.", "answers": ["With", "the", "goal", "of"], "explanation": "with the goal of 以……為目標。", "source": "龍騰 B1R2"}, {"id": 15, "zh": "我們常常想要擺脫一些壞習慣，但是這樣的改變並非總是容易做到。", "question": "We often want to get rid of some bad habits, but ①____________ changes are ②____________ ③____________ easy ④____________ ⑤____________.", "answers": ["such", "not", "always", "to", "make"], "explanation": "such + N 這樣的……；not always 不總是；to make為不定詞片語當作副詞的用法。", "source": "龍騰 B1R2"}, {"id": 16, "zh": "因為停車位難尋，我寧願搭計程車也不要自己開車上班。", "question": "Because it is hard to find a parking space, I will take a taxi to work ①____________ ②____________ drive.", "answers": ["rather", "than"], "explanation": "rather than 而非。", "source": "龍騰 B1R2"}, {"id": 17, "zh": "隨著夏天和雨季的到來，社區的人們務必採取行動預防登革熱的擴散。", "question": "With the coming of summer and the rainy season, people in the community must ①____________ ②____________ to prevent the spread of Dengue Fever.", "answers": ["take", "action"], "explanation": "take action 採取行動。", "source": "龍騰 B1R2"}, {"id": 18, "zh": "很多人期待新政府上臺後，生活會變得更好。", "question": "Many people hope that when the new government takes over, life will change ①____________ ②____________ ③____________.", "answers": ["for", "the", "better"], "explanation": "for the better 好轉；改善。", "source": "龍騰 B1R2"}, {"id": 19, "zh": "我們去Jamie的生日派對好好玩玩吧！", "question": "①____________ go to Jamie’s birthday party and ②____________ ③____________!", "answers": ["Let’s", "have", "fun"], "explanation": "let’s + VR表建議；have fun 好好玩玩；玩得開心。", "source": "龍騰 B1R2"}, {"id": 20, "zh": "幸虧有你的幫忙，我解決了這道數學難題。", "question": "①____________ ②____________ your help, I solved the difficult math question.", "answers": ["Thanks", "to"], "explanation": "thanks to + N 幸虧；由於。", "source": "龍騰 B1R2"}, {"id": 21, "zh": "紅燈告訴行人不可以穿越街道。", "question": "The red light signal tells pedestrians ①____________ ②____________ ③____________ the street.", "answers": ["not", "to", "cross"], "explanation": "否定不定詞not to + VR；cross 穿越。", "source": "龍騰 B1R2"}, {"id": 22, "zh": "為了給他們的孩子們找一間理想學校，這個家庭從一個地方搬到另一個地方。", "question": "①____________ find an ideal school for their children, the family moved from ②____________ place to ③____________.", "answers": ["To", "one", "another"], "explanation": "不定詞to + VR表目的；from one place to another  從一個地方到另一個地方。", "source": "龍騰 B1R2"}, {"id": 23, "zh": "Yolanda只是重複將訊息複製貼上，而不是為每一個朋友打一張新的派對邀請函。", "question": "①____________ ②____________ typing a new party invitation for each friend, Yolanda just copied and pasted the message several times.", "answers": ["Rather", "than"], "explanation": "", "source": "龍騰 B1R2"}, {"id": 24, "zh": "這間茶館有一個標示設置在窗戶上，以告知人們它每個禮拜一休館。", "question": "A sign was ①____________ ②____________ in the window to tell people that the tea shop is closed every Monday.", "answers": ["put", "up"], "explanation": "", "source": "龍騰 B1R2"}, {"id": 25, "zh": "與其單純討論如何對抗全球暖化，我們更需要採取行動並產生一些影響。", "question": "Instead of just talking about fighting global warming, we need to ①____________ ②____________ and make a difference.", "answers": ["take", "action"], "explanation": "", "source": "龍騰 B1R2"}, {"id": 26, "zh": "在他的太太離開他之後，Trevor透過戒酒來改善他的人生。", "question": "After his wife left him, Trevor changed his life ①____________ ②____________ ③____________ by stopping drinking.", "answers": ["for", "the", "better"], "explanation": "", "source": "龍騰 B1R2"}, {"id": 27, "zh": "要是一棟大樓無法符合安全規定就會被掛上「危險建築」的標誌。", "question": "A “dangerous structure” sign will be ①____________ ②____________ if a building fails to meet safety requirements.", "answers": ["put", "up"], "explanation": "", "source": "龍騰 B1R2"}, {"id": 28, "zh": "你為什麼不自己試著去找出答案而不是要求答案？", "question": "①____________ ②____________ asking for answers, why don’t you try to work it out on your own?", "answers": ["Rather", "than"], "explanation": "", "source": "龍騰 B1R2"}, {"id": 29, "zh": "在那麼熱的天裡，我想喝一杯冷飲而不是熱咖啡。", "question": "On such a hot day, I’d like to have a cold drink ①____________ ②____________ hot coffee.", "answers": ["rather/instead", "than/of"], "explanation": "", "source": "龍騰 B1R2"}, {"id": 30, "zh": "你在採取行動前，應該考慮清楚。", "question": "You should think it over before you ①____________ any ②____________.", "answers": ["take", "action"], "explanation": "", "source": "龍騰 B1R2"}, {"id": 31, "zh": "我們必須在情況變更糟前採取行動來處理這個問題。", "question": "We must ①____________ ②____________ to deal with the problem before the situation gets worse.", "answers": ["take", "action"], "explanation": "", "source": "龍騰 B1R2"}, {"id": 32, "zh": "我藉著聽廣播節目來增進英文能力。", "question": "I improve my English ①____________ ②____________ ③____________ the radio.", "answers": ["by", "listening", "to"], "explanation": "", "source": "龍騰 B1R2"}, {"id": 33, "zh": "我最擔心的就是時間不夠，無法把工作完成。", "question": "My biggest worry ①____________ ②____________ we don’t have enough time to complete the job.", "answers": ["is", "that"], "explanation": "", "source": "龍騰 B1R2"}, {"id": 34, "zh": "我現在搭捷運上班，而不是開車。", "question": "①____________ ②____________ driving to work, I take the MRT now.", "answers": ["Rather", "than"], "explanation": "", "source": "龍騰 B1R2"}, {"id": 35, "zh": "由於他專業的幫助，我們讓計畫準時完成。", "question": "①____________ ②____________ his professional help, we got the project finished on time.", "answers": ["Thanks", "to"], "explanation": "", "source": "龍騰 B1R2"}, {"id": 36, "zh": "聖誕節快到了，許多店家都開始設置一些裝飾。", "question": "Christmas is coming. Many shops started to ①____________ ②____________ some decorations.", "answers": ["put", "up"], "explanation": "", "source": "龍騰 B1R2"}, {"id": 37, "zh": "他已經戒菸了，這絕對是一個好的改變。", "question": "He has stopped smoking, which is definitely a change ①____________ ②____________ ③____________.", "answers": ["for", "the", "better"], "explanation": "", "source": "龍騰 B1R2"}, {"id": 38, "zh": "看見一輛車子輾過她的小狗，小女孩站著不動好一會兒，然後放聲大哭。", "question": "Seeing a car run over her puppy, the little girl ①____________ ②____________ for quite a while and then burst out crying.", "answers": ["stood", "still"], "explanation": "stand + adj.修飾主詞the little girl。", "source": "龍騰 B1R2"}, {"id": 39, "zh": "這位小姐跟酒保說：「我們想要一壺冰啤酒。」", "question": "“We ①____________ ②____________ ③____________ ④____________ a jug of cold beer,” the lady said to the bartender.", "answers": ["would", "like", "to", "have"], "explanation": "would like to + VR 想要……", "source": "龍騰 B1R2"}, {"id": 40, "zh": "大量的病患造成許多醫院在醫療服務上有很大的壓力。", "question": "High ①____________ ②____________ patients in many hospitals put a lot of pressure on the health service.", "answers": ["numbers", "of"], "explanation": "", "source": "龍騰 B1R2"}];const $=s=>document.querySelector(s),list=$('#list'),select=$('#select'),quiz=$('#quiz'),result=$('#result'),question=$('#question'),answerArea=$('#answerArea'),feedback=$('#feedback'),next=$('#next');let chosen=[],idx=0,mode='first';const wrong=new Map(),correct=new Set();const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ');const shuffled=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function renderList(){list.innerHTML=Q.map(q=>'<label class="pick"><input class="pickbox" type="checkbox" value="'+q.id+'" checked><b>第 '+q.id+' 題</b> <span class="source">'+esc(q.source||'')+'</span></label>').join('');count()}function count(){$('#picked').textContent='已選 '+document.querySelectorAll('.pickbox:checked').length+' 題'}list.addEventListener('change',count);$('#all').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=true);count()};$('#none').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=false);count()};$('#rand20').onclick=()=>{let ids=new Set(shuffled(Q).slice(0,Math.min(20,Q.length)).map(q=>q.id));document.querySelectorAll('.pickbox').forEach(x=>x.checked=ids.has(+x.value));count()};$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));if($('#shuffle').checked)chosen=shuffled(chosen);idx=0;mode='first';wrong.clear();correct.clear();select.classList.add('hidden');result.classList.add('hidden');quiz.classList.remove('hidden');show()};functi
