<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="龍騰普高 B3U6 整句式翻譯互動練習"><title>龍騰普高 B3U6 整句式翻譯</title><style>:root{--blue:#2563eb;--navy:#1e3a8a;--bg:#f4f7fb;--card:#fff;--line:#dbe3ee;--ink:#172033;--muted:#64748b;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--voice:#6d28d9;--voicebg:#f5f3ff;--amber:#9a3412;--amberbg:#fff7ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}.wrap{max-width:920px;margin:auto;padding:16px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 5px 18px #0f172a0d}.hero{background:linear-gradient(135deg,#e8f1ff,#fff)}h1{margin:0 0 6px;font-size:clamp(25px,4vw,38px)}h2{margin-top:0}.note{color:var(--muted)}.hidden{display:none!important}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.btn{border:0;border-radius:10px;padding:11px 17px;font:800 16px inherit;cursor:pointer;background:#e5e7eb;color:var(--ink);text-decoration:none}.primary{background:var(--blue);color:#fff}.danger{background:#991b1b;color:#fff}.voice{background:var(--voice);color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.btn:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.pick{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin:7px 0;background:#fafcff}.pick input{margin-right:8px;width:17px;height:17px;accent-color:var(--blue)}#list{max-height:440px;overflow:auto;border:1px solid var(--line);padding:7px;border-radius:12px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:800;margin:8px 0 14px}.zh{padding:10px 13px;background:var(--amberbg);border-radius:9px;color:var(--amber);font-weight:800;margin-bottom:10px}.question{font-size:21px;font-weight:750;padding:16px;background:#f8fafc;border-radius:11px;white-space:pre-wrap}.options{display:grid;gap:9px;margin:14px 0}.option{display:flex;align-items:center;gap:11px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-size:18px;font-weight:750;cursor:pointer}.option:hover{border-color:#60a5fa;background:#eff6ff}.option:has(input:checked){border-color:var(--blue);background:#dbeafe;color:var(--navy)}.option input{width:20px;height:20px;accent-color:var(--blue)}.inputs{display:grid;gap:10px;margin:15px 0}.answer-row{display:grid;grid-template-columns:55px 1fr;gap:10px;align-items:center}.answer-row label{font-weight:900;color:var(--navy);text-align:center}.spell{width:100%;font:inherit;font-size:18px;padding:11px;border:2px solid #94a3b8;border-radius:9px}.feedback{padding:13px;border-radius:10px;font-weight:800;margin:13px 0}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.explain{font-weight:500;margin-top:7px}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:var(--voicebg);margin:13px 0}.voicebox b{display:block;font-size:19px;margin-bottom:8px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}.wrong p{margin:6px 0}.source{font-size:13px;color:var(--muted)}@media(max-width:600px){.wrap{padding:9px}.hero,.card{padding:15px}.question{font-size:18px;padding:13px}.option{font-size:17px}.answer-row{grid-template-columns:42px 1fr}.meta{display:block}}</style><link rel="stylesheet" href="longteng-vocab-required-pronunciation.css?v=20261026-4"></head><body><main class="wrap"><section class="hero"><h1>龍騰普高 B3U6 整句式翻譯</h1><p>共 24 題。輸入完整英文句；系統會以關鍵語意、句型與文法結構彈性判定，答錯後請重新作答。</p><p class="note">答對後顯示解析卷參考答案並播放完整英文句；STT 朗讀達 80% 才能進入下一題。完成後可重做錯題並下載 DOCX。</p><div class="toolbar"><a class="btn" href="dashboard.html">← 回測驗總覽</a></div></section><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn">全部選取</button><button id="none" class="btn">全部取消</button><button id="rand20" class="btn">隨機 20 題</button></div><label><input id="shuffle" type="checkbox"> 打亂出題順序</label><div id="list"></div><div class="actions"><button id="start" class="btn primary">開始作答</button><span id="picked" class="note"></span></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="voiceBox" class="voicebox hidden"><b id="voiceTarget"></b><button id="speak" class="btn voice">🔊 再聽一次</button></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="retry" class="btn primary">只重做錯題</button><button id="download" class="btn">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></main><script>const TITLE="龍騰普高 B3U6 整句式翻譯",MODE="spell",Q=[{"id":1,"zh":"直到雨停了他們才決定要去公園散步。","question":"________________________________________","answers":["It wasn't until the rain stopped that they decided to take a walk in the park."],"accepted":["It wasn't until the rain stopped that they decided to take a walk in the park."],"reference":"It wasn’t until the rain stopped that they decided to take a walk in the park.","explanation":"It wasn’t until…that….表示「直到……才……」，描述已發生的事，故動詞皆為過去式","source":"龍騰自命題"},{"id":2,"zh":"你可以和我去看電影或是待在家玩線上遊戲。","question":"________________________________________","answers":["You can either go to the movies with me or stay home playing online games."],"accepted":["You can either go to the movies with me or stay home playing online games.","You can either go to the movies with me or play online games at home."],"reference":"You can either go to the movies with me or stay home playing online games/play online games at home.","explanation":"either…or… 不是……就是……","source":"龍騰自命題"},{"id":3,"zh":"Mark錯過了公車又上班遲到，而且最糟的是，他沒有錢吃午餐。","question":"________________________________________","answers":["Mark missed the bus and was late to work; and then worst of all, he had no money for lunch."],"accepted":["Mark missed the bus and was late to work; and then worst of all, he had no money for lunch."],"reference":"Mark missed the bus and was late to work; and then worst of all, he had no money for lunch.","explanation":"worst of all表示「最糟的是」，描述已發生的事，故動詞皆為過去式","source":"龍騰自命題"},{"id":4,"zh":"我在購物中心偶然遇到了我的英文老師，我們開心地聊了兩個小時。","question":"________________________________________","answers":["I came upon my English teacher in the shopping mall and we chatted happily for two hours."],"accepted":["I came upon my English teacher in the shopping mall and we chatted happily for two hours."],"reference":"I came upon my English teacher in the shopping mall and we chatted happily for two hours.","explanation":"come upon表示「偶然遇到」，使用and連接兩個子句","source":"龍騰自命題"},{"id":5,"zh":"直到你讀完這本書你才了解結局發生了什麼事。","question":"________________________________________","answers":["It isn't until you finish reading the book that you will understand what happens in the end."],"accepted":["It isn't until you finish reading the book that you will understand what happens in the end.","It isn't until you finish reading this book that you will understand what happens in the end.","It wasn't until you finished reading the book that you understood what happened in the end.","It wasn't until you finished reading this book that you understood what happened in the end."],"reference":"It isn’t until you finish reading the/this book that you will understand what happens in the end./It wasn’t until you finished reading the/this book that you understood what happened in the end.","explanation":"It isn’t/wasn’t until…that….表示「直到……才……」，動詞需根據時態做變化，並以what名詞子句作受詞","source":"龍騰自命題"},{"id":6,"zh":"為了解決這個問題，不是你就是他必須為你們所做的事道歉。","question":"________________________________________","answers":["To solve the problem, either you or he has to apologize for what you have done."],"accepted":["To solve the problem, either you or he has to apologize for what you have done.","To solve this problem, either you or he has to apologize for what you have done."],"reference":"To solve the/this problem, either you or he has to apologize for what you have done.","explanation":"either…or… 不是……就是……；apologize for 道歉；以what名詞子句作受詞","source":"龍騰自命題"},{"id":7,"zh":"Simon和Maggie初次在餐廳見面時就愛上了彼此。","question":"________________________________________","answers":["Simon and Maggie fell in love with each other the moment they first met at the restaurant."],"accepted":["Simon and Maggie fell in love with each other the moment they first met at the restaurant.","Simon and Maggie fell in love with each other when they first met at the restaurant."],"reference":"Simon and Maggie fell in love with each other the moment/when they first met at the restaurant.","explanation":"fall in love with sb. 愛上某人；each other 彼此","source":"龍騰自命題"},{"id":8,"zh":"儘管這一切挑戰，Emma不想要放棄她成為專業舞者的夢想。","question":"________________________________________","answers":["Despite all the challenges, Emma doesn't want to give up her dream of becoming a professional dancer."],"accepted":["Despite all the challenges, Emma doesn't want to give up her dream of becoming a professional dancer.","Despite all the challenges, Emma didn't want to give up her dream of becoming a professional dancer."],"reference":"Despite all the challenges, Emma doesn’t/didn’t want to give up her dream of becoming a professional dancer.","explanation":"Despite N, S + V…. 儘管……；give up 放棄","source":"龍騰自命題"},{"id":9,"zh":"如果我們一大早出發以避開交通壅塞，我們一定可以準時抵達機場。","question":"________________________________________","answers":["If we set off in the early morning to avoid heavy traffic, we are sure to arrive at the airport on time."],"accepted":["If we set off in the early morning to avoid heavy traffic, we are sure to arrive at the airport on time.","If we set off in the early morning so as to avoid heavy traffic, we will be able to arrive at the airport on time."],"reference":"If we set off in the early morning to/so as to avoid heavy traffic, we are sure/will be able to arrive at the airport on time.","explanation":"set off 出發；on time 準時；heavy traffic 交通壅塞","source":"龍騰自命題"},{"id":10,"zh":"為了她兒子的緣故，Alice辭去工作因為她必須待在家中照顧他。","question":"________________________________________","answers":["For her son's sake, Alice quit the job in order to stay at home to care for him."],"accepted":["For her son's sake, Alice quit the job in order to stay at home to care for him.","For her son's sake, Alice resigned from the job in order to stay at home to care for him."],"reference":"For her son’s sake, Alice quit/resigned from the job in order to stay (at) home to care for him.","explanation":"for one’s sake 為了某人的緣故；care for 照顧","source":"龍騰自命題"},{"id":11,"zh":"愈來愈多人把出國旅行視為一個學習不同文化的好方法。","question":"________________________________________","answers":["More and more people view traveling abroad as a good way to learn about different cultures."],"accepted":["More and more people view traveling abroad as a good way to learn about different cultures."],"reference":"More and more people view traveling abroad as a good way to learn about different cultures.","explanation":"view...as.... 視……為……","source":"龍騰自命題"},{"id":12,"zh":"我們排隊買票等得愈久，我們就變得愈焦慮。","question":"________________________________________","answers":["The longer we waited in line to buy the tickets, the more anxious we became."],"accepted":["The longer we waited in line to buy the tickets, the more anxious we became."],"reference":"The longer we waited in line to buy the tickets, the more anxious we became.","explanation":"The + 比較級, the + 比較級 愈……，就愈……","source":"龍騰自命題"},{"id":13,"zh":"直到警方抵達了這裡他們才了解到他們舞會的噪音多麼擾人。","question":"________________________________________","answers":["It wasn't until the police arrived here that they realized how disturbing the noise from their party was."],"accepted":["It wasn't until the police arrived here that they realized how disturbing the noise from their party was."],"reference":"It wasn’t until the police arrived (here) that they realized how disturbing the noise from their party was.","explanation":"It wasn’t until…that… 直到……才……，以how子句作為受詞","source":"龍騰自命題"},{"id":14,"zh":"因為這電影的故事及特效都無法令觀眾印象深刻，自從它發行以來就得到不好的評論。","question":"________________________________________","answers":["Since neither the story of the movie nor the special effects impressed the audience, it has received bad reviews since its release."],"accepted":["Since neither the story of the movie nor the special effects impressed the audience, it has received bad reviews since its release.","As neither the story of the movie nor the special effects impressed the audience, it has received bad reviews since its release."],"reference":"Since/Because/As neither the story of the movie nor the special effects impressed the audience, it has received bad reviews since its release.","explanation":"neither…nor…. 既不是……也不是……；special effects 特效","source":"龍騰自命題"},{"id":15,"zh":"當遊客們看見了這幅知名的畫時，他們無法停止談論它的美。","question":"________________________________________","answers":["When the tourists laid eyes on the well-known painting, they couldn't stop talking about its beauty."],"accepted":["When the tourists laid eyes on the well-known painting, they couldn't stop talking about its beauty.","When the travelers laid eyes on this famous painting, they couldn't stop talking about its beauty."],"reference":"When the tourists/travelers laid eyes on the/this well-known/famous painting, they couldn’t stop talking about its beauty.","explanation":"lay eyes on 看見；stop + V-ing 停止做某事；描述已發生的事，故動詞皆為過去式","source":"龍騰自命題"},{"id":16,"zh":"直到Kelly生氣了她男友才關掉手機。(It isn’t/wasn’t....)","question":"________________________________________","answers":["It wasn't until Kelly got mad that her boyfriend turned off his smartphone."],"accepted":["It wasn't until Kelly got mad that her boyfriend turned off his smartphone.","It wasn't until Kelly got angry that her boyfriend turned off his smartphone."],"reference":"It wasn’t until Kelly got mad/angry that her boyfriend turned off his smartphone.","explanation":"","source":"三合一學習手冊"},{"id":17,"zh":"無論Charlie或者是他弟弟都無法勉強維持生計。","question":"________________________________________","answers":["Neither Charlie nor his younger brother can make ends meet."],"accepted":["Neither Charlie nor his younger brother can make ends meet."],"reference":"Neither Charlie nor his younger brother can make ends meet.","explanation":"","source":"三合一學習手冊"},{"id":18,"zh":"富人通常能獲得更好的醫療和教育。(The...)","question":"________________________________________","answers":["The rich often have access to better healthcare and education."],"accepted":["The rich often have access to better healthcare and education."],"reference":"The rich often have access to better healthcare and education.","explanation":"","source":"三合一學習手冊"},{"id":19,"zh":"你吃的糖愈少，就會愈健康。","question":"________________________________________","answers":["The less sugar you eat, the healthier you will be."],"accepted":["The less sugar you eat, the healthier you will be."],"reference":"The less sugar you eat, the healthier you will be.","explanation":"","source":"三合一學習手冊"},{"id":20,"zh":"年輕人經常充滿夢想，並且渴望探索這個世界。(the + adj.)","question":"________________________________________","answers":["The young are often full of dreams and eager to explore the world."],"accepted":["The young are often full of dreams and eager to explore the world."],"reference":"The young are often full of dreams and eager to explore the world.","explanation":"","source":"三合一學習手冊"},{"id":21,"zh":"直到John收到Mandy的簡訊後，他才了解她已經決定要跟他分手。(It was....)","question":"________________________________________","answers":["It was not until John got a text message from Mandy that he realized she had decided to break up with him."],"accepted":["It was not until John got a text message from Mandy that he realized she had decided to break up with him."],"reference":"It was not until John got a text message from Mandy that he realized she had decided to break up with him.","explanation":"","source":"三合一學習手冊"},{"id":22,"zh":"這名學生既不在乎他的社團活動也不在乎他的課業。(...neither...nor....)","question":"________________________________________","answers":["This student cares neither about his club activities nor about his studies."],"accepted":["This student cares neither about his club activities nor about his studies."],"reference":"This student cares neither about his club activities nor about his studies.","explanation":"","source":"三合一學習手冊"},{"id":23,"zh":"那嬰兒直到看到他媽媽才停止哭泣。(It was not until... + that + S + V....)","question":"________________________________________","answers":["It was not until the baby saw his mother that he stopped crying."],"accepted":["It was not until the baby saw his mother that he stopped crying."],"reference":"It was not until the baby saw his mother that he stopped crying.","explanation":"","source":"All in One"},{"id":24,"zh":"當Jason的父母外出時，他不是上網就是玩遊戲來消磨時間。","question":"________________________________________","answers":["When Jason's parents are away, he either surfs the Internet or plays games to pass the time."],"accepted":["When Jason's parents are away, he either surfs the Internet or plays games to pass the time.","When Jason's parents go out, he either surfs the Internet or plays games to pass th
