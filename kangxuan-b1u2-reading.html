<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>康軒 B1U2 Reading 課文填空</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#dbe2ea;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--accent:#2563eb;--accent2:#1d4ed8;--voice:#7c3aed;--voicebg:#f5f3ff}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}.wrap{max-width:980px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#eaf2ff,#fff);border:1px solid #dbeafe;border-radius:18px;padding:24px;margin-bottom:18px}.hero h1{margin:0 0 6px;font-size:clamp(25px,4vw,38px)}.hero p{margin:4px 0;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 5px 18px rgba(15,23,42,.05)}.hidden{display:none!important}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.btn{border:0;border-radius:10px;padding:11px 16px;font-size:16px;font-weight:700;cursor:pointer;background:#e5e7eb;color:#111827}.btn.primary{background:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent2)}.btn.danger{background:#991b1b;color:#fff}.btn.voice{background:var(--voice);color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.question-list{display:grid;gap:8px;margin-top:15px}.pick{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fafafa}.pick input{margin-top:5px;transform:scale(1.15)}.pick small{display:block;color:var(--muted)}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;width:0;background:var(--accent);transition:width .2s}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-weight:700;margin:8px 0 18px}.zh{font-size:22px;font-weight:800;padding:16px;border-left:5px solid var(--accent);background:#eff6ff;border-radius:8px;margin-bottom:18px}.english{font-size:20px;line-height:2.15}.blank{display:inline-block;vertical-align:middle;margin:2px 4px}.blank input,.blank select{font:inherit;min-width:92px;max-width:230px;padding:6px 8px;border:2px solid #94a3b8;border-radius:8px;background:#fff}.blank input:focus,.blank select:focus{outline:3px solid #bfdbfe;border-color:var(--accent)}.blank.correct input,.blank.correct select{border-color:var(--ok);background:var(--okbg)}.blank.wrong input,.blank.wrong select{border-color:var(--bad);background:var(--badbg)}.blank-answer{display:block;font-size:13px;line-height:1.35;color:var(--bad);font-weight:800;margin-top:2px}.feedback{margin-top:14px;padding:12px 14px;border-radius:10px;font-weight:800}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.voice-panel{margin-top:16px;padding:17px;border:2px solid #ddd6fe;border-radius:14px;background:var(--voicebg)}.voice-panel h3{margin:0 0 6px;color:#5b21b6}.voice-sentence{font-size:21px;font-weight:800;margin:8px 0 12px}.voice-result{margin-top:12px;padding:11px 13px;border-radius:9px;background:#fff;border:1px solid #ddd6fe}.voice-result.good{border-color:#86efac;background:var(--okbg);color:var(--ok)}.voice-result.retry{border-color:#fca5a5;background:var(--badbg);color:var(--bad)}.footer-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:15px 0}.stat{padding:15px;border:1px solid var(--line);border-radius:12px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong-list{display:grid;gap:12px}.wrong-card{border:1px solid #fecaca;background:#fff7f7;border-radius:12px;padding:14px}.wrong-card p{margin:5px 0}.note{font-size:14px;color:var(--muted)}@media(max-width:640px){.wrap{padding:12px}.card{padding:16px}.zh{font-size:19px}.english{font-size:18px}.voice-sentence{font-size:18px}.blank input,.blank select{min-width:76px;max-width:180px}.meta{font-size:14px}}
</style>
</head>
<body>
<div class="wrap">
<section class="hero"><h1>康軒 B1U2 Reading 課文填空</h1><p>先看完整中文，再依課文完成英文挖空。答錯的空格會顯示正確答案，請重新填對後再進下一題。</p><p class="note">整句答對後會自動朗讀英文，並可使用麥克風朗讀同一句進行語音辨識；不想朗讀可以直接按「下一題」跳過。判定會忽略大小寫、標點、前後空白、多餘空格及直/彎撇號差異。</p></section>
<section id="selectScreen" class="card"><h2>1. 選擇要練習的句子</h2><div class="toolbar"><button class="btn" id="allBtn">全部選取</button><button class="btn" id="noneBtn">全部取消</button><button class="btn primary" id="startBtn">開始作答</button></div><div id="questionList" class="question-list"></div></section>
<section id="quizScreen" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="progressText"></span><span id="wrongCount"></span></div><div id="zhText" class="zh"></div><div id="enText" class="english"></div><div id="feedback" class="feedback hidden"></div><div id="voicePanel" class="voice-panel hidden"><h3>🔊 聽一聽，再自己念一次（可跳過）</h3><div id="voiceSentence" class="voice-sentence"></div><div class="toolbar"><button class="btn voice" id="speakBtn">🔊 再聽一次</button><button class="btn voice" id="micBtn">🎤 開始朗讀</button></div><div id="voiceResult" class="voice-result">按「開始朗讀」後，允許瀏覽器使用麥克風，再清楚念完整句子。</div></div><div class="footer-actions"><button class="btn primary" id="checkBtn">檢查答案</button><button class="btn primary hidden" id="nextBtn">下一題</button><button class="btn danger" id="finishBtn">結束作答</button></div></section>
<section id="resultScreen" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary-grid"></div><div id="resultMessage"></div><div id="wrongList" class="wrong-list"></div><div class="footer-actions"><button class="btn primary" id="downloadBtn">下載錯題 DOCX</button><button class="btn" id="restartBtn">重新選題</button></div></section>
</div>
<script type="module">
import { Document, Packer, Paragraph, TextRun, HeadingLevel } from "https://esm.sh/docx@9.5.1";
const B=(answer,opts={})=>({type:'blank',answer,accept:opts.accept||[answer],options:opts.options||null,width:opts.width||Math.max(82,Math.min(210,String(answer).length*15+30))});const T=text=>({type:'text',text});
const questions=[
{id:1,part:'Reading',zh:'（標題）亞洲象與非洲象的比較',full:'Asian Elephants vs. African Elephants',segments:[B('Asian'),T(' Elephants vs. '),B('African'),T(' '),B('Elephants')]},
{id:2,part:'Reading',zh:'牠們是亞洲象還是非洲象？',full:'Are they Asian elephants or African elephants?',segments:[B('Are'),T(' '),B('they'),T(' Asian '),B('elephants'),T(' '),B('or'),T(' African elephants?')]},
{id:3,part:'Reading',zh:'（小標題）體型',full:'Size',segments:[B('Size')]},
{id:4,part:'Reading',zh:'非洲象和亞洲象不同。',full:'African elephants are different from Asian elephants.',segments:[T('African elephants '),B('are'),T(' '),B('different'),T(' '),B('from'),T(' Asian elephants.')]},
{id:5,part:'Reading',zh:'非洲象非常大，牠們的耳朵也很大。',full:'African elephants are very big, and their ears are big, too.',segments:[T('African elephants are '),B('very'),T(' '),B('big'),T(', and '),B('their'),T(' '),B('ears'),T(' '),B('are'),T(' big, '),B('too'),T('.')]},
{id:6,part:'Reading',zh:'亞洲象體型小，牠們的耳朵也短。',full:'Asian elephants are small, and their ears are short.',segments:[T('Asian elephants '),B('are'),T(' '),B('small'),T(', and '),B('their'),T(' '),B('ears'),T(' are '),B('short'),T('.')]},
{id:7,part:'Reading',zh:'一頭非洲象大約 3.2 公尺高，',full:'An African elephant is about 3.2 meters tall,',segments:[B('An'),T(' African '),B('elephant'),T(' '),B('is'),T(' '),B('about'),T(' 3.2 '),B('meters'),T(' '),B('tall'),T(',')]},
{id:8,part:'Reading',zh:'但一頭亞洲象只有大約 2.75 公尺高。',full:'but an Asian elephant is only about 2.75 meters tall.',segments:[B('but'),T(' '),B('an'),T(' Asian elephant is '),B('only'),T(' '),B('about'),T(' 2.75 meters '),B('tall'),T('.')]},
{id:9,part:'Reading',zh:'（小標題）壽命',full:'Lifespan',segments:[B('Lifespan')]},
{id:10,part:'Reading',zh:'亞洲象的壽命大約 60 年，',full:"Asian elephants' lifespans are about 60 years,",segments:[T('Asian '),B("elephants'"),T(' '),B('lifespans'),T(' '),B('are'),T(' '),B('about'),T(' 60 '),B('years'),T(',')]},
{id:11,part:'Reading',zh:'但非洲象的壽命大約 70 年。',full:"but African elephants' lifespans are about 70 years.",segments:[B('but'),T(' African '),B("elephants'"),T(' lifespans are about 70 '),B('years'),T('.')]},
{id:12,part:'Reading',zh:'閱讀更多',full:'Read more',segments:[B('Read'),T(' '),B('more')]}
];
const state={selected:[],index:0,wrong:new Map(),attempted:new Set(),finishedCorrect:new Set()};const $=s=>document.querySelector(s);const list=$('#questionList'),selectScreen=$('#selectScreen'),quizScreen=$('#quizScreen'),resultScreen=$('#resultScreen');let recognition=null;
function norm(v){return String(v??'').trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ')}function speechNorm(v){return norm(v).replace(/[^a-z0-9' ]/g,'').replace(/\b(i'm)\b/g,'i am').replace(/\b(i'll)\b/g,'i will').replace(/\b(i'd)\b/g,'i would').replace(/\b(don't)\b/g,'do not').replace(/\b(what's)\b/g,'what is').replace(/\b(let's)\b/g,'let us').replace(/\b(he|she|it|that|who)'s\b/g,'$1 is').replace(/\b(we|you|they)'re\b/g,'$1 are').replace(/\s+/g,' ').trim()}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function spokenText(q){let s=q.full.replace(/^[A-Za-z]+:\s*/,'').replace(/^\(|\)$/g,'');return s.trim()}
function similarity(a,b){const A=speechNorm(a).split(' ').filter(Boolean),B=speechNorm(b).split(' ').filter(Boolean);const d=Array.from({length:A.length+1},()=>Array(B.length+1).fill(0));for(let i=0;i<=A.length;i++)d[i][0]=i;for(let j=0;j<=B.length;j++)d[0][j]=j;for(let i=1;i<=A.length;i++)for(let j=1;j<=B.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(A[i-1]===B[j-1]?0:1));return Math.max(0,1-d[A.length][B.length]/Math.max(A.length,B.length,1))}
function speakCurrent(){const q=state.selected[state.index];if(!q||!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(spokenText(q));u.lang='en-US';u.rate=.88;u.pitch=1;const voices=window.speechSynthesis.getVoices();u.voice=voices.find(v=>/^en-US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang))||null;window.speechSynthesis.speak(u)}
function showVoicePractice(){const q=state.selected[state.index];$('#voiceSentence').textContent=spokenText(q);$('#voicePanel').classList.remove('hidden');$('#voiceResult').className='voice-result';$('#voiceResult').textContent='先聽整句，再按「開始朗讀」用英文念一次。不想朗讀就按「下一題」。';$('#micBtn').disabled=false;setTimeout(speakCurrent,250)}
async function startRecognition(){const result=$('#voiceResult'),mic=$('#micBtn'),SR=window.SpeechRecognition||window.webkitSpeechRecognition;const reset=()=>{mic.disabled=false;mic.textContent='🎤 開始朗讀'};if(!window.isSecureContext){result.className='voice-result retry';result.innerHTML='此頁面不是安全連線，手機無法開啟麥克風。請使用 <strong>https://</strong> 開頭的 GitHub Pages 網址。';return}if(!SR){result.className='voice-result retry';result.innerHTML='這個瀏覽器不支援語音辨識。請點右上角選單，選擇「<strong>使用 Chrome 開啟</strong>」，不要在 LINE、Messenger 或其他 App 的內建瀏覽器中使用。';return}mic.disabled=true;mic.textContent='🎤 正在開啟麥克風…';result.className='voice-result';result.textContent='第一次使用時，請在系統視窗按「允許」。';try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('mediaDevices-unavailable');const stream=await navigator.mediaDevices.getUserMedia({audio:true});stream.getTracks().forEach(track=>track.stop())}catch(e){reset();result.className='voice-result retry';if(e.name==='NotAllowedError'||e.name==='PermissionDeniedError'){result.innerHTML='麥克風權限被封鎖。請點網址列左側的圖示 →「權限」→「麥克風」→「允許」，再重新整理頁面。<br><small>Android 也可到：設定 → 應用程式 → Chrome → 權限 → 麥克風 → 使用 App 時允許。</small>'}else{result.innerHTML='無法使用麥克風。請改用最新版 Chrome 直接開啟此頁，並確認手機「設定 → 應用程式 → Chrome → 權限 → 麥克風」已允許。'}return}try{recognition?.abort()}catch(e){}recognition=new SR();recognition.lang='en-US';recognition.interimResults=false;recognition.continuous=false;recognition.maxAlternatives=3;mic.textContent='🎤 聆聽中…';result.className='voice-result';result.textContent='正在聆聽，請清楚念完整句子…';recognition.onresult=e=>{const q=state.selected[state.index],target=spokenText(q);const alts=[...e.results[0]].map(x=>x.transcript);const scored=alts.map(t=>({t,s:similarity(t,target)})).sort((a,b)=>b.s-a.s)[0];const pct=Math.round(scored.s*100);result.className='voice-result '+(scored.s>=.78?'good':'retry');result.innerHTML=`<strong>辨識結果：</strong>${esc(scored.t)}<br><strong>與課文相似度：</strong>${pct}%<br>${scored.s>=.78?'✅ 很好！朗讀內容與課文相符。':'🔁 再聽一次正確句子，然後重新朗讀。'}`};recognition.onerror=e=>{result.className='voice-result retry';const msg=e.error==='not-allowed'?'瀏覽器仍未取得麥克風權限。請依照手機權限設定開啟後重新整理頁面。':e.error==='no-speech'?'沒有偵測到語音，請靠近手機麥克風再試一次。':e.error==='audio-capture'?'找不到可用的麥克風，請確認沒有被其他 App 使用。':'語音辨識暫時無法使用（'+e.error+'），請再試一次。';result.textContent=msg};recognition.onend=reset;try{recognition.start()}catch(e){reset();result.className='voice-result retry';result.textContent='無法啟動語音辨識，請重新整理頁面後再試一次。'}}
function renderList(){list.innerHTML=questions.map(q=>`<label class="pick"><input type="checkbox" class="qpick" value="${q.id}" checked><span><b>第 ${q.id} 題｜${esc(q.part)}</b><small>${esc(q.zh)}</small></span></label>`).join('')}$('#allBtn').onclick=()=>document.querySelectorAll('.qpick').forEach(x=>x.checked=true);$('#noneBtn').onclick=()=>document.querySelectorAll('.qpick').forEach(x=>x.checked=false);$('#startBtn').onclick=()=>{const ids=[...document.querySelectorAll('.qpick:checked')].map(x=>+x.value);if(!ids.length){alert('請至少選一題。');return}state.selected=questions.filter(q=>ids.includes(q.id));state.index=0;state.wrong.clear();state.attempted.clear();state.finishedCorrect.clear();selectScreen.classList.add('hidden');resultScreen.classList.add('hidden');quizScreen.classList.remove('hidden');showQuestion()};
function showQuestion(){try{recognition?.abort()}catch(e){}window.speechSynthesis?.cancel();const q=state.selected[state.index];$('#progressText').textContent=`第 ${state.index+1} / ${state.selected.length} 題｜${q.part}`;$('#wrongCount').textContent=`曾答錯 ${state.wrong.size} 題`;$('#bar').style.width=`${((state.index+1)/state.selected.length)*100}%`;$('#zhText').textContent=q.zh;const box=$('#enText');box.innerHTML='';let bi=0;q.segments.forEach(seg=>{if(seg.type==='text'){box.append(document.createTextNode(seg.text));return}const span=document.createElement('span');span.className='blank';span.dataset.bi=bi;let c;if(seg.options){c=document.createElement('select');c.innerHTML='<option value="">請選擇</option>'+seg.options.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}else{c=document.createElement('input');c.type='text';c.autocomplete='off';c.style.width=`${seg.width}px`;c.placeholder='______'}c.dataset.bi=bi;span.appendChild(c);box.appendChild(span);bi++});$('#feedback').className='feedback hidden';$('#voicePanel').classList.add('hidden');$('#checkBtn').classList.remove('hidden');$('#nextBtn').classList.add('hidden');setTimeout(()=>box.querySelector('input,select')?.focus(),0)}
function blankDefs(q){return q.segments.filter(s=>s.type==='blank')}function currentValues(){return [...$('#enText').querySelectorAll('input,select')].map(x=>x.value)}
$('#checkBtn').onclick=()=>{const q=state.selected[state.index],defs=blankDefs(q),ctrls=[...$('#enText').querySelectorAll('input,select')],vals=currentValues();if(vals.some(v=>!String(v).trim())){alert('請完成所有空格後再檢查。');return}state.attempted.add(q.id);let all=true;const wrongPieces=[];ctrls.forEach((c,i)=>{const span=c.closest('.blank'),d=defs[i],ok=d.accept.some(a=>norm(a)===norm(c.value));span.classList.remove('correct','wrong');span.querySelector('.blank-answer')?.remove();if(ok){span.classList.add('correct');c.disabled=true}else{all=false;span.classList.add('wrong');wrongPieces.push(`空格 ${i+1}: ${c.value}`);const hint=document.createElement('span');hint.className='blank-answer';hint.textContent=`正確：${d.answer}`;span.appendChild(hint);c.value='';c.disabled=false}});if(all){state.finishedCorrect.add(q.id);$('#feedback').className='feedback ok';$('#feedback').textContent='✅ 全部正確！先聽完整句，再自己朗讀一次；也可以直接按「下一題」跳過朗讀。';$('#checkBtn').classList.add('hidden');$('#nextBtn').classList.remove('hidden');showVoicePractice()}else{if(!state.wrong.has(q.id))state.wrong.set(q.id,{q,attempts:[]});state.wrong.get(q.id).attempts.push(wrongPieces.join('； '));$('#wrongCount').textContent=`曾答錯 ${state.wrong.size} 題`;$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 有空格錯誤。紅色空格下方已顯示正確答案；請只重填錯誤空格，再按一次「檢查答案」。';$('#enText').querySelector('input:not(:disabled),select:not(:disabled)')?.focus()}};
$('#speakBtn').onclick=speakCurrent;$('#micBtn').onclick=startRecognition;$('#nextBtn').onclick=()=>{state.index++;if(state.index>=state.selected.length)finishQuiz();else showQuestion()};$('#finishBtn').onclick=()=>finishQuiz();
function finishQuiz(){try{recognition?.abort()}catch(e){}window.speechSynthesis?.cancel();quizScreen.classList.add('hidden');resultScreen.classList.remove('hidden');const selected=state.selected.length,attempted=state.attempted.size,correct=state.finishedCorrect.size,wrong=state.wrong.size;$('#summary').innerHTML=`<div class="stat">選擇題數<b>${selected}</b></div><div class="stat">已作答<b>${attempted}</b></div><div class="stat">完成答對<b>${correct}</b></div><div class="stat">曾答錯<b>${wrong}</b></div>`;if(!wrong){$('#resultMessage').innerHTML='<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>';$('#wrongList').innerHTML='';$('#downloadBtn').classList.add('hidden')}else{$('#resultMessage').innerHTML='<p>以下題目曾經答錯；即使後來已改正，仍會保留在錯題 DOCX 中。</p>';$('#wrongList').innerHTML=[...state.wrong.values()].map((r,i)=>`<div class="wrong-card"><b>${i+1}. ${esc(r.q.zh)}</b><p>錯誤紀錄：${r.attempts.map(esc).join('<br>')}</p><p><strong>正確英文：</strong>${esc(r.q.full)}</p></div>`).join('');$('#downloadBtn').classList.remove('hidden')}}$('#restartBtn').onclick=()=>{resultScreen.classList.add('hidden');selectScreen.classList.remove('hidden')};
$('#downloadBtn').onclick=async()=>{if(!state.wrong.size)return;const children=[new Paragraph({heading:HeadingLevel.TITLE,children:[new TextRun({text:'康軒 B1U2 Reading 課文填空－錯題紀錄',bold:true})]}),new Paragraph({children:[new TextRun({text:`曾答錯共 ${state.wrong.size} 題`})]})];[...state.wrong.values()].forEach((r,i)=>{children.push(new Paragraph({heading:HeadingLevel.HEADING_2,children:[new TextRun({text:`${i+1}. ${r.q.zh}`,bold:true})]}));children.push(new Paragraph({children:[new TextRun({text:'學生錯誤答案：',bold:true}),new TextRun({text:r.attempts.join(' | ')})]}));children.push(new Paragraph({children:[new TextRun({text:'正確完整英文：',bold:true}),new TextRun({text:r.q.full})]}));children.push(new Paragraph({children:[new TextRun({text:'重新練習：____________________________________________________________'})]}))});const doc=new Document({sections:[{properties:{},children}]});const blob=await Packer.toBlob(doc);const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`康軒B1U2_Reading_錯題_${new Date().toISOString().slice(0,10)}.docx`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};
renderList();
</script>
</body>
</html>
