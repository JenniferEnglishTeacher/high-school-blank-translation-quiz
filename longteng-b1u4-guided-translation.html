<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="龍騰普高 B1U4 引導式翻譯互動練習"><title>龍騰普高 B1U4 引導式翻譯</title><style>:root{--blue:#2563eb;--navy:#1e3a8a;--bg:#f4f7fb;--card:#fff;--line:#dbe3ee;--ink:#172033;--muted:#64748b;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--voice:#6d28d9;--voicebg:#f5f3ff;--amber:#9a3412;--amberbg:#fff7ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}.wrap{max-width:920px;margin:auto;padding:16px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 5px 18px #0f172a0d}.hero{background:linear-gradient(135deg,#e8f1ff,#fff)}h1{margin:0 0 6px;font-size:clamp(25px,4vw,38px)}h2{margin-top:0}.note{color:var(--muted)}.hidden{display:none!important}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.btn{border:0;border-radius:10px;padding:11px 17px;font:800 16px inherit;cursor:pointer;background:#e5e7eb;color:var(--ink);text-decoration:none}.primary{background:var(--blue);color:#fff}.danger{background:#991b1b;color:#fff}.voice{background:var(--voice);color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.btn:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.pick{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin:7px 0;background:#fafcff}.pick input{margin-right:8px;width:17px;height:17px;accent-color:var(--blue)}#list{max-height:440px;overflow:auto;border:1px solid var(--line);padding:7px;border-radius:12px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:800;margin:8px 0 14px}.zh{padding:10px 13px;background:var(--amberbg);border-radius:9px;color:var(--amber);font-weight:800;margin-bottom:10px}.question{font-size:21px;font-weight:750;padding:16px;background:#f8fafc;border-radius:11px;white-space:pre-wrap}.options{display:grid;gap:9px;margin:14px 0}.option{display:flex;align-items:center;gap:11px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-size:18px;font-weight:750;cursor:pointer}.option:hover{border-color:#60a5fa;background:#eff6ff}.option:has(input:checked){border-color:var(--blue);background:#dbeafe;color:var(--navy)}.option input{width:20px;height:20px;accent-color:var(--blue)}.inputs{display:grid;gap:10px;margin:15px 0}.answer-row{display:grid;grid-template-columns:55px 1fr;gap:10px;align-items:center}.answer-row label{font-weight:900;color:var(--navy);text-align:center}.spell{width:100%;font:inherit;font-size:18px;padding:11px;border:2px solid #94a3b8;border-radius:9px}.feedback{padding:13px;border-radius:10px;font-weight:800;margin:13px 0}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.explain{font-weight:500;margin-top:7px}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:var(--voicebg);margin:13px 0}.voicebox b{display:block;font-size:19px;margin-bottom:8px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}.wrong p{margin:6px 0}.source{font-size:13px;color:var(--muted)}@media(max-width:600px){.wrap{padding:9px}.hero,.card{padding:15px}.question{font-size:18px;padding:13px}.option{font-size:17px}.answer-row{grid-template-columns:42px 1fr}.meta{display:block}}</style></head><body><main class="wrap"><section class="hero"><h1>龍騰普高 B1U4 引導式翻譯</h1><p>共 40 題。可自行選題、隨機抽題；答錯會顯示正確答案並要求重新作答。</p><p class="note">答對後會朗讀完整英文句子；完成後可重做錯題並下載 DOCX 錯題紀錄。</p><div class="toolbar"><a class="btn" href="dashboard.html">← 回測驗總覽</a></div></section><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn">全部選取</button><button id="none" class="btn">全部取消</button><button id="rand20" class="btn">隨機 20 題</button></div><label><input id="shuffle" type="checkbox"> 打亂出題順序</label><div id="list"></div><div class="actions"><button id="start" class="btn primary">開始作答</button><span id="picked" class="note"></span></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="voiceBox" class="voicebox hidden"><b id="voiceTarget"></b><button id="speak" class="btn voice">🔊 再聽一次</button></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="retry" class="btn primary">只重做錯題</button><button id="download" class="btn">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></main><script>const TITLE="龍騰普高 B1U4 引導式翻譯",MODE="multi",Q=[{"id":1,"zh":"地震來襲時，燈光突然熄滅，整個鎮陷入黑暗。","question":"When the earthquake struck, the lights went out ①____________ ②____________ a ③____________, and the town was left in darkness.","answers":["all","of","sudden"],"explanation":"","source":"All in One"},{"id":2,"zh":"在我們執行一項任務前，我們必須仔細計劃像是時間與金錢管理的諸多細節。","question":"Before we ①____________ ②____________ a task, many details, such as the management of time and money, should be carefully planned.","answers":["carry","out"],"explanation":"carry out sth. 執行某件事物 such as = like 例如","source":"龍騰自命題"},{"id":3,"zh":"當我在林中散步時，我巧遇一些可愛動物，例如松鼠和藍鴉。","question":"While I was taking a walk in the woods, I ①____________ ②____________ some cute animals, such as squirrels and blue jays.","answers":["came","across"],"explanation":"take a walk 散步 come across 巧遇 such as = like 例如 blue jay 藍鴉","source":"龍騰自命題"},{"id":4,"zh":"診斷出患有糖尿病的人必須拒絕某些水果，像是葡萄和西瓜。","question":"①____________ ②____________ are diagnosed with diabetes should say no to certain fruits, such as grapes and watermelons.","answers":["People","who||that"],"explanation":"考「限定」用法的形容詞子句，因為先行詞為不明確的人物，後方不須逗點，關代用who或that均可。 sb. be diagnosed with sth. 某人被診斷出患有…… diabetes 糖尿病","source":"龍騰自命題"},{"id":5,"zh":"我在閣樓發現的那只舊手錶，結果價值不斐。","question":"The old watch ①____________ I discovered in the attic ②____________ ③____________ to be quite valuable.","answers":["that||which","turned","out"],"explanation":"先行詞the old watch並非獨一無二，不足以讓聽者知道所指究竟是指哪一只錶，故使用限定用法的形容詞子句。而先行詞為物時，可使用that或which。 turn out (to be) + adj. 結果是……","source":"龍騰自命題"},{"id":6,"zh":"在買下那農場前，他先進行土地測量以便了解其真正價值多少。","question":"Before buying the farm, he ①____________ ②____________ a land survey to work out ③____________ much it was really worth.","answers":["carried","out","how"],"explanation":"","source":"All in One"},{"id":7,"zh":"Paulina把所有的發票仔細看過一遍，都沒有發現任何中獎號碼。","question":"Paulina went through all of her receipts but didn’t ①____________ ②____________ any winning numbers.","answers":["come","across"],"explanation":"","source":"課本例句填空"},{"id":8,"zh":"看起來總像是個紳士的Raymond先生結果竟是個已經欺騙無數佳人芳心的騙子。","question":"Mr. Raymond, ①____________ always looked like a gentleman, ②____________ ③____________ to be a liar ④____________ had cheated on many ladies.","answers":["who","turned","out","who||that"],"explanation":"第一格考「非限定」用法的形容詞子句，因為Mr. Raymond是獨一無二的人物，後方須有逗點，關代要用who。最後一格考「限定」用法的形容詞子句，因為a liar是不明確的人物，後方不須逗點，關代用who或that均可。 turn out to be + N 結果是……","source":"龍騰自命題"},{"id":9,"zh":"我們遇到一些預料外的問題，讓這項計畫無法順利執行。","question":"We ①____________ ②____________ some unexpected problems ③____________ made it impossible to ④____________ ⑤____________ the project smoothly.","answers":["came","across","which||that","carry","out"],"explanation":"第三格考「限定」用法的形容詞子句，因為先行詞是不明確的事物，後方不須逗點，關代要用which或that。 come across sth. 遇到某事 carry out sth. 執行某件事物","source":"龍騰自命題"},{"id":10,"zh":"我們被要求不要跟一隻正在執行任務的導盲犬玩。","question":"We are asked not to play with a guide dog ①____________ is ②____________ ③____________ its duties.","answers":["which||that","carrying","out"],"explanation":"第一格考「限定」用法的形容詞子句，因為先行詞是不明確的動物，後方不須逗點，關代要用which或that。 guide dog 導盲犬 carry out sth. 執行某件事物","source":"龍騰自命題"},{"id":11,"zh":"一輛速度很快的摩托車從轉角衝出來，撞到一個正站在那兒的老人。","question":"A high-speed motorcycle rushed out from the corner ①____________ ②____________ ③____________ ④____________ and bumped into an old man ⑤____________ was standing there.","answers":["all","of","a","sudden","who||that"],"explanation":"最後一格考「限定」用法的形容詞子句，因為先行詞是不明確的人物，後方不須逗點，關代用who或that均可。 all of a sudden = suddenly 突然間","source":"龍騰自命題"},{"id":12,"zh":"儘管我們對這個計畫付出心力，但由於糟糕的團隊合作和溝通不良，計畫最後失敗了。","question":"Although all of us had put our hearts into the project, it ①____________ ②____________ to be a failure ③d____________ ④____________ poor teamwork and communication.","answers":["turned","out","due","to"],"explanation":"Although S + V, S + V.... 雖然…… turn out to be + N 結果是…… due to + N 因為","source":"龍騰自命題"},{"id":13,"zh":"由於缺錢，我們放棄我們的計畫。","question":"We gave up our plan ①d____________ ②____________ lack of money.","answers":["due","to"],"explanation":"due to + N 因為","source":"龍騰自命題"},{"id":14,"zh":"我的擔憂結果是白白浪費時間，因為我高分通過考試。","question":"My fears ①____________ ②____________ to be a waste of time since I passed the exam with flying colors.","answers":["turned","out"],"explanation":"turn out to be + N 結果是…… since 因為 with flying colors 成績優異地","source":"龍騰自命題"},{"id":15,"zh":"電影《美女與野獸》中，那個又老又醜的女人結果是前來測試王子心地的女巫。","question":"In the movie Beauty and the Beast, the ugly old woman ①____________ ②____________ to be a witch who had come to test the prince’s heart.","answers":["turned","out"],"explanation":"turn out to be + N 結果是……","source":"龍騰自命題"},{"id":16,"zh":"在雕像從廣場消失後，警方便進行調查。","question":"After the statue went missing from the square, the police ①____________ ②____________ an investigation.","answers":["carried","out"],"explanation":"","source":"課本例句填空"},{"id":17,"zh":"所有的樂團成員都很擔心他們的演出，但結果很棒！","question":"All the members of the band were worried about their performance, but it ①____________ ②____________ to be amazing!","answers":["turned","out"],"explanation":"","source":"課本例句填空"},{"id":18,"zh":"Cindy在街上走著，突然間從天上大雨傾盆而下。","question":"Cindy was walking down the street when ①____________ ②____________ ③____________ ④____________, rain began to pour down from the sky.","answers":["all","of","a","sudden"],"explanation":"","source":"課本例句填空"},{"id":19,"zh":"這間餐廳因為附近生鮮市場令人作嘔的氣味而不太受歡迎。","question":"The restaurant was not very popular ①____________ ②____________ the smell of the seafood market nearby.","answers":["due","to"],"explanation":"","source":"課本例句填空"},{"id":20,"zh":"我今早真倒楣。當我正在走路時，一顆不知道從哪裡來的球擊中我的頭。","question":"I was down on my luck this morning. I was walking when ①____________ ②____________ ③____________ ④____________ a ball coming out of nowhere hit my head.","answers":["all","of","a","sudden"],"explanation":"down on one’s luck 不走運 all of a sudden = suddenly 突然間","source":"龍騰自命題"},{"id":21,"zh":"意外發生得很突然，橋斷了，行經橋上的許多車輛就掉進河中。","question":"The accident happened ①____________ ②____________ ③____________ ④____________—the bridge broke and many cars that were going across it dropped down into the river.","answers":["all","of","a","sudden"],"explanation":"all of a sudden = suddenly 突然間","source":"龍騰自命題"},{"id":22,"zh":"粉絲們正欣賞著這位歌手的歌聲，突然間，他摔落舞臺。","question":"The fans were enjoying the singer’s voice, when ①____________ ②____________ ③____________ ④____________, he fell off the stage.","answers":["all","of","a","sudden"],"explanation":"all of a sudden = suddenly 突然間","source":"龍騰自命題"},{"id":23,"zh":"我很高興碰到你。我想跟你問明天的數學考試。","question":"I’m very happy to ①____________ ②____________ you. I want to ask you about tomorrow’s math test.","answers":["come","across"],"explanation":"","source":"All in One"},{"id":24,"zh":"我們要去臺中的自然科學博物館是我從沒去過的地方。","question":"We are going to the National Science Museum in Taichung ____________ I have never been to before.","answers":[", which||which"],"explanation":"","source":"三合一學習手冊"},{"id":25,"zh":"隨著城市變得更大，人們要找到住的地方就變得困難。","question":"①____________ ②____________ ③____________ ④____________ bigger, it becomes harder for people to find a place to live.","answers":["As","the","city","gets/grows"],"explanation":"","source":"三合一學習手冊"},{"id":26,"zh":"我一旦做了承諾，就會盡全力信守承諾，所以會來幫你。","question":"①____________ I make a promise, I will do my best to keep it, and so I will ②____________ you ③____________.","answers":["Once","help","out"],"explanation":"","source":"三合一學習手冊"},{"id":27,"zh":"老師來了。坐下保持安靜。","question":"Here ①____________ ②____________ ③____________. Sit down and be quiet.","answers":["comes","the","teacher"],"explanation":"","source":"三合一學習手冊"},{"id":28,"zh":"當我必須在醫院裡照顧媽媽時，他幫我照顧孩子們。","question":"He ①____________ me ②____________ with my kids when I had to take care of my mom in the hospital.","answers":["helped","out"],"explanation":"","source":"三合一學習手冊"},{"id":29,"zh":"我跟家人很親。有他們在旁邊我覺得很有安全感。","question":"My family and I are very close. I feel ①____________ ②____________ ③____________ security with them around.","answers":["a","sense","of"],"explanation":"","source":"三合一學習手冊"},{"id":30,"zh":"他曾經在幾個英語系國家工作過，像是澳洲、美國和加拿大。","question":"He has worked in several English-speaking countries, ①____________ ②____________ Australia, America, and Canada.","answers":["such","as"],"explanation":"","source":"三合一學習手冊"},{"id":31,"zh":"科學家們需要做更多研究來確定這種新藥有用。","question":"Scientists have to ①____________ ②____________ more research to make sure that the new medicine will work.","answers":["carry","out"],"explanation":"","source":"三合一學習手冊"},{"id":32,"zh":"當我在街上偶遇我前男友時，我覺得很尷尬。他跟他的新女友在一起，看起來很開心。","question":"I felt embarrassed when I ①____________ ②____________ my ex-boyfriend on the street. He looked happy with his new girlfriend.","answers":["came","across"],"explanation":"","source":"三合一學習手冊"},{"id":33,"zh":"一切都發生得很突然。我突然感到暈眩然後昏了過去。","question":"It happened ①____________ ②____________ ③____________ ④____________. I suddenly felt dizzy and fainted.","answers":["all","of","a","sudden"],"explanation":"","source":"三合一學習手冊"},{"id":34,"zh":"根據警方，這次意外主要是由於駕駛的粗心造成的。","question":"According to the police, the accident ①____________ mainly ②____________ ③____________ the driver’s carelessness.","answers":["was","due/caused","to/by"],"explanation":"","source":"三合一學習手冊"},{"id":35,"zh":"這份工作結果已經比我們原本想的要困難。我們需要一些協助才能完成它。","question":"The job has ①____________ ②____________ to be more difficult than we thought. We need some help to finish it.","answers":["turned","out"],"explanation":"","source":"三合一學習手冊"},{"id":36,"zh":"Georgiana在星巴克喝杯熱卡布奇諾時巧遇她的前夫，她最不想見到的人。","question":"While having a hot cup of cappuccino at a Starbucks, Georgiana ①____________ ②____________ her ex-husband, ③____________ was the last man she wanted to meet.","answers":["came","across","who"],"explanation":"最後一格考「非限定」用法的形容詞子句，因為ex-husband是獨一無二的人物，後方須有逗點，關代要用who。 come across sb. 巧遇某人","source":"龍騰自命題"},{"id":37,"zh":"Ray正睡得香甜，突然間，門鈴響了並把他吵醒。","question":"Ray was sound asleep when ①____________ ②____________ ③____________ ④____________ his doorbell rang and woke him up.","answers":["all","of","a","sudden"],"explanation":"all of a sudden = suddenly 突然間","source":"龍騰自命題"},{"id":38,"zh":"我的摯友拍拍我的肩膀說：「一切都會變好的。」","question":"My best friend patted me on the shoulder, saying, “Everything will ①____________ ②____________ fine.”","answers":["turn","out"],"explanation":"pat sb. on the + 身體部位 輕拍某人的…… turn out (to be) + adj. 結果是……","source":"龍騰自命題"},{"id":39,"zh":"隨著時間流逝，我們得儘快執行這個工作。","question":"As time is running out, we have to ①____________ ②____________ this task as soon as possible.","answers":["carry","out"],"explanation":"carry out sth. 執行某件事物","source":"龍騰自命題"},{"id":40,"zh":"Leo希望能在舞會中遇到他的真命天女，但這並未發生。","question":"Leo hoped to ①____________ ②____________ his Princess Charming at the party, but it didn’t happen.","answers":["come","across"],"explanation":"come across sb. 遇見某人 Princess Charming真命天女","source":"龍騰自命題"}];const $=s=>document.querySelector(s),list=$('#list'),select=$('#select'),quiz=$('#quiz'),result=$('#result'),question=$('#question'),answerArea=$('#answerArea'),feedback=$('#feedback'),next=$('#next');let chosen=[],idx=0,mode='first';const wrong=new Map(),correct=new Set();const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ');const shuffled=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function renderList(){list.innerHTML=Q.map(q=>'<label class="pick"><input class="pickbox" type="checkbox" value="'+q.id+'" checked><b>第 '+q.id+' 題</b> <span class="source">'+esc(q.source||'')+'</span></label>').join('');count()}function count(){$('#picked').textContent='已選 '+document.querySelectorAll('.pickbox:checked').length+' 題'}list.addEventListener('change',count);$('#all').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=true);count()};$('#none').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=false);count()};$('#rand20').onclick=()=>{let ids=new Set(shuffled(Q).slice(0,Math.min(20,Q.length)).map(q=>q.id));document.querySelectorAll('.pickbox').forEach(x=>x.checked=ids.has(+x.value));count()};$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));if($('#shuffle').checked)chosen=shuffled(chosen);idx=0;mode='first';wrong.clear();correct.clear();select.classList.add('hidden');result.classList.add('hidden');quiz.classList.remove('hidden');show()};function show(){const q=chosen[idx];speechSynthesis?.cancel();$('#meta').textContent=(mode==='retry'?'錯題重做｜':'')+'第 '+(idx+1)+' / '+chosen.length+' 題';$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';$('#bar').style.width=(idx+1)/chosen.length*100+'%';question.textContent=q.question;const zh=$('#zh');if(q.zh){zh.textContent=q.zh;zh.classList.remove('hidden')}else zh.classList.add('hidden');feedback.className='feedback hidden';$('#voiceBox').classList.add('hidden');$('#check').classList.remove('hidden');next.classList.add('hidden');if(MODE==='mcq')answerArea.innerHTML='<div class="options">'+q.options.map((o,i)=>'<label class="option"><input type="radio" name="answer" value="'+i+'"><b>'+String.fromCharCode(65+i)+'.</b> '+esc(o)+'</label>').join('')+'</div>';else answerArea.innerHTML='<div class="inputs">'+q.answers.map((_,i)=>'<div class="answer-row"><label>'+(MODE==='multi'?['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'][i]:'答案')+'</label><input class="spell" autocomplete="off" spellcheck="false" placeholder="請輸入完整答案"></div>').join('')+'</div>';setTimeout(()=>answerArea.querySelector('input')?.focus(),0)}function currentAnswers(){if(MODE==='mcq'){const x=answerArea.querySelector('input:checked');return x?[+x.value]:[]}return [...answerArea.querySelectorAll('.spell')].map(x=>x.value)}function correctText(q){return MODE==='mcq'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.answers.map(a=>a.split('||')[0]).join(' / ')}function isCorrect(q,a){return MODE==='mcq'?a[0]===q.answer:a.every((x,i)=>q.answers[i].split(/\|\||\//).some(v=>norm(x)===norm(v)))}function completedSentence(q){if(MODE==='mcq')return q.question.replace(/_{3,}/,q.options[q.answer]);if(MODE==='spell')return q.question.replace(/[A-Za-z]?_{3,}[A-Za-z]?/,q.answers[0].split('||')[0]);let s=q.question,marks=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];q.answers.forEach((a,i)=>{let value=a.split('||')[0];let re=new RegExp(marks[i]+'[A-Za-z]?_{3,}[A-Za-z]?');if(re.test(s))s=s.replace(re,value);else s=s.replace(/_{3,}/,value)});return s.replace(/[①-⑩]/g,'')}function speak(){if(!speechSynthesis)return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance($('#voiceTarget').textContent);u.lang='en-US';u.rate=.86;speechSynthesis.speak(u)}$('#speak').onclick=speak;$('#check').onclick=()=>{const q=chosen[idx],a=currentAnswers();if((MODE==='mcq'&&!a.length)||(MODE!=='mcq'&&(a.length!==q.answers.length||a.some(x=>!x.trim()))))return alert('請完成所有答案。');if(isCorrect(q,a)){correct.add(q.id);feedback.className='feedback ok';feedback.innerHTML='✅ 全部正確！'+(q.explanation?'<div class="explain">解析：'+esc(q.explanation)+'</div>':'');$('#check').classList.add('hidden');next.classList.remove('hidden');$('#voiceTarget').textContent=completedSentence(q);$('#voiceBox').classList.remove('hidden');speak()}else{if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(MODE==='mcq'?String.fromCharCode(65+a[0]):a.join(' / '));$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';feedback.className='feedback bad';feedback.innerHTML='❌ 答案不正確。正確答案：<strong>'+esc(correctText(q))+'</strong><br>請重新作答。'+(q.explanation?'<div class="explain">解析：'+esc(q.explanation)+'</div>':'');if(MODE==='mcq')answerArea.querySelectorAll('input').forEach(x=>x.checked=false);else answerArea.querySelectorAll('.spell').forEach(x=>x.value='');answerArea.querySelector('input')?.focus()}};next.onclick=()=>{idx++;idx>=chosen.length?finish():show()};$('#finish').onclick=finish;function finish(){speechSynthesis?.cancel();quiz.classList.add('hidden');result.classList.remove('hidden');$('#summary').innerHTML='<div class="stat">本輪題數<b>'+chosen.length+'</b></div><div class="stat">完成答對<b>'+correct.size+'</b></div><div class="stat">曾答錯<b>'+wrong.size+'</b></div>';$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>'<div class="wrong"><b>'+(i+1)+'. 第 '+r.q.id+' 題</b><p>'+esc((r.q.zh?r.q.zh+'\n':'')+r.q.question)+'</p><p><strong>錯誤答案：</strong>'+r.attempts.map(esc).join('；')+'</p><p><strong>正確答案：</strong>'+esc(correctText(r.q))+'</p>'+(r.q.explanation?'<p><strong>解析：</strong>'+esc(r.q.explanation)+'</p>':'')+'</div>').join(''):'<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size);$('#retry').classList.toggle('hidden',!wrong.size)}$('#retry').onclick=()=>{chosen=[...wrong.values()].map(x=>x.q);idx=0;mode='retry';correct.clear();result.classList.add('hidden');quiz.classList.remove('hidden');show()};$('#restart').onclick=()=>location.reload();$('#download').onclick=async()=>{if(!wrong.size)return;try{if(!window.docx)await new Promise((ok,fail)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js';s.onload=ok;s.onerror=fail;document.head.append(s)});let{Document,Packer,Paragraph,TextRun,HeadingLevel}=window.docx,children=[new Paragraph({text:TITLE+' 錯題紀錄',heading:HeadingLevel.TITLE})];for(const [_,r] of wrong){children.push(new Paragraph({children:[new TextRun({text:'第 '+r.q.id+' 題',bold:true})]}));if(r.q.zh)children.push(new Paragraph(r.q.zh));children.push(new Paragraph(r.q.question),new Paragraph('錯誤答案：'+r.attempts.join('；')),new Paragraph('正確答案：'+correctText(r.q)));if(r.q.explanation)children.push(new Paragraph('解析：'+r.q.explanation));children.push(new Paragraph('重新作答：________________________________________'))}let blob=await Packer.toBlob(new Document({sections:[{children}]})),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=TITLE+'_錯題.docx';a.click();URL.revokeObjectURL(url)}catch(e){let text=[...wrong.values()].map(r=>'第 '+r.q.id+' 題\n'+(r.q.zh?r.q.zh+'\n':'')+r.q.question+'\n錯誤答案：'+r.attempts.join('；')+'\n正確答案：'+correctText(r.q)+(r.q.explanation?'\n解析：'+r.q.explanation:'')).join('\n\n');let blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=TITLE+'_錯題.txt';a.click();URL.revokeObjectURL(url)}};renderList();</script></body></html>
