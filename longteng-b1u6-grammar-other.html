<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="龍騰普高 Book 1 Unit 6 互動測驗，附解析、整句朗讀與必做 STT 朗讀評分。"><title>龍騰普高 Book 1 Unit 6｜文法選擇（其他考點）</title><link rel="stylesheet" href="longteng-b1u5-quiz.css?v=20261026-2"><link rel="stylesheet" href="longteng-vocab-required-pronunciation.css?v=20261026-4"></head><body><main class="wrap"><header class="hero"><a class="btn" href="dashboard.html">← 回到 Dashboard</a><h1 id="title">龍騰普高 Book 1 Unit 6｜文法選擇（其他考點）</h1><p id="description" class="note"></p></header><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn" type="button">全選</button><button id="none" class="btn" type="button">取消全選</button><button id="random" class="btn" type="button">隨機 20 題</button><span id="picked" class="note"></span></div><div id="list"></div><label class="pick"><input id="shuffle" type="checkbox"> 隨機排列題目</label><button id="start" class="btn primary" type="button">開始測驗 →</button></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><div class="actions"><button id="check" class="btn primary" type="button">檢查答案</button><button id="next" class="btn primary hidden" type="button">下一題 →</button><button id="finish" class="btn danger" type="button">結束練習</button></div></section><section id="result" class="card hidden"><h2>練習結果</h2><div id="summary" class="summary"></div><h2>錯題紀錄</h2><div id="wrongList"></div><div class="actions"><button id="retry" class="btn primary" type="button">重做錯題</button><button id="download" class="btn" type="button">下載 DOCX 錯題</button><button id="restart" class="btn" type="button">重新選題</button></div></section></main><script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 6｜文法選擇（其他考點）","mode":"mcq","questions":[{"id":1,"question":"Adam has been longing to pay a visit to London ____________ is one of the largest cities in the world.","options":[", that",", which","that","which"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"由於先行詞London是一個特定的城市，所指對象非常明確，因此必須使用形容詞子句的非限定用法；且在使用非限定用法時，關代不能使用that，故本題答案要選擇「, which」"},{"id":2,"question":"From a distance, we could see several old houses standing ____________ along the street.","options":["empty","emptily","emptiness","emptying"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"本題考點為連綴動詞stand + adj.；此處的standing接於see後使用現在分詞，其後面要接形容詞，故答案要選擇empty"},{"id":3,"question":"To everyone’s surprise, over time, Paul ____________ far more mature and independent than before.","options":["was becoming","will become","will have become","has become"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"over time表示「隨著時間經過」，常與現在完成式連用，故答案要選擇has become"},{"id":4,"question":"Rita is reading a fashion magazine ____________ she borrowed from Judy.","options":["whom","who","that","what"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"由句型結構判斷，空格後面應該是一個形容詞子句，修飾先行詞a fashion magazine；且因為先行詞是事物，在形容詞子句裡為受詞，故適合的答案只有that"},{"id":5,"question":"After returning home from work, Marvin sat on the sofa to ____________ a rest.","options":["taking","take","took","taken"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"本題考點為to VR的不定詞片語，用來表示「目的」，故答案要選擇take"},{"id":6,"question":"Most teachers agree that Jessica is ____________ students in this class.","options":["one of the smartest","the smartest one","one of smartest","the smarter of one"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"在空格後面是複數名詞students，因此可推測本題考點為「one of the/所有格 + 最高級 + 複數N」，意指「最……的之一」，且因為有用到最高級形容詞，故在最高級形容詞前面一定要有定冠詞the或所有格，所以答案要選擇one of the smartest"},{"id":7,"question":"When taking a walk in the forest, Willy came across a piece of wood ____________ some interesting patterns on it.","options":["was","had","from","with"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"本題考點為with + N，表「帶有……」，而空格後面是名詞片語，故答案要選擇with"},{"id":8,"question":"While Laura was watching TV in the living room, her cat lay ____________ her feet.","options":["to","of","at","in"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"本題考點為at one’s feet，表「在某人的腳邊」，故答案要選擇at"},{"id":9,"question":"According to experts, young children should not be exposed ____________ too much violence in TV programs or movies.","options":["of","to","by","on"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"本題考點為A be exposed to B，表「A被暴露於B中；A接觸B」，因此答案要選擇to"},{"id":10,"question":"Some workers are trying to remove a large rock ____________ the middle of the road.","options":["from","with","into","upon"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"本題考點為remove...from...，表「從……移除……」，故答案要選擇from"},{"id":11,"question":"Although John wasn’t getting paid very well, he still earned enough money ____________ his family.","options":["with support","by supporting","at supporting","to support"],"answer":3,"answerLabel":"D","source":"習作簿","explanation":"補充解析：to + 原形動詞表示目的；to support his family 表示「為了養家」。來源未附逐題解析。"},{"id":12,"question":"My father became ____________ when he saw my school report.","options":["anger","angrily","angry","to anger"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"本句的became是連綴動詞，所以答案選形容詞angry。"},{"id":13,"question":"This house was built ____________ the Victorian style.","options":["in","as","for","with"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"本句考點為in...style，介系詞用in，in Victorian style意指「維多利亞時期的風格」。"},{"id":14,"question":"If plastic items are exposed ____________ sunlight for a long time, the color on them will fade.","options":["in","to","with","under"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"本句考點為be exposed to，意為「暴露於」，介系詞用to。"},{"id":15,"question":"My girlfriend told me her love for me was over, leaving me with a ____________ heart.","options":["break","broke","broken","breaking"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"本句考點為broken，是過去分詞作形容詞用，意即「被打碎的；破碎的」，在此用以形容心碎。"},{"id":16,"question":"The Eiffel Tower ____________ is located in Paris, is a famous tourist destination that millions of people visit every year.","options":["who","what","that",", which"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"本句的Eiffel Tower（艾菲爾鐵塔）為專有名詞，其後需用「, which」引導非限定形容詞子句。"},{"id":17,"question":"Please remove the pan ____________ the stove and leave it to cool.","options":["from","off","out","of"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"本句考點為remove...from...，意為「把……從……移除」。"},{"id":18,"question":"No decision has been made, ____________ the situation remains unclear.","options":["in addition","because of","even though","and thus"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"由語意判斷，前為因後為果，thus「因此」是副詞不是連接詞，所以必須另有連接詞and來連接兩句，故為答案。"},{"id":19,"question":"The boss always holds a pocket watch ____________ his hand so he can keep track of the time during meetings.","options":["to","in","at","from"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"in one’s hand 在……手裡"},{"id":20,"question":"Michael Phelps is one of ____________ athletes of all time. He has won 28 Olympic medals.","options":["successfully","successful","more successful","the most successful"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"one of the/所有格 + 最高級 + 複數名詞 最……的之一"},{"id":21,"question":"People are wearing green ____________ celebration of St. Patrick’s Day.","options":["on","from","in","with"],"answer":2,"answerLabel":"C","source":"習作簿","explanation":"補充解析：in celebration of 表示「為了慶祝……」。來源未附逐題解析。"},{"id":22,"question":"In the 20th century, many African countries gained independence ____________ European countries that had previously ruled over them.","options":["from","for","to","into"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"gain independence from… 脫離……獨立"},{"id":23,"question":"Holly became ____________ when she saw mud on the floor because she had just cleaned it.","options":["anger","angry","angrily","more anger"],"answer":1,"answerLabel":"B","source":"習作簿","explanation":"補充解析：become 是連綴動詞，後接形容詞 angry「生氣的」。來源未附逐題解析。"},{"id":24,"question":"The door of the classroom stood ____________, so I walked in.","options":["opening","opens","open","to be opened"],"answer":2,"answerLabel":"C","source":"三合一學習手冊","explanation":"補充解析：stand 是連綴動詞，後接形容詞 open「開著的」。來源未附逐題解析。"},{"id":25,"question":"The tower on top of the hill ____________ 50 meters tall.","options":["goes","sees","stays","stands"],"answer":3,"answerLabel":"D","source":"三合一學習手冊","explanation":"補充解析：主詞 The tower 為單數，現在式動詞用 stands；stand 50 meters tall 表示「高達 50 公尺」。來源未附逐題解析。"},{"id":26,"question":"The house stood ____________ in the fierce thunderstorm during the typhoon.","options":["strongly","strong","danger","power"],"answer":1,"answerLabel":"B","source":"三合一學習手冊","explanation":"補充解析：stand 是連綴動詞，後接形容詞 strong「堅固的」。來源未附逐題解析。"}]};</script><script src="longteng-b1u5-quiz.js?v=20261026-2"></script><script src="longteng-vocab-required-pronunciation.js?v=20261026-4"></script></body></html>
