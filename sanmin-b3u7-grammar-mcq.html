</style></head><body><main><section class="hero"><h1>三民普高 B3U7｜文法選擇</h1><p class="muted">原題互動練習｜55 題｜即時批改｜錯誤重填｜答對後整句播放＋選做 STT｜錯題 DOCX｜成績登錄</p><div class="actions"><a class="btn" href="dashboard.html">← 回 Dashboard</a></div></section><section id="quiz" class="card"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="reference" class="reference hidden"></div><div id="voiceBox" class="voicebox hidden"><h3>🎙️ Pronunciation Check（選做）</h3><p><b id="voiceTarget"></b></p><div class="actions"><button id="speak" class="btn voice">🔊 再聽一次</button><button id="mic" class="btn primary">🎤 開始朗讀評分</button></div><div id="voiceResult" class="voice-result">尚未進行朗讀評分。</div></div><div class="actions"><button id="check" class="btn primary hidden">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束本輪</button></div></section><section id="result" class="card hidden"><h2>練習結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="download" class="btn primary">下載錯題 DOCX</button><button id="restart" class="btn">重新練習</button></div></section></main><script>
const QUIZ={"unit":"B3U7","kind":"mcq","title":"文法選擇","count":55,"data":[{"number":1,"prompt":"Jeff will never figure out why his teacher gets mad at him _____ he asks her in person.","options":{"A":"meanwhile","B":"and","C":"unless","D":"or"},"answer":"C","sentence":"Jeff will never figure out why his teacher gets mad at him unless he asks her in person."},{"number":2,"prompt":"The manager insisted that all the bills _______ in cash. Credit cards are not allowed.","options":{"A":"pay","B":"be paid","C":"paid","D":"were paid"},"answer":"B","sentence":"The manager insisted that all the bills be paid in cash. Credit cards are not allowed."},{"number":3,"prompt":"Before the earthquake _____, most of the villagers were sleeping safe and sound.","options":{"A":"took place","B":"was taken place","C":"was occurred","D":"happening"},"answer":"A","sentence":"Before the earthquake took place, most of the villagers were sleeping safe and sound."},{"number":4,"prompt":"Visitors in Spain can enjoy their night by going to special bars known as “tablao,” _____ the flamenco shows take place.","options":{"A":"what","B":"which","C":"when","D":"where"},"answer":"D","sentence":"Visitors in Spain can enjoy their night by going to special bars known as “tablao,” where the flamenco shows take place."},{"number":5,"prompt":"Rachel doesn't want to appear _____ because she thinks that it may make people around her sad, too.","options":{"A":"depressed","B":"to depressed","C":"depress","D":"as depressed"},"answer":"A","sentence":"Rachel doesn't want to appear depressed because she thinks that it may make people around her sad, too."},{"number":6,"prompt":"The news _____ the famous singer had been murdered in his hotel shocked all his fans.","options":{"A":"which","B":"that","C":"whose","D":"whom"},"answer":"B","sentence":"The news that the famous singer had been murdered in his hotel shocked all his fans."},{"number":7,"prompt":"It's hard to imagine that Sandy runs _____ fast _____ a bear.","options":{"A":"as; as","B":"so; as","C":"as; like","D":"so; like"},"answer":"A","sentence":"It's hard to imagine that Sandy runs as fast as a bear."},{"number":8,"prompt":"To this girl, the idea _____ go shopping with her date sounds wonderful.","options":{"A":"whether","B":"that","C":"what","D":"which"},"answer":"B","sentence":"To this girl, the idea that go shopping with her date sounds wonderful."},{"number":9,"prompt":"The plane _____ on time unless the wind is too strong.","options":{"A":"will take off","B":"took off","C":"taking off","D":"were taken"},"answer":"A","sentence":"The plane will take off on time unless the wind is too strong."},{"number":10,"prompt":"You cannot enter this club _____ you are over 18 years old.","options":{"A":"since","B":"unless","C":"despite","D":"instead"},"answer":"B","sentence":"You cannot enter this club unless you are over 18 years old."},{"number":11,"prompt":"In Greece, January 8th is the day _______ people are asked to undertake the traditional role of the opposite sex.","options":{"A":"which","B":", which","C":"when","D":", when"},"answer":"C","sentence":"In Greece, January 8th is the day when people are asked to undertake the traditional role of the opposite sex."},{"number":12,"prompt":"With many concerns in mind, Jamie can't concentrate as fully as his classmates _____.","options":{"A":"do","B":"does","C":"is","D":"are"},"answer":"A","sentence":"With many concerns in mind, Jamie can't concentrate as fully as his classmates do."},{"number":13,"prompt":"Watching TV and eating snacks _____ what the man did during the lockdown.","options":{"A":"seemed","B":"were","C":"to be","D":"was"},"answer":"B","sentence":"Watching TV and eating snacks were what the man did during the lockdown."},{"number":14,"prompt":"You won't catch up with your classmates _____ you start studying harder.","options":{"A":"though","B":"unless","C":"because","D":"whether"},"answer":"B","sentence":"You won't catch up with your classmates unless you start studying harder."},{"number":15,"prompt":"People in the past were doubtful about the fact _____ the earth is round.","options":{"A":"which","B":"what","C":"where","D":"that"},"answer":"D","sentence":"People in the past were doubtful about the fact that the earth is round."},{"number":16,"prompt":"If I _____ you, I wouldn't miss the opportunity to work abroad.","options":{"A":"am","B":"was","C":"had been","D":"were"},"answer":"D","sentence":"If I were you, I wouldn't miss the opportunity to work abroad."},{"number":17,"prompt":"Our family can't go hiking _____ it stops raining.","options":{"A":"unless","B":"if","C":"since","D":"while"},"answer":"A","sentence":"Our family can't go hiking unless it stops raining."},{"number":18,"prompt":"Nick puts on his jacket, _____ out of the door.","options":{"A":"is walking","B":"and walk","C":"to walk","D":"walking"},"answer":"D","sentence":"Nick puts on his jacket, walking out of the door."},{"number":19,"prompt":"If I _____ three million dollars, I would buy a house for my parents.","options":{"A":"will have","B":"have","C":"had","D":"having"},"answer":"C","sentence":"If I had three million dollars, I would buy a house for my parents."},{"number":20,"prompt":"Chen Shuchu (陳樹菊) is not only a vegetable vendor but a philanthropist, who devotes herself _______ others.","options":{"A":"to help","B":"to helping","C":"helping","D":"helped"},"answer":"B","sentence":"Chen Shuchu (陳樹菊) is not only a vegetable vendor but a philanthropist, who devotes herself to helping others."},{"number":21,"prompt":"Josephine has the belief _____ God will help her when she is in need.","options":{"A":"which","B":"what","C":"that","D":"whom"},"answer":"C","sentence":"Josephine has the belief that God will help her when she is in need."},{"number":22,"prompt":"Claire would buy a mansion for her parents if she _____ rich.","options":{"A":"was","B":"were","C":"is","D":"had been"},"answer":"B","sentence":"Claire would buy a mansion for her parents if she were rich."},{"number":23,"prompt":"Many of Paul’s classmates think that he doesn't study as _____ as Cindy does.","options":{"A":"hardly","B":"hard","C":"harder","D":"hardest"},"answer":"B","sentence":"Many of Paul’s classmates think that he doesn't study as hard as Cindy does."},{"number":24,"prompt":"All the guests _____ part in this party had a wonderful time.","options":{"A":"taking","B":"took","C":"takes","D":"taken"},"answer":"A","sentence":"All the guests taking part in this party had a wonderful time."},{"number":25,"prompt":"In today’s news, a girl _____ Chelsea found a chunk of gold in her backyard.","options":{"A":"naming","B":"who naming","C":"named","D":"who named"},"answer":"C","sentence":"In today’s news, a girl named Chelsea found a chunk of gold in her backyard."},{"number":26,"prompt":"Studio Ghibli is a company of 30 animators _____ traditional tools to draw the frames.","options":{"A":"which use","B":"using","C":"who uses","D":"use"},"answer":"B","sentence":"Studio Ghibli is a company of 30 animators using traditional tools to draw the frames."},{"number":27,"prompt":"The old couple were sitting on the bench and watching the children ______ happily in the park.","options":{"A":"plays","B":"played","C":"to play","D":"playing"},"answer":"C","sentence":"The old couple were sitting on the bench and watching the children to play happily in the park."},{"number":28,"prompt":"If I _____ not busy, I _____ go to the movies with you. Now, I have to work for this project.","options":{"A":"am; will","B":"was; would","C":"were; would have","D":"were; would"},"answer":"D","sentence":"If I were not busy, I would go to the movies with you. Now, I have to work for this project."},{"number":29,"prompt":"Not _____ the typhoon is coming, this teacher still went hiking with the class.","options":{"A":"know","B":"knowing","C":"known","D":"to know"},"answer":"B","sentence":"Not knowing the typhoon is coming, this teacher still went hiking with the class."},{"number":30,"prompt":"Miranda appears _____, so please leave her alone for a while.","options":{"A":"as angry","B":"to angry","C":"to be angry","D":"angrily"},"answer":"C","sentence":"Miranda appears to be angry, so please leave her alone for a while."},{"number":31,"prompt":"_____ you do not have pets, you will not know that taking care of them is not a piece of cake.","options":{"A":"If","B":"Unless","C":"Whether","D":"Where"},"answer":"A","sentence":"If you do not have pets, you will not know that taking care of them is not a piece of cake."},{"number":32,"prompt":"If you _____ that the sky is turning red, you know the storm is coming.","options":{"A":"X","B":"had noticed","C":"noticed","D":"notice"},"answer":"D","sentence":"If you notice that the sky is turning red, you know the storm is coming."},{"number":33,"prompt":"The manager has spent a lot of time _____ the basic rules of this company to these new employees.","options":{"A":"explaining","B":"to explain","C":"explains","D":"explained"},"answer":"A","sentence":"The manager has spent a lot of time explaining the basic rules of this company to these new employees."},{"number":34,"prompt":"When traveling in Europe, I found that people are not allowed to use the bathroom in a café _______ they order something to eat or drink.","options":{"A":"because","B":"if","C":"since","D":"unless"},"answer":"D","sentence":"When traveling in Europe, I found that people are not allowed to use the bathroom in a café unless they order something to eat or drink."},{"number":35,"prompt":"My mother didn't like the idea _____ I wanted to move out.","options":{"A":"which","B":"that","C":"what","D":"whether"},"answer":"B","sentence":"My mother didn't like the idea that I wanted to move out."},{"number":36,"prompt":"The idea _______ the government will put more funds into the sports industry wins public support.","options":{"A":"that","B":"which","C":"why","D":"what"},"answer":"A","sentence":"The idea that the government will put more funds into the sports industry wins public support."},{"number":37,"prompt":"The teacher warns the students that they may fail the test unless they _____ for it in advance.","options":{"A":"prepare","B":"might prepare","C":"were preparing","D":"don’t prepare"},"answer":"A","sentence":"The teacher warns the students that they may fail the test unless they prepare for it in advance."},{"number":38,"prompt":"Angela lay on her bed, _____ about what to do next.","options":{"A":"thought","B":"thinks","C":"thinking","D":"think"},"answer":"C","sentence":"Angela lay on her bed, thinking about what to do next."},{"number":39,"prompt":"_____ for his 3-pointers(三分球), this basketball player is now a super star in NBA.","options":{"A":"Know","B":"Knowing","C":"Known","D":"To know"},"answer":"C","sentence":"Known for his 3-pointers(三分球), this basketball player is now a super star in NBA."},{"number":40,"prompt":"Oliver can’t get good grades if he _____ spend time studying.","options":{"A":"hadn’t","B":"doesn’t","C":"didn’t","D":"could"},"answer":"B","sentence":"Oliver can’t get good grades if he doesn’t spend time studying."},{"number":41,"prompt":"Japanese have a stricter attitude to time than Spanish people _____.","options":{"A":"are","B":"are having","C":"do","D":"will"},"answer":"C","sentence":"Japanese have a stricter attitude to time than Spanish people do."},{"number":42,"prompt":"The report shows that Steven works as _____ as the manager.","options":{"A":"effect","B":"efficiency","C":"efficient","D":"efficiently"},"answer":"D","sentence":"The report shows that Steven works as efficiently as the manager."},{"number":43,"prompt":"What would you do if there _____ no electricity in Taiwan ten years from now?","options":{"A":"have","B":"had","C":"is","D":"were"},"answer":"C","sentence":"What would you do if there is no electricity in Taiwan ten years from now?"},{"number":44,"prompt":"How would you feel if you _____ for no reason?","options":{"A":"were blamed","B":"had been blamed","C":"are blamed","D":"would be blamed"},"answer":"A","sentence":"How would you feel if you were blamed for no reason?"},{"number":45,"prompt":"The teacher insisted that every student _____ to school on time.","options":{"A":"comes","B":"came","C":"coming","D":"come"},"answer":"D","sentence":"The teacher insisted that every student come to school on time."},{"number":46,"prompt":"If people _____ more consideration for others, there would be fewer misunderstandings.","options":{"A":"were shown","B":"showed","C":"show","D":"have shown"},"answer":"B","sentence":"If people showed more consideration for others, there would be fewer misunderstandings."},{"number":47,"prompt":"Our family won’t go hiking unless it _____ raining.","options":{"A":"stopped","B":"stops","C":"stopping","D":"had stopped"},"answer":"B","sentence":"Our family won’t go hiking unless it stops raining."},{"number":48,"prompt":"The fact _____ Kevin actually comes from Japan surprises all of his classmates.","options":{"A":"which","B":"whom","C":"that","D":"whether"},"answer":"C","sentence":"The fact that Kevin actually comes from Japan surprises all of his classmates."},{"number":49,"prompt":"What Lindsay said hurts my feelings. I won’t forgive her unless she _____ to me.","options":{"A":"has apologized","B":"is apologizing","C":"apologizes","D":"should apologize"},"answer":"C","sentence":"What Lindsay said hurts my feelings. I won’t forgive her unless she apologizes to me."},{"number":50,"prompt":"Kendrick insists that his son _____ a certain amount of math exercises every day.","options":{"A":"doing","B":"does","C":"do","D":"to do"},"answer":"C","sentence":"Kendrick insists that his son do a certain amount of math exercises every day."},{"number":51,"prompt":"Mary wants to visit Shilin Night Market, _____ there are many delicious snacks.","options":{"A":"where","B":"which","C":"that","D":"whose"},"answer":"A","sentence":"Mary wants to visit Shilin Night Market, where there are many delicious snacks."},{"number":52,"prompt":"Every afternoon, I like to stay in a coffee shop around the corner, _____ coffee.","options":{"A":"sip","B":"sipping","C":"to sip","D":"and sipping"},"answer":"B","sentence":"Every afternoon, I like to stay in a coffee shop around the corner, sipping coffee."},{"number":53,"prompt":"Did something happen to Lara? She appears _____ all day.","options":{"A":"as happy","B":"to happy","C":"happy","D":"happily"},"answer":"C","sentence":"Did something happen to Lara? She appears happy all day."},{"number":54,"prompt":"_____ early in the morning, he won’t be late for school.","options":{"A":"If Frank got up","B":"If Frank gets up","C":"Unless Frank gets up","D":"Unless Frank got up"},"answer":"B","sentence":"If Frank gets up early in the morning, he won’t be late for school."},{"number":55,"prompt":"Tina really looks up to her father _____ is a great doctor, and earns respect of his patients and colleagues.","options":{"A":"who","B":"that","C":", who","D":", which"},"answer":"C","sentence":"Tina really looks up to her father , who is a great doctor, and earns respect of his patients and colleagues."}]};const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let flat=[],index=0,wrong=new Map(),attempted=new Set(),firstTry=new Set(),recognition=null;
function flatten(){if(QUIZ.kind==='mcq')return QUIZ.data.map(x=>({...x,id:String(x.number)}));if(QUIZ.kind==='translation')return QUIZ.data.map(x=>({...x,id:String(x.number)}));return QUIZ.data.flatMap(set=>set.answers.map((answer,i)=>({id:`${set.set}-${i+1}`,set:set.set,passage:set.passage,options:set.options,answer,blank:i+1,sentence:set.sentences[i],structure:set.structure})))}
function fillPassage(text,answers,options){let out=text;answers.forEach((a,i)=>{const word=options[a];const n=i+1;const pats=[new RegExp(`__\\(?${n}\\)?__`),new RegExp(`__${n}__`),new RegExp(`　${n}　`),new RegExp(`\\(${n}\\)`)];for(const p of pats){if(p.test(out)){out=out.replace(p,word);break}}});return out.replace(/\n+/g,' ').replace(/\s+/g,' ').trim()}
function markBlank(text,n){const tag=`<span class="blank-now">Blank ${n}</span>`;let out=esc(text),done=false;for(const p of [new RegExp(`__\\(?${n}\\)?__`),new RegExp(`__${n}__`),new RegExp(`　${n}　`),new RegExp(`\\(${n}\\)`)]){if(!done&&p.test(out)){out=out.replace(p,tag);done=true}}return out}
function norm(s){return String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ')}function speak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}
function show(){try{recognition?.abort()}catch(e){}speechSynthesis?.cancel();const q=flat[index];$('#meta').textContent=`第 ${index+1} / ${flat.length} 題`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=((index+1)/flat.length*100)+'%';$('#feedback').className='feedback hidden';$('#reference').classList.add('hidden');$('#voiceBox').classList.add('hidden');$('#next').classList.add('hidden');$('#check').classList.toggle('hidden',QUIZ.kind!=='translation');$('#answerArea').innerHTML='';if(QUIZ.kind==='mcq')renderChoice(q.prompt,q.options);else if(QUIZ.kind==='translation')renderTranslation(q);else{$('#question').innerHTML=`<div class="passage">${markBlank(q.passage,q.blank)}</div>`;renderChoice(`第 ${q.blank} 格`,q.options)}}
function renderChoice(prompt,options){$('#question').innerHTML=QUIZ.kind==='mcq'?`<div class="prompt">${esc(prompt)}</div>`:$('#question').innerHTML;$('#answerArea').innerHTML='<div class="options">'+Object.entries(options).map(([k,v])=>`<button class="option" data-key="${k}"><b>${k}.</b> ${esc(v)}</button>`).join('')+'</div>';document.querySelectorAll('.option').forEach(b=>b.onclick=()=>checkChoice(b.dataset.key,b))}
function renderTranslation(q){let i=0;const rendered=esc(q.prompt).replace(/_{3,}/g,()=>`<input class="inline-input" data-i="${i++}" aria-label="第 ${i} 格答案">`);$('#question').innerHTML=`<div class="translation">${rendered}</div>`;setTimeout(()=>document.querySelector('.inline-input')?.focus(),0)}
function recordWrong(q,value){if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(value);$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
function checkChoice(key,button){const q=flat[index];attempted.add(q.id);if(key!==q.answer){recordWrong(q,key);button.classList.add('wrong');$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 不正確，請再試一次。';return}if(!wrong.has(q.id))firstTry.add(q.id);document.querySelectorAll('.option').forEach(b=>b.disabled=true);button.classList.add('correct');pass(q)}
function checkTranslation(){const q=flat[index],values=[...document.querySelectorAll('.inline-input')].map(x=>x.value);attempted.add(q.id);const ok=values.length===q.answers.length&&values.every((v,i)=>norm(v)===norm(q.answers[i]));if(!ok){recordWrong(q,values.join(' / '));$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 尚有空格不正確，請修正後再檢查。';return}if(!wrong.has(q.id))firstTry.add(q.id);document.querySelectorAll('.inline-input').forEach(x=>x.disabled=true);pass(q)}
function pass(q){$('#feedback').className='feedback ok';$('#feedback').textContent='✅ 正確！';$('#reference').classList.remove('hidden');$('#reference').textContent='完整句：'+q.sentence;$('#check').classList.add('hidden');$('#next').classList.remove('hidden');$('#voiceBox').classList.remove('hidden');$('#voiceTarget').textContent=q.sentence;$('#voiceResult').className='voice-result';$('#voiceResult').textContent='尚未進行朗讀評分。';speak(q.sentence)}
function similarity(a,b){a=norm(a).replace(/[^a-z0-9' ]/g,'').split(' ').filter(Boolean);b=norm(b).replace(/[^a-z0-9' ]/g,'').split(' ').filter(Boolean);const used=new Set;let hit=0;for(const w of a){const j=b.findIndex((x,i)=>x===w&&!used.has(i));if(j>=0){hit++;used.add(j)}}return Math.round(100*hit/Math.max(a.length,b.length,1))}
function startMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('#voiceResult').textContent='此瀏覽器不支援語音辨識，建議使用 Chrome。';return}recognition=new SR;recognition.lang='en-US';recognition.interimResults=false;$('#voiceResult').textContent='正在聆聽，請朗讀完整句子…';recognition.onresult=e=>{const said=e.results[0][0].transcript,target=flat[index].sentence,score=similarity(target,said);$('#voiceResult').className='voice-result '+(score>=80?'good':'retry');$('#voiceResult').textContent=`辨識：${said}\n正確率：${score}%`};recognition.onerror=e=>$('#voiceResult').textContent='語音辨識未完成：'+e.error;recognition.start()}
function finish(){try{recognition?.abort()}catch(e){}speechSynthesis?.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');const rows=[...wrong.values()];$('#summary').innerHTML=`<div class="stat">實際作答<b>${attempted.size}</b></div><div class="stat">一次答對<b>${firstTry.size}</b></div><div class="stat">曾答錯<b>${rows.length}</b></div>`;$('#wrongList').innerHTML=rows.length?rows.map((r,i)=>`<div class="wrong-card"><b>${i+1}. 第 ${esc(r.q.id)} 題</b><p>${esc(r.q.prompt||`第 ${r.q.blank} 格`)}</p><p>作答：${r.attempts.map(esc).join('；')}</p><p>答案：${esc(r.q.answer||r.q.answers.join(' / '))}</p></div>`).join(''):(attempted.size?'<div class="feedback ok">🎉 本輪全部一次答對！</div>':'<p class="muted">本輪尚未作答，因此不登錄成績。</p>');$('#download').classList.toggle('hidden',!rows.length);if(attempted.size)document.dispatchEvent(new CustomEvent('quiz-result-ready',{detail:{total:attempted.size,correct:firstTry.size,wrong:rows.length,mistakeQuestionNumbers:rows.map(r=>r.q.id).join(', ')}}))}
