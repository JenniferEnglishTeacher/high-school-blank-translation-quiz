  <script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 3｜詞類變化","mode":"fill","questions":[{"id":1,"question":"The ____________ (average) age of the workers at this company is thirty-five, so you are probably the youngest one here.","answers":["average"],"source":"All in One","explanation":"正確字詞為 average，意思是「平均的」；請將答案補入後朗讀完整例句。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":2,"question":"Just as he was about to give up any hope of being saved, the sailor saw a boat in the ____________ (distant).","answers":["distance"],"source":"All in One","explanation":"正確字詞為 distance，意思是「距離」；請將答案補入後朗讀完整例句。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":3,"question":"The children stared at the magician in ____________ (amazing) when he suddenly pulled a rabbit out of his hat.","answers":["amazement"],"source":"All in One","explanation":"正確字詞為 amazement；請將答案補入後朗讀完整例句。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":4,"question":"John decided to drop out of school for ____________ (variety) reasons. One of them was that he had to get a job to support his family.","answers":["various"],"source":"龍騰自命題","explanation":"John因為種種原因而決定輟學。其中一個原因是他必須工作養家活口。variety 為名詞，various為它的形容詞。","explanationSource":"source"},{"id":5,"question":"Wendy likes to go to the ice cream store, for there are ____________ (variety) flavors of ice cream to choose from.","answers":["various"],"source":"All in One","explanation":"正確字詞為 various，意思是「各式各樣的」；請將答案補入後朗讀完整例句。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":6,"question":"The wonderful scenery in the countryside ____________ (impressive) me so much that I will never forget it.","answers":["impressed"],"source":"All in One","explanation":"正確字詞為 impressed，意思是「使人留下深刻印象」；請將答案補入後朗讀完整例句。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":7,"question":"After chatting with Amy, I was left with the ____________ (impressive) that she was not satisfied with her life.","answers":["impression"],"source":"龍騰自命題","explanation":"和Amy聊天後，她留給我的印象是她對自己的生活並不滿意。impressive的名詞為impression。","explanationSource":"source"},{"id":8,"question":"Tony was ____________ (awake) by the sound of his neighbors quarrelling in the middle of the night.","answers":["awoken"],"source":"龍騰自命題","explanation":"Tony半夜被鄰居的爭吵聲吵醒。awake為動詞，其動詞變化型態為；awake; awoke; awoken; awaking，此處為被動語態，故應用過去分詞awoken。","explanationSource":"source"},{"id":9,"question":"Many local businesses are fighting for ____________ (survive) due to the tough economic conditions.","answers":["survival"],"source":"龍騰自命題","explanation":"由於經濟情況艱困，有許多在地企業正為生存而戰。fight for survival 為生存而戰","explanationSource":"source"},{"id":10,"question":"In the ____________ (distance) future, I am going to have a house and a farm on the mountain.","answers":["distant"],"source":"龍騰自命題","explanation":"在遙遠的將來我將會在山上擁有一棟房子和一座農場。此處應填入形容詞distant來修飾名詞future；in the distant future 遙遠的將來","explanationSource":"source"},{"id":11,"question":"Hearing the news that her son had been released by the kidnappers, the mother ____________ (breath) a great sigh of relief.","answers":["breathed"],"source":"龍騰自命題","explanation":"聽到她兒子已被綁匪釋放的消息，這位媽媽鬆了好大一口氣。breath為名詞，breathe為動詞；breathe a sigh of relief 鬆了一口氣","explanationSource":"source"},{"id":12,"question":"The salesperson ____________ (impressive) his customers with his honesty and thoughtfulness.","answers":["impressed"],"source":"龍騰自命題","explanation":"這位銷售員以誠實和體貼讓他的顧客感到印象深刻。本題應填入動詞。","explanationSource":"source"},{"id":13,"question":"On ____________ (average), people in Taiwan work 40 hours every week.","answers":["average"],"source":"龍騰自命題","explanation":"平均而言，在臺灣人們每星期工作40小時。on average 平均而言","explanationSource":"source"},{"id":14,"question":"It was ____________ (amaze) to see hundreds of sea lions resting on the rocks.","answers":["amazing"],"source":"龍騰自命題","explanation":"看到數百隻海獅在岩石上休息真令人感到驚奇。to see hundreds of...這件事令人感到驚奇，故應填入現在分詞amazing當形容詞用。","explanationSource":"source"},{"id":15,"question":"This new mouthwash promises to get rid of bad ____________ (breathe) no matter what you eat.","answers":["breath"],"source":"龍騰自命題","explanation":"這款新的漱口水保證，無論你吃什麼都可以去除口臭。bad為形容詞，後面要加名詞breath。","explanationSource":"source"}]};</script>
