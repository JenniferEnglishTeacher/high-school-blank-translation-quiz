<script>window.QUIZ_CONFIG={"title": "國中會考文法歷屆試題｜關係代名詞", "mode": "mcq", "questions": [{"id": 1, "question": "At dinner time, I often enjoy telling Mom everything ______ at school.", "options": ["happened", "was happening", "that happened", "which happening"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜everything＋that＋V（關代 that 作主詞不可省）", "explanation": "【句型】N（everything）＋ that ＋ V，關係代名詞 that 在子句中當主詞時不可省略。\n【分析】telling Mom everything 後要用關係子句修飾 everything，且子句缺主詞，需用 that happened「在學校發生的每件事」。\n【其他選項】(A)(B) 缺關係代名詞，句中會出現兩個主要動詞；(D) which 後需接完整動詞，happening 不行，且 everything 通常用 that。\n【例句】Please tell me everything that you saw.", "explanationSource": "source"}, {"id": 2, "question": "I'll never forget the people ______ helped me during the trip.", "options": ["who", "which", "they", "whom they"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 1 題）", "explanation": "先行詞 people 是人，關代當主詞用 who。", "explanationSource": "supplemental"}, {"id": 3, "question": "Is there anything ______ wrong with your computer?", "options": ["is", "that is", "which being", "it is"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 1 題）", "explanation": "anything 後接關係子句，關代 that 當主詞不能省，用 that is。", "explanationSource": "supplemental"}, {"id": 4, "question": "This is the bus ______ to the airport.", "options": ["goes", "going to it", "that goes", "which go"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 1 題）", "explanation": "先行詞 the bus 單數，關代當主詞不可省，用 that goes。", "explanationSource": "supplemental"}, {"id": 5, "question": "Fiona loves listening to her children sing songs ______ at school.", "options": ["are learned", "that learned", "they learned", "that they are learned"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜關係代名詞省略（受格）＋主動", "explanation": "【句型】N + (that/which) + S + V：受格關係代名詞可省略。\n【分析】songs (that) they learned at school「他們在學校學的歌」，they 是學歌的人，songs 是 learned 的受詞，that 被省略 → they learned。\n【其他選項】(A) 少了關係代名詞，句中出現兩個動詞；(B) songs that learned 表示「歌學了…」，主動語意錯；(D) they are learned 表「孩子們被學」，語意錯。\n【例句】This is the bike my dad bought for me.\n備註：考點主要是關係代名詞省略（主動），非被動語態。", "explanationSource": "source"}, {"id": 6, "question": "The cake ______ for my birthday was delicious.", "options": ["Mom made", "that made", "was made", "Mom was made"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 5 題）", "explanation": "the cake (that) Mom made，省略受格關代 that。", "explanationSource": "supplemental"}, {"id": 7, "question": "The book ______ last week is very interesting.", "options": ["borrowed I", "I borrowed", "that borrowed", "was borrowed"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 5 題）", "explanation": "the book (that) I borrowed，省略受格關代，語序為 S + V。", "explanationSource": "supplemental"}, {"id": 8, "question": "Do you like the songs ______ in music class?", "options": ["are sung", "that sang", "we sang", "that we are sung"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 5 題）", "explanation": "the songs (that) we sang，省略受格關代 that。", "explanationSource": "supplemental"}, {"id": 9, "question": "The medicine I ______ you this morning should be taken three times a day.", "options": ["to give", "given", "giving", "gave"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜關係代名詞省略＋過去式主動 gave", "explanation": "【句型】N + (that) + S + V...：受格關係代名詞省略後，子句仍需有完整動詞。\n【分析】The medicine (that) I gave you this morning，主詞 I 是「給」的人 → 主動；this morning 已發生 → 過去式 gave。整句主要動詞是 should be taken。\n【其他選項】(A)(C) 不定詞、現在分詞不能當子句的動詞；(B) given 是 p.p.，I given 缺 be/have，且語意應為主動。\n【例句】The shoes I bought last week are too small.\n備註：本題選項考主動/被動判斷，但句構重點是關係代名詞省略。", "explanationSource": "source"}, {"id": 10, "question": "The pictures you ______ me last week were beautiful.", "options": ["send", "sent", "sending", "to send"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 9 題）", "explanation": "the pictures (that) you sent me，last week 用過去式 sent。", "explanationSource": "supplemental"}, {"id": 11, "question": "The movie we ______ last night was really scary.", "options": ["watched", "watching", "were watched", "to watch"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 9 題）", "explanation": "the movie (that) we watched，主動過去式 watched。", "explanationSource": "supplemental"}, {"id": 12, "question": "The sweater my grandma ______ for me last winter is still warm.", "options": ["making", "to make", "was made", "made"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 9 題）", "explanation": "the sweater (that) my grandma made，奶奶「做」毛衣 → 主動過去式 made。", "explanationSource": "supplemental"}, {"id": 13, "question": "All the excuses Nick made ______ a lot about how much he hates to do the job.", "options": ["say", "saying", "which say", "to say"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜省略關代的形容詞子句 + 主詞動詞一致", "explanation": "【句型】先行詞 + (that/which) + S + V（受格關代可省略）；整句主詞仍是先行詞，要接主要動詞。\n【分析】Nick made 是省略 that 的形容詞子句，修飾 All the excuses；句子還缺主要動詞，主詞 excuses 是複數，所以用 say。\n【其他選項】(B) saying、(D) to say 不能當主要動詞；(C) which say 會變成另一個形容詞子句，整句仍缺主要動詞。\n【例句】The books my aunt gave me are very interesting.", "explanationSource": "source"}, {"id": 14, "question": "The cookies Linda baked yesterday ______ really delicious.", "options": ["tasting", "taste", "tastes", "to taste"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 13 題）", "explanation": "Linda baked yesterday 為省略關代的子句，主詞 cookies 複數，用 taste。", "explanationSource": "supplemental"}, {"id": 15, "question": "The boy you met at the party ______ my cousin.", "options": ["is", "are", "being", "who is"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 13 題）", "explanation": "主詞 The boy 單數，主要動詞用 is。", "explanationSource": "supplemental"}, {"id": 16, "question": "The questions the teacher asked today ______ too hard for most of us.", "options": ["was", "being", "were", "which were"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 13 題）", "explanation": "主詞 questions 複數，過去式用 were。", "explanationSource": "supplemental"}, {"id": 17, "question": "Students ______ to go on the school trip should ask their parents first.", "options": ["who want", "want", "who they want", "what they want"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜主格關代 who + 複數動詞", "explanation": "【句型】先行詞（人）+ who + V（主格關代，動詞與先行詞一致）。\n【分析】句子主要動詞是 should ask，空格須是修飾 Students 的形容詞子句 → who want（想去校外教學的學生）；Students 複數，用 want。\n【其他選項】(B) want 會造成一句兩個動詞；(C) who 已當主詞，不可再加 they；(D) what 不能有先行詞，且後面多了 they。\n【例句】People who like music often go to concerts.", "explanationSource": "source"}, {"id": 18, "question": "The boy ______ is talking to Ms. Lin is my cousin.", "options": ["he", "who", "which", "what"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 17 題）", "explanation": "先行詞人 + 主格 who。", "explanationSource": "supplemental"}, {"id": 19, "question": "Kids ______ eat too much candy may have bad teeth.", "options": ["who", "which", "they", "what"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 17 題）", "explanation": "先行詞 Kids 是人 → who。", "explanationSource": "supplemental"}, {"id": 20, "question": "Anyone who ______ to join the club can sign up today.", "options": ["want", "wanting", "wants", "to want"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 17 題）", "explanation": "anyone 視為單數 → wants。", "explanationSource": "supplemental"}, {"id": 21, "question": "Actor David Piper became tired of talking about the movie ______ after he was interviewed about it many times.", "options": ["he is famous", "that he is famous", "that is famous for", "he is famous for"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜受格關代省略（the movie he is famous for）", "explanation": "【句型】先行詞 + (that/which) + S + V + 介系詞；受格關代可省略。be famous for + N = 因…而出名。\n【分析】原意為 he is famous for the movie → the movie (that) he is famous for，省略受格關代 that，介系詞 for 留在句尾。\n【其他選項】(A) 少了 for，the movie 無法成為 famous 的受詞；(B) 同樣少了 for；(C) that is famous for 表「電影因…出名」，for 後缺受詞且主詞不對。\n【例句】This is the snack Tainan is famous for.", "explanationSource": "source"}, {"id": 22, "question": "This is the song ______ I told you about yesterday.", "options": ["that", "who", "what", "it"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 21 題）", "explanation": "先行詞物 + 受格關代 that，about 留句尾。", "explanationSource": "supplemental"}, {"id": 23, "question": "The girl ______ Sam is talking with is my sister.", "options": ["which", "she", "who", "what"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 21 題）", "explanation": "先行詞人 + 受格 who/that，with 留句尾。", "explanationSource": "supplemental"}, {"id": 24, "question": "Is this the dictionary ______?", "options": ["you are looking", "you are looking for", "you are looking for it", "that you are looking it"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 21 題）", "explanation": "look for the dictionary → 關係子句保留 for，不重複 it。", "explanationSource": "supplemental"}, {"id": 25, "question": "The tall man ______ at the bookstore is my high school teacher.", "options": ["you saw", "who saw", "you saw him", "that you saw him"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜受格關代省略（the man you saw）", "explanation": "【句型】先行詞 + (who/whom/that) + S + V；受格關代可省略，子句中不再重複受詞。\n【分析】you saw the man → the man (whom) you saw，省略受格關代；主要動詞是 is。\n【其他選項】(B) who saw 表「看到（別人）的男人」，缺受詞且語意不完整；(C)(D) him 與先行詞 the man 重複，錯誤。\n【例句】The book I bought yesterday is very interesting.", "explanationSource": "source"}, {"id": 26, "question": "The cake ______ was delicious.", "options": ["Mom made", "Mom made it", "that Mom made it", "which made Mom"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 25 題）", "explanation": "Mom made the cake → the cake (that) Mom made，不重複 it。", "explanationSource": "supplemental"}, {"id": 27, "question": "The girl ______ in the park was my classmate.", "options": ["we met her", "that we met her", "we met", "who met we"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 25 題）", "explanation": "受格關代省略，不重複 her。", "explanationSource": "supplemental"}, {"id": 28, "question": "The shoes ______ last week are too small for me.", "options": ["bought them", "I bought", "I bought them", "who I bought"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 25 題）", "explanation": "the shoes (that) I bought，不重複 them。", "explanationSource": "supplemental"}, {"id": 29, "question": "I like to read comic books ______ me laugh.", "options": ["made", "to have made", "that make", "which makes"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜主格關代 that + 動詞一致", "explanation": "【句型】先行詞（物）+ that/which + V；動詞單複數與先行詞一致。\n【分析】先行詞 comic books 是複數 → that make me laugh（讓我發笑的漫畫書）。\n【其他選項】(A) made 缺關代，且時態不合；(B) to have made 不定詞語意不通；(D) which makes 動詞單數，與複數 comic books 不一致。\n【例句】I like movies that have happy endings.", "explanationSource": "source"}, {"id": 30, "question": "Tom has a dog ______ very fast.", "options": ["that run", "who run", "runs", "that runs"], "answer": 3, "answerLabel": "D", "source": "類似題 1（對應第 29 題）", "explanation": "a dog 單數 → that runs。", "explanationSource": "supplemental"}, {"id": 31, "question": "These are the photos ______ me of my childhood.", "options": ["that remind", "which reminds", "remind", "that reminds"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 29 題）", "explanation": "photos 複數 → that remind。", "explanationSource": "supplemental"}, {"id": 32, "question": "She bought a bag ______ a lot of pockets.", "options": ["that have", "which has", "it has", "who has"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 29 題）", "explanation": "a bag 單數物 → which has。", "explanationSource": "supplemental"}, {"id": 33, "question": "The movie is about a true story ______ happened in Korea in 1945.", "options": ["it", "that", "what", "when"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜主格關代 that（事物）", "explanation": "【句型】先行詞（物）+ that/which + V（主格關代）。\n【分析】空格修飾 a true story，且後面直接接動詞 happened → 需主格關代 that。\n【其他選項】(A) it 是代名詞，不能連接兩個子句；(C) what 不可接先行詞；(D) when 是關係副詞，先行詞要是時間。\n【例句】This is a house that was built 100 years ago.", "explanationSource": "source"}, {"id": 34, "question": "I read a book ______ was written by a Taiwanese writer.", "options": ["what", "who", "which", "where"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 33 題）", "explanation": "先行詞物 + 主格 which。", "explanationSource": "supplemental"}, {"id": 35, "question": "Do you remember the day ______ we first met?", "options": ["when", "what", "who", "it"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 33 題）", "explanation": "先行詞時間 the day → 關係副詞 when。", "explanationSource": "supplemental"}, {"id": 36, "question": "It is a story ______ makes everyone cry.", "options": ["who", "that", "what", "it"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 33 題）", "explanation": "先行詞物 + 主格 that。", "explanationSource": "supplemental"}, {"id": 37, "question": "James: Do you see the street vendor over there?\nPhilip: Which one?\nJames: The one ______ is wearing a hat.", "options": ["it", "he", "who", "which"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜主格關代 who（人）", "explanation": "【句型】先行詞（人）+ who + V。\n【分析】The one 指 the street vendor（小販，人），後接動詞 is wearing → 主格關代 who。\n【其他選項】(A)(B) it、he 是代名詞，不能連接子句；(D) which 用於事物，不用於人。\n【例句】The one who is singing is my sister.", "explanationSource": "source"}, {"id": 38, "question": "Amy: Which girl is your sister?\nBen: The one ______ has long hair.", "options": ["which", "she", "who", "what"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 37 題）", "explanation": "人 → who。", "explanationSource": "supplemental"}, {"id": 39, "question": "Which bike is yours? — The one ______ is next to the tree.", "options": ["who", "that", "it", "what"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 37 題）", "explanation": "物 → that/which。", "explanationSource": "supplemental"}, {"id": 40, "question": "The man ______ helped me find my wallet was very kind.", "options": ["who", "which", "he", "what"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 37 題）", "explanation": "人 + 主格 who。", "explanationSource": "supplemental"}, {"id": 41, "question": "Do you remember the girl ______ looked worried at the train station yesterday?", "options": ["who", "where", "which", "what"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜主格關代 who（人）", "explanation": "【句型】先行詞（人）+ who + V。\n【分析】先行詞 the girl 是人，後接動詞 looked → 主格關代 who。\n【其他選項】(B) where 關係副詞，先行詞須是地點；(C) which 用於事物；(D) what 不接先行詞。\n【例句】I know the boy who won the race.", "explanationSource": "source"}, {"id": 42, "question": "Do you know the woman ______ is standing at the door?", "options": ["which", "who", "where", "what"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 41 題）", "explanation": "人 → who。", "explanationSource": "supplemental"}, {"id": 43, "question": "This is the restaurant ______ we had dinner last week.", "options": ["who", "which", "what", "where"], "answer": 3, "answerLabel": "D", "source": "類似題 2（對應第 41 題）", "explanation": "地點 + 完整子句 → where。", "explanationSource": "supplemental"}, {"id": 44, "question": "I found the key ______ I lost yesterday.", "options": ["who", "where", "which", "what"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 41 題）", "explanation": "物 → which。", "explanationSource": "supplemental"}, {"id": 45, "question": "I thought the girl ______ was Kate, but it was her sister, Candy. They sounded almost the same.", "options": ["answered the phone", "she answered the phone", "who answered the phone", "and answered the phone"], "answer": 2, "answerLabel": "C", "source": "115會考｜主格關係代名詞 who（the girl who answered the phone）", "explanation": "【句型】先行詞（人）+ who + 動詞……（形容詞子句修飾前面的名詞）。\n【分析】主要句是 I thought the girl ... was Kate，空格要修飾 the girl，說明是「接電話的那個女孩」，用主格關代 who → the girl who answered the phone。\n【其他選項】(A) 少了關代，一句出現 answered 和 was 兩個動詞；(B) 多了主詞 she，無法連接兩句；(D) and 連接對等動作，the girl and answered… was 結構錯誤。\n【例句】The boy who sits next to me is good at drawing.", "explanationSource": "source"}, {"id": 46, "question": "The man ______ is talking to my dad is our new neighbor.", "options": ["he", "who", "which", "and"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 45 題）", "explanation": "先行詞 the man 是人，主格關代用 who。", "explanationSource": "supplemental"}, {"id": 47, "question": "I like the song ______ won first prize in the contest.", "options": ["which", "who", "it", "and it"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 45 題）", "explanation": "先行詞 the song 是物，主格關代用 which。", "explanationSource": "supplemental"}, {"id": 48, "question": "The students ______ in the gym are practicing for the dance show.", "options": ["they are", "and are", "who are", "who is"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 45 題）", "explanation": "先行詞 the students 為複數人，用 who are。", "explanationSource": "supplemental"}, {"id": 49, "question": "The Great Wall of China ______ is said to be the only man-made building able to be seen from space, is visited by hundreds of thousands of people from around the world.", "options": ["that", "×", ", which", ", what"], "answer": 2, "answerLabel": "C", "source": "講義錯題｜非限定用法：, which（專有名詞不可用 that）", "explanation": "【句型】專有名詞（獨一無二的先行詞）+ , which / , who…, + 主要動詞（非限定用法，前後加逗號）。\n【分析】長城只有一個，後面是補充說明，要用非限定用法「, which」；space 後面的逗號與之呼應，主要動詞是 is visited。\n【其他選項】(A) 非限定用法不能用 that；(B) 不填則 is said 與 is visited 兩個動詞沒有連接；(D) what 本身含先行詞，不能接在先行詞後面。\n【例句】Taipei 101, which is in Taipei, was once the tallest building in the world.\n備註：講義 p.289", "explanationSource": "source"}, {"id": 50, "question": "Mr. Chen, ______ teaches us math, is going to retire next year.", "options": ["that", "which", "who", "whom"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 49 題）", "explanation": "專有名詞（人）當先行詞，非限定用法用 , who，且在子句中當主詞。", "explanationSource": "supplemental"}, {"id": 51, "question": "Sun Moon Lake, ______ is in Nantou, attracts many visitors every year.", "options": ["which", "that", "what", "where"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 49 題）", "explanation": "非限定用法、先行詞是物，用 , which。", "explanationSource": "supplemental"}, {"id": 52, "question": "The book ______ I borrowed from the library is very interesting.", "options": ["what", "who", ", which", "that"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 49 題）", "explanation": "限定用法（無逗號）、先行詞是物，可用 that。", "explanationSource": "supplemental"}, {"id": 53, "question": "Vivian is trying to save the cat ______ leg is broken.", "options": ["who", "that", "which", "whose"], "answer": 3, "answerLabel": "D", "source": "講義錯題｜關係代名詞所有格 whose", "explanation": "【句型】先行詞 + whose + 名詞 + V（whose 表「…的」，所有格關代，人、物皆可用）\n【分析】空格後直接接名詞 leg，leg is broken 已有主詞和動詞，缺的是「誰的腿」→ the cat's leg，用所有格 whose。\n【其他選項】(A) who 指人，且後面要缺主詞或受詞；(B) that、(C) which 後面要接缺主詞或受詞的子句，不能直接接名詞表所有。\n【例句】I have a friend whose father is a pilot.\n備註：講義 p.291", "explanationSource": "source"}, {"id": 54, "question": "The boy ______ bike was stolen yesterday went to the police station.", "options": ["who", "whose", "which", "that"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 53 題）", "explanation": "空格後接名詞 bike，表「男孩的腳踏車」，用所有格 whose。", "explanationSource": "supplemental"}, {"id": 55, "question": "We stayed in a hotel ______ windows face the sea.", "options": ["whose", "which", "where", "that"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 53 題）", "explanation": "windows face the sea 是完整句子，表「飯店的窗戶」，用 whose。", "explanationSource": "supplemental"}, {"id": 56, "question": "Mr. Lin is the teacher ______ class won first prize in the singing contest.", "options": ["who", "which", "whom", "whose"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 53 題）", "explanation": "class 前要表「老師的班級」，用所有格關代 whose。", "explanationSource": "supplemental"}, {"id": 57, "question": "Jerry, name a park ______ we can camp safely and comfortably.", "options": ["that", "what", "which", "where"], "answer": 3, "answerLabel": "D", "source": "講義錯題｜關係副詞 where（後接完整句）", "explanation": "【句型】地點先行詞 + where（= in/at which）+ 完整句子\n【分析】we can camp safely and comfortably 有主詞、動詞，不缺主詞或受詞（camp 是不及物動詞），缺的是地點 in the park → 用 where。\n【其他選項】(A) that、(C) which 後要接缺名詞的子句；(B) what 不能接在先行詞後面。\n【例句】This is the town where my grandma grew up.\n備註：講義 p.291", "explanationSource": "source"}, {"id": 58, "question": "Do you know a restaurant ______ we can have a quiet dinner?", "options": ["which", "where", "what", "who"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 57 題）", "explanation": "we can have a quiet dinner 是完整句，缺地點，用 where。", "explanationSource": "supplemental"}, {"id": 59, "question": "Tainan is the city ______ Amy visited last summer.", "options": ["where", "what", "which", "whose"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 57 題）", "explanation": "visited 缺受詞，用關代 which，不能用 where。", "explanationSource": "supplemental"}, {"id": 60, "question": "The library ______ I often study on weekends is near my house.", "options": ["where", "which", "that", "what"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 57 題）", "explanation": "I often study on weekends 是完整句，缺地點，用 where。", "explanationSource": "supplemental"}, {"id": 61, "question": "I think the park ______ lies across from the police station is the best.", "options": ["whose", "what", "which", "where"], "answer": 2, "answerLabel": "C", "source": "講義錯題｜關係代名詞 which 當主詞（vs. where）", "explanation": "【句型】事物先行詞 + which/that + V（關代當子句主詞）\n【分析】___ lies across from the police station 缺主詞，先行詞 the park 是物 → which。\n【其他選項】(A) whose 後要接名詞；(B) what 不接先行詞；(D) where 是關係副詞，後接完整句，不能當主詞。\n【例句】The bookstore which opened last week sells comic books.\n備註：講義 p.291", "explanationSource": "source"}, {"id": 62, "question": "The museum ______ stands next to the station is free on Sundays.", "options": ["where", "which", "what", "whose"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 61 題）", "explanation": "___ stands 缺主詞，先行詞是物，用 which。", "explanationSource": "supplemental"}, {"id": 63, "question": "The beach ______ we went swimming last week was very clean.", "options": ["where", "which", "what", "that"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 61 題）", "explanation": "we went swimming 是完整句，缺地點，用 where。", "explanationSource": "supplemental"}, {"id": 64, "question": "The road ______ leads to the night market is always crowded.", "options": ["where", "whose", "that", "what"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 61 題）", "explanation": "___ leads 缺主詞，先行詞是物，用 that。", "explanationSource": "supplemental"}, {"id": 65, "question": "This is the sofa on ______ Grandpa used to sit while watching TV.", "options": ["who", "that", "which", "what"], "answer": 2, "answerLabel": "C", "source": "講義錯題｜介系詞＋which（不可用 that）", "explanation": "【句型】先行詞 + 介系詞 + which（物）/ whom（人）+ 子句；介系詞後不可用 that\n【分析】Grandpa used to sit on the sofa → 介系詞 on 提前，先行詞 the sofa 是物 → on which。\n【其他選項】(A) who 指人且不放在介系詞後；(B) that 不能放在介系詞後；(D) what 不接先行詞。\n【例句】This is the box in which I keep my letters.\n備註：講義 p.292", "explanationSource": "source"}, {"id": 66, "question": "That is the desk at ______ my brother does his homework every night.", "options": ["that", "which", "where", "who"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 65 題）", "explanation": "介系詞 at 後接事物關代用 which。", "explanationSource": "supplemental"}, {"id": 67, "question": "Ms. Chen is the person to ______ you should give this letter.", "options": ["who", "that", "whom", "which"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 65 題）", "explanation": "介系詞 to 後接人用 whom。", "explanationSource": "supplemental"}, {"id": 68, "question": "The hill ______ we had a picnic is not far from here.", "options": ["on which", "on that", "which", "on what"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 65 題）", "explanation": "we had a picnic on the hill → on which；介系詞後不能接 that。", "explanationSource": "supplemental"}, {"id": 69, "question": "The man and his pet ______ were interviewed by many reporters are famous in this country.", "options": ["which", "that", "who", "whose"], "answer": 1, "answerLabel": "B", "source": "講義錯題｜先行詞「人＋動物」用 that", "explanation": "【句型】先行詞同時有人和動物/物 → 關代只能用 that\n【分析】先行詞 the man and his pet 包含人和動物，且 ___ were interviewed 缺主詞 → that。\n【其他選項】(A) which 只指物；(C) who 只指人；(D) whose 後要接名詞。\n【例句】Look at the girl and her dog that are running in the park.\n備註：講義 p.293", "explanationSource": "source"}, {"id": 70, "question": "The farmer and his cows ______ live on the hill appeared on TV.", "options": ["who", "which", "that", "whose"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 69 題）", "explanation": "先行詞為人＋動物，用 that。", "explanationSource": "supplemental"}, {"id": 71, "question": "We talked about the singers and the songs ______ we liked best.", "options": ["that", "who", "which", "whom"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 69 題）", "explanation": "先行詞為人＋物，用 that。", "explanationSource": "supplemental"}, {"id": 72, "question": "The old woman ______ cat is lost is crying.", "options": ["that", "whose", "which", "who"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 69 題）", "explanation": "cat 前表「老婦人的貓」，用所有格 whose。", "explanationSource": "supplemental"}, {"id": 73, "question": "We make sure both the pets and their owners ______ come to stay at our hotel will be taken the best care of.", "options": ["who", "which", "that", "they"], "answer": 2, "answerLabel": "C", "source": "講義錯題｜先行詞「動物＋人」用 that", "explanation": "【句型】先行詞同時有人和動物/物 → 關代用 that\n【分析】先行詞 the pets and their owners 包含動物和人，___ come 缺主詞 → that。\n【其他選項】(A) who 只指人；(B) which 只指物或動物；(D) they 是代名詞，不能連接子句，會造成句中兩個動詞 come、will be 無連接。\n【例句】We saw the boy and his horse that won the race.\n備註：講義 p.337", "explanationSource": "source"}, {"id": 74, "question": "The kids and the dogs ______ were playing on the grass looked happy.", "options": ["who", "which", "they", "that"], "answer": 3, "answerLabel": "D", "source": "類似題 1（對應第 73 題）", "explanation": "先行詞為人＋動物，用 that。", "explanationSource": "supplemental"}, {"id": 75, "question": "The cat ______ is sleeping on the sofa belongs to my aunt.", "options": ["who", "which", "whose", "where"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 73 題）", "explanation": "先行詞只有動物 cat，缺主詞，用 which。", "explanationSource": "supplemental"}, {"id": 76, "question": "The writer and the books ______ he talked about are popular among teens.", "options": ["that", "who", "whose", "they"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 73 題）", "explanation": "先行詞為人＋物，用 that。", "explanationSource": "supplemental"}]};</script><script src="longteng-b1u5-quiz.js?v=20261027-2"></script><script>document.querySelector("#description").textContent="共 76 題（會考歷屆＋講義錯題 19 題＋類似題 57 題）｜選答後顯示中文解析｜答錯可重做並下載錯題";</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
