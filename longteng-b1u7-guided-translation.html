<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="龍騰普高 Book 1 Unit 7 互動測驗，附解析、整句朗讀與必做 STT 朗讀評分。"><title>龍騰普高 Book 1 Unit 7｜引導式翻譯</title><link rel="stylesheet" href="longteng-b1u5-quiz.css?v=20261026-3"><link rel="stylesheet" href="longteng-vocab-required-pronunciation.css?v=20261026-4"></head><body><main class="wrap"><header class="hero"><a class="btn" href="dashboard.html">← 回到 Dashboard</a><h1 id="title">龍騰普高 Book 1 Unit 7｜引導式翻譯</h1><p id="description" class="note"></p></header><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn" type="button">全選</button><button id="none" class="btn" type="button">取消全選</button><button id="random" class="btn" type="button">隨機 20 題</button><span id="picked" class="note"></span></div><div id="list"></div><label class="pick"><input id="shuffle" type="checkbox"> 隨機排列題目</label><button id="start" class="btn primary" type="button">開始測驗 →</button></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><div class="actions"><button id="check" class="btn primary" type="button">檢查答案</button><button id="next" class="btn primary hidden" type="button">下一題 →</button><button id="finish" class="btn danger" type="button">結束練習</button></div></section><section id="result" class="card hidden"><h2>練習結果</h2><div id="summary" class="summary"></div><h2>錯題紀錄</h2><div id="wrongList"></div><div class="actions"><button id="retry" class="btn primary" type="button">重做錯題</button><button id="download" class="btn" type="button">下載 DOCX 錯題</button><button id="restart" class="btn" type="button">重新選題</button></div></section></main><script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 7｜引導式翻譯","mode":"multi","questions":[{"id":1,"zh":"雨一停，孩子們就衝出去在陽光明媚的公園裡玩耍。","question":"①____________ ②____________ ③____________ the rain stopped, the children rushed outside to play in the sunny park.","answers":["As","soon","as"],"source":"課本例句填空","explanation":"中文意思如題幹；本題依序填入 As soon as。來源未附逐題解析。"},{"id":2,"zh":"這位運動員在游泳比賽中的勝利來自於好幾個月的辛勤努力。","question":"The athlete’s victory at the swim race ①____________ ②____________ ③____________ many months of hard work.","answers":["came","out","of"],"source":"課本例句填空","explanation":"中文意思如題幹；本題依序填入 came out of。來源未附逐題解析。"},{"id":3,"zh":"當Sam在觀看籃球比賽時，他激動得無法自持，呼喊得比體育館裡的其他人都要大聲。","question":"While Sam was watching the basketball game, he ①____________ ②____________ ③____________ and cheered louder than everyone else in the stadium.","answers":["got","carried","away"],"source":"課本例句填空","explanation":"中文意思如題幹；本題依序填入 got carried away。來源未附逐題解析。"},{"id":4,"zh":"在看電影時，我陶醉在兩位主角之間感人的愛情故事。","question":"During the movie, I ①____________ ②____________ ③____________ by the touching love story between the two main characters.","answers":["was","carried","away"],"source":"課本例句填空","explanation":"中文意思如題幹；本題依序填入 was carried away。來源未附逐題解析。"},{"id":5,"zh":"Betsy非常期待今年夏天的第一次歐洲之旅。","question":"Betsy is really ①____________ ②____________ ③___________ her first trip to Europe this summer.","answers":["looking","forward","to"],"source":"課本例句填空","explanation":"中文意思如題幹；本題依序填入 looking forward to。來源未附逐題解析。"},{"id":6,"zh":"Joe在一家義大利餐廳擔任廚師來謀生。","question":"Joe ①____________ ②____________ ③____________ by working as a cook in an Italian restaurant.","answers":["makes","a","living"],"source":"課本例句填空","explanation":"中文意思如題幹；本題依序填入 makes a living。來源未附逐題解析。"},{"id":7,"zh":"David在房子裡到處尋找他丟失的手機，但找不到。","question":"David ①____________ ②____________ his lost phone all over the house but couldn’t find it.","answers":["looked","for"],"source":"課本例句填空","explanation":"中文意思如題幹；本題依序填入 looked for。來源未附逐題解析。"},{"id":8,"zh":"Emily每天有大量的工作要做，所以她與家人相處的時間很少。","question":"Emily spends little time with her family because she has ①____________ ②____________ work to do every day.","answers":["tons","of"],"source":"課本例句填空","explanation":"中文意思如題幹；本題依序填入 tons of。來源未附逐題解析。"},{"id":9,"zh":"演唱會因為颱風而取消的消息讓那些男孩沮喪，他們已經期待很久了。","question":"The news that the concert has been cancelled because of the typhoon has depressed the boys, who have been ①____________ ②____________ ③____________ it for a long time.","answers":["looking","forward","to"],"source":"All in One","explanation":"中文意思如題幹；本題依序填入 looking forward to。來源未附逐題解析。"},{"id":10,"zh":"身為一位自由作家，Tina靠賣文章給一些出版社來維生。","question":"As a freelance writer, Tina ①____________ a ②____________ by selling her articles to some publishers.","answers":["makes||made","living"],"source":"All in One","explanation":"中文意思如題幹；本題依序填入 makes||made living。來源未附逐題解析。"},{"id":11,"zh":"為了有更多機會，Jason搬到大城市找工作。","question":"For more opportunities, Jason moved to a big city to ①____________ ②____________ a job.","answers":["look","for"],"source":"All in One","explanation":"中文意思如題幹；本題依序填入 look for。來源未附逐題解析。"},{"id":12,"zh":"在那窮困的印度村莊，婦女藉由給遊客編織籃子謀生。","question":"The women in the poor Indian village ①____________ ②____________ ③____________ by weaving baskets for tourists.","answers":["make||made","a","living"],"source":"習作簿","explanation":"中文意思如題幹；本題依序填入 make||made a living。來源未附逐題解析。"},{"id":13,"zh":"很難想像在如此惡劣的情境中能產生好的結果。","question":"It is hard to imagine that a good result can ①____________ ②____________ ③____________ such a bad situation.","answers":["come","out","of"],"source":"習作簿","explanation":"中文意思如題幹；本題依序填入 come out of。來源未附逐題解析。"},{"id":14,"zh":"Sally和Paul用IG聊過幾次，但他們從未真正見面。","question":"Sally chatted with Paul on Instagram ①____________ ②____________ times, but they never actually met.","answers":["a","few"],"source":"三合一學習手冊","explanation":"中文意思如題幹；本題依序填入 a few。來源未附逐題解析。"},{"id":15,"zh":"Henry在2021年第一次上網課。那就是新冠肺炎蔓延全臺的時候。","question":"Henry took an online class for the first time in 2021. ①____________ ②____________ COVID-19 was spreading throughout Taiwan.","answers":["That’s","when"],"source":"三合一學習手冊","explanation":"中文意思如題幹；本題依序填入 That’s when。來源未附逐題解析。"},{"id":16,"zh":"我們不確定何時讓派對開始，因為樂團還沒到。","question":"We are not sure ①____________ ②____________ ③____________ ④____________ ⑤____________ because the band is not here yet.","answers":["when","to","start||begin","the","party"],"source":"三合一學習手冊","explanation":"中文意思如題幹；本題依序填入 when to start||begin the party。來源未附逐題解析。"},{"id":17,"zh":"古騰堡的網站上有大量的藏書供人免費下載。","question":"There are ①____________ ②____________ books in Gutenberg’s collection for people to download for free.","answers":["tons","of"],"source":"三合一學習手冊","explanation":"中文意思如題幹；本題依序填入 tons of。來源未附逐題解析。"},{"id":18,"zh":"在派對上，Aaron激動得無法自持，並跳了一整夜的舞。","question":"At the party, Aaron ①____________ ②____________ ③____________ and danced all night.","answers":["got||was","carried","away"],"source":"三合一學習手冊","explanation":"中文意思如題幹；本題依序填入 got||was carried away。來源未附逐題解析。"},{"id":19,"zh":"每當Sabrina聽古典音樂時，她都會陶醉於古典音樂之美。","question":"Whenever Sabrina listens to classical music, she ①____________ ②____________ ③____________ by its beauty.","answers":["gets||is","carried","away"],"source":"三合一學習手冊","explanation":"中文意思如題幹；本題依序填入 gets||is carried away。來源未附逐題解析。"},{"id":20,"zh":"一些最持久的友誼來自於共同經歷的困境。","question":"Some of the most enduring friendships ①____________ ②____________ ③____________ shared difficulties.","answers":["come","out","of"],"source":"三合一學習手冊","explanation":"中文意思如題幹；本題依序填入 come out of。來源未附逐題解析。"},{"id":21,"zh":"Matt承諾一回到家就打電話給Betty。","question":"Matt promised to call Betty ①____________ ②____________ ③____________ he arrived home.","answers":["as","soon","as"],"source":"三合一學習手冊","explanation":"中文意思如題幹；本題依序填入 as soon as。來源未附逐題解析。"},{"id":22,"zh":"Vivian在巴黎的旅行期間，花了幾天時間尋找完美的紀念品帶回家。","question":"During her trip to Paris, Vivian spent days ①(l)____________ ②____________ the perfect souvenir to take back home.","answers":["looking","for"],"source":"三合一學習手冊","explanation":"中文意思如題幹；本題依序填入 looking for。來源未附逐題解析。"},{"id":23,"zh":"Emma決定試著以自由撰稿人的身分謀生。","question":"Emma decided to try to ①____________ ②____________ ③____________ as a freelance writer.","answers":["make","a","living"],"source":"三合一學習手冊","explanation":"中文意思如題幹；本題依序填入 make a living。來源未附逐題解析。"},{"id":24,"zh":"Chris期待看到那部關於哥吉拉的新電影。","question":"Chris ①____________ ②____________ ③____________ seeing the new movie about Godzilla.","answers":["looks","forward","to"],"source":"三合一學習手冊","explanation":"中文意思如題幹；本題依序填入 looks forward to。來源未附逐題解析。"},{"id":25,"zh":"Jerry的單車一被修好，他就騎上它去找他最好的朋友Daniel。","question":"①____________ ②____________ ③____________ Jerry ④____________ his bicycle ⑤____________, he got on it to visit his best friend, Daniel.","answers":["As","soon","as","had","repaired||fixed"],"source":"龍騰自命題","explanation":"as soon as 一……就……；have + O + p.p. 使……被……，由句子後半部可以得知，時態要用過去式，故要把have改為had。"},{"id":26,"zh":"不好意思，我正在尋找國立故宮博物院。你能告訴我如何抵達嗎？","question":"Excuse me, I am ①____________ ②____________ the National Palace Museum. Can you tell me ③____________ ④____________ get there?","answers":["looking","for","how","to"],"source":"龍騰自命題","explanation":"look for 尋找；因為在空格前面有be動詞，所以要把look改為現在分詞looking；National Palace Museum 國立故宮博物院；how to VR 如何……，在此為名詞片語，當作tell的受詞。"},{"id":27,"zh":"為了謀生以及養家活口，這個男人別無選擇，只好每天做大量的工作。","question":"For the purpose of ①____________ ②____________ ③____________ and supporting his family, the man has no choice but to do ④t____________ ⑤____________ work every day.","answers":["making","a","living","tons","of"],"source":"龍騰自命題","explanation":"for the purpose of N/V-ing 為了……；make a living 謀生；have no choice but to VR 別無選擇，只好……；tons of 大量的"},{"id":28,"zh":"Linda陶醉於她最愛的演員的魅力中，並且期待再次親自與他碰面。","question":"Linda was ①____________ ②____________ by the charm of her favorite actor and ③____________ ④____________ ⑤____________ meeting him in person again.","answers":["carried","away","looked","forward","to"],"source":"龍騰自命題","explanation":"be carried away 陶醉；charm 魅力；look forward to N/V-ing 期待……，由於時態是過去式，所以要用looked；in person 親自"},{"id":29,"zh":"在贏得比賽後，Eric沉浸在勝利的喜悅中無法自持，而眼淚流下他的臉頰。","question":"After winning the game, Eric ①____________ ②____________ ③____________ in triumph, and tears rolled down his cheeks.","answers":["was||got","carried","away"],"source":"龍騰自命題","explanation":"be/get carried away 激動得無法自持，由於時態是過去式，故動詞要填入was或got；roll down 流下；cheek 臉頰"},{"id":30,"zh":"那名搶匪一跑出便利商店，警方就當場逮捕他。","question":"①____________ ②____________ ③____________ the robber ran out of the convenience store, the police arrested him on the spot.","answers":["As","soon","as"],"source":"龍騰自命題","explanation":"as soon as 一……就……；convenience store 便利商店；arrest 逮捕；on the spot 當場"},{"id":31,"zh":"經過幾小時的討論，會議終於得出了一個可行的解決方案。","question":"After hours of discussion, a viable solution finally ①____________ ②____________ ③____________ the meeting.","answers":["came","out","of"],"source":"龍騰自命題","explanation":"viable 可行的；solution 解決方案；come out of 由……產生，由於解決方案已經產生，時態應使用過去式，所以要用came。"},{"id":32,"zh":"Naomi閉上眼睛，陶醉於這個樂團令人驚嘆的演出。","question":"Naomi closed her eyes and ①____________ ②____________ ③____________ by the band’s amazing performance.","answers":["was||got","carried","away"],"source":"龍騰自命題","explanation":"be/get carried away 陶醉，由於時態是過去式，故動詞要填入was或got。"},{"id":33,"zh":"Gary和他妹妹正在期待除夕，因為到時候他們能夠得到紅包。","question":"Gary and his sister ①____________ ②____________ ③____________ ④____________ Lunar New Year’s Eve because they can get red envelopes then.","answers":["are","looking","forward","to"],"source":"龍騰自命題","explanation":"look forward to N/V-ing 期待……，根據題目所述，可以得知時態應為現在進行式，故答案要填入are looking forward to。"},{"id":34,"zh":"這個村莊裡的大多數居民以種植稻米、蔬菜和水果來謀生。","question":"Most of the people in this village ①____________ ②____________ ③____________ by growing rice, vegetables, and fruit.","answers":["make||made","a","living"],"source":"龍騰自命題","explanation":"make a living 謀生，由於句中沒有指明時態，所以動詞時態可以用現在式或過去式。"},{"id":35,"zh":"上週，Derek的爸爸給他一輛新單車，但是昨晚被偷了。因此，他現在正在鄰近地區尋找它。","question":"Last week, Derek’s father gave him a new bicycle, but it was stolen last night. Therefore, he ①____________ ②____________ ③____________ it now in the neighborhood.","answers":["is","looking","for"],"source":"龍騰自命題","explanation":"look for 尋找，由於句子提到的時態是現在進行式，所以答案要填入is looking for。"},{"id":36,"zh":"這張通知會告訴你，當我們這週六去野餐時，要帶什麼東西，以及在哪裡與其他人碰面。","question":"This notice will tell you ①____________ ②____________ ③____________ and ④____________ to meet the others when we go on a picnic this Saturday.","answers":["what","to","bring","where"],"source":"龍騰自命題","explanation":"notice 通知；what to bring與where to meet others都是由名詞子句簡化成的名詞片語，當作tell的受詞；go on a picnic 去野餐"},{"id":37,"zh":"Ryan最近必須每天加班，因為他在月底前有大量的工作要完成。","question":"Ryan has to work overtime every day recently because he has ①t____________ ②____________ work to complete by the end of this month.","answers":["tons","of"],"source":"龍騰自命題","explanation":"work overtime 加班；tons of 大量的；complete 完成"},{"id":38,"zh":"在讓牙醫把他的壞牙拔掉之後，Craig覺得舒服多了。","question":"Craig felt much better after he ①____________ his bad tooth ②____________ out by the dentist.","answers":["had","pulled"],"source":"龍騰自命題","explanation":"have + O + p.p. 使……被……，由於時態是過去式，故使用had。"},{"id":39,"zh":"Tracy期待著今年夏天和爸媽一起到日本的京都旅行。","question":"Tracy ①____________ ②____________ ③____________ taking a trip to Kyoto, Japan, with her parents this summer.","answers":["looks","forward","to"],"source":"龍騰自命題","explanation":"look forward to N/V-ing 期待……；take a trip to... 到……旅行"},{"id":40,"zh":"Helen在一家中餐館當服務生來謀生。","question":"Helen ①____________ ②____________ ③____________ by working as a waitress at a Chinese restaurant.","answers":["makes||made","a","living"],"source":"龍騰自命題","explanation":"make a living 謀生，由於本句沒有明確指明時態，因此動詞可以用現在式或過去式；by V-ing 藉由……方式"},{"id":41,"zh":"Alex一抵達辦公室，就發現自己的皮夾不見了。","question":"Alex found that his wallet was missing ①____________ ②____________ ③____________ he got to his office.","answers":["as","soon","as"],"source":"龍騰自命題","explanation":"as soon as 一……就……；get to 到達"},{"id":42,"zh":"那位可憐的媽媽正在尋找她失蹤的兒子，有許多人正在試著幫助她。","question":"The poor mother is ①____________ ②____________ her missing son, and many people are trying to help her.","answers":["looking","for"],"source":"龍騰自命題","explanation":"look for 尋找，因為空格前面有be動詞，故知時態為現在進行式，要把look改為looking。"},{"id":43,"zh":"Penny今晚不能跟我們去購物，因為她有大量的工作要做。","question":"Penny can’t go shopping with us tonight, for she has ①t____________ ②____________ work to do.","answers":["tons","of"],"source":"龍騰自命題","explanation":"go shopping 去購物；tons of 大量的"},{"id":44,"zh":"當Thomas第一次嘗試拉小提琴時，它只有發出一些可怕的噪音而已。","question":"When Thomas tried to play the violin for the first time, only some terrible noises ①____________ ②____________ ③____________ it.","answers":["came","out","of"],"source":"龍騰自命題","explanation":"for the first time 第一次；come out of 由……產生，由於時態是過去式，所以要用came。"},{"id":45,"zh":"Linda期待畢業旅行的到來，因為她可以跟同學快樂地玩幾天。","question":"Linda ①____________ ②____________ ③____________ the graduation trip because she will be able to have fun with her classmates for a couple of days.","answers":["looks","forward","to"],"source":"習作簿","explanation":"中文意思如題幹；本題依序填入 looks forward to。來源未附逐題解析。"}]};</script><script src="longteng-b1u5-quiz.js?v=20261026-3"></script><script src="longteng-vocab-required-pronunciation.js?v=20261026-4"></script></body></html>
