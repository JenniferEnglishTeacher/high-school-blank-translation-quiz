function speak(text=reference(items[index])){if(!speechSynthesis||!text)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}$('#speak').onclick=()=>speak();
function recordWrong(x,value){if(!wrong.has(x.id))wrong.set(x.id,{item:x,attempts:[]});wrong.get(x.id).attempts.push(value);$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
$('#check').onclick=()=>{const x=items[index],fields=[...document.querySelectorAll('#answerArea .answer')];if(fields.some(f=>!f.value.trim()))return alert('請先完成所有答案格。');let ok,value=fields.map(f=>f.value.trim()).join(' / ');if(x.type==='open')ok=true;else if(x.type==='exact_open')ok=norm(fields[0].value)===norm(x.answers[0]);else{ok=fields.every((f,i)=>norm(f.value)===norm(x.answers[i]));fields.forEach((f,i)=>{const good=norm(f.value)===norm(x.answers[i]);f.classList.toggle('correct',good);f.classList.toggle('incorrect',!good)})}if(ok){correct.add(x.id);$('#feedback').className='feedback ok';$('#feedback').textContent=x.type==='open'?'✅ 已完成，請對照提示。':'✅ 正確！';$('#reference').textContent='參考答案：\n'+reference(x);$('#reference').classList.remove('hidden');$('#check').classList.add('hidden');$('#next').classList.remove('hidden');$('#voiceTarget').textContent=reference(x);$('#voiceBox').classList.remove('hidden');speak()}else{recordWrong(x,value);$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 不正確，請修改紅框中的答案。';$('#reference').textContent='參考答案：\n'+reference(x);$('#reference').classList.remove('hidden')}};
$('#next').onclick=()=>{index++;index>=items.length?finish():show()};$('#finish').onclick=finish;function finish(){speechSynthesis?.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');$('#summary').innerHTML=`<div class="stat">本輪題數<b>${items.length}</b></div><div class="stat">完成題數<b>${correct.size}</b></div><div class="stat">曾答錯<b>${wrong.size}</b></div>`;$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>`<div class="wrong-card"><b>${i+1}. ${esc(r.item.id)}</b><p>${esc(r.item.prompt)}</p><p><strong>作答：</strong>${r.attempts.map(esc).join('；')}</p><p><strong>答案：</strong>${esc(reference(r.item))}</p></div>`).join(''):'<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size)}
$('#back').onclick=()=>{speechSynthesis?.cancel();$('#quiz').classList.add('hidden');$('#result').classList.add('hidden');$('#select').classList.remove('hidden')};$('#restart').onclick=()=>location.reload();$('#download').onclick=async()=>{if(!wrong.size)return;try{if(!window.docx)await new Promise((ok,fail)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js';s.onload=ok;s.onerror=fail;document.head.append(s)});const{Document,Packer,Paragraph,TextRun,HeadingLevel}=window.docx,children=[new Paragraph({text:DATA.title+' 錯題紀錄',heading:HeadingLevel.TITLE})];for(const r of wrong.values())children.push(new Paragraph({children:[new TextRun({text:r.item.id,bold:true})]}),new Paragraph(r.item.prompt),new Paragraph('作答：'+r.attempts.join('；')),new Paragraph('答案：'+reference(r.item)));const blob=await Packer.toBlob(new Document({sections:[{children}]})),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='KCIS_G1_Grammar_錯題.docx';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){alert('目前無法產生 DOCX，請稍後再試。')}};renderGroups();
</script></body></html>
