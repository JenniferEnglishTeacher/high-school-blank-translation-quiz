<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="龍騰普高 Book 1 Unit 6 互動測驗，附解析、整句朗讀與必做 STT 朗讀評分。"><title>龍騰普高 Book 1 Unit 6｜文法選擇（課本句型）</title><link rel="stylesheet" href="longteng-b1u5-quiz.css?v=20261026-2"><link rel="stylesheet" href="longteng-vocab-required-pronunciation.css?v=20261026-4"></head><body><main class="wrap"><header class="hero"><a class="btn" href="dashboard.html">← 回到 Dashboard</a><h1 id="title">龍騰普高 Book 1 Unit 6｜文法選擇（課本句型）</h1><p id="description" class="note"></p></header><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn" type="button">全選</button><button id="none" class="btn" type="button">取消全選</button><button id="random" class="btn" type="button">隨機 20 題</button><span id="picked" class="note"></span></div><div id="list"></div><label class="pick"><input id="shuffle" type="checkbox"> 隨機排列題目</label><button id="start" class="btn primary" type="button">開始測驗 →</button></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><div class="actions"><button id="check" class="btn primary" type="button">檢查答案</button><button id="next" class="btn primary hidden" type="button">下一題 →</button><button id="finish" class="btn danger" type="button">結束練習</button></div></section><section id="result" class="card hidden"><h2>練習結果</h2><div id="summary" class="summary"></div><h2>錯題紀錄</h2><div id="wrongList"></div><div class="actions"><button id="retry" class="btn primary" type="button">重做錯題</button><button id="download" class="btn" type="button">下載 DOCX 錯題</button><button id="restart" class="btn" type="button">重新選題</button></div></section></main><script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 6｜文法選擇（課本句型）","mode":"mcq","questions":[{"id":1,"question":"It was ____________ gave the little girl a teddy bear on her birthday.","options":["Kevin that","that Kevin","who Kevin","Kevin"],"answer":0,"answerLabel":"A","source":"三合一學習手冊","explanation":"補充解析：強調句型 It was + 被強調的人 + that + 其餘句子。來源未附逐題解析。"},{"id":2,"question":"____________ was Thomas Edison ____________ invented the light bulb and changed human history forever.","options":["It; but","It; that","That; which","That; that"],"answer":1,"answerLabel":"B","source":"三合一學習手冊","explanation":"補充解析：強調句型使用 It was ... that ...。來源未附逐題解析。"},{"id":3,"question":"It ____________ in this coffee shop that I first met your father.","options":["is","was","are","were"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"原句是 I first met your father in this coffee shop. 主詞是I，將地方副詞in this coffee shop移至that之前強調。因met為過去簡單式，故it後的be動詞為過去簡單式單數形was。"},{"id":4,"question":"____________ the shocking news that really hurt me.","options":["It is","It was","They are","They were"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"原句是The shocking news really hurt me. 動詞hurt為過去式（假如是現在式，應該寫hurts），所以強調句型應該用It was開頭；又，the news為單數，故本句不會以They開頭。"},{"id":5,"question":"It was ____________ that he was punished.","options":["because Billy didn’t turn in his homework","Sean cheated on exams","after Mason makes a big mistake","Henry"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"Sean cheated on exams前應加because，句意才完整；after Mason makes a big mistake的時態不對，因為本強調句為過去式；若選Henry，則需把題幹的he去掉。"},{"id":6,"question":"It was ____________ that Brenda bought these shoes.","options":["$1,000","to her boyfriend","after Helen saves enough money","from your shop"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"原句為Brenda bought these shoes...；$1,000前應加for；to her boyfriend應改為for her boyfriend；after Helen saves enough money應改為after Helen (had) saved enough money，故選from your shop。"},{"id":7,"question":"____________ was from that time that I began to take great interest in English.","options":["It","There","This","That"],"answer":0,"answerLabel":"A","source":"習作簿","explanation":"補充解析：強調句型以 It was ... that ... 表示「正是……」。來源未附逐題解析。"},{"id":8,"question":"Mike is ____________ a hard-working student that he gets good grades on every exam.","options":["such","so","also","even"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"such (+ a/an) + adj. + N + that + S + V表結果"},{"id":9,"question":"Kobe walked ____________ fast that I couldn’t keep up with him.","options":["such","so","too","very"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"S + V + so + adj./adv. + that + S + V... 表「如此……以致於……」"},{"id":10,"question":"Hualien is such a beautiful place ____________ we spent two more days there during our trip down Taiwan’s eastern coast.","options":["which","where","when","that"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"such (+ a/an) + adj. + N + that + S + V表結果"},{"id":11,"question":"I am afraid that it’s all because he changed his mind ____________ often that nobody could believe him anymore.","options":["such","so","very","much"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"so + adj./adv. + that + S + V表結果"},{"id":12,"question":"The boy made ____________ a loud noise on the bus that other passengers stared at him.","options":["too","so","up","such"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"S + V + such + N + that + S + V，在這個表示「如此……以致於……」的句型中，such需接一個名詞，在此為a loud noise"},{"id":13,"question":"It was ____________ nice weather after raining for days that lots of people came to the park.","options":["so","such","too","how"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"such (+ a/an) + adj. + N + that + S + V表結果"},{"id":14,"question":"Mr. Wang is ____________ a wise person that his friends always turn to him for advice when they have problems.","options":["too","such","so","very"],"answer":1,"answerLabel":"B","source":"習作簿","explanation":"補充解析：such + a/an + 形容詞 + 名詞 + that ... 表示「如此……以致於……」。來源未附逐題解析。"},{"id":15,"question":"This is ____________ that I can’t put it down.","options":["so an interesting book","a so interesting book","such an interesting book","such interesting a book"],"answer":2,"answerLabel":"C","source":"三合一學習手冊","explanation":"補充解析：such + a/an + 形容詞 + 名詞 + that ... 表示「如此……以致於……」。來源未附逐題解析。"},{"id":16,"question":"The discovery is ____________ that it will change the future of human beings.","options":["such importantly","very important","such important","so important"],"answer":3,"answerLabel":"D","source":"三合一學習手冊","explanation":"補充解析：so + 形容詞 + that ... 表示「如此……以致於……」。來源未附逐題解析。"},{"id":17,"question":"May is ____________ that she has earned the respect of her employees.","options":["such a nice boss","such nice a boss","so nicely a boss","so a nice boss"],"answer":0,"answerLabel":"A","source":"三合一學習手冊","explanation":"補充解析：such + a/an + 形容詞 + 名詞 + that ... 表示「如此……以致於……」。來源未附逐題解析。"}]};</script><script src="longteng-b1u5-quiz.js?v=20261026-2"></script><script src="longteng-vocab-required-pronunciation.js?v=20261026-4"></script></body></html>
