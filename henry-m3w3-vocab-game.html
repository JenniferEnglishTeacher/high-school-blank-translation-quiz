<style>:root{--blue:#2563eb;--navy:#1e3a8a;--bg:#f3f6fb;--card:#fff;--line:#d7e0eb;--ink:#182234;--muted:#64748b;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--gold:#9a3412;--goldbg:#fff7ed;--voice:#6d28d9;--hl:#fde047}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.65}
.wrap{max-width:900px;margin:auto;padding:16px}
.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin:15px 0;box-shadow:0 6px 22px #0f172a0d}
.hero{background:linear-gradient(135deg,#e8f1ff,#fff)}h1{margin:0 0 6px;font-size:clamp(24px,4vw,36px)}h2,h3{margin-top:0}
.note{color:var(--muted);margin:4px 0}.hidden{display:none!important}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.section-btn{border:2px solid var(--line);border-radius:14px;padding:17px;text-align:left;background:#fff;cursor:pointer;color:var(--ink);font:inherit}
.section-btn:hover,.section-btn:focus-visible{border-color:#60a5fa;background:#eff6ff;outline:none}.section-btn b{display:block;font-size:19px}.section-btn span{color:var(--muted)}
.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}
.btn{border:0;border-radius:10px;padding:11px 17px;font:800 16px Arial,"Noto Sans TC",sans-serif;cursor:pointer;background:#e5e7eb;color:var(--ink);text-decoration:none}
.btn:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.primary{background:var(--blue);color:#fff}.danger{background:#991b1b;color:#fff}.voice{background:var(--voice);color:#fff}.small{padding:4px 10px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}

.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;color:var(--muted);font-weight:800;margin:8px 0 14px}
.question{font-size:20px;font-weight:700;padding:16px;background:#f8fafc;border-radius:12px;line-height:1.8}
.blank{display:inline-block;min-width:5em;border-bottom:3px solid var(--ink);text-align:center}
mark{background:var(--hl);padding:0 3px;border-radius:4px}
.hint{color:var(--muted);margin:10px 0}.instructions{padding:11px 14px;background:var(--goldbg);color:var(--gold);border-radius:10px;font-weight:800;margin:10px 0}
.answer{width:100%;font:inherit;font-size:19px;padding:12px;border:2px solid #94a3b8;border-radius:10px;margin:12px 0}
.answer:focus{border-color:var(--blue);outline:none}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.word{display:inline-block;padding:4px 12px;border-radius:999px;background:#dbeafe;color:var(--navy);font-weight:800}
.ptitle{text-align:center;margin:6px 0}.para{text-indent:2em;font-size:18px;line-height:2.4;margin:10px 0}
.inl{font:700 16px Arial,sans-serif;padding:5px 8px;border:2px solid #94a3b8;border-radius:8px;width:8.5em;max-width:100%;background:#fff;color:var(--ink);text-indent:0}
.inl.correct{border-color:#22c55e;background:var(--okbg)}.inl.incorrect{border-color:#dc2626;background:#fee2e2}
.fixbox{font-weight:500;line-height:2.6}.edit{display:inline-flex;align-items:center;gap:5px;padding:1px 4px;border-radius:8px;background:var(--badbg)}
.edit del{color:var(--bad);font-weight:900;text-decoration-thickness:2px}.edit .inl{width:7.5em}
.fixans{color:var(--ok);font-weight:900;margin-left:4px}
.feedback{padding:13px;border-radius:10px;font-weight:700;margin:13px 0}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}
.rule{display:inline-block;margin-top:6px;padding:2px 10px;border-radius:999px;background:var(--hl);color:#422006;font-weight:800}
.full{display:block;margin-top:6px;color:var(--ink);font-weight:600}
.reference{margin-top:10px;padding:12px;border:2px solid #bbf7d0;border-radius:11px;background:#f0fdf4;color:var(--ink);font-weight:500}
.wcard .whead{font-size:20px}.wcard .whead b{font-size:30px;color:var(--navy)}.pos{color:var(--muted);font-weight:700}.zh{color:#475569}
.rec{font-size:14px;background:#ccfbf1;color:#115e59;border-radius:999px;padding:2px 8px;font-weight:800}
.forms{color:var(--muted);font-style:italic;margin:6px 0}.means li{margin:6px 0}.coll{padding-left:20px}.coll li{margin:4px 0}.sample{background:#f8fafc;padding:10px;border-radius:10px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.stat,.wrong-card{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}
.wrong-card{background:#fff7f7;border-color:#fecaca;margin:8px 0}
@media(max-width:600px){.wrap{padding:9px}.hero,.card{padding:15px}.question{font-size:18px}.para{font-size:17px}}
@media(prefers-reduced-motion:reduce){.bar{transition:none}}
