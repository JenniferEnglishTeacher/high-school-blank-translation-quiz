<script>window.QUIZ_CONFIG={"title": "115 年國中會考英語｜單題＋克漏字", "mode": "mcq", "questions": [{"id": 1, "question": "第 1 題　Look at the picture. All of the students who are exercising are wearing ______.", "options": ["caps", "glasses", "jackets", "pants"], "answer": 1, "answerLabel": "B", "source": "115 會考｜單題｜第 1 題", "explanation": "圖中所有在運動的學生都戴著「眼鏡」：glasses。", "explanationSource": "own", "section": "單題"}, {"id": 2, "question": "第 2 題　Rita ______ her dogs many times a day. That’s why they’re too fat.", "options": ["feeds", "kisses", "walks", "washes"], "answer": 0, "answerLabel": "A", "source": "115 會考｜單題｜第 2 題", "explanation": "後句說狗太胖，表示她一天「餵」很多次：feeds。", "explanationSource": "own", "section": "單題"}, {"id": 3, "question": "第 3 題　You can ask Sophia anything about butterflies and bees. She has great ______ of insects.", "options": ["chances", "knowledge", "news", "power"], "answer": 1, "answerLabel": "B", "source": "115 會考｜單題｜第 3 題", "explanation": "什麼都可以問她，表示她對昆蟲很有「知識」：have great knowledge of。", "explanationSource": "own", "section": "單題"}, {"id": 4, "question": "第 4 題　Adam slept ______ last night because he kept waking up from bad dreams.", "options": ["deeply", "early", "terribly", "quickly"], "answer": 2, "answerLabel": "C", "source": "115 會考｜單題｜第 4 題", "explanation": "一直被惡夢驚醒，睡得很「糟」：slept terribly（副詞修飾動詞）。", "explanationSource": "own", "section": "單題"}, {"id": 5, "question": "第 5 題　Tara enjoys being with all kinds of animals; she even ______ a snake as a pet.", "options": ["drops", "gives", "keeps", "makes"], "answer": 2, "answerLabel": "C", "source": "115 會考｜單題｜第 5 題", "explanation": "她喜歡動物，甚至「養」了一條蛇當寵物：keep a pet。", "explanationSource": "own", "section": "單題"}, {"id": 6, "question": "第 6 題　Little Eric chose the doll ______ big brown eyes because it was the cutest in the store.", "options": ["at", "in", "on", "with"], "answer": 3, "answerLabel": "D", "source": "115 會考｜單題｜第 6 題", "explanation": "with＋特徵：the doll with big brown eyes（有大棕眼睛的娃娃）。", "explanationSource": "own", "section": "單題"}, {"id": 7, "question": "第 7 題　After four hours of mountain climbing, Rosa’s legs got ______, so she took a rest on the top of the mountain.", "options": ["dirty", "sick", "sore", "strong"], "answer": 2, "answerLabel": "C", "source": "115 會考｜單題｜第 7 題", "explanation": "爬了四小時山，腿很「痠痛」：sore。", "explanationSource": "own", "section": "單題"}, {"id": 8, "question": "第 8 題　Having three cups of coffee a day can’t be bad for our health, ______?", "options": ["can it", "can they", "is it", "are they"], "answer": 0, "answerLabel": "A", "source": "115 會考｜單題｜第 8 題", "explanation": "附加問句：主詞 Having...（動名詞）視為 it；前句否定 can’t，附加問句用肯定 can it?", "explanationSource": "own", "section": "單題"}, {"id": 9, "question": "第 9 題　You can’t push that door open with only one hand. It’s too heavy. You have to use ______!", "options": ["all", "another", "both", "one"], "answer": 2, "answerLabel": "C", "source": "115 會考｜單題｜第 9 題", "explanation": "門太重單手推不開，要用「兩隻」手：both。", "explanationSource": "own", "section": "單題"}, {"id": 10, "question": "第 10 題　Alan works hard in his new job, and he wants to know ______ his boss feels about him.", "options": ["how", "that", "whether", "why"], "answer": 0, "answerLabel": "A", "source": "115 會考｜單題｜第 10 題", "explanation": "想知道老闆對他「感覺如何」：how his boss feels about him。", "explanationSource": "own", "section": "單題"}, {"id": 11, "question": "第 11 題　I thought the girl ______ was Kate, but it was her sister, Candy. They sounded almost the same.", "options": ["answered the phone", "she answered the phone", "who answered the phone", "and answered the phone"], "answer": 2, "answerLabel": "C", "source": "115 會考｜單題｜第 11 題", "explanation": "the girl who answered the phone：who 引導形容詞子句修飾 the girl。", "explanationSource": "own", "section": "單題"}, {"id": 12, "question": "第 12 題　Ken is going abroad with a woman he met online, though he doesn’t know ______ well.", "options": ["her", "each other", "any", "another"], "answer": 0, "answerLabel": "A", "source": "115 會考｜單題｜第 12 題", "explanation": "her 指 a woman；他不太了解「她」。", "explanationSource": "own", "section": "單題"}, {"id": 13, "question": "第 13 題　Joe is happy he is not at the ______ of the class now. His grades are better than half of his classmates’ this school year.", "options": ["side", "front", "center", "bottom"], "answer": 3, "answerLabel": "D", "source": "115 會考｜單題｜第 13 題", "explanation": "成績比一半同學好，表示他不再是班上「最後幾名」：at the bottom of the class。", "explanationSource": "own", "section": "單題"}, {"id": 14, "question": "第 14 題　Look! There is not a cloud in the sky. I think the chances of getting some rain today are really ______.", "options": ["far", "good", "possible", "small"], "answer": 3, "answerLabel": "D", "source": "115 會考｜單題｜第 14 題", "explanation": "天空萬里無雲，下雨的機率很「小」：small。", "explanationSource": "own", "section": "單題"}, {"id": 15, "question": "第 15 題　On windy days, the flowers in my garden ______ like shy children with their heads down.", "options": ["bow", "fall", "rise", "smell"], "answer": 0, "answerLabel": "A", "source": "115 會考｜單題｜第 15 題", "explanation": "花朵像害羞的孩子低著頭，是在「彎腰；低頭」：bow。", "explanationSource": "own", "section": "單題"}, {"id": 16, "question": "第 16 題　Mr. Olson went to the doctor when he found he ______ his hair. He hoped he would be able to keep his thick hair.", "options": ["was losing", "is losing", "will lose", "has lost"], "answer": 0, "answerLabel": "A", "source": "115 會考｜單題｜第 16 題", "explanation": "當時發現自己「正在」掉頭髮：過去進行式 was losing。", "explanationSource": "own", "section": "單題"}, {"id": 17, "question": "第 17 題　Do you know what Lindsey’s first job was? Before becoming a movie star, she ______ the floors at the supermarket.", "options": ["mops", "is mopping", "has mopped", "mopped"], "answer": 3, "answerLabel": "D", "source": "115 會考｜單題｜第 17 題", "explanation": "成為明星「之前」是過去的事：過去式 mopped。", "explanationSource": "own", "section": "單題"}, {"id": 18, "question": "第 18 題　Our dog Lassie hides under the bed every time the moon comes out. She has been ______ for years, but we don’t know why.", "options": ["it", "like this", "like us", "that"], "answer": 1, "answerLabel": "B", "source": "115 會考｜單題｜第 18 題", "explanation": "She has been like this for years：她多年來一直「像這樣」。", "explanationSource": "own", "section": "單題"}, {"id": 19, "question": "第 19 題　Tom: Sam, could you help me in the kitchen now?\nSam: No, I ______ TV. It’s the most important game of the season.", "options": ["watch", "watched", "have watched", "am watching"], "answer": 3, "answerLabel": "D", "source": "115 會考｜單題｜第 19 題", "explanation": "Sam 說不能幫忙，因為他「正在」看電視：am watching。", "explanationSource": "own", "section": "單題"}, {"id": 40, "question": "【克漏字 第 40–43 題】\nA long time ago, there was an old king who had no child of his own. The king was worried that his land would fall into the wrong hands after his death, so he decided to pick a child in his land to take the high seat. One day, he called all the children to his castle and gave each of them a seed. “Come back on New Year’s Day and show me what you have grown,” he said to them, “and I will __40__.”\nEvery child brought their seeds home carefully. One of the children, Wong, planted his seed in a pot. He gave it water every day and made sure there was sun to help it grow. __41__.\nThen, Sung, the child of the richest family in the land, told people that a small plant was growing from his seed. He was __42__. Everyone excitedly said that he would be king. Soon, one after another, more and more children were also saying that they had something in their pots. But Wong still didn’t find anything in his.\nOn the big day, when Wong brought his pot to the castle, he saw all the other children carrying interesting plants. Some had flowers in the shape of a bird, and some had grasses of different colors. Everyone proudly showed their plants to the king, but the king looked unhappy until he saw Wong’s pot. “I boiled the seeds before I gave them out, so no plants could grow from them.” The king looked seriously at the children. “There is only one child who is __43__ enough to be king.”\nTen years later, the king died. On his deathbed, he was not worried because he knew Wong would be a good king.\n\n▶ 第 40 題　請選出 __40__ 的最佳答案", "options": ["give you a piece of good land", "choose a person to be the next king", "put the beautiful ones in my castle", "decide who will work in my garden"], "answer": 1, "answerLabel": "B", "source": "115 會考｜克漏字｜第 40 題", "explanation": "國王想選一個孩子繼承王位（take the high seat），所以說會「選出下一任國王」。", "explanationSource": "own", "section": "克漏字"}, {"id": 41, "question": "【克漏字 第 40–43 題】\nA long time ago, there was an old king who had no child of his own. The king was worried that his land would fall into the wrong hands after his death, so he decided to pick a child in his land to take the high seat. One day, he called all the children to his castle and gave each of them a seed. “Come back on New Year’s Day and show me what you have grown,” he said to them, “and I will __40__.”\nEvery child brought their seeds home carefully. One of the children, Wong, planted his seed in a pot. He gave it water every day and made sure there was sun to help it grow. __41__.\nThen, Sung, the child of the richest family in the land, told people that a small plant was growing from his seed. He was __42__. Everyone excitedly said that he would be king. Soon, one after another, more and more children were also saying that they had something in their pots. But Wong still didn’t find anything in his.\nOn the big day, when Wong brought his pot to the castle, he saw all the other children carrying interesting plants. Some had flowers in the shape of a bird, and some had grasses of different colors. Everyone proudly showed their plants to the king, but the king looked unhappy until he saw Wong’s pot. “I boiled the seeds before I gave them out, so no plants could grow from them.” The king looked seriously at the children. “There is only one child who is __43__ enough to be king.”\nTen years later, the king died. On his deathbed, he was not worried because he knew Wong would be a good king.\n\n▶ 第 41 題　請選出 __41__ 的最佳答案", "options": ["But he lost his pot a few weeks later", "Months passed but nothing grew from it", "But soon the plant that grew from it died", "The seed grew into a big tree in a short time"], "answer": 1, "answerLabel": "B", "source": "115 會考｜克漏字｜第 41 題", "explanation": "後文說 Wong 的盆子裡還是什麼都沒有，表示「過了好幾個月什麼都沒長出來」。", "explanationSource": "own", "section": "克漏字"}, {"id": 42, "question": "【克漏字 第 40–43 題】\nA long time ago, there was an old king who had no child of his own. The king was worried that his land would fall into the wrong hands after his death, so he decided to pick a child in his land to take the high seat. One day, he called all the children to his castle and gave each of them a seed. “Come back on New Year’s Day and show me what you have grown,” he said to them, “and I will __40__.”\nEvery child brought their seeds home carefully. One of the children, Wong, planted his seed in a pot. He gave it water every day and made sure there was sun to help it grow. __41__.\nThen, Sung, the child of the richest family in the land, told people that a small plant was growing from his seed. He was __42__. Everyone excitedly said that he would be king. Soon, one after another, more and more children were also saying that they had something in their pots. But Wong still didn’t find anything in his.\nOn the big day, when Wong brought his pot to the castle, he saw all the other children carrying interesting plants. Some had flowers in the shape of a bird, and some had grasses of different colors. Everyone proudly showed their plants to the king, but the king looked unhappy until he saw Wong’s pot. “I boiled the seeds before I gave them out, so no plants could grow from them.” The king looked seriously at the children. “There is only one child who is __43__ enough to be king.”\nTen years later, the king died. On his deathbed, he was not worried because he knew Wong would be a good king.\n\n▶ 第 42 題　請選出 __42__ 的最佳答案", "options": ["the last one to give up", "the first one to share good news", "the first one to bring his pot to the king", "the only one to take good care of his plant"], "answer": 1, "answerLabel": "B", "source": "115 會考｜克漏字｜第 42 題", "explanation": "Sung 第一個說種子發芽了，之後才有越來越多孩子跟著說，他是「第一個分享好消息的人」。", "explanationSource": "own", "section": "克漏字"}, {"id": 43, "question": "【克漏字 第 40–43 題】\nA long time ago, there was an old king who had no child of his own. The king was worried that his land would fall into the wrong hands after his death, so he decided to pick a child in his land to take the high seat. One day, he called all the children to his castle and gave each of them a seed. “Come back on New Year’s Day and show me what you have grown,” he said to them, “and I will __40__.”\nEvery child brought their seeds home carefully. One of the children, Wong, planted his seed in a pot. He gave it water every day and made sure there was sun to help it grow. __41__.\nThen, Sung, the child of the richest family in the land, told people that a small plant was growing from his seed. He was __42__. Everyone excitedly said that he would be king. Soon, one after another, more and more children were also saying that they had something in their pots. But Wong still didn’t find anything in his.\nOn the big day, when Wong brought his pot to the castle, he saw all the other children carrying interesting plants. Some had flowers in the shape of a bird, and some had grasses of different colors. Everyone proudly showed their plants to the king, but the king looked unhappy until he saw Wong’s pot. “I boiled the seeds before I gave them out, so no plants could grow from them.” The king looked seriously at the children. “There is only one child who is __43__ enough to be king.”\nTen years later, the king died. On his deathbed, he was not worried because he knew Wong would be a good king.\n\n▶ 第 43 題　請選出 __43__ 的最佳答案", "options": ["wise", "strong", "honest", "popular"], "answer": 2, "answerLabel": "C", "source": "115 會考｜克漏字｜第 43 題", "explanation": "種子煮過不可能發芽，只有 Wong 帶著空盆子來，表示他夠「誠實」。", "explanationSource": "own", "section": "克漏字"}]};window.CAP_IMG={"第 1 題　Look at the picture. All of the students who are exercising are wearing ______.": "assets/cap-past-exams/cap115-q1.png?v=20261119-1"};</script><script src="longteng-b1u5-quiz.js?v=20261106-3"></script><script>(function(){var M=window.CAP_IMG||{};var qn=document.getElementById('question');if(!qn)return;function put(){var old=document.getElementById('capImg');var t=qn.textContent;var src=M[t];if(old&&old.dataset.src===src)return;if(old)old.remove();if(!src)return;var im=document.createElement('img');im.id='capImg';im.dataset.src=src;im.src=src;im.alt='題目圖片';im.style.cssText='display:block;max-width:100%;max-height:420px;margin:10px auto;border:1px solid #dbe3ee;border-radius:10px;background:#fff';qn.insertAdjacentElement('afterend',im)}new MutationObserver(put).observe(qn,{childList:true,characterData:true,subtree:true});})();</script><script>document.querySelector("#description").textContent="115 年會考英語閱讀：單題 19 題＋克漏字 4 題｜四選一｜附中文解析｜可隨機 20 題、隨時結束並下載 DOCX 錯題";</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
