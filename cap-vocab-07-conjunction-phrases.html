<script>window.QUIZ_CONFIG={"title": "國中會考單字片語｜連接詞片語 Conjunction Phrases", "mode": "mcq", "questions": [{"id": 1, "question": "My little brother is very shy; he talks to people ______ his mother is next to him.", "options": ["only when", "in case", "as if", "so that"], "answer": 0, "answerLabel": "A", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(A) only when\n【用語】only when + 子句 (conj.phr.)：只有在……時候才……\n【中譯】我弟弟很害羞；只有在他媽媽在他旁邊的時候，他才會跟別人說話。", "explanationSource": "supplemental"}, {"id": 2, "question": "______ I am concerned, summer is the best season because I can swim every day.", "options": ["As far as", "So that", "Even though", "As soon as"], "answer": 0, "answerLabel": "A", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(A) As far as\n【用語】as far as + N + be concerned (conj.phr.)：就……而言\n【中譯】就我而言，夏天是最棒的季節，因為我每天都可以游泳。", "explanationSource": "supplemental"}, {"id": 3, "question": "Ben was very hungry, so he started eating ______ he got home.", "options": ["even though", "as if", "in case", "as soon as"], "answer": 3, "answerLabel": "D", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(D) as soon as\n【用語】as soon as + 子句 (conj.phr.)：一……就……\n【中譯】Ben 很餓，所以他一回到家就開始吃東西。", "explanationSource": "supplemental"}, {"id": 4, "question": "You can go to the movies tonight ______ you finish your homework first.", "options": ["as though", "now that", "only if", "even though"], "answer": 2, "answerLabel": "C", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(C) only if\n【用語】only if + 子句 (conj.phr.)：只有在……條件下才……\n【中譯】只有在你先完成功課的條件下，你今晚才可以去看電影。", "explanationSource": "supplemental"}, {"id": 5, "question": "The new bike in the living room is ______ because today is his birthday, so I can't ride it.", "options": ["neither for me nor for my brother", "both for me and for my brother", "not for me but for my brother", "either for me or for my brother"], "answer": 2, "answerLabel": "C", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(C) not for me but for my brother\n【用語】not A but B (conj.phr.)：不是A而是B\n【中譯】客廳裡的新腳踏車不是給我的，而是給我弟弟的，因為今天是他的生日，所以我不能騎它。", "explanationSource": "supplemental"}, {"id": 6, "question": "Kevin talks ______ he knows everything, but he really doesn't.", "options": ["as soon as", "so that", "as if", "in case"], "answer": 2, "answerLabel": "C", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(C) as if\n【用語】as if + 子句 (conj.phr.)：彷彿、好像\n【中譯】Kevin 說話的樣子好像他什麼都知道，但其實他並不知道。", "explanationSource": "supplemental"}, {"id": 7, "question": "Ms. Lin is our English teacher, and she can speak ______, so she can talk with the students from Japan.", "options": ["English rather than Japanese", "not English but Japanese", "neither English nor Japanese", "English as well as Japanese"], "answer": 3, "answerLabel": "D", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(D) English as well as Japanese\n【用語】as well as (conj.phr.)：以及；和\n【中譯】林老師是我們的英文老師，她會說英文以及日文，所以她能和來自日本的學生交談。", "explanationSource": "supplemental"}, {"id": 8, "question": "Dad is very busy this weekend, so he can drive us to the zoo ______, but not on both days.", "options": ["both on Saturday and on Sunday", "not only on Saturday but also on Sunday", "either on Saturday or on Sunday", "neither on Saturday nor on Sunday"], "answer": 2, "answerLabel": "C", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(C) either on Saturday or on Sunday\n【用語】either A or B (conj.phr.)：不是……就是……\n【中譯】爸爸這個週末很忙，所以他不是星期六就是星期日可以載我們去動物園，但不能兩天都載。", "explanationSource": "supplemental"}, {"id": 9, "question": "Lucy went to school ______ she had a bad cold.", "options": ["so that", "now that", "in case", "even though"], "answer": 3, "answerLabel": "D", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(D) even though\n【用語】even though + 子句 (conj.phr.)：雖然、即使\n【中譯】雖然 Lucy 得了重感冒，她還是去上學了。", "explanationSource": "supplemental"}, {"id": 10, "question": "Many people go to my uncle's restaurant because the food there is ______; it costs little and tastes great.", "options": ["not only cheap but also delicious", "cheap rather than delicious", "neither cheap nor delicious", "either cheap or delicious"], "answer": 0, "answerLabel": "A", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(A) not only cheap but also delicious\n【用語】not only A but also B (conj.phr.)：不僅A而且B\n【中譯】很多人去我叔叔的餐廳，因為那裡的食物不僅便宜而且美味；花費少又很好吃。", "explanationSource": "supplemental"}, {"id": 11, "question": "The little boy cried ______ he was badly hurt, but he only fell down on the soft grass.", "options": ["as though", "so that", "now that", "as soon as"], "answer": 0, "answerLabel": "A", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(A) as though\n【用語】as though (conj.phr.)：彷彿；好像（= as if）\n【中譯】那個小男孩哭得彷彿受了重傷，但他只是跌倒在柔軟的草地上。", "explanationSource": "supplemental"}, {"id": 12, "question": "The box was ______ I couldn't carry it by myself.", "options": ["heavy in case", "heavy now that", "heavy even though", "so heavy that"], "answer": 3, "answerLabel": "D", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(D) so heavy that\n【用語】so + adj./adv. + that 子句 (conj.phr.)：如此……以致於……\n【中譯】那個箱子重到我自己一個人搬不動。", "explanationSource": "supplemental"}, {"id": 13, "question": "Take an umbrella with you ______ it rains this afternoon.", "options": ["now that", "even though", "in case", "as if"], "answer": 2, "answerLabel": "C", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(C) in case\n【用語】in case + 子句 (conj.phr.)：萬一；以防\n【中譯】帶把雨傘在身上，以防今天下午下雨。", "explanationSource": "supplemental"}, {"id": 14, "question": "It was ______ all the students stayed inside the classroom.", "options": ["a hot day as if", "such a hot day that", "a hot day in case", "a hot day even though"], "answer": 1, "answerLabel": "B", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(B) such a hot day that\n【用語】such + N + that 子句 (conj.phr.)：如此……以致於……\n【中譯】那天是如此炎熱的一天，以致於所有學生都待在教室裡。", "explanationSource": "supplemental"}, {"id": 15, "question": "Mom says cake is bad for my teeth, so she always gives me ______ after dinner.", "options": ["not fruit but cake", "fruit rather than cake", "either fruit or cake", "both fruit and cake"], "answer": 1, "answerLabel": "B", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(B) fruit rather than cake\n【用語】A rather than B (conj.phr.)：而非、而不是\n【中譯】媽媽說蛋糕對我的牙齒不好，所以晚餐後她總是給我水果，而不是蛋糕。", "explanationSource": "supplemental"}, {"id": 16, "question": "I couldn't choose between the red shirt and the blue one, so I bought ______, and now I have two new shirts.", "options": ["neither the red one nor the blue one", "both the red one and the blue one", "the red one rather than the blue one", "either the red one or the blue one"], "answer": 1, "answerLabel": "B", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(B) both the red one and the blue one\n【用語】both A and B (conj.phr.)：A和B兩者都\n【中譯】我無法在紅色和藍色的襯衫之間做選擇，所以紅色和藍色的我都買了，現在我有兩件新襯衫。", "explanationSource": "supplemental"}, {"id": 17, "question": "______ came to my birthday party, so I had two good friends with me.", "options": ["Tom as well as Amy", "Not Tom but Amy", "Tom rather than Amy", "Neither Tom nor Amy"], "answer": 0, "answerLabel": "A", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(A) Tom as well as Amy\n【用語】A as well as B (conj.phr.)：A以及B\n【中譯】Tom 以及 Amy 來參加了我的生日派對，所以我有兩位好朋友陪著我。", "explanationSource": "supplemental"}, {"id": 18, "question": "______ can come to my party, because Tom is sick and Amy is visiting her grandma.", "options": ["Neither Tom nor Amy", "Either Tom or Amy", "Not only Tom but also Amy", "Both Tom and Amy"], "answer": 0, "answerLabel": "A", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(A) Neither Tom nor Amy\n【用語】neither A nor B (conj.phr.)：既不是A也不是B\n【中譯】Tom 和 Amy 都不能來參加我的派對，因為 Tom 生病了，而 Amy 要去探望她的奶奶。", "explanationSource": "supplemental"}, {"id": 19, "question": "Every morning, my strong grandpa ______: he swims at six and runs in the park at seven.", "options": ["either swims or runs", "not only swims but also runs", "neither swims nor runs", "swims rather than runs"], "answer": 1, "answerLabel": "B", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(B) not only swims but also runs\n【用語】not only A but (also) B (conj.phr.)：不僅A而且B\n【中譯】我強壯的爺爺每天早上不僅游泳而且跑步：他六點游泳，七點在公園跑步。", "explanationSource": "supplemental"}, {"id": 20, "question": "______ you are in junior high school, you should get up early by yourself.", "options": ["In case", "Even though", "Now that", "As if"], "answer": 2, "answerLabel": "C", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(C) Now that\n【用語】now (that) + 子句 (conj.phr.)：既然\n【中譯】既然你已經是國中生了，你應該自己早起。", "explanationSource": "supplemental"}, {"id": 21, "question": "Please speak louder ______ everyone in the classroom can hear you.", "options": ["as if", "even though", "so that", "now that"], "answer": 2, "answerLabel": "C", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(C) so that\n【用語】so that (conj.phr.)：以便；好讓\n【中譯】請說大聲一點，好讓教室裡的每個人都能聽到你說話。", "explanationSource": "supplemental"}, {"id": 22, "question": "______ it rains tomorrow, we will still play basketball in the gym.", "options": ["Even if", "Now that", "So that", "As if"], "answer": 0, "answerLabel": "A", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(A) Even if\n【用語】even if (conj.phr.)：即使（條件句：以現在簡單式代替未來式）\n【中譯】即使明天下雨，我們還是會在體育館打籃球。", "explanationSource": "supplemental"}, {"id": 23, "question": "You can borrow my bike ______ you give it back to me before dinner.", "options": ["so that", "even though", "as if", "as long as"], "answer": 3, "answerLabel": "D", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(D) as long as\n【用語】as long as + 子句 (conj.phr.)：只要\n【中譯】只要你在晚餐前還給我，你就可以借我的腳踏車。", "explanationSource": "supplemental"}, {"id": 24, "question": "My dad drinks coffee ______ he has to work late at night; he never drinks it in the morning.", "options": ["only when", "even though", "so that", "as though"], "answer": 0, "answerLabel": "A", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(A) only when\n【用語】only when + 子句 (conj.phr.)：只有在……時候才……\n【中譯】我爸爸只有在必須熬夜工作的時候才喝咖啡；他早上從不喝咖啡。", "explanationSource": "supplemental"}, {"id": 25, "question": "______ my little sister is concerned, ice cream is the best food in the world.", "options": ["Now that", "As long as", "In case", "As far as"], "answer": 3, "answerLabel": "D", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(D) As far as\n【用語】as far as + N + be concerned (conj.phr.)：就……而言\n【中譯】就我妹妹而言，冰淇淋是世界上最棒的食物。", "explanationSource": "supplemental"}, {"id": 26, "question": "The baby stopped crying ______ she saw her mother.", "options": ["so that", "in case", "as soon as", "even though"], "answer": 2, "answerLabel": "C", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(C) as soon as\n【用語】as soon as + 子句 (conj.phr.)：一……就……\n【中譯】那個嬰兒一看到她媽媽就停止哭泣了。", "explanationSource": "supplemental"}, {"id": 27, "question": "The old lady will sell her house ______ someone pays five million dollars for it; she won't take less.", "options": ["only if", "even though", "as if", "now that"], "answer": 0, "answerLabel": "A", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(A) only if\n【用語】only if + 子句 (conj.phr.)：只有在……條件下才……\n【中譯】那位老太太只有在有人出五百萬元的條件下才會賣她的房子；少一點她都不接受。", "explanationSource": "supplemental"}, {"id": 28, "question": "My favorite sport is ______; I play basketball every day, but I never swim.", "options": ["swimming rather than basketball", "neither swimming nor basketball", "not swimming but basketball", "both swimming and basketball"], "answer": 2, "answerLabel": "C", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(C) not swimming but basketball\n【用語】not A but B (conj.phr.)：不是A而是B\n【中譯】我最喜歡的運動不是游泳而是籃球；我每天打籃球，但我從不游泳。", "explanationSource": "supplemental"}, {"id": 29, "question": "Mom looked at me ______ she didn't believe my story.", "options": ["as soon as", "so that", "as if", "in case"], "answer": 2, "answerLabel": "C", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(C) as if\n【用語】as if + 子句 (conj.phr.)：彷彿、好像\n【中譯】媽媽看著我，好像她不相信我說的故事。", "explanationSource": "supplemental"}, {"id": 30, "question": "Jenny can play ______, so she can play two instruments.", "options": ["neither the piano nor the violin", "the piano as well as the violin", "either the piano or the violin", "the piano rather than the violin"], "answer": 1, "answerLabel": "B", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(B) the piano as well as the violin\n【用語】as well as (conj.phr.)：以及；和\n【中譯】Jenny 會彈鋼琴以及拉小提琴，所以她會兩種樂器。", "explanationSource": "supplemental"}, {"id": 31, "question": "We have only two choices for lunch today: you can have ______, but not both.", "options": ["either rice or noodles", "neither rice nor noodles", "not only rice but also noodles", "both rice and noodles"], "answer": 0, "answerLabel": "A", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(A) either rice or noodles\n【用語】either A or B (conj.phr.)：不是……就是……\n【中譯】我們今天午餐只有兩個選擇：你不是吃飯就是吃麵，但不能兩個都吃。", "explanationSource": "supplemental"}, {"id": 32, "question": "______ Ken studied very hard, he didn't pass the math test.", "options": ["Now that", "Even though", "As soon as", "So that"], "answer": 1, "answerLabel": "B", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(B) Even though\n【用語】even though + 子句 (conj.phr.)：雖然、即使\n【中譯】雖然 Ken 很用功讀書，他的數學考試還是沒有及格。", "explanationSource": "supplemental"}, {"id": 33, "question": "Our new classmate, Mia, can speak ______; she learned Japanese from her mother and Korean from her father.", "options": ["neither Japanese nor Korean", "Japanese rather than Korean", "not only Japanese but also Korean", "not Japanese but Korean"], "answer": 2, "answerLabel": "C", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(C) not only Japanese but also Korean\n【用語】not only A but also B (conj.phr.)：不僅A而且B\n【中譯】我們的新同學 Mia 不僅會說日文，而且會說韓文；她跟媽媽學日文，跟爸爸學韓文。", "explanationSource": "supplemental"}, {"id": 34, "question": "Ted spends money ______ he is a rich man, but he is only a student.", "options": ["so that", "as though", "now that", "in case"], "answer": 1, "answerLabel": "B", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(B) as though\n【用語】as though (conj.phr.)：彷彿；好像（= as if）\n【中譯】Ted 花錢的樣子彷彿他是個有錢人，但他只是個學生。", "explanationSource": "supplemental"}, {"id": 35, "question": "The movie was ______ I laughed until I cried.", "options": ["so funny that", "funny in case", "funny as if", "funny even though"], "answer": 0, "answerLabel": "A", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(A) so funny that\n【用語】so + adj./adv. + that 子句 (conj.phr.)：如此……以致於……\n【中譯】那部電影如此好笑，以致於我笑到哭了。", "explanationSource": "supplemental"}, {"id": 36, "question": "Write down my phone number ______ you get lost in the city.", "options": ["even though", "in case", "so that", "as if"], "answer": 1, "answerLabel": "B", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(B) in case\n【用語】in case + 子句 (conj.phr.)：萬一；以防\n【中譯】把我的電話號碼寫下來，以防你在城市裡迷路。", "explanationSource": "supplemental"}, {"id": 37, "question": "Jack is ______ everyone in our class likes him.", "options": ["a kind boy even though", "a kind boy as if", "such a kind boy that", "a kind boy in case"], "answer": 2, "answerLabel": "C", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(C) such a kind boy that\n【用語】such + N + that 子句 (conj.phr.)：如此……以致於……\n【中譯】Jack 是如此親切的男孩，以致於我們班上每個人都喜歡他。", "explanationSource": "supplemental"}, {"id": 38, "question": "It's sunny and warm today, so let's ______.", "options": ["both walk to school and take the bus", "walk to school rather than take the bus", "not walk to school but take the bus", "neither walk to school nor take the bus"], "answer": 1, "answerLabel": "B", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(B) walk to school rather than take the bus\n【用語】A rather than B (conj.phr.)：而非、而不是\n【中譯】今天陽光普照又溫暖，所以我們走路上學，而不要搭公車吧。", "explanationSource": "supplemental"}, {"id": 39, "question": "______ will join the soccer team, so our class will have two players on the team.", "options": ["Neither Tom nor Ken", "Both Tom and Ken", "Tom rather than Ken", "Either Tom or Ken"], "answer": 1, "answerLabel": "B", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(B) Both Tom and Ken\n【用語】both A and B (conj.phr.)：A和B兩者都\n【中譯】Tom 和 Ken 兩個人都會加入足球隊，所以我們班在隊上會有兩名球員。", "explanationSource": "supplemental"}, {"id": 40, "question": "Ann is on the school basketball team and the volleyball team because she plays ______ very well.", "options": ["basketball as well as volleyball", "neither basketball nor volleyball", "not basketball but volleyball", "basketball rather than volleyball"], "answer": 0, "answerLabel": "A", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(A) basketball as well as volleyball\n【用語】A as well as B (conj.phr.)：A以及B\n【中譯】Ann 是學校籃球隊和排球隊的隊員，因為她籃球以及排球都打得很好。", "explanationSource": "supplemental"}, {"id": 41, "question": "I like ______, so I only drink water.", "options": ["coffee rather than tea", "not only coffee but also tea", "both coffee and tea", "neither coffee nor tea"], "answer": 3, "answerLabel": "D", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(D) neither coffee nor tea\n【用語】neither A nor B (conj.phr.)：既不是A也不是B\n【中譯】我既不喜歡咖啡也不喜歡茶，所以我只喝水。", "explanationSource": "supplemental"}, {"id": 42, "question": "Grandpa's farm grows ______; he sells apples in fall and oranges in winter.", "options": ["not apples but oranges", "neither apples nor oranges", "apples rather than oranges", "not only apples but also oranges"], "answer": 3, "answerLabel": "D", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(D) not only apples but also oranges\n【用語】not only A but (also) B (conj.phr.)：不僅A而且B\n【中譯】爺爺的農場不僅種蘋果，而且種柳橙；他秋天賣蘋果，冬天賣柳橙。", "explanationSource": "supplemental"}, {"id": 43, "question": "______ the rain has stopped, let's go out and play in the park.", "options": ["So that", "Even though", "In case", "Now that"], "answer": 3, "answerLabel": "D", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(D) Now that\n【用語】now (that) + 子句 (conj.phr.)：既然\n【中譯】既然雨已經停了，我們出去公園玩吧。", "explanationSource": "supplemental"}, {"id": 44, "question": "I got up early this morning ______ I could catch the first bus.", "options": ["even though", "as if", "so that", "in case"], "answer": 2, "answerLabel": "C", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(C) so that\n【用語】so that (conj.phr.)：以便；好讓\n【中譯】我今天早上很早起床，好讓我能趕上第一班公車。", "explanationSource": "supplemental"}, {"id": 45, "question": "I will finish my homework tonight ______ I have to stay up late.", "options": ["as if", "so that", "even if", "as soon as"], "answer": 2, "answerLabel": "C", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(C) even if\n【用語】even if (conj.phr.)：即使（條件句：以現在簡單式代替未來式）\n【中譯】即使我必須熬夜，我今晚也會把功課寫完。", "explanationSource": "supplemental"}, {"id": 46, "question": "You can play video games ______ you finish your homework first.", "options": ["as if", "even though", "in case", "as long as"], "answer": 3, "answerLabel": "D", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(D) as long as\n【用語】as long as + 子句 (conj.phr.)：只要\n【中譯】只要你先寫完功課，你就可以玩電動。", "explanationSource": "supplemental"}, {"id": 47, "question": "My little brother is quiet ______ he is sleeping; at other times, he is very noisy.", "options": ["even if", "only when", "so that", "in case"], "answer": 1, "answerLabel": "B", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(B) only when\n【用語】only when + 子句 (conj.phr.)：只有在……時候才……\n【中譯】我弟弟只有在睡覺的時候才安靜；其他時候他都很吵。", "explanationSource": "supplemental"}, {"id": 48, "question": "______ my dad is concerned, math is the most useful subject at school.", "options": ["As soon as", "In case", "As long as", "As far as"], "answer": 3, "answerLabel": "D", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(D) As far as\n【用語】as far as + N + be concerned (conj.phr.)：就……而言\n【中譯】就我爸爸而言，數學是學校裡最有用的科目。", "explanationSource": "supplemental"}, {"id": 49, "question": "______ the bell rang, the students ran out of the classroom.", "options": ["So that", "Even though", "In case", "As soon as"], "answer": 3, "answerLabel": "D", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(D) As soon as\n【用語】as soon as + 子句 (conj.phr.)：一……就……\n【中譯】鐘聲一響，學生們就跑出教室。", "explanationSource": "supplemental"}, {"id": 50, "question": "You can get a free cake ______ you buy two drinks; if you buy only one, you have to pay for it.", "options": ["as though", "only if", "in case", "even though"], "answer": 1, "answerLabel": "B", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(B) only if\n【用語】only if + 子句 (conj.phr.)：只有在……條件下才……\n【中譯】只有在你買兩杯飲料的情況下，才能得到一個免費蛋糕；如果你只買一杯，就必須付錢買蛋糕。", "explanationSource": "supplemental"}, {"id": 51, "question": "Dad never drinks coffee, so Mom bought him ______ for his birthday.", "options": ["not only coffee but also tea", "not coffee but tea", "both coffee and tea", "coffee as well as tea"], "answer": 1, "answerLabel": "B", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(B) not coffee but tea\n【用語】not A but B (conj.phr.)：不是A而是B\n【中譯】爸爸從不喝咖啡，所以媽媽買給他的生日禮物不是咖啡而是茶。", "explanationSource": "supplemental"}, {"id": 52, "question": "Ben eats ______ he hasn't eaten for days, but he just had lunch an hour ago.", "options": ["as if", "as soon as", "in case", "now that"], "answer": 0, "answerLabel": "A", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(A) as if\n【用語】as if + 子句 (conj.phr.)：彷彿、好像\n【中譯】班吃東西的樣子好像他好幾天沒吃東西了，但他一小時前才剛吃過午餐。", "explanationSource": "supplemental"}, {"id": 53, "question": "Ken can speak ______, so he often helps visitors from America and Japan.", "options": ["English as well as Japanese", "not English but Japanese", "neither English nor Japanese", "English rather than Japanese"], "answer": 0, "answerLabel": "A", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(A) English as well as Japanese\n【用語】as well as (conj.phr.)：以及；和\n【中譯】肯會說英文以及日文，所以他常常幫助來自美國和日本的遊客。", "explanationSource": "supplemental"}, {"id": 54, "question": "There is only one seat left in the car, so ______ can come with us.", "options": ["neither Tom nor Ben", "both Tom and Ben", "not only Tom but also Ben", "either Tom or Ben"], "answer": 3, "answerLabel": "D", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(D) either Tom or Ben\n【用語】either A or B (conj.phr.)：不是……就是……\n【中譯】車上只剩一個座位，所以不是湯姆就是班可以跟我們一起去。", "explanationSource": "supplemental"}, {"id": 55, "question": "______ it was raining hard, Lily still walked to school.", "options": ["As soon as", "So that", "In case", "Even though"], "answer": 3, "answerLabel": "D", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(D) Even though\n【用語】even though + 子句 (conj.phr.)：雖然、即使\n【中譯】雖然雨下得很大，莉莉還是走路去上學。", "explanationSource": "supplemental"}, {"id": 56, "question": "Amy is very busy after school because she learns ______; she has piano class on Monday and swimming class on Friday.", "options": ["either piano or swimming", "neither piano nor swimming", "not only piano but also swimming", "not piano but swimming"], "answer": 2, "answerLabel": "C", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(C) not only piano but also swimming\n【用語】not only A but also B (conj.phr.)：不僅A而且B\n【中譯】艾美放學後很忙，因為她不僅學鋼琴，而且還學游泳；她星期一上鋼琴課，星期五上游泳課。", "explanationSource": "supplemental"}, {"id": 57, "question": "My grandma looks ______ she is fifty, but she is really seventy.", "options": ["as soon as", "in case", "only if", "as though"], "answer": 3, "answerLabel": "D", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(D) as though\n【用語】as though (conj.phr.)：彷彿；好像（= as if）\n【中譯】我奶奶看起來好像五十歲，但她其實七十歲了。", "explanationSource": "supplemental"}, {"id": 58, "question": "The soup was ______ I couldn't eat it right away, so I waited for ten minutes.", "options": ["hot in case", "so hot that", "hot as if", "hot even though"], "answer": 1, "answerLabel": "B", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(B) so hot that\n【用語】so + adj./adv. + that 子句 (conj.phr.)：如此……以致於……\n【中譯】湯如此燙，以致於我無法馬上喝，所以我等了十分鐘。", "explanationSource": "supplemental"}, {"id": 59, "question": "Bring a jacket ______ it gets cold at night in the mountains.", "options": ["in case", "so that", "as though", "even though"], "answer": 0, "answerLabel": "A", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(A) in case\n【用語】in case + 子句 (conj.phr.)：萬一；以防\n【中譯】帶件外套，以防山上晚上變冷。", "explanationSource": "supplemental"}, {"id": 60, "question": "It was ______ we all went swimming in the river.", "options": ["a hot day as if", "such a hot day that", "a hot day in case", "a hot day even though"], "answer": 1, "answerLabel": "B", "source": "連接詞片語 Conjunction Phrases", "explanation": "【答案】(B) such a hot day that\n【用語】such + N + that 子句 (conj.phr.)：如此……以致於……\n【中譯】那天是如此炎熱的一天，以致於我們全都去河裡游泳了。", "explanationSource": "supplemental"}]};</script><script>window.LEARN_DATA=[{"g": "", "t": "A as well as B", "p": "(conj.phr.)", "e": "A and also B", "z": "A以及B", "s": "Linda can speak English _____ _____ _____ Japanese, so she often helps foreign tourists at the train station.", "c": "琳達會說英文【以及】日文，所以她常常在火車站幫助外國觀光客。", "f": "Linda can speak English as well as Japanese, so she often helps foreign tourists at the train station."}, {"g": "", "t": "A rather than B", "p": "(conj.phr.)", "e": "instead of", "z": "而非、而不是", "s": "On hot summer days, I usually drink cold water _____ _____ soda, because it is much better for my body.", "c": "炎熱的夏天，我通常喝冰水【而不是】汽水，因為那對身體好多了。", "f": "On hot summer days, I usually drink cold water rather than soda, because it is much better for my body."}, {"g": "", "t": "as far as + N + be concerned", "p": "(conj.phr.)", "e": "in someone's opinion", "z": "就……而言", "s": "_____ _____ _____ I _____ _____, summer is the best season because we can swim in the sea and eat shaved ice every day.", "c": "【就】我【而言】，夏天是最棒的季節，因為我們每天都可以去海邊游泳、吃剉冰。", "f": "As far as I am concerned, summer is the best season because we can swim in the sea and eat shaved ice every day."}, {"g": "", "t": "as if + 子句", "p": "(conj.phr.)", "e": "in a way that seems like", "z": "彷彿、好像", "s": "Grandpa's old dog ran around the yard happily _____ _____ it were a young puppy again, and all of us laughed.", "c": "爺爺的老狗開心地在院子裡跑來跑去，【彷彿】牠又變回一隻小狗，我們全都笑了。", "f": "Grandpa's old dog ran around the yard happily as if it were a young puppy again, and all of us laughed."}, {"g": "", "t": "as long as + 子句", "p": "(conj.phr.)", "e": "only if", "z": "只要", "s": "Mom said that I could play basketball with my friends after school _____ _____ _____ I finished my homework before dinner.", "c": "媽媽說【只要】我在晚餐前寫完功課，放學後就可以和朋友去打籃球。", "f": "Mom said that I could play basketball with my friends after school as long as I finished my homework before dinner."}, {"g": "", "t": "as soon as + 子句", "p": "(conj.phr.)", "e": "right after; immediately when", "z": "一……就……", "s": "_____ _____ _____ the bell rang, the students ran out of the classroom because they wanted to play dodgeball on the playground.", "c": "鐘聲【一】響，學生們【就】衝出教室，因為他們想去操場玩躲避球。", "f": "As soon as the bell rang, the students ran out of the classroom because they wanted to play dodgeball on the playground."}, {"g": "", "t": "as though", "p": "(conj.phr.)", "e": "in a way that seems like something is true", "z": "彷彿；好像（= as if）", "s": "Mark ate his lunch very quickly _____ _____ he had not eaten anything for two days, and then he asked for more rice.", "c": "馬克很快地吃完午餐，【彷彿】他兩天都沒吃東西一樣，然後他又要了更多飯。", "f": "Mark ate his lunch very quickly as though he had not eaten anything for two days, and then he asked for more rice."}, {"g": "", "t": "as well as", "p": "(conj.phr.)", "e": "and also", "z": "以及；和", "s": "Mrs. Chen bought some apples _____ _____ _____ a big watermelon at the market, so her bags were very heavy.", "c": "陳太太在市場買了一些蘋果【
