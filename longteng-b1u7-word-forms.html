<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="龍騰普高 Book 1 Unit 7 互動測驗，附解析、整句朗讀與必做 STT 朗讀評分。"><title>龍騰普高 Book 1 Unit 7｜詞類變化</title><link rel="stylesheet" href="longteng-b1u5-quiz.css?v=20261026-3"><link rel="stylesheet" href="longteng-vocab-required-pronunciation.css?v=20261026-4"></head><body><main class="wrap"><header class="hero"><a class="btn" href="dashboard.html">← 回到 Dashboard</a><h1 id="title">龍騰普高 Book 1 Unit 7｜詞類變化</h1><p id="description" class="note"></p></header><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn" type="button">全選</button><button id="none" class="btn" type="button">取消全選</button><button id="random" class="btn" type="button">隨機 20 題</button><span id="picked" class="note"></span></div><div id="list"></div><label class="pick"><input id="shuffle" type="checkbox"> 隨機排列題目</label><button id="start" class="btn primary" type="button">開始測驗 →</button></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><div class="actions"><button id="check" class="btn primary" type="button">檢查答案</button><button id="next" class="btn primary hidden" type="button">下一題 →</button><button id="finish" class="btn danger" type="button">結束練習</button></div></section><section id="result" class="card hidden"><h2>練習結果</h2><div id="summary" class="summary"></div><h2>錯題紀錄</h2><div id="wrongList"></div><div class="actions"><button id="retry" class="btn primary" type="button">重做錯題</button><button id="download" class="btn" type="button">下載 DOCX 錯題</button><button id="restart" class="btn" type="button">重新選題</button></div></section></main><script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 7｜詞類變化","mode":"spell","questions":[{"id":1,"question":"At the end of the meeting, the manager thanked all of the employees for their ____________ (encourage) and support along the way.","answers":["encouragement"],"source":"龍騰自命題","explanation":"在會議結束時，經理感謝所有員工一直以來的鼓勵與支持。因為在空格前面是所有格，可推知空格要填入名詞，故答案為encouragement。"},{"id":2,"question":"As head of the department, Shirley is responsible for selecting a suitable ____________ (apply) for this important position.","answers":["applicant"],"source":"龍騰自命題","explanation":"作為部門主管，Shirley負責為這個重要職位挑選出一個適合的申請人。由於空格前面是形容詞，可推知空格內要填入名詞，而且是指「人」，故答案為applicant。"},{"id":3,"question":"With a talent for music, Gina is determined to ____________ (pursuit) her goal of becoming a professional singer.","answers":["pursue"],"source":"龍騰自命題","explanation":"有著音樂天分，Gina決定追求成為專業歌手的目標。在空格前面有is determined to，可推知空格要填入原形動詞，因此答案為pursue。"},{"id":4,"question":"Craig is such a reliable and ____________ (faith) friend that I have great trust in him.","answers":["faithful"],"source":"龍騰自命題","explanation":"Craig是一個如此可靠且忠誠的朋友，所以我非常信任他。在空格前面有對等連接詞and連接形容詞reliable和空格，而且空格後面為名詞friend，可推知空格要填入形容詞來修飾friend，因此答案為faithful。"},{"id":5,"question":"There are many ____________ (overseas) students studying at this famous college in Taipei.","answers":["overseas"],"source":"龍騰自命題","explanation":"有許多海外的學生就讀於這所臺北的知名大學。因為空格後面是名詞students，可推知空格應填入形容詞，故答案為overseas。"},{"id":6,"question":"When the girl saw lots of blood coming from the wound in her leg, she started ____________ (scream).","answers":["screaming"],"source":"龍騰自命題","explanation":"當這個女孩看到她腿上的傷口大量出血，她開始尖叫。由於空格前面是started，可推知空格要填入動名詞，因此答案為screaming。"},{"id":7,"question":"When I met George again, I could ____________ (bare) recognize him because he looked much older.","answers":["barely"],"source":"龍騰自命題","explanation":"當我再次遇到George時，我幾乎認不得他，因為他看起來老好多。由句子結構可以看出，空格要填入副詞修飾後面的動詞recognize，故答案為barely。"},{"id":8,"question":"Mary always ____________ (encouragement) her kids to talk to foreign English speakers to improve their English.","answers":["encourages||encouraged"],"source":"龍騰自命題","explanation":"Mary總是鼓勵她的孩子去和說英語的外國人說話，以增進他們的英語。由句子結構可以看出，空格裡應該填入動詞，故答案為encourages/encouraged。"},{"id":9,"question":"The amount of practice will ____________ (determination) how quickly your basketball skills can improve.","answers":["determine"],"source":"龍騰自命題","explanation":"練習的量將決定你的籃球技巧能進步多快。空格前面有助動詞will，可推知空格要填入原形動詞，因此答案為determine。"},{"id":10,"question":"Judy likes to relax by walking on the grass in her ____________ (barely) feet.","answers":["bare"],"source":"龍騰自命題","explanation":"Judy喜歡赤腳走在草地上以放鬆。空格要填入形容詞來修飾後方的名詞feet，故答案為bare。"},{"id":11,"question":"When Nancy failed the exam, her teacher did not scold her. Instead, he ____________ (encouragement) her to study harder.","answers":["encouraged"],"source":"All in One","explanation":"補充字義：encouraged 表示「鼓勵」。來源未附逐題解析。"},{"id":12,"question":"I’m not surprised that hundreds of ____________ (apply) came to the interview because this job offers a high salary.","answers":["applicants"],"source":"All in One","explanation":"補充字義：applicants 表示「申請人」。來源未附逐題解析。"},{"id":13,"question":"Peter is a ____________ (faith) friend of mine. He always gives me a hand when I need help.","answers":["faithful"],"source":"All in One","explanation":"補充字義：faithful 表示「忠誠的；忠實的」。來源未附逐題解析。"},{"id":14,"question":"My grandfather taught me that the ____________ (pursue) of knowledge and truth should be a lifelong journey.","answers":["pursuit"],"source":"All in One","explanation":"補充字義：pursuit 表示「追求」。來源未附逐題解析。"},{"id":15,"question":"The little boy ____________ (scream) in fear when a big dog barked at him.","answers":["screamed"],"source":"All in One","explanation":"補充字義：screamed 表示「尖叫」。來源未附逐題解析。"},{"id":16,"question":"After deciding to buy a house, the man went to the bank and filled out an ____________ (apply) form for a loan.","answers":["application"],"source":"習作簿","explanation":"補充字義：application 表示「申請；申請書」。來源未附逐題解析。"},{"id":17,"question":"Losing the game did not ____________ (encourage) the players; instead, it inspired them to do better next time.","answers":["discourage"],"source":"習作簿","explanation":"補充字義：discourage 表示「阻止；勸阻」。來源未附逐題解析。"},{"id":18,"question":"A dog is a man’s best friend. No matter what happens, it is always ____________ (faith) to its master.","answers":["faithful"],"source":"習作簿","explanation":"補充字義：faithful 表示「忠誠的；忠實的」。來源未附逐題解析。"},{"id":19,"question":"The movie star worked hard throughout his life in ____________ (pursue) of fame and money.","answers":["pursuit"],"source":"習作簿","explanation":"補充字義：pursuit 表示「追求」。來源未附逐題解析。"}]};</script><script src="longteng-b1u5-quiz.js?v=20261026-3"></script><script src="longteng-vocab-required-pronunciation.js?v=20261026-4"></script></body></html>
