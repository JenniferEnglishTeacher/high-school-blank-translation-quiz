<script>window.QUIZ_CONFIG={"title": "國中會考文法歷屆試題｜感官動詞", "mode": "mcq", "questions": [{"id": 1, "question": "People got very excited when they watched Ms. Smith ______ at the party.", "options": ["danced", "dancing", "has danced", "to dance"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜感官動詞 watch＋O＋Ving", "explanation": "【句型】感官動詞（see/watch/hear/feel）＋ O ＋ 原形V（看到全程）/ Ving（正在進行）。\n【分析】watched Ms. Smith ___ 是感官動詞句型，受詞後接 dancing 表「看她正在跳舞」。選項中沒有原形 dance，故選 dancing。\n【其他選項】(A) danced 過去式、(C) has danced 完成式都不能放在感官動詞的受詞後；(D) 主動句中感官動詞後不接 to V。\n【例句】I heard someone singing in the next room.", "explanationSource": "source"}, {"id": 2, "question": "I saw a cat ______ across the street just now.", "options": ["runs", "to run", "running", "ran"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 1 題）", "explanation": "saw＋O＋Ving 表看到正在進行的動作。", "explanationSource": "supplemental"}, {"id": 3, "question": "Did you hear the baby ______ last night?", "options": ["cry", "to cry", "cried", "cries"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 1 題）", "explanation": "hear＋O＋原形V。", "explanationSource": "supplemental"}, {"id": 4, "question": "Ben felt the ground ______ during the earthquake.", "options": ["shook", "to shake", "has shaken", "shaking"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 1 題）", "explanation": "feel＋O＋Ving 表感覺到正在發生的動作。", "explanationSource": "supplemental"}, {"id": 5, "question": "My cat got excited when it saw the boy ______ the birds.", "options": ["catches", "catching", "to catch", "caught"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜感官動詞 see + O + Ving", "explanation": "【句型】感官動詞 see / watch / hear / feel + 受詞 + 原形V（全程）或 Ving（正在進行）。\n【分析】saw the boy 後接 Ving 表示看到男孩「正在抓」鳥，選 catching。\n【其他選項】(A) catches 為現在式動詞，句中已有動詞 saw；(C) to catch 感官動詞後不接 to V；(D) caught 為過去式／p.p.，男孩是主動抓，不用被動。\n【例句】I saw Ben playing basketball after school.", "explanationSource": "source"}, {"id": 6, "question": "We heard someone ______ the guitar next door last night.", "options": ["to play", "plays", "playing", "played"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 5 題）", "explanation": "hear + 受詞 + Ving 表示聽到某人正在做某事。", "explanationSource": "supplemental"}, {"id": 7, "question": "Did you see the dog ______ across the street just now?", "options": ["running", "to run", "runs", "ran"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 5 題）", "explanation": "感官動詞 see + 受詞 + Ving（或原形），選 running。", "explanationSource": "supplemental"}, {"id": 8, "question": "Lucy watched her brother ______ a model plane in the living room.", "options": ["builds", "to build", "built", "building"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 5 題）", "explanation": "watch + 受詞 + Ving 表示看到正在進行的動作。", "explanationSource": "supplemental"}, {"id": 9, "question": "Bruce: When did Roger change his job?\nLaura: He hasn't changed his job. He still works in the same computer store.\nBruce: But I saw him ______ watches on the street corner.", "options": ["sold", "to sell", "have sold", "selling"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜感官動詞 see + O + Ving", "explanation": "【句型】see + 受詞 + Ving / 原形V（看到某人正在做某事）。\n【分析】saw him 之後接 Ving，表示「我看到他在街角賣手錶」，故選 selling。\n【其他選項】(A) sold 表被動或過去式，不合；(B) to sell 感官動詞後不接 to V；(C) have sold 完成式不能放在受詞後。\n【例句】I saw Mr. Huang waiting for the bus.", "explanationSource": "source"}, {"id": 10, "question": "Mia: Is Tom still sick?\nRay: I don't think so. I saw him ______ soccer on the field this morning.", "options": ["to play", "playing", "played", "has played"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 9 題）", "explanation": "saw him + Ving，表示看到他正在踢足球。", "explanationSource": "supplemental"}, {"id": 11, "question": "I noticed a man ______ pictures of our school gate.", "options": ["taking", "to take", "takes", "taken"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 9 題）", "explanation": "notice 為感官動詞，受詞後接 Ving 表進行。", "explanationSource": "supplemental"}, {"id": 12, "question": "We saw Grandpa ______ flowers in the garden when we got home.", "options": ["waters", "to water", "watering", "has watered"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 9 題）", "explanation": "saw + 受詞 + Ving，表示看到他正在澆花。", "explanationSource": "supplemental"}, {"id": 13, "question": "The little boy jumped up and down happily when he saw a bee ______ into the house.", "options": ["flown", "to fly", "flying", "has flown"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜感官動詞 see + O + Ving", "explanation": "【句型】see + 受詞 + Ving / 原形V。\n【分析】saw a bee 後接 Ving，表示看到蜜蜂「正飛進」屋子，選 flying。\n【其他選項】(A) flown 為過去分詞，表被動不合理；(B) to fly 感官動詞後不接 to V；(D) has flown 為完成式動詞，不能接在受詞後。\n【例句】She saw a bird flying over the lake.", "explanationSource": "source"}, {"id": 14, "question": "The kids shouted when they saw a big fish ______ out of the pond.", "options": ["to jump", "jumping", "jumped", "has jumped"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 13 題）", "explanation": "saw + 受詞 + Ving，表示看到魚正在跳出池塘。", "explanationSource": "supplemental"}, {"id": 15, "question": "I felt something ______ up my leg during the camping trip.", "options": ["climbed", "to climb", "has climbed", "climbing"], "answer": 3, "answerLabel": "D", "source": "類似題 2（對應第 13 題）", "explanation": "feel 為感官動詞，受詞後接 Ving 表示感覺到正在發生的動作。", "explanationSource": "supplemental"}, {"id": 16, "question": "Amy heard the baby ______ in the next room.", "options": ["crying", "cried", "to cry", "cries"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 13 題）", "explanation": "hear + 受詞 + Ving，表示聽到嬰兒正在哭。", "explanationSource": "supplemental"}, {"id": 17, "question": "When I was walking along the river, I saw some fish ______ out of the water.", "options": ["jumped", "to jump", "jumping", "are jumping"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜感官動詞 see + O + Ving", "explanation": "【句型】see + 受詞 + Ving / 原形V。\n【分析】saw some fish 之後接 Ving，表示看到魚「正跳出」水面，選 jumping。\n【其他選項】(A) jumped 為過去式，句中已有動詞 saw；(B) to jump 感官動詞後不加 to；(D) are jumping 為完整動詞，不能接在受詞後。\n【例句】We saw some ducks swimming in the pond.", "explanationSource": "source"}, {"id": 18, "question": "While Joe was waiting for the bus, he saw two cats ______ on the road.", "options": ["fight", "to fight", "fought", "are fighting"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 17 題）", "explanation": "see + 受詞 + 原形V 也可，表示看到整個動作；其他選項形式錯誤。", "explanationSource": "supplemental"}, {"id": 19, "question": "Can you hear the birds ______ in the trees?", "options": ["sang", "singing", "to sing", "are singing"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 17 題）", "explanation": "hear + 受詞 + Ving，表示聽到正在唱歌。", "explanationSource": "supplemental"}, {"id": 20, "question": "I watched the sun ______ behind the mountains from the window.", "options": ["to go down", "went down", "going down", "is going down"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 17 題）", "explanation": "watch + 受詞 + Ving，表示看著太陽正在下山。", "explanationSource": "supplemental"}, {"id": 21, "question": "Cindy cried out when she saw a motorcycle ______ into her cat.", "options": ["bump", "bumped", "to bump", "has bumped"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜感官動詞 see + O + 原形V", "explanation": "【句型】see + 受詞 + 原形V（看到整個動作發生）／Ving（正在進行）。\n【分析】saw a motorcycle 後可接原形 bump，表示看到機車撞上她的貓的整個過程。\n【其他選項】(B) bumped 為過去式／p.p.，不可接在受詞後表主動；(C) to bump 感官動詞後不接 to V；(D) has bumped 為完成式動詞。\n【例句】I saw a boy fall off his bike.", "explanationSource": "source"}, {"id": 22, "question": "Everyone heard the teacher ______ the door loudly.", "options": ["to shut", "shut", "has shut", "shuts"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 21 題）", "explanation": "hear + 受詞 + 原形V，表示聽到整個動作，shut 原形＝過去式同形，此處為原形用法。", "explanationSource": "supplemental"}, {"id": 23, "question": "Henry saw the vase ______ off the table and break.", "options": ["to fall", "fell", "fall", "has fallen"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 21 題）", "explanation": "see + 受詞 + 原形V，與後面原形 break 對等。", "explanationSource": "supplemental"}, {"id": 24, "question": "Did you feel the ground ______ during the earthquake last night?", "options": ["shake", "to shake", "shook", "has shaken"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 21 題）", "explanation": "feel + 受詞 + 原形V，表示感覺到地面搖晃。", "explanationSource": "supplemental"}]};</script><script src="longteng-b1u5-quiz.js?v=20261027-2"></script><script>document.querySelector("#description").textContent="共 24 題（會考歷屆 6 題＋類似題 18 題）｜選答後顯示中文解析｜答錯可重做並下載錯題";</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
