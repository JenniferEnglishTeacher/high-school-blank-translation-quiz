  <script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 1｜單字選擇","mode":"mcq","questions":[{"id":1,"question":"The boy’s face turned red with ____________ when the girl said she did not want to go out with him.","options":["tradition","failure","embarrassment","reflection"],"answer":2,"source":"龍騰自命題","explanation":"當這位女孩說她不想和這位男孩外出時，他因尷尬而臉紅。　(A)傳統　(B)失敗　(C)尷尬；難堪　(D)映出的影像","explanationSource":"source"},{"id":2,"question":"When I was an elementary school student, my teacher asked me to ____________ a new poem every day.","options":["ruin","upset","memorize","remind"],"answer":2,"source":"龍騰自命題","explanation":"當我是小學生時，我的老師要求我每天背一首新的詩。　(A)破壞；毀壞　(B)使難過；使沮喪　(C)記憶；記住　(D)提醒；使想起","explanationSource":"source"},{"id":3,"question":"When the reporter asked the singer about her boyfriend, she just ____________ that he was like an angel.","options":["presented","skipped","replied","ruined"],"answer":2,"source":"龍騰自命題","explanation":"當記者問這位歌手她男友的事時，她只回答他像天使。　(A)提交　(B)故意不參加；不做（該做的事）　(C)回答；回覆　(D)破壞；毀壞","explanationSource":"source"},{"id":4,"question":"The talented Leonardo DiCaprio will be the ____________ choice for the lead in the new movie, and it will surely be a big hit.","options":["perfect","upsetting","traditional","accidental"],"answer":0,"source":"龍騰自命題","explanation":"才華洋溢的李奧納多．迪卡皮歐將是這部新電影的主角完美人選，而這部電影一定會大賣。　(A)完美的　(B)令人難過的；令人沮喪的　(C)傳統的　(D)意外的","explanationSource":"source"},{"id":5,"question":"Oscar made an excuse in order to ____________ a class he did not like.","options":["recall","skip","present","upset"],"answer":1,"source":"龍騰自命題","explanation":"Oscar編造藉口以蹺掉他不喜歡的課。　(A)記起；回想起　(B)略過；跳過　(C)提交　(D)使難過；使沮喪","explanationSource":"source"},{"id":6,"question":"Looking at his own ____________ in the mirror, Sidney was surprised to find that some of his hair had turned gray.","options":["reflection","presentation","depression","memory"],"answer":0,"source":"龍騰自命題","explanation":"看著他自己在鏡中的倒影，Sidney驚訝地發現他有些頭髮已經變灰白了。　(A)映出的影像　(B)報告；介紹　(C)沮喪；消沉　(D)回憶；記憶","explanationSource":"source"},{"id":7,"question":"Kelly felt very ____________ because she didn’t do well on the English test.","options":["perfect","upset","fortunate","memorable"],"answer":1,"source":"龍騰自命題","explanation":"Kelly覺得很難過，因為她英文考試沒考好。　(A)完美的　(B)難過的；沮喪的　(C)幸運的　(D)難忘的","explanationSource":"source"},{"id":8,"question":"It has been reported that the fierce civil war in that country eventually led to the ____________ of its capital and left numerous people homeless.","options":["reply","tradition","ruin","accident"],"answer":2,"source":"龍騰自命題","explanation":"據報導，那個國家激烈的內戰最終導致其首都的毀壞，並讓無數的人流離失所。　(A)回答；回覆　(B)傳統　(C)破壞；毀壞　(D)意外","explanationSource":"source"},{"id":9,"question":"Allen felt quite ____________ and flushed when he mistook a stranger for his girlfriend, Julia.","options":["fortunate","traditional","memorable","embarrassed"],"answer":3,"source":"龍騰自命題","explanation":"當Allen把一名陌生人誤認為他女朋友Julia時，他感到相當尷尬而臉紅了。　(A)幸運的　(B)傳統的　(C)難忘的　(D)尷尬的；難堪的","explanationSource":"source"},{"id":10,"question":"Diana thinks that she was ____________ to get the last ticket to her favorite singer’s concert.","options":["fortunate","traditional","memorable","depressed"],"answer":0,"source":"龍騰自命題","explanation":"Diana認為她很幸運搶到她最愛歌手演唱會的最後一張門票。　(A)幸運的　(B)傳統的　(C)難忘的　(D)沮喪的；消沉的","explanationSource":"source"},{"id":11,"question":"Gary finally ____________ that health was very important after he came down with a serious illness.","options":["memorized","skipped","presented","realized"],"answer":3,"source":"龍騰自命題","explanation":"Gary患了重病之後，他終於了解到健康非常重要。　(A)記憶；記住　(B)故意不參加；不做（該做的事）　(C)提交　(D)了解；領悟","explanationSource":"source"},{"id":12,"question":"I am sure I must have met that handsome young man before, but I just can’t ____________ his name.","options":["recall","depress","realize","present"],"answer":0,"source":"龍騰自命題","explanation":"我確定我之前一定有遇過那個年輕帥哥，但是我就是無法記起他的名字。　(A)記起；回想起　(B)使沮喪；使消沉　(C)了解；領悟　(D)提交","explanationSource":"source"},{"id":13,"question":"My grandmother tells me that looking at these old photos always brings back many pleasant ____________ of her childhood.","options":["failures","memories","replies","accidents"],"answer":1,"source":"龍騰自命題","explanation":"我祖母告訴我，看著這些老照片總是能夠喚起她童年時期的許多愉快回憶。　(A)失敗　(B)回憶；記憶　(C)回答；回覆　(D)意外；事故","explanationSource":"source"},{"id":14,"question":"Christine thinks that one of the most ____________ moments in her life is when Vincent suddenly proposed to her in a romantic restaurant. She will never forget how happy she was at that time.","options":["depressed","traditional","memorable","upset"],"answer":2,"source":"龍騰自命題","explanation":"Christine認為她一生中最難忘的時刻之一，是當Vincent 突然在一間浪漫的餐廳裡向她求婚的時候。她永遠不會忘記當時她有多麼高興。　(A)沮喪的；消沉的　(B)傳統的　(C)難忘的　(D)難過的；沮喪的","explanationSource":"source"},{"id":15,"question":"The end of the year is a perfect time to ____________ on achievements and set goals for the future.","options":["skip","reflect","reply","yell"],"answer":1,"source":"龍騰自命題","explanation":"年末是一個認真思考成就以及替未來設定目標的最佳時機。　(A)跳過　(B)認真思考　(C)回覆　(D)大叫","explanationSource":"source"},{"id":16,"question":"Kevin’s new restaurant was a total ____________. It cost him a fortune and caused him to go broke.","options":["tradition","reply","memory","failure"],"answer":3,"source":"龍騰自命題","explanation":"Kevin的新餐廳徹底失敗。它讓他損失了一大筆錢並導致他破產。　(A)傳統　(B)回覆　(C)記憶　(D)失敗","explanationSource":"source"},{"id":17,"question":"A good speaker knows when to pause during the ____________ to catch the attention of the audience.","options":["presentation","depression","ruin","memory"],"answer":0,"source":"龍騰自命題","explanation":"好的講者懂得在報告中何時停頓以抓住聽眾的注意力。　(A)報告；介紹　(B)沮喪；消沉　(C)破壞；毀壞　(D)回憶；記憶","explanationSource":"source"},{"id":18,"question":"In Taiwan, it is ____________ for people to eat rice dumplings on Dragon Boat Festival.","options":["traditional","accidental","embarrassed","depressed"],"answer":0,"source":"龍騰自命題","explanation":"在臺灣，人們傳統上會在端午節吃粽子。　(A)傳統的　(B)意外的　(C)感到尷尬的　(D)感到沮喪的","explanationSource":"source"},{"id":19,"question":"The Wangs ____________ locked themselves out of the house and had to wait for a locksmith.","options":["fortunately","accidentally","traditionally","seriously"],"answer":1,"source":"龍騰自命題","explanation":"王家人不小心把自己鎖在家門外而必須等待鎖匠。　(A)幸運地　(B)不小心地　(C)傳統地　(D)認真地","explanationSource":"source"},{"id":20,"question":"The ____________ deletion of the report caused a lot of extra work for Tom to recreate it from scratch.","options":["memorable","accidental","fortunate","traditional"],"answer":1,"source":"龍騰自命題","explanation":"報告意外刪除導致Tom增加許多額外工作，得從頭再製作。　(A)難忘的　(B)意外的　(C)幸運的　(D)傳統的","explanationSource":"source"},{"id":21,"question":"The speaker paused for a while to drink some water and then went on to finish his ____________.","options":["embarrassment","depression","presentation","failure"],"answer":2,"source":"龍騰自命題","explanation":"那位講者停頓了一下，喝了一點水，然後繼續完成他的報告。　(A)尷尬　(B)沮喪　(C)報告；介紹　(D)失敗","explanationSource":"source"},{"id":22,"question":"Betty’s husband is suffering from deep ____________ because he was laid off several months ago and can’t find a new job.","options":["memory","reflection","reply","depression"],"answer":3,"source":"龍騰自命題","explanation":"Betty的先生正在遭受深沉沮喪之苦，因為他數個月前被解僱而且無法找到新的工作。　(A)回憶；記憶　(B)映出的影像　(C)回答；回覆　(D)沮喪；消沉","explanationSource":"source"},{"id":23,"question":"Derek has been ____________ ever since his girlfriend decided to break up with him several weeks ago.","options":["fortunate","memorable","depressed","perfect"],"answer":2,"source":"龍騰自命題","explanation":"自從他女友在數個星期前決定要和他分手後，Derek就一直很沮喪。　(A)幸運的　(B)難忘的　(C)沮喪的；消沉的　(D)完美的","explanationSource":"source"},{"id":24,"question":"An earthquake hit the city and caused two old buildings to collapse. ____________, no one got seriously injured.","options":["Fortunately","Sadly","Suddenly","Depressingly"],"answer":0,"source":"龍騰自命題","explanation":"一場地震襲擊這座城市並造成兩棟老舊建築物倒塌。幸運的是，沒人受重傷。　(A)幸運地　(B)傷心地　(C)突然地　(D)令人沮喪地；令人消沉地","explanationSource":"source"},{"id":25,"question":"Peter felt ____________ when he learned that he did not come in first at the game.","options":["perfect","upset","fortunate","embarrassing"],"answer":1,"source":"龍騰自命題","explanation":"當Peter得知他沒有在比賽得到第一時，他感到難過。　(A)完美的　(B)難過的；沮喪的　(C)幸運的　(D)令人尷尬的；令人難堪的","explanationSource":"source"},{"id":26,"question":"My homeroom teacher was angry at my classmate George because he was ____________ at others in the middle of the class.","options":["depressing","yelling","reminding","embarrassing"],"answer":1,"source":"龍騰自命題","explanation":"因為我的同學George在課堂中對其他人大吼，我的班導師很對他生氣。　(A)使沮喪；使消沉　(B)大喊；大吼　(C)提醒；使想起　(D)使尷尬；使難堪","explanationSource":"source"},{"id":27,"question":"Whenever the weather is fine, the calm lake in front of my house ____________ the blue sky and white clouds.","options":["reflects","replies","recalls","reminds"],"answer":0,"source":"龍騰自命題","explanation":"每當天氣好時，我家前面平靜的湖泊就映出藍天和白雲。　(A)映出（影像等）　(B)回答；回覆　(C)回想起；記起　(D)提醒；使想起","explanationSource":"source"},{"id":28,"question":"After studying hard for a whole year, I finally ____________ my dream of entering a medical college.","options":["realized","recalled","replied","reminded"],"answer":0,"source":"龍騰自命題","explanation":"在我努力讀書整整一年之後，終於實現進入醫學院的夢想。　(A)實現　(B)回想起；記起　(C)回答；回覆　(D)提醒；使想起","explanationSource":"source"},{"id":29,"question":"My mother often ____________ me to follow traffic rules and drive slowly.","options":["upsets","depresses","reflects","reminds"],"answer":3,"source":"龍騰自命題","explanation":"我媽媽常常提醒我遵守交通規則，慢慢開車。　(A)使難過；使沮喪　(B)使沮喪；使消沉　(C)映出（影像等）　(D)提醒；使想起","explanationSource":"source"},{"id":30,"question":"Everyone was having fun at the party, but Frank’s rude behavior ____________ the atmosphere.","options":["ruined","reflected","yelled","memorized"],"answer":0,"source":"龍騰自命題","explanation":"大家在派對上玩得開心，但是Frank的無禮行為破壞了氣氛。　(A)破壞；毀壞　(B)映出（影像等）　(C)大喊；大吼　(D)記憶；記住","explanationSource":"source"}]};</script>
