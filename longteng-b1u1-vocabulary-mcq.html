<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>龍騰B1U1 單字選擇</title><style>:root{--blue:#2563eb;--navy:#1e3a8a;--bg:#f4f7fb;--card:#fff;--line:#dbe3ee;--ink:#172033;--muted:#64748b;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}.wrap{max-width:900px;margin:auto;padding:16px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 5px 18px #0f172a0d}.hero{background:linear-gradient(135deg,#e8f1ff,#fff)}h1{margin:0 0 6px;font-size:clamp(25px,4vw,38px)}h2{margin-top:0}.note{color:var(--muted)}.hidden{display:none!important}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.btn{border:0;border-radius:10px;padding:11px 17px;font-size:16px;font-weight:800;cursor:pointer;background:#e5e7eb}.primary{background:var(--blue);color:#fff}.danger{background:#991b1b;color:#fff}.pick{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin:7px 0;background:#fafcff}.pick input{margin-right:8px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:800;margin:8px 0 14px}.zh{padding:10px 13px;background:#fff7ed;border-radius:9px;color:#9a3412;font-weight:800;margin-bottom:10px}.question{font-size:21px;font-weight:750;padding:16px;background:#f8fafc;border-radius:11px;white-space:pre-wrap}.options{display:grid;gap:9px;margin:14px 0}.option{display:flex;align-items:center;gap:11px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-size:18px;font-weight:750;cursor:pointer}.option:hover{border-color:#60a5fa;background:#eff6ff}.option:has(input:checked){b button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="download" class="btn primary">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></main><script type="module">import{Document,Packer,Paragraph,TextRun,HeadingLevel}from'https://esm.sh/docx@9.5.1';const TITLE="龍騰B1U1 單字選擇",MODE="mcq",Q=[{"id": 1, "question": "The boy’s face turned red with ____________ when the girl said she did not want to go out with him.", "options": ["tradition", "failure", "embarrassment", "reflection"], "answer": 2}, {"id": 2, "question": "When I was an elementary school student, my teacher asked me to ____________ a new poem every day.", "options": ["ruin", "upset", "memorize", "remind"], "answer": 2}, {"id": 3, "question": "When the reporter asked the singer about her boyfriend, she just ____________ that he was like an angel.", "options": ["presented", "skipped", "replied", "ruined"], "answer": 2}, {"id": 4, "question": "The talented Leonardo DiCaprio will be the ____________ choice for the lead in the new movie, and it will surely be a big hit.", "options": ["perfect", "upsetting", "traditional", "accidental"], "answer": 0}, {"id": 5, "question": "Oscar made an excuse in order to ____________ a class he did not like.", "options": ["recall", "skip", "present", "upset"], "answer": 1}, {"id": 6, "question": "Looking at his own ____________ in the mirror, Sidney was surprised to find that some of his hair had turned gray.", "options": ["reflection", "presentation", "depression", "memory"], "answer": 0}, {"id": 7, "question": "Kelly felt very ____________ because she didn’t do well on the English test.", "options": ["perfect", "upset", "fortunate", "memorable"], "answer": 1}, {"id": 8, "question": "It has been reported that the fierce civil war in that country eventually led to the ____________ of its capital and left numerous people homeless.", "options": ["reply", "tradition", "ruin", "accident"], "answer": 2}, {"id": 9, "question": "Allen felt quite ____________ and flushed when he mistook a stranger for his girlfriend, Julia.", "options": ["fortunate", "traditional", "memorable", "embarrassed"], "answer": 3}, {"id": 10, "question": "Diana thinks that she was ____________ to get the last ticket to her favorite singer’s concert.", "options": ["fortunate", "traditional", "memorable", "depressed"], "answer": 0}, {"id": 11, "question": "Gary finally ____________ that health was very important after he came down with a serious illness.", "options": ["memorized", "skipped", "presented", "realized"], "answer": 3}, {"id": 12, "question": "I am sure I must have met that handsome young man before, but I just can’t ____________ his name.", "options": ["recall", "depress", "realize", "present"], "answer": 0}, {"id": 13, "question": "My grandmother tells me that looking at these old photos always brings back many pleasant ____________ of her childhood.", "options": ["failures", "memories", "replies", "accidents"], "answer": 1}, {"id": 14, "question": "Christine thinks that one of the most ____________ moments in her life is when Vincent suddenly proposed to her in a romantic restaurant. She will never forget how happy she was at that time.", "options": ["depressed", "traditional", "memorable", "upset"], "answer": 2}, {"id": 15, "question": "The end of the year is a perfect time to ____________ on achievements and set goals for the future.", "options": ["skip", "reflect", "reply", "yell"], "answer": 1}, {"id": 16, "question": "Kevin’s new restaurant was a total ____________. It cost him a fortune and caused him to go broke.", "options": ["tradition", "reply", "memory", "failure"], "answer": 3}, {"id": 17, "question": "A good speaker knows when to pause during the ____________ to catch the attention of the audience.", "options": ["presentation", "depression", "ruin", "memory"], "answer": 0}, {"id": 18, "question": "In Taiwan, it is ____________ for people to eat rice dumplings on Dragon Boat Festival.", "options": ["traditional", "accidental", "embarrassed", "depressed"], "answer": 0}, {"id": 19, "question": "The Wangs ____________ locked themselves out of the house and had to wait for a locksmith.", "options": ["fortunately", "accidentally", "traditionally", "seriously"], "answer": 1}, {"id": 20, "question": "The ____________ deletion of the report caused a lot of extra work for Tom to recreate it from scratch.", "options": ["memorable", "accidental", "fortunate", "traditional"], "answer": 1}, {"id": 21, "question": "The speaker paused for a while to drink some water and then went on to finish his ____________.", "options": ["embarrassment", "depression", "presentation", "failure"], "answer": 2}, {"id": 22, "question": "Betty’s husband is suffering from deep ____________ because he was laid off several months ago and can’t find a new job.", "options": ["memory", "reflection", "reply", "depression"], "answer": 3}, {"id": 23, "question": "Derek has been ____________ ever since his girlfriend decided to break up with him several weeks ago.", "options": ["fortunate", "memorable", "depressed", "perfect"], "answer": 2}, {"id": 24, "question": "An earthquake hit the city and caused two old buildings to collapse. ____________, no one got seriously injured.", "options": ["Fortunately", "Sadly", "Suddenly", "Depressingly"], "answer": 0}, {"id": 25, "question": "Peter felt ____________ when he learned that he did not come in first at the game.", "options": ["perfect", "upset", "fortunate", "embarrassing"], "answer": 1}, {"id": 26, "question": "My homeroom teacher was angry at my classmate George because he was ____________ at others in the middle of the class.", "options": ["depressing", "yelling", "reminding", "embarrassing"], "answer": 1}, {"id": 27, "question": "Whenever the weather is fine, the calm lake in front of my house ____________ the blue sky and white clouds.", "options": ["reflects", "replies", "recalls", "reminds"], "answer": 0}, {"id": 28, "question": "After studying hard for a whole year, I finally ____________ my dream of entering a medical college.", "options": ["realized", "recalled", "replied", "reminded"], "answer": 0}, {"id": 29, "question": "My mother often ____________ me to follow traffic rules and drive slowly.", "options": ["upsets", "depresses", "reflects", "reminds"], "answer": 3}, {"id": 30, "question": "Everyone was having fun at the party, but Frank’s rude behavior ____________ the atmosphere.", "options": ["ruined", "reflected", "yelled", "memorized"], "answer": 0}];const $=s=>document.querySelector(s),list=$('#list'),select=$('#select'),quiz=$('#quiz'),result=$('#result'),question=$('#question'),answerArea=$('#answerArea'),feedback=$('#feedback'),next=$('#next');let chosen=[],idx=0;const wrong=new Map(),correct=new Set();const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ');function renderList(){list.innerHTML=Q.map(q=>'<label class="pick"><input class="pickbox" type="checkbox" value="'+q.id+'" checked><b>第 '+q.id+' 題</b></label>').join('')}$('#all').onclick=()=>document.querySelectorAll('.pickbox').forEach(x=>x.checked=true);$('#none').onclick=()=>document.querySelectorAll('.pickbox').forEach(x=>x.checked=false);$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));idx=0;wrong.clear();correct.clear();select.classList.add('hidden');result.classList.add('hidden');quiz.classList.remove('hidden');show()};function show(){const q=chosen[idx];$('#meta').textContent='第 '+(idx+1)+' / '+chosen.length+' 題';$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';$('#bar').style.width=(idx+1)/chosen.length*100+'%';question.textContent=q.question;const zh=$('#zh');if(q.zh){zh.textContent=q.zh;zh.classList.remove('hidden')}else zh.classList.add('hidden');feedback.className='feedback hidden';$('#check').classList.remove('hidden');next.classList.add('hidden');if(MODE==='mcq')answerArea.innerHTML='<div class="options">'+q.options.map((o,i)=>'<label class="option"><input type="radio" name="answer" value="'+i+'"><b>'+String.fromCharCode(65+i)+'.</b> '+esc(o)+'</label>').join('')+'</div>';else answerArea.innerHTML='<div class="inputs">'+q.answers.map((_,i)=>'<div class="answer-row"><label>'+(MODE==='multi'?['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'][i]:'答案')+'</label><input class="spell" autocomplete="off" spellcheck="false" placeholder="請輸入完整答案"></div>').join('')+'</div>';setTimeout(()=>answerArea.querySelector('input')?.focus(),0)}function currentAnswers(){if(MODE==='mcq'){const x=answerArea.querySelector('input:checked');return x?[+x.value]:[]}return [...answerArea.querySelectorAll('.spell')].map(x=>x.value)}function correctText(q){return MODE==='mcq'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.answers.join(' / ')}$('#check').onclick=()=>{const q=chosen[idx],a=currentAnswers();if((MODE==='mcq'&&!a.length)||(MODE!=='mcq'&&(a.length!==q.answers.length||a.some(x=>!x.trim()))))return alert('請完成所有答案。');const ok=MODE==='mcq'?a[0]===q.answer:a.every((x,i)=>norm(x)===norm(q.answers[i]));if(ok){correct.add(q.id);feedback.className='feedback ok';feedback.textContent='✅ 全部正確！';$('#check').classList.add('hidden');next.classList.remove('hidden')}else{if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(MODE==='mcq'?String.fromCharCode(65+a[0]):a.join(' / '));$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';feedback.className='feedback bad';feedback.innerHTML='❌ 答案不正確。正確答案：<strong>'+esc(correctText(q))+'</strong><br>請重新作答。';if(MODE==='mcq')answerArea.querySelectorAll('input').forEach(x=>x.checked=false);else answerArea.querySelectorAll('.spell').forEach(x=>x.value='');answerArea.querySelector('input')?.focus()}};next.onclick=()=>{idx++;idx>=chosen.length?finish():show()};$('#finish').onclick=finish;function finish(){quiz.classList.add('hidden');result.classList.remove('hidden');$('#summary').innerHTML='<div class="stat">選擇題數<b>'+chosen.length+'</b></div><div class="stat">完成答對<b>'+correct.size+'</b></div><div class="stat">曾答錯<b>'+wrong.size+'</b></div>';$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>'<div class="wrong"><b>'+(i+1)+'. 第 '+r.q.id+' 題</b><p>'+esc((r.q.zh?r.q.zh+'\n':'')+r.q.question)+'</p><p><strong>錯誤答案：</strong>'+r.attempts.map(esc).join('；')+'</p><p><strong>正確答案：</strong>'+esc(correctText(r.q))+'</p></div>').join(''):'<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size)}$('#restart').onclick=()=>{result.classList.add('hidden');select.classList.remove('hidden')};$('#download').onclick=async()=>{if(!wrong.size)return;const children=[new Paragraph({heading:HeadingLevel.TITLE,children:[new TextRun({text:TITLE+' 錯題紀錄',bold:true})]})];[...wrong.values()].forEach((r,i)=>{children.push(new Paragraph({heading:HeadingLevel.HEADING_2,children:[new TextRun({text:(i+1)+'. 第 '+r.q.id+' 題',bold:true})]}));if(r.q.zh)children.push(new Paragraph({children:[new TextRun({text:r.q.zh})]}));children.push(new Paragraph({children:[new TextRun({text:r.q.question})]}));children.push(new Paragraph({children:[new TextRun({text:'錯誤答案：',bold:true}),new TextRun({text:r.attempts.join('；')})]}));children.push(new Paragraph({children:[new TextRun({text:'正確答案：',bold:true}),new TextRun({text:correctText(r.q)})]}))});const doc=new Document({sections:[{children}]}),blob=await Packer.toBlob(doc),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=TITLE+'_錯題_'+new Date().toISOString().slice(0,10)+'.docx';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};renderList();</script></body></html>
