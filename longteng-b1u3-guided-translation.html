border-color:var(--blue);background:#dbeafe;color:var(--navy)}.option input{width:20px;height:20px;accent-color:var(--blue)}.inputs{display:grid;gap:10px;margin:15px 0}.answer-row{display:grid;grid-template-columns:55px 1fr;gap:10px;align-items:center}.answer-row label{font-weight:900;color:var(--navy);text-align:center}.spell{width:100%;font:inherit;font-size:18px;padding:11px;border:2px solid #94a3b8;border-radius:9px}.feedback{padding:13px;border-radius:10px;font-weight:800;margin:13px 0}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}.wrong p{margin:6px 0}@media(max-width:600px){.wrap{padding:9px}.hero,.card{padding:15px}.question{font-size:18px;padding:13px}.option{font-size:17px}.answer-row{grid-template-columns:42px 1fr}}</style></head><body><main class="wrap"><section class="hero"><h1>龍騰B1U3 引導式翻譯</h1><p>共 39 題。可自行選題；答錯會顯示正確答案並要求重新作答。</p><p class="note">完成後可下載包含錯誤答案與正確答案的 DOCX 錯題紀錄。</p></section><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn">全部選取</button><button id="none" class="btn">全部取消</button><button id="start" class="btn primary">開始作答</button></div><div id="list"></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="download" class="btn primary">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></main><script type="module">import{Document,Packer,Paragraph,TextRun,HeadingLevel}from'https://esm.sh/docx@9.5.1';const TITLE="龍騰B1U3 引導式翻譯",MODE="multi",Q=[{"id": 1, "zh": "Adam 討厭某些蔬菜；例如，他從不吃萵苣。", "question": "Adam hates certain vegetables; ①____________ ②____________, he never eats lettuce.", "answers": ["for", "example"]}, {"id": 2, "zh": "在擁擠的夜市，小男孩緊緊抓住媽媽的手，因為他害怕自己會迷路。", "question": "In the crowded night market, the little boy ①____________ ②_____________ ③____________ his mother’s hand, for he was afraid that he might get lost.", "answers": ["held", "on", "to"]}, {"id": 3, "zh": "根據研究，自從1970年代起，已有高達200個青蛙品種消失了。", "question": "①A____________ ②_____________ studies, ③____________ ④____________ 200 frog species have disappeared since the 1970s.", "answers": ["According", "to", "up", "to"]}, {"id": 4, "zh": "蝙蝠也許看起來嚇人，但事實上牠們挺無害的，而且是世界上許多植物的重要授粉者。", "question": "Bats may look scary, but ①____________ ②f_____________ they are quite harmless and are important pollinators for many plants around the world.", "answers": ["in", "fact"]}, {"id": 5, "zh": "薪水的設定是根據每位員工的能力與經驗。", "question": "His or her salary is set ①a____________ ②_____________ each employee’s ability and experience.", "answers": ["according", "to"]}, {"id": 6, "zh": "根據這項研究，這個國家的抽菸人數正在增加中。", "question": "①A____________ ②_____________ the study, the number of people who smoke in this country is increasing.", "answers": ["According", "to"]}, {"id": 7, "zh": "當你站在移動中的巴士時，抓住車上其中一根扶桿是個好主意。", "question": "It is a good idea to ①____________ ②____________ ③____________ one of the poles while you are standing on a moving bus.", "answers": ["hold", "on", "to"]}, {"id": 8, "zh": "令人驚奇的是，有些泳者可以憋氣長達二十分鐘。", "question": "Amazingly, some swimmers can hold their breath for ①____________ ②____________ twenty minutes.", "answers": ["up", "to"]}, {"id": 9, "zh": "根據這篇新聞報導，這整個村莊都被這場地震摧毀了。", "question": "①____________ ②____________ this news report, the whole village was ruined by the earthquake.", "answers": ["According", "to"]}, {"id": 10, "zh": "Katie記憶力很好。舉例來說，她可以把一篇短文讀過一遍後就背起來。", "question": "Katie has a really good memory. ①____________ ②____________, she can memorize a short passage after she reads it once.", "answers": ["For", "example"]}, {"id": 11, "zh": "暴風雨過後，在山區開車要小心落石。", "question": "①____________ ②____________ ③____________ ④____________ ⑤____________ falling rocks when you drive through the mountains after a rainstorm.", "answers": ["Be", "on", "the", "lookout", "for"]}, {"id": 12, "zh": "當你在森林裡健行時，一定要小心蜂群出沒。", "question": "Make sure to ①____________ ②____________ ③____________ bees when you go hiking in the forest.", "answers": ["look", "out", "for"]}, {"id": 13, "zh": "要修復颱風所造成的損害可能要花上長達十年的時間。", "question": "It could take ①____________ ②_____________ ten years to repair the damage caused by the typhoon.", "answers": ["up", "to"]}, {"id": 14, "zh": "雖然Jennifer告訴自己要保持冷靜，她還是失控了，對著哭鬧的嬰兒大吼。", "question": "Although Jennifer told herself to ①____________ ②_____________, she lost control and yelled at the crying baby.", "answers": ["stay", "calm"]}, {"id": 15, "zh": "你是否曾經想過動物是如何睡覺的嗎？你可能會對一些有關動物睡眠習慣的驚人事實感到驚訝。", "question": "Have you ever ①____________ ②_____________ animals sleep? You might be surprised by some of these ③____________ facts ④____________ animal sleeping habits.", "answers": ["wondered", "how", "amazing", "about"]}, {"id": 16, "zh": "科技縮短人與人之間的距離。舉例來說，它讓我們可輕易地與世界各地的朋友聯絡。", "question": "Technology shortens the distance between people. ①____________ ②e_____________, it enables us to easily contact our friends around the world.", "answers": ["For", "example"]}, {"id": 17, "zh": "有許多方法可以慶祝母親節。舉例來說，你可以做個蛋糕送給媽媽。", "question": "There are many ways to celebrate Mother’s Day. ①____________ ②e_____________, you can make a cake for your mother.", "answers": ["For", "example"]}, {"id": 18, "zh": "警察站在路邊，注意是否有酒醉駕駛。", "question": "Standing by the roadside, the police ①____________ on ②_____________ ③____________ for drunk drivers.", "answers": ["are", "the", "lookout"]}, {"id": 19, "zh": "搭乘電扶梯時請確實握緊扶手。", "question": "Make sure to ①____________ ②_____________ ③____________ the rail while taking the escalator.", "answers": ["hold", "on", "to"]}, {"id": 20, "zh": "學生依照身高排隊拍班級照。", "question": "Students were lined up for the class picture ①____________ ②____________ their height.", "answers": ["according", "to"]}, {"id": 21, "zh": "不管發生什麼事，老闆都堅持他的原則。", "question": "The boss always ①____________ ②____________ ③____________ his principles no matter what happens.", "answers": ["holds", "on", "to"]}, {"id": 22, "zh": "我們應該當心任何可疑的人。他可能是警方正在尋找的人。", "question": "We should ①____________ ②____________ ③____________ ④____________ ⑤____________ any suspicious man. He may be the one the police are looking for.", "answers": ["be", "on", "the", "lookout", "for"]}, {"id": 23, "zh": "對許多外國人來說，中文比英文困難得多。", "question": "For many foreigners, Chinese is ①____________ ②____________ ③____________ than English.", "answers": ["much", "more", "difficult"]}, {"id": 24, "zh": "這家超市一直營業到午夜。我們現在還可以去買東西。", "question": "The supermarket ①____________ ②____________ until midnight. We can still go shopping now.", "answers": ["stays", "open"]}, {"id": 25, "zh": "我納悶Dean是如何得到那份工作的。", "question": "I wonder ①____________ ②____________ ③____________ that job.", "answers": ["how", "Dean", "got"]}, {"id": 26, "zh": "John每天工作高達十二小時以趕上最後期限。", "question": "John worked ①____________ ②____________ twelve hours per day to meet the deadline.", "answers": ["up", "to"]}, {"id": 27, "zh": "當你穿越馬路時，永遠要小心車子。", "question": "Always ①____________ ②____________ ③____________ cars when you cross the road.", "answers": ["look", "out", "for"]}, {"id": 28, "zh": "我設法抓緊我的雨傘，以免它被強風吹走。", "question": "I tried to ①____________ ②____________ ③____________ my umbrella so that it wouldn’t be blown away by the strong wind.", "answers": ["hold", "on", "to"]}, {"id": 29, "zh": "根據最新研究，每晚睡超過八小時的人比較容易減重。", "question": "①____________ ②____________ the latest study, people who sleep more than eight hours at night can lose weight more easily.", "answers": ["According", "to"]}, {"id": 30, "zh": "當你出國旅行時，你應該時時保護好自己的貴重物品，並當心扒手。", "question": "You should always protect your valuables and be ①____________ ②_____________ ③____________ ④____________ pickpockets when you travel abroad.", "answers": ["on", "the", "lookout", "for"]}, {"id": 31, "zh": "雖然他們是雙胞胎，Ian比他弟弟要聰明多了。", "question": "Although they are twins, Ian is ①____________ cleverer ②_____________ his brother.", "answers": ["much", "than"]}, {"id": 32, "zh": "當他們走進黑暗的房間時，這個小女孩緊緊抓著爸爸的手。", "question": "The little girl ①____________ ②_____________ ③____________ her father’s hand as they walked into the dark room.", "answers": ["held", "on", "to"]}, {"id": 33, "zh": "不像大部分的動物，長頸鹿每天平均只睡30分鐘。", "question": "①____________ most animals, giraffes only sleep 30 minutes a day ②____________ ③____________.", "answers": ["Unlike", "on", "average"]}, {"id": 34, "zh": "這座棒球體育場可容納多達五萬名粉絲。", "question": "This baseball stadium can hold ①____________ ②_____________ 50,000 fans.", "answers": ["up", "to"]}, {"id": 35, "zh": "蓋這棟房子將會花費高達一千萬元。", "question": "It will cost ①____________ ②_____________ ten million dollars to build the house.", "answers": ["up", "to"]}, {"id": 36, "zh": "在山裡健行時要當心蛇出沒。", "question": "You have to ①____________ ②_____________ ③____________ snakes while hiking in the mountains.", "answers": ["look", "out", "for"]}, {"id": 37, "zh": "舉世聞名的《蒙娜麗莎》是義大利文藝復興畫家李奧納多．達文西所畫的。", "question": "The world-famous Mona Lisa ①____________ ②____________ ③____________ the Italian Renaissance painter Leonardo da Vinci.", "answers": ["was", "painted", "by"]}, {"id": 38, "zh": "Smith老師認為在課堂上有些舉動是沒有禮貌的。比如說，在他的課堂上吃東西是不被允許的。", "question": "Mr. Smith considers some behaviors impolite in class. ①____________ ②____________, eating is not allowed in his class.", "answers": ["For", "example"]}, {"id": 39, "zh": "許多我們在美國買得到的電子產品都是在臺灣製造的。", "question": "Many electronic products which we can buy in America ①____________ ②____________ in Taiwan.", "answers": ["were", "made"]}];const $=s=>document.querySelector(s),list=$('#list'),select=$('#select'),quiz=$('#quiz'),result=$('#result'),question=$('#question'),answerArea=$('#answerArea'),feedback=$('#feedback'),next=$('#next');let chosen=[],idx=0;const wrong=new Map(),correct=new Set();const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ');function renderList(){list.innerHTML=Q.map(q=>'<label class="pick"><input class="pickbox" type="checkbox" value="'+q.id+'" checked><b>第 '+q.id+' 題</b></label>').join('')}$('#all').onclick=()=>document.querySelectorAll('.pickbox').forEach(x=>x.checked=true);$('#none').onclick=()=>document.querySelectorAll('.pickbox').forEach(x=>x.checked=false);$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));idx=0;wrong.clear();correct.clear();select.classList.add('hidden');result.classList.add('hidden');quiz.classList.remove('hidden');show()};function show(){const q=chosen[idx];$('#meta').textContent='第 '+(idx+1)+' / '+chosen.length+' 題';$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';$('#bar').style.width=(idx+1)/chosen.length*100+'%';question.textContent=q.question;const zh=$('#zh');if(q.zh){zh.textContent=q.zh;zh.classList.remove('hidden')}else zh.classList.add('hidden');feedback.className='feedback hidden';$('#check').classList.remove('hidden');next.classList.add('hidden');if(MODE==='mcq')answerArea.innerHTML='<div class="options">'+q.options.map((o,i)=>'<label class="option"><input type="radio" name="answer" value="'+i+'"><b>'+String.fromCharCode(65+i)+'.</b> '+esc(o)+'</label>').join('')+'</div>';else answerArea.innerHTML='<div class="inputs">'+q.answers.map((_,i)=>'<div class="answer-row"><label>'+(MODE==='multi'?['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'][i]:'答案')+'</label><input class="spell" autocomplete="off" spellcheck="false" placeholder="請輸入完整答案"></div>').join('')+'</div>';setTimeout(()=>answerArea.querySelector('input')?.focus(),0)}function currentAnswers(){if(MODE==='mcq'){const x=answerArea.querySelector('input:checked');return x?[+x.value]:[]}return [...answerArea.querySelectorAll('.spell')].map(x=>x.value)}function correctText(q){return MODE==='mcq'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.answers.join(' / ')}$('#check').onclick=()=>{const q=chosen[idx],a=currentAnswers();if((MODE==='mcq'&&!a.length)||(MODE!=='mcq'&&(a.length!==q.answers.length||a.some(x=>!x.trim()))))return alert('請完成所有答案。');const ok=MODE==='mcq'?a[0]===q.answer:a.every((x,i)=>q.answers[i].split(/\|\||\//).some(v=>norm(x)===norm(v)));if(ok){correct.add(q.id);feedback.className='feedback ok';feedback.textContent='✅ 全部正確！';$('#check').classList.add('hidden');next.classList.remove('hidden')}else{if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(MODE==='mcq'?String.fromCharCode(65+a[0]):a.join(' / '));$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';feedback.className='feedback bad';feedback.innerHTML='❌ 答案不正確。正確答案：<strong>'+esc(correctText(q))+'</strong><br>請重新作答。';if(MODE==='mcq')answerArea.querySelectorAll('input').forEach(x=>x.checked=false);else answerArea.querySelectorAll('.spell').forEach(x=>x.value='');answerArea.querySelector('input')?.focus()}};next.onclick=()=>{idx++;idx>=chosen.length?finish():show()};$('#finish').onclick=finish;function finish(){quiz.classList.add('hidden');result.classList.remove('hidden');$('#summary').innerHTML='<div class="stat">選擇題數<b>'+chosen.length+'</b></div><div class="stat">完成答對<b>'+correct.size+'</b></div><div class="stat">曾答錯<b>'+wrong.size+'</b></div>';$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>'<div class="wrong"><b>'+(i+1)+'. 第 '+r.q.id+' 題</b><p>'+esc((r.q.zh?r.q.zh+'\n':'')+r.q.question)+'</p><p><strong>錯誤答案：</strong>'+r.attempts.map(esc).join('；')+'</p><p><strong>正確答案：</strong>'+esc(correctText(r.q))+'</p></div>').join(''):'<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size)}$('#restart').onclick=()=>{result.classList.add('hidden');select.classList.remove('hidden')};$('#download').onclick=async()=>{if(!wrong.size)return;const children=[new Paragraph({heading:HeadingLevel.TITLE,children:[new TextRun({text:TITLE+' 錯題紀錄',bold:true})]})];[...wrong.values()].forEach((r,i)=>{children.push(new Paragraph({heading:HeadingLevel.HEADING_2,children:[new TextRun({text:(i+1)+'. 第 '+r.q.id+' 題',bold:true})]}));if(r.q.zh)children.push(new Paragraph({children:[new TextRun({text:r.q.zh})]}));children.push(new Paragraph({children:[new TextRun({text:r.q.question})]}));children.push(new Paragraph({children:[new TextRun({text:'錯誤答案：',bold:true}),new TextRun({text:r.attempts.join('；')})]}));children.push(new Paragraph({children:[new TextRun({text:'正確答案：',bold:true}),new TextRun({text:correctText(r.q)})]}))});const doc=new Document({sections:[{children}]}),blob=await Packer.toBlob(doc),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=TITLE+'_錯題_'+new Date().toISOString().slice(0,10)+'.docx';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};renderList();</script></body></html>
