  <script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 3｜引導式翻譯","mode":"multi","questions":[{"id":1,"zh":"Adam 討厭某些蔬菜；例如，他從不吃萵苣。","question":"Adam hates certain vegetables; ①____________ ②____________, he never eats lettuce.","answers":["for","example"],"source":"All in One","explanation":"句意：Adam 討厭某些蔬菜；例如，他從不吃萵苣。 本題依序填入：for、example。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":2,"zh":"在擁擠的夜市，小男孩緊緊抓住媽媽的手，因為他害怕自己會迷路。","question":"In the crowded night market, the little boy ①____________ ②_____________ ③____________ his mother’s hand, for he was afraid that he might get lost.","answers":["held","on","to"],"source":"龍騰自命題","explanation":"for 因為","explanationSource":"source"},{"id":3,"zh":"根據研究，自從1970年代起，已有高達200個青蛙品種消失了。","question":"①A____________ ②_____________ studies, ③____________ ④____________ 200 frog species have disappeared since the 1970s.","answers":["According","to","up","to"],"source":"龍騰自命題","explanation":"species 品種","explanationSource":"source"},{"id":4,"zh":"蝙蝠也許看起來嚇人，但事實上牠們挺無害的，而且是世界上許多植物的重要授粉者。","question":"Bats may look scary, but ①____________ ②f_____________ they are quite harmless and are important pollinators for many plants around the world.","answers":["in","fact"],"source":"龍騰自命題","explanation":"harmless 無害的  pollinator 授粉者","explanationSource":"source"},{"id":5,"zh":"薪水的設定是根據每位員工的能力與經驗。","question":"His or her salary is set ①a____________ ②_____________ each employee’s ability and experience.","answers":["according","to"],"source":"龍騰自命題","explanation":"salary 薪水","explanationSource":"source"},{"id":6,"zh":"根據這項研究，這個國家的抽菸人數正在增加中。","question":"①A____________ ②_____________ the study, the number of people who smoke in this country is increasing.","answers":["According","to"],"source":"龍騰自命題","explanation":"study 調查，研究","explanationSource":"source"},{"id":7,"zh":"當你站在移動中的巴士時，抓住車上其中一根扶桿是個好主意。","question":"It is a good idea to ①____________ ②____________ ③____________ one of the poles while you are standing on a moving bus.","answers":["hold","on","to"],"source":"課本例句填空","explanation":"句意：當你站在移動中的巴士時，抓住車上其中一根扶桿是個好主意。 本題依序填入：hold、on、to。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":8,"zh":"令人驚奇的是，有些泳者可以憋氣長達二十分鐘。","question":"Amazingly, some swimmers can hold their breath for ①____________ ②____________ twenty minutes.","answers":["up","to"],"source":"課本例句填空","explanation":"句意：令人驚奇的是，有些泳者可以憋氣長達二十分鐘。 本題依序填入：up、to。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":9,"zh":"根據這篇新聞報導，這整個村莊都被這場地震摧毀了。","question":"①____________ ②____________ this news report, the whole village was ruined by the earthquake.","answers":["According","to"],"source":"課本例句填空","explanation":"句意：根據這篇新聞報導，這整個村莊都被這場地震摧毀了。 本題依序填入：According、to。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":10,"zh":"Katie記憶力很好。舉例來說，她可以把一篇短文讀過一遍後就背起來。","question":"Katie has a really good memory. ①____________ ②____________, she can memorize a short passage after she reads it once.","answers":["For","example"],"source":"課本例句填空","explanation":"句意：Katie記憶力很好。舉例來說，她可以把一篇短文讀過一遍後就背起來。 本題依序填入：For、example。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":11,"zh":"暴風雨過後，在山區開車要小心落石。","question":"①____________ ②____________ ③____________ ④____________ ⑤____________ falling rocks when you drive through the mountains after a rainstorm.","answers":["Be","on","the","lookout","for"],"source":"課本例句填空","explanation":"句意：暴風雨過後，在山區開車要小心落石。 本題依序填入：Be、on、the、lookout、for。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":12,"zh":"當你在森林裡健行時，一定要小心蜂群出沒。","question":"Make sure to ①____________ ②____________ ③____________ bees when you go hiking in the forest.","answers":["look","out","for"],"source":"課本例句填空","explanation":"句意：當你在森林裡健行時，一定要小心蜂群出沒。 本題依序填入：look、out、for。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":13,"zh":"要修復颱風所造成的損害可能要花上長達十年的時間。","question":"It could take ①____________ ②_____________ ten years to repair the damage caused by the typhoon.","answers":["up","to"],"source":"龍騰自命題","explanation":"It + take + 時間 + to VR... ……需要花費……時間","explanationSource":"source"},{"id":14,"zh":"雖然Jennifer告訴自己要保持冷靜，她還是失控了，對著哭鬧的嬰兒大吼。","question":"Although Jennifer told herself to ①____________ ②_____________, she lost control and yelled at the crying baby.","answers":["stay","calm"],"source":"龍騰自命題","explanation":"stay 為連綴動詞，其後接形容詞。stay calm 保持冷靜","explanationSource":"source"},{"id":15,"zh":"你是否曾經想過動物是如何睡覺的嗎？你可能會對一些有關動物睡眠習慣的驚人事實感到驚訝。","question":"Have you ever ①____________ ②_____________ animals sleep? You might be surprised by some of these ③____________ facts ④____________ animal sleeping habits.","answers":["wondered","how","amazing","about"],"source":"龍騰自命題","explanation":"Have you ever wondered... 你是否曾經想過……","explanationSource":"source"},{"id":16,"zh":"科技縮短人與人之間的距離。舉例來說，它讓我們可輕易地與世界各地的朋友聯絡。","question":"Technology shortens the distance between people. ①____________ ②e_____________, it enables us to easily contact our friends around the world.","answers":["For","example"],"source":"龍騰自命題","explanation":"shorten 縮短","explanationSource":"source"},{"id":17,"zh":"有許多方法可以慶祝母親節。舉例來說，你可以做個蛋糕送給媽媽。","question":"There are many ways to celebrate Mother’s Day. ①____________ ②e_____________, you can make a cake for your mother.","answers":["For","example"],"source":"龍騰自命題","explanation":"celebrate 慶祝","explanationSource":"source"},{"id":18,"zh":"警察站在路邊，注意是否有酒醉駕駛。","question":"Standing by the roadside, the police ①____________ on ②_____________ ③____________ for drunk drivers.","answers":["are","the","lookout"],"source":"龍騰自命題","explanation":"roadside 路旁","explanationSource":"source"},{"id":19,"zh":"搭乘電扶梯時請確實握緊扶手。","question":"Make sure to ①____________ ②_____________ ③____________ the rail while taking the escalator.","answers":["hold","on","to"],"source":"龍騰自命題","explanation":"rail 扶手  escalator 電扶梯","explanationSource":"source"},{"id":20,"zh":"學生依照身高排隊拍班級照。","question":"Students were lined up for the class picture ①____________ ②____________ their height.","answers":["according","to"],"source":"All in One","explanation":"句意：學生依照身高排隊拍班級照。 本題依序填入：according、to。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":21,"zh":"不管發生什麼事，老闆都堅持他的原則。","question":"The boss always ①____________ ②____________ ③____________ his principles no matter what happens.","answers":["holds","on","to"],"source":"All in One","explanation":"句意：不管發生什麼事，老闆都堅持他的原則。 本題依序填入：holds、on、to。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":22,"zh":"我們應該當心任何可疑的人。他可能是警方正在尋找的人。","question":"We should ①____________ ②____________ ③____________ ④____________ ⑤____________ any suspicious man. He may be the one the police are looking for.","answers":["be","on","the","lookout","for"],"source":"三合一學習手冊","explanation":"句意：我們應該當心任何可疑的人。他可能是警方正在尋找的人。 本題依序填入：be、on、the、lookout、for。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":23,"zh":"對許多外國人來說，中文比英文困難得多。","question":"For many foreigners, Chinese is ①____________ ②____________ ③____________ than English.","answers":["much","more","difficult"],"source":"三合一學習手冊","explanation":"句意：對許多外國人來說，中文比英文困難得多。 本題依序填入：much、more、difficult。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":24,"zh":"這家超市一直營業到午夜。我們現在還可以去買東西。","question":"The supermarket ①____________ ②____________ until midnight. We can still go shopping now.","answers":["stays","open"],"source":"三合一學習手冊","explanation":"句意：這家超市一直營業到午夜。我們現在還可以去買東西。 本題依序填入：stays、open。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":25,"zh":"我納悶Dean是如何得到那份工作的。","question":"I wonder ①____________ ②____________ ③____________ that job.","answers":["how","Dean","got"],"source":"三合一學習手冊","explanation":"句意：我納悶Dean是如何得到那份工作的。 本題依序填入：how、Dean、got。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":26,"zh":"John每天工作高達十二小時以趕上最後期限。","question":"John worked ①____________ ②____________ twelve hours per day to meet the deadline.","answers":["up","to"],"source":"三合一學習手冊","explanation":"句意：John每天工作高達十二小時以趕上最後期限。 本題依序填入：up、to。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":27,"zh":"當你穿越馬路時，永遠要小心車子。","question":"Always ①____________ ②____________ ③____________ cars when you cross the road.","answers":["look","out","for"],"source":"三合一學習手冊","explanation":"句意：當你穿越馬路時，永遠要小心車子。 本題依序填入：look、out、for。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":28,"zh":"我設法抓緊我的雨傘，以免它被強風吹走。","question":"I tried to ①____________ ②____________ ③____________ my umbrella so that it wouldn’t be blown away by the strong wind.","answers":["hold","on","to"],"source":"三合一學習手冊","explanation":"句意：我設法抓緊我的雨傘，以免它被強風吹走。 本題依序填入：hold、on、to。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":29,"zh":"根據最新研究，每晚睡超過八小時的人比較容易減重。","question":"①____________ ②____________ the latest study, people who sleep more than eight hours at night can lose weight more easily.","answers":["According","to"],"source":"三合一學習手冊","explanation":"句意：根據最新研究，每晚睡超過八小時的人比較容易減重。 本題依序填入：According、to。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":30,"zh":"當你出國旅行時，你應該時時保護好自己的貴重物品，並當心扒手。","question":"You should always protect your valuables and be ①____________ ②_____________ ③____________ ④____________ pickpockets when you travel abroad.","answers":["on","the","lookout","for"],"source":"龍騰自命題","explanation":"valuables 貴重物品  pickpocket 扒手","explanationSource":"source"},{"id":31,"zh":"雖然他們是雙胞胎，Ian比他弟弟要聰明多了。","question":"Although they are twins, Ian is ①____________ cleverer ②_____________ his brother.","answers":["much","than"],"source":"龍騰自命題","explanation":"副詞much可用來修飾形容比較級。","explanationSource":"source"},{"id":32,"zh":"當他們走進黑暗的房間時，這個小女孩緊緊抓著爸爸的手。","question":"The little girl ①____________ ②_____________ ③____________ her father’s hand as they walked into the dark room.","answers":["held","on","to"],"source":"龍騰自命題","explanation":"as 當","explanationSource":"source"},{"id":33,"zh":"不像大部分的動物，長頸鹿每天平均只睡30分鐘。","question":"①____________ most animals, giraffes only sleep 30 minutes a day ②____________ ③____________.","answers":["Unlike","on","average"],"source":"龍騰自命題","explanation":"on average 平均","explanationSource":"source"},{"id":34,"zh":"這座棒球體育場可容納多達五萬名粉絲。","question":"This baseball stadium can hold ①____________ ②_____________ 50,000 fans.","answers":["up","to"],"source":"龍騰自命題","explanation":"stadium 體育場","explanationSource":"source"},{"id":35,"zh":"蓋這棟房子將會花費高達一千萬元。","question":"It will cost ①____________ ②_____________ ten million dollars to build the house.","answers":["up","to"],"source":"龍騰自命題","explanation":"cost 花費（金錢）","explanationSource":"source"},{"id":36,"zh":"在山裡健行時要當心蛇出沒。","question":"You have to ①____________ ②_____________ ③____________ snakes while hiking in the mountains.","answers":["look","out","for"],"source":"龍騰自命題","explanation":"hike 健行","explanationSource":"source"},{"id":37,"zh":"舉世聞名的《蒙娜麗莎》是義大利文藝復興畫家李奧納多．達文西所畫的。","question":"The world-famous Mona Lisa ①____________ ②____________ ③____________ the Italian Renaissance painter Leonardo da Vinci.","answers":["was","painted","by"],"source":"龍騰自命題","explanation":"被動語態句型S + be + p.p. (+ by + O)....","explanationSource":"source"},{"id":38,"zh":"Smith老師認為在課堂上有些舉動是沒有禮貌的。比如說，在他的課堂上吃東西是不被允許的。","question":"Mr. Smith considers some behaviors impolite in class. ①____________ ②____________, eating is not allowed in his class.","answers":["For","example"],"source":"三合一學習手冊","explanation":"句意：Smith老師認為在課堂上有些舉動是沒有禮貌的。比如說，在他的課堂上吃東西是不被允許的。 本題依序填入：For、example。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":39,"zh":"許多我們在美國買得到的電子產品都是在臺灣製造的。","question":"Many electronic products which we can buy in America ①____________ ②____________ in Taiwan.","answers":["were","made"],"source":"三合一學習手冊","explanation":"句意：許多我們在美國買得到的電子產品都是在臺灣製造的。 本題依序填入：were、made。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"}]};</script>
