<script>window.QUIZ_CONFIG={"title": "國中會考單字片語｜慣用語與句型 Expressions & Sentence Patterns", "mode": "mcq", "questions": [{"id": 1, "question": "A: I just won a free trip to Japan!\nB: ______ You never win anything!", "options": ["I get it.", "Are you kidding?", "See you later.", "What do you have in mind?"], "answer": 1, "answerLabel": "B", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(B) Are you kidding?\n【用語】Are you kidding? (phr.)：你在開玩笑吧？\n【中譯】A：我剛贏得一趟免費的日本之旅！\nB：你在開玩笑吧？你從來沒贏過任何東西！", "explanationSource": "supplemental"}, {"id": 2, "question": "A: I'm going to eat Tom's ice cream in the fridge.\nB: ______ He gets really angry when people take his food.", "options": ["I have seen this movie before.", "So long.", "What a play!", "Don't cross him."], "answer": 3, "answerLabel": "D", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(D) Don't cross him.\n【用語】Don't cross + 人. (phr.)：別惹⋯⋯生氣\n【中譯】A：我要去吃冰箱裡湯姆的冰淇淋。\nB：別惹他生氣。別人拿他的食物時，他會非常生氣。", "explanationSource": "supplemental"}, {"id": 3, "question": "A: The concert tickets are on sale for only one more hour. Should I buy one?\nB: ______ Buy it right now!", "options": ["It's now or never.", "It turns out that the shop is closed.", "An earthquake hit the town.", "I'll pass."], "answer": 0, "answerLabel": "A", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(A) It's now or never.\n【用語】It's now or never. (phr.)：機不可失；此時不做更待何時\n【中譯】A：演唱會門票只剩一個小時可以買。我該買一張嗎？\nB：機不可失。現在馬上買！", "explanationSource": "supplemental"}, {"id": 4, "question": "A: I think we should have the class party on Friday.\nB: ______ Friday is the best day for everyone.", "options": ["Talk to you later.", "It's time for lunch.", "I second that.", "Seeing is believing."], "answer": 2, "answerLabel": "C", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(C) I second that.\n【用語】I second that. (phr.)：我附議／我贊同（正式或幽默用法）\n【中譯】A：我認為我們應該在星期五辦班級派對。\nB：我贊同。星期五對大家來說是最好的日子。", "explanationSource": "supplemental"}, {"id": 5, "question": "A: How was the sunrise at Alishan?\nB: ______ I have never seen anything so beautiful.", "options": ["It took my breath away.", "It doesn't count.", "It is here to stay.", "It cost an arm and a leg."], "answer": 0, "answerLabel": "A", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(A) It took my breath away.\n【用語】take + 人's breath away (phr.)：令人屏息；令人驚艷\n【中譯】A：阿里山的日出怎麼樣？\nB：它美得令我屏息。我從來沒看過這麼美的東西。", "explanationSource": "supplemental"}, {"id": 6, "question": "A: Do you mind if I open the window?\nB: ______ Go ahead.", "options": ["I don't mind.", "What a play!", "Good things never last.", "It's too expensive, though."], "answer": 0, "answerLabel": "A", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(A) I don't mind.\n【用語】I don't mind. (phr.)：我不介意\n【中譯】A：你介意我打開窗戶嗎？\nB：我不介意。請便。", "explanationSource": "supplemental"}, {"id": 7, "question": "At the end of her birthday card to Grandma, Amy wrote, \"______, Amy.\"", "options": ["Best wishes", "Poor as a church mouse", "Trick or treat", "There is a market for cards"], "answer": 0, "answerLabel": "A", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(A) Best wishes\n【用語】Best wishes (phr.)：致上最誠摯的祝福\n【中譯】在給奶奶的生日卡片最後，艾咪寫道：「致上最誠摯的祝福，艾咪。」", "explanationSource": "supplemental"}, {"id": 8, "question": "A: Who will buy the drinks for the party?\nB: ______ I already bought ten bottles of juice.", "options": ["I don't know when the party will start.", "I've got it covered.", "I turned a blind eye to it.", "My mind went blank."], "answer": 1, "answerLabel": "B", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(B) I've got it covered.\n【用語】I've got it covered. (phr.)：搞定；處理好了\n【中譯】A：誰要買派對的飲料？\nB：我搞定了。我已經買了十瓶果汁。", "explanationSource": "supplemental"}, {"id": 9, "question": "A: You ran ten kilometers this morning. Are you tired?\nB: ______ I feel great!", "options": ["The more, the merrier.", "I'm not tired at all.", "Do you mind helping me?", "I don't get it."], "answer": 1, "answerLabel": "B", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(B) I'm not tired at all.\n【用語】not + V/adj. + at all (phr.)：一點也不……、完全不……\n【中譯】A：你今天早上跑了十公里。你累嗎？\nB：我一點也不累。我覺得很棒！", "explanationSource": "supplemental"}, {"id": 10, "question": "A: That new boy looks scary. I don't want to talk to him.\nB: ______ He is actually very kind.", "options": ["Don't judge a book by its cover.", "Understood?", "Good things never last.", "It doesn't count."], "answer": 0, "answerLabel": "A", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(A) Don't judge a book by its cover.\n【用語】Don't judge a book by its cover. (phr.)：不可貌相；別以貌取人\n【中譯】A：那個新來的男孩看起來很可怕。我不想跟他說話。\nB：人不可貌相。他其實非常善良。", "explanationSource": "supplemental"}, {"id": 11, "question": "The teacher said, \"______ Please put down your pencils and hand in your test papers.\"", "options": ["Do you get it?", "What's up?", "Chances are that it will rain.", "Time is up."], "answer": 3, "answerLabel": "D", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(D) Time is up.\n【用語】Time is up. (phr.)：時間到了\n【中譯】老師說：「時間到了。請放下鉛筆，交出你們的考卷。」", "explanationSource": "supplemental"}, {"id": 12, "question": "A: Mom, can I play video games now?\nB: ______ Finish your homework, and then you can play.", "options": ["What else do you want to do?", "What a play!", "It's on me.", "First things first."], "answer": 3, "answerLabel": "D", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(D) First things first.\n【用語】First things first. (phr.)：要事第一；先做重要的事\n【中譯】A：媽，我現在可以玩電動嗎？\nB：先做重要的事。把你的功課寫完，然後你就可以玩。", "explanationSource": "supplemental"}, {"id": 13, "question": "A: Dad, can I skip washing the dishes tonight?\nB: No. You promised to wash them if I bought you the new game. ______", "options": ["Way to go.", "The report says that it will rain.", "That was close.", "A deal is a deal."], "answer": 3, "answerLabel": "D", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(D) A deal is a deal.\n【用語】A deal is a deal. (phr.)：說好的事就要算數\n【中譯】A：爸，我今晚可以不洗碗嗎？\nB：不行。你答應過如果我買新遊戲給你，你就會洗碗。說好的事就要算數。", "explanationSource": "supplemental"}, {"id": 14, "question": "A: How was the math test?\nB: ______ I finished it in ten minutes and got 100.", "options": ["Way to go.", "It doesn't matter if I pass.", "It's beyond me.", "It was a piece of cake."], "answer": 3, "answerLabel": "D", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(D) It was a piece of cake.\n【用語】a piece of cake (phr.)：輕而易舉\n【中譯】A：數學考試怎麼樣？\nB：輕而易舉。我十分鐘就寫完，還考了一百分。", "explanationSource": "supplemental"}, {"id": 15, "question": "A: Is Jenny coming to your birthday party?\nB: ______ She hasn't answered my message yet.", "options": ["What a play!", "There's no way through.", "I don't know if she will come.", "One is red, and the other is blue."], "answer": 2, "answerLabel": "C", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(C) I don't know if she will come.\n【用語】S + V + if + 未來式 (phr.)：間接問句：未來是否會發生某事（= whether）\n【中譯】A：珍妮會來你的生日派對嗎？\nB：我不知道她會不會來。她還沒回我的訊息。", "explanationSource": "supplemental"}, {"id": 16, "question": "A: Look at those birds in the sky.\nB: ______ Then I could go anywhere I like.", "options": ["Leave me alone.", "If only I could fly!", "Trick or treat!", "Honesty is the best policy."], "answer": 1, "answerLabel": "B", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(B) If only I could fly!\n【用語】If only + 子句 (phr.)：但願、要是……多好\n【中譯】A：看天空中的那些鳥。\nB：要是我會飛就好了！那我就可以去任何我想去的地方。", "explanationSource": "supplemental"}, {"id": 17, "question": "A: Why did the chicken cross the road? To get to the other side! Ha ha!\nB: ______ Why is that funny?", "options": ["I'll call you later.", "I don't get it.", "You can say that again.", "It's on me."], "answer": 1, "answerLabel": "B", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(B) I don't get it.\n【用語】I don't get it. (phr.)：我不懂\n【中譯】A：雞為什麼要過馬路？為了到另一邊去！哈哈！\nB：我不懂。那有什麼好笑的？", "explanationSource": "supplemental"}, {"id": 18, "question": "A: I'm afraid to try skydiving.\nB: Come on! ______ Try something new and enjoy your life!", "options": ["Oh my goodness!", "What's your take on the movie?", "Don't push me.", "You only live once."], "answer": 3, "answerLabel": "D", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(D) You only live once.\n【用語】You only live once. (phr.)：人生只有一次；及時行樂\n【中譯】A：我不敢嘗試跳傘。\nB：拜託！人生只有一次。嘗試新事物，享受你的人生！", "explanationSource": "supplemental"}, {"id": 19, "question": "A: Tom, you have played with the ball for twenty minutes. ______ Give it to me, please.\nB: OK, here you are.", "options": ["It's your call.", "It's beyond me.", "Who else is coming?", "It's my turn."], "answer": 3, "answerLabel": "D", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(D) It's my turn.\n【用語】It's my turn. (phr.)：輪到我了\n【中譯】A：湯姆，你已經玩球玩了二十分鐘了。輪到我了。請把球給我。\nB：好，給你。", "explanationSource": "supplemental"}, {"id": 20, "question": "A: ______\nB: Yes, I went to Tokyo with my family last summer.", "options": ["How about going to the park?", "Don't bother me.", "Have you ever been to Japan?", "What's up?"], "answer": 2, "answerLabel": "C", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(C) Have you ever been to Japan?\n【用語】Have you ever been to + 地方? (phr.)：你曾經去過⋯⋯嗎？\n【中譯】A：你曾經去過日本嗎？\nB：有，我去年夏天和家人去了東京。", "explanationSource": "supplemental"}, {"id": 21, "question": "A: I didn't finish my homework last night.\nB: ______ I fell asleep at eight o'clock.", "options": ["I couldn't agree more.", "What's the catch?", "Neither did I.", "The box is too heavy to carry."], "answer": 2, "answerLabel": "C", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(C) Neither did I.\n【用語】Neither + 助動詞/be動詞 + 主詞. (phr.)：（前句否定）⋯⋯也不\n【中譯】A：我昨晚沒寫完功課。\nB：我也沒有。我八點就睡著了。", "explanationSource": "supplemental"}, {"id": 22, "question": "Good evening, everyone. ______ introduce our special guest tonight, the singer Amy Lin.", "options": ["It costs me a lot to", "Even a baby can", "It's my pleasure to", "I'm old enough to"], "answer": 2, "answerLabel": "C", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(C) It's my pleasure to\n【用語】It's my pleasure to + VR (phr.)：很樂意做⋯⋯／是我的榮幸做⋯⋯\n【中譯】大家晚安。我很榮幸為大家介紹今晚的特別來賓，歌手林艾咪。", "explanationSource": "supplemental"}, {"id": 23, "question": "A: Should we eat pizza or noodles tonight?\nB: I like both. ______ You can choose.", "options": ["What's the matter?", "So long.", "That was close.", "It's your call."], "answer": 3, "answerLabel": "D", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(D) It's your call.\n【用語】It's your call. (phr.)：由你決定；看你怎麼選\n【中譯】A：我們今晚該吃披薩還是麵？\nB：兩個我都喜歡。由你決定。你可以選。", "explanationSource": "supplemental"}, {"id": 24, "question": "A: Hurry! The last bus leaves in three minutes!\nB: OK! ______", "options": ["I'll run as fast as possible.", "What kinds of games do you like?", "Trick or treat!", "It's my turn."], "answer": 0, "answerLabel": "A", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(A) I'll run as fast as possible.\n【用語】as + adj./adv. + as possible (phr.)：盡可能（地）……\n【中譯】A：快點！末班公車三分鐘後就要開了！\nB：好！我會盡可能跑快一點。", "explanationSource": "supplemental"}, {"id": 25, "question": "A: This new phone is only 100 dollars, and you get a free computer with it!\nB: Only 100 dollars? ______", "options": ["The last thing I want to do is study.", "Way to go.", "What's the catch?", "She is in her teens."], "answer": 2, "answerLabel": "C", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(C) What's the catch?\n【用語】What's the catch? (phr.)：有什麼陷阱？（口語）\n【中譯】A：這支新手機只要一百元，而且還送你一台電腦！\nB：只要一百元？有什麼陷阱？", "explanationSource": "supplemental"}, {"id": 26, "question": "A: Did you copy Tom's answers on the test?\nB: Of course not! ______", "options": ["That's the last thing I would do.", "Never mind.", "There is no use crying.", "It cost an arm and a leg."], "answer": 0, "answerLabel": "A", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(A) That's the last thing I would do.\n【用語】the last thing I would do (phr.)：我最不可能做的事\n【中譯】A：你考試時抄湯姆的答案嗎？\nB：當然沒有！那是我最不可能做的事。", "explanationSource": "supplemental"}, {"id": 27, "question": "A: Is your brother taller than you?\nB: No. ______ We are both 160 centimeters.", "options": ["What's up?", "He is as tall as I am.", "After he comes home, he will eat dinner.", "It doesn't count."], "answer": 1, "answerLabel": "B", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(B) He is as tall as I am.\n【用語】as + adj./adv.(原級) + as (phr.)：跟⋯⋯一樣⋯⋯\n【中譯】A：你哥哥比你高嗎？\nB：沒有。他跟我一樣高。我們都是一百六十公分。", "explanationSource": "supplemental"}, {"id": 28, "question": "A: Should I wear the red shirt or the blue one to the party?\nB: Both look nice on you. ______", "options": ["It's up to you.", "Oh my goodness!", "It cost me 500 dollars to buy it.", "Trick or treat!"], "answer": 0, "answerLabel": "A", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(A) It's up to you.\n【用語】It's up to you. (phr.)：由你決定；看你怎麼選\n【中譯】A：我該穿紅色還是藍色的襯衫去派對？\nB：兩件你穿都好看。由你決定。", "explanationSource": "supplemental"}, {"id": 29, "question": "A: Did you really see a famous singer at the MRT station?\nB: ______ I even took a photo with her!", "options": ["No kidding.", "It's one of the tallest buildings in the world.", "I don't buy it.", "Never mind."], "answer": 0, "answerLabel": "A", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(A) No kidding.\n【用語】No kidding. (phr.)：不騙你；真的\n【中譯】A：你真的在捷運站看到一位有名的歌手嗎？\nB：不騙你。我甚至還跟她合照了！", "explanationSource": "supplemental"}, {"id": 30, "question": "A: Hey, I'm carrying a very heavy box. ______\nB: Oh, sorry! I'll move.", "options": ["What's on your mind?", "Don't be in my way.", "Understood?", "I can't help it."], "answer": 1, "answerLabel": "B", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(B) Don't be in my way.\n【用語】Don't be in my way. (phr.)：別擋我的路。\n【中譯】A：嘿，我正搬著一個很重的箱子。別擋我的路。\nB：喔，抱歉！我會讓開。", "explanationSource": "supplemental"}, {"id": 31, "question": "When Mom said he couldn't go to the concert, Ben ______ and didn't talk to anyone all evening.", "options": ["pulled a long face", "cost an arm and a leg", "couldn't help it", "killed it"], "answer": 0, "answerLabel": "A", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(A) pulled a long face\n【用語】pull a long face (phr.)：拉長臉；不高興\n【中譯】當媽媽說他不能去演唱會時，班拉長了臉，整個晚上都不跟任何人說話。", "explanationSource": "supplemental"}, {"id": 32, "question": "A: Will you still go hiking if it rains tomorrow?\nB: Yes. ______", "options": ["It doesn't count.", "The more, the merrier.", "Tom is the last person to tell a lie.", "Whether it rains or not, I will go."], "answer": 3, "answerLabel": "D", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(D) Whether it rains or not, I will go.\n【用語】whether + 現在簡單式 (or not), S + 未來式 (phr.)：條件句：無論某事是否發生，都將會……\n【中譯】A：如果明天下雨，你還會去爬山嗎？\nB：會。無論下不下雨，我都會去。", "explanationSource": "supplemental"}, {"id": 33, "question": "A: Do you remember Mr. Chen, our first-grade teacher?\nB: Mr. Chen? ______ I can't remember him at all.", "options": ["I'll pass.", "It doesn't ring a bell.", "Way to go.", "That was close."], "answer": 1, "answerLabel": "B", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(B) It doesn't ring a bell.\n【用語】It doesn't ring a bell. (phr.)：想不起來；沒印象（口語）\n【中譯】A：你記得陳老師嗎？我們一年級的老師。\nB：陳老師？我沒印象。我完全想不起他。", "explanationSource": "supplemental"}, {"id": 34, "question": "A: Come on, just jump into the pool! Do it now!\nB: ______ I'm still scared. I'll do it when I'm ready.", "options": ["This smell makes me sick.", "You can say that again.", "Way to go.", "Don't push me."], "answer": 3, "answerLabel": "D", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(D) Don't push me.\n【用語】Don't push me. (phr.)：別逼我\n【中譯】A：快點，跳進泳池就對了！現在就跳！\nB：別逼我。我還是很害怕。我準備好了就會跳。", "explanationSource": "supplemental"}, {"id": 35, "question": "A: Are you going to the mountains this weekend?\nB: Maybe. ______ I really want to see the snow.", "options": ["So long.", "I'm not sure whether it will snow there.", "It's time to go to bed.", "It's my turn."], "answer": 1, "answerLabel": "B", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(B) I'm not sure whether it will snow there.\n【用語】S + V + whether + 未來式 (phr.)：間接問句：未來是否會發生某事\n【中譯】A：你這個週末要去山上嗎？\nB：也許吧。我不確定那裡會不會下雪。我真的很想看雪。", "explanationSource": "supplemental"}, {"id": 36, "question": "A: Can I borrow your new comic book?\nB: Sorry. ______ I'm only on page 20.", "options": ["Leave me alone.", "End of discussion.", "I haven't finished reading it yet.", "It's on me."], "answer": 2, "answerLabel": "C", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(C) I haven't finished reading it yet.\n【用語】not + V + yet (phr.)：還沒⋯⋯\n【中譯】A：我可以借你的新漫畫書嗎？\nB：抱歉。我還沒看完。我才看到第二十頁。", "explanationSource": "supplemental"}, {"id": 37, "question": "A: Why does your dad speak Japanese so well?\nB: ______ He worked in Tokyo for five years.", "options": ["Time is up.", "Neither does he.", "He once lived in Japan.", "I don't buy it."], "answer": 2, "answerLabel": "C", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(C) He once lived in Japan.\n【用語】S + once + 過去式動詞 (phr.)：曾經；以前（某段時間）\n【中譯】A：你爸爸日文為什麼說得這麼好？\nB：他曾經住過日本。他在東京工作了五年。", "explanationSource": "supplemental"}, {"id": 38, "question": "A: Can I play with your phone? Please? Please? Please?\nB: ______ I said no ten times!", "options": ["You bet.", "Stop bugging me.", "I second that.", "Which way are you heading?"], "answer": 1, "answerLabel": "B", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(B) Stop bugging me.\n【用語】Stop bugging me. (phr.)：別煩我了（俚語）\n【中譯】A：我可以玩你的手機嗎？拜託？拜託？拜託？\nB：別煩我了。我已經說了十次不行！", "explanationSource": "supplemental"}, {"id": 39, "question": "A: Hi, Mike. Do you have time to talk now?\nB: Sorry, I'm on a crowded bus. ______", "options": ["I've got it covered.", "I'll call you later.", "This is the least I can do.", "Last but not least."], "answer": 1, "answerLabel": "B", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(B) I'll call you later.\n【用語】I'll call you later. (phr.)：我待會打給你\n【中譯】A：嗨，麥克。你現在有時間講話嗎？\nB：抱歉，我在一台很擠的公車上。我待會打給你。", "explanationSource": "supplemental"}, {"id": 40, "question": "A: How long does it take you to get to school?\nB: ______ My house is very close to the school.", "options": ["It's beyond me.", "I'd love to, but I have to study.", "Neither do I.", "Walking there takes me only five minutes."], "answer": 3, "answerLabel": "D", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(D) Walking there takes me only five minutes.\n【用語】V-ing + takes + 人 + 時間 (phr.)：做⋯⋯花某人多少時間\n【中譯】A：你到學校要花多久時間？\nB：走路去只要花我五分鐘。我家離學校很近。", "explanationSource": "supplemental"}, {"id": 41, "question": "A: How was the new restaurant?\nB: ______ I want to go there again.", "options": ["It's my turn.", "It doesn't count.", "It turned out to be terrible.", "It was better than I thought."], "answer": 3, "answerLabel": "D", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(D) It was better than I thought.\n【用語】better than I thought (phr.)：比我想像的好\n【中譯】A：那家新餐廳怎麼樣？\nB：比我想像的好。我想再去一次。", "explanationSource": "supplemental"}, {"id": 42, "question": "A: How much money did your parents give you for your birthday? Tell me!\nB: ______ That's a secret.", "options": ["I turned a deaf ear to it.", "Better late than never.", "Mind your own business.", "You can say that again."], "answer": 2, "answerLabel": "C", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(C) Mind your own business.\n【用語】Mind your own business. (phr.)：少管閒事\n【中譯】A：你爸媽生日給了你多少錢？告訴我！\nB：少管閒事。那是秘密。", "explanationSource": "supplemental"}, {"id": 43, "question": "A: Sorry, I'm 30 minutes late for the party.\nB: ______ Come in and have some cake.", "options": ["Good things never last.", "It's now or never.", "Better late than never.", "I don't buy it."], "answer": 2, "answerLabel": "C", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(C) Better late than never.\n【用語】Better late than never. (phr.)：晚做總比不做好\n【中譯】A：抱歉，我參加派對遲到了三十分鐘。\nB：晚到總比不到好。進來吃點蛋糕吧。", "explanationSource": "supplemental"}, {"id": 44, "question": "A: Let me pay for the drinks.\nB: No, no. ______ You paid last time.", "options": ["Who else is coming?", "What's the catch?", "It's on me.", "It was not until ten that I got home."], "answer": 2, "answerLabel": "C", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(C) It's on me.\n【用語】It's on me. (phr.)：我請客（口語）\n【中譯】A：飲料讓我付吧。\nB：不不不。我請客。你上次付過了。", "explanationSource": "supplemental"}, {"id": 45, "question": "Teacher: No phones in class. If I see one, I will take it. ______\nStudents: Yes, Mr. Lee.", "options": ["What's the catch?", "Am I clear?", "What a play!", "It can't get any better."], "answer": 1, "answerLabel": "B", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(B) Am I clear?\n【用語】Am I clear? (phr.)：我說清楚了嗎？\n【中譯】老師：上課不准用手機。如果我看到，我就會沒收。我說清楚了嗎？\n學生們：清楚了，李老師。", "explanationSource": "supplemental"}, {"id": 46, "question": "A: Why can't Amy wear that skirt to school?\nB: ______ The teacher won't let her.", "options": ["I get it.", "It takes her ten minutes to put it on.", "It's my treat.", "It's such a short skirt."], "answer": 3, "answerLabel": "D", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(D) It's such a short skirt.\n【用語】such a + adj. + N = so + adj. + a + N (phr.)：如此…的…（如：如此短的裙子）\n【中譯】A：為什麼艾咪不能穿那件裙子去學校？\nB：那是一件如此短的裙子。老師不會允許她穿。", "explanationSource": "supplemental"}, {"id": 47, "question": "A: I'm so sorry. I broke your pencil.\nB: ______ I have many pencils.", "options": ["It's not a big deal.", "You killed it!", "Seeing is believing.", "It's now or never."], "answer": 0, "answerLabel": "A", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(A) It's not a big deal.\n【用語】It's not a big deal. (phr.)：小事；沒什麼（= No biggie.）\n【中譯】A：真抱歉，我把你的鉛筆弄斷了。\nB：沒什麼。我有很多枝鉛筆。", "explanationSource": "supplemental"}, {"id": 48, "question": "A: Did Dad eat breakfast with you at seven?\nB: No. ______", "options": ["Leave me alone.", "He didn't get up until ten.", "So long.", "It's my treat."], "answer": 1, "answerLabel": "B", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(B) He didn't get up until ten.\n【用語】not + V + until + 時間/子句 (phr.)：直到⋯⋯才\n【中譯】A：爸爸七點有和你一起吃早餐嗎？\nB：沒有。他直到十點才起床。", "explanationSource": "supplemental"}, {"id": 49, "question": "A: What do you think of my new skateboard?\nB: ______ I want one, too!", "options": ["It's sick!", "I don't buy it.", "Never mind.", "You bet."], "answer": 0, "answerLabel": "A", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(A) It's sick!\n【用語】It's sick! (phr.)：太厲害了；超棒（俚語）\n【中譯】A：你覺得我的新滑板怎麼樣？\nB：太酷了！我也想要一個！", "explanationSource": "supplemental"}, {"id": 50, "question": "A: The bus left five minutes ago. Let's run after it!\nB: ______ We can't catch it.", "options": ["See you later.", "Way to go.", "There's no point running after it.", "It's never too late to learn."], "answer": 2, "answerLabel": "C", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(C) There's no point running after it.\n【用語】There is no point + V-ing (phr.)：做⋯⋯沒有意義\n【中譯】A：公車五分鐘前就開走了。我們追上去吧！\nB：追它沒有意義。我們追不上的。", "explanationSource": "supplemental"}, {"id": 51, "question": "A: When will you wash your hands?\nB: ______", "options": ["I don't mind.", "Before I eat dinner, I will wash my hands.", "I would wash my hands with cold water.", "If it rains, I will stay home."], "answer": 1, "answerLabel": "B", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(B) Before I eat dinner, I will wash my hands.\n【用語】before + 現在簡單式, S + 未來式 (phr.)：條件句：在某事發生之前，另一件事會先發生\n【中譯】A：你什麼時候會洗手？\nB：在我吃晚餐之前，我會先洗手。", "explanationSource": "supplemental"}, {"id": 52, "question": "The box has glass cups in it, so Mom wrote \"______\" on it.", "options": ["Please be seated.", "The less, the better.", "Trick or treat!", "Handle with care."], "answer": 3, "answerLabel": "D", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(D) Handle with care.\n【用語】Handle with care. (phr.)：小心處理（常見於包裹標示）\n【中譯】箱子裡有玻璃杯，所以媽媽在上面寫了「小心處理」。", "explanationSource": "supplemental"}, {"id": 53, "question": "A: ______ Can I get past, please?\nB: Oh, sure. Sorry, I'm in your way.", "options": ["Mind your own business.", "Don't push me.", "It's too good to be true.", "Excuse me."], "answer": 3, "answerLabel": "D", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(D) Excuse me.\n【用語】Excuse me. (phr.)：借光；對不起（禮貌用語）\n【中譯】A：借過一下。我可以過去嗎？\nB：喔，當然。抱歉，我擋到你的路了。", "explanationSource": "supplemental"}, {"id": 54, "question": "I have three pets. ______", "options": ["What's on your mind?", "If I get a dog, I will be happy.", "One is a dog, another is a cat, and the other is a bird.", "One is a dog, and the other is a cat."], "answer": 2, "answerLabel": "C", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(C) One is a dog, another is a cat, and the other is a bird.\n【用語】one ..., another ..., the other ...（三者） (phr.)：一個…；另一個…；剩下那個…\n【中譯】我有三隻寵物。一隻是狗，另一隻是貓，剩下那隻是鳥。", "explanationSource": "supplemental"}, {"id": 55, "question": "A: ______\nB: To buy some milk for Grandma.", "options": ["What kinds of milk do you like?", "Please be seated.", "What are you going to the store for?", "What's the matter?"], "answer": 2, "answerLabel": "C", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(C) What are you going to the store for?\n【用語】What + 疑問句 + for? (phr.)：為了什麼\n【中譯】A：你去商店是為了什麼？\nB：去幫奶奶買一些牛奶。", "explanationSource": "supplemental"}, {"id": 56, "question": "A: Kevin, how should I make the dumplings for you?\nB: ______ I really miss them, Grandma.", "options": ["Just the way you used to make them.", "The more, the better.", "You only live once.", "It's time for dinner."], "answer": 0, "answerLabel": "A", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(A) Just the way you used to make them.\n【用語】the way + S + used to (phr.)：像（某人）以前那樣\n【中譯】A：凱文，我該怎麼幫你做水餃？\nB：就像您以前做的那樣。我真的很懷念，奶奶。", "explanationSource": "supplemental"}, {"id": 57, "question": "A: Why is there no school today?\nB: ______", "options": ["Don't mind me.", "Oh my goodness!", "A strong typhoon is hitting Taipei.", "I'll pass."], "answer": 2, "answerLabel": "C", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(C) A strong typhoon is hitting Taipei.\n【用語】a typhoon hits + 地方 (phr.)：颱風襲擊⋯⋯\n【中譯】A：為什麼今天不用上學？\nB：一個強烈颱風正在襲擊台北。", "explanationSource": "supplemental"}, {"id": 58, "question": "A: Why did you leave the movie early?\nB: ______", "options": ["It was such a boring movie.", "It can't get any better.", "It was too good to be true.", "It was the best movie I have ever seen."], "answer": 0, "answerLabel": "A", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(A) It was such a boring movie.\n【用語】such a + adj. + N (phr.)：這麼⋯⋯的（+ 單數可數名詞）\n【中譯】A：你為什麼提早離開電影院？\nB：那是一部這麼無聊的電影。", "explanationSource": "supplemental"}, {"id": 59, "question": "A: Why were your shoes wet yesterday?\nB: ______", "options": ["I see.", "When I walked home, it started to rain.", "I once lived in Tainan.", "I'll call you later."], "answer": 1, "answerLabel": "B", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(B) When I walked home, it started to rain.\n【用語】When + 過去簡單式, 主詞 + 過去簡單式. (phr.)：當過去某事發生時，另一件事也發生了\n【中譯】A：你昨天的鞋子為什麼濕了？\nB：當我走路回家時，開始下雨了。", "explanationSource": "supplemental"}, {"id": 60, "question": "A: When will you tell Mom the good news?\nB: ______", "options": ["Once she gets home, I will tell her.", "So long.", "No way!", "What a play!"], "answer": 0, "answerLabel": "A", "source": "慣用語與句型 Expressions & Sentence Patterns", "explanation": "【答案】(A) Once she gets home, I will tell her.\n【用語】once + 現在簡單式, S + 未來式 (phr.)：一旦……就……\n【中譯】A：你什麼時候要告訴媽媽這個好消息？\nB：一旦她回到家，我就會告訴她。", "explanationSource": "supplemental"}]};</script><script>window.LEARN_DATA=[{"g": "", "t": "A deal is a deal.", "p": "(phr.)", "e": "you must do what you promised", "z": "說好的事就要算數", "s": "A: Can you do my chores tomorrow instead? I'm too tired today. B: No way! _____ _____ _____ _____ _____. You promised to wash the dishes tonight.", "c": "A：你明天可以幫我做家事嗎？我今天太累了。B：不行！【說好的事就要算數】。你答應今晚要洗碗的。", "f": "A: Can you do my chores tomorrow instead? I'm too tired today. B: No way! A deal is a deal. You promised to wash the dishes tonight."}, {"g": "", "t": "a piece of cake", "p": "(phr.)", "e": "something very easy to do", "z": "輕而易舉", "s": "A: Was the English quiz hard this morning? B: No, it was _____ _____ _____ _____ because I studied all the new words last night.", "c": "A：今天早上的英文小考難嗎？B：不難，簡直【輕而易舉】，因為我昨晚把新單字都讀完了。", "f": "A: Was the English quiz hard this morning? B: No, it was a piece of cake because I studied all the new words last night."}, {"g": "", "t": "a typhoon hits + 地方", "p": "(phr.)", "e": "a typhoon comes and hurts a place", "z": "颱風襲擊⋯⋯", "s": "When _____ _____ _____ Taiwan in the summer, many trees fall down, so people should stay at home and stay safe.", "c": "夏天【颱風襲擊】台灣時，很多樹會倒下，所以大家應該待在家裡注意安全。", "f": "When a typhoon hits Taiwan in the summer, many trees fall down, so people should stay at home and stay safe."}, {"g": "", "t": "adj./adv. + enough", "p": "(phr.)", "e": "as much as needed (after adj./adv.)", "z": "足夠……的（形容詞／副詞在前）", "s": "Kevin is not tall _____ to reach the top shelf, so he has to stand on a chair to get the dictionary.", "c": "凱文不夠高【足以】搆到最上層的架子，所以他得站在椅子上才能拿到字典。", "f": "Kevin is not tall enough to reach the top shelf, so he has to stand on a chair to get the dictionary."}, {"g": "", "t": "after + 現在簡單式, S + 未來式", "p": "(phr.)", "e": "when one thing finishes, another thing will happen", "z": "條件句：在某事發生之後，另一件事會接著發生", "s": "_____ I finish my math homework this evening, I will play video games with my older brother for an hour.", "c": "今天傍晚【在】我寫完數學作業【之後】，我會和哥哥一起打一個小時的電動。", "f": "After I finish my math homework this evening, I will play video games with my older brother for an hour."}, {"g": "", "t": "Am I clear?", "p": "(phr.)", "e": "Do you understand what I said?", "z": "我說清楚了嗎？", "s": "A: You must finish your homework before you play any video games tonight. _____ _____ _____? B: Yes, Mom, I understand.", "c": "A：今晚玩任何電動之前，你一定要先寫完功課。【我說清楚了嗎？】B：是的，媽媽，我懂了。", "f": "A: You must finish your homework before you play any video games tonight. Am I clear? B: Yes, Mom, I understand."}, {"g": "", "t": "an earthquake hits + 地方", "p": "(phr.)", "e": "an earthquake shakes and hurts a place", "z": "地震襲擊⋯⋯", "s": "Last year, _____ _____ _____ the small town at night, but luckily nobody was hurt because the buildings were strong.", "c": "去年一場【地震襲擊】了那個小鎮，發生在夜裡，但幸好建築物很堅固，所以沒有人受傷。", "f": "Last year, an earthquake hit the small town at night, but luckily nobody was hurt because the buildings were strong."}, {"g": "", "t": "Are you kidding?", "p": "(phr.)", "e": "Are you joking?", "z": "你在開玩笑吧？", "s": "A: Our teacher said we will have three tests tomorrow. B: _____ _____ _____? We just had a big test today!", "c": "A：老師說我們明天要考三個考試。B：【你在開玩笑吧？】我們今天才剛考完一次大考！", "f": "A: Our teacher said we will have three tests tomorrow. B: Are you kidding? We just had a big test today!"}, {"g": "", "t": "as + adj./adv.(原級) + as", "p": "(phr.)", "e": "the same in some way as", "z": "跟⋯⋯一樣⋯⋯", "s": "My little sister is now _____ tall _____ my mother, and she is only twelve years old this year.", "c": "我妹妹現在已經【跟】我媽媽【一樣】高了，而她今年才十二歲。", "f": "My little sister is now as tall as my mother, and she is only twelve years old this year."}, {"g": "", "t": "as + adj./adv. + as possible", "p": "(phr.)", "e": "to the highest degree you can", "z": "盡可能（地）……", "s": "The bus was going to leave in five minutes, so Linda ran to the station _____ fast _____ _____ and just caught it.", "c": "公車五分鐘後就要開了，所以琳達【盡可能】快地跑向車站，剛好趕上。", "f": "The bus was going to leave in five minutes, so Linda ran to the station as fast as possible and just caught it."}, {"g": "", "t": "(as) poor as a church mouse", "p": "(phr.)", "e": "very, very poor", "z": "一文不名；一貧如洗", "s": "After Uncle Ray lost his job, he was _____ _____ _____ _____ _____ _____, so our family helped him pay his rent.", "c": "雷叔叔失業後變得【一文不名】，所以我們家幫他付房租。", "f": "After Uncle Ray lost his job, he was as poor as a church mouse, so our family helped him pay his rent."}, {"g": "", "t": "be here to stay", "p": "(phr.)", "e": "will continue to exist for a long time", "z": "成為常態；會長久存在", "s": "Many people think online shopping _____ _____ _____ _____, because it is fast and easy for busy families.", "c": "很多人認為網路購物【會長久存在】，因為它對忙碌的家庭來說既快速又方便。", "f": "Many people think online shopping is here to stay, because it is fast and easy for busy families."}, {"g": "", "t": "人 + be in one's teens/twenties/thirties", "p": "(phr.)", "e": "be aged 13–19, 20–29, or 30–39", "z": "某人正值十幾歲／二十多歲／三十多歲", "s": "My cousin _____ _____ her _____ now, so she likes to hang out with her friends more than with our family.", "c": "我表姊現在【正值十幾歲】，所以她比較喜歡和朋友出去，而不是和我們家人在一起。", "f": "My cousin is in her teens now, so she likes to hang out with her friends more than with our family."}, {"g": "", "t": "before + 現在簡單式, S + 未來式", "p": "(phr.)", "e": "one thing will happen first, then another", "z": "條件句：在某事發生之前，另一件事會先發生", "s": "_____ my mom gets home from work tonight, I will wash all the dishes and clean the kitchen to surprise her.", "c": "今晚【在】媽媽下班回家【之前】，我會把碗都洗好、把廚房打掃乾淨給她一個驚喜。", "f": "Before my mom gets home from work tonight, I will wash all the dishes and clean the kitchen to surprise her."}, {"g": "", "t": "Best wishes", "p": "(phr.)", "e": "kind hopes written at the end of a card", "z": "致上最誠摯的祝福", "s": "At the end of her card to her old teacher, Wendy wrote, \"_____ _____ for a happy and healthy new year!\"", "c": "溫蒂在給以前老師的卡片結尾寫道：「【致上最誠摯的祝福】，祝您新年快樂又健康！」", "f": "At the end of her card to her old teacher, Wendy wrote, \"Best wishes for a happy and healthy new year!\""}, {"g": "", "t": "Better late than never.", "p": "(phr.)", "e": "doing it late is better than not at all", "z": "晚做總比不做好", "s": "A: Sorry, I only finished my science report this morning, two days late. B: Well, _____ _____ _____ _____. Be on time next time.", "c": "A：抱歉，我今天早上才完成自然報告，晚了兩天。B：嗯，【晚做總比不做好】。下次要準時喔。", "f": "A: Sorry, I only finished my science report this morning, two days late. B: Well, better late than never. Be on time next time."}, {"g": "", "t": "better than I thought", "p": "(phr.)", "e": "good in a way I did not expect", "z": "比我想像的好", "s": "The new noodle shop near our school was much _____ _____ _____ _____, so we plan to eat there again next week.", "c": "我們學校附近那家新麵店【比我想像的】好太多了，所以我們打算下週再去吃。", "f": "The new noodle shop near our school was much better than I thought, so we plan to eat there again next week."}, {"g": "", "t": "can't get any better", "p": "(phr.)", "e": "is already the best it can be", "z": "再好不過了", "s": "We are at the beach, the sun is shining, and we all have ice cream in our hands, so life _____ _____ _____ _____!", "c": "我們在海邊，陽光燦爛，每個人手上都拿著冰淇淋，人生真是【再好不過了】！", "f": "We are at the beach, the sun is shining, and we all have ice cream in our hands, so life can't get any better!"}, {"g": "", "t": "can't help it", "p": "(phr.)", "e": "you cannot stop yourself from doing something", "z": "忍不住；沒辦法控制", "s": "I know I should stop eating chocolate before dinner, but I _____ _____ _____ because it tastes so good.", "c": "我知道晚餐前不該再吃巧克力，但我【忍不住】，因為它太好吃了。", "f": "I know I should stop eating chocolate before dinner, but I can't help it because it tastes so good."}, {"g": "", "t": "Chances are (that) + 子句", "p": "(phr.)", "e": "it is likely that", "z": "很可能⋯⋯", "s": "The sky is dark and the wind is strong, so _____ _____ the baseball game will be stopped this afternoon.", "c": "天空很暗，風也很強，所以今天下午的棒球比賽【很可能】會暫停。", "f": "The sky is dark and the wind is strong, so chances are the baseball game will be stopped this afternoon."}, {"g": "", "t": "cost an arm and a leg", "p": "(phr.)", "e": "be very, very expensive", "z": "非常昂貴；貴得嚇人（口語）", "s": "The new game console looks really cool, but it _____ _____ _____ _____ _____ _____, so I will wait for a sale.", "c": "新的遊戲機看起來真的很酷，但它【貴得嚇人】，所以我會等特價。", "f": "The new game console looks really cool, but it costs an arm and a leg, so I will wait for a sale."}, {"g": "", "t": "Do you get it?", "p": "(phr.)", "e": "Do you understand it?", "z": "你了解了嗎？", "s": "A: First you add these two numbers, and then you divide the answer by three. _____ _____ _____ _____? B: Yes, now it looks easy.", "c": "A：首先把這兩個數字相加，然後把答案除以三。【你了解了嗎？】B：了解，現在看起來很簡單。", "f": "A: First you add these two numbers, and then you divide the answer by three. Do you get it? B: Yes, now it looks easy."}, {"g": "", "t": "Do you mind + V-ing?", "p": "(phr.)", "e": "a polite question asking if something is OK", "z": "你介意做⋯⋯嗎？", "s": "A: _____ _____ _____ opening the window? It's really hot in here. B: Not at all. I'll open it for you.", "c": "A：【你介意】打開窗戶【嗎？】這裡真的好熱。B：一點也不。我幫你開。", "f": "A: Do you mind opening the window? It's really hot in here. B: Not at all. I'll open it for you."}, {"g": "", "t": "Don't be in my way.", "p": "(phr.)", "e": "please move; you are blocking me", "z": "別擋我的路。", "s": "A: Can I stand here and watch you cook the noodles, Mom? B: Sure, but _____ _____ _____ _____ _____, because the pot is very hot.", "c": "A：媽，我可以站在這裡看妳煮麵嗎？B：可以，但【別擋我的路】，因為鍋子很燙。", "f": "A: Can I stand here and watch you cook the noodles, Mom? B: Sure, but don't be in my way, because the pot is very hot."}, {"g": "", "t": "Don't bother me.", "p": "(phr.)", "e": "stop annoying me; let me do my work", "z": "別煩我", "s": "A: Hey, do you want to play cards with us in the living room? B: _____ _____ _____ now. I'm studying for tomorrow's test.", "c": "A：嘿，你要來客廳跟我們玩牌嗎？B：現在【別煩我】。我在準備明天的考試。", "f": "A: Hey, do you want to play cards with us in the living room? B: Don't bother me now. I'm studying for tomorrow's test."}, {"g": "", "t": "Don't cross + 人.", "p": "(phr.)", "e": "don't make someone angry", "z": "別惹⋯⋯生氣", "s": "A: Should I take Lisa's seat while she's away? B: No! _____ _____ Lisa. She gets really angry when people touch her things.", "c": "A：莉莎不在時我可以坐她的位子嗎？B：不行！【別惹】莉莎。別人碰她的東西時她會非常生氣。", "f": "A: Should I take Lisa's seat while she's away? B: No! Don't cross Lisa. She gets really angry when people touch her things."}, {"g": "", "t": "Don't judge a book by its cover.", "p": "(phr.)", "e": "don't decide what someone is like from their looks", "z": "不可貌相；別以貌取人", "s": "A: The new boy looks scary, so I don't want to talk to him. B: _____ _____ _____ _____ _____ _____ _____. He's actually very kind.", "c": "A：那個新來的男生看起來很兇，所以我不想跟他說話。B：【人不可貌相】。他其實很善良。", "f": "A: The new boy looks scary, so I don't want to talk to him. B: Don't judge a book by its cover. He's actually very kind."}, {"g": "", "t": "Don't mind me.", "p": "(phr.)", "e": "please go on; don't worry about me", "z": "別管我；別在意我", "s": "A: Oh, Grandpa, are you going to sit here with us? B: _____ _____ _____. I'm just reading my newspaper, so keep playing your game.", "c": "A：喔，爺爺，你要坐在這裡跟我們一起嗎？B：【別管我。】我只是在看報紙，你們繼續玩遊戲吧。", "f": "A: Oh, Grandpa, are you going to sit here with us? B: Don't mind me. I'm just reading my newspaper, so keep playing your game."}, {"g": "", "t": "Don't push me.", "p": "(phr.)", "e": "don't try to make me do something", "z": "別逼我", "s": "A: Come on, just tell me your secret. I'll give you my cookie! B: _____ _____ _____. I said I don't want to talk about it.", "c": "A：拜託啦，告訴我你的祕密就好。我把我的餅乾給你！B：【別逼我。】我說了我不想談這件事。", "f": "A: Come on, just tell me your secret. I'll give you my cookie! B: Don't push me. I said I don't want to talk about it."}, {"g": "", "t": "End of discussion.", "p": "(phr.)", "e": "we will not talk about it anymore", "z": "不再討論；討論到此為止", "s": "A: Mom, can I stay up late and play games tonight? B: No, you have school tomorrow. _____ _____ _____.", "c": "A：媽，我今晚可以熬夜打電動嗎？B：不行，你明天要上學。【討論到此為止】。", "f": "A: Mom, can I stay up late and play games tonight? B: No, you have school tomorrow. End of discussion."}, {"g": "", "t": "even a baby can + VR", "p": "(phr.)", "e": "it is very easy; anyone can do it", "z": "連嬰兒都能……（形容非常簡單）", "s": "This new phone game is so easy that _____ _____ _____ _____ play it, so my grandpa wants to try it too.", "c": "這款新的手機遊戲簡單到【連嬰兒都能】玩，所以我爺爺也想試試看。", "f": "This new phone game is so easy that even a baby can play it, so my grandpa wants to try it too."}, {"g": "", "t": "Excuse me.", "p": "(phr.)", "e": "a polite way to ask someone to move or listen", "z": "借光；對不起（禮貌用語）", "s": "A: _____ _____, could I get past? My bus stop is next. B: Oh, sure, sorry about that!", "c": "A：【借過】，可以讓我過去嗎？下一站就是我要下車的站了。B：喔，當然，不好意思！", "f": "A: Excuse me, could I get past? My bus stop is next. B: Oh, sure, sorry about that!"}, {"g": "", "t": "First things first.", "p": "(phr.)", "e": "do the most important thing first", "z": "要事第一；先做重要的事", "s": "A: Let's play video games now! B: _____ _____ _____. We need to finish our math homework before dinner.", "c": "A：我們現在來打電動吧！B：【先做重要的事】。我們得在晚餐前寫完數學作業。", "f": "A: Let's play video games now! B: First things first. We need to finish our math homework before dinner."}, {"g": "", "t": "Good things never last.", "p": "(phr.)", "e": "happy times always end soon", "z": "美好的事物總是不長久", "s": "A: Our summer vacation is over already, and school starts tomorrow. B: I know. _____ _____ _____ _____.", "c": "A：我們的暑假已經結束了，明天就開學。B：我知道。【美好的事物總是不長久】。", "f": "A: Our summer vacation is over already, and school starts tomorrow. B: I know. Good things never last."}, {"g": "", "t": "Handle with care.", "p": "(phr.)", "e": "move this carefully because it can break", "z": "小心處理（常見於包裹標示）", "s": "The box had glass cups inside, so Mom wrote \"_____ _____ _____\" on it before she sent it to Grandma.", "c": "箱子裡裝著玻璃杯，所以媽媽寄給奶奶之前在上面寫了「【小心處理】」。", "f": "The box had glass cups inside, so Mom wrote \"Handle with care\" on it before she sent it to Grandma."}, {"g": "", "t": "have + p.p. + before", "p": "(phr.)", "e": "did something at some time in the past", "z": "以前曾經（做過）", "s": "I _____ visited Tainan _____, so I can show you the best places to eat beef soup when we get there next week.", "c": "我【以前曾】去過台南，所以下週我們到那裡時，我可以帶你去吃最好吃的牛肉湯。", "f": "I have visited Tainan before, so I can show you the best places to eat beef soup when we get there next week."}, {"g": "", "t": "Have you ever been to + 地方?", "p": "(phr.)", "e": "did you visit this place before?", "z": "你曾經去過⋯⋯嗎？", "s": "A: _____ _____ _____ _____ _____ Hualien? B: Yes, I went there with my family last summer and saw Taroko Gorge.", "c": "A：【你曾經去過】花蓮【嗎】？B：有，我去年夏天跟家人去過，還看了太魯閣峽谷。", "f": "A: Have you ever been to Hualien? B: Yes, I went there with my family last summer and saw Taroko Gorge."}, {"g": "", "t": "Honesty is the best policy.", "p": "(phr.)", "e": "Telling the truth is always best.", "z": "誠實為上策", "s": "A: I broke Mom's favorite cup. Should I hide it? B: No, just tell her the truth. _____ _____ _____ _____ _____.", "c": "A：我打破了媽媽最喜歡的杯子。我該把它藏起來嗎？B：不，跟她說實話就好。【誠實為上策】。", "f": "A: I broke Mom's favorite cup. Should I hide it? B: No, just tell her the truth. Honesty is the best policy."}, {"g": "", "t": "I couldn't agree more.", "p": "(phr.)", "e": "I agree with you completely", "z": "非常同意", "s": "A: Our school should have more sports clubs, so students can exercise after class. B: _____ _____ _____ _____. I'd join the tennis club.", "c": "A：我們學校應該有更多運動社團，讓學生下課後可以運動。B：【我非常同意】。我會加入網球社。", "f": "A: Our school should have more sports clubs, so students can exercise after class. B: I couldn't agree more. I'd join the tennis club."}, {"g": "", "t": "I don't buy it.", "p": "(phr.)", "e": "I don't believe it.", "z": "我不相信（口語）", "s": "A: Tom says he finished all his homework in ten minutes. B: _____ _____ _____ _____. He always needs at least an hour!", "c": "A：Tom說他十分鐘就寫完所有功課了。B：【我才不信】。他總是至少要一個小時！", "f": "A: Tom says he finished all his homework in ten minutes. B: I don't buy it. He always needs at least an hour!"}, {"g": "", "t": "I don't get it.", "p": "(phr.)", "e": "I do not understand.", "z": "我不懂", "s": "A: Everyone laughed at Tom's joke about the cat and the fish. B: _____ _____ _____ _____. Why is it so funny?", "c": "A：大家都被Tom關於貓和魚的笑話逗笑了。B：【我不懂】。為什麼那麼好笑？", "f": "A: Everyone laughed at Tom's joke about the cat and the fish. B: I don't get it. Why is it so funny?"}, {"g": "", "t": "I don't mind.", "p": "(phr.)", "e": "it's OK with me", "z": "我不介意", "s": "A: Do you want to eat noodles or rice for dinner tonight? B: _____ _____ _____. Both are fine with me, so you can choose.", "c": "A：你今晚晚餐想吃麵還是飯？B：【我不介意。】兩個我都可以，所以你來選吧。", "f": "A: Do you want to eat noodles or rice for dinner tonight? B: I don't mind. Both are fine with me, so you can choose."}, {"g": "", "t": "I get it.", "p": "(phr.)", "e": "I understand now.", "z": "我懂了", "s": "A: You need to click this button first, and then the game will start. B: Oh, _____ _____ _____. Thanks for your help!", "c": "A：你要先按這個按鈕，然後遊戲就會開始。B：喔，【我懂了】。謝謝你的幫忙！", "f": "A: You need to click this button first, and then the game will start. B: Oh, I get it. Thanks for your help!"}, {"g": "", "t": "I second that.", "p": "(phr.)", "e": "I agree with what you just said", "z": "我附議／我贊同（正式或幽默用法）", "s": "A: I think we should order pizza for the class party because everyone likes it. B: _____ _____ _____. Let's get two big ones.", "c": "A：我覺得班級派對應該訂披薩，因為大家都喜歡。B：【我附議】。我們訂兩個大的吧。", "f": "A: I think we should order pizza for the class party because everyone likes it. B: I second that. Let's get two big ones."}, {"g": "", "t": "I see.", "p": "(phr.)", "e": "I understand now.", "z": "我了解了／我懂了", "s": "A: The library is closed today because they are cleaning the floors and windows. B: _____ _____. I will come back tomorrow, then.", "c": "A：圖書館今天休館，因為他們在清潔地板和窗戶。B：【我了解了】。那我明天再來。", "f": "A: The library is closed today because they are cleaning the floors and windows. B: I see. I will come back tomorrow, then."}, {"g": "", "t": "I'd love/like to, but + 子句", "p": "(phr.)", "e": "a polite way to say no", "z": "我很想…，但…（婉拒）", "s": "A: Do you want to come to my birthday party on Saturday night? B: _____ _____ _____, _____ I have to visit my grandparents.", "c": "A：你星期六晚上要來我的生日派對嗎？B：【我很想去，但】我得去探望祖父母。", "f": "A: Do you want to come to my birthday party on Saturday night? B: I'd love to, but I have to visit my grandparents."}, {"g": "", "t": "If + 現在簡單式, S + 未來式", "p": "(phr.)", "e": "if this happens, another thing will happen", "z": "條件句：如果某事發生，將會……", "s": "_____ it rains tomorrow morning, our class will not go to the zoo, and we will watch a movie at school instead.", "c": "【如果】明天早上下雨，我們班就不會去動物園，而是會在學校看電影。", "f": "If it rains tomorrow morning, our class will not go to the zoo, and we will watch a movie at school instead."}, {"g": "", "t": "If only + 子句", "p": "(phr.)", "e": "I really wish", "z": "但願、要是……多好", "s": "_____ _____ I had studied harder for the math test, I would not feel so worried about my grade now.", "c": "【但願】我當初考數學前更用功一點，這樣我現在就不會這麼擔心成績了。", "f": "If only I had studied harder for the math test, I would not feel so worried about my grade now."}, {"g": "", "t": "I'll call you later.", "p": "(phr.)", "e": "I will phone you again soon", "z": "我待會打給你", "s": "A: Can we talk about the class trip now? B: Sorry, I'm on a noisy bus. _____ _____ _____ _____ when I get home.", "c": "A：我們現在可以討論校外教學嗎？B：抱歉，我在很吵的公車上。我到家後【待會打給你】。", "f": "A: Can we talk about the class trip now? B: Sorry, I'm on a noisy bus. I'll call you later when I get home."}, {"g": "", "t": "I'll pass.", "p": "(phr.)", "e": "No, thank you; I won't join.", "z": "我跳過（我不參加）", "s": "A: We're going to the haunted house at the night market. Do you want to come? B: _____ _____. I get scared too easily.", "c": "A：我們要去夜市的鬼屋。你要一起來嗎？B：【我就不去了】。我太容易被嚇到了。", "f": "A: We're going to the haunted house at the night market. Do you want to come? B: I'll pass. I get scared too easily."}, {"g": "", "t": "It costs + 人 + 錢 + to + VR", "p": "(phr.)", "e": "doing something needs this much money", "z": "做⋯⋯花了某人多少錢", "s": "_____ _____ us five thousand dollars _____ fix the old car, so Dad decided to buy a new one next year.", "c": "修那台舊車【花了】我們五千元，所以爸爸決定明年買一台新的。", "f": "It cost us five thousand dollars to fix the old car, so Dad decided to buy a new one next year."}, {"g": "", "t": "It doesn't count.", "p": "(phr.)", "e": "It is not accepted as real or right.", "z": "不算；不被承認", "s": "A: I got the ball into the basket, so our team wins! B: Sorry, _____ _____ _____ because your foot was on the line.", "c": "A：我把球投進籃框了，所以我們隊贏了！B：抱歉，【不算】，因為你的腳踩到線了。", "f": "A: I got the ball into the basket, so our team wins! B: Sorry, it doesn't count because your foot was on the line."}, {"g": "", "t": "It doesn't matter whether/if + 子句", "p": "(phr.)", "e": "something is not important either way", "z": "不管⋯⋯都沒關係", "s": "_____ _____ _____ _____ you win or lose the race, because the most important thing is to have fun with your friends.", "c": "【不管】你比賽贏或輸【都沒關係】，因為最重要的是和朋友們一起玩得開心。", "f": "It doesn't matter whether you win or lose the race, because the most important thing is to have fun with your friends."}, {"g": "", "t": "It doesn't ring a bell.", "p": "(phr.)", "e": "I don't remember it.", "z": "想不起來；沒印象（口語）", "s": "A: Do you remember a girl named Lily from our elementary school? B: Hmm, sorry, _____ _____ _____ _____ _____.", "c": "A：你記得我們國小一個叫Lily的女生嗎？B：嗯，抱歉，【我沒印象】。", "f": "A: Do you remember a girl named Lily from our elementary school? B: Hmm, sorry, it doesn't ring a bell."}, {"g": "", "t": "It takes + 人 + 時間 + to + VR", "p": "(phr.)", "e": "someone needs this much time to do something", "z": "花某人多少時間做…（= 人 spend + 時間 + V-ing）", "s": "_____ _____ me twenty minutes _____ walk from my home to school, so I always leave before seven o'clock.", "c": "我從家裡走路到學校【要花我】二十分鐘，所以我總是七點前出門。", "f": "It takes me twenty minutes to walk from my home to school, so I always leave before seven o'clock."}, {"g": "", "t": "It turns out that + 子句", "p": "(phr.)", "e": "in the end, we learn that", "z": "結果是⋯⋯；原來⋯⋯", "s": "We thought someone had stolen Dad's car, but _____ _____ _____ _____ he had parked it on another street.", "c": "我們以為有人偷了爸爸的車，但【原來】他把車停在另一條街上。", "f": "We thought someone had stolen Dad's car, but it turned out that he had parked it on another street."}, {"g": "", "t": "It turns out to be + N/adj.", "p": "(phr.)", "e": "in the end it is something", "z": "結果是⋯⋯（某種狀態/身份）", "s": "We were worried about the camping trip because of the storm, but _____ _____ _____ _____ _____ a sunny day.", "c": "我們因為暴風雨而擔心露營，但【結果是】個晴天。", "f": "We were worried about the camping trip because of the storm, but it turned out to be a sunny day."}, {"g": "", "t": "It was not until + 時間/子句 + that + 句子", "p": "(phr.)", "e": "only at that time did something happen", "z": "直到⋯⋯才", "s": "It was _____ _____ ten o'clock at night that my sister finally finished her homework and went to bed.", "c": "我姊姊【直到】晚上十點【才】終於寫完功課去睡覺。", "f": "It was not until ten o'clock at night that my sister finally finished her homework and went to bed."}, {"g": "", "t": "It's beyond me.", "p": "(phr.)", "e": "I can't understand it.", "z": "我不懂；超出我的理解", "s": "A: Can you help me with this math question about circles? B: Sorry, _____ _____ _____. Let's ask Mr. Lin after class.", "c": "A：你可以幫我解這題關於圓形的數學題嗎？B：抱歉，【我也搞不懂】。我們下課後去問林老師吧。", "f": "A: Can you help me with this math question about circles? B: Sorry, it's beyond me. Let's ask Mr. Lin after class."}, {"g": "", "t": "It's my pleasure to + VR", "p": "(phr.)", "e": "I am happy and honored to do this", "z": "很樂意做⋯⋯／是我的榮幸做⋯⋯", "s": "Thank you all for coming to our school concert tonight, and _____ _____ _____ _____ introduce our wonderful music teacher, Ms. Lin.", "c": "謝謝大家今晚來參加我們學校的音樂會，【我很榮幸能】為大家介紹我們優秀的音樂老師林老師。", "f": "Thank you all for coming to our school concert tonight, and it's my pleasure to introduce our wonderful music teacher, Ms. Lin."}, {"g": "", "t": "It's my treat.", "p": "(phr.)", "e": "I will pay for it", "z": "我請客", "s": "A: Let me pay for the bubble tea this time. B: No, no, _____ _____ _____. You paid for our lunch yesterday.", "c": "A：這次珍奶讓我付吧。B：不不不，【我請客】。你昨天已經請我們吃午餐了。", "f": "A: Let me pay for the bubble tea this time. B: No, no, it's my treat. You paid for our lunch yesterday."}, {"g": "", "t": "It's my turn.", "p": "(phr.)", "e": "Now I can do it after others.", "z": "輪到我了", "s": "A: I have finished my turn on the swing, so who wants to go next? B: _____ _____ _____! I have been waiting for ten minutes.", "c": "A：我盪完鞦韆了，接下來誰要玩？B：【輪到我了】！我已經等了十分鐘。", "f": "A: I have finished my turn on the swing, so who wants to go next? B: It's my turn! I have been waiting for ten minutes."}, {"g": "", "t": "It's never too late to learn.", "p": "(phr.)", "e": "you can learn at any age", "z": "活到老，學到老", "s": "My grandpa started to learn English at seventy because he believes _____ _____ _____ _____ _____ _____.", "c": "我爺爺七十歲才開始學英文，因為他相信【活到老，學到老】。", "f": "My grandpa started to learn English at seventy because he believes it's never too late to learn."}, {"g": "", "t": "It's not a big deal.", "p": "(phr.)", "e": "It is not important; no problem.", "z": "小事；沒什麼（= No biggie.）", "s": "A: I'm so sorry that I forgot to bring your comic book back today. B: _____ _____ _____ _____ _____. You can give it to me tomorrow.", "c": "A：真抱歉，我今天忘了把你的漫畫書帶來還你。B：【沒什麼大不了的】。你明天再給我就好。", "f": "A: I'm so sorry that I forgot to bring your comic book back today. B: It's not a big deal. You can give it to me tomorrow."}, {"g": "", "t": "It's now or never.", "p": "(phr.)", "e": "do it now or lose the chance", "z": "機不可失；此時不做更待何時", "s": "A: Should I ask Jenny to dance with me? The music ends in two minutes! B: _____ _____ _____ _____. Go and ask her!", "c": "A：我該邀珍妮跟我跳舞嗎？音樂再兩分鐘就結束了！B：【機不可失】。快去邀她！", "f": "A: Should I ask Jenny to dance with me? The music ends in two minutes! B: It's now or never. Go and ask her!"}, {"g": "", "t": "It's on me.", "p": "(phr.)", "e": "I will pay (spoken)", "z": "我請客（口語）", "s": "A: How much was my hamburger? I want to pay you back. B: Don't worry about it. _____ _____ _____.", "c": "A：我的漢堡多少錢？我要還你。B：別在意啦。【我請客】。", "f": "A: How much was my hamburger? I want to pay you back. B: Don't worry about it. It's on me."}, {"g": "", "t": "It's sick!", "p": "(phr.)", "e": "slang: it is really cool or great", "z": "太厲害了；超棒（俚語）", "s": "A: Look at my new skateboard. My uncle bought it for me in the U.S. B: Wow, _____ _____! Can I try it after school?", "c": "A：你看我的新滑板。我叔叔在美國買給我的。B：哇，【太厲害了！】我放學後可以試試看嗎？", "f": "A: Look at my new skateboard. My uncle bought it for me in the U.S. B: Wow, it's sick! Can I try it after school?"}, {"g": "", "t": "It's time for + N", "p": "(phr.)", "e": "it is the right time to have or do something", "z": "……的時間到了", "s": "Put away your phones and wash your hands, everyone. _____ _____ _____ dinner, and Grandma made your favorite fried rice.", "c": "大家把手機收起來去洗手。【晚餐時間到了】，奶奶做了你們最喜歡的炒飯。", "f": "Put away your phones and wash your hands, everyone. It's time for dinner, and Grandma made your favorite fried rice."}, {"g": "", "t": "It's time to + VR", "p": "(phr.)", "e": "it is the right time to do something", "z": "該做……的時候到了", "s": "It's already eleven o'clock and you have a test tomorrow morning, so _____ _____ _____ turn off the TV and go to bed.", "c": "已經十一點了，你明天早上還有考試，所以【該】關掉電視去睡覺【了】。", "f": "It's already eleven o'clock and you have a test tomorrow morning, so it's time to turn off the TV and go to bed."}, {"g": "", "t": "It's up to you.", "p": "(phr.)", "e": "You can decide.", "z": "由你決定；看你怎麼選", "s": "A: Should we eat noodles or pizza for dinner tonight? B: _____ _____ _____ _____. I'm happy with either one.", "c": "A：我們今晚晚餐要吃麵還是披薩？B：【由你決定】。哪一個我都可以。", "f": "A: Should we eat noodles or pizza for dinner tonight? B: It's up to you. I'm happy with either one."}, {"g": "", "t": "It's your call.", "p": "(phr.)", "e": "you can decide", "z": "由你決定；看你怎麼選", "s": "A: Should we eat noodles or rice for lunch today? I don't mind either one. B: Well, _____ _____ _____, since you're paying!", "c": "A：我們今天午餐要吃麵還是飯？我都可以。B：嗯，【由你決定】，因為是你請客！", "f": "A: Should we eat noodles or rice for lunch today? I don't mind either one. B: Well, it's your call, since you're paying!"}, {"g": "", "t": "I've got it covered.", "p": "(phr.)", "e": "I will take care of it; it is done", "z": "搞定；處理好了", "s": "A: Oh no, we forgot to buy drinks for the class party tomorrow! B: Don't worry, _____ _____ _____ _____. I'll bring them.", "c": "A：糟了，我們忘了買明天班級派對的飲料！B：別擔心，【我搞定了】。我會帶過去。", "f": "A: Oh no, we forgot to buy drinks for the class party tomorrow! B: Don't worry, I've got it covered. I'll bring them."}, {"g": "", "t": "kill it", "p": "(phr.)", "e": "do something really, really well (informal)", "z": "表現超棒；很厲害（口語）", "s": "Amy was nervous before her piano contest, but she really _____ _____ on stage, and everyone clapped for a long time.", "c": "艾咪在鋼琴比賽前很緊張，但她在台上真的【表現超棒】，大家拍手拍了很久。", "f": "Amy was nervous before her piano contest, but she really killed it on stage, and everyone clapped for a long time."}, {"g": "", "t": "last but not least", "p": "(phr.)", "e": "the last one, but still important", "z": "最後但同樣重要", "s": "I want to thank my teachers, my classmates, and, _____ _____ _____ _____, my parents for always supporting me.", "c": "我要感謝我的老師、同學，還有【最後但同樣重要的】，一直支持我的爸媽。", "f": "I want to thank my teachers, my classmates, and, last but not least, my parents for always supporting me."}, {"g": "", "t": "Leave me alone.", "p": "(phr.)", "e": "go away; I want to be by myself", "z": "讓我一個人靜一靜；別煩我", "s": "A: Why are you crying? Did someone say something mean to you? B: Please just _____ _____ _____. I need some time to think.", "c": "A：你為什麼在哭？有人對你說了難聽的話嗎？B：拜託【讓我一個人靜一靜】。我需要一點時間想想。", "f": "A: Why are you crying? Did someone say something mean to you? B: Please just leave me alone. I need some time to think."}, {"g": "", "t": "物 + makes + 人 + sick", "p": "(phr.)", "e": "something makes you feel ill or upset", "z": "讓人作噁；令人反感／噁心", "s": "The smell of the old garbage in the kitchen _____ me _____, so I opened all the windows right away.", "c": "廚房裡舊垃圾的味道【讓】我【覺得噁心】，所以我馬上打開了所有的窗戶。", "f": "The smell of the old garbage in the kitchen made me sick, so I opened all the windows right away."}, {"g": "", "t": "Mind your own business.", "p": "(phr.)", "e": "don't ask about things that are not about you", "z": "少管閒事", "s": "A: Who were you texting just now? Was it a boy from your class? B: _____ _____ _____ _____. It's not your problem!", "c": "A：你剛剛在跟誰傳訊息？是你們班的男生嗎？B：【少管閒事。】這不關你的事！", "f": "A: Who were you texting just now? Was it a boy from your class? B: Mind your own business. It's not your problem!"}, {"g": "", "t": "Neither + 助動詞/be動詞 + 主詞.", "p": "(phr.)", "e": "me too, for a negative idea", "z": "（前句否定）⋯⋯也不", "s": "A: I don't like eating bitter melon because it tastes terrible. B: _____ do I. But my mom always makes me eat it.", "c": "A：我不喜歡吃苦瓜，因為它很難吃。B：我【也不】喜歡。可是我媽總是逼我吃。", "f": "A: I don't like eating bitter melon because it tastes terrible. B: Neither do I. But my mom always makes me eat it."}, {"g": "", "t": "Never mind.", "p": "(phr.)", "e": "it's OK; don't worry about it", "z": "沒關係；別在意", "s": "A: I'm sorry, I forgot to bring the comic book you lent me. B: _____ _____. You can give it back next week.", "c": "A：對不起，我忘了帶你借我的漫畫。B：【沒關係。】你下星期再還我就好。", "f": "A: I'm sorry, I forgot to bring the comic book you lent me. B: Never mind. You can give it back next week."}, {"g": "", "t": "No kidding.", "p": "(phr.)", "e": "I am telling the truth; really.", "z": "不騙你；真的", "s": "A: Did you really see a famous singer at the MRT station this morning? B: _____ _____. She was standing right next to me!", "c": "A：你今天早上真的在捷運站看到一位有名的歌手？B：【不騙你】。她就站在我旁邊！", "f": "A: Did you really see a famous singer at the MRT station this morning? B: No kidding. She was standing right next to me!"}, {"g": "", "t": "No way!", "p": "(phr.)", "e": "used to say something is impossible or you won't do it", "z": "不可能！；門都沒有！", "s": "A: Can I copy your math homework before class starts? B: _____ _____! You should do it by yourself like everyone else.", "c": "A：上課前我可以抄你的數學作業嗎？B：【門都沒有】！你應該像其他人一樣自己寫。", "f": "A: Can I copy your math homework before class starts? B: No way! You should do it by yourself like everyone else."}, {"g": "", "t": "not + V + until + 時間/子句", "p": "(phr.)", "e": "only at that time, not before", "z": "直到⋯⋯才", "s": "My dad did _____ come home _____ eleven o'clock last night because he had a lot of work at the office.", "c": "我爸爸昨晚【直到】十一點【才】回家，因為他辦公室有很多工作。", "f": "My dad did not come home until eleven o'clock last night because he had a lot of work at the office."}, {"g": "", "t": "not + V + yet", "p": "(phr.)", "e": "not until now; still not", "z": "還沒⋯⋯", "s": "I have _____ finished my science project _____, so I can't go to the movies with you tonight.", "c": "我【還沒】完成我的自然專題，所以今晚不能跟你去看電影。", "f": "I have not finished my science project yet, so I can't go to the movies with you tonight."}, {"g": "", "t": "not + V/adj. + at all", "p": "(phr.)", "e": "not in any way", "z": "一點也不……、完全不……", "s": "I did _____ like the movie _____ _____ because the story was boring and the ending was too sad for me.", "c": "我【一點也不】喜歡那部電影，因為故事很無聊，而且結局對我來說太悲傷了。", "f": "I did not like the movie at all because the story was boring and the ending was too sad for me."}, {"g": "", "t": "Oh my goodness!", "p": "(phr.)", "e": "used when you are very surprised or sad", "z": "天啊！（表示吃驚或悲傷）", "s": "A: Did you hear that our teacher won first prize in the singing contest? B: _____ _____ _____! That's amazing news!", "c": "A：你聽說我們老師在歌唱比賽得了第一名嗎？B：【我的天啊】！真是太棒的消息了！", "f": "A: Did you hear that our teacher won first prize in the singing contest? B: Oh my goodness! That's amazing news!"}, {"g": "", "t": "once + 現在簡單式, S + 未來式", "p": "(phr.)", "e": "as soon as something happens", "z": "一旦……就……", "s": "_____ you learn how to ride a bike, you will never forget it, even if you don't ride for many years.", "c": "【一旦】你學會騎腳踏車，就永遠不會忘記，即使你很多年沒騎也一樣。", "f": "Once you learn how to ride a bike, you will never forget it, even if you don't ride for many years."}, {"g": "", "t": "one ..., another ..., the other ...（三者）", "p": "(phr.)", "e": "used to talk about three things or people", "z": "一個…；另一個…；剩下那個…", "s": "Amy bought three gifts for her friends: _____ is a pen, _____ is a notebook, and _____ _____ is a cute key chain.", "c": "艾咪幫朋友買了三份禮物：【一份】是筆，【另一份】是筆記本，【剩下那份】是可愛的鑰匙圈。", "f": "Amy bought three gifts for her friends: one is a pen, another is a notebook, and the other is a cute key chain."}, {"g": "", "t": "one ..., the other ...（兩者）", "p": "(phr.)", "e": "used to talk about two things or people", "z": "一個…；另一個…（兩者中的）", "s": "Peter has two pets at home; _____ is a white cat, and _____ _____ is a little brown dog named Coffee.", "c": "彼得家裡有兩隻寵物；【一隻】是白貓，【另一隻】是叫咖啡的棕色小狗。", "f": "Peter has two pets at home; one is a white cat, and the other is a little brown dog named Coffee."}, {"g": "", "t": "one of the + 最高級 + N(複數)", "p": "(phr.)", "e": "among the most … ones", "z": "最⋯⋯之一", "s": "Taipei 101 is _____ _____ _____ tallest buildings in the world, and many tourists visit it every year.", "c": "台北101是世界上最高的建築【之一】，每年都有很多觀光客造訪。", "f": "Taipei 101 is one of the tallest buildings in the world, and many tourists visit it every year."}, {"g": "", "t": "one's mind goes blank", "p": "(phr.)", "e": "suddenly you cannot think or remember anything", "z": "腦袋一片空白", "s": "When the teacher asked me to stand up and answer the question, my _____ _____ _____ and I couldn't say a word.", "c": "當老師叫我站起來回答問題時，我的【腦袋一片空白】，一個字都說不出來。", "f": "When the teacher asked me to stand up and answer the question, my mind went blank and I couldn't say a word."}, {"g": "", "t": "Please be seated.", "p": "(phr.)", "e": "a polite way to tell people to sit down", "z": "請坐下（較正式）", "s": "A: Good morning, everyone. The speech contest will start in five minutes. B: _____ _____ _____, and please turn off your phones.", "c": "A：大家早安，演講比賽五分鐘後開始。B：【請坐下】，也請把手機關機。", "f": "A: Good morning, everyone. The speech contest will start in five minutes. B: Please be seated, and please turn off your phones."}, {"g": "", "t": "pull a long face", "p": "(phr.)", "e": "look unhappy or sad", "z": "拉長臉；不高興", "s": "When Mom said we couldn't go to the beach because of the rain, my sister _____ _____ _____ _____ all afternoon.", "c": "當媽媽說因為下雨我們不能去海邊時，我妹妹整個下午都【拉長著臉】。", "f": "When Mom said we couldn't go to the beach because of the rain, my sister pulled a long face all afternoon."}, {"g": "", "t": "S + once + 過去式動詞", "p": "(phr.)", "e": "at one time in the past", "z": "曾經；以前（某段時間）", "s": "My grandfather _____ lived in a small village in the mountains, and he walked two hours to school every day.", "c": "我爺爺【曾經】住在山上的一個小村莊，他每天都要走兩個小時去上學。", "f": "My grandfather once lived in a small village in the mountains, and he walked two hours to school every day."}, {"g": "", "t": "S + V + if + 未來式", "p": "(phr.)", "e": "asks or tells whether something will happen later", "z": "間接問句：未來是否會發生某事（= whether）", "s": "I don't know _____ Grandma will visit us this weekend, because she hasn't called us back since Monday.", "c": "我不知道奶奶這個週末【是否】會來看我們，因為她從星期一到現在都還沒回電話。", "f": "I don't know if Grandma will visit us this weekend, because she hasn't called us back since Monday."}, {"g": "", "t": "S + V + when + 未來式", "p": "(phr.)", "e": "asks or tells at what time something will happen", "z": "間接問句：（問／不知道）未來何時會發生某事", "s": "My little brother keeps asking Mom _____ Dad will come home from his business trip in Japan, so she shows him the calendar.", "c": "我弟弟一直問媽媽爸爸【什麼時候】會從日本出差回來，所以她拿月曆給他看。", "f": "My little brother keeps asking Mom when Dad will come home from his business trip in Japan, so she shows him the calendar."}, {"g": "", "t": "S + V + whether + 未來式", "p": "(phr.)", "e": "asks or tells if something will happen later", "z": "間接問句：未來是否會發生某事", "s": "Kevin is not sure _____ his team will win the basketball game next week, so he practices hard every day after school.", "c": "凱文不確定他的球隊下週【是否】會贏得籃球比賽，所以他每天放學後都努力練習。", "f": "Kevin is not sure whether his team will win the basketball game next week, so he practices hard every day after school."}, {"g": "", "t": "See you later.", "p": "(phr.)", "e": "goodbye; I will see you soon", "z": "待會見；回頭見", "s": "A: I have to go to my piano lesson now. B: OK, _____ _____ _____! Let's meet at the park after dinner.", "c": "A：我現在得去上鋼琴課了。B：好，【待會見】！晚餐後我們在公園碰面吧。", "f": "A: I have to go to my piano lesson now. B: OK, see you later! Let's meet at the park after dinner."}, {"g": "", "t": "Seeing is believing.", "p": "(phr.)", "e": "You believe it when you see it yourself.", "z": "眼見為憑", "s": "A: My cousin says there are pink dolphins in Hong Kong. B: Really? I want to go there, because _____ _____ _____.", "c": "A：我表哥說香港有粉紅色的海豚。B：真的嗎？我想去那裡看看，因為【眼見為憑】。", "f": "A: My cousin says there are pink dolphins in Hong Kong. B: Really? I want to go there, because seeing is believing."}, {"g": "", "t": "So long.", "p": "(phr.)", "e": "goodbye", "z": "再見。", "s": "A: My bus is coming, so I have to go now. See you next week! B: _____ _____, Jenny! Have a nice weekend.", "c": "A：我的公車來了，所以我現在得走了。下週見！B：【再見】，珍妮！週末愉快。", "f": "A: My bus is coming, so I have to go now. See you next week! B: So long, Jenny! Have a nice weekend."}, {"g": "", "t": "Stop bugging me.", "p": "(phr.)", "e": "stop annoying me", "z": "別煩我了（俚語）", "s": "A: Can I play with your new video game? Please, please, please! B: _____ _____ _____. I'm doing my homework right now.", "c": "A：我可以玩你的新電玩嗎？拜託、拜託、拜託！B：【別煩我了】。我現在正在寫功課。", "f": "A: Can I play with your new video game? Please, please, please! B: Stop bugging me. I'm doing my homework right now."}, {"g": "", "t": "such a + adj. + N", "p": "(phr.)", "e": "used to make a singular noun stronger", "z": "這麼⋯⋯的（+ 單數可數名詞）", "s": "Thank you for making my birthday cake by yourself, Grandma! You are _____ _____ kind person, and I love you so much.", "c": "奶奶，謝謝您親手幫我做生日蛋糕！您真是【這麼】好心的人，我好愛您。", "f": "Thank you for making my birthday cake by yourself, Grandma! You are such a kind person, and I love you so much."}, {"g": "", "t": "such a + adj. + N = so + adj. + a + N", "p": "(phr.)", "e": "used to say a thing is very something", "z": "如此…的…（如：如此短的裙子）", "s": "Grandma was surprised when Amy wore _____ _____ short skirt to the family dinner, so Amy put on long pants instead.", "c": "艾咪穿【如此短的】裙子去家庭聚餐時，奶奶很驚訝，所以艾咪改穿了長褲。", "f": "Grandma was surprised when Amy wore such a short skirt to the family dinner, so Amy put on long pants instead."}, {"g": "", "t": "take + 人's breath away", "p": "(phr.)", "e": "make someone surprised by beauty", "z": "令人屏息；令人驚艷", "s": "When we reached the top of Jade Mountain, the beautiful sunrise _____ our _____ _____, and nobody said a word.", "c": "我們登上玉山山頂時，美麗的日出【令】我們【屏息】，沒有人說一句話。", "f": "When we reached the top of Jade Mountain, the beautiful sunrise took our breath away, and nobody said a word."}, {"g": "", "t": "Talk to you later.", "p": "(phr.)", "e": "goodbye; we will talk again soon", "z": "待會再聊", "s": "A: My mom is calling me for dinner, so I have to go now. B: No problem. _____ _____ _____ _____!", "c": "A：我媽叫我吃晚餐了，所以我現在得走了。B：沒問題。【待會再聊】！", "f": "A: My mom is calling me for dinner, so I have to go now. B: No problem. Talk to you later!"}, {"g": "", "t": "That was close.", "p": "(phr.)", "e": "said when something bad almost happened", "z": "好險；差一點", "s": "A: Wow, that ball almost hit the window of our classroom! B: _____ _____ _____! Let's play somewhere else next time.", "c": "A：哇，那顆球差點打到我們教室的窗戶！B：【好險】！下次我們去別的地方玩吧。", "f": "A: Wow, that ball almost hit the window of our classroom! B: That was close! Let's play somewhere else next time."}, {"g": "", "t": "the + 最高級 + (that) I have ever + p.p.", "p": "(phr.)", "e": "the most … in my whole life", "z": "我曾經⋯⋯過的最⋯⋯", "s": "This is _____ best beef noodle soup _____ _____ _____ eaten, and I want to come back to this shop tomorrow.", "c": "這是【我吃過最】好吃的牛肉麵，我明天還想再來這家店。", "f": "This is the best beef noodle soup I have ever eaten, and I want to come back to this shop tomorrow."}, {"g": "", "t": "the last + 人 + to + VR", "p": "(phr.)", "e": "the person least likely to do something", "z": "最不可能…的人", "s": "Ken is very honest and kind, so he is _____ _____ person _____ tell a lie to his friends or teachers.", "c": "肯非常誠實又善良，所以他是【最不可能】對朋友或老師說謊的人。", "f": "Ken is very honest and kind, so he is the last person to tell a lie to his friends or teachers."}, {"g": "", "t": "the last thing + 人 + want to + VR", "p": "(phr.)", "e": "something you really do not want to do", "z": "最不想做的事", "s": "After a long day at cram school, _____ _____ _____ Jason _____ _____ do is wash the dishes, but his mom asks him to.", "c": "在補習班上了一整天課之後，洗碗是 Jason【最不想做的事】，但他媽媽還是要他洗。", "f": "After a long day at cram school, the last thing Jason wants to do is wash the dishes, but his mom asks him to."}, {"g": "", "t": "the last thing I would do", "p": "(phr.)", "e": "something I would never do", "z": "我最不可能做的事", "s": "Lying to my parents is _____ _____ _____ _____ _____ _____, because they always trust me and I love them.", "c": "對爸媽說謊是【我最不可能做的事】，因為他們總是信任我，而且我愛他們。", "f": "Lying to my parents is the last thing I would do, because they always trust me and I love them."}, {"g": "", "t": "The less, the better.", "p": "(phr.)", "e": "less of it is better", "z": "越少越好", "s": "A: How much sugar do you want in your green tea? B: _____ _____, _____ _____. I'm trying to eat healthier this year.", "c": "A：你的綠茶要加多少糖？B：【越少越好】。我今年想吃得健康一點。", "f": "A: How much sugar do you want in your green tea? B: The less, the better. I'm trying to eat healthier this year."}, {"g": "", "t": "The more, the better.", "p": "(phr.)", "e": "more of it is better", "z": "越多越好", "s": "A: How many apples should I buy for the fruit salad? B: _____ _____, _____ _____! Everyone in my family loves apples.", "c": "A：做水果沙拉我該買幾顆蘋果？B：【越多越好】！我家每個人都愛吃蘋果。", "f": "A: How many apples should I buy for the fruit salad? B: The more, the better! Everyone in my family loves apples."}, {"g": "", "t": "The more, the merrier.", "p": "(phr.)", "e": "more people make it more fun", "z": "人越多越熱鬧", "s": "A: Can I bring my cousins to your barbecue party this Saturday? B: Sure! _____ _____, _____ _____!", "c": "A：這週六我可以帶我表哥表姊去你的烤肉派對嗎？B：當然！【人越多越熱鬧】！", "f": "A: Can I bring my cousins to your barbecue party this Saturday? B: Sure! The more, the merrier!"}, {"g": "", "t": "The report says + that 子句", "p": "(phr.)", "e": "the news story tells us that", "z": "報導指出", "s": "_____ _____ _____ that it will rain heavily this weekend, so we should move the picnic to next Saturday.", "c": "【報導指出】這個週末會下大雨，所以我們應該把野餐改到下週六。", "f": "The report says that it will rain heavily this weekend, so we should move the picnic to next Saturday."}, {"g": "", "t": "the way + S + used to", "p": "(phr.)", "e": "like someone did in the past", "z": "像（某人）以前那樣", "s": "Ken and Joe still play basketball together every Sunday, just _____ _____ they _____ _____ in junior high school.", "c": "阿肯和阿喬每個星期天仍然一起打籃球，就【像】他們國中時【那樣】。", "f": "Ken and Joe still play basketball together every Sunday, just the way they used to in junior high school."}, {"g": "", "t": "There is a market for + N", "p": "(phr.)", "e": "many people want to buy this", "z": "對……有市場需求", "s": "Many families have pets now, so _____ _____ _____ _____ _____ healthy pet food in Taiwan.", "c": "現在很多家庭都養寵物，所以在台灣健康寵物食品【有市場需求】。", "f": "Many families have pets now, so there is a market for healthy pet food in Taiwan."}, {"g": "", "t": "There is no point + V-ing", "p": "(phr.)", "e": "it is not useful or worth doing something", "z": "做⋯⋯沒有意義", "s": "_____ _____ _____ _____ waiting for the bus in this heavy rain, so let's just take a taxi to the train station.", "c": "在這麼大的雨中等公車【沒有意義】，我們乾脆搭計程車去火車站吧。", "f": "There is no point waiting for the bus in this heavy rain, so let's just take a taxi to the train station."}, {"g": "", "t": "There is no use + V-ing", "p": "(phr.)", "e": "it is useless to do something", "z": "做⋯⋯沒有用", "s": "_____ _____ _____ _____ crying about the lost game now, so let's practice harder for the next one.", "c": "現在為輸掉的比賽哭也【沒有用】，所以我們為下一場更努力練習吧。", "f": "There is no use crying about the lost game now, so let's practice harder for the next one."}, {"g": "", "t": "There's no way through.", "p": "(phr.)", "e": "you cannot pass this road or place", "z": "沒有通路；過不去", "s": "A: Can we take this road to the beach? B: No, a big tree fell across it last night. _____ _____ _____ _____.", "c": "A：我們可以走這條路去海邊嗎？B：不行，昨晚有一棵大樹倒在路上。【過不去了】。", "f": "A: Can we take this road to the beach? B: No, a big tree fell across it last night. There's no way through."}, {"g": "", "t": "This is the least I can do.", "p": "(phr.)", "e": "it is only a small thing to help you", "z": "這是我起碼能做的（一點小事）", "s": "A: Thank you so much for carrying these heavy boxes upstairs. B: You helped me with math last week, so _____ _____ _____ _____ _____ _____ _____.", "c": "A：真謝謝你幫我把這些重箱子搬上樓。B：你上週教我數學，所以【這是我起碼能做的】。", "f": "A: Thank you so much for carrying these heavy boxes upstairs. B: You helped me with math last week, so this is the least I can do."}, {"g": "", "t": "句子, though.", "p": "(phr.)", "e": "however (at the end of a sentence)", "z": "不過；然而（放在句尾）", "s": "The movie we saw last night was a little long. It was very funny, _____, so we all enjoyed it a lot.", "c": "我們昨晚看的電影有點長。【不過】很好笑，所以我們都看得很開心。", "f": "The movie we saw last night was a little long. It was very funny, though, so we all enjoyed it a lot."}, {"g": "", "t": "Time is up.", "p": "(phr.)", "e": "There is no more time left.", "z": "時間到了", "s": "A: Please put your pencils down, everyone. _____ _____ _____. B: Oh no, I still have two questions left to answer!", "c": "A：大家請放下鉛筆。【時間到了】。B：喔不，我還有兩題沒寫！", "f": "A: Please put your pencils down, everyone. Time is up. B: Oh no, I still have two questions left to answer!"}, {"g": "", "t": "too + adj./adv. + to + VR", "p": "(phr.)", "e": "so much that you cannot do something", "z": "太……以致不能……", "s": "My little brother is _____ young _____ ride the roller coaster, so he waited with Mom and ate ice cream instead.", "c": "我弟弟【太】小了，【不能】坐雲霄飛車，所以他和媽媽在旁邊等，吃了冰淇淋。", "f": "My little brother is too young to ride the roller coaster, so he waited with Mom and ate ice cream instead."}, {"g": "", "t": "too good to be true", "p": "(phr.)", "e": "so good that it is hard to believe", "z": "好得令人難以置信", "s": "The ad said we could get a new phone for only ten dollars, but it sounded _____ _____ _____ _____ _____.", "c": "廣告說我們只要十元就能買到新手機，但這聽起來【好得令人難以置信】。", "f": "The ad said we could get a new phone for only ten dollars, but it sounded too good to be true."}, {"g": "", "t": "Trick or treat!", "p": "(phr.)", "e": "what children say on Halloween to get candy", "z": "不給糖就搗蛋", "s": "On Halloween night, the children in costumes knocked on our door and shouted, \"_____ _____ _____!\" so we gave them candy.", "c": "萬聖節晚上，穿著裝扮的孩子們敲我們的門大喊「【不給糖就搗蛋】！」，所以我們給了他們糖果。", "f": "On Halloween night, the children in costumes knocked on our door and shouted, \"Trick or treat!\" so we gave them candy."}, {"g": "", "t": "turn a blind eye to + N", "p": "(phr.)", "e": "pretend not to see something wrong", "z": "對⋯⋯視而不見", "s": "A good teacher should never _____ _____ _____ _____ _____ bullying, because every student needs to feel safe at school.", "c": "好老師絕不應該【對】霸凌【視而不見】，因為每個學生在學校都需要感到安全。", "f": "A good teacher should never turn a blind eye to bullying, because every student needs to feel safe at school."}, {"g": "", "t": "turn a deaf ear to + N", "p": "(phr.)", "e": "not listen to someone on purpose", "z": "對⋯⋯充耳不聞", "s": "Mom told Peter many times to stop playing games late at night, but he always _____ _____ _____ _____ _____ her.", "c": "媽媽告訴Peter很多次不要熬夜打電動，但他總是【對】她的話【充耳不聞】。", "f": "Mom told Peter many times to stop playing games late at night, but he always turns a deaf ear to her."}, {"g": "", "t": "Understood?", "p": "(phr.)", "e": "Do you understand?", "z": "懂了嗎？", "s": "A: Remember to wear your helmet every time you ride your bike to school. _____? B: Yes, Dad, I will always wear it.", "c": "A：記得每次騎腳踏車上學都要戴安全帽。【懂了嗎？】B：好的，爸爸，我一定會戴。", "f": "A: Remember to wear your helmet every time you ride your bike to school. Understood? B: Yes, Dad, I will always wear it."}, {"g": "", "t": "V-ing + takes + 人 + 時間", "p": "(phr.)", "e": "doing this needs this much time", "z": "做⋯⋯花某人多少時間", "s": "Cleaning the whole house _____ my family about three hours every Sunday, so we always order pizza for lunch.", "c": "打掃整個房子每個星期天【花】我們家大約三個小時，所以我們午餐總是叫披薩。", "f": "Cleaning the whole house takes my family about three hours every Sunday, so we always order pizza for lunch."}, {"g": "", "t": "Way to go.", "p": "(phr.)", "e": "used to say someone did a great job", "z": "幹得好！；做得好！", "s": "A: Mom, I got first place in the school swimming race today! B: _____ _____ _____. I knew all your practice would help.", "c": "A：媽，我今天在學校游泳比賽得到第一名！B：【做得好】！我就知道你的練習會有幫助。", "f": "A: Mom, I got first place in the school swimming race today! B: Way to go. I knew all your practice would help."}, {"g": "", "t": "What + 疑問句 + for?", "p": "(phr.)", "e": "used to ask why or for what reason", "z": "為了什麼", "s": "A: _____ did you buy so many eggs and so much flour _____? B: I'm going to bake a big cake for Grandma's birthday.", "c": "A：你買這麼多蛋和麵粉【是為了什麼】？B：我要幫奶奶的生日烤一個大蛋糕。", "f": "A: What did you buy so many eggs and so much flour for? B: I'm going to bake a big cake for Grandma's birthday."}, {"g": "", "t": "What a play!", "p": "(phr.)", "e": "That was a great move in a game!", "z": "好球！（比賽
