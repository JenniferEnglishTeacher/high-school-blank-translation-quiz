中的感嘆）", "s": "A: Did you see Chen just catch the ball with one hand and throw it to first base? B: Wow! _____ _____ _____!", "c": "A：你有看到陳剛剛單手接球再傳到一壘嗎？B：哇！【好球！】", "f": "A: Did you see Chen just catch the ball with one hand and throw it to first base? B: Wow! What a play!"}, {"g": "", "t": "What do you have in mind?", "p": "(phr.)", "e": "a question asking about someone's idea or plan", "z": "你有什麼想法？", "s": "A: Let's do something special for Mom's birthday this Sunday. B: Good idea! _____ _____ _____ _____ _____ _____?", "c": "A：這個星期天我們為媽媽的生日做點特別的事吧。B：好主意！【你有什麼想法？】", "f": "A: Let's do something special for Mom's birthday this Sunday. B: Good idea! What do you have in mind?"}, {"g": "", "t": "What else …?", "p": "(phr.)", "e": "which other thing?", "z": "還有什麼", "s": "A: I bought milk, eggs, and flour at the supermarket. B: Thanks! _____ _____ do we need for the cake tonight?", "c": "A：我在超市買了牛奶、蛋和麵粉。B：謝啦！今晚做蛋糕我們【還】需要【什麼】？", "f": "A: I bought milk, eggs, and flour at the supermarket. B: Thanks! What else do we need for the cake tonight?"}, {"g": "", "t": "What kinds of + N?", "p": "(phr.)", "e": "used to ask about the types of something", "z": "什麼種類的…？", "s": "A: _____ _____ _____ books do you usually borrow from the library? B: I like comic books and stories about animals best.", "c": "A：你通常從圖書館借【什麼種類的】書？B：我最喜歡漫畫和動物故事。", "f": "A: What kinds of books do you usually borrow from the library? B: I like comic books and stories about animals best."}, {"g": "", "t": "What/How about + N/V-ing?", "p": "(phr.)", "e": "used to make a suggestion or ask an opinion", "z": "…如何？；…怎麼樣？", "s": "A: I'm bored, and it's too hot to play basketball outside. B: _____ _____ watching a movie at my house this afternoon?", "c": "A：我好無聊，而且外面太熱不能打籃球。B：今天下午來我家看電影【如何】？", "f": "A: I'm bored, and it's too hot to play basketball outside. B: How about watching a movie at my house this afternoon?"}, {"g": "", "t": "What's on your mind?", "p": "(phr.)", "e": "a question asking what someone is thinking about", "z": "你在想什麼？", "s": "A: You have been quiet all day. _____ _____ _____ _____? B: I'm worried about tomorrow's math test.", "c": "A：你一整天都很安靜。【你在想什麼？】B：我在擔心明天的數學考試。", "f": "A: You have been quiet all day. What's on your mind? B: I'm worried about tomorrow's math test."}, {"g": "", "t": "What's the catch?", "p": "(phr.)", "e": "What is the hidden problem?", "z": "有什麼陷阱？（口語）", "s": "A: This shop is selling new phones for only one thousand dollars today! B: Really? _____ _____ _____? It sounds too good to be true.", "c": "A：這家店今天新手機只賣一千元！B：真的嗎？【有什麼陷阱？】聽起來好得不像真的。", "f": "A: This shop is selling new phones for only one thousand dollars today! B: Really? What's the catch? It sounds too good to be true."}, {"g": "", "t": "What's the matter?", "p": "(phr.)", "e": "a question asking what is wrong", "z": "怎麼了？", "s": "A: _____ _____ _____? You look very sad today. B: I lost my new bike at the park yesterday.", "c": "A：【怎麼了？】你今天看起來很難過。B：我昨天在公園弄丟了我的新腳踏車。", "f": "A: What's the matter? You look very sad today. B: I lost my new bike at the park yesterday."}, {"g": "", "t": "What's up?", "p": "(phr.)", "e": "What is happening? / What's wrong?", "z": "什麼事？怎麼了？", "s": "A: Hi, Wendy! You look worried today. _____ _____? B: I lost my bus card, and I don't know how to get home.", "c": "A：嗨，Wendy！你今天看起來很擔心。【怎麼了】？B：我的公車卡不見了，不知道要怎麼回家。", "f": "A: Hi, Wendy! You look worried today. What's up? B: I lost my bus card, and I don't know how to get home."}, {"g": "", "t": "What's your take on + N?", "p": "(phr.)", "e": "What do you think about it?", "z": "你對⋯⋯有什麼看法？", "s": "A: _____ _____ _____ _____ the new rule about using phones at school? B: I think it is fair, but a little strict.", "c": "A：【你對】學校使用手機的新規定【有什麼看法？】B：我覺得很公平，但有點嚴格。", "f": "A: What's your take on the new rule about using phones at school? B: I think it is fair, but a little strict."}, {"g": "", "t": "When + 過去簡單式, 主詞 + 過去簡單式.", "p": "(phr.)", "e": "one past action happened at the time of another", "z": "當過去某事發生時，另一件事也發生了", "s": "_____ I got home yesterday afternoon, my dog ran to the door and jumped on me happily.", "c": "昨天下午【當】我回到家時，我的狗跑到門口開心地撲到我身上。", "f": "When I got home yesterday afternoon, my dog ran to the door and jumped on me happily."}, {"g": "", "t": "whether + 現在簡單式 (or not), S + 未來式", "p": "(phr.)", "e": "something will happen in both cases", "z": "條件句：無論某事是否發生，都將會……", "s": "_____ it is sunny _____ _____ this Saturday, we will still go to the night market with our cousins from Taichung.", "c": "【無論】這個星期六【是否】出太陽，我們都還是會和台中來的表哥表姊去逛夜市。", "f": "Whether it is sunny or not this Saturday, we will still go to the night market with our cousins from Taichung."}, {"g": "", "t": "Which way are you heading?", "p": "(phr.)", "e": "asks where someone is going", "z": "你要往哪走？", "s": "A: I'm leaving the library now, Peter. B: Me too. _____ _____ _____ _____ _____? Maybe we can walk together.", "c": "A：彼得，我現在要離開圖書館了。B：我也是。【你要往哪走】？也許我們可以一起走。", "f": "A: I'm leaving the library now, Peter. B: Me too. Which way are you heading? Maybe we can walk together."}, {"g": "", "t": "Who else …?", "p": "(phr.)", "e": "which other person?", "z": "還有誰", "s": "A: Jenny and Mark are coming to my birthday party on Saturday. B: Great! _____ _____ is coming?", "c": "A：珍妮和馬克星期六會來我的生日派對。B：太好了！【還有誰】會來？", "f": "A: Jenny and Mark are coming to my birthday party on Saturday. B: Great! Who else is coming?"}, {"g": "", "t": "would + VR（過去習慣）", "p": "(phr.)", "e": "did something often in the past", "z": "過去常常（表習慣）= used to", "s": "When I was a child, my grandmother _____ take me to the morning market every Sunday and buy me soy milk.", "c": "我小時候，奶奶每個星期天【常常】帶我去早市，還會買豆漿給我。", "f": "When I was a child, my grandmother would take me to the morning market every Sunday and buy me soy milk."}, {"g": "", "t": "You bet.", "p": "(phr.)", "e": "used to say \"yes, of course\" strongly", "z": "當然；沒錯（強烈肯定）", "s": "A: Are you coming to watch my basketball game on Saturday afternoon? B: _____ _____! I wouldn't miss it for anything.", "c": "A：你星期六下午會來看我的籃球比賽嗎？B：【當然】！我說什麼都不會錯過的。", "f": "A: Are you coming to watch my basketball game on Saturday afternoon? B: You bet! I wouldn't miss it for anything."}, {"g": "", "t": "You can say that again.", "p": "(phr.)", "e": "used to say you agree completely", "z": "完全同意；沒錯（口語）", "s": "A: This math test was so hard, and I didn't finish the last page. B: _____ _____ _____ _____ _____. I almost cried.", "c": "A：這次數學考試好難，我最後一頁都沒寫完。B：【完全同意】。我差點哭了。", "f": "A: This math test was so hard, and I didn't finish the last page. B: You can say that again. I almost cried."}, {"g": "", "t": "You only live once.", "p": "(phr.)", "e": "enjoy life and try new things now", "z": "人生只有一次；及時行樂", "s": "A: I'm a little scared to try the big roller coaster at the theme park. B: Come on! _____ _____ _____ _____. Let's go!", "c": "A：我有點害怕去玩主題樂園的大雲霄飛車。B：來嘛！【人生只有一次】，走吧！", "f": "A: I'm a little scared to try the big roller coaster at the theme park. B: Come on! You only live once. Let's go!"}];</script><script src="longteng-b1u5-quiz.js?v=20261106-3"></script><script src="cap-vocab-learn.js?v=20261105-1"></script><script>document.querySelector("#description").textContent="先在「教學 Learn」看完 148 筆詞彙表，再到「測驗 Quiz」做 60 題四選一｜選答後顯示答案、用語中文與整句中譯｜答錯可重做並下載錯題";</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
