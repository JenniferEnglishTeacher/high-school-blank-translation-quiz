:root{--blue:#2563eb;--deep:#172554;--bg:#f4f7fb;--line:#d9e2ef;--ok:#15803d;--bad:#b91c1c;--violet:#6d28d9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font-family:Arial,"Microsoft JhengHei",sans-serif;line-height:1.7}main{max-width:1060px;margin:auto;padding:14px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 7px 24px #0f172a0c}.hero{background:linear-gradient(135deg,#eff6ff,#fff)}h1{margin:0;font-size:clamp(25px,4vw,38px)}h2,h3{margin:0 0 10px}.muted{color:#64748b}.hidden{display:none!important}.btn{border:0;border-radius:10px;padding:10px 15px;font:800 16px inherit;cursor:pointer;background:#e5e7eb;color:#172033;text-decoration:none}.primary{background:var(--blue);color:#fff}.voice{background:var(--violet);color:#fff}.danger{background:#991b1b;color:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;font-weight:800;color:#64748b;margin:9px 0}.prompt,.passage{font-size:18px;background:#f8fafc;border-radius:12px;padding:16px;white-space:pre-wrap}.passage{max-height:48vh;overflow:auto}.blank-now{background:#fef3c7;color:#92400e;padding:2px 7px;border-radius:6px;font-weight:900}.options{display:grid;gap:9px;margin:14px 0}.option{border:2px solid #cbd5e1;background:#fff;border-radius:11px;padding:12px 14px;text-align:left;font:700 16px inherit;cursor:pointer}.option:hover{border-color:var(--blue)}.option.wrong{border-color:#fecaca;background:#fff1f2}.option.correct{border-color:#86efac;background:#f0fdf4}.feedback,.reference{padding:13px;border-radius:10px;margin:12px 0;font-weight:800;white-space:pre-wrap}.feedback.ok{background:#ecfdf3;color:var(--ok)}.feedback.bad{background:#fff1f2;color:var(--bad)}.reference{border:2px solid #bbf7d0;background:#f0fdf4}.translation{white-space:pre-wrap;background:#f8fafc;padding:16px;border-radius:12px;font-size:18px}.inline-input{width:150px;max-width:100%;font:inherit;padding:7px 9px;border:2px solid #94a3b8;border-radius:8px;margin:3px}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:#f5f3ff;margin:12px 0}.voice-result{background:#fff;border:1px solid #ddd6fe;padding:10px;border-radius:9px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat,.wrong-card{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong-card{margin:10px 0;background:#fff7f7;border-color:#fecaca}@media(max-width:620px){main{padding:8px}.hero,.card{padding:15px}.meta{display:block}.prompt,.passage,.translation{font-size:16px}}
</style></head><body><main><section class="hero"><h1>三民普高 B3U9｜篇章結構</h1><p class="muted">原題互動練習｜16 題｜即時批改｜錯誤重填｜答對後整句播放＋選做 STT｜錯題 DOCX｜成績登錄</p><div class="actions"><a class="btn" href="dashboard.html">← 回 Dashboard</a></div></section><section id="quiz" class="card"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="reference" class="reference hidden"></div><div id="voiceBox" class="voicebox hidden"><h3>🎙️ Pronunciation Check（選做）</h3><p><b id="voiceTarget"></b></p><div class="actions"><button id="speak" class="btn voice">🔊 再聽一次</button><button id="mic" class="btn primary">🎤 開始朗讀評分</button></div><div id="voiceResult" class="voice-result">尚未進行朗讀評分。</div></div><div class="actions"><button id="check" class="btn primary hidden">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束本輪</button></div></section><section id="result" class="card hidden"><h2>練習結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="download" class="btn primary">下載錯題 DOCX</button><button id="restart" class="btn">重新練習</button></div></section></main><script>
const QUIZ={"unit":"B3U9","kind":"bank","title":"篇章結構","count":16,"data":[{"set":1,"passage":"Every coin has two sides. Thanks to Taiwan's economic development in recent years, people now live a more comfortable life than ever. However, it does not necessarily come with a better living environment. __1__ We care about nothing but how to make money, and pay little attention to the harm economic activities have caused to the rivers, mountains and the ocean around us. Taiwan is getting richer, but a life of quality is now just a thing of the past.\n    In such a situation, wildlife is negatively affected to a great extent. __2__ Therefore, wild animals are forced to leave their habitats and wild plants die in large amounts. As mankind attempts to conquer nature, some species might have even become extinct. __3__ They consider it unwise to disturb the ecosystem because soon or later we must pay for what we do to it.\n    From now on, people in Taiwan should take steps to protect wildlife, especially endangered species. First, the government should educate the public to raise their awareness of environmental protection. __4__ If we can follow these directions thoroughly, Taiwan certainly does not have to develop its economy at the sacrifice of her valuable natural assets.","options":{"A":"We do harm to the ecosystem when trying to invade wilderness areas and use natural resources.","B":"Besides, severe wildlife preservation laws should be made and enforced strictly.","C":"Scientists have already warned us to stop doing damage to the Mother Nature.","D":"Although many factories have moved abroad, the pollution they caused in the past is still present in Taiwan's rivers and air.","E":"In fact, Taiwan's natural environment seems to have worsened."},"answers":["E","A","C","B"],"sentences":["In fact, Taiwan's natural environment seems to have worsened. We care about nothing but how to make money, and pay little attention to the harm economic activities have caused to the rivers, mountains and the ocean around us.","We do harm to the ecosystem when trying to invade wilderness areas and use natural resources. Therefore, wild animals are forced to leave their habitats and wild plants die in large amounts.","Scientists have already warned us to stop doing damage to the Mother Nature. They consider it unwise to disturb the ecosystem because soon or later we must pay for what we do to it.","Besides, severe wildlife preservation laws should be made and enforced strictly. If we can follow these directions thoroughly, Taiwan certainly does not have to develop its economy at the sacrifice of her valuable natural assets."],"blankNums":[1,2,3,4],"structure":true},{"set":2,"passage":"Obon, or the Bon Festival, is a Japanese holiday that honors the spirits of the dead. __1__ The festival usually lasts for four to five days in August. During this period, many people travel back to their hometowns and spend time with loved ones, both past and present.\n    Though not a national holiday, Obon is surely one of the most traditional events of the year. Celebration often begins with mukaebi (welcoming fire), during which people make a small bonfire in front of their house to guide spirits upon their return back home. __2__ Food offerings are presented at house altars and temples. Some regions prepare horses made of cucumbers and cows made of eggplants, hoping that the spirits will come back to Earth quickly, on a horse, and leave slowly, riding the cow.\n __3__ Paper lanterns and offerings are sent floating down rivers to accompany the ancestors back to their resting place. Many areas will also organize bon-odori dances. The style of the dances varies from region to region but is normally based on the rhythms of taiko drums. Performers usually play on a tall stage with lanterns and banners strung all around. Participants, often dressed in light cotton kimonos, are encouraged to dance to the music around the stage. __4__ Originally dedicated to the deceased, the dances have now become a symbol of the summer festival themselves.","options":{"A":"Some people also visit the cemetery to clean up the family graves and pray for their ancestors.","B":"Such festive activities are usually held in parks, temples, and other public places around Japan.","C":"Obon concludes with another bonfire, okuribi, lighting up the sky to see the ancestors' spirits off.","D":"Originating from the Chinese Ghost Festival, this annual event has evolved into a time of family reunion."},"answers":["D","A","C","B"],"sentences":["Originating from the Chinese Ghost Festival, this annual event has evolved into a time of family reunion. The festival usually lasts for four to five days in August.","Some people also visit the cemetery to clean up the family graves and pray for their ancestors. Food offerings are presented at house altars and temples.","Obon concludes with another bonfire, okuribi, lighting up the sky to see the ancestors' spirits off. Paper lanterns and offerings are sent floating down rivers to accompany the ancestors back to their resting place.","Such festive activities are usually held in parks, temples, and other public places around Japan. Originally dedicated to the deceased, the dances have now become a symbol of the summer festival themselves."],"blankNums":[1,2,3,4],"structure":true},{"set":3,"passage":"If your habits are about the same as those of the average Americans, you produce about 4 pounds of solid trash every day. It is estimated that each year, the United States produces about 200 million tons of trash. __1__ This creates tough problems for our modern society.\n    However, in order to solve this problem, many new industries and jobs have opened up. The garbage and trash you produce every day are sent to waste disposal centers. Solid waste can be disposed of (去除) in three ways: It can be buried in landfills (掩埋場), burned in an incinerator (焚化爐), or recycled.\n    In a safe landfill, the waste is cleaned before being deeply buried and covered with earth. However, using landfills may be unhealthy and dangerous. It is possible that the buried trash could pollute (汙染) our drinking water as it flows beneath these deep holes. __2__\n    Incineration can reduce waste to steam. The steam is then used to produce energy for industry. __3__ The ash then also needs to be buried in waste landfills.\n    Recycling, which means to process waste and use it again, is probably the best method. If we pay a little more attention, we could reuse or recycle more than 70 percent of the waste landfills. This includes valuable materials such as glass, metal, and paper. __4__ Moreover, scientists are creating new materials that will be easier to recycle. It seems that garbage has become big business.","options":{"A":"People are often reminded to sort items like bottles and paper, but they still end up putting everything into the same trash bin.","B":"This would reduce the demand on sources of these materials and reduce possible environmental pollution.","C":"However, it may release toxins (毒素) into the air and create ash.","D":"People are producing waste faster than nature can break them down.","E":"Once groundwater is polluted, it is very expensive and difficult, sometimes even impossible, to clean it up."},"answers":["D","E","C","B"],"sentences":["People are producing waste faster than nature can break them down. This creates tough problems for our modern society.","Once groundwater is polluted, it is very expensive and difficult, sometimes even impossible, to clean it up.\n Incineration can reduce waste to steam.","However, it may release toxins (毒素) into the air and create ash. The ash then also needs to be buried in waste landfills.","This would reduce the demand on sources of these materials and reduce possible environmental pollution. Moreover, scientists are creating new materials that will be easier to recycle."],"blankNums":[1,2,3,4],"structure":true},{"set":4,"passage":"Because of modern communication, tourism has been more popular than before. However, the fast-growing industry with its budget airlines has become one of the major contributors to global warming and many other environmental problems. __1__ There is no such thing as a secret paradise.\n    Not surprisingly, ecotourism has become a new trend. __2__ This may be conducted through lectures or an involvement in conservation projects. Tourists can also simply learn them from a knowledgeable tour guide. While comforts and luxuries are still important, they are willing to pay for the preservation of the natural and social environment they want to explore. __3__ For others, it may be just boredom with conventional holidays and a need to do something different.\n    The new market varies rapidly. You can observe penguins in the Antarctic or tigers in Indian national parks in the company of scientists, stay in eco-lodges in rainforests and eat organic food or even help in the construction of a local school. __4__ But that's another story altogether.","options":{"A":"A fundamental element of an eco-holiday is the protection of natural resources or endangered species.","B":"Moreover, tourists might destroy what they are searching for, while they discover it.","C":"In some countries, tourism taxes are used to repair ancient buildings, especially those located in busy shopping districts.","D":"To some, it may be a matter of guilt or environmental consciousness.","E":"That is volunteer tourism for you, another form of ecotourism."},"answers":["B","A","D","E"],"sentences":["Moreover, tourists might destroy what they are searching for, while they discover it. There is no such thing as a secret paradise.","A fundamental element of an eco-holiday is the protection of natural resources or endangered species. This may be conducted through lectures or an involvement in conservation projects.","To some, it may be a matter of guilt or environmental consciousness. For others, it may be just boredom with conventional holidays and a need to do something different.","That is volunteer tourism for you, another form of ecotourism. But that's another story altogether."],"blankNums":[1,2,3,4],"structure":true}]};const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let flat=[],index=0,wrong=new Map(),attempted=new Set(),firstTry=new Set(),recognition=null;
function flatten(){if(QUIZ.kind==='mcq')return QUIZ.data.map(x=>({...x,id:String(x.number)}));if(QUIZ.kind==='translation')return QUIZ.data.map(x=>({...x,id:String(x.number)}));return QUIZ.data.flatMap(set=>set.answers.map((answer,i)=>({id:`${set.set}-${i+1}`,set:set.set,passage:set.passage,options:set.options,answer,blank:i+1,sentence:set.sentences[i],structure:set.structure})))}
function fillPassage(text,answers,options){let out=text;answers.forEach((a,i)=>{const word=options[a];const n=i+1;const pats=[new RegExp(`__\\(?${n}\\)?__`),new RegExp(`__${n}__`),new RegExp(`　${n}　`),new RegExp(`\\(${n}\\)`)];for(const p of pats){if(p.test(out)){out=out.replace(p,word);break}}});return out.replace(/\n+/g,' ').replace(/\s+/g,' ').trim()}
function markBlank(text,n){const tag=`<span class="blank-now">Blank ${n}</span>`;let out=esc(text),done=false;for(const p of [new RegExp(`__\\(?${n}\\)?__`),new RegExp(`__${n}__`),new RegExp(`　${n}　`),new RegExp(`\\(${n}\\)`)]){if(!done&&p.test(out)){out=out.replace(p,tag);done=true}}return out}
function norm(s){return String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ')}function speak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}
function show(){try{recognition?.abort()}catch(e){}speechSynthesis?.cancel();const q=flat[index];$('#meta').textContent=`第 ${index+1} / ${flat.length} 題`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=((index+1)/flat.length*100)+'%';$('#feedback').className='feedback hidden';$('#reference').classList.add('hidden');$('#voiceBox').classList.add('hidden');$('#next').classList.add('hidden');$('#check').classList.toggle('hidden',QUIZ.kind!=='translation');$('#answerArea').innerHTML='';if(QUIZ.kind==='mcq')renderChoice(q.prompt,q.options);else if(QUIZ.kind==='translation')renderTranslation(q);else{$('#question').innerHTML=`<div class="passage">${markBlank(q.passage,q.blank)}</div>`;renderChoice(`第 ${q.blank} 格`,q.options)}}
function renderChoice(prompt,options){$('#question').innerHTML=QUIZ.kind==='mcq'?`<div class="prompt">${esc(prompt)}</div>`:$('#question').innerHTML;$('#answerArea').innerHTML='<div class="options">'+Object.entries(options).map(([k,v])=>`<button class="option" data-key="${k}"><b>${k}.</b> ${esc(v)}</button>`).join('')+'</div>';document.querySelectorAll('.option').forEach(b=>b.onclick=()=>checkChoice(b.dataset.key,b))}
function renderTranslation(q){let i=0;const rendered=esc(q.prompt).replace(/_{3,}/g,()=>`<input class="inline-input" data-i="${i++}" aria-label="第 ${i} 格答案">`);$('#question').innerHTML=`<div class="translation">${rendered}</div>`;setTimeout(()=>document.querySelector('.inline-input')?.focus(),0)}
function recordWrong(q,value){if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(value);$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
function checkChoice(key,button){const q=flat[index];attempted.add(q.id);if(key!==q.answer){recordWrong(q,key);button.classList.add('wrong');$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 不正確，請再試一次。';return}if(!wrong.has(q.id))firstTry.add(q.id);document.querySelectorAll('.option').forEach(b=>b.disabled=true);button.classList.add('correct');pass(q)}
function checkTranslation(){const q=flat[index],values=[...document.querySelectorAll('.inline-input')].map(x=>x.value);attempted.add(q.id);const ok=values.length===q.answers.length&&values.every((v,i)=>norm(v)===norm(q.answers[i]));if(!ok){recordWrong(q,values.join(' / '));$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 尚有空格不正確，請修正後再檢查。';return}if(!wrong.has(q.id))firstTry.add(q.id);document.querySelectorAll('.inline-input').forEach(x=>x.disabled=true);pass(q)}
function pass(q){$('#feedback').className='feedback ok';$('#feedback').textContent='✅ 正確！';$('#reference').classList.remove('hidden');$('#reference').textContent='完整句：'+q.sentence;$('#check').classList.add('hidden');$('#next').classList.remove('hidden');$('#voiceBox').classList.remove('hidden');$('#voiceTarget').textContent=q.sentence;$('#voiceResult').className='voice-result';$('#voiceResult').textContent='尚未進行朗讀評分。';speak(q.sentence)}
function similarity(a,b){a=norm(a).replace(/[^a-z0-9' ]/g,'').split(' ').filter(Boolean);b=norm(b).replace(/[^a-z0-9' ]/g,'').split(' ').filter(Boolean);const used=new Set;let hit=0;for(const w of a){const j=b.findIndex((x,i)=>x===w&&!used.has(i));if(j>=0){hit++;used.add(j)}}return Math.round(100*hit/Math.max(a.length,b.length,1))}
function startMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('#voiceResult').textContent='此瀏覽器不支援語音辨識，建議使用 Chrome。';return}recognition=new SR;recognition.lang='en-US';recognition.interimResults=false;$('#voiceResult').textContent='正在聆聽，請朗讀完整句子…';recognition.onresult=e=>{const said=e.results[0][0].transcript,target=flat[index].sentence,score=similarity(target,said);$('#voiceResult').className='voice-result '+(score>=80?'good':'retry');$('#voiceResult').textContent=`辨識：${said}\n正確率：${score}%`};recognition.onerror=e=>$('#voiceResult').textContent='語音辨識未完成：'+e.error;recognition.start()}
function finish(){try{recognition?.abort()}catch(e){}speechSynthesis?.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');const rows=[...wrong.values()];$('#summary').innerHTML=`<div class="stat">實際作答<b>${attempted.size}</b></div><div class="stat">一次答對<b>${firstTry.size}</b></div><div class="stat">曾答錯<b>${rows.length}</b></div>`;$('#wrongList').innerHTML=rows.length?rows.map((r,i)=>`<div class="wrong-card"><b>${i+1}. 第 ${esc(r.q.id)} 題</b><p>${esc(r.q.prompt||`第 ${r.q.blank} 格`)}</p><p>作答：${r.attempts.map(esc).join('；')}</p><p>答案：${esc(r.q.answer||r.q.answers.join(' / '))}</p></div>`).join(''):(attempted.size?'<div class="feedback ok">🎉 本輪全部一次答對！</div>':'<p class="muted">本輪尚未作答，因此不登錄成績。</p>');$('#download').classList.toggle('hidden',!rows.length);if(attempted.size)document.dispatchEvent(new CustomEvent('quiz-result-ready',{detail:{total:attempted.size,correct:firstTry.size,wrong:rows.length,mistakeQuestionNumbers:rows.map(r=>r.q.id).join(', ')}}))}
$('#check').onclick=checkTranslation;$('#next').onclick=()=>{if(++index>=flat.length)finish();else show()};$('#finish').onclick=finish;$('#restart').onclick=()=>location.reload();$('#speak').onclick=()=>speak(flat[index].sentence);$('#mic').onclick=startMic;$('#download').onclick=async()=>{const rows=[...wrong.values()];if(!rows.length)return;try{if(!window.docx)await new Promise((ok,fail)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js';s.onload=ok;s.onerror=fail;document.head.append(s)});const{Document,Packer,Paragraph,HeadingLevel}=window.docx,children=[new Paragraph({text:`三民普高 ${QUIZ.unit} ${QUIZ.title} 錯題紀錄`,heading:HeadingLevel.TITLE})];rows.forEach(r=>children.push(new Paragraph({text:`第 ${r.q.id} 題`,heading:HeadingLevel.HEADING_2}),new Paragraph(r.q.prompt||r.q.passage||''),new Paragraph('作答：'+r.attempts.join('；')),new Paragraph('答案：'+(r.q.answer||r.q.answers.join(' / ')))));const blob=await Packer.toBlob(new Document({sections:[{children}]})),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Sanmin_${QUIZ.unit}_${QUIZ.kind}_錯題.docx`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){alert('目前無法產生 DOCX，請稍後再試。')}};flat=flatten();show();
</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
