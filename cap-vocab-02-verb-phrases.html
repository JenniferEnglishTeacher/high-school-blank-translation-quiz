N + for + N", "p": "(v.phr.)", "e": "give money to get a service or thing", "z": "付錢購買（服務、物品）", "s": "My mom _____ 500 dollars _____ the cleaning service last week, and now our whole house looks bright and clean.", "c": "我媽媽上週【付】五百元【購買】打掃服務，現在我們整個家看起來又亮又乾淨。", "f": "My mom paid 500 dollars for the cleaning service last week, and now our whole house looks bright and clean."}, {"g": "", "t": "pay a heavy price", "p": "(v.phr.)", "e": "to suffer a lot because of something", "z": "付出沉重的代價", "s": "Ben played video games all night before the big test, and he _____ _____ _____ _____ when he got the lowest score in class.", "c": "班在大考前整晚打電動，結果考了全班最低分，【付出了沉重的代價】。", "f": "Ben played video games all night before the big test, and he paid a heavy price when he got the lowest score in class."}, {"g": "", "t": "pay a visit to + 人", "p": "(v.phr.)", "e": "go to see someone", "z": "造訪、拜訪", "s": "During the Chinese New Year holiday, we _____ _____ _____ _____ my grandparents in Tainan and ate a big dinner.", "c": "農曆新年假期時，我們去台南【拜訪】祖父母，還吃了一頓大餐。", "f": "During the Chinese New Year holiday, we paid a visit to my grandparents in Tainan and ate a big dinner."}, {"g": "", "t": "pay attention to + N/V-ing", "p": "(v.phr.)", "e": "to watch or listen carefully", "z": "注意", "s": "If you don't _____ _____ _____ the traffic lights when you cross the road, you might get hurt by a fast car.", "c": "如果你過馬路時不【注意】紅綠燈，你可能會被快速行駛的車子撞傷。", "f": "If you don't pay attention to the traffic lights when you cross the road, you might get hurt by a fast car."}, {"g": "", "t": "pay bills", "p": "(v.phr.)", "e": "to give money for water, electricity, and so on", "z": "付帳單", "s": "At the end of every month, my mother goes to the convenience store to _____ _____ for water, electricity, and our phones.", "c": "每個月月底，我媽媽都會去便利商店【付帳單】，包括水費、電費和手機費。", "f": "At the end of every month, my mother goes to the convenience store to pay bills for water, electricity, and our phones."}, {"g": "", "t": "pay off", "p": "(v.phr.)", "e": "to bring good results after hard work", "z": "努力有了回報", "s": "Mei studied English every night for the test, and all her hard work _____ _____ when she got a perfect score.", "c": "美美每天晚上都為考試讀英文，當她考到滿分時，她所有的努力都【有了回報】。", "f": "Mei studied English every night for the test, and all her hard work paid off when she got a perfect score."}, {"g": "", "t": "pay off + N", "p": "(v.phr.)", "e": "to pay back all the money you owe", "z": "清償（債務）", "s": "My uncle worked two jobs for five years, and last month he finally _____ _____ the loan for his car.", "c": "我叔叔做兩份工作做了五年，上個月他終於【還清】了車貸。", "f": "My uncle worked two jobs for five years, and last month he finally paid off the loan for his car."}, {"g": "", "t": "pay the bill", "p": "(v.phr.)", "e": "give money for what you ate or bought", "z": "付帳", "s": "After the family dinner at the night market, Dad wanted to _____ _____ _____, but Grandpa had already done it quietly.", "c": "在夜市吃完家庭晚餐後，爸爸想要【付帳】，但爺爺已經悄悄處理好了。", "f": "After the family dinner at the night market, Dad wanted to pay the bill, but Grandpa had already done it quietly."}, {"g": "", "t": "pick fruit", "p": "(v.phr.)", "e": "take fruit off a tree or plant", "z": "摘水果", "s": "On Sunday our class visited a farm in Taichung, and we _____ _____ like strawberries and oranges with the farmers.", "c": "星期天我們班去台中的一個農場，跟農夫們一起【摘水果】，像是草莓和橘子。", "f": "On Sunday our class visited a farm in Taichung, and we picked fruit like strawberries and oranges with the farmers."}, {"g": "", "t": "pick on + 人", "p": "(v.phr.)", "e": "to keep being unkind to someone", "z": "找……的麻煩、挑……的毛病", "s": "Some older boys always _____ _____ Kevin because he is small, so the teacher talked to them after class.", "c": "有些年紀比較大的男生總是【找凱文麻煩】，因為他個子小，所以老師下課後跟他們談了談。", "f": "Some older boys always pick on Kevin because he is small, so the teacher talked to them after class."}, {"g": "", "t": "pick up + 人", "p": "(v.phr.)", "e": "to go and get someone in a car", "z": "（開車）接送（某人）", "s": "It was raining hard after school, so Dad drove to the MRT station to _____ me _____ at five o'clock.", "c": "放學後雨下得很大，所以爸爸五點開車到捷運站【接】我。", "f": "It was raining hard after school, so Dad drove to the MRT station to pick me up at five o'clock."}, {"g": "", "t": "pick up + N", "p": "(v.phr.)", "e": "to lift something from the ground", "z": "拾起、撿起", "s": "When Grandma dropped her glasses on the bus floor, a kind student quickly _____ them _____ and gave them back to her.", "c": "奶奶的眼鏡掉在公車地板上時，一位好心的學生很快地把眼鏡【撿起來】還給她。", "f": "When Grandma dropped her glasses on the bus floor, a kind student quickly picked them up and gave them back to her."}, {"g": "", "t": "pick up + N", "p": "(v.phr.)", "e": "to learn something without really trying", "z": "（不經意）學會", "s": "Lisa lived in Japan with her family for a year, so she _____ _____ a lot of Japanese from her neighbors.", "c": "麗莎和家人在日本住了一年，所以她從鄰居那裡【學會】了很多日語。", "f": "Lisa lived in Japan with her family for a year, so she picked up a lot of Japanese from her neighbors."}, {"g": "", "t": "pick up a skill", "p": "(v.phr.)", "e": "learn something new, often without classes", "z": "學會一項技能", "s": "Living in Japan for one year helped my cousin _____ _____ _____ _____ that is very useful: she can now speak Japanese well.", "c": "在日本住了一年，讓我表姊【學會了一項技能】，而且非常實用：她現在日語說得很好。", "f": "Living in Japan for one year helped my cousin pick up a skill that is very useful: she can now speak Japanese well."}, {"g": "", "t": "pick up the room", "p": "(v.phr.)", "e": "make a room clean and neat", "z": "整理房間", "s": "Your friends are coming over in an hour, so please _____ _____ _____ _____ and put your toys back in the box.", "c": "你的朋友一小時後就來了，所以請【整理房間】，把玩具放回箱子裡。", "f": "Your friends are coming over in an hour, so please pick up the room and put your toys back in the box."}, {"g": "", "t": "place an order", "p": "(v.phr.)", "e": "ask a shop to get or make something for you", "z": "下訂單", "s": "Mom _____ _____ _____ for a big birthday cake at the bakery, and she will pick it up on Saturday morning.", "c": "媽媽在麵包店【下訂單】訂了一個大生日蛋糕，星期六早上會去拿。", "f": "Mom placed an order for a big birthday cake at the bakery, and she will pick it up on Saturday morning."}, {"g": "", "t": "play a game", "p": "(v.phr.)", "e": "to take part in a game for fun", "z": "玩遊戲", "s": "On rainy weekends, my little brother and I like to _____ _____ _____ together on the living room floor because we can't go outside.", "c": "下雨的週末，我和弟弟喜歡在客廳地板上一起【玩遊戲】，因為我們不能出門。", "f": "On rainy weekends, my little brother and I like to play a game together on the living room floor because we can't go outside."}, {"g": "", "t": "play a part in + N/V-ing", "p": "(v.phr.)", "e": "to help do something with others", "z": "參與；起某種作用", "s": "Everyone in our class _____ _____ _____ _____ cleaning the park last Saturday, so it looked neat and beautiful afterward.", "c": "我們班每個人上週六都【參與】打掃公園，所以之後公園看起來又整齊又漂亮。", "f": "Everyone in our class played a part in cleaning the park last Saturday, so it looked neat and beautiful afterward."}, {"g": "", "t": "play a part/role", "p": "(v.phr.)", "e": "to be one person in a play or event", "z": "扮演一個角色", "s": "Grace _____ _____ small _____ in the school play, but she practiced her lines every day and did a great job.", "c": "葛瑞絲在學校話劇中只【扮演了一個小角色】，但她每天練習台詞，表現得很棒。", "f": "Grace played a small part in the school play, but she practiced her lines every day and did a great job."}, {"g": "", "t": "play a role (in + N/V-ing)", "p": "(v.phr.)", "e": "to be an important part of something", "z": "扮演……的角色", "s": "Parents _____ _____ key _____ in their children's learning, so they should read with them and talk about school every day.", "c": "父母在孩子的學習中【扮演關鍵的角色】，所以他們應該每天陪孩子閱讀、聊聊學校的事。", "f": "Parents play a key role in their children's learning, so they should read with them and talk about school every day."}, {"g": "", "t": "play a trick on + 人", "p": "(v.phr.)", "e": "to do something funny to fool someone", "z": "對…惡作劇", "s": "On April Fools' Day, Jason _____ _____ _____ _____ his teacher by putting a toy spider on her desk, and the whole class laughed.", "c": "在愚人節那天，Jason 在老師桌上放了一隻玩具蜘蛛來【捉弄】她，全班都笑了。", "f": "On April Fools' Day, Jason played a trick on his teacher by putting a toy spider on her desk, and the whole class laughed."}, {"g": "", "t": "play along", "p": "(v.phr.)", "e": "pretend to agree with a game or plan", "z": "假裝配合；順著演", "s": "Dad knew the kids were planning a surprise party for him, but he decided to _____ _____ and acted surprised.", "c": "爸爸知道孩子們在為他籌劃驚喜派對，但他決定【假裝配合】，還裝出驚訝的樣子。", "f": "Dad knew the kids were planning a surprise party for him, but he decided to play along and acted surprised."}, {"g": "", "t": "play an important role in + N/V-ing", "p": "(v.phr.)", "e": "to be a big part of something", "z": "扮演重要角色", "s": "Teachers _____ _____ _____ _____ _____ helping young students learn to read, but parents can help a lot at home too.", "c": "老師在幫助小學生學習閱讀上【扮演重要角色】，但父母在家也能幫上很多忙。", "f": "Teachers play an important role in helping young students learn to read, but parents can help a lot at home too."}, {"g": "", "t": "play the + 樂器", "p": "(v.phr.)", "e": "to make music with an instrument", "z": "彈奏（某種樂器）", "s": "Amy has taken lessons since she was six, so she can _____ _____ piano very well and often performs at school concerts.", "c": "Amy 從六歲起就開始上課，所以她鋼琴【彈奏】得很好，而且常在學校音樂會表演。", "f": "Amy has taken lessons since she was six, so she can play the piano very well and often performs at school concerts."}, {"g": "", "t": "play the music", "p": "(v.phr.)", "e": "to turn on music so people hear it", "z": "播放音樂", "s": "Before the party started, Kevin _____ _____ _____ on his speaker so loudly that the neighbors could hear it.", "c": "派對開始前，Kevin 用他的喇叭【播放音樂】，大聲到鄰居都聽得到。", "f": "Before the party started, Kevin played the music on his speaker so loudly that the neighbors could hear it."}, {"g": "", "t": "play with + 人", "p": "(v.phr.)", "e": "to have fun together with someone", "z": "和…一起玩", "s": "After school, Leo often goes to the park to _____ n an ad _____ _____ on the screen, so I closed it right away.", "c": "我正在用電腦寫作業時，螢幕上【突然跳出】一則廣告，所以我馬上把它關掉。", "f": "I was doing my homework on the computer when an ad popped up on the screen, so I closed it right away."}, {"g": "", "t": "pray for + 人", "p": "(v.phr.)", "e": "to ask God to help someone", "z": "為…祈禱", "s": "When Grandma was sick in the hospital, our whole family _____ _____ her every night, and we were so happy when she got better.", "c": "奶奶生病住院時，我們全家每晚都【為】她【祈禱】，她好轉時我們非常開心。", "f": "When Grandma was sick in the hospital, our whole family prayed for her every night, and we were so happy when she got better."}, {"g": "", "t": "prefer + N/V-ing + to + N/V-ing", "p": "(v.phr.)", "e": "like A more than B", "z": "喜歡…勝過…", "s": "Although many of my friends love summer, I _____ winter _____ summer because I don't like hot weather.", "c": "雖然我很多朋友喜歡夏天，但我【喜歡冬天勝過夏天】，因為我不喜歡炎熱的天氣。", "f": "Although many of my friends love summer, I prefer winter to summer because I don't like hot weather."}, {"g": "", "t": "prepare for + N", "p": "(v.phr.)", "e": "to get ready for something", "z": "為……做準備", "s": "Ming-wei stayed home all weekend to _____ _____ the math test, because he got a low score last time.", "c": "明偉整個週末都待在家【準備】數學考試，因為他上次考得很差。", "f": "Ming-wei stayed home all weekend to prepare for the math test, because he got a low score last time."}, {"g": "", "t": "prevent + N + from + V-ing", "p": "(v.phr.)", "e": "to stop someone or something from doing something", "z": "阻止……、避免", "s": "The heavy rain _____ us _____ going to the beach on Saturday, so we watched movies at home instead.", "c": "大雨【使我們無法】在星期六去海邊，所以我們改在家裡看電影。", "f": "The heavy rain prevented us from going to the beach on Saturday, so we watched movies at home instead."}, {"g": "", "t": "protect + 人 + from + N/V-ing", "p": "(v.phr.)", "e": "to keep someone safe from something bad", "z": "保護（使免於）", "s": "Wearing sunglasses and a hat can _____ you _____ the strong sun when you go hiking in the summer.", "c": "夏天 , "e": "remove something from a shelf", "z": "從架子上拿走（某物）", "s": "The store clerk had to _____ the old cookies _____ _____ _____ _____ because they were past their date.", "c": "店員必須把舊餅乾【從架子上拿走】，因為它們已經過期了。", "f": "The store clerk had to take the old cookies away from the shelf because they were past their date."}, {"g": "", "t": "take + 物 + down", "p": "(v.phr.)", "e": "remove something from a wall or high place", "z": "拿下；拆除", "s": "After the Christmas party ended, the students helped their teacher _____ the colorful lights _____ from the classroom walls.", "c": "聖誕派對結束後，學生們幫老師把教室牆上的彩色燈飾【拿下來】。", "f": "After the Christmas party ended, the students helped their teacher take the colorful lights down from the classroom walls."}, {"g": "", "t": "take + 物 + out", "p": "(v.phr.)", "e": "carry something outside or remove it", "z": "取出、拿出去", "s": "After dinner, Mom asked me to _____ the trash _____ because the garbage truck would come at eight.", "c": "晚餐後，媽媽叫我【把垃圾拿出去】，因為垃圾車八點會來。", "f": "After dinner, Mom asked me to take the trash out because the garbage truck would come at eight."}, {"g": "", "t": "take + 交通工具 + to + 地方", "p": "(v.phr.)", "e": "ride a bus, train, etc. to a place", "z": "搭乘某種交通工具前往某地", "s": "Since it was raining hard, Tina _____ the MRT _____ the zoo instead of riding her bike there.", "c": "因為雨下得很大，緹娜【搭捷運到】動物園，而不是騎腳踏車去。", "f": "Since it was raining hard, Tina took the MRT to the zoo instead of riding her bike there."}, {"g": "", "t": "take + N + for example", "p": "(v.phr.)", "e": "use something as an example", "z": "以……為例", "s": "Our teacher said many animals sleep during the winter, and she _____ bears _____ _____ when she explained it to us.", "c": "我們老師說很多動物會在冬天睡覺，她解釋給我們聽的時候【以熊為例】。", "f": "Our teacher said many animals sleep during the winter, and she took bears for example when she explained it to us."}, {"g": "", "t": "take + N + for granted", "p": "(v.phr.)", "e": "to not notice or value something enough", "z": "視……為理所當然", "s": "Many children _____ their parents' hard work _____ _____, but they should say thank you more often at home.", "c": "很多孩子把父母的辛苦【視為理所當然】，但他們在家應該更常說謝謝。", "f": "Many children take their parents' hard work for granted, but they should say thank you more often at home."}, {"g": "", "t": "take + N + off", "p": "(v.phr.)", "e": "to have time away from work", "z": "休假", "s": "My mom is going to _____ two days _____ next month, so our family can visit Grandma in Hualien together.", "c": "我媽媽下個月要【休假】兩天，這樣我們全家就可以一起去花蓮看奶奶。", "f": "My mom is going to take two days off next month, so our family can visit Grandma in Hualien together."}, {"g": "", "t": "take + N + personally", "p": "(v.phr.)", "e": "feel hurt because you think it is about you", "z": "視為針對自己，往心裡去", "s": "The coach shouts at every player during practice, so don't _____ it _____ because he just wants us to win.", "c": "教練練習時會對每個球員大吼，所以別【往心裡去】，他只是想要我們贏。", "f": "The coach shouts at every player during practice, so don't take it personally because he just wants us to win."}, {"g": "", "t": "take + N + seriously", "p": "(v.phr.)", "e": "to think something is important", "z": "認真看待", "s": "If you don't _____ the teacher's warning _____, you might fail the English test and need to try it again.", "c": "如果你不【認真看待】老師的警告，你可能會英文考試不及格，還得再考一次。", "f": "If you don't take the teacher's warning seriously, you might fail the English test and need to try it again."}, {"g": "", "t": "take a bath", "p": "(v.phr.)", "e": "wash your body sitting in water", "z": "洗澡、泡澡", "s": "After playing soccer in the rain, Eric was very dirty, so he _____ _____ _____ as soon as he got home.", "c": "在雨中踢完足球後，艾瑞克全身很髒，所以他一回到家就【泡澡】。", "f": "After playing soccer in the rain, Eric was very dirty, so he took a bath as soon as he got home."}, {"g": "", "t": "take a bow", "p": "(v.phr.)", "e": "bend your body to thank people", "z": "鞠躬致意", "s": "When the play ended, all the actors walked to the front of the stage to _____ _____ _____, and the audience clapped loudly.", "c": "戲結束時，所有演員走到舞台前方【鞠躬致意】，觀眾則大聲鼓掌。", "f": "When the play ended, all the actors walked to the front of the stage to take a bow, and the audience clapped loudly."}, {"g": "", "t": "take a break", "p": "(v.phr.)", "e": "stop working or studying for a short time", "z": "休息；暫停", "s": "We have been studying for two hours and my eyes feel tired, so let's _____ _____ _____ and drink some juice.", "c": "我們已經讀了兩個小時的書，我的眼睛好累，所以我們【休息一下】，喝點果汁吧。", "f": "We have been studying for two hours and my eyes feel tired, so let's take a break and drink some juice."}, {"g": "", "t": "take a chance", "p": "(v.phr.)", "e": "try something even though it may not work", "z": "冒險一試", "s": "Joe wasn't sure he could win the singing contest, but he decided to _____ _____ _____ and sign up anyway.", "c": "Joe不確定自己能不能贏得歌唱比賽，但他還是決定【冒險一試】去報名。", "f": "Joe wasn't sure he could win the singing contest, but he decided to take a chance and sign up anyway."}, {"g": "", "t": "take a course", "p": "(v.phr.)", "e": "study a class", "z": "修課", "s": "Because Ella wants to be a cook in the future, she is _____ _____ cooking _____ at the community center this summer.", "c": "因為艾拉將來想當廚師，所以她今年夏天在社區中心【修一門烹飪課】。", "f": "Because Ella wants to be a cook in the future, she is taking a cooking course at the community center this summer."}, {"g": "", "t": "take a guess", "p": "(v.phr.)", "e": "try to answer when you are not sure", "z": "猜一下", "s": "I don't know how old our new English teacher is, but if you want me to _____ _____ _____, I'd say thirty.", "c": "我不知道我們的新英文老師幾歲，但如果你要我【猜一下】，我會說三十歲。", "f": "I don't know how old our new English teacher is, but if you want me to take a guess, I'd say thirty."}, {"g": "", "t": "take a holiday", "p": "(v.phr.)", "e": "stop working for a while to rest", "z": "休假", "s": "My mom has worked very hard all year, so she will _____ _____ _____ next month and relax at the beach.", "c": "我媽媽整年都很努力工作，所以她下個月會【休假】，到海邊放鬆。", "f": "My mom has worked very hard all year, so she will take a holiday next month and ne to make a photo", "z": "照相", "s": "When we reached the top of Yangmingshan, the view was so beautiful that everyone wanted to _____ _____ _____ of it.", "c": "我們到達陽明山山頂時，景色美到每個人都想【拍張照】。", "f": "When we reached the top of Yangmingshan, the view was so beautiful that everyone wanted to take a picture of it."}, {"g": "", "t": "take a pop at sb", "p": "(v.phr.)", "e": "to criticize someone in public", "z": "當眾批評某人", "s": "The famous singer _____ _____ _____ _____ a reporter during the TV interview, and the video was shared online by thousands of people.", "c": "那位知名歌手在電視訪問中【當眾批評】一位記者，影片在網路上被數千人分享。", "f": "The famous singer took a pop at a reporter during the TV interview, and the video was shared online by thousands of people."}, {"g": "", "t": "take a rest", "p": "(v.phr.)", "e": "to stop doing something and relax", "z": "休息", "s": "After walking around the zoo for three hours, we were so tired that we sat down to _____ _____ _____ under a big tree.", "c": "在動物園走了三個小時後，我們累到在一棵大樹下坐下來【休息】。", "f": "After walking around the zoo for three hours, we were so tired that we sat down to take a rest under a big tree."}, {"g": "", "t": "take a shortcut", "p": "(v.phr.)", "e": "go a shorter, faster way", "z": "抄近路", "s": "We were late for the movie, so Dad decided to _____ _____ _____ through the night market.", "c": "我們看電影要遲到了，所以爸爸決定穿過夜市【抄近路】。", "f": "We were late for the movie, so Dad decided to take a shortcut through the night market."}, {"g": "", "t": "take a shower", "p": "(v.phr.)", "e": "wash your body under running water", "z": "淋浴", "s": "It is very hot in Taipei in summer, so I _____ _____ _____ every night before I go to bed.", "c": "台北夏天很熱，所以我每晚睡前都會【淋浴】。", "f": "It is very hot in Taipei in summer, so I take a shower every night before I go to bed."}, {"g": "", "t": "take a trip", "p": "(v.phr.)", "e": "go somewhere to travel", "z": "去旅行", "s": "When the winter vacation comes, my family will _____ _____ _____ to Hualien and visit Taroko National Park.", "c": "寒假到來時，我 ut what subjects you enjoy and what job you want later."}, {"g": "", "t": "think of + N", "p": "(v.phr.)", "e": "to come up with an idea", "z": "想出", "s": "Our group needed a name for the science project, and Brian _____ _____ a funny one that everyone loved.", "c": "我們這組需要為科學專題取個名字，Brian【想出】了一個大家都很喜歡的有趣名字。", "f": "Our group needed a name for the science project, and Brian thought of a funny one that everyone loved."}, {"g": "", "t": "think of + N/V-ing", "p": "(v.phr.)", "e": "to consider doing something", "z": "考慮", "s": "My cousin is _____ _____ moving to Kaohsiung after graduation because the rent there is cheaper than in Taipei.", "c": "我表哥正在【考慮】畢業後搬到高雄，因為那裡的房租比台北便宜。", "f": "My cousin is thinking of moving to Kaohsiung after graduation because the rent there is cheaper than in Taipei."}, {"g": "", "t": "think through + N", "p": "(v.phr.)", "e": "to think about something carefully before deciding", "z": "仔細想過", "s": "Before you decide to join three school clubs this year, you should _____ _____ the idea because you also need time to study.", "c": "在你決定今年參加三個學校社團之前，你應該【仔細想過】這個主意，因為你也需要時間讀書。", "f": "Before you decide to join three school clubs this year, you should think through the idea because you also need time to study."}, {"g": "", "t": "think twice", "p": "(v.phr.)", "e": "to think carefully before deciding", "z": "再三思考", "s": "The new shoes were very expensive, so Vivian decided to _____ _____ before spending all her birthday money on them.", "c": "那雙新鞋很貴，所以Vivian決定在把所有生日禮金花在上面之前【再三思考】。", "f": "The new shoes were very expensive, so Vivian decided to think twice before spending all her birthday money on them."}, {"g": "", "t": "throw away + N", "p": "(v.phr.)", "e": "to put something in the trash", "z": "丟棄", "s": "Please don't _____ _____ the plastic bottles, because we can recycle them and keep our school clean.", "c": "請不要【丟掉】塑膠瓶，因為我們可以回收它們並保持校園整潔。", "f": "Please don't throw away the plastic bottles, because we can recycle them and keep our school clean."}, {"g": "", "t": "throw out + N", "p": "(v.phr.)", "e": "to get rid of something you don't want", "z": "丟出去", "s": "The old sofa was broken and dirty, so my dad and I _____ it _____ when we cleaned the living room on Sunday.", "c": "那張舊沙發又壞又髒，所以星期天打掃客廳時，我和爸爸把它【丟出去】了。", "f": "The old sofa was broken and dirty, so my dad and I threw it out when we cleaned the living room on Sunday."}, {"g": "", "t": "tie up + N", "p": "(v.phr.)", "e": "to fasten something with rope or string", "z": "繫住、綁住", "s": "Before the typhoon came, the fishermen _____ _____ their boats at the harbor so the strong wind wouldn't carry them away.", "c": "颱風來之前，漁夫們把船【綁好】在港口，這樣強風才不會把船吹走。", "f": "Before the typhoon came, the fishermen tied up their boats at the harbor so the strong wind wouldn't carry them away."}, {"g": "", "t": "time goes by", "p": "(v.phr.)", "e": "time moves on", "z": "時光流逝", "s": "_____ _____ _____ so fast when you are having fun with friends, and summer vacation always seems too short.", "c": "和朋友玩得開心時，【時光流逝】得特別快，暑假總是感覺太短。", "f": "Time goes by so fast when you are having fun with friends, and summer vacation always seems too short."}, {"g": "", "t": "touch the ground", "p": "(v.phr.)", "e": "to come down onto the ground; to land", "z": "碰到地面；著陸", "s": "Everyone on the plane clapped their hands happily when the wheels finally _____ _____ _____ after the long flight through the storm from Tokyo.", "c": "飛機從東京穿過暴風雨，經過漫長的飛行，當輪子終於【碰到地面】時，機上每個人都開心地拍手。", "f": "Everyone on the plane clapped their hands happily when the wheels finally touched the ground after the long flight through the storm from Tokyo."}, {"g": "", "t": "treat + 人 + gently", "p": "(v.phr.)", "e": "be kind and soft to someone", "z": "親切地對待某人", "s": "The new student was nervous on her first day, but everyone in our class _____ her _____ and helped her find the library.", "c": "新同學第一天很緊張，但我們班上每個人都【親切地對待】她，還幫她找到圖書館。", "f": "The new student was nervous on her first day, but everyone in our class treated her gently and helped her find the library."}, {"g": "", "t": "treat + N + as + N", "p": "(v.phr.)", "e": "act toward someone or something like", "z": "把……當作……看待", "s": "Grandma loves our cat very much, and she _____ it _____ a member of the family, so it even has its own chair at dinner.", "c": "奶奶非常愛我們的貓，她【把牠當作家中的一份子看待】，所以牠吃晚餐時甚至有自己的椅子。", "f": "Grandma loves our cat very much, and she treats it as a member of the family, so it even has its own chair at dinner."}, {"g": "", "t": "try it one's way", "p": "(v.phr.)", "e": "do something the way another person suggests", "z": "照（某人）的方法試試", "s": "A: I think we should fold the paper this way first. B: Okay, let's _____ _____ your _____, and if it fails, we can try mine.", "c": "A：我覺得我們應該先這樣摺紙。B：好，我們先【照你的方法試試】，如果不行再試我的。", "f": "A: I think we should fold the paper this way first. B: Okay, let's try it your way, and if it fails, we can try mine."}, {"g": "", "t": "try on + N", "p": "(v.phr.)", "e": "to put on clothes to see if they fit", "z": "試穿", "s": "Before you buy those jeans, you should _____ them _____ in the fitting room because the sizes in this store are small.", "c": "在買那條牛仔褲之前，你應該先在試衣間【試穿】，因為這家店的尺寸偏小。", "f": "Before you buy those jeans, you should try them on in the fitting room because the sizes in this store are small."}, {"g": "", "t": "try out + N", "p": "(v.phr.)", "e": "use something to see if it works well", "z": "試用", "s": "Before buying a camera, Dad asked the clerk if he could _____ _____ the newest model and take a few photos in the store.", "c": "買相機之前，爸爸問店員能不能【試用】最新款，並在店裡拍幾張照片。", "f": "Before buying a camera, Dad asked the clerk if he could try out the newest model and take a few photos in the store."}, {"g": "", "t": "try out for + N", "p": "(v.phr.)", "e": "try to be chosen for a team or play", "z": "參加選拔", "s": "Kai-wen practices shooting every day after school because he wants to _____ _____ _____ the school basketball team next month.", "c": "凱文每天放學後練習投籃，因為他下個月想【參加】學校籃球隊的選拔。", "f": "Kai-wen practices shooting every day after school because he wants to try out for the school basketball team next month."}, {"g": "", "t": "turn + 顏色", "p": "(v.phr.)", "e": "to become a certain color", "z": "變成某種顏色", "s": "In autumn, the leaves on the trees in the park _____ red and yellow, so many people come to take pictures there.", "c": "秋天時，公園裡樹上的葉子會【變成】紅色和黃色，所以很多人來這裡拍照。", "f": "In autumn, the leaves on the trees in the park turn red and yellow, so many people come to take pictures there."}, {"g": "", "t": "turn + 年紀", "p": "(v.phr.)", "e": "to become a certain age", "z": "滿……歲", "s": "My little sister will _____ ten next Sunday, so we are planning a surprise party with a big chocolate cake for her.", "c": "我妹妹下星期天就要【滿十歲】了，所以我們正在為她計畫一場有大巧克力蛋糕的驚喜派對。", "f": "My little sister will turn ten next Sunday, so we are planning a surprise party with a big chocolate cake for her."}, {"g": "", "t": "turn (+ N) into + N", "p": "(v.phr.)", "e": "to change something into something different", "z": "（將……）轉變為……", "s": "The art teacher showed us how to _____ old newspapers _____ beautiful paper bags, and we sold them at the school fair.", "c": "美術老師教我們如何把舊報紙【變成】漂亮的紙袋，我們還在園遊會上把它們賣掉了。", "f": "The art teacher showed us how to turn old newspapers into beautiful paper bags, and we sold them at the school fair."}, {"g": "", "t": "turn around", "p": "(v.phr.)", "e": "to move your body to face the other way", "z": "轉身", "s": "When someone called my name in the crowded MRT station, I _____ _____ quickly, but I could not see anyone I knew.", "c": "在擁擠的捷運站裡有人叫我的名字時，我很快地【轉身】，但沒看到任何認識的人。", "f": "When someone called my name in the crowded MRT station, I turned around quickly, but I could not see anyone I knew."}, {"g": "", "t": "turn back", "p": "(v.phr.)", "e": "to go back the way you came", "z": "折返、往回走", "s": "We were halfway up the mountain when it started to rain heavily, so we decided to _____ _____ and go home.", "c": "我們爬到半山腰時開始下大雨，所以我們決定【折返】回家。", "f": "We were halfway up the mountain when it started to rain heavily, so we decided to turn back and go home."}, {"g": "", "t": "turn down + N", "p": "(v.phr.)", "e": "to say no to an offer", "z": "拒絕", "s": "Ken invited Lisa to his birthday party, but she _____ him _____ because she had to study for the big exam.", "c": "Ken邀請Lisa參加他的生日派對，但她【拒絕】了他，因為她得準備大考。", "f": "Ken invited Lisa to his birthday party, but she turned him down because she had to study for the big exam."}, {"g": "", "t": "turn down + N", "p": "(v.phr.)", "e": "to make sound or heat lower", "z": "調降、關小（音量）", "s": "Could you please _____ _____ the TV a little? The baby is sleeping, and I'm trying to finish my homework.", "c": "可以請你把電視【關小聲】一點嗎？寶寶在睡覺，而且我正努力寫完功課。", "f": "Could you please turn down the TV a little? The baby is sleeping, and I'm trying to finish my homework."}, {"g": "", "t": "turn down the heater", "p": "(v.phr.)", "e": "make the heater less hot", "z": "把暖氣機關小一點", "s": "The living room was too warm and everyone was sweating, so Dad _____ _____ _____ _____ and opened a window.", "c": "客廳太熱，大家都在流汗，所以爸爸【把暖氣機關小一點】並打開窗戶。", "f": "The living room was too warm and everyone was sweating, so Dad turned down the heater and opened a window."}, {"g": "", "t": "turn down the radio", "p": "(v.phr.)", "e": "make the radio quieter", "z": "把收音機關小聲", "s": "Grandma is sleeping in the next room, so could you please _____ _____ _____ _____ a little?", "c": "奶奶在隔壁房間睡覺，所以可以請你【把收音機關小聲】一點嗎？", "f": "Grandma is sleeping in the next room, so could you please turn down the radio a little?"}, {"g": "", "t": "turn down the volume", "p": "(v.phr.)", "e": "make the sound quieter", "z": "把聲量關小一點", "s": "It is already eleven at night, so please _____ _____ _____ _____ on your TV, or the neighbors will be angry.", "c": "已經晚上十一點了，所以請把電視的【聲量關小一點】，否則鄰居會生氣。", "f": "It is already eleven at night, so please turn down the volume on your TV, or the neighbors will be angry."}, {"g": "", "t": "turn in + 人", "p": "(v.phr.)", "e": "to give someone, or yourself, to the police", "z": "（向警方）告發、自首", "s": "After the man stole a bike from the MRT station, he felt so sorry that he _____ himself _____ to the police the next day.", "c": "那名男子從捷運站偷了一輛腳踏車後，覺得非常愧疚，所以隔天就向警方【自首】了。", "f": "After the man stole a bike from the MRT station, he felt so sorry that he turned himself in to the police the next day."}, {"g": "", "t": "turn in", "p": "(v.phr.)", "e": "to go to bed", "z": "上床睡覺", "s": "It's already eleven o'clock and we have to get up early for the trip, so let's _____ _____ now.", "c": "已經十一點了，我們還要早起去旅行，所以現在就【上床睡覺】吧。", "f": "It's already eleven o'clock and we have to get up early for the trip, so let's turn in now."}, {"g": "", "t": "turn in + N", "p": "(v.phr.)", "e": "to give work to a teacher", "z": "繳交、交回", "s": "Remember to _____ _____ your science report before Friday, or Ms. Wang will take five points off your grade.", "c": "記得在星期五前【繳交】你的自然報告，否則王老師會扣你五分。", "f": "Remember to turn in your science report before Friday, or Ms. Wang will take five points off your grade."}, {"g": "", "t": "turn left", "p": "(v.phr.)", "e": "to go to the left side", "z": "向左轉", "s": "When you get to the traffic light near the park, _____ _____ and keep walking, because the library is next to the school.", "c": "當你走到公園附近的紅綠燈時，【向左轉】繼續走，因為圖書館就在學校旁邊。", "f": "When you get to the traffic light near the park, turn left and keep walking, because the library is next to the school."}, {"g": "", "t": "turn off + N", "p": "(v.phr.)", "e": "to stop a machine or light working", "z": "關掉（機械、電器等）", "s": "Please _____ _____ the lights and the air conditioner when you leave the classroom, because we need to save energy.", "c": "離開教室時請【關掉】電燈和冷氣，因為我們需要節約能源。", "f": "Please turn off the lights and the air conditioner when you leave the classroom, because we need to save energy."}, {"g": "", "t": "turn on + N", "p": "(v.phr.)", "e": "to start a machine or light", "z": "打開（電器、開關）", "s": "It was getting dark outside, so Grandpa _____ _____ the lamp and kept reading his newspaper in the living room.", "c": "外面 ，她【求助於】她的導師，導師聽她說並給了她很好的建議。", "f": "When Tina had problems with her classmates, she turned to her homeroom teacher, who listened and gave her good advice."}, {"g": "", "t": "turn to + 人 + for help", "p": "(v.phr.)", "e": "to ask someone to help you", "z": "向某人求助", "s": "When I cannot understand my math homework, I usually _____ _____ my older brother _____ _____ because he is very good at math.", "c": "當我看不懂數學作業時，我通常會【向】哥哥【求助】，因為他數學很好。", "f": "When I cannot understand my math homework, I usually turn to my older brother for help because he is very good at math."}, {"g": "", "t": "turn to + N", "p": "(v.phr.)", "e": "to open a book at a certain page", "z": "翻到（頁面）", "s": "Please open your English books and _____ _____ page 45, where we will read a story about a brave girl.", "c": "請打開你們的英文課本並【翻到】第45頁，我們要讀一個關於勇敢女孩的故事。", "f": "Please open your English books and turn to page 45, where we will read a story about a brave girl."}, {"g": "", "t": "turn up", "p": "(v.phr.)", "e": "arrive or appear", "z": "出現", "s": "We waited for Sean for an hour at the train station, but he never _____ _____, so we left without him.", "c": "我們在火車站等了尚恩一個小時，但他一直沒【出現】，所以我們就先走了。", "f": "We waited for Sean for an hour at the train station, but he never turned up, so we left without him."}, {"g": "", "t": "turn up + N", "p": "(v.phr.)", "e": "to make sound louder", "z": "開大（聲音）", "s": "This is my favorite song, so could you _____ _____ the radio a bit while we're driving to the beach?", "c": "這是我最愛的歌，我們開車去海邊的路上，你可以把收音機【開大聲】一點嗎？", "f": "This is my favorite song, so could you turn up the radio a bit while we're driving to the beach?"}, {"g": "", "t": "turn up the heater", "p": "(v.phr.)", "e": "make the heater hotter", "z": "把暖氣機開大一點", "s": "It was snowing outside and our hands were cold, so Mom _____ _____ _____ _____ before we started dinner.", "c": "外面在下雪，我們的手很冰，所以媽媽在開始吃晚餐前【把暖氣機開大一點】。", "f": "It was snowing outside and our hands were cold, so Mom turned up the heater before we started dinner."}, {"g": "", "t": "turn up the radio", "p": "(v.phr.)", "e": "make the radio louder", "z": "把收音機開大聲", "s": "My favorite song was playing in the car, so I asked Dad to _____ _____ _____ _____ and we sang together.", "c": "車上正在播我最愛的歌，所以我請爸爸【把收音機開大聲】，我們一起唱歌。", "f": "My favorite song was playing in the car, so I asked Dad to turn up the radio and we sang together."}, {"g": "", "t": "turn up the volume", "p": "(v.phr.)", "e": "make the sound louder", "z": "把聲量開大一點", "s": "The people at the back of the classroom couldn't hear the video, so the teacher _____ _____ _____ _____.", "c": "教室後面的人聽不到影片，所以老師【把聲量開大一點】。", "f": "The people at the back of the classroom couldn't hear the video, so the teacher turned up the volume."}, {"g": "", "t": "use + 物 + to + VR", "p": "(v.phr.)", "e": "do something with the help of a thing", "z": "使用…來做…", "s": "Mom _____ an old toothbrush _____ clean the corners of the bathroom because it can reach small places easily.", "c": "媽媽【用】一支舊牙刷【來】清潔浴室的角落，因為它可以輕易碰到小地方。", "f": "Mom uses an old toothbrush to clean the corners of the bathroom because it can reach small places easily."}, {"g": "", "t": "use the computer", "p": "(v.phr.)", "e": "to work or play on a computer", "z": "用電腦", "s": "My little brother wants to _____ _____ _____ to play games, but he has to finish his homework first or Dad will say no.", "c": "我弟弟想【用電腦】玩遊戲，但他必須先寫完功課，不然爸爸會說不行。", "f": "My little brother wants to use the computer to play games, but he has to finish his homework first or Dad will say no."}, {"g": "", "t": "use up + N", "p": "(v.phr.)", "e": "to finish all of something", "z": "用完、耗盡", "s": "We _____ _____ all the milk at breakfast, so Mom asked me to buy some more at the convenience store after school.", "c": "我們早餐時把牛奶都【用完】了，所以媽媽叫我放學後去便利商店再買一些。", "f": "We used up all the milk at breakfast, so Mom asked me to buy some more at the convenience store after school."}, {"g": "", "t": "used to + VR", "p": "(v.phr.)", "e": "did something often in the past, not now", "z": "過去常常（現 en the light turned green, the old man held his grandson's hand and walked across the street slowly."}, {"g": "", "t": "walk past + N", "p": "(v.phr.)", "e": "to walk by something without stopping", "z": "走過", "s": "Every day on my way to school, I _____ _____ a small bakery, and the smell of fresh bread always makes me hungry.", "c": "每天上學途中，我都會【走過】一家小麵包店，新鮮麵包的香味總是讓我肚子餓。", "f": "Every day on my way to school, I walk past a small bakery, and the smell of fresh bread always makes me hungry."}, {"g": "", "t": "walk up the stairs", "p": "(v.phr.)", "e": "to go to a higher floor on foot", "z": "走上樓梯", "s": "The elevator was broken this morning, so we had to _____ _____ _____ _____ to our classroom on the fifth floor.", "c": "今天早上電梯壞了，所以我們必須【走上樓梯】到五樓的教室。", "f": "The elevator was broken this morning, so we had to walk up the stairs to our classroom on the fifth floor."}, {"g": "", "t": "want to + VR", "p": "(v.phr.)", "e": "wish to do something", "z": "想要（做某事）", "s": "It is very hot today, so I _____ _____ go swimming at the beach with my cousins after lunch.", "c": "今天很熱，所以我午餐後【想要】和表哥表姊去海邊游泳。", "f": "It is very hot today, so I want to go swimming at the beach with my cousins after lunch."}, {"g": "", "t": "wash away + N", "p": "(v.phr.)", "e": "to carry something off with water", "z": "沖走", "s": "The big waves _____ _____ the sand castle that the children built on the beach, but they laughed and started to build another one.", "c": "大浪【沖走】了孩子們在海灘上堆的沙堡，但他們笑著又開始堆另一座。", "f": "The big waves washed away the sand castle that the children built on the beach, but they laughed and started to build another one."}, {"g": "", "t": "watch + N + closely", "p": "(v.phr.)", "e": "look at something very carefully", "z": "密切觀察", "s": "The science teacher asked us to _____ the little plants _____ every day because they grow fast in spring.", "c": "自然老師要我們每天【密切觀察】那些小植物，因為它們在春天長得很快。", "f": "The science teacher asked us to watch the little plants closely every day because they grow fast in spring."}, {"g": "", "t": "watch a game", "p": "(v.phr.)", "e": "to see a sports match", "z": "看比賽", "s": "My dad and I went to the baseball stadium to _____ _____ _____ last Sunday, and we cheered loudly when our team hit a home run.", "c": "上星期天我和爸爸去棒球場【看比賽】，當我們支持的球隊擊出全壘打時，我們大聲歡呼。", "f": "My dad and I went to the baseball stadium to watch a game last Sunday, and we cheered loudly when our team hit a home run."}, {"g": "", "t": "watch a show", "p": "(v.phr.)", "e": "to see a performance", "z": "看表演", "s": "On Saturday night, our family went to Da'an Park to _____ _____ _____ by street performers, and my little brother laughed a lot.", "c": "星期六晚上，我們全家去大安森林公園【看】街頭藝人的【表演】，我弟弟笑得很開心。", "f": "On Saturday night, our family went to Da'an Park to watch a show by street performers, and my little brother laughed a lot."}, {"g": "", "t": "watch out (for + N)", "p": "(v.phr.)", "e": "to be careful of danger", "z": "小心", "s": "_____ _____ when you cross the road near the school, because the cars and scooters drive very fast there.", "c": "在學校附近過馬路時要【小心】，因為那裡的汽車和機車都開得很快。", "f": "Watch out when you cross the road near the school, because the cars and scooters drive very fast there."}, {"g": "", "t": "watch out for + N", "p": "(v.phr.)", "e": "to be careful about something dangerous", "z": "留心；提防", "s": "When you ride your bike to school in the morning, you should _____ _____ _____ cars and scooters because the roads are very busy.", "c": "早上騎腳踏車上學時，你要【留心】汽車和機車，因為路上車很多。", "f": "When you ride your bike to school in the morning, you should watch out for cars and scooters because the roads are very busy."}, {"g": "", "t": "watch/look out", "p": "(v.phr.)", "e": "be careful", "z": "小心", "s": "_____ _____! There is a car coming, so you should wait before you cross the street.", "c": "【小心】！有車子來了，所以你過馬路前應該等一下。", "f": "Watch out! There is a car coming, so you should wait before you cross the street."}, {"g": "", "t": "wave at + 人", "p": "(v.phr.)", "e": "to move your hand to say hello or goodbye", "z": "對……揮手", "s": "When the train started to move, my little cousin _____ _____ us from the window and smiled until we couldn't see her.", "c": "火車開始開動時，我的小表妹從車窗【對我們揮手】，一直笑到我們看不見她為止。", "f": "When the train started to move, my little cousin waved at us from the window and smiled until we couldn't see her."}, {"g": "", "t": "wear out + 人", "p": "(v.phr.)", "e": "to make someone very tired", "z": "使筋疲力盡、累垮", "s": "Taking care of three young kids all day really _____ my aunt _____, so she usually falls asleep before nine.", "c": "整天照顧三個小孩真的讓我阿姨【累垮了】，所以她通常九點前就睡著了。", "f": "Taking care of three young kids all day really wears my aunt out, so she usually falls asleep before nine."}, {"g": "", "t": "wear out + N", "p": "(v.phr.)", "e": "to use something until it is old and broken", "z": "磨損、用壞", "s": "Jack plays basketball every day after school, so he _____ _____ a pair of sneakers every three months.", "c": "Jack每天放學後都打籃球，所以他每三個月就會【磨壞】一雙球鞋。", "f": "Jack plays basketball every day after school, so he wears out a pair of sneakers every three months."}, {"g": "", "t": "win back + N", "p": "(v.phr.)", "e": "to get back something you lost", "z": "贏回、重獲", "s": "After losing the final game, our team practiced hard every day and finally _____ _____ the trophy the next year.", "c": "輸掉決賽後，我們隊每天努力練習，終於在隔年【贏回】了獎盃。", "f": "After losing the final game, our team practiced hard every day and finally won back the trophy the next year."}, {"g": "", "t": "win the bet", "p": "(v.phr.)", "e": "be right when you and a friend guess something", "z": "贏得賭注", "s": "Jason said it would rain on Sunday and it really did, so he _____ _____ _____ and his brother bought him ice cream.", "c": "傑森說星期天會下雨，結果真的下了，所以他【贏得賭注】，他哥哥請他吃冰淇淋。", "f": "Jason said it would rain on Sunday and it really did, so he won the bet and his brother bought him ice cream."}, {"g": "", "t": "wipe out + N", "p": "(v.phr.)", "e": "to destroy something completely", "z": "徹底摧毀、消滅", "s": "The strong typhoon almost _____ _____ the farmer's banana trees, so the price of bananas went up last month.", "c": "那個強烈颱風幾乎【徹底摧毀】了農夫的香蕉樹，所以上個月香蕉的價格上漲了。", "f": "The strong typhoon almost wiped out the farmer's banana trees, so the price of bananas went up last month."}, {"g": "", "t": "work as + N", "p": "(v.phr.)", "e": "have a job as", "z": "以……的身份工作；擔任", "s": "My aunt Mei-ling _____ _____ a nurse at a big hospital in Taipei, and she often comes home late at night.", "c": "我阿姨美玲在台北一家大醫院【擔任】護士，她常常很晚才回家。", "f": "My aunt Mei-ling works as a nurse at a big hospital in Taipei, and she often comes home late at night."}, {"g": "", "t": "work on + N/V-ing", "p": "(v.phr.)", "e": "to spend time doing or making something", "z": "致力於、從事", "s": "Peter and I are _____ _____ a science project about plastic in the ocean, and we have to finish it by Monday.", "c": "Peter和我正在【進行】一個關於海洋塑膠的自然專題，我們必須在星期一前完成。", "f": "Peter and I are working on a science project about plastic in the ocean, and we have to finish it by Monday."}, {"g": "", "t": "work out", "p": "(v.phr.)", "e": "to exercise to make your body strong", "z": "健身、運動", "s": "My uncle _____ _____ at the gym three times a week because he wants to stay healthy and strong.", "c": "我叔叔每週去健身房【健身】三次，因為他想保持健康強壯。", "f": "My uncle works out at the gym three times a week because he wants to stay healthy and strong."}, {"g": "", "t": "work out + N", "p": "(v.phr.)", "e": "to find the answer to a problem", "z": "解決、想出（辦法）", "s": "The math problem was very hard, but after talking with her classmates, Sandy finally _____ _____ the answer.", "c": "這題數學很難，但和同學討論後，Sandy終於【想出】了答案。", "f": "The math problem was very hard, but after talking with her classmates, Sandy finally worked out the answer."}, {"g": "", "t": "worry about + N/V-ing", "p": "(v.phr.)", "e": "feel nervous because something bad may happen", "z": "為…擔心", "s": "Don't _____ _____ the rain this afternoon, because I will bring an extra umbrella when I pick you up.", "c": "別【擔心】今天下午的雨，因為我去接你時會多帶一把傘。", "f": "Don't worry about the rain this afternoon, because I will bring an extra umbrella when I pick you up."}, {"g": "", "t": "would like/love to + VR", "p": "(v.phr.)", "e": "to want to do something (polite)", "z": "想要做某事", "s": "I _____ _____ _____ visit Japan with my family next summer because I want to see the beautiful temples and eat real sushi.", "c": "我明年夏天【想要】和家人去日本玩，因為我想看漂亮的寺廟和吃道地的壽司。", "f": "I would like to visit Japan with my family next summer because I want to see the beautiful temples and eat real sushi."}, {"g": "", "t": "would rather + VR + than + VR", "p": "(v.phr.)", "e": "to prefer to do one thing more than another", "z": "寧可……也不要……", "s": "It is raining so hard outside that I _____ _____ stay home and watch a movie _____ go shopping at the mall with my cousins.", "c": "外面雨下得好大，我【寧可】待在家看電影，【也不要】和表哥表姊去購物中心逛街。", "f": "It is raining so hard outside that I would rather stay home and watch a movie than go shopping at the mall with my cousins."}, {"g": "", "t": "write down + N", "p": "(v.phr.)", "e": "to write something on paper", "z": "寫下", "s": "Please _____ _____ your phone number on this paper, so I can call you when your new glasses are ready.", "c": "請在這張紙上【寫下】你的電話號碼，這樣你的新眼鏡好了我就可以打電話給你。", "f": "Please write down your phone number on this paper, so I can call you when your new glasses are ready."}, {"g": "", "t": "yell at + 人", "p": "(v.phr.)", "e": "shout at someone in an angry way", "z": "對……大叫；吼叫", "s": "Mr. Lin never _____ _____ his students, even when they forget their homework, because he is very patient.", "c": "林老師從不【吼】他的學生，即使他們忘了寫作業也一樣，因為他很有耐心。", "f": "Mr. Lin never yells at his students, even when they forget their homework, because he is very patient."}];</script><script src="longteng-b1u5-quiz.js?v=20261106-3"></script><script src="cap-vocab-learn.js?v=20261105-1"></script><script>document.querySelector("#description").textContent="先在「教學 Learn」看完 1031 筆詞彙表，再到「測驗 Quiz」做 344 題四選一｜選答後顯示答案、用語中文與整句中譯｜答錯可重做並下載錯題";</script><script src="/high-school-blank-transl
