mith ______. She was born there and moved to Taiwan five years ago.", "options": ["stays high", "solves the case", "stays in touch with her mom", "comes from Canada"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) comes from Canada\n【用語】come from + 地方 (v.phr.)：來自\n【中譯】Smith 老師來自加拿大。她在那裡出生，五年前搬到台灣。", "explanationSource": "supplemental"}, {"id": 204, "question": "It's Halloween! The kids ______ as ghosts and monsters.", "options": ["showed their mom they cared", "took a bath", "dressed up", "passed the test"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) dressed up\n【用語】dress up (v.phr.)：盛裝打扮；裝扮\n【中譯】萬聖節到了！孩子們打扮成鬼和怪物。", "explanationSource": "supplemental"}, {"id": 205, "question": "After dinner, I help Mom ______. I wash all the bowls and plates.", "options": ["do the dishes", "have nothing to do", "put on a show", "push over the table"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) do the dishes\n【用語】do the dishes (v.phr.)：洗碗\n【中譯】晚餐後，我幫媽媽洗碗。我把所有的碗盤都洗乾淨。", "explanationSource": "supplemental"}, {"id": 206, "question": "Mr. Lin parked his car in the wrong place, so he ______. He had to pay 600 dollars.", "options": ["got full marks", "got a fine", "changed his way of driving", "knew of the place"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) got a fine\n【用語】get a fine (v.phr.)：收到罰款\n【中譯】林先生把車停錯地方，所以他被罰款了。他必須付六百元。", "explanationSource": "supplemental"}, {"id": 207, "question": "A: Did you understand the English movie?\nB: I didn't know every word, but I ______.", "options": ["made a decision", "couldn't believe it", "got the idea", "sounded like a cat"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) got the idea\n【用語】get the idea (v.phr.)：理解大意\n【中譯】A：你看得懂那部英文電影嗎？\nB：我不是每個字都懂，但我理解了大意。", "explanationSource": "supplemental"}, {"id": 208, "question": "Are you ______? You want to swim in the river in winter? It's too cold!", "options": ["losing your mind", "taking a trip to Japan", "running into your friend", "having a stomachache"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) losing your mind\n【用語】lose one's mind (v.phr.)：發瘋；失去理智\n【中譯】你瘋了嗎？你想在冬天去河裡游泳？太冷了！", "explanationSource": "supplemental"}, {"id": 209, "question": "The big boys always ______ Tim. They take his lunch money and laugh at him.", "options": ["take care of", "pick on", "run out of", "get along with"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) pick on\n【用語】pick on + 人 (v.phr.)：找……的麻煩、挑……的毛病\n【中譯】那些大男孩總是找 Tim 的麻煩。他們拿走他的午餐錢，還嘲笑他。", "explanationSource": "supplemental"}, {"id": 210, "question": "______! There's a car coming!", "options": ["Go off", "Watch out", "Go wild", "Face the music"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) Watch out\n【用語】watch out (for + N) (v.phr.)：小心\n【中譯】小心！有車子來了！", "explanationSource": "supplemental"}, {"id": 211, "question": "Tom ______. He has a lot of friends, and he never fights with anyone.", "options": ["watches a game", "has a sore throat", "has a good command of English", "gets along with everyone"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) gets along with everyone\n【用語】get along with + 人 (v.phr.)：與……相處融洽\n【中譯】Tom 和每個人都相處融洽。他有很多朋友，而且從不和任何人吵架。", "explanationSource": "supplemental"}, {"id": 212, "question": "My parents hoped I would do well on the test. I studied hard and ______. They were very happy.", "options": ["met their expectation", "did nothing", "died out", "failed the test"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) met their expectation\n【用語】meet the expectation (v.phr.)：符合期待；達到期望\n【中譯】我爸媽希望我考試考好。我努力讀書，達到了他們的期望。他們非常高興。", "explanationSource": "supplemental"}, {"id": 213, "question": "Lily wanted to be a singer. She practiced every day, and finally she ______.", "options": ["rolled her eyes", "went on vacation", "lost her way", "made her dream come true"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) made her dream come true\n【用語】make one's dream come true (v.phr.)：讓夢想成真\n【中譯】Lily 想當歌手。她每天練習，最後終於讓夢想成真。", "explanationSource": "supplemental"}, {"id": 214, "question": "Tom ate too much ice cream last night, and now he ______. He needs to see a doctor.", "options": ["has a stomachache", "reaches the top of the hill", "goes whale-watching", "sees a doctor"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) has a stomachache\n【用語】have a stomachache (v.phr.)：胃痛\n【中譯】Tom 昨晚吃了太多冰淇淋，現在他胃痛。他需要去看醫生。", "explanationSource": "supplemental"}, {"id": 215, "question": "Ben's toy plane ______ from the playground and flew high into the sky.", "options": ["fell asleep", "covered its eyes", "went off", "took off"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) took off\n【用語】take off (v.phr.)：（飛機）起飛\n【中譯】Ben 的玩具飛機從操場起飛，飛上了高空。", "explanationSource": "supplemental"}, {"id": 216, "question": "It was dark. Grandpa ______ and used it to light a candle.", "options": ["passed the salt to me", "lit a match", "blew out the candle", "broke a bad habit"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) lit a match\n【用語】light a match (v.phr.)：點燃火柴\n【中譯】天很暗。爺爺點燃一根火柴，用它來點蠟燭。", "explanationSource": "supplemental"}, {"id": 217, "question": "I'm sorry I forgot your birthday. Let me ______. I'll buy you a nice dinner.", "options": ["roll my eyes", "stay friends", "pass the test", "make it up to you"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) make it up to you\n【用語】make it up to + 人 (v.phr.)：補償（某人）\n【中譯】很抱歉我忘了你的生日。讓我補償你。我會請你吃一頓好吃的晚餐。", "explanationSource": "supplemental"}, {"id": 218, "question": "At the hair salon, Mom ______ my haircut.", "options": ["clicked on", "blew out", "looked down on", "paid 300 dollars for"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) paid 300 dollars for\n【用語】pay + 錢 + for + N (v.phr.)：為⋯⋯付錢（如服務）\n【中譯】在髮廊，媽媽為我的剪髮付了三百元。", "explanationSource": "supplemental"}, {"id": 219, "question": "Tonight Jack ______ his grandma. He will take her to a nice restaurant and a movie.", "options": ["has a date with", "runs out of", "shouts at", "copies the behavior of"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) has a date with\n【用語】have a date with + 人 (v.phr.)：與某人約會\n【中譯】今晚 Jack 和他奶奶有約。他會帶她去一家不錯的餐廳，然後去看電影。", "explanationSource": "supplemental"}, {"id": 220, "question": "In fall, the leaves ______ yellow and red.", "options": ["shout at", "see", "turn", "smell"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) turn\n【用語】turn + 顏色 (v.phr.)：變成某種顏色\n【中譯】秋天時，樹葉會變成黃色和紅色。", "explanationSource": "supplemental"}, {"id": 221, "question": "Please ______ with your name and phone number.", "options": ["fill out this form", "keep off the grass", "hang up your coat", "find the book interesting"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) fill out this form\n【用語】fill out + N (v.phr.)：填寫（表格）\n【中譯】請在這張表格上填寫你的姓名和電話號碼。", "explanationSource": "supplemental"}, {"id": 222, "question": "It rained all morning, but the weather ______ in the afternoon, so we went to the park.", "options": ["lit up the room", "cleared up", "spoke up", "got over the cold"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) cleared up\n【用語】clear up (v.phr.)：放晴\n【中譯】整個早上都在下雨，但下午天氣放晴了，所以我們去了公園。", "explanationSource": "supplemental"}, {"id": 223, "question": "Tom and Ben didn't agree on many things, but they ______ and worked together to win the game.", "options": ["broke up", "paid attention to their phones", "made fools of each other", "put aside their differences"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) put aside their differences\n【用語】put aside one's differences (v.phr.)：擱置分歧\n【中譯】Tom 和 Ben 在很多事情上意見不同，但他們擱置分歧，一起合作贏得比賽。", "explanationSource": "supplemental"}, {"id": 224, "question": "There were four of us at dinner, so each person ______.", "options": ["clicked on the photo", "paid 25% of the bill", "blew out the candles", "cut in the line"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) paid 25% of the bill\n【用語】pay + 百分比 + of the bill (v.phr.)：支付帳單的…%（用於分帳）\n【中譯】我們四個人一起吃晚餐，所以每個人各付帳單的百分之二十五。", "explanationSource": "supplemental"}, {"id": 225, "question": "When Ken moved to Taipei, he didn't like the hot weather. After a year, he ______, and now the heat doesn't bother him.", "options": ["got used to it", "turned to his friends for help", "made a face", "surfed the Net"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) got used to it\n【用語】get used to + N/V-ing (v.phr.)：漸漸習慣（做）某事\n【中譯】Ken 剛搬到台北時，不喜歡炎熱的天氣。一年後，他漸漸習慣了，現在炎熱已經不會困擾他了。", "explanationSource": "supplemental"}, {"id": 226, "question": "A: I've never eaten stinky tofu. Is it good?\nB: Many people love it. Why don't you ______?", "options": ["give it a try", "break the record", "meet new friends", "make a wish"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) give it a try\n【用語】give it a try (v.phr.)：試一試\n【中譯】A：我從沒吃過臭豆腐，好吃嗎？\nB：很多人都很愛。你何不試一試？", "explanationSource": "supplemental"}, {"id": 227, "question": "The movie tickets were sold out, so we ______.", "options": ["asked for directions", "still had a long way to go", "ended up staying home", "took a shortcut"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) ended up staying home\n【用語】end up + V-ing (v.phr.)：最後……（做了某事）\n【中譯】電影票賣完了，所以我們最後待在家裡。", "explanationSource": "supplemental"}, {"id": 228, "question": "I thought the test was on Friday, but I ______; it was on Thursday!", "options": ["got it wrong", "fell asleep", "went viral", "made a face"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) got it wrong\n【用語】get it wrong (v.phr.)：搞錯；弄錯\n【中譯】我以為考試在星期五，但我搞錯了；考試是在星期四！", "explanationSource": "supplemental"}, {"id": 229, "question": "Nobody knows how the fight ______; the two boys were good friends before.", "options": ["got up", "hung around", "nodded off", "came about"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) came about\n【用語】come about (v.phr.)：發生\n【中譯】沒有人知道這場打架是怎麼發生的；這兩個男孩以前是好朋友。", "explanationSource": "supplemental"}, {"id": 230, "question": "Many people are waiting for the bus, so please go to the end and don't ______.", "options": ["take a nap", "make up your mind", "cut the line", "reach a goal"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) cut the line\n【用語】cut the line (v.phr.)：插隊\n【中譯】很多人在等公車，所以請排到最後面，不要插隊。", "explanationSource": "supplemental"}, {"id": 231, "question": "Before you say something mean, you should ______.", "options": ["go sightseeing", "play a role", "consider others' feelings", "go your separate ways"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) consider others' feelings\n【用語】consider others' feelings (v.phr.)：考慮別人的感受\n【中譯】在你說出刻薄的話之前，你應該考慮別人的感受。", "explanationSource": "supplemental"}, {"id": 232, "question": "Losing the final game was hard for our team, but we ______ and started practicing again.", "options": ["lost our way", "went past the gym", "took the blow", "followed the rules"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) took the blow\n【用語】take the blow (v.phr.)：承受打擊\n【中譯】輸掉決賽對我們隊來說很難受，但我們承受了打擊，又開始練習了。", "explanationSource": "supplemental"}, {"id": 233, "question": "My watch stopped working, so I ______, and now it works well again.", "options": ["took a nap", "heard from my aunt", "made a down payment", "had it repaired"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) had it repaired\n【用語】have + 物 + p.p. (v.phr.)：請人處理某事（使役被動）\n【中譯】我的手錶壞了，所以我請人把它修好，現在它又能正常運作了。", "explanationSource": "supplemental"}, {"id": 234, "question": "Ben's little sister was hungry, so he went to the kitchen and ______.", "options": ["got her a sandwich", "set off", "fell asleep", "knocked down a chair"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) got her a sandwich\n【用語】get + 人 + 物 (v.phr.)：給某人某物\n【中譯】班的妹妹肚子餓了，所以他去廚房拿了一個三明治給她。", "explanationSource": "supplemental"}, {"id": 235, "question": "Amy ______ because she lost her favorite necklace.", "options": ["made it", "took it easy", "felt down", "dressed up as a princess"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) felt down\n【用語】feel down/blue (v.phr.)：感到沮喪\n【中譯】艾咪因為弄丟了她最喜歡的項鍊而感到沮喪。", "explanationSource": "supplemental"}, {"id": 236, "question": "It may rain this afternoon, so you should ______.", "options": ["stay fresh", "bring your umbrella along", "make the bed", "get rid of your umbrella"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) bring your umbrella along\n【用語】bring + 物 + along (v.phr.)：帶著……一起\n【中譯】今天下午可能會下雨，所以你應該把雨傘帶著。", "explanationSource": "supplemental"}, {"id": 237, "question": "I ______ at the night market last night. I didn't know he would be there!", "options": ["showed my cousin around", "bumped into my old teacher", "thought twice", "brushed my teeth"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) bumped into my old teacher\n【用語】bump into + 人 (v.phr.)：撞見；巧遇\n【中譯】我昨晚在夜市巧遇我以前的老師。我不知道他會在那裡！", "explanationSource": "supplemental"}, {"id": 238, "question": "My brother and I ______: I wash the dishes, and he does the laundry.", "options": ["made a deal", "pulled the plug on the plan", "took a walk", "touched the ground"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) made a deal\n【用語】make a deal (v.phr.)：達成協議或交易\n【中譯】我哥哥和我達成了協議：我洗碗，他洗衣服。", "explanationSource": "supplemental"}, {"id": 239, "question": "Some students ______ that school should start later in the morning.", "options": ["sound", "make believe", "show up", "argue"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) argue\n【用語】argue + that 子句 (v.phr.)：主張；認為\n【中譯】有些學生主張學校早上應該晚一點開始上課。", "explanationSource": "supplemental"}, {"id": 240, "question": "The doctor says I should ______ three times a day, after meals.", "options": ["take the toys away from my brother", "pay the bill", "result from the cold", "take the medicine"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) take the medicine\n【用語】take the medicine (v.phr.)：吃藥\n【中譯】醫生說我應該一天吃三次藥，在飯後吃。", "explanationSource": "supplemental"}, {"id": 241, "question": "Dad started the engine and told us to ______ quickly because we were late for school.", "options": ["root around for candy", "do the dishes", "get in the car", "find out the answer"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) get in the car\n【用語】get in the car/taxi/cable car (v.phr.)：上車／上計程車／上纜車（不可站立）\n【中譯】爸爸發動了引擎，叫我們快點上車，因為我們上學要遲到了。", "explanationSource": "supplemental"}, {"id": 242, "question": "Our school ______ from Japan, so now every classroom has a robot.", "options": ["went back", "gave it a shot", "brought in robots", "took a break"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) brought in robots\n【用語】bring in + N (v.phr.)：引進\n【中譯】我們學校從日本引進了機器人，所以現在每間教室都有一台機器人。", "explanationSource": "supplemental"}, {"id": 243, "question": "Mia feels homesick in Canada, so she ______.", "options": ["goes to the gym", "draws a crowd", "longs for her mom's cooking", "has online classes"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) longs for her mom's cooking\n【用語】long for + N (v.phr.)：渴望\n【中譯】米亞在加拿大很想家，所以她很渴望吃到媽媽煮的菜。", "explanationSource": "supplemental"}, {"id": 244, "question": "My brother tried swimming last summer and ______ right away; now he swims every weekend.", "options": ["helped me out", "kept the change", "took to it", "gave it up"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) took to it\n【用語】take to + N/V-ing (v.phr.)：開始喜歡、迷上\n【中譯】我弟弟去年夏天試了游泳，馬上就迷上了；現在他每個週末都去游泳。", "explanationSource": "supplemental"}, {"id": 245, "question": "Grandpa and Grandma have been married for fifty years. Grandpa has never ______ Grandma; he loves only her.", "options": ["taken in", "kept in touch with", "cheered for", "cheated on"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) cheated on\n【用語】cheat on + 人 (v.phr.)：對（人）不忠\n【中譯】爺爺和奶奶已經結婚五十年了。爺爺從來沒有對奶奶不忠；他只愛她一個人。", "explanationSource": "supplemental"}, {"id": 246, "question": "Mom was too tired to cook, so we ______ at a restaurant near our home.", "options": ["took care of the baby", "ate out", "made a sound", "went whale-watching"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) ate out\n【用語】eat out (v.phr.)：在外面吃\n【中譯】媽媽太累了沒辦法煮飯，所以我們在家附近的餐廳外食。", "explanationSource": "supplemental"}, {"id": 247, "question": "Don't blame Jack for the broken window; he was at home all day, so he ______.", "options": ["asked his dad for help", "had nothing to do with it", "gave way to it", "made a mess"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) had nothing to do with it\n【用語】have nothing to do with + N (v.phr.)：與…毫無關係\n【中譯】別為了破掉的窗戶責怪傑克；他整天都在家，所以這件事跟他毫無關係。", "explanationSource": "supplemental"}, {"id": 248, "question": "Your hair is too long, so you should ______ before school photo day.", "options": ["look at it from another angle", "do the laundry", "get a haircut", "set out the chairs"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) get a haircut\n【用語】get a haircut (v.phr.)：剪頭髮\n【中譯】你的頭髮太長了，所以你應該在學校拍照日之前去剪頭髮。", "explanationSource": "supplemental"}, {"id": 249, "question": "Babies cannot do anything by themselves, so they ______ for everything.", "options": ["make an excuse", "laugh at their parents", "can't help laughing", "depend on their parents"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) depend on their parents\n【用語】depend on + 人/物 (v.phr.)：依賴\n【中譯】嬰兒自己什麼都不會做，所以他們凡事都依賴父母。", "explanationSource": "supplemental"}, {"id": 250, "question": "We have to move this big sofa because it ______ in our small living room.", "options": ["has a fever", "plays a game", "watches us closely", "takes up too much space"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) takes up too much space\n【用語】take up + N (v.phr.)：佔據（空間、時間）\n【中譯】我們得把這張大沙發搬走，因為它在我們的小客廳裡佔了太多空間。", "explanationSource": "supplemental"}, {"id": 251, "question": "After the party, we ______ the messy living room together.", "options": ["jumped over", "had experience in", "put away", "cleared up"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) cleared up\n【用語】clear up + N (v.phr.)：清理\n【中譯】派對結束後，我們一起把凌亂的客廳清理乾淨。", "explanationSource": "supplemental"}, {"id": 252, "question": "My brother is sixteen, but he still ______ a little kid.", "options": ["time goes by", "lives on", "acts like", "figures out"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) acts like\n【用語】act like + N (v.phr.)：表現得像……\n【中譯】我哥哥十六歲了，但他還是表現得像個小孩子。", "explanationSource": "supplemental"}, {"id": 253, "question": "Taking the MRT can help you ______ because there are no traffic jams.", "options": ["push yourself", "run after the bus", "catch a cold", "save time"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) save time\n【用語】save time (v.phr.)：省時間\n【中譯】搭捷運可以幫你省時間，因為沒有塞車。", "explanationSource": "supplemental"}, {"id": 254, "question": "Grandpa is very sick in the hospital, so every night we ______.", "options": ["laugh at him", "pray for him", "keep pace with him", "hold a party"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) pray for him\n【用語】pray for + 人 (v.phr.)：為…祈禱\n【中譯】爺爺病得很重住在醫院，所以我們每天晚上都為他祈禱。", "explanationSource": "supplemental"}, {"id": 255, "question": "During lunch break, I like to ______ about our favorite movies.", "options": ["keep up with my classmates", "chat with my classmates", "fall asleep", "cut costs"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) chat with my classmates\n【用語】chat with + 人 (v.phr.)：和…聊天\n【中譯】午休時間，我喜歡和同學聊我們最喜歡的電影。", "explanationSource": "supplemental"}, {"id": 256, "question": "In front of the whole team, the coach ______, saying Leo was lazy and slow.", "options": ["took a pop at Leo", "shut up", "shook hands with Leo", "cheered for Leo"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) took a pop at Leo\n【用語】take a pop at sb (v.phr.)：當眾批評某人\n【中譯】教練在全隊面前當眾批評里歐，說他又懶又慢。", "explanationSource": "supplemental"}, {"id": 257, "question": "Mr. Lin explained the math problem twice, but I still didn't ______.", "options": ["take my time", "get his point", "stay with him", "pay the bill"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) get his point\n【用語】get + N (v.phr.)：理解某事\n【中譯】林老師把這道數學題解釋了兩次，但我還是不懂他的意思。", "explanationSource": "supplemental"}, {"id": 258, "question": "After school, my little sister likes to ______ in the yard.", "options": ["put on weight", "go from bad to worse", "pull out a tooth", "play with our puppy"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) play with our puppy\n【用語】play with + 人 (v.phr.)：和…一起玩\n【中譯】放學後，我妹妹喜歡在院子裡和我們的小狗一起玩。", "explanationSource": "supplemental"}, {"id": 259, "question": "The bus is shaking a lot, so please ______.", "options": ["hold on to the handle", "turn to the police", "devote your life to music", "make a wish"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) hold on to the handle\n【用語】hold on to + N (v.phr.)：緊抓住、堅持\n【中譯】公車晃得很厲害，所以請緊抓住把手。", "explanationSource": "supplemental"}, {"id": 260, "question": "On her first day at the new school, Kelly ______, and they had lunch together.", "options": ["stayed up", "made friends with a girl in her class", "went abroad", "took a shower"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) made friends with a girl in her class\n【用語】make friends with + 人 (v.phr.)：和…交朋友\n【中譯】凱莉在新學校的第一天就和班上一個女生交了朋友，她們還一起吃午餐。", "explanationSource": "supplemental"}, {"id": 261, "question": "Mr. Wang's family is poor, so he works two jobs to ______.", "options": ["kill time", "give out candy", "share a lot in common", "make ends meet"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) make ends meet\n【用語】make ends meet (v.phr.)：維持生計；勉強維生\n【中譯】王先生家裡很窮，所以他做兩份工作來維持生計。", "explanationSource": "supplemental"}, {"id": 262, "question": "Tim couldn't open the box with his hands, so in the end he ______ using a hammer.", "options": ["complained about", "backed up", "resorted to", "barked at"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) resorted to\n【用語】resort to + N/V-ing (v.phr.)：訴諸於\n【中譯】提姆用手打不開盒子，所以最後只好訴諸於用鐵鎚。", "explanationSource": "supplemental"}, {"id": 263, "question": "Ken promised to help me move, and he ______ by coming on time.", "options": ["kept his word", "called me names", "made a speech", "let me down"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) kept his word\n【用語】keep one's word (v.phr.)：遵守諾言\n【中譯】肯答應要幫我搬家，而他準時來了，遵守了他的諾言。", "explanationSource": "supplemental"}, {"id": 264, "question": "The police asked the thief to ______ the stolen money.", "options": ["bring up", "show off", "hand over", "knock down"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) hand over\n【用語】hand over + N (v.phr.)：交出、移交\n【中譯】警察要求小偷交出偷來的錢。", "explanationSource": "supplemental"}, {"id": 265, "question": "It's too dark in the room, so could you please ______?", "options": ["turn on the light", "ask the teacher for advice", "turn down the volume", "take the lead"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) turn on the light\n【用語】turn on + N (v.phr.)：打開（電器、開關）\n【中譯】房間裡太暗了，可以請你把燈打開嗎？", "explanationSource": "supplemental"}, {"id": 266, "question": "To improve her English, Amy ______ every day.", "options": ["stands up", "takes a nap", "makes up excuses", "makes efforts to read English books"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) makes efforts to read English books\n【用語】make efforts to + VR (v.phr.)：努力（做…）；辛勞\n【中譯】為了提升英文能力，艾咪每天都努力閱讀英文書。", "explanationSource": "supplemental"}, {"id": 267, "question": "Can I ______ your new phone? It looks so cool!", "options": ["reach", "throw away", "take a look at", "think through"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) take a look at\n【用語】take a look at + N (v.phr.)：看一下，瞧一瞧\n【中譯】我可以看一下你的新手機嗎？它看起來好酷！", "explanationSource": "supplemental"}, {"id": 268, "question": "I ______ in the third question, so I got only 95 on the math test.", "options": ["lived with my grandma", "took a bath", "made a mistake", "listened to music"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) made a mistake\n【用語】make a mistake (v.phr.)：犯錯\n【中譯】我在第三題犯了錯，所以數學考試只拿到95分。", "explanationSource": "supplemental"}, {"id": 269, "question": "My dad ______ every morning, so he is very healthy.", "options": ["catches a cold", "makes it a rule to jog", "stays up late", "enjoys himself"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) makes it a rule to jog\n【用語】make it a rule to + VR (v.phr.)：習慣做…\n【中譯】我爸爸習慣每天早上慢跑，所以他非常健康。", "explanationSource": "supplemental"}, {"id": 270, "question": "I'm in a bad mood, so please ______ for a while.", "options": ["leave me alone", "communicate with me", "go through my notes", "cut it off"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) leave me alone\n【用語】leave + 人 + alone (v.phr.)：讓某人一個人靜一靜；別煩某人\n【中譯】我心情不好，所以請讓我一個人靜一靜。", "explanationSource": "supplemental"}, {"id": 271, "question": "This small island ______ thousands of sea birds.", "options": ["is home to", "cuts down", "makes fun of", "complains about"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) is home to\n【用語】be home to + N (v.phr.)：是……的家園、……的大本營\n【中譯】這座小島是數千隻海鳥的家園。", "explanationSource": "supplemental"}, {"id": 272, "question": "Sorry, I can't ______ at your party. My mom wants me home by eight.", "options": ["go to the gym", "take notes", "do business", "stay long"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) stay long\n【用語】stay long (v.phr.)：停留很久\n【中譯】抱歉，我不能在你的派對停留很久。我媽媽要我八點前到家。", "explanationSource": "supplemental"}, {"id": 273, "question": "We waited for Tom at the station for an hour, but he never ______.", "options": ["pulled together", "went on", "felt sleepy", "turned up"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) turned up\n【用語】turn up (v.phr.)：出現\n【中譯】我們在車站等了湯姆一個小時，但他始終沒有出現。", "explanationSource": "supplemental"}, {"id": 274, "question": "After school, the students ______ the library to study.", "options": ["made up", "headed for", "got over", "turned off"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) headed for\n【用語】head for + 地方 (v.phr.)：前往\n【中譯】放學後，學生們前往圖書館讀書。", "explanationSource": "supplemental"}, {"id": 275, "question": "If you get lost in the mall, just ______ and wait for me.", "options": ["stay put", "pick up the room", "fall over", "make faces"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) stay put\n【用語】stay put (v.phr.)：原地不動\n【中譯】如果你在購物中心迷路了，就待在原地不要動，等我。", "explanationSource": "supplemental"}, {"id": 276, "question": "Grandpa learned to use a smartphone because he wants to ______.", "options": ["break in", "miss the train", "die out", "catch up with the times"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) catch up with the times\n【用語】catch up with the times (v.phr.)：跟上時代\n【中譯】爺爺學用智慧型手機，因為他想跟上時代。", "explanationSource": "supplemental"}, {"id": 277, "question": "My brother works at a fast-food restaurant after school to ______.", "options": ["cut the paper", "make money", "lose his way", "have a headache"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) make money\n【用語】make money (v.phr.)：賺錢\n【中譯】我哥哥放學後在速食店打工賺錢。", "explanationSource": "supplemental"}, {"id": 278, "question": "Eggs are more expensive now. The price of eggs ______ last month.", "options": ["went up", "took place", "broke up", "slowed down"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) went up\n【用語】go up (v.phr.)：上升、上漲\n【中譯】現在蛋比較貴了。蛋價上個月上漲了。", "explanationSource": "supplemental"}, {"id": 279, "question": "To get money for a new phone, my brother ______.", "options": ["took a day off", "replaced his old bike with a new one", "minded his behavior", "sold his old bike for NT$3,000"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) sold his old bike for NT$3,000\n【用語】buy/sell + N + for + 錢 (v.phr.)：用多少錢買／賣某物\n【中譯】為了籌錢買新手機，我哥哥用新台幣三千元賣掉了他的舊腳踏車。", "explanationSource": "supplemental"}, {"id": 280, "question": "The question was so hard that everyone in the class ______ it, so the teacher told us the answer.", "options": ["lived on", "led to", "had no answer to", "graduated from"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) had no answer to\n【用語】have no answer to + N (v.phr.)：對⋯⋯沒有答案；答不出\n【中譯】這個問題太難了，全班都答不出來，所以老師告訴我們答案。", "explanationSource": "supplemental"}, {"id": 281, "question": "I can't hear the music. Can you ______ the radio, please?", "options": ["begin with", "go along with", "turn up", "account for"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) turn up\n【用語】turn up + N (v.phr.)：開大（聲音）\n【中譯】我聽不到音樂。可以請你把收音機開大聲一點嗎？", "explanationSource": "supplemental"}, {"id": 282, "question": "The big red sign on the door ______, so I stopped to read it.", "options": ["caught up with me", "came across me", "made faces at me", "drew my attention"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) drew my attention\n【用語】draw one's attention (v.phr.)：吸引某人的注意\n【中譯】門上那個大紅色的告示吸引了我的注意，所以我停下來看。", "explanationSource": "supplemental"}, {"id": 283, "question": "We are so excited. We are ______ visiting the zoo on the school trip next Friday.", "options": ["catching up with", "coming across", "contributing to", "looking forward to"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) looking forward to\n【用語】look forward to + N (v.phr.)：期待……（名詞）\n【中譯】我們好興奮。我們很期待下週五校外教學去參觀動物園。", "explanationSource": "supplemental"}, {"id": 284, "question": "It's very hot in here. Please ______.", "options": ["lose weight", "settle down", "cut in the line", "leave the window open"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) leave the window open\n【用語】leave + 物 + adj. (v.phr.)：讓某物保持某狀態（形容詞）\n【中譯】這裡面好熱。請讓窗戶開著。", "explanationSource": "supplemental"}, {"id": 285, "question": "Even when the kids were very noisy, the teacher ______ and spoke softly.", "options": ["took medicine", "took her chance", "walked up the stairs", "kept her cool"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) kept her cool\n【用語】keep one's cool (v.phr.)：保持冷靜\n【中譯】即使孩子們很吵，老師仍保持冷靜，輕聲說話。", "explanationSource": "supplemental"}, {"id": 286, "question": "Mom gets up at six every morning to ______ for us. Today we are having eggs and toast.", "options": ["go to the gym", "face the difficulty", "make breakfast", "cross the street"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) make breakfast\n【用語】make breakfast/lunch/dinner (v.phr.)：做早餐／午餐／晚餐\n【中譯】媽媽每天早上六點起床為我們做早餐。今天我們吃蛋和吐司。", "explanationSource": "supplemental"}, {"id": 287, "question": "A: We're going to play basketball after school. Do you want to join us?\nB: ______! I love basketball.", "options": ["Take care", "Line up", "Take a seat", "Count me in"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) Count me in\n【用語】count me in (v.phr.)：算我一份\n【中譯】A：我們放學後要去打籃球。你要加入嗎？\nB：算我一份！我很愛打籃球。", "explanationSource": "supplemental"}, {"id": 288, "question": "Amy ______ her father because he is kind and always helps others.", "options": ["results in", "dies of", "pushes up", "looks up to"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) looks up to\n【用語】look up to + 人 (v.phr.)：尊敬，仰慕\n【中譯】艾咪很尊敬她的父親，因為他很善良，而且總是幫助別人。", "explanationSource": "supplemental"}, {"id": 289, "question": "Hurry up! We need to ______ now, or it will leave without us.", "options": ["look happy", "return the favor", "get on the bus", "take a chance"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) get on the bus\n【用語】get on the bus/train/plane/MRT/gondola (v.phr.)：上公車／火車／飛機／捷運／纜車（可站立）\n【中譯】快一點！我們現在得上公車，不然它會丟下我們開走。", "explanationSource": "supplemental"}, {"id": 290, "question": "Grandpa has a small farm in the countryside. He grows vegetables and ______ there.", "options": ["comes to his mind", "pulls out", "gets out of the way", "lives a simple life"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) lives a simple life\n【用語】live a + adj. + life (v.phr.)：過著⋯⋯的生活\n【中譯】爺爺在鄉下有一座小農場。他在那裡種菜，過著簡單的生活。", "explanationSource": "supplemental"}, {"id": 291, "question": "I was all sweaty after the basketball game, so I ______ right away.", "options": ["gave directions", "took notes", "had a picnic", "took a shower"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) took a shower\n【用語】take a shower (v.phr.)：淋浴\n【中譯】籃球比賽後我全身是汗，所以我馬上去淋浴。", "explanationSource": "supplemental"}, {"id": 292, "question": "You feel very hot. Let me ______ to see if you have a fever.", "options": ["take your temperature", "surf the Internet", "go down", "take it seriously"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) take your temperature\n【用語】take temperature (v.phr.)：量體溫\n【中譯】你摸起來很燙。讓我幫你量體溫，看看你是不是發燒了。", "explanationSource": "supplemental"}, {"id": 293, "question": "We didn't know the new word \"cozy,\" so Ms. Lin ______.", "options": ["defined it as \"warm and comfortable\"", "put the plan into practice", "made a good shot", "took a holiday"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) defined it as \"warm and comfortable\"\n【用語】define + N + as + N (v.phr.)：將……定義為\n【中譯】我們不認識新單字「cozy」，所以林老師把它定義為「溫暖又舒適」。", "explanationSource": "supplemental"}, {"id": 294, "question": "It's sunny today. Let's ______ in the park and eat sandwiches on the grass.", "options": ["fall over", "go on a picnic", "cross the street", "make up our minds"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) go on a picnic\n【用語】go on a picnic (v.phr.)：去野餐\n【中譯】今天天氣晴朗。我們去公園野餐，在草地上吃三明治吧。", "explanationSource": "supplemental"}, {"id": 295, "question": "On New Year's Eve, people ______ fireworks by the river.", "options": ["graduate from", "depend on", "make fun of", "set off"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) set off\n【用語】set off + N (v.phr.)：使爆炸、燃放（煙火）\n【中譯】跨年夜時，人們在河邊施放煙火。", "explanationSource": "supplemental"}, {"id": 296, "question": "After years of hard work, Lisa finally ______. She is a doctor now.", "options": ["made a U-turn", "woke up", "realized her dream", "took a walk"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) realized her dream\n【用語】realize one's dream (v.phr.)：實現夢想\n【中譯】經過多年的努力，麗莎終於實現了夢想。她現在是一名醫生。", "explanationSource": "supplemental"}, {"id": 297, "question": "I have to finish this report by Friday, so I'm working hard to ______.", "options": ["meet the deadline", "nod off", "die out", "have a lot in common"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) meet the deadline\n【用語】meet the deadline (v.phr.)：趕上期限；趕上截止日期\n【中譯】我必須在星期五前完成這份報告，所以我正努力趕上截止日期。", "explanationSource": "supplemental"}, {"id": 298, "question": "Everyone in our class ______ because she always helps others.", "options": ["regards Amy as a good friend", "leaves Amy's books behind", "breaks up", "feels sleepy"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) regards Amy as a good friend\n【用語】regard + N + as + N (v.phr.)：認為……是……\n【中譯】我們班上每個人都把艾咪當作好朋友，因為她總是幫助別人。", "explanationSource": "supplemental"}, {"id": 299, "question": "Playing with three little kids all day really ______ Grandma.", "options": ["thought about", "wore out", "made use of", "had beef with"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) wore out\n【用語】wear out + 人 (v.phr.)：使筋疲力盡、累垮\n【中譯】和三個小孩玩了一整天，真的把奶奶累壞了。", "explanationSource": "supplemental"}, {"id": 300, "question": "I was near your house this afternoon, so I ______ to say hi.", "options": ["pulled out", "lost weight", "had a headache", "dropped by"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) dropped by\n【用語】drop by (v.phr.)：順便來訪\n【中譯】我今天下午在你家附近，所以順道過來打聲招呼。", "explanationSource": "supplemental"}, {"id": 301, "question": "I ______ late last night to watch the baseball game, so I'm very tired now.", "options": ["made faces", "got out of the way", "took place", "stayed up"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) stayed up\n【用語】stay up (v.phr.)：熬夜\n【中譯】我昨晚熬夜看棒球比賽，所以現在很累。", "explanationSource": "supplemental"}, {"id": 302, "question": "Go straight two blocks and ______ at the bookstore. The bank is next to it.", "options": ["take medicine", "make a good shot", "turn right", "nod off"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) turn right\n【用語】turn right (v.phr.)：向右轉\n【中譯】直走兩個路口，在書店那裡右轉。銀行就在書店旁邊。", "explanationSource": "supplemental"}, {"id": 303, "question": "My new shoes were on sale. I only ______.", "options": ["paid NT$500 for them", "let my voice be heard", "came along", "showed my true colors"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) paid NT$500 for them\n【用語】pay + 錢 + for + N (v.phr.)：付多少錢買…\n【中譯】我的新鞋在特價。我只花了新台幣五百元買它們。", "explanationSource": "supplemental"}, {"id": 304, "question": "Everyone should ______. For example, never drive after drinking.", "options": ["have a dream", "take a holiday", "fit in", "follow the law"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) follow the law\n【用語】follow the law (v.phr.)：遵守法律\n【中譯】每個人都應該遵守法律。例如，絕對不要酒後開車。", "explanationSource": "supplemental"}, {"id": 305, "question": "We finished dinner at the restaurant, and Dad ______ with his credit card.", "options": ["cut the paper", "paid the bill", "walked up the stairs", "got out of the way"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) paid the bill\n【用語】pay the bill (v.phr.)：付帳\n【中譯】我們在餐廳吃完晚餐，爸爸用信用卡付了帳。", "explanationSource": "supplemental"}, {"id": 306, "question": "I want to ______ my bad habit of eating too much candy.", "options": ["hand out", "get rid of", "leave for", "live on"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) get rid of\n【用語】get rid of + N (v.phr.)：擺脫\n【中譯】我想擺脫吃太多糖果的壞習慣。", "explanationSource": "supplemental"}, {"id": 307, "question": "Our river is getting dirty. We must ______ to clean it before it's too late.", "options": ["come along", "take pictures of it", "turn up the heater", "take action"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) take action\n【用語】take action (v.phr.)：採取行動\n【中譯】我們的河川越來越髒了。我們必須在太遲之前採取行動把它清乾淨。", "explanationSource": "supplemental"}, {"id": 308, "question": "Mom ______ and gave one to each of us.", "options": ["lived on the cookie", "broke the cookie into four pieces", "pulled our leg", "gave directions"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) broke the cookie into four pieces\n【用語】break + N + into + N (v.phr.)：破成…；分成…\n【中譯】媽媽把餅乾分成四塊，給我們每人一塊。", "explanationSource": "supplemental"}, {"id": 309, "question": "In the last second of the game, Kevin ______, and our team won 21 to 20.", "options": ["scored a point", "broke in", "took a seat", "made up his mind"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) scored a point\n【用語】score a point (v.phr.)：得一分\n【中譯】在比賽最後一秒，凱文得了一分，我們隊以21比20獲勝。", "explanationSource": "supplemental"}, {"id": 310, "question": "When I called her name, Mary ______ and smiled at me.", "options": ["turned around", "broke up", "surfed the Internet", "did her best"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) turned around\n【用語】turn around (v.phr.)：轉身\n【中譯】我叫瑪莉的名字時，她轉過身來對我微笑。", "explanationSource": "supplemental"}, {"id": 311, "question": "The soup is cold. Let me ______ the soup for you in the microwave.", "options": ["lead to", "heat up", "account for", "figure out"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) heat up\n【用語】heat up + N (v.phr.)：加熱\n【中譯】湯冷掉了。讓我用微波爐幫你把湯加熱。", "explanationSource": "supplemental"}, {"id": 312, "question": "This restaurant changed its menu to ______ young people's tastes.", "options": ["cut down", "cater to", "graduate from", "die of"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) cater to\n【用語】cater to + N (v.phr.)：迎合\n【中譯】這家餐廳改了菜單來迎合年輕人的口味。", "explanationSource": "supplemental"}, {"id": 313, "question": "Wear a raincoat. It will ______.", "options": ["wake up", "take a seat", "prevent you from getting wet", "subject you to danger"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) prevent you from getting wet\n【用語】prevent + N + from + V-ing (v.phr.)：阻止……、避免\n【中譯】穿上雨衣。它可以防止你被淋濕。", "explanationSource": "supplemental"}, {"id": 314, "question": "The forest was dark, but we used a map to ______ it.", "options": ["find the way through", "result in", "live on", "complain about"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) find the way through\n【用語】find the way through + N (v.phr.)：找到出路\n【中譯】森林裡很暗，但我們用地圖找到了穿越森林的路。", "explanationSource": "supplemental"}, {"id": 315, "question": "I want to be a pilot when I ______.", "options": ["fall over", "grow up", "don't get my way", "have a headache"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) grow up\n【用語】grow up (v.phr.)：長大、成長\n【中譯】我長大後想當飛行員。", "explanationSource": "supplemental"}, {"id": 316, "question": "I can't watch TV now. I need to ______. Ms. Lin will check our workbooks tomorrow.", "options": ["put on a play", "go for a ride", "report bullying to the teacher", "do homework"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) do homework\n【用語】do homework (v.phr.)：做作業\n【中譯】我現在不能看電視。我需要做作業。林老師明天會檢查我們的作業簿。", "explanationSource": "supplemental"}, {"id": 317, "question": "The sea was so blue and beautiful that we sat on the beach for an hour to ______.", "options": ["take in the view", "take her place", "pick up Amy", "do our shopping"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) take in the view\n【用語】take in the view (v.phr.)：欣賞風景\n【中譯】海又藍又美，所以我們在沙灘上坐了一個小時欣賞風景。", "explanationSource": "supplemental"}, {"id": 318, "question": "Tim saw a cup of water on the table. He ______ and drank it.", "options": ["stood in my way", "reached out for it", "took off", "pulled away"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) reached out for it\n【用語】reach out for + 物 (v.phr.)：伸手拿…\n【中譯】提姆看到桌上有一杯水。他伸手拿起它並喝掉了。", "explanationSource": "supplemental"}, {"id": 319, "question": "Mom ______ to make my birthday cake perfect. She worked on it all afternoon.", "options": ["kept fit", "took a rest", "took pains", "wore out her shoes"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) took pains\n【用語】take pains to + VR (v.phr.)：費盡心力（做…）；辛苦\n【中譯】媽媽費盡心力把我的生日蛋糕做得很完美。她做了一整個下午。", "explanationSource": "supplemental"}, {"id": 320, "question": "What ______ your bike? The front wheel is broken.", "options": ["listened to", "belonged to", "looked like", "happened to"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) happened to\n【用語】happen to + 人/物 (v.phr.)：發生\n【中譯】你的腳踏車發生了什麼事？前輪壞了。", "explanationSource": "supplemental"}, {"id": 321, "question": "It's sunny today, so Mom wants to ______ outside to dry.", "options": ["hang the clothes", "clean out the closet", "brush her teeth", "give me an angry look"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) hang the clothes\n【用語】hang the clothes (v.phr.)：掛衣服\n【中譯】今天天氣晴朗，所以媽媽想把衣服掛在外面晾乾。", "explanationSource": "supplemental"}, {"id": 322, "question": "There are glass cups in this box. Please ______.", "options": ["tell the truth", "kill time", "have fun", "handle it with care"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) handle it with care\n【用語】handle + N + with care (v.phr.)：小心處理（常見於包裹標示）\n【中譯】這個箱子裡有玻璃杯。請小心處理。", "explanationSource": "supplemental"}, {"id": 323, "question": "Bye, Amy! I hope you ______ at the party tonight. There will be lots of games and food!", "options": ["pick up your bag", "have a good time", "make a choice", "dream about it"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) have a good time\n【用語】have a good time (v.phr.)：玩得愉快\n【中譯】再見，艾咪！希望你今晚在派對上玩得愉快。會有很多遊戲和食物！", "explanationSource": "supplemental"}, {"id": 324, "question": "I didn't want to join the basketball team at first, but my friends ______. Now I play every day.", "options": ["turned down the radio", "took off", "pulled away", "talked me into it"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) talked me into it\n【用語】talk + 人 + into + V-ing (v.phr.)：說服（某人做…）\n【中譯】我一開始不想加入籃球隊，但我的朋友們說服了我。現在我每天都打球。", "explanationSource": "supplemental"}, {"id": 325, "question": "My little brother hates carrots, but Mom can always ______. She is really good at it.", "options": ["get him to eat them", "check up", "have fun", "keep in touch"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) get him to eat them\n【用語】get + 人 + to + VR (v.phr.)：使某人去做……\n【中譯】我弟弟討厭紅蘿蔔，但媽媽總是能讓他吃下去。她真的很擅長這件事。", "explanationSource": "supplemental"}, {"id": 326, "question": "The twin sisters look the same. I can't ______ between them.", "options": ["make coffee", "record my life", "tell the difference", "have fun"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) tell the difference\n【用語】tell the difference (v.phr.)：分辨差異\n【中譯】那對雙胞胎姊妹長得一模一樣。我分辨不出她們之間的差異。", "explanationSource": "supplemental"}, {"id": 327, "question": "The police officer said, \"Catching thieves is not easy, but I must ______.\"", "options": ["do my job", "go off", "think of a song", "take a picture"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) do my job\n【用語】do one's job (v.phr.)：做工作；盡本分\n【中譯】警察說：「抓小偷並不容易，但我必須盡我的本分。」", "explanationSource": "supplemental"}, {"id": 328, "question": "Grandpa lives alone in the country, but he can ______ without our help.", "options": ["get along", "come on in", "pull away", "go off"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) get along\n【用語】get along (v.phr.)：生活過得去；應付\n【中譯】爺爺獨自住在鄉下，但他不需要我們的幫忙也能過得去。", "explanationSource": "supplemental"}, {"id": 329, "question": "Don't leave yet! ______ for a while, and we can eat some cake together.", "options": ["Stick around", "Keep away from us", "Have a pen", "Pull yourself together"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) Stick around\n【用語】stick around (v.phr.)：待在附近；留下來\n【中譯】先別走！留下來一會兒，我們可以一起吃點蛋糕。", "explanationSource": "supplemental"}, {"id": 330, "question": "Can I ______? I need some help with my math homework.", "options": ["have a great time", "ask you a favor", "pull up my socks", "kill time"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) ask you a favor\n【用語】ask + 人 + a favor (v.phr.)：請……幫個忙\n【中譯】我可以請你幫個忙嗎？我的數學作業需要一些幫助。", "explanationSource": "supplemental"}, {"id": 331, "question": "Ben thinks math is not important, so he doesn't ______.", "options": ["take math seriously", "keep a diary", "beat the clock", "make up"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) take math seriously\n【用語】take + N + seriously (v.phr.)：認真看待\n【中譯】班認為數學不重要，所以他不認真看待數學。", "explanationSource": "supplemental"}, {"id": 332, "question": "At first Dad said no to a new phone, but after I asked him ten times, he finally ______.", "options": ["passed by", "gave in", "took a picture", "took my breath away"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) gave in\n【用語】give in (to + N) (v.phr.)：讓步、屈服\n【中譯】一開始爸爸不答應買新手機，但在我問了他十次之後，他終於讓步了。", "explanationSource": "supplemental"}, {"id": 333, "question": "Before you go to bed, don't forget to ______.", "options": ["brush your teeth", "range from one to ten", "give up your seat", "order your sister to sit down"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) brush your teeth\n【用語】brush one's teeth (v.phr.)：刷牙\n【中譯】睡覺前，別忘了刷牙。", "explanationSource": "supplemental"}, {"id": 334, "question": "Thousands of fans came to the stadium to ______. They shouted, \"Go, Brothers, go!\"", "options": ["point at the sky", "celebrate the holiday with cake", "pack up", "root for their team"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) root for their team\n【用語】root for + 人 (v.phr.)：為……聲援、加油\n【中譯】成千上萬的球迷來到球場為他們的球隊加油。他們大喊：「兄弟，加油！」", "explanationSource": "supplemental"}, {"id": 335, "question": "I'm sorry I called you stupid. I want to ______.", "options": ["keep fit", "take back my words", "have fun", "come on in"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) take back my words\n【用語】take back + N (v.phr.)：取回、收回\n【中譯】對不起我說你很笨。我想收回我的話。", "explanationSource": "supplemental"}, {"id": 336, "question": "There are so many cakes in the shop, and they all look good. I can't ______.", "options": ["run over them", "run a food stand", "make a choice", "send for the doctor"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) make a choice\n【用語】make a choice (v.phr.)：做選擇\n【中譯】店裡有好多蛋糕，而且看起來都很好吃。我沒辦法做選擇。", "explanationSource": "supplemental"}, {"id": 337, "question": "Our car ______ on the highway, so we had to call for help.", "options": ["paid off the money", "did its shopping", "passed away", "broke down"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) broke down\n【用語】break down (v.phr.)：（機器）故障、失靈\n【中譯】我們的車在高速公路上故障了，所以我們必須打電話求救。", "explanationSource": "supplemental"}, {"id": 338, "question": "I forgot to bring my pen to the test, so I ______.", "options": ["pulled away", "asked Amy for one", "turned fifteen", "took a look at the clock"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) asked Amy for one\n【用語】ask + 人 + for + N (v.phr.)：向某人要某物\n【中譯】我忘了帶筆來考試，所以我向艾咪要了一支。", "explanationSource": "supplemental"}, {"id": 339, "question": "The little boy ______ and said, \"Look! There's a big bird up there!\"", "options": ["cared for his mom", "learned English from his dad", "kept fit", "pointed at the tree"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) pointed at the tree\n【用語】point at + 人/物 (v.phr.)：指著\n【中譯】小男孩指著那棵樹說：「看！上面有一隻大鳥！」", "explanationSource": "supplemental"}, {"id": 340, "question": "Your room is so dirty! Please ______ before dinner.", "options": ["clean it up", "protect it from the rain", "take a guess", "make up a team"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) clean it up\n【用語】clean up + N (v.phr.)：打掃、整理\n【中譯】你的房間好髒！請在晚餐前把它打掃乾淨。", "explanationSource": "supplemental"}, {"id": 341, "question": "The heavy rain ______, so we played board games at home all day.", "options": ["turned fifteen", "kept fit", "kept us from going out", "beat the clock"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) kept us from going out\n【用語】keep (+ 人) from + V-ing (v.phr.)：使不能、避免\n【中譯】大雨讓我們無法出門，所以我們整天在家玩桌遊。", "explanationSource": "supplemental"}, {"id": 342, "question": "Dad is very sleepy this morning, so I'll ______ for him. He likes it with milk.", "options": ["take a guess", "change my mind", "get back", "make coffee"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) make coffee\n【用語】make coffee (v.phr.)：泡咖啡\n【中譯】爸爸今天早上很睏，所以我會幫他泡咖啡。他喜歡加牛奶。", "explanationSource": "supplemental"}, {"id": 343, "question": "The bus was late, so I read a comic book to ______.", "options": ["kill time", "appeal to people to save water", "keep a diary", "make up"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) kill time\n【用語】kill time (v.phr.)：消磨時間\n【中譯】公車誤點了，所以我看漫畫來消磨時間。", "explanationSource": "supplemental"}, {"id": 344, "question": "Dad just bought a new car. Let's ______ around the lake this afternoon!", "options": ["pop the question", "get into bed", "go for a ride", "clean up the kitchen"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) go for a ride\n【用語】go for a ride (v.phr.)：去兜風\n【中譯】爸爸剛買了一輛新車。我們今天下午去湖邊兜風吧！", "explanationSource": "supplemental"}]};</script><script>window.LEARN_DATA=[{"g": "", "t": "account for + N", "p": "(v.phr.)", "e": "explain why something happened", "z": "說明、解釋某事的原因", "s": "Jason could not _____ _____ his late arrival this morning, so the teacher asked him to stay after class and talk with her.", "c": "傑森無法【說明】他今天早上為什麼遲到，所以老師要他下課後留下來和她談談。", "f": "Jason could not account for his late arrival this morning, so the teacher asked him to stay after class and talk with her."}, {"g": "", "t": "account for + N", "p": "(v.phr.)", "e": "make up a part of a total", "z": "占了……比例", "s": "Girls _____ _____ about half of the students in our school, and many of them join the basketball team every year.", "c": "女生大約【占了】我們學校學生的一半，而且每年都有很多人加入籃球隊。", "f": "Girls account for about half of the students in our school, and many of them join the basketball team every year."}, {"g": "", "t": "act like + N", "p": "(v.phr.)", "e": "behave in the same way as someone", "z": "表現得像……", "s": "Even though Tony is already fourteen, he sometimes _____ _____ a little child when he can't get what he wants.", "c": "雖然東尼已經十四歲了，但他得不到想要的東西時，有時會【表現得像】個小孩。", "f": "Even though Tony is already fourteen, he sometimes acts like a little child when he can't get what he wants."}, {"g": "", "t": "adapt to + N/V-ing", "p": "(v.phr.)", "e": "change to fit a new place or situation", "z": "適應", "s": "When Amy moved from Canada to Taipei, it took her a few months to _____ _____ the hot weather and the busy streets.", "c": "當艾咪從加拿大搬到台北時，她花了幾個月才【適應】炎熱的天氣和繁忙的街道。", "f": "When Amy moved from Canada to Taipei, it took her a few months to adapt to the hot weather and the busy streets."}, {"g": "", "t": "add + N + to + N", "p": "(v.phr.)", "e": "put something into something else", "z": "把……加到……", "s": "My grandmother always _____ a little sugar _____ her tomato soup because she thinks it makes the taste much better.", "c": "我奶奶總是【把】一點糖【加到】她的番茄湯裡，因為她覺得這樣味道會好很多。", "f": "My grandmother always adds a little sugar to her tomato soup because she thinks it makes the taste much better."}, {"g": "", "t": "agree on + N", "p": "(v.phr.)", "e": "decide together about a plan", "z": "對……意見一致", "s": "After a long talk, my parents finally _____ _____ a place for our summer trip, and we are going to Hualien in July.", "c": "經過一番長談，我爸媽終於對暑假旅行的地點【意見一致】，我們七月要去花蓮。", "f": "After a long talk, my parents finally agreed on a place for our summer trip, and we are going to Hualien in July."}, {"g": "", "t": "agree to + N/VR", "p": "(v.phr.)", "e": "say yes to a plan or idea", "z": "同意（某事、提議）", "s": "Dad _____ _____ our idea of having a barbecue in the backyard, so we bought meat and corn at the supermarket.", "c": "爸爸【同意】我們在後院烤肉的提議，所以我們去超市買了肉和玉米。", "f": "Dad agreed to our idea of having a barbecue in the backyard, so we bought meat and corn at the supermarket."}, {"g": "", "t": "agree with + 人/N", "p": "(v.phr.)", "e": "have the same opinion as someone", "z": "同意（某人、看法）", "s": "I _____ _____ Peter that the new science teacher is very funny, because she always tells jokes when we feel sleepy.", "c": "我【同意】彼得的看法，新來的自然老師很有趣，因為我們想睡覺時她總是會講笑話。", "f": "I agree with Peter that the new science teacher is very funny, because she always tells jokes when we feel sleepy."}, {"g": "", "t": "agree with sb on sth", "p": "(v.phr.)", "e": "to have the same idea as someone about something", "z": "在某事上同意某人", "s": "My sister and I usually argue, but I _____ _____ her _____ the plan to buy Dad a new watch for his birthday.", "c": "我和姊姊常常吵架，但在買新手錶送爸爸當生日禮物這個計畫上，我【同意】她的看法。", "f": "My sister and I usually argue, but I agree with her on the plan to buy Dad a new watch for his birthday."}, {"g": "", "t": "answer the door", "p": "(v.phr.)", "e": "open the door when someone knocks", "z": "應門", "s": "Someone knocked loudly while Mom was cooking dinner, so she asked me to _____ _____ _____ for her.", "c": "媽媽在煮晚餐時有人大聲敲門，所以她叫我幫她去【應門】。", "f": "Someone knocked loudly while Mom was cooking dinner, so she asked me to answer the door for her."}, {"g": "", "t": "answer the phone", "p": "(v.phr.)", "e": "pick up a phone call", "z": "接電話", "s": "I was taking a shower when the phone rang, so my sister _____ _____ _____ and took a message for me.", "c": "電話響的時候我正在洗澡，所以我妹妹幫我【接電話】並記下留言。", "f": "I was taking a shower when the phone rang, so my sister answered the phone and took a message for me."}, {"g": "", "t": "appeal to + 人", "p": "(v.phr.)", "e": "be interesting or attractive to someone", "z": "吸引", "s": "Video games with cute animals often _____ _____ young children, so the toy store puts them near the front door.", "c": "有可愛動物的電玩常常【吸引】小孩子，所以玩具店把它們放在靠近前門的地方。", "f": "Video games with cute animals often appeal to young children, so the toy store puts them near the front door."}, {"g": "", "t": "appeal to + 人 + to + VR", "p": "(v.phr.)", "e": "strongly ask people to do something", "z": "呼籲", "s": "The city government _____ _____ people to save water this summer because it has not rained for almost two months.", "c": "市政府【呼籲】民眾今年夏天要節約用水，因為已經將近兩個月沒下雨了。", "f": "The city government appealed to people to save water this summer because it has not rained for almost two months."}, {"g": "", "t": "appeal to + N", "p": "(v.phr.)", "e": "ask a higher court to change a decision", "z": "上訴", "s": "The man did not think the judge's decision was fair, so he _____ _____ a higher court and asked for a new trial.", "c": "那名男子認為法官的判決不公平，所以他向更高一級的法院【上訴】，要求重新審判。", "f": "The man did not think the judge's decision was fair, so he appealed to a higher court and asked for a new trial."}, {"g": "", "t": "apply for + N", "p": "(v.phr.)", "e": "ask in writing for a job or place", "z": "申請、應徵", "s": "My older brother wants to earn some money this summer, so he will _____ _____ a part-time job at the coffee shop.", "c": "我哥哥今年夏天想賺點錢，所以他要去【應徵】咖啡店的兼職工作。", "f": "My older brother wants to earn some money this summer, so he will apply for a part-time job at the coffee shop."}, {"g": "", "t": "argue + that 子句", "p": "(v.phr.)", "e": "say that you believe something is true", "z": "主張；認為", "s": "Some students _____ _____ school should start at nine o'clock because they need more sleep in the morning.", "c": "有些學生【主張】學校應該九點才開始上課，因為他們早上需要更多睡眠。", "f": "Some students argue that school should start at nine o'clock because they need more sleep in the morning."}, {"g": "", "t": "arrive at/in + 地方", "p": "(v.phr.)", "e": "reach a place", "z": "抵達", "s": "We _____ _____ Tokyo late at night after a long flight, so we took a taxi to the hotel and went straight to bed.", "c": "經過長途飛行，我們深夜才【抵達】東京，所以我們搭計程車去飯店，然後直接上床睡覺。", "f": "We arrived in Tokyo late at night after a long flight, so we took a taxi to the hotel and went straight to bed."}, {"g": "", "t": "ask + 人 + a favor", "p": "(v.phr.)", "e": "to ask someone to help you with something", "z": "請……幫個忙", "s": "Could I _____ you _____ _____? I need someone to water my plants while my family is in Japan next week.", "c": "我可以【請你幫個忙】嗎？下週我家人去日本時，我需要有人幫我澆花。", "f": "Could I ask you a favor? I need someone to water my plants while my family is in Japan next week."}, {"g": "", "t": "ask + 人 + for + N", "p": "(v.phr.)", "e": "say you want something from someone", "z": "向某人要某物", "s": "When Leo lost his wallet at the station, he _____ a police officer _____ help, and she called his parents.", "c": "李歐在車站弄丟錢包時，他【請求】一位警察幫忙，她便打電話給他的父母。", "f": "When Leo lost his wallet at the station, he asked a police officer for help, and she called his parents."}, {"g": "", "t": "ask + 人 + for advice", "p": "(v.phr.)", "e": "to ask someone what you should do", "z": "向……請教意見", "s": "I didn't know which high school to choose, so I _____ my homeroom teacher _____ _____ because she knows me well.", "c": "我不知道要選哪所高中，所以我【向導師請教意見】，因為她很了解我。", "f": "I didn't know which high school to choose, so I asked my homeroom teacher for advice because she knows me well."}, {"g": "", "t": "ask + 人 + for help", "p": "(v.phr.)", "e": "to say you need someone to help you", "z": "向……請求幫助", "s": "The math homework was too hard, so Leo _____ his older sister _____ _____ after dinner.", "c": "數學作業太難了，所以里歐晚餐後【向姊姊求助】。", "f": "The math homework was too hard, so Leo asked his older sister for help after dinner."}, {"g": "", "t": "ask + 人 + to + VR", "p": "(v.phr.)", "e": "to say you want someone to do something", "z": "要求某人做……", "s": "The library was very quiet, so the librarian _____ the boys _____ turn off their phones and speak softly.", "c": "圖書館非常安靜，所以圖書館員【要求】那些男孩關掉手機、小聲說話。", "f": "The library was very quiet, so the librarian asked the boys to turn off their phones and speak softly."}, {"g": "", "t": "ask for + N", "p": "(v.phr.)", "e": "say that you want help or something", "z": "要求、請求（幫助）", "s": "When Wang Hao got lost in the big department store, he went to the information desk to _____ _____ help.", "c": "王浩在大型百貨公司迷路時，他去服務台【請求】幫助。", "f": "When Wang Hao got lost in the big department store, he went to the information desk to ask for help."}, {"g": "", "t": "ask for directions", "p": "(v.phr.)", "e": "to ask someone how to get to a place", "z": "問路", "s": "We got lost in the small streets of Jiufen, so my dad had to _____ _____ _____ at a tea shop before it got dark.", "c": "我們在九份的小巷子裡迷路了，所以爸爸只好在天黑前到一家茶館【問路】。", "f": "We got lost in the small streets of Jiufen, so my dad had to ask for directions at a tea shop before it got dark."}, {"g": "", "t": "ask for trouble", "p": "(v.phr.)", "e": "do something that will surely cause problems", "z": "自找麻煩；自找苦吃", "s": "If you play video games all night before the big exam, you are really _____ _____ _____, my friend.", "c": "朋友，如果你在大考前整晚打電動，你真的是在【自找麻煩】。", "f": "If you play video games all night before the big exam, you are really asking for trouble, my friend."}, {"g": "", "t": "ask sb out", "p": "(v.phr.)", "e": "invite someone to go on a date", "z": "邀請某人出去（約會）", "s": "Tom was nervous, but he finally _____ Amy _____ to see a movie on Saturday, and she happily said yes.", "c": "湯姆很緊張，但他終於【約】艾咪星期六【出去】看電影，而她開心地答應了。", "f": "Tom was nervous, but he finally asked Amy out to see a movie on Saturday, and she happily said yes."}, {"g": "", "t": "back up + N", "p": "(v.phr.)", "e": "support someone; say they are right", "z": "支持", "s": "When Ryan told the teacher that he did not break the window, all his classmates _____ him _____ because they saw what happened.", "c": "當萊恩告訴老師他沒有打破窗戶時，全班同學都【支持】他，因為他們看到了事情的經過。", "f": "When Ryan told the teacher that he did not break the window, all his classmates backed him up because they saw what happened."}, {"g": "", "t": "bark at + 人", "p": "(v.phr.)", "e": "make a loud dog sound toward someone", "z": "對…吠叫", "s": "Our neighbor's dog always _____ _____ the mail carrier when he comes, so he is afraid to open the gate.", "c": "每次郵差來的時候，鄰居的狗總是對他【狂吠】，所以他不敢打開大門。", "f": "Our neighbor's dog always barks at the mail carrier when he comes, so he is afraid to open the gate."}, {"g": "", "t": "be home to + N", "p": "(v.phr.)", "e": "the place where something lives", "z": "是……的家園、……的大本營", "s": "Taroko National Park _____ _____ _____ many kinds of birds and monkeys, so visitors often see wild animals when they hike there.", "c": "太魯閣國家公園【是】許多種鳥類和猴子【的家園】，所以遊客在那裡健行時常常看到野生動物。", "f": "Taroko National Park is home to many kinds of birds and monkeys, so visitors often see wild animals when they hike there."}, {"g": "", "t": "beat the clock", "p": "(v.phr.)", "e": "to finish something before time runs out", "z": "搶時間完成；趕在時間內完成", "s": "We had only ten minutes left before the bell, but our group worked together and _____ _____ _____ to finish the poster.", "c": "離鐘響只剩十分鐘，但我們這組同心協力，【趕在時間內】完成了海報。", "f": "We had only ten minutes left before the bell, but our group worked together and beat the clock to finish the poster."}, {"g": "", "t": "begin with + N", "p": "(v.phr.)", "e": "to start by doing or having something", "z": "以…開始", "s": "Every class in our school _____ _____ a short greeting, so the students stand up and say hello to the teacher.", "c": "我們學校每堂課都【以】簡短的問候【開始】，所以學生會起立向老師問好。", "f": "Every class in our school begins with a short greeting, so the students stand up and say hello to the teacher."}, {"g": "", "t": "believe in + N", "p": "(v.phr.)", "e": "think that something is real", "z": "相信…存在", "s": "My little brother still _____ _____ Santa Claus, so he puts a big sock next to his bed every Christmas Eve.", "c": "我弟弟仍然【相信有】聖誕老人，所以他每年平安夜都在床邊放一隻大襪子。", "f": "My little brother still believes in Santa Claus, so he puts a big sock next to his bed every Christmas Eve."}, {"g": "", "t": "belong to + 人", "p": "(v.phr.)", "e": "be owned by someone", "z": "屬於", "s": "The teacher found a blue pencil box under the desk and asked the class if it _____ _____ anyone, but nobody answered.", "c": "老師在桌子底下發現一個藍色鉛筆盒，問全班它是不是【屬於】某個人的，但沒有人回答。", "f": "The teacher found a blue pencil box under the desk and asked the class if it belonged to anyone, but nobody answered."}, {"g": "", "t": "blow + 物 + away", "p": "(v.phr.)", "e": "to move something far away with wind", "z": "吹走", "s": "We were having a picnic in the park when a strong wind suddenly _____ our paper plates _____, so we had to run after them.", "c": "我們正在公園野餐時，突然一陣強風把我們的紙盤【吹走】了，所以我們只好追著跑。", "f": "We were having a picnic in the park when a strong wind suddenly blew our paper plates away, so we had to run after them."}, {"g": "", "t": "blow down + N", "p": "(v.phr.)", "e": "to make something fall because of strong wind", "z": "吹倒", "s": "The typhoon last night was so strong that it _____ _____ several big trees in the park, and workers are cleaning up now.", "c": "昨晚的颱風強到【吹倒】了公園裡好幾棵大樹，工人們現在正在清理。", "f": "The typhoon last night was so strong that it blew down several big trees in the park, and workers are cleaning up now."}, {"g": "", "t": "blow out + N", "p": "(v.phr.)", "e": "to stop a fire by blowing air at it", "z": "吹熄", "s": "After we sang the birthday song for Mia, she made a wish and _____ _____ all twelve candles on her chocolate cake.", "c": "我們為米亞唱完生日歌後，她許了個願，然後【吹熄】巧克力蛋糕上的十二根蠟燭。", "f": "After we sang the birthday song for Mia, she made a wish and blew out all twelve candles on her chocolate cake."}, {"g": "", "t": "blow over + N", "p": "(v.phr.)", "e": "(wind) push something so it falls", "z": "吹倒", "s": "The strong typhoon _____ _____ many trees in our neighborhood last night, so the streets were full of branches.", "c": "昨晚強烈颱風【吹倒】了我們社區很多樹，所以街上滿是樹枝。", "f": "The strong typhoon blew over many trees in our neighborhood last night, so the streets were full of branches."}, {"g": "", "t": "book a room", "p": "(v.phr.)", "e": "to ask a hotel to keep a room for you", "z": "訂房間", "s": "Before our family trip to Hualien, Dad _____ _____ _____ at a small hotel near the beach so we could see the ocean.", "c": "在我們全家去花蓮旅行之前，爸爸在海邊附近的一家小旅館【訂了房間】，這樣我們就能看到海。", "f": "Before our family trip to Hualien, Dad booked a room at a small hotel near the beach so we could see the ocean."}, {"g": "", "t": "borrow + 物 + from + 人", "p": "(v.phr.)", "e": "to take something and give it back later", "z": "向某人借（東西）", "s": "I forgot my umbrella at home this morning, so I _____ one _____ my classmate Sandy because it was raining heavily after school.", "c": "我今天早上把雨傘忘在家裡，所以我【向】同學珊蒂【借】了一把，因為放學後雨下得很大。", "f": "I forgot my umbrella at home this morning, so I borrowed one from my classmate Sandy because it was raining heavily after school."}, {"g": "", "t": "bow to + 人", "p": "(v.phr.)", "e": "bend your body forward to someone", "z": "對……鞠躬", "s": "In Japan, students usually _____ _____ their teachers when they meet them at school, and it shows respect and good manners.", "c": "在日本，學生在學校遇到老師時通常會【向老師鞠躬】，這表現出尊重和禮貌。", "f": "In Japan, students usually bow to their teachers when they meet them at school, and it shows respect and good manners."}, {"g": "", "t": "break + N + into + N", "p": "(v.phr.)", "e": "to make something into smaller pieces", "z": "破成…；分成…", "s": "The teacher _____ the big chocolate bar _____ ten small pieces so that every student in the group could have one.", "c": "老師把大巧克力棒【分成】十小塊，好讓組裡每個學生都能吃到一塊。", "f": "The teacher broke the big chocolate bar into ten small pieces so that every student in the group could have one."}, {"g": "", "t": "break a bad habit", "p": "(v.phr.)", "e": "to stop doing something bad you often do", "z": "改掉壞習慣", "s": "Peter wants to _____ _____ _____ _____, so he puts his phone in the living room before bed and reads a book instead.", "c": "Peter 想要【改掉壞習慣】，所以睡前他把手機放在客廳，改讀一本書。", "f": "Peter wants to break a bad habit, so he puts his phone in the living room before bed and reads a book instead."}, {"g": "", "t": "break down", "p": "(v.phr.)", "e": "stop working (of hr.)", "e": "do better than anyone has done before", "z": "打破紀錄", "s": "Our school's fastest runner _____ _____ _____ in the 100-meter race yesterday, and all of us cheered for her loudly.", "c": "我們學校跑最快的選手昨天在百米賽跑中【打破了紀錄】，我們全都大聲為她歡呼。", "f": "Our school's fastest runner broke the record in the 100-meter race yesterday, and all of us cheered for her loudly."}, {"g": "", "t": "break the world record", "p": "(v.phr.)", "e": "to do better than the best result ever", "z": "打破世界紀錄", "s": "Everyone in the stadium stood up and cheered when the young runner from Kenya _____ _____ _____ _____ in the 100-meter race.", "c": "當那位來自肯亞的年輕跑者在百米賽跑中【打破世界紀錄】時，體育場裡的每個人都站起來歡呼。", "f": "Everyone in the stadium stood up and cheered when the young runner from Kenya broke the world record in the 100-meter race."}, {"g": "", "t": "break up", "p": "(v.phr.)", "e": "break into many small pieces", "z": "破碎、斷成碎片", "s": "The old wooden boat hit the rocks during the storm and began to _____ _____ into small pieces, so the fishermen swam to the beach.", "c": "那艘老木船在暴風雨中撞上岩石，開始【碎裂】成小塊，所以漁夫們游到了海灘上。", "f": "The old wooden boat hit the rocks during the storm and began to break up into small pieces, so the fishermen swam to the beach."}, {"g": "", "t": "break up", "p": "(v.phr.)", "e": "end or come apart", "z": "結束、分離", "s": "The class meeting _____ _____ at five o'clock, and all the students went home happily because it was Friday.", "c": "班會在五點【結束】，因為是星期五，所有學生都開心地回家了。", "f": "The class meeting broke up at five o'clock, and all the students went home happily because it was Friday."}, {"g": "", "t": "break up (with + 人)", "p": "(v.phr.)", "e": "end a relationship; stop being a group", "z": "分手、解散", "s": "My favorite band _____ _____ last year because the members wanted to do different things, so I was really sad when I heard the news.", "c": "我最喜歡的樂團去年【解散】了，因為成員們想做不同的事，所以我聽到這個消息時真的很難過。", "f": "My favorite band broke up last year because the members wanted to do different things, so I was really sad when
