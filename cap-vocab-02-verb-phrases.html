me true when he joined the national team last summer."}, {"g": "", "t": "come up with + N", "p": "(v.phr.)", "e": "think of an idea or plan", "z": "想出", "s": "Our group needed a name for the school project, and Ivy _____ _____ _____ a funny idea that everyone liked very much.", "c": "我們這組的學校專題需要一個名字，艾薇【想出】了一個大家都很喜歡的有趣點子。", "f": "Our group needed a name for the school project, and Ivy came up with a funny idea that everyone liked very much."}, {"g": "", "t": "comment on + N", "p": "(v.phr.)", "e": "say what you think about something", "z": "評論某事", "s": "Many people _____ _____ the singer's new song online, and most of them said it was beautiful and touching.", "c": "很多人在網路上【評論】那位歌手的新歌，大部分的人都說歌曲優美又感人。", "f": "Many people commented on the singer's new song online, and most of them said it was beautiful and touching."}, {"g": "", "t": "communicate with + 人", "p": "(v.phr.)", "e": "to share ideas or news with someone", "z": "和…溝通", "s": "My cousin lives in Canada, so we _____ _____ each other by video calls every weekend and share photos of our lives.", "c": "我表哥住在加拿大，所以我們每個週末用視訊【和】彼此【溝通】，並分享生活照片。", "f": "My cousin lives in Canada, so we communicate with each other by video calls every weekend and share photos of our lives."}, {"g": "", "t": "compare + N + with + N", "p": "(v.phr.)", "e": "look at how two things are different", "z": "與……相比、比較……和……", "s": "If you _____ prices at the night market _____ prices at the department store, you will find the night market is much cheaper.", "c": "如果你【比較夜市和百貨公司的價格】，你會發現夜市便宜多了。", "f": "If you compare prices at the night market with prices at the department store, you will find the night market is much cheaper."}, {"g": "", "t": "complain about + N/V-ing", "p": "(v.phr.)", "e": "say you are unhappy with something", "z": "抱怨", "s": "Many students _____ _____ the hot classrooms in June, so the school decided to buy new air conditioners.", "c": "很多學生【抱怨】六月的教室太熱，所以學校決定買新的冷氣機。", "f": "Many students complained about the hot classrooms in June, so the school decided to buy new air conditioners."}, {"g": "", "t": "concentrate on + N/V-ing", "p": "(v.phr.)", "e": "think about only one thing", "z": "專注於", "s": "It is hard for me to _____ _____ my homework when my brother is playing loud music in the next room.", "c": "當我弟弟在隔壁房間大聲放音樂時，我很難【專心】寫作業。", "f": "It is hard for me to concentrate on my homework when my brother is playing loud music in the next room."}, {"g": "", "t": "consider + N + to be + adj./N", "p": "(v.phr.)", "e": "think that someone or something is", "z": "認為…是…", "s": "Everyone in our class _____ Mr. Lin _____ _____ the funniest teacher because he tells jokes before every math test.", "c": "我們班上每個人都【認為】林老師【是】最有趣的老師，因為他每次數學考試前都會講笑話。", "f": "Everyone in our class considers Mr. Lin to be the funniest teacher because he tells jokes before every math test."}, {"g": "", "t": "consider + N + to be + N/adj.", "p": "(v.phr.)", "e": "think that someone or something is so", "z": "認為……是……", "s": "Most students _____ Mr. Wang _____ _____ the funniest teacher in our school, because he tells great jokes in class.", "c": "大部分學生都【認為】王老師【是】我們學校最有趣的老師，因為他上課很會講笑話。", "f": "Most students consider Mr. Wang to be the funniest teacher in our school, because he tells great jokes in class."}, {"g": "", "t": "consider + V-ing", "p": "(v.phr.)", "e": "think about doing something", "z": "考慮做…", "s": "My parents are _____ moving to Taichung because my dad got a new job there, but I don't want to leave my friends.", "c": "我爸媽正在【考慮】搬到台中，因為爸爸在那裡找到新工作，但我不想離開我的朋友。", "f": "My parents are considering moving to Taichung because my dad got a new job there, but I don't want to leave my friends."}, {"g": "", "t": "consider others' feelings", "p": "(v.phr.)", "e": "think about how other people feel", "z": "考慮別人的感受", "s": "Lily wanted to laugh at Ben's haircut, but she decided to _____ _____ _____ and said it looked nice instead.", "c": "Lily想笑Ben的髮型，但她決定【考慮別人的感受】，反而說看起來很好看。", "f": "Lily wanted to laugh at Ben's haircut, but she decided to consider others' feelings and said it looked nice instead."}, {"g": "", "t": "consist of + N", "p": "(v.phr.)", "e": "be made of these parts", "z": "由……組成、包括", "s": "Our school basketball team _____ _____ twelve players, and most of them practice in the gym every morning before class.", "c": "我們學校的籃球隊【由十二名球員組成】，他們大部分每天早上上課前都在體育館練習。", "f": "Our school basketball team consists of twelve players, and most of them practice in the gym every morning before class."}, {"g": "", "t": "contribute to + N", "p": "(v.phr.)", "e": "to be one reason for something", "z": "導致；造成", "s": "Too many cars and scooters on the road _____ _____ the dirty air in big cities, so the government wants people to take the MRT.", "c": "路上太多汽車和機車【造成】大城市空氣髒，所以政府希望大家搭捷運。", "f": "Too many cars and scooters on the road contribute to the dirty air in big cities, so the government wants people to take the MRT."}, {"g": "", "t": "copy the answer", "p": "(v.phr.)", "e": "write down another person's answer as your own", "z": "抄襲答案", "s": "Kevin tried to _____ _____ _____ from his classmate during the math test, but the teacher saw him and got angry.", "c": "凱文數學考試時想【抄同學的答案】，但老師看到了，非常生氣。", "f": "Kevin tried to copy the answer from his classmate during the math test, but the teacher saw him and got angry."}, {"g": "", "t": "copy the behavior", "p": "(v.phr.)", "e": "do the same things that another person does", "z": "模仿行為", "s": "Little kids often _____ _____ _____ of their parents, so Mom and Dad should be careful about what they do.", "c": "小孩常常【模仿父母的行為】，所以爸媽應該小心自己的所作所為。", "f": "Little kids often copy the behavior of their parents, so Mom and Dad should be careful about what they do."}, {"g": "", "t": "count me in", "p": "(v.phr.)", "e": "I want to join too", "z": "算我一份", "s": "If you are planning a bike trip around Sun Moon Lake this weekend, please _____ _____ _____, because I love riding bikes!", "c": "如果你們這個週末打算騎腳踏車環日月潭，請【算我一份】，因為我超愛騎腳踏車！", "f": "If you are planning a bike trip around Sun Moon Lake this weekend, please count me in, because I love riding bikes!"}, {"g": "", "t": "cover + 人", "p": "(v.phr.)", "e": "do someone's work when they are away", "z": "幫助某人（頂替；代替）", "s": "Mia was sick yesterday, so Ken agreed to _____ her at the bakery and worked her afternoon shift.", "c": "Mia 昨天生病，所以 Ken 答應在麵包店【代替】她，上了她的下午班。", "f": "Mia was sick yesterday, so Ken agreed to cover her at the bakery and worked her afternoon shift."}, {"g": "", "t": "cover one's eyes", "p": "(v.phr.)", "e": "put your hands over your eyes", "z": "遮住眼睛", "s": "My sister always _____ her _____ during the scary parts of the movie, but she still wants to watch it.", "c": "我姊姊在電影恐怖的片段總是【遮住眼睛】，但她還是想看。", "f": "My sister always covers her eyes during the scary parts of the movie, but she still wants to watch it."}, {"g": "", "t": "cover the bill", "p": "(v.phr.)", "e": "pay the money for something", "z": "支付（費用）", "s": "We had a big dinner for Grandpa's birthday, and my uncle offered to _____ _____ _____ for the whole family.", "c": "我們為爺爺的生日吃了一頓大餐，叔叔主動說要幫全家人【付帳】。", "f": "We had a big dinner for Grandpa's birthday, and my uncle offered to cover the bill for the whole family."}, {"g": "", "t": "cover the news/event", "p": "(v.phr.)", "e": "report a news story on TV or in papers", "z": "報導（新聞、事件）", "s": "Many reporters came to the school to _____ _____ _____ because our baseball team won the national championship.", "c": "許多記者來學校【報導這場盛事】，因為我們的棒球隊贏得了全國冠軍。", "f": "Many reporters came to the school to cover the event because our baseball team won the national championship."}, {"g": "", "t": "cross the street", "p": "(v.phr.)", "e": "go to the other side of a road", "z": "過馬路", "s": "Always look left and right before you _____ _____ _____, especially when there are many scooters around the school.", "c": "【過馬路】之前一定要左右看，尤其是學校附近有很多機車的時候。", "f": "Always look left and right before you cross the street, especially when there are many scooters around the school."}, {"g": "", "t": "cry for help", "p": "(v.phr.)", "e": "shout because you need someone to save you", "z": "呼救；求救", "s": "When Leo fell into the deep water at the beach, he started to _____ _____ _____, and a lifeguard swam to him quickly.", "c": "Leo 在海邊掉進深水裡時，他開始【呼救】，一位救生員很快游向他。", "f": "When Leo fell into the deep water at the beach, he started to cry for help, and a lifeguard swam to him quickly."}, {"g": "", "t": "cut costs", "p": "(v.phr.)", "e": "spend less money", "z": "降低成本", "s": "The bakery started to buy flour from a cheaper farm to _____ _____, but the bread still tastes just as good.", "c": "那家麵包店開始向較便宜的農場買麵粉來【降低成本】，但麵包還是一樣好吃。", "f": "The bakery started to buy flour from a cheaper farm to cut costs, but the bread still tastes just as good."}, {"g": "", "t": "cut down + N", "p": "(v.phr.)", "e": "make something shorter or smaller", "z": "減短、縮減", "s": "The school decided to _____ _____ the long morning meeting from forty minutes to twenty, so students would have more time to study.", "c": "學校決定把冗長的朝會從四十分鐘【縮短】為二十分鐘，這樣學生就有更多時間讀書。", "f": "The school decided to cut down the long morning meeting from forty minutes to twenty, so students would have more time to study."}, {"g": "", "t": "cut down + N", "p": "(v.phr.)", "e": "cut a tree so that it falls", "z": "砍倒（樹）", "s": "The city wants to _____ _____ the old trees in the park to build a parking lot, but many people are angry.", "c": "市政府想把公園裡的老樹【砍掉】來蓋停車場，但很多人很生氣。", "f": "The city wants to cut down the old trees in the park to build a parking lot, but many people are angry."}, {"g": "", "t": "cut down on + N", "p": "(v.phr.)", "e": "eat or use less of something", "z": "減少（攝取、使用）", "s": "The doctor told my uncle to _____ _____ _____ salt and fried food because he had high blood pressure and needed to stay healthy.", "c": "醫生告訴我叔叔要【減少攝取】鹽和油炸食物，因為他有高血壓，需要保持健康。", "f": "The doctor told my uncle to cut down on salt and fried food because he had high blood pressure and needed to stay healthy."}, {"g": "", "t": "cut down trees", "p": "(v.phr.)", "e": "to make tr e thick forest for hours, but they finally _____ _____ _____ _____ it before it got dark.", "c": "那些登山客在茂密的森林裡困了好幾個小時，但他們終於在天黑前【找到出路】走出了森林。", "f": "The hikers were stuck in the thick forest for hours, but they finally found the way through it before it got dark."}, {"g": "", "t": "fit in", "p": "(v.phr.)", "e": "to feel like part of a group", "z": "融入、適合", "s": "Annie was worried that she would not _____ _____ at her new school, but her classmates were very friendly to her.", "c": "安妮擔心自己無法【融入】新學校，但同學們都對她很友善。", "f": "Annie was worried that she would not fit in at her new school, but her classmates were very friendly to her."}, {"g": "", "t": "fix past mistakes", "p": "(v.phr.)", "e": "to make wrong things you did right", "z": "修正過去的錯誤", "s": "You can't change yesterday, but you can learn from it and _____ _____ _____ by working harder this semester.", "c": "你無法改變昨天，但你可以從中學習，並透過這學期更努力來【修正過去的錯誤】。", "f": "You can't change yesterday, but you can learn from it and fix past mistakes by working harder this semester."}, {"g": "", "t": "fly a plane", "p": "(v.phr.)", "e": "to control a plane in the sky", "z": "開飛機", "s": "My uncle is a pilot, and he has _____ _____ _____ to many countries, so he always brings us interesting gifts from his trips.", "c": "我叔叔是飛行員，他曾【開飛機】到過很多國家，所以他總是從旅程中帶有趣的禮物給我們。", "f": "My uncle is a pilot, and he has flown a plane to many countries, so he always brings us interesting gifts from his trips."}, {"g": "", "t": "focus on + N/V-ing", "p": "(v.phr.)", "e": "to give all your attention to something", "z": "專注於、集中於", "s": "Please turn off your phone and _____ _____ your homework, or you will not finish it before dinner.", "c": "請把手機關掉，【專注於】你的功課，不然你晚餐前會寫不完。", "f": "Please turn off your phone and focus on your homework, or you will not finish it before dinner."}, {"g": "", "t": "follow the law", "p": "(v.phr.)", "e": "do what the law says", "z": "遵守法律", "s": "Drivers must _____ _____ _____ and stop at red lights, or the police will give them a ticket.", ble", "p": "(v.phr.)", "e": "be in a bad situation because you did wrong", "z": "惹上麻煩", "s": "If you use your phone during the exam, you will _____ _____ _____ with the teacher, so please put it away now.", "c": "如果你考試時用手機，你會在老師那裡【惹上麻煩】，所以現在請把手機收起來。", "f": "If you use your phone during the exam, you will get in trouble with the teacher, so please put it away now."}, {"g": "", "t": "get into + N", "p": "(v.phr.)", "e": "go inside a place", "z": "進入", "s": "The museum door was locked, so we couldn't _____ _____ the building until a guard opened it at nine.", "c": "博物館的門鎖著，所以直到警衛九點開門前，我們都無法【進入】大樓。", "f": "The museum door was locked, so we couldn't get into the building until a guard opened it at nine."}, {"g": "", "t": "get it", "p": "(v.phr.)", "e": "understand something", "z": "懂了；理解了", "s": "When the teacher explained the math problem for the third time, Kevin finally smiled and said, \"Oh, I _____ _____ now!\"", "c": "老師第三次解釋那道數學題時，凱文終於笑著說：「喔，我現在【懂了】！」", "f": "When the teacher explained the math problem for the third time, Kevin finally smiled and said, \"Oh, I get it now!\""}, {"g": "", "t": "get it even", "p": "(v.phr.)", "e": "make something flat or equal on all sides", "z": "把它弄平；弄平均", "s": "The cake was higher on one side, so Mom used a long knife to _____ _____ _____ before she added the cream.", "c": "蛋糕一邊比較高，所以媽媽在抹奶油之前先用長刀【把它弄平】。", "f": "The cake was higher on one side, so Mom used a long knife to get it even before she added the cream."}, {"g": "", "t": "get it wrong", "p": "(v.phr.)", "e": "understand or do something in the wrong way", "z": "搞錯；弄錯", "s": "I thought the party was on Saturday, but I _____ _____ _____ because it was actually on Friday night.", "c": "我以為派對在星期六，但我【搞錯了】，因為派對其實是在星期五晚上。", "f": "I thought the party was on Saturday, but I got it wrong because it was actually on Friday night."}, {"g": "", "t": "get off + N", "p": "(v.phr.)", "e": "to leave a bus, train, or plane", "z": "下（車、船、飛機）", "s": "We have to _____ _____ the bus at the next stop, so please hold your bag and stand up now.", "c": "我們要在下一站【下】公車，所以請拿好你的包包，現在站起來。", "f": "We have to get off the bus at the next stop, so please hold your bag and stand up now."}, {"g": "", "t": "get off the bus/train/plane/MRT/gondola", "p": "(v.phr.)", "e": "leave a big vehicle you can stand in", "z": "下公車／火車／飛機／捷運／纜車（可站立）", "s": "Please _____ _____ _____ _____ at Taipei Zoo Station, and I will wait for you at Exit 1.", "c": "請在動物園站【下捷運】，我會在一號出口等你。", "f": "Please get off the MRT at Taipei Zoo Station, and I will wait for you at Exit 1."}, {"g": "", "t": "get on + N", "p": "(v.phr.)", "e": "to go onto a bus, train, or plane", "z": "上（車、船、飛機）", "s": "When the train arrived, everyone hurried to _____ _____ because it was raining hard and there were few seats.", "c": "火車到站時，大家急著【上車】，因為雨下得很大，而且座位很少。", "f": "When the train arrived, everyone hurried to get on because it was raining hard and there were few seats."}, {"g": "", "t": "get on the bus/train/plane/MRT/gondola", "p": "(v.phr.)", "e": "go into a big vehicle you can stand in", "z": "上公車／火車／飛機／捷運／纜車（可站立）", "s": "We waited on the platform for ten minutes, and as soon as the doors opened, we _____ _____ _____ _____ and found seats.", "c": "我們在月台等了十分鐘，門一打開，我們就【上了火車】並找到座位。", "f": "We waited on the platform for ten minutes, and as soon as the doors opened, we got on the train and found seats."}, {"g": "", "t": "get one's (own) way", "p": "(v.phr.)", "e": "to get what you want", "z": "為所欲為、隨心所欲", "s": "Little Max cries loudly in the toy store whenever he wants something, because he always _____ his _____ in the end.", "c": "小麥克斯在玩具店想要東西時就會大哭，因為他最後總是能【隨心所欲】。", "f": "Little Max cries loudly in the toy store whenever he wants something, because he always gets his way in the end."}, {"g": "", "t": "get out of + 地方", "p": "(v.phr.)", "e": "leave a car, room or building", "z": "出來；離開（車、房間等）", "s": "When the bus stopped, we _____ _____ _____ it quickly because it was raining and the bus was full.", "c": "公車停下來時，我們很快地【下了】車，因為正 ": "(v.phr.)", "e": "clap loudly for someone", "z": "給某人熱烈掌聲", "s": "After the little girl finished playing the piano at the school concert, everyone _____ her _____ _____ _____ to thank her.", "c": "那個小女孩在學校音樂會彈完鋼琴後，大家都為她【熱烈鼓掌】來感謝她。", "f": "After the little girl finished playing the piano at the school concert, everyone gave her a big hand to thank her."}, {"g": "", "t": "give + 人 + a ride", "p": "(v.phr.)", "e": "drive someone somewhere in your car", "z": "載某人一程", "s": "It was raining heavily after school, so my dad drove by and _____ me _____ _____ home in his new car.", "c": "放學後雨下得很大，所以我爸爸開著他的新車經過，【載我一程】回家。", "f": "It was raining heavily after school, so my dad drove by and gave me a ride home in his new car."}, {"g": "", "t": "give away + N", "p": "(v.phr.)", "e": "to give something for free", "z": "贈送", "s": "The bookstore will _____ _____ bookmarks to the first fifty customers this Saturday, so let's go there early.", "c": "這家書店這週六會【贈送】書籤給前五十位顧客，所以我們早點去吧。", "f": "The bookstore will give away bookmarks to the first fifty customers this Saturday, so let's go there early."}, {"g": "", "t": "give away + N", "p": "(v.phr.)", "e": "to tell a secret by mistake", "z": "洩露（祕密）", "s": "We planned a surprise party for Dad, but my little brother almost _____ _____ the secret at breakfast.", "c": "我們幫爸爸計畫了一場驚喜派對，但我弟弟早餐時差點【洩露】了秘密。", "f": "We planned a surprise party for Dad, but my little brother almost gave away the secret at breakfast."}, {"g": "", "t": "give back + N", "p": "(v.phr.)", "e": "to return something to its owner", "z": "歸還", "s": "Can you please _____ _____ the comic book I lent you last week, because my cousin wants to read it too?", "c": "你可以【歸還】我上星期借你的漫畫書嗎？因為我表弟也想看。", "f": "Can you please give back the comic book I lent you last week, because my cousin wants to read it too?"}, {"g": "", "t": "give directions", "p": "(v.phr.)", "e": "to tell someone how to get to a place", "z": "指路；說明路線", "s": "A tourist from Korea looked lost at the train station, so Jessica walked over and _____ _____ to her in simple English.", "c": "一位來自韓國的觀光客在火車站看起來迷路了，所以潔西卡走過去，用簡單的英文為她【指路】。", "f": "A tourist from Korea looked lost at the train station, so Jessica walked over and gave directions to her in simple English."}, {"g": "", "t": "give in (to + N)", "p": "(v.phr.)", "e": "to finally agree after saying no", "z": "讓步、屈服", "s": "My sister asked for a puppy every day for a month, and finally our parents _____ _____ and said yes.", "c": "我妹妹一個月來每天都要求養小狗，最後爸媽終於【讓步】答應了。", "f": "My sister asked for a puppy every day for a month, and finally our parents gave in and said yes."}, {"g": "", "t": "give it a shot", "p": "(v.phr.)", "e": "try to do something new or difficult", "z": "試試看", "s": "I have never played tennis before, but my coach says it is easy, so I will _____ _____ _____ _____ this weekend.", "c": "我以前從來沒打過網球，但教練說很簡單，所以我這個週末會【試試看】。", "f": "I have never played tennis before, but my coach says it is easy, so I will give it a shot this weekend."}, {"g": "", "t": "give it a try", "p": "(v.phr.)", "e": "try to do something", "z": "試一試", "s": "Hsin-yi had never eaten stinky tofu before, but her friends said it was delicious, so she decided to _____ _____ _____ _____.", "c": "心怡從沒吃過臭豆腐，但朋友說很好吃，所以她決定【試一試】。", "f": "Hsin-yi had never eaten stinky tofu before, but her friends said it was delicious, so she decided to give it a try."}, {"g": "", "t": "give me a ring/call", "p": "(v.phr.)", "e": "to phone me", "z": "打電話給我", "s": "If you need someone to drive you home after cram school tonight, just _____ _____ _____ _____ and I will pick you up.", "c": "如果你今晚補習班下課需要有人載你回家，就【打電話給我】，我會去接你。", "f": "If you need someone to drive you home after cram school tonight, just give me a call and I will pick you up."}, {"g": "", "t": "give off + N", "p": "(v.phr.)", "e": "to send out a smell, light, or heat", "z": "散發出（氣味、光、熱）", "s": "The durian on the kitchen table _____ _____ such a strong smell that my brother refused to come in.", "c": "廚房桌上的榴槤【散發出】非常濃的味道，所以我弟弟拒絕進來。", "f": "The durian on the kitchen table gave off such a strong smell that my brother refused to come in."}, {"g": "", "t": "give out + N", "p": "(v.phr.)", "e": "to hand things to many people", "z": "分發、分送", "s": "The teacher will _____ _____ the test papers at nine, so please put your books away and get your pencils ready.", "c": "老師九點會【分發】考卷，所以請把書收起來，準備好你的鉛筆。", "f": "The teacher will give out the test papers at nine, so please put your books away and get your pencils ready."}, {"g": "", "t": "give out + N", "p": "(v.phr.)", "e": "to send out sound or light", "z": "發出（聲音、光）", "s": "The old lamp in my bedroom _____ _____ only a weak light, so I can't read my comic books at night.", "c": "我房間的舊檯燈只【發出】微弱的光，所以我晚上沒辦法看漫畫。", "f": "The old lamp in my bedroom gives out only a weak light, so I can't read my comic books at night."}, {"g": "", "t": "give sb a hand", "p": "(v.phr.)", "e": "to help someone", "z": "幫助某人", "s": "The boxes of books were so heavy that Ms. Chen asked two students to _____ her _____ _____ carrying them.", "c": "那幾箱書重到陳老師請兩位同學【幫她的忙】一起搬。", "f": "The boxes of books were so heavy that Ms. Chen asked two students to give her a hand carrying them."}, {"g": "", "t": "give up + N", "p": "(v.phr.)", "e": "to let someone else have your seat", "z": "讓出（座位）", "s": "A kind high school student _____ _____ his seat on the MRT to a woman who was carrying a baby.", "c": "一位好心的高中生在捷運上把座位【讓出】給一位抱著嬰兒的女士。", "f": "A kind high school student gave up his seat on the MRT to a woman who was carrying a baby."}, {"g": "", "t": "give up + N/V-ing", "p": "(v.phr.)", "e": "to stop trying", "z": "放棄", "s": "The mountain trail was long and steep, but we did not _____ _____ because we wanted to see the sunrise at the top.", "c": "山路又長又陡，但我們沒有【放棄】，因為我們想在山頂看日出。", "f": "The mountain trail was long and steep, but we did not give up because we wanted to see the sunrise at the top."}, {"g": "", "t": "give up + N/V-ing", "p": "(v.phr.)", "e": "to stop a bad habit", "z": "戒除", "s": "Uncle Wu decided to _____ _____ drinking soda every day after the doctor said he was gaining too much weight.", "c": "吳叔叔在醫生說他體重增加太多之後，決定【戒除】每天喝汽水的習慣。", "f": "Uncle Wu decided to give up drinking soda every day after the doctor said he was gaining too much weight."}, {"g": "", "t": "give way to + N", "p": "(v.phr.)", "e": "to be replaced by something else", "z": "被...取代", "s": "Many old paper maps have _____ _____ _____ phone apps, because people can find places faster and more easily with them.", "c": "許多舊的紙本地圖已經【被】手機應用程式【取代】，因為人們用它們可以更快、更容易找到地點。", "f": "Many old paper maps have given way to phone apps, because people can find places faster and more easily with them."}, {"g": "", "t": "go + V-ing", "p": "(v.phr.)", "e": "to go out to do a fun activity", "z": "從事某種休閒活動", "s": "On hot summer days, my friends and I often _____ swimming at the city pool, and then we buy cold drinks on the way home.", "c": "炎熱的夏天，我和朋友常到市立游泳池【去游泳】，然後在回家路上買冷飲。", "f": "On hot summer days, my friends and I often go swimming at the city pool, and then we buy cold drinks on the way home."}, {"g": "", "t": "go abroad", "p": "(v.phr.)", "e": "to travel to another country", "z": "出國", "s": "Many students want to _____ _____ to study English after they graduate, but it costs a lot of money, so they save for years.", "c": "很多學生畢業後想【出國】念英文，但那要花很多錢，所以他們存了好幾年的錢。", "f": "Many students want to go abroad to study English after they graduate, but it costs a lot of money, so they save for years."}, {"g": "", "t": "go ahead", "p": "(v.phr.)", "e": "to move forward", "z": "前進", "s": "The road was clear after the rain stopped, so the bus driver decided to _____ _____ toward the mountain village.", "c": "雨停後道路暢通，所以公車司機決定朝山村【前進】。", "f": "The road was clear after the rain stopped, so the bus driver decided to go ahead toward the mountain village."}, {"g": "", "t": "go ahead (with + N)", "p": "(v.phr.)", "e": "to start or do something; you may do it", "z": "開始做、儘管做", "s": "When Kevin asked if he could use the computer in the library, the teacher smiled and said, \"Sure, _____ _____.\"", "c": "當Kevin問他能不能用圖書館的電腦時，老師微笑著說：「當然，【儘管用吧】。」", "f": "When Kevin asked if he could use the computer in the library, the teacher smiled and said, \"Sure, go ahead.\""}, {"g": "", "t": "go along", "p": "(v.phr.)", "e": "happen or develop", "z": "進行；發展", "s": "Our science project is _____ _____ well, and we think we can finish it before the deadline next Friday.", "c": "我們的科學專題【進行】得很順利，我們認為可以在下週五截止日前完成。", "f": "Our science project is going along well, and we think we can finish it before the deadline next Friday."}, {"g": "", "t": "go along with + N", "p": "(v.phr.)", "e": "agree with an idea or plan", "z": "贊同；同意", "s": "At first I wanted to see a movie, but I _____ _____ _____ my sister's idea and we visited the zoo.", "c": "一開始我想看電影，但我【同意】了姊姊的主意，於是我們去了動物園。", "f": "At first I wanted to see a movie, but I went along with my sister's idea and we visited the zoo."}, {"g": "", "t": "go away", "p": "(v.phr.)", "e": "to leave a place or person", "z": "離開", "s": "The little dog kept barking at the mailman, and it would not _____ _____ until my mom called it inside.", "c": "小狗一直對著郵差吠叫，直到媽媽叫牠進屋前都不肯【離開】。", "f": "The little dog kept barking at the mailman, and it would not go away until my mom called it inside."}, {"g": "", "t": "go back", "p": "(v.phr.)", "e": "to return to a place", "z": "返回", "s": "Mei-ling forgot her math homework at home, so she had to _____ _____ to get it before the first class started.", "c": "美玲把數學作業忘在家裡，所以她必須在第一堂課開始前【返回】家拿。", "f": "Mei-ling forgot her math homework at home, so she had to go back to get it before the first class started."}, {"g": "", "t": "go by", "p": "(v.phr.)", "e": "to pass a person or place", "z": "經過", "s": "We waited at the bus stop for twenty minutes, and three full buses _____ _____ without stopping for us.", "c": "我們在公車站等了二十分鐘，有三輛客滿的公車【經過】卻沒有停下來載我們。", "f": "We waited at the bus stop for twenty minutes, and three full buses went by without stopping for h the whole family, Grandpa likes to _____ _____ _____ _____ with our dog in the park near our home.", "c": "和全家人吃完一頓大餐後，爺爺喜歡帶著我們的狗到家附近的公園【去散步】。", "f": "After a big dinner with the whole family, Grandpa likes to go for a walk with our dog in the park near our home."}, {"g": "", "t": "go from bad to worse", "p": "(v.phr.)", "e": "become even worse than before", "z": "每況愈下", "s": "The weather _____ _____ _____ _____ during our camping trip, so we had to pack up and go home a day early.", "c": "露營期間天氣【每況愈下】，所以我們只好收拾東西，提早一天回家。", "f": "The weather got worse and worse during our camping trip, so we had to pack up and go home a day early."}, {"g": "", "t": "go green", "p": "(v.phr.)", "e": "to live in a way that helps the earth", "z": "採取環保行動", "s": "Our family decided to _____ _____ this year, so we ride bikes to school and turn off the lights when we leave a room.", "c": "我們家今年決定【採取環保行動】，所以我們騎腳踏車上學，離開房間時也會關燈。", "f": "Our family decided to go green this year, so we ride bikes to school and turn off the lights when we leave a room."}, {"g": "", "t": "go off", "p": "(v.phr.)", "e": "to explode", "z": "爆炸", "s": "The firefighters told everyone to leave the building quickly because the gas tank might _____ _____ at any moment.", "c": "消防員要大家趕快離開大樓，因為瓦斯桶隨時都可能【爆炸】。", "f": "The firefighters told everyone to leave the building quickly because the gas tank might go off at any moment."}, {"g": "", "t": "go off", "p": "(v.phr.)", "e": "(of an alarm) to suddenly ring loudly", "z": "（鬧鐘、警報）響起", "s": "My alarm clock didn't _____ _____ this morning, so I woke up late and missed the school bus.", "c": "我的鬧鐘今天早上沒有【響起】，所以我睡過頭，錯過了校車。", "f": "My alarm clock didn't go off this morning, so I woke up late and missed the school bus."}, {"g": "", "t": "go off", "p": "(v.phr.)", "e": "(of lights or power) to stop working", "z": "（燈、電）熄滅", "s": "During the typhoon last night, all the lights in our apartment suddenly _____ _____, so we used candles to see.", "c": "昨晚颱風期間，我們公寓裡所有的燈突然【熄滅】，所以我們點蠟燭來照明。" ence reports back on Friday, and she will write helpful comments on every page."}, {"g": "", "t": "hand in + N", "p": "(v.phr.)", "e": "to give work to a teacher", "z": "提出、繳交", "s": "All students must _____ _____ their summer homework on the first day of school, or the teacher will be very upset.", "c": "所有學生都必須在開學第一天【繳交】暑假作業，否則老師會很不高興。", "f": "All students must hand in their summer homework on the first day of school, or the teacher will be very upset."}, {"g": "", "t": "hand out + N", "p": "(v.phr.)", "e": "to give things to each person", "z": "發送、分發", "s": "At the start of the school sports day, the class leader helped the teacher _____ _____ water bottles to everyone on the team.", "c": "校運會開始時，班長幫老師把水瓶【分發】給隊上的每個人。", "f": "At the start of the school sports day, the class leader helped the teacher hand out water bottles to everyone on the team."}, {"g": "", "t": "hand over + N", "p": "(v.phr.)", "e": "to give something to someone in charge", "z": "交出、移交", "s": "The police officer asked the young man to _____ _____ the wallet he had found, and then he called the owner.", "c": "警察請那位年輕人【交出】他撿到的錢包，然後打電話給失主。", "f": "The police officer asked the young man to hand over the wallet he had found, and then he called the owner."}, {"g": "", "t": "handle + N + with care", "p": "(v.phr.)", "e": "touch or move something very carefully", "z": "小心處理（常見於包裹標示）", "s": "The box has glass cups inside, so please _____ it _____ _____ when you carry it upstairs.", "c": "這個箱子裡有玻璃杯，所以你搬上樓時請【小心處理】它。", "f": "The box has glass cups inside, so please handle it with care when you carry it upstairs."}, {"g": "", "t": "hang around + 地方", "p": "(v.phr.)", "e": "spend time somewhere doing nothing much", "z": "閒蕩；在附近徘徊", "s": "After school, some students like to _____ _____ the convenience store, but their parents want them to come home.", "c": "放學後，有些學生喜歡在便利商店附近【閒晃】，但他們的父母希望他們回家。", "f": "After school, some students like to hang around the convenience store, but their parents want them to come hom as broken after the long ride, so I had it fixed at the shop near our school for 200 dollars."}, {"g": "", "t": "have + N + for dinner", "p": "(v.phr.)", "e": "eat something as your evening meal", "z": "吃…當晚餐", "s": "We _____ beef noodles _____ _____ last night, and then we ate shaved ice because it was so hot.", "c": "我們昨晚【晚餐吃了】牛肉麵，然後因為天氣太熱，又吃了剉冰。", "f": "We had beef noodles for dinner last night, and then we ate shaved ice because it was so hot."}, {"g": "", "t": "have + N + in common", "p": "(v.phr.)", "e": "to share the same interests or features", "z": "有……共同點", "s": "Although Wei and Sam come from different countries, they _____ a lot _____ _____, like their love for basketball and comic books.", "c": "雖然阿偉和Sam來自不同國家，但他們有很多【共同點】，像是都熱愛籃球和漫畫。", "f": "Although Wei and Sam come from different countries, they have a lot in common, like their love for basketball and comic books."}, {"g": "", "t": "have a cold", "p": "(v.phr.)", "e": "be sick with a runny nose and cough", "z": "感冒", "s": "Sam _____ _____ _____ and kept sneezing in class, so the nurse told him to wear his mask and drink warm water.", "c": "山姆【感冒了】，在課堂上一直打噴嚏，所以護理師要他戴口罩、喝溫水。", "f": "Sam had a cold and kept sneezing in class, so the nurse told him to wear his mask and drink warm water."}, {"g": "", "t": "have (a) command of + N", "p": "(v.phr.)", "e": "to know a language very well", "z": "（語言等的）精通", "s": "Mr. Chen _____ _____ good _____ _____ Japanese because he lived in Tokyo for five years, so he often helps tourists.", "c": "陳先生【精通】日語，因為他在東京住過五年，所以他常常幫助觀光客。", "f": "Mr. Chen has a good command of Japanese because he lived in Tokyo for five years, so he often helps tourists."}, {"g": "", "t": "have a date with + 人", "p": "(v.phr.)", "e": "go out with someone you like", "z": "與某人約會", "s": "My older brother _____ _____ _____ _____ his girlfriend on Saturday, so he cleaned his shoes and cut his hair.", "c": "我哥哥星期六要跟女朋友【約會】，所以他把鞋子擦乾淨，還去剪了頭髮。", "f": "My older brother has a date with his girlfriend on Saturday, so he cleaned his shoes and cut his hair."}, {"g": "", "t": "have a dream", "p": "(v.phr.)", "e": "see pictures and stories while sleeping", "z": "做夢", "s": "Last night I _____ _____ _____ that I could fly over Taipei 101, but my alarm clock woke me up too early.", "c": "我昨晚【做了一個夢】，夢見我能飛越台北101，但我的鬧鐘太早把我吵醒了。", "f": "Last night I had a dream that I could fly over Taipei 101, but my alarm clock woke me up too early."}, {"g": "", "t": "have a fever", "p": "(v.phr.)", "e": "have a body temperature that is too high", "z": "發燒", "s": "My little sister _____ _____ _____ of 39 degrees this morning, so Mom took her to see the doctor right away.", "c": "我妹妹今天早上【發燒】到三十九度，所以媽媽馬上帶她去看醫生。", "f": "My little sister had a fever of 39 degrees this morning, so Mom took her to see the doctor right away."}, {"g": "", "t": "have a good sleep", "p": "(v.phr.)", "e": "sleep well", "z": "睡得好", "s": "I _____ _____ _____ _____ last night because my room was quiet and cool, so I feel full of energy today.", "c": "我昨晚【睡得很好】，因為我的房間又安靜又涼爽，所以我今天精神飽滿。", "f": "I had a good sleep last night because my room was quiet and cool, so I feel full of energy today."}, {"g": "", "t": "have a good time", "p": "(v.phr.)", "e": "to enjoy yourself", "z": "玩得愉快", "s": "We _____ _____ _____ _____ at the water park last Saturday, but we were so tired that we fell asleep on the way home.", "c": "上週六我們在水上樂園【玩得很愉快】，但我們累到在回家的路上就睡著了。", "f": "We had a good time at the water park last Saturday, but we were so tired that we fell asleep on the way home."}, {"g": "", "t": "have a good/great time", "p": "(v.phr.)", "e": "enjoy yourself very much", "z": "玩得很開心", "s": "We _____ _____ _____ _____ at the water park yesterday, and we want to go there again next weekend.", "c": "我們昨天在水上樂園【玩得很開心】，下週末還想再去一次。", "f": "We had a great time at the water park yesterday, and we want to go there again next weekend."}, {"g": "", "t": "have a hard time", "p": "(v.phr.)", "e": "have a difficult or unhappy time", "z": "經歷艱苦的時期；過得很辛苦", "s": "Jack _____ _____ _____ _____ when he first moved to Taichung, because he did not know anyone at his new school.", "c": "傑克剛搬到台中時【過得很辛苦】，因為他在新學校誰都不認識。", "f": "Jack had a hard time when he first moved to Taichung, because he did not know anyone at his new school."}, {"g": "", "t": "have a headache", "p": "(v.phr.)", "e": "have pain in your head", "z": "頭痛", "s": "I _____ _____ _____ after staring at my computer screen for five hours, so I closed my eyes and rested.", "c": "我盯著電腦螢幕五小時後【頭痛】，所以我閉上眼睛休息一下。", "f": "I had a headache after staring at my computer screen for five hours, so I closed my eyes and rested."}, {"g": "", "t": "have a lot in common", "p": "(v.phr.)", "e": "share many of the same interests", "z": "有很多共同之處", "s": "Emma and Grace _____ _____ _____ _____ _____ because they both love cats, drawing, and Korean dramas.", "c": "艾瑪和葛瑞絲【有很多共同之處】，因為她們都喜歡貓、畫畫和韓劇。", "f": "Emma and Grace have a lot in common because they both love cats, drawing, and Korean dramas."}, {"g": "", "t": "have a picnic", "p": "(v.phr.)", "e": "eat a meal outside, often in a park", "z": "去野餐", "s": "The weather is sunny and warm today, so let's _____ _____ _____ by the river and bring some sandwiches.", "c": "今天天氣晴朗溫暖，所以我們帶些三明治去河邊【野餐】吧。", "f": "The weather is sunny and warm today, so let's have a picnic by the river and bring some sandwiches."}, {"g": "", "t": "have a sale", "p": "(v.phr.)", "e": "sell things at lower prices for a time", "z": "舉行拍賣", "s": "The bookstore near my school _____ _____ _____ this week, so I bought three comic books at half price.", "c": "我學校附近的書店這週【舉行拍賣】，所以我用半價買了三本漫畫。", "f": "The bookstore near my school has a sale this week, so I bought three comic books at half price."}, {"g": "", "t": "have a seat", "p": "(v.phr.)", "e": "sit down (a polite way to say it)", "z": "請坐", "s": "When Grandma visited our new apartment, my father smiled and said, \"Please _____ _____ _____ while I make you some tea.\"", "c": "奶奶來我們的新公寓時，爸爸笑著說：「請【坐】，我來幫您泡茶。」", "f": "When Grandma visited our new apartment, my father smiled and said, \"Please have a seat while I make you some tea.\""}, {"g": "", "t": "have a sore throat", "p": "(v.phr.)", "e": "have pain in your throat", "z": "喉嚨痛", "s": "The singer _____ _____ _____ _____ after the long concert, so she drank hot tea with honey and did not talk much.", "c": "那位歌手在長時間的演唱會後【喉嚨痛】，所以她喝了加蜂蜜的熱茶，也不太說話。", "f": "The singer had a sore throat after the long concert, so she drank hot tea with honey and did not talk much."}, {"g": "", "t": "have a stomachache", "p": "(v.phr.)", "e": "have pain in your stomach", "z": "胃痛", "s": "Wendy ate too much fried chicken and ice cream at the party, so she _____ _____ _____ all night.", "c": "溫蒂在派對上吃了太多炸雞和冰淇淋，所以她整晚都【胃痛】。", "f": "Wendy ate too much fried chicken and ice cream at the party, so she had a stomachache all night."}, {"g": "", "t": "have a swim", "p": "(v.phr.)", "e": "swim for a short time", "z": "去游泳", "s": "It was so hot after the basketball game that Andy jumped into the pool to _____ _____ _____ and cool down.", "c": "籃球比賽後太熱了，所以安迪跳進泳池【游個泳】涼快一下。", "f": "It was so hot after the basketball game that Andy jumped into the pool to have a swim and cool down."}, {"g": "", "t": "have beef with + 人", "p": "(v.phr.)", "e": "to have a problem or fight with someone", "z": "有過節；有心結（俚語）", "s": "Jason and Leo _____ _____ _____ each other because Leo broke Jason's new phone last month and never said sorry.", "c": "傑森和里歐彼此【有過節】，因為里歐上個月弄壞了傑森的新手機，卻從沒道歉。", "f": "Jason and Leo have beef with each other because Leo broke Jason's new phone last month and never said sorry."}, {"g": "", "t": "have difficulty + V-ing", "p": "(v.phr.)", "e": "to find it hard to do something", "z": "做某事有困難", "s": "My grandfather _____ _____ reading small words on his phone, so I made the font bigger for him yesterday.", "c": "我爺爺看手機上的小字【有困難】，所以我昨天幫他把字體調大了。", "f": "My grandfather has difficulty reading small words on his phone, so I made the font bigger for him yesterday."}, {"g": "", "t": "have experience in + N/V-ing", "p": "(v.phr.)", "e": "have done something before and know it well", "z": "對…有經驗", "s": "Mrs. Huang _____ _____ _____ teaching young children, so the kindergarten was happy to give her the job.", "c": "在教幼童方面，黃太太【很有經驗】，所以幼兒園很樂意給她這份工作。", "f": "Mrs. Huang has experience in teaching young children, so the kindergarten was happy to give her the job."}, {"g": "", "t": "have fun (+ V-ing)", "p": "(v.phr.)", "e": "to enjoy yourself", "z": "玩得開心", "s": "We _____ _____ at the water park last Saturday, and my little sister did not want to leave when it closed.", "c": "我們上週六在水上樂園【玩得很開心】，樂園關門時我妹妹還不想離開。", "f": "We had fun at the water park last Saturday, and my little sister did not want to leave when it closed."}, {"g": "", "t": "have interest in + N/V-ing", "p": "(v.phr.)", "e": "like and want to know more about something", "z": "對…感興趣", "s": "My cousin _____ great _____ _____ stars and planets, so he reads books about space every night and wants to visit NASA.", "c": "星星和行星讓我表弟【非常感興趣】，所以他每晚讀太空的書，還想去參觀NASA。", "f": "My cousin has great interest in stars and planets, so he reads books about space every night and wants to visit NASA."}, {"g": "", "t": "have no answer to + N", "p": "(v.phr.)", "e": "not know how to answer a question", "z": "對⋯⋯沒有答案；答不出", "s": "When my little sister asked why the sky is blue, I _____ _____ _____ _____ her question, so we looked it up online.", "c": "當我妹妹問天空為什麼是藍色的時候，我【答不出】她的問題，所以我們上網查了。", "f": "When my little sister asked why the sky is blue, I had no answer to her question, so we looked it up online."}, {"g": "", "t": "have nothing to do", "p": "(v.phr.)", "e": "have no work or activity, so you feel bored", "z": "無事可做；無聊", "s": "School is over for the summer, and my little brother keeps saying he is bored because he _____ _____ _____ _____.", "c": "學校放暑假了，我弟弟一直說他很無聊，因為他【無事可做】。", "f": "School is over for the summer, and my little brother keeps saying he is bored because he has nothing to do."}, {"g": "", "t": "have nothing to do with + N", "p": "(v.phr.)", "e": "is not connected to something or someone", "z": "與…毫無關係", "s": "The broken window _____ _____ _____ _____ _____ Tom, because he was at the library all afternoon.", "c": "破掉的窗戶跟湯姆【毫無關係】，因為他整個下午都在圖書館。", "f": "The broken window has nothing to do with Tom, because he was at the library all afternoon."}, {"g": "", "t": "have online classes", "p": "(v.phr.)", "e": "to take lessons on the internet", "z": "上線上課", "s": "When the typhoon closed all the schools in Taipei, we _____ _____ _____ at home and talked to our teacher on the computer.", "c": "當颱風讓台北所有學校停課時，我們在家【上線上課】，並透過電腦和老師說話。", "f": "When the typhoon closed all the schools in Taipei, we had online classes at home and talked to our teacher on the computer."}, {"g": "", "t": "have problems + V-ing", "p": "(v.phr.)", "e": "find it hard to do something", "z": "在…方面有問題", "s": "Many new students _____ _____ finding the science lab, so the teacher drew a map of the school for them.", "c": "很多新生【很難】找到科學實驗室，所以老師為他們畫了一張學校地圖。", "f": "Many new students had problems finding the science lab, so the teacher drew a map of the school for them."}, {"g": "", "t": "have the upper hand", "p": "(v.phr.)", "e": "to have more power or a better chance to win", "z": "佔優勢；佔上風", "s": "Our team _____ _____ _____ _____ in the second half because our tall players got most of the balls.", "c": "下半場我們隊【佔了上風】，因為我們的高個子球員搶到大部分的球。", "f": "Our team had the upper hand in the second half because our tall players got most of the balls."}, {"g": "", "t": "have to + VR", "p": "(v.phr.)", "e": "must; need to", "z": "必須", "s": "I _____ _____ finish my science project tonight because it is due tomorrow morning, so I can't watch TV.", "c": "我今晚【必須】完成自然科專題，因為明天早上就要交了，所以我不能看電視。", "f": "I have to finish my science project tonight because it is due tomorrow morning, so I can't watch TV."}, {"g": "", "t": "have to do with + N", "p": "(v.phr.)", "e": "to be about or connected with", "z": "與……有關", "s": "The teacher said that the next reading lesson _____ _____ _____ _____ saving energy, so we should read about solar power first.", "c": "老師說下一課閱讀內容【和節約能源有關】，所以我們應該先讀一些關於太陽能的資料。", "f": "The teacher said that the next reading lesson has to do with saving energy, so we should read about solar power first."}, {"g": "", "t": "have trouble + V-ing", "p": "(v.phr.)", "e": "to find something hard to do", "z": "做……有困難", "s": "Many new students _____ _____ finding their classrooms on the first day because the school buildings look so similar.", "c": "很多新生第一天找教室時【有困難】，因為學校的建築物看起來都很像。", "f": "Many new students have trouble finding their classrooms on the first day because the school buildings look so similar."}, {"g": "", "t": "have/take a look at + N", "p": "(v.phr.)", "e": "look at something quickly", "z": "看…一眼；看一下", "s": "Before you buy that used phone, you should _____ _____ _____ _____ the screen carefully to make sure it is not broken.", "c": "在你買那支二手手機之前，你應該仔細【看一下】螢幕，確定它沒有壞。", "f": "Before you buy that used phone, you should take a look at the screen carefully to make sure it is not broken."}, {"g": "", "t": "have/throw/hold a party", "p": "(v.phr.)", "e": "plan a party and invite people", "z": "舉辦派對", "s": "We are going to _____ _____ _____ for Grandma's 80th birthday, and all our relatives will come to our house.", "c": "我們要為奶奶八十歲生日【舉辦派對】，所有親戚都會來我們家。", "f": "We are going to have a party for Grandma's 80th birthday, and all our relatives will come to our house."}, {"g": "", "t": "head for + 地方", "p": "(v.phr.)", "e": "to go toward a place", "z": "前往", "s": "After the last class on Friday, the students quickly _____ _____ the bus stop because they wanted to get home before the rain.", "c": "星期五最後一堂課後，學生們很快【前往】公車站，因為他們想在下雨前回到家。", "f": "After the last class on Friday, the students quickly headed for the bus stop because they wanted to get home before the rain."}, {"g": "", "t": "hear about + N", "p": "(v.phr.)", "e": "learn news about something from others", "z": "聽說；聽到有關", "s": "Did you _____ _____ the new night market near the MRT station? People say the food there is cheap and delicious.", "c": "你有【聽說】捷運站附近新開的夜市嗎？大家說那裡的食物便宜又好吃。", "f": "Did you hear about the new night market near the MRT station? People say the food there is cheap and delicious."}, {"g": "", "t": "hear from + 人", "p": "(v.phr.)", "e": "to get news from someone", "z": "得到（某人的）消息", "s": "Grandma was very happy to _____ _____ my uncle, who works in Canada, because he had not called her for months.", "c": "舅舅在加拿大工作，已經好幾個月沒打電話給奶奶了，所以奶奶【得到他的消息】時非常開心。", "f": "Grandma was very happy to hear from my uncle, who works in Canada, because he had not called her for months."}, {"g": "", "t": "hear of + N", "p": "(v.phr.)", "e": "to know that someone or something exists", "z": "聽說過", "s": "Have you ever _____ _____ a small town in Taiwan called Jiufen, where people visit old streets and drink tea?", "c": "你有沒有【聽說過】台灣一個叫做九份的小鎮？人們會去那裡逛老街、喝茶。", "f": "Have you ever heard of a small town in Taiwan called Jiufen, where people visit old streets and drink tea?"}, {"g": "", "t": "heat up + N", "p": "(v.phr.)", "e": "to make food warm or hot again", "z": "加熱", "s": "If you are hungry after school, you can _____ _____ the rice and soup in the microwave, and dinner will be ready.", "c": "如果你放學後肚子餓，可以用微波爐【加熱】飯和湯，晚餐就準備好了。", "f": "If you are hungry after school, you can heat up the rice and soup in the microwave, and dinner will be ready."}, {"g": "", "t": "help + 人 + with + N", "p": "(v.phr.)", "e": "to give someone help on something", "z": "幫忙（某人做）…", "s": "Every evening after dinner, my older brother _____ me _____ my math homework because the questions are too hard for me.", "c": "每天晚餐後，我哥哥都會【幫忙】我寫數學作業，因為那些題目對我來說太難了。", "f": "Every evening after dinner, my older brother helps me with my math homework because the questions are too hard for me."}, {"g": "", "t": "help oneself to + N", "p": "(v.phr.)", "e": "take food or drinks freely", "z": "自行取用…", "s": "There is a lot of fruit on the table, so please _____ yourself _____ anything you like.", "c": "桌上有很多水果，所以請【自行取用】你喜歡的任何東西。", "f": "There is a lot of fruit on the table, so please help yourself to anything you like."}, {"g": "", "t": "help out + 人", "p": "(v.phr.)", "e": "help someone with a problem", "z": "幫助…擺脫困境", "s": "When Emma couldn't carry all her books, her classmate Hao-ren _____ her _____ and carried half of them.", "c": "當艾瑪搬不動所有書時，她的同學浩仁【幫她解圍】，幫她拿了一半。", "f": "When Emma couldn't carry all her books, her classmate Hao-ren helped her out and carried half of them."}, {"g": "", "t": "hold + N + dear", "p": "(v.phr.)", "e": "love and care about something very much", "z": "珍視；深愛", "s": "Grandpa _____ his old watch _____ because his father gave it to him when he was a little boy.", "c": "爺爺很【珍惜】他的舊手錶，因為那是他小時候他爸爸送給他的。", "f": "Grandpa holds his old watch dear because his father gave it to him when he was a little boy."}, {"g": "", "t": "hold on", "p": "(v.phr.)", "e": "to wait for a short time", "z": "等一下、稍候", "s": "When the nurse answered the phone, she said, \"Please _____ _____, and I will check if the doctor is free.\"", "c": "護理師接起電話時說：「請【稍候】，我查一下醫生現在是否有空。」", "f": "When the nurse answered the phone, she said, \"Please hold on, and I will check if the doctor is free.\""}, {"g": "", "t": "hold on to + N", "p": "(v.phr.)", "e": "to hold something tightly", "z": "緊抓住、堅持", "s": "The roller coaster was going so fast that I had to _____ _____ _____ the bar with both hands and close my eyes.", "c": "雲霄飛車速度太快了，我必須用雙手【緊抓住】扶桿，並閉上眼睛。", "f": "The roller coaster was going so fast that I had to hold on to the bar with both hands and close my eyes."}, {"g": "", "t": "hold on to + N", "p": "(v.phr.)", "e": "to keep something and not sell it", "z": "繼續擁有、保留", "s": "My dad decided to _____ _____ _____ his old car because it still runs well and he has many happy memories in it.", "c": "爸爸決定【繼續保留】他的舊車，因為車子還很好開，而且他在車裡有很多快樂的回憶。", "f": "My dad decided to hold on to his old car because it still runs well and he has many happy memories in it."}, {"g": "", "t": "hop off + N", "p": "(v.phr.)", "e": "to jump down from something quickly", "z": "跳下（車等）", "s": "When we arrived at the zoo, the excited children _____ _____ the school bus and ran to the ticket office with their teacher.", "c": "我們到動物園時，興奮的孩子們【跳下】校車，跟著老師跑向售票處。", "f": "When we arrived at the zoo, the excited children hopped off the school bus and ran to the ticket office with their teacher."}, {"g": "", "t": "hurry up", "p": "(v.phr.)", "e": "to do something more quickly", "z": "趕快", "s": "Mom told my brother to _____ _____ because he was still putting on his shoes and our train was leaving soon.", "c": "媽媽叫弟弟【趕快】，因為他還在穿鞋，而我們的火車就快要開了。", "f": "Mom told my brother to hurry up because he was still putting on his shoes and our train was leaving soon."}, {"g": "", "t": "introduce + 人 + to + 人", "p": "(v.phr.)", "e": "help people meet for the first time", "z": "向…介紹…", "s": "At the party, Grace _____ her new friend _____ her parents, and they talked happily about school.", "c": "在派對上，葛瑞絲【把她的新朋友介紹給她爸媽】，他們開心地聊學校的事。", "f": "At the party, Grace introduced her new friend to her parents, and they talked happily about school."}, {"g": "", "t": "invite + 人 + to + N", "p": "(v.phr.)", "e": "ask someone to come to an event", "z": "邀請…去…", "s": "Peter _____ all his classmates _____ his birthday party, and they played games and ate pizza together.", "c": "彼得【邀請全班同學來參加】他的生日派對，他們一起玩遊戲、吃披薩。", "f": "Peter invited all his classmates to his birthday party, and they played games and ate pizza together."}, {"g": "", "t": "jump over + N", "p": "(v.phr.)", "e": "jump from one side to the other", "z": "跳過", "s": "The dog was so excited that it _____ _____ the fence and ran into the neighbor's garden.", "c": "那隻狗太興奮了，牠【跳過】圍籬，跑進鄰居的花園。", "f": "The dog was so excited that it jumped over the fence and ran into the neighbor's garden."}, {"g": "", "t": "keep + 人 + busy", "p": "(v.phr.)", "e": "to give someone a lot to do", "z": "讓某人忙碌", "s": "Taking care of three young children and a small noodle shop _____ my aunt _____ from morning till night.", "c": "照顧三個小孩和一家小麵店，從早到晚都【讓我阿姨很忙碌】。", "f": "Taking care of three young children and a small noodle shop keeps my aunt busy from morning till night."}, {"g": "", "t": "keep + 人 + company", "p": "(v.phr.)", "e": "stay with someone so they are not alone", "z": "陪伴某人", "s": "Grandma lives alone in the countryside, so we visit her every weekend to _____ her _____.", "c": "奶奶獨自住在鄉下，所以我們每個週末去看她，【陪伴】她。", "f": "Grandma lives alone in the countryside, so we visit her every weekend to keep her company."}, {"g": "", "t": "keep + 人 + from + V-ing", "p": "(v.phr.)", "e": "to stop someone from doing something", "z": "阻止某人做……", "s": "The loud music at the party next door _____ me _____ sleeping, so I was very tired at school the next day.", "c": "隔壁派對的吵雜音樂【使我無法】入睡，所以我隔天在學校非常累。", "f": "The loud music at the party next door kept me from sleeping, so I was very tired at school the next day."}, {"g": "", "t": "keep (+ 人) from + V-ing", "p": "(v.phr.)", "e": "to stop yourself or someone doing something", "z": "使不能、避免", "s": "Kevin covered his mouth with his hand to _____ himself _____ laughing when the teacher slipped on the wet floor.", "c": "當老師在濕地板上滑了一跤時，Kevin用手摀住嘴巴，好【讓自己忍住不】笑出來。", "f": "Kevin covered his mouth with his hand to keep himself from laughing when the teacher slipped on the wet floor."}, {"g": "", "t": "keep + N + in mind", "p": "(v.phr.)", "e": "to remember something", "z": "記住某事", "s": "Please _____ this rule _____ _____ during the test: you can't talk to anyone or look at your phone.", "c": "考試時請【記住】這條規則：不能跟任何人說話，也不能看手機。", "f": "Please keep this rule in mind during the test: you can't talk to anyone or look at your phone."}, {"g": "", "t": "keep + N + in order", "p": "(v.phr.)", "e": "keep things neat and tidy", "z": "保持……有秩序", "s": "Our teacher asks us to _____ our desks _____ _____ so that we can find our books and pencils quickly.", "c": "老師要求我們讓書桌【保持整齊有序】，這樣才能很快找到書和鉛筆。", "f": "Our teacher asks us to keep our desks in order so that we can find our books and pencils quickly."}, {"g": "", "t": "keep + V-ing", "p": "(v.phr.)", "e": "to continue doing something", "z": "繼續做……", "s": "Even though it started to rain, the runners _____ running because the finish line was only one kilometer away.", "c": "雖然開始下雨了，跑者們還是【繼續】跑，因為離終點只剩一公里。", "f": "Even though it started to rain, the runners kept running because the finish line was only one kilometer away."}, {"g": "", "t": "keep a diary", "p": "(v.phr.)", "e": "to write about your day in a book often", "z": "寫日記", "s": "My English teacher told us to _____ _____ _____ in English, so I write a few sentences about my day every night before bed.", "c": "我的英文老師要我們用英文【寫日記】，所以我每天睡前都會寫幾句關於當天的事。", "f": "My English teacher told us to keep a diary in English, so I write a few sentences about my day every night before bed."}, {"g": "", "t": "keep away from + N", "p": "(v.phr.)", "e": "to not go near something", "z": "遠離……", "s": "The sign at the river says that children should _____ _____ _____ the water after heavy rain because it is very dangerous.", "c": "河邊的告示牌寫著，大雨過後小孩應該【遠離】河水，因為非常危險。", "f": "The sign at the river says that children should keep away from the water after heavy rain because it is very dangerous."}, {"g": "", "t": "keep fit", "p": "(v.phr.)", "e": "to keep your body strong by exercising", "z": "保持健康", "s": "Grandma does tai chi with her friends in the park every morning, and she says it helps her _____ _____ and feel happy.", "c": "奶奶每天早上和朋友在公園打太極拳，她說這能幫她【保持健康】又心情愉快。", "f": "Grandma does tai chi with her friends in the park every morning, and she says it helps her keep fit and feel happy."}, {"g": "", "t": "keep healthy", "p": "(v.phr.)", "e": "to stay well and not get sick", "z": "保持健康", "s": "To _____ _____, you should eat lots of fruit and vegetables, drink enough water, and go to bed early every night.", "c": "為了【保持健康】，你應該多吃蔬果、喝足夠的水，每天晚上早點睡。", "f": "To keep healthy, you should eat lots of fruit and vegetables, drink enough water, and go to bed early every night."}, {"g": "", "t": "keep in mind + that 子句", "p": "(v.phr.)", "e": "remember something important", "z": "記住；謹記", "s": "When you take the bus in the city, _____ _____ _____ that you need to pay with your card or coins.", "c": "你在市區搭公車時，要【記住】你需要用卡片或硬幣付費。", "f": "When you take the bus in the city, keep in mind that you need to pay with your card or coins."}, {"g": "", "t": "keep in shape", "p": "(v.phr.)", "e": "to keep your body strong and healthy", "z": "保持健康", "s": "My dad goes jogging in the park every morning because he wants to _____ _____ _____ and play basketball with us on weekends.", "c": "我爸爸每天早上去公園慢跑，因為他想【保持健康】，週末才能和我們打籃球。", "f": "My dad goes jogging in the park every morning because he wants to keep in shape and play basketball with us on weekends."}, {"g": "", "t": "keep in touch (with + 人)", "p": "(v.phr.)", "e": "to keep talking or writing to someone", "z": "（與……）保持聯絡", "s": "After Anna moved to Australia, she still _____ _____ _____ _____ her best friend in Taichung by video calls every week.", "c": "Anna搬到澳洲後，仍然每週透過視訊電話【與台中的好朋友保持聯絡】。", "f": "After Anna moved to Australia, she still keeps in touch with her best friend in Taichung by video calls every week."}, {"g": "", "t": "keep in touch with + 人", "p": "(v.phr.)", "e": "to keep talking or writing to someone", "z": "和…保持聯絡", "s": "After Jason moved to Kaohsiung, he still _____ _____ _____ _____ his best friends by sending messages on his phone every day.", "c": "傑森搬到高雄後，他仍然每天用手機傳訊息【和】好朋友們【保持聯絡】。", "f": "After Jason moved to Kaohsiung, he still keeps in touch with his best friends by sending messages on his phone every day."}, {"g": "", "t": "keep it simple", "p": "(v.phr.)", "e": "to not make something too hard", "z": "簡單就好", "s": "Your speech only needs to be three minutes long, so _____ _____ _____ and just talk about your favorite hobby.", "c": "你的演講只需要三分鐘，所以【簡單就好】，只要談談你最喜歡的嗜好。", "f": "Your speech only needs to be three minutes long, so keep it simple and just ta n fell off his bike in front of the school, some kids _____ _____ him, but Amy helped him up.", "c": "凱文在學校前面從腳踏車上摔下來時，有些孩子【嘲笑】他，但艾咪扶他起來。", "f": "When Kevin fell off his bike in front of the school, some kids laughed at him, but Amy helped him up."}, {"g": "", "t": "lead to + 地方", "p": "(v.phr.)", "e": "to go toward a place", "z": "通往", "s": "This narrow path behind the temple _____ _____ a quiet beach, so we often walk there after dinner in summer.", "c": "廟後面這條小路【通往】一個安靜的海灘，所以夏天我們常在晚餐後走去那裡。", "f": "This narrow path behind the temple leads to a quiet beach, so we often walk there after dinner in summer."}, {"g": "", "t": "lead to + N/V-ing", "p": "(v.phr.)", "e": "to cause something to happen", "z": "導致", "s": "Staying up late every night playing phone games can _____ _____ poor grades, so Mom took my phone away.", "c": "每晚熬夜玩手機遊戲可能會【導致】成績不好，所以媽媽把我的手機拿走了。", "f": "Staying up late every night playing phone games can lead to poor grades, so Mom took my phone away."}, {"g": "", "t": "learn + N + from + 人", "p": "(v.phr.)", "e": "to get knowledge or skills from someone", "z": "向某人學某事", "s": "Lily _____ a lot about cooking _____ her grandmother, and now she can make delicious beef noodles for the whole family.", "c": "莉莉【向】奶奶【學】了很多烹飪的事，現在她會做好吃的牛肉麵給全家人吃。", "f": "Lily learned a lot about cooking from her grandmother, and now she can make delicious beef noodles for the whole family."}, {"g": "", "t": "leave + 物 + 地方", "p": "(v.phr.)", "e": "to put something in a place and not take it", "z": "把某物留在某處", "s": "You can _____ your shoes outside the door, because my mom doesn't want anyone to walk on the clean floor with them.", "c": "你可以把鞋子【留在】門外，因為我媽媽不希望有人穿鞋踩在乾淨的地板上。", "f": "You can leave your shoes outside the door, because my mom doesn't want anyone to walk on the clean floor with them."}, {"g": "", "t": "leave + 物 + adj.", "p": "(v.phr.)", "e": "to let something stay a certain way", "z": "讓某物保持某狀態（形容詞）", "s": "When you go out, don't _____ the room dirty, because Grandma is coming to stay with us this weekend.", "c": "你出門時不要【讓】房間髒兮兮的，因為奶奶這週末要來我們家住。", "f": "When you go out, don't leave the room dirty, because Grandma is coming to stay with us this weekend."}, {"g": "", "t": "leave + 人 + alone", "p": "(v.phr.)", "e": "stop bothering someone and let them be", "z": "讓某人一個人靜一靜；別煩某人", "s": "When my little brother cried after losing the game, Mom told us to _____ him _____ for a while.", "c": "弟弟輸了比賽後哭了，媽媽叫我們【讓他一個人靜一靜】一會兒。", "f": "When my little brother cried after losing the game, Mom told us to leave him alone for a while."}, {"g": "", "t": "leave + 物 + behind", "p": "(v.phr.)", "e": "to forget to take something with you", "z": "把某物忘在後面", "s": "I was in a hurry to catch the bus this morning, so I _____ my lunch box _____ on the kitchen table.", "c": "我今天早上急著趕公車，所以把便當盒【忘】在廚房桌上了。", "f": "I was in a hurry to catch the bus this morning, so I left my lunch box behind on the kitchen table."}, {"g": "", "t": "leave behind + N", "p": "(v.phr.)", "e": "to forget to take something with you", "z": "留下……、忘了帶", "s": "Lisa was in such a hurry to catch the bus that she _____ her lunch box _____ on the kitchen table.", "c": "麗莎急著趕公車，結果【忘了帶】放在廚房桌上的便當盒。", "f": "Lisa was in such a hurry to catch the bus that she left her lunch box behind on the kitchen table."}, {"g": "", "t": "leave for + 地方", "p": "(v.phr.)", "e": "to start going to a place", "z": "前往", "s": "Our family will _____ _____ Tainan early on Saturday morning because we want to visit Grandma before lunch.", "c": "我們家星期六一早就會【前往】台南，因為我們想在午餐前去看奶奶。", "f": "Our family will leave for Tainan early on Saturday morning because we want to visit Grandma before lunch."}, {"g": "", "t": "leave the a/c on", "p": "(v.phr.)", "e": "to not turn off the air conditioner", "z": "讓冷氣開著", "s": "Mom got angry because my brother _____ _____ _____ _____ all day while nobody was at home, and the bill was very high.", "c": "媽媽很生氣，因為家裡沒人的時候我弟弟整天【讓冷氣開著】，電費變得很高。", "f": "Mom got angry because my brother left the AC on all day wh ng the singing contest on TV _____ Kelly a star, and now people ask to take photos with her everywhere.", "c": "贏得電視歌唱比賽【使】凱莉成為明星，現在到處都有人要跟她合照。", "f": "Winning the singing contest on TV made Kelly a star, and now people ask to take photos with her everywhere."}, {"g": "", "t": "make + 人 + sick", "p": "(v.phr.)", "e": "make someone feel ill or very upset", "z": "讓人作噁；令人反感", "s": "The smell of the old garbage in the hot kitchen _____ me _____, so I opened all the windows right away.", "c": "炎熱廚房裡舊垃圾的味道【讓我想吐】，所以我馬上把所有窗戶打開。", "f": "The smell of the old garbage in the hot kitchen made me sick, so I opened all the windows right away."}, {"g": "", "t": "make + 人 + VR", "p": "(v.phr.)", "e": "to force someone to do something", "z": "讓某人做……", "s": "My piano teacher _____ me practice the same song ten times today, but now I can play it without any mistakes.", "c": "今天鋼琴老師【讓】我把同一首曲子練了十遍，但現在我已經能彈得完全沒錯了。", "f": "My piano teacher made me practice the same song ten times today, but now I can play it without any mistakes."}, {"g": "", "t": "make + N + a habit", "p": "(v.phr.)", "e": "to do something often until it is normal for you", "z": "養成（…的）習慣", "s": "My English teacher told us to _____ reading _____ _____, so now I read a short English story before bed every night.", "c": "英文老師要我們【養成閱讀的習慣】，所以現在我每晚睡前都會讀一篇短篇英文故事。", "f": "My English teacher told us to make reading a habit, so now I read a short English story before bed every night."}, {"g": "", "t": "make a change", "p": "(v.phr.)", "e": "do something in a new or different way", "z": "做出改變", "s": "Peter always felt sleepy in class, so he decided to _____ _____ _____ and go to bed before ten every night.", "c": "Peter上課總是想睡，所以他決定【做出改變】，每天晚上十點前就上床睡覺。", "f": "Peter always felt sleepy in class, so he decided to make a change and go to bed before ten every night."}, {"g": "", "t": "make a choice", "p": "(v.phr.)", "e": "decide which one you want", "z": "做選擇", "s": "There were so many delicious cakes in the bakery that little Annie couldn't _____ _____ _____, so her mom picked one for her.", "c": "麵包店裡好吃的蛋糕太多了，小Annie沒辦法【做選擇】，所以媽媽幫她挑了一個。", "f": "There were so many delicious cakes in the bakery that little Annie couldn't make a choice, so her mom picked one for her."}, {"g": "", "t": "make a copy", "p": "(v.phr.)", "e": "produce another paper or file that is the same", "z": "製作副本", "s": "Before you give the report to the teacher, please _____ _____ _____ of it so you will not lose your work.", "c": "在把報告交給老師之前，請先【影印一份副本】，這樣你就不會弄丟你的作品。", "f": "Before you give the report to the teacher, please make a copy of it so you will not lose your work."}, {"g": "", "t": "make a deal", "p": "(v.phr.)", "e": "agree on something with another person", "z": "達成協議或交易", "s": "Ben and his mom _____ _____ _____: if he finishes his homework before dinner, he can play video games for an hour.", "c": "Ben 和媽媽【達成協議】：如果他晚餐前寫完作業，就可以打一小時電動。", "f": "Ben and his mom made a deal: if he finishes his homework before dinner, he can play video games for an hour."}, {"g": "", "t": "make a decision", "p": "(v.phr.)", "e": "decide something after thinking about it", "z": "做決定", "s": "Both high schools look great to Yu-ting, but she has to _____ _____ _____ before Friday because the deadline is coming.", "c": "兩所高中在雨婷看來都很好，但她必須在星期五前【做決定】，因為截止日快到了。", "f": "Both high schools look great to Yu-ting, but she has to make a decision before Friday because the deadline is coming."}, {"g": "", "t": "make a decision to + VR", "p": "(v.phr.)", "e": "decide to do something", "z": "下決心做…", "s": "When his doctor said he was too heavy, Mr. Lin _____ _____ _____ _____ walk to work every morning instead of driving.", "c": "當醫生說他太重時，林先生【下決心】每天早上走路上班，而不是開車。", "f": "When his doctor said he was too heavy, Mr. Lin made a decision to walk to work every morning instead of driving."}, {"g": "", "t": "make a difference (to + N)", "p": "(v.phr.)", "e": "to have a good effect on something", "z": "有影響、有差別", "s": "Picking up trash on the beach may seem small, but if everyone helps, it can really _____ _____ _____ to the ocean.", "c": "在海灘上撿垃圾看起來也許是小事，但如果大家都幫忙，真的能對海洋【有影響】。", "f": "Picking up trash on the beach may seem small, but if everyone helps, it can really make a difference to the ocean."}, {"g": "", "t": "make a down payment", "p": "(v.phr.)", "e": "pay the first part of a big price", "z": "付頭期款；付訂金", "s": "My parents _____ _____ _____ _____ on a new apartment last month, and they will pay the rest over twenty years.", "c": "我爸媽上個月為一間新公寓【付了頭期款】，剩下的錢他們會在二十年內付清。", "f": "My parents made a down payment on a new apartment last month, and they will pay the rest over twenty years."}, {"g": "", "t": "make a face", "p": "(v.phr.)", "e": "move your face in a funny way", "z": "做鬼臉", "s": "My baby brother stopped crying and laughed when I _____ _____ _____ at him with my tongue out.", "c": "當我吐舌頭對小弟弟【做鬼臉】時，他就不哭了，還笑了出來。", "f": "My baby brother stopped crying and laughed when I made a face at him with my tongue out."}, {"g": "", "t": "make a fool of + 人", "p": "(v.phr.)", "e": "to trick someone so they look silly", "z": "愚弄", "s": "Tom tried to _____ _____ _____ _____ his classmates on April Fools' Day, but nobody believed his silly story about a snake.", "c": "湯姆在愚人節想【愚弄】他的同學，但沒有人相信他那個關於蛇的蠢故事。", "f": "Tom tried to make a fool of his classmates on April Fools' Day, but nobody believed his silly story about a snake."}, {"g": "", "t": "make a good shot", "p": "(v.phr.)", "e": "throw the ball into the basket well", "z": "投籃很準確", "s": "In the last second of the basketball game, Jason _____ _____ _____ _____, and his team won by one point.", "c": "在籃球比賽的最後一秒，傑森【投籃很準】，他的隊伍以一分獲勝。", "f": "In the last second of the basketball game, Jason made a good shot, and his team won by one point."}, {"g": "", "t": "make a guess", "p": "(v.phr.)", "e": "give an answer without being sure", "z": "做猜測", "s": "If you don't know the answer to a question on the test, just _____ _____ _____ instead of leaving it empty.", "c": "如果考試時不知道某題的答案，就【猜猜看】，不要留空白。", "f": a noise", "p": "(v.phr.)", "e": "do something that makes a loud sound", "z": "製造噪音", "s": "Please don't _____ _____ _____ when you come home late, because the baby is sleeping and Mom is very tired.", "c": "你晚回家時請不要【製造噪音】，因為寶寶在睡覺，媽媽也很累。", "f": "Please don't make a noise when you come home late, because the baby is sleeping and Mom is very tired."}, {"g": "", "t": "make a phone call", "p": "(v.phr.)", "e": "call someone on the phone", "z": "打電話", "s": "Steven forgot his lunch box at home, so he went to the school office and _____ _____ _____ _____ to his mom.", "c": "Steven把便當盒忘在家裡，所以他去學校辦公室【打電話】給媽媽。", "f": "Steven forgot his lunch box at home, so he went to the school office and made a phone call to his mom."}, {"g": "", "t": "make a plan", "p": "(v.phr.)", "e": "decide what you will do", "z": "訂計畫", "s": "The summer vacation is long, so Howard and his parents _____ _____ _____ to visit three national parks and read ten books.", "c": "暑假很長，所以Howard和爸媽【訂了一個計畫】：去三座國家公園並讀十本書。", "f": "The summer vacation is long, so Howard and his parents made a plan to visit three national parks and read ten books."}, {"g": "", "t": "make a plan for + N", "p": "(v.phr.)", "e": "decide what to do for something", "z": "為…訂計畫", "s": "Before the summer trip to Japan, our family _____ _____ _____ _____ each day so we would not waste time.", "c": "去日本暑假旅行之前，我們家【為每一天訂了計畫】，這樣才不會浪費時間。", "f": "Before the summer trip to Japan, our family made a plan for each day so we would not waste time."}, {"g": "", "t": "make a promise", "p": "(v.phr.)", "e": "say that you will surely do something", "z": "做出承諾", "s": "When Grandpa got sick, I _____ _____ _____ to visit him every Sunday, and I have kept it for twelve months.", "c": "爺爺生病時，我【承諾】每個星期天都去看他，而我已經遵守了十二個月。", "f": "When Grandpa got sick, I made a promise to visit him every Sunday, and I have kept it for twelve months."}, {"g": "", "t": "make a sound", "p": "(v.phr.)", "e": "make something that people can hear", "z": "發出聲音", "s": "The movie was so scary that nobody dared to _____ _____ _____, and we could only hear our own heartbeats.", "c": "電影恐怖到沒有人敢【發出聲音】，我們只聽得到自己的心跳聲。", "f": "The movie was so scary that nobody dared to make a sound, and we could only hear our own heartbeats."}, {"g": "", "t": "make a speech", "p": "(v.phr.)", "e": "give a talk to a group of people", "z": "發表演講", "s": "Our principal will _____ _____ _____ at the graduation ceremony, so all the students must sit quietly and listen.", "c": "我們校長將在畢業典禮上【發表演講】，所以所有學生都必須安靜坐好聆聽。", "f": "Our principal will make a speech at the graduation ceremony, so all the students must sit quietly and listen."}, {"g": "", "t": "make a U-turn", "p": "(v.phr.)", "e": "to turn a car around to go back", "z": "迴轉", "s": "Dad missed the exit to the beach, so he had to _____ _____ _____ at the next corner and drive back for ten minutes.", "c": "爸爸錯過了往海邊的出口，所以他只好在下一個路口【迴轉】，再開回去十分鐘。", "f": "Dad missed the exit to the beach, so he had to make a U-turn at the next corner and drive back for ten minutes."}, {"g": "", "t": "make a wild guess", "p": "(v.phr.)", "e": "guess without knowing anything about it", "z": "亂猜；瞎猜", "s": "Kevin did not study for the math quiz, so he had to _____ _____ _____ _____ on almost every question.", "c": "Kevin 沒有準備數學小考，所以他幾乎每一題都只能【亂猜】。", "f": "Kevin did not study for the math quiz, so he had to make a wild guess on almost every question."}, {"g": "", "t": "make a wish", "p": "(v.phr.)", "e": "hope for something in your heart", "z": "許願", "s": "Before blowing out the candles on her birthday cake, Wendy closed her eyes and _____ _____ _____ for her family's health.", "c": "吹蠟燭之前，Wendy閉上眼睛【許了一個願】，希望家人身體健康。", "f": "Before blowing out the candles on her birthday cake, Wendy closed her eyes and made a wish for her family's health."}, {"g": "", "t": "make an effort", "p": "(v.phr.)", "e": "try hard to do something", "z": "努力", "s": "Ted is shy, but he _____ _____ _____ to speak English in class every day because he wants to improve.", "c": "Ted很害羞，但他每天都【努力】在課堂上說英文，因為他想進步。", "f": "Ted is shy, but he makes an effort to speak English in class every day because he wants to improve."}, {"g": "", "t": "make an excuse", "p": "(v.phr.)", "e": "give a reason that is not true", "z": "編藉口", "s": "Ben didn't finish his homework, so he _____ _____ _____ and said his little brother had torn it.", "c": "班沒有寫完作業，所以他【編了一個藉口】，說他弟弟把作業撕破了。", "f": "Ben didn't finish his homework, so he made an excuse and said his little brother had torn it."}, {"g": "", "t": "make believe (+ that 子句)", "p": "(v.phr.)", "e": "to pretend something is real", "z": "假裝、喬裝", "s": "My little cousins love to _____ _____ that they are princesses living in a castle, and they play this game for hours.", "c": "我的小表妹們喜歡【假裝】自己是住在城堡裡的公主，她們會玩這個遊戲好幾個小時。", "f": "My little cousins love to make believe that they are princesses living in a castle, and they play this game for hours."}, {"g": "", "t": "make (both) ends meet", "p": "(v.phr.)", "e": "to have just enough money to live", "z": "使收支平衡", "s": "Mr. Lin works two jobs every day because it is hard to _____ _____ _____ with three kids and a high rent.", "c": "林先生每天做兩份工作，因為要養三個孩子又要付很高的房租，很難【收支平衡】。", "f": "Mr. Lin works two jobs every day because it is hard to make ends meet with three kids and a high rent."}, {"g": "", "t": "make breakfast/lunch/dinner", "p": "(v.phr.)", "e": "cook a meal", "z": "做早餐／午餐／晚餐", "s": "On Sunday mornings, Dad usually _____ _____ for the whole family, and we eat pancakes and eggs together.", "c": "星期天早上，爸爸通常會幫全家【做早餐】，我們一起吃鬆餅和蛋。", "f": "On Sunday mornings, Dad usually makes breakfast for the whole family, and we eat pancakes and eggs together."}, {"g": "", "t": "make certain + that 子句", "p": "(v.phr.)", "e": "check that something is true", "z": "確定", "s": "Before we left for the airport, Dad _____ _____ that all the windows were closed and the lights were off.", "c": "我們出發去機場前，爸爸【確定】所有窗戶都關好、燈也都關了。", "f": "Before we left for the airport, Dad made certain that all the windows were closed and the  "p": "(v.phr.)", "e": "to start to know and like new people", "z": "交朋友", "s": "Ivy was nervous on her first day at the new school, but she _____ _____ quickly because she joined the basketball club.", "c": "艾薇在新學校的第一天很緊張，但她很快就【交到朋友】，因為她加入了籃球社。", "f": "Ivy was nervous on her first day at the new school, but she made friends quickly because she joined the basketball club."}, {"g": "", "t": "make friends with + 人", "p": "(v.phr.)", "e": "become friends with someone", "z": "和…交朋友", "s": "On her first day at the new school, Yuki felt lonely, but she soon _____ _____ _____ the girl who sat next to her.", "c": "Yuki到新學校的第一天覺得很孤單，但她很快就和坐她旁邊的女生【交上了朋友】。", "f": "On her first day at the new school, Yuki felt lonely, but she soon made friends with the girl who sat next to her."}, {"g": "", "t": "make fun of + 人", "p": "(v.phr.)", "e": "to laugh at someone in an unkind way", "z": "取笑", "s": "It's not nice to _____ _____ _____ people because of the clothes they wear, so please be kind to everyone in class.", "c": "因為別人穿的衣服而【取笑】他們是不好的，所以請對班上每個人都友善。", "f": "It's not nice to make fun of people because of the clothes they wear, so please be kind to everyone in class."}, {"g": "", "t": "make good/full use of + N", "p": "(v.phr.)", "e": "use something well", "z": "善加利用", "s": "Since the summer vacation is long, Mia plans to _____ _____ _____ _____ her free time by learning to swim.", "c": "因為暑假很長，米亞打算【善加利用】她的空閒時間去學游泳。", "f": "Since the summer vacation is long, Mia plans to make good use of her free time by learning to swim."}, {"g": "", "t": "make it", "p": "(v.phr.)", "e": "succeed in doing something", "z": "成功做到", "s": "Kelly was nervous about the singing contest, but she practiced every day and _____ _____ into the final round.", "c": "Kelly對歌唱比賽很緊張，但她每天練習，最後【成功】進入了決賽。", "f": "Kelly was nervous about the singing contest, but she practiced every day and made it into the final round."}, {"g": "", "t": "make it", "p": "(v.phr.)", "e": "arrive somewhere in time", "z": "及時到達", "s": "The traffic was terrible this morning, but we _____ _____ to the airport ten minutes before check-in closed.", "c": "今天早上交通很糟，但我們在報到截止前十分鐘【及時趕到】機場。", "f": "The traffic was terrible this morning, but we made it to the airport ten minutes before check-in closed."}, {"g": "", "t": "make it a rule to + VR", "p": "(v.phr.)", "e": "always do something as a habit", "z": "習慣做…", "s": "My grandfather _____ _____ _____ _____ _____ get up at five o'clock, and he goes jogging in the park before breakfast.", "c": "我爺爺【習慣】五點起床，而且他早餐前會去公園慢跑。", "f": "My grandfather makes it a rule to get up at five o'clock, and he goes jogging in the park before breakfast."}, {"g": "", "t": "make it up to + 人", "p": "(v.phr.)", "e": "do something nice for someone after you hurt them", "z": "補償（某人）", "s": "I'm sorry I forgot your birthday, Linda, but I will _____ _____ _____ _____ you by taking you out for dinner tonight.", "c": "琳達，很抱歉我忘了妳的生日，不過我今晚會請妳吃晚餐來【補償】妳。", "f": "I'm sorry I forgot your birthday, Linda, but I will make it up to you by taking you out for dinner tonight."}, {"g": "", "t": "make money", "p": "(v.phr.)", "e": "get money by working", "z": "賺錢", "s": "My cousin Ray walks his neighbors' dogs after school because he wants to _____ _____ for a new bike.", "c": "我表哥Ray放學後幫鄰居遛狗，因為他想【賺錢】買一台新腳踏車。", "f": "My cousin Ray walks his neighbors' dogs after school because he wants to make money for a new bike."}, {"g": "", "t": "make noise", "p": "(v.phr.)", "e": "make loud sounds", "z": "製造噪音", "s": "Please don't _____ _____ in the library, because other students are reading and studying for their exams.", "c": "請不要在圖書館【製造噪音】，因為其他學生正在閱讀並準備考試。", "f": "Please don't make noise in the library, because other students are reading and studying for their exams."}, {"g": "", "t": "make one's dream come true", "p": "(v.phr.)", "e": "make what you hope for really happen", "z": "讓夢想成真", "s": "Jenny practiced singing every day because she wanted to _____ her _____ _____ _____ and become a famous singer.", "c": "珍妮每天練習唱歌，因為她想【讓夢想成真】，成為一位知名歌手。", "f": "Jenny practiced singing every day because she wanted to make her dream come true and become a famous singer."}, {"g": "", "t": "make reservations", "p": "(v.phr.)", "e": "to ask a place to save seats for you", "z": "預約", "s": "Mother's Day is very busy for restaurants, so Dad _____ _____ two weeks early to make sure we had a table.", "c": "母親節餐廳很忙，所以爸爸兩週前就【預約】了，確保我們有位子。", "f": "Mother's Day is very busy for restaurants, so Dad made reservations two weeks early to make sure we had a table."}, {"g": "", "t": "make sure + that 子句", "p": "(v.phr.)", "e": "to check that something is true or done", "z": "確定、確保", "s": "Before you leave the classroom, please _____ _____ all the windows are closed, because it might rain heavily tonight.", "c": "離開教室前，請【確定】所有窗戶都關好了，因為今晚可能會下大雨。", "f": "Before you leave the classroom, please make sure all the windows are closed, because it might rain heavily tonight."}, {"g": "", "t": "make tea", "p": "(v.phr.)", "e": "prepare a hot tea drink", "z": "泡茶", "s": "When Grandma visits us on weekends, I always _____ _____ for her because she likes hot drinks in the afternoon.", "c": "奶奶週末來看我們時，我總是幫她【泡茶】，因為她下午喜歡喝熱飲。", "f": "When Grandma visits us on weekends, I always make tea for her because she likes hot drinks in the afternoon."}, {"g": "", "t": "make the bed", "p": "(v.phr.)", "e": "put the sheets and blanket neatly on a bed", "z": "鋪床", "s": "Every morning before breakfast, my parents ask me to _____ _____ _____ and open my window to let in fresh air.", "c": "每天早餐前，爸媽都要我【鋪床】，並打開窗戶讓新鮮空氣進來。", "f": "Every morning before breakfast, my parents ask me to make the bed and open my window to let in fresh air."}, {"g": "", "t": "make the best of + N", "p": "(v.phr.)", "e": "to use a bad situation as well as possible", "z": "充分利用", "s": "It rained on the first day of our trip to Hualien, but we _____ _____ _____ _____ it by visiting a museum and a night market.", "c": "我們去花蓮旅行的第一天下雨了，但我們去參觀博物館和夜市，【充分利用】了這一天。", "f": "
