<script>window.QUIZ_CONFIG={"title": "國中會考單字片語｜動詞片語 Verb Phrases", "mode": "mcq", "questions": [{"id": 1, "question": "Don't be sad, Tom. ______! You can win the game next time.", "options": ["Cheer up", "Get the flu", "Call back", "Line up"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) Cheer up\n【用語】cheer up (+ 人) (v.phr.)：振作；使……振作\n【中譯】別難過，Tom。振作起來！你下次可以贏得比賽。", "explanationSource": "supplemental"}, {"id": 2, "question": "Please move your big box. It ______, and I can't get to my desk.", "options": ["gets in my way", "places an order", "sets a record", "kicks off"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) gets in my way\n【用語】get in one's way (v.phr.)：妨礙（某人）\n【中譯】請移開你的大箱子。它擋到我的路，我走不到我的書桌。", "explanationSource": "supplemental"}, {"id": 3, "question": "People who hurt animals really ______.", "options": ["agree on it", "keep in shape", "make me sick", "love me deeply"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) make me sick\n【用語】make + 人 + sick (v.phr.)：讓人作噁；令人反感\n【中譯】傷害動物的人真的讓我很反感。", "explanationSource": "supplemental"}, {"id": 4, "question": "Ben didn't steal the watch. Someone put it in his bag to ______.", "options": ["call him back", "show him around", "set him up", "pull out a tooth"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) set him up\n【用語】set up + 人 (v.phr.)：陷害\n【中譯】Ben沒有偷那支手錶。有人把它放進他的包包裡來陷害他。", "explanationSource": "supplemental"}, {"id": 5, "question": "In 2015, Mr. Wang ______. It started with only three workers, and now it has 200.", "options": ["minded his manners", "set up a company", "arrived in Taipei", "took a nap"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) set up a company\n【用語】set up + N (v.phr.)：建立、設立\n【中譯】王先生在2015年成立了一家公司。它一開始只有三名員工，現在有200名。", "explanationSource": "supplemental"}, {"id": 6, "question": "Tim said he was sick, so he could ______ cleaning his room.", "options": ["go on", "take up", "get out of", "keep"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) get out of\n【用語】get out of + V-ing (v.phr.)：逃避（做某事）\n【中譯】Tim說他生病了，這樣他就可以逃避打掃房間。", "explanationSource": "supplemental"}, {"id": 7, "question": "It's cold outside. ______ your coat before you go out.", "options": ["Put on", "Take off", "Turn to", "Throw out"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) Put on\n【用語】put on + N (v.phr.)：穿上、戴上\n【中譯】外面很冷。出門前穿上你的外套。", "explanationSource": "supplemental"}, {"id": 8, "question": "My dad needs to send an email, so he wants to ______ for a few minutes.", "options": ["elbow his way to the door", "use the computer", "pay a heavy price", "take a shower"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) use the computer\n【用語】use the computer (v.phr.)：用電腦\n【中譯】我爸爸需要寄一封電子郵件，所以他想用一下電腦幾分鐘。", "explanationSource": "supplemental"}, {"id": 9, "question": "This math problem was really hard, but after an hour Amy finally ______.", "options": ["worked it out", "went sightseeing", "took our order", "made a cake"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) worked it out\n【用語】work out + N (v.phr.)：解決、想出（辦法）\n【中譯】這道數學題真的很難，但一小時後Amy終於把它解出來了。", "explanationSource": "supplemental"}, {"id": 10, "question": "We have a long holiday next week, so my family will ______ to Japan.", "options": ["take it out", "string me along", "make a wish", "take a trip"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) take a trip\n【用語】take a trip (v.phr.)：去旅行\n【中譯】我們下週有長假，所以我的家人會去日本旅行。", "explanationSource": "supplemental"}, {"id": 11, "question": "Ben has a big cake. He wants to ______ with his classmates.", "options": ["fly a plane", "share it", "make a promise", "turn left"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) share it\n【用語】share + N + with + 人 (v.phr.)：與……分享\n【中譯】Ben有一個大蛋糕。他想和同學們分享。", "explanationSource": "supplemental"}, {"id": 12, "question": "The boy fell into the river and began to ______.", "options": ["take notes", "come around", "cry for help", "get off the bus"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) cry for help\n【用語】cry for help (v.phr.)：呼救；求救\n【中譯】那個男孩掉進河裡，開始大聲呼救。", "explanationSource": "supplemental"}, {"id": 13, "question": "The dog ran fast and ______ to get out of the yard.", "options": ["took a photo", "made cookies", "jumped over the wall", "put together a puzzle"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) jumped over the wall\n【用語】jump over + N (v.phr.)：跳過\n【中譯】那隻狗跑得很快，跳過牆逃出了院子。", "explanationSource": "supplemental"}, {"id": 14, "question": "In Japan, students stand up and ______ the teacher at the start of every class.", "options": ["run after", "bow to", "look up", "talk about"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) bow to\n【用語】bow to + 人 (v.phr.)：對……鞠躬\n【中譯】在日本，每堂課開始時學生都會站起來向老師鞠躬。", "explanationSource": "supplemental"}, {"id": 15, "question": "There is a problem with our class trip, and the teacher is trying to ______ now.", "options": ["make up her face", "make it a habit", "deal with it", "show it off"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) deal with it\n【用語】deal with + N (v.phr.)：處理（問題）\n【中譯】我們的校外教學出了一個問題，老師現在正試著處理它。", "explanationSource": "supplemental"}, {"id": 16, "question": "Mr. Lee's family is poor. They don't have much money, but they can still ______.", "options": ["set the clock", "change the view of it", "get by", "turn left"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) get by\n【用語】get by (v.phr.)：勉強過活，湊合\n【中譯】李先生家很窮。他們沒有很多錢，但仍然可以勉強過活。", "explanationSource": "supplemental"}, {"id": 17, "question": "When Lily heard the sad news, she ______.", "options": ["burst into tears", "made a wish", "helped herself to the cake", "brushed her teeth"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) burst into tears\n【用語】burst into + N (v.phr.)：突然……（大哭、大笑）\n【中譯】Lily聽到這個悲傷的消息時，突然大哭起來。", "explanationSource": "supplemental"}, {"id": 18, "question": "Tom played games in class, so the teacher ______.", "options": ["messed around", "ran through the park", "gave away his phone", "took away his phone"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) took away his phone\n【用語】take away + N (v.phr.)：拿走\n【中譯】Tom在課堂上玩遊戲，所以老師把他的手機拿走了。", "explanationSource": "supplemental"}, {"id": 19, "question": "After I read this book about sharks, I ______. Now I think they are cute, not scary.", "options": ["did my best", "put up with them", "changed my view of them", "jumped over them"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) changed my view of them\n【用語】change one's view of + N (v.phr.)：改變對……的看法\n【中譯】讀了這本關於鯊魚的書之後，我改變了對牠們的看法。現在我覺得牠們很可愛，不可怕。", "explanationSource": "supplemental"}, {"id": 20, "question": "Mr. Lin is kind and funny. Many students ______ the best teacher in our school.", "options": ["ask him to be", "get him to be", "tell him to be", "consider him to be"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) consider him to be\n【用語】consider + N + to be + adj./N (v.phr.)：認為…是…\n【中譯】林老師親切又風趣。許多學生認為他是我們學校最好的老師。", "explanationSource": "supplemental"}, {"id": 21, "question": "This soup has no meat in it, but it ______.", "options": ["lets go of the spoon", "makes ends meet", "turns right", "tastes like chicken"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) tastes like chicken\n【用語】taste like + N (v.phr.)：嘗起來像⋯⋯\n【中譯】這碗湯裡沒有肉，但它嘗起來像雞肉。", "explanationSource": "supplemental"}, {"id": 22, "question": "Some money in the office is missing. The police will ______ it to find out who took it.", "options": ["pay a visit to", "look into", "laugh at", "go ahead with"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) look into\n【用語】look into + N (v.phr.)：調查\n【中譯】辦公室裡有一些錢不見了。警方會調查這件事，查出是誰拿走的。", "explanationSource": "supplemental"}, {"id": 23, "question": "Sadly, many fish in the river ______.", "options": ["had a sale", "lived on", "played a game", "died from the dirty water"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) died from the dirty water\n【用語】die from + N (v.phr.)：死於（外因、受傷、意外）\n【中譯】令人難過的是，河裡很多魚因為髒水而死。", "explanationSource": "supplemental"}, {"id": 24, "question": "My uncle is a pilot. His job is to ______.", "options": ["make tea", "spend money on clothes", "fly a plane", "kick off the game"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) fly a plane\n【用語】fly a plane (v.phr.)：開飛機\n【中譯】我叔叔是飛行員。他的工作是開飛機。", "explanationSource": "supplemental"}, {"id": 25, "question": "Mia was very sad when her dog died. It took her a year to ______.", "options": ["give it back", "make a phone call", "fall asleep", "get over it"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) get over it\n【用語】get over + N (v.phr.)：忘懷、走出（傷痛、陰影）\n【中譯】Mia的狗死掉時她非常難過。她花了一年才走出傷痛。", "explanationSource": "supplemental"}, {"id": 26, "question": "We ______, so Mom went to the store to buy some.", "options": ["dealt with the boy", "ran out of milk", "kept pets", "found it easy to cook"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) ran out of milk\n【用語】run out of + N (v.phr.)：用光；缺乏\n【中譯】我們的牛奶用光了，所以媽媽去商店買一些。", "explanationSource": "supplemental"}, {"id": 27, "question": "Mrs. Wu ______ last night, so Mom made tea for her.", "options": ["got to sleep early", "came around", "invited me to the zoo", "had interest in cooking"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) came around\n【用語】come around (v.phr.)：拜訪\n【中譯】吳太太昨晚來拜訪，所以媽媽為她泡了茶。", "explanationSource": "supplemental"}, {"id": 28, "question": "Mom, my friend Jack wants to ______ and play video games after school. Is that OK?", "options": ["get out of our house", "overlook our house", "come over to our house", "move away from our house"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) come over to our house\n【用語】come over (v.phr.)：過來\n【中譯】媽，我朋友Jack放學後想到我們家來打電動。可以嗎？", "explanationSource": "supplemental"}, {"id": 29, "question": "The other kids ______ because Ben's shoes were old and dirty, and he felt very sad.", "options": ["laughed at him", "took turns playing", "cheered for him", "cut him short"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) laughed at him\n【用語】laugh at + 人 (v.phr.)：嘲笑\n【中譯】其他孩子因為Ben的鞋子又舊又髒而嘲笑他，他覺得很難過。", "explanationSource": "supplemental"}, {"id": 30, "question": "Grandpa is never in a hurry. At breakfast, he always ______.", "options": ["runs out of time", "takes his time over his food", "tends to eat very fast", "gets out of the car"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) takes his time over his food\n【用語】take one's time over + N (v.phr.)：從容地做…\n【中譯】爺爺從不匆忙。吃早餐時，他總是從容地慢慢吃。", "explanationSource": "supplemental"}, {"id": 31, "question": "Grandma boiled some water to ______ for her guests.", "options": ["make tea", "take a long time", "lie down", "walk up the stairs"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) make tea\n【用語】make tea (v.phr.)：泡茶\n【中譯】奶奶燒了一些水，要為客人泡茶。", "explanationSource": "supplemental"}, {"id": 32, "question": "The light is green now. We can ______ safely.", "options": ["walk across the street", "get it even", "give it back", "stay in bed"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) walk across the street\n【用語】walk across the street (v.phr.)：走過馬路\n【中譯】現在是綠燈了。我們可以安全地走過馬路。", "explanationSource": "supplemental"}, {"id": 33, "question": "You failed the test because you didn't study. You need to ______.", "options": ["face the truth", "wipe it out", "tell a lie", "make trouble"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) face the truth\n【用語】face the truth (v.phr.)：面對真相\n【中譯】你考試不及格是因為你沒讀書。你必須面對真相。", "explanationSource": "supplemental"}, {"id": 34, "question": "Last night, a thief ______ and stole our TV.", "options": ["left the door locked", "turned down my offer", "kept pets", "broke in"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) broke in\n【用語】break in (v.phr.)：闖入、強行進入\n【中譯】昨晚有個小偷闖進來，偷走了我們的電視。", "explanationSource": "supplemental"}, {"id": 35, "question": "Amy and I both love music and dogs. We ______.", "options": ["set aside some money", "win the bet", "have many things in common", "stay calm"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) have many things in common\n【用語】have + N + in common (v.phr.)：有……共同點\n【中譯】Amy和我都喜歡音樂和狗。我們有很多共同點。", "explanationSource": "supplemental"}, {"id": 36, "question": "Ben played in the snow without a coat, so he ______ and stayed in bed for three days.", "options": ["showed off his new coat", "used to be strong", "looked like a snowman", "ended up sick"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) ended up sick\n【用語】end up + adj. (v.phr.)：最終變得……\n【中譯】Ben沒穿外套在雪地裡玩，所以他最後生病了，在床上躺了三天。", "explanationSource": "supplemental"}, {"id": 37, "question": "When I ______, I saw a bird in the tree.", "options": ["couldn't help but laugh", "cut it out", "looked up", "held on"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) looked up\n【用語】look up (v.phr.)：仰視、抬頭\n【中譯】當我抬起頭時，看到樹上有一隻鳥。", "explanationSource": "supplemental"}, {"id": 38, "question": "Taipei has the MRT, so it's easy to ______.", "options": ["get around the city", "take the picture down", "have a cold", "put the book aside"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) get around the city\n【用語】get around + 地方 (v.phr.)：四處走動；到處旅行\n【中譯】台北有捷運，所以在城市裡四處走動很容易。", "explanationSource": "supplemental"}, {"id": 39, "question": "A: The answer is B because \"yesterday\" means the past.\nB: Oh, I ______ now. Thank you!", "options": ["get it", "lose my way", "take a break", "see it as a game"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) get it\n【用語】get it (v.phr.)：懂了；理解了\n【中譯】A：答案是B，因為「yesterday」表示過去。B：喔，我現在懂了。謝謝你！", "explanationSource": "supplemental"}, {"id": 40, "question": "Jack works at a restaurant on weekends to ______.", "options": ["earn money", "make a guess", "have the upper hand", "have a hard time"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) earn money\n【用語】earn money (v.phr.)：賺錢\n【中譯】Jack週末在一家餐廳工作來賺錢。", "explanationSource": "supplemental"}, {"id": 41, "question": "There is a lot of trash in the river, but the city ______. The river is still dirty.", "options": ["got out of my way", "took off", "did nothing about it", "kept in touch"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) did nothing about it\n【用語】do nothing about + N (v.phr.)：對…無作為；什麼也不做\n【中譯】河裡有很多垃圾，但市政府對此什麼也沒做。這條河還是很髒。", "explanationSource": "supplemental"}, {"id": 42, "question": "Drinking a cup of coffee in the morning can ______.", "options": ["go out", "kick-start my day", "put down the cup", "tell a lie"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) kick-start my day\n【用語】kick-start + N (v.phr.)：啟動；加速（比喻用法）\n【中譯】早上喝一杯咖啡可以啟動我的一天。", "explanationSource": "supplemental"}, {"id": 43, "question": "The road is bumpy, so the bus driver told the kids to ______.", "options": ["stand up", "jump over the seats", "sit tight", "cut in the line"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) sit tight\n【用語】sit tight (v.phr.)：穩穩坐好\n【中譯】路面很顛簸，所以公車司機叫孩子們穩穩坐好。", "explanationSource": "supplemental"}, {"id": 44, "question": "The market is very crowded. You should ______ so you won't get lost.", "options": ["run away from me", "stay close to me", "spend the vacation", "make a mess"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) stay close to me\n【用語】stay close to + 人/物 (v.phr.)：靠近；接近\n【中譯】市場非常擁擠。你應該靠近我，這樣你就不會走丟。", "explanationSource": "supplemental"}, {"id": 45, "question": "The news about the new teacher ______ quickly. Soon everyone in school knew.", "options": ["slipped my mind", "died out", "took place", "got around"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) got around\n【用語】get around (v.phr.)：傳開\n【中譯】關於新老師的消息很快就傳開了。很快全校都知道了。", "explanationSource": "supplemental"}, {"id": 46, "question": "Ben's eyes are not good, so he ______ reading small words in books.", "options": ["has problems", "has fun", "gives me a hand", "does a good job"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) has problems\n【用語】have problems + V-ing (v.phr.)：在…方面有問題\n【中譯】班的眼睛不好，所以他在閱讀書中的小字方面有問題。", "explanationSource": "supplemental"}, {"id": 47, "question": "Everyone said 'Great idea!' when Tina ______ for our class party.", "options": ["smelled like a cake", "fell asleep", "paid the bills", "came up with a fun plan"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) came up with a fun plan\n【用語】come up with + N (v.phr.)：想出\n【中譯】當蒂娜為我們的班級派對想出一個好玩的計畫時，大家都說：「好主意！」", "explanationSource": "supplemental"}, {"id": 48, "question": "Tom's teeth got better after he ______ and stopped eating candy.", "options": ["listened to his dentist's advice", "walked past the dentist's office", "consisted of three parts", "stayed up late"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) listened to his dentist's advice\n【用語】listen to one's advice (v.phr.)：聽從某人的建議\n【中譯】湯姆聽從牙醫的建議、不再吃糖果之後，他的牙齒變好了。", "explanationSource": "supplemental"}, {"id": 49, "question": "Mr. Chen is sick today, so Ms. Lin will ______ and teach our math class.", "options": ["take notes in class", "get on the bus", "do the dishes", "take the place of Mr. Chen"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) take the place of Mr. Chen\n【用語】take the place of + 人/物 (v.phr.)：取代、代理…某人地位\n【中譯】陳老師今天生病，所以林老師會代替陳老師教我們的數學課。", "explanationSource": "supplemental"}, {"id": 50, "question": "The plan to clean the beach was hard, but the students ______ in the end, and the beach was clean again.", "options": ["took a break", "reached for the stars", "did the cooking", "carried it through"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) carried it through\n【用語】carry through + N (v.phr.)：完成；貫徹\n【中譯】淨灘計畫很困難，但學生們最後貫徹完成了，海灘又變乾淨了。", "explanationSource": "supplemental"}, {"id": 51, "question": "Amy missed two weeks of school, so she ______ and had to study hard to catch up with her classmates.", "options": ["made friends", "fell behind", "lost touch with her old friend", "burned down her house"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) fell behind\n【用語】fall behind (v.phr.)：落後\n【中譯】艾咪兩週沒上學，所以她落後了，必須努力讀書才能趕上同學。", "explanationSource": "supplemental"}, {"id": 52, "question": "The new park ______ a lot of changes in our town.", "options": ["referred to", "threw away", "brought about", "noted down"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) brought about\n【用語】bring about + N (v.phr.)：引起；導致\n【中譯】新公園為我們鎮上帶來了許多改變。", "explanationSource": "supplemental"}, {"id": 53, "question": "You look great today! Your red skirt ______.", "options": ["stops by the store", "goes with your white shirt", "wakes up early", "answers the door"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) goes with your white shirt\n【用語】go with + N (v.phr.)：與……相配\n【中譯】你今天看起來很棒！你的紅裙子和你的白襯衫很相配。", "explanationSource": "supplemental"}, {"id": 54, "question": "When Mr. Lee got too old to work, his son ______, so the shop is still open today.", "options": ["fed on the noodles", "did his homework", "took over the noodle shop", "took in the information"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) took over the noodle shop\n【用語】take over + N (v.phr.)：接管\n【中譯】當李先生年紀太大無法工作時，他的兒子接管了麵店，所以這家店今天仍然營業。", "explanationSource": "supplemental"}, {"id": 55, "question": "Before you blow out the candles on your birthday cake, close your eyes and ______.", "options": ["take a shortcut", "pay off", "make a wish", "take a shower"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) make a wish\n【用語】make a wish (v.phr.)：許願\n【中譯】在你吹熄生日蛋糕上的蠟燭之前，閉上眼睛許個願。", "explanationSource": "supplemental"}, {"id": 56, "question": "Uncle Tom was flying to Japan, so we went to the airport to ______.", "options": ["see him off", "make a plan for dinner", "bring out the best in him", "do the dishes"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) see him off\n【用語】see sb off (v.phr.)：送行\n【中譯】湯姆叔叔要搭飛機去日本，所以我們去機場為他送行。", "explanationSource": "supplemental"}, {"id": 57, "question": "The firefighters ran into the burning building to ______.", "options": ["save lives", "take a nap", "save energy", "hand in their homework"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) save lives\n【用語】save lives (v.phr.)：挽救生命\n【中譯】消防員衝進燃燒中的大樓去挽救生命。", "explanationSource": "supplemental"}, {"id": 58, "question": "Kevin wants to work at the coffee shop this summer, so he ______ yesterday.", "options": ["set up a tent", "took a bath", "treated the cat gently", "applied for a job there"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) applied for a job there\n【用語】apply for + N (v.phr.)：申請、應徵\n【中譯】凱文今年夏天想在咖啡店工作，所以他昨天去應徵了那裡的工作。", "explanationSource": "supplemental"}, {"id": 59, "question": "My dad ______ last year, and now he is much healthier.", "options": ["gave up smoking", "went on smoking", "told me to go to bed", "lost his way"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) gave up smoking\n【用語】give up + N/V-ing (v.phr.)：戒除\n【中譯】我爸爸去年戒了菸，現在他健康多了。", "explanationSource": "supplemental"}, {"id": 60, "question": "Lisa ran 100 meters faster than any student before and ______ for our school.", "options": ["had a fever", "set the record", "had a good sleep", "missed the train"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) set the record\n【用語】set the record (v.phr.)：創下紀錄\n【中譯】麗莎跑一百公尺比以前任何學生都快，為我們學校創下了紀錄。", "explanationSource": "supplemental"}, {"id": 61, "question": "That dog looks angry, so you should ______ and not try to touch it.", "options": ["pick it up", "stay away from it", "come back to play with it", "exercise your right to vote"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) stay away from it\n【用語】stay away from + N/人 (v.phr.)：遠離\n【中譯】那隻狗看起來很生氣，所以你應該遠離牠，不要試著摸牠。", "explanationSource": "supplemental"}, {"id": 62, "question": "Grandpa said, 'You can't go back and ______, but you can learn from them.'", "options": ["catch a cold", "make sure the door is closed", "fix past mistakes", "give me a ring"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) fix past mistakes\n【用語】fix past mistakes (v.phr.)：修正過去的錯誤\n【中譯】爺爺說：「你無法回到過去修正過去的錯誤，但你可以從中學習。」", "explanationSource": "supplemental"}, {"id": 63, "question": "I'm always late for school, so I need to ______ and go to bed earlier.", "options": ["make a change", "think of my birthday", "eat out", "play the piano"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) make a change\n【用語】make a change (v.phr.)：做出改變\n【中譯】我上學總是遲到，所以我需要做出改變，早點睡覺。", "explanationSource": "supplemental"}, {"id": 64, "question": "After thinking about it for a long time, Mia ______ next year.", "options": ["decided to study in Japan", "came down with a cold", "got in touch with her teacher", "lost weight"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) decided to study in Japan\n【用語】decide to + VR (v.phr.)：決定去做⋯⋯\n【中譯】經過長時間的思考後，米亞決定明年去日本讀書。", "explanationSource": "supplemental"}, {"id": 65, "question": "Mom wants to learn to cook Japanese food, so she ______ at a cooking school last summer.", "options": ["took a course", "went ahead", "took a walk", "cheered for her friend"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) took a course\n【用語】take a course (v.phr.)：修課\n【中譯】媽媽想學做日本料理，所以她去年夏天在一所烹飪學校修了一門課。", "explanationSource": "supplemental"}, {"id": 66, "question": "Even though some people didn't like the plan, the mayor ______, and the new park opened last month.", "options": ["got up", "pushed it through", "stayed up", "broke up"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) pushed it through\n【用語】push through + N (v.phr.)：推動；強行通過（計畫、法案）\n【中譯】雖然有些人不喜歡這個計畫，市長還是強力推動通過了，新公園上個月開放了。", "explanationSource": "supplemental"}, {"id": 67, "question": "These flowers ______ a sweet smell in the evening.", "options": ["save up", "make up", "give off", "throw away"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) give off\n【用語】give off + N (v.phr.)：散發出（氣味、光、熱）\n【中譯】這些花在傍晚散發出甜甜的香味。", "explanationSource": "supplemental"}, {"id": 68, "question": "Can you buy some milk on your way home? That will ______ to the store.", "options": ["push through", "wake me up", "save me a trip", "set the clock"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) save me a trip\n【用語】save + 人 + a trip (v.phr.)：省去某人跑一趟\n【中譯】你回家的路上可以幫我買些牛奶嗎？那會省得我跑一趟商店。", "explanationSource": "supplemental"}, {"id": 69, "question": "I missed Grandma, so I ______ last night and asked how she was.", "options": ["took a shower", "called her up", "used to visit her", "turned in early"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) called her up\n【用語】call up + 人 (v.phr.)：打電話\n【中譯】我很想念奶奶，所以我昨晚打電話給她，問她過得好不好。", "explanationSource": "supplemental"}, {"id": 70, "question": "The last bus leaves at nine, so I ______ now, or I'll miss it.", "options": ["have to leave", "appeal to the driver", "eat out", "turn down the volume"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) have to leave\n【用語】have to + VR (v.phr.)：必須\n【中譯】最後一班公車九點開，所以我現在必須離開，不然會錯過它。", "explanationSource": "supplemental"}, {"id": 71, "question": "While I was cleaning my room yesterday, I ______ and showed it to my mom.", "options": ["carried on singing", "made noise", "came across an old photo", "kept it simple"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) came across an old photo\n【用語】come across + 物 (v.phr.)：碰巧發現（某物）\n【中譯】我昨天打掃房間時，碰巧發現一張舊照片，並拿給我媽媽看。", "explanationSource": "supplemental"}, {"id": 72, "question": "The bus was very slow in the rain, so we didn't ______ until ten o'clock at night.", "options": ["keep healthy", "make friends", "get home", "rule out"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) get home\n【用語】get home/there/here (v.phr.)：回家／到那裡／到這裡\n【中譯】公車在雨中開得很慢，所以我們直到晚上十點才到家。", "explanationSource": "supplemental"}, {"id": 73, "question": "When I met my new teacher, I ______ and said, 'Nice to meet you.'", "options": ["laughed at her", "shook hands with her", "gave away her secret", "came out of the trash can"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) shook hands with her\n【用語】shake hands with + 人 (v.phr.)：和…握手\n【中譯】我遇見新老師時，和她握手並說：「很高興認識您。」", "explanationSource": "supplemental"}, {"id": 74, "question": "We had to build our sand castle again because the big waves ______.", "options": ["brushed their hair", "washed it away", "took a walk", "told the boys from the girls"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) washed it away\n【用語】wash away + N (v.phr.)：沖走\n【中譯】我們必須重新堆沙堡，因為大浪把它沖走了。", "explanationSource": "supplemental"}, {"id": 75, "question": "Jenny's dream ______ when she became a doctor.", "options": ["recorded the sound", "came true", "smiled at her", "grew up"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) came true\n【用語】come true (v.phr.)：實現\n【中譯】珍妮成為醫生時，她的夢想實現了。", "explanationSource": "supplemental"}, {"id": 76, "question": "It's very hot in here. Please ______ when you go out.", "options": ["take up the pen", "turn on the heater", "leave the window open", "know your way around the city"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) leave the window open\n【用語】leave the window open (v.phr.)：讓窗戶開著\n【中譯】這裡很熱，你出去的時候請讓窗戶開著。", "explanationSource": "supplemental"}, {"id": 77, "question": "I lost my keys. Can you help me ______?", "options": ["save money", "throw them away", "make way for the bus", "look for them"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) look for them\n【用語】look for + N (v.phr.)：尋找\n【中譯】我把鑰匙弄丟了，你能幫我找它們嗎？", "explanationSource": "supplemental"}, {"id": 78, "question": "My grandpa can't hear well, so he ______.", "options": ["has fun listening to music", "goes picnicking every day", "has difficulty talking on the phone", "makes believe he is a king"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) has difficulty talking on the phone\n【用語】have difficulty + V-ing (v.phr.)：做某事有困難\n【中譯】我爺爺聽力不好，所以他講電話有困難。", "explanationSource": "supplemental"}, {"id": 79, "question": "This movie ______, so my brother, who loves animals, wants to see it.", "options": ["makes a decision to go", "has to do with wild animals", "lives from hand to mouth", "looks after the animals"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) has to do with wild animals\n【用語】have to do with + N (v.phr.)：與……有關\n【中譯】這部電影和野生動物有關，所以我那喜愛動物的弟弟想看。", "explanationSource": "supplemental"}, {"id": 80, "question": "The wind was so strong that it ______.", "options": ["put on my coat", "blew my hat away", "tried it my way", "took pictures"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) blew my hat away\n【用語】blow + 物 + away (v.phr.)：吹走\n【中譯】風太強了，把我的帽子吹走了。", "explanationSource": "supplemental"}, {"id": 81, "question": "The kids played with flour and eggs and ______ in the kitchen, so Mom had to clean it for an hour.", "options": ["took a nap", "looked forward to cooking", "made a mess", "raised pets"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) made a mess\n【用語】make a mess (v.phr.)：弄得一團亂\n【中譯】孩子們玩麵粉和蛋，在廚房裡弄得一團亂，所以媽媽得清理一個小時。", "explanationSource": "supplemental"}, {"id": 82, "question": "Amy wants to buy a new bike, so she ______ every week.", "options": ["puts aside some money", "pushes her way through the crowd", "eats out", "goes crazy"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) puts aside some money\n【用語】put aside + N (v.phr.)：保留；儲蓄\n【中譯】艾咪想買一台新腳踏車，所以她每週都存一些錢。", "explanationSource": "supplemental"}, {"id": 83, "question": "Lily has the same name as her grandma because her parents ______.", "options": ["took a nap", "named her after her grandma", "lent money to her", "got even with her"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) named her after her grandma\n【用語】name + N + after + N (v.phr.)：以……命名\n【中譯】莉莉和她奶奶同名，因為她的父母以奶奶的名字為她命名。", "explanationSource": "supplemental"}, {"id": 84, "question": "A message ______ on my phone screen while I was doing homework.", "options": ["took off", "got along", "hung up", "popped up"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) popped up\n【用語】pop up (v.phr.)：突然發生或出現\n【中譯】我在寫作業時，一則訊息突然出現在我的手機螢幕上。", "explanationSource": "supplemental"}, {"id": 85, "question": "Mr. Wang has taken care of me since I was a baby, so I ______ even though he is my uncle.", "options": ["laugh at him", "take the initiative to talk", "go to the park", "view him as my father"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) view him as my father\n【用語】view + N + as + N (v.phr.)：將…視為…\n【中譯】王先生從我還是嬰兒時就照顧我，所以即使他是我的叔叔，我仍將他視為我的父親。", "explanationSource": "supplemental"}, {"id": 86, "question": "A: We lost the game again.\nB: Don't be sad. Try to ______; we learned a lot today.", "options": ["stand up against the team", "get out of the car", "look at the bright side", "take a shower"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) look at the bright side\n【用語】look at the bright side (v.phr.)：看光明面；往好處想\n【中譯】A：我們又輸了比賽。\nB：別難過，試著往好處想，我們今天學到了很多。", "explanationSource": "supplemental"}, {"id": 87, "question": "Don't worry about the dinner party; I'll ______.", "options": ["see through you", "see to everything", "agree with you", "raise children"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) see to everything\n【用語】see to + N (v.phr.)：辦理、照料、負責處理\n【中譯】別擔心晚宴的事，我會處理好一切。", "explanationSource": "supplemental"}, {"id": 88, "question": "My little sister said she was a queen, so I ______ and bowed to her.", "options": ["returned the book", "did homework", "played the music", "played along"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) played along\n【用語】play along (v.phr.)：假裝配合；順著演\n【中譯】我妹妹說她是女王，所以我就順著演，向她鞠躬。", "explanationSource": "supplemental"}, {"id": 89, "question": "We went to a farm and ______. Now we have a big bag of apples.", "options": ["picked fruit", "cut down trees", "hurried up", "kept him busy"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) picked fruit\n【用語】pick fruit (v.phr.)：摘水果\n【中譯】我們去了一個農場摘水果。現在我們有一大袋蘋果。", "explanationSource": "supplemental"}, {"id": 90, "question": "When the bus stopped, the kids ______ and ran to the park.", "options": ["dropped me a line", "hopped off the bus", "got on the bus", "turned down the heater"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) hopped off the bus\n【用語】hop off + N (v.phr.)：跳下（車等）\n【中譯】公車停下來時，孩子們跳下公車，跑向公園。", "explanationSource": "supplemental"}, {"id": 91, "question": "All my cousins ______ at Grandma's house every Chinese New Year to eat and play games.", "options": ["dream of", "fall asleep", "work as", "get together"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) get together\n【用語】get together (v.phr.)：聚在一起\n【中譯】每年農曆新年，我所有的表兄弟姊妹都會在奶奶家聚在一起吃東西、玩遊戲。", "explanationSource": "supplemental"}, {"id": 92, "question": "Children need to ______ every day, so they should drink milk and eat fruit.", "options": ["cut the paper", "take in enough vitamins", "make a noise", "keep their desks in order"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) take in enough vitamins\n【用語】take in + N (v.phr.)：攝取（營養、食物等）\n【中譯】孩子們每天需要攝取足夠的維生素，所以他們應該喝牛奶、吃水果。", "explanationSource": "supplemental"}, {"id": 93, "question": "The sudden rain ______. None of us had an umbrella with us.", "options": ["won the bet", "lit up the candles", "took us by surprise", "bridged the gap"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) took us by surprise\n【用語】take sb. by surprise (v.phr.)：讓某人吃一驚\n【中譯】這場突如其來的雨讓我們措手不及。我們都沒有帶傘。", "explanationSource": "supplemental"}, {"id": 94, "question": "Amy and Ben had a fight yesterday, but they ______ this morning and are good friends again.", "options": ["heard of it", "broke the record", "made up", "carried it through"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) made up\n【用語】make up (with sb.) (v.phr.)：（和某人）和好\n【中譯】Amy和Ben昨天吵了一架，但他們今天早上和好了，又是好朋友了。", "explanationSource": "supplemental"}, {"id": 95, "question": "Mom is working late tonight, so I have to stay home and ______.", "options": ["get a ticket", "hang up the phone", "look after my little sister", "go whale-watching"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) look after my little sister\n【用語】look after + 人 (v.phr.)：照顧\n【中譯】媽媽今晚要加班，所以我必須待在家照顧我的妹妹。", "explanationSource": "supplemental"}, {"id": 96, "question": "Mr. Lin helped Lisa a lot with math, so she wrote him a card to ______.", "options": ["check out his new car", "thank him for his help", "consider him to be lazy", "take a shortcut"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) thank him for his help\n【用語】thank + 人 + for + N/V-ing (v.phr.)：為了某事感謝某人\n【中譯】林老師在數學上幫了Lisa很多，所以她寫了一張卡片給他，感謝他的幫忙。", "explanationSource": "supplemental"}, {"id": 97, "question": "Thanks to a kind farmer who ______, we found our way back to the village.", "options": ["smelled sweet", "pointed the way", "caught up with an old friend", "took a nap"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) pointed the way\n【用語】point the way (v.phr.)：指引方向\n【中譯】多虧一位為我們指引方向的好心農夫，我們找到了回村莊的路。", "explanationSource": "supplemental"}, {"id": 98, "question": "My big brother is good at math, so he often ______ my math homework, and now I understand math better.", "options": ["returns to", "helps me with", "drops out of", "complains about"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) helps me with\n【用語】help + 人 + with + N (v.phr.)：幫忙（某人做）…\n【中譯】我哥哥數學很好，所以他常常幫我做數學作業，現在我更懂數學了。", "explanationSource": "supplemental"}, {"id": 99, "question": "A: Can I stay at your house tonight? I hope I won't ______.\nB: Not at all. You're always welcome here!", "options": ["get the whole picture", "keep my word", "put you out", "happen to see you"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) put you out\n【用語】put out + 人 (v.phr.)：給（某人）添麻煩、造成不便\n【中譯】A：我今晚可以住你家嗎？希望不會給你添麻煩。\nB：一點也不會。這裡永遠歡迎你！", "explanationSource": "supplemental"}, {"id": 100, "question": "In this story, the word \"he\" ______.", "options": ["treats the dog as a friend", "picks up a skill", "refers to the old farmer", "takes a nap"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) refers to the old farmer\n【用語】refer to + N (v.phr.)：意指\n【中譯】在這個故事裡，「he」這個字指的是那位老農夫。", "explanationSource": "supplemental"}, {"id": 101, "question": "Mary's parents give her everything she asks for, so she always ______.", "options": ["gets in", "gets her own way", "gives in", "passes on the message"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) gets her own way\n【用語】get one's (own) way (v.phr.)：為所欲為、隨心所欲\n【中譯】瑪麗的父母她要什麼就給什麼，所以她總是為所欲為。", "explanationSource": "supplemental"}, {"id": 102, "question": "A: Sorry, Tom. I have to ______. My mom needs my help in the kitchen.\nB: OK. Let's talk later.", "options": ["line up", "pull away", "let it go", "cut the conversation short"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) cut the conversation short\n【用語】cut the conversation short (v.phr.)：中斷對話\n【中譯】A：抱歉，Tom。我得中斷我們的對話了，我媽媽需要我在廚房幫忙。\nB：好，我們晚點再聊。", "explanationSource": "supplemental"}, {"id": 103, "question": "The taxi is waiting outside, so please ______ quickly before you get wet in the rain.", "options": ["hang up", "copy the answer", "try it on", "get in"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) get in\n【用語】get in (v.phr.)：進入（車輛）\n【中譯】計程車在外面等，所以請快點上車，免得被雨淋濕。", "explanationSource": "supplemental"}, {"id": 104, "question": "The little mouse was scared, so it ran as fast as it could to ______ the hungry cat.", "options": ["play a trick on", "get away from", "take a bus to", "look after"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) get away from\n【用語】get away from + N (v.phr.)：從……逃脫、遠離\n【中譯】那隻小老鼠很害怕，所以牠拚命地跑，想逃離那隻飢餓的貓。", "explanationSource": "supplemental"}, {"id": 105, "question": "You studied very hard, so don't ______; I'm sure you'll do well tomorrow.", "options": ["hang out with your friends", "watch a show", "worry about the test", "make a noise"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) worry about the test\n【用語】worry about + N/V-ing (v.phr.)：為…擔心\n【中譯】你讀書非常用功，所以別擔心考試；我相信你明天會考得很好。", "explanationSource": "supplemental"}, {"id": 106, "question": "I had only five minutes before the test, so I quickly ______.", "options": ["took a bath", "ran through my notes", "did a lot of good", "booked a room"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) ran through my notes\n【用語】run through + N (v.phr.)：瀏覽\n【中譯】考試前我只剩五分鐘，所以我快速地瀏覽了一下我的筆記。", "explanationSource": "supplemental"}, {"id": 107, "question": "On the map, the small red star ______.", "options": ["leaves behind a bag", "makes a noise", "stands for the capital city", "takes a joke"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) stands for the capital city\n【用語】stand for + N (v.phr.)：代表、象徵\n【中譯】在地圖上，那顆小紅星代表首都。", "explanationSource": "supplemental"}, {"id": 108, "question": "Dad finally ______, so we can go camping this weekend.", "options": ["took the box away from the shelf", "agreed to our plan", "lost his way", "asked for help"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) agreed to our plan\n【用語】agree to + N/VR (v.phr.)：同意（某事、提議）\n【中譯】爸爸終於同意了我們的計畫，所以我們這個週末可以去露營了。", "explanationSource": "supplemental"}, {"id": 109, "question": "When Amy first visited Tainan, she ______ at once and wanted to live there.", "options": ["fell in love with the city", "tasted sweet", "got the big picture", "took a nap"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) fell in love with the city\n【用語】fall in love with + 人 (v.phr.)：和某人談戀愛；愛上某人\n【中譯】Amy第一次造訪台南時，立刻就愛上了這座城市，並想住在那裡。", "explanationSource": "supplemental"}, {"id": 110, "question": "On the test paper, please ______ with the right words.", "options": ["fill in the blanks", "give out a loud sound", "turn off the lights", "prepare for the trip"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) fill in the blanks\n【用語】fill in + N (v.phr.)：填寫（空格）\n【中譯】在考卷上，請用正確的字填寫空格。", "explanationSource": "supplemental"}, {"id": 111, "question": "The doctor told the boy to ______ while she checked his ears.", "options": ["keep in mind that she was busy", "go for a swim", "agree with her on the plan", "stay still"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) stay still\n【用語】stay still (v.phr.)：保持靜止\n【中譯】醫生在檢查男孩的耳朵時，叫他保持不動。", "explanationSource": "supplemental"}, {"id": 112, "question": "Let's go to the theater and ______ tonight because I hear \"Super Cat\" is very funny.", "options": ["take off our shoes", "see a movie", "do the dishes", "take a wild guess"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) see a movie\n【用語】see a movie (v.phr.)：看電影\n【中譯】我們今晚去電影院看電影吧，因為我聽說《超級貓》很好笑。", "explanationSource": "supplemental"}, {"id": 113, "question": "The restaurant is always full on weekends, so we should ______ before we go.", "options": ["make reservations", "look around", "catch the train", "do the laundry"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) make reservations\n【用語】make reservations (v.phr.)：預約\n【中譯】那家餐廳週末總是客滿，所以我們去之前應該先預約。", "explanationSource": "supplemental"}, {"id": 114, "question": "The runner was very tired, but she ______ and finally reached the finish line.", "options": ["checked out", "kept running", "reminded me of my sister", "fell asleep"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) kept running\n【用語】keep + V-ing (v.phr.)：繼續做……\n【中譯】那位跑者非常累，但她繼續跑，終於到達了終點線。", "explanationSource": "supplemental"}, {"id": 115, "question": "At the school party, Tom ______ by walking and talking just like him, and everyone laughed.", "options": ["made up stories", "waved at our principal", "took off our principal", "bought a cake for our principal"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) took off our principal\n【用語】take off + 人 (v.phr.)：模仿（某人）\n【中譯】在學校派對上，Tom模仿我們的校長，走路和說話都跟他一模一樣，大家都笑了。", "explanationSource": "supplemental"}, {"id": 116, "question": "Before the trip, we sat down together to ______ for each day.", "options": ["occur to us", "break out", "make a plan", "pick fruit"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) make a plan\n【用語】make a plan (v.phr.)：訂計畫\n【中譯】旅行之前，我們一起坐下來為每一天訂計畫。", "explanationSource": "supplemental"}, {"id": 117, "question": "I have a math test tomorrow, so tonight I will ______ carefully.", "options": ["go over well", "turn my head", "take out the garbage", "go over my notes"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) go over my notes\n【用語】go over + N (v.phr.)：查看、複習、重溫\n【中譯】我明天有數學考試，所以今晚我會仔細地複習我的筆記。", "explanationSource": "supplemental"}, {"id": 118, "question": "Put on your jacket, or you'll ______ in this cold weather.", "options": ["work out", "lose weight", "make a habit of running", "catch a cold"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) catch a cold\n【用語】catch a cold (v.phr.)：感冒\n【中譯】穿上你的外套，不然在這麼冷的天氣裡你會感冒。", "explanationSource": "supplemental"}, {"id": 119, "question": "If you swim in the sea alone at night, you're just ______.", "options": ["making your friends smile", "asking for trouble", "doing the dishes", "getting out of the car"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) asking for trouble\n【用語】ask for trouble (v.phr.)：自找麻煩；自找苦吃\n【中譯】如果你晚上獨自在海裡游泳，那根本就是自找麻煩。", "explanationSource": "supplemental"}, {"id": 120, "question": "The hikers ______ at 6 a.m., so they reached the top of the mountain before noon.", "options": ["took a nap", "broke up", "set out", "had trouble waking up"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) set out\n【用語】set out (v.phr.)：出發、開始\n【中譯】健行者們早上六點出發，所以他們在中午前到達了山頂。", "explanationSource": "supplemental"}, {"id": 121, "question": "Your test is tomorrow, so stop ______ and start studying!", "options": ["getting full marks", "telling the truth", "fooling around", "falling apart"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) fooling around\n【用語】fool around (v.phr.)：鬼混、遊手好閒\n【中譯】你明天就要考試了，所以別再鬼混，開始讀書吧！", "explanationSource": "supplemental"}, {"id": 122, "question": "Mr. Chen told us to ______ by Friday because he wants to grade them over the weekend.", "options": ["turn over our desks", "borrow pens from him", "turn in our reports", "make faces at him"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) turn in our reports\n【用語】turn in + N (v.phr.)：繳交、交回\n【中譯】陳老師叫我們星期五前交報告，因為他想在週末批改。", "explanationSource": "supplemental"}, {"id": 123, "question": "We thought the new student would be shy, but she ______.", "options": ["commented on the weather", "took a nap", "focused on her phone", "turned out to be very outgoing"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) turned out to be very outgoing\n【用語】turn out + to + VR / that 子句 (v.phr.)：結果（是）\n【中譯】我們以為新同學會很害羞，結果她非常外向。", "explanationSource": "supplemental"}, {"id": 124, "question": "The dance was very difficult, but after practicing for months, the students ______ on stage.", "options": ["lost their way", "fell short of the goal", "pulled it off", "made certain that the door was locked"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) pulled it off\n【用語】pull off + N (v.phr.)：成功完成（困難的事，如一場表演）\n【中譯】這支舞非常難，但經過幾個月的練習，學生們在台上成功完成了演出。", "explanationSource": "supplemental"}, {"id": 125, "question": "Last Sunday, I ______ and had tea with her at her home.", "options": ["called on my grandma", "made up an excuse", "broke up with my best friend", "got a haircut"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) called on my grandma\n【用語】call on + 人 (v.phr.)：拜訪\n【中譯】上週日，我去拜訪了奶奶，並在她家和她一起喝茶。", "explanationSource": "supplemental"}, {"id": 126, "question": "It might rain this afternoon, so you'd better ______ when you go out.", "options": ["make a list", "take up swimming", "keep me company", "take an umbrella along"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) take an umbrella along\n【用語】take + 物 + along (v.phr.)：隨身攜帶\n【中譯】今天下午可能會下雨，所以你出門時最好隨身帶把傘。", "explanationSource": "supplemental"}, {"id": 127, "question": "Lily ______ for three months, so it won first prize in the art contest.", "options": ["put her heart into the painting", "served as a class leader", "took a break", "made her mom happy"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) put her heart into the painting\n【用語】put one's heart into + N/V-ing (v.phr.)：全心投入\n【中譯】Lily花了三個月全心投入那幅畫，所以它在美術比賽中得了首獎。", "explanationSource": "supplemental"}, {"id": 128, "question": "Because of the heavy rain, we had to ______ and go home early.", "options": ["cut our trip short", "push open the window", "look forward to our trip", "refer to the dictionary"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) cut our trip short\n【用語】cut short + N (v.phr.)：縮短\n【中譯】因為下大雨，我們不得不縮短旅程，提早回家。", "explanationSource": "supplemental"}, {"id": 129, "question": "If someone is bullying you, don't be afraid to ______ and tell a teacher.", "options": ["take a nap", "turn up the radio", "speak up", "make a difference"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) speak up\n【用語】speak up (v.phr.)：勇敢表達\n【中譯】如果有人霸凌你，不要害怕勇敢說出來，並告訴老師。", "explanationSource": "supplemental"}, {"id": 130, "question": "The delicious food at the night market ______ every weekend.", "options": ["draws in many tourists", "does exercise", "takes out the garbage", "tells a lie"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) draws in many tourists\n【用語】draw in + 人 (v.phr.)：吸引（人群）；把⋯⋯拉進\n【中譯】夜市的美食每個週末都吸引許多觀光客。", "explanationSource": "supplemental"}, {"id": 131, "question": "The little girl cried and cried, but she didn't ______; her mom still said no to the candy.", "options": ["take a shower", "appeal to the court", "get her way", "fasten the seatbelt"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) get her way\n【用語】get/have one's way (v.phr.)：如願\n【中譯】小女孩一直哭，但她沒能如願；她媽媽還是不讓她吃糖果。", "explanationSource": "supplemental"}, {"id": 132, "question": "The strong wind made the old tree ______ last night.", "options": ["look at the bright side of things", "fall down", "win back the game", "grow up"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) fall down\n【用語】fall down (v.phr.)：倒下來\n【中譯】昨晚的強風讓那棵老樹倒了下來。", "explanationSource": "supplemental"}, {"id": 133, "question": "The twins look exactly the same, so I can't ______.", "options": ["stay out of trouble", "cut down on sugar", "tell them apart", "make the bed"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) tell them apart\n【用語】tell A and B apart (v.phr.)：分辨 A 和 B\n【中譯】那對雙胞胎長得一模一樣，所以我分辨不出他們誰是誰。", "explanationSource": "supplemental"}, {"id": 134, "question": "On our way to Taichung, we ______ for an hour to buy some fruit.", "options": ["looked up the word in the dictionary", "reported the latest news", "called at a small town", "cleaned up the kitchen"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) called at a small town\n【用語】call at + 地方 (v.phr.)：造訪某地\n【中譯】在前往台中的路上，我們在一個小鎮停留了一個小時，買了一些水果。", "explanationSource": "supplemental"}, {"id": 135, "question": "Before you buy a new phone, you should ______ to see which one is cheaper.", "options": ["compare this phone with that one", "move on to the next lesson", "play a role", "make a wish"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) compare this phone with that one\n【用語】compare + N + with + N (v.phr.)：與……相比、比較……和……\n【中譯】在你買新手機之前，你應該把這支手機和那支比較一下，看看哪一支比較便宜。", "explanationSource": "supplemental"}, {"id": 136, "question": "A: When can I see the doctor?\nB: He is busy now, but he will see you in ten minutes. Please ______.", "options": ["get in trouble", "cut in the line", "sit tight", "feel sad"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) sit tight\n【用語】sit tight (v.phr.)：耐心等候\n【中譯】A：我什麼時候可以看醫生？\nB：他現在很忙，但十分鐘後就會看你。請耐心等候。", "explanationSource": "supplemental"}, {"id": 137, "question": "Mr. Wang said to the class, \"______, everyone! I have something important to tell you.\"", "options": ["Make a wish", "Do the laundry", "Listen up", "Go away"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) Listen up\n【用語】listen up (v.phr.)：注意聽了\n【中譯】王老師對全班說：「大家注意聽了！我有重要的事要告訴你們。」", "explanationSource": "supplemental"}, {"id": 138, "question": "The workers ______ for two hours this morning, so we couldn't take a shower.", "options": ["cut off the water", "took it personally", "put up a tent", "reached a conclusion"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) cut off the water\n【用語】cut off + N (v.phr.)：切除、切斷\n【中譯】工人們今天早上把水切斷了兩個小時，所以我們沒辦法洗澡。", "explanationSource": "supplemental"}, {"id": 139, "question": "My grandfather was very sick, and he ______ last winter. We all miss him.", "options": ["blew down a tree", "passed on", "told a lie", "did me a favor"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) passed on\n【用語】pass on (v.phr.)：死亡、過世\n【中譯】我爺爺病得很重，他在去年冬天過世了。我們都很想念他。", "explanationSource": "supplemental"}, {"id": 140, "question": "It's so hot today. Let's go to the beach and ______.", "options": ["lend our books to Amy", "have a swim", "do the dishes", "make a copy"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) have a swim\n【用語】have a swim (v.phr.)：去游泳\n【中譯】今天好熱。我們去海邊游泳吧。", "explanationSource": "supplemental"}, {"id": 141, "question": "I didn't see the mistakes in my essay, but my teacher ______. Now I can fix them.", "options": ["went by", "threw them away", "fell apart", "pointed them out"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) pointed them out\n【用語】point out + N/that 子句 (v.phr.)：指出\n【中譯】我沒看到作文裡的錯誤，但老師把它們指出來了。現在我可以改正了。", "explanationSource": "supplemental"}, {"id": 142, "question": "Before we left for our trip, Dad ______ to keep the house safe.", "options": ["tried out a new phone", "made the bed", "reached the point", "locked up all the doors"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) locked up all the doors\n【用語】lock up + N (v.phr.)：鎖上\n【中譯】我們出發去旅行前，爸爸把所有的門都鎖上，讓房子保持安全。", "explanationSource": "supplemental"}, {"id": 143, "question": "Kevin is rich, but he never ______. He thinks everyone is equal.", "options": ["takes his car for example", "introduces his friends to his parents", "looks down upon poor people", "brushes his teeth"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) looks down upon poor people\n【用語】look down upon + 人 (v.phr.)：輕視\n【中譯】Kevin很有錢，但他從不輕視窮人。他認為人人平等。", "explanationSource": "supplemental"}, {"id": 144, "question": "The math problem was very hard, but Amy didn't ______. She kept trying until she found the answer.", "options": ["go abroad", "blow over the tree", "use up her paper", "give up"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) give up\n【用語】give up + N/V-ing (v.phr.)：放棄\n【中譯】這道數學題很難，但Amy沒有放棄。她一直嘗試，直到找到答案。", "explanationSource": "supplemental"}, {"id": 145, "question": "A: ______! We're going to be late for the movie!\nB: OK, I'm coming.", "options": ["Let it go", "Lie down", "Take your time", "Come on"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) Come on\n【用語】come on (v.phr.)：趕快；拜託；加油\n【中譯】A：快點！我們看電影要遲到了！\nB：好，我來了。", "explanationSource": "supplemental"}, {"id": 146, "question": "This shop has twenty kinds of cakes. You can ______ them, but you can only buy one.", "options": ["wait for", "listen to", "laugh at", "choose from"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) choose from\n【用語】choose from + N (v.phr.)：（從…中）選擇\n【中譯】這家店有二十種蛋糕。你可以從中挑選，但只能買一個。", "explanationSource": "supplemental"}, {"id": 147, "question": "The teacher only has one worksheet. Can you go to the office and ______ for each student?", "options": ["pick fruit", "face the problem", "grow flowers", "make a copy"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) make a copy\n【用語】make a copy (v.phr.)：製作副本\n【中譯】老師只有一張學習單。你可以去辦公室幫每位學生影印一份嗎？", "explanationSource": "supplemental"}, {"id": 148, "question": "The police officer told the driver to ______ because he was driving too fast.", "options": ["pull over", "adapt to the new school", "hold on to his car", "turn left"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) pull over\n【用語】pull over (v.phr.)：把車開到路邊停下\n【中譯】警察因為駕駛開得太快，叫他把車開到路邊停下。", "explanationSource": "supplemental"}, {"id": 149, "question": "It took us two hours to ______ by bus.", "options": ["take a walk", "push the chair over", "get to Taipei", "do our hair"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) get to Taipei\n【用語】get to + 地方 (v.phr.)：到達某地\n【中譯】我們搭公車花了兩個小時才到達台北。", "explanationSource": "supplemental"}, {"id": 150, "question": "To protect the earth, we should ______ and take buses more often.", "options": ["go green", "cover the bill", "cut down trees", "fail the test"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) go green\n【用語】go green (v.phr.)：採取環保行動\n【中譯】為了保護地球，我們應該採取環保行動，並且更常搭公車。", "explanationSource": "supplemental"}, {"id": 151, "question": "The students sold cookies to ______ for the sick children.", "options": ["cover the news", "have a seat", "take a nap", "raise money"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) raise money\n【用語】raise money (v.phr.)：募款\n【中譯】學生們賣餅乾為生病的孩子們募款。", "explanationSource": "supplemental"}, {"id": 152, "question": "A: Can you ______?\nB: Sure. What do you need?", "options": ["take a nap", "do me a favor", "have pizza for dinner", "come on"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) do me a favor\n【用語】do + 人 + a favor (v.phr.)：幫……一個忙\n【中譯】A：你可以幫我一個忙嗎？\nB：當然。你需要什麼？", "explanationSource": "supplemental"}, {"id": 153, "question": "Ben ______ again. He said he finished his homework, but he didn't even start it.", "options": ["told a lie", "cared for spicy food", "asked his friends out for lunch", "couldn't take a joke"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) told a lie\n【用語】tell a lie (v.phr.)：說謊\n【中譯】Ben又說謊了。他說他寫完功課了，但他根本還沒開始寫。", "explanationSource": "supplemental"}, {"id": 154, "question": "My dad loves the sea. On weekends, he often takes his boat and ______.", "options": ["dies of boredom", "goes fishing", "makes a cake for me", "does the dishes"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) goes fishing\n【用語】go + V-ing (v.phr.)：從事某種休閒活動\n【中譯】我爸爸熱愛大海。週末他常常開著他的船去釣魚。", "explanationSource": "supplemental"}, {"id": 155, "question": "I'm cooking now. Can you ______? It's ringing.", "options": ["answer the phone", "set aside some money", "take down the thief", "wait for the bus"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) answer the phone\n【用語】answer the phone (v.phr.)：接電話\n【中譯】我正在煮飯。你可以接一下電話嗎？它在響。", "explanationSource": "supplemental"}, {"id": 156, "question": "When she was little, my sister ______, so she was afraid to sleep alone at night.", "options": ["grew flowers", "believed in ghosts", "checked in at a hotel", "stood her friend up"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) believed in ghosts\n【用語】believe in + N (v.phr.)：相信…存在\n【中譯】我妹妹小時候相信有鬼，所以她晚上很怕一個人睡。", "explanationSource": "supplemental"}, {"id": 157, "question": "The princess kissed the frog, and suddenly it ______ a handsome prince. It was not a frog anymore.", "options": ["ran away from", "waved at", "looked at", "changed into"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) changed into\n【用語】change (+ N) into + N (v.phr.)：（將……）變成……\n【中譯】公主親了青蛙，牠突然變成一位英俊的王子。牠不再是青蛙了。", "explanationSource": "supplemental"}, {"id": 158, "question": "Many people ______ the new plan, so they voted for it.", "options": ["handed back", "laughed at", "threw away", "stood for"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) stood for\n【用語】stand for + N (v.phr.)：支持\n【中譯】很多人支持這個新計畫，所以他們投票贊成。", "explanationSource": "supplemental"}, {"id": 159, "question": "Lisa ______ last year, but now she is happy again.", "options": ["thought the plan through", "went through a hard time", "had a good time", "did sports"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) went through a hard time\n【用語】go through + N (v.phr.)：經歷\n【中譯】Lisa去年經歷了一段艱難的時期，但現在她又快樂起來了。", "explanationSource": "supplemental"}, {"id": 160, "question": "As people ______, their hair often turns white.", "options": ["grow old", "move along", "consider moving", "end up crying"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) grow old\n【用語】grow old (v.phr.)：變老\n【中譯】隨著人們變老，他們的頭髮常常會變白。", "explanationSource": "supplemental"}, {"id": 161, "question": "Don't ______ when you leave the room. It wastes electricity.", "options": ["listen to my advice", "leave the a/c on", "turn off the lights", "make noise"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) leave the a/c on\n【用語】leave the a/c on (v.phr.)：讓冷氣開著\n【中譯】離開房間時不要讓冷氣開著。那很浪費電。", "explanationSource": "supplemental"}, {"id": 162, "question": "You should ______ your free time and read more books.", "options": ["cover", "make good use of", "succeed in", "make friends with"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) make good use of\n【用語】make good/full use of + N (v.phr.)：善加利用\n【中譯】你應該善加利用你的空閒時間，多讀一些書。", "explanationSource": "supplemental"}, {"id": 163, "question": "The thief felt sorry for what he did. He went to the police and ______.", "options": ["turned himself in", "brought up his kids", "took a bath", "went sightseeing"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) turned himself in\n【用語】turn in + 人 (v.phr.)：（向警方）告發、自首\n【中譯】小偷對自己做的事感到後悔。他去找警察自首了。", "explanationSource": "supplemental"}, {"id": 164, "question": "You can't have ice cream until you ______ your vegetables.", "options": ["eat up", "write down", "put out", "cut the use of"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) eat up\n【用語】eat up + N (v.phr.)：吃完\n【中譯】你要把蔬菜吃完才能吃冰淇淋。", "explanationSource": "supplemental"}, {"id": 165, "question": "This rule is very important. Please ______.", "options": ["throw it away", "cut down trees", "keep it in mind", "break down"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) keep it in mind\n【用語】keep/bear + N + in mind (v.phr.)：記住、記得\n【中譯】這條規則非常重要。請記住它。", "explanationSource": "supplemental"}, {"id": 166, "question": "It rained all day during our trip, but we ______ and played cards in the hotel.", "options": ["made the best of it", "brought it back", "turned it down", "clung to it"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) made the best of it\n【用語】make the best of + N (v.phr.)：充分利用\n【中譯】我們旅行時下了一整天的雨，但我們充分利用這個情況，在飯店裡玩牌。", "explanationSource": "supplemental"}, {"id": 167, "question": "Your story is too long for the school paper. Can you ______?", "options": ["get up", "kill time", "cut it down", "turn up the volume"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) cut it down\n【用語】cut down + N (v.phr.)：減短、縮減\n【中譯】你的故事對校刊來說太長了。你可以把它縮短嗎？", "explanationSource": "supplemental"}, {"id": 168, "question": "When we arrived at Grandma's house, she ______ and said, \"Welcome!\"", "options": ["watched out for cars", "cut the paper", "picked up English", "greeted us with a big hug"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) greeted us with a big hug\n【用語】greet + 人 + with + N (v.phr.)：以…迎接\n【中譯】我們到奶奶家時，她給我們一個大大的擁抱迎接我們，並說：「歡迎！」", "explanationSource": "supplemental"}, {"id": 169, "question": "I ______, so I had to go back home to get it.", "options": ["lent my pen to Amy", "left my book at home", "turned the box into a car", "cared for my sick grandma"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) left my book at home\n【用語】leave + 物 + 地方 (v.phr.)：把某物留在某處\n【中譯】我把書留在家裡了，所以我必須回家拿。", "explanationSource": "supplemental"}, {"id": 170, "question": "This soup is not salty enough. Please ______.", "options": ["add some salt to it", "do the dishes", "meet with Mr. Lin", "run through the park"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) add some salt to it\n【用語】add + N + to + N (v.phr.)：把……加到……\n【中譯】這碗湯不夠鹹。請在裡面加一些鹽。", "explanationSource": "supplemental"}, {"id": 171, "question": "Time ______ so fast! It's already the end of the year.", "options": ["clings to my hand", "works on the project", "goes by", "goes abroad"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) goes by\n【用語】go by (v.phr.)：（時間）消逝\n【中譯】時間過得真快！已經是年底了。", "explanationSource": "supplemental"}, {"id": 172, "question": "Don't be sad about losing the game. Try to ______. You learned a lot from it.", "options": ["take a shower", "fail the test", "see the bright side of it", "make up a story about it"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) see the bright side of it\n【用語】see the bright side of + N (v.phr.)：樂觀看待…\n【中譯】別為輸了比賽難過。試著樂觀看待這件事。你從中學到了很多。", "explanationSource": "supplemental"}, {"id": 173, "question": "The students were too noisy, so Mr. Lin ______ stop talking and open their books.", "options": ["asked them to", "used to", "wanted to", "would like to"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) asked them to\n【用語】ask + 人 + to + VR (v.phr.)：要求某人做……\n【中譯】學生們太吵了，所以林老師要求他們停止講話，並打開課本。", "explanationSource": "supplemental"}, {"id": 174, "question": "Traveling is a good way to ______. Kids can learn a lot from it.", "options": ["break the world record", "care about money", "expose kids to new things", "take their parents for granted"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) expose kids to new things\n【用語】expose + N + to + N (v.phr.)：使……暴露於、使……接觸到\n【中譯】旅行是讓孩子接觸新事物的好方法。孩子們可以從中學到很多。", "explanationSource": "supplemental"}, {"id": 175, "question": "The snow was not deep. It only ______.", "options": ["went viral", "reached my ankles", "turned back", "made it"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) reached my ankles\n【用語】reach the ankles (v.phr.)：到腳踝（的高度）\n【中譯】雪不深，只到我的腳踝。", "explanationSource": "supplemental"}, {"id": 176, "question": "Tom had a high fever, so he had to ______ for three days.", "options": ["make a list", "stay in bed", "pull up", "dig out his old toys"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) stay in bed\n【用語】stay in bed (v.phr.)：生病臥床\n【中譯】Tom發高燒，所以他必須臥床休息三天。", "explanationSource": "supplemental"}, {"id": 177, "question": "Dad was very angry because I broke his favorite cup. He ______.", "options": ["looked out", "yelled at me", "let me down", "heard about me"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) yelled at me\n【用語】yell at + 人 (v.phr.)：對……大叫；吼叫\n【中譯】爸爸非常生氣，因為我打破了他最喜歡的杯子。他對我大吼。", "explanationSource": "supplemental"}, {"id": 178, "question": "Lily played in the rain without a coat, so she ______ and had to stay home.", "options": ["went whale-watching", "took part in a race", "gave me a ride", "got a cold"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) got a cold\n【用語】get a cold (v.phr.)：感冒\n【中譯】Lily沒穿外套就在雨中玩，所以她感冒了，必須待在家裡。", "explanationSource": "supplemental"}, {"id": 179, "question": "A: I'm so nervous about the test tomorrow.\nB: ______. You studied hard, so you'll do fine.", "options": ["Take it easy", "Serves you right", "Count me in", "Keep the change"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) Take it easy\n【用語】take it easy (v.phr.)：放輕鬆；別緊張\n【中譯】A：我對明天的考試好緊張。\nB：放輕鬆。你很用功，所以會考得很好的。", "explanationSource": "supplemental"}, {"id": 180, "question": "My tooth hurt badly, so the dentist ______. Now I have one less tooth.", "options": ["pushed me around", "looked at it", "pulled it out", "dated back to 1900"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) pulled it out\n【用語】pull out + N (v.phr.)：拔出\n【中譯】我的牙齒痛得很厲害，所以牙醫把它拔掉了。現在我少了一顆牙。", "explanationSource": "supplemental"}, {"id": 181, "question": "A: Where were you yesterday?\nB: I was sick, so I ______ all day. I didn't go out.", "options": ["stayed at home", "went on vacation", "went for a walk", "took a trip to Tainan"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) stayed at home\n【用語】stay at home (v.phr.)：待在家裡\n【中譯】A：你昨天在哪裡？\nB：我生病了，所以整天待在家裡。我沒有出門。", "explanationSource": "supplemental"}, {"id": 182, "question": "The strong typhoon ______ many houses in our town.", "options": ["belonged to", "did damage to", "threw away", "did well in"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) did damage to\n【用語】do damage to + N (v.phr.)：對……造成傷害\n【中譯】強烈颱風對我們鎮上的許多房子造成了損害。", "explanationSource": "supplemental"}, {"id": 183, "question": "It's so hot today. Let's ______ in the swimming pool. The water is nice and cool.", "options": ["take a while", "go for a swim", "give him a big hand", "go whale-watching"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) go for a swim\n【用語】go for a swim (v.phr.)：去游泳\n【中譯】今天好熱。我們去游泳池游泳吧。水很涼快。", "explanationSource": "supplemental"}, {"id": 184, "question": "Ben plays basketball very well. Next week he will ______ the school team. He hopes the coach will choose him.", "options": ["try out for", "make fun of", "look down on", "run across"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) try out for\n【用語】try out for + N (v.phr.)：參加選拔\n【中譯】Ben 籃球打得很好。下週他要參加校隊選拔。他希望教練會選他。", "explanationSource": "supplemental"}, {"id": 185, "question": "Don't leave your coat on the sofa. Please ______ on the hook behind the door.", "options": ["solve the case", "feel like dancing", "take a bath", "hang up your coat"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) hang up your coat\n【用語】hang up + N (v.phr.)：掛起\n【中譯】不要把外套丟在沙發上。請把你的外套掛在門後的掛鉤上。", "explanationSource": "supplemental"}, {"id": 186, "question": "Good teachers ______ our lives. They help us learn and grow.", "options": ["carry out", "do damage to", "play an important role in", "look down on"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) play an important role in\n【用語】play an important role in + N/V-ing (v.phr.)：扮演重要角色\n【中譯】好老師在我們的生命中扮演重要的角色。他們幫助我們學習和成長。", "explanationSource": "supplemental"}, {"id": 187, "question": "This old watch was my grandpa's. I ______ because it reminds me of him.", "options": ["put it into words", "make a wild guess", "hold it dear", "bring it in"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) hold it dear\n【用語】hold + N + dear (v.phr.)：珍視；深愛\n【中譯】這支舊手錶是我爺爺的。我很珍惜它，因為它讓我想起他。", "explanationSource": "supplemental"}, {"id": 188, "question": "I was too busy to go to the store, so I ______ last night. It will arrive tomorrow.", "options": ["took a bath", "stood by my sister", "belonged to my sister", "ordered a new bag online"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) ordered a new bag online\n【用語】order + 物 + online (v.phr.)：在網路上訂購\n【中譯】我太忙了沒辦法去商店，所以昨晚在網路上訂了一個新包包。它明天會送到。", "explanationSource": "supplemental"}, {"id": 189, "question": "When we got to the campsite, Dad ______, and we slept in it that night.", "options": ["used a knife to cut the bread", "put up a tent", "did us good", "let us swim"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) put up a tent\n【用語】put up a tent (v.phr.)：搭起帳篷\n【中譯】我們到達露營區時，爸爸搭起了帳篷，那天晚上我們就睡在裡面。", "explanationSource": "supplemental"}, {"id": 190, "question": "If you know the answer, please ______, and I will call on you.", "options": ["make a living by teaching", "go straight for two blocks", "roll your eyes", "put up your hand"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) put up your hand\n【用語】put up one's hand (v.phr.)：舉手\n【中譯】如果你知道答案，請舉手，我就會點你回答。", "explanationSource": "supplemental"}, {"id": 191, "question": "Everyone in our class ______ cleaning the park last Sunday. We picked up a lot of trash together.", "options": ["put off", "made fun of", "played a part in", "did without"], "answer": 2, "answerLabel": "C", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(C) played a part in\n【用語】play a part in + N/V-ing (v.phr.)：參與；起某種作用\n【中譯】上週日我們班每個人都參與了打掃公園。我們一起撿了很多垃圾。", "explanationSource": "supplemental"}, {"id": 192, "question": "A typhoon is coming, so the school ______ until next week.", "options": ["put off the sports day", "kept the students from eating lunch", "did English exercises", "had a sale"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) put off the sports day\n【用語】put off + N/V-ing (v.phr.)：拖延、延期\n【中譯】颱風要來了，所以學校把運動會延到下週。", "explanationSource": "supplemental"}, {"id": 193, "question": "The music is too loud. Could you ______ the radio, please?", "options": ["run across", "turn down", "turn up", "hang up on"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) turn down\n【用語】turn down + N (v.phr.)：調降、關小（音量）\n【中譯】音樂太大聲了。可以請你把收音機關小聲一點嗎？", "explanationSource": "supplemental"}, {"id": 194, "question": "Kevin isn't good at English, but he ______ every day. Now his grades are getting better.", "options": ["makes an effort", "prefers comics to books", "would rather sleep than study", "has nothing to do"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) makes an effort\n【用語】make an effort (v.phr.)：努力\n【中譯】Kevin 英文不好，但他每天都很努力。現在他的成績越來越好了。", "explanationSource": "supplemental"}, {"id": 195, "question": "At first, Amy didn't like her new school, but slowly she ______ love it.", "options": ["had to", "came to", "used to", "failed to"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) came to\n【用語】come to + VR (v.phr.)：漸漸……（come to + V）\n【中譯】一開始 Amy 不喜歡她的新學校，但她漸漸地愛上了它。", "explanationSource": "supplemental"}, {"id": 196, "question": "My brother always ______. He says I'm stupid and ugly.", "options": ["concentrates on his homework", "makes up for his mistakes", "stands up for me", "puts me down"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) puts me down\n【用語】put + 人 + down (v.phr.)：貶低某人\n【中譯】我哥哥總是貶低我。他說我又笨又醜。", "explanationSource": "supplemental"}, {"id": 197, "question": "In English class, Jenny always ______ what the teacher says in her notebook.", "options": ["takes down", "looks on the bright side of", "turns down", "hangs up on"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) takes down\n【用語】take down + N (v.phr.)：記下；做筆記\n【中譯】在英文課上，Jenny 總是把老師說的話記在筆記本裡。", "explanationSource": "supplemental"}, {"id": 198, "question": "A: Knock, knock. May I ______?\nB: Sure. Please sit down.", "options": ["come in", "hang on", "stand by", "record the voice"], "answer": 0, "answerLabel": "A", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(A) come in\n【用語】come in (v.phr.)：進來\n【中譯】A：叩叩。我可以進來嗎？\nB：當然。請坐。", "explanationSource": "supplemental"}, {"id": 199, "question": "Winning the singing contest ______ at our school. Now everyone knows her.", "options": ["went whale-watching", "put Lisa down", "spent the holiday", "made Lisa a star"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) made Lisa a star\n【用語】make + 人 + N (v.phr.)：使某人成為……（名詞）\n【中譯】贏得歌唱比賽讓 Lisa 成為我們學校的明星。現在大家都認識她。", "explanationSource": "supplemental"}, {"id": 200, "question": "This road ______. Just walk along it for five minutes.", "options": ["puts it into words", "leads to the train station", "meets the need for water", "takes a bow"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) leads to the train station\n【用語】lead to + 地方 (v.phr.)：通往\n【中譯】這條路通往火車站。只要沿著它走五分鐘就到了。", "explanationSource": "supplemental"}, {"id": 201, "question": "Before Dad went into the store, he ______ to a tree so it wouldn't run away.", "options": ["got his work out of the way", "tied up the dog", "lit a match", "kept it in mind"], "answer": 1, "answerLabel": "B", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(B) tied up the dog\n【用語】tie up + N (v.phr.)：繫住、綁住\n【中譯】爸爸進商店前，把狗綁在樹上，這樣牠就不會跑掉。", "explanationSource": "supplemental"}, {"id": 202, "question": "The taxi ride was 300 dollars. Dad ______ and got out of the car.", "options": ["got off the bus", "made a wild guess", "went along", "paid the driver for the ride"], "answer": 3, "answerLabel": "D", "source": "動詞片語 Verb Phrases", "explanation": "【答案】(D) paid the driver for the ride\n【用語】pay + N + for + N (v.phr.)：付錢購買（服務、物品）\n【中譯】計程車車資是三百元。爸爸付了車資給司機，然後下了車。", "explanationSource": "supplemental"}, {"id": 203, "question": "Ms. S
