<script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 9｜文法選擇（課本句型）","mode":"mcq","questions":[{"id":1,"question":"I would love to get a pet, ____________ my mother considers it a bad idea.","options":["because","in contrast","however","whereas"],"answer":3,"answerLabel":"D","source":"三合一學習手冊","explanation":"正確答案為 whereas；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":2,"question":"____________ some people believe that graffiti is art, others think that it makes a city look messy.","options":["Because","If","When","While"],"answer":3,"answerLabel":"D","source":"習作簿","explanation":"正確答案為 While；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":3,"question":"Remember to start preparing for your final exam earlier. It ____________ time to prepare well.","options":["spends","costs","takes","pays"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"spend主詞必定是人  事／物 + take + 人 + 時間","explanationSource":"source"},{"id":4,"question":"He likes black coffee ____________ I prefer my coffee with sugar.","options":["when","while","as","however"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"(A) when不能用在相反、對比的場合　(D) however不是連接詞，不能用來連接兩子句","explanationSource":"source"},{"id":5,"question":"I want a house, ____________ they would rather live in an apartment.","options":["however","thus","whereas","still"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"(A) however然而，副詞，不是連接詞　(B) thus因此，副詞，不是連接詞　(D) still雖然如此，副詞，不是連接詞","explanationSource":"source"},{"id":6,"question":"The kids looked at the magician, ____________ by his tricks.","options":["amazed","amazing","to be amazed","amaze"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"原句為The kids looked at the magician and were amazed by his tricks.，後半句簡化為... the magician, amazed by....","explanationSource":"source"},{"id":7,"question":"The man stood by his stalled car, ____________ about what to do with it.","options":["felt confused","confused","feeling confusing","and confused"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"原句為...his stalled car and was confused about....，後半句可簡化為his stalled car, confused about....","explanationSource":"source"},{"id":8,"question":"The mother kept screaming outside the flaming house, ____________ the firefighters to rescue her children.","options":["to beg","begged","and beg","begging"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"原句為...the flaming house and begged....，後半句可簡化為...the flaming house, begging....","explanationSource":"source"},{"id":9,"question":"The fans clapped their hands, ____________ to the music while the singer was singing onstage.","options":["danced","to dance","dancing","dance"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"danced是主動動詞，故簡化為現在分詞dancing","explanationSource":"source"},{"id":10,"question":"Peter slammed the door, ____________ how his parents felt.","options":["not caring","caring not","didn’t care","not to care"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"原句為...slammed the door and didn’t care....，後半句可簡化為...slammed the door, not caring....，須留意否定詞置於分詞前面","explanationSource":"source"},{"id":11,"question":"A lot of visitors gathered at the park, ____________ by the beautiful night sky.","options":["surprise","surprising","surprised","having surprised"],"answer":2,"answerLabel":"C","source":"習作簿","explanation":"正確答案為 surprised；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":12,"question":"Ted is on the road now, ____________ to the bus station.","options":["rush","he rushed","rushing","be rushed"],"answer":2,"answerLabel":"C","source":"三合一學習手冊","explanation":"正確答案為 rushing；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":13,"question":"The coach hugged the players, ____________ them how proud he was of their performance.","options":["tell","to tell","telling","told"],"answer":2,"answerLabel":"C","source":"三合一學習手冊","explanation":"正確答案為 telling；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":14,"question":"The mother lay awake the whole night, ____________ about her son’s safety.","options":["to worry","she was worried","has worried","worrying"],"answer":3,"answerLabel":"D","source":"三合一學習手冊","explanation":"正確答案為 worrying；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":15,"question":"Kimberly is looking at me with tears in her eyes, ____________ what I just told her.","options":["not believing","not believed","believing not","she doesn’t believe"],"answer":0,"answerLabel":"A","source":"三合一學習手冊","explanation":"正確答案為 not believing；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":16,"question":"It was very late, but poor Mindy was still awake, ____________ on her final report.","options":["worked","working","to work","work"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"worked是主動動詞，故簡化為現在分詞working","explanationSource":"source"}]};</script><script src="longteng-b1u5-quiz.js?v=20261027-2"></script><script src="longteng-vocab-required-pronunciation.js?v=20261027-2"></script></body></html>
