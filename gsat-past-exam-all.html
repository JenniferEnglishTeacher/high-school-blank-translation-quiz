n": "讓學生自己操作前，老師會先「示範」儀器用法：demonstrates。tolerate 容忍、associate 聯想、exaggerate 誇大。", "explanationSource": "own", "section": "105年"}, {"id": 258, "question": "第 8 題　Most of the area is covered by woods, where bird species are so ______ that it is a paradise for birdwatchers.", "options": ["durable", "private", "realistic", "numerous"], "answer": 3, "answerLabel": "D", "source": "105 學測｜詞彙｜第 8 題", "explanation": "鳥類種類「眾多」，成為賞鳥天堂：numerous。durable 耐用的、private 私人的、realistic 務實的。", "explanationSource": "own", "section": "105年"}, {"id": 259, "question": "第 9 題　In most cases, the committee members can reach agreement quickly. ______, however, they differ greatly in opinion and have a hard time making decisions.", "options": ["Occasionally", "Automatically", "Enormously", "Innocently"], "answer": 0, "answerLabel": "A", "source": "105 學測｜詞彙｜第 9 題", "explanation": "大多數時候很快達成共識，「偶爾」卻意見分歧：Occasionally。automatically 自動地、enormously 極大地、innocently 無辜地。", "explanationSource": "own", "section": "105年"}, {"id": 260, "question": "第 10 題　Many people try to save a lot of money before ______, since having enough money would give them a sense of security for their future.", "options": ["isolation", "promotion", "retirement", "announcement"], "answer": 2, "answerLabel": "C", "source": "105 學測｜詞彙｜第 10 題", "explanation": "在「退休」前存夠錢以獲得安全感：retirement。isolation 孤立、promotion 升遷、announcement 宣布。", "explanationSource": "own", "section": "105年"}, {"id": 261, "question": "第 11 題　In winter, our skin tends to become dry and ______, a problem which is usually treated by applying lotions or creams.", "options": ["alert", "itchy", "steady", "flexible"], "answer": 1, "answerLabel": "B", "source": "105 學測｜詞彙｜第 11 題", "explanation": "冬天皮膚乾燥「發癢」，需塗乳液：itchy。alert 警覺的、steady 穩定的、flexible 有彈性的。", "explanationSource": "own", "section": "105年"}, {"id": 262, "question": "第 12 題　Benson married Julie soon after he had ______ her heart and gained her parents’ approval.", "options": ["conquered", "estimated", "guaranteed", "intensified"], "answer": 0, "answerLabel": "A", "source": "105 學測｜詞彙｜第 12 題", "explanation": "「贏得」她的心並獲得父母同意後結婚：conquer one’s heart。estimate 估計、guarantee 保證、intensify 加強。", "explanationSource": "own", "section": "105年"}, {"id": 263, "question": "第 13 題　The recent flood completely ______ my parents’ farm. The farmhouse and fruit trees were all gone and nothing was left.", "options": ["ruined", "cracked", "hastened", "neglected"], "answer": 0, "answerLabel": "A", "source": "105 學測｜詞彙｜第 13 題", "explanation": "洪水徹底「毀了」農場，什麼都沒剩：ruined。crack 使破裂、hasten 加速、neglect 忽視。", "explanationSource": "own", "section": "105年"}, {"id": 264, "question": "第 14 題　The results of this survey are not reliable because the people it questioned were not a typical or ______ sample of the entire population that was studied.", "options": ["primitive", "spiritual", "representative", "informative"], "answer": 2, "answerLabel": "C", "source": "105 學測｜詞彙｜第 14 題", "explanation": "受訪者不是母體的典型或「具代表性的」樣本，所以結果不可靠：representative sample。", "explanationSource": "own", "section": "105年"}, {"id": 265, "question": "第 15 題　In line with the worldwide green movement, carmakers have been working hard to make their new models more ______ friendly to reduce pollution.", "options": ["liberally", "individually", "financially", "environmentally"], "answer": 3, "answerLabel": "D", "source": "105 學測｜詞彙｜第 15 題", "explanation": "減少污染，使新車更「環保」：environmentally friendly。liberally 自由地、individually 個別地、financially 財務上。", "explanationSource": "own", "section": "105年"}, {"id": 266, "question": "【綜合測驗 第 16–20 題】\n@@105-16–20@@\n\n▶ 第 16 題　請選出 __16__ 的最佳答案", "options": ["However", "Otherwise", "Furthermore", "Accordingly"], "answer": 0, "answerLabel": "A", "source": "105 學測｜綜合測驗｜第 16 題", "explanation": "計畫很快失控，與前文形成轉折：However。Otherwise 否則、Furthermore 此外、Accordingly 因此。", "explanationSource": "own", "section": "105年"}, {"id": 267, "question": "【綜合測驗 第 16–20 題】\n@@105-16–20@@\n\n▶ 第 17 題　請選出 __17__ 的最佳答案", "options": ["made believe", "got along", "turned out", "felt like"], "answer": 2, "answerLabel": "C", "source": "105 學測｜綜合測驗｜第 17 題", "explanation": "被綁的孩子「結果竟是」個調皮搗蛋的男孩：turned out to be。make believe 假裝、get along 相處、feel like 想要。", "explanationSource": "own", "section": "105年"}, {"id": 268, "question": "【綜合測驗 第 16–20 題】\n@@105-16–20@@\n\n▶ 第 18 題　請選出 __18__ 的最佳答案", "options": ["hold on to", "get rid of", "make fun of", "take advantage of"], "answer": 1, "answerLabel": "B", "source": "105 學測｜綜合測驗｜第 18 題", "explanation": "兩人受不了，決定「擺脫」這個小惡魔，所以降價：get rid of。hold on to 緊抓、make fun of 嘲笑、take advantage of 利用。", "explanationSource": "own", "section": "105年"}, {"id": 269, "question": "【綜合測驗 第 16–20 題】\n@@105-16–20@@\n\n▶ 第 19 題　請選出 __19__ 的最佳答案", "options": ["how", "that", "why", "what"], "answer": 3, "answerLabel": "D", "source": "105 學測｜綜合測驗｜第 19 題", "explanation": "knowing what a troublemaker his son was：what + a + 名詞「多麼…的」感嘆句型，作 knowing 的受詞。", "explanationSource": "own", "section": "105年"}, {"id": 270, "question": "【綜合測驗 第 16–20 題】\n@@105-16–20@@\n\n▶ 第 20 題　請選出 __20__ 的最佳答案", "options": ["Namely", "Altogether", "Simply", "Instead"], "answer": 3, "answerLabel": "D", "source": "105 學測｜綜合測驗｜第 20 題", "explanation": "父親不付錢，「反而」要求綁匪付他 250 元把孩子帶回：Instead。Namely 也就是、Altogether 總共、Simply 僅僅。", "explanationSource": "own", "section": "105年"}, {"id": 271, "question": "【綜合測驗 第 21–25 題】\n@@105-21–25@@\n\n▶ 第 21 題　請選出 __21__ 的最佳答案", "options": ["what", "when", "how", "why"], "answer": 2, "answerLabel": "C", "source": "105 學測｜綜合測驗｜第 21 題", "explanation": "測謊機測量一個人的身體「如何」對問題產生反應：how。", "explanationSource": "own", "section": "105年"}, {"id": 272, "question": "【綜合測驗 第 21–25 題】\n@@105-21–25@@\n\n▶ 第 22 題　請選出 __22__ 的最佳答案", "options": ["adapted", "attached", "related", "restricted"], "answer": 1, "answerLabel": "B", "source": "105 學測｜綜合測驗｜第 22 題", "explanation": "四到六條感應線「連接」到身體不同部位：be attached to。adapt 適應、relate 相關、restrict 限制。", "explanationSource": "own", "section": "105年"}, {"id": 273, "question": "【綜合測驗 第 21–25 題】\n@@105-21–25@@\n\n▶ 第 23 題　請選出 __23__ 的最佳答案", "options": ["Before", "Among", "Without", "Throughout"], "answer": 3, "answerLabel": "D", "source": "105 學測｜綜合測驗｜第 23 題", "explanation": "「在整個」問答過程中，訊號都被記錄下來：Throughout。", "explanationSource": "own", "section": "105年"}, {"id": 274, "question": "【綜合測驗 第 21–25 題】\n@@105-21–25@@\n\n▶ 第 24 題　請選出 __24__ 的最佳答案", "options": ["was being", "would be", "was to be", "would have been"], "answer": 0, "answerLabel": "A", "source": "105 學測｜綜合測驗｜第 24 題", "explanation": "the examiner analyzes … to determine if the person tested was being truthful：判定受測者（受測當時）「是否誠實」，用過去進行式 was being。", "explanationSource": "own", "section": "105年"}, {"id": 275, "question": "【綜合測驗 第 21–25 題】\n@@105-21–25@@\n\n▶ 第 25 題　請選出 __25__ 的最佳答案", "options": ["quantity", "accuracy", "possibility", "emergency"], "answer": 1, "answerLabel": "B", "source": "105 學測｜綜合測驗｜第 25 題", "explanation": "訓練有素的測謊員能以高「準確度」偵測謊言：accuracy。quantity 數量、possibility 可能性、emergency 緊急狀況。", "explanationSource": "own", "section": "105年"}, {"id": 276, "question": "【綜合測驗 第 26–30 題】\n@@105-26–30@@\n\n▶ 第 26 題　請選出 __26__ 的最佳答案", "options": ["them", "such", "what", "it"], "answer": 3, "answerLabel": "D", "source": "105 學測｜綜合測驗｜第 26 題", "explanation": "making it cheaper for some countries to import goods：it 為虛受詞，代替 to import goods。", "explanationSource": "own", "section": "105年"}, {"id": 277, "question": "【綜合測驗 第 26–30 題】\n@@105-26–30@@\n\n▶ 第 27 題　請選出 __27__ 的最佳答案", "options": ["installed", "reserved", "opposed", "determined"], "answer": 3, "answerLabel": "D", "source": "105 學測｜綜合測驗｜第 27 題", "explanation": "比較優勢由土地、資本、勞力等生產要素「決定」：is determined by。install 安裝、reserve 保留、oppose 反對。", "explanationSource": "own", "section": "105年"}, {"id": 278, "question": "【綜合測驗 第 26–30 題】\n@@105-26–30@@\n\n▶ 第 28 題　請選出 __28__ 的最佳答案", "options": ["to the point", "on the rise", "off the hook", "for the record"], "answer": 1, "answerLabel": "B", "source": "105 學測｜綜合測驗｜第 28 題", "explanation": "近幾世紀國際貿易的重要性「持續上升」：on the rise。to the point 切題、off the hook 脫身、for the record 正式聲明。", "explanationSource": "own", "section": "105年"}, {"id": 279, "question": "【綜合測驗 第 26–30 題】\n@@105-26–30@@\n\n▶ 第 29 題　請選出 __29__ 的最佳答案", "options": ["Despite", "Between", "Without", "Under"], "answer": 2, "answerLabel": "C", "source": "105 學測｜綜合測驗｜第 29 題", "explanation": "「如果沒有」國際貿易，各國只能使用國內生產的商品：Without。", "explanationSource": "own", "section": "105年"}, {"id": 280, "question": "【綜合測驗 第 26–30 題】\n@@105-26–30@@\n\n▶ 第 30 題　請選出 __30__ 的最佳答案", "options": ["driving", "pulling", "riding", "bringing"], "answer": 0, "answerLabel": "A", "source": "105 學測｜綜合測驗｜第 30 題", "explanation": "貿易是全球化的主要「驅動」力：driving force。", "explanationSource": "own", "section": "105年"}, {"id": 281, "question": "第 1 題　Nowadays many companies adopt a ______ work schedule which allows their employees to decide when to arrive at work—from as early as 6 a.m. to as late as 11 a.m.", "options": ["relative", "severe", "primitive", "flexible"], "answer": 3, "answerLabel": "D", "source": "104 學測｜詞彙｜第 1 題", "explanation": "員工可自行決定 6 點到 11 點之間何時上班，是「彈性」工時：flexible。relative 相對的、severe 嚴重的、primitive 原始的。", "explanationSource": "own", "section": "104年"}, {"id": 282, "question": "第 2 題　To teach children right from wrong, some parents will ______ their children when they behave well and punish them when they misbehave.", "options": ["settle", "declare", "reward", "neglect"], "answer": 2, "answerLabel": "C", "source": "104 學測｜詞彙｜第 2 題", "explanation": "表現好就「獎勵」、做錯就處罰：reward 與 punish 相對。settle 解決、declare 宣布、neglect 忽視。", "explanationSource": "own", "section": "104年"}, {"id": 283, "question": "第 3 題　To stick to a tight budget, Robert bought a more ______ LED TV instead of a fancy, expensive 3D TV.", "options": ["technical", "significant", "affordable", "expressive"], "answer": 2, "answerLabel": "C", "source": "104 學測｜詞彙｜第 3 題", "explanation": "預算有限，買較「負擔得起的」LED 電視而非昂貴的 3D 電視：affordable。technical 技術的、significant 重要的、expressive 表達力強的。", "explanationSource": "own", "section": "104年"}, {"id": 284, "question": "第 4 題　David’s new book made it to the best-seller list because of its beautiful ______ and amusing stories.", "options": ["operations", "illustrations", "engagements", "accomplishments"], "answer": 1, "answerLabel": "B", "source": "104 學測｜詞彙｜第 4 題", "explanation": "因為漂亮的「插圖」和有趣的故事而暢銷：illustrations。operation 操作、engagement 訂婚/參與、accomplishment 成就。", "explanationSource": "own", "section": "104年"}, {"id": 285, "question": "第 5 題　The airport was closed because of the snowstorm, and our ______ for Paris had to be delayed until the following day.", "options": ["movement", "registration", "tendency", "departure"], "answer": 3, "answerLabel": "D", "source": "104 學測｜詞彙｜第 5 題", "explanation": "機場關閉，飛往巴黎的「出發」延到隔天：departure。movement 移動、registration 登記、tendency 傾向。", "explanationSource": "own", "section": "104年"}, {"id": 286, "question": "第 6 題　The moment the students felt the earthquake, they ran ______ out of the classroom to an open area outside.", "options": ["swiftly", "nearly", "loosely", "formally"], "answer": 0, "answerLabel": "A", "source": "104 學測｜詞彙｜第 6 題", "explanation": "感覺到地震就「迅速」跑出教室：swiftly。nearly 幾乎、loosely 鬆散地、formally 正式地。", "explanationSource": "own", "section": "104年"}, {"id": 287, "question": "第 7 題　The ______ capacity of this elevator is 400 kilograms. For safety reasons, it shouldn’t be overloaded.", "options": ["delicate", "automatic", "essential", "maximum"], "answer": 3, "answerLabel": "D", "source": "104 學測｜詞彙｜第 7 題", "explanation": "電梯「最大」載重 400 公斤，不可超載：maximum capacity。delicate 精細的、automatic 自動的、essential 必要的。", "explanationSource": "own", "section": "104年"}, {"id": 288, "question": "第 8 題　An open display of ______ behavior between men and women, such as hugging and kissing, is not allowed in some conservative societies.", "options": ["intimate", "ashamed", "earnest", "urgent"], "answer": 0, "answerLabel": "A", "source": "104 學測｜詞彙｜第 8 題", "explanation": "擁抱、親吻等「親密」行為在保守社會不被允許公開：intimate。ashamed 羞愧的、earnest 認真的、urgent 緊急的。", "explanationSource": "own", "section": "104年"}, {"id": 289, "question": "第 9 題　When taking medicine, we should read the instructions on the ______ carefully because they provide important information such as how and when to take it.", "options": ["medals", "quotes", "labels", "recipes"], "answer": 2, "answerLabel": "C", "source": "104 學測｜詞彙｜第 9 題", "explanation": "吃藥前要仔細閱讀「標籤」上的說明：labels。medal 獎牌、quote 引言、recipe 食譜。", "explanationSource": "own", "section": "104年"}, {"id": 290, "question": "第 10 題　The angry passengers argued ______ with the airline staff because their flight was cancelled without any reason.", "options": ["evidently", "furiously", "obediently", "suspiciously"], "answer": 1, "answerLabel": "B", "source": "104 學測｜詞彙｜第 10 題", "explanation": "航班無故取消，乘客「憤怒地」與航空公司人員爭論：furiously。evidently 明顯地、obediently 順從地、suspiciously 懷疑地。", "explanationSource": "own", "section": "104年"}, {"id": 291, "question": "第 11 題　To ______ the new product, the company offered some free samples before they officially launched it.", "options": ["contribute", "impress", "promote", "estimate"], "answer": 2, "answerLabel": "C", "source": "104 學測｜詞彙｜第 11 題", "explanation": "為「推銷」新產品，上市前先提供免費試用品：promote。contribute 貢獻、impress 使印象深刻、estimate 估計。", "explanationSource": "own", "section": "104年"}, {"id": 292, "question": "第 12 題　I was worried about my first overseas trip, but my father ______ me that he would help plan the trip so that nothing would go wrong.", "options": ["rescued", "assured", "inspired", "conveyed"], "answer": 1, "answerLabel": "B", "source": "104 學測｜詞彙｜第 12 題", "explanation": "父親「向我保證」會幫忙規劃旅行：assured me that。rescue 救援、inspire 啟發、convey 傳達。", "explanationSource": "own", "section": "104年"}, {"id": 293, "question": "第 13 題　The recent cooking oil scandals have led to calls for tougher ______ of sales of food products.", "options": ["tolerance", "guarantee", "regulation", "distribution"], "answer": 2, "answerLabel": "C", "source": "104 學測｜詞彙｜第 13 題", "explanation": "食用油風暴導致要求更嚴格的「管制」：regulation。tolerance 容忍、guarantee 保證、distribution 分配。", "explanationSource": "own", "section": "104年"}, {"id": 294, "question": "第 14 題　John should ______ more often with his friends and family after work, instead of staying in his room to play computer games.", "options": ["explore", "interact", "negotiate", "participate"], "answer": 1, "answerLabel": "B", "source": "104 學測｜詞彙｜第 14 題", "explanation": "應多和朋友家人「互動」，而不是關在房間玩電腦：interact with。explore 探索、negotiate 談判、participate 參加（用 in）。", "explanationSource": "own", "section": "104年"}, {"id": 295, "question": "第 15 題　To prevent the spread of the Ebola virus from West Africa to the rest of the world, many airports have begun Ebola ______ for passengers from the infected areas.", "options": ["screenings", "listings", "clippings", "blockings"], "answer": 0, "answerLabel": "A", "source": "104 學測｜詞彙｜第 15 題", "explanation": "機場開始對來自疫區的旅客進行伊波拉「篩檢」：screenings。listing 列表、clipping 剪報、blocking 阻擋。", "explanationSource": "own", "section": "104年"}, {"id": 296, "question": "【綜合測驗 第 16–20 題】\n@@104-16–20@@\n\n▶ 第 16 題　請選出 __16__ 的最佳答案", "options": ["practice", "consult", "display", "manage"], "answer": 0, "answerLabel": "A", "source": "104 學測｜綜合測驗｜第 16 題", "explanation": "人們「練」太極拳主要為了健康：practice Tai Chi。consult 諮詢、display 展示、manage 管理。", "explanationSource": "own", "section": "104年"}, {"id": 297, "question": "【綜合測驗 第 16–20 題】\n@@104-16–20@@\n\n▶ 第 17 題　請選出 __17__ 的最佳答案", "options": ["from", "like", "between", "regarding"], "answer": 1, "answerLabel": "B", "source": "104 學測｜綜合測驗｜第 17 題", "explanation": "poetic names like “dragons stirring up the wind”：like 表「例如、像」。", "explanationSource": "own", "section": "104年"}, {"id": 298, "question": "【綜合測驗 第 16–20 題】\n@@104-16–20@@\n\n▶ 第 18 題　請選出 __18__ 的最佳答案", "options": ["allow", "allows", "allowed", "allowing"], "answer": 0, "answerLabel": "A", "source": "104 學測｜綜合測驗｜第 18 題", "explanation": "主詞 These movements（複數）+ 現在式動詞 allow；forming an exercise system 是插入的分詞片語。", "explanationSource": "own", "section": "104年"}, {"id": 299, "question": "【綜合測驗 第 16–20 題】\n@@104-16–20@@\n\n▶ 第 19 題　請選出 __19__ 的最佳答案", "options": ["formal", "mental", "social", "global"], "answer": 1, "answerLabel": "B", "source": "104 學測｜綜合測驗｜第 19 題", "explanation": "後句 Psychologically（心理上）呼應：太極不只是身體運動，也是「心理」運動：mental。", "explanationSource": "own", "section": "104年"}, {"id": 300, "question": "【綜合測驗 第 16–20 題】\n@@104-16–20@@\n\n▶ 第 20 題　請選出 __20__ 的最佳答案", "options": ["imposes", "offends", "reduces", "disturbs"], "answer": 2, "answerLabel": "C", "source": "104 學測｜綜合測驗｜第 20 題", "explanation": "太極「減少」壓力並帶來平靜與自信：reduces stress。impose 強加、offend 冒犯、disturb 干擾。", "explanationSource": "own", "section": "104年"}, {"id": 301, "question": "【綜合測驗 第 21–25 題】\n@@104-21–25@@\n\n▶ 第 21 題　請選出 __21__ 的最佳答案", "options": ["Therefore", "Nevertheless", "Roughly", "Similarly"], "answer": 3, "answerLabel": "D", "source": "104 學測｜綜合測驗｜第 21 題", "explanation": "前句說藍鳥是幸運象徵，「同樣地」啄木鳥也被視為好兆頭：Similarly。", "explanationSource": "own", "section": "104年"}, {"id": 302, "question": "【綜合測驗 第 21–25 題】\n@@104-21–25@@\n\n▶ 第 22 題　請選出 __22__ 的最佳答案", "options": ["officially", "mutually", "universally", "eventually"], "answer": 2, "answerLabel": "C", "source": "104 學測｜綜合測驗｜第 22 題", "explanation": "後文說在印度、中國、日本孔雀是吉祥的，但其他地方不是，所以孔雀「並非普遍」被視為幸運：universally。", "explanationSource": "own", "section": "104年"}, {"id": 303, "question": "【綜合測驗 第 21–25 題】\n@@104-21–25@@\n\n▶ 第 23 題　請選出 __23__ 的最佳答案", "options": ["approach", "approaching", "approached", "be approaching"], "answer": 1, "answerLabel": "B", "source": "104 學測｜綜合測驗｜第 23 題", "explanation": "羽毛上的「眼睛」能警示孔雀「逼近的」邪惡：approaching evil（現在分詞作形容詞）。", "explanationSource": "own", "section": "104年"}, {"id": 304, "question": "【綜合測驗 第 21–25 題】\n@@104-21–25@@\n\n▶ 第 24 題　請選出 __24__ 的最佳答案", "options": ["replace", "disguise", "distinguish", "represent"], "answer": 3, "answerLabel": "D", "source": "104 學測｜綜合測驗｜第 24 題", "explanation": "統治家族把孔雀當作象徵，用來「代表」地位與財富：represent。replace 取代、disguise 偽裝、distinguish 區別。", "explanationSource": "own", "section": "104年"}, {"id": 305, "question": "【綜合測驗 第 21–25 題】\n@@104-21–25@@\n\n▶ 第 25 題　請選出 __25__ 的最佳答案", "options": ["unlucky", "illogical", "impossible", "unnecessary"], "answer": 0, "answerLabel": "A", "source": "104 學測｜綜合測驗｜第 25 題", "explanation": "羽毛上的眼狀斑紋與「邪眼」有關，被認為是最「不吉利」的部分：unlucky。", "explanationSource": "own", "section": "104年"}, {"id": 306, "question": "【綜合測驗 第 26–30 題】\n@@104-26–30@@\n\n▶ 第 26 題　請選出 __26__ 的最佳答案", "options": ["to gather", "gather", "gathered", "gathering"], "answer": 3, "answerLabel": "D", "source": "104 學測｜綜合測驗｜第 26 題", "explanation": "from early humans gathering fruits and nuts：現在分詞修飾 early humans，描述早期人類「採集」果實。", "explanationSource": "own", "section": "104年"}, {"id": 307, "question": "【綜合測驗 第 26–30 題】\n@@104-26–30@@\n\n▶ 第 27 題　請選出 __27__ 的最佳答案", "options": ["all", "with", "around", "still"], "answer": 1, "answerLabel": "B", "source": "104 學測｜綜合測驗｜第 27 題", "explanation": "with over 7,000 different kinds in existence：with + 名詞表「有超過七千種」。", "explanationSource": "own", "section": "104年"}, {"id": 308, "question": "【綜合測驗 第 26–30 題】\n@@104-26–30@@\n\n▶ 第 28 題　請選出 __28__ 的最佳答案", "options": ["variety", "harvest", "condition", "discovery"], "answer": 0, "answerLabel": "A", "source": "104 學測｜綜合測驗｜第 28 題", "explanation": "儘管品種「多樣」，大多數馴化的蘋果都可追溯到同一祖先：variety。harvest 收成、condition 狀況、discovery 發現。", "explanationSource": "own", "section": "104年"}, {"id": 309, "question": "【綜合測驗 第 26–30 題】\n@@104-26–30@@\n\n▶ 第 29 題　請選出 __29__ 的最佳答案", "options": ["bring", "have brought", "were brought", "have been brought"], "answer": 2, "answerLabel": "C", "source": "104 學測｜綜合測驗｜第 29 題", "explanation": "17 世紀「被」歐洲殖民者帶到北美：過去的被動 were brought。", "explanationSource": "own", "section": "104年"}, {"id": 310, "question": "【綜合測驗 第 26–30 題】\n@@104-26–30@@\n\n▶ 第 30 題　請選出 __30__ 的最佳答案", "options": ["regularly", "particularly", "permanently", "barely"], "answer": 0, "answerLabel": "A", "source": "104 學測｜綜合測驗｜第 30 題", "explanation": "今日蘋果在全世界被「普遍、經常」食用：regularly。particularly 特別地、permanently 永久地、barely 幾乎不。", "explanationSource": "own", "section": "104年"}, {"id": 311, "question": "第 1 題　Lost and scared, the little dog ______ along the streets, looking for its master.", "options": ["dismissed", "glided", "wandered", "marched"], "answer": 2, "answerLabel": "C", "source": "103 學測｜詞彙｜第 1 題", "explanation": "走失又害怕的小狗沿街「徘徊」尋找主人：wandered。dismiss 解散、glide 滑行、march 行軍。", "explanationSource": "own", "section": "103年"}, {"id": 312, "question": "第 2 題　On a sunny afternoon last month, we all took off our shoes and walked on the grass with ______ feet.", "options": ["bare", "raw", "tough", "slippery"], "answer": 0, "answerLabel": "A", "source": "103 學測｜詞彙｜第 2 題", "explanation": "脫掉鞋子「光著」腳走在草地上：bare feet。raw 生的、tough 堅韌的、slippery 滑的。", "explanationSource": "own", "section": "103年"}, {"id": 313, "question": "第 3 題　It is both legally and ______ wrong to spread rumors about other people on the Internet.", "options": ["morally", "physically", "literarily", "commercially"], "answer": 0, "answerLabel": "A", "source": "103 學測｜詞彙｜第 3 題", "explanation": "網路散播謠言在法律上和「道德上」都是錯的：morally。physically 身體上、literarily 文學上、commercially 商業上。", "explanationSource": "own", "section": "103年"}, {"id": 314, "question": "第 4 題　These warm-up exercises are designed to help people ______ their muscles and prevent injuries.", "options": ["produce", "connect", "broaden", "loosen"], "answer": 3, "answerLabel": "D", "source": "103 學測｜詞彙｜第 4 題", "explanation": "暖身運動幫助「放鬆」肌肉、預防受傷：loosen。produce 生產、connect 連接、broaden 拓寬。", "explanationSource": "own", "section": "103年"}, {"id": 315, "question": "第 5 題　Mei-ling has a very close relationship with her parents. She always ______ them before she makes important decisions.", "options": ["impresses", "advises", "consults", "motivates"], "answer": 2, "answerLabel": "C", "source": "103 學測｜詞彙｜第 5 題", "explanation": "做重大決定前總會「請教」父母：consults。impress 使印象深刻、advise 建議（主詞應為給建議的人）、motivate 激勵。", "explanationSource": "own", "section": "103年"}, {"id": 316, "question": "第 6 題　The restaurant has a ______ charge of NT$250 per person. So the four of us need to pay at least NT$1,000 to eat there.", "options": ["definite", "minimum", "flexible", "numerous"], "answer": 1, "answerLabel": "B", "source": "103 學測｜詞彙｜第 6 題", "explanation": "每人「最低」消費 250 元，四人至少 1,000 元：minimum charge。definite 明確的、flexible 彈性的、numerous 眾多的。", "explanationSource": "own", "section": "103年"}, {"id": 317, "question": "第 7 題　At the Book Fair, exhibitors from 21 countries will ______ textbooks, novels, and comic books.", "options": ["predict", "require", "display", "target"], "answer": 2, "answerLabel": "C", "source": "103 學測｜詞彙｜第 7 題", "explanation": "書展參展者「展示」教科書、小說和漫畫：display。predict 預測、require 要求、target 鎖定。", "explanationSource": "own", "section": "103年"}, {"id": 318, "question": "第 8 題　Before John got on the stage to give the speech, he took a deep ______ to calm himself down.", "options": ["order", "rest", "effort", "breath"], "answer": 3, "answerLabel": "D", "source": "103 學測｜詞彙｜第 8 題", "explanation": "上台前「深呼吸」讓自己冷靜：take a deep breath。order 命令、rest 休息、effort 努力。", "explanationSource": "own", "section": "103年"}, {"id": 319, "question": "第 9 題　Most young people in Taiwan are not satisfied with a high school ______ and continue to pursue further education in college.", "options": ["maturity", "diploma", "foundation", "guarantee"], "answer": 1, "answerLabel": "B", "source": "103 學測｜詞彙｜第 9 題", "explanation": "不滿足於高中「文憑」而繼續升學：diploma。maturity 成熟、foundation 基礎、guarantee 保證。", "explanationSource": "own", "section": "103年"}, {"id": 320, "question": "第 10 題　Residents are told not to dump all household waste ______ into the trash can; reusable materials should first be sorted out and recycled.", "options": ["shortly", "straight", "forward", "namely"], "answer": 1, "answerLabel": "B", "source": "103 學測｜詞彙｜第 10 題", "explanation": "不要把垃圾「直接」全丟進垃圾桶，應先分類回收：straight 直接地。shortly 不久、forward 向前、namely 也就是。", "explanationSource": "own", "section": "103年"}, {"id": 321, "question": "第 11 題　Kevin had been standing on a ladder trying to reach for a book on the top shelf when he lost his ______ and fell to the ground.", "options": ["volume", "weight", "balance", "direction"], "answer": 2, "answerLabel": "C", "source": "103 學測｜詞彙｜第 11 題", "explanation": "站在梯子上「失去平衡」摔下來：lose one’s balance。volume 音量、weight 重量、direction 方向。", "explanationSource": "own", "section": "103年"}, {"id": 322, "question": "第 12 題　If student enrollment continues to drop, some programs at the university may be ______ to reduce the operation costs.", "options": ["relieved", "eliminated", "projected", "accounted"], "answer": 1, "answerLabel": "B", "source": "103 學測｜詞彙｜第 12 題", "explanation": "學生減少，某些課程可能被「取消」以降低成本：eliminated。relieve 緩解、project 預計、account 說明。", "explanationSource": "own", "section": "103年"}, {"id": 323, "question": "第 13 題　People in that remote village feed themselves by hunting and engaging in ______ forms of agriculture. No modern agricultural methods are used.", "options": ["universal", "splendid", "primitive", "courteous"], "answer": 2, "answerLabel": "C", "source": "103 學測｜詞彙｜第 13 題", "explanation": "沒有使用現代農法，是「原始的」農業形式：primitive。universal 普遍的、splendid 壯麗的、courteous 有禮的。", "explanationSource": "own", "section": "103年"}, {"id": 324, "question": "第 14 題　The government issued a travel ______ for Taiwanese in response to the outbreak of civil war in Syria.", "options": ["alert", "monument", "exit", "circulation"], "answer": 0, "answerLabel": "A", "source": "103 學測｜詞彙｜第 14 題", "explanation": "因內戰爆發發布旅遊「警示」：travel alert。monument 紀念碑、exit 出口、circulation 流通。", "explanationSource": "own", "section": "103年"}, {"id": 325, "question": "第 15 題　The baby panda Yuan Zai at the Taipei Zoo was separated from her mother because of a minor injury that occurred during her birth. She was ______ by zookeepers for a while.", "options": ["departed", "jailed", "tended", "captured"], "answer": 2, "answerLabel": "C", "source": "103 學測｜詞彙｜第 15 題", "explanation": "熊貓寶寶與母親分開，由保育員「照顧」一段時間：tended。depart 離開、jail 關押、capture 捕捉。", "explanationSource": "own", "section": "103年"}, {"id": 326, "question": "【綜合測驗 第 16–20 題】\n@@103-16–20@@\n\n▶ 第 16 題　請選出 __16__ 的最佳答案", "options": ["Amazing", "Smiling", "Deciding", "Praying"], "answer": 1, "answerLabel": "B", "source": "103 學測｜綜合測驗｜第 16 題", "explanation": "旅人說家鄉的人都友善熱情，是「微笑著」回答：Smiling 分詞構句。對比後文第二個旅人 frowning（皺眉）。", "explanationSource": "own", "section": "103年"}, {"id": 327, "question": "【綜合測驗 第 16–20 題】\n@@103-16–20@@\n\n▶ 第 17 題　請選出 __17__ 的最佳答案", "options": ["At", "By", "For", "Into"], "answer": 0, "answerLabel": "A", "source": "103 學測｜綜合測驗｜第 17 題", "explanation": "At this 聽到這話（對此）：at 表對…的反應。", "explanationSource": "own", "section": "103年"}, {"id": 328, "question": "【綜合測驗 第 16–20 題】\n@@103-16–20@@\n\n▶ 第 18 題　請選出 __18__ 的最佳答案", "options": ["a", "the", "other", "another"], "answer": 3, "answerLabel": "D", "source": "103 學測｜綜合測驗｜第 18 題", "explanation": "幾小時後「另一個」旅人走來：another traveler。", "explanationSource": "own", "section": "103年"}, {"id": 329, "question": "【綜合測驗 第 16–20 題】\n@@103-16–20@@\n\n▶ 第 19 題　請選出 __19__ 的最佳答案", "options": ["Again", "Indeed", "Together", "Moreover"], "answer": 0, "answerLabel": "A", "source": "103 學測｜綜合測驗｜第 19 題", "explanation": "Aesop「再次」提出同樣的要求：Again。Indeed 的確、Together 一起、Moreover 此外。", "explanationSource": "own", "section": "103年"}, {"id": 330, "question": "【綜合測驗 第 16–20 題】\n@@103-16–20@@\n\n▶ 第 20 題　請選出 __20__ 的最佳答案", "options": ["brave", "lonely", "mean", "skinny"], "answer": 2, "answerLabel": "C", "source": "103 學測｜綜合測驗｜第 20 題", "explanation": "與 unfriendly、vicious 並列的負面形容詞：mean 刻薄的。brave 勇敢、lonely 孤單、skinny 瘦。", "explanationSource": "own", "section": "103年"}, {"id": 331, "question": "【綜合測驗 第 21–25 題】\n@@103-21–25@@\n\n▶ 第 21 題　請選出 __21__ 的最佳答案", "options": ["situations", "descriptions", "translations", "calculations"], "answer": 1, "answerLabel": "B", "source": "103 學測｜綜合測驗｜第 21 題", "explanation": "遊客被海明威對古老冰河的「描述」所吸引：descriptions。situation 情況、translation 翻譯、calculation 計算。", "explanationSource": "own", "section": "103年"}, {"id": 332, "question": "【綜合測驗 第 21–25 題】\n@@103-21–25@@\n\n▶ 第 22 題　請選出 __22__ 的最佳答案", "options": ["operate", "expand", "recover", "vanish"], "answer": 3, "answerLabel": "D", "source": "103 學測｜綜合測驗｜第 22 題", "explanation": "後文說雪和冰河正在融化，景點很快會「消失」：vanish。operate 運作、expand 擴張、recover 恢復。", "explanationSource": "own", "section": "103年"}, {"id": 333, "question": "【綜合測驗 第 21–25 題】\n@@103-21–25@@\n\n▶ 第 23 題　請選出 __23__ 的最佳答案", "options": ["capable", "ready", "likely", "horrible"], "answer": 2, "answerLabel": "C", "source": "103 學測｜綜合測驗｜第 23 題", "explanation": "be likely to disappear by 2020「可能」在 2020 年前消失：likely。capable 有能力的、ready 準備好的、horrible 可怕的。", "explanationSource": "own", "section": "103年"}, {"id": 334, "question": "【綜合測驗 第 21–25 題】\n@@103-21–25@@\n\n▶ 第 24 題　請選出 __24__ 的最佳答案", "options": ["Among", "Besides", "Inside", "Without"], "answer": 3, "answerLabel": "D", "source": "103 學測｜綜合測驗｜第 24 題", "explanation": "「沒有」山頂的積雪，就沒有足夠的水分滋養動植物：Without。", "explanationSource": "own", "section": "103年"}, {"id": 335, "question": "【綜合測驗 第 21–25 題】\n@@103-21–25@@\n\n▶ 第 25 題　請選出 __25__ 的最佳答案", "options": ["thus", "just", "instead", "otherwise"], "answer": 0, "answerLabel": "A", "source": "103 學測｜綜合測驗｜第 25 題", "explanation": "全球暖化使氣溫上升，「因此」威脅此地生態：thus。just 只是、instead 反而、otherwise 否則。", "explanationSource": "own", "section": "103年"}, {"id": 336, "question": "【綜合測驗 第 26–30 題】\n@@103-26–30@@\n\n▶ 第 26 題　請選出 __26__ 的最佳答案", "options": ["conveyed", "examined", "solved", "implied"], "answer": 1, "answerLabel": "B", "source": "103 學測｜綜合測驗｜第 26 題", "explanation": "做決定前有多徹底地「檢視」所有重要因素：examined。convey 傳達、solve 解決、imply 暗示。", "explanationSource": "own", "section": "103年"}, {"id": 337, "question": "【綜合測驗 第 26–30 題】\n@@103-26–30@@\n\n▶ 第 27 題　請選出 __27__ 的最佳答案", "options": ["whoever", "because", "whether", "rather"], "answer": 2, "answerLabel": "C", "source": "103 學測｜綜合測驗｜第 27 題", "explanation": "whether they are executives, specialized experts, or ordinary people 無論是主管、專家或一般人：whether … or …。", "explanationSource": "own", "section": "103年"}, {"id": 338, "question": "【綜合測驗 第 26–30 題】\n@@103-26–30@@\n\n▶ 第 28 題　請選出 __28__ 的最佳答案", "options": ["set out", "turn out", "put into practice", "take into account"], "answer": 3, "answerLabel": "D", "source": "103 學測｜綜合測驗｜第 28 題", "explanation": "很少人能在短時間內「考慮到」所有可能性：take into account 考慮。set out 出發、turn out 結果是、put into practice 實行。", "explanationSource": "own", "section": "103年"}, {"id": 339, "question": "【綜合測驗 第 26–30 題】\n@@103-26–30@@\n\n▶ 第 29 題　請選出 __29__ 的最佳答案", "options": ["However", "Furthermore", "Conditionally", "Similarly"], "answer": 0, "answerLabel": "A", "source": "103 學測｜綜合測驗｜第 29 題", "explanation": "前句說他們努力事先考慮所有因素，「然而」常常來不及就做了決定：However 轉折。", "explanationSource": "own", "section": "103年"}, {"id": 340, "question": "【綜合測驗 第 26–30 題】\n@@103-26–30@@\n\n▶ 第 30 題　請選出 __30__ 的最佳答案", "options": ["though", "unless", "once", "even"], "answer": 2, "answerLabel": "C", "source": "103 學測｜綜合測驗｜第 30 題", "explanation": "「一旦」形成意見，之後的思考只是在找支持它的理由：once 一旦。", "explanationSource": "own", "section": "103年"}, {"id": 341, "question": "第 1 題　It rained so hard yesterday that the baseball game had to be ______ until next Saturday.", "options": ["surrendered", "postponed", "abandoned", "opposed"], "answer": 1, "answerLabel": "B", "source": "102 學測｜詞彙｜第 1 題", "explanation": "大雨導致球賽「延期」到下週六：postponed。surrender 投降、abandon 放棄、oppose 反對。", "explanationSource": "own", "section": "102年"}, {"id": 342, "question": "第 2 題　As more people rely on the Internet for information, it has ______ newspapers as the most important source of news.", "options": ["distributed", "subtracted", "replaced", "transferred"], "answer": 2, "answerLabel": "C", "source": "102 學測｜詞彙｜第 2 題", "explanation": "網路「取代」報紙成為最重要的新聞來源：replaced。distribute 分配、subtract 減去、transfer 轉移。", "explanationSource": "own", "section": "102年"}, {"id": 343, "question": "第 3 題　Having saved enough money, Joy ______ two trips for this summer vacation, one to France and the other to Australia.", "options": ["booked", "observed", "enclosed", "deposited"], "answer": 0, "answerLabel": "A", "source": "102 學測｜詞彙｜第 3 題", "explanation": "存夠錢後「預訂」了兩個暑假行程：booked。observe 觀察、enclose 附上、deposit 存放。", "explanationSource": "own", "section": "102年"}, {"id": 344, "question": "第 4 題　Since I do not fully understand your proposal, I am not in the position to make any ______ on it.", "options": ["difference", "solution", "demand", "comment"], "answer": 3, "answerLabel": "D", "source": "102 學測｜詞彙｜第 4 題", "explanation": "不完全了解提案，所以無法「評論」：make a comment on。difference 差異、solution 解答、demand 要求。", "explanationSource": "own", "section": "102年"}, {"id": 345, "question": "第 5 題　Betty was ______ to accept her friend’s suggestion because she thought she could come up with a better idea herself.", "options": ["tolerable", "sensitive", "reluctant", "modest"], "answer": 2, "answerLabel": "C", "source": "102 學測｜詞彙｜第 5 題", "explanation": "覺得自己能想出更好的點子，所以「不願意」接受朋友的建議：reluctant。tolerable 可忍受的、sensitive 敏感的、modest 謙虛的。", "explanationSource": "own", "section": "102年"}, {"id": 346, "question": "第 6 題　The bank tries its best to attract more customers. Its staff members are always available to provide ______ service.", "options": ["singular", "prompt", "expensive", "probable"], "answer": 1, "answerLabel": "B", "source": "102 學測｜詞彙｜第 6 題", "explanation": "銀行為吸引客戶，員工隨時提供「迅速的」服務：prompt。singular 單一的、expensive 昂貵的、probable 可能的。", "explanationSource": "own", "section": "102年"}, {"id": 347, "question": "第 7 題　John’s part-time experience at the cafeteria is good ______ for running his own restaurant.", "options": ["preparation", "recognition", "formation", "calculation"], "answer": 0, "answerLabel": "A", "source": "102 學測｜詞彙｜第 7 題", "explanation": "打工經驗是日後開餐廳的好「準備」：preparation。recognition 認可、formation 形成、calculation 計算。", "explanationSource": "own", "section": "102年"}, {"id": 348, "question": "第 8 題　Women’s fashions are ______ changing: One season they may favor pantsuits, but the next season they may prefer miniskirts.", "options": ["lately", "shortly", "relatively", "constantly"], "answer": 3, "answerLabel": "D", "source": "102 學測｜詞彙｜第 8 題", "explanation": "一季流行褲裝、下一季流行迷你裙，表示時尚「不斷」改變：constantly。lately 最近、shortly 不久、relatively 相對地。", "explanationSource": "own", "section": "102年"}, {"id": 349, "question": "第 9 題　Standing on the seashore, we saw a ______ of seagulls flying over the ocean before they glided down and settled on the water.", "options": ["pack", "flock", "herd", "school"], "answer": 1, "answerLabel": "B", "source": "102 學測｜詞彙｜第 9 題", "explanation": "a flock of seagulls 一「群」海鷗：flock 用於鳥類。pack 用於狼/狗、herd 用於牛羊、school 用於魚群。", "explanationSource": "own", "section": "102年"}, {"id": 350, "question": "第 10 題　The book is not only informative but also ______ , making me laugh and feel relaxed while reading it.", "options": ["understanding", "infecting", "entertaining", "annoying"], "answer": 2, "answerLabel": "C", "source": "102 學測｜詞彙｜第 10 題", "explanation": "這本書讓我邊讀邊笑，表示不只有資訊也很「有娛樂性」：entertaining。understanding 體諒的、infecting 感染的、annoying 惱人的。", "explanationSource": "own", "section": "102年"}, {"id": 351, "question": "第 11 題　After working in front of my computer for the entire day, my neck and shoulders got so ______ that I couldn’t even turn my head.", "options": ["dense", "harsh", "stiff", "concrete"], "answer": 2, "answerLabel": "C", "source": "102 學測｜詞彙｜第 11 題", "explanation": "整天用電腦，脖子和肩膀「僵硬」到無法轉頭：stiff。dense 密集的、harsh 嚴厲的、concrete 具體的。", "explanationSource": "own", "section": "102年"}, {"id": 352, "question": "第 12 題　Getting a flu shot before the start of flu season gives our body a chance to build up protection against the ______ that could make us sick.", "options": ["poison", "misery", "leak", "virus"], "answer": 3, "answerLabel": "D", "source": "102 學測｜詞彙｜第 12 題", "explanation": "打流感疫苗讓身體建立對「病毒」的防護：virus。poison 毒藥、misery 痛苦、leak 漏洞。", "explanationSource": "own", "section": "102年"}, {"id": 353, "question": "第 13 題　The kingdom began to ______ after the death of its ruler, and was soon taken over by a neighboring country.", "options": ["collapse", "dismiss", "rebel", "withdraw"], "answer": 0, "answerLabel": "A", "source": "102 學測｜詞彙｜第 13 題", "explanation": "統治者死後王國開始「崩潰」，很快被鄰國占領：collapse。dismiss 解散、rebel 反叛、withdraw 撤退。", "explanationSource": "own", "section": "102年"}, {"id": 354, "question": "第 14 題　Though Kevin failed in last year’s singing contest, he did not feel ______ . This year he practiced day and night and finally won first place in the competition.", "options": ["relieved", "suspected", "discounted", "frustrated"], "answer": 3, "answerLabel": "D", "source": "102 學測｜詞彙｜第 14 題", "explanation": "比賽失利卻沒有感到「受挫」，隔年日夜練習奪冠：frustrated。relieved 鬆一口氣的、suspected 被懷疑的、discounted 被低估的。", "explanationSource": "own", "section": "102年"}, {"id": 355, "question": "第 15 題　Emma and Joe are looking for a live-in babysitter for their three-year-old twins, ______ one who knows how to cook.", "options": ["initially", "apparently", "preferably", "considerably"], "answer": 2, "answerLabel": "C", "source": "102 學測｜詞彙｜第 15 題", "explanation": "找保母，「最好是」會做菜的：preferably。initially 最初、apparently 顯然、considerably 相當地。", "explanationSource": "own", "section": "102年"}, {"id": 356, "question": "【綜合測驗 第 16–20 題】\n@@102-16–20@@\n\n▶ 第 16 題　請選出 __16__ 的最佳答案", "options": ["calling", "being called", "having called", "has been calling"], "answer": 1, "answerLabel": "B", "source": "102 學測｜綜合測驗｜第 16 題", "explanation": "the number being called 被撥打的號碍（接收電話的一方）：現在分詞被動式修飾 number；對比後面的 the number making the call。", "explanationSource": "own", "section": "102年"}, {"id": 357, "question": "【綜合測驗 第 16–20 題】\n@@102-16–20@@\n\n▶ 第 17 題　請選出 __17__ 的最佳答案", "options": ["in fact", "to illustrate", "at the same time", "on the other hand"], "answer": 3, "answerLabel": "D", "source": "102 學測｜綜合測驗｜第 17 題", "explanation": "區碼有時不必撥，「另一方面」本地號碼一定要撥完整：on the other hand。", "explanationSource": "own", "section": "102年"}, {"id": 358, "question": "【綜合測驗 第 16–20 題】\n@@102-16–20@@\n\n▶ 第 18 題　請選出 __18__ 的最佳答案", "options": ["for", "as", "by", "in"], "answer": 3, "answerLabel": "D", "source": "102 學測｜綜合測驗｜第 18 題", "explanation": "in the format of XYX 以 XYX 的「格式」建立：介系詞 in 表形式。", "explanationSource": "own", "section": "102年"}, {"id": 359, "question": "【綜合測驗 第 16–20 題】\n@@102-16–20@@\n\n▶ 第 19 題　請選出 __19__ 的最佳答案", "options": ["reserved", "assigned", "represented", "assembled"], "answer": 1, "answerLabel": "B", "source": "102 學測｜綜合測驗｜第 19 題", "explanation": "紐約是最大城市，「被分配到」212 區碼：was assigned。reserve 保留、represent 代表、assemble 組裝。", "explanationSource": "own", "section": "102年"}, {"id": 360, "question": "【綜合測驗 第 16–20 題】\n@@102-16–20@@\n\n▶ 第 20 題　請選出 __20__ 的最佳答案", "options": ["cost", "format", "quality", "distance"], "answer": 0, "answerLabel": "A", "source": "102 學測｜綜合測驗｜第 20 題", "explanation": "後句說區碼內通話費率較低，所以區碼決定通話「費用」：cost。format 格式、quality 品質、distance 距離。", "explanationSource": "own", "section": "102年"}, {"id": 361, "question": "【綜合測驗 第 21–25 題】\n@@102-21–25@@\n\n▶ 第 21 題　請選出 __21__ 的最佳答案", "options": ["Rare as", "The rare", "Rarest", "The rarer"], "answer": 3, "answerLabel": "D", "source": "102 學測｜綜合測驗｜第 21 題", "explanation": "The rarer a coin is, the more it is worth：「越…就越…」句型 the + 比較級。", "explanationSource": "own", "section": "102年"}, {"id": 362, "question": "【綜合測驗 第 21–25 題】\n@@102-21–25@@\n\n▶ 第 22 題　請選出 __22__ 的最佳答案", "options": ["age", "shape", "size", "weight"], "answer": 0, "answerLabel": "A", "source": "102 學測｜綜合測驗｜第 22 題", "explanation": "稀有度與硬幣的「年代」關係不大：後文說很多千年古幣只值幾美元。age 年代。", "explanationSource": "own", "section": "102年"}, {"id": 363, "question": "【綜合測驗 第 21–25 題】\n@@102-21–25@@\n\n▶ 第 23 題　請選出 __23__ 的最佳答案", "options": ["since", "while", "whether", "if"], "answer": 1, "answerLabel": "B", "source": "102 學測｜綜合測驗｜第 23 題", "explanation": "千年古幣只賣幾美元，「而」1913 年的鎳幣可賣百萬：while 表對比。", "explanationSource": "own", "section": "102年"}, {"id": 364, "question": "【綜合測驗 第 21–25 題】\n@@102-21–25@@\n\n▶ 第 24 題　請選出 __24__ 的最佳答案", "options": ["merely", "hardly", "greatly", "roughly"], "answer": 2, "answerLabel": "C", "source": "102 學測｜綜合測驗｜第 24 題", "explanation": "需求也會「大大」影響硬幣價值：greatly。merely 僅僅、hardly 幾乎不、roughly 大約。", "explanationSource": "own", "section": "102年"}, {"id": 365, "question": "【綜合測驗 第 21–25 題】\n@@102-21–25@@\n\n▶ 第 25 題　請選出 __25__ 的最佳答案", "options": ["older", "better", "latter", "bigger"], "answer": 2, "answerLabel": "C", "source": "102 學測｜綜合測驗｜第 25 題", "explanation": "1798 年的 dime 更稀有，但「後者」（1916 年的）賣得更貴：the latter 後者，因為更多人收藏 20 世紀初的硬幣。", "explanationSource": "own", "section": "102年"}, {"id": 366, "question": "【綜合測驗 第 26–30 題】\n@@102-26–30@@\n\n▶ 第 26 題　請選出 __26__ 的最佳答案", "options": ["contrary", "normal", "detective", "mutual"], "answer": 1, "answerLabel": "B", "source": "102 學測｜綜合測驗｜第 26 題", "explanation": "他研究「正常」心智的運作，而非精神疾病：normal。contrary 相反的、detective 偵探的、mutual 相互的。", "explanationSource": "own", "section": "102年"}, {"id": 367, "question": "【綜合測驗 第 26–30 題】\n@@102-26–30@@\n\n▶ 第 27 題　請選出 __27__ 的最佳答案", "options": ["had", "kept", "wanted", "asked"], "answer": 0, "answerLabel": "A", "source": "102 學測｜綜合測驗｜第 27 題", "explanation": "had children do tasks：使役動詞 have + O + 原形動詞（後面接的是原形 follow, copy, name…）。", "explanationSource": "own", "section": "102年"}, {"id": 368, "question": "【綜合測驗 第 26–30 題】\n@@102-26–30@@\n\n▶ 第 28 題　請選出 __28__ 的最佳答案", "options": ["composed of", "based on", "resulting in", "fighting against"], "answer": 1, "answerLabel": "B", "source": "102 學測｜綜合測驗｜第 28 題", "explanation": "「根據」他收集的資料建立標準：based on。composed of 由…組成、resulting in 導致、fighting against 對抗。", "explanationSource": "own", "section": "102年"}, {"id": 369, "question": "【綜合測驗 第 26–30 題】\n@@102-26–30@@\n\n▶ 第 29 題　請選出 __29__ 的最佳答案", "options": ["success", "objection", "agreement", "discovery"], "answer": 0, "answerLabel": "A", "source": "102 學測｜綜合測驗｜第 29 題", "explanation": "若 70% 的 8 歲兒童能通過某測驗，那麼在該測驗的「成功」就代表 8 歲的智力水準：success。", "explanationSource": "own", "section": "102年"}, {"id": 370, "question": "【綜合測驗 第 26–30 題】\n@@102-26–30@@\n\n▶ 第 30 題　請選出 __30__ 的最佳答案", "options": ["is", "are", "been", "being"], "answer": 3, "answerLabel": "D", "source": "102 學測｜綜合測驗｜第 30 題", "explanation": "with 100 being the average：with + O + 分詞，獨立結構，「以 100 為平均值」。", "explanationSource": "own", "section": "102年"}, {"id": 371, "question": "第 1 題　The ending of the movie did not come as a ______ to John because he had already read the novel that the movie was based on.", "options": ["vision", "focus", "surprise", "conclusion"], "answer": 2, "answerLabel": "C", "source": "101 學測｜詞彙｜第 1 題", "explanation": "已經讀過原著，所以結局並不「意外」：come as a surprise 令人意外。vision 視野、focus 焦點、conclusion 結論。", "explanationSource": "own", "section": "101年"}, {"id": 372, "question": "第 2 題　In order to stay healthy and fit, John exercises ______. He works out twice a week in a gym.", "options": ["regularly", "directly", "hardly", "gradually"], "answer": 0, "answerLabel": "A", "source": "101 學測｜詞彙｜第 2 題", "explanation": "每週固定上健身房兩次，表示「規律地」運動：regularly。directly 直接地、hardly 幾乎不、gradually 逐漸地。", "explanationSource": "own", "section": "101年"}, {"id": 373, "question": "第 3 題　Traveling is a good way for us to ______ different cultures and broaden our horizons.", "options": ["assume", "explore", "occupy", "inspire"], "answer": 1, "answerLabel": "B", "source": "101 學測｜詞彙｜第 3 題", "explanation": "旅行是「探索」不同文化、拓展視野的好方法：explore。assume 假定、occupy 占據、inspire 啟發。", "explanationSource": "own", "section": "101年"}, {"id": 374, "question": "第 4 題　The story about Hou-I shooting down nine suns is a well-known Chinese ______, but it may not be a true historical event.", "options": ["figure", "rumor", "miracle", "legend"], "answer": 3, "answerLabel": "D", "source": "101 學測｜詞彙｜第 4 題", "explanation": "后羿射日是著名的中國「傳說」，未必是真實歷史：legend。figure 人物、rumor 謠言、miracle 奇蹟。", "explanationSource": "own", "section": "101年"}, {"id": 375, "question": "第 5 題　According to recent research, children under the age of 12 are generally not ______ enough to recognize risk and deal with dangerous situations.", "options": ["diligent", "mature", "familiar", "sincere"], "answer": 1, "answerLabel": "B", "source": "101 學測｜詞彙｜第 5 題", "explanation": "12 歲以下兒童不夠「成熟」，難以辨識風險：mature。diligent 勤奮的、familiar 熟悉的、sincere 真誠的。", "explanationSource": "own", "section": "101年"}, {"id": 376, "question": "第 6 題　Helen let out a sigh of ______ after hearing that her brother was not injured in the accident.", "options": ["hesitation", "relief", "sorrow", "triumph"], "answer": 1, "answerLabel": "B", "source": "101 學測｜詞彙｜第 6 題", "explanation": "聽到哥哥沒受傷，鬆了一口氣：a sigh of relief。hesitation 猶豫、sorrow 悲傷、triumph 勝利。", "explanationSource": "own", "section": "101年"}, {"id": 377, "question": "第 7 題　Research suggests that people with outgoing personalities tend to be more ______, often expecting that good things will happen.", "options": ["efficient", "practical", "changeable", "optimistic"], "answer": 3, "answerLabel": "D", "source": "101 學測｜詞彙｜第 7 題", "explanation": "外向的人常期待好事發生，較「樂觀」：optimistic。efficient 有效率的、practical 實際的、changeable 多變的。", "explanationSource": "own", "section": "101年"}, {"id": 378, "question": "第 8 題　No one could beat Paul at running. He has won the running championship ______ for three years.", "options": ["rapidly", "urgently", "continuously", "temporarily"], "answer": 2, "answerLabel": "C", "source": "101 學測｜詞彙｜第 8 題", "explanation": "沒人跑得過他，「連續」三年奪冠：continuously。rapidly 快速地、urgently 緊急地、temporarily 暫時地。", "explanationSource": "own", "section": "101年"}, {"id": 379, "question": "第 9 題　If you fly from Taipei to Tokyo, you’ll be taking an international, rather than a ______ flight.", "options": ["liberal", "domestic", "connected", "universal"], "answer": 1, "answerLabel": "B", "source": "101 學測｜詞彙｜第 9 題", "explanation": "台北飛東京是國際航線，而非「國內」航線：domestic。liberal 自由的、connected 相連的、universal 普遍的。", "explanationSource": "own", "section": "101年"}, {"id": 380, "question": "第 10 題　Jack is very proud of his fancy new motorcycle. He has been ______ to all his friends about how cool it looks and how fast it runs.", "options": ["boasting", "proposing", "gossiping", "confessing"], "answer": 0, "answerLabel": "A", "source": "101 學測｜詞彙｜第 10 題", "explanation": "向朋友「吹噓」新機車多酷多快：boast to sb. about。propose 提議、gossip 八卦、confess 坦承。", "explanationSource": "own", "section": "101年"}, {"id": 381, "question": "第 11 題　The ideas about family have changed ______ in the past twenty years. For example, my grandfather was one of ten children in his family, but I am the only child.", "options": ["mutually", "narrowly", "considerably", "scarcely"], "answer": 2, "answerLabel": "C", "source": "101 學測｜詞彙｜第 11 題", "explanation": "祖父有九個兄弟姊妹而我是獨子，表示家庭觀念改變「相當大」：considerably。mutually 相互地、narrowly 勉強地、scarcely 幾乎不。", "explanationSource": "own", "section": "101年"}, {"id": 382, "question": "第 12 題　The chairperson of the meeting asked everyone to speak up instead of ______ their opinions among themselves.", "options": ["reciting", "giggling", "murmuring", "whistling"], "answer": 2, "answerLabel": "C", "source": "101 學測｜詞彙｜第 12 題", "explanation": "主席要大家大聲說，而不是私下「低聲議論」：murmuring。recite 背誦、giggle 傻笑、whistle 吹口哨。", "explanationSource": "own", "section": "101年"}, {"id": 383, "question": "第 13 題　Although Mr. Chen is rich, he is a very ______ person and is never willing to spend any money to help those who are in need.", "options": ["absolute", "precise", "economic", "stingy"], "answer": 3, "answerLabel": "D", "source": "101 學測｜詞彙｜第 13 題", "explanation": "有錢卻從不願花錢幫助需要的人，很「小氣」：stingy。absolute 絕對的、precise 精確的、economic 經濟的。", "explanationSource": "own", "section": "101年"}, {"id": 384, "question": "第 14 題　If you want to know what your dreams mean, now there are websites you can visit to help you ______ them.", "options": ["overcome", "interpret", "transfer", "revise"], "answer": 1, "answerLabel": "B", "source": "101 學測｜詞彙｜第 14 題", "explanation": "網站可幫你「解讀」夢的意義：interpret。overcome 克服、transfer 轉移、revise 修訂。", "explanationSource": "own", "section": "101年"}, {"id": 385, "question": "第 15 題　The memory ______ of the new computer has been increased so that more information can be stored.", "options": ["capacity", "occupation", "attachment", "machinery"], "answer": 0, "answerLabel": "A", "source": "101 學測｜詞彙｜第 15 題", "explanation": "記憶「容量」增加以儲存更多資料：memory capacity。occupation 職業、attachment 附件、machinery 機械。", "explanationSource": "own", "section": "101年"}, {"id": 386, "question": "【綜合測驗 第 16–20 題】\n@@101-16–20@@\n\n▶ 第 16 題　請選出 __16__ 的最佳答案", "options": ["affairs", "fashions", "industries", "attractions"], "answer": 3, "answerLabel": "D", "source": "101 學測｜綜合測驗｜第 16 題", "explanation": "基日島是俄羅斯最熱門的觀光「景點」之一：tourist attractions。affair 事務、fashion 時尚、industry 產業。", "explanationSource": "own", "section": "101年"}, {"id": 387, "question": "【綜合測驗 第 16–20 題】\n@@101-16–20@@\n\n▶ 第 17 題　請選出 __17__ 的最佳答案", "options": ["them", "that", "those", "which"], "answer": 3, "answerLabel": "D", "source": "101 學測｜綜合測驗｜第 17 題", "explanation": "some of which are just rocks：介系詞 + which 引導形容詞子句，代替前面的 5,000 other islands。", "explanationSource": "own", "section": "101年"}, {"id": 388, "question": "【綜合測驗 第 16–20 題】\n@@101-16–20@@\n\n▶ 第 18 題　請選出 __18__ 的最佳答案", "options": ["in fact", "once again", "as usual", "for instance"], "answer": 0, "answerLabel": "A", "source": "101 學測｜綜合測驗｜第 18 題", "explanation": "整座島「事實上」就是一座戶外木造建築博物館：in fact。once again 再一次、as usual 照常、for instance 例如。", "explanationSource": "own", "section": "101年"}, {"id": 389, "question": "【綜合測驗 第 16–20 題】\n@@101-16–20@@\n\n▶ 第 19 題　請選出 __19__ 的最佳答案", "options": ["except", "besides", "including", "regarding"], "answer": 2, "answerLabel": "C", "source": "101 學測｜綜合測驗｜第 19 題", "explanation": "許多木造建築，「包括」風車、船屋、小教堂等：including。except 除了…之外（不包含）、besides 除此之外、regarding 關於。", "explanationSource": "own", "section": "101年"}, {"id": 390, "question": "【綜合測驗 第 16–20 題】\n@@101-16–20@@\n\n▶ 第 20 題　請選出 __20__ 的最佳答案", "options": ["make", "making", "made", "to make"], "answer": 1, "answerLabel": "B", "source": "101 學測｜綜合測驗｜第 20 題", "explanation": "…, making it one of the tallest log structures：分詞構句表結果，用 making。", "explanationSource": "own", "section": "101年"}, {"id": 391, "question": "【綜合測驗 第 21–25 題】\n@@101-21–25@@\n\n▶ 第 21 題　請選出 __21__ 的最佳答案", "options": ["yet", "even", "never", "rather"], "answer": 1, "answerLabel": "B", "source": "101 學測｜綜合測驗｜第 21 題", "explanation": "人類把神性視為理所當然，「甚至」濫用它：even。yet 然而、never 從不、rather 寧願。", "explanationSource": "own", "section": "101年"}, {"id": 392, "question": "【綜合測驗 第 21–25 題】\n@@101-21–25@@\n\n▶ 第 22 題　請選出 __22__ 的最佳答案", "options": ["though", "because", "where", "when"], "answer": 2, "answerLabel": "C", "source": "101 學測｜綜合測驗｜第 22 題", "explanation": "把神性藏在「一個找不到的地方」：hide it where it could never be found，where 引導地方副詞子句。", "explanationSource": "own", "section": "101年"}, {"id": 393, "question": "【綜合測驗 第 21–25 題】\n@@101-21–25@@\n\n▶ 第 23 題　請選出 __23__ 的最佳答案", "options": ["close", "apart", "deep", "hard"], "answer": 2, "answerLabel": "C", "source": "101 學測｜綜合測驗｜第 23 題", "explanation": "眾神建議藏在地底「深處」或最高山頂：deep in the earth。close 近、apart 分開、hard 硬。", "explanationSource": "own", "section": "101年"}, {"id": 394, "question": "【綜合測驗 第 21–25 題】\n@@101-21–25@@\n\n▶ 第 24 題　請選出 __24__ 的最佳答案", "options": ["each", "more", "any", "neither"], "answer": 3, "answerLabel": "D", "source": "101 學測｜綜合測驗｜第 24 題", "explanation": "Brahma 認為這「兩個方法都不」行，因為人類會挖地、也會爬山：neither。", "explanationSource": "own", "section": "101年"}, {"id": 395, "question": "【綜合測驗 第 21–25 題】\n@@101-21–25@@\n\n▶ 第 25 題　請選出 __25__ 的最佳答案", "options": ["look for", "get over", "do without", "bump into"], "answer": 0, "answerLabel": "A", "source": "101 學測｜綜合測驗｜第 25 題", "explanation": "藏在人類內心深處，人類絕不會想到要「在那裡尋找」：look for。get over 克服、do without 沒有…也行、bump into 撞見。", "explanationSource": "own", "section": "101年"}, {"id": 396, "question": "【綜合測驗 第 26–30 題】\n@@101-26–30@@\n\n▶ 第 26 題　請選出 __26__ 的最佳答案", "options": ["skip over", "come across", "look into", "break down"], "answer": 3, "answerLabel": "D", "source": "101 學測｜綜合測驗｜第 26 題", "explanation": "促進世界和平，「打破」各民族之間的隔閡：break down barriers。skip over 略過、come across 偶遇、look into 調查。", "explanationSource": "own", "section": "101年"}, {"id": 397, "question": "【綜合測驗 第 26–30 題】\n@@101-26–30@@\n\n▶ 第 27 題　請選出 __27__ 的最佳答案", "options": ["is", "has been", "was", "had been"], "answer": 1, "answerLabel": "B", "source": "101 學測｜綜合測驗｜第 27 題", "explanation": "Since then（自那時以來）… has been observed：現在完成式表從過去持續至今。", "explanationSource": "own", "section": "101年"}, {"id": 398, "question": "【綜合測驗 第 26–30 題】\n@@101-26–30@@\n\n▶ 第 28 題　請選出 __28__ 的最佳答案", "options": ["quicker", "sooner", "easier", "better"], "answer": 2, "answerLabel": "C", "source": "101 學測｜綜合測驗｜第 28 題", "explanation": "Taking part couldn’t be easier 參加「再簡單不過了」：後句說只要向 10 個人說 hello。", "explanationSource": "own", "section": "101年"}, {"id": 399, "question": "【綜合測驗 第 26–30 題】\n@@101-26–30@@\n\n▶ 第 29 題　請選出 __29__ 的最佳答案", "options": ["aim", "tone", "key", "peak"], "answer": 0, "answerLabel": "A", "source": "101 學測｜綜合測驗｜第 29 題", "explanation": "呼應這個活動的「目標」（促進和平），和平不必只限一天：aim。tone 語氣、key 關鍵、peak 高峰。", "explanationSource": "own", "section": "101年"}, {"id": 400, "question": "【綜合測驗 第 26–30 題】\n@@101-26–30@@\n\n▶ 第 30 題　請選出 __30__ 的最佳答案", "options": ["push", "keep", "bring", "make"], "answer": 1, "answerLabel": "B", "source": "101 學測｜綜合測驗｜第 30 題", "explanation": "keep the spirit going 讓這股精神「持續下去」：keep + O + V-ing。", "explanationSource": "own", "section": "101年"}, {"id": 401, "question": "第 1 題　All the new students were given one minute to ______ introduce themselves to the whole class.", "options": ["briefly", "famously", "gradually", "obviously"], "answer": 0, "answerLabel": "A", "source": "100 學測｜詞彙｜第 1 題", "explanation": "只有一分鐘，所以是「簡短地」自我介紹：briefly。famously 著名地、gradually 逐漸地、obviously 明顯地。", "explanationSource": "own", "section": "100年"}, {"id": 402, "question": "第 2 題　His dark brown jacket had holes in the elbows and had ______ to light brown, but he continued to wear it.", "options": ["cycled", "faded", "loosened", "divided"], "answer": 1, "answerLabel": "B", "source": "100 學測｜詞彙｜第 2 題", "explanation": "深棕色夾克「褪色」成淺棕色：faded。cycle 循環、loosen 鬆開、divide 分開。", "explanationSource": "own", "section": "100年"}, {"id": 403, "question": "第 3 題　Everyone in our company enjoys working with Jason. He’s got all the qualities that make a ______ partner.", "options": ["desirable", "comfortable", "frequent", "hostile"], "answer": 0, "answerLabel": "A", "source": "100 學測｜詞彙｜第 3 題", "explanation": "大家都喜歡和 Jason 合作，他具備「理想」夥伴的所有特質：desirable 令人想要的。comfortable 舒適的、frequent 頻繁的、hostile 有敵意的。", "explanationSource": "own", "section": "100年"}, {"id": 404, "question": "第 4 題　Eyes are sensitive to light. Looking at the sun ______ could damage our eyes.", "options": ["hardly", "specially", "totally", "directly"], "answer": 3, "answerLabel": "D", "source": "100 學測｜詞彙｜第 4 題", "explanation": "「直視」太陽會傷害眼睛：directly。hardly 幾乎不、specially 特別地、totally 完全地。", "explanationSource": "own", "section": "100年"}, {"id": 405, "question": "第 5 題　We were forced to ______ our plan for the weekend picnic because of the bad weather.", "options": ["maintain", "record", "propose", "cancel"], "answer": 3, "answerLabel": "D", "source": "100 學測｜詞彙｜第 5 題", "explanation": "天氣不好被迫「取消」野餐計畫：cancel。maintain 維持、record 記錄、propose 提議。", "explanationSource": "own", "section": "100年"}, {"id": 406, "question": "第 6 題　Three people are running for mayor. All three ______ seem confident that they will be elected, but we won’t know until the outcome of the election is announced.", "options": ["particles", "receivers", "candidates", "containers"], "answer": 2, "answerLabel": "C", "source": "100 學測｜詞彙｜第 6 題", "explanation": "三個人競選市長，三位「候選人」都有信心：candidates。particle 粒子、receiver 接收者、container 容器。", "explanationSource": "own", "section": "100年"}, {"id": 407, "question": "第 7 題　If you ______ a traffic law, such as drinking and driving, you may not drive for some time.", "options": ["destroy", "violate", "attack", "invade"], "answer": 1, "answerLabel": "B", "source": "100 學測｜詞彙｜第 7 題", "explanation": "「違反」交通法規會被禁止開車一段時間：violate a law。destroy 破壞、attack 攻擊、invade 入侵。", "explanationSource": "own", "section": "100年"}, {"id": 408, "question": "第 8 題　Applying to college means sending in applications, writing study plans, and so on. It’s a long ______, and it makes students nervous.", "options": ["errand", "operation", "process", "display"], "answer": 2, "answerLabel": "C", "source": "100 學測｜詞彙｜第 8 題", "explanation": "寄申請、寫讀書計畫等一連串步驟，是漫長的「過程」：process。errand 差事、operation 手術/操作、display 展示。", "explanationSource": "own", "section": "100年"}, {"id": 409, "question": "第 9 題　Dr. Chu’s speech on the new energy source attracted great ______ from the audience at the conference.", "options": ["attention", "fortune", "solution", "influence"], "answer": 0, "answerLabel": "A", "source": "100 學測｜詞彙｜第 9 題", "explanation": "演講吸引聽眾極大的「注意」：attract attention。fortune 財富、solution 解答、influence 影響。", "explanationSource": "own", "section": "100年"}, {"id": 410, "question": "第 10 題　Everyone in the office must attend the meeting tomorrow. There are no ______ allowed.", "options": ["exceptions", "additions", "divisions", "measures"], "answer": 0, "answerLabel": "A", "source": "100 學測｜詞彙｜第 10 題", "explanation": "每個人都必須出席，不允許任何「例外」：exceptions。addition 增加、division 分割、measure 措施。", "explanationSource": "own", "section": "100年"}, {"id": 411, "question": "第 11 題　To make fresh lemonade, cut the lemon in half, ______ the juice into a bowl, and then add as much water and sugar as you like.", "options": ["decrease", "squeeze", "freeze", "cease"], "answer": 1, "answerLabel": "B", "source": "100 學測｜詞彙｜第 11 題", "explanation": "把檸檬切半，「擠」汁到碗裡：squeeze。decrease 減少、freeze 冷凍、cease 停止。", "explanationSource": "own", "section": "100年"}, {"id": 412, "question": "第 12 題　Buddhism is the ______ religion in Thailand, with 90% of the total population identified as Buddhists.", "options": ["racial", "competitive", "modest", "dominant"], "answer": 3, "answerLabel": "D", "source": "100 學測｜詞彙｜第 12 題", "explanation": "90% 人口是佛教徒，佛教是泰國「主要的」宗教：dominant 占優勢的。racial 種族的、competitive 競爭的、modest 謙虛的。", "explanationSource": "own", "section": "100年"}, {"id": 413, "question": "第 13 題　When I open a book, I look first at the table of ______ to get a general idea of the book and to see which chapters I might be interested in reading.", "options": ["contracts", "contents", "contests", "contacts"], "answer": 1, "answerLabel": "B", "source": "100 學測｜詞彙｜第 13 題", "explanation": "翻開書先看「目錄」了解大概內容：table of contents。contract 合約、contest 比賽、contact 聯絡。", "explanationSource": "own", "section": "100年"}, {"id": 414, "question": "第 14 題　The children were so ______ to see the clown appear on stage that they laughed, screamed, and clapped their hands happily.", "options": ["admirable", "fearful", "delighted", "intense"], "answer": 2, "answerLabel": "C", "source": "100 學測｜詞彙｜第 14 題", "explanation": "孩子看到小丑又笑又叫又拍手，非常「高興」：delighted。admirable 令人欽佩的、fearful 害怕的、intense 強烈的。", "explanationSource": "own", "section": "100年"}, {"id": 415, "question": "第 15 題　Typhoon Maggie brought to I-lan County a huge amount of rainfall, much greater than the ______ rainfall of the season in the area.", "options": ["average", "considerate", "promising", "enjoyable"], "answer": 0, "answerLabel": "A", "source": "100 學測｜詞彙｜第 15 題", "explanation": "雨量遠超過該季節的「平均」雨量：average。considerate 體貼的、promising 有前景的、enjoyable 愉快的。", "explanationSource": "own", "section": "100年"}, {"id": 416, "question": "【綜合測驗 第 16–20 題】\n@@100-16–20@@\n\n▶ 第 16 題　請選出 __16__ 的最佳答案", "options": ["for", "by", "after", "into"], "answer": 2, "answerLabel": "C", "source": "100 學測｜綜合測驗｜第 16 題", "explanation": "古埃及人深信「死後」的生命：life after death。", "explanationSource": "own", "section": "100年"}, {"id": 417, "question": "【綜合測驗 第 16–20 題】\n@@100-16–20@@\n\n▶ 第 17 題　請選出 __17__ 的最佳答案", "options": ["went through", "made up", "changed into", "turned out"], "answer": 0, "answerLabel": "A", "source": "100 學測｜綜合測驗｜第 17 題", "explanation": "靈魂在冥界要「經歷」一連串審判：went through 經歷。make up 組成、change into 變成、turn out 結果是。", "explanationSource": "own", "section": "100年"}, {"id": 418, "question": "【綜合測驗 第 16–20 題】\n@@100-16–20@@\n\n▶ 第 18 題　請選出 __18__ 的最佳答案", "options": ["remain", "remind", "repair", "replace"], "answer": 0, "answerLabel": "A", "source": "100 學測｜綜合測驗｜第 18 題", "explanation": "為了讓靈魂順利旅行，身體必須「保持」完好無損：remain unharmed（remain + 形容詞）。", "explanationSource": "own", "section": "100年"}, {"id": 419, "question": "【綜合測驗 第 16–20 題】\n@@100-16–20@@\n\n▶ 第 19 題　請選出 __19__ 的最佳答案", "options": ["wrapped", "wrapping", "to wrap", "being wrapped"], "answer": 1, "answerLabel": "B", "source": "100 學測｜綜合測驗｜第 19 題", "explanation": "by drying it out, oiling and then wrapping the body：與 drying、oiling 並列，用 V-ing。", "explanationSource": "own", "section": "100年"}, {"id": 420, "question": "【綜合測驗 第 16–20 題】\n@@100-16–20@@\n\n▶ 第 20 題　請選出 __20__ 的最佳答案", "options": ["galleries", "landmarks", "companies", "tombs"], "answer": 3, "answerLabel": "D", "source": "100 學測｜綜合測驗｜第 20 題", "explanation": "金字塔是法老的「墳墓」，裡面放著遺體和珍寶：tombs。gallery 畫廊、landmark 地標、company 公司。", "explanationSource": "own", "section": "100年"}, {"id": 421, "question": "【綜合測驗 第 21–25 題】\n@@100-21–25@@\n\n▶ 第 21 題　請選出 __21__ 的最佳答案", "options": ["is given", "was given", "has given", "had given"], "answer": 1, "answerLabel": "B", "source": "100 學測｜綜合測驗｜第 21 題", "explanation": "1999 年首演時「得到」熱烈歡迎：過去的被動，was given。", "explanationSource": "own", "section": "100年"}, {"id": 422, "question": "【綜合測驗 第 21–25 題】\n@@100-21–25@@\n\n▶ 第 22 題　請選出 __22__ 的最佳答案", "options": ["worthy", "global", "sticky", "physical"], "answer": 1, "answerLabel": "B", "source": "100 學測｜綜合測驗｜第 22 題", "explanation": "全球超過三千萬人喜愛，是「全球性的」娛樂現象：global。worthy 值得的、sticky 黏的、physical 身體的。", "explanationSource": "own", "section": "100年"}, {"id": 423, "question": "【綜合測驗 第 21–25 題】\n@@100-21–25@@\n\n▶ 第 23 題　請選出 __23__ 的最佳答案", "options": ["one", "thing", "other", "else"], "answer": 2, "answerLabel": "C", "source": "100 學測｜綜合測驗｜第 23 題", "explanation": "製作版本比「其他任何」音樂劇都多：any other + 單數名詞。", "explanationSource": "own", "section": "100年"}, {"id": 424, "question": "【綜合測驗 第 21–25 題】\n@@100-21–25@@\n\n▶ 第 24 題　請選出 __24__ 的最佳答案", "options": ["how", "what", "where", "that"], "answer": 3, "answerLabel": "D", "source": "100 學測｜綜合測驗｜第 24 題", "explanation": "a fresh and vital way that retains …：關係代名詞 that 修飾 way，引導形容詞子句。", "explanationSource": "own", "section": "100年"}, {"id": 425, "question": "【綜合測驗 第 21–25 題】\n@@100-21–25@@\n\n▶ 第 25 題　請選出 __25__ 的最佳答案", "options": ["appealed to", "presented with", "resulted in", "brought about"], "answer": 0, "answerLabel": "A", "source": "100 學測｜綜合測驗｜第 25 題", "explanation": "「吸引」了這麼多人，因此也拍成電影：appeal to 吸引。present with 贈與、result in 導致、bring about 引起。", "explanationSource": "own", "section": "100年"}, {"id": 426, "question": "【綜合測驗 第 26–30 題】\n@@100-26–30@@\n\n▶ 第 26 題　請選出 __26__ 的最佳答案", "options": ["the above", "the former", "the following", "the latter"], "answer": 3, "answerLabel": "D", "source": "100 學測｜綜合測驗｜第 26 題", "explanation": "前句提到 water 和 diamonds 兩者，「後者」（鑽石）比較貴：the latter。the former 前者。", "explanationSource": "own", "section": "100年"}, {"id": 427, "question": "【綜合測驗 第 26–30 題】\n@@100-26–30@@\n\n▶ 第 27 題　請選出 __27__ 的最佳答案", "options": ["traded", "weakened", "limited", "noticed"], "answer": 2, "answerLabel": "C", "source": "100 學測｜綜合測驗｜第 27 題", "explanation": "鑽石是稀有資源，供給「有限」：limited in supply。trade 交易、weaken 削弱、notice 注意。", "explanationSource": "own", "section": "100年"}, {"id": 428, "question": "【綜合測驗 第 26–30 題】\n@@100-26–30@@\n\n▶ 第 28 題　請選出 __28__ 的最佳答案", "options": ["term", "termed", "terms", "was termed"], "answer": 1, "answerLabel": "B", "source": "100 學測｜綜合測驗｜第 28 題", "explanation": "…, (which is) termed as conspicuous consumption：分詞片語補充說明，被稱為「炫耀性消費」，用過去分詞 termed。", "explanationSource": "own", "section": "100年"}, {"id": 429, "question": "【綜合測驗 第 26–30 題】\n@@100-26–30@@\n\n▶ 第 29 題　請選出 __29__ 的最佳答案", "options": ["what", "which", "why", "how"], "answer": 0, "answerLabel": "A", "source": "100 學測｜綜合測驗｜第 29 題", "explanation": "the scarcity of goods is what causes humans to attribute value：what 引導名詞子句作補語，「物品的稀少正是使人賦予價值的原因」。", "explanationSource": "own", "section": "100年"}, {"id": 430, "question": "【綜合測驗 第 26–30 題】\n@@100-26–30@@\n\n▶ 第 30 題　請選出 __30__ 的最佳答案", "options": ["be", "being", "to be", "were"], "answer": 3, "answerLabel": "D", "source": "100 學測｜綜合測驗｜第 30 題", "explanation": "If we were surrounded by …, we probably wouldn’t …：與現在事實相反的假設語氣，be 動詞用 were。", "explanationSource": "own", "section": "100年"}, {"id": 431, "question": "第 1 題　Mr. Lin is a very ______ writer; he publishes at least five novels every year.", "options": ["moderate", "temporary", "productive", "reluctant"], "answer": 2, "answerLabel": "C", "source": "99 學測｜詞彙｜第 1 題", "explanation": "每年至少出版五本小說，是非常「多產的」作家：productive。moderate 適度的、temporary 暫時的、reluctant 不情願的。", "explanationSource": "own", "section": "99年"}, {"id": 432, "question": "第 2 題　Using a heating pad or taking warm baths can sometimes help to ______ pain in the lower back.", "options": ["polish", "relieve", "switch", "maintain"], "answer": 1, "answerLabel": "B", "source": "99 學測｜詞彙｜第 2 題", "explanation": "熱敷或泡熱水澡可「緩解」下背疼痛：relieve 減輕。polish 擦亮、switch 切換、maintain 維持。", "explanationSource": "own", "section": "99年"}, {"id": 433, "question": "第 3 題　Peter stayed up late last night, so he drank a lot of coffee this morning to keep himself ______ in class.", "options": ["acceptable", "amazed", "accurate", "awake"], "answer": 3, "answerLabel": "D", "source": "99 學測｜詞彙｜第 3 題", "explanation": "熬夜後喝很多咖啡讓自己在課堂上保持「清醒」：awake。acceptable 可接受的、amazed 驚訝的、accurate 準確的。", "explanationSource": "own", "section": "99年"}, {"id": 434, "question": "第 4 題　Due to ______, prices for daily necessities have gone up and we have to pay more for the same items now.", "options": ["inflation", "solution", "objection", "condition"], "answer": 0, "answerLabel": "A", "source": "99 學測｜詞彙｜第 4 題", "explanation": "物價上漲、同樣東西要付更多錢，原因是「通貨膨脹」：inflation。solution 解決方法、objection 反對、condition 狀況。", "explanationSource": "own", "section": "99年"}, {"id": 435, "question": "第 5 題　The government is doing its best to ______ the cultures of the tribal people for fear that they may soon die out.", "options": ["preserve", "frustrate", "hesitate", "overthrow"], "answer": 0, "answerLabel": "A", "source": "99 學測｜詞彙｜第 5 題", "explanation": "擔心部落文化消失，所以盡力「保存」：preserve。frustrate 使受挫、hesitate 猶豫、overthrow 推翻。", "explanationSource": "own", "section": "99年"}, {"id": 436, "question": "第 6 題　I could not ______ the sweet smell from the bakery, so I walked in and bought a fresh loaf of bread.", "options": ["insist", "resist", "obtain", "contain"], "answer": 1, "answerLabel": "B", "source": "99 學測｜詞彙｜第 6 題", "explanation": "無法「抗拒」麵包店的香味，於是走進去買了麵包：resist。insist 堅持、obtain 獲得、contain 包含。", "explanationSource": "own", "section": "99年"}, {"id": 437, "question": "第 7 題　Steve has several meetings to attend every day; therefore, he has to work on a very ______ schedule.", "options": ["dense", "various", "tight", "current"], "answer": 2, "answerLabel": "C", "source": "99 學測｜詞彙｜第 7 題", "explanation": "每天有好幾個會議，行程非常「緊湊」：a tight schedule（固定搭配）。dense 密集的、various 各種的、current 目前的。", "explanationSource": "own", "section": "99年"}, {"id": 438, "question": "第 8 題　Michael Phelps, an American swimmer, broke seven world records and won eight gold medals in men’s swimming ______ in the 2008 Olympics.", "options": ["drills", "techniques", "routines", "contests"], "answer": 3, "answerLabel": "D", "source": "99 學測｜詞彙｜第 8 題", "explanation": "在奧運游泳「比賽」中破紀錄、奪金牌：contests 競賽。drill 操練、technique 技巧、routine 例行動作。", "explanationSource": "own", "section": "99年"}, {"id": 439, "question": "第 9 題　Those college students work at the orphanage on a ______ basis, helping the children with their studies without receiving any pay.", "options": ["voluntary", "competitive", "sorrowful", "realistic"], "answer": 0, "answerLabel": "A", "source": "99 學測｜詞彙｜第 9 題", "explanation": "不收任何報酬，表示是「自願」性質：on a voluntary basis。competitive 競爭的、sorrowful 悲傷的、realistic 務實的。", "explanationSource": "own", "section": "99年"}, {"id": 440, "question": "第 10 題　Studies show that asking children to do house ______, such as taking out the trash or doing the dishes, helps them grow into responsible adults.", "options": ["missions", "chores", "approaches", "incidents"], "answer": 1, "answerLabel": "B", "source": "99 學測｜詞彙｜第 10 題", "explanation": "倒垃圾、洗碗等「家事」：house chores / household chores。mission 任務、approach 方法、incident 事件。", "explanationSource": "own", "section": "99年"}, {"id": 441, "question": "第 11 題　John has been scolded by his boss for over ten minutes now. ______, she is not happy about his being late again.", "options": ["Expressively", "Apparently", "Immediately", "Originally"], "answer": 1, "answerLabel": "B", "source": "99 學測｜詞彙｜第 11 題", "explanation": "被老闆罵了十多分鐘，「顯然」老闆對他又遲到很不滿：Apparently。expressively 富表情地、immediately 立刻、originally 最初。", "explanationSource": "own", "section": "99年"}, {"id": 442, "question": "第 12 題　Since the orange trees suffered ______ damage from a storm in the summer, the farmers are expecting a sharp decline in harvests this winter.", "options": ["potential", "relative", "severe", "mutual"], "answer": 2, "answerLabel": "C", "source": "99 學測｜詞彙｜第 12 題", "explanation": "橘子樹受到暴風「嚴重」損害，所以預期收成大減：severe。potential 潛在的、relative 相對的、mutual 相互的。", "explanationSource": "own", "section": "99年"}, {"id": 443, "question": "第 13 題　Typhoon Morakot claimed more than six hundred lives in early August of 2009, making it the most serious natural ______ in Taiwan in recent decades.", "options": ["disaster", "barrier", "anxiety", "collapse"], "answer": 0, "answerLabel": "A", "source": "99 學測｜詞彙｜第 13 題", "explanation": "莫拉克颱風奪走六百多人性命，是近幾十年最嚴重的天然「災害」：disaster。barrier 障礙、anxiety 焦慮、collapse 崩塌。", "explanationSource": "own", "section": "99年"}, {"id": 444, "question": "第 14 題　Robert was the only ______ to the car accident. The police had to count on him to find out exactly how the accident happened.", "options": ["dealer", "guide", "witness", "client"], "answer": 2, "answerLabel": "C", "source": "99 學測｜詞彙｜第 14 題", "explanation": "警方得靠他才能知道車禍經過，表示他是唯一的「目擊者」：witness。dealer 商人、guide 導遊、client 客戶。", "explanationSource": "own", "section": "99年"}, {"id": 445, "question": "第 15 題　Badly injured in the car accident, Jason could ______ move his legs and was sent to the hospital right away.", "options": ["accordingly", "undoubtedly", "handily", "scarcely"], "answer": 3, "answerLabel": "D", "source": "99 學測｜詞彙｜第 15 題", "explanation": "重傷之下「幾乎無法」移動雙腿：scarcely 幾乎不。accordingly 因此、undoubtedly 無疑地、handily 輕易地。", "explanationSource": "own", "section": "99年"}, {"id": 446, "question": "【綜合測驗 第 16–20 題】\n@@99-16–20@@\n\n▶ 第 16 題　請選出 __16__ 的最佳答案", "options": ["gave up", "ended up", "took to", "used to"], "answer": 1, "answerLabel": "B", "source": "99 學測｜綜合測驗｜第 16 題", "explanation": "母女兩人「最後」買了同一件牛仔褲：end up + V-ing 最終（做了…）。give up 放棄、take to 開始喜歡、used to 過去習慣。", "explanationSource": "own", "section": "99年"}, {"id": 447, "question": "【綜合測驗 第 16–20 題】\n@@99-16–20@@\n\n▶ 第 17 題　請選出 __17__ 的最佳答案", "options": ["informed", "informative", "informal", "informational"], "answer": 0, "answerLabel": "A", "source": "99 學測｜綜合測驗｜第 17 題", "explanation": "二十出頭的年輕人是「消息靈通的」消費者，沒有不知道的品牌或潮流：informed 見多識廣的。informative 提供資訊的、informal 非正式的。", "explanationSource": "own", "section": "99年"}, {"id": 448, "question": "【綜合測驗 第 16–20 題】\n@@99-16–20@@\n\n▶ 第 18 題　請選出 __18__ 的最佳答案", "options": ["deal with", "head for", "turn to", "look into"], "answer": 2, "answerLabel": "C", "source": "99 學測｜綜合測驗｜第 18 題", "explanation": "想跟上潮流的母親通常「求助於」專家——她們的女兒：turn to 求助。deal with 處理、head for 前往、look into 調查。", "explanationSource": "own", "section": "99年"}, {"id": 449, "question": "【綜合測驗 第 16–20 題】\n@@99-16–20@@\n\n▶ 第 19 題　請選出 __19__ 的最佳答案", "options": ["textbook", "notebook", "workbook", "pocketbook"], "answer": 3, "answerLabel": "D", "source": "99 學測｜綜合測驗｜第 19 題", "explanation": "要讓母親掏錢（進入她的「錢包」），得先贏得女兒的心：pocketbook 錢包、皮夾。", "explanationSource": "own", "section": "99年"}, {"id": 450, "question": "【綜合測驗 第 16–20 題】\n@@99-16–20@@\n\n▶ 第 20 題　請選出 __20__ 的最佳答案", "options": ["in", "while", "after", "without"], "answer": 3, "answerLabel": "D", "source": "99 學測｜綜合測驗｜第 20 題", "explanation": "百貨公司成功吸引中年婦女，「同時沒有」失去年輕顧客：without losing。", "explanationSource": "own", "section": "99年"}, {"id": 451, "question": "【綜合測驗 第 21–25 題】\n@@99-21–25@@\n\n▶ 第 21 題　請選出 __21__ 的最佳答案", "options": ["from", "for", "in", "of"], "answer": 2, "answerLabel": "C", "source": "99 學測｜綜合測驗｜第 21 題", "explanation": "available in yellow, red and white：有黃、紅、白等顏色可選，顏色用介系詞 in。", "explanationSource": "own", "section": "99年"}, {"id": 452, "question": "【綜合測驗 第 21–25 題】\n@@99-21–25@@\n\n▶ 第 22 題　請選出 __22__ 的最佳答案", "options": ["grown", "tasted", "identified", "emphasized"], "answer": 2, "answerLabel": "C", "source": "99 學測｜綜合測驗｜第 22 題", "explanation": "可藉由薄而淺色的外皮「辨認」：be identified by。grow 種植、taste 嚐、emphasize 強調。", "explanationSource": "own", "section": "99年"}, {"id": 453, "question": "【綜合測驗 第 21–25 題】\n@@99-21–25@@\n\n▶ 第 23 題　請選出 __23__ 的最佳答案", "options": ["such", "much", "that", "it"], "answer": 3, "answerLabel": "D", "source": "99 學測｜綜合測驗｜第 23 題", "explanation": "make it easier for them to bruise：it 為虛受詞，代替後面的不定詞片語。", "explanationSource": "own", "section": "99年"}, {"id": 454, "question": "【綜合測驗 第 21–25 題】\n@@99-21–25@@\n\n▶ 第 24 題　請選出 __24__ 的最佳答案", "options": ["Unlike", "Through", "Besides", "Despite"], "answer": 0, "answerLabel": "A", "source": "99 學測｜綜合測驗｜第 24 題", "explanation": "「不同於」新鮮洋蔥，儲藏洋蔥有多層厚而深色的外皮：Unlike。through 透過、besides 除了、despite 儘管。", "explanationSource": "own", "section": "99年"}, {"id": 455, "question": "【綜合測驗 第 21–25 題】\n@@99-21–25@@\n\n▶ 第 25 題　請選出 __25__ 的最佳答案", "options": ["anxious", "intense", "organic", "effective"], "answer": 1, "answerLabel": "B", "source": "99 學測｜綜合測驗｜第 25 題", "explanation": "儲藏洋蔥風味更「濃烈」，適合需要更多味道的辛辣菜餚：intense。anxious 焦慮的、organic 有機的、effective 有效的。", "explanationSource": "own", "section": "99年"}, {"id": 456, "question": "【綜合測驗 第 26–30 題】\n@@99-26–30@@\n\n▶ 第 26 題　請選出 __26__ 的最佳答案", "options": ["frightening", "threatening", "appealing", "promoting"], "answer": 1, "answerLabel": "B", "source": "99 學測｜綜合測驗｜第 26 題", "explanation": "塑膠瓶可能釋放有害化學物質，因此瓶裝水可能「威脅」健康：health threatening。frightening 可怕的、appealing 吸引人的。", "explanationSource": "own", "section": "99年"}, {"id": 457, "question": "【綜合測驗 第 26–30 題】\n@@99-26–30@@\n\n▶ 第 27 題　請選出 __27__ 的最佳答案", "options": ["cause", "causing", "caused", "to cause"], "answer": 0, "answerLabel": "A", "source": "99 學測｜綜合測驗｜第 27 題", "explanation": "The chemicals can be absorbed … and cause …：與 be absorbed 並列的動詞，省略助動詞 can 後用原形 cause。", "explanationSource": "own", "section": "99年"}, {"id": 458, "question": "【綜合測驗 第 26–30 題】\n@@99-26–30@@\n\n▶ 第 28 題　請選出 __28__ 的最佳答案", "options": ["Although", "Despite", "Since", "So"], "answer": 2, "answerLabel": "C", "source": "99 學測｜綜合測驗｜第 28 題", "explanation": "「由於」消費者不易取得儲存與運送資訊，瓶裝水未必是更好的選擇：Since 因為。", "explanationSource": "own", "section": "99年"}, {"id": 459, "question": "【綜合測驗 第 26–30 題】\n@@99-26–30@@\n\n▶ 第 29 題　請選出 __29__ 的最佳答案", "options": ["display", "production", "shipment", "safety"], "answer": 3, "answerLabel": "D", "source": "99 學測｜綜合測驗｜第 29 題", "explanation": "前面兩段都在談健康風險，所以是「安全」問題：safety issues。display 展示、production 生產、shipment 運送。", "explanationSource": "own", "section": "99年"}, {"id": 460, "question": "【綜合測驗 第 26–30 題】\n@@99-26–30@@\n\n▶ 第 30 題　請選出 __30__ 的最佳答案", "options": ["waste", "resource", "ground", "profit"], "answer": 0, "answerLabel": "A", "source": "99 學測｜綜合測驗｜第 30 題", "explanation": "90% 的瓶子未回收、長年堆在垃圾場，表示產生大量固體「廢棄物」：solid waste。resource 資源、profit 利潤。", "explanationSource": "own", "section": "99年"}, {"id": 461, "question": "第 1 題　Steve’s description of the place was so ______ that I could almost picture it in my mind.", "options": ["bitter", "vivid",
