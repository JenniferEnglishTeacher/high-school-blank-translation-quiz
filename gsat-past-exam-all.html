 "flexible", "clumsy", "brutal"], "answer": 0, "answerLabel": "A", "source": "98 學測｜詞彙｜第 6 題", "explanation": "不必擔心被騙，表示消息來源「可靠」：reliable。flexible 有彈性的、clumsy 笨拙的、brutal 殘暴的。", "explanationSource": "own", "section": "98年"}, {"id": 467, "question": "第 7 題　We hope that there will be no war in the world and that all people live in peace and ______ with each other.", "options": ["complaint", "harmony", "mission", "texture"], "answer": 1, "answerLabel": "B", "source": "98 學測｜詞彙｜第 7 題", "explanation": "live in peace and harmony 和平和諧地共處：harmony 和諧。complaint 抱怨、mission 任務、texture 質地。", "explanationSource": "own", "section": "98年"}, {"id": 468, "question": "第 8 題　To have a full discussion of the issue, the committee spent a whole hour ______ their ideas at the meeting.", "options": ["depositing", "exchanging", "governing", "interrupting"], "answer": 1, "answerLabel": "B", "source": "98 學測｜詞彙｜第 8 題", "explanation": "為了充分討論，花一小時「交換」意見：exchanging ideas。deposit 存放、govern 統治、interrupt 打斷。", "explanationSource": "own", "section": "98年"}, {"id": 469, "question": "第 9 題　While adapting to western ways of living, many Asian immigrants in the US still try hard to ______ their own cultures and traditions.", "options": ["volunteer", "scatter", "preserve", "motivate"], "answer": 2, "answerLabel": "C", "source": "98 學測｜詞彙｜第 9 題", "explanation": "適應西方生活的同時仍努力「保存」自己的文化：preserve。volunteer 自願、scatter 散播、motivate 激勵。", "explanationSource": "own", "section": "98年"}, {"id": 470, "question": "第 10 題　With the worsening of global economic conditions, it seems wiser and more ______ to keep cash in the bank rather than to invest in the stock market.", "options": ["sensible", "portable", "explicit", "anxious"], "answer": 0, "answerLabel": "A", "source": "98 學測｜詞彙｜第 10 題", "explanation": "經濟惡化時，把錢存銀行比投資股市更「明智」：sensible 明智的。portable 可攜帶的、explicit 明確的、anxious 焦慮的。", "explanationSource": "own", "section": "98年"}, {"id": 471, "question": "第 11 題　Under the ______ of newly elected president Barack Obama, the US is expected to turn a new page in politics and economy.", "options": ["adoption", "fragrance", "identity", "leadership"], "answer": 3, "answerLabel": "D", "source": "98 學測｜詞彙｜第 11 題", "explanation": "在新總統的「領導」下，美國將開啟新頁：leadership。adoption 採用、fragrance 香氣、identity 身分。", "explanationSource": "own", "section": "98年"}, {"id": 472, "question": "第 12 題　Rapid advancement in motor engineering makes it ______ possible to build a flying car in the near future.", "options": ["individually", "narrowly", "punctually", "technically"], "answer": 3, "answerLabel": "D", "source": "98 學測｜詞彙｜第 12 題", "explanation": "引擎技術進步，使製造飛行汽車在「技術上」可行：technically。individually 個別地、narrowly 勉強地、punctually 準時地。", "explanationSource": "own", "section": "98年"}, {"id": 473, "question": "第 13 題　When you take photos, you can move around to shoot the target object from different ______.", "options": ["moods", "trends", "angles", "inputs"], "answer": 2, "answerLabel": "C", "source": "98 學測｜詞彙｜第 13 題", "explanation": "拍照時可移動以從不同「角度」拍攝：angles。mood 心情、trend 趨勢、input 輸入。", "explanationSource": "own", "section": "98年"}, {"id": 474, "question": "第 14 題　Students were asked to ______ or rewrite their compositions based on the teacher’s comments.", "options": ["revise", "resign", "refresh", "remind"], "answer": 0, "answerLabel": "A", "source": "98 學測｜詞彙｜第 14 題", "explanation": "依老師評語「修改」或重寫作文：revise 修訂。resign 辭職、refresh 使恢復、remind 提醒。", "explanationSource": "own", "section": "98年"}, {"id": 475, "question": "第 15 題　Besides lung cancer, another ______ of smoking is wrinkles, a premature sign of aging.", "options": ["blessing", "campaign", "consequence", "breakthrough"], "answer": 2, "answerLabel": "C", "source": "98 學測｜詞彙｜第 15 題", "explanation": "除了肺癌，吸菸的另一個「後果」是皺紋：consequence。blessing 福氣、campaign 活動、breakthrough 突破。", "explanationSource": "own", "section": "98年"}, {"id": 476, "question": "【綜合測驗 第 16–20 題】\n@@98-16–20@@\n\n▶ 第 16 題　請選出 __16__ 的最佳答案", "options": ["marked", "tore", "served", "took"], "answer": 0, "answerLabel": "A", "source": "98 學測｜綜合測驗｜第 16 題", "explanation": "用小紙片在聖歌本上「標記」頁面：marked。後文說紙片總是掉出來，呼應書籤功能。", "explanationSource": "own", "section": "98年"}, {"id": 477, "question": "【綜合測驗 第 16–20 題】\n@@98-16–20@@\n\n▶ 第 17 題　請選出 __17__ 的最佳答案", "options": ["threw at", "occurred to", "looked down upon", "came up with"], "answer": 1, "answerLabel": "B", "source": "98 學測｜綜合測驗｜第 17 題", "explanation": "an idea occurred to sb. 某人想到一個點子（主詞是 idea）。come up with 的主詞須是人。", "explanationSource": "own", "section": "98年"}, {"id": 478, "question": "【綜合測驗 第 16–20 題】\n@@98-16–20@@\n\n▶ 第 18 題　請選出 __18__ 的最佳答案", "options": ["is", "was", "will be", "has been"], "answer": 1, "answerLabel": "B", "source": "98 學測｜綜合測驗｜第 18 題", "explanation": "everyone thought (that the glue) was a failure：過去式一致，用 was。", "explanationSource": "own", "section": "98年"}, {"id": 479, "question": "【綜合測驗 第 16–20 題】\n@@98-16–20@@\n\n▶ 第 19 題　請選出 __19__ 的最佳答案", "options": ["despite that", "rather than", "as long as", "no matter what"], "answer": 2, "answerLabel": "C", "source": "98 學測｜綜合測驗｜第 19 題", "explanation": "只要你想要，它就會留在原處：as long as 只要。despite that 儘管、rather than 而不是、no matter what 無論什麼。", "explanationSource": "own", "section": "98年"}, {"id": 480, "question": "【綜合測驗 第 16–20 題】\n@@98-16–20@@\n\n▶ 第 20 題　請選出 __20__ 的最佳答案", "options": ["into", "out of", "within", "without"], "answer": 3, "answerLabel": "D", "source": "98 學測｜綜合測驗｜第 20 題", "explanation": "可以移除而「不會」造成損壞：without damage。", "explanationSource": "own", "section": "98年"}, {"id": 481, "question": "【綜合測驗 第 21–25 題】\n@@98-21–25@@\n\n▶ 第 21 題　請選出 __21__ 的最佳答案", "options": ["For example", "In fact", "As a result", "Little by little"], "answer": 1, "answerLabel": "B", "source": "98 學測｜綜合測驗｜第 21 題", "explanation": "前句說鳳梨不是夏威夷原生植物，接著強調事實「其實」1813 年才出現：In fact。", "explanationSource": "own", "section": "98年"}, {"id": 482, "question": "【綜合測驗 第 21–25 題】\n@@98-21–25@@\n\n▶ 第 22 題　請選出 __22__ 的最佳答案", "options": ["nearly", "recently", "originally", "shortly"], "answer": 2, "answerLabel": "C", "source": "98 學測｜綜合測驗｜第 22 題", "explanation": "鳳梨「最初」是在巴拉圭和巴西南部被發現的：originally。nearly 幾乎、recently 最近、shortly 不久。", "explanationSource": "own", "section": "98年"}, {"id": 483, "question": "【綜合測驗 第 21–25 題】\n@@98-21–25@@\n\n▶ 第 23 題　請選出 __23__ 的最佳答案", "options": ["that", "what", "which", "where"], "answer": 3, "answerLabel": "D", "source": "98 學測｜綜合測驗｜第 23 題", "explanation": "先行詞是 the Caribbean region（地方），關係副詞 where 引導形容詞子句：哥倫布在那裡首次發現它。", "explanationSource": "own", "section": "98年"}, {"id": 484, "question": "【綜合測驗 第 21–25 題】\n@@98-21–25@@\n\n▶ 第 24 題　請選出 __24__ 的最佳答案", "options": ["spread", "to spread", "should spread", "will spread"], "answer": 0, "answerLabel": "A", "source": "98 學測｜綜合測驗｜第 24 題", "explanation": "從歐洲開始，鳳梨「傳播」到世界各地：敘述過去事實用過去式 spread（spread 三態同形）。", "explanationSource": "own", "section": "98年"}, {"id": 485, "question": "【綜合測驗 第 21–25 題】\n@@98-21–25@@\n\n▶ 第 25 題　請選出 __25__ 的最佳答案", "options": ["bothered", "contacted", "suffered", "wounded"], "answer": 0, "answerLabel": "A", "source": "98 學測｜綜合測驗｜第 25 題", "explanation": "壞血病經常「困擾」長途航行的水手：bothered。contact 聯絡、suffer 受苦（主詞應為人）、wound 使受傷。", "explanationSource": "own", "section": "98年"}, {"id": 486, "question": "【綜合測驗 第 26–30 題】\n@@98-26–30@@\n\n▶ 第 26 題　請選出 __26__ 的最佳答案", "options": ["for", "with", "as", "on"], "answer": 0, "answerLabel": "A", "source": "98 學測｜綜合測驗｜第 26 題", "explanation": "把不同障礙類別的運動員集合起來「參加」運動競賽：put … together for sports competitions。", "explanationSource": "own", "section": "98年"}, {"id": 487, "question": "【綜合測驗 第 26–30 題】\n@@98-26–30@@\n\n▶ 第 27 題　請選出 __27__ 的最佳答案", "options": ["in terms of", "instead of", "at the risk of", "at the cost of"], "answer": 1, "answerLabel": "B", "source": "98 學測｜綜合測驗｜第 27 題", "explanation": "強調選手的運動成就「而非」他們的身體障礙：instead of 而不是。in terms of 就…而言、at the cost of 以…為代價。", "explanationSource": "own", "section": "98年"}, {"id": 488, "question": "【綜合測驗 第 26–30 題】\n@@98-26–30@@\n\n▶ 第 28 題　請選出 __28__ 的最佳答案", "options": ["participate", "participated", "participating", "to participate"], "answer": 2, "answerLabel": "C", "source": "98 學測｜綜合測驗｜第 28 題", "explanation": "the number of athletes participating in …：現在分詞片語修飾 athletes（主動參加）。", "explanationSource": "own", "section": "98年"}, {"id": 489, "question": "【綜合測驗 第 26–30 題】\n@@98-26–30@@\n\n▶ 第 29 題　請選出 __29__ 的最佳答案", "options": ["taken turns", "taken place", "taken off", "taken over"], "answer": 1, "answerLabel": "B", "source": "98 學測｜綜合測驗｜第 29 題", "explanation": "take place 舉行：帕運也在與奧運相同的城市「舉行」。take turns 輪流、take off 起飛、take over 接管。", "explanationSource": "own", "section": "98年"}, {"id": 490, "question": "【綜合測驗 第 26–30 題】\n@@98-26–30@@\n\n▶ 第 30 題　請選出 __30__ 的最佳答案", "options": ["piece", "deadline", "date", "practice"], "answer": 3, "answerLabel": "D", "source": "98 學測｜綜合測驗｜第 30 題", "explanation": "keep this practice 維持這個「慣例」（在同一城市舉辦）：practice 慣例、做法。", "explanationSource": "own", "section": "98年"}, {"id": 491, "question": "第 1 題　Amy did not ______ changes in the course schedule and therefore missed the class.", "options": ["arrest", "alarm", "notice", "delay"], "answer": 2, "answerLabel": "C", "source": "97 學測｜詞彙｜第 1 題", "explanation": "沒有「注意到」課表更動，因此錯過上課：notice 注意到。arrest 逮捕、alarm 使驚恐、delay 延誤皆不合。", "explanationSource": "own", "section": "97年"}, {"id": 492, "question": "第 2 題　It is not easy for old people to ______ their backs, so they need help when their backs itch.", "options": ["label", "scratch", "lighten", "squeeze"], "answer": 1, "answerLabel": "B", "source": "97 學測｜詞彙｜第 2 題", "explanation": "背癢時需要人幫忙，表示老人不容易「抓」自己的背：scratch 抓、搔。label 貼標籤、lighten 變亮、squeeze 擠壓。", "explanationSource": "own", "section": "97年"}, {"id": 493, "question": "第 3 題　Mary is suffering from a stomachache and needs to eat food which is easy to ______.", "options": ["launch", "invade", "adopt", "digest"], "answer": 3, "answerLabel": "D", "source": "97 學測｜詞彙｜第 3 題", "explanation": "胃痛時要吃容易「消化」的食物：digest 消化。launch 發射、invade 入侵、adopt 採用。", "explanationSource": "own", "section": "97年"}, {"id": 494, "question": "第 4 題　Since our classroom is not air-conditioned, we have to ______ the heat during the hot summer days.", "options": ["consume", "tolerate", "recover", "promote"], "answer": 1, "answerLabel": "B", "source": "97 學測｜詞彙｜第 4 題", "explanation": "教室沒冷氣，只能「忍受」炎熱：tolerate 忍受。consume 消耗、recover 恢復、promote 促進。", "explanationSource": "own", "section": "97年"}, {"id": 495, "question": "第 5 題　Sue is so ______ that she always breaks something when she is shopping at a store.", "options": ["religious", "visual", "clumsy", "intimate"], "answer": 2, "answerLabel": "C", "source": "97 學測｜詞彙｜第 5 題", "explanation": "逛街總是打破東西，表示她很「笨手笨腳」：clumsy。religious 虔誠的、visual 視覺的、intimate 親密的。", "explanationSource": "own", "section": "97年"}, {"id": 496, "question": "第 6 題　Ann enjoyed going to the flower market. She believed that the ______ of flowers refreshed her mind.", "options": ["instance", "dominance", "appliance", "fragrance"], "answer": 3, "answerLabel": "D", "source": "97 學測｜詞彙｜第 6 題", "explanation": "花的「香氣」使她精神一振：fragrance 芳香。instance 例子、dominance 支配、appliance 家電。", "explanationSource": "own", "section": "97年"}, {"id": 497, "question": "第 7 題　The profits of Prince Charles’s organic farm go to ______ to help the poor and the sick.", "options": ["charities", "bulletins", "harvests", "rebels"], "answer": 0, "answerLabel": "A", "source": "97 學測｜詞彙｜第 7 題", "explanation": "有機農場的利潤捐給「慈善機構」幫助窮人和病人：charities。bulletin 公告、harvest 收成、rebel 反叛者。", "explanationSource": "own", "section": "97年"}, {"id": 498, "question": "第 8 題　Jack was given the rare ______ of using the president’s office, which made others quite jealous.", "options": ["mischief", "privilege", "involvement", "occupation"], "answer": 1, "answerLabel": "B", "source": "97 學測｜詞彙｜第 8 題", "explanation": "能使用總裁辦公室是罕見的「特權」，令人嫉妒：privilege。mischief 惡作劇、involvement 參與、occupation 職業。", "explanationSource": "own", "section": "97年"}, {"id": 499, "question": "第 9 題　This new computer is obviously ______ to the old one because it has many new functions.", "options": ["technical", "suitable", "superior", "typical"], "answer": 2, "answerLabel": "C", "source": "97 學測｜詞彙｜第 9 題", "explanation": "新電腦功能多，明顯「優於」舊電腦：be superior to 優於（固定搭配 to）。technical 技術的、suitable 適合的、typical 典型的。", "explanationSource": "own", "section": "97年"}, {"id": 500, "question": "第 10 題　Simon loves his work. To him, work always comes first, and family and friends are ______.", "options": ["secondary", "temporary", "sociable", "capable"], "answer": 0, "answerLabel": "A", "source": "97 學測｜詞彙｜第 10 題", "explanation": "工作永遠第一，家人朋友就是「次要的」：secondary。temporary 暫時的、sociable 善於社交的、capable 有能力的。", "explanationSource": "own", "section": "97年"}, {"id": 501, "question": "第 11 題　Although your plans look good, you have to be ______ and consider what you can actually do.", "options": ["dramatic", "realistic", "stressful", "manageable"], "answer": 1, "answerLabel": "B", "source": "97 學測｜詞彙｜第 11 題", "explanation": "要考慮實際做得到的事，表示要「務實」：realistic 實際的。dramatic 戲劇性的、stressful 有壓力的、manageable 可管理的。", "explanationSource": "own", "section": "97年"}, {"id": 502, "question": "第 12 題　Built under the sea in 1994, the ______ between England and France connects the UK more closely with mainland Europe.", "options": ["waterfall", "temple", "tunnel", "channel"], "answer": 2, "answerLabel": "C", "source": "97 學測｜詞彙｜第 12 題", "explanation": "1994 年建於海底、連接英法兩國的是「隧道」（英法海底隧道）：tunnel。channel 是海峡，非人工建造。", "explanationSource": "own", "section": "97年"}, {"id": 503, "question": "第 13 題　This tour package is very appealing, and that one looks ______ attractive. I don’t know which one to choose.", "options": ["equally", "annually", "merely", "gratefully"], "answer": 0, "answerLabel": "A", "source": "97 學測｜詞彙｜第 13 題", "explanation": "這個行程很吸引人，那個「同樣」吸引人，所以難以抉擇：equally 同樣地。annually 每年、merely 僅僅、gratefully 感激地。", "explanationSource": "own", "section": "97年"}, {"id": 504, "question": "第 14 題　Hseu Fang-yi, a young Taiwanese dancer, recently ______ at Lincoln Center in New York and won a great deal of praise.", "options": ["performed", "pretended", "postponed", "persuaded"], "answer": 0, "answerLabel": "A", "source": "97 學測｜詞彙｜第 14 題", "explanation": "舞者在林肯中心「演出」並獲得好評：performed。pretend 假裝、postpone 延後、persuade 說服。", "explanationSource": "own", "section": "97年"}, {"id": 505, "question": "第 15 題　The police searched the house of the suspect ______. They almost turned the whole house upside down.", "options": ["relatively", "thoroughly", "casually", "permanently"], "answer": 1, "answerLabel": "B", "source": "97 學測｜詞彙｜第 15 題", "explanation": "幾乎把整間房子翻過來，表示搜查得非常「徹底」：thoroughly。relatively 相對地、casually 隨意地、permanently 永久地。", "explanationSource": "own", "section": "97年"}, {"id": 506, "question": "【綜合測驗 第 16–20 題】\n@@97-16–20@@\n\n▶ 第 16 題　請選出 __16__ 的最佳答案", "options": ["would use", "are using", "had used", "have been using"], "answer": 3, "answerLabel": "D", "source": "97 學測｜綜合測驗｜第 16 題", "explanation": "for at least 4,000 years 表示從過去持續到現在，用現在完成進行式 have been using。", "explanationSource": "own", "section": "97年"}, {"id": 507, "question": "【綜合測驗 第 16–20 題】\n@@97-16–20@@\n\n▶ 第 17 題　請選出 __17__ 的最佳答案", "options": ["looks after", "slows down", "takes over", "turns out"], "answer": 1, "answerLabel": "B", "source": "97 學測｜綜合測驗｜第 17 題", "explanation": "綠茶中的化合物會「減緩」癌細胞生長：slow down。look after 照顧、take over 接管、turn out 結果是。", "explanationSource": "own", "section": "97年"}, {"id": 508, "question": "【綜合測驗 第 16–20 題】\n@@97-16–20@@\n\n▶ 第 18 題　請選出 __18__ 的最佳答案", "options": ["for", "from", "at", "inside"], "answer": 0, "answerLabel": "A", "source": "97 學測｜綜合測驗｜第 18 題", "explanation": "be helpful for 對…有幫助：綠茶對感染與免疫功能受損有幫助。", "explanationSource": "own", "section": "97年"}, {"id": 509, "question": "【綜合測驗 第 16–20 題】\n@@97-16–20@@\n\n▶ 第 19 題　請選出 __19__ 的最佳答案", "options": ["weight", "purpose", "difference", "structure"], "answer": 2, "answerLabel": "C", "source": "97 學測｜綜合測驗｜第 19 題", "explanation": "綠茶和紅茶來自同一種植物，兩者的「差別」在於加工方式：difference。", "explanationSource": "own", "section": 516, "question": "【綜合測驗 第 26–30 題】\n@@97-26–30@@\n\n▶ 第 26 題　請選出 __26__ 的最佳答案", "options": ["For", "With", "Upon", "Along"], "answer": 1, "answerLabel": "B", "source": "97 學測｜綜合測驗｜第 26 題", "explanation": "With + 名詞片語表「有著、擁有」：有著六百年幾乎未受破壞的建築，城市保留中世紀風貌。", "explanationSource": "own", "section": "97年"}, {"id": 517, "question": "【綜合測驗 第 26–30 題】\n@@97-26–30@@\n\n▶ 第 27 題　請選出 __27__ 的最佳答案", "options": ["Since", "Before", "Whatever", "Wherever"], "answer": 3, "answerLabel": "D", "source": "97 學測｜綜合測驗｜第 27 題", "explanation": "Wherever you go 無論你走到哪裡，都有各種風格的建築：wherever 引導副詞子句。", "explanationSource": "own", "section": "97年"}, {"id": 518, "question": "【綜合測驗 第 26–30 題】\n@@97-26–30@@\n\n▶ 第 28 題　請選出 __28__ 的最佳答案", "options": ["escaped", "featured", "defended", "inspired"], "answer": 0, "answerLabel": "A", "source": "97 學測｜綜合測驗｜第 28 題", "explanation": "這些建築成功「躲過」戰後重建的破壞而維持原貌：escaped 逃過、免於。feature 以…為特色、defend 防禦、inspire 啟發。", "explanationSource": "own", "section": "97年"}, {"id": 519, "question": "【綜合測驗 第 26–30 題】\n@@97-26–30@@\n\n▶ 第 29 題　請選出 __29__ 的最佳答案", "options": ["ever", "seldom", "nearly", "wholly"], "answer": 1, "answerLabel": "B", "source": "97 學測｜綜合測驗｜第 29 題", "explanation": "鐵幕時期（共產政府統治下）外國人「很少」造訪布拉格：seldom。後句 all that has changed 呼應。", "explanationSource": "own", "section": "97年"}, {"id": 520, "question": "【綜合測驗 第 26–30 題】\n@@97-26–30@@\n\n▶ 第 30 題　請選出 __30__ 的最佳答案", "options": ["afterwards", "therefore", "however", "furthermore"], "answer": 2, "answerLabel": "C", "source": "97 學測｜綜合測驗｜第 30 題", "explanation": "前句說以前很少人來，1990 年代以後一切改變，語氣轉折：however 然而。", "explanationSource": "own", "section": "97年"}]};</script><script>(function(){var P=window.GSAT_PASSAGES||{};window.QUIZ_CONFIG.questions.forEach(function(q){q.question=q.question.replace(/@@([^@]+)@@/g,function(m,k){return P[k]||m});});})();</script><script src="longteng-b1u5-quiz.js?v=20261106-3"></script><script>document.querySelector("#description").textContent="97–115 年共 19 屆：詞彙題 260 題＋綜合測驗 260 題｜可選單一年度／隨機 20 題／全部｜附中
