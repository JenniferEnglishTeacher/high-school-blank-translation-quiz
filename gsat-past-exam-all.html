<script>window.GSAT_PASSAGES={"115-11–15": "From the campfire to the café, people have always gathered together to share the latest news. White rhinoceroses, __11__, do the same thing—only their choice of meeting place is a giant pile of poop.\nA new study indicates that rhinos have a smelly way to __12__. Scientists studying white rhinos in South Africa have found that these animals leave messages in their poop. In particular, they leave their poop in the same place for all the other members in the group to smell—just like humans leaving messages on social media. Furthermore, different rhinos leave different chemicals in their poop, which provide important __13__ about the age, sex, general health, and reproductive conditions of each specific rhino. This is of great significance for the peace and harmony in the group. When all members in a group know what’s going on with each other, it is __14__ that they will fight.\nThe researchers have even made “fake poop” to see how different rhinos would react. They find that dominant males are particularly __15__ the “fake poop” that carries chemicals from females ready to mate. The males sniff it for longer duration and come back to the same spot more frequently, a clear sign that they are gathering information about mating opportunities from the poop.", "115-16–20": "The history of dim sum stretches back to the early days of the Silk Road, an ancient network of trade routes connecting the East and the West. Those who traveled along the routes through China needed places to rest. Teahouses thus sprang up to __16__ the weary travelers, offering them a cup of tea to help them regain energy. But the culinary art of dim sum __17__, for it was considered inappropriate to pair tea with food. Centuries later, the ability of tea to aid in digestion finally became known. Teahouse owners therefore began providing bite-sized snacks as an accompaniment, and the tradition of these Cantonese delicacies was born.\nDim sum is more than jus izziness, nausea, and vomiting.\nMotion sickness occurs when the signals your brain receives from your eyes, ears, and body __17__. Your brain doesn’t know whether you are stationary or moving when these parts send conflicting information: One part of your balance-sensing system detects that your body is moving, but the other parts __18__. Your brain’s confused reaction makes you feel sick. You may experience the discomfort from the motion of cars, boats, or amusement park rides. You may also get sick from playing video games, or looking through a microscope.\nYou can take some __19__ to help avoid the discomfort. If you are traveling, reserve seats where motion is felt the least, such as the front row of a car or forward cars of a train. Looking out into the distance from the vehicle can help __20__. You can also take medicine before your ride to avoid or reduce nausea and vomiting.", "113-11–15": "Mystery shoppers are paid consumers who are hired to shop in stores and collect data. They are sent to a wide variety of service-based businesses, including stores, restaurants, and banks—potentially anywhere customers are served. Sometimes referred to as secret shoppers, mystery shoppers __11__ regular customers to purchase items, eat in restaurants, make inquiries, or return items. They grade and report on the quality of products, customer service, and environment of the stores __12__ they are assigned.\nWhen evaluating a business, mystery shoppers have to follow certain standard procedures to avoid __13__. They are often given a checklist that provides directions on what to observe or look out for to ensure consistency. Sometimes these shoppers collect data about their “normal” observations, such as cleanliness of the store or timeliness of the service. They may also pretend to be __14__ customers, arguing with a salesperson without a good reason. With the data they collect, mystery shoppers can identify areas for __15__ and thereby help enhance the quality of products and services. In this way, these secret shoppers may help a business gain a competitive edge.", "113-16–20": "The modern worker rolls out of bed, groans, and turns off an alarm clock before reluctantly getting up for the day’s work. But how did people get to work on time before alarm clocks were widely used?\nDuring the second Industrial Age, people toiled at unusual hours in mines or factories and often had to get up for work early in the morning. They __16__ alarm clocks because adjustable alarms had been invented by the mid-19th century. But the new device was still relatively expensive and unreliable. British workers thus relied on a human alarm clock known as a “knocker-up.” __17__ sticks or pea shooters, the human alarms would tour the streets, tap on windows, or blast them with dried peas, trying to wake paying customers in time for work.\nWhether they wielded rods or pea shooters, knockers-up became __18__ throughout the United Kingdom. Every morning, these people, often older in age, were seen in big streets and small alleys, waking up their customers professionally. They usually would not leave people’s houses until they were sure their customers were awake.\nWhile the practice continued in some parts of the country until the 1970s, it __19__ as alarm clocks became more widespread and affordable. Today, beeping alarm clocks and smartphones that play morning music are surely simpler and more convenient. However, they cannot __20__ the personal attention coming from the distinctive tap of a pea shooter.", "112-11–15": "In certain forests, when you look up you will see a network of cracks formed by gaps between the outermost edges of tree branches. It looks like a precisely engineered jigsaw puzzle, each branch growing just perfectly so it almost, __11__, touches the neighboring tree. This beautiful phenomenon is called crown shyness.\nScientists have been discussing crown shyness since the 1920s, proposing __12__ explanations for the phenomenon. Some resea d that the sick plants could “sneeze” and __23__ tiny water drops filled with leaf rust germs, spreading the disease to neighboring plants.\nThe researchers noticed that small drops of water on the wheat leaves would move to combine and form a larger drop. As they were moving, the energy of the droplets in motion would be released. This energy allowed the water __24__ into the air, which looked just like sneezing!\nHowever, not all plants can sneeze. The ability is __25__ to those with leaves that are hydrophobic, or repel water—a special feature that forces the liquid to move away when the leaf is exposed to it.", "109-26–30": "The idea of Blue Monday dates back to a 2005 campaign by Sky Travel. The travel company wanted to __26__ people to take January vacations, so they reached out to a psychologist. The scholar then developed an equation to find the most depressing day of the year, and it turned out to be the third Monday in January. Since then, other companies have jumped on the bandwagon to promote everything from soft drinks to new clothes as a __27__. A group in the UK even started a website devoted to “beating Blue Monday.”\nMany scientists, however, say there is no evidence that Blue Monday causes any more sadness than other specific days of the year. __28__, the idea of Blue Monday persists. According to psychologist Dean Burnett, people feel down in January __29__ post-holiday discontent, and the Blue Monday claim makes it seem like there are scientific reasons for this. Also, the idea __30__ a very complex issue regarding depression into something simple and easily understandable, and that tends to appeal to a lot of people.", "108-16–20": "April Fools’ Day, one of the most light-hearted days of the year, has an unclear origin. Some see it as a celebration related to the turn of the seasons from winter to spring; others, however, believe that it __16__ the adoption of a new calendar.\nAncient cultures celebrated New Year’s Day on or around April 1, whic rom happening again.", "options": ["swift", "brutal", "harsh", "grave"], "answer": 3, "answerLabel": "D", "source": "115 學測｜詞彙｜第 10 題", "explanation": "校園槍擊引發「嚴重的」關切：grave concerns。swift 迅速的、brutal 殘暴的、harsh 嚴厲的。", "explanationSource": "own", "section": "115年"}, {"id": 11, "question": "【綜合測驗 第 11–15 題】\n@@115-11–15@@\n\n▶ 第 11 題　請選出 __11__ 的最佳答案", "options": ["what is more", "it turns out", "in other words", "all in all"], "answer": 1, "answerLabel": "B", "source": "115 學測｜綜合測驗｜第 11 題", "explanation": "人類會聚在一起分享消息，白犀牛「結果也」會做同樣的事：it turns out。what is more 此外、in other words 換句話說、all in all 總之。", "explanationSource": "own", "section": "115年"}, {"id": 12, "question": "【綜合測驗 第 11–15 題】\n@@115-11–15@@\n\n▶ 第 12 題　請選出 __12__ 的最佳答案", "options": ["demonstrate", "immigrate", "communicate", "manipulate"], "answer": 2, "answerLabel": "C", "source": "115 學測｜綜合測驗｜第 12 題", "explanation": "犀牛用糞便留言，是一種有味道的「溝通」方式：communicate。demonstrate 示範、immigrate 移入、manipulate 操控。", "explanationSource": "own", "section": "115年"}, {"id": 13, "question": "【綜合測驗 第 11–15 題】\n@@115-11–15@@\n\n▶ 第 13 題　請選出 __13__ 的最佳答案", "options": ["doubts", "icons", "matches", "clues"], "answer": 3, "answerLabel": "D", "source": "115 學測｜綜合測驗｜第 13 題", "explanation": "糞便中的化學物質提供關於年齡、性別、健康狀況的重要「線索」：clues。doubt 懷疑、icon 圖像、match 配對。", "explanationSource": "own", "section": "115年"}, {"id": 14, "question": "【綜合測驗 第 11–15 題】\n@@115-11–15@@\n\n▶ 第 14 題　請選出 __14__ 的最佳答案", "options": ["hardly surprising", "more acceptable", "truly important", "less likely"], "answer": 3, "answerLabel": "D", "source": "115 學測｜綜合測驗｜第 14 題", "explanation": "大家都知道彼此的狀況，就「比較不可能」打架：less likely，呼應前句 peace and harmony。", "explanationSource": "own", "section": "115年"}, {"id": 15, "question": "【綜合測驗 第 11–15 題】\n@@115-11–15@@\n\n▶ 第 15 題　請選出 __15__ 的最佳答案", "options": ["responsive to", "annoyed at", "considerate of", "tolerant with"], "answer": 0, "answerLabel": "A", "source": "115 學測｜綜合測驗｜第 15 題", "explanation": "優勢公犀牛對帶有可交配母犀牛化學物質的假糞便特別「有反應」：responsive to。annoyed at 惱怒、considerate of 體貼、tolerant with 容忍。", "explanationSource": "own", "section": "115年"}, {"id": 16, "question": "【綜合測驗 第 16–20 題】\n@@115-16–20@@\n\n▶ 第 16 題　請選出 __16__ 的最佳答案", "options": ["accommodate", "compensate", "anticipate", "reinforce"], "answer": 0, "answerLabel": "A", "source": "115 學測｜綜合測驗｜第 16 題", "explanation": "茶館興起以「接待」疲憊的旅人：accommodate。compensate 補償、anticipate 預期、reinforce 加強。", "explanationSource": "own", "section": "115年"}, {"id": 17, "question": "【綜合測驗 第 16–20 題】\n@@115-16–20@@\n\n▶ 第 17 題　請選出 __17__ 的最佳答案", "options": ["would hardly develop", "had yet to develop", "was fast developing", "had almost developed"], "answer": 1, "answerLabel": "B", "source": "115 學測｜綜合測驗｜第 17 題", "explanation": "當時認為茶不宜配食物，所以點心這門烹飪藝術「尚未發展」：had yet to develop。後文說幾世紀後才出現。", "explanationSource": "own", "section": "115年"}, {"id": 18, "question": "【綜合測驗 第 16–20 題】\n@@115-16–20@@\n\n▶ 第 18 題　請選出 __18__ 的最佳答案", "options": ["passed on to", "brought up as", "thought to have", "meant to be"], "answer": 3, "answerLabel": "D", "source": "115 學測｜綜合測驗｜第 18 題", "explanation": "點心不只是菜餚，更「意在成為」可長達數小時的用餐體驗：meant to be。pass on to 傳給、bring up as 養育成、thought to have 被認為有。", "explanationSource": "own", "section": "115年"}, {"id": 19, "question": "【綜合測驗 第 16–20 題】\n@@115-16–20@@\n\n▶ 第 19 題　請選出 __19__ 的最佳答案", "options": ["if so", "as such", "by then", "in that"], "answer": 1, "answerLabel": "B", "source": "115 學測｜綜合測驗｜第 19 題", "explanation": "點心設計成小份量，「因此」最初是當作零食享用：as such 因此、就這樣。if so 若是如此、by then 到那時、in that 因為。", "explanationSource": "own", "section": "115年"}, {"id": 20, "question": "【綜合測驗 第 16–20 題】\n@@115-16–20@@\n\n▶ 第 20 題　請選出 __20__ 的最佳答案", "options": ["a widely known delicacy", "an intimate romantic dinner", "a joyful social activity", "an amazing local cuisine"], "answer": 2, "answerLabel": "C", "source": "115 學測｜綜合測驗｜第 20 題", "explanation": "一大群人一起享用簡單菜餚，是「歡樂的社交活動」：a joyful social activity。最後一句說食物只是體驗的一小部分。", "explanationSource": "own", "section": "115年"}, {"id": 21, "question": "第 1 題　If you put a ______ under a leaking faucet, you will be surprised at the amount of water collected in 24 hours.", "options": ["border", "timer", "container", "marker"], "answer": 2, "answerLabel": "C", "source": "114 學測｜詞彙｜第 1 題", "explanation": "在漏水的水龍頭下放「容器」，24 小時收集到的水量驚人：container。border 邊界、timer 計時器、marker 標記。", "explanationSource": "own", "section": "114年"}, {"id": 22, "question": "第 2 題　The local farmers’ market is popular as it offers a variety of fresh seasonal ______ to people in the community.", "options": ["produce", "fashion", "brand", "trend"], "answer": 0, "answerLabel": "A", "source": "114 學測｜詞彙｜第 2 題", "explanation": "農夫市集提供各種新鮮當季「農產品」：produce（名詞，農產品）。fashion 時尚、brand 品牌、trend 趨勢。", "explanationSource": "own", "section": "114年"}, {"id": 23, "question": "第 3 題　As the years have passed by, many of my childhood memories are already ______; I can no longer recall clearly what happened back then.", "options": ["blurring", "trimming", "draining", "glaring"], "answer": 0, "answerLabel": "A", "source": "114 學測｜詞彙｜第 3 題", "explanation": "童年記憶已經「模糊」，無法清楚回想：blurring。trim 修剪、drain 排乾、glare 怒視。", "explanationSource": "own", "section": "114年"}, {"id": 24, "question": "第 4 題　Racist remarks are by nature ______ and hurtful, and should be avoided on all occasions.", "options": ["excessive", "furious", "offensive", "stubborn"], "answer": 2, "answerLabel": "C", "source": "114 學測｜詞彙｜第 4 題", "explanation": "種族歧視言論本質上是「冒犯」且傷人的：offensive。excessive 過度的、furious 憤怒的、stubborn 頑固的。", "explanationSource": "own", "section": "114年"}, {"id": 25, "question": "第 5 題　Not satisfied with the first ______ of her essay, Mary revised it several times before turning it in to the teacher.", "options": ["text", "brush", "draft", "plot"], "answer": 2, "answerLabel": "C", "source": "114 學測｜詞彙｜第 5 題", "explanation": "不滿意第一份「草稿」，修改多次才交：draft。text 文本、brush 刷子、plot 情節。", "explanationSource": "own", "section": "114年"}, {"id": 26, "question": "第 6 題　Left ______ for years, the deserted house was filled with a thick coating of dust and a smell of old damp wood.", "options": ["casual", "fragile", "remote", "vacant"], "answer": 3, "answerLabel": "D", "source": "114 學測｜詞彙｜第 6 題", "explanation": "多年「空置」的廢棄房子布滿灰塵：Left vacant。casual 隨意的、fragile 脆弱的、remote 偏遠的。", "explanationSource": "own", "section": "114年"}, {"id": 27, "question": "第 7 題　The high school student showed ______ courage when she helped the old man escape from the fire.", "options": ["gigantic", "exclusive", "multiple", "enormous"], "answer": 3, "answerLabel": "D", "source": "114 學測｜詞彙｜第 7 題", "explanation": "幫老人逃離火場，展現「極大的」勇氣：enormous courage。gigantic 巨大的（多指體積）、exclusive 獨家的、multiple 多重的。", "explanationSource": "own", "section": "114年"}, {"id": 28, "question": "第 8 題　Publicly financed projects are often ______ or delayed during tough economic times due to a lack of resources.", "options": ["halted", "hatched", "possessed", "reinforced"], "answer": 0, "answerLabel": "A", "source": "114 學測｜詞彙｜第 8 題", "explanation": "經濟困難時公共工程常被「暫停」或延後：halted。hatch 孵化、possess 擁有、reinforce 加強。", "explanationSource": "own", "section": "114年"}, {"id": 29, "question": "第 9 題　Despite his busy schedule, the President ______ the school’s graduation ceremony with his presence and a heartwarming speech.", "options": ["praised", "graced", "addressed", "credited"], "answer": 1, "answerLabel": "B", "source": "114 學測｜詞彙｜第 9 題", "explanation": "總統親臨並致詞，「為畢業典禮增光」：graced … with his presence。praise 稱讚、address 演說、credit 歸功。", "explanationSource": "own", "section": "114年"}, {"id": 30, "question": "第 10 題　The manager of the company was sued for ______ abusing his colleagues, calling them “hopeless losers.”", "options": ["verbally", "dominantly", "legitimately", "relevantly"], "answer": 0, "answerLabel": "A", "source": "114 學測｜詞彙｜第 10 題", "explanation": "罵同事「沒救的輸家」，是「言語」辱罵：verbally abusing。dominantly 主導地、legitimately 合法地、relevantly 相關地。", "explanationSource": "own", "section": "114年"}, {"id": 31, "question": "【綜合測驗 第 11–15 題】\n@ , "floating"], "answer": 0, "answerLabel": "A", "source": "113 學測｜詞彙｜第 2 題", "explanation": "看太陽從雲海中「升起、浮現」：emerging。flash 閃爍、rush 衝、float 漂浮。", "explanationSource": "own", "section": "113年"}, {"id": 43, "question": "第 3 題　Do you know what time the next bus is ______? I’ve been waiting here for more than 30 minutes.", "options": ["apt", "due", "bound", "docked"], "answer": 1, "answerLabel": "B", "source": "113 學測｜詞彙｜第 3 題", "explanation": "下一班公車什麼時候「該到」：due 預計到達的。apt 傾向的、bound 必定的、docked 停靠的。", "explanationSource": "own", "section": "113年"}, {"id": 44, "question": "第 4 題　The roasting heat and high ______ made me feel hot and sticky, no matter what I did to cool off.", "options": ["density", "humidity", "circulation", "atmosphere"], "answer": 1, "answerLabel": "B", "source": "113 學測｜詞彙｜第 4 題", "explanation": "炙熱加上高「濕度」讓人又熱又黏：humidity。density 密度、circulation 循環、atmosphere 大氣。", "explanationSource": "own", "section": "113年"}, {"id": 45, "question": "第 5 題　Artwork created by truly great artists such as Picasso and Monet will no doubt ______ the test of time.", "options": ["stay", "take", "serve", "stand"], "answer": 3, "answerLabel": "D", "source": "113 學測｜詞彙｜第 5 題", "explanation": "偉大藝術家的作品必能「經得起」時間考驗：stand the test of time。", "explanationSource": "own", "section": "113年"}, {"id": 46, "question": "第 6 題　In some countries, military service is ______ for men only; women do not have to serve in the military.", "options": ["forceful", "realistic", "compulsory", "distinctive"], "answer": 2, "answerLabel": "C", "source": "113 學測｜詞彙｜第 6 題", "explanation": "某些國家兵役只對男性是「強制的」：compulsory。forceful 強有力的、realistic 務實的、distinctive 獨特的。", "explanationSource": "own", "section": "113年"}, {"id": 47, "question": "第 7 題　The team complained that its leader always took the ______ for all the hard work done by the team members.", "options": ["advantage", "revenge", "remedy", "credit"], "answer": 3, "answerLabel": "D", "source": "113 學測｜詞彙｜第 7 題", "explanation": "領導者總把團隊成員辛苦工作的「功勞」歸於自己：take the credit for。advantage 優勢、revenge 報復、remedy 補救。", "explanationSource": "own", "section": "113年"}, {"id": 48, "question": "第 8 題　Located at the center of the city, the business hotel ______ not only good service but also convenient public transport.", "options": ["proposes", "contains", "promises", "confirms"], "answer": 2, "answerLabel": "C", "source": "113 學測｜詞彙｜第 8 題", "explanation": "位於市中心的商務旅館「保證」有好服務與便利交通：promises。propose 提議、contain 包含、confirm 確認。", "explanationSource": "own", "section": "113年"}, {"id": 49, "question": "第 9 題　As blood supplies have fallen to a critically low level, many hospitals are making an ______ for the public to donate blood.", "options": ["appeal", "approach", "operation", "observation"], "answer": 0, "answerLabel": "A", "source": "113 學測｜詞彙｜第 9 題", "explanation": "血液庫存過低，醫院向大眾「呼籲」捐血：make an appeal for。approach 方法、operation 手術、observation 觀察。", "explanationSource": "own", "section": "113年"}, {"id": 50, "question": "第 10 題　David felt disappointed when he found out that he could not choose his study partners, but would be ______ placed in a study group.", "options": ["eligibly", "randomly", "apparently", "consequently"], "answer": 1, "answerLabel": "B", "source": "113 學測｜詞彙｜第 10 題", "explanation": "不能自選夥伴，而是會被「隨機」分組：randomly。eligibly 合格地、apparently 顯然、consequently 因此。", "explanationSource": "own", "section": "113年"}, {"id": 51, "question": "【綜合測驗 第 11–15 題】\n@@113-11–15@@\n\n▶ 第 11 題　請選出 __11__ 的最佳答案", "options": ["call for", "pose as", "attend to", "engage in"], "answer": 1, "answerLabel": "B", "source": "113 學測｜綜合測驗｜第 11 題", "explanation": "神秘客「假扮」一般顧客購物、用餐、詢問或退貨：pose as。call for 要求、attend to 處理、engage in 從事。", "explanationSource": "own", "section": "113年"}, {"id": 52, "question": "【綜合測驗 第 11–15 題】\n@@113-11–15@@\n\n▶ 第 12 題　請選出 __12__ 的最佳答案", "options": ["in that", "with which", "for that", "to which"], "answer": 3, "answerLabel": "D", "source": "113 學測｜綜合測驗｜第 12 題", "explanation": "the stores to which they are assigned：be assigned to（被派 tions": ["familiar presences", "distant memories", "vague images", "public eyesores"], "answer": 0, "answerLabel": "A", "source": "113 學測｜綜合測驗｜第 18 題", "explanation": "叫醒人在全英國成為「常見的身影」：familiar presences。後文說每天早上都能在街頭看見他們。distant memories 遙遠記憶、vague images 模糊影像、public eyesores 礙眼之物。", "explanationSource": "own", "section": "113年"}, {"id": 59, "question": "【綜合測驗 第 16–20 題】\n@@113-16–20@@\n\n▶ 第 19 題　請選出 __19__ 的最佳答案", "options": ["remained", "dismissed", "revised", "declined"], "answer": 3, "answerLabel": "D", "source": "113 學測｜綜合測驗｜第 19 題", "explanation": "鬧鐘普及又便宜後，這個行業逐漸「衰退」：declined。remain 維持、dismiss 解散、revise 修訂。", "explanationSource": "own", "section": "113年"}, {"id": 60, "question": "【綜合測驗 第 16–20 題】\n@@113-16–20@@\n\n▶ 第 20 題　請選出 __20__ 的最佳答案", "options": ["forget", "change", "match", "regret"], "answer": 2, "answerLabel": "C", "source": "113 學測｜綜合測驗｜第 20 題", "explanation": "現代鬧鐘雖方便，卻「比不上」豆子吹管帶來的個人關懷：match 比得上。forget 忘記、change 改變、regret 後悔。", "explanationSource": "own", "section": "113年"}, {"id": 61, "question": "第 1 題　The bus driver often complains about chewing gum found under passenger seats because it is ______ and very hard to remove.", "options": ["sticky", "greasy", "clumsy", "mighty"], "answer": 0, "answerLabel": "A", "source": "112 學測｜詞彙｜第 1 題", "explanation": "口香糖很「黏」、難清除：sticky。greasy 油膩的、clumsy 笨拙的、mighty 強大的。", "explanationSource": "own", "section": "112年"}, {"id": 62, "question": "第 2 題　Jesse is a talented model. He can easily adopt an elegant ______ for a camera shoot.", "options": ["clap", "toss", "pose", "snap"], "answer": 2, "answerLabel": "C", "source": "112 學測｜詞彙｜第 2 題", "explanation": "模特兒能輕鬆做出優雅的「姿勢」：pose。clap 拍手、toss 拋、snap 快照。", "explanationSource": "own", "section": "112年"}, {"id": 63, "question": "第 3 題　In order to draw her family tree, Mary tried to trace her ______ back to their arrival in North America.", "options": ["siblings", "commuters", "ancestors", "instructors"], "answer": 2, "answerLabel": "C", "source": "112 學測｜詞彙｜第 3 題", "explanation": "畫家族樹要追溯「祖先」何時抵達北美：ancestors。sibling 兄弟姊妹、commuter 通勤者、instructor 教師。", "explanationSource": "own", "section": "112年"}, {"id": 64, "question": "第 4 題　Upon the super typhoon warning, Nancy rushed to the supermarket—only to find the shelves almost ______ and the stock nearly gone.", "options": ["blank", "bare", "hollow", "queer"], "answer": 1, "answerLabel": "B", "source": "112 學測｜詞彙｜第 4 題", "explanation": "超市貨架幾乎「空了」、存貨快沒了：bare 空的。blank 空白的、hollow 中空的、queer 奇怪的。", "explanationSource": "own", "section": "112年"}, {"id": 65, "question": "第 5 題　Even though Jack said “Sorry!” to me in person, I did not feel any ______ in his apology.", "options": ["liability", "generosity", "integrity", "sincerity"], "answer": 3, "answerLabel": "D", "source": "112 學測｜詞彙｜第 5 題", "explanation": "雖然當面說抱歉，卻感受不到任何「誠意」：sincerity。liability 責任、generosity 慷慨、integrity 正直。", "explanationSource": "own", "section": "112年"}, {"id": 66, "question": "第 6 題　My grandfather has astonishing powers of ______ . He can still vividly describe his first day at school as a child.", "options": ["resolve", "fraction", "privilege", "recall"], "answer": 3, "answerLabel": "D", "source": "112 學測｜詞彙｜第 6 題", "explanation": "能生動描述小時候上學第一天，表示「記憶力」驚人：powers of recall。resolve 決心、fraction 分數、privilege 特權。", "explanationSource": "own", "section": "112年"}, {"id": 67, "question": "第 7 題　Recent research has found lots of evidence to ______ the drug company’s claims about its “miracle” tablets for curing cancer.", "options": ["provoke", "counter", "expose", "convert"], "answer": 1, "answerLabel": "B", "source": "112 學測｜詞彙｜第 7 題", "explanation": "研究找到許多證據「反駁」藥廠的神奇藥丸說法：counter。provoke 激怒、expose 揭露、convert 轉變。", "explanationSource": "own", "section": "112年"}, {"id": 68, "question": "第 8 題　Corrupt officials and misguided policies have ______ the country’s economy and burdened its people with enormous foreign debts.", "options": ["crippled", "accelerated", "rendered", "ventured"], "answer": 0, "answerLabel": "A", "source": "112 學測｜詞彙｜第 8 題", "explanation": "貪腐官員與錯誤政策「重創」了國家經濟：crippled。accelerate 加速、render 使成為、venture 冒險。", "explanationSource": "own", "section": "112年"}, {"id": 69, "question": "第 9 題　As a record number of fans showed up for the baseball final, the highways around the stadium were ______ with traffic all day.", "options": ["choked", "disturbed", "enclosed", "injected"], "answer": 0, "answerLabel": "A", "source": "112 學測｜詞彙｜第 9 題", "explanation": "球迷人數創紀錄，公路整天「塞」滿車：choked with traffic。disturb 干擾、enclose 圍住、inject 注射。", "explanationSource": "own", "section": "112年"}, {"id": 70, "question": "第 10 題　Studies show that the ______ unbiased media are in fact often deeply influenced by political ideology.", "options": ["undoubtedly", "roughly", "understandably", "supposedly"], "answer": 3, "answerLabel": "D", "source": "112 學測｜詞彙｜第 10 題", "explanation": "「號稱」公正的媒體其實受政治意識形態影響：supposedly。undoubtedly 無疑地、roughly 大約、understandably 可理解地。", "explanationSource": "own", "section": "112年"}, {"id": 71, "question": "【綜合測驗 第 11–15 題】\n@@112-11–15@@\n\n▶ 第 11 題　請選出 __11__ 的最佳答案", "options": ["in no time", "by all means", "but not quite", "and pretty much"], "answer": 2, "answerLabel": "C", "source": "112 學測｜綜合測驗｜第 11 題", "explanation": "每根樹枝剛好長到幾乎碰到鄰樹，「但又沒碰到」：but not quite。in no time 立刻、by all means 務必、and pretty much 大致上。", "explanationSource": "own", "section": "112年"}, {"id": 72, "question": "【綜合測驗 第 11–15 題】\n@@112-11–15@@\n\n▶ 第 12 題　請選出 __12__ 的最佳答案", "options": ["universal", "productive", "conventional", "multiple"], "answer": 3, "answerLabel": "D", "source": "112 學測｜綜合測驗｜第 12 題", "explanation": "科學家提出「多種」解釋：multiple explanations。後文列舉不同研究者的看法。universal 普遍的、productive 有生產力的、conventional 傳統的。", "explanationSource": "own", "section": "112年"}, {"id": 73, "question": "【綜合測驗 第 11–15 題】\n@@112-11–15@@\n\n▶ 第 13 題　請選出 __13__ 的最佳答案", "options": ["get over", "compete for", "give way to", "make up for"], "answer": 1, "answerLabel": "B", "source": "112 學測｜綜合測驗｜第 13 題", "explanation": "植物和動物一樣會「爭奪」資源——養分、水、空間、光：compete for。get over 克服、give way to 讓步、make up for 彌補。", "explanationSource": "own", "section": "112年"}, {"id": 74, "question": "【綜合測驗 第 11–15 題】\n@@112-11–15@@\n\n▶ 第 14 題　請選出 __14__ 的最佳答案", "options": ["reliance on", "exposure to", "sensitivity to", "reflection on"], "answer": 1, "answerLabel": "B", "source": "112 學測｜綜合測驗｜第 14 題", "explanation": "樹冠間隙讓樹木增加對光的「暴露、接觸」，提升光合作用：exposure to light。reliance on 依賴、sensitivity to 敏感、reflection on 反思。", "explanationSource": "own", "section": "112年"}, {"id": 75, "question": "【綜合測驗 第 11–15 題】\n@@112-11–15@@\n\n▶ 第 15 題　請選出 __15__ 的最佳答案", "options": ["For", "Besides", "Despite", "Concerning"], "answer": 2, "answerLabel": "C", "source": "112 學測｜綜合測驗｜第 15 題", "explanation": "「儘管」研究數十年，仍沒有共識：Despite。For 為了、Besides 除此之外、Concerning 關於。", "explanationSource": "own", "section": "112年"}, {"id": 76, "question": "【綜合測驗 第 16–20 題】\n@@112-16–20@@\n\n▶ 第 16 題　請選出 __16__ 的最佳答案", "options": ["back to", "free of", "long before", "straight on"], "answer": 1, "answerLabel": "B", "source": "112 學測｜綜合測驗｜第 16 題", "explanation": "火箭要「擺脫」地球引力才能登月：shoot free of Earth’s pull。back to 回到、long before 很久以前、straight on 直走。", "explanationSource": "own", "section": "112年"}, {"id": 77, "question": "【綜合測驗 第 16–20 題】\n@@112-16–20@@\n\n▶ 第 17 題　請選出 __17__ 的最佳答案", "options": ["physical", "perceptual", "mental", "external"], "answer": 0, "answerLabel": "A", "source": "112 學測｜綜合測驗｜第 17 題", "explanation": "今天科學家更關心低重力如何影響太空人的「身體」狀況：physical condition。後文談體液移動、臉部腫脹。", "explanationSource": "own", "section": "112年"}, {"id": 78, "question": "【綜合測驗 第 16–20 題】\n@@112-16–20@@\n\n▶ 第 18 題　請選出 __18__ 的最佳答案", "options": ["redistribute", "redistributed", "redistributing", "being redistributed"], "answer": 0, "answerLabel": "A", "source": "112 學測｜綜合測驗｜第 18 題", "explanation": "our body fluids redistribute, shifting toward …：主詞 fluids 的主要動詞用現在式 redistribute。", "explanationSource": "own", "section": "112年"}, {"id": 79, "question": "【綜合測驗 第 16–20 題】\n@@112-16–20@@\n\n▶ 第 19 題　請選出 __19__ 的最佳答案", "options": ["contagious", "unusual", "severe", "aggressive"], "answer": 2, "answerLabel": "C", "source": "112 學測｜綜合測驗｜第 19 題", "explanation": "火星任務約三年，比登月久很多，所以效應會更「嚴重」：severe。contagious 傳染的、unusual 不尋常的、aggressive 侵略性的。", "explanationSource": "own", "section": "112年"}, {"id": 80, "question": "【綜合測驗 第 16–20 題】\n@@112-16–20@@\n\n▶ 第 20 題　請選出 __20__ 的最佳答案", "options": ["varied with", "brought about", "transferred from", "accompanied by"], "answer": 3, "answerLabel": "D", "source": "112 學測｜綜合測驗｜第 20 題", "explanation": "這種效應常「伴隨著」太空暈動症、頭痛和噁心：accompanied by。vary with 隨…變化、bring about 引起、transfer from 從…轉移。", "explanationSource": "own", "section": "112年"}, {"id": 81, "question": "第 1 題　When Jeffery doesn’t feel like cooking, he often orders pizza online and has it ______ to his house.", "options": ["advanced", "delivered", "offered", "stretched"], "answer": 1, "answerLabel": "B", "source": "111 學測｜詞彙｜第 1 題", "explanation": "線上訂披薩並請店家「送」到家：have it delivered（have + O + p.p.）。advance 前進、offer 提供、stretch 伸展。", "explanationSource": "own", "section": "111年"}, {"id": 82, "question": "第 2 題　Jane is the best ______ I have ever had. I cannot imagine running my office without her help.", "options": ["assistant", "influence", "contribution", "politician"], "answer": 0, "answerLabel": "A", "source": "111 學測｜詞彙｜第 2 題", "explanation": "沒有她的幫助無法經營辦公室，表示她是最好的「助理」：assistant。influence 影響、contribution 貢獻、politician 政治人物。", "explanationSource": "own", "section": "111年"}, {"id": 83, "question": "第 3 題　The temple celebrated Mazu Festival by hosting ten days of lion dances, Taiwanese operas, and traditional hand ______ shows.", "options": ["chat", "quiz", "puppet", "variety"], "answer": 2, "answerLabel": "C", "source": "111 學測｜詞彙｜第 3 題", "explanation": "媽祖慶典有舞獅、歌仔戲和傳統「布袋戲」：hand puppet shows。chat 聊天、quiz 問答、variety 綜藝。", "explanationSource": "own", "section": "111年"}, {"id": 84, "question": "第 4 題　The new vaccine was banned by the Food and Drug Administration due to its ______ fatal side effects.", "options": ["potentially", "delicately", "ambiguously", "optionally"], "answer": 0, "answerLabel": "A", "source": "111 學測｜詞彙｜第 4 題", "explanation": "疫苗因「可能」致命的副作用被禁：potentially fatal。delicately 精細地、ambiguously 模糊地、optionally 選擇性地。", "explanationSource": "own", "section": "111年"}, {"id": 85, "question": "第 5 題　______ the photos with dates and keywords help you sort them easily in your file.", "options": ["Tagging", "Flocking", "Rolling", "Snapping"], "answer": 0, "answerLabel": "A", "source": "111 學測｜詞彙｜第 5 題", "explanation": "為照片「加標籤」（日期與關鍵字）方便分類：Tagging。flock 聚集、roll 滾動、snap 拍照。", "explanationSource": "own", "section": "111年"}, {"id": 86, "question": "第 6 題　An ______ person is usually pleasant and easy to get along with, but don’t expect that he or she will always say “yes” to everything.", "options": ["enormous", "intimate", "agreeable", "ultimate"], "answer": 2, "answerLabel": "C", "source": "111 學測｜詞彙｜第 6 題", "explanation": "「和善的」人好相處，但不代表什麼都說好：agreeable。enormous 巨大的、intimate 親密的、ultimate 最終的。", "explanationSource": "own", "section": "111年"}, {"id": 87, "question": "第 7 題　Hidden deep in a small alley among various tiny shops, the entrance of the Michelin star restaurant is barely ______ to passersby.", "options": ["identical", "visible", "available", "remarkable"], "answer": 1, "answerLabel": "B", "source": "111 學測｜詞彙｜第 7 題", "explanation": "藏在小巷深處，餐廳入口對路人幾乎「看不見」：visible。identical 相同的、available 可取得的、remarkable 顯著的。", "explanationSource": "own", "section": "111年"}, {"id": 88, "question": "第 8 題　The original budget for my round-island trip was NT$5,000, but the ______ cost is likely to be 50 percent higher.", "options": ["moderate", "absolute", "promising", "eventual"], "answer": 3, "answerLabel": "D", "source": "111 學測｜詞彙｜第 8 題", "explanation": "原本預算五千，但「最終」花費可能高出 50%：eventual cost。moderate 適度的、absolute 絕對的、promising 有前景的。", "explanationSource": "own", "section": "111年"}, {"id": 89, "question": "第 9 題　After watching a TV program on natural history, Adam decided to go on a ______ for dinosaur fossils in South Dakota.", "options": ["trial", "route", "strike", "quest"], "answer": 3, "answerLabel": "D", "source": "111 學測｜詞彙｜第 9 題", "explanation": "決定去南達科他州「尋找」恐龍化石：go on a quest for。trial 試驗、route 路線、strike 罷工。", "explanationSource": "own", "section": "111年"}, {"id": 90, "question": "第 10 題　With pink cherry blossoms blooming everywhere, the valley ______ like a young bride under the bright spring sunshine.", "options": ["bounces", "blushes", "polishes", "transfers"], "answer": 1, "answerLabel": "B", "source": "111 學測｜詞彙｜第 10 題", "explanation": "粉色櫻花盛開，山谷像年輕新娘般「泛紅、羞紅」：blushes。bounce 彈跳、polish 擦亮、transfer 轉移。", "explanationSource": "own", "section": "111年"}, {"id": 91, "question": "【綜合測驗 第 11–15 題】\n@@111-11–15@@\n\n▶ 第 11 題　請選出 __11__ 的最佳答案", "options": ["initiated", "represented", "acknowledged", "manipulated"], "answer": 0, "answerLabel": "A", "source": "111 學測｜綜合測驗｜第 11 題", "explanation": "書鎮的概念由 Richard Booth「開創」：initiated。represent 代表、acknowledge 承認、manipulate 操控。", "explanationSource": "own", "section": "111年"}, {"id": 92, "question": "【綜合測驗 第 11–15 題】\n@@111-11–15@@\n\n▶ 第 12 題　請選出 __12__ 的最佳答案", "options": ["spring", "sprang", "had sprung", "have been springing"], "answer": 3, "answerLabel": "D", "source": "111 學測｜綜合測驗｜第 12 題", "explanation": "Since the 1970s 自 1970 年代以來，書鎮不斷出現：現在完成進行式 have been springing up。", "explanationSource": "own", "section": "111年"}, {"id": 93, "question": "【綜合測驗 第 11–15 題】\n@@111-11–15@@\n\n▶ 第 13 題　請選出 __13__ 的最佳答案", "options": ["form", "count", "end", "matter"], "answer": 2, "answerLabel": "C", "source": "111 學測｜綜合測驗｜第 13 題", "explanation": "書鎮都有很多書店，但相似之處「到此為止」：that’s where the similarities end。後文說各有特色。", "explanationSource": "own", "section": "111年"}, {"id": 94, "question": "【綜合測驗 第 11–15 題】\n@@111-11–15@@\n\n▶ 第 14 題　請選出 __14__ 的最佳答案", "options": ["trends", "releases", "agendas", "announcements"], "answer": 1, "answerLabel": "B", "source": "111 學測｜綜合測驗｜第 14 題", "explanation": "書談邀請作者討論最新「出版作品」：releases。trend 趨勢、agenda 議程、announcement 公告。", "explanationSource": "own", "section": "111年"}, {"id": 95, "question": "【綜合測驗 第 11–15 題】\n@@111-11–15@@\n\n▶ 第 15 題　請選出 __15__ 的最佳答案", "options": ["get their worldwide fame", "conform to the new mode", "make their visitors satisfied", "keep the printed word alive"], "answer": 3, "answerLabel": "D", "source": "111 學測｜綜合測驗｜第 15 題", "explanation": "數位閱讀改變閱讀方式，書鎮對「保存實體書」特別重要：keep the printed word alive。後文強調 preserving the physical book。", "explanationSource": "own", "section": "111年"}, {"id": 96, "question": "【綜合測驗 第 16–20 題】\n@@111-16–20@@\n\n▶ 第 16 題　請選出 __16__ 的最佳答案", "options": ["contrary to", "except for", "more of", "other than"], "answer": 3, "answerLabel": "D", "source": "111 學測｜綜合測驗｜第 16 題", "explanation": "圓窗設計的原因「不是」美觀：reasons other than aesthetics。contrary to 與…相反、except for 除了、more of 更多的。", "explanationSource": "own", "section": "111年"}, {"id": 97, "question": "【綜合測驗 第 16–20 題】\n@@111-16–20@@\n\n▶ 第 17 題　請選出 __17__ 的最佳答案", "options": ["used to be", "were to be", "would have been", "must have been"], "answer": 0, "answerLabel": "A", "source": "111 學測｜綜合測驗｜第 17 題", "explanation": "早期飛機窗戶「以前是」方形的：used to be。後文說後來因為方窗出事而改成圓窗。", "explanationSource": "own", "section": "111年"}, {"id": 98, "question": "【綜合測驗 第 16–20 題】\n@@111-16–20@@\n\n▶ 第 18 題　請選出 __18__ 的最佳答案", "options": ["disguised", "understood", "confronted", "intensified"], "answer": 3, "answerLabel": "D", "source": "111 學測｜綜合測驗｜第 18 題", "explanation": "高空內外壓差增大、壓力增加，問題「加劇」：intensified。disguise 偽裝、understand 理解、confront 面對。", "explanationSource": "own", "section": "111年"}, {"id": 99, "question": "【綜合測驗 第 16–20 題】\n@@111-16–20@@\n\n▶ 第 19 題　請選出 __19__ 的最佳答案", "options": ["cause conflict", "rebuild strength", "spell disaster", "endure shock"], "answer": 2, "answerLabel": "C", "source": "111 學測｜綜合測驗｜第 19 題", "explanation": "方窗四角反覆承受壓力可能「釀成災難」：spell disaster。cause conflict 引起衝突、rebuild strength 重建力量、endure shock 承受衝擊。", "explanationSource": "own", "section": "111年"}, {"id": 100, "question": "【綜合測驗 第 16–20 題】\n@@111-16–20@@\n\n▶ 第 20 題　請選出 __20__ 的最佳答案", "options": ["tolerate", "improve", "justify", "obtain"], "answer": 0, "answerLabel": "A", "source": "111 學測｜綜合測驗｜第 20 題", "explanation": "圓形更堅固、抗變形，因此能「承受」機內外極大的壓差：tolerate。improve 改善、justify 證明正當、obtain 獲得。", "explanationSource": "own", "section": "111年"}, {"id": 101, "question": "第 1 題　Tom is really a naughty boy. He likes to ______ and play jokes on his younger sister when their parents are not around.", "options": ["alert", "spare", "tease", "oppose"], "answer": 2, "answerLabel": "C", "source": "110 學測｜詞彙｜第 1 題", "explanation": "調皮的男孩喜歡「逗弄」妹妹、開她玩笑：tease。alert 警告、spare 省去、oppose 反對。", "explanationSource": "own", "section": "110年"}, {"id": 102, "question": "第 2 題　Elderly shoppers in this store are advised to take the elevator rather than the ______, which may move too fast for them to keep their balance.", "options": ["airway", "operator", "escalator", "instrument"], "answer": 2, "answerLabel": "C", "source": "110 學測｜詞彙｜第 2 題", "explanation": "搭電梯而不要搭「電扶梯」，因為移動太快難以保持平衡：escalator。airway 氣道、operator 操作員、instrument 儀器。", "explanationSource": "own", "section": "110年"}, {"id": 103, "question": "第 3 題　Upon hearing its master’s call, the dog wagged its tail, and followed her out of the room ______.", "options": ["obediently", "apparently", "logically", "thoroughly"], "answer": 0, "answerLabel": "A", "source": "110 學測｜詞彙｜第 3 題", "explanation": "狗聽到主人呼喚就搖尾巴「順從地」跟出去：obediently。apparently 顯然、logically 邏輯上、thoroughly 徹底地。", "explanationSource": "own", "section": "110年"}, {"id": 104, "question": "第 4 題　Since many of our house plants are from humid jungle environments, they need ______ air to keep them green and healthy.", "options": ["moist", "stale", "crisp", "fertile"], "answer": 0, "answerLabel": "A", "source": "110 學測｜詞彙｜第 4 題", "explanation": "來自潮濕叢林的植物需要「濕潤的」空氣：moist。stale 不新鮮的、crisp 清爽的、fertile 肥沃的。", "explanationSource": "own", "section": "110年 , "question": "第 11 題　Jack’s excellent performance in last week’s game has ______ all the doubts about his ability to play on our school basketball team.", "options": ["erased", "canceled", "overlooked", "replaced"], "answer": 0, "answerLabel": "A", "source": "109 學測｜詞彙｜第 11 題", "explanation": "出色表現「消除」了所有對他能力的質疑：erased。cancel 取消、overlook 忽略、replace 取代。", "explanationSource": "own", "section": "109年"}, {"id": 142, "question": "第 12 題　It is bullying to ______ a foreign speaker’s accent. No one deserves to be laughed at for their pronunciation.", "options": ["mock", "sneak", "prompt", "glare"], "answer": 0, "answerLabel": "A", "source": "109 學測｜詞彙｜第 12 題", "explanation": "「嘲笑」外國人的口音是霸凌：mock。sneak 偷偷溜走、prompt 促使、glare 怒視。", "explanationSource": "own", "section": "109年"}, {"id": 143, "question": "第 13 題　Mary lost ten kilograms in three months, so her ______ skin-tight jeans are now hanging off her hips.", "options": ["barely", "evenly", "currently", "formerly"], "answer": 3, "answerLabel": "D", "source": "109 學測｜詞彙｜第 13 題", "explanation": "三個月瘦十公斤，「以前」緊身的牛仔褲現在鬆垮：formerly。barely 幾乎不、evenly 平均地、currently 目前。", "explanationSource": "own", "section": "109年"}, {"id": 144, "question": "第 14 題　The police officer showed us pictures of drunk driving accidents to highlight the importance of staying ______ on the road.", "options": ["sober", "majestic", "vigorous", "noticeable"], "answer": 0, "answerLabel": "A", "source": "109 學測｜詞彙｜第 14 題", "explanation": "展示酒駕事故照片，強調開車時保持「清醒（未飲酒）」的重要：sober。majestic 雄偉的、vigorous 有活力的、noticeable 明顯的。", "explanationSource": "own", "section": "109年"}, {"id": 145, "question": "第 15 題　The claim that eating chocolate can prevent heart disease is ______ because there is not enough scientific evidence to support it.", "options": ["creative", "disputable", "circular", "magnificent"], "answer": 1, "answerLabel": "B", "source": "109 學測｜詞彙｜第 15 題", "explanation": "缺乏足夠科學證據，這個說法「有爭議」：disputable。creative 有創意的、circular 圓形的、magnificent 壯麗的。", "explanationSource": "own", "section": "109年"}, {"id": 146, "question": "【綜合測驗 第 16–20 題】\n@@109-16–20@@\n\n▶ 第 16 題　請選出 __16__ 的最佳答案", "options": ["were being", "have been", "will be", "had to be"], "answer": 1, "answerLabel": "B", "source": "109 學測｜綜合測驗｜第 16 題", "explanation": "Over the centuries（數世紀以來）… have been used：現在完成式被動，表從過去持續至今。", "explanationSource": "own", "section": "109年"}, {"id": 147, "question": "【綜合測驗 第 16–20 題】\n@@109-16–20@@\n\n▶ 第 17 題　請選出 __17__ 的最佳答案", "options": ["competition", "application", "investigation", "participation"], "answer": 1, "answerLabel": "B", "source": "109 學測｜綜合測驗｜第 17 題", "explanation": "古老藝術在當代藝術家手中找到新的「用途、應用」：application。competition 競爭、investigation 調查、participation 參與。", "explanationSource": "own", "section": "109年"}, {"id": 148, "question": "【綜合測驗 第 16–20 題】\n@@109-16–20@@\n\n▶ 第 18 題　請選出 __18__ 的最佳答案", "options": ["carry away", "build on", "cope with", "get off"], "answer": 2, "answerLabel": "C", "source": "109 學測｜綜合測驗｜第 18 題", "explanation": "幫助癌症病人「面對、處理」治療後掉髮的失落：cope with。carry away 帶走、build on 建立於、get off 下車。", "explanationSource": "own", "section": "109年"}, {"id": 149, "question": "【綜合測驗 第 16–20 題】\n@@109-16–20@@\n\n▶ 第 19 題　請選出 __19__ 的最佳答案", "options": ["moreover", "altogether", "namely", "otherwise"], "answer": 3, "answerLabel": "D", "source": "109 學測｜綜合測驗｜第 19 題", "explanation": "指甲花皇冠取代病人「原本（否則）」會用來遮頭的帽子和假髮：otherwise。moreover 此外、altogether 總共、namely 也就是。", "explanationSource": "own", "section": "109年"}, {"id": 150, "question": "【綜合測驗 第 16–20 題】\n@@109-16–20@@\n\n▶ 第 20 題　請選出 __20__ 的最佳答案", "options": ["positive", "general", "flexible", "considerate"], "answer": 0, "answerLabel": "A", "source": "109 學測｜綜合測驗｜第 20 題", "explanation": "在脆弱沮喪時幫助她們建立更「正面的」自我形象：positive。general 一般的、flexible 彈性的、considerate 體貼的。", "explanationSource": "own", "section": "109年"}, {"id": 151, "question": "【綜合測驗 第 21–25 題】\n@@109-21–25@@\n\n▶ 第 21 題　請選出 __21__ 的最佳答案", "options": ["similar", "miserable", "realistic", "temporary"], "answer": 0, "answerLabel": -26–30@@\n\n▶ 第 27 題　請選出 __27__ 的最佳答案", "options": ["disguise", "merit", "remedy", "ceremony"], "answer": 2, "answerLabel": "C", "source": "109 學測｜綜合測驗｜第 27 題", "explanation": "其他公司跟風，把各種商品當作（憂鬱星期一的）「解藥」來促銷：remedy。disguise 偽裝、merit 優點、ceremony 儀式。", "explanationSource": "own", "section": "109年"}, {"id": 158, "question": "【綜合測驗 第 26–30 題】\n@@109-26–30@@\n\n▶ 第 28 題　請選出 __28__ 的最佳答案", "options": ["If so", "And yet", "On that", "With this"], "answer": 1, "answerLabel": "B", "source": "109 學測｜綜合測驗｜第 28 題", "explanation": "科學家說沒有證據，「然而」這個概念依然存在：And yet。", "explanationSource": "own", "section": "109年"}, {"id": 159, "question": "【綜合測驗 第 26–30 題】\n@@109-26–30@@\n\n▶ 第 29 題　請選出 __29__ 的最佳答案", "options": ["as for", "owing to", "in spite of", "with respect to"], "answer": 1, "answerLabel": "B", "source": "109 學測｜綜合測驗｜第 29 題", "explanation": "人們在一月心情低落是「由於」假期後的失落感：owing to。as for 至於、in spite of 儘管、with respect to 關於。", "explanationSource": "own", "section": "109年"}, {"id": 160, "question": "【綜合測驗 第 26–30 題】\n@@109-26–30@@\n\n▶ 第 30 題　請選出 __30__ 的最佳答案", "options": ["breaks down", "mixes up", "tears off", "results in"], "answer": 0, "answerLabel": "A", "source": "109 學測｜綜合測驗｜第 30 題", "explanation": "把複雜的憂鬱議題「拆解、簡化」成簡單易懂的東西：break down … into。mix up 混淆、tear off 撕下、result in 導致。", "explanationSource": "own", "section": "109年"}, {"id": 161, "question": "第 1 題　Bobby cared a lot about his ______ at home and asked his parents not to go through his things without his permission.", "options": ["discipline", "facility", "privacy", "representation"], "answer": 2, "answerLabel": "C", "source": "108 學測｜詞彙｜第 1 題", "explanation": "要求父母不要未經同意翻他的東西，表示他重視「隱私」：privacy。discipline 紀律、facility 設施、representation 代表。", "explanationSource": "own", "section": "108年"}, {"id": 162, "question": "第 2 題　The new manager is a real gentleman. He is kind and humble, totally different from the former manager, who was ______ and bossy.", "options": ["eager", "liberal", "mean", "inferior"], "answer": 2, "answerLabel": "C", "source": "108 學測｜詞彙｜第 2 題", "explanation": "新經理和善謙遜，與「刻薄」又愛指揮人的前任完全不同：mean。eager 熱切的、liberal 開放的、inferior 較差的。", "explanationSource": "own", "section": "108年"}, {"id": 163, "question": "第 3 題　The weather bureau ______ that the typhoon would bring strong winds and heavy rains, and warned everyone of the possible danger.", "options": ["conveyed", "associated", "interpreted", "predicted"], "answer": 3, "answerLabel": "D", "source": "108 學測｜詞彙｜第 3 題", "explanation": "氣象局「預測」颱風會帶來強風大雨：predicted。convey 傳達、associate 聯想、interpret 解釋。", "explanationSource": "own", "section": "108年"}, {"id": 164, "question": "第 4 題　Different airlines have different ______ for carry-on luggage, but many international airlines limit a carry-on piece to 7 kilograms.", "options": ["landmarks", "restrictions", "percentages", "circumstances"], "answer": 1, "answerLabel": "B", "source": "108 學測｜詞彙｜第 4 題", "explanation": "各航空公司對手提行李有不同的「限制」，例如限重 7 公斤：restrictions。landmark 地標、percentage 百分比、circumstance 情況。", "explanationSource": "own", "section": "108年"}, {"id": 165, "question": "第 5 題　Many people were happy that the government had finally ______ Children’s Day as a national holiday.", "options": ["appointed", "declared", "performed", "involved"], "answer": 1, "answerLabel": "B", "source": "108 學測｜詞彙｜第 5 題", "explanation": "政府終於「宣布」兒童節為國定假日：declared。appoint 任命、perform 執行、involve 涉及。", "explanationSource": "own", "section": "108年"}, {"id": 166, "question": "第 6 題　To reach the goal of making her company a market leader, Michelle ______ a plan to open ten new stores around the country this year.", "options": ["advised", "occupied", "proposed", "recognized"], "answer": 2, "answerLabel": "C", "source": "108 學測｜詞彙｜第 6 題", "explanation": "為達目標，她「提出」今年開十家新店的計畫：proposed a plan。advise 建議、occupy 占據、recognize 認出。", "explanationSource": "own", "section": "108年"}, {"id": 167, "question": "第 7 題　Silence in some way is as ______ as speech. It can be used to show, for example, disagreement or lack of interest.", "options": ["sociable", "expressive", "reasonable", "objective"], "answer": 1, "answerLabel": "B", "source": "108 學測｜詞彙｜第 7 題", "explanation": "沉默和說話一樣「有表達力」，可表示反對或沒興趣：expressive。sociable 善社交的、reasonable 合理的、objective 客觀的。", "explanationSource": "own", "section": "108年"}, {"id": 168, "question": "第 8 題　This TV program is designed for children, ______ for those under five. It contains no violence or strong language.", "options": ["particularly", "sensibly", "moderately", "considerably"], "answer": 0, "answerLabel": "A", "source": "108 學測｜詞彙｜第 8 題", "explanation": "節目為兒童設計，「特別是」五歲以下：particularly。sensibly 明智地、moderately 適度地、considerably 相當地。", "explanationSource": "own", "section": "108年"}, {"id": 169, "question": "第 9 題　Tommy, please put away the toys in the box, or you might ______ on them and hurt yourself.", "options": ["stumble", "graze", "navigate", "dwell"], "answer": 0, "answerLabel": "A", "source": "108 學測｜詞彙｜第 9 題", "explanation": "玩具不收好可能會「絆到」而受傷：stumble on。graze 擦傷、navigate 導航、dwell 居住。", "explanationSource": "own", "section": "108年"}, {"id": 170, "question": "第 10 題　The ______ costume party, held every September, is one of the biggest events of the school year.", "options": ["initial", "annual", "evident", "occasional"], "answer": 1, "answerLabel": "B", "source": "108 學測｜詞彙｜第 10 題", "explanation": "每年九月舉行的「年度」變裝派對：annual。initial 最初的、evident 明顯的、occasional 偶爾的。", "explanationSource": "own", "section": "108年"}, {"id": 171, "question": "第 11 題　In a job interview, attitude and personality are usually important ______ that influence the decision of the interviewers.", "options": ["factors", "outcomes", "missions", "identities"], "answer": 0, "answerLabel": "A", "source": "108 學測｜詞彙｜第 11 題", "explanation": "態度與個性是影響面試官決定的重要「因素」：factors。outcome 結果、mission 任務、identity 身分。", "explanationSource": "own", "section": "108年"}, {"id": 172, "question": "第 12 題　The snow-capped mountain is described so ______ in the book that the scene seems to come alive in front of the reader’s eyes.", "options": ["distantly", "meaningfully", "cheerfully", "vividly"], "answer": 3, "answerLabel": "D", "source": "108 學測｜詞彙｜第 12 題", "explanation": "描述得如此「生動」，場景彷彿活現在眼前：vividly。distantly 遙遠地、meaningfully 有意義地、cheerfully 愉快地。", "explanationSource": "own", "section": "108年"}, {"id": 173, "question": "第 13 題　Surrounded by flowers blooming and birds ______ merrily, the Wangs had a good time hiking in the national park.", "options": ["napping", "scooping", "flipping", "chirping"], "answer": 3, "answerLabel": "D", "source": "108 學測｜詞彙｜第 13 題", "explanation": "花開、鳥兒歡快地「鳴叫」：chirping。nap 小睡、scoop 挖取、flip 翻轉。", "explanationSource": "own", "section": "108年"}, {"id": 174, "question": "第 14 題　It is essential for us to maintain constant ______ with our friends to ensure that we have someone to talk to in times of need.", "options": ["benefit", "contact", "gesture", "favor"], "answer": 1, "answerLabel": "B", "source": "108 學測｜詞彙｜第 14 題", "explanation": "與朋友保持經常的「聯絡」，需要時才有人可以談：maintain contact with。benefit 利益、gesture 手勢、favor 恩惠。", "explanationSource": "own", "section": "108年"}, {"id": 175, "question": "第 15 題　The young generation in this country has shown less interest in factory work and other ______ labor jobs, such as house construction and fruit picking.", "options": ["causal", "durable", "manual", "violent"], "answer": 2, "answerLabel": "C", "source": "108 學測｜詞彙｜第 15 題", "explanation": "工廠工作、蓋房子、採水果都是「體力」勞動：manual labor。causal 因果的、durable 耐用的、violent 暴力的。", "explanationSource": "own", "section": "108年"}, {"id": 176, "question": "【綜合測驗 第 16–20 題】\n@@108-16–20@@\n\n▶ 第 16 題　請選出 __16__ 的最佳答案", "options": ["leads to", "brings out", "stems from", "comes across"], "answer": 2, "answerLabel": "C", "source": "108 學測｜綜合測驗｜第 16 題", "explanation": "有人認為愚人節「源自」新曆法的採用：stems from。lead to 導致、bring out 帶出、come across 偶遇。", "explanationSource": "own", "section": "108年"}, {"id": 177, "question": "【綜合測驗 第 16–20 題】\n@@108-16–20@@\n\n▶ 第 17 題　請選出 __17__ 的最佳答案", "options": ["continue", "continuing", "to continue", "continued"], "answer": 3, "answerLabel": "D", "source": "108 學測｜綜合測驗｜第 17 題", "explanation": "many people … continued to celebrate：主要動詞用過去式 continued；中間 either refusing … or not having heard 為分詞片語。", "explanationSource": "own", "section": "108年"}, {"id": 178, "question": "【綜合測驗 第 16–20 題】\n@@108-16–20@@\n\n▶ 第 18 題　請選出 __18__ 的最佳答案", "options": ["Precisely", "Eventually", "Additionally", "Literally"], "answer": 1, "answerLabel": "B", "source": "108 學測｜綜合測驗｜第 18 題", "explanation": "「最終」這個習俗傳遍歐洲和世界：Eventually。Precisely 精確地、Additionally 此外、Literally 字面上。", "explanationSource": "own", "section": "108年"}, {"id": 179, "question": "【綜合測驗 第 16–20 題】\n@@108-16–20@@\n\n▶ 第 19 題　請選出 __19__ 的最佳答案", "options": ["come to an end", "go to great lengths", "put in service", "hold in store"], "answer": 1, "answerLabel": "B", "source": "108 學測｜綜合測驗｜第 19 題", "explanation": "人們「不遺餘力」製造精心設計的惡作劇：go to great lengths to。come to an end 結束、put in service 投入使用、hold in store 準備著。", "explanationSource": "own", "section": "108年"}, {"id": 180, "question": "【綜合測驗 第 16–20 題】\n@@108-16–20@@\n\n▶ 第 20 題　請選出 __20__ 的最佳答案", "options": ["fictional", "essential", "ancient", "subjective"], "answer": 0, "answerLabel": "A", "source": "108 學測｜綜合測驗｜第 20 題", "explanation": "媒體製作「虛構的」報導來愚弄觀眾，如瑞士農民收成義大利麵：fictional。essential 必要的、ancient 古老的、subjective 主觀的。", "explanationSource": "own", "section": "108年"}, {"id": 181, "question": "【綜合測驗 第 21–25 題】\n@@108-21–25@@\n\n▶ 第 21 題　請選出 __21__ 的最佳答案", "options": ["bring along", "turn out", "account for", "serve as"], "answer": 3, "answerLabel": "D", "source": "108 學測｜綜合測驗｜第 21 題", "explanation": "鳳梨葉可以「作為」皮革的替代品：serve as。bring along 帶來、turn out 結果是、account for 說明。", "explanationSource": "own", "section": "108年"}, {"id": 182, "question": "【綜合測驗 第 21–25 題】\n@@108-21–25@@\n\n▶ 第 22 題　請選出 __22__ 的最佳答案", "options": ["wove", "weaving", "woven", "to weave"], "answer": 2, "answerLabel": "C", "source": "108 學測｜綜合測驗｜第 22 題", "explanation": "a traditional Filipino shirt woven together with the fibers：過去分詞 woven（被編織）修飾 shirt。", "explanationSource": "own", "section": "108年"}, {"id": 183, "question": "【綜合測驗 第 21–25 題】\n@@108-21–25@@\n\n▶ 第 23 題　請選出 __23__ 的最佳答案", "options": ["else", "those", "other", "such"], "answer": 2, "answerLabel": "C", "source": "108 學測｜綜合測驗｜第 23 題", "explanation": "可用來製作包包、鞋子和「其他」紡織品：other textile products。", "explanationSource": "own", "section": "108年"}, {"id": 184, "question": "【綜合測驗 第 21–25 題】\n@@108-21–25@@\n\n▶ 第 24 題　請選出 __24__ 的最佳答案", "options": ["advantages", "considerations", "opportunities", "responsibilities"], "answer": 0, "answerLabel": "A", "source": "108 學測｜綜合測驗｜第 24 題", "explanation": "與真皮和合成皮相比，這種環保皮革對環境有明顯的「優點」：advantages，後文列舉化學品少、碳足跡小。", "explanationSource": "own", "section": "108年"}, {"id": 185, "question": "【綜合測驗 第 21–25 題】\n@@108-21–25@@\n\n▶ 第 25 題　請選出 __25__ 的最佳答案", "options": ["Due to", "Nothing but", "In contrast to", "On behalf of"], "answer": 0, "answerLabel": "A", "source": "108 學測｜綜合測驗｜第 25 題", "explanation": "「由於」成本低，已被許多時尚公司採用：Due to。Nothing but 只不過、In contrast to 相較於、On behalf of 代表。", "explanationSource": "own", "section": "108年"}, {"id": 186, "question": "【綜合測驗 第 26–30 題】\n@@108-26–30@@\n\n▶ 第 26 題　請選出 __26__ 的最佳答案", "options": ["beyond", "into", "from", "with"], "answer": 1, "answerLabel": "B", "source": "108 學測｜綜合測驗｜第 26 題", "explanation": "相機與顯示系統被「內建到」眼鏡裡：built into。", "explanationSource": "own", "section": "108年"}, {"id": 187, "question": "【綜合測驗 第 26–30 題】\n@@108-26–30@@\n\n▶ 第 27 題　請選出 __27__ 的最佳答案", "options": ["this", "that", "some", "other"], "answer": 1, "answerLabel": "B", "source": "108 學測｜綜合測驗｜第 27 題", "explanation": "食物的影像被放大，「而」手的影像（the size of their hand）維持正常：that 代替前面的 the size，避免重複。", "explanationSource": "own", "section": "108年"}, {"id": 188, "question": "【綜合測驗 第 26–30 題】\n@@108-26–30@@\n\n▶ 第 28 題　請選出 __28__ 的最佳答案", "options": ["beforehand", "likewise", "instead", "therefore"], "answer": 3, "answerLabel": "D", "source": "108 學測｜綜合測驗｜第 28 題", "explanation": "食物看起來變大，大腦「因此」被騙以為吃得比實際多：therefore。beforehand 事先、likewise 同樣地、instead 反而。", "explanationSource": "own", "section": "108年"}, {"id": 189, "question": "【綜合測驗 第 26–30 題】\n@@108-26–30@@\n\n▶ 第 29 題　請選出 __29__ 的最佳答案", "options": ["prettier", "larger", "healthier", "tastier"], "answer": 3, "answerLabel": "D", "source": "108 學測｜綜合測驗｜第 29 題", "explanation": "用香味瓶讓人以為原味零食比實際「更美味」：tastier。後文說有人以為自己吃的是巧克力零食。", "explanationSource": "own", "section": "108年"}, {"id": 190, "question": "【綜合測驗 第 26–30 題】\n@@108-26–30@@\n\n▶ 第 30 題　請選出 __30__ 的最佳答案", "options": ["impress", "release", "bother", "attract"], "answer": 1, "answerLabel": "B", "source": "108 學測｜綜合測驗｜第 30 題", "explanation": "裝置可設定「釋放」使用者最喜歡的味道：release。impress 使印象深刻、bother 煩擾、attract 吸引。", "explanationSource": "own", "section": "108年"}, {"id": 191, "question": "第 1 題　Mangoes are a ______ fruit here in Taiwan; most of them reach their peak of sweetness in July.", "options": ["mature", "usual", "seasonal", "particular"], "answer": 2, "answerLabel": "C", "source": "107 學測｜詞彙｜第 1 題", "explanation": "七月最甜，表示芒果是「季節性」水果：seasonal。mature 成熟的、usual 平常的、particular 特定的。", "explanationSource": "own", "section": "107年"}, {"id": 192, "question": "第 2 題　Writing term papers and giving oral reports are typical course ______ for college students.", "options": ["requirements", "techniques", "situations", "principles"], "answer": 0, "answerLabel": "A", "source": "107 學測｜詞彙｜第 2 題", "explanation": "寫報告和口頭報告是大學課程的典型「要求」：requirements。technique 技巧、situation 情況、principle 原則。", "explanationSource": "own", "section": "107年"}, {"id": 193, "question": "第 3 題　If we work hard to ______ our dreams when we are young, we will not feel that we missed out on something when we get old.", "options": ["distribute", "fulfill", "convince", "monitor"], "answer": 1, "answerLabel": "B", "source": "107 學測｜詞彙｜第 3 題", "explanation": "年輕時努力「實現」夢想，老了才不會覺得錯過什麼：fulfill。distribute 分配、convince 說服、monitor 監控。", "explanationSource": "own", "section": "107年"}, {"id": 194, "question": "第 4 題　Few people will trust you if you continue making ______ promises and never make efforts to keep them.", "options": ["chilly", "liberal", "hollow", "definite"], "answer": 2, "answerLabel": "C", "source": "107 學測｜詞彙｜第 4 題", "explanation": "一直做「空洞的」承諾又不守信，沒人會信任你：hollow promises。chilly 寒冷的、liberal 自由的、definite 明確的。", "explanationSource": "own", "section": "107年"}, {"id": 195, "question": "第 5 題　Becky ______ her ankle while she was playing tennis last week. Now it still hurts badly.", "options": ["slipped", "dumped", "twisted", "recovered"], "answer": 2, "answerLabel": "C", "source": "107 學測｜詞彙｜第 5 題", "explanation": "打網球「扭傷」腳踝，現在還很痛：twisted her ankle。slip 滑倒、dump 丟棄、recover 恢復。", "explanationSource": "own", "section": "107年"}, {"id": 196, "question": "第 6 題　Research shows that men and women usually think differently. For example, they have quite different ______ about what marriage means in their life.", "options": ["decisions", "beliefs", "styles", "degrees"], "answer": 1, "answerLabel": "B", "source": "107 學測｜詞彙｜第 6 題", "explanation": "男女對婚姻意義有不同的「看法、信念」：beliefs。decision 決定、style 風格、degree 程度。", "explanationSource": "own", "section": "107年"}, {"id": 197, "question": "第 7 題　The new manager is very ______. For instance, the employees are given much shorter deadlines for the same tasks than before.", "options": ["persuasive", "tolerable", "suspicious", "demanding"], "answer": 3, "answerLabel": "D", "source": "107 學測｜詞彙｜第 7 題", "explanation": "同樣的工作期限卻縮短很多，表示經理很「嚴苛、要求高」：demanding。persuasive 有說服力的、tolerable 可忍受的、suspicious 可疑的。", "explanationSource": "own", "section": "107年"}, {"id": 198, "question": "第 8 題　While the couple were looking ______ for their missing children, the kids were actually having fun in the woods nearby.", "options": ["anxiously", "precisely", "evidently", "distinctly"], "answer": 0, "answerLabel": "A", "source": "107 學測｜詞彙｜第 8 題", "explanation": "父母「焦急地」尋找失蹤的孩子：anxiously。precisely 精確地、evidently 明顯地、distinctly 清楚地。", "explanationSource": "own", "section": "107年"}, {"id": 199, "question": "第 9 題　After delivering a very powerful speech, the award winner was ______ by a group of fans asking for her signature.", "options": ["deposited", "reserved", "vanished", "surrounded"], "answer": 3, "answerLabel": "D", "source": "107 學測｜詞彙｜第 9 題", "explanation": "演講後被一群索取簽名的粉絲「包圍」：surrounded。deposit 存放、reserve 預訂、vanish 消失。", "explanationSource": "own", "section": "107年"}, {"id": 200, "question": "第 10 題　The interviewees were trying very hard to ______ the interviewers that they were very capable and should be given the job.", "options": ["credit", "impress", "relieve", "acquire"], "answer": 1, "answerLabel": "B", "source": "107 學測｜詞彙｜第 10 題", "explanation": "面試者努力「讓面試官印象深刻」以得到工作：impress。credit 歸功、relieve 緩解、acquire 獲得。", "explanationSource": "own", "section": "107年"}, {"id": 201, "question": "第 11 題　After the first snow of the year, the entire grassland disappeared under a ______ of snow.", "options": ["flake", "blossom", "blanket", "flash"], "answer": 2, "answerLabel": "C", "source": "107 學測｜詞彙｜第 11 題", "explanation": "整片草原消失在一「層」雪之下：a blanket of snow。flake 雪花、blossom 花、flash 閃光。", "explanationSource": "own", "section": "107年"}, {"id": 202, "question": "第 12 題　Peter likes books with wide ______, which provide him with enough space to write notes.", "options": ["angles", "margins", "exceptions", "limitations"], "answer": 1, "answerLabel": "B", "source": "107 學測｜詞彙｜第 12 題", "explanation": "書頁「邊緣空白」寬才有空間寫筆記：margins。angle 角度、exception 例外、limitation 限制。", "explanationSource": "own", "section": "107年"}, {"id": 203, "question": "第 13 題　At the beginning of the semester, the teacher told the students that late assignments would receive a low grade as a ______.", "options": ["hardship", "comment", "bargain", "penalty"], "answer": 3, "answerLabel": "D", "source": "107 學測｜詞彙｜第 13 題", "explanation": "遲交作業會得低分作為「處罰」：penalty。hardship 艱難、comment 評論、bargain 便宜貨。", "explanationSource": "own", "section": "107年"}, {"id": 204, "question": "第 14 題　Various studies have been ______ in this hospital to explore the link between a high-fat diet and cancer.", "options": ["conducted", "confirmed", "implied", "improved"], "answer": 0, "answerLabel": "A", "source": "107 學測｜詞彙｜第 14 題", "explanation": "醫院「進行」多項研究探討高脂飲食與癌症的關聯：conduct studies。confirm 確認、imply 暗示、improve 改善。", "explanationSource": "own", "section": "107年"}, {"id": 205, "question": "第 15 題　Intense, fast-moving fires raged across much of California last week. The ______ firestorm has claimed the lives of thirty people.", "options": ["efficient", "reliable", "massive", "adequate"], "answer": 2, "answerLabel": "C", "source": "107 學測｜詞彙｜第 15 題", "explanation": "「大規模的」火災奪走三十人性命：massive。efficient 有效率的、reliable 可靠的、adequate 足夠的。", "explanationSource": "own", "section": "107年"}, {"id": 206, "question": "【綜合測驗 第 16–20 題】\n@@107-16–20@@\n\n▶ 第 16 題　請選出 __16__ 的最佳答案", "options": ["more", "less", "better", "worse"], "answer": 1, "answerLabel": "B", "source": "107 學測｜綜合測驗｜第 16 題", "explanation": "creativity is less a sign of rare genius than a natural human potential：「與其說是…不如說是…」，創造力不是少數人的天賦而是人類的潛能，呼應前句 However。", "explanationSource": "own", "section": "107年"}, {"id": 207, "question": "【綜合測驗 第 16–20 題】\n@@107-16–20@@\n\n▶ 第 17 題　請選出 __17__ 的最佳答案", "options": ["spark", "carve", "drill", "grind"], "answer": 0, "answerLabel": "A", "source": "107 學測｜綜合測驗｜第 17 題", "explanation": "休息能「激發」靈感或新點子：spark。carve 雕刻、drill 鑽、grind 磨。", "explanationSource": "own", "section": "107年"}, {"id": 208, "question": "【綜合測驗 第 16–20 題】\n@@107-16–20@@\n\n▶ 第 18 題　請選出 __18__ 的最佳答案", "options": ["refer to", "answer for", "take part in", "put up with"], "answer": 2, "answerLabel": "C", "source": "107 學測｜綜合測驗｜第 18 題", "explanation": "公司鼓勵員工「參與」各種放鬆活動，如打彈珠台、校園散步：take part in。refer to 提到、answer for 負責、put up with 忍受。", "explanationSource": "own", "section": "107年"}, {"id": 209, "question": "【綜合測驗 第 16–20 題】\n@@107-16–20@@\n\n▶ 第 19 題　請選出 __19__ 的最佳答案", "options": ["if", "but", "where", "which"], "answer": 2, "answerLabel": "C", "source": "107 學測｜綜合測驗｜第 19 題", "explanation": "the mind turns inward, where it can subconsciously puzzle over …：where 引導形容詞子句，補充說明在這種（內省的）狀態中可以潛意識思考。", "explanationSource": "own", "section": "107年"}, {"id": 210, "question": "【綜合測驗 第 16–20 題】\n@@107-16–20@@\n\n▶ 第 20 題　請選出 __20__ 的最佳答案", "options": ["into", "without", "under", "beyond"], "answer": 3, "answerLabel": "D", "source": "107 學測｜綜合測驗｜第 20 題", "explanation": "突破常發生在人們「超出」日常慣例或專業領域之時：venture beyond。", "explanationSource": "own", "section": "107年"}, {"id": 211, "question": "【綜合測驗 第 21–25 題】\n@@107-21–25@@\n\n▶ 第 21 題　請選出 __21__ 的最佳答案", "options": ["For", "While", "In case", "As long as"], "answer": 1, "answerLabel": "B", "source": "107 學測｜綜合測驗｜第 21 題", "explanation": "「雖然」吸油特性對衛生不太好，對環境卻很棒：While 表對比。", "explanationSource": "own", "section": "107年"}, {"id": 212, "question": "【綜合測驗 第 21–25 題】\n@@107-21–25@@\n\n▶ 第 22 題　請選出 __22__ 的最佳答案", "options": ["equipment", "ingredient", "product", "resource"], "answer": 3, "answerLabel": "D", "source": "107 學測｜綜合測驗｜第 22 題", "explanation": "人類頭髮供應無限，是終極的可再生「資源」：renewable resource。equipment 設備、ingredient 成分、product 產品。", "explanationSource": "own", "section": "107年"}, {"id": 213, "question": "【綜合測驗 第 21–25 題】\n@@107-21–25@@\n\n▶ 第 23 題　請選出 __23__ 的最佳答案", "options": ["get away with", "clean up after", "run out of", "look down upon"], "answer": 1, "answerLabel": "B", "source": "107 學測｜綜合測驗｜第 23 題", "explanation": "收集頭髮和毛皮來「清理」每年發生的油污事故：clean up after。get away with 逃過、run out of 用完、look down upon 輕視。", "explanationSource": "own", "section": "107年"}, {"id": 214, "question": "【綜合測驗 第 21–25 題】\n@@107-21–25@@\n\n▶ 第 24 題　請選出 __24__ 的最佳答案", "options": ["pollute", "polluting", "polluted", "pollution"], "answer": 2, "answerLabel": "C", "source": "107 學測｜綜合測驗｜第 24 題", "explanation": "送到「被污染的」水域吸油：polluted waters（過去分詞表被動）。", "explanationSource": "own", "section": "107年"}, {"id": 215, "question": "【綜合測驗 第 21–25 題】\n@@107-21–25@@\n\n▶ 第 25 題　請選出 __25__ 的最佳答案", "options": ["unneeded", "overthrown", "excluded", "disconnected"], "answer": 0, "answerLabel": "A", "source": "107 學測｜綜合測驗｜第 25 題", "explanation": "每天剪下的大量頭髮毛皮本來是「不需要的」，組織協助回收：unneeded。overthrown 被推翻、excluded 被排除、disconnected 斷開。", "explanationSource": "own", "section": "107年"}, {"id": 216, "question": "【綜合測驗 第 26–30 題】\n@@107-26–30@@\n\n▶ 第 26 題　請選出 __26__ 的最佳答案", "options": ["what", "why", "when", "which"], "answer": 0, "answerLabel": "A", "source": "107 學測｜綜合測驗｜第 26 題", "explanation": "know that they are dreaming and what they are dreaming of：what 引導名詞子句，作 dreaming of 的受詞。", "explanationSource": "own", "section": "107年"}, {"id": 217, "question": "【綜合測驗 第 26–30 題】\n@@107-26–30@@\n\n▶ 第 27 題　請選出 __27__ 的最佳答案", "options": ["apart", "absent", "alone", "asleep"], "answer": 3, "answerLabel": "D", "source": "107 學測｜綜合測驗｜第 27 題", "explanation": "清醒夢時身體「睡著」，白日夢時身體是醒的：asleep 與 awake 對比。", "explanationSource": "own", "section": "107年"}, {"id": 218, "question": "【綜合測驗 第 26–30 題】\n@@107-26–30@@\n\n▶ 第 28 題　請選出 __28__ 的最佳答案", "options": ["related to", "aside from", "more than", "nothing but"], "answer": 2, "answerLabel": "C", "source": "107 學測｜綜合測驗｜第 28 題", "explanation": "清醒夢「不只是」做一個清楚的夢，更是運用大腦潛能的機會：more than。aside from 除了、nothing but 只不過。", "explanationSource": "own", "section": "107年"}, {"id": 219, "question": "【綜合測驗 第 26–30 題】\n@@107-26–30@@\n\n▶ 第 29 題　請選出 __29__ 的最佳答案", "options": ["In other words", "By no means", "At any cost", "On the contrary"], "answer": 0, "answerLabel": "A", "source": "107 學測｜綜合測驗｜第 29 題", "explanation": "前句說是運用大腦潛能的機會，「換句話說」是善用大腦深層區域的方法：In other words。", "explanationSource": "own", "section": "107年"}, {"id": 220, "question": "【綜合測驗 第 26–30 題】\n@@107-26–30@@\n\n▶ 第 30 題　請選出 __30__ 的最佳答案", "options": ["such as", "regardless of", "with respect to", "on behalf of"], "answer": 1, "answerLabel": "B", "source": "107 學測｜綜合測驗｜第 30 題", "explanation": "「不論」你現實生活中是誰，睡著時都可以當超級英雄：regardless of。such as 例如、with respect to 關於、on behalf of 代表。", "explanationSource": "own", "section": "107年"}, {"id": 221, "question": "第 1 題　John’s clock is not functioning ______. The alarm rings even when it’s not set to go off.", "options": ["tenderly", "properly", "solidly", "favorably"], "answer": 1, "answerLabel": "B", "source": "106 學測｜詞彙｜第 1 題", "explanation": "沒設定也會響，表示時鐘運作「不正常」：properly 正常地。tenderly 溫柔地、solidly 堅固地、favorably 有利地。", "explanationSource": "own", "section": "106年"}, {"id": 222, "question": "第 2 題　Michael has decided to ______ a career in physics and has set his mind on becoming a professor.", "options": ["pursue", "swear", "reserve", "draft"], "answer": 0, "answerLabel": "A", "source": "106 學測｜詞彙｜第 2 題", "explanation": "決定「追求」物理學的職涯，立志當教授：pursue a career。swear 發誓、reserve 保留、draft 起草。", "explanationSource": "own", "section": "106年"}, {"id": 223, "question": "第 3 題　Peter plans to hike in a ______ part of Africa, where he might not meet another human being for days.", "options": ["native", "tricky", "remote", "vacant"], "answer": 2, "answerLabel": "C", "source": "106 學測｜詞彙｜第 3 題", "explanation": "好幾天遇不到人的地方，是非洲「偏遠的」地區：remote。native 本地的、tricky 棘手的、vacant 空的。", "explanationSource": "own", "section": "106年"}, {"id": 224, "question": "第 4 題　People in this community tend to ______ with the group they belong to, and often put group interests before personal ones.", "options": ["appoint", "eliminate", "occupy", "identify"], "answer": 3, "answerLabel": "D", "source": "106 學測｜詞彙｜第 4 題", "explanation": "與所屬群體「認同」，把團體利益放在個人之前：identify with。appoint 任命、eliminate 消除、occupy 占據。", "explanationSource": "own", "section": "106年"}, {"id": 225, "question": "第 5 題　I mistook the man for a well-known actor and asked for his autograph; it was really ______.", "options": ["relaxing", "embarrassing", "appealing", "defending"], "answer": 1, "answerLabel": "B", "source": "106 學測｜詞彙｜第 5 題", "explanation": "把人誤認為明星還要簽名，真「尷尬」：embarrassing。relaxing 放鬆的、appealing 吸引人的、defending 防衛的。", "explanationSource": "own", "section": "106年"}, {"id": 226, "question": "第 6 題　After spending most of her salary on rent and food, Amelia ______ had any money left for entertainment and other expenses.", "options": ["barely", "fairly", "merely", "readily"], "answer": 0, "answerLabel": "A", "source": "106 學測｜詞彙｜第 6 題", "explanation": "薪水大多花在房租和食物上，「幾乎沒有」錢剩下：barely。fairly 相當、merely 僅僅、readily 容易地。", "explanationSource": "own", "section": "106年"}, {"id": 227, "question": "第 7 題　In the Bermuda Triangle, a region in the western part of the North Atlantic Ocean, some airplanes and ships were reported to have mysteriously disappeared without a ______.", "options": ["guide", "trace", "code", "print"], "answer": 1, "answerLabel": "B", "source": "106 學測｜詞彙｜第 7 題", "explanation": "飛機船隻神祕消失得「無影無蹤」：without a trace。guide 指南、code 代碼、print 印痕。", "explanationSource": "own", "section": "106年"}, {"id": 228, "question": "第 8 題　Shouting greetings and waving a big sign, Tony ______ the passing shoppers to visit his shop and buy the freshly baked bread.", "options": ["accessed", "edited", "imposed", "urged"], "answer": 3, "answerLabel": "D", "source": "106 學測｜詞彙｜第 8 題", "explanation": "大聲招呼、揮舞招牌，「催促」路過的顧客進店：urged。access 存取、edit 編輯、impose 強加。", "explanationSource": "own", "section": "106年"}, {"id": 229, "question": "第 9 題　With a continuous 3 km stretch of golden sand, the beach attracts artists around the world each summer to create amazing ______ with its fine soft sand.", "options": ["constitutions", "objections", "sculptures", "adventures"], "answer": 2, "answerLabel": "C", "source": "106 學測｜詞彙｜第 9 題", "explanation": "藝術家用細沙創作驚人的「雕塑」：sand sculptures。constitution 憲法、objection 反對、adventure 冒險。", "explanationSource": "own", "section": "106年"}, {"id": 230, "question": "第 10 題　The clouds parted and a ______ of light fell on the church, through the windows, and onto the floor.", "options": ["dip", "beam", "spark", "path"], "answer": 1, "answerLabel": "B", "source": "106 學測｜詞彙｜第 10 題", "explanation": "雲散開，一「道」光射進教堂：a beam of light。dip 浸、spark 火花、path 路徑。", "explanationSource": "own", "section": "106年"}, {"id": 231, "question": "第 11 題　Instead of a gift, Tim’s grandmother always ______ some money in the birthday card she gave him.", "options": ["enclosed", "installed", "preserved", "rewarded"], "answer": 0, "answerLabel": "A", "source": "106 學測｜詞彙｜第 11 題", "explanation": "奶奶總在生日卡裡「附上」一些錢：enclosed。install 安裝、preserve 保存、reward 獎勵。", "explanationSource": "own", "section": "106年"}, {"id": 232, "question": "第 12 題　While winning a gold ______ is what every Olympic athlete dreams of, it becomes meaningless if it is achieved by cheating.", "options": ["signal", "glory", "medal", "profit"], "answer": 2, "answerLabel": "C", "source": "106 學測｜詞彙｜第 12 題", "explanation": "贏得奧運金「牌」是每個選手的夢想：gold medal。signal 信號、glory 榮耀、profit 利潤。", "explanationSource": "own", "section": "106年"}, {"id": 233, "question": "第 13 題　The thief went into the apartment building and stole some jewelry. He then ______ himself as a security guard and walked out the front gate.", "options": ["balanced", "calculated", "disguised", "registered"], "answer": 2, "answerLabel": "C", "source": "106 學測｜詞彙｜第 13 題", "explanation": "小偷把自己「偽裝」成警衛走出大門：disguised himself as。balance 平衡、calculate 計算、register 登記。", "explanationSource": "own", "section": "106年"}, {"id": 234, "question": "第 14 題　Due to numerous accidents that occurred while people were playing Pokémon GO, players were advised to be ______ of possible dangers in the environment.", "options": ["aware", "ashamed", "doubtful", "guilty"], "answer": 0, "answerLabel": "A", "source": "106 學測｜詞彙｜第 14 題", "explanation": "玩寶可夢時意外頻傳，提醒玩家要「注意」周遭危險：be aware of。ashamed 羞愧的、doubtful 懷疑的、guilty 有罪的。", "explanationSource": "own", "section": "106年"}, {"id": 235, "question": "第 15 題　Sherlock Holmes, a detective in a popular fiction series, has impressed readers with his amazing powers of ______ and his knowledge of trivial facts.", "options": ["innocence", "estimation", "assurance", "observation"], "answer": 3, "answerLabel": "D", "source": "106 學測｜詞彙｜第 15 題", "explanation": "福爾摩斯以驚人的「觀察」力著名：powers of observation。innocence 清白、estimation 估計、assurance 保證。", "explanationSource": "own", "section": "106年"}, {"id": 236, "question": "【綜合測驗 第 16–20 題】\n@@106-16–20@@\n\n▶ 第 16 題　請選出 __16__ 的最佳答案", "options": ["check out", "look into", "watch over", "see through"], "answer": 1, "answerLabel": "B", "source": "106 學測｜綜合測驗｜第 16 題", "explanation": "「看」鏡子發現眼瞼下方有紅點：look into the mirror 往鏡子裡看。check out 查看、watch over 看守、see through 看穿。", "explanationSource": "own", "section": "106年"}, {"id": 237, "question": "【綜合測驗 第 16–20 題】\n@@106-16–20@@\n\n▶ 第 17 題　請選出 __17__ 的最佳答案", "options": ["incidents", "measures", "symptoms", "explanations"], "answer": 2, "answerLabel": "C", "source": "106 學測｜綜合測驗｜第 17 題", "explanation": "疼痛和紅點是針眼的初期「症狀」：symptoms。incident 事件、measure 措施、explanation 解釋。", "explanationSource": "own", "section": "106年"}, {"id": 238, "question": "【綜合測驗 第 16–20 題】\n@@106-16–20@@\n\n▶ 第 18 題　請選出 __18__ 的最佳答案", "options": ["attracted", "contributed", "exposed", "transferred"], "answer": 3, "answerLabel": "D", "source": "106 學測｜綜合測驗｜第 18 題", "explanation": "揉鼻子再揉眼睛，細菌很容易「轉移」到眼睛：transferred to。attract 吸引、contribute 貢獻、expose 暴露。", "explanationSource": "own", "section": "106年"}, {"id": 239, "question": "【綜合測驗 第 16–20 題】\n@@106-16–20@@\n\n▶ 第 19 題　請選出 __19__ 的最佳答案", "options": ["As", "If", "Unless", "Although"], "answer": 3, "answerLabel": "D", "source": "106 學測｜綜合測驗｜第 19 題", "explanation": "「雖然」針眼看起來難看，通常無害：Although。", "explanationSource": "own", "section": "106年"}, {"id": 240, "question": "【綜合測驗 第 16–20 題】\n@@106-16–20@@\n\n▶ 第 20 題　請選出 __20__ 的最佳答案", "options": ["against", "among", "about", "after"], "answer": 0, "answerLabel": "A", "source": "106 學測｜綜合測驗｜第 20 題", "explanation": "把溫熱毛巾「貼」在眼瞼上輕壓：press … against。", "explanationSource": "own", "section": "106年"}, {"id": 241, "question": "【綜合測驗 第 21–25 題】\n@@106-21–25@@\n\n▶ 第 21 題　請選出 __21__ 的最佳答案", "options": ["except for", "provided with", "far from", "let alone"], "answer": 3, "answerLabel": "D", "source": "106 學測｜綜合測驗｜第 21 題", "explanation": "窮人連鞋子都不一定有，「更不用說」合腳的鞋子：let alone。except for 除了、provided with 提供、far from 遠非。", "explanationSource": "own", "section": "106年"}, {"id": 242, "question": "【綜合測驗 第 21–25 題】\n@@106-21–25@@\n\n▶ 第 22 題　請選出 __22__ 的最佳答案", "options": ["get done", "get lost", "make do", "make believe"], "answer": 2, "answerLabel": "C", "source": "106 學測｜綜合測驗｜第 22 題", "explanation": "孩子只能「湊合著」穿太小的鞋：make do with。get done 完成、get lost 迷路、make believe 假裝。", "explanationSource": "own", "section": "106年"}, {"id": 243, "question": "【綜合測驗 第 21–25 題】\n@@106-21–25@@\n\n▶ 第 23 題　請選出 __23__ 的最佳答案", "options": ["adjust", "explore", "insert", "overlook"], "answer": 0, "answerLabel": "A", "source": "106 學測｜綜合測驗｜第 23 題", "explanation": "這款鞋讓孩子隨腳的成長「調整」鞋子尺寸：adjust。explore 探索、insert 插入、overlook 忽略。", "explanationSource": "own", "section": "106年"}, {"id": 244, "question": "【綜合測驗 第 21–25 題】\n@@106-21–25@@\n\n▶ 第 24 題　請選出 __24__ 的最佳答案", "options": ["by", "in", "from", "down"], "answer": 1, "answerLabel": "B", "source": "106 學測｜綜合測驗｜第 24 題", "explanation": "They come in two sizes 有兩種尺寸：come in + 尺寸/顏色。", "explanationSource": "own", "section": "106年"}, {"id": 245, "question": "【綜合測驗 第 21–25 題】\n@@106-21–25@@\n\n▶ 第 25 題　請選出 __25__ 的最佳答案", "options": ["whether", "while", "with", "for"], "answer": 1, "answerLabel": "B", "source": "106 學測｜綜合測驗｜第 25 題", "explanation": "腳跟和腳尖的帶子控制長度，「而」兩側的帶子調整寬度：while 表對比。", "explanationSource": "own", "section": "106年"}, {"id": 246, "question": "【綜合測驗 第 26–30 題】\n@@106-26–30@@\n\n▶ 第 26 題　請選出 __26__ 的最佳答案", "options": ["At most", "In contrast", "Literally", "Accordingly"], "answer": 3, "answerLabel": "D", "source": "106 學測｜綜合測驗｜第 26 題", "explanation": "天氣影響心情，「因此」許多人認為壞天氣會降低生產力：Accordingly。At most 最多、In contrast 相反地、Literally 字面上。", "explanationSource": "own", "section": "106年"}, {"id": 247, "question": "【綜合測驗 第 26–30 題】\n@@106-26–30@@\n\n▶ 第 27 題　請選出 __27__ 的最佳答案", "options": ["gap", "link", "clue", "ratio"], "answer": 0, "answerLabel": "A", "source": "106 學測｜綜合測驗｜第 27 題", "explanation": "這種看法與天氣對工作表現的實際影響之間有很大的「落差」：gap。後文說壞天氣時其實更專注。link 關聯、clue 線索、ratio 比率。", "explanationSource": "own", "section": "106年"}, {"id": 248, "question": "【綜合測驗 第 26–30 題】\n@@106-26–30@@\n\n▶ 第 28 題　請選出 __28__ 的最佳答案", "options": ["out of", "as well as", "in case of", "due to"], "answer": 1, "answerLabel": "B", "source": "106 學測｜綜合測驗｜第 28 題", "explanation": "實驗室資料「以及」對日本銀行的實地觀察：as well as。out of 出於、in case of 以防、due to 由於。", "explanationSource": "own", "section": "106年"}, {"id": 249, "question": "【綜合測驗 第 26–30 題】\n@@106-26–30@@\n\n▶ 第 29 題　請選出 __29__ 的最佳答案", "options": ["break off", "approve of", "engage in", "take over"], "answer": 2, "answerLabel": "C", "source": "106 學測｜綜合測驗｜第 29 題", "explanation": "天氣不好時，人們不會想著下班後可以「從事」的活動：engage in。break off 中斷、approve of 贊成、take over 接管。", "explanationSource": "own", "section": "106年"}, {"id": 250, "question": "【綜合測驗 第 26–30 題】\n@@106-26–30@@\n\n▶ 第 30 題　請選出 __30__ 的最佳答案", "options": ["reform", "lower", "switch", "demand"], "answer": 1, "answerLabel": "B", "source": "106 學測｜綜合測驗｜第 30 題", "explanation": "戶外活動的照片會讓員工分心，因而「降低」生產力：lower。reform 改革、switch 切換、demand 要求。", "explanationSource": "own", "section": "106年"}, {"id": 251, "question": "第 1 題　Posters of the local rock band were displayed in store windows to promote the sale of their ______ tickets.", "options": ["journey", "traffic", "concert", "record"], "answer": 2, "answerLabel": "C", "source": "105 學測｜詞彙｜第 1 題", "explanation": "搖滾樂團的海報用來促銷「演唱會」門票：concert tickets。journey 旅程、traffic 交通、record 唱片。", "explanationSource": "own", "section": "105年"}, {"id": 252, "question": "第 2 題　Maria didn’t want to deliver the bad news to David about his failing the job interview. She herself was quite ______ about it.", "options": ["awful", "drowsy", "tragic", "upset"], "answer": 3, "answerLabel": "D", "source": "105 學測｜詞彙｜第 2 題", "explanation": "要傳達壞消息，她自己也很「難過」：upset。awful 糟糕的、drowsy 昏昏欲睡的、tragic 悲劇的（修飾事情）。", "explanationSource": "own", "section": "105年"}, {"id": 253, "question": "第 3 題　The newcomer speaks with a strong Irish ______; he must be from Ireland.", "options": ["accent", "identity", "gratitude", "signature"], "answer": 0, "answerLabel": "A", "source": "105 學測｜詞彙｜第 3 題", "explanation": "說話帶有濃厚的愛爾蘭「口音」：accent。identity 身分、gratitude 感謝、signature 簽名。", "explanationSource": "own", "section": "105年"}, {"id": 254, "question": "第 4 題　Although Maggie has been physically ______ to her wheelchair since the car accident, she does not limit herself to indoor activities.", "options": ["ceased", "committed", "confined", "conveyed"], "answer": 2, "answerLabel": "C", "source": "105 學測｜詞彙｜第 4 題", "explanation": "車禍後身體「受限於」輪椅：be confined to。cease 停止、commit 投入、convey 傳達。", "explanationSource": "own", "section": "105年"}, {"id": 255, "question": "第 5 題　All passengers riding in cars are required to fasten their seatbelts in order to reduce the risk of ______ in case of an accident.", "options": ["injury", "offense", "sacrifice", "victim"], "answer": 0, "answerLabel": "A", "source": "105 學測｜詞彙｜第 5 題", "explanation": "繫安全帶以降低意外時「受傷」的風險：risk of injury。offense 冒犯、sacrifice 犧牲、victim 受害者。", "explanationSource": "own", "section": "105年"}, {"id": 256, "question": "第 6 題　The principal of this school is a man of exceptional ______. He sets aside a part of his salary for a scholarship fund for children from needy families.", "options": ["security", "maturity", "facility", "generosity"], "answer": 3, "answerLabel": "D", "source": "105 學測｜詞彙｜第 6 題", "explanation": "校長拿出部分薪水設立獎學金，表現出非凡的「慷慨」：generosity。security 安全、maturity 成熟、facility 設施。", "explanationSource": "own", "section": "105年"}, {"id": 257, "question": "第 7 題　The science teacher always ______ the use of the laboratory equipment before she lets her students use it on their own.", "options": ["tolerates", "associates", "demonstrates", "exaggerates"], "answer": 2, "answerLabel": "C", "source": "105 學測｜詞彙｜第 7 題", "explanatio
