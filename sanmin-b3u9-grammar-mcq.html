ithout human involvement.","options":{"A":"However","B":"What's more","C":"What's worse","D":"Therefore"},"answer":"B","sentence":"Self-driving cars recognize road signs. What's more, they are capable of operating without human involvement."},{"number":35,"prompt":"The new principal is trying to increase the _____ of students at this school.","options":{"A":"number","B":"amount","C":"sum","D":"deal"},"answer":"A","sentence":"The new principal is trying to increase the number of students at this school."},{"number":36,"prompt":"It is believed ______ a vegetarian diet can help stop global warming.","options":{"A":"that","B":"what","C":"in that","D":"in which"},"answer":"A","sentence":"It is believed that a vegetarian diet can help stop global warming."},{"number":37,"prompt":"Going camping on weekends _____ one of Amy's favorite activities.","options":{"A":"are","B":"be","C":"is","D":"being"},"answer":"C","sentence":"Going camping on weekends is one of Amy's favorite activities."},{"number":38,"prompt":"The man cannot stop ______, which has angered his wife and made her want to divorce him.","options":{"A":"drink","B":"drinking","C":"to drink","D":"in drinking"},"answer":"B","sentence":"The man cannot stop drinking, which has angered his wife and made her want to divorce him."},{"number":39,"prompt":"Global warming ______ the most serious problem for all mankind in the twenty-first century.","options":{"A":"is believing to be","B":"is believed to be","C":"is believing that it is","D":"is believed that it is"},"answer":"B","sentence":"Global warming is believed to be the most serious problem for all mankind in the twenty-first century."},{"number":40,"prompt":"Students should ______ more so that they can improve their comprehension.","options":{"A":"encourage reading","B":"be encouraged reading","C":"encourage to read","D":"be encouraged to read"},"answer":"D","sentence":"Students should be encouraged to read more so that they can improve their comprehension."},{"number":41,"prompt":"______ is believed that the polluted air will harm our lungs in the long run.","options":{"A":"It","B":"As","C":"That","D":"What"},"answer":"A","sentence":"It is believed that the polluted air will harm our lungs in the long run."},{"number":42,"prompt":"Much ______ Zoe's ______, her pet dog was found in a nearby park after it had been missing for over one month.","options":{"A":"for; surprise","B":"to; surprise","C":"for; surprising","D":"to; surprising"},"answer":"B","sentence":"Much to Zoe's surprise, her pet dog was found in a nearby park after it had been missing for over one month."},{"number":43,"prompt":"Some beverage shops provide straws ______ paper instead of plastic.","options":{"A":"making of","B":"making with","C":"made of","D":"made with"},"answer":"C","sentence":"Some beverage shops provide straws made of paper instead of plastic."},{"number":44,"prompt":"After the beach cleaning event, Oliver and his friends were shocked at the litter ______ on the beach.","options":{"A":"which dumped","B":"to be dumping","C":"dumped","D":"dumping"},"answer":"C","sentence":"After the beach cleaning event, Oliver and his friends were shocked at the litter dumped on the beach."},{"number":45,"prompt":"The actress spent more than one billion dollars to buying the watch, _____ is the most unbelievable thing I have never heard of.","options":{"A":"what","B":"where","C":"which","D":"how"},"answer":"C","sentence":"The actress spent more than one billion dollars to buying the watch, which is the most unbelievable thing I have never heard of."},{"number":46,"prompt":"The team ______ experts and scholars will head to the rainforests to carry out the study.","options":{"A":"consisted of","B":"consisting of","C":"composing of","D":"making up of"},"answer":"B","sentence":"The team consisting of experts and scholars will head to the rainforests to carry out the study."},{"number":47,"prompt":"It ______ that keeping early hours is good for health.","options":{"A":"believes","B":"will believe","C":"is believing","D":"is believed"},"answer":"D","sentence":"It is believed that keeping early hours is good for health."},{"number":48,"prompt":"We hurried to the sports shop, _____ find that it had closed.","options":{"A":"so as to","B":"in order to","C":"only to","D":"end up"},"answer":"C","sentence":"We hurried to the sports shop, only to find that it had closed."},{"number":49,"prompt":"______ is reported ______ oil prices will rise next Monday.","options":{"A":"It; that","B":"What; that","C":"It; is","D":"What; is"},"answer":"A","sentence":"It is reported that oil prices will rise next Monday."},{"number":50,"prompt":"It is _____ that some scientists have captured an image of a black hole.","options":{"A":"reported","B":"reporting","C":"reports","D":"to report"},"answer":"A","sentence":"It is reported that some scientists have captured an image of a black hole."},{"number":51,"prompt":"The patient was reported _______ negative for COVID-19. However, it may have been a false negative, as she has since become positive.","options":{"A":"to test","B":"being tested","C":"to have tested","D":"having been tested"},"answer":"C","sentence":"The patient was reported to have tested negative for COVID-19. However, it may have been a false negative, as she has since become positive."},{"number":52,"prompt":"______ the pouring rain, we stayed in the classroom for the whole day without playing outdoors.","options":{"A":"Because","B":"Due to","C":"In addition","D":"In addition to"},"answer":"B","sentence":"Due to the pouring rain, we stayed in the classroom for the whole day without playing outdoors."},{"number":53,"prompt":"______ fallen leaves, the garden looks terrible and messy.","options":{"A":"Covering","B":"Covered with","C":"To cover","D":"To be covered with"},"answer":"B","sentence":"Covered with fallen leaves, the garden looks terrible and messy."},{"number":54,"prompt":"After we watched TV for several hours, Mom asked us to stop _______ time and finish our homework before dinner.","options":{"A":"wastes","B":"wasting","C":"to waste","D":"wasted"},"answer":"B","sentence":"After we watched TV for several hours, Mom asked us to stop wasting time and finish our homework before dinner."},{"number":55,"prompt":"Jack just received his lawyer's license last week. _____, he got an offer from a famous law firm yesterday.","options":{"A":"In contrast","B":"In general","C":"What's more","D":"What's worse"},"answer":"C","sentence":"Jack just received his lawyer's license last week. What's more, he got an offer from a famous law firm yesterday."},{"number":56,"prompt":"Jimmy grew up in an orphanage, _____ made him become independent.","options":{"A":"which","B":"that","C":"where","D":"what"},"answer":"A","sentence":"Jimmy grew up in an orphanage, which made him become independent."},{"number":57,"prompt":"It _____ me that the elderly lady was my teacher in high school the day after I saw her on the street.","options":{"A":"hit on","B":"hit","C":"hit by","D":"had hit"},"answer":"B","sentence":"It hit me that the elderly lady was my teacher in high school the day after I saw her on the street."},{"number":58,"prompt":"_______ the manager will retire next month, and everyone is curious about who will be promoted.","options":{"A":"Saying that","B":"It is said to","C":"It is said that","D":"People are said that"},"answer":"C","sentence":"It is said that the manager will retire next month, and everyone is curious about who will be promoted."},{"number":59,"prompt":"It _____ me that I put my wallet at home when I was about to take it out.","options":{"A":"dawned","B":"dawned on","C":"dawned to","D":"had dawned"},"answer":"B","sentence":"It dawned on me that I put my wallet at home when I was about to take it out."},{"number":60,"prompt":"Larry works part-time after school because he wants to get some work experience. _____, he needs to help support the family.","options":{"A":"What's more","B":"Therefore","C":"However","D":"As a matter of fact"},"answer":"A","sentence":"Larry works part-time after school because he wants to get some work experience. What's more, he needs to help support the family."}]};const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let flat=[],index=0,wrong=new Map(),attempted=new Set(),firstTry=new Set(),recognition=null;
function flatten(){if(QUIZ.kind==='mcq')return QUIZ.data.map(x=>({...x,id:String(x.number)}));if(QUIZ.kind==='translation')return QUIZ.data.map(x=>({...x,id:String(x.number)}));return QUIZ.data.flatMap(set=>set.answers.map((answer,i)=>({id:`${set.set}-${i+1}`,set:set.set,passage:set.passage,options:set.options,answer,blank:i+1,sentence:set.sentences[i],structure:set.structure})))}
function fillPassage(text,answers,options){let out=text;answers.forEach((a,i)=>{const word=options[a];const n=i+1;const pats=[new RegExp(`__\\(?${n}\\)?__`),new RegExp(`__${n}__`),new RegExp(`　${n}　`),new RegExp(`\\(${n}\\)`)];for(const p of pats){if(p.test(out)){out=out.replace(p,word);break}}});return out.replace(/\n+/g,' ').replace(/\s+/g,' ').trim()}
function markBlank(text,n){const tag=`<span class="blank-now">Blank ${n}</span>`;let out=esc(text),done=false;for(const p of [new RegExp(`__\\(?${n}\\)?__`),new RegExp(`__${n}__`),new RegExp(`　${n}　`),new RegExp(`\\(${n}\\)`)]){if(!done&&p.test(out)){out=out.replace(p,tag);done=true}}return out}
function norm(s){return String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ')}function speak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}
function show(){try{recognition?.abort()}catch(e){}speechSynthesis?.cancel();const q=flat[index];$('#meta').textContent=`第 ${index+1} / ${flat.length} 題`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=((index+1)/flat.length*100)+'%';$('#feedback').className='feedback hidden';$('#reference').classList.add('hidden');$('#voiceBox').classList.add('hidden');$('#next').classList.add('hidden');$('#check').classList.toggle('hidden',QUIZ.kind!=='translation');$('#answerArea').innerHTML='';if(QUIZ.kind==='mcq')renderChoice(q.prompt,q.options);else if(QUIZ.kind==='translation')renderTranslation(q);else{$('#question').innerHTML=`<div class="passage">${markBlank(q.passage,q.blank)}</div>`;renderChoice(`第 ${q.blank} 格`,q.options)}}
function renderChoice(prompt,options){$('#question').innerHTML=QUIZ.kind==='mcq'?`<div class="prompt">${esc(prompt)}</div>`:$('#question').innerHTML;$('#answerArea').innerHTML='<div class="options">'+Object.entries(options).map(([k,v])=>`<button class="option" data-key="${k}"><b>${k}.</b> ${esc(v)}</button>`).join('')+'</div>';document.querySelectorAll('.option').forEach(b=>b.onclick=()=>checkChoice(b.dataset.key,b))}
function renderTranslation(q){let i=0;const rendered=esc(q.prompt).replace(/_{3,}/g,()=>`<input class="inline-input" data-i="${i++}" aria-label="第 ${i} 格答案">`);$('#question').innerHTML=`<div class="translation">${rendered}</div>`;setTimeout(()=>document.querySelector('.inline-input')?.focus(),0)}
function recordWrong(q,value){if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(value);$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
function checkChoice(key,button){const q=flat[index];attempted.add(q.id);if(key!==q.answer){recordWrong(q,key);button.classList.add('wrong');$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 不正確，請再試一次。';return}if(!wrong.has(q.id))firstTry.add(q.id);document.querySelectorAll('.option').forEach(b=>b.disabled=true);button.classList.add('correct');pass(q)}
function checkTranslation(){const q=flat[index],values=[...document.querySelectorAll('.inline-input')].map(x=>x.value);attempted.add(q.id);const ok=values.length===q.answers.length&&values.every((v,i)=>norm(v)===norm(q.answers[i]));if(!ok){recordWrong(q,values.join(' / '));$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 尚有空格不正確，請修正後再檢查。';return}if(!wrong.has(q.id))firstTry.add(q.id);document.querySelectorAll('.inline-input').forEach(x=>x.disabled=true);pass(q)}
function pass(q){$('#feedback').className='feedback ok';$('#feedback').textContent='✅ 正確！';$('#reference').classList.remove('hidden');$('#reference').textContent='完整句：'+q.sentence;$('#check').classList.add('hidden');$('#next').classList.remove('hidden');$('#voiceBox').classList.remove('hidden');$('#voiceTarget').textContent=q.sentence;$('#voiceResult').className='voice-result';$('#voiceResult').textContent='尚未進行朗讀評分。';speak(q.sentence)}
function similarity(a,b){a=norm(a).replace(/[^a-z0-9' ]/g,'').split(' ').filter(Boolean);b=norm(b).replace(/[^a-z0-9' ]/g,'').split(' ').filter(Boolean);const used=new Set;let hit=0;for(const w of a){const j=b.findIndex((x,i)=>x===w&&!used.has(i));if(j>=0){hit++;used.add(j)}}return Math.round(100*hit/Math.max(a.length,b.length,1))}
function startMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('#voiceResult').textContent='此瀏覽器不支援語音辨識，建議使用 Chrome。';return}recognition=new SR;recognition.lang='en-US';recognition.interimResults=false;$('#voiceResult').textContent='正在聆聽，請朗讀完整句子…';recognition.onresult=e=>{const said=e.results[0][0].transcript,target=flat[index].sentence,score=similarity(target,said);$('#voiceResult').className='voice-result '+(score>=80?'good':'retry');$('#voiceResult').textContent=`辨識：${said}\n正確率：${score}%`};recognition.onerror=e=>$('#voiceResult').textContent='語音辨識未完成：'+e.error;recognition.start()}
function finish(){try{recognition?.abort()}catch(e){}speechSynthesis?.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');const rows=[...wrong.values()];$('#summary').innerHTML=`<div class="stat">實際作答<b>${attempted.size}</b></div><div class="stat">一次答對<b>${firstTry.size}</b></div><div class="stat">曾答錯<b>${rows.length}</b></div>`;$('#wrongList').innerHTML=rows.length?rows.map((r,i)=>`<div class="wrong-card"><b>${i+1}. 第 ${esc(r.q.id)} 題</b><p>${esc(r.q.prompt||`第 ${r.q.blank} 格`)}</p><p>作答：${r.attempts.map(esc).join('；')}</p><p>答案：${esc(r.q.answer||r.q.answers.join(' / '))}</p></div>`).join(''):(attempted.size?'<div class="feedback ok">🎉 本輪全部一次答對！</div>':'<p class="muted">本輪尚未作答，因此不登錄成績。</p>');$('#download').classList.toggle('hidden',!rows.length);if(attempted.size)document.dispatchEvent(new CustomEvent('quiz-result-ready',{detail:{total:attempted.size,correct:firstTry.size,wrong:rows.length,mistakeQuestionNumbers:rows.map(r=>r.q.id).join(', ')}}))}
$('#check').onclick=checkTranslation;$('#next').onclick=()=>{if(++index>=flat.length)finish();else show()};$('#finish').onclick=finish;$('#restart').onclick=()=>location.reload();$('#speak').onclick=()=>speak(flat[index].sentence);$('#mic').onclick=startMic;$('#download').onclick=async()=>{const rows=[...wrong.values()];if(!rows.length)return;try{if(!window.docx)await new Promise((ok,fail)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js';s.onload=ok;s.onerror=fail;document.head.append(s)});const{Document,Packer,Paragraph,HeadingLevel}=window.docx,children=[new Paragraph({text:`三民普高 ${QUIZ.unit} ${QUIZ.title} 錯題紀錄`,heading:HeadingLevel.TITLE})];rows.forEach(r=>children.push(new Paragraph({text:`第 ${r.q.id} 題`,heading:HeadingLevel.HEADING_2}),new Paragraph(r.q.prompt||r.q.passage||''),new Paragraph('作答：'+r.attempts.join('；')),new Paragraph('答案：'+(r.q.answer||r.q.answers.join(' / ')))));const blob=await Packer.toBlob(new Document({sections:[{children}]})),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Sanmin_${QUIZ.unit}_${QUIZ.kind}_錯題.docx`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){alert('目前無法產生 DOCX，請稍後再試。')}};flat=flatten();show();
