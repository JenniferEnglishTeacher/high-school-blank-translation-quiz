<script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 8｜文法選擇（其他考點）","mode":"mcq","questions":[{"id":1,"question":"If Chris wins first place in this race, he ____________ a gold medal and a large sum of money.","options":["is awarded","will be awarded","was awarded","has been awarded"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"由If引導的子句動詞wins得知本句為未來可能發生的條件句，主要子句須使用未來式，故答案要選擇will be awarded","explanationSource":"source"},{"id":2,"question":"Those who are addicted to gambling may end up ____________ all of their money and even their families.","options":["losing","to lose","lost","lose"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"end up + V-ing 意指「最後處於；結果……」","explanationSource":"source"},{"id":3,"question":"The noises on the street grew ____________ as Stanley opened the window.","options":["loudly","being loud","loudness","louder"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"由於grow在此是連綴動詞，故後面要接形容詞louder當作主詞補語","explanationSource":"source"},{"id":4,"question":"____________ a typhoon is coming, Stanley decided to cancel the camping trip on the weekend.","options":["That","Which","Since","What"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"由句意可以看出前後有因果關係，而且兩句之間沒有連接詞，故可推知本題答案要選擇Since，表示「因為」","explanationSource":"source"},{"id":5,"question":"To our surprise, Ted’s new sports car is ____________ more expensive than a small apartment.","options":["very","even","so","too"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"由於空格後面是比較級，故可推知本格的答案是要修飾比較級，因此要選擇程度副詞even","explanationSource":"source"},{"id":6,"question":"Whenever Julia hears this song, it always makes her ____________, for it reminds her of her late father.","options":["sad","sadly","sadness","to sadden"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"make + O + adj.是指「使……變成……」，受詞補語要用形容詞","explanationSource":"source"},{"id":7,"question":"There is no need ____________ any food because the host of the party will provide free drinks and snacks.","options":["brought","bringing","that brings","to bring"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"There is no need + to VR....是指「不需要做某事」","explanationSource":"source"},{"id":8,"question":"____________ is convenient for people to get around Taipei by MRT.","options":["That","What","It","Which"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"It is + adj. + for + sb. + to VR是指「對於某人而言，做……是……的」，此處要用It當虛主詞，而真主詞是後面的不定詞片語","explanationSource":"source"},{"id":9,"question":"Jerry gets high scores on exams ____________ studying harder than his classmates.","options":["of","by","at","with"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"by + V-ing是指「藉由……方式」","explanationSource":"source"},{"id":10,"question":"The good news really made Helen ____________ confident, and she was in a good mood all day.","options":["feel","felt","feels","feeling"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"make + O + VR是指「使……做……」，因此答案要選擇原形動詞feel","explanationSource":"source"},{"id":11,"question":"This morning, Karen was scolded by her mother for lying to her again. She ran out of the house, ____________.","options":["to cry like a baby","cried like a baby","crying like a baby","and crying like a baby"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"原句應為She ran out of the house and she cried like a baby. 前後主詞相同時，分詞構句省略主詞與對等連接詞後，因動詞表示主動，所以用V-ing。","explanationSource":"source"},{"id":12,"question":"People who have bad teeth should avoid ____________ sugary drinks such as soda.","options":["to drink","to drinking","drinking","drunk"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"avoid + V-ing　避免做某事。","explanationSource":"source"},{"id":13,"question":"I am having a hard time choosing a new bag in this store; I see one I like, but then the next one is ____________ cuter!","options":["more","even","further","very"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"even修飾比較級。","explanationSource":"source"},{"id":14,"question":"A car accident ____________ Mary. Luckily, she did not get hurt.","options":["was happened to","was held to","happened to","held to"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"happen to someone，表示「發生在某人身上」。","explanationSource":"source"},{"id":15,"question":"When Owen fell off his bicycle, he found that one of his shoes ____________.","options":["loses","lost","was lost","were lost"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"one of the + 複數名詞 + 單數動詞，又時態上應該用過去式，所以答案為was lost。","explanationSource":"source"},{"id":16,"question":"Joseph took on two part-time jobs ____________ he really wants to buy a diamond ring for his girlfriend.","options":["in order to","although","since","so that"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"連接詞since表示「因為」，後面接子句。","explanationSource":"source"},{"id":17,"question":"Jay looked Beth in the eye and said gently, “My love for you grows ____________ every single day.”","options":["stronger","strongly","strength","strengthening"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"grow連綴動詞 + adj.；strengthening為strengthen的現在分詞，看起來形容詞，但語意上邏輯不符。","explanationSource":"source"},{"id":18,"question":"My dad doesn’t want me to buy a bicycle that is too ____________, simply because he thinks it might get stolen.","options":["eye-caught","catching-eye","eye-catching","catch-eyed"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"複合形容詞 eye-catching，表示「搶眼的」或是「引人注目的」。","explanationSource":"source"},{"id":19,"question":"I called Jill several times but she did not answer, so my friend Toby suggested that I could try ____________ her.","options":["to be texting","to texting","texting","having texted"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"try + V-ing，表示「試看看」，就當作試驗。","explanationSource":"source"},{"id":20,"question":"____________ to take so much money with you. You can use your credit card instead.","options":["You shouldn’t","It is not likely","You’d better","There is no need"],"answer":3,"answerLabel":"D","source":"三合一學習手冊","explanation":"正確答案為 There is no need；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":21,"question":"If Neil ____________ hard, he will pass the difficult exam.","options":["will study","studies","studied","could study"],"answer":1,"answerLabel":"B","source":"三合一學習手冊","explanation":"正確答案為 studies；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":22,"question":"There is no need ____________ anything to that unreasonable customer.","options":["to explain","explaining","explains","by explaining"],"answer":0,"answerLabel":"A","source":"三合一學習手冊","explanation":"正確答案為 to explain；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":23,"question":"Sam is a funny guy. His jokes always ____________ me laugh.","options":["get","allow","turn","make"],"answer":3,"answerLabel":"D","source":"習作簿","explanation":"正確答案為 make；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":24,"question":"I have many hobbies. One of them ____________ playing basketball.","options":["been","be","is","are"],"answer":2,"answerLabel":"C","source":"習作簿","explanation":"正確答案為 is；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":25,"question":"If you don’t hurry, you ____________ miss your flight.","options":["must","should","will","can"],"answer":2,"answerLabel":"C","source":"習作簿","explanation":"正確答案為 will；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":26,"question":"People working in an office all day should try to be aware ____________ their sitting posture.","options":["to","for","with","of"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"be aware of 留心、意識到……","explanationSource":"source"}]};</script><script src="longteng-b1u5-quiz.js?v=20261027-1"></script><script src="longteng-vocab-required-pronunciation.js?v=20261027-1"></script></body></html>
