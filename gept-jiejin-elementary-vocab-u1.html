<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>捷進 GEPT 初級單字書 Unit 1</title>
  <style>
    :root{--blue:#2563eb;--navy:#172554;--bg:#f4f7fb;--ink:#172033;--muted:#64748b;--line:#dbe3ee;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--purple:#6d28d9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.65}.wrap{max-width:980px;margin:auto;padding:16px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:15px 0;box-shadow:0 7px 22px #0f172a0c}.hero{background:linear-gradient(135deg,#eff6ff,#fff)}h1{margin:0;font-size:clamp(27px,4vw,40px)}h2,h3{margin-top:0}.muted{color:var(--muted)}.hidden{display:none!important}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.btn{border:0;border-radius:11px;padding:11px 16px;font:800 16px inherit;cursor:pointer;background:#e5e7eb;color:var(--ink);text-decoration:none}.primary{background:var(--blue);color:#fff}.voice{background:var(--purple);color:#fff}.danger{background:#991b1b;color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.range{padding:16px;text-align:left;border:2px solid var(--line);border-radius:13px;background:#fff;cursor:pointer}.range:hover{border-color:var(--blue);background:#f8fbff}.range b{display:block;font-size:19px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:800;margin:8px 0 14px}.zh{padding:12px 15px;border-radius:11px;background:#fff7ed;color:#9a3412;font-weight:800}.question{font-size:21px;font-weight:800;padding:18px;background:#f8fafc;border-radius:12px;margin-top:12px;white-space:pre-wrap}.answer{width:100%;padding:13px 14px;margin:12px 0;border:2px solid #94a3b8;border-radius:11px;font:inherit;font-size:18px}.feedback{padding:13px;border-radius:10px;font-weight:800;margin:12px 0;white-space:pre-wrap}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.pron{padding:15px;border:2px solid #ddd6fe;border-radius:12px;background:#f5f3ff;margin:13px 0}.pron .target{font-size:18px;font-weight:800}.score{padding:11px;border-radius:9px;background:#fff;border:1px solid #ddd6fe}.score.good{background:var(--okbg);color:var(--ok);border-color:#86efac}.score.retry{background:var(--badbg);color:var(--bad);border-color:#fecaca}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{margin:10px 0;background:#fff7f7;border-color:#fecaca}@media(max-width:620px){.wrap{padding:8px}.hero,.card{padding:15px}.meta{display:block}.question{font-size:18px}}
  </style>
</head>
<body><main class="wrap">
  <section class="hero">
    <h1>捷進 GEPT 初級單字書 Unit 1</h1>
    <p>ability–aircraft｜A2 Vocabulary｜單字拼字填空</p>
    <p class="muted">29 題｜答錯可重填｜答對自動播放完整句｜STT 朗讀準確率選做｜錯題 DOCX 下載</p>
    <div class="toolbar"><a class="btn" href="dashboard.html">← 回測驗總覽</a></div>
  </section>
  <section id="select" class="card"><h2>選擇練習範圍</h2><div id="ranges" class="grid"></div></section>
  <section id="quiz" class="card hidden">
    <div class="progress"><div id="bar" class="bar"></div></div>
    <div class="meta"><span id="meta"></span><span id="wrongCount"></span></div>
    <div id="zh" class="zh"></div><div id="question" class="question"></div>
    <input id="answer" class="answer" autocomplete="off" spellcheck="false" placeholder="請輸入空格中的英文單字">
    <div id="feedback" class="feedback hidden"></div>
    <section id="pron" class="pron hidden">
      <h3>🎙️ Pronunciation Check（選做）</h3>
      <p class="muted">先聽完整句子，再按麥克風朗讀。評分不影響「下一題」。</p>
      <p id="target" class="target"></p>
      <div class="toolbar"><button id="speak" class="btn voice">🔊 聽完整句子</button><button id="mic" class="btn primary">🎤 開始朗讀評分</button></div>
      <div id="score" class="score">尚未進行朗讀評分。</div>
    </section>
    <div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束本輪</button></div>
  </section>
  <section id="result" class="card hidden"><h2>練習結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="download" class="btn primary">下載錯題 DOCX</button><button id="back" class="btn">選擇其他範圍</button><button id="restart" class="btn">重新開始</button></div></section>
</main><script>
const DATA=[{"id":1,"prompt":"Birds have the __________ to fly, but fish do not.","answer":"ability","chinese":"鳥有飛的能力，但魚沒有。","full":"Birds have the ability to fly, but fish do not."},{"id":2,"prompt":"My sister lives in Japan. She studies __________.","answer":"abroad","chinese":"我姊姊住在日本，她在國外讀書。","full":"My sister lives in Japan. She studies abroad."},{"id":3,"prompt":"Tom is sick today, so he is __________ from school.","answer":"absent","chinese":"湯姆今天生病，所以他沒來上學。","full":"Tom is sick today, so he is absent from school."},{"id":4,"prompt":"Thank you for the gift. I am happy to __________ it.","answer":"accept","chinese":"謝謝你的禮物，我很樂意接受。","full":"Thank you for the gift. I am happy to accept it."},{"id":5,"prompt":"A car hit a bike. Luckily, nobody was hurt in the __________.","answer":"accident","chinese":"一輛車撞到腳踏車，幸好事故中沒人受傷。","full":"A car hit a bike. Luckily, nobody was hurt in the accident."},{"id":6,"prompt":"If you work hard, you can __________ your dream.","answer":"achieve","chinese":"只要努力，你就能實現夢想。","full":"If you work hard, you can achieve your dream."},{"id":7,"prompt":"We walked __________ the street to the park.","answer":"across","chinese":"我們走過馬路到公園。","full":"We walked across the street to the park."},{"id":8,"prompt":"In the school play, Amy will __________ as a princess.","answer":"act","chinese":"在學校話劇中，艾咪會扮演公主。","full":"In the school play, Amy will act as a princess."},{"id":9,"prompt":"Stop talking and take __________ now!","answer":"action","chinese":"別再說了，現在就行動！","full":"Stop talking and take action now!"},{"id":10,"prompt":"Swimming is my favorite summer __________.","answer":"activity","chinese":"游泳是我最喜歡的夏日活動。","full":"Swimming is my favorite summer activity."},{"id":11,"prompt":"My uncle is an __________. He is in many movies.","answer":"actor","chinese":"我叔叔是演員，他演過很多電影。","full":"My uncle is an actor. He is in many movies."},{"id":12,"prompt":"My aunt is an __________. She plays a mother on a TV show.","answer":"actress","chinese":"我阿姨是女演員，她在電視劇裡演媽媽。","full":"My aunt is an actress. She plays a mother on a TV show."},{"id":13,"prompt":"I thought the test was hard, but it was __________ easy.","answer":"actually","chinese":"我以為考試很難，但其實很簡單。","full":"I thought the test was hard, but it was actually easy."},{"id":14,"prompt":"Please __________ some sugar to my tea.","answer":"add","chinese":"請在我的茶裡加點糖。","full":"Please add some sugar to my tea."},{"id":15,"prompt":"What is your home __________? I want to send you a card.","answer":"address","chinese":"你家的地址是什麼？我想寄卡片給你。","full":"What is your home address? I want to send you a card."},{"id":16,"prompt":"I __________ my mom. She is kind and works very hard.","answer":"admire","chinese":"我很敬佩我媽媽，她既善良又努力工作。","full":"I admire my mom. She is kind and works very hard."},{"id":17,"prompt":"Ben broke the window. He had to __________ it to his teacher.","answer":"admit","chinese":"班打破了窗戶，他必須向老師承認。","full":"Ben broke the window. He had to admit it to his teacher."},{"id":18,"prompt":"The Lins want to __________ a dog from the animal shelter.","answer":"adopt","chinese":"林家想從收容所認養一隻狗。","full":"The Lins want to adopt a dog from the animal shelter."},{"id":19,"prompt":"Children under 12 must come with an __________.","answer":"adult","chinese":"12歲以下兒童必須由成年人陪同。","full":"Children under 12 must come with an adult."},{"id":20,"prompt":"I saw an __________ for new shoes on TV.","answer":"advertisement","chinese":"我在電視上看到新鞋的廣告。","full":"I saw an advertisement for new shoes on TV."},{"id":21,"prompt":"Can you give me some __________ about my homework?","answer":"advice","chinese":"你可以給我一些關於作業的建議嗎？","full":"Can you give me some advice about my homework?"},{"id":22,"prompt":"The doctor will __________ you to drink more water.","answer":"advise","chinese":"醫生會勸你多喝水。","full":"The doctor will advise you to drink more water."},{"id":23,"prompt":"Bad weather can __________ our school trip.","answer":"affect","chinese":"壞天氣可能會影響我們的校外教學。","full":"Bad weather can affect our school trip."},{"id":24,"prompt":"Our team will play __________ Class 7B on Friday.","answer":"against","chinese":"我們班星期五要和7B班比賽。","full":"Our team will play against Class 7B on Friday."},{"id":25,"prompt":"Go straight __________, and you will see the bank.","answer":"ahead","chinese":"往前直走，你就會看到銀行。","full":"Go straight ahead, and you will see the bank."},{"id":26,"prompt":"After the earthquake, many countries sent food and __________.","answer":"aid","chinese":"地震後，許多國家送來食物和援助。","full":"After the earthquake, many countries sent food and aid."},{"id":27,"prompt":"__________ is a serious disease. Doctors are still looking for a cure.","answer":"AIDS","chinese":"愛滋病是一種嚴重的疾病，醫生仍在尋找治療方法。","full":"AIDS is a serious disease. Doctors are still looking for a cure."},{"id":28,"prompt":"My __________ is to read ten books this year.","answer":"aim","chinese":"我的目標是今年讀十本書。","full":"My aim is to read ten books this year."},{"id":29,"prompt":"A plane is a kind of __________.","answer":"aircraft","chinese":"飛機是一種航空器。","full":"A plane is a kind of aircraft."}];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let chosen=[],index=0,rangeTitle='',wrong=new Map(),correct=new Set(),spoken=new Map(),recognition=null;
const ranges=[{title:'全部練習',from:1,to:29},{title:'第 1–10 題',from:1,to:10},{title:'第 11–20 題',from:11,to:20},{title:'第 21–29 題',from:21,to:29}];
function norm(s){return String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9']/g,'').trim()}
function speechNorm(s){return String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim()}
function similarity(a,b){a=speechNorm(a).split(' ').filter(Boolean);b=speechNorm(b).split(' ').filter(Boolean);const d=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)d[i][0]=i;for(let j=0;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return 1-d[a.length][b.length]/Math.max(a.length,b.length,1)}
function renderRanges(){$('#ranges').innerHTML=ranges.map((r,i)=>`<button class="range" data-i="${i}"><b>${r.title}</b><span>${r.to-r.from+1} 題｜Unit 1</span></button>`).join('');document.querySelectorAll('.range').forEach(b=>b.onclick=()=>start(ranges[+b.dataset.i]))}
function start(r){chosen=DATA.filter(q=>q.id>=r.from&&q.id<=r.to);rangeTitle=r.title;index=0;wrong=new Map();correct=new Set();spoken=new Map();$('#select').classList.add('hidden');$('#result').classList.add('hidden');$('#quiz').classList.remove('hidden');show()}
function show(){try{recognition?.abort()}catch(e){}speechSynthesis?.cancel();const q=chosen[index];$('#meta').textContent=`${rangeTitle}｜第 ${index+1} / ${chosen.length} 題（原題 ${q.id}）`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=(index+1)/chosen.length*100+'%';$('#zh').textContent='中文提示：'+q.chinese;$('#question').textContent=q.prompt;$('#answer').value='';$('#answer').disabled=false;$('#feedback').className='feedback hidden';$('#pron').classList.add('hidden');$('#score').className='score';$('#score').textContent='尚未進行朗讀評分。';$('#mic').disabled=false;$('#mic').textContent='🎤 開始朗讀評分';$('#check').classList.remove('hidden');$('#next').classList.add('hidden');setTimeout(()=>$('#answer').focus(),0)}
function recordWrong(q,value){if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(value||'(空白)');$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
function speak(){const q=chosen[index];if(!q||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(q.full);u.lang='en-US';u.rate=.87;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>/^en-US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang))||null;speechSynthesis.speak(u)}
$('#check').onclick=()=>{const q=chosen[index],value=$('#answer').value.trim();if(!value)return alert('請先輸入英文單字。');if(norm(value)===norm(q.answer)){correct.add(q.id);$('#answer').disabled=true;$('#feedback').className='feedback ok';$('#feedback').textContent='✅ 正確！請聽完整句子；朗讀評分為選做。';$('#target').textContent=q.full;$('#pron').classList.remove('hidden');$('#check').classList.add('hidden');$('#next').classList.remove('hidden');speak()}else{recordWrong(q,value);$('#feedback').className='feedback bad';$('#feedback').textContent=`❌ 不正確，請修改後再試。提示：${q.answer[0].toUpperCase()} 開頭，共 ${q.answer.length} 個字母。`;$('#answer').select()}};
$('#speak').onclick=speak;
$('#mic').onclick=async()=>{const q=chosen[index],box=$('#score'),mic=$('#mic'),SR=window.SpeechRecognition||window.webkitSpeechRecognition,reset=()=>{mic.disabled=false;mic.textContent='🎤 開始朗讀評分'};speechSynthesis?.cancel();if(!window.isSecureContext){box.className='score retry';box.textContent='請使用 HTTPS 網址開啟測驗，才能使用麥克風。';return}if(!SR){box.className='score retry';box.textContent='此瀏覽器不支援語音辨識；可直接進下一題。建議使用最新版 Chrome 或 Edge。';return}mic.disabled=true;mic.textContent='🎤 正在開啟麥克風…';try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('mediaDevices-unavailable');const stream=await navigator.mediaDevices.getUserMedia({audio:true});stream.getTracks().forEach(t=>t.stop())}catch(e){reset();box.className='score retry';box.textContent='麥克風權限未開啟。請在瀏覽器網站權限中允許麥克風後再試。';return}try{recognition?.abort()}catch(e){}recognition=new SR();recognition.lang='en-US';recognition.interimResults=false;recognition.continuous=false;recognition.maxAlternatives=5;box.className='score';box.textContent='🎤 正在聆聽，請朗讀完整句子…';mic.textContent='🎤 聆聽中…';recognition.onresult=e=>{const alts=[...e.results[0]].map(x=>x.transcript),best=alts.map(t=>({t,s:similarity(t,q.full)})).sort((a,b)=>b.s-a.s)[0],pct=Math.round(best.s*100);spoken.set(q.id,Math.max(spoken.get(q.id)||0,pct));box.className='score '+(pct>=80?'good':'retry');box.innerHTML=`<strong>辨識結果：</strong>${esc(best.t)}<br><strong>準確率：</strong>${pct}%<br>${pct>=80?'✅ 朗讀內容與目標句相符。':'🔁 建議再聽一次後重新朗讀。'}<br><small>朗讀為選做，不影響下一題。</small>`};recognition.onerror=e=>{box.className='score retry';box.textContent=e.error==='no-speech'?'沒有偵測到語音，請靠近麥克風再試一次。':e.error==='not-allowed'?'麥克風權限被封鎖，請在網站權限中允許後再試。':'語音辨識暫時無法使用（'+e.error+'），可重試或直接下一題。'};recognition.onend=reset;try{recognition.start()}catch(e){reset();box.className='score retry';box.textContent='無法啟動語音辨識，請重新整理頁面後再試。'}};
$('#next').onclick=()=>{index++;index>=chosen.length?finish():show()};$('#finish').onclick=finish;
function finish(){try{recognition?.abort()}catch(e){}speechSynthesis?.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');$('#summary').innerHTML=`<div class="stat">本輪題數<b>${chosen.length}</b></div><div class="stat">完成答對<b>${correct.size}</b></div><div class="stat">朗讀練習<b>${spoken.size}</b></div><div class="stat">曾答錯<b>${wrong.size}</b></div>`;$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>`<div class="wrong"><b>${i+1}. 原題 ${r.q.id}</b><p>${esc(r.q.prompt)}</p><p><strong>中文：</strong>${esc(r.q.chinese)}</p><p><strong>錯誤作答：</strong>${r.attempts.map(esc).join('；')}</p><p><strong>正確答案：</strong>${esc(r.q.answer)}</p><p><strong>完整句：</strong>${esc(r.q.full)}</p></div>`).join(''):'<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size)}
$('#back').onclick=()=>{$('#result').classList.add('hidden');$('#select').classList.remove('hidden')};$('#restart').onclick=()=>location.reload();
$('#download').onclick=async()=>{if(!wrong.size)return;try{if(!window.docx)await new Promise((ok,fail)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js';s.onload=ok;s.onerror=fail;document.head.append(s)});const{Document,Packer,Paragraph,TextRun,HeadingLevel}=window.docx,children=[new Paragraph({text:'捷進 GEPT 初級單字書 Unit 1 錯題紀錄',heading:HeadingLevel.TITLE})];for(const r of wrong.values())children.push(new Paragraph({children:[new TextRun({text:`原題 ${r.q.id}`,bold:true})]}),new Paragraph(r.q.prompt),new Paragraph('中文：'+r.q.chinese),new Paragraph('錯誤作答：'+r.attempts.join('；')),new Paragraph('正確答案：'+r.q.answer),new Paragraph('完整句：'+r.q.full));const blob=await Packer.toBlob(new Document({sections:[{children}]})),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='捷進_GEPT_初級單字書_Unit_1_錯題.docx';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){alert('目前無法產生 DOCX，請稍後再試。')}};
renderRanges();
</script></body></html>
