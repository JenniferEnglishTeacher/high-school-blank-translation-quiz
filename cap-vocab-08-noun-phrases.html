<script>window.QUIZ_CONFIG={"title": "國中會考單字片語｜名詞片語（含數量詞） Noun & Quantity Phrases", "mode": "mcq", "questions": [{"id": 1, "question": "I'm going to ______ near my home to buy some milk; it is open 24 hours a day.", "options": ["a convenience store", "a matter of life and death", "a parking lot", "a hot air balloon"], "answer": 0, "answerLabel": "A", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(A) a convenience store\n【用語】convenience store (n.phr.)：便利商店\n【中譯】我要去我家附近的便利商店買牛奶；它一天24小時都營業。", "explanationSource": "supplemental"}, {"id": 2, "question": "Tom couldn't get into his house because he lost ______ the front door.", "options": ["the key to", "the answer to", "the solution to", "the road to"], "answer": 0, "answerLabel": "A", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(A) the key to\n【用語】the key to + N (n.phr.)：（門）的鑰匙\n【中譯】湯姆進不了家，因為他弄丟了前門的鑰匙。", "explanationSource": "supplemental"}, {"id": 3, "question": "For breakfast, Dad put an egg without its shell into hot water and made ______.", "options": ["a fried egg", "a chance of a lifetime", "a poached egg", "a lit candle"], "answer": 2, "answerLabel": "C", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(C) a poached egg\n【用語】poached egg (n.phr.)：水波蛋\n【中譯】早餐時，爸爸把一顆去殼的蛋放進熱水裡，做了一顆水波蛋。", "explanationSource": "supplemental"}, {"id": 4, "question": "For homework, we have to write ______ about how plants grow in the sun.", "options": ["a sense of smell", "the former", "a health checkup", "a science report"], "answer": 3, "answerLabel": "D", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(D) a science report\n【用語】science report (n.phr.)：科學報告\n【中譯】我們的作業是要寫一份關於植物如何在陽光下生長的科學報告。", "explanationSource": "supplemental"}, {"id": 5, "question": "When I scored a goal, my coach smiled and gave me ______ to say \"Good job!\"", "options": ["a thumbs up", "an amusement park", "anyone else", "a heat wave"], "answer": 0, "answerLabel": "A", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(A) a thumbs up\n【用語】thumbs up (n.phr.)：比讚（手勢）\n【中譯】當我進球時，教練微笑著對我比讚，表示「做得好！」", "explanationSource": "supplemental"}, {"id": 6, "question": "Before bed, Grandma told us ______ about a princess and a magic frog.", "options": ["a power plant", "a fairy tale", "a common behavior", "a wet blanket"], "answer": 1, "answerLabel": "B", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(B) a fairy tale\n【用語】fairy tale (n.phr.)：童話故事\n【中譯】睡前，奶奶跟我們說了一個關於公主和魔法青蛙的童話故事。", "explanationSource": "supplemental"}, {"id": 7, "question": "Mom cooked ______ in hot oil and put it on my toast for breakfast.", "options": ["a fried egg", "a back door", "a balanced diet", "a straight line"], "answer": 0, "answerLabel": "A", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(A) a fried egg\n【用語】fried egg (n.phr.)：煎蛋\n【中譯】媽媽用熱油煎了一顆煎蛋，放在我的吐司上當早餐。", "explanationSource": "supplemental"}, {"id": 8, "question": "We bought two movie tickets at the ______ before the show started.", "options": ["lost and found", "box office", "matching colors", "deep water"], "answer": 1, "answerLabel": "B", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(B) box office\n【用語】box office (n.phr.)：售票處；票房\n【中譯】我們在電影開演前，在售票處買了兩張電影票。", "explanationSource": "supplemental"}, {"id": 9, "question": "In the comedy movie, a shy boy used a silly ______, \"Are you a camera? I smile every time I see you!\" and everyone in the theater laughed.", "options": ["health care", "pick-up line", "carry-on luggage", "bow tie"], "answer": 1, "answerLabel": "B", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(B) pick-up line\n【用語】pick-up line (n.phr.)：搭訕台詞\n【中譯】在那部喜劇電影裡，一個害羞的男孩用了一句很蠢的搭訕台詞：「你是相機嗎？每次看到你我都會笑！」電影院裡的每個人都笑了。", "explanationSource": "supplemental"}, {"id": 10, "question": "Our ______ showed us around the old town and told us about its history.", "options": ["washing machine", "odd number", "hard-boiled egg", "tour guide"], "answer": 3, "answerLabel": "D", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(D) tour guide\n【用語】tour guide (n.phr.)：導遊\n【中譯】我們的導遊帶我們參觀老城區，並告訴我們它的歷史。", "explanationSource": "supplemental"}, {"id": 11, "question": "Amy is a ______ of that singer; she waits outside his hotel all night just to see him.", "options": ["straight hair", "light blue", "dollar bill", "crazy fan"], "answer": 3, "answerLabel": "D", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(D) crazy fan\n【用語】crazy fan (n.phr.)：瘋狂粉絲\n【中譯】艾咪是那位歌手的瘋狂粉絲；她整晚在他的飯店外面等，只為了見他一面。", "explanationSource": "supplemental"}, {"id": 12, "question": "From the top of Taipei 101, you can enjoy a beautiful ______ at night.", "options": ["middle class", "low-cost airline", "city view", "wet blanket"], "answer": 2, "answerLabel": "C", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(C) city view\n【用語】city view (n.phr.)：城市景觀\n【中譯】從台北101的頂樓，你可以在晚上欣賞美麗的城市景觀。", "explanationSource": "supplemental"}, {"id": 13, "question": "Please keep ______ when you hear new ideas from your classmates.", "options": ["a guide dog", "an open mind", "a dollar bill", "a cooking skill"], "answer": 1, "answerLabel": "B", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(B) an open mind\n【用語】open mind (n.phr.)：開放的心胸；不持偏見的態度\n【中譯】當你聽到同學的新想法時，請保持開放的心胸。", "explanationSource": "supplemental"}, {"id": 14, "question": "Before buying the shoes online, I read the ______ to see if they were comfortable.", "options": ["buyers' feedback", "book review", "movie review", "big screen"], "answer": 0, "answerLabel": "A", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(A) buyers' feedback\n【用語】buyers' feedback (n.phr.)：買家回饋\n【中譯】在網路上買這雙鞋之前，我先看了買家回饋，看看它們穿起來舒不舒服。", "explanationSource": "supplemental"}, {"id": 15, "question": "With a ______, you can take the bus as many times as you want today.", "options": ["make-up test", "washing machine", "daily pass", "online course"], "answer": 2, "answerLabel": "C", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(C) daily pass\n【用語】daily pass (n.phr.)：一日通行證\n【中譯】有了一日通行證，你今天想搭幾次公車就可以搭幾次。", "explanationSource": "supplemental"}, {"id": 16, "question": "Disneyland is a famous ______ built around cartoon stories and characters.", "options": ["wine bar", "regular exercise", "theme park", "power plant"], "answer": 2, "answerLabel": "C", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(C) theme park\n【用語】theme park (n.phr.)：主題樂園\n【中譯】迪士尼樂園是一座以卡通故事和角色為主題打造的著名主題樂園。", "explanationSource": "supplemental"}, {"id": 17, "question": "______ students are absent today, maybe five or six, so the classroom is quiet.", "options": ["A large amount of", "A bowl of", "A number of", "A pair of"], "answer": 2, "answerLabel": "C", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(C) A number of\n【用語】a number of + N (n.phr.)：一些、若干\n【中譯】今天有一些學生缺席，大概五、六個，所以教室很安靜。", "explanationSource": "supplemental"}, {"id": 18, "question": "In P.E. class, we played ______; we threw a ball at the other team and tried not to get hit.", "options": ["hot air balloons", "dodge ball", "concert tickets", "board games"], "answer": 1, "answerLabel": "B", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(B) dodge ball\n【用語】dodge ball (n.phr.)：躲避球\n【中譯】體育課時，我們玩躲避球；我們把球丟向對方隊伍，並試著不被打到。", "explanationSource": "supplemental"}, {"id": 19, "question": "______ Tim lied to his best friend made her very sad.", "options": ["Plenty of", "A couple of", "The fact that", "A large number of"], "answer": 2, "answerLabel": "C", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(C) The fact that\n【用語】the fact that + 子句 (n.phr.)：……這個事實\n【中譯】提姆對他最好的朋友說謊這個事實讓她非常難過。", "explanationSource": "supplemental"}, {"id": 20, "question": "My dad is my ______; I want to be kind and hard-working like him.", "options": ["action movie", "model student", "cover model", "role model"], "answer": 3, "answerLabel": "D", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(D) role model\n【用語】role model (n.phr.)：榜樣；學習對象\n【中譯】我爸爸是我的榜樣；我想要像他一樣善良又勤奮。", "explanationSource": "supplemental"}, {"id": 21, "question": "The car almost hit the boy, but he jumped away just in time. It was ______.", "options": ["a model student", "a narrow escape", "the environment", "a common cold"], "answer": 1, "answerLabel": "B", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(B) a narrow escape\n【用語】a narrow escape (n.phr.)：千鈞一髮；死裡逃生\n【中譯】那輛車差點撞到男孩，但他及時跳開了。真是千鈞一髮。", "explanationSource": "supplemental"}, {"id": 22, "question": "Many students write \"informations,\" but this is ______ in English.", "options": ["a role model", "a common mistake", "a boiled egg", "greenhouse gases"], "answer": 1, "answerLabel": "B", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(B) a common mistake\n【用語】a common mistake (n.phr.)：常見的錯誤\n【中譯】很多學生會寫「informations」，但這是英文中常見的錯誤。", "explanationSource": "supplemental"}, {"id": 23, "question": "This restaurant adds ______ of 10% to your bill.", "options": ["a service fee", "a hit", "a garage sale", "the following"], "answer": 0, "answerLabel": "A", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(A) a service fee\n【用語】service fee (n.phr.)：服務費\n【中譯】這家餐廳會在你的帳單上加收10%的服務費。", "explanationSource": "supplemental"}, {"id": 24, "question": "Your essay is good, but there is still ______, so check your spelling again.", "options": ["a common friend", "graduate school", "the job market", "room for improvement"], "answer": 3, "answerLabel": "D", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(D) room for improvement\n【用語】room for improvement (n.phr.)：進步的空間\n【中譯】你的作文寫得不錯，但還有進步的空間，所以再檢查一次拼字吧。", "explanationSource": "supplemental"}, {"id": 25, "question": "Grandpa's ______ his grandchildren is very deep; he calls them every day.", "options": ["key to", "love for", "way to", "use of"], "answer": 1, "answerLabel": "B", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(B) love for\n【用語】love for + 人 (n.phr.)：對……的愛\n【中譯】爺爺對孫子們的愛很深；他每天都打電話給他們。", "explanationSource": "supplemental"}, {"id": 26, "question": "The ______ near the river makes electricity for the whole city.", "options": ["living costs", "air fryer", "power plant", "sharp knife"], "answer": 2, "answerLabel": "C", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(C) power plant\n【用語】power plant (n.phr.)：發電廠\n【中譯】河邊的那座發電廠為整座城市發電。", "explanationSource": "supplemental"}, {"id": 27, "question": "For people in this small village, farming is not just a job; it is ______.", "options": ["a way of life", "a computer bug", "a bow tie", "an air fryer"], "answer": 0, "answerLabel": "A", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(A) a way of life\n【用語】a way of life (n.phr.)：生活方式\n【中譯】對這個小村莊的人來說，務農不只是一份工作，更是一種生活方式。", "explanationSource": "supplemental"}, {"id": 28, "question": "On the MRT, please give the ______ to old people and people in need.", "options": ["priority seat", "Super Bowl", "computer bug", "straight line"], "answer": 0, "answerLabel": "A", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(A) priority seat\n【用語】priority seat (n.phr.)：博愛座\n【中譯】在捷運上，請把博愛座讓給老人和有需要的人。", "explanationSource": "supplemental"}, {"id": 29, "question": "Your essay must be under 200 words, so check the ______ before you hand it in.", "options": ["past experience", "total word count", "shelf life", "bow tie"], "answer": 1, "answerLabel": "B", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(B) total word count\n【用語】total word count (n.phr.)：字數總計\n【中譯】你的作文必須少於200字，所以交出去之前要檢查字數總計。", "explanationSource": "supplemental"}, {"id": 30, "question": "All students have ______ the computers in the library, so they can use them after class.", "options": ["the solution to", "the answer to", "a ticket to", "B", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(B) group report\n【用語】group report (n.phr.)：小組報告\n【中譯】我們四個人這週會一起合作完成關於夜市的小組報告。", "explanationSource": "supplemental"}, {"id": 51, "question": "Tom played the video game all night to get more ______ and win a new sword in the game.", "options": ["game points", "job interviews", "greenhouse gases", "bird flu"], "answer": 0, "answerLabel": "A", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(A) game points\n【用語】game points (n.phr.)：遊戲點數\n【中譯】湯姆整晚玩電玩，想賺更多遊戲點數，贏得遊戲裡的一把新劍。", "explanationSource": "supplemental"}, {"id": 52, "question": "Our English teacher has ______, so everyone can hear her well in the big classroom.", "options": ["a sharp knife", "a clear voice", "every corner of the world", "a die-hard fan"], "answer": 1, "answerLabel": "B", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(B) a clear voice\n【用語】clear voice (n.phr.)：清晰的聲音\n【中譯】我們的英文老師有清晰的聲音，所以在大教室裡每個人都能聽清楚她說話。", "explanationSource": "supplemental"}, {"id": 53, "question": "Amy can't skate in the park today because she lost ______.", "options": ["the above", "a bow tie", "her point of view", "one roller skate"], "answer": 3, "answerLabel": "D", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(D) one roller skate\n【用語】roller skate (n.phr.)：輪式溜冰鞋\n【中譯】艾咪今天不能在公園溜冰，因為她弄丟了一隻輪式溜冰鞋。", "explanationSource": "supplemental"}, {"id": 54, "question": "Kevin read the short story three times because it has ______ that is hard to understand.", "options": ["a fried egg", "pop music", "a deep idea", "the way you sing"], "answer": 2, "answerLabel": "C", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(C) a deep idea\n【用語】deep idea (n.phr.)：深奧的想法\n【中譯】凱文把這篇短篇故事讀了三遍，因為它有一個難以理解的深奧想法。", "explanationSource": "supplemental"}, {"id": 55, "question": "My ______ is three years older than me, and she is in high school now.", "options": ["aging society", "elder sister", "fairy tale", "wild animal"], "answer": 1, "answerLabel": "B", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(B) elder sister\n【用語】elder sister/brother (n.phr.)：姐姐／哥哥\n【中譯】我姐姐比我大三歲，她現在讀高中。", "explanationSource": "supplemental"}, {"id": 56, "question": "My aunt's friend set up a ______ for her, so she will have dinner with a man she has never met before.", "options": ["work of art", "rock concert", "garage sale", "blind date"], "answer": 3, "answerLabel": "D", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(D) blind date\n【用語】blind date (n.phr.)：相親；事先不認識的約會\n【中譯】我阿姨的朋友幫她安排了一場相親，所以她將會和一個從未見過的男人共進晚餐。", "explanationSource": "supplemental"}, {"id": 57, "question": "My school uniform is ______, the same color as the night sky.", "options": ["light blue", "straight hair", "dark blue", "chocolate bar"], "answer": 2, "answerLabel": "C", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(C) dark blue\n【用語】dark blue (n.phr.)：深藍色\n【中譯】我的學校制服是深藍色的，和夜空的顏色一樣。", "explanationSource": "supplemental"}, {"id": 58, "question": "The night market sells ______ snacks, so you can try many different foods there.", "options": ["a pair of", "a variety of", "a bowl of", "a couple of"], "answer": 1, "answerLabel": "B", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(B) a variety of\n【用語】a variety of + N (n.phr.)：多樣的\n【中譯】夜市賣各式各樣的小吃，所以你可以在那裡嚐到許多不同的食物。", "explanationSource": "supplemental"}, {"id": 59, "question": "The doctor told me to put ______ into my eyes twice a day.", "options": ["a credit card", "the answer to the question", "a candy bar", "eye drops"], "answer": 3, "answerLabel": "D", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(D) eye drops\n【用語】eye drops (n.phr.)：眼藥水\n【中譯】醫生叫我一天點兩次眼藥水。", "explanationSource": "supplemental"}, {"id": 60, "question": "Riding a bike is a cheap and healthy ______ getting to school.", "options": ["use of", "lost and found", "couch potato", "way of"], "answer": 3, "answerLabel": "D", "source": "名詞片語（含數量詞） Noun & Quantity Phrases", "explanation": "【答案】(D) way of\n【用語】way of + V-ing (n.phr.)：做……的方法\n【中譯】騎腳踏車是一種便宜又健康的上學方法。", "explanationSource": "supplemental"}]};</script><script>window.LEARN_DATA=[{"g": "", "t": "a big deal", "p": "(n.phr.)", "e": "something very important", "z": "大事；重要的事", "s": "Winning the school singing contest was _____ _____ _____ for Mia, so she practiced every night after dinner for a month.", "c": "贏得學校歌唱比賽對Mia來說是【一件大事】，所以她連續一個月每天晚餐後都在練習。", "f": "Winning the school singing contest was a big deal for Mia, so she practiced every night after dinner for a month."}, {"g": "", "t": "a bowl of + N", "p": "(n.phr.)", "e": "the amount of food that fills a bowl", "z": "一碗⋯⋯（如一碗飯）", "s": "I was so hungry after basketball practice that I ate _____ _____ _____ rice and two eggs at dinner.", "c": "籃球練習後我餓到晚餐吃了【一碗】飯和兩顆蛋。", "f": "I was so hungry after basketball practice that I ate a bowl of rice and two eggs at dinner."}, {"g": "", "t": "a chance of a lifetime", "p": "(n.phr.)", "e": "a very rare and special chance", "z": "千載難逢的機會", "s": "Meeting her favorite singer after the show was _____ _____ _____ _____ _____ for Emma, so she took many photos.", "c": "在演出後見到她最喜歡的歌手對Emma來說是【千載難逢的機會】，所以她拍了很多照片。", "f": "Meeting her favorite singer after the show was a chance of a lifetime for Emma, so she took many photos."}, {"g": "", "t": "a changed man", "p": "(n.phr.)", "e": "a man who has become very different", "z": "改頭換面的人", "s": "My uncle used to smoke and stay up late, but after he got sick, he became _____ _____ _____ who runs every morning.", "c": "我叔叔以前會抽菸又熬夜，但生病後他成了一個每天早上跑步的【改頭換面的人】。", "f": "My uncle used to smoke and stay up late, but after he got sick, he became a changed man who runs every morning."}, {"g": "", "t": "a common cold", "p": "(n.phr.)", "e": "a mild illness with a runny nose and cough", "z": "普通感冒", "s": "Alice caught _____ _____ _____ after playing in the rain, so she stayed home and drank a lot of warm water.", "c": "Alice 在雨中玩耍後得了【普通感冒】，所以她待在家裡喝了很多溫開水。", "f": "Alice caught a common cold after playing in the rain, so she stayed home and drank a lot of warm water."}, {"g": "", "t": "a common friend", "p": "(n.phr.)", "e": "a person who is a friend of both of you", "z": "共同的朋友", "s": "Mia and I met at a birthday party because we have _____ _____ _____, and now we walk to school together.", "c": "Mia 和我是在一場生日派對上認識的，因為我們有一位【共同的朋友】，現在我們一起走路上學。", "f": "Mia and I met at a birthday party because we have a common friend, and now we walk to school together."}, {"g": "", "t": "a common mistake", "p": "(n.phr.)", "e": "an error that many people make", "z": "常見的錯誤", "s": "Forgetting the \"s\" after \"he\" or \"she\" is _____ _____ _____ for young learners, so our teacher reminds us often.", "c": "在 he 或 she 後面忘了加 s 是年輕學習者【常見的錯誤】，所以我們老師常常提醒我們。", "f": "Forgetting the \"s\" after \"he\" or \"she\" is a common mistake for young learners, so our teacher reminds us often."}, {"g": "", "t": "a couple", "p": "(n.phr.)", "e": "two people who love each other", "z": "情侶；一對戀人", "s": "_____ _____ were sitting on the bench in the park, and they were sharing an ice cream while watching the sunset.", "c": "【一對情侶】坐在公園的長椅上，邊看夕陽邊分享一支冰淇淋。", "f": "A couple were sitting on the bench in the park, and they were sharing an ice cream while watching the sunset."}, {"g": "", "t": "a couple of + N", "p": "(n.phr.)", "e": "two of something", "z": "兩個", "s": "Mom bought _____ _____ _____ apples at the market, one for me and one for my little brother, because we both love fruit.", "c": "媽媽在市場買了【兩個】蘋果，一個給我，一個給我弟弟，因為我們都很愛吃水果。", "f": "Mom bought a couple of apples at the market, one for me and one for my little brother, because we both love fruit."}, {"g": "", "t": "a dozen eggs", "p": "(n.phr.)", "e": "twelve eggs", "z": "一打蛋", "s": "Mom asked me to buy _____ _____ _____ at the convenience store because she wants to make a big cake for my birthday party.", "c": "媽媽叫我去便利商店買【一打蛋】，因為她想為我的生日派對做一個大蛋糕。", "f": "Mom asked me to buy a dozen eggs at the convenience store because she wants to make a big cake for my birthday party."}, {"g": "", "t": "a hit", "p": "(n.phr.)", "e": "a very popular song or movie", "z": "熱門（歌曲／電影）", "s": "The new song by that Taiwanese band became _____ _____ in just one week, and now everyone at school sings it.", "c": "那個台灣樂團的新歌在短短一週內就成了【熱門歌曲】，現在學校裡每個人都在唱。", "f": "The new song by that Taiwanese band became a hit in just one week, and now everyone at school sings it."}, {"g": "", "t": "a large amount of + N", "p": "(n.phr.)", "e": "much (used with uncountable nouns)", "z": "大量的（+ 不可數名詞）", "s": "Our school uses _____ _____ _____ _____ water every day, so the principal asked everyone to turn off the taps after washing hands.", "c": "我們學校每天使用【大量的】水，所以校長請大家洗完手要關好水龍頭。", "f": "Our school uses a large amount of water every day, so the principal asked everyone to turn off the taps after washing hands."}, {"g": "", "t": "a large number of + N", "p": "(n.phr.)", "e": "many (used with countable nouns)", "z": "大量的（+ 可數名詞）", "s": "_____ _____ _____ _____ students joined the beach clean-up last Saturday, so we finished the work before lunch.", "c": "上星期六有【大量的】學生參加淨灘活動，所以我們在午餐前就完成了工作。", "f": "A large number of students joined the beach clean-up last Saturday, so we finished the work before lunch."}, {"g": "", "t": "a lit candle", "p": "(n.phr.)", "e": "a candle that is burning", "z": "點著的蠟燭", "s": "Never leave _____ _____ _____ alone in your room, because it can start a fire if it falls over.", "c": "千萬不要把【點著的蠟燭】留在房間裡沒人看著，因為它倒下的話可能會引起火災。", "f": "Never leave a lit candle alone in your room, because it can start a fire if it falls over."}, {"g": "", "t": "a matter of life and death", "p": "(n.phr.)", "e": "a very serious and important thing", "z": "生死攸關的事情", "s": "Please don't call me during class unless it is _____ _____ _____ _____ _____ _____, because the teacher will be angry.", "c": "除非是【生死攸關的事情】，否則上課時請不要打電話給我，因為老師會生氣。", "f": "Please don't call me during class unless it is a matter of life and death, because the teacher will be angry."}, {"g": "", "t": "a narrow escape", "p": "(n.phr.)", "e": "almost getting hurt but staying safe", "z": "千鈞一髮；死裡逃生", "s": "Our family had _____ _____ _____ when a big tree fell onto the road just after our car drove past it.", "c": "我們的車剛開過去，一棵大樹就倒在馬路上，我們全家真是【死裡逃生】。", "f": "Our family had a narrow escape when a big tree fell onto the road just after our car drove past it."}, {"g": "", "t": "a number of + N", "p": "(n.phr.)", "e": "some; several", "z": "一些、若干", "s": "_____ _____ _____ students in our class were sick last week, so our teacher moved the math test to Friday.", "c": "我們班上【一些】學生上週生病了，所以老師把數學考試延到星期五。", "f": "A number of students in our class were sick last week, so our teacher moved the math test to Friday."}, {"g": "", "t": "a pair of + N", "p": "(n.phr.)", "e": "two things that are used together", "z": "一雙⋯⋯", "s": "Grandpa bought me _____ _____ _____ running shoes because my old ones were too small and had holes in them.", "c": "爺爺買給我【一雙】慢跑鞋，因為我的舊鞋太小，而且破洞了。", "f": "Grandpa bought me a pair of running shoes because my old ones were too small and had holes in them."}, {"g": "", "t": "a ticket to + 地方", "p": "(n.phr.)", "e": "a paper or pass that lets you go somewhere", "z": "⋯⋯的門票／通行證", "s": "My uncle won _____ _____ _____ Disneyland in a lucky draw, so he is taking my cousin there this summer.", "c": "我叔叔在抽獎中贏得一張迪士尼樂園的【門票】，所以他今年夏天要帶我表弟去那裡。", "f": "My uncle won a ticket to Disneyland in a lucky draw, so he is taking my cousin there this summer."}, {"g": "", "t": "a tie", "p": "(n.phr.)", "e": "a game where both sides have the same score", "z": "平手；平局", "s": "The soccer game ended in _____ _____, two to two, so both teams have to play again next Sunday afternoon.", "c": "這場足球賽以二比二【平手】結束，所以兩隊下週日下午得再比一次。", "f": "The soccer game ended in a tie, two to two, so both teams have to play again next Sunday afternoon."}, {"g": "", "t": "a variety of + N", "p": "(n.phr.)", "e": "many different kinds of", "z": "多樣的", "s": "The night market near my house sells _____ _____ _____ snacks, so my family often goes there for dinner on weekends.", "c": "我家附近的夜市賣【各式各樣的】小吃，所以我們家週末常去那裡吃晚餐。", "f": "The night market near my house sells a variety of snacks, so my family often goes there for dinner on weekends."}, {"g": "", "t": "a way of life", "p": "(n.phr.)", "e": "the usual way a person or group lives", "z": "生活方式", "s": "For many farmers in Taiwan, getting up early to work in the fields is _____ _____ _____ _____, not just a job.", "c": "對台灣許多農夫來說，早起下田工作是一種【生活方式】，而不只是一份工作。", "f": "For many farmers in Taiwan, getting up early to work in the fields is a way of life, not just a job."}, {"g": "", "t": "a wild party", "p": "(n.phr.)", "e": "a noisy party where people act crazily", "z": "狂野的派對；瘋狂的派對", "s": "The neighbors had _____ _____ _____ until two in the morning, so my little sister could not fall asleep at all.", "c": "鄰居開了一場【瘋狂的派對】直到凌晨兩點，所以我妹妹完全睡不著。", "f": "The neighbors had a wild party until two in the morning, so my little sister could not fall asleep at all."}, {"g": "", "t": "access to + N", "p": "(n.phr.)", "e": "a way to use or get something", "z": "有使用……途徑、管道", "s": "Students in the small mountain village did not have _____ _____ the Internet, so they went to the library to do their homework.", "c": "那個小山村的學生沒有【管道使用】網路，所以他們去圖書館寫功課。", "f": "Students in the small mountain village did not have access to the Internet, so they went to the library to do their homework."}, {"g": "", "t": "action movie", "p": "(n.phr.)", "e": "a movie with fights, car chases, and danger", "z": "動作片", "s": "My brother loves watching _____ _____ with lots of car chases, but I prefer funny cartoons.", "c": "我哥哥很愛看有很多飛車追逐的【動作片】，但我比較喜歡好笑的卡通。", "f": "My brother loves watching action movies with lots of car chases, but I prefer funny cartoons."}, {"g": "", "t": "aging society", "p": "(n.phr.)", "e": "a society with many old people", "z": "高齡化社會", "s": "Taiwan is becoming an _____ _____ because many people live longer and fewer babies are born each year.", "c": "台灣正逐漸成為【高齡化社會】，因為很多人活得更久，而且每年出生的嬰兒越來越少。", "f": "Taiwan is becoming an aging society because many people live longer and fewer babies are born each year."}, {"g": "", "t": "air fryer", "p": "(n.phr.)", "e": "a machine that cooks food with hot air", "z": "氣炸鍋", "s": "My mom bought a new _____ _____ last week, and now she makes crispy chicken wings without using much oil.", "c": "我媽媽上週買了一台新的【氣炸鍋】，現在她不用很多油就能做出酥脆的雞翅。", "f": "My mom bought a new air fryer last week, and now she makes crispy chicken wings without using much oil."}, {"g": "", "t": "all-kill", "p": "(n.phr.)", "e": "a win over everyone; winning every game", "z": "全面擊敗；全勝（常用於比賽或遊戲）", "s": "Our class won every game in the school basketball contest this year, so everyone called it an _____ and cheered loudly.", "c": "我們班今年在學校籃球比賽中贏了每一場，所以大家都說這是一次【全勝】，並大聲歡呼。", "f": "Our class won every game in the school basketball contest this year, so everyone called it an all-kill and cheered loudly."}, {"g": "", "t": "amusement park", "p": "(n.phr.)", "e": "a place with rides and games for fun", "z": "遊樂園", "s": "We went to the _____ _____ on Children's Day and rode the roller coaster three times because it was so exciting.", "c": "我們兒童節去了【遊樂園】，坐了三次雲霄飛車，因為太刺激了。", "f": "We went to the amusement park on Children's Day and rode the roller coaster three times because it was so exciting."}, {"g": "", "t": "answer to + N", "p": "(n.phr.)", "e": "the right reply to a question or problem", "z": "…的答案", "s": "Nobody in the class knew the _____ _____ the last math question, so the teacher explained it on the board.", "c": "班上沒有人知道最後一題數學【的答案】，所以老師在黑板上講解。", "f": "Nobody in the class knew the answer to the last math question, so the teacher explained it on the board."}, {"g": "", "t": "answers to the questions", "p": "(n.phr.)", "e": "the right replies to questions", "z": "問題的解答", "s": "After the math test, Mr. Chen wrote all the _____ _____ _____ _____ on the board, so we could check our own mistakes.", "c": "數學考試後，陳老師把所有【問題的解答】寫在黑板上，所以我們可以檢查自己的錯誤。", "f": "After the math test, Mr. Chen wrote all the answers to the questions on the board, so we could check our own mistakes."}, {"g": "", "t": "anyone else", "p": "(n.phr.)", "e": "some other person", "z": "其他人", "s": "The library was so quiet on Sunday morning that I didn't see _____ _____ there except the old man at the desk.", "c": "星期天早上圖書館好安靜，除了櫃檯那位老先生，我沒看到【其他人】。", "f": "The library was so quiet on Sunday morning that I didn't see anyone else there except the old man at the desk."}, {"g": "", "t": "anything else", "p": "(n.phr.)", "e": "some other thing", "z": "其他的東西", "s": "The waiter brought our noodles and asked, \"Would you like _____ _____ to drink, or is water fine for you today?\"", "c": "服務生送上我們的麵，然後問：「您想喝點【其他的東西】嗎？還是今天喝水就好？」", "f": "The waiter brought our noodles and asked, \"Would you like anything else to drink, or is water fine for you today?\""}, {"g": "", "t": "back door", "p": "(n.phr.)", "e": "a door at the back of a building", "z": "後門", "s": "Dad came home very late, so he quietly opened the _____ _____ and walked into the kitchen without waking anyone up.", "c": "爸爸很晚才回家，所以他悄悄打開【後門】走進廚房，沒有吵醒任何人。", "f": "Dad came home very late, so he quietly opened the back door and walked into the kitchen without waking anyone up."}, {"g": "", "t": "balanced diet", "p": "(n.phr.)", "e": "eating the right amounts of different healthy foods", "z": "均衡飲食", "s": "Our health teacher says that a _____ _____ with fruit, vegetables, and rice can help us stay strong and healthy all year.", "c": "健康老師說，有水果、蔬菜和米飯的【均衡飲食】能幫助我們一整年保持強壯健康。", "f": "Our health teacher says that a balanced diet with fruit, vegetables, and rice can help us stay strong and healthy all year."}, {"g": "", "t": "big screen", "p": "(n.phr.)", "e": "a large movie screen in a theater", "z": "大銀幕", "s": "We could watch the movie at home, but it is much more exciting to see it on the _____ _____ with popcorn.", "c": " irst prize with her drawing of a clean ocean."}, {"g": "", "t": "even number", "p": "(n.phr.)", "e": "a number like 2, 4, 6, or 8", "z": "偶數", "s": "In math class today, Ms. Lin asked us to circle every _____ _____ on the page, like two, four, and six.", "c": "今天數學課，林老師要我們把頁面上每一個【偶數】圈起來，例如二、四和六。", "f": "In math class today, Ms. Lin asked us to circle every even number on the page, like two, four, and six."}, {"g": "", "t": "every corner of the world", "p": "(n.phr.)", "e": "all places on earth, even far ones", "z": "世界的每個角落", "s": "Thanks to the Internet, news can reach _____ _____ _____ _____ _____ in just a few minutes these days.", "c": "多虧了網路，現在新聞只要幾分鐘就能傳到【世界的每個角落】。", "f": "Thanks to the Internet, news can reach every corner of the world in just a few minutes these days."}, {"g": "", "t": "eye drops", "p": "(n.phr.)", "e": "medicine you put into your eyes", "z": "眼藥水", "s": "My eyes felt dry after playing video games for too long, so Dad gave me some _____ _____ and told me to rest.", "c": "我打電動太久眼睛很乾，所以爸爸給我一些【眼藥水】，叫我休息。", "f": "My eyes felt dry after playing video games for too long, so Dad gave me some eye drops and told me to rest."}, {"g": "", "t": "fairy tale", "p": "(n.phr.)", "e": "an old story with magic for children", "z": "童話故事", "s": "Every night before bed, my mother read me a _____ _____ about a princess, a dragon, and a magic tree.", "c": "每天晚上睡前，媽媽都會唸一個關於公主、龍和魔法樹的【童話故事】給我聽。", "f": "Every night before bed, my mother read me a fairy tale about a princess, a dragon, and a magic tree."}, {"g": "", "t": "final decision", "p": "(n.phr.)", "e": "the last choice you make", "z": "最後決定", "s": "After talking with her parents for a long time, Mia made her _____ _____ to join the school basketball team.", "c": "和爸媽談了很久之後，米雅做出【最後決定】，要加入學校籃球隊。", "f": "After talking with her parents for a long time, Mia made her final decision to join the school basketball team."}, {"g": "", "t": "final exam", "p": "(n.phr.)", "e": "the last big test of a school term", "z": "期末考" w character in his phone game.", "c": "我表哥上星期賺了很多【遊戲點數】，他用來在手機遊戲裡買了一個新角色。", "f": "My cousin earned a lot of game points last week, and he used them to buy a new character in his phone game."}, {"g": "", "t": "garage sale", "p": "(n.phr.)", "e": "a sale of old things at someone's home", "z": "車庫拍賣（家庭舊物販售）", "s": "Our neighbors had a _____ _____ last Sunday, and I bought some old comic books for only ten dollars each.", "c": "我們鄰居上星期天辦了一場【車庫拍賣】，我用每本只要十元的價錢買了一些舊漫畫。", "f": "Our neighbors had a garage sale last Sunday, and I bought some old comic books for only ten dollars each."}, {"g": "", "t": "graduate school", "p": "(n.phr.)", "e": "a school you go to after college", "z": "研究所", "s": "After finishing college, Ms. Lin went to _____ _____ in Taipei because she wanted to learn more about teaching.", "c": "林老師大學畢業後去台北讀【研究所】，因為她想學更多關於教學的知識。", "f": "After finishing college, Ms. Lin went to graduate school in Taipei because she wanted to learn more about teaching."}, {"g": "", "t": "green energy", "p": "(n.phr.)", "e": "energy that does not hurt nature", "z": "綠色能源（環保能源）", "s": "Our city is building more wind farms because the mayor wants to use more _____ _____ and less coal in the future.", "c": "我們城市正在蓋更多風力發電場，因為市長希望未來使用更多【綠色能源】、更少的煤。", "f": "Our city is building more wind farms because the mayor wants to use more green energy and less coal in the future."}, {"g": "", "t": "greenhouse gases", "p": "(n.phr.)", "e": "gases that make the earth warmer", "z": "溫室氣體", "s": "Scientists say that _____ _____ make the earth hotter, so we should take the bus or ride bikes more often.", "c": "科學家說【溫室氣體】會讓地球變熱，所以我們應該更常搭公車或騎腳踏車。", "f": "Scientists say that greenhouse gases make the earth hotter, so we should take the bus or ride bikes more often."}, {"g": "", "t": "group report", "p": "(n.phr.)", "e": "a report that a team writes together", "z": "小組報告", "s": "Our teacher put us into teams of four, so we had to finish a _____ _____ about recycling before Friday.", "c": "老師把我們分成四人一組，所以 oday.", "c": "我們這組有七個學生，是【奇數】，所以今天有一個人得自己做。", "f": "There are seven students in our group, which is an odd number, so one person has to work alone today."}, {"g": "", "t": "one another", "p": "(n.phr.)", "e": "each to the others (three or more)", "z": "彼此（三者以上之間）", "s": "The five students in our group helped _____ _____ with the science project, so we finished it two days early.", "c": "我們組的五位學生【彼此】互相幫忙做科展，所以我們提早兩天完成。", "f": "The five students in our group helped one another with the science project, so we finished it two days early."}, {"g": "", "t": "one's point of view", "p": "(n.phr.)", "e": "what a person thinks about something", "z": "（某人的）觀點", "s": "From my _____ _____ _____, students should have more time to play sports, because exercise helps us study better.", "c": "從我的【觀點】來看，學生應該有更多時間運動，因為運動能幫助我們更有效地讀書。", "f": "From my point of view, students should have more time to play sports, because exercise helps us study better."}, {"g": "", "t": "online course", "p": "(n.phr.)", "e": "a class you take on the internet", "z": "線上課程", "s": "My mom is taking an _____ _____ in cooking, so she watches the videos every night and makes new dishes on weekends.", "c": "我媽媽正在上一門烹飪的【線上課程】，所以她每晚看影片，週末就做新菜。", "f": "My mom is taking an online course in cooking, so she watches the videos every night and makes new dishes on weekends."}, {"g": "", "t": "open mind", "p": "(n.phr.)", "e": "being ready to accept new ideas", "z": "開放的心胸；不持偏見的態度", "s": "When you try food from other countries, you should keep an _____ _____ because you may find something you really love.", "c": "嘗試其他國家的食物時，你應該保持【開放的心胸】，因為你可能會發現真正喜愛的東西。", "f": "When you try food from other countries, you should keep an open mind because you may find something you really love."}, {"g": "", "t": "parking lot", "p": "(n.phr.)", "e": "an outdoor place where people park cars", "z": "停車場", "s": "The _____ _____ near the night market was full, so Dad drove around for twenty minutes to find a space.", "c": "夜市附近的【停車場】滿了，所以爸爸開車繞了二 z": "科學報告", "s": "Kevin stayed up late last night because his _____ _____ about plants was due the next morning.", "c": "Kevin昨晚熬夜，因為他關於植物的【科學報告】隔天早上就要交了。", "f": "Kevin stayed up late last night because his science report about plants was due the next morning."}, {"g": "", "t": "sense of smell", "p": "(n.phr.)", "e": "the ability to smell things", "z": "嗅覺", "s": "Dogs have a very good _____ _____ _____, so the police often use them to find bad things at the airport.", "c": "狗的【嗅覺】非常好，所以警察常用牠們在機場找出違禁物品。", "f": "Dogs have a very good sense of smell, so the police often use them to find bad things at the airport."}, {"g": "", "t": "serious earthquake", "p": "(n.phr.)", "e": "a very strong and dangerous earthquake", "z": "嚴重的地震", "s": "After the _____ _____ in Hualien, many students wrote cards and collected money to help the families who lost their homes.", "c": "花蓮發生【嚴重的地震】後，許多學生寫卡片並募款，幫助失去家園的家庭。", "f": "After the serious earthquake in Hualien, many students wrote cards and collected money to help the families who lost their homes."}, {"g": "", "t": "serious injury/wound", "p": "(n.phr.)", "e": "a very bad hurt to the body", "z": "嚴重的傷", "s": "The soccer player fell hard during the game and got a _____ _____, so he can't play for the rest of the year.", "c": "這位足球員比賽中重重摔倒，受了【嚴重的傷】，所以今年剩下的時間都不能比賽。", "f": "The soccer player fell hard during the game and got a serious injury, so he can't play for the rest of the year."}, {"g": "", "t": "serious typhoon", "p": "(n.phr.)", "e": "a very strong and dangerous typhoon", "z": "嚴重的颱風", "s": "Schools in Taipei were closed for two days because a _____ _____ brought heavy rain and strong winds to the city.", "c": "台北的學校停課兩天，因為一個【嚴重的颱風】為這座城市帶來大雨和強風。", "f": "Schools in Taipei were closed for two days because a serious typhoon brought heavy rain and strong winds to the city."}, {"g": "", "t": "service fee", "p": "(n.phr.)", "e": "extra money you pay for help or service", "z": "服務費", "s": "The food at the restaurant was not expensive, but there was a ten percent _____ _____ added to our bill.", "c": "那家餐廳的食物不貴，但我們的帳單上加了百分之十的【服務費】。", "f": "The food at the restaurant was not expensive, but there was a ten percent service fee added to our bill."}, {"g": "", "t": "sharp eye", "p": "(n.phr.)", "e": "ability to notice small things quickly", "z": "銳利的眼光", "s": "Our art teacher has a _____ _____ for color, so she always notices small mistakes in our paintings.", "c": "美術老師對顏色有【銳利的眼光】，所以她總是能發現我們畫裡的小錯誤。", "f": "Our art teacher has a sharp eye for color, so she always notices small mistakes in our paintings."}, {"g": "", "t": "sharp knife", "p": "(n.phr.)", "e": "a knife that cuts very easily", "z": "銳利的刀", "s": "Be careful when you cut the onions, because Mom's new _____ _____ can easily hurt your fingers.", "c": "切洋蔥時要小心，因為媽媽新買的【銳利的刀】很容易割傷手指。", "f": "Be careful when you cut the onions, because Mom's new sharp knife can easily hurt your fingers."}, {"g": "", "t": "shelf life", "p": "(n.phr.)", "e": "how long food can be kept before it goes bad", "z": "保存期限", "s": "Fresh milk has a short _____ _____, so Mom always checks the date before she puts it in the shopping cart.", "c": "鮮奶的【保存期限】很短，所以媽媽把它放進購物車前總會先檢查日期。", "f": "Fresh milk has a short shelf life, so Mom always checks the date before she puts it in the shopping cart."}, {"g": "", "t": "social classes", "p": "(n.phr.)", "e": "groups of people in society by money or jobs", "z": "社會階級", "s": "In our history class, we learned that in the past, people from different _____ _____ could not go to the same schools.", "c": "在歷史課上，我們學到過去不同【社會階級】的人不能上同一所學校。", "f": "In our history class, we learned that in the past, people from different social classes could not go to the same schools."}, {"g": "", "t": "straight hair", "p": "(n.phr.)", "e": "hair that is not curly", "z": "直髮", "s": "My sister has long _____ _____, but she wants to make it curly for her friend's birthday party next weekend.", "c": "我姊姊有一頭長長的【直髮】，但她想為下週末朋友的生日派對把頭髮弄捲。", "f": "My sister has long straight hair, but she wants to make it curly for her friend's birthday party next weekend."}, {"g": "", "t": "straight line", "p": "(n.phr.)", "e": "a line that does not bend", "z": "直線", "s": "Our math teacher asked us to use a ruler to draw a _____ _____ because our hands are not steady enough.", "c": "數學老師要我們用尺畫一條【直線】，因為我們的手不夠穩。", "f": "Our math teacher asked us to use a ruler to draw a straight line because our hands are not steady enough."}, {"g": "", "t": "Super Bowl", "p": "(n.phr.)", "e": "the biggest American football game of the year", "z": "超級盃（美式足球冠軍賽）", "s": "Millions of Americans watch the _____ _____ on TV every February, and many of them also enjoy the funny ads.", "c": "每年二月都有數百萬美國人在電視上看【超級盃】，其中很多人也喜歡看有趣的廣告。", "f": "Millions of Americans watch the Super Bowl on TV every February, and many of them also enjoy the funny ads."}, {"g": "", "t": "swine flu", "p": "(n.phr.)", "e": "a flu that first came from pigs", "z": "豬流感", "s": "When Kevin had a high fever last winter, the doctor checked whether he had caught _____ _____ from the pig farm next door.", "c": "去年冬天Kevin發高燒時，醫生檢查他是否從隔壁的養豬場感染了【豬流感】。", "f": "When Kevin had a high fever last winter, the doctor checked whether he had caught swine flu from the pig farm next door."}, {"g": "", "t": "the above", "p": "(n.phr.)", "e": "the things written before this part", "z": "以上的；上述的", "s": "Before you start the test, please read _____ _____ rules carefully, and raise your hand if you have any questions.", "c": "開始考試前，請仔細閱讀【上述】規則，有任何問題請舉手。", "f": "Before you start the test, please read the above rules carefully, and raise your hand if you have any questions."}, {"g": "", "t": "the answer to + N", "p": "(n.phr.)", "e": "what you say or write to reply to a question", "z": "⋯⋯的答案", "s": "Do you know _____ _____ _____ question five? I have been thinking about it for twenty minutes and still have no idea.", "c": "你知道第五題的【答案】嗎？我已經想了二十分鐘，還是一點頭緒都沒有。", "f": "Do you know the answer to question five? I have been thinking about it for twenty minutes and still have no idea."}, {"g": "", "t": "the elderly", "p": "(n.phr.)", "e": "old people as a group", "z": "年長者；老人", "s": "On the MRT, we should give our seats to _____ _____ because they may feel tired when they stand for a long time.", "c": "在捷運上，我們應該讓座給【年長者】，因為他們站久了可能會覺得累。", "f": "On the MRT, we should give our seats to the elderly because they may feel tired when they stand for a long time."}, {"g": "", "t": "the environment", "p": "(n.phr.)", "e": "the air, water, and land around us", "z": "環境", "s": "We should bring our own bags when we go shopping, because using fewer plastic bags is good for _____ _____.", "c": "我們購物時應該自備袋子，因為少用塑膠袋對【環境】有好處。", "f": "We should bring our own bags when we go shopping, because using fewer plastic bags is good for the environment."}, {"g": "", "t": "the fact that + 子句", "p": "(n.phr.)", "e": "used to talk about something that is true", "z": "……這個事實", "s": "Lily couldn't believe _____ _____ _____ her best friend was moving to another city, so she cried all night.", "c": "莉莉不敢相信她最好的朋友要搬到別的城市【這個事實】，所以她哭了一整晚。", "f": "Lily couldn't believe the fact that her best friend was moving to another city, so she cried all night."}, {"g": "", "t": "the following", "p": "(n.phr.)", "e": "the things that come next", "z": "下列的；以下的", "s": "Please answer _____ _____ questions in English, and remember to write your name at the top of the paper.", "c": "請用英文回答【下列】問題，並記得在紙的上方寫上你的名字。", "f": "Please answer the following questions in English, and remember to write your name at the top of the paper."}, {"g": "", "t": "the former..., the latter...", "p": "(n.phr.)", "e": "the first one ... the second one of two things", "z": "前者……後者", "s": "I have two hobbies, swimming and drawing; _____ _____ keeps me healthy, and _____ _____ helps me relax after school.", "c": "我有兩個嗜好，游泳和畫畫；【前者】讓我保持健康，而【後者】幫助我在放學後放鬆。", "f": "I have two hobbies, swimming and drawing; the former keeps me healthy, and the latter helps me relax after school."}, {"g": "", "t": "the job market", "p": "(n.phr.)", "e": "all the jobs that people can get", "z": "就業市場", "s": "My cousin is learning computer skills because _____ _____ _____ needs more people who can write programs.", "c": "我表哥正在學電腦技能，因為【就業市場】需要更多會寫程式的人。", "f": "My cousin is learning computer skills because the job market needs more people who can write programs."}, {"g": "", "t": "the key to + N", "p": "(n.phr.)", "e": "the thing that opens a lock", "z": "（門）的鑰匙", "s": "I can't find _____ _____ _____ the front door, so I have to wait outside until Mom comes home from work.", "c": "我找不到前門的【鑰匙】，所以我必須在外面等到媽媽下班回家。", "f": "I can't find the key to the front door, so I have to wait outside until Mom comes home from work."}, {"g": "", "t": "the key to success", "p": "(n.phr.)", "e": "the most important thing for doing well", "z": "成功的關鍵", "s": "Our coach always tells us that hard work is _____ _____ _____ _____, so we practice even when it rains.", "c": "教練總是告訴我們努力是【成功的關鍵】，所以即使下雨我們也照樣練習。", "f": "Our coach always tells us that hard work is the key to success, so we practice even when it rains."}, {"g": "", "t": "the others (= the other + Ns)", "p": "(n.phr.)", "e": "all the rest of the people or things", "z": "剩下的其他人／物（有明確範圍）", "s": "Only three students in our class went on the school trip, and _____ _____ stayed at school to study for the test.", "c": "我們班只有三位學生去校外教學，【其他的人】都留在學校準備考試。", "f": "Only three students in our class went on the school trip, and the others stayed at school to study for the test."}, {"g": "", "t": "the road to + N", "p": "(n.phr.)", "e": "the way to a place or a goal", "z": "通往⋯⋯的道路", "s": "_____ _____ _____ the old temple is narrow and steep, so we had to ride our bikes very carefully.", "c": "【通往】那座老廟【的道路】又窄又陡，所以我們騎腳踏車時必須非常小心。", "f": "The road to the old temple is narrow and steep, so we had to ride our bikes very carefully."}, {"g": "", "t": "the solution to + N", "p": "(n.phr.)", "e": "a way to fix a problem", "z": "⋯⋯的解決方法", "s": "Riding a bike to school could be _____ _____ _____ the traffic problem near our school in the morning.", "c": "騎腳踏車上學可能是解決我們學校附近早上交通問題的【方法】。", "f": "Riding a bike to school could be the solution to the traffic problem near our school in the morning."}, {"g": "", "t": "the use of + N", "p": "(n.phr.)", "e": "using something", "z": "⋯⋯的使用", "s": "_____ _____ _____ cell phones is not allowed during class, so we have to put them in our bags until lunch.", "c": "上課時不允許【使用】手機，所以我們必須把手機放在書包裡直到午餐時間。", "f": "The use of cell phones is not allowed during class, so we have to put them in our bags until lunch."}, {"g": "", "t": "the way + S + V", "p": "(n.phr.)", "e": "how someone does something", "z": "某人做事的方式", "s": "I really like _____ _____ my grandma cooks fried rice, because she always adds a little sesame oil at the end.", "c": "我真的很喜歡我奶奶炒飯的【方式】，因為她最後總會加一點香油。", "f": "I really like the way my grandma cooks fried rice, because she always adds a little sesame oil at the end."}, {"g": "", "t": "theme park", "p": "(n.phr.)", "e": "a big park built around one idea or story", "z": "主題樂園", "s": "Disneyland is a famous _____ _____ where visitors can meet cartoon characters and watch fireworks at night.", "c": "迪士尼樂園是一座有名的【主題樂園】，遊客可以在那裡見到卡通人物，晚上還能看煙火。", "f": "Disneyland is a famous theme park where visitors can meet cartoon characters and watch fireworks at night."}, {"g": "", "t": "thumbs up", "p": "(n.phr.)", "e": "a hand sign that means good or OK", "z": "比讚（手勢）", "s": "When I finished my speech in front of the whole class, my best friend gave me a big _____ _____ and smiled.", "c": "我在全班面前講完演講時，我最好的朋友對我比了一個大大的【讚】，還對我微笑。", "f": "When I finished my speech in front of the whole class, my best friend gave me a big thumbs up and smiled."}, {"g": "", "t": "total word count", "p": "(n.phr.)", "e": "the number of all the words", "z": "字數總計", "s": "Our English teacher said the _____ _____ _____ of the essay must be at least two hundred, so I added another paragraph.", "c": "英文老師說這篇作文的【字數總計】至少要兩百字，所以我又加了一段。", "f": "Our English teacher said the total word count of the essay must be at least two hundred, so I added another paragraph."}, {"g": "", "t": "tour guide", "p": "(n.phr.)", "e": "a person who shows visitors around a place", "z": "導遊", "s": "Our _____ _____ in Japan spoke Chinese very well, and she told us many interesting stories about the old temples.", "c": "我們在日本的【導遊】中文說得很好，而且她跟我們講了很多關於古老寺廟的有趣故事。", "f": "Our tour guide in Japan spoke Chinese very well, and she told us many interesting stories about the old temples."}, {"g": "", "t": "washing machine", "p": "(n.phr.)", "e": "a machine that cleans clothes", "z": "洗衣機", "s": "Our old _____ _____ broke last week, so Mom had to wash all our school uniforms by hand.", "c": "我們家的舊【洗衣機】上週壞了，所以媽媽得用手洗我們所有的制服。", "f": "Our old washing machine broke last week, so Mom had to wash all our school uniforms by hand."}, {"g": "", "t": "way of + V-ing", "p": "(n.phr.)", "e": "a method of doing something", "z": "做……的方法", "s": "Riding a bike to school is a healthy _____ _____ getting exercise, and it is also good for the earth.", "c": "騎腳踏車上學是一種健康的運動【方法】，而且對地球也有好處。", "f": "Riding a bike to school is a healthy way of getting exercise, and it is also good for the earth."}, {"g": "", "t": "way to + VR", "p": "(n.phr.)", "e": "a method to do something", "z": "做……的方法", "s": "The best _____ _____ learn new English words is to read short stories and use the words when you talk.", "c": "學新英文單字最好的【方法】就是讀短篇故事，並在說話時使用那些單字。", "f": "The best way to learn new English words is to read short stories and use the words when you talk."}, {"g": "", "t": "wet blanket", "p": "(n.phr.)", "e": "a person who stops others from having fun", "z": "掃興的人", "s": "Don't be a _____ _____ at the party; everyone is dancing and having fun, so come and join us!", "c": "在派對上別當個【掃興的人】，大家都在跳舞玩得很開心，快來加入我們吧！", "f": "Don't be a wet blanket at the party; everyone is dancing and having fun, so come and join us!"}, {"g": "", "t": "wild animal", "p": "(n.phr.)", "e": "an animal that lives in nature, not with people", "z": "野生動物", "s": "When our class visited Yangmingshan, we saw monkeys and other _____ _____, so the guide told us not to feed them.", "c": "我們班去陽明山的時候看到了猴子和其他【野生動物】，所以導遊叫我們不要餵牠們。", "f": "When our class visited Yangmingshan, we saw monkeys and other wild animals, so the guide told us not to feed them."}, {"g": "", "t": "wild student", "p": "(n.phr.)", "e": "a student who is hard to control in class", "z": "狂野不受教的學生", "s": "Mr. Lin was patient with the _____ _____ who never sat still, and slowly the boy began to listen in class.", "c": "林老師對那個從來坐不住、【狂野不受教的學生】很有耐心，那個男孩慢慢開始在課堂上專心聽講。", "f": "Mr. Lin was patient with the wild student who never sat still, and slowly the boy began to listen in class."}, {"g": "", "t": "wine bar", "p": "(n.phr.)", "e": "a place where adults drink wine", "z": "酒吧", "s": "My aunt and her friends went to a quiet _____ _____ after work, and they talked about their trip to Japan.", "c": "我阿姨和她朋友下班後去了一家安靜的【酒吧】，聊她們去日本的旅行。", "f": "My aunt and her friends went to a quiet wine bar after work, and they talked about their trip to Japan."}, {"g": "", "t": "work of art", "p": "(n.phr.)", "e": "a painting or other beautiful thing someone made", "z": "藝術作品", "s": "The cake that Grandma made for my birthday was so beautiful that it looked like a _____ _____ _____.", "c": "奶奶為我生日做的蛋糕漂亮到看起來像一件【藝術作品】。", "f": "The cake that Grandma made for my birthday was so beautiful that it looked like a work of art."}];</script><script src="longteng-b1u5-quiz.js?v=20261027-2"></script><script src="cap-vocab-learn.js?v=20261105-1"></script><script>document.querySelector("#description").textContent="先在「教學 Learn」看完 176 筆詞彙表，再到「測驗 Quiz」做 60 題四選一｜選答後顯示答案、用語中文與整句中譯｜答錯可重做並下載錯題";</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
