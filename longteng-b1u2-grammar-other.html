    <header class="hero"><a class="btn" href="dashboard.html">← 回到 Dashboard</a><h1 id="title">龍騰普高 Book 1 Unit 2｜文法選擇（其他考點）</h1><p id="description" class="note"></p></header>
    <section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn" type="button">全選</button><button id="none" class="btn" type="button">取消全選</button><button id="random" class="btn" type="button">隨機 20 題</button><span id="picked" class="note"></span></div><div id="list"></div><label class="pick"><input id="shuffle" type="checkbox"> 隨機排列題目</label><button id="start" class="btn primary" type="button">開始測驗 →</button></section>

  <script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 2｜文法選擇（其他考點）","mode":"mcq","questions":[{"id":1,"question":"We are surprised to learn that Sean spent about NT$50,000 ____________ his new iPhone.","options":["with","on","to","by"],"answer":1,"source":"龍騰自命題","explanation":"本題考點為spend +金錢 + on + sth.，表「花費……金錢在……上面」，故介系詞要選擇on","explanationSource":"source"},{"id":2,"question":"Tina usually spends a lot of time ____________ hard in the library when the final exams are approaching.","options":["studying","studies","to study","studied"],"answer":0,"source":"龍騰自命題","explanation":"本題考點為spend + 時間 + V-ing，表「花時間做某事」，時間後面要接動名詞，故答案要選擇studying","explanationSource":"source"},{"id":3,"question":"Mastering a foreign language ____________ a lot of time, effort, and practice.","options":["requiring","to require","require","requires"],"answer":3,"source":"龍騰自命題","explanation":"由句型結構可以看出，本句是以動名詞片語Mastering a foreign language當作主詞，要視為單數，故要搭配單數動詞requires","explanationSource":"source"},{"id":4,"question":"No matter how busy he is, Richard always tries to spend some time ____________ his family every week.","options":["from","into","with","upon"],"answer":2,"source":"龍騰自命題","explanation":"本題考點為spend + 時間 + with + 對象，表「花時間陪伴……」，故答案要選擇with","explanationSource":"source"},{"id":5,"question":"It is necessary that we come up with a way to ____________ this difficult problem as soon as possible.","options":["solving","solve","solves","solved"],"answer":1,"source":"龍騰自命題","explanation":"本題考點為a way to VR，表「……的方法」，to後面要接原形動詞，故答案要選擇solve","explanationSource":"source"},{"id":6,"question":"If you really want to lose weight, you should stop ____________ so much junk food and start to exercise more.","options":["eating","eat","eaten","eats"],"answer":0,"source":"龍騰自命題","explanation":"本題考點為stop + V-ing，表「停止做某事」，故此處要選擇動名詞eating","explanationSource":"source"},{"id":7,"question":"Karen is busy ____________ dinner for the whole family in the kitchen.","options":["prepares","prepared","to prepare","preparing"],"answer":3,"source":"龍騰自命題","explanation":"本題考點為be busy + V-ing，表「忙著做……」，故答案要選擇preparing","explanationSource":"source"},{"id":8,"question":"Brendan often helps his younger sister ____________ her homework.","options":["did","does","do","doing"],"answer":2,"source":"龍騰自命題","explanation":"本題考點為help + O + VR，表「幫助……做……」，故答案要選擇原形動詞do","explanationSource":"source"},{"id":9,"question":"Eric often works late ____________ the night in order to earn more money to support his family.","options":["with","into","upon","from"],"answer":1,"source":"龍騰自命題","explanation":"本題考點為late into the night，表「直到深夜」，故答案要選擇into","explanationSource":"source"},{"id":10,"question":"I’ll always be ____________ your side whenever you need me.","options":["by","of","in","to"],"answer":0,"source":"龍騰自命題","explanation":"本題考點為by one’s side，表「在某人身旁」，故答案要選擇by","explanationSource":"source"},{"id":11,"question":"I have to ask the teacher ____________.","options":["who is that woman","what to do next","is it correct","he was the guest"],"answer":1,"source":"龍騰自命題","explanation":"ask + sb. + sth.","explanationSource":"source"},{"id":12,"question":"Students should not spend too much time ____________ online games.","options":["to play","played","play","playing"],"answer":3,"source":"龍騰自命題","explanation":"spend +某段時間 + V-ing","explanationSource":"source"},{"id":13,"question":"I have to leave because it’s getting ____________.","options":["short","darkly","late","lately"],"answer":2,"source":"龍騰自命題","explanation":"get為連綴動詞，後面接形容詞。","explanationSource":"source"},{"id":14,"question":"The children soon got ____________ with the board game. They then went outside to throw a baseball.","options":["interesting","boring","used","bored"],"answer":3,"source":"龍騰自命題","explanation":"get bored with sth. 為……感到厭煩。","explanationSource":"source"},{"id":15,"question":"Could you please stop ____________? I have to focus on my work.","options":["talking","to talk","talk","for talking"],"answer":0,"source":"龍騰自命題","explanation":"stop + V-ing 停下目前的動作。","explanationSource":"source"},{"id":16,"question":"She refused to put on the long dress because she was afraid ____________ her classmates would laugh at her.","options":["of","to","that","for"],"answer":2,"source":"龍騰自命題","explanation":"afraid of + V-ing。afraid to + VR。afraid that + S + V。","explanationSource":"source"},{"id":17,"question":"Having so many classes in a day ____________ boring and tiring.","options":["be","being","are","is"],"answer":3,"source":"龍騰自命題","explanation":"動名詞當主詞，動詞為單數動詞。","explanationSource":"source"},{"id":18,"question":"You had better ask the writer for his autograph (親筆簽名) now, because he ____________ soon.","options":["leaves","left","is leaving","be leaving"],"answer":2,"source":"龍騰自命題","explanation":"現在進行式表達未來式。","explanationSource":"source"},{"id":19,"question":"Doing exercise every day ____________ good health.","options":["helping promote","helps promote","is helping promoting","helped promoting"],"answer":1,"source":"龍騰自命題","explanation":"動名詞當主詞，其動詞為單數型動詞。help (to) VR","explanationSource":"source"},{"id":20,"question":"There were many students ____________ in the library before the monthly exam.","options":["studying","study","had studied","studied"],"answer":0,"source":"龍騰自命題","explanation":"There + be + N + V-ing/p.p.","explanationSource":"source"},{"id":21,"question":"I don’t want to sleep alone because I am afraid ____________ the dark.","options":["with","about","of","by"],"answer":2,"source":"三合一學習手冊","explanation":"正確答案為 of；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":22,"question":"Mr. Wilson is busy ____________ his students’ homework. He has to read it through and give comments.","options":["on","in","for","with"],"answer":3,"source":"三合一學習手冊","explanation":"正確答案為 with；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":23,"question":"It has stopped ____________. Let’s go for a walk outside.","options":["to rain","raining","rain","rains"],"answer":1,"source":"三合一學習手冊","explanation":"正確答案為 raining；請依完整句子的語意與句型判斷。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"}]};</script>
