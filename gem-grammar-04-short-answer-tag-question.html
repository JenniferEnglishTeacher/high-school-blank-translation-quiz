    <script>
        const rawData = [
            // --- 歷屆試題 ---
            {
                cat: "歷屆試題",
                q: "Jane’s parents are always happy to see their grandchildren, but mine _____ less so when I visit them with my kids.",
                opts: ["is", "are", "do", "does"],
                ans: 1,
                pattern: ["Jane's parents", "→", "are", "↔", "mine (=my parents)", "→", "are"],
                exp: "mine 在此代表 my parents (複數)。前面的動詞是 be 動詞 are，後面的省略句也要對應使用 be 動詞 are。",
                exs: ["His shoes are new, but mine are old.", "Your ideas are great, and so are mine.", "My parents are tall, but hers are short."]
            },
            {
                cat: "歷屆試題",
                q: "Our teacher Ms. Wu seldom laughs, but when she _____, everyone in the same building can hear her.",
                opts: ["can", "does", "has", "will"],
                ans: 1,
                pattern: ["laughs (一般V)", "→", "when she", "→", "does"],
                exp: "前面是一般動詞 laughs (現在簡單式)，後面的省略句要對應使用助動詞 does (配合第三人稱單數 she)。",
                exs: ["He rarely sleeps late, but when he does, he misses the bus.", "She doesn't often sing, but when she does, it's beautiful.", "The dog seldom barks, but when it does, it's very loud."]
            },
            {
                cat: "歷屆試題",
                q: "Lora likes to eat bananas that are already a little brown on the outside, and so _____ I.",
                opts: ["am", "do", "have", "will"],
                ans: 1,
                pattern: ["likes (一般V)", "→", "and so", "→", "do", "→", "I"],
                exp: "附和句「我也是」。前面是一般動詞 likes，後面使用 do 配合主詞 I。So 放在句首需倒裝（So + 助/be + 主）。",
                exs: ["He loves pizza, and so do I.", "They work hard, and so do we.", "She plays piano well, and so does her sister."]
            },
            {
                cat: "歷屆試題",
                q: "Dad: Have you brushed your teeth yet? \nAnn: No, but I _____ before I go to bed.",
                opts: ["haven't", "have", "won't", "will"],
                ans: 3,
                pattern: ["but I", "→", "will (將會)", "→", "before bed (未來)"],
                exp: "這題是語意與時態的結合。Ann 說還沒刷，但『睡覺前將會去刷』，表示未來的打算，用 will。",
                exs: ["I haven't eaten yet, but I will soon.", "He isn't here, but he will be later.", "They didn't call, but they will tonight."]
            },
            {
                cat: "歷屆試題",
                q: "David: Have you seen John’s sister? \nKevin: Yes, I _____. She’s the most beautiful girl I’ve ever seen.",
                opts: ["have", "had", "did", "saw"],
                ans: 0,
                pattern: ["Have you seen (現在完成式)?", "→", "Yes, I have."],
                exp: "現在完成式疑問句的簡答，直接沿用助動詞 have。",
                exs: ["Have you finished? Yes, I have.", "Has she left? Yes, she has.", "Have they met you? No, they haven't."]
            },
            {
                cat: "歷屆試題",
                q: "Linda: Do you have to get up early in the morning? \nPeter: Yes, I _____. I can’t be late for school.",
                opts: ["do", "can", "have", "am"],
                ans: 0,
                pattern: ["Do you (助動詞)...?", "→", "Yes, I do."],
                exp: "Do 引導的疑問句，簡答用 do。注意：have to 是「必須」，視為一般動詞，助動詞用 do/does。",
                exs: ["Do you like tea? Yes, I do.", "Does he have to go? Yes, he does.", "Do we need help? No, we don't."]
            },
            {
                cat: "歷屆試題",
                q: "Robert: Charles wanted to borrow $1,000 yesterday. \nMandy: You didn't lend him the money, _____?",
                opts: ["would you", "wouldn't you", "did you", "didn't you"],
                ans: 2,
                pattern: ["didn't lend (否定)", "→", "did you? (肯定附加)"],
                exp: "附加問句規則：前否後肯。前面是 didn't，後面用肯定式助動詞 did。",
                exs: ["You didn't see him, did you?", "He wasn't angry, was he?", "They haven't left, have they?"]
            },
            {
                cat: "歷屆試題",
                q: "Jane: Did you get up early this morning? \nTina: No, I didn't, but my brother _____. He gets up early every day.",
                opts: ["does", "is", "did", "was"],
                ans: 2,
                pattern: ["Did you (過去)?", "→", "but brother", "→", "did (對應過去)"],
                exp: "這是在對比『今天早上』的動作。雖然哥哥每天早起，但這題問的是『今天早上（過去點）』的情況，故用 did 代表 got up early。",
                exs: ["I didn't eat breakfast, but he did.", "We didn't go, but they did.", "She didn't call, but her mom did."]
            },
            {
                cat: "歷屆試題",
                q: "Betty goes jogging every day in the park, and Allen _____, too.",
                opts: ["is", "does", "has", "was"],
                ans: 1,
                pattern: ["goes (一般V)", "→", "Allen", "→", "does", "→", "too"],
                exp: "肯定附和句「也是」。前面是一般動詞 goes，後方使用助動詞 does 配合單數主詞 Allen。",
                exs: ["I like music, and he does, too.", "They study hard, and we do, too.", "The cat sleeps a lot, and the dog does, too."]
            },
            {
                cat: "歷屆試題",
                q: "Frank read a comic book yesterday, but his brother _____. ",
                opts: ["does", "doesn't", "did", "didn't"],
                ans: 3,
                pattern: ["read (過去式)", "↔", "but brother", "→", "didn't"],
                exp: "對比過去發生的動作。read 在此是過去式 (唸作 /red/)，對比否定要用 didn't。",
                exs: ["I saw him, but she didn't.", "They finished, but we didn't.", "He called, but I didn't answer."]
            },
            {
                cat: "歷屆試題",
                q: "No one thought James would appear at Katie’s party. So when he _____, everyone was surprised.",
                opts: ["would", "was", "had", "did"],
                ans: 3,
                pattern: ["appear (動作)", "→", "when he", "→", "did"],
                exp: "這題 did 代替的是 appeared (出現)。描述過去發生的事實，用助動詞 did。",
                exs: ["Everyone said he wouldn't win, but he did.", "I thought it would rain, and it did.", "They hoped he would come, and he did."]
            },
            {
                cat: "歷屆試題",
                q: "Tommy uses chopsticks well, but his younger brothers _____, so they usually eat with spoons.",
                opts: ["don’t", "doesn’t", "aren’t", "isn’t"],
                ans: 0,
                pattern: ["uses (一般V)", "↔", "brothers (複數)", "→", "don't"],
                exp: "對比現在的習慣。前面是一般動詞 uses，後方主詞是複數 brothers，否定助動詞用 don't。",
                exs: ["I like tea, but they don't.", "She speaks English, but her sisters don't.", "He runs fast, but his friends don't."]
            },
            {
                cat: "歷屆試題",
                q: "Jane always does well on English tests, but her sisters _____. ",
                opts: ["doesn't", "aren't", "don't", "didn't"],
                ans: 2,
                pattern: ["does well (一般V)", "↔", "sisters (複數)", "→", "don't"],
                exp: "同上題。前面是一般動詞 does，後方主詞複數，對應助動詞 don't。",
                exs: ["He works here, but they don't.", "The bird sings, but the cats don't.", "I know him, but they don't."]
            },
            {
                cat: "歷屆試題",
                q: "Mom: Peter, be sure to finish your school report before you go to bed. \nPeter: OK, Mom, I _____. ",
                opts: ["am", "do", "have", "will"],
                ans: 3,
                pattern: ["OK, Mom", "→", "I", "→", "will (承諾將會)"],
                exp: "承諾將會去做某事，使用未來式 will。此處 will 代替 will finish my report。",
                exs: ["Don't forget to call. I won't.", "Please be careful. I will.", "Wait for me. I will."]
            },
            {
                cat: "歷屆試題",
                q: "Melody has a great interest in planting flowers, but her sister _____. ",
                opts: ["can’t", "doesn’t", "isn’t", "won’t"],
                ans: 1,
                pattern: ["has (一般V)", "↔", "sister", "→", "doesn't"],
                exp: "對比現在狀態。has 此處為一般動詞「有」，後方對比否定用助動詞 doesn't。",
                exs: ["I have a bike, but she doesn't.", "He has a dog, but they don't.", "She has many books, but her brother doesn't."]
            },
            {
                cat: "歷屆試題",
                q: "Ken’s brothers like to watch tennis, but Ken _____. He is crazy about baseball.",
                opts: ["is", "isn’t", "does", "doesn’t"],
                ans: 3,
                pattern: ["like (一般V)", "↔", "Ken (單數)", "→", "doesn't"],
                exp: "對比喜好。前面是一般動詞 like，後方主詞 Ken 為單數，對應助動詞 doesn't。",
                exs: ["They play soccer, but he doesn't.", "We watch TV, but she doesn't.", "I like apples, but he doesn't."]
            },
            {
                cat: "歷屆試題",
                q: "My sister does not like the jacket, and I don't, _____. ",
                opts: ["either", "so", "too", "yet"],
                ans: 0,
                pattern: ["not like (否定)", "→", "don't", "→", "either"],
                exp: "否定附和句「也不...」。否定句尾使用 either；肯定句尾才用 too。",
                exs: ["I'm not hungry, and he isn't either.", "She doesn't like milk, and I don't either.", "They won't come, and we won't either."]
            },
            {
                cat: "歷屆試題",
                q: "Many of my classmates have had the experience of taking an airplane, but I _____. ",
                opts: ["don't", "wasn't", "won't", "haven't"],
                ans: 3,
                pattern: ["have had (現在完成式)", "↔", "I", "→", "haven't"],
                exp: "對比經驗。前面是現在完成式 (Have + p.p.)，後方對應助動詞 haven't。",
                exs: ["He has been to Japan, but I haven't.", "They have finished, but she hasn't.", "We have seen the movie, but he hasn't."]
            },
            {
                cat: "歷屆試題",
                q: "Alice: Have you ever been to a baseball game? \nJamie: No, never. _____ \nAlice: Sure. Baseball is my favorite sport.",
                opts: ["Do you?", "Have you?", "Don't you?", "Haven't you?"],
                ans: 1,
                pattern: ["Have you ever...?", "→", "Have you? (反問對方)"],
                exp: "Jamie 回答自己沒去過，接著反問 Alice 的經驗。根據 Alice 回答 'Sure'，可知 Jamie 是問 'Have you?' (你有去過嗎？)。",
                exs: ["I haven't eaten. Have you?", "She doesn't know. Do you?", "We didn't go. Did you?"]
            },

            // --- 附加問句 ---
            {
                cat: "附加問句",
                q: "Getting up early on a cold morning is not easy, _____?",
                opts: ["are you", "do you", "does it", "is it"],
                ans: 3,
                pattern: ["Getting up (Ving主詞)", "→", "is not (否定)", "→", "is it?"],
                exp: "主詞是 V-ing (動名詞) 視為單數 it。前面是 be 動詞否定 is not，後面用肯定 is it。",
                exs: ["Playing basketball is fun, isn't it?", "Reading books is good, isn't it?", "Swimming in the sea is dangerous, isn't it?"]
            },
            {
                cat: "附加問句",
                q: "Alice really likes having noodles for breakfast, _____?",
                opts: ["doesn't she", "is she", "hasn't she", "did she"],
                ans: 0,
                pattern: ["likes (肯定/一般V)", "→", "doesn't she?"],
                exp: "前肯後否。前面是一般動詞 likes，後方使用助動詞否定 doesn't，代名詞用 she。",
                exs: ["He speaks English, doesn't he?", "They live in Taipei, don't they?", "She works hard, doesn't she?"]
            },
            {
                cat: "附加問句",
                q: "The tall man over there is our new English teacher, _____?",
                opts: ["is he", "is there", "isn't he", "isn't there"],
                ans: 2,
                pattern: ["is (肯定be動詞)", "→", "isn't he?"],
                exp: "前肯後否。前面是 is，後面用 isn't，代名詞用 he。",
                exs: ["She is a doctor, isn't she?", "It is cold, isn't it?", "The dog is big, isn't it?"]
            },
            {
                cat: "附加問句",
                q: "Rose: Why not? They love each other, _____?",
                opts: ["will they", "won't they", "do they", "don't they"],
                ans: 3,
                pattern: ["love (肯定/一般V)", "→", "don't they?"],
                exp: "前肯後否。love 是一般動詞現在式，複數主詞對應助動詞否定 don't they。",
                exs: ["You know him, don't you?", "They have a car, don't they?", "Birds fly, don't they?"]
            },
            {
                cat: "附加問句",
                q: "Bus Number 286 goes there, _____?",
                opts: ["does it", "doesn't it", "is it", "isn't it"],
                ans: 1,
                pattern: ["goes (肯定/一般V)", "→", "doesn't it?"],
                exp: "前肯後否。goes 是一般動詞三單形式，後方用 doesn't it。",
                exs: ["The bus leaves at ten, doesn't it?", "It rains a lot here, doesn't it?", "The shop opens late, doesn't it?"]
            },
            {
                cat: "附加問句",
                q: "She's going to Europe, _____ she?",
                opts: ["doesn't", "hasn't", "isn't", "won't"],
                ans: 2,
                pattern: ["She's (=is) going", "→", "isn't she?"],
                exp: "這題的 She's 是 She is。進行式句型使用 be 動詞 is 對應，後方用 isn't。",
                exs: ["He's eating, isn't he?", "They're playing, aren't they?", "I'm late, aren't I?"]
            },
            {
                cat: "附加問句",
                q: "You've studied English for a long time, _____?",
                opts: ["did you", "didn't you", "have you", "haven't you"],
                ans: 3,
                pattern: ["You've (=have) studied", "→", "haven't you?"],
                exp: "這題的 You've 是 You have。現在完成式句型，後方對應助動詞 haven't。",
                exs: ["She's finished, hasn't she?", "They've gone, haven't they?", "We've met, haven't we?"]
            },

            // --- 頂尖特訓 (20題) ---
            {
                cat: "頂尖特訓：代名詞陷阱",
                q: "Tom's brothers are very good at playing basketball, but _____ not. They are terrible at sports.",
                opts: ["my is", "mine is", "my are", "mine are"],
                ans: 3,
                pattern: ["Tom's brothers (複數)", "→", "are", "↔", "mine (=my brothers)", "→", "are"],
                exp: "mine 在此指 my brothers (複數)。根據後面補述 They are terrible... 確定為複數，對應 be 動詞 are。",
                exs: ["Your keys are on the table, but mine are lost.", "Her eyes are blue, and mine are, too.", "Their bikes are new, but mine are old."]
            },
            {
                cat: "頂尖特訓：代名詞陷阱",
                q: "Mary's friends enjoy reading comic books in their free time, and _____ , too.",
                opts: ["mine do", "mine does", "mine are", "my does"],
                ans: 0,
                pattern: ["friends (複數)", "→", "enjoy (一般V)", "→", "mine (=my friends)", "→", "do"],
                exp: "mine = my friends (複數)。對應一般動詞現在式，助動詞用 do。",
                exs: ["His parents like tea, and mine do, too.", "Your dogs run fast, and mine do, too.", "Their kids study hard, and mine do, too."]
            },
            {
                cat: "頂尖特訓：代名詞陷阱",
                q: "Her dog barked loudly last night, but _____ . It slept very well.",
                opts: ["mine didn't", "mine wasn't", "hers didn't", "hers wasn't"],
                ans: 0,
                pattern: ["barked (過去V)", "↔", "mine (=my dog)", "→", "didn't"],
                exp: "mine = my dog (單數)。對應一般動詞過去式，否定助動詞用 didn't。",
                exs: ["My car started, but hers didn't.", "Your cat meowed, but mine didn't.", "His phone rang, but hers didn't."]
            },
            {
                cat: "頂尖特訓：代名詞陷阱",
                q: "Your computer has been broken for days, and _____ , too. Let's go buy new ones together.",
                opts: ["her has", "hers has", "hers have", "her have"],
                ans: 1,
                pattern: ["computer (單數)", "→", "has been", "→", "hers (=her computer)", "→", "has"],
                exp: "hers = her computer (單數)。對應現在完成式助動詞 has。注意 hers 是所有格代名詞，不可拆為 her has。",
                exs: ["My bag has arrived, and hers has, too.", "Your test has finished, and mine has, too.", "His money has gone, and hers has, too."]
            },
            {
                cat: "頂尖特訓：代名詞陷阱",

        let currentIdx = 0;
        let score = 0;

        function init() {
            renderQuestion();
        }

        function renderQuestion() {
            const quiz = rawData[currentIdx];
            document.getElementById('q-number').innerText = currentIdx + 1;
            document.getElementById('q-cat').innerText = quiz.cat;
            document.getElementById('progress-text').innerText = `${currentIdx + 1} / ${rawData.length}`;
            document.getElementById('progress-bar').style.width = `${((currentIdx + 1) / rawData.length) * 100}%`;
            document.getElementById('question-text').innerText = quiz.q;

            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            quiz.opts.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = "option-btn w-full text-left p-5 rounded-2xl border-2 border-slate-100 font-bold text-slate-700 bg-white shadow-sm flex items-center group";
                btn.innerHTML = `
                    <span class="w-10 h-10 rounded-xl bg-slate-50 flex items-center justify-center mr-5 text-sm font-black group-hover:bg-indigo-600 group-hover:text-white transition-colors">${String.fromCharCode(65 + idx)}</span> 
                    <span class="text-lg">${opt}</span>
                `;
                btn.onclick = () => checkAnswer(idx);
                grid.appendChild(btn);
            });

            document.getElementById('explanation-area').classList.add('hidden');
        }

        function checkAnswer(selectedIdx) {
            const quiz = rawData[currentIdx];
            const isCorrect = selectedIdx === quiz.ans;
            
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach((btn, idx) => {
                btn.onclick = null;
                if (idx === quiz.ans) {
                    btn.classList.add('success-bg', 'correct-border');
                } else if (idx === selectedIdx && !isCorrect) {
                    btn.classList.add('error-bg');
                } else {
                    btn.classList.add('opacity-40');
                }
            });

            const expArea = document.getElementById('explanation-area');
            const status = document.getElementById('result-status');
            const icon = document.getElementById('result-icon');
            const ansDisplay = document.getElementById('correct-ans-display');
            
            expArea.classList.remove('hidden');
            if (isCorrect) {
                status.innerText = "完全正確！Great Job!";
                status.className = "font-black text-2xl text-green-600";
                icon.innerHTML = '<i class="fas fa-check-double text-2xl"></i>';
                icon.className = "w-14 h-14 rounded-2xl flex items-center justify-center mr-5 text-white shadow-lg bg-green-500";
                score++;
            } else {
                status.innerText = "可惜了！再看一次解析";
                status.className = "font-black text-2xl text-red-600";
                icon.innerHTML = '<i class="fas fa-lightbulb text-2xl"></i>';
                icon.className = "w-14 h-14 rounded-2xl flex items-center justify-center mr-5 text-white shadow-lg bg-red-500";
            }
            
            ansDisplay.innerText = `正確答案：(${String.fromCharCode(65 + quiz.ans)}) ${quiz.opts[quiz.ans]}`;

            // Visual Pattern
            const patternDiv = document.getElementById('visual-pattern');
            patternDiv.innerHTML = '';
            quiz.pattern.forEach(part => {
                const span = document.createElement('span');
                if (["→", "←", "↔", "+"].includes(part)) {
                    span.className = "arrow mx-1 text-slate-300 text-xl";
                } else if (part === "and so" || part === "but" || part === "and neither") {
                    span.className = "px-3 py-1 bg-amber-100 text-amber-700 rounded-lg font-black text-xs border border-amber-200 uppercase";
                } else {
                    span.className = "px-4 py-2 bg-indigo-50 text-indigo-800 rounded-xl font-black text-sm shadow-sm border border-indigo-100";
                }
                span.innerText = part;
                patternDiv.appendChild(span);
            });

            document.getElementById('grammar-explanation').innerText = quiz.exp;

            const examplesList = document.getElementById('examples-list');
            examplesList.innerHTML = '';
            quiz.exs.forEach(ex => {
                const item = document.createElement('div');
                item.className = "flex items-center p-4 bg-white rounded-2xl border-2 border-slate-50 hover:border-emerald-200 transition-all cursor-pointer shadow-sm group";
                item.onclick = () => speak(ex);
                item.innerHTML = `
                    <div class="w-10 h-10 rounded-xl bg-emerald-50 text-emerald-600 flex-shrink-0 mr-4 flex items-center justify-center group-hover:bg-emerald-500 group-hover:text-white transition-all">
                        <i class="fas fa-play text-xs"></i>
                    </div>
                    <span class="text-slate-700 font-bold group-hover:text-emerald-700 transition-colors">${ex}</span>
                `;
                examplesList.appendChild(item);
            });

            setTimeout(() => {
                expArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        function nextQuestion() {
            currentIdx++;
            if (currentIdx < rawData.length) {
                renderQuestion();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                showResults();
            }
        }

        function showResults() {
            const container = document.getElementById('quiz-container');
            const percent = Math.round((score / rawData.length) * 100);
            let msg = percent >= 90 ? "神等級！你完全掌握了省略句！" : (percent >= 70 ? "表現優異！已經破解大部分陷阱了。" : "加油！再練習幾次，關鍵是找對應動詞。");
            
            container.innerHTML = `
                <div class="text-center py-16 animate-fade-in">
                    <div class="relative inline-block mb-10">
                        <div class="w-48 h-48 rounded-full border-[12px] border-indigo-50 flex items-center justify-center bg-white shadow-2xl">
                            <span class="text-6xl font-black text-indigo-600">${percent}%</span>
                        </div>
                        <div class="absolute -bottom-4 left-1/2 transform -translate-x-1/2 bg-slate-900 text-white px-8 py-2 rounded-2xl font-black text-lg shadow-xl">
                            SCORE
                        </div>
                    </div>
                    <h2 class="text-4xl font-black text-slate-800 mb-4">${msg}</h2>
                    <p class="text-slate-500 text-xl mb-12 font-bold">答對題數：${score} / ${rawData.length}</p>
                    <button onclick="location.reload()" class="bg-indigo-600 text-white px-12 py-5 rounded-3xl font-black text-xl hover:bg-indigo-700 transition shadow-2xl transform active:scale-95">
                        <i class="fas fa-redo mr-3"></i> 重新特訓
                    </button>
                </div>
            `;
        }

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'en-US';
                u.rate = 0.85;
                window.speechSynthesis.speak(u);
            }
        }

        window.onload = init;
    </script>
