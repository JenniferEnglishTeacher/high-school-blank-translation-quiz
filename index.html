<body>
<div class="wrap">
<section class="hero"><h1>翰林 B4U1 Dialogue 課文填空</h1><p>先看完整中文，再依課文完成英文挖空。答錯的空格會顯示正確答案，請重新填對後再進下一題。</p><p class="note">整句答對後會自動朗讀英文，並可使用麥克風朗讀同一句進行語音辨識。判定會忽略大小寫、標點、前後空白、多餘空格及直/彎撇號差異。</p></section>
<section id="selectScreen" class="card"><h2>1. 選擇要練習的句子</h2><div class="toolbar"><button class="btn" id="allBtn">全部選取</button><button class="btn" id="noneBtn">全部取消</button><button class="btn primary" id="startBtn">開始作答</button></div><div id="questionList" class="question-list"></div></section>
<section id="quizScreen" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="progressText"></span><span id="wrongCount"></span></div><div id="zhText" class="zh"></div><div id="enText" class="english"></div><div id="feedback" class="feedback hidden"></div><div id="voicePanel" class="voice-panel hidden"><h3>🔊 聽一聽，再自己念一次</h3><div id="voiceSentence" class="voice-sentence"></div><div class="toolbar"><button class="btn voice" id="speakBtn">🔊 再聽一次</button><button class="btn voice" id="micBtn">🎤 開始朗讀</button></div><div id="voiceResult" class="voice-result">按「開始朗讀」後，允許瀏覽器使用麥克風，再清楚念完整句子。</div></div><div class="footer-actions"><button class="btn primary" id="checkBtn">檢查答案</button><button class="btn primary hidden" id="nextBtn">下一題</button><button class="btn danger" id="finishBtn">結束作答</button></div></section>
<section id="resultScreen" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary-grid"></div><div id="resultMessage"></div><div id="wrongList" class="wrong-list"></div><div class="footer-actions"><button class="btn primary" id="downloadBtn">下載錯題 DOCX</button><button class="btn" id="restartBtn">重新選題</button></div></section>

{id:12,part:'Dialogue 1',zh:'我們去學校附近那間牛排館吧。',full:"Let's go to that steak house near the school.",segments:[B("Let's"),T(' go to '),B('that'),T(' '),B('steak'),T(' '),B('house'),T(' '),B('near'),T(' the school.')]},
{id:13,part:'Dialogue 1',zh:'寇弟：聽起來是個好主意！',full:'Cody: That sounds like a great idea.',segments:[T('Cody: '),B('That'),T(' '),B('sounds'),T(' '),B('like'),T(' '),B('a'),T(' '),B('great'),T(' '),B('idea'),T('.')]},
{id:14,part:'Dialogue 2',zh:'（學生們在看菜單。）',full:'(The students are reading the menu.)',segments:[T('(The students '),B('are'),T(' '),B('reading'),T(' '),B('the'),T(' '),B('menu'),T('.)')]},

{id:17,part:'Dialogue 2',zh:'柴克：我要一個起司漢堡，謝謝。',full:"Zac: I'll have the cheeseburger, please.",segments:[T('Zac: '),B("I'll"),T(' '),B('have'),T(' the '),B('cheeseburger'),T(', '),B('please'),T('.')]},
{id:18,part:'Dialogue 2',zh:'艾拉：我可以要牛排搭配薯條嗎？',full:'Ela: May I have the steak with fries?',segments:[T('Ela: '),B('May'),T(' '),B('I'),T(' '),B('have'),T(' the '),B('steak'),T(' '),B('with'),T(' '),B('fries'),T('?')]},
{id:19,part:'Dialogue 2',zh:'它看起來很好吃。',full:'It looks yummy. (= It looks delicious. = It looks good.)',segments:[B('It'),T(' '),B('looks'),T(' '),B('yummy'),T(' = '),B('delicious'),T(' = '),B('good'),T('.')]},

{id:21,part:'Dialogue 2',zh:'艾拉：請幫我做五分熟。潔米，那你呢？',full:'Ela: Medium, please. How about you, Jamie?',segments:[T('Ela: '),B('Medium'),T(', please. '),B('How',{accept:['How','What']}),T(' '),B('about'),T(' you, Jamie?')]},

{id:23,part:'Dialogue 2',zh:'這裡的南瓜派不但聞起來很香，嚐起來也很棒！',full:'The pumpkin pies here smell good and taste great!',segments:[T('The pumpkin pies here '),B('smell'),T(' '),B('good'),T(' and '),B('taste'),T(' '),B('great'),T('!')]},

];
const state={selected:[],index:0,wrong:new Map(),attempted:new Set(),finishedCorrect:new Set()};const $=s=>document.querySelector(s);const list=$('#questionList'),selectScreen=$('#selectScreen'),quizScreen=$('#quizScreen'),resultScreen=$('#resultScreen');let recognition=null;
function norm(v){return String(v??'').trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ')}function speechNorm(v){return norm(v).replace(/[^a-z0-9' ]/g,'').replace(/\b(i'm)\b/g,'i am').replace(/\b(i'll)\b/g,'i will').replace(/\b(i'd)\b/g,'i would').replace(/\b(don't)\b/g,'do not').replace(/\b(what's)\b/g,'what is').replace(/\b(let's)\b/g,'let us').replace(/\s+/g,' ').trim()}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function spokenText(q){let s=q.full.replace(/^[A-Za-z]+:\s*/,'').replace(/^\(|\)$/g,'');if(q.id===19)s='It looks yummy.';return s.trim()}
function similarity(a,b){const A=speechNorm(a).split(' ').filter(Boolean),B=speechNorm(b).split(' ').filter(Boolean);const d=Array.from({length:A.length+1},()=>Array(B.length+1).fill(0));for(let i=0;i<=A.length;i++)d[i][0]=i;for(let j=0;j<=B.length;j++)d[0][j]=j;for(let i=1;i<=A.length;i++)for(let j=1;j<=B.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(A[i-1]===B[j-1]?0:1));return Math.max(0,1-d[A.length][B.length]/Math.max(A.length,B.length,1))}
function speakCurrent(){const q=state.selected[state.index];if(!q||!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(spokenText(q));u.lang='en-US';u.rate=.88;u.pitch=1;const voices=window.speechSynthesis.getVoices();u.voice=voices.find(v=>/^en-US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang))||null;window.speechSynthesis.speak(u)}
function showVoicePractice(){const q=state.selected[state.index];$('#voiceSentence').textContent=spokenText(q);$('#voicePanel').classList.remove('hidden');$('#voiceResult').className='voice-result';$('#voiceResult').textContent='先聽整句，再按「開始朗讀」用英文念一次。';$('#micBtn').disabled=false;setTimeout(speakCurrent,250)}
function startRecognition(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('#voiceResult').className='voice-result retry';$('#voiceResult').textContent='這個瀏覽器目前不支援語音辨識。建議改用最新版 Chrome 或 Edge；你仍可使用「再聽一次」。';return}try{recognition?.abort()}catch(e){}recognition=new SR();recognition.lang='en-US';recognition.interimResults=false;recognition.continuous=false;recognition.maxAlternatives=3;$('#micBtn').disabled=true;$('#micBtn').textContent='🎤 聆聽中…';$('#voiceResult').className='voice-result';$('#voiceResult').textContent='正在聆聽，請清楚念完整句子…';recognition.onresult=e=>{const q=state.selected[state.index],target=spokenText(q);const alts=[...e.results[0]].map(x=>x.transcript);const scored=alts.map(t=>({t,s:similarity(t,target)})).sort((a,b)=>b.s-a.s)[0];const pct=Math.round(scored.s*100);$('#voiceResult').className='voice-result '+(scored.s>=.78?'good':'retry');$('#voiceResult').innerHTML=`<strong>辨識結果：</strong>${esc(scored.t)}<br><strong>與課文相似度：</strong>${pct}%<br>${scored.s>=.78?'✅ 很好！朗讀內容與課文相符。':'🔁 再聽一次正確句子，然後重新朗讀。'}`};recognition.onerror=e=>{$('#voiceResult').className='voice-result retry';const msg=e.error==='not-allowed'?'麥克風權限未開啟，請允許這個網站使用麥克風。':e.error==='no-speech'?'沒有偵測到語音，請再試一次。':'語音辨識暫時無法使用（'+e.error+'），請再試一次。';$('#voiceResult').textContent=msg};recognition.onend=()=>{$('#micBtn').disabled=false;$('#micBtn').textContent='🎤 開始朗讀'};try{recognition.start()}catch(e){$('#micBtn').disabled=false;$('#micBtn').textContent='🎤 開始朗讀'}}
function renderList(){list.innerHTML=questions.map(q=>`<label class="pick"><input type="checkbox" class="qpick" value="${q.id}" checked><span><b>第 ${q.id} 題｜${esc(q.part)}</b><small>${esc(q.zh)}</small></span></label>`).join('')}$('#allBtn').onclick=()=>document.querySelectorAll('.qpick').forEach(x=>x.checked=true);$('#noneBtn').onclick=()=>document.querySelectorAll('.qpick').forEach(x=>x.checked=false);$('#startBtn').onclick=()=>{const ids=[...document.querySelectorAll('.qpick:checked')].map(x=>+x.value);if(!ids.length){alert('請至少選一題。');return}state.selected=questions.filter(q=>ids.includes(q.id));state.index=0;state.wrong.clear();state.attempted.clear();state.finishedCorrect.clear();selectScreen.classList.add('hidden');resultScreen.classList.add('hidden');quizScreen.classList.remove('hidden');showQuestion()};
function showQuestion(){try{recognition?.abort()}catch(e){}window.speechSynthesis?.cancel();const q=state.selected[state.index];$('#progressText').textContent=`第 ${state.index+1} / ${state.selected.length} 題｜${q.part}`;$('#wrongCount').textContent=`曾答錯 ${state.wrong.size} 題`;$('#bar').style.width=`${((state.index+1)/state.selected.length)*100}%`;$('#zhText').textContent=q.zh;const box=$('#enText');box.innerHTML='';let bi=0;q.segments.forEach(seg=>{if(seg.type==='text'){box.append(document.createTextNode(seg.text));return}const span=document.createElement('span');span.className='blank';span.dataset.bi=bi;let c;if(seg.options){c=document.createElement('select');c.innerHTML='<option value="">請選擇</option>'+seg.options.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}else{c=document.createElement('input');c.type='text';c.autocomplete='off';c.style.width=`${seg.width}px`;c.placeholder='______'}c.dataset.bi=bi;span.appendChild(c);box.appendChild(span);bi++});$('#feedback').className='feedback hidden';$('#voicePanel').classList.add('hidden');$('#checkBtn').classList.remove('hidden');$('#nextBtn').classList.add('hidden');setTimeout(()=>box.querySelector('input,select')?.focus(),0)}
function blankDefs(q){return q.segments.filter(s=>s.type==='blank')}function currentValues(){return [...$('#enText').querySelectorAll('input,select')].map(x=>x.value)}
$('#checkBtn').onclick=()=>{const q=state.selected[state.index],defs=blankDefs(q),ctrls=[...$('#enText').querySelectorAll('input,select')],vals=currentValues();if(vals.some(v=>!String(v).trim())){alert('請完成所有空格後再檢查。');return}state.attempted.add(q.id);let all=true;const wrongPieces=[];ctrls.forEach((c,i)=>{const span=c.closest('.blank'),d=defs[i],ok=d.accept.some(a=>norm(a)===norm(c.value));span.classList.remove('correct','wrong');span.querySelector('.blank-answer')?.remove();if(ok){span.classList.add('correct');c.disabled=true}else{all=false;span.classList.add('wrong');wrongPieces.push(`空格 ${i+1}: ${c.value}`);const hint=document.createElement('span');hint.className='blank-answer';hint.textContent=`正確：${d.answer}`;span.appendChild(hint);c.value='';c.disabled=false}});if(all){state.finishedCorrect.add(q.id);$('#feedback').className='feedback ok';$('#feedback').textContent='✅ 全部正確！現在先聽完整句，再自己朗讀一次。';$('#checkBtn').classList.add('hidden');$('#nextBtn').classList.remove('hidden');showVoicePractice()}else{if(!state.wrong.has(q.id))state.wrong.set(q.id,{q,attempts:[]});state.wrong.get(q.id).attempts.push(wrongPieces.join('； '));$('#wrongCount').textContent=`曾答錯 ${state.wrong.size} 題`;$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 有空格錯誤。紅色空格下方已顯示正確答案；請只重填錯誤空格，再按一次「檢查答案」。';$('#enText').querySelector('input:not(:disabled),select:not(:disabled)')?.focus()}};
$('#speakBtn').onclick=speakCurrent;$('#micBtn').onclick=startRecognition;$('#nextBtn').onclick=()=>{state.index++;if(state.index>=state.selected.length)finishQuiz();else showQuestion()};$('#finishBtn').onclick=()=>finishQuiz();
function finishQuiz(){try{recognition?.abort()}catch(e){}window.speechSynthesis?.cancel();quizScreen.classList.add('hidden');resultScreen.classList.remove('hidden');const selected=state.selected.length,attempted=state.attempted.size,correct=state.finishedCorrect.size,wrong=state.wrong.size;$('#summary').innerHTML=`<div class="stat">選擇題數<b>${selected}</b></div><div class="stat">已作答<b>${attempted}</b></div><div class="stat">完成答對<b>${correct}</b></div><div class="stat">曾答錯<b>${wrong}</b></div>`;if(!wrong){$('#resultMessage').innerHTML='<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>';$('#wrongList').innerHTML='';$('#downloadBtn').classList.add('hidden')}else{$('#resultMessage').innerHTML='<p>以下題目曾經答錯；即使後來已改正，仍會保留在錯題 DOCX 中。</p>';$('#wrongList').innerHTML=[...state.wrong.values()].map((r,i)=>`<div class="wrong-card"><b>${i+1}. ${esc(r.q.zh)}</b><p>錯誤紀錄：${r.attempts.map(esc).join('<br>')}</p><p><strong>正確英文：</strong>${esc(r.q.full)}</p></div>`).join('');$('#downloadBtn').classList.remove('hidden')}}$('#restartBtn').onclick=()=>{resultScreen.classList.add('hidden');selectScreen.classList.remove('hidden')};
$('#downloadBtn').onclick=async()=>{if(!state.wrong.size)return;const children=[new Paragraph({heading:HeadingLevel.TITLE,children:[new TextRun({text:'翰林 B4U1 Dialogue 課文填空－錯題紀錄',bold:true})]}),new Paragraph({children:[new TextRun({text:`曾答錯共 ${state.wrong.size} 題`})]})];[...state.wrong.values()].forEach((r,i)=>{children.push(new Paragraph({heading:HeadingLevel.HEADING_2,children:[new TextRun({text:`${i+1}. ${r.q.zh}`,bold:true})]}));children.push(new Paragraph({children:[new TextRun({text:'學生錯誤答案：',bold:true}),new TextRun({text:r.attempts.join(' | ')})]}));children.push(new Paragraph({children:[new TextRun({text:'正確完整英文：',bold:true}),new TextRun({text:r.q.full})]}));children.push(new Paragraph({children:[new TextRun({text:'重新練習：____________________________________________________________'})]}))});const doc=new Document({sections:[{properties:{},children}]});const blob=await Packer.toBlob(doc);const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`翰林B4U1_Dialogue_錯題_${new Date().toISOString().slice(0,10)}.docx`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};
renderList();
</script>
