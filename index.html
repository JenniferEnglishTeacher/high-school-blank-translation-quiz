<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>翰林 B4U1 Dialogue 課文填空</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#1f2937;--muted:#6b7280;--line:#dbe2ea;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--accent:#2563eb;--accent2:#1d4ed8}
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}.wrap{max-width:980px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#eaf2ff,#fff);border:1px solid #dbeafe;border-radius:18px;padding:24px;margin-bottom:18px}.hero h1{margin:0 0 6px;font-size:clamp(25px,4vw,38px)}.hero p{margin:4px 0;color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 5px 18px rgba(15,23,42,.05)}.hidden{display:none!important}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.btn{border:0;border-radius:10px;padding:11px 16px;font-size:16px;font-weight:700;cursor:pointer;background:#e5e7eb;color:#111827}.btn.primary{background:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent2)}.btn.danger{background:#991b1b;color:#fff}.question-list{display:grid;gap:8px;margin-top:15px}.pick{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fafafa}.pick input{margin-top:5px;transform:scale(1.15)}.pick small{display:block;color:var(--muted)}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;width:0;background:var(--accent);transition:width .2s}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-weight:700;margin:8px 0 18px}.zh{font-size:22px;font-weight:800;padding:16px;border-left:5px solid var(--accent);background:#eff6ff;border-radius:8px;margin-bottom:18px}.speaker{font-weight:900}.english{font-size:20px;line-height:2.15}.blank{display:inline-block;vertical-align:middle;margin:2px 4px}.blank input,.blank select{font:inherit;min-width:92px;max-width:230px;padding:6px 8px;border:2px solid #94a3b8;border-radius:8px;background:#fff}.blank input:focus,.blank select:focus{outline:3px solid #bfdbfe;border-color:var(--accent)}.blank.correct input,.blank.correct select{border-color:var(--ok);background:var(--okbg)}.blank.wrong input,.blank.wrong select{border-color:var(--bad);background:var(--badbg)}.blank-answer{display:block;font-size:13px;line-height:1.35;color:var(--bad);font-weight:800;margin-top:2px}.feedback{margin-top:14px;padding:12px 14px;border-radius:10px;font-weight:800}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.footer-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:15px 0}.stat{padding:15px;border:1px solid var(--line);border-radius:12px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong-list{display:grid;gap:12px}.wrong-card{border:1px solid #fecaca;background:#fff7f7;border-radius:12px;padding:14px}.wrong-card p{margin:5px 0}.note{font-size:14px;color:var(--muted)}@media(max-width:640px){.wrap{padding:12px}.card{padding:16px}.zh{font-size:19px}.english{font-size:18px}.blank input,.blank select{min-width:76px;max-width:180px}.meta{font-size:14px}}
</style>
</head>
<body>
<div class="wrap">
  <section class="hero">
    <h1>翰林 B4U1 Dialogue 課文填空</h1>
    <p>先看完整中文，再依課文完成英文挖空。答錯的空格會顯示正確答案，請重新填對後再進下一題。</p>
    <p class="note">判定會忽略英文大小寫、前後空白、多餘空格，以及直/彎撇號差異。</p>
  </section>

  <section id="selectScreen" class="card">
    <h2>1. 選擇要練習的句子</h2>
    <div class="toolbar">
      <button class="btn" id="allBtn">全部選取</button>
      <button class="btn" id="noneBtn">全部取消</button>
      <button class="btn primary" id="startBtn">開始作答</button>
    </div>
    <div id="questionList" class="question-list"></div>
  </section>

  <section id="quizScreen" class="card hidden">
    <div class="progress"><div id="bar" class="bar"></div></div>
    <div class="meta"><span id="progressText"></span><span id="wrongCount"></span></div>
    <div id="zhText" class="zh"></div>
    <div id="enText" class="english"></div>
    <div id="feedback" class="feedback hidden"></div>
    <div class="footer-actions">
      <button class="btn primary" id="checkBtn">檢查答案</button>
      <button class="btn primary hidden" id="nextBtn">下一題</button>
      <button class="btn danger" id="finishBtn">結束作答</button>
    </div>
  </section>

  <section id="resultScreen" class="card hidden">
    <h2>作答結果</h2>
    <div id="summary" class="summary-grid"></div>
    <div id="resultMessage"></div>
    <div id="wrongList" class="wrong-list"></div>
    <div class="footer-actions">
      <button class="btn primary" id="downloadBtn">下載錯題 DOCX</button>
      <button class="btn" id="restartBtn">重新選題</button>
    </div>
  </section>
</div>

<script type="module">
import { Document, Packer, Paragraph, TextRun, HeadingLevel } from "https://esm.sh/docx@9.5.1";

const B=(answer, opts={})=>({type:'blank',answer,accept:opts.accept||[answer],options:opts.options||null,width:opts.width||Math.max(82, Math.min(210, String(answer).length*15+30))});
const T=(text)=>({type:'text',text});

const questions=[
{id:1,part:'Dialogue 1',zh:'（艾拉是從土耳其來的學生。）',full:'(Ela is a student from Turkey.)',segments:[T('(Ela is a student '),B('from'),T(' '),B('Turkey'),T('.)')]},
{id:2,part:'Dialogue 1',zh:'柴克：艾拉，你的國家是什麼樣子？',full:"Zac: What's your country like, Ela?",segments:[T('Zac: '),B("What's"),T(' your '),B('country'),T(' '),B('like'),T(', Ela?')]},
{id:3,part:'Dialogue 1',zh:'艾拉：土耳其比臺灣大，也比臺灣冷。',full:'Ela: Turkey is bigger and colder than Taiwan.',segments:[T('Ela: Turkey is '),B('bigger'),T(' and '),B('colder'),T(' '),B('than'),T(' Taiwan.')]},
{id:4,part:'Dialogue 1',zh:'潔米：你喜歡住在臺灣嗎？',full:'Jamie: Do you like living in Taiwan?',segments:[T('Jamie: '),B('Do'),T(' you '),B('like'),T(' '),B('living',{options:['live','to live','living']}),T(' in Taiwan?')]},
{id:5,part:'Dialogue 1',zh:'艾拉：喜歡。這裡生活很方便，在臺灣四處遊玩也比在土耳其容易許多。',full:'Ela: Yes, I do. Life here is convenient, and getting around in Taiwan is easier than in Turkey.',segments:[T('Ela: Yes, I '),B('do'),T('. '),B('Life'),T(' '),B('here'),T(' is '),B('convenient'),T(', and '),B('getting',{options:['get','getting']}),T(' '),B('around'),T(' in Taiwan is '),B('easier'),T(' '),B('than'),T(' in Turkey.')]},
{id:6,part:'Dialogue 1',zh:'柴克：你喜歡這裡的食物嗎？',full:'Zac: How do you like the food here?',segments:[T('Zac: '),B('How',{options:['What','How']}),T(' '),B('do'),T(' you '),B('like'),T(' the food here?')]},
{id:7,part:'Dialogue 1',zh:'艾拉：嗯...我家人跟我不吃豬肉，但這裡的人都喜愛豬肉。',full:"Ela: Well...my family and I don't eat pork, but people here love pork.",segments:[T('Ela: Well...my '),B('family'),T(' and '),B('I'),T(' '),B("don't"),T(' '),B('eat'),T(' '),B('pork'),T(', '),B('but'),T(' '),B('people'),T(' '),B('here'),T(' love '),B('pork'),T('.')]},
{id:8,part:'Dialogue 1',zh:'寇弟：你吃牛肉嗎？',full:'Cody: Do you eat beef?',segments:[T('Cody: '),B('Do'),T(' you '),B('eat'),T(' '),B('beef'),T('?')]},
{id:9,part:'Dialogue 1',zh:'艾拉：當然。這裡的牛肉料理比我們家鄉的還好吃。',full:'Ela: Sure. Beef dishes here are more delicious than the ones back home.',segments:[T('Ela: '),B('Sure'),T('. '),B('Beef'),T(' '),B('dishes'),T(' here are '),B('more'),T(' '),B('delicious'),T(' '),B('than'),T(' the '),B('ones',{options:['it','them','one','ones']}),T(' '),B('back'),T(' '),B('home'),T('.')]},
{id:10,part:'Dialogue 1',zh:'柴克：我現在覺得餓了。',full:'Zac: I feel hungry now.',segments:[T('Zac: I '),B('feel'),T(' '),B('hungry'),T(' now.')]},
{id:11,part:'Dialogue 1',zh:'潔米：我也餓了。',full:"Jamie: I'm getting hungry, too.",segments:[T('Jamie: '),B("I'm"),T(' '),B('getting'),T(' '),B('hungry'),T(', '),B('too'),T('.')]},
{id:12,part:'Dialogue 1',zh:'我們去學校附近那間牛排館吧。',full:"Let's go to that steak house near the school.",segments:[B("Let's"),T(' go to '),B('that'),T(' '),B('steak'),T(' '),B('house'),T(' '),B('near'),T(' the school.')]},
{id:13,part:'Dialogue 1',zh:'寇弟：聽起來是個好主意！',full:'Cody: That sounds like a great idea.',segments:[T('Cody: '),B('That'),T(' '),B('sounds'),T(' '),B('like'),T(' '),B('a'),T(' '),B('great'),T(' '),B('idea'),T('.')]},
{id:14,part:'Dialogue 2',zh:'（學生們在看菜單。）',full:'(The students are reading the menu.)',segments:[T('(The students '),B('are'),T(' '),B('reading'),T(' '),B('the'),T(' '),B('menu'),T('.)')]},
{id:15,part:'Dialogue 2',zh:'女服務生：請問可以幫你們點餐了嗎？',full:'Waitress: May I take your order?',segments:[T('Waitress: '),B('May'),T(' '),B('I'),T(' '),B('take'),T(' '),B('your'),T(' '),B('order'),T('?')]},
{id:16,part:'Dialogue 2',zh:'寇弟：可以。我想要一個火腿起司三明治。',full:"Cody: Yes. I'd like the ham and cheese sandwich.",segments:[T('Cody: Yes. '),B("I'd"),T(' '),B('like'),T(' the '),B('ham'),T(' and cheese '),B('sandwich'),T('.')]},
{id:17,part:'Dialogue 2',zh:'柴克：我要一個起司漢堡，謝謝。',full:"Zac: I'll have the cheeseburger, please.",segments:[T('Zac: '),B("I'll"),T(' '),B('have'),T(' the '),B('cheeseburger'),T(', '),B('please'),T('.')]},
{id:18,part:'Dialogue 2',zh:'艾拉：我可以要牛排搭配薯條嗎？',full:'Ela: May I have the steak with fries?',segments:[T('Ela: '),B('May'),T(' '),B('I'),T(' '),B('have'),T(' the '),B('steak'),T(' '),B('with'),T(' '),B('fries'),T('?')]},
{id:19,part:'Dialogue 2',zh:'它看起來很好吃。',full:'It looks yummy. (= It looks delicious. = It looks good.)',segments:[B('It'),T(' '),B('looks'),T(' '),B('yummy'),T(' = '),B('delicious'),T(' = '),B('good'),T('.')]},
{id:20,part:'Dialogue 2',zh:'女服務生：請問你的牛排要幾分熟？',full:'Waitress: How would you like your steak?',segments:[T('Waitress: '),B('How'),T(' '),B('would'),T(' '),B('you'),T(' '),B('like'),T(' '),B('your'),T(' '),B('steak'),T('?')]},
{id:21,part:'Dialogue 2',zh:'艾拉：請幫我做五分熟。潔米，那你呢？',full:'Ela: Medium, please. How about you, Jamie?',segments:[T('Ela: '),B('Medium'),T(', please. '),B('How',{accept:['How','What']}),T(' '),B('about'),T(' you, Jamie?')]},
{id:22,part:'Dialogue 2',zh:'潔米：我要兩個漢堡跟一個南瓜派佐冰淇淋。',full:"Jamie: I'll have two hamburgers and one pumpkin pie with ice cream.",segments:[T('Jamie: '),B("I'll"),T(' '),B('have'),T(' two '),B('hamburgers'),T(' and one '),B('pumpkin'),T(' pie '),B('with'),T(' ice cream.')]},
{id:23,part:'Dialogue 2',zh:'這裡的南瓜派不但聞起來很香，嚐起來也很棒！',full:'The pumpkin pies here smell good and taste great!',segments:[T('The pumpkin pies here '),B('smell'),T(' '),B('good'),T(' and '),B('taste'),T(' '),B('great'),T('!')]},
{id:24,part:'Dialogue 2',zh:'艾拉：真的嗎？那我也要一個。',full:'Ela: Really? I want one, too.',segments:[T('Ela: Really? I '),B('want'),T(' '),B('one',{options:['it','one']}),T(', '),B('too'),T('.')]},
{id:25,part:'Dialogue 2',zh:'柴克：你們兩個的胃口比我們的還好。',full:'Zac: You two have a better appetite than we do.',segments:[T('Zac: You two '),B('have'),T(' '),B('a'),T(' '),B('better'),T(' '),B('appetite'),T(' than '),B('we do'),T('.')]}
];

const state={selected:[],index:0,wrong:new Map(),attempted:new Set(),finishedCorrect:new Set()};
const $=s=>document.querySelector(s);
const list=$('#questionList'), selectScreen=$('#selectScreen'), quizScreen=$('#quizScreen'), resultScreen=$('#resultScreen');
function norm(v){return String(v??'').trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ')}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function renderList(){list.innerHTML=questions.map(q=>`<label class="pick"><input type="checkbox" class="qpick" value="${q.id}" checked><span><b>第 ${q.id} 題｜${esc(q.part)}</b><small>${esc(q.zh)}</small></span></label>`).join('')}
$('#allBtn').onclick=()=>document.querySelectorAll('.qpick').forEach(x=>x.checked=true);
$('#noneBtn').onclick=()=>document.querySelectorAll('.qpick').forEach(x=>x.checked=false);
$('#startBtn').onclick=()=>{const ids=[...document.querySelectorAll('.qpick:checked')].map(x=>+x.value);if(!ids.length){alert('請至少選一題。');return}state.selected=questions.filter(q=>ids.includes(q.id));state.index=0;state.wrong.clear();state.attempted.clear();state.finishedCorrect.clear();selectScreen.classList.add('hidden');resultScreen.classList.add('hidden');quizScreen.classList.remove('hidden');showQuestion()};

function showQuestion(){const q=state.selected[state.index];$('#progressText').textContent=`第 ${state.index+1} / ${state.selected.length} 題｜${q.part}`;$('#wrongCount').textContent=`曾答錯 ${state.wrong.size} 題`;$('#bar').style.width=`${((state.index+1)/state.selected.length)*100}%`;$('#zhText').textContent=q.zh;const box=$('#enText');box.innerHTML='';let bi=0;q.segments.forEach(seg=>{if(seg.type==='text'){box.append(document.createTextNode(seg.text));return}const span=document.createElement('span');span.className='blank';span.dataset.bi=bi;let control;if(seg.options){control=document.createElement('select');control.innerHTML=`<option value="">請選擇</option>`+seg.options.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}else{control=document.createElement('input');control.type='text';control.autocomplete='off';control.style.width=`${seg.width}px`;control.placeholder='______'}control.dataset.bi=bi;span.appendChild(control);box.appendChild(span);bi++});$('#feedback').className='feedback hidden';$('#feedback').textContent='';$('#checkBtn').classList.remove('hidden');$('#nextBtn').classList.add('hidden');setTimeout(()=>box.querySelector('input,select')?.focus(),0)}

function blankDefs(q){return q.segments.filter(s=>s.type==='blank')}
function currentValues(){return [...$('#enText').querySelectorAll('input,select')].map(x=>x.value)}
$('#checkBtn').onclick=()=>{const q=state.selected[state.index], defs=blankDefs(q), ctrls=[...$('#enText').querySelectorAll('input,select')], vals=currentValues();if(vals.some(v=>!String(v).trim())){alert('請完成所有空格後再檢查。');return}state.attempted.add(q.id);let all=true;const wrongPieces=[];ctrls.forEach((c,i)=>{const span=c.closest('.blank'),d=defs[i],ok=d.accept.some(a=>norm(a)===norm(c.value));span.classList.remove('correct','wrong');span.querySelector('.blank-answer')?.remove();if(ok){span.classList.add('correct');c.disabled=true}else{all=false;span.classList.add('wrong');wrongPieces.push(`空格 ${i+1}: ${c.value}`);const hint=document.createElement('span');hint.className='blank-answer';hint.textContent=`正確：${d.answer}`;span.appendChild(hint);c.value='';c.disabled=false}});if(all){state.finishedCorrect.add(q.id);$('#feedback').className='feedback ok';$('#feedback').textContent='✅ 全部正確！可以進入下一題。';$('#checkBtn').classList.add('hidden');$('#nextBtn').classList.remove('hidden')}else{if(!state.wrong.has(q.id))state.wrong.set(q.id,{q,attempts:[]});state.wrong.get(q.id).attempts.push(wrongPieces.join('； '));$('#wrongCount').textContent=`曾答錯 ${state.wrong.size} 題`;$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 有空格錯誤。紅色空格下方已顯示正確答案；請只重填錯誤空格，再按一次「檢查答案」。';$('#enText').querySelector('input:not(:disabled),select:not(:disabled)')?.focus()}};
$('#nextBtn').onclick=()=>{state.index++;if(state.index>=state.selected.length)finishQuiz();else showQuestion()};
$('#finishBtn').onclick=()=>finishQuiz();

function finishQuiz(){quizScreen.classList.add('hidden');resultScreen.classList.remove('hidden');const selected=state.selected.length, attempted=state.attempted.size, correct=state.finishedCorrect.size, wrong=state.wrong.size;$('#summary').innerHTML=`<div class="stat">選擇題數<b>${selected}</b></div><div class="stat">已作答<b>${attempted}</b></div><div class="stat">完成答對<b>${correct}</b></div><div class="stat">曾答錯<b>${wrong}</b></div>`;if(!wrong){$('#resultMessage').innerHTML='<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>';$('#wrongList').innerHTML='';$('#downloadBtn').classList.add('hidden')}else{$('#resultMessage').innerHTML='<p>以下題目曾經答錯；即使後來已改正，仍會保留在錯題 DOCX 中。</p>';$('#wrongList').innerHTML=[...state.wrong.values()].map((r,i)=>`<div class="wrong-card"><b>${i+1}. ${esc(r.q.zh)}</b><p>錯誤紀錄：${r.attempts.map(esc).join('<br>')}</p><p><strong>正確英文：</strong>${esc(r.q.full)}</p></div>`).join('');$('#downloadBtn').classList.remove('hidden')}}
$('#restartBtn').onclick=()=>{resultScreen.classList.add('hidden');selectScreen.classList.remove('hidden')};

$('#downloadBtn').onclick=async()=>{if(!state.wrong.size)return;const children=[new Paragraph({heading:HeadingLevel.TITLE,children:[new TextRun({text:'翰林 B4U1 Dialogue 課文填空－錯題紀錄',bold:true})]}),new Paragraph({children:[new TextRun({text:`曾答錯共 ${state.wrong.size} 題`})]})];[...state.wrong.values()].forEach((r,i)=>{children.push(new Paragraph({heading:HeadingLevel.HEADING_2,children:[new TextRun({text:`${i+1}. ${r.q.zh}`,bold:true})]}));children.push(new Paragraph({children:[new TextRun({text:'學生錯誤答案：',bold:true}),new TextRun({text:r.attempts.join(' | ')})]}));children.push(new Paragraph({children:[new TextRun({text:'正確完整英文：',bold:true}),new TextRun({text:r.q.full})]}));children.push(new Paragraph({children:[new TextRun({text:'重新練習：____________________________________________________________'})]}))});const doc=new Document({sections:[{properties:{},children}]});const blob=await Packer.toBlob(doc);const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`翰林B4U1_Dialogue_錯題_${new Date().toISOString().slice(0,10)}.docx`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)};

renderList();
</script>
</body>
</html>
