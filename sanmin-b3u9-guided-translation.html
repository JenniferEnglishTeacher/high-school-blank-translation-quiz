:root{--blue:#2563eb;--deep:#172554;--bg:#f4f7fb;--line:#d9e2ef;--ok:#15803d;--bad:#b91c1c;--violet:#6d28d9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#172033;font-family:Arial,"Microsoft JhengHei",sans-serif;line-height:1.7}main{max-width:1060px;margin:auto;padding:14px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 7px 24px #0f172a0c}.hero{background:linear-gradient(135deg,#eff6ff,#fff)}h1{margin:0;font-size:clamp(25px,4vw,38px)}h2,h3{margin:0 0 10px}.muted{color:#64748b}.hidden{display:none!important}.btn{border:0;border-radius:10px;padding:10px 15px;font:800 16px inherit;cursor:pointer;background:#e5e7eb;color:#172033;text-decoration:none}.primary{background:var(--blue);color:#fff}.voice{background:var(--violet);color:#fff}.danger{background:#991b1b;color:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.progress{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;font-weight:800;color:#64748b;margin:9px 0}.prompt,.passage{font-size:18px;background:#f8fafc;border-radius:12px;padding:16px;white-space:pre-wrap}.passage{max-height:48vh;overflow:auto}.blank-now{background:#fef3c7;color:#92400e;padding:2px 7px;border-radius:6px;font-weight:900}.options{display:grid;gap:9px;margin:14px 0}.option{border:2px solid #cbd5e1;background:#fff;border-radius:11px;padding:12px 14px;text-align:left;font:700 16px inherit;cursor:pointer}.option:hover{border-color:var(--blue)}.option.wrong{border-color:#fecaca;background:#fff1f2}.option.correct{border-color:#86efac;background:#f0fdf4}.feedback,.reference{padding:13px;border-radius:10px;margin:12px 0;font-weight:800;white-space:pre-wrap}.feedback.ok{background:#ecfdf3;color:var(--ok)}.feedback.bad{background:#fff1f2;color:var(--bad)}.reference{border:2px solid #bbf7d0;background:#f0fdf4}.translation{white-space:pre-wrap;background:#f8fafc;padding:16px;border-radius:12px;font-size:18px}.inline-input{width:150px;max-width:100%;font:inherit;padding:7px 9px;border:2px solid #94a3b8;border-radius:8px;margin:3px}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:#f5f3ff;margin:12px 0}.voice-result{background:#fff;border:1px solid #ddd6fe;padding:10px;border-radius:9px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat,.wrong-card{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong-card{margin:10px 0;background:#fff7f7;border-color:#fecaca}@media(max-width:620px){main{padding:8px}.hero,.card{padding:15px}.meta{display:block}.prompt,.passage,.translation{font-size:16px}}
</style></head><body><main><section class="hero"><h1>三民普高 B3U9｜引導式翻譯</h1><p class="muted">原題互動練習｜33 題｜即時批改｜錯誤重填｜答對後整句播放＋選做 STT｜錯題 DOCX｜成績登錄</p><div class="actions"><a class="btn" href="dashboard.html">← 回 Dashboard</a></div></section><section id="quiz" class="card"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="reference" class="reference hidden"></div><div id="voiceBox" class="voicebox hidden"><h3>🎙️ Pronunciation Check（選做）</h3><p><b id="voiceTarget"></b></p><div class="actions"><button id="speak" class="btn voice">🔊 再聽一次</button><button id="mic" class="btn primary">🎤 開始朗讀評分</button></div><div id="voiceResult" class="voice-result">尚未進行朗讀評分。</div></div><div class="actions"><button id="check" class="btn primary hidden">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束本輪</button></div></section><section id="result" class="card hidden"><h2>練習結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="download" class="btn primary">下載錯題 DOCX</button><button id="restart" class="btn">重新練習</button></div></section></main><script>
const QUIZ={"unit":"B3U9","kind":"translation","title":"引導式翻譯","count":33,"data":[{"number":1,"prompt":"The garbage is _____________ _____________ a sickening smell. You'd better take it out at once.\n垃圾散發出令人作嘔的臭味。你最好馬上把它拿出去。","answers":["giving","off"],"sentence":"The garbage is giving off a sickening smell. You'd better take it out at once."},{"number":2,"prompt":"明天的會議被取消了，因為主席心臟病突然發作，現在仍然在醫院裡。\nTomorrow's meeting has been _____________ _____________ because the chairman had a sudden heart attack and is still in the hospital.","answers":["called","off"],"sentence":"Tomorrow's meeting has been called off because the chairman had a sudden heart attack and is still in the hospital."},{"number":3,"prompt":"Since house prices keep rising _____________ _____________ _____________, more and more young people nowadays can't afford a house of their own.\n由於房價逐年攀升，現在越來越多年輕人都買不起自己的房子。","answers":["year","after","year"],"sentence":"Since house prices keep rising year after year, more and more young people nowadays can't afford a house of their own."},{"number":4,"prompt":"這些小雕像看起來很漂亮；更重要的是，這是孩子們自己做的。\nThese little statues look stunning; _____________ _____________, the children made them on their own.","answers":["what's","more"],"sentence":"These little statues look stunning; what's more, the children made them on their own."},{"number":5,"prompt":"這棟新的摩天樓吸引世界各地的觀光客，振興了當地的觀光業。\nThe new skyscraper attracts ____________ from every part of the world, boosting the local ____________.","answers":["tourists","tourism"],"sentence":"The new skyscraper attracts tourists from every part of the world, boosting the local tourism."},{"number":6,"prompt":"這個組織捐了大量的太陽能照明燈給村落，這件事情解決了他們夜間照明的問題。\nThe organization donated a huge number of solar lamps to the villages, _____________ _____________ their lighting problems at night.","answers":["which","solved"],"sentence":"The organization donated a huge number of solar lamps to the villages, which solved their lighting problems at night."},{"number":7,"prompt":"這棟空無一人的房子聽說被一個只有過了午夜才會出現的吸血鬼糾纏。\nThe deserted house _____________ _____________ _____________ _____________ _____________ by a vampire who only showed up after midnight.","answers":["was","said","to","be","haunted"],"sentence":"The deserted house was said to be haunted by a vampire who only showed up after midnight."},{"number":8,"prompt":"在這個公園裡燃放鞭炮是違法的，所以你最好不要在這邊放鞭炮。\n_____________ _____________ firecrackers in this park is against the law, so you had better not do it here.","answers":["Setting","off"],"sentence":"Setting off firecrackers in this park is against the law, so you had better not do it here."},{"number":9,"prompt":"謠傳那個逃犯偷偷躲在叢林裡面。\nThe fugitive _____________ _____________ _____________ be secretly hiding in the jungle.","answers":["was","rumored","to"],"sentence":"The fugitive was rumored to be secretly hiding in the jungle."},{"number":10,"prompt":"The farmer _____________ _____________ firecrackers to frighten away the birds that were feeding on the crops.\n農夫點燃鞭炮來嚇跑正在吃作物的鳥兒。","answers":["set","off"],"sentence":"The farmer set off firecrackers to frighten away the birds that were feeding on the crops."},{"number":11,"prompt":"據報導，那位政治人物在醜聞曝光後就消失得無影無蹤。\n____________ is ____________ that the politician has disappeared without a ____________ after the scandal was exposed.","answers":["It","reported","trace"],"sentence":"It is reported that the politician has disappeared without a trace after the scandal was exposed."},{"number":12,"prompt":"救援隊試著搶救恐怖攻擊的受害者，卻只發現倒塌的大樓和熊熊大火。\nThe rescue team tried to save the victims from the terrorist attack, _____________ _____________ _____________ collapsed buildings and huge flames.","answers":["only","to","find"],"sentence":"The rescue team tried to save the victims from the terrorist attack, only to find collapsed buildings and huge flames."},{"number":13,"prompt":"Judy 趕到辦公室，卻發現會議被取消了。\nJudy rushed to the office, _____________ _____________ find that the meeting was canceled.","answers":["only","to"],"sentence":"Judy rushed to the office, only to find that the meeting was canceled."},{"number":14,"prompt":"由於中風發作，總經理不得不取消會議。\nHaving a stroke, the general manager had no choice but to _____________ _____________ the meeting.","answers":["call","off"],"sentence":"Having a stroke, the general manager had no choice but to call off the meeting."},{"number":15,"prompt":"這部知名劇作家編寫的戲劇總共有五幕。\nThe play written by a famous playwright _____________ _____________ five acts.","answers":["consists","of"],"sentence":"The play written by a famous playwright consists of five acts."},{"number":16,"prompt":"即使在國外留學多年，John不曾忘記在他心中根深蒂固的臺灣文化。\nEven though John has studied abroad for many years, he never forgets the Taiwanese culture which has ____________ ____________ in his mind.","answers":["taken","root"],"sentence":"Even though John has studied abroad for many years, he never forgets the Taiwanese culture which has taken root in his mind."},{"number":17,"prompt":"警方仔細地搜查犯罪現場的每個角落，卻只發現幾張碎紙。\nThe police carefully searched every corner of the crime scene, _____________ _____________ _____________ a few scraps of paper.","answers":["only","to","discover"],"sentence":"The police carefully searched every corner of the crime scene, only to discover a few scraps of paper."},{"number":18,"prompt":"該男子據說是二戰期間的間諜。\nThe man _____________ _____________ to _____________ _____________ a spy during WWII.","answers":["is","believed","have","been"],"sentence":"The man is believed to have been a spy during WWII."},{"number":19,"prompt":"意外點燃了炸彈，這名士兵在戰爭中身受重傷。\n_____________ _____________ the bomb accidentally, the soldier was severely injured in the war.","answers":["Setting","off"],"sentence":"Setting off the bomb accidentally, the soldier was severely injured in the war."},{"number":20,"prompt":"住在鄉下地區的人通常會有自己的交通工具，因為那裡的大眾運輸系統並不方便。\nPeople who live in the ____________ usually have their own ____________ because the public transportation systems there are inconvenient.","answers":["countryside","vehicles"],"sentence":"People who live in the countryside usually have their own vehicles because the public transportation systems there are inconvenient."},{"number":21,"prompt":"意外點燃了炸彈，這名士兵在戰爭中身受重傷。\n_____________ _____________ the bomb accidentally, the soldier was severely injured in the war.","answers":["Setting","off"],"sentence":"Setting off the bomb accidentally, the soldier was severely injured in the war."},{"number":22,"prompt":"做人要誠實這想法已深植Ethan心中。\nThe idea of being honest has _____________ _____________ in Ethan's mind.","answers":["taken","root"],"sentence":"The idea of being honest has taken root in Ethan's mind."},{"number":23,"prompt":"這支研究團隊是由來自於各種不同領域的20位專家所組成的，像是語言、歷史、文化等等。\nThis research team _____________ _____________ twenty experts from various fields such as language, history, culture, and more.","answers":["consists","of"],"sentence":"This research team consists of twenty experts from various fields such as language, history, culture, and more."},{"number":24,"prompt":"在古印加社會，人們相信月蝕是因為受到美洲豹的攻擊所致。\nIn the ancient Inca society, it was _____________ _____________ the lunar eclipse was caused by the attack of a jaguar.","answers":["believed","that"],"sentence":"In the ancient Inca society, it was believed that the lunar eclipse was caused by the attack of a jaguar."},{"number":25,"prompt":"Traditional Chinese medicine techniques like acupuncture and Tui Na massage have _____________ _____________ in Taiwanese culture. Some people tend to go into these therapies when their muscles ache.\n傳統中醫技術如針灸及推拿，已在臺灣文化裡生根。有些人常常在肌肉酸痛的時候接受這些療法。","answers":["taken","root"],"sentence":"Traditional Chinese medicine techniques like acupuncture and Tui Na massage have taken root in Taiwanese culture. Some people tend to go into these therapies when their muscles ache."},{"number":26,"prompt":"冰箱裡的牛奶已經變酸並且正散發出惡臭，請馬上把它丟掉！\nThe milk in the refrigerator has already gone sour and is _____________ _____________ a bad smell. Please throw it away immediately!","answers":["giving","off"],"sentence":"The milk in the refrigerator has already gone sour and is giving off a bad smell. Please throw it away immediately!"},{"number":27,"prompt":"Tomorrow's beach cleanup will be _____________ _____________ due to the approaching typhoon. The new date will be announced on the website as soon as possible.\n明天的淨灘活動因颱風接近而取消。新的日期將會盡速公告於網站上。","answers":["called","off"],"sentence":"Tomorrow's beach cleanup will be called off due to the approaching typhoon. The new date will be announced on the website as soon as possible."},{"number":28,"prompt":"The judging panel for this audition _____________ _____________ ten people, and one of them is a Hollywood producer.\n這次的試鏡評審小組由十個人組成，其中一位是好萊塢製片人。","answers":["consists","of"],"sentence":"The judging panel for this audition consists of ten people, and one of them is a Hollywood producer."},{"number":29,"prompt":"那隻警犬在充滿灰塵的地下室中發現了一瓶毒藥。\nThe police dog found a bottle of ____________ in the basement which was filled with ____________.","answers":["poison","dust"],"sentence":"The police dog found a bottle of poison in the basement which was filled with dust."},{"number":30,"prompt":"Linda 從未想過她可以吃馬肉，所以第一次吃時感到很驚訝。\n_____________ never _____________ _____________ Linda that she could eat horse meat, so she was very surprised when she first had it.","answers":["It","occurred","to"],"sentence":"It never occurred to Linda that she could eat horse meat, so she was very surprised when she first had it."},{"number":31,"prompt":"In the old days, decisions about children's marriages were entirely _____________ _____________ _____________ _____________ their parents.\n過去，孩子的婚姻大事完全掌握在父母手中。","answers":["in","the","hands","of"],"sentence":"In the old days, decisions about children's marriages were entirely in the hands of their parents."},{"number":32,"prompt":"Leo用盡各種方式取悅他的女友，卻使得他們的關係變得更糟。\nLeo has tried everything he could to please his girlfriend, _____________ _____________ _____________ their relationship even worse.","answers":["only","to","make"],"sentence":"Leo has tried everything he could to please his girlfriend, only to make their relationship even worse."},{"number":33,"prompt":"這種百合花散發一種獨特的香味。\nThis kind of lily _____________ _____________ a unique scent.","answers":["gives","off"],"sentence":"This kind of lily gives off a unique scent."}]};const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let flat=[],index=0,wrong=new Map(),attempted=new Set(),firstTry=new Set(),recognition=null;
function flatten(){if(QUIZ.kind==='mcq')return QUIZ.data.map(x=>({...x,id:String(x.number)}));if(QUIZ.kind==='translation')return QUIZ.data.map(x=>({...x,id:String(x.number)}));return QUIZ.data.flatMap(set=>set.answers.map((answer,i)=>({id:`${set.set}-${i+1}`,set:set.set,passage:set.passage,options:set.options,answer,blank:i+1,sentence:set.sentences[i],structure:set.structure})))}
function fillPassage(text,answers,options){let out=text;answers.forEach((a,i)=>{const word=options[a];const n=i+1;const pats=[new RegExp(`__\\(?${n}\\)?__`),new RegExp(`__${n}__`),new RegExp(`　${n}　`),new RegExp(`\\(${n}\\)`)];for(const p of pats){if(p.test(out)){out=out.replace(p,word);break}}});return out.replace(/\n+/g,' ').replace(/\s+/g,' ').trim()}
function markBlank(text,n){const tag=`<span class="blank-now">Blank ${n}</span>`;let out=esc(text),done=false;for(const p of [new RegExp(`__\\(?${n}\\)?__`),new RegExp(`__${n}__`),new RegExp(`　${n}　`),new RegExp(`\\(${n}\\)`)]){if(!done&&p.test(out)){out=out.replace(p,tag);done=true}}return out}
function norm(s){return String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ')}function speak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}
function show(){try{recognition?.abort()}catch(e){}speechSynthesis?.cancel();const q=flat[index];$('#meta').textContent=`第 ${index+1} / ${flat.length} 題`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=((index+1)/flat.length*100)+'%';$('#feedback').className='feedback hidden';$('#reference').classList.add('hidden');$('#voiceBox').classList.add('hidden');$('#next').classList.add('hidden');$('#check').classList.toggle('hidden',QUIZ.kind!=='translation');$('#answerArea').innerHTML='';if(QUIZ.kind==='mcq')renderChoice(q.prompt,q.options);else if(QUIZ.kind==='translation')renderTranslation(q);else{$('#question').innerHTML=`<div class="passage">${markBlank(q.passage,q.blank)}</div>`;renderChoice(`第 ${q.blank} 格`,q.options)}}
function renderChoice(prompt,options){$('#question').innerHTML=QUIZ.kind==='mcq'?`<div class="prompt">${esc(prompt)}</div>`:$('#question').innerHTML;$('#answerArea').innerHTML='<div class="options">'+Object.entries(options).map(([k,v])=>`<button class="option" data-key="${k}"><b>${k}.</b> ${esc(v)}</button>`).join('')+'</div>';document.querySelectorAll('.option').forEach(b=>b.onclick=()=>checkChoice(b.dataset.key,b))}
function renderTranslation(q){let i=0;const rendered=esc(q.prompt).replace(/_{3,}/g,()=>`<input class="inline-input" data-i="${i++}" aria-label="第 ${i} 格答案">`);$('#question').innerHTML=`<div class="translation">${rendered}</div>`;setTimeout(()=>document.querySelector('.inline-input')?.focus(),0)}
function recordWrong(q,value){if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(value);$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
function checkChoice(key,button){const q=flat[index];attempted.add(q.id);if(key!==q.answer){recordWrong(q,key);button.classList.add('wrong');$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 不正確，請再試一次。';return}if(!wrong.has(q.id))firstTry.add(q.id);document.querySelectorAll('.option').forEach(b=>b.disabled=true);button.classList.add('correct');pass(q)}
function checkTranslation(){const q=flat[index],values=[...document.querySelectorAll('.inline-input')].map(x=>x.value);attempted.add(q.id);const ok=values.length===q.answers.length&&values.every((v,i)=>norm(v)===norm(q.answers[i]));if(!ok){recordWrong(q,values.join(' / '));$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 尚有空格不正確，請修正後再檢查。';return}if(!wrong.has(q.id))firstTry.add(q.id);document.querySelectorAll('.inline-input').forEach(x=>x.disabled=true);pass(q)}
function pass(q){$('#feedback').className='feedback ok';$('#feedback').textContent='✅ 正確！';$('#reference').classList.remove('hidden');$('#reference').textContent='完整句：'+q.sentence;$('#check').classList.add('hidden');$('#next').classList.remove('hidden');$('#voiceBox').classList.remove('hidden');$('#voiceTarget').textContent=q.sentence;$('#voiceResult').className='voice-result';$('#voiceResult').textContent='尚未進行朗讀評分。';speak(q.sentence)}
function similarity(a,b){a=norm(a).replace(/[^a-z0-9' ]/g,'').split(' ').filter(Boolean);b=norm(b).replace(/[^a-z0-9' ]/g,'').split(' ').filter(Boolean);const used=new Set;let hit=0;for(const w of a){const j=b.findIndex((x,i)=>x===w&&!used.has(i));if(j>=0){hit++;used.add(j)}}return Math.round(100*hit/Math.max(a.length,b.length,1))}
function startMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('#voiceResult').textContent='此瀏覽器不支援語音辨識，建議使用 Chrome。';return}recognition=new SR;recognition.lang='en-US';recognition.interimResults=false;$('#voiceResult').textContent='正在聆聽，請朗讀完整句子…';recognition.onresult=e=>{const said=e.results[0][0].transcript,target=flat[index].sentence,score=similarity(target,said);$('#voiceResult').className='voice-result '+(score>=80?'good':'retry');$('#voiceResult').textContent=`辨識：${said}\n正確率：${score}%`};recognition.onerror=e=>$('#voiceResult').textContent='語音辨識未完成：'+e.error;recognition.start()}
function finish(){try{recognition?.abort()}catch(e){}speechSynthesis?.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');const rows=[...wrong.values()];$('#summary').innerHTML=`<div class="stat">實際作答<b>${attempted.size}</b></div><div class="stat">一次答對<b>${firstTry.size}</b></div><div class="stat">曾答錯<b>${rows.length}</b></div>`;$('#wrongList').innerHTML=rows.length?rows.map((r,i)=>`<div class="wrong-card"><b>${i+1}. 第 ${esc(r.q.id)} 題</b><p>${esc(r.q.prompt||`第 ${r.q.blank} 格`)}</p><p>作答：${r.attempts.map(esc).join('；')}</p><p>答案：${esc(r.q.answer||r.q.answers.join(' / '))}</p></div>`).join(''):(attempted.size?'<div class="feedback ok">🎉 本輪全部一次答對！</div>':'<p class="muted">本輪尚未作答，因此不登錄成績。</p>');$('#download').classList.toggle('hidden',!rows.length);if(attempted.size)document.dispatchEvent(new CustomEvent('quiz-result-ready',{detail:{total:attempted.size,correct:firstTry.size,wrong:rows.length,mistakeQuestionNumbers:rows.map(r=>r.q.id).join(', ')}}))}
$('#check').onclick=checkTranslation;$('#next').onclick=()=>{if(++index>=flat.length)finish();else show()};$('#finish').onclick=finish;$('#restart').onclick=()=>location.reload();$('#speak').onclick=()=>speak(flat[index].sentence);$('#mic').onclick=startMic;$('#download').onclick=async()=>{const rows=[...wrong.values()];if(!rows.length)return;try{if(!window.docx)await new Promise((ok,fail)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js';s.onload=ok;s.onerror=fail;document.head.append(s)});const{Document,Packer,Paragraph,HeadingLevel}=window.docx,children=[new Paragraph({text:`三民普高 ${QUIZ.unit} ${QUIZ.title} 錯題紀錄`,heading:HeadingLevel.TITLE})];rows.forEach(r=>children.push(new Paragraph({text:`第 ${r.q.id} 題`,heading:HeadingLevel.HEADING_2}),new Paragraph(r.q.prompt||r.q.passage||''),new Paragraph('作答：'+r.attempts.join('；')),new Paragraph('答案：'+(r.q.answer||r.q.answers.join(' / ')))));const blob=await Packer.toBlob(new Document({sections:[{children}]})),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Sanmin_${QUIZ.unit}_${QUIZ.kind}_錯題.docx`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){alert('目前無法產生 DOCX，請稍後再試。')}};flat=flatten();show();
</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
