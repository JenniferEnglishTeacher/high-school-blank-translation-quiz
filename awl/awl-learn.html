<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWL Learning 學習區</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--h:'Playfair Display',Georgia,serif;--b:'DM Sans','Segoe UI','PingFang TC','Microsoft JhengHei',sans-serif;--zh:'Noto Serif TC','PingFang TC',serif;
--p:#1a3a5c;--pl:#2a5080;--a:#c8962e;--al:#f0c060;--ok:#2d7a4f;--okbg:#e8f5ee;
--bg:#f5f3ef;--card:#fff;--ink:#1c1c1c;--mut:#6b7280;--line:#ddd8d0;--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--b);background:var(--bg);color:var(--ink);min-height:100vh}
button,input{font:inherit}
header{background:var(--p);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:10;box-shadow:0 4px 16px #0002}
header .t{font-family:var(--h);font-size:1.1rem}
header .t small{font-family:var(--b);font-size:.8rem;opacity:.75;margin-left:6px}
header a{color:#fff;text-decoration:none;font-size:.85rem;font-weight:700;padding:8px 12px;border:1px solid #ffffff44;border-radius:99px;background:#ffffff18;white-space:nowrap}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 120px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px;box-shadow:0 2px 8px #0000000d}
.panel h2{font-size:1rem;color:var(--p);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;font-weight:700;color:var(--p);cursor:pointer;min-width:84px;text-align:center}
.chip small{display:block;font-weight:500;font-size:.72rem;color:var(--mut)}
.chip.done{background:var(--okbg);border-color:#a7d7b9;color:var(--ok)}
.chip.cur{border:2px solid var(--p);background:#eef3f9}
.custom{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:700;color:var(--p)}
.custom input{width:84px;padding:10px;border:2px solid var(--line);border-radius:8px;font-size:1rem;text-align:center}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--p);color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.gold{background:var(--a)}.btn.green{background:var(--ok)}.btn.ghost{background:#fff;color:var(--p);border:1px solid var(--line)}
.resume{display:none;margin-top:12px;padding:10px 12px;border-radius:10px;background:#fffbf0;border:1px solid var(--al);color:#7a5c00;font-weight:700;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.resume.show{display:flex}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tools label{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--p);cursor:pointer;font-size:.92rem}
.tools input{width:20px;height:20px}
.rangeTitle{font-family:var(--h);font-size:1.25rem;color:var(--p)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden;box-shadow:0 2px 8px #0000000d}
.card.seen{border-color:#a7d7b9}
.ch{display:flex;align-items:center;gap:10px;padding:12px 14px 6px}
.num{flex-shrink:0;min-width:42px;height:32px;border-radius:8px;background:var(--p);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.9rem}
.card.seen .num{background:var(--ok)}
.word{font-family:var(--h);font-size:1.5rem;color:var(--p);flex:1;word-break:break-word}
.word.hide{color:transparent;background:#e5e1d8;border-radius:6px;cursor:pointer;user-select:none}
.word.hide::after{content:'點一下顯示 tap to show';color:var(--mut);font-family:var(--b);font-size:.8rem}
.word.hide span{display:none}
.spk{flex-shrink:0;width:42px;height:42px;border-radius:50%;border:0;background:var(--a);color:#fff;font-size:1.1rem;cursor:pointer}
.cb{padding:4px 14px 14px 66px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;margin-bottom:6px}
.pos{font-size:.75rem;font-weight:700;text-transform:uppercase;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:2px 9px}
.cn{font-family:var(--zh);color:#6a4c93;font-weight:600;font-size:1.05rem}
.def{color:#374151;font-size:.95rem;margin-bottom:8px}
.ex{background:#fffbf0;border-left:4px solid var(--a);border-radius:8px;padding:9px 11px;display:flex;gap:8px;align-items:flex-start}
.ex button{border:0;background:none;color:var(--a);font-size:1.2rem;cursor:pointer;padding:0 2px}
.ex .en{line-height:1.6}
.ex mark{background:var(--al);padding:0 3px;border-radius:3px;font-weight:700;color:var(--p)}
.ex mark.hide{color:transparent;background:#e5e1d8}
.ex .zh{font-family:var(--zh);color:var(--mut);font-size:.88rem;margin-top:3px}
.seenBtn{margin-top:10px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;font-weight:700;color:var(--mut);cursor:pointer}
.card.seen .seenBtn{background:var(--okbg);color:var(--ok);border-color:#a7d7b9}
.dock{position:fixed;left:0;right:0;bottom:0;background:#fffffff2;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;flex-wrap:wrap;z-index:9;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.dock .info{align-self:center;font-weight:700;color:var(--p);font-size:.9rem}
.err{padding:40px 20px;text-align:center}
@media(max-width:560px){.cb{padding-left:14px}.word{font-size:1.3rem}}
</style>
</head>
<body>
<header>
  <div class="t" id="title">AWL Learning<small>學習區</small></div>
  <a href="../dashboard.html#awl">🏠 Dashboard</a>
</header>
<main class="wrap" id="app">
  <section class="panel">
    <h2>① 選擇範圍 Choose a range（編號與講義相同）</h2>
    <div class="chips" id="chips"></div>
    <div class="custom">從 From # <input id="from" type="number" inputmode="numeric" min="1"> 到 To # <input id="to" type="number" inputmode="numeric" min="1"> <button class="btn" id="goBtn">開始 Go</button></div>
    <div class="resume" id="resume"><span id="resumeText"></span><button class="btn gold" id="resumeBtn">繼續 Continue</button></div>
  </section>

  <section id="study" style="display:none">
    <div class="tools">
      <div class="rangeTitle" id="rangeTitle"></div>
      <label><input type="checkbox" id="hideToggle"> 自我測驗：遮住單字 Hide the words</label>
    </div>
    <div id="cards"></div>
  </section>
</main>
<div class="dock" id="dock" style="display:none">
  <span class="info" id="dockInfo"></span>
  <a class="btn green" id="quizBtn" href="#">📝 測驗這個範圍 Quiz this range</a>
</div>

<script>
(function(){
  const n = Math.min(10, Math.max(1, parseInt(new URLSearchParams(location.search).get('sublist') || '1', 10) || 1));
  const s = document.createElement('script');
  s.src = 'awl-sublist-' + n + '-data.js?v=20261109-1';
  s.onload = () => init(window.AWL_DATA);
  s.onerror = () => { document.getElementById('app').innerHTML = '<div class="err">找不到 Sublist ' + n + ' 的資料。</div>'; };
  document.head.appendChild(s);
})();

function init(DATA){
  const N = DATA.sublist, ITEMS = DATA.items, TOTAL = ITEMS.length, CHUNK = 20;
  const $ = id => document.getElementById(id);
  const KEY = 'awlLearnV2-sublist-' + N;
  document.title = 'AWL Sublist ' + N + ' – Learning 學習區';
  $('title').innerHTML = 'AWL Sublist ' + N + '<small>學習區 · ' + TOTAL + ' 字</small>';

  const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const stripNotes = w => w.replace(/\([^)]*\)/g, ' ').replace(/[　-鿿＀-￯]+/g, ' ').replace(/\+\s*N\b/g, ' ').replace(/\s+/g, ' ').trim();
  const primary = raw => stripNotes(raw).split('=')[0].replace(/\s*\/\s*/g, '/').split(' ').map(t => t.split('/')[0]).join(' ').replace(/\b[NV]\b$/, '').replace(/\s+/g, ' ').trim();
  function fillSentence(it){
    const blanks = (it.s.match(/_{3,}/g) || []).length;
    const p = primary(it.w).replace(/\.{2,}\s*$/, '');
    if (!blanks) return { html: esc(it.s), text: it.s };
    let parts = p.split(/\s*\.{2,}\s*/).filter(Boolean);
    if (blanks === 1) parts = [p.replace(/\.{2,}/g, ' ').replace(/\s+/g, ' ')];
    else if (parts.length !== blanks) parts = null;
    let i = 0, html = '', text = '';
    it.s.split(/(_{3,})/).forEach(seg => {
      if (/^_{3,}$/.test(seg)) {
        if (!parts) { if (i++ === 0) { html += '<mark>' + esc(p) + '</mark>'; text += p; } return; }
        const w = parts[i++] || ''; html += '<mark>' + esc(w) + '</mark>'; text += w;
      } else { html += esc(seg); text += seg; }
    });
    return { html: html.replace(/\s{2,}/g, ' '), text: text.replace(/\s{2,}/g, ' ') };
  }

  // per-viewer progress (this device only)
  let st = { seen: [], from: 0, to: 0, hide: false };
  try { st = Object.assign(st, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
  let seen = new Set(st.seen);
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ seen: [...seen], from: st.from, to: st.to, hide: st.hide })); } catch (e) {} };
  $('hideToggle').checked = !!st.hide;

  // TTS (works on iPad Safari)
  let voice = null;
  const pickVoice = () => { const v = speechSynthesis.getVoices(); voice = v.find(x => x.lang === 'en-US' && /samantha|zira|aria|jenny|google us/i.test(x.name)) || v.find(x => x.lang === 'en-US') || v.find(x => /^en/.test(x.lang)) || null; };
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(t, rate){ if (!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = rate || .9; if (voice) u.voice = voice; speechSynthesis.speak(u); }

  // range chips
  const chunks = [];
  for (let a = 1; a <= TOTAL; a += CHUNK) chunks.push([a, Math.min(TOTAL, a + CHUNK - 1)]);
  function renderChips(){
    $('chips').innerHTML = chunks.map(([a, b]) => {
      let c = 0; for (let k = a; k <= b; k++) if (seen.has(k)) c++;
      const cls = (c === b - a + 1 ? ' done' : '') + (st.from === a && st.to === b ? ' cur' : '');
      return '<button class="chip' + cls + '" data-a="' + a + '" data-b="' + b + '">#' + a + '–' + b + '<small>' + (c === b - a + 1 ? '✓ 已完成' : c + ' / ' + (b - a + 1)) + '</small></button>';
    }).join('');
  }
  $('chips').onclick = e => { const b = e.target.closest('.chip'); if (b) openRange(+b.dataset.a, +b.dataset.b); };
  $('goBtn').onclick = () => {
    let a = parseInt($('from').value, 10), b = parseInt($('to').value, 10);
    if (!a || !b) { alert('請輸入範圍 Please enter From and To numbers (1–' + TOTAL + ').'); return; }
    a = Math.max(1, Math.min(TOTAL, a)); b = Math.max(1, Math.min(TOTAL, b)); if (a > b) [a, b] = [b, a];
    openRange(a, b);
  };
  $('from').max = $('to').max = TOTAL;
  $('from').placeholder = '1'; $('to').placeholder = String(Math.min(TOTAL, 20));

  // resume prompt
  function firstUnseen(){ const mx = Math.max(0, ...seen); for (let k = mx + 1; k <= TOTAL; k++) if (!seen.has(k)) return k; for (let k = 1; k <= TOTAL; k++) if (!seen.has(k)) return k; return 0; }
  function renderResume(){
    const k = firstUnseen();
    if (!seen.size) { $('resume').classList.remove('show'); return; }
    $('resume').classList.add('show');
    if (!k) { $('resumeText').textContent = '🎉 全部 ' + TOTAL + ' 個單字都複習過了！All words reviewed.'; $('resumeBtn').style.display = 'none'; return; }
    $('resumeText').textContent = '上次進度：已複習 ' + seen.size + ' / ' + TOTAL + '，從 #' + k + ' 繼續';
    $('resumeBtn').style.display = '';
    $('resumeBtn').onclick = () => openRange(k, Math.min(TOTAL, k + CHUNK - 1));
  }

  function openRange(a, b){
    st.from = a; st.to = b; save();
    $('from').value = a; $('to').value = b;
    $('study').style.display = ''; $('dock').style.display = '';
    $('rangeTitle').textContent = 'Sublist ' + N + ' · #' + a + '–' + b + '（' + (b - a + 1) + ' 字）';
    $('quizBtn').href = 'awl-sublist-' + N + '-quiz.html?from=' + a + '&to=' + b;
    $('quizBtn').innerHTML = '📝 測驗 #' + a + '–' + b + ' Quiz this range';
    const hide = $('hideToggle').checked;
    let html = '';
    for (let k = a; k <= b; k++) {
      const it = ITEMS[k - 1], f = fillSentence(it);
      html += '<article class="card' + (seen.has(k) ? ' seen' : '') + '" data-k="' + k + '">' +
        '<div class="ch"><span class="num">' + k + '</span><div class="word' + (hide ? ' hide' : '') + '"><span>' + esc(it.w) + '</span></div><button class="spk" data-say="w" aria-label="Listen">🔊</button></div>' +
        '<div class="cb"><div class="meta"><span class="pos">' + esc(it.pos || '—') + '</span><span class="cn">' + esc(it.cn) + '</span></div>' +
        '<div class="def">' + esc(it.def || '') + '</div>' +
        '<div class="ex"><button data-say="s" aria-label="Listen to sentence">▶</button><div><div class="en">' + f.html.replace(/<mark>/g, hide ? '<mark class="hide">' : '<mark>') + '</div><div class="zh">' + esc(it.zh) + '</div></div></div>' +
        '<button class="seenBtn">' + (seen.has(k) ? '✓ 已複習 Reviewed' : '○ 標記已複習 Mark as reviewed') + '</button></div></article>';
    }
    $('cards').innerHTML = html;
    updateDock(); renderChips(); renderResume();
    $('study').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
  function updateDock(){
    let c = 0; for (let k = st.from; k <= st.to; k++) if (seen.has(k)) c++;
    $('dockInfo').textContent = '已複習 ' + c + ' / ' + (st.to - st.from + 1);
  }
  $('cards').onclick = e => {
    const card = e.target.closest('.card'); if (!card) return;
    const k = +card.dataset.k, it = ITEMS[k - 1];
    const sayBtn = e.target.closest('[data-say]');
    if (sayBtn) { sayBtn.dataset.say === 'w' ? speak(primary(it.w).replace(/\.{2,}/g, ' '), .8) : speak(fillSentence(it).text, .9); return; }
    const w = e.target.closest('.word.hide');
    if (w) { w.classList.remove('hide'); card.querySelectorAll('mark.hide').forEach(m => m.classList.remove('hide')); return; }
    if (e.target.closest('.seenBtn')) {
      if (seen.has(k)) seen.delete(k); else seen.add(k);
      card.classList.toggle('seen', seen.has(k));
      e.target.closest('.seenBtn').textContent = seen.has(k) ? '✓ 已複習 Reviewed' : '○ 標記已複習 Mark as reviewed';
      save(); updateDock(); renderChips(); renderResume();
    }
  };
  $('hideToggle').onchange = e => { st.hide = e.target.checked; save(); if (st.from) openRange(st.from, st.to); };

  renderChips(); renderResume();
  const q = new URLSearchParams(location.search);
  const qa = parseInt(q.get('from'), 10), qb = parseInt(q.get('to'), 10);
  if (qa && qb) openRange(Math.max(1, Math.min(qa, qb)), Math.min(TOTAL, Math.max(qa, qb)));
  else if (st.from && st.to) { $('from').value = st.from; $('to').value = st.to; }
}
</script>
</body>
</html>
