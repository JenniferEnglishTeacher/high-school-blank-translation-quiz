<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWL Learning 學習區</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--h:'Playfair Display',Georgia,serif;--b:'DM Sans','Segoe UI','Microsoft JhengHei',sans-serif;--zh:'Noto Serif TC',serif;
--p:#1a3a5c;--pl:#2a5080;--a:#c8962e;--al:#f0c060;--ok:#2d7a4f;--okbg:#e8f5ee;--bad:#b53a2f;--badbg:#fdecea;
--bg:#f5f3ef;--card:#fff;--ink:#1c1c1c;--mut:#6b7280;--line:#ddd8d0;--r:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--b);background:var(--bg);color:var(--ink);min-height:100vh}
header{background:var(--p);color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:10;box-shadow:0 4px 16px #0002}
header .t{font-family:var(--h);font-size:1.05rem;display:flex;gap:8px;align-items:center}header .t i{color:var(--al)}
header nav{display:flex;gap:8px;flex-wrap:wrap}
header a{color:#fff;text-decoration:none;font-size:.85rem;font-weight:600;padding:6px 12px;border:1px solid #ffffff44;border-radius:99px;background:#ffffff18;white-space:nowrap}
header a.quiz{background:var(--a);border-color:var(--a)}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 60px}
.prog{display:flex;justify-content:space-between;font-size:.85rem;color:var(--mut);font-weight:600;margin-bottom:8px}
.track{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
.fill{height:100%;background:linear-gradient(90deg,var(--p),var(--a));transition:width .3s}
.tools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;font-size:.88rem}
.tools label{display:flex;align-items:center;gap:6px;cursor:pointer;color:var(--p);font-weight:600}
.tools button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font:inherit;font-weight:600;color:var(--p);cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 4px 16px #0000001a;overflow:hidden}
.ch{background:linear-gradient(135deg,var(--p),var(--pl));color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;font-family:var(--h)}
.badge{font-family:var(--b);font-size:.78rem;font-weight:700;background:#ffffff26;padding:4px 10px;border-radius:99px}
.badge.done{background:var(--ok)}
.cb{padding:22px 20px}
.word-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.word{font-family:var(--h);font-size:clamp(1.7rem,6vw,2.4rem);color:var(--p);word-break:break-word}
.word.hide{color:transparent;background:repeating-linear-gradient(90deg,#e5e1d8 0 14px,transparent 14px 20px);border-radius:6px;user-select:none;min-width:160px}
.spk{background:var(--a);color:#fff;border:0;border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:1rem;flex-shrink:0}
.spk:hover{background:#a87825}
.meta{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:16px}
.pos{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.cn{font-family:var(--zh);font-size:1.15rem;color:#6a4c93;font-weight:600}
.ex{background:#fffbf0;border-left:4px solid var(--a);border-radius:8px;padding:12px 14px;margin-bottom:20px}
.ex-en{display:flex;gap:10px;align-items:flex-start;font-size:1.04rem;line-height:1.7}
.ex-en button{background:none;border:0;color:var(--a);font-size:1.15rem;cursor:pointer;padding-top:3px}
.ex-en mark{background:var(--al);padding:0 3px;border-radius:3px;font-weight:700;color:var(--p)}
.ex-en mark.hide{color:transparent;background:#e5e1d8}
.ex-zh{font-family:var(--zh);color:var(--mut);font-size:.9rem;margin-top:6px;padding-left:30px}
.step{border:2px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;transition:.2s}
.step.active{border-color:var(--p)}.step.ok{border-color:var(--ok);background:var(--okbg)}.step.locked{opacity:.5}
.step h4{font-size:.92rem;margin-bottom:9px;color:var(--p);display:flex;align-items:center;gap:8px}
.step.ok h4{color:var(--ok)}
.num{display:inline-flex;width:22px;height:22px;border-radius:50%;background:var(--p);color:#fff;font-size:.75rem;align-items:center;justify-content:center}
.step.ok .num{background:var(--ok)}
.typ{display:flex;gap:8px}
.typ input{flex:1;min-width:0;padding:11px 13px;border:2px solid var(--line);border-radius:8px;font:inherit;font-size:1.1rem}
.typ input:focus{outline:none;border-color:var(--p)}
.typ input.bad{border-color:var(--bad);background:var(--badbg)}
.btn{border:0;border-radius:8px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;background:var(--p);color:#fff;display:inline-flex;align-items:center;gap:7px}
.btn:disabled{opacity:.45;cursor:default}
.btn.mic{background:var(--bad)}.btn.mic.listening{animation:pulse 1s infinite}
.btn.ghost{background:#fff;color:var(--p);border:1px solid var(--line)}
@keyframes pulse{50%{opacity:.6}}
.msg{font-size:.88rem;margin-top:8px;min-height:1.2em}.msg.ok{color:var(--ok);font-weight:700}.msg.bad{color:var(--bad)}
.heard{font-size:.85rem;color:var(--mut);margin-top:4px;font-style:italic}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}
.nav .btn{flex:1;justify-content:center;padding:13px}
.list{display:none;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.list.open{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:4px 11px;font:inherit;font-size:.82rem;cursor:pointer}
.chip.done{background:var(--okbg);border-color:#a7d7b9;color:var(--ok)}.chip.cur{border-color:var(--p);border-width:2px;font-weight:700}
.finish{display:none;text-align:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:30px 20px;margin-top:16px}
.finish.show{display:block}
.finish h2{font-family:var(--h);color:var(--p);margin-bottom:8px}
.finish p{color:var(--mut);margin-bottom:16px}
.finish a{text-decoration:none}
.err{padding:40px 20px;text-align:center}
@media(max-width:520px){header .t span{display:none}.cb{padding:18px 14px}.typ{flex-direction:column}}
</style>
</head>
<body>
<header>
  <div class="t"><i class="fas fa-book-open-reader"></i> <b id="title">AWL Learning</b> <span>· 學習區</span></div>
  <nav><a href="../dashboard.html#awl"><i class="fas fa-house"></i> Dashboard</a><a class="quiz" id="quizLink" href="#"><i class="fas fa-pen"></i> Quiz 測驗</a></nav>
</header>
<main class="wrap" id="app">
  <div class="prog"><span id="progText">0 / 0 完成</span><span id="posText">Word 1</span></div>
  <div class="track"><div class="fill" id="bar" style="width:0%"></div></div>
  <div class="tools">
    <label><input type="checkbox" id="hideToggle"> 拼字挑戰：隱藏單字 Hide the word</label>
    <span><button id="listBtn"><i class="fas fa-list"></i> 單字列表</button> <button id="nextTodoBtn"><i class="fas fa-forward"></i> 下一個未完成</button></span>
  </div>
  <div class="list" id="list"></div>

  <section class="card">
    <div class="ch"><span id="cardNo">Word 1</span><span class="badge" id="badge">未完成</span></div>
    <div class="cb">
      <div class="word-row"><div class="word" id="word"></div><button class="spk" id="spkWord" title="聽單字"><i class="fas fa-volume-high"></i></button></div>
      <div class="meta"><span class="pos" id="pos"></span><span class="cn" id="cn"></span></div>
      <div class="ex">
        <div class="ex-en"><button id="spkSent" title="聽例句"><i class="fas fa-circle-play"></i></button><span id="sent"></span></div>
        <div class="ex-zh" id="zh"></div>
      </div>

      <div class="step active" id="step1">
        <h4><span class="num">1</span> 輸入單字 Type the word</h4>
        <div class="typ"><input id="typeIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type here… 在此輸入"><button class="btn" id="checkBtn"><i class="fas fa-check"></i> Check</button></div>
        <div class="msg" id="msg1"></div>
      </div>
      <div class="step locked" id="step2">
        <h4><span class="num">2</span> 大聲唸出單字 Read it aloud</h4>
        <button class="btn mic" id="micBtn" disabled><i class="fas fa-microphone"></i> 按下後朗讀 Speak</button>
        <button class="btn ghost" id="skipBtn" style="display:none"><i class="fas fa-forward"></i> 已朗讀，略過辨識</button>
        <div class="heard" id="heard"></div>
        <div class="msg" id="msg2"></div>
      </div>

      <div class="nav"><button class="btn ghost" id="prevBtn"><i class="fas fa-arrow-left"></i> Prev</button><button class="btn" id="nextBtn">Next <i class="fas fa-arrow-right"></i></button></div>
    </div>
  </section>

  <div class="finish" id="finish">
    <h2>🎉 全部完成！All words done</h2>
    <p>你已經練習完這個 Sublist 的所有單字，接著去做測驗吧。</p>
    <a class="btn" id="finishQuiz" href="#"><i class="fas fa-pen"></i> 開始測驗 Take the Quiz</a>
  </div>
</main>

<script>
(function(){
  const n = Math.min(10, Math.max(1, parseInt(new URLSearchParams(location.search).get('sublist') || '1', 10) || 1));
  const s = document.createElement('script');
  s.src = 'awl-sublist-' + n + '-data.js?v=20261103-1';
  s.onload = () => init(window.AWL_DATA);
  s.onerror = () => { document.getElementById('app').innerHTML = '<div class="err">找不到 Sublist ' + n + ' 的資料。</div>'; };
  document.head.appendChild(s);
})();

function init(DATA){
  const N = DATA.sublist, ITEMS = DATA.items;
  const $ = id => document.getElementById(id);
  const KEY = 'awlLearnV1-sublist-' + N;
  const quizUrl = 'awl-sublist-' + N + '-quiz.html';
  document.title = 'AWL Sublist ' + N + ' – Learning 學習區';
  $('title').textContent = 'AWL Sublist ' + N;
  $('quizLink').href = quizUrl; $('finishQuiz').href = quizUrl;

  // ── text helpers ──
  const stripNotes = w => w.replace(/\([^)]*\)/g, ' ').replace(/[　-鿿＀-￯]+/g, ' ').replace(/\+\s*N\b/g, ' ').replace(/\s+/g, ' ').trim();
  const norm = t => t.toLowerCase().replace(/[’`]/g, "'").replace(/[^a-z'\-]+/g, ' ').replace(/\b[nv]\b/g, ' ').replace(/\s+/g, ' ').trim();
  function answers(raw){
    // part before "=" is the word to learn; "a/b" gives alternatives
    let w = stripNotes(raw).split('=')[0].replace(/\s*\/\s*/g, '/').trim();
    let outs = [''];
    for (const tok of w.split(' ')) {
      const opts = tok.includes('/') && !/^\W*$/.test(tok) ? tok.split('/') : [tok];
      outs = outs.flatMap(o => opts.map(x => (o + ' ' + x).trim()));
    }
    return [...new Set(outs.map(norm).filter(Boolean))];
  }
  const primary = raw => stripNotes(raw).split('=')[0].replace(/\s*\/\s*/g, '/').split(' ').map(t => t.split('/')[0]).join(' ').replace(/\s+/g,' ').trim();
  function fillSentence(it){
    const blanks = (it.s.match(/_{3,}/g) || []).length;
    const p = primary(it.w).replace(/\.{2,}\s*$/, '');
    let parts = p.split(/\s*\.{2,}\s*/).filter(Boolean);
    if (blanks === 0) return { html: esc(it.s), text: it.s };
    if (blanks !== 1 && parts.length !== blanks) parts = Array(blanks).fill(p);
    if (blanks === 1) parts = [p.replace(/\.{2,}/g, ' ').replace(/\s+/g,' ')];
    let i = 0, html = '', text = '';
    it.s.split(/(_{3,})/).forEach(seg => {
      if (/^_{3,}$/.test(seg)) { const w = parts[i++] || p; html += '<mark>' + esc(w) + '</mark>'; text += w; }
      else { html += esc(seg); text += seg; }
    });
    return { html, text };
  }
  const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // ── storage (per viewer) ──
  let done = new Set(), idx = 0, hide = false;
  try { const st = JSON.parse(localStorage.getItem(KEY) || '{}'); done = new Set(st.done || []); idx = Math.min(st.idx || 0, ITEMS.length - 1); hide = !!st.hide; } catch(e){}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ done:[...done], idx, hide })); } catch(e){} };
  $('hideToggle').checked = hide;

  // ── TTS ──
  let voice = null;
  const pickVoice = () => { const v = speechSynthesis.getVoices(); voice = v.find(x => x.lang === 'en-US' && /female|samantha|zira|aria|jenny|google us/i.test(x.name)) || v.find(x => x.lang === 'en-US') || v.find(x => /^en/.test(x.lang)) || null; };
  if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  function speak(t, rate){ if (!('speechSynthesis' in window)) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = rate || .9; if (voice) u.voice = voice; speechSynthesis.speak(u); }

  // ── STT ──
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, tries = 0, typedOk = false;
  function lev(a, b){ const m = [...Array(b.length + 1).keys()]; for (let i = 1; i <= a.length; i++){ let prev = m[0]; m[0] = i; for (let j = 1; j <= b.length; j++){ const t = m[j]; m[j] = Math.min(m[j] + 1, m[j-1] + 1, prev + (a[i-1] === b[j-1] ? 0 : 1)); prev = t; } } return m[b.length]; }
  function spokenOk(transcripts, targets){
    for (const tr of transcripts) {
      const heard = norm(tr).replace(/-/g, ' ').split(' ').filter(Boolean);
      for (const tg of targets) {
        const want = tg.replace(/-/g, ' ').split(' ').filter(Boolean);
        const hit = want.filter(w => heard.some(h => h === w || (w.length >= 5 && lev(h, w) <= 1) || (w.length >= 8 && lev(h, w) <= 2))).length;
        if (hit / want.length >= 0.7) return true;
      }
    }
    return false;
  }

  function render(){
    const it = ITEMS[idx], isDone = done.has(idx);
    typedOk = isDone; tries = 0;
    $('word').textContent = it.w;
    $('word').classList.toggle('hide', hide && !isDone);
    $('pos').textContent = it.pos || '—';
    $('cn').textContent = it.cn;
    const f = fillSentence(it);
    $('sent').innerHTML = f.html;
    $('sent').querySelectorAll('mark').forEach(m => m.classList.toggle('hide', hide && !isDone));
    $('zh').textContent = it.zh;
    $('cardNo').textContent = 'Word ' + (idx + 1) + ' / ' + ITEMS.length;
    $('badge').textContent = isDone ? '✓ 已完成' : '未完成';
    $('badge').classList.toggle('done', isDone);
    $('typeIn').value = isDone ? primary(it.w) : '';
    $('typeIn').classList.remove('bad');
    $('msg1').textContent = ''; $('msg1').className = 'msg';
    $('msg2').textContent = ''; $('msg2').className = 'msg';
    $('heard').textContent = '';
    $('skipBtn').style.display = 'none';
    setStep(1, isDone ? 'ok' : 'active'); setStep(2, isDone ? 'ok' : 'locked');
    $('micBtn').disabled = !isDone && true;
    if (isDone) $('micBtn').disabled = false;
    $('prevBtn').disabled = idx === 0;
    $('nextBtn').innerHTML = idx === ITEMS.length - 1 ? '完成 Finish <i class="fas fa-flag-checkered"></i>' : 'Next <i class="fas fa-arrow-right"></i>';
    updateProgress(); renderList(); save();
    if (!isDone) setTimeout(() => $('typeIn').focus({ preventScroll: true }), 50);
  }
  function setStep(k, state){ $('step' + k).className = 'step ' + state; }
  function updateProgress(){
    $('progText').textContent = done.size + ' / ' + ITEMS.length + ' 完成';
    $('posText').textContent = 'Word ' + (idx + 1);
    $('bar').style.width = (done.size / ITEMS.length * 100) + '%';
    $('finish').classList.toggle('show', done.size === ITEMS.length);
  }
  function renderList(){
    if (!$('list').classList.contains('open')) return;
    $('list').innerHTML = ITEMS.map((it, i) => '<button class="chip' + (done.has(i) ? ' done' : '') + (i === idx ? ' cur' : '') + '" data-i="' + i + '">' + (i + 1) + '. ' + esc(hide && !done.has(i) ? '••••' : it.w) + '</button>').join('');
  }

  function check(){
    const it = ITEMS[idx], v = norm(stripNotes($('typeIn').value));
    if (!v) return;
    if (answers(it.w).includes(v)) {
      typedOk = true;
      $('typeIn').classList.remove('bad');
      $('msg1').textContent = '✓ 拼字正確！Correct spelling'; $('msg1').className = 'msg ok';
      $('word').classList.remove('hide'); $('sent').querySelectorAll('mark').forEach(m => m.classList.remove('hide'));
      setStep(1, 'ok'); setStep(2, 'active'); $('micBtn').disabled = false;
      speak(primary(it.w).replace(/\.{2,}/g, ' '), .8);
      if (!SR) { $('micBtn').style.display = 'none'; $('skipBtn').style.display = 'inline-flex'; $('skipBtn').innerHTML = '<i class="fas fa-check"></i> 我已大聲唸出 I read it aloud'; $('msg2').textContent = '此瀏覽器不支援語音辨識，請大聲唸出後按按鈕。（建議用 Chrome）'; }
      else $('micBtn').style.display = '';
    } else {
      $('typeIn').classList.add('bad');
      $('msg1').textContent = '✗ 再試一次 Try again — 注意拼字與空格'; $('msg1').className = 'msg bad';
    }
  }
  function complete(){
    done.add(idx); save();
    setStep(2, 'ok');
    $('badge').textContent = '✓ 已完成'; $('badge').classList.add('done');
    $('msg2').textContent = '✓ 很好！Great — 此單字完成'; $('msg2').className = 'msg ok';
    updateProgress(); renderList();
  }
  function listen(){
    if (!SR || !typedOk) return;
    if (rec) { try { rec.abort(); } catch(e){} }
    rec = new SR(); rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 5;
    const btn = $('micBtn');
    btn.classList.add('listening'); btn.innerHTML = '<i class="fas fa-microphone"></i> 聆聽中… Listening';
    $('msg2').textContent = ''; $('msg2').className = 'msg';
    let got = false;
    rec.onresult = e => {
      got = true;
      const ts = [...e.results[0]].map(r => r.transcript);
      $('heard').textContent = '聽到 Heard: “' + ts[0] + '”';
      if (spokenOk(ts, answers(ITEMS[idx].w))) complete();
      else { tries++; $('msg2').textContent = '✗ 再唸一次 Try again — 聽一下發音再試'; $('msg2').className = 'msg bad'; if (tries >= 3) $('skipBtn').style.display = 'inline-flex'; }
    };
    rec.onerror = e => { $('msg2').textContent = e.error === 'not-allowed' ? '請允許麥克風權限 Please allow the microphone.' : '沒有聽到聲音，再試一次。'; $('msg2').className = 'msg bad'; tries++; if (tries >= 3 || e.error === 'not-allowed') $('skipBtn').style.display = 'inline-flex'; };
    rec.onend = () => { btn.classList.remove('listening'); btn.innerHTML = '<i class="fas fa-microphone"></i> 按下後朗讀 Speak'; if (!got && !$('msg2').textContent) { $('msg2').textContent = '沒有聽到聲音，再試一次。'; $('msg2').className = 'msg bad'; } };
    speechSynthesis && speechSynthesis.cancel();
    try { rec.start(); } catch(e){}
  }
  function go(i){ if (i < 0 || i >= ITEMS.length) return; if (rec) { try { rec.abort(); } catch(e){} } idx = i; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

  $('checkBtn').onclick = check;
  $('typeIn').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); typedOk && !done.has(idx) ? listen() : check(); } });
  $('micBtn').onclick = listen;
  $('skipBtn').onclick = () => { if (typedOk) complete(); };
  $('spkWord').onclick = () => speak(primary(ITEMS[idx].w).replace(/\.{2,}/g, ' '), .8);
  $('spkSent').onclick = () => speak(fillSentence(ITEMS[idx]).text, .9);
  $('prevBtn').onclick = () => go(idx - 1);
  $('nextBtn').onclick = () => idx === ITEMS.length - 1 ? $('finish').scrollIntoView({ behavior: 'smooth' }) : go(idx + 1);
  $('hideToggle').onchange = e => { hide = e.target.checked; render(); };
  $('listBtn').onclick = () => { $('list').classList.toggle('open'); renderList(); };
  $('list').onclick = e => { const b = e.target.closest('.chip'); if (b) go(+b.dataset.i); };
  $('nextTodoBtn').onclick = () => { for (let k = 1; k <= ITEMS.length; k++) { const j = (idx + k) % ITEMS.length; if (!done.has(j)) return go(j); } };
  window.__awl = { answers, primary, fillSentence, ITEMS };
  render();
}
</script>
</body>
</html>
