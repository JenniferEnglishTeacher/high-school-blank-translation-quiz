<script>window.QUIZ_CONFIG={"title": "國中會考文法歷屆試題｜動詞形式（to V / Ving / 祈使句）", "mode": "mcq", "questions": [{"id": 1, "question": "Jo won't be happy if you're late for his party tonight, so ______ sure that you arrive on time.", "options": ["make", "makes", "to make", "is making"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜祈使句 Make sure…", "explanation": "【句型】祈使句以原形動詞開頭（省略主詞 you）：Make sure (that) + 子句 = 務必、確定…\n【分析】so 後面接一個完整的句子，但空格前沒有主詞，表示這是對聽話者下指令的祈使句，所以用原形動詞 make，Make sure that you arrive on time.「務必準時到」。\n【其他選項】(B) makes 需要第三人稱單數主詞；(C) to make 是不定詞，不能當句子的主要動詞；(D) is making 缺主詞，且語意不是「正在」。\n【例句】It's raining hard, so make sure you bring an umbrella.", "explanationSource": "source"}, {"id": 2, "question": "The test starts at eight, so ______ sure you get to school before then.", "options": ["makes", "make", "making", "to make"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 1 題）", "explanation": "so 後接祈使句，原形動詞開頭 make sure。", "explanationSource": "supplemental"}, {"id": 3, "question": "The museum is closed on Mondays, so ______ to check the date before you go.", "options": ["remembering", "remembered", "to remember", "remember"], "answer": 3, "answerLabel": "D", "source": "類似題 2（對應第 1 題）", "explanation": "so 後無主詞，為祈使句，用原形動詞 remember。", "explanationSource": "supplemental"}, {"id": 4, "question": "Mom: The soup is very hot, Tina. ______ careful!", "options": ["Be", "Being", "Is", "To be"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 1 題）", "explanation": "祈使句以原形動詞開頭，be 動詞原形為 Be。", "explanationSource": "supplemental"}, {"id": 5, "question": "Cindy enjoys ______ her dad read stories to her before bed.", "options": ["to listen to", "listening to", "listen to", "listens to"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜enjoy + Ving", "explanation": "【句型】enjoy + Ving（動名詞）＝喜歡做某事；enjoy 後面不可接 to V。\n【分析】動詞 enjoys 後面要接動名詞，所以用 listening to；listen to + 人 + 原形動詞（read）表示「聽某人唸…」。\n【其他選項】(A) to listen to：enjoy 不接不定詞；(C) listen to：原形動詞不能直接接在 enjoys 後；(D) listens to：一個子句不能有兩個主要動詞。\n【例句】My grandpa enjoys taking a walk in the park every morning.", "explanationSource": "source"}, {"id": 6, "question": "Ben enjoys ______ basketball with his classmates after school.", "options": ["play", "playing", "to play", "plays"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 5 題）", "explanation": "enjoy 後接 Ving，用 playing。", "explanationSource": "supplemental"}, {"id": 7, "question": "My sister has finished ______ her room, so she can watch TV now.", "options": ["cleaning", "to clean", "clean", "cleaned"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 5 題）", "explanation": "finish 後接 Ving，用 cleaning。", "explanationSource": "supplemental"}, {"id": 8, "question": "Would you mind ______ the window? It's really cold in here.", "options": ["to close", "close", "closed", "closing"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 5 題）", "explanation": "mind 後接 Ving，用 closing。", "explanationSource": "supplemental"}, {"id": 9, "question": "If you're interested in our business plan, ______ this number and ask for Ms. Lee. She'll answer your questions.", "options": ["calling", "call", "and call", "to call"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜If 子句 + 祈使句", "explanation": "【句型】If + 子句, + 祈使句（原形動詞開頭）。\n【分析】逗號前是 If 副詞子句，主要子句沒有主詞，是叫對方「打這支電話」的祈使句，所以用原形動詞 call，並與後面的 and ask 對稱。\n【其他選項】(A) calling 不能當主要子句的動詞；(C) and call：If 子句與主要子句之間不需要 and；(D) to call 是不定詞，不能當主要動詞。\n【例句】If you feel sick, go to the school nurse.", "explanationSource": "source"}, {"id": 10, "question": "If you have any questions about the homework, ______ me an e-mail.", "options": ["sending", "to send", "send", "sent"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 9 題）", "explanation": "If 子句後的主要子句為祈使句，用原形動詞 send。", "explanationSource": "supplemental"}, {"id": 11, "question": "If you want to get a better grade, ______ more time on your studies.", "options": ["spend", "spending", "spends", "and spend"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 9 題）", "explanation": "主要子句無主詞，是祈使句，用原形 spend。", "explanationSource": "supplemental"}, {"id": 12, "question": "When you see the post office, ______ left and you'll find the bookstore.", "options": ["turning", "to turn", "turned", "turn"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 9 題）", "explanation": "When 子句後接祈使句，用原形動詞 turn。", "explanationSource": "supplemental"}, {"id": 13, "question": "Wendy: Do you know where the library is?\nSimon: Just ______ going for two more blocks and you'll see it.", "options": ["keep", "to keep", "keeping", "keeps"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜keep + Ving", "explanation": "【句型】祈使句 + and + 未來式：原形動詞開頭…, and you will…；keep + Ving＝持續做…。\n【分析】Simon 在指路，「再繼續走兩個街區你就會看到」，Just 後為祈使句，要用原形動詞 keep，再接 going。\n【其他選項】(B) to keep、(C) keeping 都不能當祈使句的開頭動詞；(D) keeps 需要第三人稱單數主詞。\n【例句】Keep walking and you'll find the bus stop on your right.", "explanationSource": "source"}, {"id": 14, "question": "Coach: Don't stop! Just ______ running and you'll finish the race.", "options": ["keeping", "keep", "kept", "to keep"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 13 題）", "explanation": "祈使句用原形動詞 keep，後接 running。", "explanationSource": "supplemental"}, {"id": 15, "question": "______ hard and you will pass the test.", "options": ["Studying", "To study", "Study", "Studies"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 13 題）", "explanation": "祈使句 + and + will，句首用原形動詞 Study。", "explanationSource": "supplemental"}, {"id": 16, "question": "The baby kept ______ all night, so his parents didn't sleep well.", "options": ["cry", "to cry", "cried", "crying"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 13 題）", "explanation": "keep + Ving 表示持續，用 crying。", "explanationSource": "supplemental"}, {"id": 17, "question": "Josh has planned to make a trip to New York and ______ some of his friends there.", "options": ["visit", "visits", "visiting", "visited"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜對等連接詞 and 連接兩個不定詞（to make…and (to) visit）", "explanation": "【句型】plan to V1 and (to) V2：and 連接對等的不定詞，第二個 to 可省略，保留原形動詞。\n【分析】and 前面是 to make a trip，後面要與它對等，to 省略後用原形動詞 visit：plan to make a trip and (to) visit friends。\n【其他選項】(B) visits、(D) visited 是有時態變化的動詞，與 to make 不對等；(C) visiting 是動名詞，也不對等。\n【例句】I want to go to the night market and buy some snacks.", "explanationSource": "source"}, {"id": 18, "question": "Amy decided to stay home and ______ a cake for her mom.", "options": ["making", "make", "made", "makes"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 17 題）", "explanation": "decide to stay and (to) make，and 後用原形動詞 make。", "explanationSource": "supplemental"}, {"id": 19, "question": "We hope to finish the project early and ______ a short break.", "options": ["took", "taking", "take", "takes"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 17 題）", "explanation": "hope to finish and (to) take，對等用原形 take。", "explanationSource": "supplemental"}, {"id": 20, "question": "Leo enjoys reading novels and ______ to music in his free time.", "options": ["listening", "listen", "listens", "to listen"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 17 題）", "explanation": "enjoy reading and listening，and 前後都是 Ving。", "explanationSource": "supplemental"}, {"id": 21, "question": "Judy: The ball game will be on TV tomorrow at six in the morning.\nLucy: ______ up early and you won't miss it.", "options": ["Get", "To get", "Getting", "Gets"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜祈使句 + and + 未來式", "explanation": "【句型】祈使句（原形動詞）+ and + S + will…＝如果…就會…。\n【分析】Lucy 建議 Judy「早點起床，你就不會錯過」，句首沒有主詞，是祈使句，用原形動詞 Get。\n【其他選項】(B) To get 表目的，後面不能接 and you won't…；(C) Getting 當主詞時後面要接動詞；(D) Gets 缺主詞。\n【例句】Practice every day and you'll play the piano better.", "explanationSource": "source"}, {"id": 22, "question": "______ this medicine and you will feel better soon.", "options": ["Taking", "Take", "Takes", "Taken"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 21 題）", "explanation": "祈使句 + and + will，用原形 Take。", "explanationSource": "supplemental"}, {"id": 23, "question": "______ the bus, or you will be late for school.", "options": ["Hurrying for", "To hurry for", "Hurries for", "Hurry for"], "answer": 3, "answerLabel": "D", "source": "類似題 2（對應第 21 題）", "explanation": "祈使句 + or，用原形動詞 Hurry。", "explanationSource": "supplemental"}, {"id": 24, "question": "Ken: I want to be a good singer.\nTeacher: ______ singing every day and you'll get better.", "options": ["Practice", "Practicing", "To practice", "Practiced"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 21 題）", "explanation": "祈使句用原形動詞 Practice。", "explanationSource": "supplemental"}, {"id": 25, "question": "A-ming: Dad, can I go dancing tomorrow?\nMr. Wu: ______ your homework and we'll talk about it.", "options": ["Finishes", "Finishing", "To finish", "Finish"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜祈使句 + and + 未來式", "explanation": "【句型】祈使句（原形動詞開頭）+ and + S + will…＝先…，就…。\n【分析】爸爸叫 A-ming「先把功課寫完，我們再談」，句首沒有主詞，是祈使句，用原形動詞 Finish。\n【其他選項】(A) Finishes 缺主詞；(B) Finishing 當主詞時須接動詞，不能接 and we'll；(C) To finish 表目的，句子不完整。\n【例句】Clean your room and you can play video games.", "explanationSource": "source"}, {"id": 26, "question": "Mom: ______ your vegetables and you can have some ice cream.", "options": ["Eat", "Eating", "To eat", "Eats"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 25 題）", "explanation": "祈使句 + and，用原形動詞 Eat。", "explanationSource": "supplemental"}, {"id": 27, "question": "Sam: Can I borrow your bike?\nTom: Sure. ______ it back by Friday, OK?", "options": ["Bringing", "Brings", "Bring", "To bring"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 25 題）", "explanation": "祈使句用原形動詞 Bring。", "explanationSource": "supplemental"}, {"id": 28, "question": "______ off your shoes before you come into the house.", "options": ["Taking", "Takes", "To take", "Take"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 25 題）", "explanation": "對別人下指令的祈使句，用原形 Take。", "explanationSource": "supplemental"}, {"id": 29, "question": "It was important for Kevin ______ his homework quickly because he had to help his parents sell fruit in the night market.", "options": ["finish", "to finish", "finishes", "finished"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜It is + adj. + for 人 + to V", "explanation": "【句型】It is/was + 形容詞 + for + 人 + to V：it 是虛主詞，真正主詞是後面的不定詞。\n【分析】句型 It was important for Kevin ___，空格要接不定詞 to finish，表示「對 Kevin 來說，快點寫完功課很重要」。\n【其他選項】(A) finish 少了 to；(C) finishes、(D) finished 是有時態的動詞，不能放在 for Kevin 後面。\n【例句】It is hard for me to wake up early on Monday mornings.", "explanationSource": "source"}, {"id": 30, "question": "It is not easy for little kids ______ still for a long time.", "options": ["sit", "sat", "to sit", "sitting"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 29 題）", "explanation": "It is + adj. + for 人 + to V，用 to sit。", "explanationSource": "supplemental"}, {"id": 31, "question": "It was exciting for us ______ the famous singer at the airport.", "options": ["to see", "see", "saw", "sees"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 29 題）", "explanation": "虛主詞 it 句型，用不定詞 to see。", "explanationSource": "supplemental"}, {"id": 32, "question": "It is necessary for everyone ______ a helmet when riding a scooter.", "options": ["wear", "wears", "wore", "to wear"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 29 題）", "explanation": "It is necessary for 人 to V，用 to wear。", "explanationSource": "supplemental"}, {"id": 33, "question": "It's cold outside; ______ sure to put on your coat before you leave the house.", "options": ["be", "it is", "being", "it will be"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜祈使句 Be sure to V", "explanation": "【句型】祈使句以原形動詞開頭；Be sure to V＝務必要…。\n【分析】分號後是提醒對方「出門前一定要穿外套」的祈使句，be 動詞原形 be，Be sure to put on your coat。\n【其他選項】(B) it is、(D) it will be：主詞 it 不能 sure to 穿外套，語意錯；(C) being 不能當主要動詞。\n【例句】Be sure to lock the door when you go out.", "explanationSource": "source"}, {"id": 34, "question": "The exam is very important, so ______ sure to get enough sleep tonight.", "options": ["being", "be", "is", "to be"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 33 題）", "explanation": "祈使句 Be sure to V，用原形 be。", "explanationSource": "supplemental"}, {"id": 35, "question": "______ quiet in the library, please. People are studying.", "options": ["Being", "Is", "To be", "Be"], "answer": 3, "answerLabel": "D", "source": "類似題 2（對應第 33 題）", "explanation": "祈使句用 be 動詞原形 Be。", "explanationSource": "supplemental"}, {"id": 36, "question": "It may rain this afternoon; ______ to take an umbrella with you.", "options": ["remember", "remembering", "to remember", "it remembers"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 33 題）", "explanation": "分號後為祈使句，用原形 remember。", "explanationSource": "supplemental"}, {"id": 37, "question": "The most convenient way to get around this small town is ______ a bike.", "options": ["to ride", "to have ridden", "rides", "rode"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜to V 當主詞補語（The way to V is to V）", "explanation": "【句型】S + be + to V：不定詞放在 be 動詞後當主詞補語，說明主詞的內容。\n【分析】主詞是 The most convenient way（最方便的方式），is 後要說明「方式是什麼」，用不定詞 to ride a bike「騎腳踏車」。\n【其他選項】(B) to have ridden 是完成式不定詞，表示「已經騎過」，與一般事實不合；(C) rides、(D) rode 是有時態的動詞，不能接在 is 之後。\n【例句】My dream is to travel around the world.", "explanationSource": "source"}, {"id": 38, "question": "The best way to learn English is ______ it every day.", "options": ["used", "to use", "uses", "to have used"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 37 題）", "explanation": "be 後接 to V 當補語，用 to use。", "explanationSource": "supplemental"}, {"id": 39, "question": "Ann's plan for this summer is ______ how to swim.", "options": ["learns", "learned", "to have learned", "to learn"], "answer": 3, "answerLabel": "D", "source": "類似題 2（對應第 37 題）", "explanation": "plan is to V，說明計畫的內容，用 to learn。", "explanationSource": "supplemental"}, {"id": 40, "question": "The only thing we can do now is ______ for the rain to stop.", "options": ["to wait", "waits", "waited", "to have waited"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 37 題）", "explanation": "be 後接不定詞補語，用 to wait。", "explanationSource": "supplemental"}, {"id": 41, "question": "Dad always tells me not ______ only for tests. If that's all I'm doing, he says, I will soon lose interest in learning.", "options": ["study", "studying", "studied", "to study"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜tell + 人 + not to V", "explanation": "【句型】tell + 人 + (not) to V＝告訴某人（不要）做某事；否定 not 放在 to 前面。\n【分析】tells me not ___ 是 tell sb not to V 的句型，所以用 to study：爸爸叫我不要只為了考試念書。\n【其他選項】(A) study 少了 to；(B) studying、(C) studied 都不符合 tell sb (not) to V 的句型。\n【例句】The doctor told my mom not to eat too much salt.", "explanationSource": "source"}, {"id": 42, "question": "Our teacher asked us not ______ in the hallway.", "options": ["running", "to run", "run", "ran"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 41 題）", "explanation": "ask 人 not to V，用 to run。", "explanationSource": "supplemental"}, {"id": 43, "question": "Mom told me ______ my little brother with his homework.", "options": ["to help", "help", "helping", "helped"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 41 題）", "explanation": "tell 人 to V，用 to help。", "explanationSource": "supplemental"}, {"id": 44, "question": "The sign warns people not ______ the animals in the zoo.", "options": ["feed", "fed", "feeding", "to feed"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 41 題）", "explanation": "warn 人 not to V，用 to feed。", "explanationSource": "supplemental"}]};</script><script src="longteng-b1u5-quiz.js?v=20261027-2"></script><script>document.querySelector("#description").textContent="共 44 題（會考歷屆＋講義錯題 11 題＋類似題 33 題）｜選答後顯示中文解析｜答錯可重做並下載錯題";</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
