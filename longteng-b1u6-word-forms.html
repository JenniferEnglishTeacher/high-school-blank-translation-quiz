ection></main><script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 6｜詞類變化","mode":"spell","questions":[{"id":1,"question":"Eric’s doctor suggested that he sleep on a ____________ (firmly) mattress to benefit his back.","answers":["firm"],"source":"All in One","explanation":"補充字義：firm 表示「堅定的；結實的」。來源未附逐題解析。"},{"id":2,"question":"I grasped the stick ____________ (firm) in my right hand.","answers":["firmly"],"source":"龍騰自命題","explanation":"我緊緊地用我的右手抓住這根棍子。"},{"id":3,"question":"If it is ____________ (firm) planted in a rich soil, the tree will grow very quickly.","answers":["firmly"],"source":"龍騰自命題","explanation":"這棵樹如果牢牢地種植在肥沃的土壤中，將會迅速成長。"},{"id":4,"question":"Some ____________ (slavery) in the American South were treated well by their masters, but they were still not free people.","answers":["slaves"],"source":"All in One","explanation":"補充字義：slaves 表示「奴隸」。來源未附逐題解析。"},{"id":5,"question":"What really ____________ (attraction) Trudy to the job was the paid vacations.","answers":["attracted"],"source":"All in One","explanation":"補充字義：attracted 表示「被吸引；吸引了」。來源未附逐題解析。"},{"id":6,"question":"Scientists say that we must do something to prevent the problem of ____________ (globe) warming from getting worse.","answers":["global"],"source":"習作簿","explanation":"補充字義：global 表示「全球的」。來源未附逐題解析。"},{"id":7,"question":"This island country depends on ____________ (tourist) a lot, and new hotels spring up throughout the island.","answers":["tourism"],"source":"龍騰自命題","explanation":"這個島國大大仰賴觀光產業，新的飯店在島上如雨後春筍般湧現。"},{"id":8,"question":"The students were ____________ (celebration) this week after they received their exam results.","answers":["celebrating"],"source":"龍騰自命題","explanation":"這星期學生們收到考試成績後，正在慶祝。考點句構：be + V-ing。"},{"id":9,"question":"The samples used in the study were insufficient, so we can’t be sure whether the results were ____________ (represent) or not.","answers":["representative"],"source":"龍騰自命題","explanation":"這項研究使用的樣本並不夠，因此我們無法確定結果是不是具有代表性。考點句構：be + adj."},{"id":10,"question":"When the birds turn three months old and are able to fly, they are old enough to be ____________ (independence) from their parents.","answers":["independent"],"source":"龍騰自命題","explanation":"當鳥三個月大而且會飛時，就大得足以不用依賴父母而自立了。考點句構：be + adj. + from。"},{"id":11,"question":"The shark was ____________ (attraction) by the smell of blood.","answers":["attracted"],"source":"龍騰自命題","explanation":"血液的氣味會吸引鯊魚。考點句構：被動語態（be + p.p.）。"},{"id":12,"question":"(globe) warming, a kind of climate change, means a rise in the surface temperature on Earth.","answers":["Global"],"source":"龍騰自命題","explanation":"全球暖化，氣候變遷的一種，指地球表面溫度上升。考點句構：adj. + 名詞。"},{"id":13,"question":"Liberia was founded about 170 years ago by freed ____________ (slavery) from the United States.","answers":["slaves"],"source":"龍騰自命題","explanation":"賴比瑞亞由美國解放的奴隸於170年前建立。考點句構：adj. + 複數名詞。"},{"id":14,"question":"The couple left the restaurant in anger because they got rude ____________ (treat) from the staff there.","answers":["treatment"],"source":"習作簿","explanation":"補充字義：treatment 表示「對待；待遇」。來源未附逐題解析。"},{"id":15,"question":"Having no taxes is an ____________ (attract) idea, but we would lose many important services.","answers":["attractive"],"source":"習作簿","explanation":"補充字義：attractive 表示「吸引人的」。來源未附逐題解析。"},{"id":16,"question":"His birthday falls on a holiday, so he is going on a trip to ____________ (celebration) it.","answers":["celebrate"],"source":"習作簿","explanation":"補充字義：celebrate 表示「慶祝」。來源未附逐題解析。"},{"id":17,"question":"I cherish the card Jenny gave to me because it is ____________ (symbolize) of our friendship.","answers":["symbolic"],"source":"All in One","explanation":"補充字義：symbolic 表示「象徵性的」。來源未附逐題解析。"},{"id":18,"question":"The problem of ____________ (globe) warming is getting worse, and it may threaten our living environment.","answers":["global"],"source":"All in One","explanation":"補充字義：global 表示「全球的」。來源未附逐題解析。"},{"id":19,"question":"The flowers that Ian bought for his wife on her birthday were ____________ (symbol) of his love for her.","answers":["symbolic"],"source":"龍騰自命題","explanation":"Ian在他老婆生日買給她的那些花是象徵他對她的愛。"}]};</script><script src="longteng-b1u5-quiz.js?v=20261026-2"></script><script src="longteng-vocab-required-pronunciation.js?v=20261026-2"></script></body></html>
