<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hanlin B4U2 翻譯題</title><style>:root{--b:#2563eb;--g:#15803d;--r:#b91c1c;--p:#7c3aed;--bg:#f5f7fb;--line:#dbe2ea}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1f2937;font-family:Arial,"Microsoft JhengHei",sans-serif;line-height:1.7}.wrap{max-width:1000px;margin:auto;padding:16px}.hero,.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}.hero{background:linear-gradient(135deg,#eaf2ff,#fff)}h1,h2{margin-top:0}.note{color:#64748b}.hidden{display:none!important}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 15px;font-size:16px;font-weight:700;cursor:pointer;background:#e5e7eb}.primary{background:var(--b);color:#fff}.danger{background:#991b1b;color:#fff}.voice{background:var(--p);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.pick{display:flex;gap:10px;padding:10px;border-bottom:1px solid #eee}.progress{height:9px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--b)}.zh{font-size:22px;font-weight:800;padding:14px;background:#eff6ff;border-left:5px solid var(--b);border-radius:8px;margin:16px 0}.template{font-size:18px;margin-bottom:10px;color:#374151}.answerInput{width:100%;min-height:90px;font:inherit;font-size:18px;padding:12px;border:2px solid #94a3b8;border-radius:10px;resize:vertical}.answerInput.ok{border-color:var(--g);background:#ecfdf3}.answerInput.bad{border-color:var(--r);background:#fff1f2}.feedback{padding:13px;border-radius:10px;margin-top:14px}.feedback.ok{background:#ecfdf3;color:var(--g)}.feedback.bad{background:#fff1f2;color:var(--r)}.correctAnswer{margin-top:8px;font-weight:700}.voicebox{margin-top:14px;padding:14px;border:2px solid #ddd6fe;background:#f5f3ff;border-radius:12px}.voiceTarget{font-weight:700;font-size:18px;margin:7px 0}.wrongcard{border:1px solid #fecaca;background:#fff7f7;border-radius:12px;padding:14px;margin:10px 0}.wrongcard p{margin:5px 0}@media(max-width:600px){.wrap{padding:10px}.zh{font-size:19px}.answerInput{font-size:17px}}</style></head><body><div class="wrap"><section class="hero"><h1>Hanlin B4U2 翻譯題</h1><p>共 44 題。請依中文翻成英文；第 6、11 題保留原題的部分英文填空格式。</p><p class="note">答錯會顯示正確答案並要求重新輸入。曾答錯的題目會保留，完成後可再做錯題並下載 DOCX。填對後需朗讀完整英文，語音辨識達 90% 才能進下一題。</p></section><section id="sel" class="card"><h2>選擇題目</h2><div class="toolbar"><button class="btn" id="all">全部選取</button><button class="btn" id="none">全部取消</button><button class="btn primary" id="start">開始作答</button></div><div id="list"></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><p id="meta"></p><div id="zh" class="zh"></div><div id="template" class="template hidden"></div><textarea id="input" class="answerInput" placeholder="請輸入英文答案"></textarea><div id="fb" class="feedback hidden"></div><div id="voiceBox" class="voicebox hidden"><b>🔊 整句朗讀</b><div id="voiceTarget" class="voiceTarget"></div><div class="toolbar"><button id="speak" class="btn voice">🔊 聽一次</button><button id="mic" class="btn voice">🎤 開始朗讀</button></div><div id="vr" class="note">朗讀正確性須達 90%。</div></div><div class="toolbar" style="margin-top:14px"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden" disabled>下一題</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary"></div><div id="wrongList"></div><div class="toolbar"><button id="retry" class="btn primary">再做一次錯題</button><button id="download" class="btn primary">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></div><script type="module">import{Document,Packer,Paragraph,TextRun,HeadingLevel}from'https://esm.sh/docx@9.5.1';const Q=[
{n:1,zh:'蘋果是全部中有最多汁的。',a:['The apple has the most juice of all.'],e:'juice 是不可數名詞，用 much 的最高級 the most。'},
{n:2,zh:'玉山（Yushan）是臺灣最高的山。',a:['Yushan is the highest mountain in Taiwan.'],e:'high 的最高級是 highest。'},
{n:3,zh:'那臺紅色汽車是店裡最貴的嗎？',a:['Is that red car the most expensive at the store?'],e:'Be 動詞起首，使用 the most expensive。'},
{n:4,zh:'她的數學比你的或我的更差。她的是三人中最差的。',a:['Her math is worse than yours or mine. Hers is the worst of the three.'],e:'worse than；the worst of the three。'},
{n:5,zh:'誰的頭髮最短，你的、她的、或我的？',a:['Whose hair is the shortest, yours, hers, or mine?'],e:'三者比較使用最高級 the shortest。'},
{n:6,zh:'問你自己一些問題並試著尋找這些問題的答案。',template:'Ask ______ some questions and try to look for the answers to the questions.',a:['yourself'],full:'Ask yourself some questions and try to look for the answers to the questions.',e:'反身代名詞 yourself。'},
{n:7,zh:'臺北 101 是臺灣最高的建築物嗎？',a:['Is Taipei 101 the tallest building in Taiwan?'],e:'tall 的最高級 tallest。'},
{n:8,zh:'誰是全部中最帥的籃球選手呢？',a:['Who is the most handsome basketball player of all?'],e:'handsome 的最高級是 the most handsome。'},
{n:9,zh:'遠離紅火蟻比用熱水殺牠們安全多了。',a:['Staying away from red fire ants is much safer than killing them with hot water.'],e:'much 可修飾比較級 safer。'},
{n:10,zh:'誰是你生命中最重要的人呢？',a:['Who is the most important person in your life?'],e:'the most important person。'},
{n:11,zh:'女孩們，不必拘束並且自行取用桌上的餅乾吧。',template:'Girls, make ______ at home and help ______ to the cookies on the table.',a:['yourselves; yourselves','yourselves yourselves'],full:'Girls, make yourselves at home and help yourselves to the cookies on the table.',e:'make oneself at home；help oneself to。'},
{n:12,zh:'昨天他們自己搭捷運去海邊。',a:['They went to the beach by metro by themselves yesterday.'],e:'by metro；by themselves。'},
{n:13,zh:'誰的點子最糟糕，你的、她的、或我的？（... terrible...）',a:['Whose idea is the most terrible, yours, hers, or mine?'],e:'三者以上使用 the most terrible。'},
{n:14,zh:'Brad 是籃球隊裡面最特別的球員。',a:['Brad is the most special player on the basketball team.'],e:'the most special。'},
{n:15,zh:'戶外活動是最受學生歡迎的。',a:['Outdoor activities are the most popular with students.'],e:'be popular with。'},
{n:16,zh:'這些蛇很危險因為牠們的咬傷可能致死。',a:['These snakes are dangerous because their bites can cause death.'],e:'cause death 表示導致死亡。'},
{n:17,zh:'我們去海裡面游泳吧！',a:["Let's go for a swim in the sea!"],e:"Let's + 原形動詞。"},
{n:18,zh:'很少人知道這座山，所以現場除了我們之外只有兩位學生。',a:['Very few people knew about this mountain, so we were the only ones there besides two students.','Very few people knew about this mountain, so there were only us besides two students.'],e:'few 接可數名詞；besides 表示除了…之外還有。'},
{n:19,zh:'Tim 游了十分鐘後，被一個大浪打到他接著他開始掙扎。',a:['After Tim swam for ten minutes, a big wave hit him and he started to struggle.'],e:'a big wave；start to struggle。'},
{n:20,zh:'Hank 是學校裡最棒的游泳選手。沒人游得比他好。',a:['Hank is the best swimmer at school. No one swims better than he.'],e:'the best swimmer；better than。'},
{n:21,zh:'這記者是本年度最受歡迎的。',a:['The reporter is the most popular of the year.'],e:'the most popular of the year。'},
{n:22,zh:'可能有蛇躲在石頭下面因為牠們喜歡躲在陰暗潮溼的地方。',a:['There might be snakes under the rock because they like to hide in dark and wet places.'],e:'There might be...；hide in dark and wet places。'},
{n:23,zh:'我最好的朋友有最漂亮的花朵。',a:['My best friend has the most beautiful flowers.'],e:'the most beautiful flowers。'},
{n:24,zh:'Tom：現在最好的主意是什麼？Jeremy：用熱水殺死牠們是最好的主意。（... Killing...）',a:['Tom: What is the best idea for now? Jeremy: Killing them with hot water is the best idea.'],e:'for now；動名詞 Killing... 當主詞。'},
{n:25,zh:'標語說：小心強風與大浪！（... say...）',a:['The sign says, “Be careful of the strong wind and big waves!”','The sign says, "Be careful of the strong wind and big waves!"'],e:'The sign says...。'},
{n:26,zh:'我父母要我是世界上最快樂的人。',a:['My parents want me to be the happiest person in the world.'],e:'want + 人 + to be；the happiest。'},
{n:27,zh:'他店內的水果是市場上最甜而且最便宜的。',a:['The fruits in his shop are the sweetest and the cheapest at the market.'],e:'the sweetest and the cheapest。'},
{n:28,zh:'在這個意外發生後，Maria 學到了重要的一課。',a:['After the accident happened, Maria learned an important lesson.'],e:'learned an important lesson。'},
{n:29,zh:'我們聽說過一個很漂亮的海灘，並決定要去看看。',a:['We heard about a beautiful beach and decided to check it out.'],e:'hear about；check it out。'},
{n:30,zh:'在臺灣，什麼是最難吃的點心？',a:['In Taiwan, what is the least delicious snack?','In Taiwan, what is the least yummy snack?'],e:'最不美味可用 the least delicious / yummy。'},
{n:31,zh:'他的農場是他城市中最大而且最好的。',a:['His farm is the biggest and the best in his city.'],e:'the biggest and the best。'},
{n:32,zh:'感謝你划船過來救我。',a:['Thank you for rowing a boat over to save me.'],e:'thank 人 for + V-ing。'},
{n:33,zh:'今天是這星期最熱的一天。',a:['Today is the hottest day of the week.'],e:'hot 的最高級 hottest。'},
{n:34,zh:'Jill：哪一支是店裡最貴的電話？店員：在那邊白色的那支。它比店裡所有其他的電話甚至更貴。',a:["Jill: Which is the most expensive phone at the store? Clerk: The white one over there. It's even more expensive than all the other phones at the store."],e:'問句用最高級；答句用 even + 比較級。'},
{n:35,zh:'哪個是這家果汁店最受歡迎的飲料，柳橙汁、蘋果汁、或鳳梨汁？',a:['Which is the most popular drink at the juice shop, orange juice, apple juice, or pineapple juice?'],e:'三種飲料中使用 the most popular。'},
{n:36,zh:'我待在沙灘上休息直到一個意外發生。',a:['I rested on the beach until an accident happened.'],e:'until 連接兩個事件。'},
{n:37,zh:'踢倒紅火蟻的巢是最糟的作法。（Kicking...）',a:["Kicking the red fire ants' nest down is the worst thing to do.","Kicking the red fire ants’ nest down is the worst thing to do."],e:'Kicking... 當主詞；the worst thing to do。'},
{n:38,zh:'冷靜下來。沒什麼啊。',a:["Cool down. It's nothing.","Cool down. It is nothing."],e:'Cool down；It’s nothing。'},
{n:39,zh:'Jessie，我的一位老朋友，是她家中有最多空閒時間但卻最少錢的。',a:['Jessie, an old friend of mine, has the most free time but the least money in her family.'],e:'the most free time；the least money。'},
{n:40,zh:'最簡單能感覺涼爽的方法是去海裡游泳。',a:['The easiest way to feel cool is going for a swim in the sea.'],e:'the easiest way；go for a swim。'},
{n:41,zh:'這家有名氣的果汁店總是使用當季最甜的水果嗎？',a:['Does the famous juice shop always use the sweetest fruit of the season?'],e:'Does + 單數主詞 + 原形動詞。'},
{n:42,zh:'今天一整天她沒吃或喝任何東西。（... nothing...）',a:['She ate or drank nothing all day today.'],e:'nothing 已是否定意義，不再加 not。'},
{n:43,zh:'是七月或八月是一年中最熱的月分呢？',a:['Is July or August the hottest month of the year?'],e:'hot → hottest。'},
{n:44,zh:'衝浪是最有趣的戶外活動。',a:['Surfing is the most interesting outdoor activity.'],e:'動名詞 Surfing 當主詞；the most interesting。'}
];let selected=[],idx=0,wrong=new Map(),retryMode=false;const $=id=>document.getElementById(id);function norm(s){return String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim()}function display(q){$('zh').textContent=q.zh;if(q.template){$('template').textContent=q.template;$('template').classList.remove('hidden')}else $('template').classList.add('hidden');$('input').value='';$('input').className='answerInput';$('fb').className='feedback hidden';$('voiceBox').classList.add('hidden');$('next').classList.add('hidden');$('next').disabled=true;$('check').classList.remove('hidden');$('meta').textContent=`第 ${idx+1} / ${selected.length} 題｜原題 ${q.n}`;$('bar').style.width=`${(idx+1)/selected.length*100}%`;$('input').placeholder=q.template?'請輸入空格答案；多個空格請用空格或分號分開':'請輸入完整英文句子'}function renderList(){$('list').innerHTML=Q.map(q=>`<label class="pick"><input type="checkbox" value="${q.n}" checked><span><b>${q.n}.</b> ${q.zh}</span></label>`).join('')}function isCorrect(q,v){return q.a.some(a=>norm(a)===norm(v))}function fullAnswer(q){return q.full||q.a[0]}function check(){let q=selected[idx],v=$('input').value.trim();if(isCorrect(q,v)){$('input').classList.add('ok');$('input').disabled=true;$('fb').className='feedback ok';$('fb').innerHTML=`✅ 正確！<div class="correctAnswer">${fullAnswer(q)}</div><div>${q.e}</div>`;$('check').classList.add('hidden');$('voiceBox').classList.remove('hidden');$('voiceTarget').textContent=fullAnswer(q);$('next').classList.remove('hidden');$('next').disabled=true;speak()}else{$('input').classList.add('bad');if(!wrong.has(q.n))wrong.set(q.n,[]);wrong.get(q.n).push(v||'(空白)');$('fb').className='feedback bad';$('fb').innerHTML=`❌ 答案不正確。<div class="correctAnswer">正確答案：${fullAnswer(q)}</div><div>${q.e}</div><div>請依正確答案重新輸入一次。</div>`;$('input').value='';$('input').focus()}}function speak(){if(!window.speechSynthesis)return;window.speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(fullAnswer(selected[idx]));u.lang='en-US';u.rate=.88;window.speechSynthesis.speak(u)}function sim(a,b){a=norm(a).split(' ').filter(Boolean);b=norm(b).split(' ').filter(Boolean);let d=Array.from({length:a.length+1},()=>Array(b.length+1).fill(0));for(let i=0;i<=a.length;i++)d[i][0]=i;for(let j=0;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return 1-d[a.length][b.length]/Math.max(a.length,b.length,1)}function listen(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$('vr').textContent='此瀏覽器不支援語音辨識，建議使用最新版 Chrome 或 Edge；為避免卡住，已開放下一題。';$('next').disabled=false;return}let r=new R;r.lang='en-US';r.interimResults=false;r.maxAlternatives=5;$('mic').disabled=true;$('vr').textContent='🎤 正在聽，請完整朗讀…';r.onresult=e=>{let best={s:0,t:''};for(let i=0;i<e.results[0].length;i++){let t=e.results[0][i].transcript,s=sim(t,fullAnswer(selected[idx]));if(s>best.s)best={s,t}}let p=Math.round(best.s*100);$('vr').innerHTML=`辨識：<b>${best.t}</b><br>正確性：<b>${p}%</b>`+(p>=90?'<br>✅ 朗讀通過。':'<br>❌ 未達 90%，請重新朗讀。');$('next').disabled=p<90};r.onerror=e=>{$('vr').textContent=e.error==='not-allowed'?'請允許麥克風權限。':'語音辨識失敗，請再試一次。'};r.onend=()=>{$('mic').disabled=false};r.start()}function finish(){window.speechSynthesis?.cancel();$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('summary').innerHTML=`完成 ${selected.length} 題；曾答錯 <b>${wrong.size}</b> 題。`;$('wrongList').innerHTML=wrong.size?[...wrong.keys()].map(n=>{let q=Q.find(x=>x.n===n);return`<div class="wrongcard"><b>第 ${n} 題</b><p>${q.zh}</p><p>你的錯誤答案：${wrong.get(n).join(' / ')}</p><p><strong>正確答案：</strong>${fullAnswer(q)}</p></div>`}).join(''):'<p class="feedback ok">🎉 沒有錯題。</p>';$('retry').classList.toggle('hidden',wrong.size===0)}async function download(){let children=[new Paragraph({text:'Hanlin B4U2 翻譯題 錯題整理',heading:HeadingLevel.TITLE})];for(let[n,attempts]of wrong){let q=Q.find(x=>x.n===n);children.push(new Paragraph({children:[new TextRun({text:`第 ${n} 題`,bold:true})]}),new Paragraph('中文：'+q.zh),new Paragraph('錯誤答案：'+attempts.join(' / ')),new Paragraph('正確答案：'+fullAnswer(q)),new Paragraph('重新翻譯：____________________________________________'))}let blob=await Packer.toBlob(new Document({sections:[{children}]})),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='Hanlin_B4U2_翻譯題_錯題.docx';a.click();URL.revokeObjectURL(u)}renderList();$('all').onclick=()=>document.querySelectorAll('#list input').forEach(x=>x.checked=true);$('none').onclick=()=>document.querySelectorAll('#list input').forEach(x=>x.checked=false);$('start').onclick=()=>{selected=[...document.querySelectorAll('#list input:checked')].map(x=>Q.find(q=>q.n==x.value));if(!selected.length)return alert('請至少選一題');idx=0;wrong.clear();retryMode=false;$('sel').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');$('input').disabled=false;display(selected[idx])};$('check').onclick=check;$('speak').onclick=speak;$('mic').onclick=listen;$('next').onclick=()=>{if($('next').disabled)return;$('input').disabled=false;if(++idx>=selected.length)finish();else display(selected[idx])};$('finish').onclick=finish;$('retry').onclick=()=>{selected=[...wrong.keys()].map(n=>Q.find(q=>q.n===n));idx=0;retryMode=true;$('result').classList.add('hidden');$('quiz').classList.remove('hidden');$('input').disabled=false;display(selected[idx])};$('download').onclick=download;$('restart').onclick=()=>location.reload();</script></body></html>
