<script>window.QUIZ_CONFIG={"title": "國中會考文法歷屆試題｜特殊動詞（spend/cost/take/pay/lend/borrow）", "mode": "mcq", "questions": [{"id": 1, "question": "There's a subway station near my house. ______ takes me only ten minutes to get to my office.", "options": ["It", "There", "The one", "The station"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜It takes + 人 + 時間 + to V", "explanation": "【句型】It takes + 人 + 時間 + to V（做某事花某人多少時間），It 為虛主詞，代替後面的 to V。\n【分析】句中有 takes me ten minutes to get to my office，主詞須用虛主詞 It。\n【其他選項】(B) There 不能與 takes 連用；(C) The one、(D) The station 當主詞時，車站本身不會「花我十分鐘去辦公室」，語意與句型皆不合。\n【例句】It takes Amy half an hour to walk to school.", "explanationSource": "source"}, {"id": 2, "question": "My grandparents live in Hualien. ______ takes us about three hours to get there by train.", "options": ["There", "It", "That trip", "They"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 1 題）", "explanation": "It takes + 人 + 時間 + to V，It 為虛主詞。", "explanationSource": "supplemental"}, {"id": 3, "question": "It ______ Jason two weeks to finish the science project.", "options": ["took", "spent", "cost", "paid"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 1 題）", "explanation": "It + take + 人 + 時間 + to V；spent 主詞須為人。", "explanationSource": "supplemental"}, {"id": 4, "question": "How long does it take ______ from Taipei to Tainan by bus?", "options": ["go", "going", "to go", "went"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 1 題）", "explanation": "It takes + 時間 + to V，故選 to go。", "explanationSource": "supplemental"}, {"id": 5, "question": "It took the police lots of time ______ who entered Liu's house and killed her one year ago.", "options": ["and found out", "find out", "finding out", "to find out"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜It takes + 人 + 時間 + to V", "explanation": "【句型】It takes / took + 人 + 時間 + to V。\n【分析】It took the police lots of time 之後要接不定詞 to find out：「警方花了很多時間才查出是誰…」。\n【其他選項】(A) and found out 破壞 It took…to V 句型；(B) find out 原形不能直接接；(C) finding out 為 spend 句型（spend time Ving）的用法。\n【例句】It took me an hour to fix my bike.", "explanationSource": "source"}, {"id": 6, "question": "It took Nina a whole afternoon ______ her bedroom.", "options": ["cleaning", "to clean", "cleaned", "clean"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 5 題）", "explanation": "It takes + 人 + 時間 + to V。", "explanationSource": "supplemental"}, {"id": 7, "question": "Peter spent three days ______ the puzzle.", "options": ["to finish", "finish", "finishing", "finished"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 5 題）", "explanation": "人 + spend + 時間 + Ving；與 It takes…to V 區分。", "explanationSource": "supplemental"}, {"id": 8, "question": "How long did it take you ______ the speech by heart?", "options": ["learn", "learning", "learned", "to learn"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 5 題）", "explanation": "it take + 人 + 時間 + to V，選 to learn。", "explanationSource": "supplemental"}, {"id": 9, "question": "Gary: When you go shopping, do you usually ______ with your credit card?\nTony: No, I don't have a credit card.", "options": ["use", "pay", "spend", "waste"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜pay with + 付款方式", "explanation": "【句型】pay with / by + 付款方式（用信用卡、現金等付錢）；pay (money) for 物品。\n【分析】空格後接 with your credit card，表示「用信用卡付款」，選 pay。\n【其他選項】(A) use 是及物動詞，要說 use your credit card，不需 with；(C) spend 後要接金錢或時間（spend money on…）；(D) waste 浪費，語意不合。\n【例句】Can I pay with my EasyCard here?", "explanationSource": "source"}, {"id": 10, "question": "The store only takes cash, so you can't ______ by credit card.", "options": ["pay", "spend", "cost", "borrow"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 9 題）", "explanation": "pay by credit card 用信用卡付款。", "explanationSource": "supplemental"}, {"id": 11, "question": "How much did you ______ for those new sneakers?", "options": ["cost", "spend", "pay", "take"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 9 題）", "explanation": "人 + pay + 金錢 + for + 物品。", "explanationSource": "supplemental"}, {"id": 12, "question": "My sister ______ NT$500 on books last month.", "options": ["paid", "cost", "took", "spent"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 9 題）", "explanation": "人 + spend + 金錢 + on + 物品。", "explanationSource": "supplemental"}, {"id": 13, "question": "Charles ______ a day in the department store looking for a hat for his wife.", "options": ["cost", "spent", "saw", "made"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜人 + spend + 時間 + Ving", "explanation": "【句型】人 + spend + 時間／金錢 + (in) Ving。\n【分析】主詞是人 Charles，後接 a day 和 looking for…，符合 spend 時間 Ving：「花了一天在百貨公司找帽子」。\n【其他選項】(A) cost 主詞須為物（事物花費某人金錢）；(C) saw、(D) made 不能接「時間 + Ving」表示花時間。\n【例句】Wendy spent two hours doing her homework.", "explanationSource": "source"}, {"id": 14, "question": "Leo ______ the whole weekend playing video games.", "options": ["took", "cost", "spent", "paid"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 13 題）", "explanation": "人 + spend + 時間 + Ving。", "explanationSource": "supplemental"}, {"id": 15, "question": "This jacket ______ me NT$1,200.", "options": ["cost", "spent", "paid", "took"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 13 題）", "explanation": "物 + cost + 人 + 金錢，主詞是 jacket。", "explanationSource": "supplemental"}, {"id": 16, "question": "We spent an hour ______ for the bus in the rain.", "options": ["wait", "waiting", "to wait", "waited"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 13 題）", "explanation": "spend + 時間 + Ving，選 waiting。", "explanationSource": "supplemental"}, {"id": 17, "question": "Lisa's room was very dirty. It took her three hours ______ it.", "options": ["clean", "cleaned", "has cleaned", "to clean"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜It takes + 人 + 時間 + to V", "explanation": "【句型】It takes / took + 人 + 時間 + to V。\n【分析】It took her three hours 之後接不定詞 to clean：「她花了三小時打掃房間」。\n【其他選項】(A) clean 原形不能直接接；(B) cleaned 過去式，句中已有動詞 took；(C) has cleaned 完成式動詞，不能放在此處。\n【例句】It took us ten minutes to walk to the park.", "explanationSource": "source"}, {"id": 18, "question": "The math problem was hard. It took Andy an hour ______ it.", "options": ["to solve", "solved", "solving", "solve"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 17 題）", "explanation": "It takes + 人 + 時間 + to V。", "explanationSource": "supplemental"}, {"id": 19, "question": "It ______ me two years to save enough money for this camera.", "options": ["spent", "took", "paid", "cost"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 17 題）", "explanation": "It + take + 人 + 時間 + to V 表示花費時間。", "explanationSource": "supplemental"}, {"id": 20, "question": "Ivy ______ three hours to read the novel.", "options": ["spent", "cost", "paid", "took"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 17 題）", "explanation": "人 + take + 時間 + to V 也可表示花時間；spent 後須接 Ving。", "explanationSource": "supplemental"}, {"id": 21, "question": "David forgot to bring money with him, so I ______ him NT$60 to pay for his lunch.", "options": ["borrowed", "lent", "ordered", "spent"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜lend + 人 + 物（借出）", "explanation": "【句型】lend + 人 + 物 ＝ lend + 物 + to + 人（借出）；borrow + 物 + from + 人（借入）。\n【分析】David 忘了帶錢，所以「我借給他 60 元」，用 lent（lend 過去式）。\n【其他選項】(A) borrowed 是向別人借，不能接「人＋物」雙受詞；(C) ordered 訂購／點餐；(D) spent 花費，不能接「人＋錢」。\n【例句】Can you lend me your eraser?", "explanationSource": "source"}, {"id": 22, "question": "I left my umbrella at home, so I ______ one from my classmate.", "options": ["lent", "borrowed", "paid", "gave"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 21 題）", "explanation": "borrow + 物 + from + 人，向某人借東西。", "explanationSource": "supplemental"}, {"id": 23, "question": "Could you ______ me your dictionary for a minute?", "options": ["lend", "borrow", "spend", "take"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 21 題）", "explanation": "lend + 人 + 物，把東西借給某人。", "explanationSource": "supplemental"}, {"id": 24, "question": "Mary ______ her notebook to Ken because he missed the class.", "options": ["borrowed", "cost", "lent", "spent"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 21 題）", "explanation": "lend + 物 + to + 人，借出筆記給 Ken。", "explanationSource": "supplemental"}, {"id": 25, "question": "It's ______ me a lot of time to find out what I really want to do in the future.", "options": ["paying", "spending", "taking", "using"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜It takes + 人 + 時間 + to V（進行式 taking）", "explanation": "【句型】It takes + 人 + 時間 + to V（此處為現在進行式 It's taking）。\n【分析】主詞是虛主詞 It，後接 me a lot of time to find out…，只有 take 符合：「我花了很多時間在找出未來想做什麼」。\n【其他選項】(A) pay 用於金錢；(B) spend 主詞須為人，且接 Ving；(D) use 不能接「人＋時間＋to V」。\n【例句】It's taking Ben a long time to get used to his new school.", "explanationSource": "source"}, {"id": 26, "question": "It ______ Joan a week to plan the class trip.", "options": ["took", "spent", "paid", "used"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 25 題）", "explanation": "It + take + 人 + 時間 + to V。", "explanationSource": "supplemental"}, {"id": 27, "question": "Mr. Ho is ______ a lot of money fixing his old car.", "options": ["taking", "costing", "spending", "lending"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 25 題）", "explanation": "人 + spend + 金錢 + Ving。", "explanationSource": "supplemental"}, {"id": 28, "question": "The concert tickets ______ us NT$3,000 in total.", "options": ["spent", "took", "paid", "cost"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 25 題）", "explanation": "物 + cost + 人 + 金錢。", "explanationSource": "supplemental"}, {"id": 29, "question": "I can ______ you the book, but you have to give it back to me in three days.", "options": ["borrow", "lend", "read", "show"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜lend vs. borrow", "explanation": "【句型】lend + 人 + 物（把東西借給某人）；borrow + 物 + from + 人（向某人借）。\n【分析】後句 you have to give it back to me「你要還給我」，表示書是我借出去的，選 lend。\n【其他選項】(A) borrow 是「借入」，且不接「人＋物」；(C) read you the book 唸書給你聽，與「還給我」不合；(D) show 給…看，不需要「歸還」。\n【例句】Jack lent me his bike for a day.", "explanationSource": "source"}, {"id": 30, "question": "May I ______ your pen? I'll return it after class.", "options": ["lend", "borrow", "give", "keep"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 29 題）", "explanation": "向別人借東西用 borrow，後句「下課歸還」。", "explanationSource": "supplemental"}, {"id": 31, "question": "The library ______ books to students for two weeks.", "options": ["lends", "borrows", "spends", "costs"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 29 題）", "explanation": "lend + 物 + to + 人，圖書館把書借出給學生。", "explanationSource": "supplemental"}, {"id": 32, "question": "Ted ______ NT$100 from his sister, and he has to pay her back tomorrow.", "options": ["lent", "paid", "borrowed", "cost"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 29 題）", "explanation": "borrow + 物 + from + 人，向姊姊借錢。", "explanationSource": "supplemental"}, {"id": 33, "question": "Studying in a foreign country ______ me a lot of money. That's why I had to sell my apartment.", "options": ["cost", "lost", "made", "spent"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜物 + cost + 人 + 金錢", "explanation": "【句型】事物（主詞）+ cost + 人 + 金錢（某事物花了某人多少錢）。\n【分析】主詞是動名詞 Studying in a foreign country（事物），後接 me a lot of money，選 cost（過去式同形）：「出國念書花了我很多錢，所以得賣掉公寓」。\n【其他選項】(B) lost 不接「人＋金錢」雙受詞；(C) made me money 是「讓我賺錢」，與賣房子語意相反；(D) spent 主詞須為人（人 spend 錢 on…）。\n【例句】The trip to Japan cost my family NT$100,000.", "explanationSource": "source"}, {"id": 34, "question": "Fixing the broken phone ______ Ryan NT$2,000 last week.", "options": ["spent", "cost", "paid", "took"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 33 題）", "explanation": "事物 + cost + 人 + 金錢；主詞是 Fixing the broken phone。", "explanationSource": "supplemental"}, {"id": 35, "question": "How much does a bowl of beef noodles ______ at this shop?", "options": ["cost", "spend", "pay", "take"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 33 題）", "explanation": "物品當主詞問價錢用 cost。", "explanationSource": "supplemental"}, {"id": 36, "question": "Helen ______ NT$800 on a birthday gift for her mom.", "options": ["cost", "took", "spent", "lent"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 33 題）", "explanation": "人 + spend + 金錢 + on + 物。", "explanationSource": "supplemental"}, {"id": 37, "question": "My dog hates to take a bath. It usually ______ me one hour to make him clean.", "options": ["needs", "spends", "takes", "uses"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜It takes + 人 + 時間 + to V", "explanation": "【句型】It takes + 人 + 時間 + to V。\n【分析】虛主詞 It 後接 me one hour to make him clean，只有 takes 符合：「通常花我一小時才能把牠洗乾淨」。\n【其他選項】(A) needs 不接「人＋時間＋to V」；(B) spends 主詞須為人，接 Ving；(D) uses 不能表示花費時間的此句型。\n【例句】It takes my brother twenty minutes to get dressed.", "explanationSource": "source"}, {"id": 38, "question": "It ______ Mandy half an hour to blow-dry her long hair.", "options": ["spends", "takes", "costs", "pays"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 37 題）", "explanation": "It takes + 人 + 時間 + to V。", "explanationSource": "supplemental"}, {"id": 39, "question": "Mandy ______ half an hour drying her long hair every night.", "options": ["spends", "takes", "costs", "pays"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 37 題）", "explanation": "人 + spend + 時間 + Ving。", "explanationSource": "supplemental"}, {"id": 40, "question": "It will take you about five minutes ______ there on foot.", "options": ["get", "getting", "got", "to get"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 37 題）", "explanation": "It takes + 人 + 時間 + to V，選 to get。", "explanationSource": "supplemental"}]};</script><script src="longteng-b1u5-quiz.js?v=20261027-2"></script><script>document.querySelector("#description").textContent="共 40 題（會考歷屆 10 題＋類似題 30 題）｜選答後顯示中文解析｜答錯可重做並下載錯題";</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
