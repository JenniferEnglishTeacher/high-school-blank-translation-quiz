<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="龍騰普高 Book 1 Unit 6 互動測驗，附解析、整句朗讀與必做 STT 朗讀評分。"><title>龍騰普高 Book 1 Unit 6｜引導式翻譯</title><link rel="stylesheet" href="longteng-b1u5-quiz.css?v=20261026-2"><link rel="stylesheet" href="longteng-vocab-required-pronunciation.css?v=20261026-4"></head><body><main class="wrap"><header class="hero"><a class="btn" href="dashboard.html">← 回到 Dashboard</a><h1 id="title">龍騰普高 Book 1 Unit 6｜引導式翻譯</h1><p id="description" class="note"></p></header><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn" type="button">全選</button><button id="none" class="btn" type="button">取消全選</button><button id="random" class="btn" type="button">隨機 20 題</button><span id="picked" class="note"></span></div><div id="list"></div><label class="pick"><input id="shuffle" type="checkbox"> 隨機排列題目</label><button id="start" class="btn primary" type="button">開始測驗 →</button></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><div class="actions"><button id="check" class="btn primary" type="button">檢查答案</button><button id="next" class="btn primary hidden" type="button">下一題 →</button><button id="finish" class="btn danger" type="button">結束練習</button></div></section><section id="result" class="card hidden"><h2>練習結果</h2><div id="summary" class="summary"></div><h2>錯題紀錄</h2><div id="wrongList"></div><div class="actions"><button id="retry" class="btn primary" type="button">重做錯題</button><button id="download" class="btn" type="button">下載 DOCX 錯題</button><button id="restart" class="btn" type="button">重新選題</button></div></section></main><script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 6｜引導式翻譯","mode":"multi","questions":[{"id":1,"zh":"一直以來，這家麵店外面都有著長長的人龍，因為他們做的麵是鎮上最棒的。","question":"The noodle shop has a long line of people outside ①____________ ②____________ because they make the best noodles in town.","answers":["as","always"],"source":"課本例句填空","explanation":"中文意思如題幹；本題依序填入 as always。來源未附逐題解析。"},{"id":2,"zh":"儘管以前只聽過這首歌幾次，Kyle知道所有的歌詞。","question":"Kyle knows all the words to this song ①____________ ②____________ he has only heard it a few times before.","answers":["even","though"],"source":"課本例句填空","explanation":"中文意思如題幹；本題依序填入 even though。來源未附逐題解析。"},{"id":3,"zh":"Tracy決定在倫敦出差時順道去參觀大笨鐘。","question":"Tracy decided to ①____________ ②____________ ③____________ ④____________ Big Ben while she was on a business trip in London.","answers":["pay","a","visit","to"],"source":"課本例句填空","explanation":"中文意思如題幹；本題依序填入 pay a visit to。來源未附逐題解析。"},{"id":4,"zh":"在表演期間，近兩千人與樂隊一起大合唱，共同創造了難忘的回憶。","question":"During the performance, ①____________ ②____________ two thousand people sang along with the band and created an unforgettable memory together.","answers":["close","to"],"source":"課本例句填空","explanation":"中文意思如題幹；本題依序填入 close to。來源未附逐題解析。"},{"id":5,"zh":"上個週末，Sarah拜訪她祖母的家，去幫忙在花園裡種花。","question":"Last weekend, Sarah ①____________ a ②____________ to her grandmother’s house to help plant flowers in the garden.","answers":["paid","visit"],"source":"All in One","explanation":"中文意思如題幹；本題依序填入 paid visit。來源未附逐題解析。"},{"id":6,"zh":"Gina計劃跟朋友造訪城裡那間新的博物館看恐龍展。","question":"Gina plans to ①____________ a ②____________ ③____________ the new museum in town with her friends to see the dinosaur exhibit.","answers":["pay","visit","to"],"source":"習作簿","explanation":"中文意思如題幹；本題依序填入 pay visit to。來源未附逐題解析。"},{"id":7,"zh":"如果你去巴黎，一定要撥出一些時間參觀羅浮宮，它收藏了一些有史以來最偉大的藝術作品。","question":"If you go to Paris, you must spare some time to ①____________ ②____________ ③____________ ④____________ the Louvre, which houses some of the greatest art masterpieces of all time.","answers":["pay","a","visit","to"],"source":"三合一學習手冊","explanation":"中文意思如題幹；本題依序填入 pay a visit to。來源未附逐題解析。"},{"id":8,"zh":"Janice一開始認為數學課很難，但隨著時間過去，它變得較簡單。","question":"Janice found the math class really tough at first, but it became easier ①____________ ②____________.","answers":["over","time"],"source":"課本例句填空","explanation":"中文意思如題幹；本題依序填入 over time。來源未附逐題解析。"},{"id":9,"zh":"John畫了一顆破碎的心在給Jenny的信上，代表他因關係結束而生的悲傷。","question":"John drew a ①____________ heart in his letter to Jenny to ②____________ his sadness at ③____________ ④____________ ⑤____________ their relationship.","answers":["broken","represent","the","end","of"],"source":"龍騰自命題","explanation":"broken 破碎的（break的過去分詞當形容詞用）；the end of the ……的終結。"},{"id":10,"zh":"每年12月31日，紐約市時代廣場都會吸引平均10萬人去迎接新年。","question":"Times Square in New York City attracts ①____________ ②____________ ③____________ hundred thousand people to welcome the New Year every December 31.","answers":["an","average","of"],"source":"龍騰自命題","explanation":"an average of 平均數為……"},{"id":11,"zh":"假如把銅暴露在空氣中很長一段時間，它就會氧化並變成綠色。","question":"If copper ①____________ ②____________ ③____________ the air for a long time, it will oxidize and become green.","answers":["is","exposed","to"],"source":"龍騰自命題","explanation":"be exposed to 暴露。"},{"id":12,"zh":"隨著時間過去，這張照片的顏色變了而轉黃。","question":"①____________ ②____________, the color of the picture has changed and ③t____________ yellow.","answers":["Over","time","turned"],"source":"龍騰自命題","explanation":"turn為連綴動詞，後面接形容詞，表「轉變為……」；因前為完成式，故需填入過去分詞turned。"},{"id":13,"zh":"一如往常，上週最新的智慧型手機開賣後，許多人在電信公司外面等著買。","question":"①____________ ②____________, many people are waiting outside the telecom company to buy the latest smartphone model after it was launched last week.","answers":["As","always"],"source":"龍騰自命題","explanation":"launch 開賣；上市；發行"},{"id":14,"zh":"正是Tom的鑰匙不見了。","question":"It ①____________ Tom’s keys ②____________ were gone.","answers":["was","that"],"source":"龍騰自命題","explanation":"本句為強調句用法，強調的部分為Tom’s keys，that後的be動詞為複數形過去式，因此，it後的be動詞也需為過去式。"},{"id":15,"zh":"這座雕像並沒有隨著歲月而變色，而是繼續自信驕傲的聳立著。","question":"The statue did not change color ①w____________ ②____________ and continued to ③____________ tall and proud.","answers":["with","age","stand"],"source":"龍騰自命題","explanation":"with age 隨著時間流逝；stand為連綴動詞，後加形容詞。"},{"id":16,"zh":"隨著時間過去，由於暴露在空氣中很長一段時間，這座紀念碑已經開始看起來老化並變色了。","question":"①____________ ②____________, the monument began to look old and change its color because it has ③____________ ④____________ ⑤____________ the air for a long time.","answers":["Over","time","been","exposed","to"],"source":"龍騰自命題","explanation":"be exposed to 暴露於；此處使用現在完成式，故be動詞需改為been。"},{"id":17,"zh":"一如既往，今年美國政府還是舉辦一個盛大活動來慶祝1776年從英國獨立出來。","question":"①____________ ②____________, this year the American government held an activity ③____________ ④____________ of its independence ⑤____________ the United Kingdom in 1776.","answers":["As","always","in","celebration","from"],"source":"龍騰自命題","explanation":"hold 舉辦；in celebration of 慶祝；independence from 從……獨立出來"},{"id":18,"zh":"儘管那天下雨，還是有接近五千人參加了活動，來紀念這個重要事件。","question":"Although it rained that day, ①____________ ②____________ five thousand people showed up for the activity to commemorate the important event.","answers":["close","to"],"source":"龍騰自命題","explanation":"本句的commemorate意指「紀念」。"},{"id":19,"zh":"儘管Howard試圖喝些牛奶，他仍然無法將口中的蒜味消除。","question":"①____________ ②____________ Howard tried to drink some milk, he still couldn’t get rid of the garlic smell on his breath.","answers":["Even","though"],"source":"龍騰自命題","explanation":"get rid of 去除……"},{"id":20,"zh":"墾丁具有海灘、水上活動等主要的吸引人之處，不單適合兒童，也是適合大人的好地方。","question":"①____________ such main ②____________ as beaches and water sports, Kenting is a great place not just for kids, ③____________ ④____________ adults.","answers":["With","attractions","but","for"],"source":"龍騰自命題","explanation":"with 帶有；not just...but...不只……還有……"},{"id":21,"zh":"就是大衛．考柏菲這位世界聞名的魔術師在1986年穿越中國的萬里長城。","question":"It ①____________ David Copperfield, the world-famous magician, ②____________ walked through the Great Wall of China in 1986.","answers":["was","that"],"source":"龍騰自命題","explanation":"本句為強調句用法，強調的部分為「David Copperfield, the world famous magician,」，其後放that，that後的動詞為過去簡單式，故it後的be動詞用was。"},{"id":22,"zh":"Tracy正試圖用一個古老的方法將白洋裝上的汙漬除掉。","question":"Tracy is trying to ①____________ the stain ②____________ her white dress using an ③____________ method.","answers":["remove","from","ancient"],"source":"龍騰自命題","explanation":"remove...from... 將……從……移除；use + 方法 用……方法"},{"id":23,"zh":"一如往常，防彈少年團的演唱會門票數分鐘內就賣完了。","question":"①____________ ②____________, tickets to the BTS concert were sold out in minutes.","answers":["As","always"],"source":"龍騰自命題","explanation":"be sold out 被賣完"},{"id":24,"zh":"Henry花了三個禮拜在歷史課的報告上，並獲得將近100的高分。","question":"Henry spent three weeks on his report in history class and got a high score ①____________ ②____________ 100%.","answers":["close","to"],"source":"龍騰自命題","explanation":"spend + 時間 + on... 花時間在……上"},{"id":25,"zh":"儘管Sammy不喜歡她的工作，她也不想辭職。","question":"①____________ ②____________ Sammy doesn’t like her job, she doesn’t want to quit either.","answers":["Even","though"],"source":"龍騰自命題","explanation":"not...either 也沒有……"},{"id":26,"zh":"隨著時間過去，壁紙上的圖案褪色了。","question":"①____________ ②____________, the patterns on the wallpaper faded.","answers":["Over","time"],"source":"龍騰自命題","explanation":"fade 褪色"},{"id":27,"zh":"這個男子一如往常地要求了靠窗的桌子。","question":"The man, ①____________ ②____________, asked for a table by the window.","answers":["as","always"],"source":"習作簿","explanation":"中文意思如題幹；本題依序填入 as always。來源未附逐題解析。"},{"id":28,"zh":"根據這份研究，驚人的是有一半的淡水龜將近滅絕。","question":"According to the study, an alarming 50% of freshwater turtles are ①____________ ②____________ extinction.","answers":["close","to"],"source":"習作簿","explanation":"中文意思如題幹；本題依序填入 close to。來源未附逐題解析。"},{"id":29,"zh":"即使你不喜歡這份工作，你還是要把它做好。","question":"①____________ ②____________ you don’t like the job, you still have to do it well.","answers":["Even","though"],"source":"習作簿","explanation":"中文意思如題幹；本題依序填入 Even though。來源未附逐題解析。"},{"id":30,"zh":"知道世上六種大型類人猿中有四種快要絕種，真令人難過。","question":"It is sad to learn that four out of the world’s six species of great apes are ①____________ ②____________ extinction.","answers":["close","to"],"source":"All in One","explanation":"中文意思如題幹；本題依序填入 close to。來源未附逐題解析。"},{"id":31,"zh":"儘管Max試著清除掉襯衫上的汙漬，還是可以看到痕跡。","question":"①____________ ②____________ Max had tried to get rid of the stain on his shirt, a mark was still visible.","answers":["Even","though"],"source":"All in One","explanation":"中文意思如題幹；本題依序填入 Even though。來源未附逐題解析。"},{"id":32,"zh":"開發商資金用盡之後，這棟建築物站在街角，尚未完工。","question":"After the developer ran out of money, the building ①____________ ②____________ on the corner of the street.","answers":["stood","unfinished"],"source":"三合一學習手冊","explanation":"中文意思如題幹；本題依序填入 stood unfinished。來源未附逐題解析。"},{"id":33,"zh":"我們不應該暴露在太多的陽光下，因為這樣對我們的皮膚不好。","question":"We should not ①____________ ②____________ ③____________ too much sunlight as it is bad for our skin.","answers":["be","exposed","to"],"source":"三合一學習手冊","explanation":"中文意思如題幹；本題依序填入 be exposed to。來源未附逐題解析。"},{"id":34,"zh":"即使Sam什麼都沒說，但Vivian確定他很沮喪。","question":"①____________ ②____________ Sam didn’t say anything, Vivian was sure that he was upset.","answers":["Even","though"],"source":"三合一學習手冊","explanation":"中文意思如題幹；本題依序填入 Even though。來源未附逐題解析。"},{"id":35,"zh":"隨著時間流逝，我漸漸明白我們就是合不來。","question":"①____________ ②____________, I came to understand that we just couldn’t get along.","answers":["Over","time"],"source":"三合一學習手冊","explanation":"中文意思如題幹；本題依序填入 Over time。來源未附逐題解析。"},{"id":36,"zh":"雖然Truman看起來很年輕，讓我驚訝的是，他已經將近六十歲了。","question":"Although Truman looks young, to my surprise, he is ①____________ ②____________ sixty.","answers":["close","to"],"source":"三合一學習手冊","explanation":"中文意思如題幹；本題依序填入 close to。來源未附逐題解析。"},{"id":37,"zh":"一向如此，週五的五月天演唱會門票又秒殺了。它的確是臺灣最受歡迎的樂團。","question":"The tickets to Friday’s Mayday concert sold out in seconds ①____________ ②____________. It is literally the most popular band in Taiwan.","answers":["as","always"],"source":"三合一學習手冊","explanation":"中文意思如題幹；本題依序填入 as always。來源未附逐題解析。"},{"id":38,"zh":"因為自由女神高達將近50公尺，所以這位魔術師很難讓她消失掉。","question":"Because the Statue of Liberty stands close to 50 ①____________ ②____________, it is difficult for the magician to make her disappear.","answers":["meters","tall"],"source":"龍騰自命題","explanation":"stand + n. + tall 高達……"},{"id":39,"zh":"Mia每天晚上花如此多的時間讀書，以致於她平均一天只睡五小時。","question":"Mia spends ①____________ much time studying every night ②____________ she sleeps only five hours a day on average.","answers":["so","that"],"source":"龍騰自命題","explanation":"so + adj. ... that + S + V... 如此……以致於……"},{"id":40,"zh":"Philip車開得太快，以致於沒有人能跟上他。","question":"Philip ①____________ ②____________ ③____________ ④____________ nobody could catch up with him.","answers":["drove","so","fast","that"],"source":"三合一學習手冊","explanation":"中文意思如題幹；本題依序填入 drove so fast that。來源未附逐題解析。"}]};</script><script src="longteng-b1u5-quiz.js?v=20261026-2"></script><script src="longteng-vocab-required-pronunciation.js?v=20261026-4"></script></body></html>
