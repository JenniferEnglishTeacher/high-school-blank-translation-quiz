<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="龍騰普高 B3U4 文法選擇（其他考點）互動練習"><title>龍騰普高 B3U4 文法選擇（其他考點）</title><style>:root{--blue:#2563eb;--navy:#1e3a8a;--bg:#f4f7fb;--card:#fff;--line:#dbe3ee;--ink:#172033;--muted:#64748b;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--voice:#6d28d9;--voicebg:#f5f3ff;--amber:#9a3412;--amberbg:#fff7ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}.wrap{max-width:920px;margin:auto;padding:16px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 5px 18px #0f172a0d}.hero{background:linear-gradient(135deg,#e8f1ff,#fff)}h1{margin:0 0 6px;font-size:clamp(25px,4vw,38px)}h2{margin-top:0}.note{color:var(--muted)}.hidden{display:none!important}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.btn{border:0;border-radius:10px;padding:11px 17px;font:800 16px inherit;cursor:pointer;background:#e5e7eb;color:var(--ink);text-decoration:none}.primary{background:var(--blue);color:#fff}.danger{background:#991b1b;color:#fff}.voice{background:var(--voice);color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.btn:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.pick{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin:7px 0;background:#fafcff}.pick input{margin-right:8px;width:17px;height:17px;accent-color:var(--blue)}#list{max-height:440px;overflow:auto;border:1px solid var(--line);padding:7px;border-radius:12px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:800;margin:8px 0 14px}.zh{padding:10px 13px;background:var(--amberbg);border-radius:9px;color:var(--amber);font-weight:800;margin-bottom:10px}.question{font-size:21px;font-weight:750;padding:16px;background:#f8fafc;border-radius:11px;white-space:pre-wrap}.options{display:grid;gap:9px;margin:14px 0}.option{display:flex;align-items:center;gap:11px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-size:18px;font-weight:750;cursor:pointer}.option:hover{border-color:#60a5fa;background:#eff6ff}.option:has(input:checked){border-color:var(--blue);background:#dbeafe;color:var(--navy)}.option input{width:20px;height:20px;accent-color:var(--blue)}.inputs{display:grid;gap:10px;margin:15px 0}.answer-row{display:grid;grid-template-columns:55px 1fr;gap:10px;align-items:center}.answer-row label{font-weight:900;color:var(--navy);text-align:center}.spell{width:100%;font:inherit;font-size:18px;padding:11px;border:2px solid #94a3b8;border-radius:9px}.feedback{padding:13px;border-radius:10px;font-weight:800;margin:13px 0}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.explain{font-weight:500;margin-top:7px}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:var(--voicebg);margin:13px 0}.voicebox b{display:block;font-size:19px;margin-bottom:8px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}.wrong p{margin:6px 0}.source{font-size:13px;color:var(--muted)}@media(max-width:600px){.wrap{padding:9px}.hero,.card{padding:15px}.question{font-size:18px;padding:13px}.option{font-size:17px}.answer-row{grid-template-columns:42px 1fr}.meta{display:block}}</style></head><body><main class="wrap"><section class="hero"><h1>龍騰普高 B3U4 文法選擇（其他考點）</h1><p>共 26 題。可自行選題、隨機抽題；答錯會顯示正確答案並要求重新作答。</p><p class="note">答對後會朗讀完整英文句子；完成後可重做錯題並下載 DOCX 錯題紀錄。</p><div class="toolbar"><a class="btn" href="dashboard.html">← 回測驗總覽</a></div></section><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn">全部選取</button><button id="none" class="btn">全部取消</button><button id="rand20" class="btn">隨機 20 題</button></div><label><input id="shuffle" type="checkbox"> 打亂出題順序</label><div id="list"></div><div class="actions"><button id="start" class="btn primary">開始作答</button><span id="picked" class="note"></span></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="voiceBox" class="voicebox hidden"><b id="voiceTarget"></b><button id="speak" class="btn voice">🔊 再聽一次</button></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="retry" class="btn primary">只重做錯題</button><button id="download" class="btn">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></main><script>const TITLE="龍騰普高 B3U4 文法選擇（其他考點）",MODE="mcq",Q=[{"id":1,"question":"To impress the other guests, Amy was advised to drink her wine with small, ____________ sips over dinner.","options":["like-lady","lady-like","lady-alike","alike-lady"],"answer":1,"explanation":"本題測驗N-like複合形容詞的用法；lady-like 像淑女般的","source":"龍騰自命題"},{"id":2,"question":"____________, Elon Musk, CEO of Tesla and SpaceX, was chosen as Person of the Year for 2021 by Time magazine.","options":["Be innovative and ambitious","Innovative and ambitious","To be innovative and ambitious","He is innovative and ambitious"],"answer":1,"explanation":"本題測驗Adj...., S + V....的用法。句首省略Being 所以留下形容詞innovative and ambitious","source":"龍騰自命題"},{"id":3,"question":"5G is ____________ a technological revolution that can support the development of many innovative applications, like VR and self-driving cars.","options":["isolated from","satisfied with","recognized as","transformed to"],"answer":2,"explanation":"recognize A as B = A be recognized as B 視A為B；as表「成為」","source":"龍騰自命題"},{"id":4,"question":"The patient with terminal cancer decided not to receive hospital treatment. ____________, he would take Chinese herbal medicine.","options":["At first","What’s more","Instead","As a result"],"answer":2,"explanation":"本題測驗instead放在句首當轉承詞，表「相反地」","source":"龍騰自命題"},{"id":5,"question":"Jason often plays online games ____________ midnight. That’s why he has trouble getting up early most mornings.","options":["for","till","during","within"],"answer":1,"explanation":"本題測驗till「直到」的用法","source":"龍騰自命題"},{"id":6,"question":"After graduation, I often thought of those happy days ____________ we studied and played together in high school.","options":["what","where","that","when"],"answer":3,"explanation":"本題測驗when關係副詞的限定用法。先行詞為表時間的those happy days，故應選擇when","source":"龍騰自命題"},{"id":7,"question":"I couldn’t log in this morning, so I needed to have someone ____________ my computer as soon as possible.","options":["fix","to fix","fixing","fixed"],"answer":0,"explanation":"本題測驗have + O + VR 使役動詞的用法，題幹情境為讓某人來檢修電腦，應選用原形動詞fix","source":"龍騰自命題"},{"id":8,"question":"Linda tried to express her love to her boyfriend ____________ making homemade cookies on his birthday.","options":["by","for","from","to"],"answer":0,"explanation":"by + V-ing表「藉由」","source":"龍騰自命題"},{"id":9,"question":"____________ is true that regular exercise can greatly benefit our health.","options":["One","That","It","What"],"answer":2,"explanation":"本題測驗it當虛主詞的用法","source":"龍騰自命題"},{"id":10,"question":"Since she entered university, Kelly ____________ two part-time jobs to support herself.","options":["works","has worked","had worked","worked"],"answer":1,"explanation":"本題測驗現在完成式表到目前為止曾有過的經驗，所以選has worked","source":"龍騰自命題"},{"id":11,"question":"One of my classmates is from Brazil ____________ soccer is a national pastime.","options":["where",", where","which",", when"],"answer":1,"explanation":"","source":"三合一學習手冊"},{"id":12,"question":"Sharon ____________ very interested in English till ____________ Miss Butler.","options":["was; she meets","wasn’t; she met","was; meeting","wasn’t; met"],"answer":1,"explanation":"","source":"三合一學習手冊"},{"id":13,"question":"____________ devote yourself to the protection of animal rights?","options":["How about","What about","Why can’t","Why not"],"answer":3,"explanation":"","source":"三合一學習手冊"},{"id":14,"question":"Last weekend Lily went to her best friend’s birthday party, ____________ she saw lots of old friends.","options":["that","which","where","when"],"answer":2,"explanation":"","source":"三合一學習手冊"},{"id":15,"question":"Why not ____________ a cup of herbal tea?","options":["having","have","to have","you have"],"answer":1,"explanation":"","source":"三合一學習手冊"},{"id":16,"question":"The audience sat there quietly till the pianist ____________ her performance.","options":["finish","didn’t finish","finishing","finished"],"answer":3,"explanation":"","source":"三合一學習手冊"},{"id":17,"question":"After his retirement, Andrew plans to move to Hawaii ____________ he can enjoy sunshine and ocean activities all year long.","options":[", which",", where","which","where"],"answer":1,"explanation":"Hawaii夏威夷為明確地點，故用非限定形容詞子句，並用關係副詞where引導形容詞子句","source":"龍騰自命題"},{"id":18,"question":"Whenever Gary faces a problem, he tries to find a solution quickly instead of ____________ it.","options":["avoids","to avoid","avoid","avoiding"],"answer":3,"explanation":"instead of為介系詞片語，後面接V-ing","source":"龍騰自命題"},{"id":19,"question":"Taylor Swift dressed up ____________ a striking evening gown for her entrance on the red carpet.","options":["in","to","on","of"],"answer":0,"explanation":"「dress up in + 衣服／顏色」表「盛裝穿著……；打扮為……」","source":"龍騰自命題"},{"id":20,"question":"The band was playing music so loud that Jim couldn’t hear ____________ to him.","options":["what Lisa was saying","what was Lisa saying","what saying was Lisa","what Lisa saying was"],"answer":0,"explanation":"此處間接問句作為動詞hear的受詞","source":"龍騰自命題"},{"id":21,"question":"It’s hot and sunny today. Why not ____________ a walk in the woods?","options":["to take","taking","take","took"],"answer":2,"explanation":"why not後面接原形動詞，表「建議」","source":"龍騰自命題"},{"id":22,"question":"The magician performed many tricks that kept the audience fascinated ____________ the performance.","options":["until","throughout","then","while"],"answer":1,"explanation":"throughout為介系詞，表「整個……中」，後面接N","source":"龍騰自命題"},{"id":23,"question":"While ____________ for the rain to stop, James met his aunt at the train station.","options":["waited","waits","waiting","to wait"],"answer":2,"explanation":"由於while子句與主要子句的主詞相同，可省略主詞，改用分詞構句，而wait為主動，故用waiting","source":"龍騰自命題"},{"id":24,"question":"A: This painting is a masterpiece. It is well worth the asking price. B: I don’t think ____________; the artist’s previous works are better.","options":["either","this","about","so"],"answer":3,"explanation":"so用來代替前方提過的事","source":"龍騰自命題"},{"id":25,"question":"Though the prizes of the game are appealing, it is the game ____________ that attracts so many contestants. It’s an extremely fun game.","options":["at all","of all","itself","whole"],"answer":2,"explanation":"the game itself強調是「遊戲本身」的吸引力","source":"龍騰自命題"},{"id":26,"question":"The artist displayed a series of paintings ____________ the struggles and triumphs of the human spirit during times of war and peace.","options":["showing","showed","to show","show"],"answer":0,"explanation":"本題測驗分詞片語。畫作展示了內容，故要選現在分詞showing，用來修飾前面的paintings。","source":"龍騰自命題"}];const $=s=>document.querySelector(s),list=$('#list'),select=$('#select'),quiz=$('#quiz'),result=$('#result'),question=$('#question'),answerArea=$('#answerArea'),feedback=$('#feedback'),next=$('#next');let chosen=[],idx=0,mode='first';const wrong=new Map(),correct=new Set();const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ');const shuffled=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function renderList(){list.innerHTML=Q.map(q=>'<label class="pick"><input class="pickbox" type="checkbox" value="'+q.id+'" checked><b>第 '+q.id+' 題</b> <span class="source">'+esc(q.source||'')+'</span></label>').join('');count()}function count(){$('#picked').textContent='已選 '+document.querySelectorAll('.pickbox:checked').length+' 題'}list.addEventListener('change',count);$('#all').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=true);count()};$('#none').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=false);count()};$('#rand20').onclick=()=>{let ids=new Set(shuffled(Q).slice(0,Math.min(20,Q.length)).map(q=>q.id));document.querySelectorAll('.pickbox').forEach(x=>x.checked=ids.has(+x.value));count()};$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));if($('#shuffle').checked)chosen=shuffled(chosen);idx=0;mode='first';wrong.clear();correct.clear();select.classList.add('hidden');result.classList.add('hidden');quiz.classList.remove('hidden');show()};function show(){const q=chosen[idx];speechSynthesis?.cancel();$('#meta').textContent=(mode==='retry'?'錯題重做｜':'')+'第 '+(idx+1)+' / '+chosen.length+' 題';$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';$('#bar').style.width=(idx+1)/chosen.length*100+'%';question.textContent=q.question;const zh=$('#zh');if(q.zh){zh.textContent=q.zh;zh.classList.remove('hidden')}else zh.classList.add('hidden');feedback.className='feedback hidden';$('#voiceBox').classList.add('hidden');$('#check').classList.remove('hidden');next.classList.add('hidden');if(MODE==='mcq')answerArea.innerHTML='<div class="options">'+q.options.map((o,i)=>'<label class="option"><input type="radio" name="answer" value="'+i+'"><b>'+String.fromCharCode(65+i)+'.</b> '+esc(o)+'</label>').join('')+'</div>';else answerArea.innerHTML='<div class="inputs">'+q.answers.map((_,i)=>'<div class="answer-row"><label>'+(MODE==='multi'?['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'][i]:'答案')+'</label><input class="spell" autocomplete="off" spellcheck="false" placeholder="請輸入完整答案"></div>').join('')+'</div>';setTimeout(()=>answerArea.querySelector('input')?.focus(),0)}function currentAnswers(){if(MODE==='mcq'){const x=answerArea.querySelector('input:checked');return x?[+x.value]:[]}return [...answerArea.querySelectorAll('.spell')].map(x=>x.value)}function correctText(q){return MODE==='mcq'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.answers.map(a=>a.split('||')[0]).join(' / ')}function isCorrect(q,a){return MODE==='mcq'?a[0]===q.answer:a.every((x,i)=>q.answers[i].split(/\|\||\//).some(v=>norm(x)===norm(v)))}function completedSentence(q){if(MODE==='mcq')return q.question.replace(/_{3,}/,q.options[q.answer]);if(MODE==='spell')return q.question.replace(/[A-Za-z]?_{3,}[A-Za-z]?/,q.answers[0].split('||')[0]);let s=q.question,marks=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];q.answers.forEach((a,i)=>{let value=a.split('||')[0];let re=new RegExp(marks[i]+'[A-Za-z]?_{3,}[A-Za-z]?');if(re.test(s))s=s.replace(re,value);else s=s.replace(/_{3,}/,value)});return s.replace(/[①-⑩]/g,'')}function speak(){if(!speechSynthesis)return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance($('#voiceTarget').textContent);u.lang='en-US';u.rate=.86;speechSynthesis.speak(u)}$('#speak').onclick=speak;$('#check').onclick=()=>{const q=chosen[idx],a=currentAnswers();if((MODE==='mcq'&&!a.length)||(MODE!=='mcq'&&(a.length!==q.answers.length||a.some(x=>!x.trim()))))return alert('請完成所有答案。');if(isCorrect(q,a)){correct.add(q.id);feedback.className='feedback ok';feedback.innerHTML='✅ 全部正確！'+(q.explanation?'<div class="explain">解析：'+esc(q.explanation)+'</div>':'');$('#check').classList.add('hidden');next.classList.remove('hidden');$('#voiceTarget').textContent=completedSentence(q);$('#voiceBox').classList.remove('hidden');speak()}else{if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(MODE==='mcq'?String.fromCharCode(65+a[0]):a.join(' / '));$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';feedback.className='feedback bad';feedback.innerHTML='❌ 答案不正確。正確答案：<strong>'+esc(correctText(q))+'</strong><br>請重新作答。'+(q.explanation?'<div class="explain">解析：'+esc(q.explanation)+'</div>':'');if(MODE==='mcq')answerArea.querySelectorAll('input').forEach(x=>x.checked=false);else answerArea.querySelectorAll('.spell').forEach(x=>x.value='');answerArea.querySelector('input')?.focus()}};next.onclick=()=>{idx++;idx>=chosen.length?finish():show()};$('#finish').onclick=finish;function finish(){speechSynthesis?.cancel();quiz.classList.add('hidden');result.classList.remove('hidden');$('#summary').innerHTML='<div class="stat">本輪題數<b>'+chosen.length+'</b></div><div class="stat">完成答對<b>'+correct.size+'</b></div><div class="stat">曾答錯<b>'+wrong.size+'</b></div>';$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>'<div class="wrong"><b>'+(i+1)+'. 第 '+r.q.id+' 題</b><p>'+esc((r.q.zh?r.q.zh+'\n':'')+r.q.question)+'</p><p><strong>錯誤答案：</strong>'+r.attempts.map(esc).join('；')+'</p><p><strong>正確答案：</strong>'+esc(correctText(r.q))+'</p>'+(r.q.explanation?'<p><strong>解析：</strong>'+esc(r.q.explanation)+'</p>':'')+'</div>').join(''):'<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size);$('#retry').classList.toggle('hidden',!wrong.size)}$('#retry').onclick=()=>{chosen=[...wrong.values()].map(x=>x.q);idx=0;mode='retry';correct.clear();result.classList.add('hidden');quiz.classList.remove('hidden');show()};$('#restart').onclick=()=>location.reload();$('#download').onclick=async()=>{if(!wrong.size)return;try{if(!window.docx)await new Promise((ok,fail)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js';s.onload=ok;s.onerror=fail;document.head.append(s)});let{Document,Packer,Paragraph,TextRun,HeadingLevel}=window.docx,children=[new Paragraph({text:TITLE+' 錯題紀錄',heading:HeadingLevel.TITLE})];for(const [_,r] of wrong){children.push(new Paragraph({children:[new TextRun({text:'第 '+r.q.id+' 題',bold:true})]}));if(r.q.zh)children.push(new Paragraph(r.q.zh));children.push(new Paragraph(r.q.question),new Paragraph('錯誤答案：'+r.attempts.join('；')),new Paragraph('正確答案：'+correctText(r.q)));if(r.q.explanation)children.push(new Paragraph('解析：'+r.q.explanation));children.push(new Paragraph('重新作答：________________________________________'))}let blob=await Packer.toBlob(new Document({sections:[{children}]})),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=TITLE+'_錯題.docx';a.click();URL.revokeObjectURL(url)}catch(e){let text=[...wrong.values()].map(r=>'第 '+r.q.id+' 題\n'+(r.q.zh?r.q.zh+'\n':'')+r.q.question+'\n錯誤答案：'+r.attempts.join('；')+'\n正確答案：'+correctText(r.q)+(r.q.explanation?'\n解析：'+r.q.explanation:'')).join('\n\n');let blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=TITLE+'_錯題.txt';a.click();URL.revokeObjectURL(url)}};renderList();</script></body></html>
