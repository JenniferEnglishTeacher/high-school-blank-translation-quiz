<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#1f2937;--muted:#64748b;--line:#dbe2ea;--blue:#2563eb;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--voice:#7c3aed;--voicebg:#f5f3ff}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}.wrap{max-width:980px;margin:auto;padding:18px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 5px 18px #0f172a0d}.hero{background:linear-gradient(135deg,#eaf2ff,#fff)}h1{margin:0 0 8px;font-size:clamp(24px,4vw,36px)}.note,.meta{color:var(--muted)}.home{color:var(--blue);font-weight:800;text-decoration:none}.hidden{display:none!important}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}.btn{border:0;border-radius:10px;padding:11px 16px;font:700 16px inherit;cursor:pointer;background:#e5e7eb;color:var(--ink)}.primary{background:var(--blue);color:white}.danger{background:#991b1b;color:white}.voice{background:var(--voice);color:white}.pick{display:flex;gap:10px;padding:10px;border:1px solid var(--line);border-radius:9px;margin:7px 0;background:#fafafa}.pick input{margin-top:5px;accent-color:var(--blue)}.pick span{min-width:0}.pick small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#list{max-height:440px;overflow:auto}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;font-weight:700;margin:8px 0 15px}.stem{font-size:21px;font-weight:700;white-space:pre-line;margin:15px 0}.options{display:grid;gap:10px}.option{display:flex;gap:10px;padding:12px;border:2px solid var(--line);border-radius:10px;cursor:pointer}.option:has(input:checked){border-color:var(--blue);background:#eff6ff}.answer-grid{display:grid;gap:10px;margin-top:12px}.answer-row{display:flex;align-items:center;gap:10px}.answer-row label{font-weight:800;min-width:58px}.answer-input{font:inherit;font-size:18px;padding:9px 10px;border:2px solid #94a3b8;border-radius:9px;flex:1;min-width:0}.answer-input.ok{border-color:var(--ok);background:var(--okbg)}.answer-input.bad{border-color:var(--bad);background:var(--badbg)}.picture{display:block;max-width:100%;max-height:330px;object-fit:contain;margin:12px auto;border:1px solid var(--line);border-radius:12px;background:#fff}.feedback,.voicebox{padding:13px;margin-top:14px;border-radius:10px}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.voicebox{background:var(--voicebg);border:2px solid #ddd6fe}.target{font-size:19px;font-weight:800;margin:6px 0 10px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}@media(max-width:640px){.wrap{padding:10px}.hero,.card{padding:15px}.stem{font-size:18px}}

const TITLE="翰林 Book 4 Unit 3 第七大題 填充題",KIND="fill",Q=[{"id":1,"prompt":"We just finished eating a big dinner, but why is our son (h) looking at the chocolate cake?  Isn’t he very full?","answers":[{"display":"hungrily","accepted":["hungrily"]}],"answerRaw":"hungrily","explanation":"我們剛吃完一頓豐盛的晚餐，但是為何我們兒子「飢餓地」看著巧克力蛋糕呢？他不很飽嗎？"},{"id":2,"prompt":"填入適當的形容詞或副詞之三級（原級／比較級／最高級）。\n(１)　Jill: Is Bella a （careful）driver than her husband?\nLisa: Yes, she drives （careful）than he does.\n(２)　Ben: Who jumps （high）than your brothers, Bob and Sam?\nTed: Alex does.  He also jumps （far）of the three.\n(３)　Jay: Who cooks （well）in your family?\nLiz: My dad does.  My mom cooks even （terrible）than me.\nJay: （Lucky）, you have a great dad.\n(４)　Mia: Can the time go much （slow）?\nWhy is there always so much homework to do every day?\nJoe: Of course not.  But you can try to plan your time a lot （well）.\n(５)　Emi: Who goes to bed （late）but gets up （early）in your family?\nRoy: Who else?  My mom does.  She works （hard）in my family.\n(６)　Let’s talk （far）about it in my office （late）.","answers":[{"display":"more careful（或）less careful","accepted":["more careful","less careful"]},{"display":"more carefully（或）less carefully","accepted":["more carefully","less carefully"]},{"display":"higher","accepted":["higher"]},{"display":"(the) farthest","accepted":["the farthest","farthest"]},{"display":"(the) best","accepted":["the best","best"]},{"display":"more terribly","accepted":["more terribly"]},{"display":"Luckily","accepted":["Luckily"]},{"display":"slower（或）more slowly","accepted":["slower","more slowly"]},{"display":"better","accepted":["better"]},{"display":"(the) latest","accepted":["the latest","latest"]},{"display":"(the) earliest","accepted":["the earliest","earliest"]},{"display":"(the) hardest","accepted":["the hardest","hardest"]},{"display":"further","accepted":["further"]},{"display":"later","accepted":["later"]}],"answerRaw":"(１)　more careful（或）less careful；more carefully（或）less carefully；(２)　higher；(the) farthest；(３)(the) best；more terribly；Luckily；(４)　slower（或）more slowly；better；(５)(the) latest；(the) earliest；(the) hardest；(６)　further；later","explanation":"(１)問句中有　than，用形容詞比較級修飾名詞　driver；而答句則用副詞比較級修飾動詞　drives。\n(２)問句中有　than，用副詞比較級修飾動詞，注意只能用　high，而不可用　highly；而答句則用副詞最高級，注意　far　的最高級為　farthest，其前的　the　可予以省略。\n(３)問句中有　in your family，故用　well　的最高級 (the) best，而　Liz　的答句中有　than，故用副詞的比較級修飾動詞。最後，副詞　Luckily　放句首，其後加上逗號，則是修飾其後的整個句子。\n(４)問句中　much　與答句中　a lot　皆用來修飾副詞比較級，而「較慢；更慢」可用　slower　　more slowly　作答。\n(５)「最晚」、「最早」、「最努力地」的副詞最高級都是字尾直接變化即可。\n(６)　far　的副詞比較級，若指「程度上更深遠」，則用　further，句尾用　later　則指「待會兒」。"},{"id":3,"prompt":"Zoe: How about going mountain climbing tomorrow?  Ted: No, I’ll go fruit  on my uncle’s farm.  It’s free, so we can get as much fruit as we can  paying any money for it.","answers":[{"display":"picking","accepted":["picking"]},{"display":"without","accepted":["without"]}],"answerRaw":"picking；without","explanation":"Ted　拒絕　Zoe　去登山礬岩，而是要去叔叔的農場「採摘」水果，用「go＋名詞＋V-ing」的片語作答；既是免費，我們「沒有」付費就可得到水果。"},{"id":4,"prompt":"Mom, I can do it well on my own, so please leave me (a).","answers":[{"display":"alone","accepted":["alone"]}],"answerRaw":"alone","explanation":"leave me alone：別管我。"},{"id":5,"prompt":"填入正確的動詞形式。\n(１)　The old man had his daughter （give）him a ride.\n(２)　Sally is helping her father （wash）the car.\n(３)　His mother often makes him （ride）his bike or （take）the metro to school.\n(４)　Mia lets her son （play）video games for one hour on Saturdays.\n(５)　Hank got his daughter （wash）the dirty glasses two hours ago.\n(６)　The interview made Jenny （feel）very nervous, but luckily, she got the job successfully.","answers":[{"display":"give","accepted":["give"]},{"display":"wash（或）to wash","accepted":["wash","to wash"]},{"display":"ride","accepted":["ride"]},{"display":"take","accepted":["take"]},{"display":"play","accepted":["play"]},{"display":"to wash","accepted":["to wash"]},{"display":"feel","accepted":["feel"]}],"answerRaw":"(１)　give；(２)　wash（或）to wash；(３)　ride；take；(４)　play；(５)　to wash；(６)　feel","explanation":"(１)使役動詞　had＋受詞＋原形　V...。\n(２)動詞　is helping＋受詞＋原形　V... / to V...。\n(３)使役動詞　makes＋受詞＋原形　V1... ＋and＋原形　V2...。\n(４)使役動詞　lets＋受詞＋原形　V...。\n(５)　got　是較特殊的使役動詞，其後的動作是接　to V...。\n(６)使役動詞　made＋受詞＋原形　V...。"},{"id":6,"prompt":"The workers spent over six days  the old building .  Its owner will build a new tall one soon.","answers":[{"display":"taking","accepted":["taking"]},{"display":"down","accepted":["down"]}],"answerRaw":"taking；down","explanation":"「拆除」舊建築物，很快將蓋新的高樓。"},{"id":7,"prompt":"填入正確的副詞之三級（原級／比較級／最高級）或正確的動詞形式。\n(１)　Ann: Why will Ms. Chen have Joe (join) the long jump on sports day?  Joe jumps (far) than any other student in the class.\nDan: That’s true.  Joe jumps (far) of all.  Why don’t we go ask Ms. Chen (let) Joe (give) it up?\n(２)　Dr. Lu, I feel tired (easy) than before.  Can you make me (sleep) better during the night?\n(３)　Jill likes strawberries (little), so she never gets her dad or mom (buy) a cake with strawberries on it.\n(４)　Let me (make) a kite on my own.  I want it to fly (high) of all in the sky.\n(５)　Watching a scary movie (make) Lisa very scared yesterday.  She’ll never watch that kind of movie again.\n(６)　Of the three bosses, Mr. Lu treats his workers (badly).  Who can help them (take) Mr. Lu down?","answers":[{"display":"join","accepted":["join"]},{"display":"less far","accepted":["less far"]},{"display":"(the) least far","accepted":["the least far","least far"]},{"display":"to let","accepted":["to let"]},{"display":"give","accepted":["give"]},{"display":"more easily","accepted":["more easily"]},{"display":"sleep","accepted":["sleep"]},{"display":"(the) least","accepted":["the least","least"]},{"display":"to buy","accepted":["to buy"]},{"display":"make","accepted":["make"]},{"display":"(the) highest","accepted":["the highest","highest"]},{"display":"made","accepted":["made"]},{"display":"(the) worst","accepted":["the worst","worst"]},{"display":"take（或）to take","accepted":["take","to take"]}],"answerRaw":"(１)　join；less far；(the) least far；to let；give；(２)　more easily；sleep；(３)(the) least；to buy；(４)　make；(the) highest；(５)　made；(６)(the) worst；take（或）to take","explanation":"(１)使役動詞　have＋受詞＋原形　V...；than　之前用劣等副詞比較級「較不遠」；of all　之前用劣等副詞最高級「最不遠」；ask＋人＋to V...，而　let　之後只須接原形　V...。\n(２)　than　之前接副詞　easily　的比較級修飾動作　feel tired；使役動詞　make＋受詞＋原形　V...。\n(３)由語意是「最不」喜歡草莓，而使役動詞　get(s)＋受詞＋to V...。\n(４)使役動詞　Let＋受詞＋原形　V...，而　of all　之前填副詞最高級。\n(５)使役動詞中，只有　make(s) / made＋受詞＋形容詞，由語意及情境，用過去式作答。\n(６)　Lu　老闆對待員工「最差」，用副詞　badly　的最高級，注意是不規則變化，而　help＋受詞＋原形　V... / to V...。"},{"id":8,"prompt":"Beth: Can you speak , please?  I can’t hear you clearly.  Luke: No .  I’ll try my best.","answers":[{"display":"louder","accepted":["louder"]},{"display":"problem","accepted":["problem"]}],"answerRaw":"louder；problem","explanation":"Beth　要　Luke　說「更大聲」，Luke　以「沒問題。」答應對方。"},{"id":9,"prompt":"Fun Farm provides a special service.  It can help people  the hens and even get the eggs from the hens  letting themselves get dirty.","answers":[{"display":"raise","accepted":["raise"]},{"display":"without","accepted":["without"]}],"answerRaw":"raise；without","explanation":"Fun　農場幫助人「飼養」母雞並且甚至拿到母雞下的蛋「而不；沒有」讓他們自己變髒。"},{"id":10,"prompt":"填入正確的形容詞或副詞。\n(１)　The woman is a  pet owner.  She treats her pet cat .（bad）\n(２)　Ann: Does Roy play the piano ?\nLeo: Sure.  He’s a music teacher, and he’s  at playing the piano.（good）\n(３)　Ted: Be as  as you can when driving a long way to Taipei.\nSam: No problem.  I’ll drive as  as I can.（careful）\n(４)　Lisa is a  girl; she does everything .（quiet）\n(５)　It’s not  to get mad with me easily.  Be sure to treat your body .（wise）\n(６)　Jill: How can Dan dance so ?\nIris: That’s true.  He is a very  dancer.（terrible）","answers":[{"display":"bad","accepted":["bad"]},{"display":"badly","accepted":["badly"]},{"display":"well","accepted":["well"]},{"display":"good","accepted":["good"]},{"display":"careful","accepted":["careful"]},{"display":"carefully","accepted":["carefully"]},{"display":"quiet","accepted":["quiet"]},{"display":"quietly","accepted":["quietly"]},{"display":"wise","accepted":["wise"]},{"display":"wisely","accepted":["wisely"]},{"display":"terribly","accepted":["terribly"]},{"display":"terrible","accepted":["terrible"]}],"answerRaw":"(１)　bad；badly；(２)　well；good；(３)　careful；carefully；(４)　quiet；quietly；(５)　wise；wisely；(６)　terribly；terrible","explanation":"(１)形容詞　bad　修飾名詞　pet owner，而副詞　badly　修飾整個動作　treats her pet cat。\n(２)副詞　well　修飾動作　play the piano，而　be　之後接形容詞片語　good at...。\n(３)　Be as＋形容詞＋as you can，而　drive＋as＋副詞＋as I can。\n(４)形容詞　quiet　修飾名詞　girl，而副詞　quietly　修飾動作　does everything。\n(５)容易生我的氣是不「明智的」，用「形容詞」作答，要「明智地」對待身體，用「副詞」作答。\n(６)動詞（dance）＋副詞，而形容詞＋名詞（dancer）。"}];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=s=>String(s??'').trim().toLowerCase().replace(/[’‘`]/g,"'").replace(/[.,!?;:()“”"]/g,'').replace(/\s+/g,' ');
let chosen=[],idx=0;const wrong=new Map(),attempted=new Set(),correct=new Set();
function preview(q){return KIND==='mcq'?q.stem:q.prompt}
function renderList(){$('#list').innerHTML=Q.map(q=>`<label class="pick"><input class="pickbox" type="checkbox" value="${q.id}" checked><span><b>第 ${q.id} 題</b><small>${esc(preview(q))}</small></span></label>`).join('')}
function setAll(v){document.querySelectorAll('.pickbox').forEach(x=>x.checked=v)}
function shuffled(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
$('#all').onclick=()=>setAll(true);$('#none').onclick=()=>setAll(false);$('#random').onclick=()=>{setAll(false);const ids=new Set(shuffled(Q).slice(0,20).map(q=>q.id));document.querySelectorAll('.pickbox').forEach(x=>x.checked=ids.has(+x.value))};
$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));idx=0;wrong.clear();attempted.clear();correct.clear();$('#select').classList.add('hidden');$('#result').classList.add('hidden');$('#quiz').classList.remove('hidden');show()};
function show(){if(window.speechSynthesis)speechSynthesis.cancel();const q=chosen[idx];$('#meta').textContent=`第 ${idx+1} / ${chosen.length} 題｜原題 ${q.id}`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=`${idx/chosen.length*100}%`;$('#stem').textContent=KIND==='mcq'?q.stem:q.prompt;const pic=$('#picture');if(q.image){pic.src=q.image;pic.classList.remove('hidden')}else{pic.classList.add('hidden');pic.removeAttribute('src')};if(KIND==='mcq'){$('#area').className='options';$('#area').innerHTML=q.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}"><b>${String.fromCharCode(65+i)}.</b><span>${esc(o)}</span></label>`).join('')}else{$('#area').className='answer-grid';$('#area').innerHTML=q.answers.map((a,i)=>`<div class="answer-row"><label>空格 ${i+1}</label><input class="answer-input" data-i="${i}" autocomplete="off" spellcheck="false" placeholder="請輸入答案"></div>`).join('')};$('#feedback').className='feedback hidden';$('#voicebox').classList.add('hidden');$('#check').classList.remove('hidden');$('#next').classList.add('hidden')}
function remember(q,value){if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(value);$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
function spoken(q){if(KIND==='mcq')return q.stem+' '+q.options[q.answer];return q.answers.map(a=>a.accepted[0]).join(' ')}
function speak(){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(spoken(chosen[idx]));u.lang='en-US';u.rate=.88;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/^en-US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;speechSynthesis.speak(u)}
function success(q){correct.add(q.id);$('#bar').style.width=`${(idx+1)/chosen.length*100}%`;$('#feedback').className='feedback ok';$('#feedback').innerHTML='✅ 全部正確！<br>'+esc(q.explanation||'');$('#target').textContent=spoken(q);$('#voicebox').classList.remove('hidden');$('#check').classList.add('hidden');$('#next').classList.remove('hidden');speak()}
$('#check').onclick=()=>{const q=chosen[idx];attempted.add(q.id);if(KIND==='mcq'){const sel=document.querySelector('input[name=answer]:checked');if(!sel)return alert('請先選擇答案。');const n=+sel.value;if(n===q.answer)return success(q);remember(q,String.fromCharCode(65+n)+'. '+q.options[n]);$('#feedback').className='feedback bad';$('#feedback').innerHTML=`❌ 答錯了。正確答案：<strong>${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</strong><br>${esc(q.explanation||'')}<br>請重新選擇正確答案。`;return}const ins=[...document.querySelectorAll('.answer-input')];if(ins.some(x=>!x.value.trim()))return alert('請完成所有答案。');const bad=[];ins.forEach((input,i)=>{const a=q.answers[i];input.classList.remove('ok','bad');if(a.accepted.some(x=>norm(x)===norm(input.value))){input.classList.add('ok');input.disabled=true}else{input.classList.add('bad');bad.push(`${i+1}. ${input.value} → ${a.display}`);input.value=''}});if(!bad.length)return success(q);remember(q,bad.join('；'));$('#feedback').className='feedback bad';$('#feedback').innerHTML=`❌ 有 ${bad.length} 格不正確。<br>正確答案：${q.answers.map((a,i)=>`${i+1}. <strong>${esc(a.display)}</strong>`).join('；')}<br>${esc(q.explanation||'')}<br>請依提示重新填寫。`;ins.find(x=>!x.disabled)?.focus()};
$('#speak').onclick=speak;$('#next').onclick=()=>{idx++;idx>=chosen.length?finish():show()};$('#finish').onclick=finish;
function answerText(q){return KIND==='mcq'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.answerRaw}
function finish(){if(window.speechSynthesis)speechSynthesis.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');$('#summary').innerHTML=`<div class="stat">選擇題數<b>${chosen.length}</b></div><div class="stat">已作答<b>${attempted.size}</b></div><div class="stat">完成答對<b>${correct.size}</b></div><div class="stat">曾答錯<b>${wrong.size}</b></div>`;$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>`<div class="wrong"><b>${i+1}. 原題 ${r.q.id}｜${esc(preview(r.q))}</b><p>錯誤紀錄：${r.attempts.map(esc).join('<br>')}</p><p><strong>正確答案：</strong>${esc(answerText(r.q))}</p><p>${esc(r.q.explanation||'')}</p></div>`).join(''):'<div class="feedback ok">🎉 沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size)}
$('#restart').onclick=()=>location.reload();$('#download').onclick=async()=>{if(!wrong.size)return;const rows=[...wrong.values()],stamp=new Date().toISOString().slice(0,10),name=TITLE.replace(/\s+/g,'_')+'_錯題_'+stamp;const save=(blob,ext)=>{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name+ext;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};try{const{Document,Packer,Paragraph,TextRun,HeadingLevel}=await import('https://esm.sh/docx@9.5.1');const children=[new Paragraph({heading:HeadingLevel.TITLE,children:[new TextRun({text:TITLE+' 錯題紀錄',bold:true})]})];rows.forEach((r,i)=>{children.push(new Paragraph({heading:HeadingLevel.HEADING_2,children:[new TextRun({text:`${i+1}. 原題 ${r.q.id}`,bold:true})]}),new Paragraph({text:preview(r.q)}),new Paragraph({children:[new TextRun({text:'錯誤紀錄：',bold:true}),new TextRun({text:r.attempts.join(' | ')})]}),new Paragraph({children:[new TextRun({text:'正確答案：',bold:true}),new TextRun({text:answerText(r.q)})]}),new Paragraph({children:[new TextRun({text:'解析：',bold:true}),new TextRun({text:r.q.explanation||''})]}))});save(await Packer.toBlob(new Document({sections:[{children}]})),'.docx')}catch(e){save(new Blob([TITLE+' 錯題紀錄\n\n'+rows.map(r=>preview(r.q)+'\n正確答案：'+answerText(r.q)+'\n').join('\n')],{type:'text/plain;charset=utf-8'}),'.txt')}};
renderList();
</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
