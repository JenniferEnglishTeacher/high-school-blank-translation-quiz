<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="龍騰普高 Book 1 Unit 7 互動測驗，附解析、整句朗讀與必做 STT 朗讀評分。"><title>龍騰普高 Book 1 Unit 7｜文法選擇（課本句型）</title><link rel="stylesheet" href="longteng-b1u5-quiz.css?v=20261026-3"><link rel="stylesheet" href="longteng-vocab-required-pronunciation.css?v=20261026-4"></head><body><main class="wrap"><header class="hero"><a class="btn" href="dashboard.html">← 回到 Dashboard</a><h1 id="title">龍騰普高 Book 1 Unit 7｜文法選擇（課本句型）</h1><p id="description" class="note"></p></header><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn" type="button">全選</button><button id="none" class="btn" type="button">取消全選</button><button id="random" class="btn" type="button">隨機 20 題</button><span id="picked" class="note"></span></div><div id="list"></div><label class="pick"><input id="shuffle" type="checkbox"> 隨機排列題目</label><button id="start" class="btn primary" type="button">開始測驗 →</button></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><div class="actions"><button id="check" class="btn primary" type="button">檢查答案</button><button id="next" class="btn primary hidden" type="button">下一題 →</button><button id="finish" class="btn danger" type="button">結束練習</button></div></section><section id="result" class="card hidden"><h2>練習結果</h2><div id="summary" class="summary"></div><h2>錯題紀錄</h2><div id="wrongList"></div><div class="actions"><button id="retry" class="btn primary" type="button">重做錯題</button><button id="download" class="btn" type="button">下載 DOCX 錯題</button><button id="restart" class="btn" type="button">重新選題</button></div></section></main><script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 7｜文法選擇（課本句型）","mode":"mcq","questions":[{"id":1,"question":"Do you have any idea ____________ tonight? I feel bored after staying home all day.","options":["what can we do","where should we go","how to do","what to do"],"answer":3,"answerLabel":"D","source":"三合一學習手冊","explanation":"補充解析：疑問詞 what + to VR 表示「該做什麼」。來源未附逐題解析。"},{"id":2,"question":"My mother has the living room ____________ every Sunday morning.","options":["clean","cleans","cleaned","be cleaned"],"answer":2,"answerLabel":"C","source":"三合一學習手冊","explanation":"補充解析：have + 受詞 + 過去分詞表示「使／請某事被完成」。來源未附逐題解析。"},{"id":3,"question":"Please tell me ____________. I don’t know the location of the restaurant.","options":["where could I go","where to go","where do I go","what will I do"],"answer":1,"answerLabel":"B","source":"三合一學習手冊","explanation":"補充解析：疑問詞 where + to VR 表示「該去哪裡」。來源未附逐題解析。"},{"id":4,"question":"Can you show me ____________? This is really difficult.","options":["how to do","how should I do","what to do","what to do it"],"answer":2,"answerLabel":"C","source":"三合一學習手冊","explanation":"補充解析：疑問詞 what + to VR 表示「該做什麼」。來源未附逐題解析。"},{"id":5,"question":"My mother has me ____________ the dishes after dinner every evening.","options":["do","to do","done","does"],"answer":0,"answerLabel":"A","source":"三合一學習手冊","explanation":"補充解析：have + 人 + 原形動詞表示「叫某人做某事」。來源未附逐題解析。"},{"id":6,"question":"Isaac had no idea ____________ when he was told that he was fired.","options":["why to do","where to do it","what to do","when to do it"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"what to do = what he should do，在此表「他該做什麼」。"},{"id":7,"question":"When the earthquake happened last night, Jasmine was so shocked that she did not know ____________.","options":["when she left the door","what to hide under","where could she go to","why she not to take the elevator"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"what to hide under = what she should hide under，在此表「她該躲在什麼下方」。"},{"id":8,"question":"Jill is looking at the menu and is thinking about ____________ for lunch.","options":["what she ate","which food to order","what does she eat","which food could she order"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"which food to order = which food she should order表「她該點哪一種食物」。"},{"id":9,"question":"I wonder ____________ to make Julia forget the loss of her pet dog and move on with her life.","options":["what to do","what can I do","what should I do","what I do"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"what to do = what I could do，在此表「我可以做些什麼」。"},{"id":10,"question":"Helen is trying to look completely different for her upcoming class reunion; this time around, she intends to have her hair ____________ grey.","options":["dye","died","dyeing","dyed"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"have + O + p.p. 為使役動詞have的句型，以過去分詞做為受詞補語，表示「使……被……」。have her hair dyed grey「使她的頭髮被染灰」。"},{"id":11,"question":"There is something wrong with the car. I need to have it ____________ now.","options":["fix","fixed","fixing","to fix"],"answer":1,"answerLabel":"B","source":"習作簿","explanation":"補充解析：have + 受詞 + 過去分詞表示「使／請某物被修好」。來源未附逐題解析。"},{"id":12,"question":"Cindy has tried several times, but she still doesn’t know ____________ to solve the problem.","options":["how","what","when","why"],"answer":0,"answerLabel":"A","source":"習作簿","explanation":"補充解析：疑問詞 how + to VR 表示「如何做……」。來源未附逐題解析。"},{"id":13,"question":"Jason doesn’t know ____________ to invite his ex-girlfriend, Kelly, to his birthday party. He’s not sure if this would be a good idea.","options":["when","whether","where","what"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"依第二句語意「他不確定這是否是個好的想法」可推知，應以whether填入空格表「是否」。"},{"id":14,"question":"Jim ____________ his car washed while he went for a quick run on the nearby track.","options":["had","asked","let","took"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"have + O + p.p. 為使役動詞have的句型，以過去分詞做為受詞補語，表示「使……被……」。"},{"id":15,"question":"My car is not running again, so I need to have it ____________.","options":["check and fix","checking and fixing","checked and fixing","checked and fixed"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"have + O + p.p. 為使役動詞have的句型，以過去分詞做為受詞補語，表示「使……被……」。又and 是對等連接詞，所以前後接的分詞都必須是過去分詞。"},{"id":16,"question":"The man wants to have his house ____________ in the spring, because that is when more people are looking to buy.","options":["sell","sold","have sold","been sold"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"have + O + p.p. 為使役動詞have的句型，以過去分詞做為受詞補語，表示「使……被……」。have his house sold「使他的房子被售出」。"},{"id":17,"question":"This old soldier wants to write a book about his experiences fighting in wars, and have it ____________ before he turns eighty next May.","options":["to publish","to be published","publishing","published"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"have + O + p.p. 為使役動詞have的句型，以過去分詞做為受詞補語，表示「使……被……」。have it published「使它被出版」。"}]};</script><script src="longteng-b1u5-quiz.js?v=20261026-3"></script><script src="longteng-vocab-required-pronunciation.js?v=20261026-4"></script></body></html>
