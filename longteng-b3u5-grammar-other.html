<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="龍騰普高 B3U5 文法選擇（其他考點）互動練習"><title>龍騰普高 B3U5 文法選擇（其他考點）</title><style>:root{--blue:#2563eb;--navy:#1e3a8a;--bg:#f4f7fb;--card:#fff;--line:#dbe3ee;--ink:#172033;--muted:#64748b;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--voice:#6d28d9;--voicebg:#f5f3ff;--amber:#9a3412;--amberbg:#fff7ed}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}.wrap{max-width:920px;margin:auto;padding:16px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:15px 0;box-shadow:0 5px 18px #0f172a0d}.hero{background:linear-gradient(135deg,#e8f1ff,#fff)}h1{margin:0 0 6px;font-size:clamp(25px,4vw,38px)}h2{margin-top:0}.note{color:var(--muted)}.hidden{display:none!important}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.btn{border:0;border-radius:10px;padding:11px 17px;font:800 16px inherit;cursor:pointer;background:#e5e7eb;color:var(--ink);text-decoration:none}.primary{background:var(--blue);color:#fff}.danger{background:#991b1b;color:#fff}.voice{background:var(--voice);color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.btn:focus-visible,input:focus-visible{outline:3px solid #93c5fd;outline-offset:2px}.pick{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:9px;margin:7px 0;background:#fafcff}.pick input{margin-right:8px;width:17px;height:17px;accent-color:var(--blue)}#list{max-height:440px;overflow:auto;border:1px solid var(--line);padding:7px;border-radius:12px}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--blue)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-weight:800;margin:8px 0 14px}.zh{padding:10px 13px;background:var(--amberbg);border-radius:9px;color:var(--amber);font-weight:800;margin-bottom:10px}.question{font-size:21px;font-weight:750;padding:16px;background:#f8fafc;border-radius:11px;white-space:pre-wrap}.options{display:grid;gap:9px;margin:14px 0}.option{display:flex;align-items:center;gap:11px;padding:12px 14px;border:2px solid #cbd5e1;border-radius:10px;background:#fff;font-size:18px;font-weight:750;cursor:pointer}.option:hover{border-color:#60a5fa;background:#eff6ff}.option:has(input:checked){border-color:var(--blue);background:#dbeafe;color:var(--navy)}.option input{width:20px;height:20px;accent-color:var(--blue)}.inputs{display:grid;gap:10px;margin:15px 0}.answer-row{display:grid;grid-template-columns:55px 1fr;gap:10px;align-items:center}.answer-row label{font-weight:900;color:var(--navy);text-align:center}.spell{width:100%;font:inherit;font-size:18px;padding:11px;border:2px solid #94a3b8;border-radius:9px}.feedback{padding:13px;border-radius:10px;font-weight:800;margin:13px 0}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.explain{font-weight:500;margin-top:7px}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:var(--voicebg);margin:13px 0}.voicebox b{display:block;font-size:19px;margin-bottom:8px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.stat,.wrong{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong{background:#fff7f7;border-color:#fecaca;margin:10px 0}.wrong p{margin:6px 0}.source{font-size:13px;color:var(--muted)}@media(max-width:600px){.wrap{padding:9px}.hero,.card{padding:15px}.question{font-size:18px;padding:13px}.option{font-size:17px}.answer-row{grid-template-columns:42px 1fr}.meta{display:block}}</style><link rel="stylesheet" href="longteng-vocab-required-pronunciation.css?v=20261026-4"></head><body><main class="wrap"><section class="hero"><h1>龍騰普高 B3U5 文法選擇（其他考點）</h1><p>共 29 題。可自行選題、隨機抽題；答錯後請重新作答。</p><p class="note">答對後顯示來源解析並播放完整英文句；STT 朗讀達 80% 才能進入下一題。完成後可重做錯題並下載 DOCX。</p><div class="toolbar"><a class="btn" href="dashboard.html">← 回測驗總覽</a></div></section><section id="select" class="card"><h2>選擇題目</h2><div class="toolbar"><button id="all" class="btn">全部選取</button><button id="none" class="btn">全部取消</button><button id="rand20" class="btn">隨機 20 題</button></div><label><input id="shuffle" type="checkbox"> 打亂出題順序</label><div id="list"></div><div class="actions"><button id="start" class="btn primary">開始作答</button><span id="picked" class="note"></span></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="zh" class="zh hidden"></div><div id="question" class="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="voiceBox" class="voicebox hidden"><b id="voiceTarget"></b><button id="speak" class="btn voice">🔊 再聽一次</button></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束作答</button></div></section><section id="result" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="retry" class="btn primary">只重做錯題</button><button id="download" class="btn">下載錯題 DOCX</button><button id="restart" class="btn">重新選題</button></div></section></main><script>const TITLE="龍騰普高 B3U5 文法選擇（其他考點）",MODE="mcq",Q=[{"id":1,"question":"The Taj Mahal, often called one of the New Seven Wonders of the World, is ____________ white marble domes and surrounded by beautiful gardens.","options":["provided with","crowned with","packed with","associated with"],"answer":1,"explanation":"be crowned with 冠上……；上面放著……","source":"龍騰自命題"},{"id":2,"question":"The generous man handed a ____________ bill to the poor beggar on the sidewalk and told him to buy some food.","options":["one-hundred-dollar","one hundred dollars","hundreds of","one hundreds dollar"],"answer":0,"explanation":"本題測驗「數字-N」複合形容詞用法，此時須使用單數名詞來呈現","source":"龍騰自命題"},{"id":3,"question":"It is thought that those ____________ drink and drive deserve the most severe punishment.","options":["whom","who","one","people"],"answer":1,"explanation":"本題測驗關代those who用法，表「凡是……的人」","source":"龍騰自命題"},{"id":4,"question":"Experts in marketing strategies have been studying how to make people ____________ more items while they shop in supermarkets.","options":["purchased","purchasing","to purchase","purchase"],"answer":3,"explanation":"本題測驗make當使役動詞的用法，句構為「make + O + VR」，表示「使某人做某事」，應選原形動詞purchase","source":"龍騰自命題"},{"id":5,"question":"The novels ____________ by the well-known English writer have been widely accepted and translated into several languages.","options":["wrote","to write","writing","written"],"answer":3,"explanation":"本題測驗由形容詞子句簡化而來的分詞片語，原句可還原為The novels which were written by the well-known English writer....","source":"龍騰自命題"},{"id":6,"question":"Despite his successful career, ____________ matters most to Alan is his family.","options":["what","that","who","it"],"answer":0,"explanation":"what複合關係代名詞引導名詞子句當主詞","source":"龍騰自命題"},{"id":7,"question":"It has been reported that a large ____________ of animals, birds, and plants are being badly affected by climate change.","options":["plenty","amount","number","percent"],"answer":2,"explanation":"a large number of + N表「大量的……」，後面要接複數名詞","source":"龍騰自命題"},{"id":8,"question":"Nowadays, teenagers spend too much time ____________ video clips on their smartphones.","options":["watch","to watching","watching","watched"],"answer":2,"explanation":"spend + time + V-ing 花費時間……","source":"龍騰自命題"},{"id":9,"question":"The couple took a quiet walk ____________ the woods, enjoying the fresh air, beautiful scenery, and a sense of inner peace.","options":["during","between","among","through"],"answer":3,"explanation":"through表「穿越」","source":"龍騰自命題"},{"id":10,"question":"When my aunt and uncle finally arrived, we greeted them ____________ open arms.","options":["in","with","by","for"],"answer":1,"explanation":"with表「用」，後面接名詞","source":"龍騰自命題"},{"id":11,"question":"____________ to the song over twenty times, Becky is able to sing it without reading the lyrics.","options":["Has listened","Having listened","Listen","Have listened"],"answer":1,"explanation":"","source":"三合一學習手冊"},{"id":12,"question":"The Lins live in a ____________ building in Taichung.","options":["10-story","10th story","10 story","10 stories"],"answer":0,"explanation":"","source":"三合一學習手冊"},{"id":13,"question":"____________ is your parents ____________ deserve your gratitude for satisfying all of your needs.","options":["That; what","This; who","It; which","It; that"],"answer":3,"explanation":"","source":"三合一學習手冊"},{"id":14,"question":"____________ in London for five years, May now speaks English with a British accent.","options":["Works","Having been worked","Worked","Having worked"],"answer":3,"explanation":"","source":"三合一學習手冊"},{"id":15,"question":"The man said that it was his wife’s support ____________ led him to success.","options":["and","where","that","what"],"answer":2,"explanation":"it is/was...that...為分裂句，分裂句為強調句型，意為「正是……；就是……」。","source":"龍騰自命題"},{"id":16,"question":"The young lady ____________ a blue dress really stood out in the group of people.","options":["on","over","with","in"],"answer":3,"explanation":"in代表「穿著」。","source":"龍騰自命題"},{"id":17,"question":"Bear in mind that those who waste their time all day long will ____________ good for nothing.","options":["end up becoming","end up become","end up to become","end up to becoming"],"answer":0,"explanation":"those who + V... 凡是……的人；end up + V-ing表示「最後落得……的下場」。","source":"龍騰自命題"},{"id":18,"question":"Woody is a brilliant young man with various talents; ____________ his wide knowledge of science, his excellent dancing skills also dazzle people.","options":["due to","apart from","except for","based on"],"answer":1,"explanation":"apart from + N = besides + N 除了N之外還有……；except for + N 排除N之外，其他都……；dazzle vt. 使驚豔。","source":"龍騰自命題"},{"id":19,"question":"Many people think Michael Jordan is one of ____________ basketball players in the world.","options":["a good","a better","the better","the best"],"answer":3,"explanation":"","source":"習作簿"},{"id":20,"question":"Tina stood by the window with tears ____________ down her cheeks.","options":["roll","rolled","rolling","to roll"],"answer":2,"explanation":"","source":"習作簿"},{"id":21,"question":"____________ is the town’s beautiful scenery that enables it to be a tourist attraction.","options":["It","There","This","That"],"answer":0,"explanation":"","source":"習作簿"},{"id":22,"question":"It is ____________ that enables me to share what I think with other people.","options":["on Facebook","with Facebook","because of Facebook","Facebook"],"answer":3,"explanation":"","source":"三合一學習手冊"},{"id":23,"question":"Mr. Deng asked his students to write a ____________ report and hand it in next week.","options":["five hundred words","five-hundred-words","five-hundred-word","five-hundred words"],"answer":2,"explanation":"","source":"三合一學習手冊"},{"id":24,"question":"With many people ____________ for help, the government is forced to take action immediately.","options":["asking","to ask","asked","ask"],"answer":0,"explanation":"with + O + OC 伴隨著……。","source":"龍騰自命題"},{"id":25,"question":"Tall maple trees stand on both sides of the path ____________ the shrine, giving people some cool shade in summer.","options":["filled with","covered in","leading up to","crowned with"],"answer":2,"explanation":"filled with 充滿；covered in 被……覆蓋；lead up to 一路通往；crowned with 以……作為冠冕。","source":"龍騰自命題"},{"id":26,"question":"Many people believe the god in the temple always answers their requests, and that’s why they come to worship ____________ the year.","options":["all over","throughout","through","across"],"answer":1,"explanation":"throughout + 時間 貫穿整個……。","source":"龍騰自命題"},{"id":27,"question":"During the big storm, lightning struck the roof and set the whole building ____________ fire.","options":["at","on","from","off"],"answer":1,"explanation":"set...on fire 對……縱火。","source":"龍騰自命題"},{"id":28,"question":"Kim’s new job involves ____________ around Asia, visiting old clients, and finding new ones.","options":["to travel","in traveling","travel","traveling"],"answer":3,"explanation":"involve + V-ing 包含……。","source":"龍騰自命題"},{"id":29,"question":"____________ to Paris many times, I am very familiar with the old charming city.","options":["To have ever gone","Being ever","Having been","Going ever"],"answer":2,"explanation":"原句為Because I have been to Paris many times, I am very familiar with the city. 因前後句主詞相同，故可改寫為完成式分詞構句。","source":"龍騰自命題"}];const $=s=>document.querySelector(s),list=$('#list'),select=$('#select'),quiz=$('#quiz'),result=$('#result'),question=$('#question'),answerArea=$('#answerArea'),feedback=$('#feedback'),next=$('#next');let chosen=[],idx=0,mode='first';const wrong=new Map(),correct=new Set();const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ');const shuffled=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function renderList(){list.innerHTML=Q.map(q=>'<label class="pick"><input class="pickbox" type="checkbox" value="'+q.id+'" checked><b>第 '+q.id+' 題</b> <span class="source">'+esc(q.source||'')+'</span></label>').join('');count()}function count(){$('#picked').textContent='已選 '+document.querySelectorAll('.pickbox:checked').length+' 題'}list.addEventListener('change',count);$('#all').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=true);count()};$('#none').onclick=()=>{document.querySelectorAll('.pickbox').forEach(x=>x.checked=false);count()};$('#rand20').onclick=()=>{let ids=new Set(shuffled(Q).slice(0,Math.min(20,Q.length)).map(q=>q.id));document.querySelectorAll('.pickbox').forEach(x=>x.checked=ids.has(+x.value));count()};$('#start').onclick=()=>{const ids=[...document.querySelectorAll('.pickbox:checked')].map(x=>+x.value);if(!ids.length)return alert('請至少選一題。');chosen=Q.filter(q=>ids.includes(q.id));if($('#shuffle').checked)chosen=shuffled(chosen);idx=0;mode='first';wrong.clear();correct.clear();select.classList.add('hidden');result.classList.add('hidden');quiz.classList.remove('hidden');show()};function show(){const q=chosen[idx];speechSynthesis?.cancel();$('#meta').textContent=(mode==='retry'?'錯題重做｜':'')+'第 '+(idx+1)+' / '+chosen.length+' 題';$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';$('#bar').style.width=(idx+1)/chosen.length*100+'%';question.textContent=q.question;const zh=$('#zh');if(q.zh){zh.textContent=q.zh;zh.classList.remove('hidden')}else zh.classList.add('hidden');feedback.className='feedback hidden';$('#voiceBox').classList.add('hidden');$('#check').classList.remove('hidden');next.classList.add('hidden');if(MODE==='mcq')answerArea.innerHTML='<div class="options">'+q.options.map((o,i)=>'<label class="option"><input type="radio" name="answer" value="'+i+'"><b>'+String.fromCharCode(65+i)+'.</b> '+esc(o)+'</label>').join('')+'</div>';else answerArea.innerHTML='<div class="inputs">'+q.answers.map((_,i)=>'<div class="answer-row"><label>'+(MODE==='multi'?['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'][i]:'答案')+'</label><input class="spell" autocomplete="off" spellcheck="false" placeholder="請輸入完整答案"></div>').join('')+'</div>';setTimeout(()=>answerArea.querySelector('input')?.focus(),0)}function currentAnswers(){if(MODE==='mcq'){const x=answerArea.querySelector('input:checked');return x?[+x.value]:[]}return [...answerArea.querySelectorAll('.spell')].map(x=>x.value)}function correctText(q){return MODE==='mcq'?String.fromCharCode(65+q.answer)+'. '+q.options[q.answer]:q.answers.map(a=>a.split('||')[0]).join(' / ')}function isCorrect(q,a){return MODE==='mcq'?a[0]===q.answer:a.every((x,i)=>q.answers[i].split(/\|\||\//).some(v=>norm(x)===norm(v)))}function completedSentence(q){if(MODE==='mcq'){let s=q.question,v=q.options[q.answer],parts=(s.match(/_{3,}/g)||[]).length>1&&v.includes(';')?v.split(';').map(x=>x.trim()):[v];parts.forEach(x=>s=s.replace(/_{3,}/,x));return s}if(MODE==='spell')return q.question.replace(/[A-Za-z]?_{3,}[A-Za-z]?/,q.answers[0].split('||')[0]);let s=q.question,marks=['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];q.answers.forEach((a,i)=>{let value=a.split('||')[0];let re=new RegExp(marks[i]+'[A-Za-z]?_{3,}[A-Za-z]?');if(re.test(s))s=s.replace(re,value);else s=s.replace(/_{3,}/,value)});return s.replace(/[①-⑩]/g,'')}function speak(){if(!speechSynthesis)return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance($('#voiceTarget').textContent);u.lang='en-US';u.rate=.86;speechSynthesis.speak(u)}$('#speak').onclick=speak;$('#check').onclick=()=>{const q=chosen[idx],a=currentAnswers();if((MODE==='mcq'&&!a.length)||(MODE!=='mcq'&&(a.length!==q.answers.length||a.some(x=>!x.trim()))))return alert('請完成所有答案。');if(isCorrect(q,a)){correct.add(q.id);feedback.className='feedback ok';feedback.innerHTML='✅ 全部正確！'+(q.explanation?'<div class="explain">解析：'+esc(q.explanation)+'</div>':'');$('#check').classList.add('hidden');next.classList.remove('hidden');$('#voiceTarget').textContent=completedSentence(q);$('#voiceBox').classList.remove('hidden');speak()}else{if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(MODE==='mcq'?String.fromCharCode(65+a[0]):a.join(' / '));$('#wrongCount').textContent='曾答錯 '+wrong.size+' 題';feedback.className='feedback bad';feedback.innerHTML='❌ 答案不正確。正確答案：<strong>'+esc(correctText(q))+'</strong><br>請重新作答。'+(q.explanation?'<div class="explain">解析：'+esc(q.explanation)+'</div>':'');if(MODE==='mcq')answerArea.querySelectorAll('input').forEach(x=>x.checked=false);else answerArea.querySelectorAll('.spell').forEach(x=>x.value='');answerArea.querySelector('input')?.focus()}};next.onclick=()=>{idx++;idx>=chosen.length?finish():show()};$('#finish').onclick=finish;function finish(){speechSynthesis?.cancel();quiz.classList.add('hidden');result.classList.remove('hidden');$('#summary').innerHTML='<div class="stat">本輪題數<b>'+chosen.length+'</b></div><div class="stat">完成答對<b>'+correct.size+'</b></div><div class="stat">曾答錯<b>'+wrong.size+'</b></div>';$('#wrongList').innerHTML=wrong.size?[...wrong.values()].map((r,i)=>'<div class="wrong"><b>'+(i+1)+'. 第 '+r.q.id+' 題</b><p>'+esc((r.q.zh?r.q.zh+'\n':'')+r.q.question)+'</p><p><strong>錯誤答案：</strong>'+r.attempts.map(esc).join('；')+'</p><p><strong>正確答案：</strong>'+esc(correctText(r.q))+'</p>'+(r.q.explanation?'<p><strong>解析：</strong>'+esc(r.q.explanation)+'</p>':'')+'</div>').join(''):'<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>';$('#download').classList.toggle('hidden',!wrong.size);$('#retry').classList.toggle('hidden',!wrong.size)}$('#retry').onclick=()=>{chosen=[...wrong.values()].map(x=>x.q);idx=0;mode='retry';correct.clear();result.classList.add('hidden');quiz.classList.remove('hidden');show()};$('#restart').onclick=()=>location.reload();$('#download').onclick=async()=>{if(!wrong.size)return;try{if(!window.docx)await new Promise((ok,fail)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js';s.onload=ok;s.onerror=fail;document.head.append(s)});let{Document,Packer,Paragraph,TextRun,HeadingLevel}=window.docx,children=[new Paragraph({text:TITLE+' 錯題紀錄',heading:HeadingLevel.TITLE})];for(const [_,r] of wrong){children.push(new Paragraph({children:[new TextRun({text:'第 '+r.q.id+' 題',bold:true})]}));if(r.q.zh)children.push(new Paragraph(r.q.zh));children.push(new Paragraph(r.q.question),new Paragraph('錯誤答案：'+r.attempts.join('；')),new Paragraph('正確答案：'+correctText(r.q)));if(r.q.explanation)children.push(new Paragraph('解析：'+r.q.explanation));children.push(new Paragraph('重新作答：________________________________________'))}let blob=await Packer.toBlob(new Document({sections:[{children}]})),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=TITLE+'_錯題.docx';a.click();URL.revokeObjectURL(url)}catch(e){let text=[...wrong.values()].map(r=>'第 '+r.q.id+' 題\n'+(r.q.zh?r.q.zh+'\n':'')+r.q.question+'\n錯誤答案：'+r.attempts.join('；')+'\n正確答案：'+correctText(r.q)+(r.q.explanation?'\n解析：'+r.q.explanation:'')).join('\n\n');let blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=TITLE+'_錯題.txt';a.click();URL.revokeObjectURL(url)}};renderList();</script><script src="longteng-vocab-required-pronunciation.js?v=20261026-4"></script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
