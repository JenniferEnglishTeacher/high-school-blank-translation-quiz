  <script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 5｜引導式翻譯","mode":"multi","questions":[{"id":1,"zh":"我沒辦法自己拿這些重的盒子。你能幫我嗎？","question":"I can’t carry these heavy boxes ①____________ ②____________ ③____________. Would you please help me?","answers":["on","my","own"],"source":"All in One","explanation":"補充解析：中文意思如題幹；本題依序填入 on my own。","explanationSource":"supplement"},{"id":2,"zh":"在黃先生被解僱之後，他很難過地將他所有的東西打包後離開。","question":"After Mr. Huang got fired, he sadly ①____________ all of his things ②____________ and left.","answers":["packed","up"],"source":"課本例句填空","explanation":"補充解析：中文意思如題幹；本題依序填入 packed up。","explanationSource":"supplement"},{"id":3,"zh":"雖然每個人都認為在午夜前完成這個專案是不可能的，但Patrick在無人協助下，靠自己辦到了。這個專案最後成功了。","question":"Though everyone thought it was impossible to finish the project by midnight, Patrick made the deadline ①____________ ②____________ ③____________ without anyone’s help. The project ④____________ ⑤____________ being successful.","answers":["on","his","own","ended","up"],"source":"龍騰自命題","explanation":"by midnight 午夜之前 without one’s help 無人協助","explanationSource":"source"},{"id":4,"zh":"三天的畢業旅行即將畫下句點，所以也該是我們打包回家的時候了。","question":"The three-day graduation trip is coming to an end, so it’s time for us to ①____________ ②____________ our stuff and go home.","answers":["pack","up"],"source":"龍騰自命題","explanation":"graduation trip 畢業旅行 come to an end 結束","explanationSource":"source"},{"id":5,"zh":"每當我有靠自己解決不了的問題時，我會求助於我的父母。","question":"Whenever I have problems that I can’t solve ①____________ ②____________ ③____________, I turn to my parents for help.","answers":["on","my","own"],"source":"龍騰自命題","explanation":"whenever 每當 turn to sb. for help 尋求某人的幫助","explanationSource":"source"},{"id":6,"zh":"在我等公車的過程中，有三輛不同的公車抵達。","question":"While I was waiting for my bus, three different buses ①c____________ ②____________.","answers":["came","along"],"source":"龍騰自命題","explanation":"come along意思等同show up。","explanationSource":"source"},{"id":7,"zh":"不停工作三小時後，工人們被允許休息一陣子。","question":"The workers were allowed to rest ①____________ ②____________ ③____________ after working for three hours nonstop.","answers":["for","a","while"],"source":"龍騰自命題","explanation":"nonstop 不間斷地","explanationSource":"source"},{"id":8,"zh":"在一天結束離開教室之前，確保你已經收拾好所有東西。","question":"Before you leave the classroom at the end of the day, make sure you ①____________ ②____________ all your things.","answers":["pack","up"],"source":"龍騰自命題","explanation":"make sure 確保","explanationSource":"source"},{"id":9,"zh":"我在廁所摔倒後，一位同班同學出現幫助我，這已經是超過15分鐘後的事了。","question":"After I fell down in the restroom, it was more than 15 minutes later before a classmate ①c____________ ②____________ to help me.","answers":["came","along"],"source":"龍騰自命題","explanation":"fall down跌倒","explanationSource":"source"},{"id":10,"zh":"病患被要求在床上躺一下，直到感到舒服一點再起來。","question":"The patient was asked to lie in bed ①____________ ②____________ ③____________ until he felt better.","answers":["for","a","while"],"source":"龍騰自命題","explanation":"until 直到……","explanationSource":"source"},{"id":11,"zh":"我妹妹正興奮地為明天的戶外教學打包東西。","question":"My younger sister is ①____________ ②____________ everything with excitement for tomorrow’s field trip.","answers":["packing","up"],"source":"龍騰自命題","explanation":"with excitement = excitedly 興奮地","explanationSource":"source"},{"id":12,"zh":"各樣的問題與困難，在任何時間、任何地點都有可能出現。","question":"Different kinds of problems and difficulties may ①c____________ ②____________ anytime, anywhere.","answers":["come","along"],"source":"龍騰自命題","explanation":"come along = show up","explanationSource":"source"},{"id":13,"zh":"我非常用功準備考試，但最後還是考差了。","question":"I studied very hard for the exam, but it ①____________ ②____________ a failure.","answers":["ended","up"],"source":"龍騰自命題","explanation":"end up + N(P) 最後成為……；最後落得……的下場","explanationSource":"source"},{"id":14,"zh":"這是我第一次獨自旅行，沒有家人或朋友在身邊。","question":"This is the first time that I’ve traveled ①____________ ②____________ ③____________ without my family or friends.","answers":["on","my","own"],"source":"龍騰自命題","explanation":"on one’s own = by oneself","explanationSource":"source"},{"id":15,"zh":"這家人對於去哪家餐廳無法達成共識，所以他們最後就待在家裡吃披薩。","question":"The family couldn’t agree on a restaurant to go to, so they ①____________ ②____________ staying home and eating pizza.","answers":["ended","up"],"source":"課本例句填空","explanation":"補充解析：中文意思如題幹；本題依序填入 ended up。","explanationSource":"supplement"},{"id":16,"zh":"那隻獅子躲在樹後一陣子，等著鹿兒經過。","question":"The lion hid behind a tree ①____________ ②____________ ③____________, waiting for a deer to walk by.","answers":["for","a","while"],"source":"課本例句填空","explanation":"補充解析：中文意思如題幹；本題依序填入 for a while。","explanationSource":"supplement"},{"id":17,"zh":"Lily喜歡獨自去釣魚，這樣她才能聆聽大海的聲音。","question":"Lily loves to go fishing ①____________ ②____________ ③____________, so she can listen to the sound of the sea.","answers":["on","her","own"],"source":"課本例句填空","explanation":"補充解析：中文意思如題幹；本題依序填入 on her own。","explanationSource":"supplement"},{"id":18,"zh":"Jane說她還沒準備好要加入我們，但她待會就會到。","question":"Jane said she’s not ready to join us yet, but she will ①____________ ②____________ later.","answers":["come","along"],"source":"課本例句填空","explanation":"補充解析：中文意思如題幹；本題依序填入 come along。","explanationSource":"supplement"},{"id":19,"zh":"Jessie花了一小時打包她的東西。","question":"It took Jessie an hour to ①____________ her things ②____________.","answers":["pack","up"],"source":"習作簿","explanation":"補充解析：中文意思如題幹；本題依序填入 pack up。","explanationSource":"supplement"},{"id":20,"zh":"健行總是讓我上氣不接下氣，所以我得停下來一會兒才能繼續。","question":"Hiking always makes me feel out of breath, so I have to pause ①____________ ②____________ ③____________ before I continue.","answers":["for","a","while"],"source":"習作簿","explanation":"補充解析：中文意思如題幹；本題依序填入 for a while。","explanationSource":"supplement"},{"id":21,"zh":"人們越來越忙，因此他們往往比較喜歡外食而不是自己煮。","question":"People are getting busier, so they tend to prefer eating out to cooking ①____________ their ②____________.","answers":["on","own"],"source":"習作簿","explanation":"補充解析：中文意思如題幹；本題依序填入 on own。","explanationSource":"supplement"},{"id":22,"zh":"飛機墜毀，試飛結果失敗。","question":"The plane’s test flight ①____________ ②____________ as a failure when it crashed.","answers":["ended","up"],"source":"習作簿","explanation":"補充解析：中文意思如題幹；本題依序填入 ended up。","explanationSource":"supplement"},{"id":23,"zh":"在這個高科技的世界裡，我們幾乎忘了過去在網路出現之前是如何找尋資料的。","question":"In this high-tech world, we’ve almost forgotten how we searched for information in the past before the Internet ①____________ ②____________.","answers":["came","along"],"source":"All in One","explanation":"補充解析：中文意思如題幹；本題依序填入 came along。","explanationSource":"supplement"},{"id":24,"zh":"婦人警告她兒子如果他繼續偷東西，最後會坐牢的。","question":"The woman warned her son that he would ①____________ ②____________ in prison if he continued to steal.","answers":["end","up"],"source":"All in One","explanation":"補充解析：中文意思如題幹；本題依序填入 end up。","explanationSource":"supplement"},{"id":25,"zh":"Tim最後獨自完成了所有的工作，因為他的同事們困在車陣中。","question":"Tim ①____________ ②____________ ③f____________ all the work ④____________ ⑤____________ ⑥____________ because his colleagues were stuck in a traffic jam.","answers":["ended","up","finishing","on","his","own"],"source":"三合一學習手冊","explanation":"補充解析：中文意思如題幹；本題依序填入 ended up finishing on his own。","explanationSource":"supplement"},{"id":26,"zh":"Richard想發明許多能改善人們生活的東西。","question":"Richard would like to invent many things that can ①____________ people’s lives ②____________.","answers":["make","better"],"source":"三合一學習手冊","explanation":"補充解析：中文意思如題幹；本題依序填入 make better。","explanationSource":"supplement"},{"id":27,"zh":"因為缺乏有效的藥物，那個受槍傷的小男孩一天天逐漸變得更加虛弱。","question":"Without any effective medicine, the little boy suffering from gunshot wounds is ①____________ ②____________ day by day.","answers":["getting","weaker"],"source":"三合一學習手冊","explanation":"補充解析：中文意思如題幹；本題依序填入 getting weaker。","explanationSource":"supplement"},{"id":28,"zh":"那位老師喜歡在教完一課後問她的學生們幾個問題。","question":"The teacher likes to ask her students ①____________ ②____________ ③____________ after teaching a lesson.","answers":["a","few","questions"],"source":"三合一學習手冊","explanation":"補充解析：中文意思如題幹；本題依序填入 a few questions。","explanationSource":"supplement"},{"id":29,"zh":"一天的辛苦工作之後，Karen終於可以坐下來好好休息一下子了。","question":"After a day’s hard work, Karen could finally sit down and rest ①____________ ②____________ ③____________.","answers":["for","a","while"],"source":"三合一學習手冊","explanation":"補充解析：中文意思如題幹；本題依序填入 for a while。","explanationSource":"supplement"},{"id":30,"zh":"你自己要打包所有東西很難。打電話請專業人士幫忙吧！","question":"It will be difficult for you to ①____________ ②____________ everything by yourself. Call the professionals for help!","answers":["pack","up"],"source":"三合一學習手冊","explanation":"補充解析：中文意思如題幹；本題依序填入 pack up。","explanationSource":"supplement"},{"id":31,"zh":"很幸運地，我們剛搬進新公寓時，有一些朋友出現幫我們打掃。","question":"Luckily, when we first moved into our new apartment, some of our friends ①____________ ②____________ and helped us clean up the mess.","answers":["came","along"],"source":"三合一學習手冊","explanation":"補充解析：中文意思如題幹；本題依序填入 came along。","explanationSource":"supplement"},{"id":32,"zh":"George和Mary正在打包去夏威夷蜜月旅行所需的東西。他們期待在那裡度過美好時光。","question":"George and Mary are ①____________ ②____________ the things needed for their honeymoon in Hawaii. They expect to have a wonderful time there.","answers":["packing","up"],"source":"龍騰自命題","explanation":"pack up 打包 honeymoon 蜜月","explanationSource":"source"},{"id":33,"zh":"Phil那天晚上睡不大著是因為他那天下午喝的所有咖啡。","question":"Phil had trouble falling asleep that night ①____________ ②____________ all the coffee he’d had in the afternoon.","answers":["because","of"],"source":"龍騰自命題","explanation":"because of表示原因，後面接名詞all the coffee","explanationSource":"source"},{"id":34,"zh":"在打包好他的行李箱後，James要他的秘書幫他叫一臺計程車。","question":"After ①____________ ②____________ his suitcase, James had his secretary ③____________ him a taxi.","answers":["packing","up","call"],"source":"龍騰自命題","explanation":"使役動詞have + O + VR","explanationSource":"source"},{"id":35,"zh":"因為我的差視力，我必須每天配戴隱形眼鏡。","question":"①____________ ②____________ my poor eyesight, I have to wear contact lenses every day.","answers":["Because","of"],"source":"龍騰自命題","explanation":"because of表示原因，後面接名詞eyesight。contact lenses 隱形眼鏡","explanationSource":"source"},{"id":36,"zh":"許多藥物和其他有用的產品會被發現是因為實驗室裡的意外。","question":"Many medicines and other useful products have been discovered only ①____________ ②____________ accidents in the lab.","answers":["because","of"],"source":"龍騰自命題","explanation":"because of表示原因，後面接名詞accidents。lab 實驗室","explanationSource":"source"},{"id":37,"zh":"那兩位家長讓那隻狗睡在他們小孩的房間，因為那孩子不喜歡在夜晚時獨自一人。","question":"The parents let the dog ①____________ in their child’s bedroom because the child doesn’t like to be ②____________ her ③____________ at nighttime.","answers":["sleep","on","own"],"source":"龍騰自命題","explanation":"使役動詞let + O + VR。on one’s own 獨自","explanationSource":"source"},{"id":38,"zh":"因為規律運動和低脂飲食，我在兩個月內瘦了好幾磅。","question":"I lost several pounds in two months ①____________ ②____________ regular exercise and a low-fat diet.","answers":["because","of"],"source":"三合一學習手冊","explanation":"使役動詞let + O + VR。on one’s own 獨自","explanationSource":"source"},{"id":39,"zh":"John因為他的傷勢無法參加足球的最終賽。","question":"John couldn’t play in the soccer final ①____________ ②____________ his injury.","answers":["because","of"],"source":"龍騰自命題","explanation":"because of表示原因，後面接名詞his injury","explanationSource":"source"}]};</script>
