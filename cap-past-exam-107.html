r years. Now ______ must be taken to stop this.", "options": ["action", "chances", "exercise", "notes"], "answer": 0, "answerLabel": "A", "source": "107 會考｜單題｜第 12 題", "explanation": "要阻止工廠往河裡丟垃圾，必須「採取行動」：take action。", "explanationSource": "own", "section": "單題"}, {"id": 13, "question": "第 13 題　The beach party tonight ______ the end of our summer vacation. Tomorrow we are all going back home and getting ready for school.", "options": ["changes", "marks", "passes", "saves"], "answer": 1, "answerLabel": "B", "source": "107 會考｜單題｜第 13 題", "explanation": "今晚的海灘派對「標誌著」暑假結束：mark（標示、象徵）。", "explanationSource": "own", "section": "單題"}, {"id": 14, "question": "第 14 題　Anyone who reads Loren’s business plan will quickly see some serious problems in it, or ______ feel something is not right.", "options": ["at least", "even", "in fact", "still"], "answer": 0, "answerLabel": "A", "source": "107 會考｜單題｜第 14 題", "explanation": "大家很快會看出問題，「至少」也會覺得不對勁：at least。", "explanationSource": "own", "section": "單題"}, {"id": 15, "question": "第 15 題　I’ve wanted to read The Diary of a Young Girl for months, ______ today I finally borrowed the book from the library.", "options": ["and", "since", "so", "until"], "answer": 0, "answerLabel": "A", "source": "107 會考｜單題｜第 15 題", "explanation": "想讀這本書好幾個月，「而」今天終於借到了；表示順接用 and。", "explanationSource": "own", "section": "單題"}, {"id": 16, "question": "【克漏字 第 16–18 題】\nRobert likes to take a walk in the park after work. One day when he was walking in the park, he heard a woman calling his name. He stopped to look around, but didn’t see anything __16__. Shortly after Robert saw it, it was gone.\nThough Robert felt a little strange, he did not think about it too much and sat down for a rest on a bench in the park. Then he noticed the snake he had just seen __17__. Robert was too afraid to move away from the bench. Right at this moment, a woman behind him shouted, “Come here, Robert. You can’t stay on the bench like that. __18__.”\nIn surprise, Robert turned around and said to the woman, “Excuse me, but that’s not a very nice thing to say, and in fact some people say I’m handsome.”\n“I’m not talking to you,” said the woman. “I’m telling Robert, my pet snake, to get down from the bench, not you.”\n\n▶ 第 16 題　請選出 __16__ 的最佳答案", "options": ["like a snake", "that could move", "except a little snake", "that could make noise"], "answer": 2, "answerLabel": "C", "source": "107 會考｜克漏字｜第 16 題", "explanation": "後句說 Shortly after Robert saw it, it was gone，且下段提到 the snake he had just seen，所以他「除了一條小蛇」什麼都沒看到。", "explanationSource": "own", "section": "克漏字"}, {"id": 17, "question": "【克漏字 第 16–18 題】\nRobert likes to take a walk in the park after work. One day when he was walking in the park, he heard a woman calling his name. He stopped to look around, but didn’t see anything __16__. Shortly after Robert saw it, it was gone.\nThough Robert felt a little strange, he did not think about it too much and sat down for a rest on a bench in the park. Then he noticed the snake he had just seen __17__. Robert was too afraid to move away from the bench. Right at this moment, a woman behind him shouted, “Come here, Robert. You can’t stay on the bench like that. __18__.”\nIn surprise, Robert turned around and said to the woman, “Excuse me, but that’s not a very nice thing to say, and in fact some people say I’m handsome.”\n“I’m not talking to you,” said the woman. “I’m telling Robert, my pet snake, to get down from the bench, not you.”\n\n▶ 第 17 題　請選出 __17__ 的最佳答案", "options": ["climbing up the bench", "running after a woman", "stopping beside his feet", "falling down from a tree"], "answer": 0, "answerLabel": "A", "source": "107 會考｜克漏字｜第 17 題", "explanation": "他嚇得不敢離開長椅，最後女子叫蛇「從長椅上下來」，可知蛇正「爬上長椅」。", "explanationSource": "own", "section": "克漏字"}, {"id": 18, "question": "【克漏字 第 16–18 題】\nRobert likes to take a walk in the park after work. One day when he was walking in the park, he heard a woman calling his name. He stopped to look around, but didn’t see anything __16__. Shortly after Robert saw it, it was gone.\nThough Robert felt a little strange, he did not think about it too much and sat down for a rest on a bench in the park. Then he noticed the snake he had just seen __17__. Robert was too afraid to move away from the bench. Right at this moment, a woman behind him shouted, “Come here, Robert. You can’t stay on the bench like that. __18__.”\nIn surprise, Robert turned around and said to the woman, “Excuse me, but that’s not a very nice thing to say, and in fact some people say I’m handsome.”\n“I’m not talking to you,” said the woman. “I’m telling Robert, my pet snake, to get down from the bench, not you.”\n\n▶ 第 18 題　請選出 __18__ 的最佳答案", "options": ["The bench is broken", "The seat has been taken", "People will be scared by you", "The paint of the bench is still wet"], "answer": 2, "answerLabel": "C", "source": "107 會考｜克漏字｜第 18 題", "explanation": "Robert 回答「這話不太好聽，有人說我很帥」，表示他以為女子說「別人會被你嚇到」。", "explanationSource": "own", "section": "克漏字"}, {"id": 19, "question": "【克漏字 第 19–21 題】\nIf you cannot live without your car, Zurich might be the last city you would like to visit. In Zurich, people are welcome, but cars are not! Over the past 20 years, this city has used smart ways __19__. One is to keep the same total number of parking spaces. For example, if 50 new parking spaces are built in one part of the city, then 50 old spaces in other parts are taken away for other uses. So the total number does not change. Some are unhappy that there are never enough spaces. That is just what the city has in mind: If people find parking more difficult, they will drive less.\n__20__, the total number of cars in the city is counted. Over 3,500 little computers are put under Zurich roads to check the number of cars that enter the city. If the number is higher than the city can deal with, the traffic lights on the roads that enter the city will be kept red. So drivers who are traveling into Zurich have to stop and wait until there  cars are not! Over the past 20 years, this city has used smart ways __19__. One is to keep the same total number of parking spaces. For example, if 50 new parking spaces are built in one part of the city, then 50 old spaces in other parts are taken away for other uses. So the total number does not change. Some are unhappy that there are never enough spaces. That is just what the city has in mind: If people find parking more difficult, they will drive less.\n__20__, the total number of cars in the city is counted. Over 3,500 little computers are put under Zurich roads to check the number of cars that enter the city. If the number is higher than the city can deal with, the traffic lights on the roads that enter the city will be kept red. So drivers who are traveling into Zurich have to stop and wait until there are fewer cars in the city. Now, you may wonder __21__. The answer is simple: The city wants to make more space for its people.\n\n▶ 第 21 題　請選出 __21__ 的最佳答案", "options": ["why Zurich is doing this", "what all this has cost Zurich", "if Zurich should try other ways", "if Zurich can deal with angry drivers"], "answer": 0, "answerLabel": "A", "source": "107 會考｜克漏字｜第 21 題", "explanation": "後句 The answer is simple: 要為市民多留空間，回答的是「為什麼這樣做」。", "explanationSource": "own", "section": "克漏字"}]};window.CAP_IMG={"第 1 題　Look at the picture. The girl is ______ the clothes.": "assets/cap-past-exams/cap107-q1.png?v=20261119-1"};</script><script src="longteng-b1u5-quiz.js?v=20261106-3"></script><script>(function(){var M=window.CAP_IMG||{};var qn=document.getElementById('question');if(!qn)return;function put(){var old=document.getElementById('capImg');var t=qn.textContent;var src=M[t];if(old&&old.dataset.src===src)return;if(old)old.remove();if(!src)return;var im=document.createElement('img');im.id='capImg';im.dataset.src=src;im.src=src;im.alt='題目圖片';im.style.cssText='display:block;max-width:100%;max-height:420px;margin:10px auto;border:1px solid #dbe3ee;border-radius:10px;backgrou
