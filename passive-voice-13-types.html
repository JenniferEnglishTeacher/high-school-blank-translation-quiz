</style></head><body><main class="wrap"><section class="hero"><h1>Passive Voice Practice｜13 Types</h1><p>13 種被動語態句型｜每一大題 25 題｜共 325 題</p><p class="muted">依附件原題與答案｜只填動詞部分｜逐題即時批改｜答錯重填｜答對後完整句播放＋選做 STT｜錯題 DOCX</p><div class="toolbar"><a class="btn" href="dashboard.html">← 回測驗總覽</a></div></section><section id="select" class="card"><h2>選擇被動語態大題</h2><div id="groups" class="grid"></div></section><section id="quiz" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="active" class="active"></div><div id="question" class="question"></div><div id="answerArea" class="answer-row"></div><div id="feedback" class="feedback hidden"></div><div id="reference" class="reference hidden"></div><div id="voiceBox" class="voicebox hidden"><h3>🎙️ Pronunciation Check（選做）</h3><p>先聽完整句子，再按麥克風朗讀；朗讀評分不影響下一題。</p><p><b id="voiceTarget"></b></p><div class="toolbar"><button id="speak" class="btn voice">🔊 再聽一次</button><button id="mic" class="btn primary">🎤 開始朗讀評分</button></div><div id="voiceResult" class="voice-result">尚未進行朗讀評分。</div></div><div class="actions"><button id="check" class="btn primary">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束本輪</button></div></section><section id="result" class="card hidden"><h2>練習結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="download" class="btn primary">下載錯題 DOCX</button><button id="back" class="btn">選擇其他大題</button><button id="restart" class="btn">重新開始</button></div></section></main><script>
const DATA={"title":"Passive Voice Practice｜13 Types","subtitle":"13 種被動語態句型｜共 325 題｜依附件原題與答案","groups":[{"title":"Type 1｜Present Simple：am / is / are + p.p.","items":[{"id":"1-1","number":1,"active":"Our town holds a big Halloween event once a year.","prompt":"A big Halloween event _____ (hold) by our town once a year.","answer":"is held","accepted":["is held"],"sentence":"A big Halloween event is held by our town once a year."},{"id":"1-2","number":2,"active":"Farmers chase the crows away from the fields every morning.","prompt":"The crows _____ (chase) away from the fields by farmers every morning.","answer":"are chased","accepted":["are chased"],"sentence":"The crows are chased away from the fields by farmers every morning."},{"id":"1-3","number":3,"active":"Most people consider Halloween a fun holiday.","prompt":"Halloween _____ (consider) a fun holiday by most people.","answer":"is considered","accepted":["is considered"],"sentence":"Halloween is considered a fun holiday by most people."},{"id":"1-4","number":4,"active":"The students don't give in their homework on time.","prompt":"The homework _____ (not give in) on time.","answer":"isn't given in","accepted":["isn't given in"],"sentence":"The homework isn't given in on time."},{"id":"1-5","number":5,"active":"Does the hen hatch the eggs twice a year?","prompt":"_____ the eggs _____ (hatch) by the hen twice a year?","answer":"Are / hatched","accepted":["Are / hatched"],"sentence":"Are the eggs hatched by the hen twice a year?"},{"id":"1-6","number":6,"active":"The workers check the old bridge twice a year.","prompt":"The old bridge _____ (check) by the workers twice a year.","answer":"is checked","accepted":["is checked"],"sentence":"The old bridge is checked by the workers twice a year."},{"id":"1-7","number":7,"active":"Kids don't damage the library books.","prompt":"The library books _____ (not damage) by kids.","answer":"aren't damaged","accepted":["aren't damaged"],"sentence":"The library books aren't damaged by kids."},{"id":"1-8","number":8,"active":"Do people celebrate this tradition every October?","prompt":"_____ this tradition _____ (celebrate) every October?","answer":"Is / celebrated","accepted":["Is / celebrated"],"sentence":"Is this tradition celebrated every October?"},{"id":"1-9","number":9,"active":"The museum releases butterflies into the garden once a year.","prompt":"Butterflies _____ (release) into the garden by the museum once a year.","answer":"are released","accepted":["are released"],"sentence":"Butterflies are released into the garden by the museum once a year."},{"id":"1-10","number":10,"active":"The club doesn't make traditional lanterns anymore.","prompt":"Traditional lanterns _____ (not make) by the club anymore.","answer":"aren't made","accepted":["aren't made"],"sentence":"Traditional lanterns aren't made by the club anymore."},{"id":"1-11","number":11,"active":"Does the school open the back entrance on weekends?","prompt":"_____ the back entrance _____ (open) on weekends?","answer":"Is / opened","accepted":["Is / opened"],"sentence":"Is the back entrance opened on weekends?"},{"id":"1-12","number":12,"active":"The students elect a new class president once a year.","prompt":"A new class president _____ (elect) by the students once a year.","answer":"is elected","accepted":["is elected"],"sentence":"A new class president is elected by the students once a year."},{"id":"1-13","number":13,"active":"People don't eat these insects in Taiwan.","prompt":"These insects _____ (not eat) in Taiwan.","answer":"aren't eaten","accepted":["aren't eaten"],"sentence":"These insects aren't eaten in Taiwan."},{"id":"1-14","number":14,"active":"Does the school mount an art show twice a year?","prompt":"_____ an art show _____ (mount) by the school twice a year?","answer":"Is / mounted","accepted":["Is / mounted"],"sentence":"Is an art show mounted by the school twice a year?"},{"id":"1-15","number":15,"active":"Great teachers inspire many students.","prompt":"Many students _____ (inspire) by great teachers.","answer":"are inspired","accepted":["are inspired"],"sentence":"Many students are inspired by great teachers."},{"id":"1-16","number":16,"active":"The shop doesn't sell ordinary candy on Halloween.","prompt":"Ordinary candy _____ (not sell) by the shop on Halloween.","answer":"isn't sold","accepted":["isn't sold"],"sentence":"Ordinary candy isn't sold by the shop on Halloween."},{"id":"1-17","number":17,"active":"Do the teachers make the free tickets available online?","prompt":"_____ the free tickets _____ (make) available online?","answer":"Are / made","accepted":["Are / made"],"sentence":"Are the free tickets made available online?"},{"id":"1-18","number":18,"active":"Mom cleans the front entrance once a week.","prompt":"The front entrance _____ (clean) by Mom once a week.","answer":"is cleaned","accepted":["is cleaned"],"sentence":"The front entrance is cleaned by Mom once a week."},{"id":"1-19","number":19,"active":"The city doesn't repair the bridge every year.","prompt":"The bridge _____ (not repair) every year.","answer":"isn't repaired","accepted":["isn't repaired"],"sentence":"The bridge isn't repaired every year."},{"id":"1-20","number":20,"active":"Does the singer release a new album once a year?","prompt":"_____ a new album _____ (release) by the singer once a year?","answer":"Is / released","accepted":["Is / released"],"sentence":"Is a new album released by the singer once a year?"},{"id":"1-21","number":21,"active":"The coach teaches balance exercises twice a week.","prompt":"Balance exercises _____ (teach) by the coach twice a week.","answer":"are taught","accepted":["are taught"],"sentence":"Balance exercises are taught by the coach twice a week."},{"id":"1-22","number":22,"active":"Strong winds don't damage these houses.","prompt":"These houses _____ (not damage) by strong winds.","answer":"aren't damaged","accepted":["aren't damaged"],"sentence":"These houses aren't damaged by strong winds."},{"id":"1-23","number":23,"active":"Do people consider him a good president?","prompt":"_____ he _____ (consider) a good president?","answer":"Is / considered","accepted":["Is / considered"],"sentence":"Is he considered a good president?"},{"id":"1-24","number":24,"active":"Children chase the ducks in the park every Sunday.","prompt":"The ducks _____ (chase) by children in the park every Sunday.","answer":"are chased","accepted":["are chased"],"sentence":"The ducks are chased by children in the park every Sunday."},{"id":"1-25","number":25,"active":"Do students give in their reports twice a semester?","prompt":"_____ the reports _____ (give in) twice a semester?","answer":"Are / given in","accepted":["Are / given in"],"sentence":"Are the reports given in twice a semester?"}]},{"title":"Type 2｜Past Simple：was / were + p.p.","items":[{"id":"2-1","number":1,"active":"Edison invented the light bulb.","prompt":"The light bulb _____ (invent) by Edison.","answer":"was invented","accepted":["was invented"],"sentence":"The light bulb was invented by Edison."},{"id":"2-2","number":2,"active":"A big dog chased the cat last night.","prompt":"The cat _____ (chase) by a big dog last night.","answer":"was chased","accepted":["was chased"],"sentence":"The cat was chased by a big dog last night."},{"id":"2-3","number":3,"active":"The typhoon damaged the old bridge last summer.","prompt":"The old bridge _____ (damage) by the typhoon last summer.","answer":"was damaged","accepted":["was damaged"],"sentence":"The old bridge was damaged by the typhoon last summer."},{"id":"2-4","number":4,"active":"The students didn't give in their homework yesterday.","prompt":"The homework _____ (not give in) yesterday.","answer":"wasn't given in","accepted":["wasn't given in"],"sentence":"The homework wasn't given in yesterday."},{"id":"2-5","number":5,"active":"Did the zoo release the birds last week?","prompt":"_____ the birds _____ (release) last week?","answer":"Were / released","accepted":["Were / released"],"sentence":"Were the birds released last week?"},{"id":"2-6","number":6,"active":"The hen hatched five chicks last Monday.","prompt":"Five chicks _____ (hatch) by the hen last Monday.","answer":"were hatched","accepted":["were hatched"],"sentence":"Five chicks were hatched by the hen last Monday."},{"id":"2-7","number":7,"active":"The people didn't choose him as president.","prompt":"He _____ (not choose) as president.","answer":"wasn't chosen","accepted":["wasn't chosen"],"sentence":"He wasn't chosen as president."},{"id":"2-8","number":8,"active":"Did the school hold the Halloween event last Friday?","prompt":"_____ the Halloween event _____ (hold) last Friday?","answer":"Was / held","accepted":["Was / held"],"sentence":"Was the Halloween event held last Friday?"},{"id":"2-9","number":9,"active":"The guards mounted a camera above the entrance.","prompt":"A camera _____ (mount) above the entrance by the guards.","answer":"was mounted","accepted":["was mounted"],"sentence":"A camera was mounted above the entrance by the guards."},{"id":"2-10","number":10,"active":"Nobody considered my idea at the meeting.","prompt":"My idea _____ (not consider) at the meeting.","answer":"wasn't considered","accepted":["wasn't considered"],"sentence":"My idea wasn't considered at the meeting."},{"id":"2-11","number":11,"active":"Did a famous artist inspire the song?","prompt":"_____ the song _____ (inspire) by a famous artist?","answer":"Was / inspired","accepted":["Was / inspired"],"sentence":"Was the song inspired by a famous artist?"},{"id":"2-12","number":12,"active":"Our grandparents started this tradition long ago.","prompt":"This tradition _____ (start) by our grandparents long ago.","answer":"was started","accepted":["was started"],"sentence":"This tradition was started by our grandparents long ago."},{"id":"2-13","number":13,"active":"The workers didn't build the bridge in 2020.","prompt":"The bridge _____ (not build) in 2020.","answer":"wasn't built","accepted":["wasn't built"],"sentence":"The bridge wasn't built in 2020."},{"id":"2-14","number":14,"active":"The scientist found a rare insect in the forest.","prompt":"A rare insect _____ (find) in the forest by the scientist.","answer":"was found","accepted":["was found"],"sentence":"A rare insect was found in the forest by the scientist."},{"id":"2-15","number":15,"active":"Did the company release the game last month?","prompt":"_____ the game _____ (release) last month?","answer":"Was / released","accepted":["Was / released"],"sentence":"Was the game released last month?"},{"id":"2-16","number":16,"active":"The fire damaged three traditional houses.","prompt":"Three traditional houses _____ (damage) by the fire.","answer":"were damaged","accepted":["were damaged"],"sentence":"Three traditional houses were damaged by the fire."},{"id":"2-17","number":17,"active":"The shop didn't make the tickets available online.","prompt":"The tickets _____ (not make) available online.","answer":"weren't made","accepted":["weren't made"],"sentence":"The tickets weren't made available online."},{"id":"2-18","number":18,"active":"Did the police chase the thief down the street?","prompt":"_____ the thief _____ (chase) down the street by the police?","answer":"Was / chased","accepted":["Was / chased"],"sentence":"Was the thief chased down the street by the police?"},{"id":"2-19","number":19,"active":"The class president gave a speech yesterday.","prompt":"A speech _____ (give) by the class president yesterday.","answer":"was given","accepted":["was given"],"sentence":"A speech was given by the class president yesterday."},{"id":"2-20","number":20,"active":"The children didn't break the ordinary cups.","prompt":"The ordinary cups _____ (not break) by the children.","answer":"weren't broken","accepted":["weren't broken"],"sentence":"The ordinary cups weren't broken by the children."},{"id":"2-21","number":21,"active":"Did the Wright brothers invent the airplane?","prompt":"_____ the airplane _____ (invent) by the Wright brothers?","answer":"Was / invented","accepted":["Was / invented"],"sentence":"Was the airplane invented by the Wright brothers?"},{"id":"2-22","number":22,"active":"The coach didn't teach balance skills last term.","prompt":"Balance skills _____ (not teach) last term.","answer":"weren't taught","accepted":["weren't taught"],"sentence":"Balance skills weren't taught last term."},{"id":"2-23","number":23,"active":"Did the hikers mount the horses at the entrance?","prompt":"_____ the horses _____ (mount) by the hikers at the entrance?","answer":"Were / mounted","accepted":["Were / mounted"],"sentence":"Were the horses mounted by the hikers at the entrance?"},{"id":"2-24","number":24,"active":"Her story inspired the whole class.","prompt":"The whole class _____ (inspire) by her story.","answer":"was inspired","accepted":["was inspired"],"sentence":"The whole class was inspired by her story."},{"id":"2-25","number":25,"active":"The students gave in the forms last Monday.","prompt":"The forms _____ (give in) last Monday.","answer":"were given in","accepted":["were given in"],"sentence":"The forms were given in last Monday."}]},{"title":"Type 3｜Future Simple：will be + p.p.","items":[{"id":"3-1","number":1,"active":"The school will hold a Halloween event next Friday.","prompt":"A Halloween event _____ (hold) by the school next Friday.","answer":"will be held","accepted":["will be held"],"sentence":"A Halloween event will be held by the school next Friday."},{"id":"3-2","number":2,"active":"The zoo will release the baby turtles tomorrow.","prompt":"The baby turtles _____ (release) tomorrow.","answer":"will be released","accepted":["will be released"],"sentence":"The baby turtles will be released tomorrow."},{"id":"3-3","number":3,"active":"The workers won't repair the bridge this year.","prompt":"The bridge _____ (not repair) this year.","answer":"won't be repaired","accepted":["won't be repaired"],"sentence":"The bridge won't be repaired this year."},{"id":"3-4","number":4,"active":"Will the hen hatch the eggs next week?","prompt":"_____ the eggs _____ (hatch) next week?","answer":"Will / be hatched","accepted":["Will / be hatched"],"sentence":"Will the eggs be hatched next week?"},{"id":"3-5","number":5,"active":"The teacher will consider your idea.","prompt":"Your idea _____ (consider) by the teacher.","answer":"will be considered","accepted":["will be considered"],"sentence":"Your idea will be considered by the teacher."},{"id":"3-6","number":6,"active":"Students will give in their essays on Monday.","prompt":"The essays _____ (give in) on Monday.","answer":"will be given in","accepted":["will be given in"],"sentence":"The essays will be given in on Monday."},{"id":"3-7","number":7,"active":"The heavy rain won't damage the crops.","prompt":"The crops _____ (not damage) by the heavy rain.","answer":"won't be damaged","accepted":["won't be damaged"],"sentence":"The crops won't be damaged by the heavy rain."},{"id":"3-8","number":8,"active":"Will people elect a new president next year?","prompt":"_____ a new president _____ (elect) next year?","answer":"Will / be elected","accepted":["Will / be elected"],"sentence":"Will a new president be elected next year?"},{"id":"3-9","number":9,"active":"The museum will mount a new show in May.","prompt":"A new show _____ (mount) by the museum in May.","answer":"will be mounted","accepted":["will be mounted"],"sentence":"A new show will be mounted by the museum in May."},{"id":"3-10","number":10,"active":"We won't forget this tradition.","prompt":"This tradition _____ (not forget).","answer":"won't be forgotten","accepted":["won't be forgotten"],"sentence":"This tradition won't be forgotten."},{"id":"3-11","number":11,"active":"Will the band release a new song soon?","prompt":"_____ a new song _____ (release) by the band soon?","answer":"Will / be released","accepted":["Will / be released"],"sentence":"Will a new song be released by the band soon?"},{"id":"3-12","number":12,"active":"Someone will invent a flying car one day.","prompt":"A flying car _____ (invent) one day.","answer":"will be invented","accepted":["will be invented"],"sentence":"A flying car will be invented one day."},{"id":"3-13","number":13,"active":"The shop will make the masks available next week.","prompt":"The masks _____ (make) available next week.","answer":"will be made","accepted":["will be made"],"sentence":"The masks will be made available next week."},{"id":"3-14","number":14,"active":"They won't serve traditional food at the party.","prompt":"Traditional food _____ (not serve) at the party.","answer":"won't be served","accepted":["won't be served"],"sentence":"Traditional food won't be served at the party."},{"id":"3-15","number":15,"active":"Will the guards lock the main entrance at night?","prompt":"_____ the main entrance _____ (lock) at night?","answer":"Will / be locked","accepted":["Will / be locked"],"sentence":"Will the main entrance be locked at night?"},{"id":"3-16","number":16,"active":"Her speech will inspire many young people.","prompt":"Many young people _____ (inspire) by her speech.","answer":"will be inspired","accepted":["will be inspired"],"sentence":"Many young people will be inspired by her speech."},{"id":"3-17","number":17,"active":"The dogs won't chase the sheep.","prompt":"The sheep _____ (not chase) by the dogs.","answer":"won't be chased","accepted":["won't be chased"],"sentence":"The sheep won't be chased by the dogs."},{"id":"3-18","number":18,"active":"Will the students study the insects in class?","prompt":"_____ the insects _____ (study) in class?","answer":"Will / be studied","accepted":["Will / be studied"],"sentence":"Will the insects be studied in class?"},{"id":"3-19","number":19,"active":"The coach will test our balance tomorrow.","prompt":"Our balance _____ (test) by the coach tomorrow.","answer":"will be tested","accepted":["will be tested"],"sentence":"Our balance will be tested by the coach tomorrow."},{"id":"3-20","number":20,"active":"They won't use ordinary paper for the posters.","prompt":"Ordinary paper _____ (not use) for the posters.","answer":"won't be used","accepted":["won't be used"],"sentence":"Ordinary paper won't be used for the posters."},{"id":"3-21","number":21,"active":"Will the storm damage the bridge?","prompt":"_____ the bridge _____ (damage) by the storm?","answer":"Will / be damaged","accepted":["Will / be damaged"],"sentence":"Will the bridge be damaged by the storm?"},{"id":"3-22","number":22,"active":"The workers will mount a TV on the wall.","prompt":"A TV _____ (mount) on the wall by the workers.","answer":"will be mounted","accepted":["will be mounted"],"sentence":"A TV will be mounted on the wall by the workers."},{"id":"3-23","number":23,"active":"We won't give in the project until Friday.","prompt":"The project _____ (not give in) until Friday.","answer":"won't be given in","accepted":["won't be given in"],"sentence":"The project won't be given in until Friday."},{"id":"3-24","number":24,"active":"Will the police chase the robbers?","prompt":"_____ the robbers _____ (chase) by the police?","answer":"Will / be chased","accepted":["Will / be chased"],"sentence":"Will the robbers be chased by the police?"},{"id":"3-25","number":25,"active":"The class will choose a new class president.","prompt":"A new class president _____ (choose) by the class.","answer":"will be chosen","accepted":["will be chosen"],"sentence":"A new class president will be chosen by the class."}]},{"title":"Type 4｜Present Continuous：am / is / are being + p.p.","items":[{"id":"4-1","number":1,"active":"Look! The dog is chasing the cat.","prompt":"Look! The cat _____ (chase) by the dog.","answer":"is being chased","accepted":["is being chased"],"sentence":"Look! The cat is being chased by the dog."},{"id":"4-2","number":2,"active":"The workers are repairing the bridge now.","prompt":"The bridge _____ (repair) now.","answer":"is being repaired","accepted":["is being repaired"
