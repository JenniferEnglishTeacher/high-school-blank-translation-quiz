<script>window.QUIZ_CONFIG={"title": "國中會考文法歷屆試題｜主動與被動語態", "mode": "mcq", "questions": [{"id": 1, "question": "The police haven't found the little girl who ______ at a supermarket. They'll keep doing all they can to find her.", "options": ["took away", "taken away", "has taken away", "was taken away"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜過去式被動 was taken away", "explanation": "【句型】S ＋ was/were ＋ p.p.，過去式被動語態。\n【分析】先行詞 the little girl 是「被帶走」的人，且是在超市發生的過去事件，用過去式被動 was taken away。\n【其他選項】(A) took away 是主動，表示女孩帶走別人；(B) taken away 缺 be 動詞；(C) has taken away 是主動完成式，語意與結構都不對。\n【例句】The wallet was stolen on the bus yesterday.", "explanationSource": "source"}, {"id": 2, "question": "The window ______ by the strong wind last night.", "options": ["broke", "was broken", "has broken", "breaking"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 1 題）", "explanation": "窗戶是被風打破，過去被動 was broken。", "explanationSource": "supplemental"}, {"id": 3, "question": "The man who ______ in the car accident is now in the hospital.", "options": ["hurt", "has hurt", "was hurt", "hurting"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 1 題）", "explanation": "人是受傷的一方，用被動 was hurt。", "explanationSource": "supplemental"}, {"id": 4, "question": "This old temple ______ more than two hundred years ago.", "options": ["was built", "built", "has built", "was building"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 1 題）", "explanation": "寺廟是被建造的，過去被動 was built。", "explanationSource": "supplemental"}, {"id": 5, "question": "The housework in Mr. and Mrs. Wang's family ______ between them and their kids. Everyone's got their own job to do.", "options": ["is shared", "are shared", "shares", "share"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜被動語態 單數主詞 is p.p.", "explanation": "【句型】S（物）+ be + p.p. 被動語態；be 動詞依主詞單複數。\n【分析】家事是「被分擔」的 → 被動；主詞是 The housework（不可數，單數），in Mr. and Mrs. Wang's family 只是修飾語 → is shared。\n【其他選項】(B) are 誤把 Mr. and Mrs. Wang 當主詞；(C)(D) 主動語態，家事不會自己分擔。\n【例句】The cake was cut into eight pieces.", "explanationSource": "source"}, {"id": 6, "question": "English ______ in many countries around the world.", "options": ["speaks", "is spoken", "are spoken", "speaking"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 5 題）", "explanation": "英語是「被說」的，主詞單數用 is spoken。", "explanationSource": "supplemental"}, {"id": 7, "question": "The classroom ______ by the students every afternoon.", "options": ["cleans", "is cleaning", "is cleaned", "are cleaned"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 5 題）", "explanation": "教室被學生打掃，主詞單數、現在習慣用 is cleaned。", "explanationSource": "supplemental"}, {"id": 8, "question": "The money in the boxes ______ to help poor children.", "options": ["is used", "are used", "uses", "use"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 5 題）", "explanation": "主詞是不可數名詞 The money（in the boxes 為修飾語），被動用 is used。", "explanationSource": "supplemental"}, {"id": 9, "question": "Many famous people visit this restaurant. Popular singers like A-mei and Jay Chou ______ here with their friends.", "options": ["to be often seen", "often seen", "are often seen", "and are often seen"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜被動語態 are often seen（頻率副詞位置）", "explanation": "【句型】S + be + (頻率副詞) + p.p. 被動語態。\n【分析】歌手們「常被看到」在這裡 → 被動；主詞 Popular singers 複數，且句子缺主要動詞 → are often seen。\n【其他選項】(A) 不定詞不能當主要動詞；(B) 少了 be 動詞；(D) 多了連接詞 and，前面沒有可並列的動詞。\n【例句】This song is often heard on the radio.", "explanationSource": "source"}, {"id": 10, "question": "Chinese New Year is a big holiday in Taiwan. Red envelopes ______ to children at this time.", "options": ["give", "giving", "are given", "to be given"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 9 題）", "explanation": "紅包是「被給」的，主詞複數，用 are given 當主要動詞。", "explanationSource": "supplemental"}, {"id": 11, "question": "The park is very clean. Trash ______ on the ground.", "options": ["is seldom found", "seldom finds", "to be seldom found", "seldom found"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 9 題）", "explanation": "垃圾「很少被發現」→ 被動 is seldom found，頻率副詞放 be 動詞後。", "explanationSource": "supplemental"}, {"id": 12, "question": "Many famous paintings ______ in this museum.", "options": ["show", "are shown", "showing", "and are shown"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 9 題）", "explanation": "畫作被展示 → 被動 are shown，句中需主要動詞。", "explanationSource": "supplemental"}, {"id": 13, "question": "Susan: Oh, no! The door and the window ______!\nVictor: Who could have done this?\nSusan: Go in quickly and see if we've lost anything.", "options": ["are breaking", "have broken", "were broken", "will break"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜過去式被動 were broken", "explanation": "【句型】S（物）+ was/were + p.p. 過去式被動。\n【分析】Who could have done this?「是誰做的？」表示門窗是「被人破壞」的，且已經發生；主詞 The door and the window 複數 → were broken。\n【其他選項】(A) 進行式表示正在自己破掉，與「誰做的」不合；(B) 主動語態，門窗自己弄破了某物，語意不通；(D) 未來式不合已發生的情況。\n【例句】The cups were broken by the cat last night.", "explanationSource": "source"}, {"id": 14, "question": "The window ______ by a baseball yesterday.", "options": ["broke", "was broken", "has broken", "is breaking"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 13 題）", "explanation": "by a baseball 與 yesterday 顯示過去式被動 was broken。", "explanationSource": "supplemental"}, {"id": 15, "question": "My bike ______ last night. I had to walk to school today.", "options": ["stole", "has stolen", "was stolen", "is stealing"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 13 題）", "explanation": "腳踏車是「被偷」的，昨晚發生 → was stolen。", "explanationSource": "supplemental"}, {"id": 16, "question": "Lucy: Where's the cake?\nMax: Sorry, it ______ by my little brother an hour ago.", "options": ["was eaten", "ate", "has eaten", "eats"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 13 題）", "explanation": "蛋糕被吃掉，an hour ago 用過去式被動 was eaten。", "explanationSource": "supplemental"}, {"id": 17, "question": "My dog Jimmy loves ______ with a comb. Every time I comb his hair, he will close his eyes and fall asleep.", "options": ["to brush", "brushing", "to be brushing", "being brushed"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜動名詞被動 being p.p.（love + being p.p.）", "explanation": "【句型】love + Ving / to V；被動時為 love + being p.p. / to be p.p.。\n【分析】狗是「被梳毛」的一方（Every time I comb his hair），要用被動 → being brushed。\n【其他選項】(A)(B) 主動，表示狗去梳別的東西；(C) to be brushing 是進行式，仍為主動語意。\n【例句】Most kids don't like being told what to do.", "explanationSource": "source"}, {"id": 18, "question": "Babies like ______ by their parents.", "options": ["holding", "to hold", "being held", "held"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 17 題）", "explanation": "嬰兒是「被抱」的，like 後接動名詞被動 being held。", "explanationSource": "supplemental"}, {"id": 19, "question": "Nobody enjoys ______ at in public.", "options": ["laughing", "being laughed", "to laugh", "laughed"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 17 題）", "explanation": "enjoy 後接 Ving，「被嘲笑」用被動 being laughed at。", "explanationSource": "supplemental"}, {"id": 20, "question": "My little sister hates ______ to bed early on weekends.", "options": ["being sent", "sending", "to send", "sent"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 17 題）", "explanation": "妹妹是「被送去睡覺」的，用 being sent。", "explanationSource": "supplemental"}, {"id": 21, "question": "A new road is going to ______ in town because traffic is getting busier and busier.", "options": ["build", "building", "be built", "have built"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜be going to + be p.p.", "explanation": "【句型】S（物）+ be going to + be + p.p. 未來式被動。\n【分析】新的道路是「被建造」的 → 被動；is going to 後接原形 be → be built。\n【其他選項】(A) build 主動，路不會自己蓋；(B) going to 的 to 是不定詞，後不接 Ving；(D) have built 為主動完成式。\n【例句】A new library is going to be opened next year.", "explanationSource": "source"}, {"id": 22, "question": "The science report must ______ by Friday.", "options": ["finish", "be finished", "finishing", "have finished"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 21 題）", "explanation": "報告「被完成」，助動詞 must 後接 be + p.p.。", "explanationSource": "supplemental"}, {"id": 23, "question": "A big concert is going to ______ in the park next Saturday.", "options": ["be held", "hold", "holding", "held"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 21 題）", "explanation": "音樂會「被舉辦」，be going to + be held。", "explanationSource": "supplemental"}, {"id": 24, "question": "Your room should ______ every week.", "options": ["clean", "cleaning", "to clean", "be cleaned"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 21 題）", "explanation": "房間「被打掃」，should + be + p.p.。", "explanationSource": "supplemental"}, {"id": 25, "question": "Most of Jeff's best books ______ when he was sick and poor.", "options": ["have written", "were written", "would write", "wrote"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜過去式被動 were written", "explanation": "【句型】S（物）+ was/were + p.p. 過去式被動。\n【分析】書是「被寫」出來的 → 被動；when he was sick and poor 為過去時間；主詞 Most of Jeff's best books 複數 → were written。\n【其他選項】(A) 主動完成式，且與過去時間 when he was... 不合；(C)(D) 主動語態，書不會自己寫。\n【例句】This song was written by a high school student.", "explanationSource": "source"}, {"id": 26, "question": "This bridge ______ about fifty years ago.", "options": ["built", "has built", "was built", "is built"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 25 題）", "explanation": "橋「被建造」於五十年前 → was built。", "explanationSource": "supplemental"}, {"id": 27, "question": "The new rules ______ to all students yesterday.", "options": ["were explained", "explained", "have explained", "are explaining"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 25 題）", "explanation": "規則「被解釋」，yesterday 用過去式被動 were explained。", "explanationSource": "supplemental"}, {"id": 28, "question": "Most of the old photos ______ by Grandpa when he was young.", "options": ["took", "were taken", "have taken", "would take"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 25 題）", "explanation": "照片「被拍」，by Grandpa、when he was young → were taken。", "explanationSource": "supplemental"}, {"id": 29, "question": "These pictures ______ when we took a trip to Kenting National Park.", "options": ["took", "will take", "were taken", "will be taken"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜過去式被動 were taken", "explanation": "【句型】S（物）+ was/were + p.p. 過去式被動。\n【分析】照片是「被拍」的 → 被動；when we took a trip 為過去 → were taken。\n【其他選項】(A)(B) 主動語態，照片不會自己拍；(D) 未來式被動，與 took 過去時間不合。\n【例句】These cookies were made by my mom.", "explanationSource": "source"}, {"id": 30, "question": "These cookies ______ by my sister last night.", "options": ["baked", "were baked", "will bake", "are baking"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 29 題）", "explanation": "餅乾「被烤」，last night → were baked。", "explanationSource": "supplemental"}, {"id": 31, "question": "The letter ______ to the wrong address last week, so it never arrived.", "options": ["sent", "will send", "is sent", "was sent"], "answer": 3, "answerLabel": "D", "source": "類似題 2（對應第 29 題）", "explanation": "信「被寄」到錯的地址，last week → was sent。", "explanationSource": "supplemental"}, {"id": 32, "question": "The new library ______ next year by the mayor.", "options": ["will be opened", "opened", "was opened", "will open"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 29 題）", "explanation": "by the mayor 表被動，next year 用未來式被動 will be opened。", "explanationSource": "supplemental"}, {"id": 33, "question": "\"Are you dating anyone special now?\" is a question that popular movie stars ______ in an interview.", "options": ["to be often asked", "are often asked", "being often asked", "who are often asked"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜被動語態 ask 雙受詞（be asked + 事物）", "explanation": "【句型】ask + 人 + 問題 → 人 + be asked + 問題（被動）。\n【分析】a question (that) popular movie stars are often asked，明星是「被問」問題的人 → 被動；that 子句需要完整動詞 → are often asked。\n【其他選項】(A)(C) 不定詞、動名詞不能當子句的動詞；(D) who 多餘，that 子句中已有主詞 stars。\n【例句】This is a question students are often asked in job interviews.", "explanationSource": "source"}, {"id": 34, "question": "The students ______ to bring their own cups to school from next week.", "options": ["ask", "asking", "are asked", "to be asked"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 33 題）", "explanation": "學生「被要求」帶杯子 → are asked。", "explanationSource": "supplemental"}, {"id": 35, "question": "Last year, Mr. Chen ______ a prize by the school for his excellent teaching.", "options": ["was given", "gave", "giving", "has given"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 33 題）", "explanation": "by the school 表被動，Mr. Chen「被頒給」獎 → was given + 獎項。", "explanationSource": "supplemental"}, {"id": 36, "question": "This is the gift that every winner ______ by the school after the race.", "options": ["gives", "giving", "who is given", "is given"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 33 題）", "explanation": "that 子句需動詞，得獎者「被給予」禮物 → is given。", "explanationSource": "supplemental"}, {"id": 37, "question": "Alison doesn't like ______ what to do. She only does things she wants to do.", "options": ["told", "to tell", "be told", "to be told"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜like + to be p.p.（被動不定詞）", "explanation": "【句型】like + to V；若主詞是「被」做某事，則用被動不定詞 to be + p.p.。\n【分析】like 後接 to V；Alison 是「被別人告訴」該做什麼，後句 She only does things she wants to do 也說明她不喜歡被指使，所以用被動 to be told。\n【其他選項】(A) told：like 後不直接接過去分詞；(B) to tell 是主動「告訴別人」，語意不對；(C) be told 少了 to。\n【例句】Little kids don't like to be left alone at home.", "explanationSource": "source"}, {"id": 38, "question": "Nobody likes ______ at in front of the whole class.", "options": ["laughing", "to laugh", "to be laughed", "be laughed"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 37 題）", "explanation": "主詞是「被嘲笑」，like 後用被動不定詞 to be laughed (at)。", "explanationSource": "supplemental"}, {"id": 39, "question": "Peter hopes ______ to Mary's birthday party this Saturday.", "options": ["to be invited", "to invite", "inviting", "be invited"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 37 題）", "explanation": "Peter 是「被邀請」，hope 後接 to be invited。", "explanationSource": "supplemental"}, {"id": 40, "question": "This old bridge needs ______ before the typhoon comes.", "options": ["repair", "to be repaired", "to repair", "be repaired"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 37 題）", "explanation": "橋是「被修理」，need 後接被動不定詞 to be repaired。", "explanationSource": "supplemental"}]};</script><script src="longteng-b1u5-quiz.js?v=20261106-3"></script><script>document.querySelector("#description").textContent="共 40 題（會考歷屆＋講義錯題 10 題＋類似題 30 題）｜選答後顯示中文解析｜答錯可重做並下載錯題";</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
