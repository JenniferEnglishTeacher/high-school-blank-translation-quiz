<script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 8｜引導式翻譯","mode":"multi","questions":[{"id":1,"zh":"Tom利用好天氣來油漆籬笆。","question":"Tom ①____________ ②____________ ③____________ the good weather to paint the fence.","answers":["took","advantage","of"],"source":"All in One","explanation":"句意：Tom利用好天氣來油漆籬笆。 本題依序填入：took、advantage、of。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":2,"zh":"這傳奇歌手宣布他即將引退，所以他的死忠粉絲都為了他的告別演唱會正排隊買票。","question":"The legendary singer announced he would retire soon, so his diehard fans are all ①____________ ②____________ to buy tickets for his farewell concert.","answers":["lining","up"],"source":"龍騰自命題","explanation":"line up 排隊。","explanationSource":"source"},{"id":3,"zh":"一些觀光客利用在寒冷山間的短暫停留做了雪人。","question":"Some tourists ①____________ ②____________ ③____________ the brief stop on the cold mountains to build snowmen.","answers":["took","advantage","of"],"source":"龍騰自命題","explanation":"take advantage of sth. 利用。","explanationSource":"source"},{"id":4,"zh":"不管晴雨，忠實的顧客都願意為這家咖啡店有名的鬆餅花超過三十分鐘排隊。","question":"Rain or shine, loyal customers are willing to ①____________ ②____________ for over thirty minutes for the café’s famous pancakes.","answers":["line","up"],"source":"龍騰自命題","explanation":"line up 排隊。","explanationSource":"source"},{"id":5,"zh":"這個週末你應該利用好天氣享受一些戶外活動。","question":"You should ①____________ ②____________ ③____________ the good weather and enjoy some outdoor activities this weekend.","answers":["take","advantage","of"],"source":"習作簿","explanation":"句意：這個週末你應該利用好天氣享受一些戶外活動。 本題依序填入：take、advantage、of。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":6,"zh":"這對夫妻利用了這海邊飯店的設施，像是SPA、泳池以及屋頂酒吧。","question":"The couple ①____________ ②____________ ③____________ the seafront hotel’s facilities, such as the spa, the swimming pool and the rooftop bar.","answers":["took","advantage","of"],"source":"龍騰自命題","explanation":"take advantage of sth. 利用。","explanationSource":"source"},{"id":7,"zh":"這家旅館就在老城區很近的範圍內，所以你可以住在這裡隔天再參觀一些有名的旅遊景點。","question":"The hotel is ①____________ easy ②____________ of the old town, so you can stay here and visit several famous tourist attractions the next day.","answers":["within","reach"],"source":"龍騰自命題","explanation":"within easy reach 很近的距離以內；tourist attractions 旅遊景點。","explanationSource":"source"},{"id":8,"zh":"在這個國家，失業率愈高，暴力行為就變得愈糟糕。","question":"①____________ ②____________ the unemployment rate is, ③____________ ④____________ the violence becomes in this country.","answers":["The","higher","the","worse"],"source":"龍騰自命題","explanation":"the + 比較級 + S + V, the + 比較級 + S + V 表「愈……愈……」。","explanationSource":"source"},{"id":9,"zh":"有時我們看得愈多，能相信的東西就愈少。","question":"Sometimes ①____________ ②____________ we see, ③____________ ④____________ we can believe.","answers":["the","more","the","less"],"source":"龍騰自命題","explanation":"the + 比較級 + S + V, the + 比較級 + S + V 表「愈……愈……」。","explanationSource":"source"},{"id":10,"zh":"雖然外面很熱，但沒有人插隊；所有參觀花卉博覽會的遊客都排著隊進場。","question":"Although it was hot outside, no one cut in line; all the visitors to the flora exhibition ①____________ ②____________ to get in.","answers":["lined","up"],"source":"龍騰自命題","explanation":"line up 排隊。","explanationSource":"source"},{"id":11,"zh":"別把這些色彩繽紛的藥丸放在孩子可以拿得到的地方，否則他們可能會把這些當作是糖果全部吃光。","question":"Do not keep these colorful pills ①____________ arm’s ②____________ of young children, or they may think that they are candy and eat them up.","answers":["within","reach"],"source":"龍騰自命題","explanation":"within arm’s reach 伸手可及的範圍內。","explanationSource":"source"},{"id":12,"zh":"每個在城鎮裡的人都認為我們的棒球隊很有可能會再次在本季贏得冠軍。","question":"Everyone in town thinks that our baseball team ①____________ very ②____________ ③____________ win the championship again this season.","answers":["is","likely","to"],"source":"龍騰自命題","explanation":"be likely to 有可能會。","explanationSource":"source"},{"id":13,"zh":"執行長今早七點半跟各部會的經理開了晨間會議，開始他忙碌的工作天。","question":"The CEO ①____________ ②____________ his busy work day with a morning meeting with the managers from different departments at 7:30 this morning.","answers":["started","off"],"source":"龍騰自命題","explanation":"start off 開始。","explanationSource":"source"},{"id":14,"zh":"這位導師希望他的學生利用即將到來的周末好好準備下星期的段考。","question":"The homeroom teacher hopes that his students can ①____________ ②____________ ③____________ the coming weekend to prepare for next week’s monthly exam.","answers":["take","advantage","of"],"source":"龍騰自命題","explanation":"take advantage of sth. 利用。","explanationSource":"source"},{"id":15,"zh":"護理師把一杯溫開水放在病人伸手可拿得到的範圍內，以便於讓患者喝水。","question":"A nurse put a glass of warm water ①____________ arm’s ②____________ of the patient so he could have a drink.","answers":["within","reach"],"source":"龍騰自命題","explanation":"within arm’s reach 伸手可及的範圍內。","explanationSource":"source"},{"id":16,"zh":"天空開始下雨時，露營的人馬上架起帳篷。","question":"When it started to rain, the campers ①____________ ②____________ their tent immediately.","answers":["set","up"],"source":"課本例句填空","explanation":"句意：天空開始下雨時，露營的人馬上架起帳篷。 本題依序填入：set、up。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":17,"zh":"有些人利用Eva的好心腸，請她幫忙做太多事。","question":"Some people ①____________ ②____________ ③____________ Eva’s kindness by asking her too many favors.","answers":["took","advantage","of"],"source":"課本例句填空","explanation":"句意：有些人利用Eva的好心腸，請她幫忙做太多事。 本題依序填入：took、advantage、of。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":18,"zh":"廣播提醒乘客登機前要排隊。","question":"The announcement reminded passengers to ①____________ ②____________ before they boarded the plane.","answers":["line","up"],"source":"課本例句填空","explanation":"句意：廣播提醒乘客登機前要排隊。 本題依序填入：line、up。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":19,"zh":"父母絕不該把剪刀或其他危險物品放在幼兒伸手可及的地方。","question":"Parents should never leave scissors or other dangerous items ①____________ arm’s ②____________ of their young children.","answers":["within","reach"],"source":"課本例句填空","explanation":"句意：父母絕不該把剪刀或其他危險物品放在幼兒伸手可及的地方。 本題依序填入：within、reach。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":20,"zh":"有了所有球迷的支持，地主隊有可能打敗來賓隊。","question":"The home team ①____________ ②____________ ③____________ beat the visiting team with the support of all their fans.","answers":["is","likely","to"],"source":"課本例句填空","explanation":"句意：有了所有球迷的支持，地主隊有可能打敗來賓隊。 本題依序填入：is、likely、to。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":21,"zh":"有些人在人行道上排隊等公車。","question":"Some people are ①____________ ②____________ on the sidewalk, waiting for the bus.","answers":["lining","up"],"source":"習作簿","explanation":"句意：有些人在人行道上排隊等公車。 本題依序填入：lining、up。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":22,"zh":"他租了一間辦公室，並成立自己的工作室。","question":"He rented an office and ①____________ ②____________ his own studio.","answers":["set","up"],"source":"習作簿","explanation":"句意：他租了一間辦公室，並成立自己的工作室。 本題依序填入：set、up。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":23,"zh":"根據研究，害羞的人可能會有較少的朋友。","question":"According to studies, shy people are ①____________ ②____________ have fewer friends.","answers":["likely","to"],"source":"習作簿","explanation":"句意：根據研究，害羞的人可能會有較少的朋友。 本題依序填入：likely、to。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":24,"zh":"在Larry想要成立公司之前，他將需要有足夠的錢。","question":"Larry will need to have enough money before he thinks about ①____________ ②____________ a company.","answers":["setting","up"],"source":"All in One","explanation":"句意：在Larry想要成立公司之前，他將需要有足夠的錢。 本題依序填入：setting、up。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":25,"zh":"所有乘客排隊以便搭乘一小時後開往高雄的船。","question":"All the passengers ①____________ ②____________ to board the ship to Kaohsiung, which was leaving in an hour.","answers":["lined","up"],"source":"All in One","explanation":"句意：所有乘客排隊以便搭乘一小時後開往高雄的船。 本題依序填入：lined、up。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":26,"zh":"如果你在冬天開始你的旅行，你有可能會看到雪。","question":"①____________ you ②____________ ③____________ your journey in winter, you ④____________ ⑤____________ ⑥____________ ⑦____________ see the snow.","answers":["If","start","off","may","be","able","to"],"source":"三合一學習手冊","explanation":"句意：如果你在冬天開始你的旅行，你有可能會看到雪。 本題依序填入：If、start、off、may、be、able、to。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":27,"zh":"你不需要擔心結果。只要盡力去做就好。","question":"There ①____________ ②____________ ③____________ for you ④____________ ⑤____________ ⑥____________ the results. Just do your best.","answers":["is","no","need","to","worry","about"],"source":"三合一學習手冊","explanation":"句意：你不需要擔心結果。只要盡力去做就好。 本題依序填入：is、no、need、to、worry、about。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":28,"zh":"這位世界知名的歌手在她家附近的小咖啡館展開她的歌唱生涯。","question":"The world-famous singer ①____________ ②____________ her career at a small café near her house.","answers":["started","off"],"source":"三合一學習手冊","explanation":"句意：這位世界知名的歌手在她家附近的小咖啡館展開她的歌唱生涯。 本題依序填入：started、off。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":29,"zh":"Debby住在海邊的旅館，以便她可以從房間陽臺看到美麗的日落。","question":"Debby stayed at a hotel by the beach ①____________ ②____________ she ③____________ ④____________ the beautiful sunset from the balcony of her room.","answers":["so","that","could","see"],"source":"三合一學習手冊","explanation":"句意：Debby住在海邊的旅館，以便她可以從房間陽臺看到美麗的日落。 本題依序填入：so、that、could、see。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":30,"zh":"你會講愈多種語言，就更加認識這個世界。","question":"①____________ ②____________ ③____________ you speak, ④____________ ⑤____________ you know about this world.","answers":["The","more","languages","the","more"],"source":"三合一學習手冊","explanation":"句意：你會講愈多種語言，就更加認識這個世界。 本題依序填入：The、more、languages、the、more。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":31,"zh":"這山村裡會設立一家新診所，以提供當地人高品質的醫療照顧。","question":"A new clinic will be ①____________ ②____________ in this mountain village to provide local people with high-quality medical care.","answers":["set","up"],"source":"三合一學習手冊","explanation":"句意：這山村裡會設立一家新診所，以提供當地人高品質的醫療照顧。 本題依序填入：set、up。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":32,"zh":"我們利用週末，為了即將到來的農曆新年做些採買。","question":"We ①____________ ②____________ ③____________ the weekend and went shopping for the coming Lunar New Year.","answers":["took","advantage","of"],"source":"三合一學習手冊","explanation":"句意：我們利用週末，為了即將到來的農曆新年做些採買。 本題依序填入：took、advantage、of。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":33,"zh":"老師要求學生們在遊戲開始前排隊並仔細聆聽規則。","question":"The teacher asked the students to ①____________ ②____________ and listen to the rules before the game started.","answers":["line","up"],"source":"三合一學習手冊","explanation":"句意：老師要求學生們在遊戲開始前排隊並仔細聆聽規則。 本題依序填入：line、up。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":34,"zh":"絕對不要把藥放在小孩碰得到的地方。","question":"Never keep the medicine ①____________ children’s ②____________.","answers":["within","reach"],"source":"三合一學習手冊","explanation":"句意：絕對不要把藥放在小孩碰得到的地方。 本題依序填入：within、reach。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":35,"zh":"寒暑假期間機票可能會變貴。","question":"Plane tickets ①____________ ②____________ ③____________ get more expensive in summer and winter vacation.","answers":["are","likely","to"],"source":"三合一學習手冊","explanation":"句意：寒暑假期間機票可能會變貴。 本題依序填入：are、likely、to。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"},{"id":36,"zh":"這類植物不喜歡太多水，所以太常澆水有可能會讓植物死掉。","question":"This type of plant does not like too much water, so watering the plant too often ①____________ ②____________ ③____________ kill it.","answers":["is","likely","to"],"source":"龍騰自命題","explanation":"be likely to 有可能會。","explanationSource":"source"},{"id":37,"zh":"我們要了些毛毯好讓我們可以保暖並在航程裡睡個好覺。","question":"We asked for blankets ①____________ ②____________ we could keep warm and have a nice sleep during the flight.","answers":["so","that"],"source":"龍騰自命題","explanation":"so that 為了……；以便於……。","explanationSource":"source"},{"id":38,"zh":"Jill用健康的早餐開始她的一天，她的早餐包含果汁、希臘式優格還有蔬菜沙拉。","question":"Jill ①____________ ②____________ her day with a healthy breakfast which includes juice, Greek yogurt, and vegetable salad.","answers":["starts","off"],"source":"龍騰自命題","explanation":"start off 開始。","explanationSource":"source"},{"id":39,"zh":"為了要幫助受到戰爭與災害影響的人，紅十字會於1863年在瑞士的日內瓦設立。","question":"To help people affected by wars and disasters, the Red Cross was ①____________ ②____________ in Geneva, Switzerland, in 1863.","answers":["set","up"],"source":"龍騰自命題","explanation":"set up 設立。","explanationSource":"source"},{"id":40,"zh":"許多小孩希望他們可以快點長大，好讓他們可以做只有成人才能做的事。","question":"Many children wish that they could grow up quickly ①____________ ②____________ they could do things that only grown-ups can do.","answers":["so","that"],"source":"龍騰自命題","explanation":"so that 為了……；以便於……。","explanationSource":"source"},{"id":41,"zh":"優勝美地國家公園設立於19世紀，以保護美麗的風景與在那兒的野生動物Yosemite National","question":"Park was ①____________ ②____________ in the nineteenth century to protect the beautiful scenery and wildlife there.","answers":["set","up"],"source":"龍騰自命題","explanation":"set up 設立。","explanationSource":"source"},{"id":42,"zh":"隨著烏雲聚集，很有可能很快就會下雨。","question":"With dark clouds gathering, it is ①____________ ②____________ rain very soon.","answers":["likely","to"],"source":"龍騰自命題","explanation":"be likely to 有可能會。","explanationSource":"source"},{"id":43,"zh":"Mia和Noah在法國開始他們的旅程，接著遊遍歐洲，最後安全返抵英國的家。","question":"Mia and Noah ①____________ ②____________ their journey in France, then traveled across Europe, and eventually returned home safe and sound to England.","answers":["started","off"],"source":"課本例句填空","explanation":"句意：Mia和Noah在法國開始他們的旅程，接著遊遍歐洲，最後安全返抵英國的家。 本題依序填入：started、off。（來源未附逐題解析，以上為答案整理。）","explanationSource":"supplemental"}]};</script><script src="longteng-b1u5-quiz.js?v=20261027-1"></script><script src="longteng-vocab-required-pronunciation.js?v=20261027-1"></script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
