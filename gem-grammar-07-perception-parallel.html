<script>window.QUIZ_CONFIG={"title": "國中小文法｜看見某人做某事（感官動詞與對等結構）", "mode": "mcq", "questions": [{"id": 1, "question": "I heard someone ______ the door and ______ into the room.", "options": ["opening / walked", "opened / walked", "open / walking", "opening / walking"], "answer": 3, "answerLabel": "D", "source": "感官動詞與對等結構", "explanation": "【正確答案】(D) opening / walking\n正確。感官動詞 heard 後面接受詞 (someone)，若強調正在發生的動作，兩個動作都要用現在分詞 (V-ing) 保持對等。\n【(A) 為何錯】這是不對等的結構。and 前後的動詞必須保持同型。", "explanationSource": "source"}, {"id": 2, "question": "She felt the ground shaking and quickly ______ under the desk.", "options": ["hiding", "hid", "hidden", "hide"], "answer": 1, "answerLabel": "B", "source": "感官動詞與對等結構", "explanation": "【正確答案】(B) hid\n正確。這是主詞 (She) 連續做的兩個動作：「感覺到地震」(felt) 和「躲到桌下」(hid)，由 and 連接，兩邊動詞時態須一致，皆用過去式。\n【(A) 為何錯】如果選 hiding，就變成是 ground (地板) 正在躲到桌下，這不符合邏輯。", "explanationSource": "source"}, {"id": 3, "question": "The teacher watched the students ______ the classroom and ______ the playground.", "options": ["left / entered", "leave / enter", "leaving / entered", "leave / entering"], "answer": 1, "answerLabel": "B", "source": "感官動詞與對等結構", "explanation": "【正確答案】(B) leave / enter\n正確。感官動詞 watched 後面接受詞 (the students)，表示看見完整動作時，兩個動作都要用原形動詞 (VR) 保持對等。\n【(A) 為何錯】感官動詞的主動受詞補語不能使用過去式動詞。", "explanationSource": "source"}, {"id": 4, "question": "John noticed the man acting suspiciously and ______ the security guard immediately.", "options": ["notify", "notifies", "notifying", "notified"], "answer": 3, "answerLabel": "D", "source": "感官動詞與對等結構", "explanation": "【正確答案】(D) notified\n正確。主詞 John 做了兩件事：注意到 (noticed) 和通知 (notified)。雖然中間有 acting，但那是 the man 的動作，而「通知警衛」是 John 接著做的。\n【(A) 為何錯】時態錯誤，主要動詞 noticed 是過去式。", "explanationSource": "source"}, {"id": 5, "question": "We listened to the birds ______ in the trees and ______ their nests.", "options": ["singing / build", "singing / building", "sing / built", "sang / built"], "answer": 1, "answerLabel": "B", "source": "感官動詞與對等結構", "explanation": "【正確答案】(B) singing / building\n正確。聽見鳥兒正在做的兩件事，皆由 and 連接，需使用同型的現在分詞 (V-ing)。\n【(A) 為何錯】這是不對等的結構。一個是 Ving，一個是 VR。", "explanationSource": "source"}, {"id": 6, "question": "I smelled something burning in the kitchen and ______ to turn off the stove.", "options": ["rushed", "rushes", "rushing", "rush"], "answer": 0, "answerLabel": "A", "source": "感官動詞與對等結構", "explanation": "【正確答案】(A) rushed\n正確。主詞 I 做了兩個連續動作：「聞到」(smelled) 和「衝去」(rushed)，用 and 連接，時態必須同為過去式。", "explanationSource": "source"}, {"id": 7, "question": "Did you observe the suspect ______ the building and ______ a taxi?", "options": ["exiting / take", "exited / took", "exit / take", "exit / taking"], "answer": 2, "answerLabel": "C", "source": "感官動詞與對等結構", "explanation": "【正確答案】(C) exit / take\n正確。observe 也是感官動詞，受詞 the suspect 後面的兩個連續動作需對等，這裡皆使用原形動詞 (VR)。\n【(A) 為何錯】動作沒有保持對等，一個是 Ving，一個是 VR。", "explanationSource": "source"}, {"id": 8, "question": "The driver saw a dog crossing the street and ______ on the brakes hard.", "options": ["step", "stepped", "stepping", "steps"], "answer": 1, "answerLabel": "B", "source": "感官動詞與對等結構", "explanation": "【正確答案】(B) stepped\n正確。主詞 (The driver) 的兩個連續動作：「看見」(saw) 和「踩煞車」(stepped)，and 前後動詞時態須一致（過去式）。\n【(A) 為何錯】時態與主要動詞 saw (過去式) 不一致。", "explanationSource": "source"}, {"id": 9, "question": "My mom looked at my brother ______ his toys and ______ them away.", "options": ["pack / putting", "packed / put", "packing / put", "packing / putting"], "answer": 3, "answerLabel": "D", "source": "感官動詞與對等結構", "explanation": "【正確答案】(D) packing / putting\n正確。look at 為感官動詞，受詞 (my brother) 後接的兩個動作需維持詞性對等，這裡皆為 V-ing。\n【(A) 為何錯】前為原形，後為 Ving，沒有維持結構對等。", "explanationSource": "source"}, {"id": 10, "question": "Mary heard her name called and ______ around to see who it was.", "options": ["turns", "turned", "turning", "turn"], "answer": 1, "answerLabel": "B", "source": "感官動詞與對等結構", "explanation": "【正確答案】(B) turned\n正確。這是主詞 Mary 的連續動作：「聽見」(heard) 和「轉身」(turned)。「轉身」是 Mary 接著做的動作，所以與 heard 對稱，用過去式。\n【(A) 為何錯】時態不一致，且主詞如果是 Mary 過去做的事，不能用現在單數動詞。", "explanationSource": "source"}]};</script><script src="longteng-b1u5-quiz.js?v=20261106-3"></script><script>document.querySelector("#description").textContent="共 10 題｜感官動詞＋受詞＋VR/Ving 與 and 對等結構｜選答後顯示中文解析";</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
