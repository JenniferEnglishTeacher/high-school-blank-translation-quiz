<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>翰林 B4U3 Reading 課文填空｜Cocoa Children</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#1f2937;--muted:#64748b;--line:#dbe2ea;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--accent:#2563eb;--accent2:#1d4ed8;--voice:#7c3aed;--voicebg:#f5f3ff}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}.wrap{max-width:980px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#eaf2ff,#fff);border:1px solid #dbeafe;border-radius:18px;padding:24px;margin-bottom:18px}.hero h1{margin:0 0 2px;font-size:clamp(25px,4vw,38px)}.hero h2{margin:0 0 7px}.hero p{margin:4px 0;color:var(--muted)}.home{display:inline-block;margin-top:12px;color:var(--accent);font-weight:800;text-decoration:none}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 5px 18px rgba(15,23,42,.05)}.hidden{display:none!important}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.btn{border:0;border-radius:10px;padding:11px 16px;font-size:16px;font-weight:700;cursor:pointer;background:#e5e7eb;color:#111827}.btn.primary{background:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent2)}.btn.danger{background:#991b1b;color:#fff}.btn.voice{background:var(--voice);color:#fff}.question-list{display:grid;gap:8px;margin-top:15px}.pick{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fafafa}.pick input{margin-top:5px;transform:scale(1.15)}.pick small{display:block;color:var(--muted)}.progress{height:10px;background:#e5e7eb;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--accent);transition:width .2s}.meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-weight:700;margin:8px 0 18px}.zh{font-size:22px;font-weight:800;padding:16px;border-left:5px solid var(--accent);background:#eff6ff;border-radius:8px;margin-bottom:18px}.english{font-size:20px;line-height:2.2}.blank{display:inline-block;vertical-align:middle;margin:2px 4px}.blank input,.blank select{font:inherit;min-width:88px;max-width:240px;padding:6px 8px;border:2px solid #94a3b8;border-radius:8px;background:#fff}.blank.correct input,.blank.correct select{border-color:var(--ok);background:var(--okbg)}.blank.wrong input,.blank.wrong select{border-color:var(--bad);background:var(--badbg)}.answer{display:block;color:var(--bad);font-size:13px;font-weight:800;line-height:1.3}.feedback{margin-top:14px;padding:12px 14px;border-radius:10px;font-weight:800}.feedback.ok{background:var(--okbg);color:var(--ok)}.feedback.bad{background:var(--badbg);color:var(--bad)}.voice-box{margin-top:16px;padding:16px;border:2px solid #ddd6fe;border-radius:14px;background:var(--voicebg)}.voice-box h3{margin:0 0 6px;color:#5b21b6}.voice-sentence{font-size:20px;font-weight:800;margin:8px 0 12px}.actions{margin-top:18px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:15px 0}.stat{padding:15px;border:1px solid var(--line);border-radius:12px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong-card{border:1px solid #fecaca;background:#fff7f7;border-radius:12px;padding:14px;margin:10px 0}.wrong-card p{margin:5px 0}.note{font-size:14px}@media(max-width:640px){.wrap{padding:12px}.card{padding:16px}.zh{font-size:19px}.english{font-size:18px}.blank input,.blank select{min-width:75px;max-width:180px}.meta{font-size:14px}}
</style></head>
<body><main class="wrap"><section class="hero"><h1>翰林 B4U3 Reading 課文填空</h1><h2>Cocoa Children</h2><p>先看完整中文，再依課文完成英文挖空。答錯的空格會顯示正確答案，請重新填對。</p><p class="note">整句答對後會自動朗讀英文。判定會忽略大小寫、標點、前後空白、多餘空格及直／彎撇號差異。</p><a class="home" href="index.html">← 回練習總覽</a></section>
<section id="selectScreen" class="card"><h2>選擇要練習的句子</h2><div class="toolbar"><button class="btn" id="allBtn">全部選取</button><button class="btn" id="noneBtn">全部取消</button><button class="btn primary" id="startBtn">開始作答</button></div><div id="questionList" class="question-list"></div></section>
<section id="quizScreen" class="card hidden"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="progressText"></span><span id="wrongCount"></span></div><div id="zhText" class="zh"></div><div id="enText" class="english"></div><div id="feedback" class="feedback hidden"></div><div id="voiceBox" class="voice-box hidden"><h3>🔊 完整英文</h3><div id="voiceSentence" class="voice-sentence"></div><button class="btn voice" id="speakBtn">🔊 再聽一次</button></div><div class="actions"><button class="btn primary" id="checkBtn">檢查答案</button><button class="btn primary hidden" id="nextBtn">下一題</button><button class="btn danger" id="finishBtn">結束作答</button></div></section>
<section id="resultScreen" class="card hidden"><h2>作答結果</h2><div id="summary" class="summary"></div><div id="resultMessage"></div><div id="wrongList"></div><div class="actions"><button class="btn primary" id="downloadBtn">下載錯題 DOCX</button><button class="btn" id="restartBtn">重新選題</button></div></section></main>
<script type="module">
import {Document,Packer,Paragraph,TextRun,HeadingLevel} from "https://esm.sh/docx@9.5.1";
const T=text=>({type:'text',text}),B=(answer,opts={})=>({type:'blank',answer,accept:opts.accept||[answer],options:opts.options||null,width:opts.width||Math.max(84,Math.min(230,String(answer).length*15+30))}),Q=(id,zh,full,s)=>({id,zh,full,s});
const qs=[
Q(1,'人們喜愛巧克力。','People love chocolate.',[B('People'),T(' '),B('love'),T(' '),B('chocolate'),T('.')]),
Q(2,'光是美國人在一年中最甜蜜的時節－－情人節當天就買了超過五千八百萬磅的巧克力。','Americans alone buy more than 58 million pounds of chocolate for Valentine\'s Day, the "sweetest" time of the year.',[B('Americans'),T(' '),B('alone'),T(' '),B('buy'),T(' '),B('more than'),T(' 58 million '),B('pounds'),T(' of chocolate '),B('for'),T(' Valentine\'s Day, the "'),B('sweetest'),T('" time '),B('of the year'),T('.')]),
Q(3,'但是對於象牙海岸的可可果童工來說，巧克力的滋味不甜，反而很苦澀。',"But for the cocoa child workers in the Ivory Coast, chocolate doesn't taste sweet but bitter.",[T('But '),B('for'),T(' the cocoa '),B('child workers'),T(' in the '),B('Ivory Coast'),T(', chocolate '),B("doesn't taste"),T(' '),B('sweet'),T(' but '),B('bitter'),T('.')]),
Q(4,'童工在象牙海岸是個很大的問題。','Child labor is a big problem in the Ivory Coast.',[B('Child labor'),T(' is '),B('a big problem'),T(' in the '),B('Ivory Coast'),T('.')]),
Q(5,'大部分的可可果童工介於十二到十六歲。','Most cocoa child workers are between 12 and 16 years old.',[B('Most'),T(' cocoa '),B('child workers'),T(' are '),B('between'),T(' 12 '),B('and'),T(' 16 '),B('years old'),T('.')]),
Q(6,'農場的主人要這些孩童一天工作十二個小時。','The farm owners make the kids work 12 hours a day.',[T('The farm '),B('owners'),T(' '),B('make'),T(' the kids '),B('work'),T(' 12 hours '),B('a day'),T('.')]),
Q(7,'在農場上，他們迅速且安靜地採摘可可豆。','On the farm, they pick cocoa beans quickly and quietly.',[B('On'),T(' the farm, they '),B('pick'),T(' '),B('cocoa beans'),T(' '),B('quickly'),T(' and '),B('quietly'),T('.')]),
Q(8,'他們比大多數成人還努力工作，但一天卻只有領六十五分工錢。','They work harder than most adults but only get about 65 cents a day.',[T('They work '),B('harder than'),T(' '),B('most adults'),T(' but '),B('only'),T(' get '),B('about'),T(' 65 cents '),B('a day'),T('.')]),
Q(9,'這些小小工作者在農場裡工作了很多年，所有的時間都花在那裡。','These little workers work on the farm for years and spend all their time there.',[T('These '),B('little workers'),T(' work '),B('on the farm'),T(' '),B('for years'),T(' and '),B('spend'),T(' '),B('all their time'),T(' there.')]),
Q(10,'他們沒有機會去上學。',"They don't have a chance to go to school.",[T('They '),B("don't have"),T(' '),B('a chance'),T(' '),B('to go'),T(' to school.')]),
Q(11,'這故事很悲慘。','This story is sad.',[T('This '),B('story'),T(' is '),B('sad'),T('.')]),
Q(12,'在可可果農場背後的巧克力公司必須停止使用童工。','The chocolate companies behind the cocoa farms need to stop using child labor.',[T('The chocolate '),B('companies'),T(' '),B('behind'),T(' the cocoa farms '),B('need to'),T(' '),B('stop using'),T(' '),B('child labor'),T('.')]),
Q(13,'現在，越來越多人在為這些兒童的權益而奮鬥，因為他們需要幫助。',"Now, more and more people are fighting for the children's rights because they need help.",[T('Now, '),B('more and more'),T(' people are '),B('fighting for'),T(' the children\'s '),B('rights'),T(' '),B('because'),T(' they '),B('need help'),T('.')]),
Q(14,'有些人選擇不買這些公司的巧克力，而其他人則把這些孩童的故事說出去。',"Some choose not to buy chocolate from these companies, and others tell the children's stories.",[B('Some'),T(' '),B('choose not to buy'),T(' chocolate '),B('from'),T(' these companies, and '),B('others'),T(' '),B('tell'),T(' the children\'s '),B('stories'),T('.')]),
Q(15,'讓我們一起加入他們的行列，並做出改變吧。',"Let's join them and make a change.",[B("Let's"),T(' '),B('join'),T(' them and '),B('make a change'),T('.')])
];
const $=s=>document.querySelector(s),state={selected:[],i:0,wrong:new Map(),attempted:new Set(),correct:new Set()};
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),norm=s=>String(s??'').trim().toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?;:()“”\"]/g,'').replace(/\s+/g,' ');
function speak(q){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(q.full);u.lang='en-US';u.rate=.88;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>/^en-US/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang))||null;speechSynthesis.speak(u)}
function renderList(){questionList.innerHTML=qs.map(q=>`<label class="pick"><input class="qpick" type="checkbox" value="${q.id}" checked><span><b>第 ${q.id} 題</b><small>${esc(q.zh)}</small></span></label>`).join('')}
function start(){const ids=[...document.querySelectorAll('.qpick:checked')].map(x=>+x.value);if(!ids.length){alert('請至少選一題。');return}state.selected=qs.filter(q=>ids.includes(q.id));state.i=0;state.wrong.clear();state.attempted.clear();state.correct.clear();selectScreen.classList.add('hidden');resultScreen.classList.add('hidden');quizScreen.classList.remove('hidden');show()}
function show(){speechSynthesis?.cancel();const q=state.selected[state.i];progressText.textContent=`第 ${state.i+1} / ${state.selected.length} 題`;wrongCount.textContent=`曾答錯 ${state.wrong.size} 題`;bar.style.width=`${(state.i+1)/state.selected.length*100}%`;zhText.textContent=q.zh;enText.innerHTML='';q.s.forEach(seg=>{if(seg.type==='text'){enText.append(document.createTextNode(seg.text));return}const span=document.createElement('span');span.className='blank';let field;if(seg.options){field=document.createElement('select');field.innerHTML='<option value="">請選擇</option>'+seg.options.map(o=>`<option>${esc(o)}</option>`).join('')}else{field=document.createElement('input');field.type='text';field.autocomplete='off';field.style.width=seg.width+'px';field.placeholder='______'}span.append(field);enText.append(span)});feedback.className='feedback hidden';voiceBox.classList.add('hidden');checkBtn.classList.remove('hidden');nextBtn.classList.add('hidden');setTimeout(()=>enText.querySelector('input,select')?.focus(),20)}
function check(){const q=state.selected[state.i],defs=q.s.filter(x=>x.type==='blank'),fields=[...enText.querySelectorAll('input,select')];if(fields.some(f=>!f.value.trim())){alert('請完成所有空格後再檢查。');return}state.attempted.add(q.id);let all=true;const wrong=[];fields.forEach((f,i)=>{const span=f.closest('.blank'),d=defs[i],value=f.value;span.classList.remove('correct','wrong');span.querySelector('.answer')?.remove();if(d.accept.some(a=>norm(a)===norm(value))){span.classList.add('correct');f.disabled=true}else{all=false;wrong.push(`空格 ${i+1}: ${value}`);span.classList.add('wrong');const a=document.createElement('span');a.className='answer';a.textContent=`正確：${d.answer}`;span.append(a);f.value='';f.disabled=false}});if(!all){if(!state.wrong.has(q.id))state.wrong.set(q.id,{q,attempts:[]});state.wrong.get(q.id).attempts.push(wrong.join('； '));wrongCount.textContent=`曾答錯 ${state.wrong.size} 題`;feedback.className='feedback bad';feedback.textContent='❌ 有空格錯誤。請依紅色提示重填，再按一次「檢查答案」。';enText.querySelector('input:not(:disabled),select:not(:disabled)')?.focus();return}state.correct.add(q.id);feedback.className='feedback ok';feedback.textContent='✅ 全部正確！已自動朗讀完整英文。';voiceSentence.textContent=q.full;voiceBox.classList.remove('hidden');checkBtn.classList.add('hidden');nextBtn.classList.remove('hidden');speak(q)}
function finish(){speechSynthesis?.cancel();quizScreen.classList.add('hidden');resultScreen.classList.remove('hidden');summary.innerHTML=`<div class="stat">選擇題數<b>${state.selected.length}</b></div><div class="stat">已作答<b>${state.attempted.size}</b></div><div class="stat">完成答對<b>${state.correct.size}</b></div><div class="stat">曾答錯<b>${state.wrong.size}</b></div>`;const rows=[...state.wrong.values()];resultMessage.innerHTML=rows.length?'<p><b>以下題目曾經答錯；改正後仍保留在錯題紀錄。</b></p>':'<div class="feedback ok">🎉 本次沒有錯題！</div>';wrongList.innerHTML=rows.map((r,i)=>`<div class="wrong-card"><b>${i+1}. ${esc(r.q.zh)}</b><p>錯誤紀錄：${r.attempts.map(esc).join('<br>')}</p><p><strong>正確英文：</strong>${esc(r.q.full)}</p></div>`).join('');downloadBtn.classList.toggle('hidden',!rows.length)}
async function download(){if(!state.wrong.size)return;const children=[new Paragraph({heading:HeadingLevel.TITLE,children:[new TextRun({text:'翰林 B4U3 Reading Cocoa Children 錯題紀錄',bold:true})]}),new Paragraph({text:`曾答錯共 ${state.wrong.size} 題`})];[...state.wrong.values()].forEach((r,i)=>{children.push(new Paragraph({heading:HeadingLevel.HEADING_2,children:[new TextRun({text:`${i+1}. ${r.q.zh}`,bold:true})]}),new Paragraph({children:[new TextRun({text:'學生錯誤答案：',bold:true}),new TextRun({text:r.attempts.join(' | ')})]}),new Paragraph({children:[new TextRun({text:'正確完整英文：',bold:true}),new TextRun({text:r.q.full})]}),new Paragraph({text:'重新練習：____________________________________________________________'}))});const doc=new Document({sections:[{children}]});const blob=await Packer.toBlob(doc),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`翰林B4U3_Reading_Cocoa_Children_錯題_${new Date().toISOString().slice(0,10)}.docx`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
allBtn.onclick=()=>document.querySelectorAll('.qpick').forEach(x=>x.checked=true);noneBtn.onclick=()=>document.querySelectorAll('.qpick').forEach(x=>x.checked=false);startBtn.onclick=start;checkBtn.onclick=check;speakBtn.onclick=()=>speak(state.selected[state.i]);nextBtn.onclick=()=>{state.i++;state.i<state.selected.length?show():finish()};finishBtn.onclick=finish;restartBtn.onclick=()=>{resultScreen.classList.add('hidden');selectScreen.classList.remove('hidden')};downloadBtn.onclick=download;renderList();
</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
