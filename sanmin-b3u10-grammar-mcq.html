ound:#f8fafc;padding:16px;border-radius:12px;font-size:18px}.inline-input{width:150px;max-width:100%;font:inherit;padding:7px 9px;border:2px solid #94a3b8;border-radius:8px;margin:3px}.voicebox{padding:14px;border:2px solid #ddd6fe;border-radius:11px;background:#f5f3ff;margin:12px 0}.voice-result{background:#fff;border:1px solid #ddd6fe;padding:10px;border-radius:9px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat,.wrong-card{padding:14px;border:1px solid var(--line);border-radius:11px;background:#fafafa}.stat b{display:block;font-size:28px}.wrong-card{margin:10px 0;background:#fff7f7;border-color:#fecaca}@media(max-width:620px){main{padding:8px}.hero,.card{padding:15px}.meta{display:block}.prompt,.passage,.translation{font-size:16px}}
</style></head><body><main><section class="hero"><h1>三民普高 B3U10｜文法選擇</h1><p class="muted">原題互動練習｜60 題｜即時批改｜錯誤重填｜答對後整句播放＋選做 STT｜錯題 DOCX｜成績登錄</p><div class="actions"><a class="btn" href="dashboard.html">← 回 Dashboard</a></div></section><section id="quiz" class="card"><div class="progress"><div id="bar" class="bar"></div></div><div class="meta"><span id="meta"></span><span id="wrongCount"></span></div><div id="question"></div><div id="answerArea"></div><div id="feedback" class="feedback hidden"></div><div id="reference" class="reference hidden"></div><div id="voiceBox" class="voicebox hidden"><h3>🎙️ Pronunciation Check（選做）</h3><p><b id="voiceTarget"></b></p><div class="actions"><button id="speak" class="btn voice">🔊 再聽一次</button><button id="mic" class="btn primary">🎤 開始朗讀評分</button></div><div id="voiceResult" class="voice-result">尚未進行朗讀評分。</div></div><div class="actions"><button id="check" class="btn primary hidden">檢查答案</button><button id="next" class="btn primary hidden">下一題 →</button><button id="finish" class="btn danger">結束本輪</button></div></section><section id="result" class="card hidden"><h2>練習結果</h2><div id="summary" class="summary"></div><div id="wrongList"></div><div class="actions"><button id="download" class="btn primary">下載錯題 DOCX</button><button id="restart" class="btn">重新練習</button></div></section></main><script>
const QUIZ={"unit":"B3U10","kind":"mcq","title":"文法選擇","count":60,"data":[{"number":1,"prompt":"When accused of lying, Dan insisted that everything he said _____ true.","options":{"A":"was","B":"be","C":"being","D":"to be"},"answer":"A","sentence":"When accused of lying, Dan insisted that everything he said was true."},{"number":2,"prompt":"After several months of trials, the judge finally demanded that the prisoner _____ from the jail.","options":{"A":"release","B":"be released","C":"was released","D":"to release"},"answer":"B","sentence":"After several months of trials, the judge finally demanded that the prisoner be released from the jail."},{"number":3,"prompt":"It is fun to improve one's English ability _____ watching English films and listening to English songs.","options":{"A":"in","B":"to","C":"by","D":"with"},"answer":"C","sentence":"It is fun to improve one's English ability by watching English films and listening to English songs."},{"number":4,"prompt":"The criminal will face justice _____ solid proof is found.","options":{"A":"according to","B":"thanks to","C":"as long as","D":"even though"},"answer":"C","sentence":"The criminal will face justice as long as solid proof is found."},{"number":5,"prompt":"Gary left for New York, _____ only one bag and some money.","options":{"A":"which brought","B":"brought","C":"bringing","D":"to bring"},"answer":"C","sentence":"Gary left for New York, bringing only one bag and some money."},{"number":6,"prompt":"Even though Ms. Chen is said to be stricter _____ in our high school, all her students still love her very much.","options":{"A":"than any other teachers","B":"than all the other teachers","C":"among all the teachers","D":"among any other teachers"},"answer":"B","sentence":"Even though Ms. Chen is said to be stricter than all the other teachers in our high school, all her students still love her very much."},{"number":7,"prompt":"The principle demanded that the policy of school bullying should _____ strictly.","options":{"A":"been enforced","B":"be enforced","C":"enforce","D":"enforced"},"answer":"B","sentence":"The principle demanded that the policy of school bullying should be enforced strictly."},{"number":8,"prompt":"The angry teacher commanded that all the students _____ at least 20 push-ups during the class.","options":{"A":"is doing","B":"be done","C":"did","D":"do"},"answer":"D","sentence":"The angry teacher commanded that all the students do at least 20 push-ups during the class."},{"number":9,"prompt":"Taipei has a larger population than _____ in Taiwan.","options":{"A":"any","B":"any other","C":"any other cities","D":"any other city"},"answer":"D","sentence":"Taipei has a larger population than any other city in Taiwan."},{"number":10,"prompt":"It's wasteful for my roommate to leave the tap water _____ when brushing his teeth.","options":{"A":"running","B":"to run","C":"run","D":"being run"},"answer":"A","sentence":"It's wasteful for my roommate to leave the tap water running when brushing his teeth."},{"number":11,"prompt":"John's dentist often advises that he _____ the habit of brushing his teeth after every meal.","options":{"A":"kept","B":"to keep","C":"keeps","D":"keep"},"answer":"D","sentence":"John's dentist often advises that he keep the habit of brushing his teeth after every meal."},{"number":12,"prompt":"We have been informed of _____ a funny person that our new manager can be, but his funny expressions are still very interesting.","options":{"A":"what","B":"who","C":"which","D":"how"},"answer":"A","sentence":"We have been informed of what a funny person that our new manager can be, but his funny expressions are still very interesting."},{"number":13,"prompt":"To have more allies, the president visits other world leaders to persuade them _______ by his side.","options":{"A":"standing","B":"to stand","C":"stand","D":"stood"},"answer":"B","sentence":"To have more allies, the president visits other world leaders to persuade them to stand by his side."},{"number":14,"prompt":"To help her daughter who catches a cold, Mr. Johnson suggests that his daughter _____ as much vitamin C as possible.","options":{"A":"should take","B":"to take","C":"was taken","D":"is taking"},"answer":"A","sentence":"To help her daughter who catches a cold, Mr. Johnson suggests that his daughter should take as much vitamin C as possible."},{"number":15,"prompt":"It is strongly suggested that we _____ walking alone in the nights in dark streets.","options":{"A":"avoids","B":"to avoid","C":"should avoid","D":"should be avoided"},"answer":"C","sentence":"It is strongly suggested that we should avoid walking alone in the nights in dark streets."},{"number":16,"prompt":"_____ the heavy rain, the college students still went hiking in the mountains.","options":{"A":"However","B":"Even","C":"Despite","D":"Unless"},"answer":"C","sentence":"Despite the heavy rain, the college students still went hiking in the mountains."},{"number":17,"prompt":"The supervisor has the pianist _____ 12 hours a day.","options":{"A":"practicing","B":"practiced","C":"practice","D":"practices"},"answer":"C","sentence":"The supervisor has the pianist practice 12 hours a day."},{"number":18,"prompt":"An asteroid hit the earth millions of years ago. _____ this incident that led to the extinction of dinosaurs.","options":{"A":"There was","B":"It was","C":"Which was","D":"What was"},"answer":"B","sentence":"An asteroid hit the earth millions of years ago. It was this incident that led to the extinction of dinosaurs."},{"number":19,"prompt":"Since _____ Sam _____ John could win Samantha's heart, she ended up being together with the other man.","options":{"A":"both; and","B":"neither; nor","C":"either; or","D":"not only; but"},"answer":"B","sentence":"Since neither Sam nor John could win Samantha's heart, she ended up being together with the other man."},{"number":20,"prompt":"It is not until the truth is reported _____ people realize that they are fooled by the fake news.","options":{"A":"as","B":"so","C":"that","D":"before"},"answer":"C","sentence":"It is not until the truth is reported that people realize that they are fooled by the fake news."},{"number":21,"prompt":"Jenny has convinced her parents _____ she would learn better if she can get a smartphone.","options":{"A":"that","B":"which","C":"what","D":"when"},"answer":"A","sentence":"Jenny has convinced her parents that she would learn better if she can get a smartphone."},{"number":22,"prompt":"_____ the fact that mobile payments are quick and convenient, many customers still prefer to pay in cash.","options":{"A":"Although","B":"Whatever","C":"Despite","D":"Regardless"},"answer":"C","sentence":"Despite the fact that mobile payments are quick and convenient, many customers still prefer to pay in cash."},{"number":23,"prompt":"The little girl likes _____ chicken _____ curry, so she definitely won't have chicken curry for lunch.","options":{"A":"not; but","B":"both; and","C":"either; or","D":"neither; nor"},"answer":"D","sentence":"The little girl likes neither chicken nor curry, so she definitely won't have chicken curry for lunch."},{"number":24,"prompt":"John lost the tennis match _____ he had practiced very hard.","options":{"A":"despite","B":"despite the fact that","C":"in spite of","D":"despite the fact of"},"answer":"B","sentence":"John lost the tennis match despite the fact that he had practiced very hard."},{"number":25,"prompt":"_____ Jenny is busy, she still exercises every day.","options":{"A":"In spite of","B":"Even","C":"If","D":"Despite the fact that"},"answer":"D","sentence":"Despite the fact that Jenny is busy, she still exercises every day."},{"number":26,"prompt":"To refresh herself after hours of working, the manager had her secretary _____ some desserts and coffee for her.","options":{"A":"preparing","B":"prepared","C":"prepare","D":"to prepare"},"answer":"C","sentence":"To refresh herself after hours of working, the manager had her secretary prepare some desserts and coffee for her."},{"number":27,"prompt":"Bob's success depends on _______ his background _______ luck. It is all about his all-out effort.","options":{"A":"not only; but also","B":"both; and","C":"so; that","D":"neither; nor"},"answer":"D","sentence":"Bob's success depends on neither his background nor luck. It is all about his all-out effort."},{"number":28,"prompt":"Bob's success depends on _______ his background _______ luck. It is all about his all-out effort.","options":{"A":"not only; but also","B":"both; and","C":"so; that","D":"neither; nor"},"answer":"D","sentence":"Bob's success depends on neither his background nor luck. It is all about his all-out effort."},{"number":29,"prompt":"Don't take the kid's words seriously. What he said was _____ a joke.","options":{"A":"consisting of","B":"in danger of","C":"nothing more than","D":"with the approach of"},"answer":"C","sentence":"Don't take the kid's words seriously. What he said was nothing more than a joke."},{"number":30,"prompt":"After hitting an old lady, the driver left her _____ on the road and drove swiftly away.","options":{"A":"lie","B":"lying","C":"lain","D":"to lie"},"answer":"B","sentence":"After hitting an old lady, the driver left her lying on the road and drove swiftly away."},{"number":31,"prompt":"To have more allies, the president visits other world leaders to persuade them _______ by his side.","options":{"A":"standing","B":"to stand","C":"stand","D":"stood"},"answer":"B","sentence":"To have more allies, the president visits other world leaders to persuade them to stand by his side."},{"number":32,"prompt":"The government commanded that plastic bags_______ due to environmental issues","options":{"A":"are banned","B":"not be banned","C":"be banned","D":"are not banned"},"answer":"C","sentence":"The government commanded that plastic bagsbe banned due to environmental issues"},{"number":33,"prompt":"The customer insisted that the food delivery driver _____ on time with the food he ordered.","options":{"A":"arrive","B":"arrives","C":"arrived","D":"has arrived"},"answer":"A","sentence":"The customer insisted that the food delivery driver arrive on time with the food he ordered."},{"number":34,"prompt":"One of the most incredible art attractions in Kaohsiung is the picture of bookcase _____ with extremely detailed volume of books.","options":{"A":"that fills","B":"be filled","C":"filling","D":"filled"},"answer":"D","sentence":"One of the most incredible art attractions in Kaohsiung is the picture of bookcase filled with extremely detailed volume of books."},{"number":35,"prompt":"The teacher _____ her students complete a survey to help her learn about their reading habits.","options":{"A":"prompted","B":"left","C":"commanded","D":"had"},"answer":"D","sentence":"The teacher had her students complete a survey to help her learn about their reading habits."},{"number":36,"prompt":"The mother mixed the medicine with a small amount of juice and successfully had her one-year-old child _____ it.","options":{"A":"take","B":"took","C":"taken","D":"taking"},"answer":"A","sentence":"The mother mixed the medicine with a small amount of juice and successfully had her one-year-old child take it."},{"number":37,"prompt":"Despite the assurance that their product was safe, many people still demanded that the product in question _____ from the shops.","options":{"A":"was removed","B":"removing","C":"to remove","D":"be removed"},"answer":"D","sentence":"Despite the assurance that their product was safe, many people still demanded that the product in question be removed from the shops."},{"number":38,"prompt":"Barry and Cathy often fought for trivial things in life, _____ resulted in their divorce.","options":{"A":"that","B":"which","C":"what","D":"it"},"answer":"B","sentence":"Barry and Cathy often fought for trivial things in life, which resulted in their divorce."},{"number":39,"prompt":"Larry wanted to play another round of online basketball game, but his mother insisted that he _____ away his smartphone right away.","options":{"A":"be put","B":"to put","C":"put","D":"puts"},"answer":"C","sentence":"Larry wanted to play another round of online basketball game, but his mother insisted that he put away his smartphone right away."},{"number":40,"prompt":"The photographer insisted that his photos of these old churches _____ in black and white.","options":{"A":"develop","B":"developing","C":"be developed","D":"to develop"},"answer":"C","sentence":"The photographer insisted that his photos of these old churches be developed in black and white."},{"number":41,"prompt":"The professor had his students _____ their proposals by the end of November.","options":{"A":"submits","B":"submitted","C":"submitting","D":"submit"},"answer":"D","sentence":"The professor had his students submit their proposals by the end of November."},{"number":42,"prompt":"Daniel insisted that I _____ those who are in need.","options":{"A":"should help","B":"might help","C":"helped","D":"to help"},"answer":"A","sentence":"Daniel insisted that I should help those who are in need."},{"number":43,"prompt":"Before _______ to join the basketball team, students need to improve their skills.","options":{"A":"approves","B":"approving","C":"being approved","D":"approved"},"answer":"C","sentence":"Before being approved to join the basketball team, students need to improve their skills."},{"number":44,"prompt":"Before _______ to join the basketball team, students need to improve their skills.","options":{"A":"approves","B":"approving","C":"being approved","D":"approved"},"answer":"C","sentence":"Before being approved to join the basketball team, students need to improve their skills."},{"number":45,"prompt":"Three goddesses fought for a golden apple marked \"For the Fairest,\" _____ the seeds of a war among humans.","options":{"A":"sowed","B":"sowing","C":"thus sowed","D":"this sowed"},"answer":"B","sentence":"Three goddesses fought for a golden apple marked \"For the Fairest,\" sowing the seeds of a war among humans."},{"number":46,"prompt":"The police were ordered that the murder case _____ within a month.","options":{"A":"crack","B":"be cracked","C":"was cracked","D":"to crack"},"answer":"B","sentence":"The police were ordered that the murder case be cracked within a month."},{"number":47,"prompt":"To prevent damage and loss by the typhoon, the government required that windows and doors _____.","options":{"A":"be secured","B":"secured","C":"to be secured","D":"is being secured"},"answer":"A","sentence":"To prevent damage and loss by the typhoon, the government required that windows and doors be secured."},{"number":48,"prompt":"By the end of the semester, Ms. Lin left her students _____ their favorite cartoons during the day.","options":{"A":"watches","B":"watching","C":"watch","D":"watched"},"answer":"B","sentence":"By the end of the semester, Ms. Lin left her students watching their favorite cartoons during the day."},{"number":49,"prompt":"Michelle went to the eye clinic for her swollen eyes. The doctor advised that she _____ her contact lenses in a clean case.","options":{"A":"store","B":"to store","C":"be stored","D":"stored"},"answer":"A","sentence":"Michelle went to the eye clinic for her swollen eyes. The doctor advised that she store her contact lenses in a clean case."},{"number":50,"prompt":"Kathy is taller than any _____ new student in class.","options":{"A":"other","B":"others","C":"another","D":"the"},"answer":"A","sentence":"Kathy is taller than any other new student in class."},{"number":51,"prompt":"Predicting the global economy is growing, the banker persuaded his clients _____ most of their money in the stock market.","options":{"A":"put","B":"putting","C":"being put","D":"to put"},"answer":"D","sentence":"Predicting the global economy is growing, the banker persuaded his clients to put most of their money in the stock market."},{"number":52,"prompt":"The government commanded that plastic bags_______ due to environmental issues","options":{"A":"are banned","B":"not be banned","C":"be banned","D":"are not banned"},"answer":"C","sentence":"The government commanded that plastic bagsbe banned due to environmental issues"},{"number":53,"prompt":"Despite _____ close the friendship between Victoria and me was in high school, we haven't seen each other for years after we graduated.","options":{"A":"what","B":"how","C":"why","D":"that"},"answer":"B","sentence":"Despite how close the friendship between Victoria and me was in high school, we haven't seen each other for years after we graduated."},{"number":54,"prompt":"The police officer tried to figure out who was _____ the bank robbery that occurred this morning.","options":{"A":"taken over","B":"supposed to","C":"devoted to","D":"involved in"},"answer":"D","sentence":"The police officer tried to figure out who was involved in the bank robbery that occurred this morning."},{"number":55,"prompt":"The evil queen _____ her servant deliver the poisonous medicine to the princess.","options":{"A":"left","B":"had","C":"asked","D":"heard"},"answer":"B","sentence":"The evil queen had her servant deliver the poisonous medicine to the princess."},{"number":56,"prompt":"The Minister of Health and Welfare has strongly suggested that people _____ face masks when taking public transportation.","options":{"A":"wore","B":"have worn","C":"wear","D":"wearing"},"answer":"C","sentence":"The Minister of Health and Welfare has strongly suggested that people wear face masks when taking public transportation."},{"number":57,"prompt":"Jason has to sit in the very last row because he is taller than _______ students in his class.","options":{"A":"all the other","B":"any","C":"any other","D":"other"},"answer":"A","sentence":"Jason has to sit in the very last row because he is taller than all the other students in his class."},{"number":58,"prompt":"The doctor recommended that Leo _____ more fruit and vegetables.","options":{"A":"eat","B":"eaten","C":"eating","D":"to eating"},"answer":"A","sentence":"The doctor recommended that Leo eat more fruit and vegetables."},{"number":59,"prompt":"Jason has to sit in the very last row because he is taller than _______ students in his class.","options":{"A":"all the other","B":"any","C":"any other","D":"other"},"answer":"A","sentence":"Jason has to sit in the very last row because he is taller than all the other students in his class."},{"number":60,"prompt":"Being annoyed by her daughter, Sally leaves her daughter _____ alone in her bedroom.","options":{"A":"cries","B":"cry","C":"crying","D":"cried"},"answer":"C","sentence":"Being annoyed by her daughter, Sally leaves her daughter crying alone in her bedroom."}]};const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let flat=[],index=0,wrong=new Map(),attempted=new Set(),firstTry=new Set(),recognition=null;
function flatten(){if(QUIZ.kind==='mcq')return QUIZ.data.map(x=>({...x,id:String(x.number)}));if(QUIZ.kind==='translation')return QUIZ.data.map(x=>({...x,id:String(x.number)}));return QUIZ.data.flatMap(set=>set.answers.map((answer,i)=>({id:`${set.set}-${i+1}`,set:set.set,passage:set.passage,options:set.options,answer,blank:i+1,sentence:set.sentences[i],structure:set.structure})))}
function fillPassage(text,answers,options){let out=text;answers.forEach((a,i)=>{const word=options[a];const n=i+1;const pats=[new RegExp(`__\\(?${n}\\)?__`),new RegExp(`__${n}__`),new RegExp(`　${n}　`),new RegExp(`\\(${n}\\)`)];for(const p of pats){if(p.test(out)){out=out.replace(p,word);break}}});return out.replace(/\n+/g,' ').replace(/\s+/g,' ').trim()}
function markBlank(text,n){const tag=`<span class="blank-now">Blank ${n}</span>`;let out=esc(text),done=false;for(const p of [new RegExp(`__\\(?${n}\\)?__`),new RegExp(`__${n}__`),new RegExp(`　${n}　`),new RegExp(`\\(${n}\\)`)]){if(!done&&p.test(out)){out=out.replace(p,tag);done=true}}return out}
function norm(s){return String(s).trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ')}function speak(text){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}
function show(){try{recognition?.abort()}catch(e){}speechSynthesis?.cancel();const q=flat[index];$('#meta').textContent=`第 ${index+1} / ${flat.length} 題`;$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`;$('#bar').style.width=((index+1)/flat.length*100)+'%';$('#feedback').className='feedback hidden';$('#reference').classList.add('hidden');$('#voiceBox').classList.add('hidden');$('#next').classList.add('hidden');$('#check').classList.toggle('hidden',QUIZ.kind!=='translation');$('#answerArea').innerHTML='';if(QUIZ.kind==='mcq')renderChoice(q.prompt,q.options);else if(QUIZ.kind==='translation')renderTranslation(q);else{$('#question').innerHTML=`<div class="passage">${markBlank(q.passage,q.blank)}</div>`;renderChoice(`第 ${q.blank} 格`,q.options)}}
function renderChoice(prompt,options){$('#question').innerHTML=QUIZ.kind==='mcq'?`<div class="prompt">${esc(prompt)}</div>`:$('#question').innerHTML;$('#answerArea').innerHTML='<div class="options">'+Object.entries(options).map(([k,v])=>`<button class="option" data-key="${k}"><b>${k}.</b> ${esc(v)}</button>`).join('')+'</div>';document.querySelectorAll('.option').forEach(b=>b.onclick=()=>checkChoice(b.dataset.key,b))}
function renderTranslation(q){let i=0;const rendered=esc(q.prompt).replace(/_{3,}/g,()=>`<input class="inline-input" data-i="${i++}" aria-label="第 ${i} 格答案">`);$('#question').innerHTML=`<div class="translation">${rendered}</div>`;setTimeout(()=>document.querySelector('.inline-input')?.focus(),0)}
function recordWrong(q,value){if(!wrong.has(q.id))wrong.set(q.id,{q,attempts:[]});wrong.get(q.id).attempts.push(value);$('#wrongCount').textContent=`曾答錯 ${wrong.size} 題`}
function checkChoice(key,button){const q=flat[index];attempted.add(q.id);if(key!==q.answer){recordWrong(q,key);button.classList.add('wrong');$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 不正確，請再試一次。';return}if(!wrong.has(q.id))firstTry.add(q.id);document.querySelectorAll('.option').forEach(b=>b.disabled=true);button.classList.add('correct');pass(q)}
function checkTranslation(){const q=flat[index],values=[...document.querySelectorAll('.inline-input')].map(x=>x.value);attempted.add(q.id);const ok=values.length===q.answers.length&&values.every((v,i)=>norm(v)===norm(q.answers[i]));if(!ok){recordWrong(q,values.join(' / '));$('#feedback').className='feedback bad';$('#feedback').textContent='❌ 尚有空格不正確，請修正後再檢查。';return}if(!wrong.has(q.id))firstTry.add(q.id);document.querySelectorAll('.inline-input').forEach(x=>x.disabled=true);pass(q)}
function pass(q){$('#feedback').className='feedback ok';$('#feedback').textContent='✅ 正確！';$('#reference').classList.remove('hidden');$('#reference').textContent='完整句：'+q.sentence;$('#check').classList.add('hidden');$('#next').classList.remove('hidden');$('#voiceBox').classList.remove('hidden');$('#voiceTarget').textContent=q.sentence;$('#voiceResult').className='voice-result';$('#voiceResult').textContent='尚未進行朗讀評分。';speak(q.sentence)}
function similarity(a,b){a=norm(a).replace(/[^a-z0-9' ]/g,'').split(' ').filter(Boolean);b=norm(b).replace(/[^a-z0-9' ]/g,'').split(' ').filter(Boolean);const used=new Set;let hit=0;for(const w of a){const j=b.findIndex((x,i)=>x===w&&!used.has(i));if(j>=0){hit++;used.add(j)}}return Math.round(100*hit/Math.max(a.length,b.length,1))}
function startMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('#voiceResult').textContent='此瀏覽器不支援語音辨識，建議使用 Chrome。';return}recognition=new SR;recognition.lang='en-US';recognition.interimResults=false;$('#voiceResult').textContent='正在聆聽，請朗讀完整句子…';recognition.onresult=e=>{const said=e.results[0][0].transcript,target=flat[index].sentence,score=similarity(target,said);$('#voiceResult').className='voice-result '+(score>=80?'good':'retry');$('#voiceResult').textContent=`辨識：${said}\n正確率：${score}%`};recognition.onerror=e=>$('#voiceResult').textContent='語音辨識未完成：'+e.error;recognition.start()}
function finish(){try{recognition?.abort()}catch(e){}speechSynthesis?.cancel();$('#quiz').classList.add('hidden');$('#result').classList.remove('hidden');const rows=[...wrong.values()];$('#summary').innerHTML=`<div class="stat">實際作答<b>${attempted.size}</b></div><div class="stat">一次答對<b>${firstTry.size}</b></div><div class="stat">曾答錯<b>${rows.length}</b></div>`;$('#wrongList').innerHTML=rows.length?rows.map((r,i)=>`<div class="wrong-card"><b>${i+1}. 第 ${esc(r.q.id)} 題</b><p>${esc(r.q.prompt||`第 ${r.q.blank} 格`)}</p><p>作答：${r.attempts.map(esc).join('；')}</p><p>答案：${esc(r.q.answer||r.q.answers.join(' / '))}</p></div>`).join(''):(attempted.size?'<div class="feedback ok">🎉 本輪全部一次答對！</div>':'<p class="muted">本輪尚未作答，因此不登錄成績。</p>');$('#download').classList.toggle('hidden',!rows.length);if(attempted.size)document.dispatchEvent(new CustomEvent('quiz-result-ready',{detail:{total:attempted.size,correct:firstTry.size,wrong:rows.length,mistakeQuestionNumbers:rows.map(r=>r.q.id).join(', ')}}))}
$('#check').onclick=checkTranslation;$('#next').onclick=()=>{if(++index>=flat.length)finish();else show()};$('#finish').onclick=finish;$('#restart').onclick=()=>location.reload();$('#speak').onclick=()=>speak(flat[index].sentence);$('#mic').onclick=startMic;$('#download').onclick=async()=>{const rows=[...wrong.values()];if(!rows.length)return;try{if(!window.docx)await new Promise((ok,fail)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/docx@9.5.1/dist/index.iife.js';s.onload=ok;s.onerror=fail;document.head.append(s)});const{Document,Packer,Paragraph,HeadingLevel}=window.docx,children=[new Paragraph({text:`三民普高 ${QUIZ.unit} ${QUIZ.title} 錯題紀錄`,heading:HeadingLevel.TITLE})];rows.forEach(r=>children.push(new Paragraph({text:`第 ${r.q.id} 題`,heading:HeadingLevel.HEADING_2}),new Paragraph(r.q.prompt||r.q.passage||''),new Paragraph('作答：'+r.attempts.join('；')),new Paragraph('答案：'+(r.q.answer||r.q.answers.join(' / ')))));const blob=await Packer.toBlob(new Document({sections:[{children}]})),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`Sanmin_${QUIZ.unit}_${QUIZ.kind}_錯題.docx`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){alert('目前無法產生 DOCX，請稍後再試。')}};flat=flatten();show();
