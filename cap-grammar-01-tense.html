<script>window.QUIZ_CONFIG={"title": "國中會考文法歷屆試題｜時態＋整句結構", "mode": "mcq", "questions": [{"id": 1, "question": "It was very windy this morning. Some of the shirts on the balcony were blown away ______ in the pond.", "options": ["fell", "and fell", "fallen", "and fallen"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜對等連接 V1 and V2 時態一致", "explanation": "【句型】S + V1 + and + V2:對等連接的兩個動詞時態須一致。\n【分析】前面 were blown away 是過去式,後面「掉進池塘」也要用過去式 fell,且兩個動詞之間要用 and 連接 → and fell。\n【其他選項】(A) fell 缺連接詞 and,一句不能有兩個動詞直接相連;(C)(D) fallen 是過去分詞,不能單獨當動詞。\n【例句】The vase fell off the table and broke.", "explanationSource": "source"}, {"id": 2, "question": "Last Sunday, Kevin went to the night market ______ a bowl of beef noodles.", "options": ["eats", "and ate", "eating", "and eaten"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 1 題）", "explanation": "前面 went 為過去式,用 and 連接同為過去式的 ate。", "explanationSource": "supplemental"}, {"id": 3, "question": "Every morning, my grandma gets up early and ______ in the park near our house.", "options": ["walks", "walked", "walking", "to walk"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 1 題）", "explanation": "and 連接 gets up,兩動詞都用現在簡單式第三人稱單數 walks。", "explanationSource": "supplemental"}, {"id": 4, "question": "The little boy dropped his ice cream on the ground ______ to cry.", "options": ["starts", "started", "and started", "and starting"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 1 題）", "explanation": "dropped 為過去式,用 and 連接過去式 started。", "explanationSource": "supplemental"}, {"id": 5, "question": "David looked out of the balcony window and saw a woman get in his car ______ away.", "options": ["drive", "drove", "and drive", "and drove"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜感官動詞 saw + O + V1 and V2(原形)", "explanation": "【句型】感官動詞 see/hear/watch + O + 原形V(或Ving);兩個受詞補語用 and 連接,形式要一致。\n【分析】saw a woman get in his car 中 get 是原形,第二個動作「把車開走」也用原形 drive,並以 and 連接 → and drive。\n【其他選項】(A) drive 缺 and;(B)(D) drove 是過去式,感官動詞後的受詞補語不可用過去式。\n【例句】I saw him open the door and walk in.", "explanationSource": "source"}, {"id": 6, "question": "Amy heard her brother ______ the door and run out of the house.", "options": ["opens", "opened", "open", "to open"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 5 題）", "explanation": "感官動詞 heard + O + 原形 open,與後面的 run 形式一致。", "explanationSource": "supplemental"}, {"id": 7, "question": "We watched the dancers come onto the stage ______ a bow.", "options": ["and take", "took", "and took", "taking"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 5 題）", "explanation": "感官動詞後受詞補語用原形,come 與 take 以 and 連接 → and take。", "explanationSource": "supplemental"}, {"id": 8, "question": "Mr. Lin saw a thief climb over the wall ______ into his neighbor's house.", "options": ["got", "and got", "gets", "and get"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 5 題）", "explanation": "saw + O + 原形 climb ... and get,兩動作都用原形並以 and 連接。", "explanationSource": "supplemental"}, {"id": 9, "question": "I can't tell you what I think of the movie because I ______ it. I'll probably watch it this Saturday.", "options": ["am not seeing", "don't see", "haven't seen", "won't see"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜現在完成式 haven't p.p.(尚未做)", "explanation": "【句型】S + have/has not + p.p. (yet):表「到目前為止還沒做」。\n【分析】後句 I'll probably watch it this Saturday 表示這週六才要看,所以「到現在還沒看過」,用 haven't seen。\n【其他選項】(A) am not seeing 表此刻沒在看,與「無法評論」的理由不符;(B) don't see 現在簡單式表習慣,語意不通;(D) won't see 與後句「週六會看」矛盾。\n【例句】I haven't read the book yet, but I plan to.", "explanationSource": "source"}, {"id": 10, "question": "Jenny can't join us for dinner because she ______ her homework. She has to finish it first.", "options": ["didn't finish", "hasn't finished", "won't finish", "doesn't finish"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 9 題）", "explanation": "還沒寫完、現在必須先完成 → 現在完成式否定 hasn't finished。", "explanationSource": "supplemental"}, {"id": 11, "question": "I don't know how the new teacher looks because I ______ her yet.", "options": ["haven't met", "don't meet", "won't meet", "am not meeting"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 9 題）", "explanation": "句尾 yet 表「至今尚未」,用 haven't met。", "explanationSource": "supplemental"}, {"id": 12, "question": "Ben: Is the new coffee shop good?\nTina: I don't know. I ______ there. Let's go together tomorrow.", "options": ["didn't go", "won't go", "don't go", "haven't been"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 9 題）", "explanation": "到目前為止沒去過 → 現在完成式 haven't been。", "explanationSource": "supplemental"}, {"id": 13, "question": "Christmas ______ and I want to visit my aunt abroad. Do you have any plans yet?", "options": ["came", "comes", "is coming", "was coming"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜現在進行式表近未來(來去動詞 come)", "explanation": "【句型】來去動詞(come/go/leave/arrive)+ 現在進行式,可表示即將發生的未來。\n【分析】後面 I want to visit my aunt、Do you have any plans yet? 都表示在計畫未來,所以「聖誕節快到了」用 is coming。\n【其他選項】(A)(D) 過去式不合計畫未來的語境;(B) comes 表一般事實,不能表達「即將到來」。\n【例句】We are leaving for Tokyo next Friday.", "explanationSource": "source"}, {"id": 14, "question": "Hurry up! The train ______ in five minutes.", "options": ["left", "is leaving", "was leaving", "has left"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 13 題）", "explanation": "來去動詞 leave 用現在進行式表即將發生。", "explanationSource": "supplemental"}, {"id": 15, "question": "Summer vacation ______. Have you decided where to go?", "options": ["is coming", "came", "was coming", "has come"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 13 題）", "explanation": "暑假即將來臨,come 用進行式表近未來。", "explanationSource": "supplemental"}, {"id": 16, "question": "My cousin ______ to Taipei next week, so I'm going to show him around.", "options": ["came", "comes", "is coming", "was coming"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 13 題）", "explanation": "next week 為近期未來的安排,來去動詞用現在進行式。", "explanationSource": "supplemental"}, {"id": 17, "question": "Mom: Linda, you've been playing computer games all evening! Have you finished your report?\nLinda: Well, ______ most of it this afternoon, and I'll finish it by Friday.", "options": ["I would do", "I did", "I was doing", "I'll do"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜過去簡單式(this afternoon 已過去)", "explanation": "【句型】過去明確時間 + 過去簡單式。\n【分析】現在已是晚上(all evening),this afternoon 已經過去,「下午完成了大部分」用過去式 I did;後句 I'll finish it by Friday 才是未來。\n【其他選項】(A) would do 為過去未來式,不合;(C) was doing 只表當時正在做,不能表示「做完大部分」;(D) I'll do 是未來,與 this afternoon(已過)矛盾。\n【例句】I did my homework this morning.", "explanationSource": "source"}, {"id": 18, "question": "Dad: Did you clean your room?\nTom: Yes, I ______ it this morning before lunch.", "options": ["clean", "cleaned", "will clean", "am cleaning"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 17 題）", "explanation": "this morning 在午餐前已過去,用過去式 cleaned。", "explanationSource": "supplemental"}, {"id": 19, "question": "It's 9 p.m. now. Mia ______ two hours on her science project this afternoon.", "options": ["spent", "spends", "will spend", "is spending"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 17 題）", "explanation": "現在是晚上,this afternoon 已過 → 過去式 spent。", "explanationSource": "supplemental"}, {"id": 20, "question": "Teacher: Where is your homework, Leo?\nLeo: Sorry, I ______ it at home this morning. I'll bring it tomorrow.", "options": ["leave", "am leaving", "left", "will leave"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 17 題）", "explanation": "今早已發生的事用過去式 left;明天的事才用 will。", "explanationSource": "supplemental"}, {"id": 21, "question": "Listen! The baby ______ in the bedroom. Why don't you go in and take a look?", "options": ["cried", "cries", "is crying", "will cry"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜現在進行式(Listen! 此刻正在發生)", "explanation": "【句型】Listen! / Look! + S + is/are + Ving:表此刻正在發生的動作。\n【分析】Listen! 提示「現在聽到」,寶寶此刻正在哭,所以用 is crying,後面才叫對方進去看看。\n【其他選項】(A) cried 過去式不合當下;(B) cries 表習慣;(D) will cry 表未來,與 Listen! 不符。\n【例句】Look! The cat is climbing the tree.", "explanationSource": "source"}, {"id": 22, "question": "Look! Some students ______ basketball on the playground.", "options": ["play", "are playing", "played", "will play"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 21 題）", "explanation": "Look! 表此刻正在發生 → are playing。", "explanationSource": "supplemental"}, {"id": 23, "question": "Be quiet! Grandpa ______ in the living room.", "options": ["is sleeping", "sleeps", "slept", "has slept"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 21 題）", "explanation": "Be quiet! 表此刻爺爺正在睡,用現在進行式。", "explanationSource": "supplemental"}, {"id": 24, "question": "Listen! Someone ______ at the door. Can you open it?", "options": ["knocked", "knocks", "will knock", "is knocking"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 21 題）", "explanation": "Listen! 表當下聽到有人正在敲門 → is knocking。", "explanationSource": "supplemental"}, {"id": 25, "question": "Paul misses his parents a lot. He ______ them since he came to work in Taiwan a year ago.", "options": ["didn't see", "doesn't see", "hasn't seen", "won't see"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜現在完成式 since + 過去時間", "explanation": "【句型】S + have/has + p.p. + since + S + 過去式:從過去某時持續到現在。\n【分析】since he came to work in Taiwan a year ago 表示「從一年前來台至今」,所以主句用現在完成式 hasn't seen,說明一直沒見到父母(所以很想念)。\n【其他選項】(A) didn't see 過去式不能與 since 子句搭配表持續;(B) doesn't see 表習慣;(D) won't see 未來式不合。\n【例句】She has lived here since she was ten.", "explanationSource": "source"}, {"id": 26, "question": "My uncle ______ in Kaohsiung since he got a job there in 2020.", "options": ["lived", "has lived", "lives", "will live"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 25 題）", "explanation": "since + 過去時間點,主句用現在完成式 has lived。", "explanationSource": "supplemental"}, {"id": 27, "question": "Annie ______ any junk food since she started her diet last month.", "options": ["hasn't eaten", "doesn't eat", "didn't eat", "won't eat"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 25 題）", "explanation": "since 從上個月開始到現在都沒吃 → hasn't eaten。", "explanationSource": "supplemental"}, {"id": 28, "question": "We are good friends. We ______ each other since we were in elementary school.", "options": ["knew", "know", "will know", "have known"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 25 題）", "explanation": "since + 過去子句,主句用 have known 表持續至今。", "explanationSource": "supplemental"}, {"id": 29, "question": "Tina ______ hamburgers for lunch every day last week.", "options": ["has", "had", "has had", "was having"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜過去簡單式(last week 過去習慣)", "explanation": "【句型】明確過去時間(last week)→ 過去簡單式。\n【分析】every day last week 描述上週每天重複的動作,是過去的習慣,用過去式 had。\n【其他選項】(A) has 現在式與 last week 不符;(C) has had 現在完成式不可與明確過去時間連用;(D) was having 表當時正在吃,不能表示每天的習慣。\n【例句】I went swimming every weekend last summer.", "explanationSource": "source"}, {"id": 30, "question": "Jason ______ to school by bike every day last semester.", "options": ["goes", "has gone", "went", "is going"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 29 題）", "explanation": "last semester 明確過去時間 → 過去式 went。", "explanationSource": "supplemental"}, {"id": 31, "question": "My parents ______ TV every night when they were young.", "options": ["watched", "watch", "have watched", "are watching"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 29 題）", "explanation": "when they were young 表過去習慣 → watched。", "explanationSource": "supplemental"}, {"id": 32, "question": "It ______ a lot in Taipei last month, so we stayed home most of the time.", "options": ["rains", "has rained", "is raining", "rained"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 29 題）", "explanation": "last month 為過去時間 → 過去式 rained。", "explanationSource": "supplemental"}, {"id": 33, "question": "My brother doesn't live with us. He ______ out after he got married.", "options": ["has moved", "will move", "was moving", "moved"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜after + 過去式,主句過去式", "explanation": "【句型】主句 + after + S + 過去式:兩件都是過去發生的事,用過去簡單式。\n【分析】after he got married 是過去發生的事,「結婚後搬出去」也是過去已完成的動作,用 moved。\n【其他選項】(A) has moved 現在完成式不與過去時間子句 after he got married 連用;(B) will move 未來式與「已不住在一起」矛盾;(C) was moving 表當時正在搬,語意不合。\n【例句】He left the company after he found a better job.", "explanationSource": "source"}, {"id": 34, "question": "Lisa ______ the dishes after she finished dinner last night.", "options": ["washes", "washed", "has washed", "will wash"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 33 題）", "explanation": "last night 及 after 子句皆為過去 → washed。", "explanationSource": "supplemental"}, {"id": 35, "question": "After the movie ended, we ______ home by MRT.", "options": ["went", "go", "have gone", "will go"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 33 題）", "explanation": "After 子句 ended 為過去式,主句也用過去式 went。", "explanationSource": "supplemental"}, {"id": 36, "question": "Mr. Huang doesn't teach here anymore. He ______ after he turned sixty-five.", "options": ["retires", "will retire", "is retiring", "retired"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 33 題）", "explanation": "after he turned 65 是過去的事 → retired。", "explanationSource": "supplemental"}, {"id": 37, "question": "My sister is coming to my home today. She ______ with me for a week.", "options": ["stays", "stayed", "has stayed", "will stay"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜未來式 will + V", "explanation": "【句型】未來將發生的動作 → will + 原形V / be going to + V。\n【分析】姊姊今天才要來(is coming today),「住一週」是之後才會發生的事,用 will stay。\n【其他選項】(A) stays 表習慣;(B) stayed 過去式不合;(C) has stayed 表已住了一段時間,但她還沒到。\n【例句】My cousin is arriving tonight and will stay with us for a month.", "explanationSource": "source"}, {"id": 38, "question": "Our new classmate is arriving tomorrow. He ______ next to you.", "options": ["sat", "will sit", "has sat", "sits"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 37 題）", "explanation": "新同學明天才到,之後才會坐在你旁邊 → will sit。", "explanationSource": "supplemental"}, {"id": 39, "question": "Grandma is flying back to Tainan tomorrow. I ______ her at the airport.", "options": ["will meet", "met", "have met", "meet"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 37 題）", "explanation": "明天才發生的事 → will meet。", "explanationSource": "supplemental"}, {"id": 40, "question": "The typhoon is coming tonight. Schools ______ closed tomorrow.", "options": ["were", "are", "have been", "will be"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 37 題）", "explanation": "tomorrow 未來時間 → will be。", "explanationSource": "supplemental"}, {"id": 41, "question": "For the past twenty years, my father ______ in a school library. But he'll leave the job next month.", "options": ["worked", "has worked", "is working", "works"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜現在完成式 For the past + 時間", "explanation": "【句型】For the past + 一段時間 → 現在完成式 have/has + p.p.。\n【分析】For the past twenty years 表「過去二十年到現在」,且 he'll leave the job next month 表示他現在仍在工作,所以用 has worked。\n【其他選項】(A) worked 表已結束,但他下個月才離職;(C) is working 只表此刻;(D) works 現在簡單式無法表達「持續了多久」。\n【例句】For the past five years, she has taught English.", "explanationSource": "source"}, {"id": 42, "question": "For the past three months, Andy ______ English every night. His grades are getting better.", "options": ["studied", "studies", "has studied", "is studying"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 41 題）", "explanation": "For the past three months 持續到現在 → has studied。", "explanationSource": "supplemental"}, {"id": 43, "question": "Ms. Chang ______ at this school for ten years. She is going to retire this summer.", "options": ["has taught", "taught", "teaches", "will teach"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 41 題）", "explanation": "for ten years 且仍在任教 → 現在完成式 has taught。", "explanationSource": "supplemental"}, {"id": 44, "question": "My family ______ in this apartment for the past six years, but we'll move next year.", "options": ["lived", "live", "will live", "have lived"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 41 題）", "explanation": "For the past six years 到現在仍住 → have lived。", "explanationSource": "supplemental"}, {"id": 45, "question": "At first, my bookstore's business ______ not very good. But now it is doing quite well.", "options": ["is", "does", "was", "did"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜過去式 vs. 現在式對比(At first … But now)", "explanation": "【句型】At first + 過去式 …, But now + 現在式:對比過去與現在。\n【分析】At first「起初」指過去,後面 not very good 是形容詞補語,需要 be 動詞;主詞 business 為單數 → was。\n【其他選項】(A) is 現在式與 At first 不合;(B)(D) does/did 是助動詞,後面不能直接接形容詞 good,且缺主要動詞。\n【例句】At first, I was shy, but now I'm outgoing.", "explanationSource": "source"}, {"id": 46, "question": "At first, the new student ______ very quiet. But now she talks with everyone.", "options": ["is", "was", "does", "did"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 45 題）", "explanation": "At first 表過去,後接形容詞用 be 動詞過去式 was。", "explanationSource": "supplemental"}, {"id": 47, "question": "Ten years ago, this town ______ only one convenience store. Now it has five.", "options": ["had", "has", "have", "is having"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 45 題）", "explanation": "Ten years ago 為過去,have 表擁有 → had。", "explanationSource": "supplemental"}, {"id": 48, "question": "When I was little, I ______ afraid of dogs. But now I have two of them.", "options": ["am", "did", "do", "was"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 45 題）", "explanation": "When I was little 表過去,afraid 為形容詞 → was。", "explanationSource": "supplemental"}, {"id": 49, "question": "Mozart ______ his first music when he was only six years old.", "options": ["is writing", "has written", "will write", "wrote"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜過去簡單式(when he was six)", "explanation": "【句型】明確過去時間 → 過去簡單式。\n【分析】when he was only six years old 是過去明確時間點,莫札特六歲時寫下第一首曲子,用 wrote。\n【其他選項】(A) is writing 現在進行式不合;(B) has written 現在完成式不可與明確過去時間連用;(C) will write 未來式不合。\n【例句】Edison invented the light bulb in 1879.", "explanationSource": "source"}, {"id": 50, "question": "My grandfather ______ to Taipei when he was eighteen.", "options": ["moves", "has moved", "moved", "will move"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 49 題）", "explanation": "when he was eighteen 為明確過去時間 → moved。", "explanationSource": "supplemental"}, {"id": 51, "question": "Jolin ______ her first song when she was in junior high school.", "options": ["sang", "sings", "has sung", "is singing"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 49 題）", "explanation": "when she was in junior high 為過去 → sang。", "explanationSource": "supplemental"}, {"id": 52, "question": "I ______ how to ride a bike when I was five years old.", "options": ["learn", "have learned", "will learn", "learned"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 49 題）", "explanation": "when I was five 明確過去時間 → learned。", "explanationSource": "supplemental"}, {"id": 53, "question": "We were so sure that Jerry ______ well on the difficult job. His past experience in other work showed he was the right guy for it. So when he failed, no one believed it.", "options": ["had done", "did", "has done", "would do"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜過去未來式 would + V(were sure that …)", "explanation": "【句型】主句過去式 + that + S + would + 原形V:表「從過去的角度看將會發生的事」(過去未來式)。\n【分析】主句 were sure 是過去式,當時我們確信 Jerry「將會」把工作做好(那時還沒做),所以用 would do;後面 when he failed 才說明結果。\n【其他選項】(A) had done 表當時已完成;(B) did 表事實已發生,但他其實失敗了;(C) has done 與主句過去時態不一致。\n【例句】She told me she would come back next week.", "explanationSource": "source"}, {"id": 54, "question": "Mandy thought it ______ rain, so she brought an umbrella.", "options": ["will", "would", "is going to", "has"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 53 題）", "explanation": "主句 thought 為過去式,子句用過去未來式 would。", "explanationSource": "supplemental"}, {"id": 55, "question": "Last night, Dad promised that he ______ me to the zoo this Sunday.", "options": ["would take", "takes", "took", "has taken"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 53 題）", "explanation": "過去答應「將會」帶我去 → would take。", "explanationSource": "supplemental"}, {"id": 56, "question": "Everyone believed our team ______ the game, but we lost in the end.", "options": ["wins", "has won", "will win", "would win"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 53 題）", "explanation": "believed 為過去式,當時認為將會贏 → would win。", "explanationSource": "supplemental"}, {"id": 57, "question": "Stella is a baseball fan. She ______ more than one hundred pictures of famous baseball players.", "options": ["has", "has been", "is", "is having"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜have 表擁有(狀態動詞不用進行式)", "explanation": "【句型】have/has 表「擁有」是狀態動詞,用現在簡單式,不用進行式。\n【分析】「她擁有一百多張棒球明星照片」,主詞 She 單數 → has。\n【其他選項】(B) has been 後面不接名詞當受詞;(C) is 是 be 動詞,不能表示「擁有」;(D) is having 指「正在吃/正在進行」,不能表擁有。\n【例句】I have three cats.(不可說 I am having three cats.)", "explanationSource": "source"}, {"id": 58, "question": "Kevin loves music. He ______ a guitar, a piano, and two violins.", "options": ["is having", "has", "is", "have"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 57 題）", "explanation": "have 表擁有用現在簡單式,主詞單數 → has。", "explanationSource": "supplemental"}, {"id": 59, "question": "Shhh! We ______ a meeting now. Please come back later.", "options": ["are having", "have", "had", "has"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 57 題）", "explanation": "have a meeting 表「舉行」為動作,可用進行式;Shhh!/now 表此刻正在進行。", "explanationSource": "supplemental"}, {"id": 60, "question": "My aunt ______ a big house with a beautiful garden in Yilan.", "options": ["is having", "have", "is", "has"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 57 題）", "explanation": "表擁有的 have 不用進行式,主詞單數 → has。", "explanationSource": "supplemental"}, {"id": 61, "question": "______ that last piece of pie? If not, can I have it? I didn't eat much this morning.", "options": ["Had you eaten", "Were you eating", "Do you eat", "Are you going to eat"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜be going to 問打算(未來計畫)", "explanation": "【句型】Are you going to + V? 詢問對方「是否打算做某事」。\n【分析】後句 If not, can I have it? 表示派還在,說話者想先確認對方打不打算吃,用 Are you going to eat。\n【其他選項】(A) 過去完成式不合;(B) 問過去某時是否正在吃,不合;(C) Do you eat 問習慣,與「最後一塊派」不搭。\n【例句】Are you going to watch the game tonight?", "explanationSource": "source"}, {"id": 62, "question": "______ the old bike? If not, I'd like to buy it from you.", "options": ["Did you use", "Were you using", "Are you going to keep", "Have you kept"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 61 題）", "explanation": "問對方打不打算留下這台車 → Are you going to keep。", "explanationSource": "supplemental"}, {"id": 63, "question": "______ this weekend? We can go hiking together if you're free.", "options": ["What are you going to do", "What did you do", "What were you doing", "What have you done"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 61 題）", "explanation": "問週末計畫 → be going to。", "explanationSource": "supplemental"}, {"id": 64, "question": "Mom: ______ your old toys? If not, we can give them to the children's home.", "options": ["Did you play with", "Were you playing with", "Had you played with", "Are you going to play with"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 61 題）", "explanation": "問未來是否還要玩 → Are you going to play with。", "explanationSource": "supplemental"}, {"id": 65, "question": "When the baby cried, Mr. Wu ______ in the kitchen and did not hear it.", "options": ["cooked", "was cooking", "has cooked", "is going to cook"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜過去進行式 When + 過去式, S + was/were + Ving", "explanation": "【句型】When + S + 過去簡單式, S + was/were + Ving:過去某個短動作發生時,另一個長動作正在進行。\n【分析】寶寶哭的時候,吳先生「正在」廚房煮飯,所以沒聽到 → was cooking。\n【其他選項】(A) cooked 只表做過,無法說明「同時正在做所以沒聽到」;(C) 現在完成式、(D) 未來式皆不合過去情境。\n【例句】When the phone rang, I was taking a shower.", "explanationSource": "source"}, {"id": 66, "question": "When the earthquake happened, we ______ dinner.", "options": ["have", "were having", "had had", "are having"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 65 題）", "explanation": "地震發生時正在吃飯 → were having。", "explanationSource": "supplemental"}, {"id": 67, "question": "When Dad came home, my sister ______ the piano in her room.", "options": ["was practicing", "practices", "has practiced", "will practice"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 65 題）", "explanation": "爸爸回家時姊姊正在練琴 → was practicing。", "explanationSource": "supplemental"}, {"id": 68, "question": "Jeff didn't answer your call because he ______ a shower when you called.", "options": ["takes", "has taken", "took", "was taking"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 65 題）", "explanation": "你打電話時他正在洗澡,所以沒接 → was taking。", "explanationSource": "supplemental"}, {"id": 69, "question": "Aunt Gina has lived in this town for more than sixty years, so she ______ it very well.", "options": ["will know", "knew", "knows", "was going to know"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜現在完成式 + so + 現在簡單式(結果)", "explanation": "【句型】現在完成式(持續至今), so + 現在簡單式(現在的結果/狀態)。\n【分析】Gina 阿姨在這個鎮住了六十多年(到現在),所以「現在」很熟悉 → knows;know 是狀態動詞,用現在簡單式。\n【其他選項】(A) will know 未來式不合;(B) knew 表過去熟悉,與現在仍住在此不合;(D) 過去未來式不合。\n【例句】She has worked here for 20 years, so she knows everyone.", "explanationSource": "source"}, {"id": 70, "question": "Ray has studied Japanese for five years, so he ______ it quite well.", "options": ["spoke", "speaks", "will speak", "was speaking"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 69 題）", "explanation": "學了五年到現在,現在會說 → speaks。", "explanationSource": "supplemental"}, {"id": 71, "question": "Our team has practiced hard for months, so we ______ ready for the game now.", "options": ["are", "were", "will be", "have"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 69 題）", "explanation": "now 表現在的狀態 → are。", "explanationSource": "supplemental"}, {"id": 72, "question": "Mrs. Lin has taught here since 2005, so she ______ almost every teacher in the school.", "options": ["knew", "will know", "is knowing", "knows"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 69 題）", "explanation": "know 為狀態動詞,表現在的結果用 knows。", "explanationSource": "supplemental"}, {"id": 73, "question": "I don't have any money with me because I ______ my wallet this morning.", "options": ["had lost", "would lose", "lost", "was losing"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜過去簡單式(this morning 已過去)", "explanation": "【句型】明確過去時間 → 過去簡單式。\n【分析】this morning 是已過去的明確時間,今天早上弄丟錢包,所以現在身上沒錢 → lost。\n【其他選項】(A) had lost 過去完成式需要另一個過去時間當參考點;(B) would lose 過去未來式不合;(D) was losing 表正在丟,語意不通。\n【例句】I missed the bus this morning.", "explanationSource": "source"}, {"id": 74, "question": "I'm really tired now because I ______ only four hours last night.", "options": ["sleep", "slept", "have slept", "will sleep"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 73 題）", "explanation": "last night 明確過去時間 → slept。", "explanationSource": "supplemental"}, {"id": 75, "question": "Jim can't play basketball today because he ______ his leg yesterday.", "options": ["hurt", "hurts", "will hurt", "was hurting"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 73 題）", "explanation": "yesterday 過去時間 → hurt(過去式同形)。", "explanationSource": "supplemental"}, {"id": 76, "question": "Our classroom is so clean! The students ______ it this afternoon.", "options": ["clean", "will clean", "have cleaned", "cleaned"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 73 題）", "explanation": "this afternoon 已過去的明確時間 → cleaned。", "explanationSource": "supplemental"}, {"id": 77, "question": "Lisa: What ______ this morning?\nTina: Well, it's Sunday. I think I'll go to church with my father.", "options": ["have you done", "are you going to do", "did you do", "were you doing"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜be going to 問未來計畫(看答句時態)", "explanation": "【句型】What + are you going to + V? 詢問未來計畫。\n【分析】Tina 回答 I think I'll go to church(未來式),表示今天早上還沒到/還沒過,Lisa 問的是「今天早上打算做什麼」→ are you going to do。注意不要只看 this morning 就選過去式,要看回答的時態。\n【其他選項】(A) have you done 問已做了什麼;(C) did you do 問過去;(D) were you doing 問過去某時正在做什麼,皆與答句的未來式不合。\n【例句】A: What are you going to do tonight? B: I'll watch a movie.", "explanationSource": "source"}, {"id": 78, "question": "Amy: What ______ this evening?\nBen: I'll probably stay home and read.", "options": ["did you do", "have you done", "are you going to do", "were you doing"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 77 題）", "explanation": "答句用 I'll → 問未來計畫 are you going to do。", "explanationSource": "supplemental"}, {"id": 79, "question": "Dad: Where ______ this afternoon?\nKai: I went to the library with Eric.", "options": ["did you go", "are you going", "will you go", "do you go"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 77 題）", "explanation": "答句用過去式 went → 問句用 did you go。", "explanationSource": "supplemental"}, {"id": 80, "question": "Ken: How ______ to Kenting this weekend?\nMay: We'll take the bus.", "options": ["did you get", "have you got", "were you getting", "are you going to get"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 77 題）", "explanation": "答句 We'll take → 問未來 are you going to get。", "explanationSource": "supplemental"}, {"id": 81, "question": "She ______ to the department store and bought two new sweaters for her husband.", "options": ["has gone", "is going", "went", "goes"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜對等連接 V1 and V2 時態一致(went and bought)", "explanation": "【句型】S + V1 + and + V2:and 連接的兩個動詞時態須一致。\n【分析】後面 bought 是過去式,前面「去百貨公司」也要用過去式 went。\n【其他選項】(A) has gone 現在完成式與 bought 不對等;(B) is going 進行式不對等;(D) goes 現在式不對等。\n【例句】She went to the store and bought some milk.", "explanationSource": "source"}, {"id": 82, "question": "Yesterday Peter ______ his room and did his homework.", "options": ["cleans", "cleaned", "has cleaned", "is cleaning"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 81 題）", "explanation": "and 後 did 為過去式,前面也用過去式 cleaned。", "explanationSource": "supplemental"}, {"id": 83, "question": "Every weekend, Ella goes to the market and ______ fresh fruit.", "options": ["buys", "bought", "buying", "to buy"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 81 題）", "explanation": "and 連接 goes,同為現在簡單式第三人稱單數 buys。", "explanationSource": "supplemental"}, {"id": 84, "question": "Last night my dad ______ home late and went to bed right away.", "options": ["comes", "has come", "is coming", "came"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 81 題）", "explanation": "went 為過去式,前面對等用 came。", "explanationSource": "supplemental"}, {"id": 85, "question": "Excuse me. I really need to go now. My kids ______ for me at school.", "options": ["are waiting", "were waiting", "wait", "waited"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜現在進行式(此刻正在進行)", "explanation": "【句型】S + am/is/are + Ving:表說話當下正在進行的動作。\n【分析】I really need to go now 是說話當下,孩子「此刻正在」學校等我,所以我得走了 → are waiting。\n【其他選項】(B) were waiting 過去進行式不合當下;(C) wait 表習慣;(D) waited 過去式不合。\n【例句】Sorry, I can't talk now. I'm driving.", "explanationSource": "source"}, {"id": 86, "question": "Sorry, I can't talk now. I ______ for my math test tomorrow.", "options": ["studied", "am studying", "study", "was studying"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 85 題）", "explanation": "now 表當下正在準備 → am studying。", "explanationSource": "supplemental"}, {"id": 87, "question": "Turn off the TV, please. Your brother ______ to sleep in the next room.", "options": ["is trying", "tried", "tries", "has tried"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 85 題）", "explanation": "弟弟此刻正在試著睡覺 → is trying。", "explanationSource": "supplemental"}, {"id": 88, "question": "Hurry up! Everyone ______ for us in front of the school bus.", "options": ["waited", "waits", "was waiting", "is waiting"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 85 題）", "explanation": "Hurry up! 表此刻大家正在等 → is waiting。", "explanationSource": "supplemental"}, {"id": 89, "question": "The weather ______ rainy and cloudy in the last few days. I hope the sun will come out soon.", "options": ["has been", "had been", "will be", "would be"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜現在完成式 in the last few days", "explanation": "【句型】in the last/past few days → 現在完成式,表從過去持續到現在。\n【分析】in the last few days「最近幾天(到現在)」天氣一直陰雨,所以希望太陽快出來 → has been。\n【其他選項】(B) had been 過去完成式需要過去的參考時間點;(C) will be 未來式不合;(D) would be 過去未來式不合。\n【例句】He has been busy in the past two weeks.", "explanationSource": "source"}, {"id": 90, "question": "I ______ very busy in the past few weeks, so I haven't called you.", "options": ["was", "have been", "had been", "will be"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 89 題）", "explanation": "in the past few weeks 持續至今 → have been。", "explanationSource": "supplemental"}, {"id": 91, "question": "Prices ______ a lot in the last two years. Everything is so expensive now.", "options": ["have gone up", "went up", "will go up", "go up"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 89 題）", "explanation": "in the last two years 到現在 → 現在完成式 have gone up。", "explanationSource": "supplemental"}, {"id": 92, "question": "Ivy ______ three books in the last few days. She really loves reading.", "options": ["reads", "will read", "had read", "has read"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 89 題）", "explanation": "in the last few days → has read。", "explanationSource": "supplemental"}, {"id": 93, "question": "Have you got anything for Joe ______? He'd be happy to get your gift on his birthday.", "options": ["almost", "either", "soon", "yet"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜現在完成式疑問句 + yet", "explanation": "【句型】Have/Has + S + p.p. ... yet?「(到目前為止)已經…了嗎?」\n【分析】Have you got ...? 是現在完成式問句,問「你已經幫 Joe 準備好禮物了嗎」,句尾用 yet。\n【其他選項】(A) almost「幾乎」不放句尾修飾此問句;(B) either 用在否定句尾表「也」;(C) soon「很快」不與現在完成式問句搭配。\n【例句】Have you finished your homework yet?", "explanationSource": "source"}, {"id": 94, "question": "Have you cleaned your room ______? Grandma is coming in ten minutes.", "options": ["already", "yet", "ever", "soon"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 93 題）", "explanation": "現在完成式疑問句句尾用 yet。", "explanationSource": "supplemental"}, {"id": 95, "question": "I haven't decided what to buy for Mom's birthday ______.", "options": ["yet", "already", "too", "either"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 93 題）", "explanation": "現在完成式否定句句尾用 yet 表「還沒」。", "explanationSource": "supplemental"}, {"id": 96, "question": "Don't worry. I've ______ bought the tickets for the concert.", "options": ["yet", "either", "ever", "already"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 93 題）", "explanation": "肯定句表「已經」用 already,放在 have 與 p.p. 之間。", "explanationSource": "supplemental"}, {"id": 97, "question": "On Children's Day, Ms. Lee, a famous storybook writer, ______ to Molly's Bookstore to talk about her new book. My two little kids just can't wait to see her.", "options": ["came", "was coming", "has come", "is going to come"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜be going to + V(未來計畫)", "explanation": "【句型】be going to + 原形V:表未來的計畫或安排。\n【分析】後句 My two little kids just can't wait to see her「等不及要見她」,表示活動還沒發生 → is going to come。\n【其他選項】(A) came 表已來過;(B) was coming 過去進行式不合;(C) has come 表已經來了,都與「等不及要見她」矛盾。\n【例句】She is going to give a speech tomorrow.", "explanationSource": "source"}, {"id": 98, "question": "Jay Chou ______ a concert in Taichung next month. My sister can't wait to buy a ticket.", "options": ["held", "is going to hold", "has held", "was holding"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 97 題）", "explanation": "next month 且「等不及買票」→ 未來 is going to hold。", "explanationSource": "supplemental"}, {"id": 99, "question": "The school ______ a sports day this Friday. All the students are excited about it.", "options": ["is going to have", "had", "has had", "was having"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 97 題）", "explanation": "this Friday 尚未發生 → is going to have。", "explanationSource": "supplemental"}, {"id": 100, "question": "A famous baseball player ______ our school next week. Everyone is looking forward to meeting him.", "options": ["visited", "has visited", "was visiting", "is going to visit"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 97 題）", "explanation": "next week 未來 → is going to visit。", "explanationSource": "supplemental"}, {"id": 101, "question": "Betty ______ fake watches when the police came.", "options": ["sells", "is selling", "was selling", "has sold"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜過去進行式 when + 過去式", "explanation": "【句型】S + was/were + Ving + when + S + 過去簡單式:過去某事發生時,另一動作正在進行。\n【分析】when the police came 是過去的短動作,當時 Betty「正在」賣假錶 → was selling。\n【其他選項】(A) sells、(B) is selling 現在時態與 came 不合;(D) has sold 現在完成式不合。\n【例句】I was reading when the doorbell rang.", "explanationSource": "source"}, {"id": 102, "question": "Steve ______ a video game when his mom walked into his room.", "options": ["plays", "was playing", "has played", "is playing"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 101 題）", "explanation": "媽媽進房時正在玩 → was playing。", "explanationSource": "supplemental"}, {"id": 103, "question": "The students ______ loudly when the teacher came in.", "options": ["were talking", "talk", "have talked", "are talking"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 101 題）", "explanation": "老師進來時學生正在聊天 → were talking。", "explanationSource": "supplemental"}, {"id": 104, "question": "We ______ along the beach when it started to rain.", "options": ["walk", "have walked", "are walking", "were walking"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 101 題）", "explanation": "開始下雨時正在散步 → were walking。", "explanationSource": "supplemental"}, {"id": 105, "question": "Betty ______ TV when her little brother fell off the chair.", "options": ["watched", "was watching", "has watched", "is going to watch"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜過去進行式 when + 過去式", "explanation": "【句型】S + was/were + Ving + when + S + 過去簡單式。\n【分析】弟弟從椅子上摔下來(過去短動作)時,Betty「正在」看電視(進行中的動作)→ was watching。\n【其他選項】(A) watched 只表完成的動作,無法表示「同時正在進行」;(C) has watched、(D) is going to watch 時態不合過去情境。\n【例句】I was doing my homework when the lights went out.", "explanationSource": "source"}, {"id": 106, "question": "Grandpa ______ in the garden when he heard a strange sound.", "options": ["works", "was working", "has worked", "will work"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 105 題）", "explanation": "聽到聲音時正在花園工作 → was working。", "explanationSource": "supplemental"}, {"id": 107, "question": "When I called Nina last night, she ______ dinner with her family.", "options": ["was having", "has", "has had", "is having"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 105 題）", "explanation": "我打電話時她正在吃晚餐 → was having。", "explanationSource": "supplemental"}, {"id": 108, "question": "My mom ______ the floor when the cat jumped onto the table.", "options": ["cleans", "is cleaning", "has cleaned", "was cleaning"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 105 題）", "explanation": "貓跳上桌時媽媽正在拖地 → was cleaning。", "explanationSource": "supplemental"}, {"id": 109, "question": "Christine: Dad, I'm hungry. Do we have anything to eat?\nMr. Chen: You can have some bread I ______ from the supermarket. It's on the table.", "options": ["am buying", "to buy", "bought", "will buy"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜關係子句中的時態(省略關代 that 的子句用過去式)", "explanation": "【句型】N + (that/which) + S + V:關係子句(省略關代)中的動詞依實際時間決定時態。\n【分析】bread (that) I ______ from the supermarket 修飾 bread;It's on the table 表示麵包已經買回來了,所以「買」是過去的動作 → bought。\n【其他選項】(A) am buying 表正在買,但麵包已在桌上;(B) to buy 不是主要動詞,子句缺動詞;(D) will buy 表還沒買,與「在桌上」矛盾。\n【例句】The cake my mom made yesterday was delicious.", "explanationSource": "source"}, {"id": 110, "question": "The shoes Mandy ______ last week are too small for her now.", "options": ["buys", "bought", "will buy", "is buying"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 109 題）", "explanation": "last week 已買 → 關係子句用過去式 bought。", "explanationSource": "supplemental"}, {"id": 111, "question": "The movie we ______ last night was really scary.", "options": ["saw", "see", "will see", "are seeing"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 109 題）", "explanation": "last night → 子句用過去式 saw。", "explanationSource": "supplemental"}, {"id": 112, "question": "You can borrow the comic books my uncle ______ me for my birthday. They're on my desk.", "options": ["gives", "will give", "is giving", "gave"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 109 題）", "explanation": "書已在桌上,送書是過去的事 → gave。", "explanationSource": "supplemental"}, {"id": 113, "question": "B&J Café ______ known as the tallest building in town. However, O&G Restaurant became the tallest building in 2010.", "options": ["has been", "had been", "is", "would be"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜過去完成式 had been(過去某時之前的狀態)", "explanation": "【句型】S + had + p.p.:過去完成式,表在過去某時間點「之前」一直持續的狀態。\n【分析】O&G Restaurant 在 2010 年(過去)成為最高建築,表示 B&J Café 是在 2010 年「之前」被稱為最高建築 → had been known。\n【其他選項】(A) has been 表持續到現在,但它現在已不是最高;(C) is 現在式與事實不符;(D) would be 過去未來式語意不合。\n【例句】Mr. Wang had been a teacher for ten years before he became a writer in 2015.\n備註：參考解答(4f68a85b.txt)答案同為 B,但其解析寫成 was;依截圖選項 (B) 為 had been,已改寫為過去完成式解析。", "explanationSource": "source"}, {"id": 114, "question": "Ms. Lin ______ in Hualien for five years before she moved to Taipei in 2019.", "options": ["has lived", "had lived", "lives", "will live"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 113 題）", "explanation": "在 2019 年搬家之前已住了五年 → 過去完成式 had lived。", "explanationSource": "supplemental"}, {"id": 115, "question": "When we got to the theater, the movie ______ already ______.", "options": ["had; started", "has; started", "will; start", "is; starting"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 113 題）", "explanation": "到達(過去)之前電影已開始 → had already started。", "explanationSource": "supplemental"}, {"id": 116, "question": "This old house ______ empty for many years before the Chens bought it last year.", "options": ["has been", "is", "will be", "had been"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 113 題）", "explanation": "去年買下之前已空了很多年 → had been。", "explanationSource": "supplemental"}, {"id": 117, "question": "Smart Head, one of the hottest TV programs these days, ______ people free plane tickets to Hawaii if they can answer 20 questions correctly in 15 minutes.", "options": ["have given", "gives", "giving", "to give"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜整句缺主要動詞(主詞+同位語後接現在式動詞)", "explanation": "【句型】S(, 同位語,)+ V:主詞後插入同位語,句子仍需主要動詞,且動詞單複數依主詞決定。\n【分析】主詞是 Smart Head(單數節目名),one of the hottest TV programs these days 是同位語;句子缺主要動詞,節目規則是現在的固定事實 → 現在簡單式 gives。\n【其他選項】(A) have given 主詞單數應用 has,且完成式不適合表節目規則;(C) giving、(D) to give 不能當主要動詞。\n【例句】Mr. Chen, our new English teacher, comes from Canada.", "explanationSource": "source"}, {"id": 118, "question": "Lucy, one of my best friends, ______ in Tainan with her grandparents.", "options": ["live", "lives", "living", "to live"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 117 題）", "explanation": "主詞 Lucy 單數,同位語不影響 → lives。", "explanationSource": "supplemental"}, {"id": 119, "question": "The night market, one of the most popular places in town, ______ open until midnight every day.", "options": ["stays", "stay", "staying", "to stay"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 117 題）", "explanation": "主詞 The night market 單數,每天的事實 → stays。", "explanationSource": "supplemental"}, {"id": 120, "question": "My parents, both teachers at a junior high school, ______ to work by MRT every day.", "options": ["goes", "going", "to go", "go"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 117 題）", "explanation": "主詞 My parents 複數 → go。", "explanationSource": "supplemental"}, {"id": 121, "question": "Yesterday when I got home from work, my brother ______ for dinner, so he invited me to join him.", "options": ["goes out", "went out", "has gone out", "was going out"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜過去進行式表當時正要做(was going out)", "explanation": "【句型】When + S + 過去式, S + was/were + Ving:表過去某時「正在/正要」做某事。\n【分析】我昨天下班回到家時,哥哥「正要」出門吃晚餐,所以才邀我一起去 → was going out。\n【其他選項】(A) goes out 現在式不合 yesterday;(B) went out 表已經出門,就無法當面邀我;(C) has gone out 表已出門不在,也無法邀我。\n【例句】When I saw Amy, she was leaving for school.", "explanationSource": "source"}, {"id": 122, "question": "When I called Ben last night, he ______ for the airport, so he couldn't talk long.", "options": ["leaves", "was leaving", "has left", "left"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 121 題）", "explanation": "我打電話時他正要出發 → was leaving。", "explanationSource": "supplemental"}, {"id": 123, "question": "When we arrived at the station, the train ______, so we had to run.", "options": ["was leaving", "leaves", "has left", "will leave"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 121 題）", "explanation": "抵達時火車正要開,所以要跑 → was leaving。", "explanationSource": "supplemental"}, {"id": 124, "question": "When Mom got home, Dad ______ dinner in the kitchen, so she helped him.", "options": ["cooks", "cooked", "has cooked", "was cooking"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 121 題）", "explanation": "媽媽到家時爸爸正在煮,所以去幫忙 → was cooking。", "explanationSource": "supplemental"}, {"id": 125, "question": "Lily: When will Uncle Tom come to see me?\nMom: He'll visit us this weekend. He ______ me that by e-mail.", "options": ["told", "tells", "will tell", "was going to tell"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜過去簡單式(已發生的事)", "explanation": "【句型】過去已發生的動作 → 過去簡單式。\n【分析】媽媽已經知道 Tom 叔叔週末會來,表示 Tom「已經」用 e-mail 告訴她了 → told。\n【其他選項】(B) tells 現在式表習慣,不合;(C) will tell 表還沒說,那媽媽就不會知道;(D) was going to tell 表「當時打算說(但可能沒說)」,不合。\n【例句】I know the answer because Sam told me this morning.", "explanationSource": "source"}, {"id": 126, "question": "Ann: How do you know about the party?\nBill: Kevin ______ me about it yesterday.", "options": ["tells", "told", "will tell", "is telling"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 125 題）", "explanation": "已經告訴我,yesterday → told。", "explanationSource": "supplemental"}, {"id": 127, "question": "Dad knows I'm going to the zoo. I ______ him about it last night.", "options": ["told", "tell", "will tell", "am telling"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 125 題）", "explanation": "last night 已告訴 → told。", "explanationSource": "supplemental"}, {"id": 128, "question": "Mia: Is Mr. Lee sick today?\nJoe: Yes. He ______ us in class this morning.", "options": ["tells", "will tell", "has told", "told"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 125 題）", "explanation": "this morning 已過去 → told。", "explanationSource": "supplemental"}, {"id": 129, "question": "I ______ a bath when someone turned off the light. I was scared and shouted for help.", "options": ["was taking", "took", "am taking", "had taken"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜過去進行式 when + 過去式", "explanation": "【句型】S + was/were + Ving + when + S + 過去簡單式。\n【分析】有人關燈(過去短動作)時,我「正在」洗澡 → was taking;後句 I was scared 也是過去情境。\n【其他選項】(B) took 只表做過,無法表示「當時正在洗」;(C) am taking 現在進行式時態不合;(D) had taken 表在關燈前已洗完,就不會害怕呼救。\n【例句】I was sleeping when the earthquake happened.", "explanationSource": "source"}, {"id": 130, "question": "I ______ my homework when the lights suddenly went out.", "options": ["do", "was doing", "have done", "am doing"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 129 題）", "explanation": "停電時正在寫作業 → was doing。", "explanationSource": "supplemental"}, {"id": 131, "question": "Ryan ______ his bike when it started to rain heavily.", "options": ["was riding", "rides", "has ridden", "is riding"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 129 題）", "explanation": "開始下大雨時正在騎車 → was riding。", "explanationSource": "supplemental"}, {"id": 132, "question": "My sister ______ on the phone when the doorbell rang, so I opened the door.", "options": ["talks", "has talked", "is talking", "was talking"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 129 題）", "explanation": "門鈴響時姊姊正在講電話 → was talking。", "explanationSource": "supplemental"}, {"id": 133, "question": "We ______ Aunt Polly for a long time, so we visited her last weekend.", "options": ["don't see", "haven't seen", "hadn't seen", "wouldn't see"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜過去完成式 hadn't p.p.(過去某時之前一直沒…)", "explanation": "【句型】S + had(not) + p.p. + for + 一段時間, so + S + 過去式:過去某動作之前一直持續的狀態用過去完成式。\n【分析】last weekend 去拜訪她(過去),在此「之前」已經很久沒見到她 → hadn't seen。\n【其他選項】(A) don't see 現在式不合過去脈絡;(B) haven't seen 表到現在都沒見,但上週末已經見過;(D) wouldn't see 語意不合。\n【例句】I hadn't eaten all day, so I was very hungry at dinner.\n備註：參考解答(4f68a85b.txt)此題為改編版,選項 (C) 為 didn't see 並以過去式解析;截圖原題 (C) 為 hadn't seen,答案同為 C,解析改依過去完成式。", "explanationSource": "source"}, {"id": 134, "question": "Ray ______ his grandparents for two years, so he flew to Canada to see them last summer.", "options": ["hasn't visited", "hadn't visited", "doesn't visit", "won't visit"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 133 題）", "explanation": "去年夏天拜訪之前已兩年沒去 → hadn't visited。", "explanationSource": "supplemental"}, {"id": 135, "question": "Eric was very hungry at lunch because he ______ breakfast.", "options": ["hadn't eaten", "doesn't eat", "hasn't eaten", "won't eat"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 133 題）", "explanation": "午餐時(過去)之前沒吃早餐 → hadn't eaten。", "explanationSource": "supplemental"}, {"id": 136, "question": "We ______ such a beautiful sunset before, so we took many pictures that evening.", "options": ["haven't seen", "don't see", "won't see", "had never seen"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 133 題）", "explanation": "那晚之前從沒看過 → 過去完成式 had never seen。", "explanationSource": "supplemental"}, {"id": 137, "question": "See? The strange man I saw yesterday ______ around my house again. Should I call the police?", "options": ["walking", "is walking", "and walked", "to walk"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜整句缺主要動詞＋現在進行式", "explanation": "【句型】S（＋省略關代的修飾子句）＋主要動詞。The man (whom) I saw yesterday 只是主詞，後面仍需一個主要動詞。\n【分析】主詞 The strange man I saw yesterday 後缺主要動詞；See? 表示「你看，此刻他又在我家附近走來走去」，用現在進行式 is walking。\n【其他選項】(A)(D) walking、to walk 不能當主要動詞；(C) and walked 前面沒有可對等連接的動詞，且時態不合「此刻」。\n【例句】The girl I met at the party is waiting for you outside.", "explanationSource": "source"}, {"id": 138, "question": "The boy you helped last week ______ at the door now. He wants to thank you.", "options": ["standing", "to stand", "is standing", "and stood"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 137 題）", "explanation": "主詞 The boy (whom) you helped last week 後缺主要動詞，now 表此刻，用 is standing。", "explanationSource": "supplemental"}, {"id": 139, "question": "The book Mr. Lin gave me last month ______ very interesting.", "options": ["is", "being", "to be", "and was"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 137 題）", "explanation": "主詞 The book (that) Mr. Lin gave me 後缺主要動詞，描述現在看法用 is。", "explanationSource": "supplemental"}, {"id": 140, "question": "Look! The cat we found in the park ______ with my sister's toy.", "options": ["playing", "is playing", "to play", "and played"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 137 題）", "explanation": "Look! 表此刻正在發生，主詞後缺主要動詞，用現在進行式 is playing。", "explanationSource": "supplemental"}, {"id": 141, "question": "In my family, my sister is the only person who ______ chocolate.", "options": ["love", "loves", "loved", "loving"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜關代 who 後動詞與先行詞一致", "explanation": "【句型】先行詞＋who＋V，關係子句動詞的單複數跟著先行詞。\n【分析】先行詞 the only person 是單數；句子描述現在的喜好（主句 is），用現在簡單式第三人稱單數 loves。\n【其他選項】(A) love 是複數/原形；(C) loved 過去式與 is 的現在語境不合；(D) loving 不能當子句動詞。\n【例句】Ken is the only student who walks to school in our class.", "explanationSource": "source"}, {"id": 142, "question": "Mr. Chen is the teacher who ______ us math this year.", "options": ["teach", "teaches", "teaching", "to teach"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 141 題）", "explanation": "先行詞 the teacher 單數，現在事實用 teaches。", "explanationSource": "supplemental"}, {"id": 143, "question": "I have two friends who ______ in Kaohsiung.", "options": ["lives", "living", "live", "to live"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 141 題）", "explanation": "先行詞 two friends 複數，動詞用原形 live。", "explanationSource": "supplemental"}, {"id": 144, "question": "The girl who ______ next to me in class is very friendly.", "options": ["sit", "sitting", "to sit", "sits"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 141 題）", "explanation": "先行詞 The girl 單數，現在習慣用 sits。", "explanationSource": "supplemental"}, {"id": 145, "question": "Mom: What ______ after school today?\nRyan: Well, I just read some comic books.", "options": ["did you do", "do you do", "are you doing", "will you do"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜過去簡單式疑問句 did you do", "explanation": "【句型】Wh- ＋ did ＋ S ＋ 原形V？ 問已發生的事用過去式。\n【分析】after school today 是今天已經過去的時段，且 Ryan 回答 I just read（過去式），所以問句用 did you do。\n【其他選項】(B) 現在簡單式問平常習慣；(C) 現在進行式問此刻；(D) 未來式問計畫，但事情已做完。\n【例句】What did you eat for lunch today?", "explanationSource": "source"}, {"id": 146, "question": "Dad: Where ______ last Sunday?\nAmy: I went to the zoo with Kelly.", "options": ["do you go", "did you go", "are you going", "have you gone"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 145 題）", "explanation": "last Sunday 是過去時間，回答 went，用 did you go。", "explanationSource": "supplemental"}, {"id": 147, "question": "Teacher: What ______ during the summer vacation?\nJoe: I visited my grandparents in Tainan.", "options": ["did you do", "do you do", "will you do", "are you doing"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 145 題）", "explanation": "暑假已結束，回答 visited 過去式，問句用 did you do。", "explanationSource": "supplemental"}, {"id": 148, "question": "Mia: Who ______ with at the party last night?\nLeo: I talked with Ben and his sister.", "options": ["do you talk", "are you talking", "did you talk", "will you talk"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 145 題）", "explanation": "last night 過去時間，回答 talked，用 did you talk。", "explanationSource": "supplemental"}, {"id": 149, "question": "Ms. Wu: What animals ______ your sister like?\nHerbert: She likes lions and tigers.", "options": ["do", "does", "are", "is"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜一般動詞疑問句 does＋S＋V", "explanation": "【句型】Wh- ＋ do/does ＋ S ＋ 原形V？ 一般動詞現在式疑問句。\n【分析】主要動詞 like 是一般動詞，主詞 your sister 是第三人稱單數，助動詞用 does；回答 She likes 也是現在式。\n【其他選項】(A) do 用於 I/you/複數主詞；(C)(D) be 動詞不能與原形一般動詞 like 搭配。\n【例句】What sports does your brother play?", "explanationSource": "source"}, {"id": 150, "question": "What kind of music ______ your parents listen to?", "options": ["does", "is", "do", "are"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 149 題）", "explanation": "主詞 your parents 複數、listen 是一般動詞，用 do。", "explanationSource": "supplemental"}, {"id": 151, "question": "Where ______ Mr. Huang usually eat lunch?", "options": ["does", "do", "is", "are"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 149 題）", "explanation": "主詞 Mr. Huang 單數、eat 是一般動詞，用 does。", "explanationSource": "supplemental"}, {"id": 152, "question": "How ______ your cousins go to school every day?\nThey take the MRT.", "options": ["is", "are", "does", "do"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 149 題）", "explanation": "主詞 your cousins 複數、go 是一般動詞，用 do。", "explanationSource": "supplemental"}, {"id": 153, "question": "He ______ at home. He's in his office now.", "options": ["isn't", "can't", "hasn't", "doesn't"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜be 動詞否定 isn't＋地點", "explanation": "【句型】S ＋ be 動詞（否定）＋ 地點，表「（不）在某處」。\n【分析】句中沒有其他動詞，at home 前需要 be 動詞；後句 He's in his office now 也用 be 動詞，所以填 isn't。\n【其他選項】(B) can't 後需原形動詞；(C) hasn't 後需過去分詞；(D) doesn't 後需原形動詞，句中都沒有動詞。\n【例句】Lisa isn't at school today. She is sick.", "explanationSource": "source"}, {"id": 154, "question": "My parents ______ in Taipei now. They are visiting friends in Hualien.", "options": ["don't", "aren't", "haven't", "can't"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 153 題）", "explanation": "句中無一般動詞，in Taipei 前用 be 動詞否定 aren't。", "explanationSource": "supplemental"}, {"id": 155, "question": "Sorry, Mr. Lee ______ here right now. He went to a meeting.", "options": ["isn't", "doesn't", "hasn't", "won't"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 153 題）", "explanation": "here 前缺 be 動詞，用 isn't 表「現在不在這裡」。", "explanationSource": "supplemental"}, {"id": 156, "question": "The keys ______ in my bag. Where did I put them?", "options": ["don't", "doesn't", "isn't", "aren't"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 153 題）", "explanation": "主詞 The keys 複數，句中無一般動詞，用 aren't。", "explanationSource": "supplemental"}, {"id": 157, "question": "Andy: Did Mary ______ that square watch?\nLucy: Yes, she just bought it.", "options": ["buy", "buys", "bought", "has bought"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜Did＋S＋原形動詞", "explanation": "【句型】Did ＋ S ＋ 原形V？ 助動詞 did 後一律接原形動詞。\n【分析】問句已用助動詞 Did 表過去，後面動詞要用原形 buy。\n【其他選項】(B) buys 第三人稱單數形；(C) bought 過去式；(D) has bought 完成式，都不能放在 did 後。\n【例句】Did your brother watch the game last night?", "explanationSource": "source"}, {"id": 158, "question": "Did Tom ______ his homework before dinner?", "options": ["finishes", "finish", "finished", "finishing"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 157 題）", "explanation": "Did 後接原形動詞 finish。", "explanationSource": "supplemental"}, {"id": 159, "question": "Kevin didn't ______ to the party yesterday because he was sick.", "options": ["went", "goes", "go", "going"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 157 題）", "explanation": "didn't 後接原形動詞 go。", "explanationSource": "supplemental"}, {"id": 160, "question": "Did your sister ______ you a birthday card?", "options": ["give", "gave", "gives", "given"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 157 題）", "explanation": "Did 後接原形動詞 give。", "explanationSource": "supplemental"}, {"id": 161, "question": "Allen: ______ you have twenty minutes right now? I need to talk to you.\nBruce: Sure! Come on in.", "options": ["Are", "Do", "Have", "Should"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜have 當「擁有」用 Do 問", "explanation": "【句型】Do/Does ＋ S ＋ have ＋ N？ have 表「擁有」時是一般動詞。\n【分析】have twenty minutes 是「有二十分鐘（空檔）」，have 為一般動詞，主詞 you，用助動詞 Do。\n【其他選項】(A) Are 不能接原形動詞 have；(C) Have you…? 是完成式問句，後面要接 p.p.；(D) Should 表「應該」，語意不合（問對方有沒有空）。\n【例句】Do you have a pen I can use?", "explanationSource": "source"}, {"id": 162, "question": "______ your brother have a bike?\nYes, he rides it to school every day.", "options": ["Is", "Has", "Does", "Do"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 161 題）", "explanation": "have 表擁有，主詞單數用 Does。", "explanationSource": "supplemental"}, {"id": 163, "question": "______ they have any questions about the test?", "options": ["Do", "Are", "Have", "Does"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 161 題）", "explanation": "have 表擁有，主詞 they 用 Do。", "explanationSource": "supplemental"}, {"id": 164, "question": "Excuse me. ______ you have this T-shirt in a bigger size?", "options": ["Are", "Have", "Is", "Do"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 161 題）", "explanation": "have 表「有」是一般動詞，主詞 you 用 Do。", "explanationSource": "supplemental"}, {"id": 165, "question": "Sam: ______ you have a good time at Mr. Moore's house tonight?\nTom: Yes. It was a wonderful party. I'm glad I went.", "options": ["Do", "Did", "Will", "Would"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜依回答時態判斷 Did 問句", "explanation": "【句型】Did ＋ S ＋ have a good time？ 問已發生的事用過去式。\n【分析】雖然是 tonight，但回答 It was a wonderful party 與 I went 都是過去式，表示派對已結束，問句用 Did。\n【其他選項】(A) Do 問平常習慣；(C) Will 問未來，但派對已結束；(D) Would 表禮貌請求或假設，不合語意。\n【例句】Did you have fun at the beach this morning?", "explanationSource": "source"}, {"id": 166, "question": "Ann: ______ you enjoy the concert this afternoon?\nBen: Yes! The singer was amazing.", "options": ["Do", "Will", "Did", "Are"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 165 題）", "explanation": "回答 was 表示已發生，問句用 Did。", "explanationSource": "supplemental"}, {"id": 167, "question": "Mom: ______ you eat breakfast this morning?\nJay: No, I got up too late.", "options": ["Did", "Do", "Will", "Have"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 165 題）", "explanation": "回答 got up 過去式，問句用 Did。", "explanationSource": "supplemental"}, {"id": 168, "question": "Gina: ______ you go to the night market tonight?\nHank: Yes, I'm going with my cousins after dinner.", "options": ["Did", "Have", "Were", "Will"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 165 題）", "explanation": "回答 I'm going after dinner 表還沒去，問未來用 Will。", "explanationSource": "supplemental"}, {"id": 169, "question": "Have you found a summer job yet? Mr. Firth ______ someone to take care of his kids during the vacation. Maybe you can talk to him.", "options": ["has looked for", "is looking for", "looks for", "was looking for"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜現在進行式表現階段進行中", "explanation": "【句型】S ＋ be ＋ Ving，表「目前這段時間正在進行」。\n【分析】Maybe you can talk to him 表示 Mr. Firth 現在仍在找人，用現在進行式 is looking for。\n【其他選項】(A) has looked for 偏向「已找過」，不強調仍在進行；(C) looks for 表習慣，不合「目前正在找」；(D) 過去進行式不合現在語境。\n【例句】My aunt is looking for a new apartment these days.", "explanationSource": "source"}, {"id": 170, "question": "Ms. Lin ______ a new English teacher for her cram school. You should send her your resume.", "options": ["is looking for", "looked for", "was looking for", "looks"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 169 題）", "explanation": "目前仍在找人，用現在進行式。", "explanationSource": "supplemental"}, {"id": 171, "question": "Our class ______ for the school sports day these days. We practice every afternoon.", "options": ["prepared", "prepares", "is preparing", "was preparing"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 169 題）", "explanation": "these days 表目前這段期間正在進行，用 is preparing。", "explanationSource": "supplemental"}, {"id": 172, "question": "Don't call Grandpa now. He ______ a nap.", "options": ["took", "takes", "has taken", "is taking"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 169 題）", "explanation": "此刻正在午睡，用現在進行式。", "explanationSource": "supplemental"}, {"id": 173, "question": "John: Have you seen my comic books, Jean?\nJean: ______ on your desk yesterday, but Mom took them away this morning.", "options": ["They are", "They had", "They were", "They've been"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜過去簡單式 They were＋地點", "explanation": "【句型】S ＋ was/were ＋ 地點＋ 過去時間，表「過去在某處」。\n【分析】they 指 my comic books（複數）；yesterday 是明確過去時間，用 They were。\n【其他選項】(A) They are 現在式與 yesterday 不合；(B) They had 後要接名詞，語意不合；(D) 現在完成式不能和 yesterday 連用。\n【例句】My shoes were by the door last night, but now they're gone.", "explanationSource": "source"}, {"id": 174, "question": "Ted: Where are my glasses?\nMay: ______ on the sofa an hour ago. Did you check there?", "options": ["They were", "They are", "They have", "It was"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 173 題）", "explanation": "glasses 複數，an hour ago 過去時間，用 They were。", "explanationSource": "supplemental"}, {"id": 175, "question": "Iris: Have you seen my umbrella?\nOwen: ______ by the door this morning.", "options": ["They were", "It is", "It was", "It has been"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 173 題）", "explanation": "umbrella 單數，this morning 已過去，用 It was。", "explanationSource": "supplemental"}, {"id": 176, "question": "My grandparents ______ in Japan last month. Now they're back in Taiwan.", "options": ["are", "have been", "were", "had"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 173 題）", "explanation": "last month 過去時間，主詞複數用 were。", "explanationSource": "supplemental"}, {"id": 177, "question": "Mrs. Smith ______ the movie very much. She has seen it three times.", "options": ["liked", "likes", "has liked", "will like"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜現在簡單式表喜好狀態", "explanation": "【句型】S ＋ 現在簡單式（like/love/hate 等狀態動詞），表現在的喜好。\n【分析】後句 She has seen it three times 表示到現在看了三次，可見她現在很喜歡這部電影，用 likes。\n【其他選項】(A) liked 表過去喜歡，現在未必；(C) like 是狀態動詞，一般不用完成式表現在喜好；(D) 未來式不合，她已看過。\n【例句】Kevin loves this song. He has listened to it many times.", "explanationSource": "source"}, {"id": 178, "question": "Wendy ______ Korean food a lot. She has eaten at that Korean restaurant five times this month.", "options": ["likes", "liked", "will like", "is liking"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 177 題）", "explanation": "表現在的喜好用現在簡單式 likes。", "explanationSource": "supplemental"}, {"id": 179, "question": "My father ______ this old car. He has driven it for twenty years.", "options": ["loved", "has loved", "loves", "will love"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 177 題）", "explanation": "現在仍喜愛，用現在簡單式 loves。", "explanationSource": "supplemental"}, {"id": 180, "question": "Eric ______ spiders. He always runs away when he sees one.", "options": ["hated", "has hated", "is hating", "hates"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 177 題）", "explanation": "表現在的好惡用現在簡單式 hates。", "explanationSource": "supplemental"}, {"id": 181, "question": "Abby: Too bad you couldn't come to the beach with us. It was so much fun there! You must come next time.\nBree: No, thanks. I don't think ______ any fun. I can't swim.", "options": ["I was having", "I've had", "I have", "I'll have"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜I don't think＋未來式 I'll have", "explanation": "【句型】I don't think ＋ S ＋ will ＋ V，對未來的看法。\n【分析】Abby 說 next time 邀她下次去，Bree 推測「（下次）我不會玩得開心」，談的是未來，用 I'll have。\n【其他選項】(A) 過去進行式不合；(B) 現在完成式指到目前的經驗，不合「下次」；(C) 現在簡單式不能表示對下次的推測。\n【例句】I don't think it will rain tomorrow.", "explanationSource": "source"}, {"id": 182, "question": "Lily: Will you join the hiking trip next Sunday?\nNick: I don't think ______. I have to study for the test.", "options": ["I'll go", "I went", "I've gone", "I was going"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 181 題）", "explanation": "談下週日的計畫（未來），用 I'll go。", "explanationSource": "supplemental"}, {"id": 183, "question": "Don't worry about the test tomorrow. I don't think it ______ too hard.", "options": ["was", "has been", "will be", "is being"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 181 題）", "explanation": "tomorrow 的考試是未來，用 will be。", "explanationSource": "supplemental"}, {"id": 184, "question": "Ray: Do you want to try the new roller coaster next time?\nSue: No way! I don't think ______ it.", "options": ["I enjoyed", "I've enjoyed", "I was enjoying", "I'll enjoy"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 181 題）", "explanation": "next time 指未來，用 I'll enjoy。", "explanationSource": "supplemental"}, {"id": 185, "question": "______ the dog that bites people yours? You should keep it home.", "options": ["Can", "Does", "Has", "Is"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜Is＋S＋所有代名詞？（主詞含關代子句）", "explanation": "【句型】Be ＋ S ＋ N/所有代名詞？ 主詞含 that 子句時，要找出真正主要動詞的位置。\n【分析】主詞是 the dog that bites people（bites 是子句動詞），主句沒有其他動詞，yours（= your dog）是補語，需 be 動詞 Is。\n【其他選項】(A) Can、(B) Does 後需接原形動詞；(C) Has 後需接 p.p. 或名詞，三者都缺主要動詞。\n【例句】Is the girl who sings so well your sister?", "explanationSource": "source"}, {"id": 186, "question": "______ the boy who plays the guitar your classmate?", "options": ["Does", "Is", "Can", "Has"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 185 題）", "explanation": "主詞 the boy who plays the guitar 後接名詞補語 your classmate，需 be 動詞 Is。", "explanationSource": "supplemental"}, {"id": 187, "question": "______ the cookies that Mom made yesterday still in the box?", "options": ["Are", "Do", "Is", "Have"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 185 題）", "explanation": "主詞 the cookies 複數，後接地點，用 Are。", "explanationSource": "supplemental"}, {"id": 188, "question": "______ the man who lives next door a doctor?\nYes. He works at Taipei Hospital.", "options": ["Does", "Has", "Do", "Is"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 185 題）", "explanation": "主詞單數，後接名詞補語 a doctor，用 Is。", "explanationSource": "supplemental"}, {"id": 189, "question": "Mom: Oh, no! Your sister forgot her sports shoes. When ______ she have PE class? Can you take the shoes to her school?\nPeter: It's in the afternoon. Don't worry. I'll bring them to her.", "options": ["did", "does", "has", "is"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜When does＋S＋V？ 問固定時間", "explanation": "【句型】When ＋ do/does ＋ S ＋ 原形V？ 問固定課表或習慣用現在簡單式。\n【分析】PE class 是課表上的固定安排；後面 have 是原形一般動詞，主詞 she 單數，用 does。回答 It's in the afternoon 也是現在式。\n【其他選項】(A) did 問過去，但媽媽要在今天送鞋，體育課尚未上；(C) has 後需 p.p.；(D) is 後不能接原形動詞 have。\n【例句】When does your brother have piano lessons?", "explanationSource": "source"}, {"id": 190, "question": "What time ______ the school bus leave every morning?", "options": ["do", "is", "does", "did"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 189 題）", "explanation": "每天固定時間用現在簡單式，主詞單數用 does。", "explanationSource": "supplemental"}, {"id": 191, "question": "When ______ your parents usually go jogging?\nAfter dinner.", "options": ["do", "does", "are", "have"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 189 題）", "explanation": "主詞 your parents 複數，習慣用 do。", "explanationSource": "supplemental"}, {"id": 192, "question": "How often ______ Jenny have swimming class?\nTwice a week.", "options": ["is", "do", "has", "does"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 189 題）", "explanation": "主詞 Jenny 單數，固定課程用 does。", "explanationSource": "supplemental"}, {"id": 193, "question": "Nana: Did you mail the cards to your teachers?\nAnnie: No, I want to check them again. I ______ them after dinner.", "options": ["mailed", "mail", "have mailed", "will mail"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜未來式 will＋V（after dinner）", "explanation": "【句型】S ＋ will ＋ V ＋ 未來時間，表將要做的事。\n【分析】Annie 說 No（還沒寄），想再檢查一次，after dinner 是之後的時間，用 will mail。\n【其他選項】(A) mailed 表已寄，與 No 矛盾；(B) mail 現在式表習慣；(C) have mailed 表已寄完，也矛盾。\n【例句】I will call you back after class.", "explanationSource": "source"}, {"id": 194, "question": "Ivy: Have you cleaned your room?\nMax: Not yet. I ______ it this evening.", "options": ["will clean", "cleaned", "have cleaned", "clean"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 193 題）", "explanation": "Not yet 還沒做，this evening 表未來，用 will clean。", "explanationSource": "supplemental"}, {"id": 195, "question": "Sorry, I'm busy now. I ______ you with your homework after I finish my report.", "options": ["helped", "have helped", "will help", "help"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 193 題）", "explanation": "之後才幫忙，用未來式 will help。", "explanationSource": "supplemental"}, {"id": 196, "question": "Ray: Did you return the books to the library?\nPam: No, I ______ them back tomorrow.", "options": ["took", "have taken", "take", "will take"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 193 題）", "explanation": "tomorrow 表未來，用 will take。", "explanationSource": "supplemental"}, {"id": 197, "question": "The fishermen knew little about the island when they ______ there.", "options": ["arrived", "would arrive", "arrive", "have arrived"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜主句過去式→when 子句過去式", "explanation": "【句型】S ＋ 過去式 ＋ when ＋ S ＋ 過去式，敘述過去同一時間的情況。\n【分析】主句 knew 是過去式，「他們抵達那裡時」也是過去發生的事，用 arrived。\n【其他選項】(B) would arrive 表過去的未來，語意不合；(C) arrive 現在式與 knew 時態不一致；(D) 現在完成式不合過去敘述。\n【例句】I was very tired when I got home last night.", "explanationSource": "source"}, {"id": 198, "question": "Amy didn't know anyone when she first ______ to this school.", "options": ["comes", "came", "has come", "will come"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 197 題）", "explanation": "主句 didn't know 過去式，when 子句也用過去式 came。", "explanationSource": "supplemental"}, {"id": 199, "question": "When Tim ______ the news, he was very surprised.", "options": ["heard", "hears", "has heard", "will hear"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 197 題）", "explanation": "主句 was 過去式，when 子句用 heard。", "explanationSource": "supplemental"}, {"id": 200, "question": "The kids were very hungry when they ______ home.", "options": ["get", "have got", "will get", "got"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 197 題）", "explanation": "主句 were 過去式，when 子句用 got。", "explanationSource": "supplemental"}, {"id": 201, "question": "Alex: Why are you still here? It's already eight o'clock.\nTom: Because I ______ my work. Don't worry. It's almost done.", "options": ["wasn't finishing", "wouldn't finish", "haven't finished", "won't finish"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜現在完成式否定 haven't finished", "explanation": "【句型】S ＋ haven't/hasn't ＋ p.p.，表「到目前為止還沒完成」。\n【分析】still here、already eight o'clock 表到現在；It's almost done 表示工作到現在還沒做完，用 haven't finished。\n【其他選項】(A) 過去進行式不合現在情境；(B) wouldn't finish 表「不肯完成」；(D) won't finish 表「不會完成」，與 almost done 矛盾。\n【例句】I can't go out yet. I haven't done my homework.", "explanationSource": "source"}, {"id": 202, "question": "Kai: Are you ready to go?\nDan: Not yet. I ______ my breakfast.", "options": ["haven't eaten", "didn't eat", "won't eat", "wasn't eating"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 201 題）", "explanation": "到現在還沒吃完，用現在完成式 haven't eaten。", "explanationSource": "supplemental"}, {"id": 203, "question": "Lucy can't give you the book now because she ______ it yet.", "options": ["didn't read", "won't read", "hasn't read", "doesn't read"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 201 題）", "explanation": "yet 搭配現在完成式，主詞單數用 hasn't read。", "explanationSource": "supplemental"}, {"id": 204, "question": "We ______ the answer yet. Can we have five more minutes?", "options": ["didn't find", "don't find", "won't find", "haven't found"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 201 題）", "explanation": "到目前還沒找到，用 haven't found。", "explanationSource": "supplemental"}, {"id": 205, "question": "Candy has decided to move to Taipei next year. When she studies in an art school there, she ______ with her aunt for five months.", "options": ["lives", "has lived", "lived", "will live"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜時間子句用現在式、主句用未來式", "explanation": "【句型】When/If ＋ 現在式（代替未來）, S ＋ will ＋ V。\n【分析】next year 才搬去，when 子句用現在式 studies 表未來，主句要用未來式 will live。\n【其他選項】(A) 現在式不能當表未來的主句；(B) 現在完成式表到目前為止，但她還沒搬；(C) 過去式不合。\n【例句】When I go to Japan next month, I will visit my friend.", "explanationSource": "source"}, {"id": 206, "question": "When Grandpa ______ next week, we will take him to the night market.", "options": ["will come", "comes", "came", "has come"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 205 題）", "explanation": "when 時間子句以現在式代替未來，用 comes。", "explanationSource": "supplemental"}, {"id": 207, "question": "After Jason graduates next June, he ______ in his father's shop.", "options": ["will work", "works", "worked", "has worked"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 205 題）", "explanation": "主句表未來，用 will work。", "explanationSource": "supplemental"}, {"id": 208, "question": "If it ______ tomorrow, we will stay home and watch movies.", "options": ["will rain", "rained", "rains", "has rained"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 205 題）", "explanation": "if 條件句以現在式代替未來，用 rains。", "explanationSource": "supplemental"}, {"id": 209, "question": "The woman you met in the library yesterday ______ our school a lot of books.", "options": ["giving", "given", "to give", "will give"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜整句缺主要動詞＋未來式", "explanation": "【句型】S（＋省略關代子句）＋主要動詞。The woman (whom) you met… 是主詞，後面需要主要動詞。\n【分析】you met… yesterday 是修飾主詞的子句，句子仍缺主要動詞；選項中只有 will give 能當主要動詞，表「她將捐給學校許多書」。\n【其他選項】(A) giving、(B) given、(C) to give 都不能單獨當主要動詞。\n【例句】The man you saw at the gate will be our new coach.", "explanationSource": "source"}, {"id": 210, "question": "The boy I talked to at the bus stop ______ in the same class as my brother.", "options": ["being", "is", "to be", "been"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 209 題）", "explanation": "主詞 The boy (whom) I talked to 後缺主要動詞，用 is。", "explanationSource": "supplemental"}, {"id": 211, "question": "The cake my mom made this morning ______ delicious.", "options": ["tastes", "tasting", "to taste", "tasted by"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 209 題）", "explanation": "主詞 The cake (that) my mom made 後缺主要動詞，用 tastes。", "explanationSource": "supplemental"}, {"id": 212, "question": "The students we met at the museum last week ______ us a visit next Friday.", "options": ["paying", "paid by", "to pay", "will pay"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 209 題）", "explanation": "主詞後缺主要動詞，next Friday 表未來，用 will pay。", "explanationSource": "supplemental"}, {"id": 213, "question": "Tommy is looking for the watch his uncle ______ him on his birthday.", "options": ["gives", "gave", "to give", "has given"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜省略關代的子句＋過去式（明確過去時間）", "explanation": "【句型】N ＋（that/which 省略）＋ S ＋ V，關係子句時態依自身時間決定。\n【分析】the watch (that) his uncle ___ him on his birthday，叔叔在他生日時送的，是過去發生的事，用 gave。\n【其他選項】(A) gives 現在式不合；(C) to give 不能當子句動詞；(D) 現在完成式不能與明確過去時間 on his birthday 連用。\n【例句】I still keep the letter my friend wrote me last year.", "explanationSource": "source"}, {"id": 214, "question": "Have you read the book Ms. Chen ______ us last week?", "options": ["recommends", "has recommended", "recommended", "to recommend"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 213 題）", "explanation": "last week 明確過去時間，子句用過去式 recommended。", "explanationSource": "supplemental"}, {"id": 215, "question": "The bike my father ______ me two years ago is still in good shape.", "options": ["bought", "buys", "has bought", "buying"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 213 題）", "explanation": "two years ago 過去時間，用 bought。", "explanationSource": "supplemental"}, {"id": 216, "question": "I lost the cap my sister ______ me when we were in Japan.", "options": ["gives", "has given", "giving", "gave"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 213 題）", "explanation": "when we were in Japan 指過去，用 gave。", "explanationSource": "supplemental"}, {"id": 217, "question": "Paul: ______ Shelly's father a businessman?\nCarl: I don't think so. I remember he teaches English.", "options": ["Are", "Is", "Do", "Does"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜Is＋S＋N？ be 動詞疑問句", "explanation": "【句型】Is/Are ＋ S ＋ N？ 句中沒有一般動詞時用 be 動詞發問。\n【分析】句中沒有一般動詞，a businessman 是主詞補語，主詞 Shelly's father 單數，用 Is。\n【其他選項】(A) Are 用於複數主詞；(C)(D) Do/Does 後需接原形一般動詞，但句中沒有。\n【例句】Is your mother a nurse?", "explanationSource": "source"}, {"id": 218, "question": "______ Jason and Ella your classmates?", "options": ["Do", "Is", "Are", "Does"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 217 題）", "explanation": "句中無一般動詞，主詞複數用 Are。", "explanationSource": "supplemental"}, {"id": 219, "question": "______ Mr. Wang's son a basketball player?\nYes, he plays for our school team.", "options": ["Is", "Does", "Are", "Do"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 217 題）", "explanation": "句中無一般動詞，主詞單
