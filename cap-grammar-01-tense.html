數用 Is。", "explanationSource": "supplemental"}, {"id": 220, "question": "______ your sister work at a bank?\nNo, she's a teacher.", "options": ["Is", "Are", "Do", "Does"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 217 題）", "explanation": "句中有一般動詞 work，主詞單數用 Does。", "explanationSource": "supplemental"}, {"id": 221, "question": "Ryan: Would you like to play tennis with me?\nDara: No, thanks. ______ it for three hours already. I'm tired now.", "options": ["I play", "I'm playing", "I've played", "I'll play"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜現在完成式 for＋一段時間＋already", "explanation": "【句型】S ＋ have/has ＋ p.p. ＋ for ＋ 一段時間，表從過去持續到現在。\n【分析】for three hours already 表「到現在已經打了三小時」，所以現在很累，用現在完成式 I've played。\n【其他選項】(A) 現在式表習慣；(B) 現在進行式表此刻正在打，但她正在拒絕邀約；(D) 未來式與 already、I'm tired now 不合。\n【例句】We have waited for the bus for thirty minutes.", "explanationSource": "source"}, {"id": 222, "question": "I'm so hungry. I ______ anything since this morning.", "options": ["didn't eat", "haven't eaten", "don't eat", "won't eat"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 221 題）", "explanation": "since this morning 到現在，用現在完成式 haven't eaten。", "explanationSource": "supplemental"}, {"id": 223, "question": "Ms. Lee ______ English at this school for ten years.", "options": ["has taught", "teaches", "taught", "will teach"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 221 題）", "explanation": "for ten years 至今持續，用 has taught。", "explanationSource": "supplemental"}, {"id": 224, "question": "My eyes hurt. I ______ at the computer for five hours already.", "options": ["look", "am looking", "will look", "have looked"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 221 題）", "explanation": "for five hours already 表從過去到現在，用 have looked。", "explanationSource": "supplemental"}, {"id": 225, "question": "Eva: What's your ideal mate like?\nAda: Well, I want a husband who ______ well. I enjoy eating, but I hate kitchens.", "options": ["cook", "cooks", "cooking", "to cook"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜關代 who 後動詞與單數先行詞一致", "explanation": "【句型】先行詞＋who＋V，子句動詞單複數依先行詞。\n【分析】先行詞 a husband 是單數，描述一般特質（會煮飯）用現在簡單式，所以用 cooks。\n【其他選項】(A) cook 用於複數先行詞；(C) cooking、(D) to cook 都不能當關係子句的動詞。\n【例句】I need a friend who listens to me.", "explanationSource": "source"}, {"id": 226, "question": "We need a leader who ______ good ideas.", "options": ["have", "has", "having", "to have"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 225 題）", "explanation": "先行詞 a leader 單數，用 has。", "explanationSource": "supplemental"}, {"id": 227, "question": "Students who ______ hard usually get good grades.", "options": ["studies", "studying", "to study", "study"], "answer": 3, "answerLabel": "D", "source": "類似題 2（對應第 225 題）", "explanation": "先行詞 Students 複數，用原形 study。", "explanationSource": "supplemental"}, {"id": 228, "question": "My grandma has a cat that ______ on her bed every night.", "options": ["sleeps", "sleep", "sleeping", "to sleep"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 225 題）", "explanation": "先行詞 a cat 單數，習慣用 sleeps。", "explanationSource": "supplemental"}, {"id": 229, "question": "Simon: Why ______ Jerry and Lisa play cards with us?\nHenry: Because they want to go to the movies.", "options": ["don't", "isn't", "aren't", "doesn't"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜Why don't＋複數主詞＋V？", "explanation": "【句型】Why ＋ don't/doesn't ＋ S ＋ 原形V？ 問「為什麼不…」。\n【分析】play 是原形一般動詞，主詞 Jerry and Lisa 是複數，助動詞用 don't；回答 Because they want… 說明原因。\n【其他選項】(B)(C) be 動詞不能接原形動詞 play；(D) doesn't 用於單數主詞。\n【例句】Why don't your parents come to the school concert?", "explanationSource": "source"}, {"id": 230, "question": "Why ______ your brother eat vegetables?\nHe just doesn't like them.", "options": ["don't", "doesn't", "isn't", "aren't"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 229 題）", "explanation": "主詞 your brother 單數，後接原形 eat，用 doesn't。", "explanationSource": "supplemental"}, {"id": 231, "question": "Why ______ you and Kim join the dance club?\nWe're too busy.", "options": ["don't", "aren't", "doesn't", "isn't"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 229 題）", "explanation": "主詞 you and Kim 複數，後接原形 join，用 don't。", "explanationSource": "supplemental"}, {"id": 232, "question": "Why ______ the students in the classroom?\nThey're having PE class.", "options": ["don't", "doesn't", "isn't", "aren't"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 229 題）", "explanation": "句中無一般動詞，in the classroom 前用 be 動詞，主詞複數用 aren't。", "explanationSource": "supplemental"}, {"id": 233, "question": "Rex did not feel the earthquake this morning. He ______ in the park at the time.", "options": ["jogged", "was jogging", "has jogged", "would jog"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜過去進行式 at the time", "explanation": "【句型】S ＋ was/were ＋ Ving ＋ at the time / at that moment，表過去某時正在進行。\n【分析】at the time 指今天早上地震發生的那一刻，Rex 當時正在公園慢跑，所以沒感覺到，用過去進行式 was jogging。\n【其他選項】(A) jogged 只表過去做過，不能表現「當時正在」；(C) 現在完成式不合過去時間點；(D) would jog 表過去習慣或假設，語意不合。\n【例句】I was taking a shower when you called me.", "explanationSource": "source"}, {"id": 234, "question": "Sorry, I didn't answer your call. I ______ a bath at that time.", "options": ["was taking", "took", "have taken", "take"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 233 題）", "explanation": "at that time 表過去某時正在進行，用 was taking。", "explanationSource": "supplemental"}, {"id": 235, "question": "What ______ you doing at 9 p.m. last night?\nI was watching TV.", "options": ["did", "are", "were", "have"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 233 題）", "explanation": "問過去某時正在做什麼，用 were you doing。", "explanationSource": "supplemental"}, {"id": 236, "question": "When the lights went out, we ______ dinner.", "options": ["have", "had had", "are having", "were having"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 233 題）", "explanation": "停電那一刻正在吃晚餐，用過去進行式 were having。", "explanationSource": "supplemental"}, {"id": 237, "question": "Ed and Jill ______ camping this weekend, so they have to finish their homework by Friday.", "options": ["went", "were going", "are going", "have gone"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜現在進行式表近未來計畫", "explanation": "【句型】S ＋ am/is/are ＋ Ving ＋ 未來時間，表已安排好的近未來計畫（go/come/leave 常見）。\n【分析】this weekend 是即將到來的週末，so they have to finish… by Friday 表示還沒出發，用 are going 表已安排的計畫。\n【其他選項】(A) went 過去式；(B) were going 過去進行式，都不合未來；(D) have gone 表已經去了，與「週五前要寫完功課」矛盾。\n【例句】My family is flying to Okinawa next Monday.", "explanationSource": "source"}, {"id": 238, "question": "Hurry up! The train ______ in five minutes.", "options": ["left", "is leaving", "has left", "was leaving"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 237 題）", "explanation": "in five minutes 表即將發生，用 is leaving。", "explanationSource": "supplemental"}, {"id": 239, "question": "We ______ a barbecue party tomorrow night. Would you like to come?", "options": ["are having", "had", "have had", "were having"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 237 題）", "explanation": "tomorrow night 已安排好的計畫，用 are having。", "explanationSource": "supplemental"}, {"id": 240, "question": "Uncle Joe ______ to visit us next Saturday, so Mom is cleaning the house.", "options": ["came", "has come", "was coming", "is coming"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 237 題）", "explanation": "next Saturday 近未來計畫，用 is coming。", "explanationSource": "supplemental"}, {"id": 241, "question": "If we play some interesting games in class, there ______ more fun in learning English.", "options": ["are", "has", "will be", "will have"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜If 子句現在式＋主句 there will be", "explanation": "【句型】If ＋ 現在式, there will be ＋ N。條件句主句用未來式；there 後只能接 be 動詞。\n【分析】If 子句 play 是現在式表未來條件，主句表結果用未來式；「會有更多樂趣」是 there be 句型，所以用 there will be。\n【其他選項】(A) are 現在式不表未來結果，且 fun 不可數不用 are；(B)(D) there 後不可接 has/have。\n【例句】If it doesn't rain tomorrow, there will be a lot of people at the beach.", "explanationSource": "source"}, {"id": 242, "question": "If you come early, there ______ enough seats for everyone.", "options": ["will be", "will have", "has", "have"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 241 題）", "explanation": "條件句主句用未來式，there 後接 be，用 will be。", "explanationSource": "supplemental"}, {"id": 243, "question": "There ______ a big storm tomorrow, so the school will be closed.", "options": ["has", "is having", "will be", "will have"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 241 題）", "explanation": "tomorrow 表未來，there 後用 will be。", "explanationSource": "supplemental"}, {"id": 244, "question": "If the city builds a new park here, there ______ more places for kids to play.", "options": ["have", "will have", "has been", "will be"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 241 題）", "explanation": "if 條件句的結果用未來式，there will be。", "explanationSource": "supplemental"}, {"id": 245, "question": "I ______ swimming for several years before I went to this high school. I gave it up because of heavy schoolwork.", "options": ["have practiced", "am practicing", "practiced", "would practice"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜過去簡單式（已結束的一段時間）", "explanation": "【句型】S ＋ 過去式 ＋ for ＋ 一段時間 ＋ before ＋ 過去事件，表過去一段已結束的時間。\n【分析】before I went to this high school 是過去，且 I gave it up 表示現在已不練，所以「練了好幾年」是已結束的過去，用 practiced。\n【其他選項】(A) have practiced 表持續到現在，但已放棄；(B) am practicing 表此刻正在練；(D) would practice 偏「過去的習慣/假設」，與 for several years 搭配不自然。\n【例句】She lived in Japan for three years before she moved back to Taiwan.", "explanationSource": "source"}, {"id": 246, "question": "My father ______ in a bank for ten years before he opened his own store.", "options": ["worked", "has worked", "is working", "works"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 245 題）", "explanation": "開店前在銀行工作的十年已結束，用過去式 worked。", "explanationSource": "supplemental"}, {"id": 247, "question": "Ken ______ the piano for five years when he was a child, but now he plays the drums.", "options": ["has played", "plays", "played", "is playing"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 245 題）", "explanation": "when he was a child 指過去且已結束，用 played。", "explanationSource": "supplemental"}, {"id": 248, "question": "We ______ in Tainan for two years. Then we moved to Taichung last year.", "options": ["have lived", "live", "are living", "lived"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 245 題）", "explanation": "住台南的兩年已結束，用過去式 lived。", "explanationSource": "supplemental"}, {"id": 249, "question": "David looked out of the balcony window and saw a woman get in his car ______ away.", "options": ["drive", "drove", "and drive", "and drove"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜感官動詞 saw＋O＋V1 and V2（對等）", "explanation": "【句型】感官動詞 saw ＋ O ＋ V1 and V2，兩個動詞要用 and 連接且形式相同（都用原形或都用 Ving）。\n【分析】saw a woman get in his car（原形 get），後面的動作也要用原形，並用 and 連接：get in his car and drive away。\n【其他選項】(A) 缺連接詞 and；(B)(D) drove 是過去式，與 get 形式不對等。\n【例句】I saw him open the door and walk in.", "explanationSource": "source"}, {"id": 250, "question": "Lisa heard her brother open the window and ______ out.", "options": ["shouts", "shouted", "shout", "to shout"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 249 題）", "explanation": "heard＋O＋V1 and V2，與 open 對等用原形 shout。", "explanationSource": "supplemental"}, {"id": 251, "question": "We watched the kids jump into the pool ______ happily.", "options": ["and swim", "swam", "and swam", "to swim"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 249 題）", "explanation": "watched＋O＋原形 jump，用 and 連接原形 swim。", "explanationSource": "supplemental"}, {"id": 252, "question": "Mom saw the dog run into the kitchen ______ the meat.", "options": ["ate", "eats", "and ate", "and eat"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 249 題）", "explanation": "saw＋O＋run and eat，兩動詞皆用原形並以 and 連接。", "explanationSource": "supplemental"}, {"id": 253, "question": "Ariel ______ every night for a week before her Chinese test and got a very good grade.", "options": ["studied", "studies", "has studied", "was going to study"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜過去簡單式（與 got 時態一致）", "explanation": "【句型】S ＋ V1（過去式）＋ and ＋ V2（過去式），對等動詞時態一致；敘述過去已完成的事。\n【分析】後面 got a very good grade 是過去式，表示考試已結束；考前一週每晚讀書也是過去的事，用 studied。\n【其他選項】(B) 現在式不合；(C) 現在完成式不用來敘述已結束的過去事件；(D) was going to study 表「原本打算讀」，與拿高分不合。\n【例句】Sam practiced every day before the contest and won first prize.", "explanationSource": "source"}, {"id": 254, "question": "Jack ______ for an hour after dinner and then went to bed.", "options": ["reads", "has read", "read", "is reading"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 253 題）", "explanation": "then went 是過去式，前一動作也用過去式 read。", "explanationSource": "supplemental"}, {"id": 255, "question": "Mina saved money for six months and finally ______ a new bike.", "options": ["bought", "buys", "has bought", "will buy"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 253 題）", "explanation": "saved 過去式，對等用 bought。", "explanationSource": "supplemental"}, {"id": 256, "question": "My brother ______ hard for the race last month and won a gold medal.", "options": ["trains", "has trained", "is training", "trained"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 253 題）", "explanation": "last month 且 won 過去式，用 trained。", "explanationSource": "supplemental"}, {"id": 257, "question": "Tom ______ ten pounds over the past two months. He looks much thinner now.", "options": ["loses", "has lost", "will lose", "was losing"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜現在完成式 over the past + 時間", "explanation": "【句型】over the past + 一段時間 搭配現在完成式 have/has + p.p.，表從過去到現在的累積結果。\n【分析】over the past two months「過去兩個月以來」，結果是現在看起來瘦很多（He looks much thinner now），用 has lost。\n【其他選項】(A) 現在簡單式表習慣；(C) 未來式不合已發生的結果；(D) 過去進行式表過去某時正在進行，與現在結果無關。\n【例句】My sister has read five novels over the past month.", "explanationSource": "source"}, {"id": 258, "question": "Our town ______ a lot over the past ten years. There are many new buildings now.", "options": ["changes", "changed", "has changed", "will change"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 257 題）", "explanation": "over the past ten years 持續到現在，用現在完成式 has changed。", "explanationSource": "supplemental"}, {"id": 259, "question": "Mr. Chen ______ in this school since 2015, so he knows every teacher here.", "options": ["has taught", "teaches", "taught", "is teaching"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 257 題）", "explanation": "since + 過去時間點，用現在完成式 has taught。", "explanationSource": "supplemental"}, {"id": 260, "question": "Lisa: You look tired.\nMike: I ______ well for the past few days because of the exam.", "options": ["don't sleep", "didn't sleep", "won't sleep", "haven't slept"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 257 題）", "explanation": "for the past few days 延續到現在，用 haven't slept。", "explanationSource": "supplemental"}, {"id": 261, "question": "Life in the mountains ______ quieter than life in big cities.", "options": ["are", "is", "to be", "being"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜不可數名詞主詞 + 單數動詞（主詞動詞一致）", "explanation": "【句型】主詞 + 介系詞片語 + 動詞：動詞跟著真正的主詞變化；不可數名詞視為單數。\n【分析】真正的主詞是 Life（不可數名詞，單數），in the mountains 只是修飾的介系詞片語，所以用 is。\n【其他選項】(A) are 誤把 mountains 當主詞；(C) to be、(D) being 不能當主要動詞。\n【例句】The weather in the south is warmer than in the north.", "explanationSource": "source"}, {"id": 262, "question": "The water in these bottles ______ not clean enough to drink.", "options": ["are", "were", "is", "being"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 261 題）", "explanation": "主詞 water 不可數，視為單數，用 is。", "explanationSource": "supplemental"}, {"id": 263, "question": "The price of the shoes ______ too high for me.", "options": ["is", "are", "being", "to be"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 261 題）", "explanation": "真正主詞是 price（單數），用 is。", "explanationSource": "supplemental"}, {"id": 264, "question": "The students in Mr. Chen's class ______ very friendly.", "options": ["is", "was", "being", "are"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 261 題）", "explanation": "主詞 students 複數，用 are。", "explanationSource": "supplemental"}, {"id": 265, "question": "Bill: Have you ever been to Hong Kong?\nTed: Yes, ______. It's really a fun place to go.", "options": ["five days", "for three years", "in one month", "twice already"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜現在完成式（經驗）回答次數 twice already", "explanation": "【句型】Have you ever been to ＋ 地點？（現在完成式表經驗）→ 回答次數 once / twice / ... times\n【分析】Bill 問「曾經去過香港嗎」，Ted 說 Yes 後補充「已經去過兩次了」，用 twice already 表經驗次數。\n【其他選項】(A) five days 缺 for，且不回答經驗；(B) for three years 表持續期間，「去過」不能持續三年；(C) in one month 表「一個月後」，用於未來，不合。\n【例句】Have you ever eaten stinky tofu? — Yes, many times.\n備註：本題考現在完成式（經驗）的回應方式，並非疑問詞或名詞子句，建議改歸「時態＋整句結構」。", "explanationSource": "source"}, {"id": 266, "question": "Amy: Have you ever seen a koala?\nJoe: No, ______. I hope I can see one in Australia.", "options": ["never", "once", "I haven't", "I have"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 265 題）", "explanation": "No 後的簡答用 I haven't，與 Have you…? 呼應。", "explanationSource": "supplemental"}, {"id": 267, "question": "Ivy has ______ to Japan three times. She loves Tokyo.", "options": ["gone", "been", "went", "go"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 265 題）", "explanation": "have been to 表「去過（已回來）」，搭配次數。", "explanationSource": "supplemental"}, {"id": 268, "question": "Leo: How many times have you watched this movie?\nMay: ______. It's my favorite.", "options": ["For two hours", "Last week", "Four times", "In a minute"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 265 題）", "explanation": "How many times 問次數，回答 Four times。", "explanationSource": "supplemental"}, {"id": 269, "question": "Do you know what Lindsey's first job was? Before becoming a movie star, she ______ the floors at the supermarket.", "options": ["mops", "is mopping", "has mopped", "mopped"], "answer": 3, "answerLabel": "D", "source": "115會考｜過去簡單式 mopped（過去的事實）", "explanation": "【句型】過去簡單式：描述過去發生、已結束的事實或工作。\n【分析】線索 what Lindsey's first job was、Before becoming a movie star：她現在是電影明星，拖地是「過去」的第一份工作 → mopped。\n【其他選項】(A) mops：現在簡單式，表示現在的習慣；(B) is mopping：現在進行式，表示此刻正在做；(C) has mopped：現在完成式，不用於描述過去某段已結束時期的工作。\n【例句】Before she became a teacher, Ms. Huang worked at a bookstore.", "explanationSource": "source"}, {"id": 270, "question": "Before moving to Kaohsiung, my family ______ in Hualien for five years.", "options": ["live", "lived", "are living", "will live"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 269 題）", "explanation": "搬家前的過去事實，用過去式 lived。", "explanationSource": "supplemental"}, {"id": 271, "question": "When my dad was young, he ______ newspapers every morning to make money.", "options": ["delivered", "delivers", "is delivering", "has delivered"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 269 題）", "explanation": "when my dad was young 表過去，用 delivered。", "explanationSource": "supplemental"}, {"id": 272, "question": "Ivy is a famous singer now, but ten years ago she ______ songs on the street.", "options": ["sings", "has sung", "sang", "is singing"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 269 題）", "explanation": "ten years ago 表過去時間，用過去式 sang。", "explanationSource": "supplemental"}, {"id": 273, "question": "Tom: Sam, could you help me in the kitchen now?\nSam: No, I ______ TV. It's the most important game of the season.", "options": ["watch", "watched", "have watched", "am watching"], "answer": 3, "answerLabel": "D", "source": "115會考｜現在進行式 am watching（說話當下正在進行）", "explanation": "【句型】現在進行式 am/is/are + Ving：說話當下正在進行的動作。\n【分析】線索 now、No：Tom 問「現在」能否幫忙，Sam 拒絕，因為他「此刻正在看」比賽 → am watching。\n【其他選項】(A) watch：現在簡單式，表習慣，無法說明此刻在忙；(B) watched：過去式，已看完就能幫忙；(C) have watched：表已經看過／完成，也不構成拒絕理由。\n【例句】Please be quiet. The baby is sleeping now.", "explanationSource": "source"}, {"id": 274, "question": "Mom: Can you take out the trash, Kevin?\nKevin: Wait a minute. I ______ my homework.", "options": ["did", "am doing", "have done", "do"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 273 題）", "explanation": "說話當下正在寫作業，用現在進行式。", "explanationSource": "supplemental"}, {"id": 275, "question": "Listen! Someone ______ the piano next door.", "options": ["is playing", "plays", "played", "has played"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 273 題）", "explanation": "Listen! 表當下正在發生，用現在進行式。", "explanationSource": "supplemental"}, {"id": 276, "question": "Amy: Where is Dad?\nBob: He ______ the car in the garage right now.", "options": ["washes", "washed", "is washing", "has washed"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 273 題）", "explanation": "right now 表此刻正在洗車，用現在進行式。", "explanationSource": "supplemental"}, {"id": 277, "question": "Nick: ______ you finish the work before five o'clock?\nKate: I don't think so. It'll take more than an hour. It's already four thirty now.", "options": ["Are", "Do", "Can", "Be"], "answer": 2, "answerLabel": "C", "source": "講義錯題｜助動詞 can 表能力／可能", "explanation": "【句型】Can + 主詞 + 原形動詞…? 詢問「能不能做到」。\n【分析】Kate 回答還要一個多小時、現在已經四點半，表示「五點前做不完」，Nick 問的是能力／可能性，用 Can。\n【其他選項】(A) Are 後面不能接原形動詞 finish；(B) Do you finish 問的是習慣，不合語意；(D) Be 不能放句首形成問句。\n【例句】Can you come to my party this Saturday?\n備註：講義 p.56", "explanationSource": "source"}, {"id": 278, "question": "Amy: ______ you carry this heavy box for me?\nBen: Sure. Where should I put it?", "options": ["Do", "Could", "Are", "Did"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 277 題）", "explanation": "請求別人幫忙用 Could you + 原形動詞。", "explanationSource": "supplemental"}, {"id": 279, "question": "Mom: ______ you see the stars from your window last night?\nTom: No. It was too cloudy.", "options": ["Could", "Can", "Are", "Were"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 277 題）", "explanation": "last night 是過去，問過去能不能看到，用 Could。", "explanationSource": "supplemental"}, {"id": 280, "question": "My little brother is only two, so he ______ read yet.", "options": ["isn't", "doesn't", "can't", "wasn't"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 277 題）", "explanation": "兩歲還不會讀書是能力問題，用 can't + 原形動詞。", "explanationSource": "supplemental"}, {"id": 281, "question": "Kelly: Who ______ the housework in your family?\nLucie: Everyone shares some.", "options": ["does", "is doing", "can do", "did"], "answer": 0, "answerLabel": "A", "source": "講義錯題｜現在簡單式表習慣；Who 當主詞用單數動詞", "explanation": "【句型】Who + 單數動詞…? 問主詞；表習慣、常態用現在簡單式。\n【分析】Lucie 回答 Everyone shares some（現在式），說的是家中平常的分工，Who 當主詞視為第三人稱單數，用 does。\n【其他選項】(B) is doing 是「現在正在做」，不合常態語意；(C) can do 是「誰會做」，問能力不合答句；(D) did 是過去式，與答句 shares 時態不符。\n【例句】Who usually walks the dog in your house?\n備註：講義 p.60", "explanationSource": "source"}, {"id": 282, "question": "Ivy: Who ______ you to school every morning?\nRay: My father does.", "options": ["is taking", "took", "takes", "take"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 281 題）", "explanation": "every morning 表習慣，Who 當主詞用第三人稱單數 takes。", "explanationSource": "supplemental"}, {"id": 283, "question": "My grandmother ______ a walk in the park after dinner every day.", "options": ["takes", "is taking", "took", "take"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 281 題）", "explanation": "every day 表習慣，主詞第三人稱單數，用 takes。", "explanationSource": "supplemental"}, {"id": 284, "question": "Look! The children ______ kites on the hill. They look so happy.", "options": ["fly", "flies", "flew", "are flying"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 281 題）", "explanation": "Look! 表示眼前正在發生，用現在進行式。", "explanationSource": "supplemental"}, {"id": 285, "question": "I ______ swimming for several years before I went to this high school. I gave it up because of heavy schoolwork.", "options": ["have practiced", "am practicing", "practiced", "would practice"], "answer": 2, "answerLabel": "C", "source": "講義錯題｜過去簡單式（過去的事，已結束）vs. 現在完成式", "explanation": "【句型】過去已結束的動作（即使持續一段時間 for several years）用過去簡單式。\n【分析】before I went to this high school 與 I gave it up 表示練游泳是過去的事，而且現在已放棄，用 practiced。\n【其他選項】(A) 現在完成式表持續到現在，與「已放棄」矛盾；(B) 現在進行式表正在練，矛盾；(D) would practice 表過去習慣雖可能，但空格需陳述一段已結束的經歷，會考答案為過去簡單式。\n【例句】My father worked in Japan for five years before he came back to Taiwan.\n備註：講義 p.94", "explanationSource": "source"}, {"id": 286, "question": "Mia ______ in Tainan for ten years, but she moved to Taipei in 2020.", "options": ["has lived", "lives", "lived", "is living"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 285 題）", "explanation": "已搬走，住台南是已結束的過去事件，用過去式。", "explanationSource": "supplemental"}, {"id": 287, "question": "Jack ______ the guitar since he was eight. He still plays it every day.", "options": ["has played", "played", "plays", "was playing"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 285 題）", "explanation": "since + 過去時間且持續到現在，用現在完成式。", "explanationSource": "supplemental"}, {"id": 288, "question": "We ______ in the same class for three years in junior high, but now we go to different schools.", "options": ["are", "have been", "will be", "were"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 285 題）", "explanation": "國中同班已結束，用過去式 were。", "explanationSource": "supplemental"}, {"id": 289, "question": "Mom: Linda, you've been playing computer games all evening! Have you finished your report?\nLinda: Well, ______ most of it this afternoon, and I'll finish it by Friday.", "options": ["I would do", "I did", "I was doing", "I'll do"], "answer": 1, "answerLabel": "B", "source": "講義錯題｜過去簡單式（this afternoon 已過去）", "explanation": "【句型】過去已完成的動作用過去簡單式；this afternoon 若已過去，就用過去式。\n【分析】媽媽說她已玩了一整晚（all evening），所以 this afternoon 已過去；「下午做完了大部分」是已完成的動作，用 I did。\n【其他選項】(A) would do 表過去的未來或假設，不合；(C) was doing 描述過去某時刻正在進行，無法表示「已做完大部分」；(D) I'll do 是未來式，但下午已過。\n【例句】It's nine p.m. now. I cleaned my room this morning.\n備註：講義 p.94", "explanationSource": "source"}, {"id": 290, "question": "It's eight o'clock at night. I ______ my homework this afternoon, so now I can watch TV.", "options": ["finish", "will finish", "finished", "am finishing"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 289 題）", "explanation": "晚上八點時下午已過，用過去式。", "explanationSource": "supplemental"}, {"id": 291, "question": "It's only ten in the morning. I ______ my grandparents this afternoon.", "options": ["visited", "will visit", "have visited", "was visiting"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 289 題）", "explanation": "現在是早上，下午尚未到，用未來式。", "explanationSource": "supplemental"}, {"id": 292, "question": "Dad: Where were you at four this afternoon?\nAndy: I ______ basketball with my friends at the park.", "options": ["played", "play", "am playing", "was playing"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 289 題）", "explanation": "過去某個時間點正在做的事，用過去進行式。", "explanationSource": "supplemental"}, {"id": 293, "question": "I always ______ my wife with the housework for two hours every weekend when we lived in London.", "options": ["helped", "helps", "am helping", "was going to help"], "answer": 0, "answerLabel": "A", "source": "講義錯題｜過去簡單式表過去習慣（when we lived…）", "explanation": "【句型】過去的習慣（always / every weekend）用過去簡單式。\n【分析】when we lived in London 表示過去的時間，always…every weekend 表示習慣，所以用 helped。\n【其他選項】(B) helps 是現在式，且主詞 I 不接 helps；(C) am helping 是現在進行式，時間不合；(D) was going to help 是「過去原本打算要幫」，不表習慣。\n【例句】When I was a child, I often played in the river near my house.\n備註：講義 p.94", "explanationSource": "source"}, {"id": 294, "question": "When my grandpa was young, he ______ to school on foot every day.", "options": ["walks", "walked", "is walking", "has walked"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 293 題）", "explanation": "when he was young 是過去，every day 是習慣，用過去式。", "explanationSource": "supplemental"}, {"id": 295, "question": "Now Emma ______ to school by MRT, but she used to take the bus.", "options": ["goes", "went", "was going", "had gone"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 293 題）", "explanation": "Now 表現在的習慣，用現在簡單式。", "explanationSource": "supplemental"}, {"id": 296, "question": "When we were in Kaohsiung, my sister and I usually ______ on the beach on Sundays.", "options": ["are walking", "walk", "walked", "have walked"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 293 題）", "explanation": "過去在高雄時的習慣，用過去式。", "explanationSource": "supplemental"}, {"id": 297, "question": "Daisy: Have you found the information you need?\nTyler: I ______ the Net for an hour last night but still couldn't find any.", "options": ["surfed", "have surfed", "would surf", "have been surfing"], "answer": 0, "answerLabel": "A", "source": "講義錯題｜明確過去時間 last night 用過去式，不用現在完成式", "explanation": "【句型】有明確過去時間（last night, yesterday, … ago）用過去簡單式，不可用現在完成式。\n【分析】句中有 last night，且後句用 couldn't，表示是過去的事，用 surfed。for an hour 不代表一定要用完成式。\n【其他選項】(B)(D) 現在完成（進行）式不能與 last night 連用；(C) would surf 表過去習慣或假設，不合語意。\n【例句】I studied in the library for three hours yesterday.\n備註：講義 p.261", "explanationSource": "source"}, {"id": 298, "question": "I ______ Tina at the bookstore two days ago.", "options": ["have seen", "saw", "see", "have been seeing"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 297 題）", "explanation": "two days ago 是明確過去時間，用過去式。", "explanationSource": "supplemental"}, {"id": 299, "question": "Fred ______ his grandparents three times this year.", "options": ["visits", "is visiting", "was visiting", "has visited"], "answer": 3, "answerLabel": "D", "source": "類似題 2（對應第 297 題）", "explanation": "this year 尚未結束，表到目前為止的經驗，用現在完成式。", "explanationSource": "supplemental"}, {"id": 300, "question": "Mom: Have you cleaned your room?\nKai: Yes. I ______ it this morning before breakfast.", "options": ["cleaned", "have cleaned", "clean", "will clean"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 297 題）", "explanation": "this morning before breakfast 是過去明確時間，用過去式。", "explanationSource": "supplemental"}, {"id": 301, "question": "Jenny: Ivan told me that Alice ______ around about you. Is there anything I should know?\nDrew: No way! You must be kidding.", "options": ["has asked", "used to ask", "was asking", "will ask"], "answer": 0, "answerLabel": "A", "source": "講義錯題｜現在完成式表最近持續的影響（lately）", "explanation": "【句型】現在完成式 have/has + p.p. 表示「最近發生、與現在有關」的事（常搭配 lately、recently）\n【分析】Jenny 問 Is there anything I should know?，表示 Alice 打聽 Drew 這件事是最近的、到現在仍有影響 → has asked（最近一直在打聽）。\n【其他選項】(B) used to ask 表示過去常常、現在不再，不合語意；(D) will ask 是未來，Ivan 不會轉述還沒發生的事；(C) was asking 見 note。\n【例句】Ben told me that Lisa has moved to Tainan.\n備註：講義 p.335；老師紅筆訂正為 (A) 並註 lately。依時態一致，(C) was asking 亦說得通，本題以老師答案為準，講解時宜補充。", "explanationSource": "source"}, {"id": 302, "question": "Mom: You look tired. ______ well lately?\nAndy: Not really. I have too much homework.", "options": ["Did you sleep", "Have you slept", "Will you sleep", "Do you sleep"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 301 題）", "explanation": "lately 表最近到現在，用現在完成式。", "explanationSource": "supplemental"}, {"id": 303, "question": "Kelly ______ three books since the summer vacation started.", "options": ["reads", "was reading", "used to read", "has read"], "answer": 3, "answerLabel": "D", "source": "類似題 2（對應第 301 題）", "explanation": "since + 過去時間點，用現在完成式。", "explanationSource": "supplemental"}, {"id": 304, "question": "Leo: Where is Mr. Wang?\nNina: He ______ to the office. He'll be back soon.", "options": ["has gone", "has been", "used to go", "will go"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 301 題）", "explanation": "人去了還沒回來，用 has gone to。", "explanationSource": "supplemental"}, {"id": 305, "question": "There ______ something wrong with the coffee machine since yesterday. Be sure to get someone to fix it today, please.", "options": ["was", "is", "will be", "has been"], "answer": 3, "answerLabel": "D", "source": "講義錯題｜There has been … since（現在完成式）", "explanation": "【句型】There has/have been + N + since + 過去時間（從過去持續到現在）\n【分析】since yesterday 表示從昨天一直到現在都壞了，後句還要今天找人修 → has been。\n【其他選項】(A) was 只表過去；(B) is 現在式不能搭配 since；(C) will be 是未來。\n【例句】There have been many visitors since the museum opened.\n備註：講義 p.337", "explanationSource": "source"}, {"id": 306, "question": "There ______ no rain in this town since last month. The farmers are worried.", "options": ["is", "was", "has been", "will be"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 305 題）", "explanation": "since last month 用現在完成式 has been。", "explanationSource": "supplemental"}, {"id": 307, "question": "There ______ a big typhoon last week, and many trees fell down.", "options": ["was", "has been", "is", "will be"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 305 題）", "explanation": "last week 為過去時間，用 was。", "explanationSource": "supplemental"}, {"id": 308, "question": "There ______ three new students in our class since September.", "options": ["are", "have been", "has been", "were"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 305 題）", "explanation": "since + 過去時間，複數 students 用 have been。", "explanationSource": "supplemental"}]};</script><script src="longteng-b1u5-quiz.js?v=20261027-2"></script><script>document.querySelector("#description").textContent="共 308 題（會考歷屆＋講義錯題 77 題＋類似題 231 題）｜選答後顯示中文解析｜答錯可重做並下載錯題";</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
