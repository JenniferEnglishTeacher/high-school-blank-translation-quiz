<script>window.QUIZ_CONFIG={"title": "國中會考文法歷屆試題｜連接詞", "mode": "mcq", "questions": [{"id": 1, "question": "John felt much better ______ he took the medicine the doctor gave him.", "options": ["if", "so", "than", "after"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜時間連接詞 after", "explanation": "【句型】S + V + after + S + V（在……之後）；after 引導時間副詞子句。\n【分析】先吃藥，「之後」才覺得好多了 → after。\n【其他選項】(A) if 如果，felt 為過去事實，不合條件語意；(B) so 所以，因果顛倒（應是吃藥所以好轉）；(C) than 前雖有比較級 better，但「比他吃藥更好」語意不通。\n【例句】I always brush my teeth after I eat breakfast.", "explanationSource": "source"}, {"id": 2, "question": "Wash your hands ______ you eat dinner.", "options": ["before", "so", "than", "but"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 1 題）", "explanation": "吃飯「之前」洗手 → before。", "explanationSource": "supplemental"}, {"id": 3, "question": "Mark was tired, ______ he went to bed early.", "options": ["because", "so", "after", "if"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 1 題）", "explanation": "因為累，「所以」早睡 → so。", "explanationSource": "supplemental"}, {"id": 4, "question": "Kelly felt happy ______ she heard the good news.", "options": ["than", "unless", "after", "so"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 1 題）", "explanation": "聽到好消息「之後」覺得開心 → after。", "explanationSource": "supplemental"}, {"id": 5, "question": "Shirley: How's your new English teacher? She looks friendly.\nLauren: She is nice! ______, she's the nicest person I've ever seen.", "options": ["Even so", "In fact", "Also", "However"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜轉折語 In fact（事實上，更進一步）", "explanation": "【句型】In fact = 事實上；用來補充、加強前一句的說法。\n【分析】She is nice! 之後補充更強烈的說法「她是我見過最好的人」→ In fact。\n【其他選項】(A) Even so 即使如此，表讓步，前後應相反；(C) Also 也，用於追加另一件不同的事，此處是加強同一點；(D) However 然而，表轉折，前後語意應相反。\n【例句】Tim isn't lazy. In fact, he is the hardest-working boy in class.", "explanationSource": "source"}, {"id": 6, "question": "I like dogs. ______, I have three of them at home.", "options": ["However", "In fact", "Even so", "Instead"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 5 題）", "explanation": "補充加強「喜歡狗」→ In fact。", "explanationSource": "supplemental"}, {"id": 7, "question": "The test was very hard. ______, Peter got a perfect score.", "options": ["In fact", "Also", "However", "So"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 5 題）", "explanation": "很難卻考滿分 → 轉折 However。", "explanationSource": "supplemental"}, {"id": 8, "question": "Kate can play the violin. She can ______ play the piano.", "options": ["however", "ever", "also", "yet"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 5 題）", "explanation": "追加另一項才能 → also（也）。", "explanationSource": "supplemental"}, {"id": 9, "question": "I walked to school every day ______ my dad bought me a bike last month. It's really fun and convenient to go to school by bike.", "options": ["after", "because", "if", "until"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜連接詞 until 直到", "explanation": "【句型】A until B：A 持續到 B 發生為止\n【分析】以前每天走路上學，「直到」上個月爸爸買了腳踏車，現在改騎車上學，用 until。\n【其他選項】(A) after 在…之後，變成買車後才走路，與後句騎車矛盾；(B) because 因為，因果不合；(C) if 如果，不用於已發生的過去事實。\n【例句】We waited in the classroom until the rain stopped.\n備註：此題考連接詞，與副詞無關，建議改歸「連接詞」。", "explanationSource": "source"}, {"id": 10, "question": "Please stay in your seat ______ the bus stops.", "options": ["until", "because", "though", "so"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 9 題）", "explanation": "「直到」公車停下前都要坐好，用 until。", "explanationSource": "supplemental"}, {"id": 11, "question": "Kevin didn't know how to swim ______ he took lessons last summer.", "options": ["because", "until", "so", "but"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 9 題）", "explanation": "not…until「直到…才」，直到去年夏天上課才會游泳。", "explanationSource": "supplemental"}, {"id": 12, "question": "I'll wait here ______ you come back. Don't be too long.", "options": ["before", "but", "until", "or"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 9 題）", "explanation": "等到你回來為止，用 until。", "explanationSource": "supplemental"}, {"id": 13, "question": "It was an exciting moment for Mr. and Mrs. Wang ______ they learned that they were going to have a baby.", "options": ["what", "when", "whether", "why"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜時間連接詞 when（…的時候）", "explanation": "【句型】S ＋ V ..., when ＋ S ＋ V（when 引導時間副詞子句：當…時）\n【分析】「當」王先生夫婦得知要有寶寶的時候，那是興奮的時刻；前句結構完整，空格引導時間子句，用 when。\n【其他選項】(A) what 引導名詞子句且須缺主詞／受詞，此處子句完整；(C) whether 是否；(D) why 為什麼，皆不合語意。\n【例句】Everyone cheered when the team scored the winning goal.\n備註：本題 when 引導時間副詞子句（亦可視為修飾 moment 的關係副詞），並非疑問詞名詞子句，建議改歸「連接詞」。", "explanationSource": "source"}, {"id": 14, "question": "I was taking a shower ______ the phone rang.", "options": ["when", "what", "whether", "which"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 13 題）", "explanation": "「當」電話響時，when 引導時間子句。", "explanationSource": "supplemental"}, {"id": 15, "question": "Rita felt very proud ______ she got first place in the speech contest.", "options": ["what", "whether", "when", "who"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 13 題）", "explanation": "「當」她得第一名時很驕傲，when 引導時間子句。", "explanationSource": "supplemental"}, {"id": 16, "question": "Please turn off the lights ______ you leave the classroom.", "options": ["whether", "when", "what", "why"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 13 題）", "explanation": "離開教室「的時候」關燈，when 引導時間子句。", "explanationSource": "supplemental"}, {"id": 17, "question": "Patty spent several days planning to invite Charlie to dinner, ______ she couldn't say a word when they met.", "options": ["but", "if", "or", "so"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜but 表轉折（但是）", "explanation": "【句型】S + V, but + S + V：前後語意相反，用 but。\n【分析】前句「花好幾天計畫邀 Charlie 吃飯」，後句「見面時卻一句話都說不出來」，前後語意相反，用 but。\n【其他選項】(B) if 表條件「如果」，語意不通；(C) or 表「否則／或者」，不合；(D) so 表結果「所以」，花時間計畫不會導致說不出話。\n【例句】I studied hard, but I didn't pass the test.（我很用功，但考試沒過。）", "explanationSource": "source"}, {"id": 18, "question": "Jason practiced the song many times, ______ he still forgot the words on stage.", "options": ["so", "but", "or", "because"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 17 題）", "explanation": "練習很多次卻還是忘詞，前後轉折用 but。", "explanationSource": "supplemental"}, {"id": 19, "question": "The restaurant is small, ______ its food is famous all over Tainan.", "options": ["or", "so", "if", "but"], "answer": 3, "answerLabel": "D", "source": "類似題 2（對應第 17 題）", "explanation": "店小但食物有名，語意相反用 but。", "explanationSource": "supplemental"}, {"id": 20, "question": "Wendy wanted to call her friend, ______ her phone was out of battery.", "options": ["but", "so", "or", "if"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 17 題）", "explanation": "想打電話卻沒電，轉折用 but。", "explanationSource": "supplemental"}, {"id": 21, "question": "______ machines have been used to pick fruits for a long time, they were not used on strawberry farms until several years ago.", "options": ["Although", "Because", "Before", "If"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜Although 雖然（讓步）", "explanation": "【句型】Although + S + V, S + V：「雖然……，（但）……」，although 與 but 不可並用。\n【分析】前句「機器用來採水果已經很久了」，後句「直到幾年前才用在草莓園」，前後語意相反，用 Although 表讓步。\n【其他選項】(B) Because 表原因，語意不通；(C) Before 表時間「在……之前」，與現在完成式 have been used 不搭且語意不合；(D) If 表條件，不合過去事實。\n【例句】Although it was raining, we still went to the beach.（雖然下雨，我們還是去了海邊。）", "explanationSource": "source"}, {"id": 22, "question": "______ Ryan is only ten, he can speak three languages.", "options": ["Because", "Although", "If", "Until"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 21 題）", "explanation": "年紀小卻會三種語言，語意轉折用 Although。", "explanationSource": "supplemental"}, {"id": 23, "question": "______ the test was difficult, most students got good grades.", "options": ["Though", "Because", "Unless", "Since"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 21 題）", "explanation": "考試難但多數人考好，用 Though 表讓步。", "explanationSource": "supplemental"}, {"id": 24, "question": "______ my grandpa is over eighty, he still goes jogging every morning.", "options": ["If", "Because", "Although", "When"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 21 題）", "explanation": "年紀大卻仍慢跑，用 Although。", "explanationSource": "supplemental"}, {"id": 25, "question": "Jimmy would not get up for breakfast, ______ his dad had already tried to pull him from his bed several times.", "options": ["although", "because", "if", "until"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜although 雖然（子句在後）", "explanation": "【句型】S + V, although + S + V：「……，雖然……」，although 子句可放句後。\n【分析】「Jimmy 就是不起床吃早餐」，「雖然爸爸已經試著把他拉下床好幾次」，前後語意相反，用 although。\n【其他選項】(B) because：爸爸拉他不會是他不起床的原因；(C) if 表條件，與過去完成式事實不合；(D) until「直到」，語意不通（不是到爸爸拉他才不起床）。\n【例句】She went to school, although she had a cold.（她去上學了，雖然她感冒了。）", "explanationSource": "source"}, {"id": 26, "question": "Ivy kept walking in the rain, ______ she had an umbrella in her bag.", "options": ["because", "although", "until", "if"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 25 題）", "explanation": "有傘卻淋雨走，語意相反用 although。", "explanationSource": "supplemental"}, {"id": 27, "question": "Leo didn't say sorry to his sister, ______ he knew he was wrong.", "options": ["although", "so", "because", "if"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 25 題）", "explanation": "知道錯卻不道歉，用 although。", "explanationSource": "supplemental"}, {"id": 28, "question": "The baby kept crying, ______ his mom fed him and sang to him.", "options": ["because", "unless", "though", "since"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 25 題）", "explanation": "媽媽餵奶唱歌卻仍哭，用 though 表讓步。", "explanationSource": "supplemental"}, {"id": 29, "question": "Da-fa is cleaning the house ______ some of his friends are coming for dinner.", "options": ["because", "but", "if", "so"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜because 因為（原因）", "explanation": "【句型】S + V + because + S + V：說明原因。\n【分析】「朋友要來吃晚餐」是 Da-fa「正在打掃房子」的原因，用 because。\n【其他選項】(B) but 表轉折，前後並不相反；(C) if 表條件，但他已經在打掃，朋友要來是確定的；(D) so 表結果，順序顛倒（打掃不會導致朋友來）。\n【例句】Amy went to bed early because she was tired.（Amy 很早睡，因為她累了。）", "explanationSource": "source"}, {"id": 30, "question": "Mom is making a big cake ______ it's my sister's birthday today.", "options": ["but", "because", "or", "until"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 29 題）", "explanation": "今天是妹妹生日是做蛋糕的原因，用 because。", "explanationSource": "supplemental"}, {"id": 31, "question": "Andy wore a coat ______ it was very cold outside.", "options": ["because", "so", "but", "or"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 29 題）", "explanation": "天冷是穿外套的原因，用 because。", "explanationSource": "supplemental"}, {"id": 32, "question": "The students are cheering ______ their team just won the game.", "options": ["but", "or", "if", "because"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 29 題）", "explanation": "球隊贏球是歡呼的原因，用 because。", "explanationSource": "supplemental"}, {"id": 33, "question": "Ms. Liu usually gives us a lot of homework, ______ she didn't give us any today.", "options": ["but", "if", "or", "so"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜but 表轉折（但是）", "explanation": "【句型】S + V, but + S + V：前後語意相反。\n【分析】「劉老師通常給很多功課」，「今天卻一點都沒給」，usually 與 today 對比、語意相反，用 but。\n【其他選項】(B) if 表條件；(C) or 表「否則／或」；(D) so 表結果，常給功課不會導致今天沒給。\n【例句】Ben usually walks to school, but he took a bus today.（Ben 通常走路上學，但今天搭公車。）", "explanationSource": "source"}, {"id": 34, "question": "My dad usually drinks coffee in the morning, ______ he had tea today.", "options": ["so", "or", "but", "because"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 33 題）", "explanation": "usually 與 today 對比，用 but。", "explanationSource": "supplemental"}, {"id": 35, "question": "Kevin is usually very quiet, ______ he talked a lot at the party last night.", "options": ["but", "so", "if", "or"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 33 題）", "explanation": "平常安靜、昨晚卻很多話，用 but。", "explanationSource": "supplemental"}, {"id": 36, "question": "It usually rains a lot in Keelung in winter, ______ it was sunny all week.", "options": ["so", "but", "because", "or"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 33 題）", "explanation": "平常多雨卻整週晴天，用 but。", "explanationSource": "supplemental"}, {"id": 37, "question": "Sue is very sick and has to stop working for several weeks. But ______ she feels better, she will get back to work.", "options": ["so far", "since then", "because", "as soon as"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜as soon as 一……就……", "explanation": "【句型】as soon as + S + 現在式, S + will V：「一……就……」（時間副詞子句用現在式代替未來）。\n【分析】「她一覺得好一點，就會回去工作」，she feels better 用現在式表未來，主句 will get back，用 as soon as。\n【其他選項】(A) so far「到目前為止」，是副詞片語，不能接子句，且配完成式；(B) since then「從那時起」，副詞片語，不能連接兩個子句；(C) because「因為」，語意上不是原因而是時間點，且與 But 搭配不自然。\n【例句】I'll call you as soon as I get home.（我一到家就打給你。）", "explanationSource": "source"}, {"id": 38, "question": "Please text me ______ you arrive at the airport.", "options": ["as soon as", "so far", "because of", "since then"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 37 題）", "explanation": "「一到機場就傳訊息」，用 as soon as + 現在式。", "explanationSource": "supplemental"}, {"id": 39, "question": "______ the bell rang, the students ran out of the classroom.", "options": ["So far", "As soon as", "Because of", "Since then"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 37 題）", "explanation": "鐘一響學生就跑出去，as soon as 連接兩子句。", "explanationSource": "supplemental"}, {"id": 40, "question": "We will start the meeting ______ Mr. Chang gets here.", "options": ["so far", "since then", "as soon as", "because of"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 37 題）", "explanation": "張先生一到就開會，時間子句用現在式 gets。", "explanationSource": "supplemental"}, {"id": 41, "question": "______ Joe looks strong, in fact he gets sick easily.", "options": ["Because", "If", "Though", "When"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜Though 雖然（讓步）", "explanation": "【句型】Though/Although + S + V, S + V：「雖然……，（但）……」。\n【分析】「Joe 看起來很強壯」，「事實上卻很容易生病」，in fact 提示前後相反，用 Though。\n【其他選項】(A) Because：看起來壯不是容易生病的原因；(B) If 表條件，語意不通；(D) When 表時間，語意不合。\n【例句】Though the room is small, it is very comfortable.（雖然房間小，但很舒服。）", "explanationSource": "source"}, {"id": 42, "question": "______ the bag looks cheap, it actually costs a lot.", "options": ["Because", "Though", "If", "Since"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 41 題）", "explanation": "看起來便宜實際很貴，前後相反用 Though。", "explanationSource": "supplemental"}, {"id": 43, "question": "______ Nina seems shy, she is actually very outgoing with friends.", "options": ["Though", "When", "Because", "If"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 41 題）", "explanation": "看似害羞實則外向，用 Though。", "explanationSource": "supplemental"}, {"id": 44, "question": "______ the question looks easy, few students got it right.", "options": ["Because", "Unless", "When", "Although"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 41 題）", "explanation": "看起來簡單卻很少人答對，用 Although。", "explanationSource": "supplemental"}, {"id": 45, "question": "My grandmother believes that young children in big cities get sick easily ______ the air is dirty.", "options": ["because", "before", "but", "whether"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜because 因為（原因）", "explanation": "【句型】S + V + because + S + V：說明原因。\n【分析】「空氣髒」是「大城市孩子容易生病」的原因，用 because。\n【其他選項】(B) before「在……之前」，語意不通；(C) but 表轉折，前後並不相反；(D) whether「是否」，不用來連接原因。\n【例句】We stayed at home because it was raining hard.（因為雨下很大，我們待在家。）", "explanationSource": "source"}, {"id": 46, "question": "Many people like living in the countryside ______ it is quiet there.", "options": ["but", "because", "before", "whether"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 45 題）", "explanation": "安靜是喜歡住鄉下的原因，用 because。", "explanationSource": "supplemental"}, {"id": 47, "question": "The plants died ______ nobody watered them for weeks.", "options": ["because", "but", "until", "whether"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 45 題）", "explanation": "沒人澆水是植物死掉的原因，用 because。", "explanationSource": "supplemental"}, {"id": 48, "question": "Dr. Lin says some students can't focus in class ______ they sleep too late.", "options": ["but", "before", "because", "or"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 45 題）", "explanation": "太晚睡是不專心的原因，用 because。", "explanationSource": "supplemental"}, {"id": 49, "question": "I've wanted to read The Diary of a Young Girl for months, ______ today I finally borrowed the book from the library.", "options": ["and", "since", "so", "until"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜so 所以（結果）", "explanation": "【句型】S + V (原因), so + S + V (結果)：「……，所以……」。\n【分析】「想讀這本書好幾個月了」（原因），「所以今天終於從圖書館借來了」（結果），用 so。\n【其他選項】(A) and 只表並列，無法表達「想讀很久→終於借」的因果；(B) since「因為／自從」，放在結果前語意顛倒；(D) until「直到」，與 have wanted 及 finally 搭配不自然（應為 until today 而非 until today I finally…）。\n【例句】I was very hungry, so I ate two bowls of rice.（我很餓，所以吃了兩碗飯。）", "explanationSource": "source"}, {"id": 50, "question": "Jill missed the last bus, ______ she had to take a taxi home.", "options": ["but", "so", "because", "or"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 49 題）", "explanation": "錯過公車導致要搭計程車，結果用 so。", "explanationSource": "supplemental"}, {"id": 51, "question": "Bill has saved money for a year, ______ now he can buy the new bike.", "options": ["so", "because", "until", "or"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 49 題）", "explanation": "存錢一年的結果是能買新車，用 so。", "explanationSource": "supplemental"}, {"id": 52, "question": "It was my first time in Tainan, ______ I asked a local for directions.", "options": ["because", "until", "but", "so"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 49 題）", "explanation": "第一次來台南所以問路，結果用 so。", "explanationSource": "supplemental"}, {"id": 53, "question": "It was very hot when we got to Kenting National Park, ______ we still had a good time there.", "options": ["or", "so", "but", "because"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜but 表轉折（但是）", "explanation": "【句型】S + V, but + S + V：前後語意相反；still 常提示轉折。\n【分析】「到墾丁時很熱」，「我們仍然玩得很開心」，still 提示前後相反，用 but。\n【其他選項】(A) or 表「否則／或」；(B) so 表結果，天熱不會「導致」玩得開心；(D) because 表原因，語意不通。\n【例句】The bag was heavy, but she still carried it up the stairs.（袋子很重，但她還是提上樓了。）", "explanationSource": "source"}, {"id": 54, "question": "It rained all day, ______ we still enjoyed the trip to Yilan.", "options": ["so", "because", "but", "or"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 53 題）", "explanation": "下雨卻仍玩得開心，用 but。", "explanationSource": "supplemental"}, {"id": 55, "question": "The line was very long, ______ Rick still waited to buy the ice cream.", "options": ["but", "so", "or", "if"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 53 題）", "explanation": "隊伍長卻仍排隊，用 but。", "explanationSource": "supplemental"}, {"id": 56, "question": "Lucy was very tired, ______ she still finished her homework.", "options": ["because", "but", "or", "so"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 53 題）", "explanation": "很累卻仍寫完功課，用 but。", "explanationSource": "supplemental"}, {"id": 57, "question": "My sister wants to buy a car ______ she doesn't have enough money.", "options": ["because", "but", "if", "or"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜but 表轉折（但是）", "explanation": "【句型】S + V + but + S + V：前後語意相反。\n【分析】「姊姊想買車」，「但她錢不夠」，前後語意相反，用 but。\n【其他選項】(A) because：錢不夠不是想買車的原因；(C) if：「如果錢不夠就想買車」不合理；(D) or 表「或／否則」，語意不通。\n【例句】I want to go to the concert, but I don't have a ticket.（我想去演唱會，但沒有票。）", "explanationSource": "source"}, {"id": 58, "question": "Tony wants to play outside ______ he has to finish his homework first.", "options": ["but", "because", "or", "so"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 57 題）", "explanation": "想出去玩卻得先寫功課，用 but。", "explanationSource": "supplemental"}, {"id": 59, "question": "Grace likes the dress very much, ______ it is too expensive for her.", "options": ["because", "so", "but", "if"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 57 題）", "explanation": "喜歡但太貴，前後相反用 but。", "explanationSource": "supplemental"}, {"id": 60, "question": "We wanted to see the sunrise, ______ the sky was too cloudy.", "options": ["so", "but", "because", "or"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 57 題）", "explanation": "想看日出但天空多雲，用 but。", "explanationSource": "supplemental"}, {"id": 61, "question": "This dress is pretty, ______ it does not look good on me.", "options": ["so", "but", "or", "if"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜but 表轉折（但是）", "explanation": "【句型】S + V, but + S + V：前後語意相反。\n【分析】「這件洋裝很漂亮」，「但穿在我身上不好看」，前後相反，用 but。\n【其他選項】(A) so 表結果，漂亮不會導致不好看；(C) or 表「或／否則」；(D) if 表條件，語意不通。\n【例句】The soup smells good, but it tastes too salty.（湯聞起來香，但喝起來太鹹。）", "explanationSource": "source"}, {"id": 62, "question": "These shoes are cheap, ______ they are not comfortable.", "options": ["so", "or", "but", "if"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 61 題）", "explanation": "便宜但不舒服，轉折用 but。", "explanationSource": "supplemental"}, {"id": 63, "question": "The movie was long, ______ it wasn't boring at all.", "options": ["but", "so", "because", "or"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 61 題）", "explanation": "片長但不無聊，用 but。", "explanationSource": "supplemental"}, {"id": 64, "question": "The phone looks nice, ______ it breaks easily.", "options": ["so", "or", "because", "but"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 61 題）", "explanation": "外觀好但容易壞，用 but。", "explanationSource": "supplemental"}, {"id": 65, "question": "I have to catch the bus right now, ______ I'll miss my brother's birthday party.", "options": ["and", "because", "or", "until"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜祈使/義務句, or 否則", "explanation": "【句型】S + have to/must V..., or + S + will V：「……，否則……」。\n【分析】「我現在必須趕上公車」，「否則會錯過弟弟的生日派對」，用 or 表「否則」。\n【其他選項】(A) and 表「然後／而且」，搭公車然後錯過派對不合理；(B) because：錯過派對不是趕公車的原因（語意顛倒）；(D) until「直到」，語意不通。\n【例句】Hurry up, or you'll be late for school.（快點，否則你上學會遲到。）", "explanationSource": "source"}, {"id": 66, "question": "You should wear a jacket, ______ you'll catch a cold.", "options": ["and", "or", "so", "because"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 65 題）", "explanation": "穿外套，否則會感冒，用 or。", "explanationSource": "supplemental"}, {"id": 67, "question": "We must leave now, ______ we'll miss the first part of the show.", "options": ["or", "and", "but", "since"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 65 題）", "explanation": "必須現在走，否則錯過開場，用 or。", "explanationSource": "supplemental"}, {"id": 68, "question": "Study hard, ______ you'll pass the exam.", "options": ["or", "but", "and", "until"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 65 題）", "explanation": "祈使句 + and 表「……，就會……」（正面結果），用 and。", "explanationSource": "supplemental"}, {"id": 69, "question": "______ Annie knows fast food is not good for her health, she still eats it.", "options": ["Although", "Because", "If", "When"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜Although 雖然（讓步）", "explanation": "【句型】Although + S + V, S + still V：「雖然……，還是……」。\n【分析】「Annie 知道速食對健康不好」，「她還是吃」，still 提示前後語意相反，用 Although。\n【其他選項】(B) Because：知道不健康不會是她吃的原因；(C) If 表條件，語意不合；(D) When 表時間，無法表達讓步。\n【例句】Although Ben was tired, he still helped his mom wash the dishes.（雖然 Ben 很累，他還是幫媽媽洗碗。）", "explanationSource": "source"}, {"id": 70, "question": "______ Kevin knows the answer, he doesn't want to raise his hand.", "options": ["Because", "If", "Although", "When"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 69 題）", "explanation": "知道答案卻不舉手，語意相反用 Although。", "explanationSource": "supplemental"}, {"id": 71, "question": "______ it was late, the children were still playing in the park.", "options": ["Although", "Because", "If", "Until"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 69 題）", "explanation": "很晚了孩子還在玩，用 Although。", "explanationSource": "supplemental"}, {"id": 72, "question": "______ Judy was afraid of dogs, she still fed her neighbor's dog.", "options": ["If", "Although", "Because", "Unless"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 69 題）", "explanation": "怕狗卻還是餵狗，用 Although。", "explanationSource": "supplemental"}, {"id": 73, "question": "Dad: Are you going out? It's really late now.\nMitch: I know, but it's the last day to buy tickets to the World Cup games, ______ I must go.", "options": ["if", "or", "so", "though"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜so 所以（結果）", "explanation": "【句型】S + V (原因), so + S + V (結果)。\n【分析】「今天是買世足賽門票的最後一天」（原因），「所以我一定得去」（結果），用 so。\n【其他選項】(A) if 表條件，語意不通；(B) or 表「否則」，不合；(D) though「雖然」，前後不是相反關係。\n【例句】The store will close soon, so we have to hurry.（店快關了，所以我們得快點。）", "explanationSource": "source"}, {"id": 74, "question": "Tomorrow is the deadline for the art contest, ______ I have to finish my painting tonight.", "options": ["though", "so", "or", "if"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 73 題）", "explanation": "明天截止，所以今晚得畫完，用 so。", "explanationSource": "supplemental"}, {"id": 75, "question": "The MRT was out of service, ______ we took a bus to the concert.", "options": ["though", "or", "if", "so"], "answer": 3, "answerLabel": "D", "source": "類似題 2（對應第 73 題）", "explanation": "捷運停駛導致改搭公車，結果用 so。", "explanationSource": "supplemental"}, {"id": 76, "question": "It's Mom's birthday today, ______ we're going to cook dinner for her.", "options": ["so", "or", "though", "if"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 73 題）", "explanation": "今天媽媽生日所以要煮晚餐，用 so。", "explanationSource": "supplemental"}, {"id": 77, "question": "Mr. Hu speaks good English ______ he lived in the U.S. for many years.", "options": ["because", "but", "so", "whether"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜because 因為（原因）", "explanation": "【句型】S + V + because + S + V：說明原因。\n【分析】「住在美國很多年」是「胡先生英文說得好」的原因，用 because。\n【其他選項】(B) but 表轉折，前後並不相反；(C) so 表結果，因果顛倒（說英文好不會導致住美國多年）；(D) whether「是否」，不能表原因。\n【例句】Lily can play the piano well because she has practiced since she was five.（Lily 鋼琴彈得好，因為她從五歲就練習。）", "explanationSource": "source"}, {"id": 78, "question": "Carl knows a lot about animals ______ his mother is a vet.", "options": ["but", "so", "because", "whether"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 77 題）", "explanation": "媽媽是獸醫是他懂動物的原因，用 because。", "explanationSource": "supplemental"}, {"id": 79, "question": "Jenny is good at cooking ______ she often helps her grandma in the kitchen.", "options": ["because", "but", "or", "so"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 77 題）", "explanation": "常幫忙下廚是會煮菜的原因，用 because。", "explanationSource": "supplemental"}, {"id": 80, "question": "Owen got a high score on the math test ______ he studied every night.", "options": ["but", "because", "or", "whether"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 77 題）", "explanation": "每晚讀書是考高分的原因，用 because。", "explanationSource": "supplemental"}, {"id": 81, "question": "I can't find my history book, ______ I know it's somewhere in the living room.", "options": ["because", "but", "since", "until"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜對等連接詞 but（語氣轉折）", "explanation": "【句型】S1 + V1, but + S2 + V2.（前後語意相反、轉折）\n【分析】前句「找不到歷史課本」，後句「知道它就在客廳某處」，兩句語意相對，用 but「但是」連接。\n【其他選項】(A) because「因為」、(C) since「既然；因為」皆表原因，但「知道書在客廳」不是找不到的原因；(D) until「直到」表時間，語意不通。\n【例句】I wanted to go to the concert, but the tickets were sold out.", "explanationSource": "source"}, {"id": 82, "question": "Kevin studied hard for the test, ______ he still didn't pass it.", "options": ["so", "because", "but", "if"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 81 題）", "explanation": "「努力讀書」與「還是沒過」語意相反，用 but。", "explanationSource": "supplemental"}, {"id": 83, "question": "It was raining heavily, ______ we stayed at home and watched a movie.", "options": ["so", "but", "though", "until"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 81 題）", "explanation": "下雨是原因、待在家是結果，用 so「所以」。", "explanationSource": "supplemental"}, {"id": 84, "question": "Ivy is only ten years old, ______ she can speak three languages.", "options": ["because", "but", "so", "or"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 81 題）", "explanation": "「才十歲」與「會講三種語言」形成對比，用 but。", "explanationSource": "supplemental"}, {"id": 85, "question": "Elsa hates going shopping, ______ she went last night when her grandpa asked her to buy some medicine for him.", "options": ["because", "but", "if", "so"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜對等連接詞 but（語氣轉折）", "explanation": "【句型】S1 + V1, but + S2 + V2.（前後語意相反）\n【分析】前句「Elsa 討厭逛街購物」，後句「昨晚她還是去了（因為爺爺請她買藥）」，語意轉折，用 but。\n【其他選項】(A) because 表原因，「討厭購物」不是她去的原因；(C) if 表條件，與過去發生的事實不合；(D) so 表結果，「討厭購物所以去了」不合邏輯。\n【例句】Tom doesn't like vegetables, but he ate all the salad today.", "explanationSource": "source"}, {"id": 86, "question": "My brother is afraid of dogs, ______ he played with my neighbor's puppy yesterday.", "options": ["so", "because", "or", "but"], "answer": 3, "answerLabel": "D", "source": "類似題 1（對應第 85 題）", "explanation": "怕狗卻和小狗玩，語意相反用 but。", "explanationSource": "supplemental"}, {"id": 87, "question": "Mia was very tired, ______ she went to bed early.", "options": ["but", "so", "though", "or"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 85 題）", "explanation": "累是原因、早睡是結果，用 so。", "explanationSource": "supplemental"}, {"id": 88, "question": "Leo doesn't like math, ______ he got a perfect score on the math test.", "options": ["but", "so", "because", "and"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 85 題）", "explanation": "不喜歡數學卻考滿分，語意轉折用 but。", "explanationSource": "supplemental"}, {"id": 89, "question": "Enya got up early this morning ______ she did not want to be late for her trip.", "options": ["if", "but", "though", "because"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜從屬連接詞 because（表原因）", "explanation": "【句型】S1 + V1 + because + S2 + V2.（because 引導原因副詞子句）\n【分析】「早起」的原因是「不想旅行遲到」，後句說明原因，用 because「因為」。\n【其他選項】(A) if「如果」表條件，與已發生的事實不合；(B) but「但是」、(C) though「雖然」皆表轉折，前後語意並不相反。\n【例句】Ben stayed home because he had a bad cold.", "explanationSource": "source"}, {"id": 90, "question": "We took a taxi ______ we missed the last bus.", "options": ["because", "though", "until", "but"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 89 題）", "explanation": "錯過末班公車是搭計程車的原因，用 because。", "explanationSource": "supplemental"}, {"id": 91, "question": "______ it was cold outside, the kids still played in the park.", "options": ["Because", "If", "Though", "So"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 89 題）", "explanation": "天冷但孩子仍在外玩，語意讓步用 though。", "explanationSource": "supplemental"}, {"id": 92, "question": "Jenny turned on the light ______ the room was too dark to read in.", "options": ["but", "until", "though", "because"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 89 題）", "explanation": "房間太暗是開燈的原因，用 because。", "explanationSource": "supplemental"}, {"id": 93, "question": "Mr. Green was very angry with his daughter ______ she always put her dirty socks on the dining table.", "options": ["although", "because", "but", "until"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜從屬連接詞 because（表原因）", "explanation": "【句型】S1 + V1 + because + S2 + V2.（because 引導原因）\n【分析】Mr. Green 生氣的原因是女兒「總是把髒襪子放在餐桌上」，後句為原因，用 because。\n【其他選項】(A) although「雖然」、(C) but「但是」表讓步／轉折，前後並非相反；(D) until「直到」表時間，語意不通。\n【例句】The teacher was happy because all the students passed the test.", "explanationSource": "source"}, {"id": 94, "question": "Grandma was worried ______ Peter didn't come home after school.", "options": ["because", "although", "until", "or"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 93 題）", "explanation": "彼得沒回家是奶奶擔心的原因，用 because。", "explanationSource": "supplemental"}, {"id": 95, "question": "Please wait here ______ I come back.", "options": ["because", "though", "until", "so"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 93 題）", "explanation": "「在這裡等直到我回來」，用 until 表時間。", "explanationSource": "supplemental"}, {"id": 96, "question": "______ Lily practiced the piano every day, she didn't win the contest.", "options": ["Because", "Although", "If", "Until"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 93 題）", "explanation": "每天練琴卻沒贏，語意讓步用 although。", "explanationSource": "supplemental"}, {"id": 97, "question": "Still, the heavy price Munich paid does not worry the cities that are in the race to get the 2022 Winter Olympics. ___41___, they are happy that Munich said no to the Olympics—their chances of getting the Games have become higher.\n41. ______", "options": ["In fact", "If so", "However", "Finally"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜轉折語 In fact（事實上，補充並加強前句）", "explanation": "【句型】轉折語（副詞片語）In fact「事實上」：用來進一步補充、加強前句的說法\n【分析】前句說「慕尼黑付出的代價沒讓其他競爭城市擔心」，後句更進一步說「事實上它們很高興慕尼黑退出，因為獲選機會變高了」，屬於同方向的加強說明 → In fact。\n【其他選項】(B) If so「如果是這樣」表條件，前句不是假設；(C) However「然而」表轉折，但前後語意同方向，不相反；(D) Finally「最後」表順序，不合文意。\n【例句】Kevin isn't lazy. In fact, he works harder than anyone in our class.", "explanationSource": "source"}, {"id": 98, "question": "Jenny doesn't hate vegetables. ______, she eats a big salad every day.", "options": ["However", "In fact", "If so", "Finally"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 97 題）", "explanation": "「不討厭蔬菜」→「事實上每天吃沙拉」，同方向加強用 In fact。", "explanationSource": "supplemental"}, {"id": 99, "question": "Leo practiced very hard. ______, he didn't win the race.", "options": ["However", "In fact", "For example", "Besides"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 97 題）", "explanation": "努力練習卻沒贏，語意相反用 However。", "explanationSource": "supplemental"}, {"id": 100, "question": "Are you going to the night market? ______, can you buy me some stinky tofu?", "options": ["However", "Finally", "If so", "In fact"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 97 題）", "explanation": "「如果你要去的話」用 If so。", "explanationSource": "supplemental"}, {"id": 101, "question": "______ you ______ your brother can go out before you finish tidying your bedrooms. So, you'd better do it right now.", "options": ["Both; and", "Either; or", "Neither; nor", "No only; but also"], "answer": 2, "answerLabel": "C", "source": "講義錯題｜Neither A nor B（兩者皆不）", "explanation": "【句型】Neither A nor B（A 和 B 都不）；Both A and B（兩者都）；Either A or B（兩者之一）\n【分析】before you finish tidying 和後句 you'd better do it right now 表示整理完前「兩人都不能」出去 → Neither … nor。\n【其他選項】(A) 兩人都可以出去，與後句矛盾；(B) 其中一人可出去，語意不合；(D) 應為 Not only，且語意也不合。\n【例句】Neither Tom nor I like spicy food.\n備註：講義 p.317；選項 (D) 原書拼為 No only，應為 Not only，照原文保留。", "explanationSource": "source"}, {"id": 102, "question": "______ Jenny ______ Mark was at home, so I left a note on the door.", "options": ["Both; and", "Neither; nor", "Not only; but also", "Either; or"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 101 題）", "explanation": "沒人在家才留紙條，用 Neither…nor。", "explanationSource": "supplemental"}, {"id": 103, "question": "You can have ______ juice ______ milk, but not both.", "options": ["either; or", "neither; nor", "both; and", "not only; but also"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 101 題）", "explanation": "but not both 表二選一，用 either…or。", "explanationSource": "supplemental"}, {"id": 104, "question": "______ my mom ______ my dad came to my graduation. I was so happy to see them both.", "options": ["Either; or", "Neither; nor", "Both; and", "Not; but"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 101 題）", "explanation": "see them both 表兩人都來，用 Both…and。", "explanationSource": "supplemental"}]};</script><script src="longteng-b1u5-quiz.js?v=20261106-3"></script><script>document.querySelector("#description").textContent="共 104 題（會考歷屆＋講義錯題 26 題＋類似題 78 題）｜選答後顯示中文解析｜答錯可重做並下載錯題";</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
