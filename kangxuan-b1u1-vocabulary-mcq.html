isters.", "exp": "這是一張我「家人」的照片。他們是我的爸爸、媽媽，以及妹妹們。", "options": ["parent", "family", "farmer", "child"], "answer": 1}, {"id": 7, "question": "Harry and I are a couple（夫妻）. I am Harry’s ______.", "exp": "由「Harry 和我是一對夫妻」，可推知說話者是 Harry 的「妻子」。", "options": ["son", "wife", "daughter", "aunt"], "answer": 1}, {"id": 8, "question": "My brother and I are both（兩者）14 years old. We are ______ high school students.", "exp": "十四歲為「國中」生。", "options": ["pet", "junior", "child", "senior"], "answer": 1}, {"id": 9, "question": "A：Who’s that girl?\nB：She is my aunt’s ______, Emma. She is my cousin.", "exp": "表╱堂姐妹是阿姨╱舅媽╱嬸嬸的「女兒」。", "options": ["son", "mother", "sister", "daughter"], "answer": 3}, {"id": 10, "question": "A：Who is that ______?\nB：He is my brother, Tim.", "exp": "由答句「我哥哥，Tim」，可推知問句主詞是男性，選 son 不符語意，故選 man。", "options": ["aunt", "woman", "son", "man"], "answer": 3}, {"id": 11, "question": "A：The steak（牛排）is great. Are you a ______?\nB：No, I’m not. But（但是）thanks.", "exp": "由 A 稱讚牛排、B 道謝，可知 A 詢問 B 是否為「廚師」。", "options": ["doctor", "cook", "nurse", "teacher"], "answer": 1}, {"id": 12, "question": "Frank’s brother isn’t a doctor. He is a ______.", "exp": "前句說「不是醫生」，可推知後句說明 Frank 的哥哥的職業，選項中只有「護理師」符合。", "options": ["man", "wife", "nurse", "family"], "answer": 2}, {"id": 13, "question": "This cat is ______ small. How old is it?", "exp": "這隻貓「真地」體型小。牠幾歲了？", "options": ["no", "really", "again", "too"], "answer": 1}, {"id": 14, "question": "Henry and Peggy are ______ and wife. That boy is their（他們的）son.", "exp": "由「那個男孩是他們的兒子」，可知 Henry跟 Peggy是「夫」妻。", "options": ["brother", "daughter", "son", "husband"], "answer": 3}, {"id": 15, "question": "A：Look at this poster（海報）! I know（認識）these two people.\nB：Who are they?\nA：This man is my uncle, and this is his daughter.\nB：Wow. Your ______ is beautiful.", "exp": "由「這男人是我的叔叔／舅舅，這是他的女兒。」，可推知 B 說 A 的「表╱堂姐妹」很漂亮。", "options": ["mother", "aunt", "sister", "cousin"], "answer": 3}, {"id": 16, "question": "My mom is feeding（餵食）our cat ______. She feeds（餵食）it twice（兩次）a day.", "exp": "我媽媽正「再次」餵食我們的貓。她一天餵食牠兩次。", "options": ["too", "really", "again", "not"], "answer": 2}, {"id": 17, "question": "A：Is that ______ our new PE teacher?\nB：Yes, his name is Albert.", "exp": "A：那位「男子」是我們的新體育老師嗎？ B：是的，他的名字叫 Albert。", "options": ["wife", "aunt", "pet", "man"], "answer": 3}, {"id": 18, "question": "Is this pig your pet? It’s small and ______. I like it.", "exp": "用來形容寵物豬的形容詞，選項中只有 cute（可愛的）最符合文意。", "options": ["sorry", "cute", "sad", "cold"], "answer": 1}, {"id": 19, "question": "Hello, Mrs. Hulk. My name is Jack. I am Ken’s classmate（同班同學）. Nice to ______ you.", "exp": "Nice to meet you. 為習慣用法，用於第一次見面時，表示「很高興認識你。」。", "options": ["thank", "see", "meet", "walk"], "answer": 2}, {"id": 20, "question": "I have a PE ______ this morning. I can（可以）play basketball（籃球）.", "exp": "我今天早上有一堂體育「課」。我可以打籃球。", "options": ["classroom", "problem", "news", "class"], "answer": 3}, {"id": 21, "question": "His father is a ______. He grows（種植）oranges, bananas, and apples.", "exp": "他的父親是一位「農夫」。他種植柳橙、香蕉和蘋果。", "options": ["doctor", "farmer", "nurse", "cook"], "answer": 1}, {"id": 22, "question": "Bella is my sister, and Sean is my brother. They are my ______.", "exp": "由前句「Bella 是我妹妹，Sean 是我哥哥」，可推知他們是我的「家人」。", "options": ["daughters", "sons", "farmers", "family"], "answer": 3}, {"id": 23, "question": "Judy’s father and Tommy are brothers. Tommy is Judy’s ______.", "exp": "由「Judy 的爸爸和 Tommy 是兄弟」，可推知是 Tommy 是 Judy 的「叔叔／伯父」。", "options": ["uncle", "husband", "brother", "aunt"], "answer": 0}, {"id": 24, "question": "Emily is my mom’s sister. She’s my ______.", "exp": "由「我媽媽的姐妹」，可知 Emily 是說話者的「阿姨」。", "options": ["mother", "aunt", "uncle", "cousin"], "answer": 1}, {"id": 25, "question": "Matt and Amy love their ______ very much. In their eyes, he is the cutest kid（最可愛的孩子）in the world（世界）.", "exp": "Matt 和 Amy 非常愛他們的「兒子」。在他們的眼中，他是世界上最可愛的孩子。", "options": ["son", "daughter", "pet", "husband"], "answer": 0}, {"id": 26, "question": "Nina is nice to everyone（每個人）. She is a(n) ______ person.", "exp": "Nina 對每個人都很好。她是個「溫暖的」人。", "options": ["welcome", "cold", "warm", "old"], "answer": 2}, {"id": 27, "question": "Jenny is a ______ person. No wonder everyone likes her.", "exp": "由後句難怪每個人都喜歡她，可推知前句為 Jenny 是個「溫暖的」人。", "options": ["handsome", "strict", "warm", "handsome"], "answer": 2}, {"id": 28, "question": "Look at the picture. The boy’s ______ is a puppy. They look so happy together.", "exp": "由圖可知，男孩的「寵物」是一隻小狗。", "img": "p28", "options": ["man", "pet", "cousin", "news"], "answer": 1}, {"id": 29, "question": "Mr. and Mrs. Chou have two sons and a daughter. They have three ______.", "exp": "周先生跟周太太有兩個兒子跟一個女兒。他們有三個「孩子」。", "options": ["children", "men", "women", "parents"], "answer": 0}, {"id": 30, "question": "A：Is Kelly’s ______ cute?\nB：Yes, it is. Liz is a cute cat.", "exp": "由 B 回覆「是的，牠是。Liz 是很可愛的貓。」，可推知 A 詢問 Kelly 的「寵物」可愛嗎？", "options": ["father", "cook", "pet", "doctor"], "answer": 2}, {"id": 31, "question": "Mrs. Li is ______ with（對）her students, but they all（全部都）love（喜愛）her.", "exp": "李老師對她的學生很「嚴格」，但是他們全部都很喜愛她。", "options": ["strict", "beautiful", "young", "same"], "answer": 0}, {"id": 32, "question": "Michelle：What’s wrong?（怎麼了？）\nAndrew：I have a math ______.\nMichelle：That’s OK. I can help（可以幫助）you.", "exp": "Michelle：怎麼了？Andrew：我有一個數學「問題」。Michelle：沒關係。我可以幫助你。", "options": ["problem", "classroom", "pet", "news"], "answer": 0}, {"id": 33, "question": "A：Wow! The picture（畫）is ______.\nB：Thank you. That’s my son’s work（作品）.", "exp": "由 B 回答「謝謝你。那是我兒子的作品。」，可推知 A 稱讚這幅畫很「美」。", "options": ["beautiful", "thin", "young", "sorry"], "answer": 0}, {"id": 34, "question": "Ella is ten years old. She is a girl, not a ______.", "exp": "由 Ella 只有十歲可知，她是個女孩，不是「女人」。", "options": ["husband", "woman", "son", "daughter"], "answer": 1}, {"id": 35, "question": "Matt and Amy love their ______ very much. In their eyes, he is the cutest kid in the world.", "exp": "由後句主詞 he 可知為男性，且為第三人稱單數，應選「兒子」。", "options": ["son", "daughter", "girl", "boys"], "answer": 0}, {"id": 36, "question": "A：That singer（歌手）is just（只）12 years old.\nB：Wow! She is ______.", "exp": "由「只有十二歲」，可推知回答她很「年輕」。", "options": ["young", "old", "short", "sad"], "answer": 0}, {"id": 37, "question": "You are the ______ age（年齡）as（和……一樣）my brother. You are both（兩者都）17 years old.", "exp": "你和我哥哥「同」齡。你們兩個都是 17 歲。", "options": ["young", "fine", "right", "same"], "answer": 3}, {"id": 38, "question": "George is a(n) ______ teacher. He teaches（教）basketball（籃球）at my school.", "exp": "由 George 在學校敎籃球，可推知他是一位「體育」老師。", "options": ["math", "PE", "English", "pet"], "answer": 1}, {"id": 39, "question": "A：Is your brother old?\nB：No, he isn’t. He’s ______.", "exp": "由 B 回答 No，可知為否定，old（老的）的相反詞為 young（年輕的）。", "options": ["heavy", "short", "thin", "young"], "answer": 3}, {"id": 40, "question": "That man is Mary’s friend. He is ______, and many（許多的）women like him.", "exp": "那名男子是 Mary 的朋友。他很「英俊」，而且許多女性喜歡他。", "options": ["handsome", "sorry", "same", "strict"], "answer": 0}, {"id": 41, "question": "This is a photo of my ______. They are my mom, my dad, and my sisters.", "exp": "由後句都是家庭成員可知，應選「家人」。", "options": ["problem", "family", "woman", "pet"], "answer": 1}, {"id": 42, "question": "A：My brother and his ______ are coming home for vacation.\nB：That’s great! Will they bring Jayden back?\nA：Of course. I really miss my nephew（姪兒）too.", "exp": "由我弟弟、姪兒可推知會回來度假的還有弟弟的「妻子」。", "options": ["son", "daughter", "wife", "cousin"], "answer": 2}, {"id": 43, "question": "Ben：Our cousins will visit（將會拜訪）us from Kaohsiung.\nGinger：It’s great ______.", "exp": "Ben：我們的堂哥們將會從高雄來拜訪我們。 Ginger：這真是個很棒的「消息」。", "options": ["family", "news", "problem", "pet"], "answer": 1}, {"id": 44, "question": "A：Is your daughter a ______ high school student?\nB：No, she’s only（只有）thirteen years old.", "exp": "由 B 回覆「不，她只有十三歲。」，可推知 A 問 B 的女兒是不是「高中」生。", "options": ["junior", "thin", "senior", "young"], "answer": 2}, {"id": 45, "question": "A：Wow! Your kitchen（廚房）is ______ and big. I like it.\nB：Thanks. I like it, too.", "exp": "由 A 驚嘆「哇！」，可推知是稱讚 B 的廚房又「漂亮」又大。", "options": ["young", "sorry", "beautiful", "welcome"], "answer": 2}, {"id": 46, "question": "Dave is Wendy and Tommy’s only（唯一的）______. They don’t have a mother.", "exp": "由後句「他們沒有母親。」，可推知 Dave 是 Wendy 跟 Tommy 唯一的「父親；家長」。", "options": ["parent", "aunt", "child", "daughter"], "answer": 0}, {"id": 47, "question": "Kenny takes good care of（照顧）his pet. To him, his pet is his ______.", "exp": "由前句「Kenny 妥善照顧他的寵物。」可知，對他而言，他的寵物是他的「家人」。", "options": ["name", "family", "class", "number"], "answer": 1}, {"id": 48, "question": "Grandma is ______. Her friends like to be with（跟……一起）her.", "exp": "由後句「她的朋友們喜歡跟她在一起。」，可知奶奶人很「好」。", "options": ["sorry", "nice", "junior", "sad"], "answer": 1}];

const $ = s => document.querySelector(s), list = $('#list'), select = $('#select'), quiz = $('#quiz'), result = $('#result'),
  question = $('#question'), answerArea = $('#answerArea'), feedback = $('#feedback'), explain = $('#explain'), next = $('#next');
let chosen = [], idx = 0;
const wrong = new Map(), correct = new Set();
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm = s => String(s).trim().toLowerCase().replace(/[’‘`]/g, "'").replace(/\s+/g, ' ');
const plain = s => String(s).replace(/<\/?u>/g, '');

/* sentence answers: contractions count as the full form; case and punctuation are checked separately */
const CONTRACTIONS = [[/\b(is|are|was|were|do|does|did|has|have|had)n't\b/gi, '$1 not'], [/\bcan't\b/gi, 'cannot'],
  [/\b(he|she|it|that|what|who|where|how|there|here)'s\b/gi, '$1 is'], [/\bi'm\b/gi, 'I am'], [/\b(you|we|they)'re\b/gi, '$1 are']];
function expand(s) { s = String(s).replace(/[’‘`]/g, "'").replace(/\s+/g, ' ').replace(/\s+([.,?!])/g, '$1').trim(); CONTRACTIONS.forEach(([r, t]) => s = s.replace(r, t)); return s; }
const loose = s => expand(s).toLowerCase().replace(/[.,?!;:]/g, '').replace(/\s+/g, ' ').trim();
function judgeSentence(q, value) {
  const strict = expand(value);
  if (q.answers.some(a => expand(a) === strict)) return 'ok';
  if (q.answers.some(a => loose(a) === loose(value))) return 'form';
  return 'bad';
}

function renderList() { list.innerHTML = Q.map(q => '<label class="pick"><input class="pickbox" type="checkbox" value="' + q.id + '" checked><b>第 ' + q.id + ' 題</b></label>').join(''); }
$('#all').onclick = () => document.querySelectorAll('.pickbox').forEach(x => x.checked = true);
$('#none').onclick = () => document.querySelectorAll('.pickbox').forEach(x => x.checked = false);
$('#start').onclick = () => {
  const ids = [...document.querySelectorAll('.pickbox:checked')].map(x => +x.value);
  if (!ids.length) return alert('請至少選一題。');
  chosen = Q.filter(q => ids.includes(q.id)); idx = 0; wrong.clear(); correct.clear();
  select.classList.add('hidden'); result.classList.add('hidden'); quiz.classList.remove('hidden'); show();
};
function show() {
  const q = chosen[idx];
  $('#meta').textContent = '第 ' + (idx + 1) + ' / ' + chosen.length + ' 題';
  $('#wrongCount').textContent = '曾答錯 ' + wrong.size + ' 題';
  $('#bar').style.width = (idx + 1) / chosen.length * 100 + '%';
  // question text is escaped; only <u> (underlined part of the prompt) is let through
  question.innerHTML = esc(q.question).replace(/&lt;u&gt;/g, '<u>').replace(/&lt;\/u&gt;/g, '</u>') + (q.img ? '<img alt="題目圖片" src="' + IMG[q.img] + '">' : '');
  const zh = $('#zh'); if (q.zh) { zh.textContent = q.zh; zh.classList.remove('hidden'); } else zh.classList.add('hidden');
  feedback.className = 'feedback hidden'; explain.classList.add('hidden');
  $('#check').classList.remove('hidden'); next.classList.add('hidden');
  if (MODE === 'mcq') answerArea.innerHTML = '<div class="options">' + q.options.map((o, i) => '<label class="option"><input type="radio" name="answer" value="' + i + '"><b>' + String.fromCharCode(65 + i) + '.</b> ' + esc(o) + '</label>').join('') + '</div>';
  else answerArea.innerHTML = '<div class="inputs"><div class="answer-row"><label>答案</label><input class="spell" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="' + (MODE === 'sentence' ? '請輸入完整句子（注意大小寫與標點）' : '請輸入完整單字') + '"></div></div>';
  setTimeout(() => answerArea.querySelector('input')?.focus(), 0);
}
function correctText(q) { return MODE === 'mcq' ? String.fromCharCode(65 + q.answer) + '. ' + q.options[q.answer] : MODE === 'sentence' ? q.show : q.answers.join(' / '); }
function showExplain(q) { if (!q.exp) return; explain.innerHTML = '<b>詳解</b>' + esc(q.exp); explain.classList.remove('hidden'); }
function check() {
  const q = chosen[idx];
  let given, ok, formNote = false;
  if (MODE === 'mcq') {
    const x = answerArea.querySelector('input:checked'); if (!x) return alert('請完成所有答案。');
    given = String.fromCharCode(65 + (+x.value)); ok = +x.value === q.answer;
  } else {
    given = answerArea.querySelector('.spell').value; if (!given.trim()) return alert('請完成所有答案。');
    if (MODE === 'sentence') { const j = judgeSentence(q, given); ok = j !== 'bad'; formNote = j === 'form'; }
    else ok = q.answers.some(a => norm(a) === norm(given));
  }
  if (ok) {
    correct.add(q.id); feedback.className = 'feedback ok';
    if (formNote) feedback.innerHTML = '✅ 句子正確！但請注意<strong>大小寫與標點</strong>，標準寫法：<strong>' + esc(q.show) + '</strong>';
    else feedback.textContent = '✅ 全部正確！';
    showExplain(q);
    $('#check').classList.add('hidden'); next.classList.remove('hidden'); next.focus();
  } else {
    if (!wrong.has(q.id)) wrong.set(q.id, { q, attempts: [] });
    wrong.get(q.id).attempts.push(given);
    $('#wrongCount').textContent = '曾答錯 ' + wrong.size + ' 題';
    feedback.className = 'feedback bad';
    feedback.innerHTML = '❌ 答案不正確。正確答案：<strong>' + esc(correctText(q)) + '</strong><br>請重新作答。';
    showExplain(q);
    if (MODE === 'mcq') answerArea.querySelectorAll('input').forEach(x => x.checked = false); else answerArea.querySelector('.spell').value = '';
    answerArea.querySelector('input')?.focus();
  }
}
$('#check').onclick = check;
answerArea.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList.contains('spell')) { e.preventDefault(); check(); } });
next.onclick = () => { idx++; idx >= chosen.length ? finish() : show(); };
$('#finish').onclick = finish;
function finish() {
  quiz.classList.add('hidden'); result.classList.remove('hidden');
  $('#summary').innerHTML = '<div class="stat">選擇題數<b>' + chosen.length + '</b></div><div class="stat">完成答對<b>' + correct.size + '</b></div><div class="stat">曾答錯<b>' + wrong.size + '</b></div>';
  $('#wrongList').innerHTML = wrong.size ? [...wrong.values()].map((r, i) => '<div class="wrong"><b>' + (i + 1) + '. 第 ' + r.q.id + ' 題</b><p>' + esc(plain(r.q.question)) + '</p><p><strong>錯誤答案：</strong>' + r.attempts.map(esc).join('；') + '</p><p><strong>正確答案：</strong>' + esc(correctText(r.q)) + '</p>' + (r.q.exp ? '<p><strong>詳解：</strong>' + esc(r.q.exp) + '</p>' : '') + '</div>').join('') : '<div class="feedback ok">🎉 目前沒有錯題紀錄。</div>';
  $('#download').classList.toggle('hidden', !wrong.size);
}
$('#restart').onclick = () => { result.classList.add('hidden'); select.classList.remove('hidden'); };
$('#download').onclick = async () => {
  if (!wrong.size) return;
  const rows = [...wrong.values()], name = TITLE + '_錯題_' + new Date().toISOString().slice(0, 10);
  const save = (blob, ext) => { const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = name + ext; a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000); };
  try {
    const { Document, Packer, Paragraph, TextRun, HeadingLevel } = await import('https://esm.sh/docx@9.5.1');
    const line = (label, text) => new Paragraph({ children: [new TextRun({ text: label, bold: true }), new TextRun({ text })] });
    const children = [new Paragraph({ heading: HeadingLevel.TITLE, children: [new TextRun({ text: TITLE + ' 錯題紀錄', bold: true })] })];
    rows.forEach((r, i) => {
      children.push(new Paragraph({ heading: HeadingLevel.HEADING_2, children: [new TextRun({ text: (i + 1) + '. 第 ' + r.q.id + ' 題', bold: true })] }));
      plain(r.q.question).split('\n').forEach(t => children.push(new Paragraph({ children: [new TextRun({ text: t })] })));
      if (MODE === 'mcq') children.push(new Paragraph({ children: [new TextRun({ text: r.q.options.map((o, k) => '(' + String.fromCharCode(65 + k) + ') ' + o).join('　') })] }));
      children.push(line('錯誤答案：', r.attempts.join('；')), line('正確答案：', correctText(r.q)));
      if (r.q.exp) children.push(line('詳解：', r.q.exp));
    });
    save(await Packer.toBlob(new Document({ sections: [{ children }] })), '.docx');
  } catch (e) {   // offline or CDN blocked
    const txt = rows.map((r, i) => (i + 1) + '. 第 ' + r.q.id + ' 題\n' + plain(r.q.question) + '\n錯誤答案：' + r.attempts.join('；') + '\n正確答案：' + correctText(r.q) + (r.q.exp ? '\n詳解：' + r.q.exp : '') + '\n').join('\n');
    save(new Blob([TITLE + ' 錯題紀錄\n\n' + txt], { type: 'text/plain;charset=utf-8' }), '.txt');
  }
};
renderList();
</script></body></html>
