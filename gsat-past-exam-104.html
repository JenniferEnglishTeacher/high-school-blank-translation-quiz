arture"], "answer": 3, "answerLabel": "D", "source": "104 學測｜詞彙｜第 5 題", "explanation": "機場關閉，飛往巴黎的「出發」延到隔天：departure。movement 移動、registration 登記、tendency 傾向。", "explanationSource": "own", "section": "詞彙"}, {"id": 6, "question": "第 6 題　The moment the students felt the earthquake, they ran ______ out of the classroom to an open area outside.", "options": ["swiftly", "nearly", "loosely", "formally"], "answer": 0, "answerLabel": "A", "source": "104 學測｜詞彙｜第 6 題", "explanation": "感覺到地震就「迅速」跑出教室：swiftly。nearly 幾乎、loosely 鬆散地、formally 正式地。", "explanationSource": "own", "section": "詞彙"}, {"id": 7, "question": "第 7 題　The ______ capacity of this elevator is 400 kilograms. For safety reasons, it shouldn’t be overloaded.", "options": ["delicate", "automatic", "essential", "maximum"], "answer": 3, "answerLabel": "D", "source": "104 學測｜詞彙｜第 7 題", "explanation": "電梯「最大」載重 400 公斤，不可超載：maximum capacity。delicate 精細的、automatic 自動的、essential 必要的。", "explanationSource": "own", "section": "詞彙"}, {"id": 8, "question": "第 8 題　An open display of ______ behavior between men and women, such as hugging and kissing, is not allowed in some conservative societies.", "options": ["intimate", "ashamed", "earnest", "urgent"], "answer": 0, "answerLabel": "A", "source": "104 學測｜詞彙｜第 8 題", "explanation": "擁抱、親吻等「親密」行為在保守社會不被允許公開：intimate。ashamed 羞愧的、earnest 認真的、urgent 緊急的。", "explanationSource": "own", "section": "詞彙"}, {"id": 9, "question": "第 9 題　When taking medicine, we should read the instructions on the ______ carefully because they provide important information such as how and when to take it.", "options": ["medals", "quotes", "labels", "recipes"], "answer": 2, "answerLabel": "C", "source": "104 學測｜詞彙｜第 9 題", "explanation": "吃藥前要仔細閱讀「標籤」上的說明：labels。medal 獎牌、quote 引言、recipe 食譜。", "explanationSource": "own", "section": "詞彙"}, {"id": 10, "question": "第 10 題　The angry passengers argued ______ with the airline staff because their flight was cancelled without any reason.", "options": ["evidently", "furio
