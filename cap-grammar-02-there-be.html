<script>window.QUIZ_CONFIG={"title": "國中會考文法歷屆試題｜There be／代名詞 it, they", "mode": "mcq", "questions": [{"id": 1, "question": "Chris loves walking with Anna on snowy days, but Anna hates ______ very much.", "options": ["them", "so", "one", "it"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜代名詞 it 代替前述整件事", "explanation": "【句型】代名詞 it 可代替前面提到的一件事或動名詞片語。\n【分析】Anna 討厭的是「在下雪天和 Chris 散步」這件事，用單數代名詞 it 代替 walking with… on snowy days。\n【其他選項】(A) them 指複數名詞（如 snowy days），語意不合；(B) so 不能當 hate 的受詞；(C) one 代替同類的單數可數名詞，不能指一件事。\n【例句】My brother likes getting up early, but I hate it.", "explanationSource": "source"}, {"id": 2, "question": "Jenny enjoys swimming in the sea, but her mom thinks ______ is dangerous.", "options": ["one", "it", "they", "them"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 1 題）", "explanation": "it 代替 swimming in the sea 這件事。", "explanationSource": "supplemental"}, {"id": 3, "question": "I lost my umbrella yesterday, so I need to buy a new ______.", "options": ["it", "them", "one", "that"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 1 題）", "explanation": "one 代替同類但不同的一把傘。", "explanationSource": "supplemental"}, {"id": 4, "question": "Tim bought three books and put ______ on his desk.", "options": ["them", "it", "one", "they"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 1 題）", "explanation": "them 代替複數名詞 three books，作受詞。", "explanationSource": "supplemental"}, {"id": 5, "question": "There ______ more than twenty clubs in our school. Which one would you like to join?", "options": ["has", "have", "is", "are"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜There are＋複數名詞", "explanation": "【句型】There is ＋ 單數N / There are ＋ 複數N，表「（某處）有…」。\n【分析】後面名詞 more than twenty clubs 是複數，表示「學校裡有二十多個社團」，用 There are。\n【其他選項】(A)(B) There 後不接 has/have；(C) is 用於單數名詞。\n【例句】There are thirty students in my class.", "explanationSource": "source"}, {"id": 6, "question": "There ______ a cat and two dogs in the yard.", "options": ["is", "are", "has", "have"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 5 題）", "explanation": "There be 動詞看最靠近的名詞 a cat（單數），用 is。", "explanationSource": "supplemental"}, {"id": 7, "question": "There ______ some milk in the fridge. You can drink it.", "options": ["are", "have", "is", "has"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 5 題）", "explanation": "milk 不可數，用 is。", "explanationSource": "supplemental"}, {"id": 8, "question": "How many people ______ in your family?", "options": ["is there", "have there", "has there", "are there"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 5 題）", "explanation": "How many＋複數名詞，問句用 are there。", "explanationSource": "supplemental"}, {"id": 9, "question": "______ will be a welcome party next week for the new students. Will you come with me?", "options": ["It", "There", "They", "We"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜There will be 表未來存在", "explanation": "【句型】There will be + N 表「將會有…」。\n【分析】句意「下週將會有一場歡迎新生的派對」，表示某事物「存在／舉行」，用 There will be a welcome party。\n【其他選項】(A) It will be 需有前面提過的指代對象，這裡沒有；(C) They 無指代對象且 party 為單數；(D) We will be a party 語意不通。\n【例句】There will be a school concert this Friday.", "explanationSource": "source"}, {"id": 10, "question": "______ will be a typhoon tomorrow, so the school will be closed.", "options": ["It", "They", "There", "This"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 9 題）", "explanation": "表「明天將會有颱風」的存在句，用 There will be。", "explanationSource": "supplemental"}, {"id": 11, "question": "Look at the poster. There ______ a book fair at the city library next month.", "options": ["will be", "will have", "is going", "has"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 9 題）", "explanation": "There 句型只能接 be 動詞，next month 表未來，用 There will be。", "explanationSource": "supplemental"}, {"id": 12, "question": "Kevin: Will ______ any snacks at the meeting?\nAmy: Yes, Mr. Lin will bring some cookies.", "options": ["it be", "there be", "they have", "there have"], "answer": 1, "answerLabel": "B", "source": "類似題 3（對應第 9 題）", "explanation": "問「將會有點心嗎」用疑問句 Will there be + N?。", "explanationSource": "supplemental"}, {"id": 13, "question": "(In the teachers' office)\nMiss Huang: Sue, ______ students in the classroom?\nMiss Cheng: I don't think so. School's over.\nMiss Huang: But I hear people talking over there.", "options": ["are they", "do they", "is there", "are there"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜Are there + 複數名詞（疑問句）", "explanation": "【句型】Are there + 複數N + 地點? 問「某地有沒有…」。\n【分析】問「教室裡還有學生嗎」是問存在，students 為複數，用 are there。\n【其他選項】(A) are they students 意為「他們是學生嗎」，they 無指代；(B) do they 後缺動詞；(C) is there 後接單數名詞。\n【例句】Are there any eggs in the fridge?", "explanationSource": "source"}, {"id": 14, "question": "Mom: ______ any milk in the bottle?\nTim: No, I drank it all this morning.", "options": ["Is there", "Are there", "Does it", "Is it"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 13 題）", "explanation": "milk 是不可數名詞，問「有沒有牛奶」用 Is there。", "explanationSource": "supplemental"}, {"id": 15, "question": "Ben: ______ many people at the night market last night?\nLisa: Yes, it was very crowded.", "options": ["Was there", "Were there", "Did they", "Were they"], "answer": 1, "answerLabel": "B", "source": "類似題 2（對應第 13 題）", "explanation": "last night 過去 + people 複數，用 Were there。", "explanationSource": "supplemental"}, {"id": 16, "question": "Student: Excuse me, are there any free seats on this bus?\nDriver: Sorry, ______. You'll have to stand.", "options": ["there aren't", "they aren't", "it isn't", "there isn't"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 13 題）", "explanation": "對 Are there…? 的否定簡答為 No, there aren't。", "explanationSource": "supplemental"}, {"id": 17, "question": "Paul: What did you find under his desk?\nTom: Oh, ______ all kinds of things: a basketball, pencils, a hat, and fries!", "options": ["there were", "it was", "it had", "there was"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜There were + 複數名詞（過去存在）", "explanation": "【句型】There were + 複數N 表「過去有…」。\n【分析】問句 did you find 為過去式；「桌子底下有各種東西」表存在，all kinds of things 為複數，用 there were。\n【其他選項】(B) it was 指單一事物，不合；(C) it had 無指代對象，「有」不用 have 表存在；(D) there was 後接單數。\n【例句】There were many birds in the tree yesterday.", "explanationSource": "source"}, {"id": 18, "question": "When we got to the beach, ______ a lot of trash on the sand.", "options": ["it was", "there were", "there was", "they had"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 17 題）", "explanation": "trash 不可數，過去存在用 there was。", "explanationSource": "supplemental"}, {"id": 19, "question": "Ten years ago, ______ only two convenience stores in this small town.", "options": ["there were", "there was", "it had", "they were"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 17 題）", "explanation": "ten years ago 過去 + two stores 複數，用 there were。", "explanationSource": "supplemental"}, {"id": 20, "question": "Mia: How was the class party?\nJoe: Great! ______ pizza, cake, and games for everyone.", "options": ["It had", "They were", "There was", "There has"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 17 題）", "explanation": "There be 依最靠近的名詞 pizza（單數/不可數）決定，過去用 there was。", "explanationSource": "supplemental"}, {"id": 21, "question": "Jack: There is going to ______ a dance show on Saturday. Would you like to go with me?\nNina: Sure. I can't wait for it.", "options": ["be", "do", "get", "have"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜There is going to be", "explanation": "【句型】There is going to be + N 表「將會有…」。\n【分析】be going to 後接原形動詞；There 句型的動詞只能是 be，所以填 be。\n【其他選項】(B) do、(C) get、(D) have 都不能與 There 句型搭配表存在。\n【例句】There is going to be a test tomorrow.", "explanationSource": "source"}, {"id": 22, "question": "The weatherman says there is going to ______ heavy rain this afternoon.", "options": ["have", "be", "come", "get"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 21 題）", "explanation": "There is going to be 為固定句型，表「將會有」。", "explanationSource": "supplemental"}, {"id": 23, "question": "______ going to be a basketball game between Class 801 and Class 802 tomorrow.", "options": ["It is", "They are", "There are", "There is"], "answer": 3, "answerLabel": "D", "source": "類似題 2（對應第 21 題）", "explanation": "a basketball game 單數，用 There is going to be。", "explanationSource": "supplemental"}, {"id": 24, "question": "Sam: Is there going to ______ a field trip next week?\nTeacher: Yes, we're going to the science museum.", "options": ["have", "has", "be", "being"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 21 題）", "explanation": "疑問句 Is there going to be + N?，going to 後接原形 be。", "explanationSource": "supplemental"}, {"id": 25, "question": "Grace: How many pencils ______ in your pencil box?\nAllen: Only one.", "options": ["are there", "are they", "is there", "is it"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜How many + 複數N + are there", "explanation": "【句型】How many + 複數N + are there + 地點? 問「某處有多少…」。\n【分析】How many pencils 為複數，問「鉛筆盒裡有幾枝鉛筆」用 are there；即使回答只有一枝，問句仍用複數。\n【其他選項】(B) are they 表「它們是…」，不是問存在；(C) is there 搭配單數；(D) is it 不合句型。\n【例句】How many students are there in your class?", "explanationSource": "source"}, {"id": 26, "question": "Amy: How many chairs ______ in the meeting room?\nBob: Twenty, I think.", "options": ["is there", "are there", "are they", "do they"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 25 題）", "explanation": "How many chairs 複數，用 are there。", "explanationSource": "supplemental"}, {"id": 27, "question": "How much water ______ in the bottle? I want to drink some.", "options": ["is there", "are there", "is it", "are they"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 25 題）", "explanation": "How much + 不可數名詞 water，用 is there。", "explanationSource": "supplemental"}, {"id": 28, "question": "Teacher: How many students ______ in the library when the bell rang?\nJason: About ten.", "options": ["are there", "is there", "was there", "were there"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 25 題）", "explanation": "when the bell rang 過去 + students 複數，用 were there。", "explanationSource": "supplemental"}, {"id": 29, "question": "Jenny's bag is very heavy because ______ filled with toy cars.", "options": ["it is", "they are", "there is", "there are"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜代名詞 it 指單數名詞 + be filled with", "explanation": "【句型】S + be filled with + N 表「裝滿…」；代名詞 it 指前面提過的單數名詞。\n【分析】被裝滿的是 Jenny's bag（單數），用 it 代替，it is filled with toy cars。\n【其他選項】(B) they 指複數，但 bag 為單數；(C)(D) there is/are 表存在，後面要接名詞，不能直接接 filled with。\n【例句】This box is light because it is empty.", "explanationSource": "source"}, {"id": 30, "question": "I can't drink this soup because ______ too hot.", "options": ["they are", "it is", "there is", "this has"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 29 題）", "explanation": "it 代替前面單數名詞 this soup。", "explanationSource": "supplemental"}, {"id": 31, "question": "Mark bought two new shirts, but ______ too small for him.", "options": ["it is", "there are", "they are", "there is"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 29 題）", "explanation": "they 代替前面複數名詞 two new shirts。", "explanationSource": "supplemental"}, {"id": 32, "question": "Don't open the window. ______ very cold outside today.", "options": ["It's", "There's", "They're", "This has"], "answer": 0, "answerLabel": "A", "source": "類似題 3（對應第 29 題）", "explanation": "談天氣溫度用 it 當主詞。", "explanationSource": "supplemental"}, {"id": 33, "question": "Grace: How many people ______ in the office when the fire happened?\nHarry: Five. Luckily, nobody got hurt.", "options": ["did they", "had they", "were there", "would there be"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜How many + N + were there（過去）", "explanation": "【句型】How many + 複數N + were there + 地點? 問「過去某處有多少…」。\n【分析】when the fire happened 為過去時間，people 為複數，問存在用 were there。\n【其他選項】(A) did they、(B) had they 後缺動詞且 they 無指代；(D) would there be 表假設或過去的未來，不合事實詢問。\n【例句】How many people were there at the concert last night?", "explanationSource": "source"}, {"id": 34, "question": "Reporter: How many cars ______ on the bridge when it broke yesterday?\nPolice: About twenty.", "options": ["were there", "are there", "did they", "was there"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 33 題）", "explanation": "yesterday 過去 + cars 複數，用 were there。", "explanationSource": "supplemental"}, {"id": 35, "question": "Dad: How many fish ______ in the river when you were a child?\nGrandpa: So many! The water was very clean then.", "options": ["are there", "have there", "were there", "did there"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 33 題）", "explanation": "when you were a child 過去，問存在用 were there。", "explanationSource": "supplemental"}, {"id": 36, "question": "Teacher: How many mistakes ______ in your test this time?\nKen: Only two. I did much better.", "options": ["there were", "were they", "did they have", "were there"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 33 題）", "explanation": "疑問句要倒裝成 were there；考試已考過，用過去式。", "explanationSource": "supplemental"}, {"id": 37, "question": "Doris: Why ______ so many things to do when I'm busy enough?\nFrank: That's because you don't know how to use your time well.", "options": ["does it have", "have", "are they", "are there"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜Why are there + 複數N（疑問句）", "explanation": "【句型】Why are there + 複數N…? 問「為什麼有這麼多…」。\n【分析】「為什麼有這麼多事要做」表存在，so many things 為複數，用 are there。\n【其他選項】(A) does it have 無指代對象；(B) have 前缺主詞；(C) are they 表「它們是…」，they 無指代。\n【例句】Why are there so many people in the park today?", "explanationSource": "source"}, {"id": 38, "question": "Why ______ so much noise outside? I can't fall asleep.", "options": ["are there", "is there", "does it", "is it"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 37 題）", "explanation": "noise 不可數，問存在用 is there。", "explanationSource": "supplemental"}, {"id": 39, "question": "Lily: Why ______ so many cars on the road this morning?\nTom: Because it's Monday.", "options": ["are there", "is there", "do they", "are they"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 37 題）", "explanation": "so many cars 複數，用 are there。", "explanationSource": "supplemental"}, {"id": 40, "question": "Why ______ no students in the classroom right now? Where did they go?", "options": ["is it", "there are", "are there", "do there"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 37 題）", "explanation": "疑問詞後接倒裝 are there + no + 複數N。", "explanationSource": "supplemental"}, {"id": 41, "question": "Somewhere along the road, ______ a shop which sells things from foreign countries.", "options": ["that is", "it is", "it has", "there is"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜There is + 單數N + 地點", "explanation": "【句型】(地點), there is + 單數N 表「某處有…」。\n【分析】「這條路上某處有一家賣外國商品的店」表存在，a shop 為單數，用 there is。\n【其他選項】(A) that is 指特定事物，此處無指代；(B) it is 無指代對象；(C) it has 不能用來表示某地有某物。\n【例句】Near my school, there is a small bookstore.", "explanationSource": "source"}, {"id": 42, "question": "In the middle of the park, ______ a big tree with a swing on it.", "options": ["it is", "there is", "it has", "there has"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 41 題）", "explanation": "某地有某物用 there is + 單數N。", "explanationSource": "supplemental"}, {"id": 43, "question": "On the second floor of this building, ______ two music rooms and a library.", "options": ["there are", "there is", "it has", "they are"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 41 題）", "explanation": "two music rooms 複數，用 there are。", "explanationSource": "supplemental"}, {"id": 44, "question": "Behind our house, ______ a river where my brother and I used to fish.", "options": ["it was", "they were", "there were", "there was"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 41 題）", "explanation": "used to 表過去，a river 單數，用 there was。", "explanationSource": "supplemental"}, {"id": 45, "question": "Kate: Earl, is that tall boy your brother?\nEarl: Yes, ______.\nKate: But you two look so different!", "options": ["it is", "he is", "that is", "you are"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜簡答用人稱代名詞 he is", "explanation": "【句型】Is that + 人 …? 簡答時改用人稱代名詞：Yes, he/she is.\n【分析】問句主詞 that tall boy 指男生，簡答用 he 代替，Yes, he is.\n【其他選項】(A) it 用於指物或不確定身分的人（如電話中 Who is it?）；(C) 簡答不用 that；(D) you 指對方，不合語意。\n【例句】Is that girl your cousin? — Yes, she is.", "explanationSource": "source"}, {"id": 46, "question": "Amy: Is that woman with long hair your English teacher?\nBen: Yes, ______. She's very nice.", "options": ["it is", "she is", "that is", "her is"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 45 題）", "explanation": "that woman 為女性，簡答用 she is。", "explanationSource": "supplemental"}, {"id": 47, "question": "Tom: Are those boys on the court your classmates?\nJay: No, ______. They're from another school.", "options": ["they aren't", "those aren't", "there aren't", "we aren't"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 45 題）", "explanation": "those boys 複數，簡答用 they aren't。", "explanationSource": "supplemental"}, {"id": 48, "question": "(Someone knocks on the door.)\nMom: Who is ______?\nDad: It's me. I forgot my key.", "options": ["he", "that one", "it", "they"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 45 題）", "explanation": "不知門外是誰時用 Who is it?，回答 It's me.", "explanationSource": "supplemental"}, {"id": 49, "question": "When I entered the house for the first time, I found ______ was a big round table in the living room.", "options": ["it", "that", "there", "this"], "answer": 2, "answerLabel": "C", "source": "會考歷屆｜found + (that) there was + N", "explanation": "【句型】I found (that) + 子句；子句表存在用 there was + N。\n【分析】found 後省略 that，子句「客廳裡有一張大圓桌」用 there was a big round table。\n【其他選項】(A) it was 無指代對象；(B) that 若當連接詞，子句缺主詞；若當代名詞，「那是一張圓桌」語意不合；(D) this 為指示代名詞，不合語意。\n【例句】When I opened the box, I found there was a letter inside.", "explanationSource": "source"}, {"id": 50, "question": "When Lucy opened the fridge, she found ______ was nothing to eat.", "options": ["it", "there", "that", "they"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 49 題）", "explanation": "found 後子句表「沒有東西」，用 there was nothing。", "explanationSource": "supplemental"}, {"id": 51, "question": "I heard ______ was no school tomorrow because of the typhoon.", "options": ["there", "it", "they", "this"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 49 題）", "explanation": "heard (that) 後子句表「沒有…」，用 there was no + N。", "explanationSource": "supplemental"}, {"id": 52, "question": "When we got to the theater, we were told that ______ no tickets left.", "options": ["it was", "they were", "there was", "there were"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 49 題）", "explanation": "no tickets 複數名詞，存在句用 there were。", "explanationSource": "supplemental"}, {"id": 53, "question": "This restaurant makes delicious chicken rice, so ______ always full of people at mealtime.", "options": ["it is", "they are", "there is", "there are"], "answer": 0, "answerLabel": "A", "source": "會考歷屆｜代名詞 it 指單數名詞 + be full of", "explanation": "【句型】S + be full of + N 表「充滿…」；it 代替前面的單數名詞。\n【分析】擠滿人的是 This restaurant（單數），用 it 代替：it is always full of people。\n【其他選項】(B) they 指複數，不合；(C)(D) there is/are 後要接名詞表存在，不能接 full of。\n【例句】The night market sells cheap food, so it is always crowded.", "explanationSource": "source"}, {"id": 54, "question": "The new park has a big playground, so ______ always full of kids on weekends.", "options": ["they are", "there is", "it is", "there are"], "answer": 2, "answerLabel": "C", "source": "類似題 1（對應第 53 題）", "explanation": "it 代替單數名詞 the new park。", "explanationSource": "supplemental"}, {"id": 55, "question": "These shoes are cheap and comfortable, so ______ popular with students.", "options": ["they are", "it is", "there are", "there is"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 53 題）", "explanation": "they 代替複數名詞 these shoes。", "explanationSource": "supplemental"}, {"id": 56, "question": "I like this bookstore because ______ many interesting comic books in it.", "options": ["it is", "they are", "it is having", "there are"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 53 題）", "explanation": "in it 表「在店裡」，存在句用 there are + 複數N。", "explanationSource": "supplemental"}, {"id": 57, "question": "Now we have to take a taxi home because ______ are no buses after eleven o'clock.", "options": ["here", "there", "they", "we"], "answer": 1, "answerLabel": "B", "source": "會考歷屆｜There are no + 複數N", "explanation": "【句型】There are no + 複數N 表「沒有…」。\n【分析】「十一點後就沒有公車了」表不存在，no buses 複數，用 there are no buses。\n【其他選項】(A) here are 表「這就是…」，不合語意；(C) they 無指代對象；(D) we are no buses 語意不通。\n【例句】There are no clouds in the sky today.", "explanationSource": "source"}, {"id": 58, "question": "We can't play outside because ______ no lights on the playground at night.", "options": ["there are", "it is", "they are", "there is"], "answer": 0, "answerLabel": "A", "source": "類似題 1（對應第 57 題）", "explanation": "no lights 複數，用 there are no。", "explanationSource": "supplemental"}, {"id": 59, "question": "I'm hungry, but ______ no food in the kitchen.", "options": ["there are", "it has", "there is", "they have"], "answer": 2, "answerLabel": "C", "source": "類似題 2（對應第 57 題）", "explanation": "food 不可數，用 there is no。", "explanationSource": "supplemental"}, {"id": 60, "question": "Ten years ago, ______ no MRT stations in this part of the city.", "options": ["there are", "they were", "there was", "there were"], "answer": 3, "answerLabel": "D", "source": "類似題 3（對應第 57 題）", "explanation": "ten years ago 過去 + 複數 stations，用 there were no。", "explanationSource": "supplemental"}, {"id": 61, "question": "I think ______ is more fun to go to the movies with my friends than with my family.", "options": ["that", "there", "one", "it"], "answer": 3, "answerLabel": "D", "source": "會考歷屆｜虛主詞 it（it is + adj. + to V）", "explanation": "【句型】It is + adj. + to V：it 為虛主詞，代替後面的不定詞片語 to go to the movies…。\n【分析】I think 後的子句中，真正的主詞是 to go to the movies with my friends，放到後面，前面用虛主詞 it：it is more fun to go…。\n【其他選項】(A) that 不能當虛主詞；(B) there is 後面接名詞表「有…」，不接 more fun to V；(C) one 指「一個（東西）」，語意不合。\n【例句】It is interesting to learn about other cultures.", "explanationSource": "source"}, {"id": 62, "question": "______ is not polite to talk loudly on the MRT.", "options": ["That", "It", "There", "This"], "answer": 1, "answerLabel": "B", "source": "類似題 1（對應第 61 題）", "explanation": "虛主詞 it 代替後面的 to talk…。", "explanationSource": "supplemental"}, {"id": 63, "question": "I find ______ hard to remember all these new words.", "options": ["it", "that", "there", "one"], "answer": 0, "answerLabel": "A", "source": "類似題 2（對應第 61 題）", "explanation": "find it + adj. + to V，it 為虛受詞。", "explanationSource": "supplemental"}, {"id": 64, "question": "Do you think ______ is easier to take the train than to drive there?", "options": ["that", "there", "it", "one"], "answer": 2, "answerLabel": "C", "source": "類似題 3（對應第 61 題）", "explanation": "虛主詞 it 代替 to take the train。", "explanationSource": "supplemental"}]};</script><script src="longteng-b1u5-quiz.js?v=20261027-2"></script><script>document.querySelector("#description").textContent="共 64 題（會考歷屆 16 題＋類似題 48 題）｜選答後顯示中文解析｜答錯可重做並下載錯題";</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
