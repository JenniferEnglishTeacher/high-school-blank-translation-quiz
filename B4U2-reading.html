<style>

<div class="wrap">
<section class="hero"><h1>翰林 B4U2 Reading 課文填空</h1><h2 style="margin:0 0 8px">Yuki's Diary</h2><p>先看完整中文，再依課文完成英文挖空。答錯會顯示正確答案，必須重新填對。</p><p class="note">整句填空正確後進入朗讀。支援語音辨識時，朗讀相似度必須達到 <b>90%</b> 才能進下一題。</p></section>

<script type="module">

{id:6,zh:'大約在下午三點時，寇弟跟我到達海灘。',full:'Around 3 p.m., Cody and I got to the beach.',s:[B('Around'),T(' 3 p.m., Cody and I '),B('got'),T(' '),B('to'),T(' the beach.')]},
{id:7,zh:'很少人知道這個地方，所以現場除了我們之外只有一位漁夫。',full:'Very few people knew about this place, so we were the only ones there besides a fisherman.',s:[T('Very '),B('few',{options:['little','few','fewer','less']}),T(' people '),B('knew'),T(' '),B('about'),T(' this place, '),B('so'),T(' we were '),B('the'),T(' '),B('only'),T(' '),B('ones',{options:['it','one','ones']}),T(' there '),B('besides'),T(' a '),B('fisherman'),T('.')]},
{id:8,zh:'我們游了一段時間，並玩得很開心。',full:'We swam for some time and had a lot of fun.',s:[T('We '),B('swam'),T(' '),B('for'),T(' '),B('some'),T(' '),B('time'),T(' and '),B('had'),T(' '),B('a'),T(' '),B('lot'),T(' '),B('of'),T(' '),B('fun'),T('.')]},
{id:9,zh:'我游泳完後，在岸邊休息，並享受海浪的聲音。',full:'After swimming, I stayed on the beach for a rest and enjoyed the sound of the waves.',s:[T('After '),B('swimming',{options:['swim','I swim','swimming','to swim']}),T(', I '),B('stayed'),T(' '),B('on',{options:['on','in']}),T(' the beach '),B('for'),T(' '),B('a'),T(' '),B('rest'),T(' and '),B('enjoyed'),T(' the '),B('sound'),T(' '),B('of'),T(' the '),B('waves'),T('.')]},

{id:11,zh:'他是我們學校裡最好的泳者，所以我一點都不擔心他。',full:"He is the best swimmer in our school, so I wasn't worried about him at all.",s:[T('He is '),B('the'),T(' '),B('best'),T(' '),B('swimmer'),T(' in our school, '),B('so'),T(' I '),B("wasn't"),T(' '),B('worried'),T(' '),B('about'),T(' '),B('him',{options:['he','him']}),T(' '),B('at'),T(' '),B('all'),T('.')]},
{id:12,zh:'突然間，一個大浪打在寇弟的身上，他開始掙扎。',full:'Suddenly, a big wave hit Cody and he started to struggle.',s:[B('Suddenly'),T(', a big '),B('wave'),T(' '),B('hit'),T(' Cody and he '),B('started'),T(' '),B('to struggle',{options:['to struggle','struggling']}),T('.')]},
{id:13,zh:'他大聲呼救，那位漁夫就把船划過去救他。',full:'He shouted for help, and the fisherman rowed his boat over to save him.',s:[T('He '),B('shouted'),T(' '),B('for'),T(' '),B('help'),T(', and the fisherman '),B('rowed'),T(' his boat '),B('over'),T(' '),B('to save',{options:['saving','to save']}),T(' him.')]},
{id:14,zh:'我打給 119，援助很快就到了。',full:'I called 119, and soon help came.',s:[T('I '),B('called'),T(' 119, and '),B('soon'),T(' '),B('help'),T(' '),B('came'),T('.')]},
{id:15,zh:'寇弟在他們對他做心肺復甦術後醒過來。',full:'Cody became conscious after they did CPR on him.',s:[T('Cody '),B('became'),T(' '),B('conscious'),T(' '),B('after'),T(' they '),B('did'),T(' '),B('CPR'),T(' '),B('on'),T(' him.')]},

{id:18,zh:'「這沒什麼。只是要記得游泳總要在海灘附近游。巨浪是很危險的。」漁夫說道。',full:'"It\'s nothing. Just remember to always swim near the beach here. The strong waves are dangerous," the fisherman said.',s:[T('"'),B("It's"),T(' '),B('nothing'),T('. '),B('Just'),T(' '),B('remember'),T(' '),B('to'),T(' '),B('always'),T(' swim '),B('near'),T(' the beach here. The '),B('strong'),T(' '),B('waves'),T(' are '),B('dangerous'),T('," the fisherman said.')]},
{id:19,zh:'我永遠不會忘記那場意外。',full:'I will never forget that accident.',s:[T('I '),B('will'),T(' '),B('never'),T(' '),B('forget'),T(' that '),B('accident'),T('.')]},
{id:20,zh:'今天寇弟和我兩人都學到了關於水上安全的一課。',full:'Today Cody and I both learned a lesson in water safety.',s:[T('Today Cody and I both '),B('learned'),T(' '),B('a'),T(' '),B('lesson'),T(' in water '),B('safety'),T('.')]},
{id:21,zh:'以後我們在海邊游泳時，一定會小心的。',full:'We will always be careful when we swim in the sea.',s:[T('We '),B('will'),T(' '),B('always'),T(' '),B('be'),T(' '),B('careful'),T(' when we swim in the sea.')]}];
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm=s=>String(s??'').replace(/[’‘]/g,"'").trim().replace(/\s+/g,' ').toLowerCase();
let state={selected:[],i:0,wrong:new Map(),done:new Set(),recognition:null};
function renderList(){questionList.innerHTML=qs.map(q=>`<label class="pick"><input type="checkbox" value="${q.id}" checked><span><b>第 ${q.id} 題</b>　${esc(q.zh)}<small>${esc(q.full)}</small></span></label>`).join('')}
function stopAudio(){if(state.recognition){try{state.recognition.abort()}catch{} state.recognition=null}if('speechSynthesis'in window) speechSynthesis.cancel()}
function start(){const ids=[...questionList.querySelectorAll('input:checked')].map(x=>+x.value);if(!ids.length){alert('請至少選一題。');return}state={selected:ids.map(id=>qs.find(q=>q.id===id)),i:0,wrong:new Map(),done:new Set(),recognition:null};selectScreen.classList.add('hidden');resultScreen.classList.add('hidden');quizScreen.classList.remove('hidden');showQ()}
function showQ(){stopAudio();const q=state.selected[state.i];progressText.textContent=`第 ${state.i+1} / ${state.selected.length} 題`;wrongCount.textContent=`曾答錯：${state.wrong.size} 題`;bar.style.width=`${state.i/state.selected.length*100}%`;zhText.textContent=q.zh;feedback.className='feedback hidden';voicePanel.classList.add('hidden');nextBtn.classList.add('hidden');nextBtn.disabled=true;checkBtn.classList.remove('hidden');enText.innerHTML='';let bi=0;q.s.forEach(seg=>{if(seg.type==='text'){enText.insertAdjacentHTML('beforeend',esc(seg.text));return}const span=document.createElement('span');span.className='blank';span.dataset.bi=bi++;let field;if(seg.options){field=document.createElement('select');field.innerHTML='<option value="">請選擇</option>'+seg.options.map(o=>`<option>${esc(o)}</option>`).join('')}else{field=document.createElement('input');field.autocomplete='off';field.style.width=seg.width+'px'}span.appendChild(field);enText.appendChild(span)});setTimeout(()=>enText.querySelector('input,select')?.focus(),50)}
function check(){const q=state.selected[state.i];const blanks=q.s.filter(x=>x.type==='blank');const spans=[...enText.querySelectorAll('.blank')];let all=true;const attempt=[];spans.forEach((sp,j)=>{const f=sp.querySelector('input,select'),v=f.value,seg=blanks[j];attempt.push(v);sp.querySelector('.blank-answer')?.remove();if(seg.accept.some(a=>norm(a)===norm(v))){sp.className='blank correct';f.disabled=true}else{all=false;sp.className='blank wrong';const d=document.createElement('span');d.className='blank-answer';d.textContent=`正確：${seg.answer}`;sp.appendChild(d);f.disabled=false;f.value=''}});if(!all){if(!state.wrong.has(q.id))state.wrong.set(q.id,[]);state.wrong.get(q.id).push(attempt.join(' | '));feedback.textContent='❌ 有答案不正確。請依照顯示的正確答案重新填寫。';feedback.className='feedback bad';return}state.done.add(q.id);feedback.textContent='✅ 填空全部正確！現在請朗讀完整句子，達 90% 才能進下一題。';feedback.className='feedback ok';checkBtn.classList.add('hidden');showVoice()}
function speechNorm(s){return norm(s).replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').replace(/\bi'm\b/g,'i am').replace(/\bi'll\b/g,'i will').replace(/\bi'd\b/g,'i would').replace(/\bwasn't\b/g,'was not').replace(/\bit's\b/g,'it is').trim()}
function sim(a,b){const A=speechNorm(a).split(' ').filter(Boolean),B=speechNorm(b).split(' ').filter(Boolean);const d=Array.from({length:A.length+1},()=>Array(B.length+1).fill(0));for(let i=0;i<=A.length;i++)d[i][0]=i;for(let j=0;j<=B.length;j++)d[0][j]=j;for(let i=1;i<=A.length;i++)for(let j=1;j<=B.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(A[i-1]===B[j-1]?0:1));return Math.max(0,1-d[A.length][B.length]/Math.max(A.length,B.length,1))}
function speak(){const q=state.selected[state.i];if(!('speechSynthesis'in window)){voiceResult.textContent='此瀏覽器無法朗讀。';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(q.full.replace(/^"|".*$/g,m=>m));u.lang='en-US';u.rate=.88;const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>v.lang==='en-US')||vs.find(v=>v.lang.startsWith('en'))||null;speechSynthesis.speak(u)}
function showVoice(){const q=state.selected[state.i];voiceSentence.textContent=q.full;voicePanel.classList.remove('hidden');voiceResult.className='voice-result';voiceResult.textContent='請按「開始朗讀」，清楚念完整句子。90% 以上才通過。';const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){voiceResult.textContent='這個瀏覽器不支援語音辨識；為避免無法作答，已直接開放下一題。建議使用最新版 Chrome 或 Edge。';nextBtn.classList.remove('hidden');nextBtn.disabled=false}else{nextBtn.classList.remove('hidden');nextBtn.disabled=true}setTimeout(speak,200)}
function recognize(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;stopAudio();const q=state.selected[state.i],r=new SR();state.recognition=r;r.lang='en-US';r.interimResults=false;r.continuous=false;r.maxAlternatives=5;micBtn.disabled=true;voiceResult.className='voice-result';voiceResult.textContent='🎤 正在聆聽…請念完整句子。';r.onresult=e=>{let best={text:'',score:0};for(const res of e.results)for(const alt of res){const score=sim(q.full,alt.transcript);if(score>best.score)best={text:alt.transcript,score}}const pct=Math.round(best.score*100);voiceResult.innerHTML=`辨識結果：<b>${esc(best.text)}</b><br>正確性：<b>${pct}%</b>`;if(best.score>=.90){voiceResult.className='voice-result good';voiceResult.innerHTML+=`<br>✅ 朗讀通過！已達 90%。`;nextBtn.disabled=false}else{voiceResult.className='voice-result retry';voiceResult.innerHTML+=`<br>🔁 未達 90%，請再聽一次並重新朗讀。`;nextBtn.disabled=true}};r.onerror=e=>{voiceResult.className='voice-result retry';voiceResult.textContent=e.error==='not-allowed'?'無法使用麥克風，請允許瀏覽器的麥克風權限。':e.error==='no-speech'?'沒有偵測到語音，請再試一次。':'語音辨識失敗，請再試一次。'};r.onend=()=>{micBtn.disabled=false;state.recognition=null};r.start()}
function next(){if(nextBtn.disabled)return;if(state.i<state.selected.length-1){state.i++;showQ()}else finish()}
function finish(){stopAudio();quizScreen.classList.add('hidden');resultScreen.classList.remove('hidden');bar.style.width='100%';summary.innerHTML=`<div class="stat">選擇題數<b>${state.selected.length}</b></div><div class="stat">完成填空<b>${state.done.size}</b></div><div class="stat">曾答錯<b>${state.wrong.size}</b></div>`;const wrongQs=state.selected.filter(q=>state.wrong.has(q.id));resultMessage.innerHTML=wrongQs.length?'<p><b>以下為本次曾經答錯的題目：</b></p>':'<p><b>🎉 本次沒有填空錯題！</b></p>';wrongList.innerHTML=wrongQs.map(q=>`<div class="wrong-card"><p><b>${esc(q.zh)}</b></p><p>錯誤作答：${state.wrong.get(q.id).map(esc).join('； ')}</p><p>正確答案：${esc(q.full)}</p></div>`).join('');downloadBtn.disabled=!wrongQs.length}
async function downloadDocx(){const wrongQs=state.selected.filter(q=>state.wrong.has(q.id));if(!wrongQs.length)return;const children=[new Paragraph({text:"翰林 B4U2 Reading｜Yuki's Diary 錯題整理",heading:HeadingLevel.HEADING_1}),new Paragraph({text:`錯題數：${wrongQs.length}`})];wrongQs.forEach((q,i)=>{children.push(new Paragraph({children:[new TextRun({text:`${i+1}. ${q.zh}`,bold:true})]}),new Paragraph({text:`學生錯誤答案：${state.wrong.get(q.id).join('； ')}`}),new Paragraph({text:`正確答案：${q.full}`}),new Paragraph({text:'重新練習：____________________________________________'}))});const doc=new Document({sections:[{children}]});const blob=await Packer.toBlob(doc);const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`翰林B4U2_Reading_Yukis_Diary_錯題_${new Date().toISOString().slice(0,10)}.docx`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
allBtn.onclick=()=>questionList.querySelectorAll('input').forEach(x=>x.checked=true);noneBtn.onclick=()=>questionList.querySelectorAll('input').forEach(x=>x.checked=false);startBtn.onclick=start;checkBtn.onclick=check;nextBtn.onclick=next;finishBtn.onclick=finish;speakBtn.onclick=speak;micBtn.onclick=recognize;downloadBtn.onclick=downloadDocx;restartBtn.onclick=()=>{resultScreen.classList.add('hidden');selectScreen.classList.remove('hidden');renderList()};renderList();
</script>
</body></html>
