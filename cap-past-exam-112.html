<script>window.QUIZ_CONFIG={"title": "112 年國中會考英語｜單題＋克漏字", "mode": "mcq", "questions": [{"id": 1, "question": "第 1 題　Look at the picture. The man is holding a ______ of grapes in his hands.", "options": ["bag", "basket", "bowl", "box"], "answer": 1, "answerLabel": "B", "source": "112 會考｜單題｜第 1 題", "explanation": "圖中男子手上拿著一「籃」葡萄：a basket of grapes。", "explanationSource": "own", "section": "單題"}, {"id": 2, "question": "第 2 題　Dennis enjoys ______ in public. He is proud of his beautiful voice.", "options": ["dancing", "drawing", "shopping", "singing"], "answer": 3, "answerLabel": "D", "source": "112 會考｜單題｜第 2 題", "explanation": "他對自己好聽的嗓音很自豪，所以喜歡在公開場合「唱歌」：enjoy singing。", "explanationSource": "own", "section": "單題"}, {"id": 3, "question": "第 3 題　Mrs. Johnson can’t hear very well. If you need to talk to her, you must ______.", "options": ["explain", "hurry", "listen", "shout"], "answer": 3, "answerLabel": "D", "source": "112 會考｜單題｜第 3 題", "explanation": "她聽力不好，跟她說話必須「大聲喊」：shout。", "explanationSource": "own", "section": "單題"}, {"id": 4, "question": "第 4 題　People got very excited when they watched Ms. Smith ______ at the party.", "options": ["danced", "dancing", "has danced", "to dance"], "answer": 1, "answerLabel": "B", "source": "112 會考｜單題｜第 4 題", "explanation": "感官動詞 watch + 受詞 + V-ing／原形：watched Ms. Smith dancing。", "explanationSource": "own", "section": "單題"}, {"id": 5, "question": "第 5 題　I tried on these shoes in several different ______, and I thought the white pair looked best on me.", "options": ["colors", "prices", "shapes", "sizes"], "answer": 0, "answerLabel": "A", "source": "112 會考｜單題｜第 5 題", "explanation": "試穿不同「顏色」，最後覺得白色那雙最好看：colors。", "explanationSource": "own", "section": "單題"}, {"id": 6, "question": "第 6 題　Rex did not feel the earthquake this morning. He ______ in the park at the time.", "options": ["jogged", "was jogging", "has jogged", "would jog"], "answer": 1, "answerLabel": "B", "source": "112 會考｜單題｜第 6 題", "explanation": "地震發生的「當時」他正在公園慢跑：過去進行式 was jogging。", "explanationSource": "own", "section": "單題"}, {"id": 7, "question": "第 7 題　Mr. Lee has worked in the same store for ten years; he’s never thought about ______ his job.", "options": ["changing", "finding", "remembering", "starting"], "answer": 0, "answerLabel": "A", "source": "112 會考｜單題｜第 7 題", "explanation": "think about + V-ing：從沒想過「換」工作：changing。", "explanationSource": "own", "section": "單題"}, {"id": 8, "question": "第 8 題　I didn’t take the bus today because it was ______. All the seats were taken and a lot of students were standing.", "options": ["dirty", "fast", "full", "wrong"], "answer": 2, "answerLabel": "C", "source": "112 會考｜單題｜第 8 題", "explanation": "座位都坐滿、很多人站著，公車很「滿」：full。", "explanationSource": "own", "section": "單題"}, {"id": 9, "question": "第 9 題　Don’t go away when you’re cooking, ______ the food might burn.", "options": ["but", "if", "or", "so"], "answer": 2, "answerLabel": "C", "source": "112 會考｜單題｜第 9 題", "explanation": "煮飯時別離開，「否則」食物可能燒焦：or。", "explanationSource": "own", "section": "單題"}, {"id": 10, "question": "第 10 題　Jerry wanted to know ______ he was kicked off the soccer team, but no one gave him a good reason.", "options": ["where", "when", "whether", "why"], "answer": 3, "answerLabel": "D", "source": "112 會考｜單題｜第 10 題", "explanation": "後句說沒人給他好理由，所以他想知道「為什麼」被踢出球隊：why。", "explanationSource": "own", "section": "單題"}, {"id": 11, "question": "第 11 題　Jenny is already forty, doesn’t have a job and often makes trouble for her parents. To them, she is really a(n) ______.", "options": ["daughter", "example", "gift", "headache"], "answer": 3, "answerLabel": "D", "source": "112 會考｜單題｜第 11 題", "explanation": "四十歲沒工作還常惹麻煩，對父母來說是令人「頭痛」的人：headache。", "explanationSource": "own", "section": "單題"}, {"id": 12, "question": "第 12 題　Ed and Jill ______ camping this weekend, so they have to finish their homework by Friday.", "options": ["went", "were going", "are going", "have gone"], "answer": 2, "answerLabel": "C", "source": "112 會考｜單題｜第 12 題", "explanation": "this weekend 的計畫，用現在進行式表示即將發生：are going。", "explanationSource": "own", "section": "單題"}, {"id": 13, "question": "第 13 題　Doraemon, a blue Japanese robot cat, has hated mice since his ears ______ by a mouse.", "options": ["bit", "bite", "were bitten", "have bitten"], "answer": 2, "answerLabel": "C", "source": "112 會考｜單題｜第 13 題", "explanation": "耳朵是「被」老鼠咬的，since 後接過去式被動 were bitten。", "explanationSource": "own", "section": "單題"}, {"id": 14, "question": "第 14 題　If we play some interesting games in class, there ______ more fun in learning English.", "options": ["are", "has", "will be", "will have"], "answer": 2, "answerLabel": "C", "source": "112 會考｜單題｜第 14 題", "explanation": "if 子句用現在式，主要子句用未來式：there will be more fun。", "explanationSource": "own", "section": "單題"}, {"id": 15, "question": "第 15 題　The ______ of this shop was so bad; I never got any answer after I emailed them my questions.", "options": ["item", "business", "price", "service"], "answer": 3, "answerLabel": "D", "source": "112 會考｜單題｜第 15 題", "explanation": "寄信問問題都沒得到回覆，表示這家店的「服務」很差：service。", "explanationSource": "own", "section": "單題"}, {"id": 16, "question": "第 16 題　It’s not easy to see those islands clearly from here on sunny days, and it’s even less ______ to see them on cloudy days.", "options": ["difficult", "lucky", "possible", "special"], "answer": 2, "answerLabel": "C", "source": "112 會考｜單題｜第 16 題", "explanation": "晴天都看不清楚了，陰天更「不可能」看見：even less possible。", "explanationSource": "own", "section": "單題"}, {"id": 17, "question": "第 17 題　Do you remember the CD I was looking for for months? I ______ found it in a small shop. Look, here it is!", "options": ["almost", "even", "finally", "still"], "answer": 2, "answerLabel": "C", "source": "112 會考｜單題｜第 17 題", "explanation": "找了好幾個月的 CD，「終於」在小店找到了：finally。", "explanationSource": "own", "section": "單題"}, {"id": 18, "question": "第 18 題　Business at Jane’s shop has not been good these days. And the new supermarket across the street only makes things ______.", "options": ["easier", "worse", "more boring", "more convenient"], "answer": 1, "answerLabel": "B", "source": "112 會考｜單題｜第 18 題", "explanation": "生意已經不好，對面新超市只會讓情況「更糟」：makes things worse。", "explanationSource": "own", "section": "單題"}, {"id": 19, "question": "第 19 題　Scott wasn’t sure if the young woman before him was ______ pulled him out of a car on fire.", "options": ["who", "the one", "the one she", "the one who"], "answer": 3, "answerLabel": "D", "source": "112 會考｜單題｜第 19 題", "explanation": "the one who＝那個…的人；who 當關係子句的主詞：the one who pulled him out...", "explanationSource": "own", "section": "單題"}, {"id": 20, "question": "第 20 題　I ______ swimming for several years before I went to this high school. I gave it up because of heavy schoolwork.", "options": ["have practiced", "am practicing", "practiced", "would practice"], "answer": 2, "answerLabel": "C", "source": "112 會考｜單題｜第 20 題", "explanation": "上高中前練了好幾年、現在已經放棄，是過去的事：過去式 practiced。", "explanationSource": "own", "section": "單題"}, {"id": 21, "question": "第 21 題　Frank Kane is so good in the movie that many people ______ he will win the best actor prize.", "options": ["expect", "forget", "notice", "plan"], "answer": 0, "answerLabel": "A", "source": "112 會考｜單題｜第 21 題", "explanation": "他演得很好，很多人「預期」他會得最佳男主角：expect。", "explanationSource": "own", "section": "單題"}, {"id": 22, "question": "第 22 題　The new medicine that just came out on the market ______ thousands of lives.", "options": ["and saved", "has saved", "saving", "to save"], "answer": 1, "answerLabel": "B", "source": "112 會考｜單題｜第 22 題", "explanation": "新藥上市以來「已經拯救」上千條生命：現在完成式 has saved。", "explanationSource": "own", "section": "單題"}, {"id": 23, "question": "第 23 題　Now I often think of those days with Pip, my pet dog. When I read in my room, he ______ quietly beside me.", "options": ["will come and sit", "comes and sits", "has come and sat", "used to come and sit"], "answer": 3, "answerLabel": "D", "source": "112 會考｜單題｜第 23 題", "explanation": "Now I often think of those days 表示是過去的習慣：used to come and sit。", "explanationSource": "own", "section": "單題"}, {"id": 42, "question": "【克漏字 第 42–43 題】\nNiceReads\nSpeaking American is a great book!\nLucia Leisure ★★★★★\nI just love Josh Katz’s new book! It’s about __42__ in different parts of the US. The information in the book was collected from the quiz that Katz built on the website in 2013. The quiz asked what words people use for something, and their answers showed interesting facts. For example, there are different names for sports shoes. In most parts of the US, people say “tennis shoes.” In the northeast of the country, people wear “sneakers.” In some towns, “tennis shoes” and “sneakers” become “gym shoes.”\nThe use of words tells us where people are from, like Katz’s book says. But in my experience, it also shows __43__. My family has lived in New York since my grandparents. It’s not surprising that I say “sneakers.” But my grandfather says “plimsolls,” and my daughter says “kicks” or “vans.” Maybe Katz can study this difference for his next book.\n（website 網站）\n\n▶ 第 42 題　請選出 __42__ 的最佳答案", "options": ["what things are called", "how sports are played", "why different languages are spoken", "what words are often spelled differently"], "answer": 0, "answerLabel": "A", "source": "112 會考｜克漏字｜第 42 題", "explanation": "書中調查人們用什麼字稱呼某樣東西（如運動鞋的不同說法），主題是「東西被怎麼稱呼」。", "explanationSource": "own", "section": "克漏字"}, {"id": 43, "question": "【克漏字 第 42–43 題】\nNiceReads\nSpeaking American is a great book!\nLucia Leisure ★★★★★\nI just love Josh Katz’s new book! It’s about __42__ in different parts of the US. The information in the book was collected from the quiz that Katz built on the website in 2013. The quiz asked what words people use for something, and their answers showed interesting facts. For example, there are different names for sports shoes. In most parts of the US, people say “tennis shoes.” In the northeast of the country, people wear “sneakers.” In some towns, “tennis shoes” and “sneakers” become “gym shoes.”\nThe use of words tells us where people are from, like Katz’s book says. But in my experience, it also shows __43__. My family has lived in New York since my grandparents. It’s not surprising that I say “sneakers.” But my grandfather says “plimsolls,” and my daughter says “kicks” or “vans.” Maybe Katz can study this difference for his next book.\n（website 網站）\n\n▶ 第 43 題　請選出 __43__ 的最佳答案", "options": ["how old they are", "who they speak to", "where they grew up", "whether they are men or women"], "answer": 0, "answerLabel": "A", "source": "112 會考｜克漏字｜第 43 題", "explanation": "作者一家都住紐約，但祖父、自己、女兒對運動鞋說法不同，差別在「年紀」。", "explanationSource": "own", "section": "克漏字"}]};window.CAP_IMG={"第 1 題　Look at the picture. The man is holding a ______ of grapes in his hands.": "assets/cap-past-exams/cap112-q1.png?v=20261119-1"};</script><script src="longteng-b1u5-quiz.js?v=20261106-3"></script><script>(function(){var M=window.CAP_IMG||{};var qn=document.getElementById('question');if(!qn)return;function put(){var old=document.getElementById('capImg');var t=qn.textContent;var src=M[t];if(old&&old.dataset.src===src)return;if(old)old.remove();if(!src)return;var im=document.createElement('img');im.id='capImg';im.dataset.src=src;im.src=src;im.alt='題目圖片';im.style.cssText='display:block;max-width:100%;max-height:420px;margin:10px auto;border:1px solid #dbe3ee;border-radius:10px;background:#fff';qn.insertAdjacentElement('afterend',im)}new MutationObserver(put).observe(qn,{childList:true,characterData:true,subtree:true});})();</script><script>document.querySelector("#description").textContent="112 年會考英語閱讀：單題 23 題＋克漏字 2 題｜四選一｜附中文解析｜可隨機 20 題、隨時結束並下載 DOCX 錯題";</script><script src="/high-school-blank-translation-quiz/quiz-result-recorder.js?v=20261027-1" defer></script></body></html>
