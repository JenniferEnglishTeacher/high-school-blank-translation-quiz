<style>:root{--blue:#2563eb;--navy:#1e3a8a;--bg:#f3f6fb;--card:#fff;--line:#d7e0eb;--ink:#182234;--muted:#64748b;--ok:#15803d;--okbg:#ecfdf3;--bad:#b91c1c;--badbg:#fff1f2;--gold:#9a3412;--goldbg:#fff7ed;--voice:#6d28d9;--hl:#fde047}

 brother and I [am/is/are>are] fans of a cartoon. Every Friday, we {watches>watch} two new {episode>episodes} after dinner. Last week, the funny dog {lose>lost} its bone in the last episode. My brother {laugh>laughed} so hard that he {fall>fell} off the sofa. Now we {is>are} waiting for the next episode."},{"w":"feisty","pos":"adj.","zh":"精力充沛又不服輸的；好鬥的","rec":false,"forms":"","family":"","meanings":[{"en":"full of energy and not afraid to argue or fight for what you want","zh":"精力充沛又敢爭取的；不服輸的"}],"coll":[{"en":"a feisty little girl / dog","zh":"活潑又不服輸的小女孩／小狗"},{"en":"small but feisty","zh":"個子小但很強悍"},{"en":"a feisty player / team","zh":"鬥志旺盛的球員／隊伍"},{"en":"feisty old lady","zh":"硬朗又有個性的老太太"}],"short":"full of energy and brave enough to argue or fight back","prompt":{"en":"Your little sister is the smallest player on the soccer team, but she never gives up and she even argues with the big boys.","zh":"你的妹妹是足球隊裡最矮小的球員，但她從不放棄，甚至敢跟大男生爭論。"},"sample":"My little sister is small but feisty, and she never lets the big boys push her around.","story":"My little sister Amy [is/are>is] small but feisty. Every morning, she {argue>argues} with my two {brother>brothers} about the TV. Yesterday, a big boy {take>took} her ball at the park. Amy {run>ran} after him and {shout>shouted}, \"Give it back!\" The boy {give>gave} it back, and all the {kid>kids} {cheer>cheered}."},{"w":"intimidate","pos":"v.","zh":"恐嚇；威嚇；使害怕","rec":false,"forms":"intimidate – intimidated – intimidated (intimidates, intimidating)","family":"intimidating (adj.) 令人害怕的；intimidated (adj.) 感到害怕的","meanings":[{"en":"to make someone feel afraid, often so that they will do what you want","zh":"恐嚇；威嚇"}],"coll":[{"en":"intimidate someone into V-ing","zh":"威脅某人去做…"},{"en":"try to intimidate someone","zh":"試圖恐嚇某人"},{"en":"feel intimidated by N","zh":"被…嚇到；對…感到畏懼"},{"en":"an intimidating look","zh":"令人害怕的眼神"}],"short":"to make someone feel afraid so that they do what you want","prompt":{"en":"Before the basketball game, the
