  <main class="wrap">

      </div>

  </main>
  <script>window.QUIZ_CONFIG={"title":"龍騰普高 Book 1 Unit 5｜文法選擇（課本句型）","mode":"mcq","questions":[{"id":1,"question":"____________ the storm, the sports meet was canceled.","options":["Because","Because of","Since","Although"],"answer":1,"answerLabel":"B","source":"龍騰自命題","explanation":"because of表示原因，後面接名詞the storm","explanationSource":"source"},{"id":2,"question":"My father didn’t let me ____________ the latest iPhone because it was too expensive.","options":["buy","to buy","buying","bought"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"使役動詞let後面須接受詞me，再接原形動詞buy當作受詞補語，表示受詞主動的動作","explanationSource":"source"},{"id":3,"question":"When watching movies in theaters, I prefer comedies to tragedies, for sad movies always make me ____________.","options":["cried","crying","cry","to cry"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"使役動詞make後面須接受詞me，再接原形動詞cry當作受詞補語，表示受詞主動的動作","explanationSource":"source"},{"id":4,"question":"The couple can’t afford to buy a house of their own ____________ rising housing prices.","options":["because of","because","such as","except for"],"answer":0,"answerLabel":"A","source":"龍騰自命題","explanation":"because of表示原因，後面接名詞片語the rising housing prices（上漲的房屋價格）","explanationSource":"source"},{"id":5,"question":"To help me lose weight, my father ____________ me go jogging for one hour and jump rope for thirty minutes every day.","options":["suggests","orders","helps","has"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"使役動詞have後面須接受詞me，再接原形動詞go和jump當作受詞補語，表示受詞主動的動作","explanationSource":"source"},{"id":6,"question":"Sadly, in some countries women are still denied education simply ____________ their gender.","options":["except","except for","because","because of"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"because of表示原因，後面接名詞the gender","explanationSource":"source"},{"id":7,"question":"The members of this organization have worked very hard to ____________ visitors to our country feel more welcome.","options":["leave","keep","make","ask"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"受詞補語為原形動詞feel，因此動詞須使用使役動詞make","explanationSource":"source"},{"id":8,"question":"The rivers in this area are seriously polluted ____________ harmful waste from factories.","options":["such as","because","because of","except for"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"because of表示原因，後面接名詞片語harmful waste from factories","explanationSource":"source"},{"id":9,"question":"When Peter’s parents were away, he ____________ his brother clean his room.","options":["did","got","had","asked"],"answer":2,"answerLabel":"C","source":"習作簿","explanation":"補充解析：have + 受詞 + 原形動詞表示「使／叫某人做……」，故選 had。Peter 的父母不在時，他叫弟弟打掃房間。","explanationSource":"supplement"},{"id":10,"question":"All of today’s trains have been canceled ____________ the terrible earthquake.","options":["because","because of","except","except for"],"answer":1,"answerLabel":"B","source":"習作簿","explanation":"補充解析：because of 後接名詞片語 the terrible earthquake。今天所有列車都因嚴重地震而取消。","explanationSource":"supplement"},{"id":11,"question":"The kind boss lets his employees ____________ a day off on their birthday to celebrate with their family.","options":["to have","having","have","has"],"answer":2,"answerLabel":"C","source":"三合一學習手冊","explanation":"補充解析：let + 受詞 + 原形動詞，故選 have。這位好心老闆讓員工生日當天休假陪家人慶祝。","explanationSource":"supplement"},{"id":12,"question":"____________ Andy’s bad eating habits, the condition of his health is getting worse.","options":["Since","As","Because of","Because"],"answer":2,"answerLabel":"C","source":"三合一學習手冊","explanation":"補充解析：空格後是名詞片語 Andy’s bad eating habits，表示原因要用 Because of。","explanationSource":"supplement"},{"id":13,"question":"To improve our English, our teacher had us ____________ 20 new words every day.","options":["to memorize","memorizing","memorized","memorize"],"answer":3,"answerLabel":"D","source":"三合一學習手冊","explanation":"補充解析：have + 受詞 + 原形動詞，故選 memorize。老師要我們每天背二十個新單字。","explanationSource":"supplement"},{"id":14,"question":"My mother made me ____________ home and study the night before the final exam.","options":["stay","to stay","stayed","staying"],"answer":0,"answerLabel":"A","source":"三合一學習手冊","explanation":"補充解析：make + 受詞 + 原形動詞，故選 stay。期末考前一晚，媽媽要我待在家讀書。","explanationSource":"supplement"},{"id":15,"question":"____________ your timely help, I can realize my dream.","options":["Except for","Since","Because","Because of"],"answer":3,"answerLabel":"D","source":"三合一學習手冊","explanation":"補充解析：Because of 後接名詞片語 your timely help。因為你及時幫忙，我才能實現夢想。","explanationSource":"supplement"},{"id":16,"question":"John’s room was a mess, so his mother ____________ him clean it up before he went out to play.","options":["asked","wanted","forced","had"],"answer":3,"answerLabel":"D","source":"龍騰自命題","explanation":"受詞補語為原形動詞clean，因此主要動詞須使用使役動詞have","explanationSource":"source"},{"id":17,"question":"David was forced to drop out of school ____________ he had skipped too many classes.","options":["except","except for","because","because of"],"answer":2,"answerLabel":"C","source":"龍騰自命題","explanation":"because表示原因，後面接子句he had skipped too many classes","explanationSource":"source"}]};</script>
